# sonar-project.properties

# --- 必填參數 ---
# 專案識別碼 (Project Key)
sonar.projectKey=TSRDERP
# 伺服器 URL
sonar.host.url=http://127.0.0.1:9000
# 掃描 Token (不建議直接寫入檔案，但這是最快解決問題的方法)
sonar.token=sqp_f12453b7a554d5d8523c0db49abc13f2983357da

# --- TypeScript/Angular 專案推薦的額外設定 ---
# 要掃描的程式碼目錄
sonar.sources=src
# 要排除的目錄（避免掃描 node_modules 等）
sonar.exclusions=**/node_modules/**, **/*.spec.ts, **/*.test.ts
# 專案名稱 (顯示在 SonarQube 儀表板上)
sonar.projectName=TSRDERP_Frontend_Angular

sonar.sourceEncoding=UTF-8
