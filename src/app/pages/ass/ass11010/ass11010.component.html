<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="大分類代碼/名稱"
                        controlName="CLASS_ID"
                        [options]="bigClassOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().CLASS_ID"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()"
                      [dataKey]="'CLASS_ID'"
                      [tableKey]="'ASS11010_Data'"
                      [columns]="columns"
                      [totalRecords]="totalRecords()"
                      [loading]="tableLoading()"
                      [lastQueryBody]="lastQueryBody"
                      [queryFunction]="queryFunction"
                      [showDelete]="false"
                      (edit)="onEdit($event)"
                      (detail)="onDetail($event)"></app-table-report>
  </div>
</div>
