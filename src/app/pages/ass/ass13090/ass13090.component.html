<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
    <div >
      <app-button btnType="create" label="攤提設定" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="攤提代號"
              controlName="shareCode"
              [control]="queryForm.controls.shareCode"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="itemCode"
              [options]="itemCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.itemCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="購入日期"
              [startControl]="queryForm.controls.purchaseDateFrom"
              [endControl]="queryForm.controls.purchaseDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產狀態"
              controlName="assetStatus"
              [options]="assetsStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetStatus"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產類型"
              controlName="assetType"
              [options]="assetTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetType"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代號"
              controlName="accountingCode"
              [options]="accountingCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountingCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="購入金額"
              [startControl]="queryForm.controls.purchaseAmountFrom"
              [endControl]="queryForm.controls.purchaseAmountTo"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="採購單號"
              controlName="purchaseNumber"
              [options]="orderNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.purchaseNumber"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <app-radiobutton
            label="條件篩選"
            groupname="filter"
            [control]="queryForm.controls.filter"
            [options]="filterOptions"
            [submitted]="submitted"
          ></app-radiobutton>
        </div>
        <hr />
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
