<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="col-fixed">
      <app-button
        btnType="create"
        label="攤提設定"
        [loading]="loading"
        (clickEvent)="onAmortizationSettingClick(queryForm)"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="攤提代號"
              controlName="amortCode"
              [control]="queryForm.controls.amortCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="itemCode"
              [options]="itemCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.itemCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="購入日期"
              descLabel="(起訖)"
              [startControl]="queryForm.controls.inputDateFrom"
              [endControl]="queryForm.controls.inputDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="資產狀態"
              controlName="assetStatus"
              [options]="assetStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="資產類型"
              controlName="assetType"
              [options]="assetTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代號"
              controlName="accountCode"
              [options]="accountCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <app-input-number-range
            class="col-12 md:col-6 lg:col-4"
            label="購入金額"
            [startControl]="queryForm.controls.inputAmountFrom"
            [endControl]="queryForm.controls.inputAmountTo"
            [submitted]="submitted"
          ></app-input-number-range>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="採購單號"
              controlName="purchaseNo"
              [options]="purchaseNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.purchaseNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="攤提年月"
              controlName="amortYearMonth"
              [control]="queryForm.controls.amortYearMonth"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <app-radiobutton
            label="條件篩選"
            groupname="conditionFilter"
            [control]="queryForm.controls.conditionFilter"
            [options]="conditionFilterOptions"
            [submitted]="submitted"
          ></app-radiobutton>
        </div>
        <hr />
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" [form]="queryForm"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <div *ngIf="isUnamortizedResultLayout && data.length" class="mb-2">
      <app-button
        btnType="default"
        label="攤提"
        [disabled]="
          !selectedRows.length || selectedRows.length >= 1000 || tableLoading()
        "
        (clickEvent)="onBatchAmortize()"
      ></app-button>
    </div>
    <app-table-report
      tableKey="ASS13090_Data"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      dataKey="ASSET_ID"
      [loading]="tableLoading()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryASS13090ForReport"
      [lazy]="true"
      [showDelete]="false"
      [showEdit]="false"
      [showCheckBox]="isUnamortizedResultLayout"
      [selectedItems]="selectedRows"
      (selectionChange)="onSelectionChange($event)"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="匯出 PDF"
            icon="pi pi-file-pdf"
            (click)="onExportPdf()"
            [disabled]="
              tableLoading() ||
              exportPdfLoading ||
              exportExcelLoading ||
              data.length === 0
            "
            [loading]="exportPdfLoading"
          ></p-button>
          <p-button
            label="匯出 XLSX"
            icon="pi pi-file-excel"
            (click)="onExportExcel()"
            [disabled]="
              tableLoading() ||
              exportExcelLoading ||
              exportPdfLoading ||
              data.length === 0
            "
            [loading]="exportExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
