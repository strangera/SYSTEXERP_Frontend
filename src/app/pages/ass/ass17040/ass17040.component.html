<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="統計日期" [startControl]="queryForm.controls.Sdate"
              [endControl]="queryForm.controls.Edate" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代號" controlName="OrgID" [options]="orgOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OrgID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼" controlName="bigCategoryCode" [options]="bigCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.bigCategoryCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼" controlName="midCategoryCode" [options]="midCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.midCategoryCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼" controlName="smallCategoryCode" [options]="smallCategoryOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.smallCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編碼" controlName="GoodsID" [options]="goodsOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.GoodsID" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-ass17020-table-report [data]="data" [columns]="columns" outerGroupHeader="單位領用數量"
      [columnGroup]="columnGroup.length ? columnGroup : undefined" [totalRecords]="totalRecords"
      [footerData]="summaryFooter" footerLabel="小計" [loading]="loading" dataKey="__rowUid" tableKey="ASS17040_Data"
      [showReorder]="false" [showCheckBox]="false" [showEdit]="false" [showDetail]="false" [showDelete]="false"
      [queryFunction]="queryFunction" [showManage]="false" [lastQueryBody]="lastQueryBody" [showReportMode]="false">
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="領用退料統計表.PDF"
            icon="pi pi-file-pdf"
            (click)="onExportPdf()"
            [disabled]="loading || exportPdfLoading || data.length === 0"
            [loading]="exportPdfLoading"
          ></p-button>
          <p-button
            label="領用退料統計表.XLSX"
            icon="pi pi-file-excel"
            (click)="onExportExcel()"
            [disabled]="loading || exportExcelLoading || data.length === 0"
            [loading]="exportExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-ass17020-table-report>
  </div>
</div>
