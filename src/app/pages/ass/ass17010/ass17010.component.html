<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="資料顯示"
              groupname="displayType"
              [control]="qf().displayType"
              [options]="displayTypeOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="統計日期"
              [startControl]="qf().startDate"
              [endControl]="qf().endDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門代號"
              controlName="orgId"
              [options]="orgOptions"
              optionLabel="label"
              optionValue="value"
              [control]="qf().orgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類代碼"
              controlName="bClassId"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="qf().bClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類代碼"
              controlName="mClassId"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="qf().mClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類代碼"
              controlName="sClassId"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="qf().sClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編碼"
              controlName="goodsId"
              [options]="goodsOptions"
              optionLabel="label"
              optionValue="value"
              [control]="qf().goodsId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [form]="queryForm"
            (clickEvent)="onClearForm()"
          ></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="tableData()"
      dataKey="_pk"
      tableKey="ASS17010_Data"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [loading]="tableLoading()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [showCheckBox]="false"
      [showEdit]="false"
      [showDetail]="false"
      [showDelete]="false"
      [showManage]="false"
      [showReorder]="false"
      (dataChange)="tableData.set($event)"
    ></app-table-report>
  </div>
</div>
