<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="申請人代號"
          controlName="applicantCode"
          [options]="applicantCodeOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.applicantCode"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="部門代號"
          controlName="departmentCode"
          [options]="departmentCodeOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.departmentCode"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="申請日期"
          [control]="dataForm.controls.applicationDate"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="建議需求日(天)"
          controlName="illustrate"
          [control]="dataForm.controls.illustrate"
          [submitted]="submitted"
        ></app-input-text>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="倉別"
          controlName="inventoryNo"
          [options]="inventoryNoOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.inventoryNo"
          [submitted]="submitted"
        ></app-dropdown>
        <app-table-edit
          tableKey="ASS16030Detail"
          class="col-12"
          [data]="data"
          [columns]="columns"
          [showCheckBox]="true"
          (delete)="onDelete($event)"
          (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows"
          [showCheckBox]="!isFormReadable"
          (dataChange)="data = $event"
          [disabled]="isFormReadable"
          [tableRequired]="true"
        ></app-table-edit>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="resetTable()"
        ></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
