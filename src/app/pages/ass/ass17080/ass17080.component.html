<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="資料顯示"
              [control]="displayFilterCtrl"
              [options]="displayFilterOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="倉別"
              controlName="whId"
              [options]="warehouseOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="庫存日期"
              controlName="stockDate"
              [control]="queryForm.controls.stockDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類編號"
              controlName="bClassId"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類編號"
              controlName="mClassId"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.mClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類編號"
              controlName="sClassId"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.sClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="goodsId"
              [options]="goodsOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.goodsId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (clickEvent)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (clickEvent)="onSubmitQuery(queryForm)"
            [loading]="tableLoading()"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS17080_Data"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      dataKey="ID"
      [ItemSize]="24.44"
      [loading]="tableLoading()"
      [lazy]="true"
      [showManage]="false"
      [showDelete]="false"
      [footerData]="footerData"
      [footerLabelField]="'label'"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryASS17080ForReport"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="報廢明細表.XLSX"
            icon="pi pi-file-excel"
            (click)="onExportExcel()"
            [disabled]="
              tableLoading() || exportExcelLoading || data.length === 0
            "
            [loading]="exportExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
