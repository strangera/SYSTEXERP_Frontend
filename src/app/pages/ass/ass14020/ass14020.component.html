<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="關帳" icon="pi pi-lock" [permissionCode]="Actions.CloseCase"
      [disabled]="selectedItems.length === 0" [loading]="loading" (click)="onClose(queryForm)"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="關帳日期" controlName="CloseDate"
              [control]="queryForm.controls.CloseDate" [submitted]="submitted"></app-calendar>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="ass14020" dataKey="ID" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [showCheckBox]="true" [showDelete]="false" [showReportMode]="false" [showDetail]="false" [showEdit]="false"
    [showManage]="false" [loading]="loading" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event">
  </app-table-report>
</div>
