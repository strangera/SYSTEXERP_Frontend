<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="發票/收據號碼"
              controlName="INV_GUINo"
              [control]="queryForm.controls.INV_GUINo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="供應商編號"
              controlName="supplierId"
              [options]="supplierId_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.supplierId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="請款單據種類"
              controlName="invoice_type"
              [options]="invoice_type_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.invoice_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="驗收單號"
              controlName="ODM_No"
              [options]="ODM_No_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.ODM_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="發票維護單號"
              controlName="maintenanceID"
              [control]="queryForm.controls.maintenanceID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="發票格式"
              controlName="INV_GUIType"
              [options]="INV_GUIType_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.INV_GUIType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="課稅別"
              controlName="PUR_TaxType"
              [options]="PUR_TaxType_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.PUR_TaxType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="扣抵別"
              controlName="PUR_DedType"
              [options]="PUR_DedType_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.PUR_DedType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="發票/收據日期"
            [startControl]="queryForm.controls.PUR_GUIDate_From"
            [endControl]="queryForm.controls.PUR_GUIDate_To"
            [submitted]="submitted"
          ></app-calendar-range-quick>
        </div>

        <!-- <div> -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="ASS14010"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'HOS_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
      [isRowSelectable]="isRowSelectable"
    ></app-table>
  </div>
</div>
