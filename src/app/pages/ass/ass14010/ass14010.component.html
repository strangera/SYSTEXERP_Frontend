<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div >
      <app-button
        btnType="create"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="發票/收據號碼"
              controlName="invoiceNumber"
              [control]="queryForm.controls.invoiceNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="供應商編號"
              controlName="supplierCode"
              [options]="supplierCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.supplierCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="請款單據種類"
              controlName="requestType"
              [options]="requestTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.requestType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="驗收單號"
              controlName="orderNumber"
              [control]="queryForm.controls.orderNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="發票維護單號"
              controlName="maintenanceNumber"
              [control]="queryForm.controls.maintenanceNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="發票格式"
              controlName="invoiceFormat"
              [options]="invoiceFormatOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.invoiceFormat"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="課稅別"
              controlName="taxType"
              [options]="taxTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.taxType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="扣抵別"
              controlName="deductionsType"
              [options]="deductionsTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.deductionsType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
