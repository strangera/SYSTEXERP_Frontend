<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      [header]="'query-conditions' | translate"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="統計日期"
            [startControl]="queryForm.controls.DATE_S"
            [endControl]="queryForm.controls.DATE_E"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="倉別"
            controlName="WH_ID"
            [options]="warehouseOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.WH_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="品項編號"
            controlName="GOODS_ID"
            [options]="goodsIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.GOODS_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS17100_Data"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      dataKey="ROW_UID"
      [loading]="loading"
      [lazy]="false"
      [showManage]="false"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="匯出報表"
            icon="pi pi-file-pdf"
            (click)="onExportPdf()"
            [disabled]="loading || exportLoading || data.length === 0"
            [loading]="exportLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
