<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="商品報廢單編號"
              controlName="scrapCode"
              [control]="queryForm.controls.scrapCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="商品管理編號"
              controlName="manageCode"
              [options]="manageCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.manageCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="報廢人員編號"
              controlName="userCode"
              [options]="userCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.userCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="報廢申請日期"
              [startControl]="queryForm.controls.scrapDateFrom"
              [endControl]="queryForm.controls.scrapDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門代號"
              controlName="departmentCode"
              [options]="departmentCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.departmentCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="商品報廢單狀態"
              controlName="scrapStatus"
              [options]="scrapStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.scrapStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    [dataKey]="dataKey"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable"
    [addButton]="addButton"
    [buttonsLoading]="btnLoading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (delete)="onDelete($event)"
    (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出 PDF"
          icon="pi pi-file-pdf"
          [loading]="btnPDFLoading"
          (click)="onExportPDF()"
          [disabled]="selectedRows.length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
