<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="建檔日期" controlName="buildDate"
            [control]="df().buildDate" [disabled]="isFormReadable" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="接洽人員" controlName="receptionPerson" [control]="df().receptionPerson"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商統一編號" controlName="vendorUID" [control]="df().vendorUID"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="營運模式" groupname="bussinessModel" [control]="df().bussinessModel"
            [options]="bussinessOptions" [submitted]="submitted" [disabled]="isFormReadable"></app-radiobutton>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商名稱(中文)/簡稱" controlName="vendorCName" [control]="df().vendorCName"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商名稱(英文)/簡稱" controlName="vendorEName" [control]="df().vendorEName"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人" controlName="contactPerson" [control]="df().contactPerson"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人電話(O)" controlName="contactPhone" [control]="df().contactPhone"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人職稱" controlName="contactTitle" [control]="df().contactTitle"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人傳真" controlName="contactFax" [control]="df().contactFax"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人行動電話" controlName="contactCellphone" [control]="df().contactCellphone"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人電子郵件" controlName="contactEmail" [control]="df().contactEmail"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司地址" controlName="companyAddress" [control]="df().companyAddress"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司負責人" controlName="companyResponsibility" [control]="df().companyResponsibility"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="付款方式" groupname="paymentMethod" [control]="df().paymentMethod"
            [options]="paymentMethodOptions" [submitted]="submitted" [disabled]="isFormReadable"></app-radiobutton>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text-range label="票期" startControlName="ticketPeriodStart" endControlName="ticketPeriodEnd"
            [startControl]="df().ticketPeriodStart" [endControl]="df().ticketPeriodEnd"
            [submitted]="submitted"></app-input-text-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="服務項目" controlName="services" [control]="df().services"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="remark" [control]="df().remark"
            [disabled]="isFormReadable" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      @if (!isFormReadable) {
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
