<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      [header]="'query-conditions' | translate"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit()"
      >
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="倉別"
            controlName="whId"
            [options]="warehouseOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().whId"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="退回狀態"
            controlName="returnStatus"
            [options]="returnStatusOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().returnStatus"
            [submitted]="submitted"
          ></app-dropdown>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="退回單號"
            controlName="returnNo"
            [control]="qf().returnNo"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="退回人代號"
            controlName="returnEmpId"
            [options]="returnEmpOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().returnEmpId"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="部門代號"
            controlName="orgId"
            [options]="orgOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().orgId"
            [submitted]="submitted"
          ></app-dropdown>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="退回日期"
            [startControl]="qf().returnDateFrom"
            [endControl]="qf().returnDateTo"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS16060"
      [data]="tableData()"
      [dataKey]="'MTRETURN_ID'"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [loading]="tableLoading()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [showManage]="true"
      [showEdit]="true"
      [editDisabled]="editDisabled"
      [showDetail]="true"
      [showDelete]="false"
      [showCheckBox]="false"
      [lazy]="true"
      (edit)="onTableEdit($event)"
      (detail)="onTableDetail($event)"
    >
    </app-table-report>
  </div>
</div>
