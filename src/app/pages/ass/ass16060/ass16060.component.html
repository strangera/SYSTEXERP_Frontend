<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="倉別"
              controlName="warehouse"
              [options]="warehouse"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.warehouse"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="退回狀態"
              controlName="returnStatus"
              [options]="returnStatus"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.returnStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="退回單號"
              controlName="returnNote"
              [control]="queryForm.controls.returnNote"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="退回人代號"
              controlName="returnerCode"
              [options]="usercode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.returnerCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門代號"
              controlName="departmentCode"
              [options]="departmentCode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.departmentCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="退回日期"
              [startControl]="queryForm.controls.SReturnDate"
              [endControl]="queryForm.controls.EReturnDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
      </form>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="clear" [form]="queryForm"></app-button>
        <app-button
          btnType="query"
          [loading]="loading"
          (click)="onSubmit(queryForm)"
        ></app-button>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
