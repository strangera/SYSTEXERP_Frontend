<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="資產代號" controlName="assetsCode"
                        [control]="dataForm.controls.assetsCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="品項編號" controlName="itemCode" [options]="itemCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.itemCode" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產狀態" controlName="assetStatus" [options]="assetsStatusOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.assetStatus"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產類型" controlName="assetType" [options]="assetTypeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.assetType" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <hr>
            <h5>採購資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="採購單號" controlName="purchaseNumber" [options]="orderNumberOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.purchaseNumber"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="原購入金額" controlName="purchaseAmount"
                        [control]="dataForm.controls.purchaseAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="異動金額" controlName="alteredAmount"
                        [control]="dataForm.controls.alteredAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="購入日期" controlName="purchaseDate"
                        [control]="dataForm.controls.purchaseDate" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="入帳日期" controlName="entryDate"
                        [control]="dataForm.controls.entryDate" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="攤提起始日" controlName="amortizedDate"
                        [control]="dataForm.controls.amortizedDate" [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="會計科目(借)" controlName="accounting_Borrow" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.accounting_Borrow"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="會計科目(貸)" controlName="accounting_Credit" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.accounting_Credit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="供應商編號" controlName="supplierCode" [options]="supplierCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.supplierCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <h5>折舊資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="折舊會計科目" controlName="depreciation" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.depreciation"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="累計折舊科目" controlName="totalDepreciation" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.totalDepreciation"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="原折舊年限" controlName="depreciationLife"
                        [control]="dataForm.controls.depreciationLife" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="異動年限" controlName="alteredLife" [control]="dataForm.controls.alteredLife"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="原折舊年限(月)" controlName="depreciationLifeMM"
                        [control]="dataForm.controls.depreciationLifeMM" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="預留殘值" controlName="residual" [control]="dataForm.controls.residual"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已攤提金額" controlName="amortizedAmount"
                        [control]="dataForm.controls.amortizedAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已攤提月數" controlName="amortizedMonth"
                        [control]="dataForm.controls.amortizedMonth" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <hr>
            <h5>保管資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="保管人" controlName="keepingPerson" [options]="applicantCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.keepingPerson"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="保管單位" controlName="keepingUnit" [options]="supplierCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.keepingUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="使用人" controlName="user" [options]="applicantCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.user" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="使用單位" controlName="userUnit" [options]="supplierCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.userUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="位置編號" controlName="locationCode" [options]="locationCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.locationCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <hr>
            <h5>續提資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="續提號" controlName="renewalNumber"
                        [control]="dataForm.controls.renewalNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="續提攤入金額" controlName="renewalAmount"
                        [control]="dataForm.controls.renewalAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <app-editor-text label="續提註記" controlName="remark" [control]="dataForm.controls.remark"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr />

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
