<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (clickEvent)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="資產編號"
          controlName="assetsCode"
          [control]="dataForm.controls.assetsCode"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="品名編號／名稱"
          controlName="itemCode"
          [control]="dataForm.controls.itemCode"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="資產狀態"
          controlName="assetStatus"
          [control]="dataForm.controls.assetStatus"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="資產類型"
          controlName="assetType"
          [control]="dataForm.controls.assetType"
          [submitted]="submitted"
        ></app-input-text>
      </div>

      <hr />
      <h5 class="mt-0 mb-2">採購資訊</h5>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="採購單號"
          controlName="purchaseNumber"
          [control]="dataForm.controls.purchaseNumber"
          [submitted]="submitted"
        ></app-input-text>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="購入日期"
          controlName="purchaseDate"
          [control]="dataForm.controls.purchaseDate"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="原購入金額"
          controlName="purchaseAmount"
          [control]="dataForm.controls.purchaseAmount"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="異動金額"
          controlName="alteredAmount"
          [control]="dataForm.controls.alteredAmount"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="供應商代號"
          controlName="supplierCode"
          [control]="dataForm.controls.supplierCode"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="會計科目(借)"
          controlName="accounting_Borrow"
          [control]="dataForm.controls.accounting_Borrow"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="會計科目(貸)"
          controlName="accounting_Credit"
          [control]="dataForm.controls.accounting_Credit"
          [submitted]="submitted"
        ></app-input-text>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="入帳日期"
          controlName="entryDate"
          [control]="dataForm.controls.entryDate"
          [submitted]="submitted"
        ></app-calendar>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateMonthOne"
          label="攤提起始日"
          controlName="amortizedDate"
          [control]="dataForm.controls.amortizedDate"
          [submitted]="submitted"
        ></app-calendar>
      </div>

      <hr />
      <h5 class="mt-0 mb-2">折舊資訊</h5>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="折舊會計科目"
          controlName="depreciation"
          [control]="dataForm.controls.depreciation"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="累計折舊科目"
          controlName="totalDepreciation"
          [control]="dataForm.controls.totalDepreciation"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          [useGrouping]="false"
          label="原折舊年限"
          controlName="depreciationLife"
          [control]="dataForm.controls.depreciationLife"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          [useGrouping]="false"
          label="異動年限"
          controlName="alteredLife"
          [control]="dataForm.controls.alteredLife"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="原折舊年限(月)"
          controlName="depreciationLifeMM"
          [control]="dataForm.controls.depreciationLifeMM"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="預留殘值"
          controlName="residual"
          [control]="dataForm.controls.residual"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="已攤提金額"
          controlName="amortizedAmount"
          [control]="dataForm.controls.amortizedAmount"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="已攤提月數"
          controlName="amortizedMonth"
          [control]="dataForm.controls.amortizedMonth"
          [submitted]="submitted"
        ></app-input-number>
      </div>

      <hr />
      <h5 class="mt-0 mb-2">保管資訊</h5>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="保管人"
          controlName="keepingPerson"
          [control]="dataForm.controls.keepingPerson"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="保管單位"
          controlName="keepingUnit"
          [control]="dataForm.controls.keepingUnit"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="使用人"
          controlName="user"
          [control]="dataForm.controls.user"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="使用單位"
          controlName="userUnit"
          [control]="dataForm.controls.userUnit"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="位置代號"
          controlName="locationCode"
          [control]="dataForm.controls.locationCode"
          [submitted]="submitted"
        ></app-input-text>
      </div>

      <hr />
      <h5 class="mt-0 mb-2">攤提資訊</h5>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="續提號"
          controlName="renewalNumber"
          [control]="dataForm.controls.renewalNumber"
          [submitted]="submitted"
        ></app-input-text>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="續提攤入金額"
          controlName="renewalAmount"
          [control]="dataForm.controls.renewalAmount"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-textarea
          class="col-12"
          label="攤提註記"
          controlName="remark"
          [control]="dataForm.controls.remark"
          [rows]="6"
          styleClass="h-8rem"
          [submitted]="submitted"
        ></app-input-textarea>
      </div>

      <div class="border-top-1 surface-border pt-3 mt-2 px-2 pb-2">
        <h5 class="mt-0 mb-2">攤提紀錄</h5>
        <app-table-report
          tableKey="ASS13090CRU_AmortRecord"
          [data]="amortRecordData"
          [columns]="amortRecordColumns"
          [totalRecords]="amortRecordTotal"
          dataKey="RowNo"
          [loading]="amortRecordTableLoading()"
          [lazy]="false"
          [showSummary]="false"
          [showManage]="false"
          [showCaption]="false"
          [showSort]="false"
        ></app-table-report>
      </div>

      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button
          btnType="submit"
        ></app-button>
      </div>
    </form>
  </p-panel>
</div>
