<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產編號" controlName="assetsCode" [options]="assetsCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.assetsCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="品項編號／名稱" controlName="itemCode"
                        [control]="dataForm.controls.itemCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產狀態" controlName="assetStatus" [options]="assetsStatusOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.assetStatus"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產類型" controlName="assetType" [options]="assetTypeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.assetType" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="攤提代號" controlName="shareCode" [options]="shareCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.shareCode" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <hr>
            <h5>採購資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="採購單號" controlName="orderNumber" [options]="orderNumberOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.orderNumber"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="購入日期" controlName="purchaseDate"
                        [control]="dataForm.controls.purchaseDate" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="購入金額" controlName="purchaseAmount"
                        [control]="dataForm.controls.purchaseAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="異動金額" controlName="alteredAmount" [options]="alteredAmountOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.alteredAmount"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="供應商編號" controlName="supplierCode" [options]="supplierCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.supplierCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="設備編號" controlName="deviceCode"
                        [control]="dataForm.controls.deviceCode" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="會計科目(借)" controlName="accountingCode_Borrow" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.accountingCode_Borrow"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="會計科目(貸)" controlName="accountingCode_loan" [options]="accountingCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.accountingCode_loan"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="入帳日期" controlName="entryDate"
                        [control]="dataForm.controls.entryDate" [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>
            <hr>
            <h5>折舊資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="折舊會計科目" controlName="accountingCode_Depreciation"
                        [options]="accountingCodeOptions" optionLabel="label" optionValue="value"
                        [control]="dataForm.controls.accountingCode_Depreciation" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="累計折舊科目" controlName="accountingCode_totalDepreciation"
                        [options]="accountingCodeOptions" optionLabel="label" optionValue="value"
                        [control]="dataForm.controls.accountingCode_totalDepreciation" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="折舊年限" controlName="depreciationLife"
                        [control]="dataForm.controls.depreciationLife" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="異動年限" controlName="alteredLife" [control]="dataForm.controls.alteredLife"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="預留殘值" controlName="reservedAmount"
                        [control]="dataForm.controls.reservedAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="折舊到期" controlName="depreciationDue"
                        [control]="dataForm.controls.depreciationDue" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="未攤提金額" controlName="nonsSreadAmount"
                        [control]="dataForm.controls.nonsSreadAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已攤提金額" controlName="spreadAmount"
                        [control]="dataForm.controls.spreadAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已攤提月數" controlName="spreadMonth" [control]="dataForm.controls.spreadMonth"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <hr>
            <h5>保管資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="保管人" controlName="keeper" [options]="userCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.keeper" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="保管單位" controlName="keeperUnit" [options]="organizationOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.keeperUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="使用人" controlName="user" [options]="userCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.user" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="使用單位" controlName="userUnit" [options]="organizationOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.userUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="位置編號" controlName="loactionNumber"
                        [control]="dataForm.controls.loactionNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="維修合約編號" controlName="maintenanceCode"
                        [control]="dataForm.controls.maintenanceCode" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <hr>
            <h5>處分資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="變賣日期" controlName="scrapDate"
                        [control]="dataForm.controls.scrapDate" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="變賣廠商" controlName="scrapManufacturers" [options]="organizationOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.scrapManufacturers"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="入帳傳票編號" controlName="entryVoucherNumber"
                        [control]="dataForm.controls.entryVoucherNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="變賣金額(含稅)" controlName="soldAmount" [control]="dataForm.controls.soldAmount"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <hr>
            <app-editor-text label="變賣說明" controlName="voucherRemark" [control]="dataForm.controls.voucherRemark"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <app-editor-text label="資產註記" controlName="assetsRemark" [control]="dataForm.controls.assetsRemark"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr>

                        </div>
                    </div>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                
            </div> -->
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
