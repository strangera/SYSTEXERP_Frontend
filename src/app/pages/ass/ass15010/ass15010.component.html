<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
    <div>
      <app-button btnType="create" label="產生標籤" class="col"></app-button>
    </div>
    <div>
      <app-button btnType="create" label="產生標籤表" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="財產類型" controlName="propertyType" [options]="propertyTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.propertyType" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編號" controlName="itemCode" [options]="itemCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.itemCode" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類編號" controlName="bigCategoryCode" [options]="bigCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.bigCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類編號" controlName="midCategoryCode" [options]="midCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.midCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類編號" controlName="smlCategoryCode" [options]="midCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.smlCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保管人" controlName="keeper" [options]="userCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.keeper" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保管單位" controlName="keeperUnit" [options]="organizationOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.keeperUnit" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="財產編號"
              [startControl]="queryForm.controls.propertyTypeFrom" [endControl]="queryForm.controls.propertyTypeTo"
              [submitted]="submitted"></app-input-number-range>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
