<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="盤點單號"
              controlName="INV_ID"
              [options]="INV_ID_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.INV_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="data"
      [columns]="columns"
      [addButton]="addButton"
      [loading]="exportPdfLoading"
      [totalRecords]="totalRecords()"
      [showDelete]="false"
      [showEdit]="false"
      [detailDisabled]="isDetailDisabled"
      (detail)="onDetail($event)"
    ></app-table-report>
  </div>
</div>
