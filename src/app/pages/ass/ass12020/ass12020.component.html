<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編號" controlName="itemCode" [options]="itemCodeOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.itemCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="供應商編號" controlName="supplierCode" [options]="supplierCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.supplierCode" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="品項進價" [startControl]="queryForm.controls.goodsPriceFrom"
              [endControl]="queryForm.controls.goodsPriceTo" [submitted]="submitted"
              [useGrouping]="false"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="品項單價" [startControl]="queryForm.controls.salePriceFrom"
              [endControl]="queryForm.controls.salePriceTo" [submitted]="submitted"
              [useGrouping]="false"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項單位" controlName="itemUnit" [options]="itemUnitOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.itemUnit" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="報價期限" [startControl]="queryForm.controls.expDateFrom"
              [endControl]="queryForm.controls.expDateTo" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="登錄批號" controlName="batchId" [control]="queryForm.controls.batchId"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="FAQuotationM_ID" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [loading]="loading" [lastQueryBody]="lastQueryBody" [queryFunction]="queryFunction" [addButton]="addButton"
    [showCheckBox]="true" (edit)="onEdit($event)" (detail)="onDetail($event)" (delete)="onDelete($event)"
    (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows"></app-table-report>
</div>
