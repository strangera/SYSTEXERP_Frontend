<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 領用單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="領用單號" controlName="MTAPPLY_ID" [control]="queryForm.controls.MTAPPLY_ID"
              [submitted]="submitted"></app-input-text>
          </div>

          <!-- 申請人代號/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人代號/名稱" controlName="EMP_ID" [options]="empIdOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.EMP_ID" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 品項編號/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編號/名稱" controlName="FASITEM_ID" [options]="fasItemOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.FASITEM_ID" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 部門代號/名稱（同列最左） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代號/名稱" controlName="ORG_ID" [options]="orgIdOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ORG_ID" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 申請日期（起訖） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="申請日期" [startControl]="queryForm.controls.APPLY_DATE_S"
              [endControl]="queryForm.controls.APPLY_DATE_E" [submitted]="submitted"></app-calendar-range>
          </div>

          <!-- 審核日期（起訖） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="審核日期" [startControl]="queryForm.controls.APRV_DATE_S"
              [endControl]="queryForm.controls.APRV_DATE_E" [submitted]="submitted"></app-calendar-range>
          </div>

          <!-- 發料日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="發料日期" controlName="CHECK_DATE"
              [control]="queryForm.controls.CHECK_DATE" [submitted]="submitted"></app-calendar>
          </div>

          <!-- 審核者代號/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="審核者代號/名稱" controlName="APRV_EMP_ID" [options]="aprvEmpIdOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.APRV_EMP_ID" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 倉別代號/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別代號/名稱" controlName="WH_ID" [options]="whIdOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.WH_ID" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 領用單狀態代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="領用單狀態代碼/名稱" controlName="STATUS" [options]="statusOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.STATUS" [submitted]="submitted"></app-dropdown>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
  tableKey="ASS16040"
  [data]="tableData()"
  [columns]="columns"
  [totalRecords]="totalRecords()"
  [loading]="tableLoading()"
  [lastQueryBody]="lastQueryBody"
  [queryFunction]="queryFunction"

  [showEdit]="true"
  [editDisabled]="editDisabled"

  [showDetail]="false"
  [showDelete]="false"
  [showCheckBox]="false"

  [exportContext]="{
    apiUrl: 'queryASS16040',
    conditions: lastQueryBody ?? {}
  }"

  (edit)="onEdit($event)"
></app-table-report>
  </div>
</div>
