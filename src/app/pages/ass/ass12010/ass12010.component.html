<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="倉別" controlName="storage" [options]="storageOptions" optionLabel="label"
                            optionValue="value" [control]="queryForm.controls.storage" [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="需求單號" controlName="demandNumber"
                            [control]="queryForm.controls.demandNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="品項代碼" controlName="itemCode" [options]="itemCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.itemCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="申請人代號" controlName="applicantCode" [options]="applicantCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.applicantCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="部門代號" controlName=" organizationNumber"
                            [options]="organizationNumberOptions" optionLabel="label" optionValue="value"
                            [control]="queryForm.controls.organizationNumber" [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="需求日期"
                            [startControl]="queryForm.controls.requestDateFrom"
                            [endControl]="queryForm.controls.requestDateTo" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="請購申請狀態" controlName="requestStatus" [options]="requestStatusOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.requestStatus"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="新增筆數" controlName="addNumber"
                            [control]="queryForm.controls.addNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="修改筆數" controlName="modifyNumber"
                            [control]="queryForm.controls.modifyNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="項次列印筆數" controlName="printNumber"
                            [control]="queryForm.controls.printNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-table>
    </div>
</div>
