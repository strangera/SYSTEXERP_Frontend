<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="能源類型"
                            controlName="eng_type"
                            [options]="service.engTypeSignal()"
                            optionLabel="Name"
                            optionValue="No"
                            appendTo="body"
                            [control]="df().eng_type"
                            [loading]="service.engTypeLoading"
                            [submitted]="submitted"></app-multi-select>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="錶號"
                          controlName="eng_meterNo"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="df().eng_meterNo"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="設備位置編號"
                        controlName="location_no"
                        [options]="service.locationSignal()"
                        optionLabel="Name"
                        optionValue="No"
                        appendTo="body"
                        [control]="df().location_no"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="備註"
                              controlName="eng_remark"
                              [control]="df().eng_remark"
                              [submitted]="submitted" />
        </div>
