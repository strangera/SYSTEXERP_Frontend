<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="能源類型" controlName="ENGType" [showClear]="false"
          [options]="service.engTypeOptions" optionLabel="label" optionValue="value" [control]="df().ENG_Type"
          [disabled]="!isFormCreateable" [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="錶號" controlName="ENG_MeterNo"
          [control]="df().ENG_MeterNo" [disabled]="!isFormCreateable || service.engMeterNoLoading()"
          [fieldMeta]="{ required: true, minLength: 5, maxLength: 5 }" [submitted]="submitted"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="設備位置編號" controlName="Location_No" [showClear]="false"
          [options]="service.locationOptions()" optionLabel="LOCATION_Name" optionValue="LOCATION_No"
          [control]="df().Location_No" [loading]="service.locationLoading()" [submitted]="submitted"></app-dropdown>
        <app-input-textarea class="col-12 md:col-6 lg:col-4" label="備註" controlName="ENG_Remark"
          [control]="df().ENG_Remark" [submitted]="submitted" />
      </div>
      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>
