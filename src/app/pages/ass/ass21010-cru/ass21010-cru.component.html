<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="能源類型"
                        controlName="ENGType"
                        [showClear]="false"
                        [options]="service.engTypeSignal()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().ENGType"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="錶號"
                          controlName="ENG_MeterNo"
                          [control]="df().ENG_MeterNo"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="設備位置編號"
                        controlName="Location_No"
                        [showClear]="false"
                        [options]="service.locationSignal()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Location_No"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="備註"
                              controlName="ENG_Remark"
                              [control]="df().ENG_Remark"
                              [submitted]="submitted" />
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="clear"
                    (click)="onClear()"
                    *ngIf="!isFormReadable"></app-button>
        <app-button btnType="submit"
                    (click)="onSubmit()"
                    *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
