<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (isFormEditable) {
      <app-button
        btnType="default"
        icon="pi pi-check-circle"
        label="審核"
        [loading]="loading"
        (click)="onApprove()"
      ></app-button>
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle" class="line-height-3 m-0 mb-3">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="倉別"
          controlName="WH_ID"
          [options]="warehouseOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().WH_ID"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="退回人代號"
          controlName="RETURN_EMP_ID"
          [options]="returnEmpOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().RETURN_EMP_ID"
          [disabled]="!isCreateMode"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="部門代號"
          controlName="ORG_ID"
          [options]="orgOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().ORG_ID"
          [disabled]="!isCreateMode"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="申請日期"
          controlName="APPLY_DATE"
          [control]="df().APPLY_DATE"
          [disabled]="!isCreateMode"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-textarea
          class="col-12 md:col-6 lg:col-4"
          label="退回說明"
          controlName="REMARK"
          [control]="df().REMARK"
          [readonly]="isFormReadable"
          [submitted]="submitted"
        ></app-input-textarea>
      </div>

      <br />

      <app-table-edit
        tableKey="ASS16060Detail"
        [data]="tableData()"
        [columns]="editColumns"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        (insert)="onTableInsert()"
        (dataChange)="tableData.set($event)"
        [showCheckBox]="isCreateMode"
        [showDelete]="isCreateMode"
        [showInsert]="false"
        [disabled]="isFormReadable"
        [canInsert]="!isEditMode"
        [loading]="tableLoading()"
        [tableRequired]="false"
      ></app-table-edit>

      @if (!isFormReadable) {
        <div
          class="grid justify-content-end gap-2 m-0 mt-4 border-top-1 surface-border pt-3"
        >
          @if (isCreateMode) {
            <app-button
              btnType="cancel"
              [form]="dataForm"
              (clickEvent)="clearDetailTable()"
            ></app-button>
          }
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
