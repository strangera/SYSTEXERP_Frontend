<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代碼"
              controlName="accNo"
              [options]="accNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="orgId"
              [options]="orgIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.orgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="申請日期"
              [startControl]="queryForm.controls.appDateFrom"
              [endControl]="queryForm.controls.appDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="審核日期"
              [startControl]="queryForm.controls.chkDateFrom"
              [endControl]="queryForm.controls.chkDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類編號"
              controlName="bClassId"
              [options]="bClassOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類編號"
              controlName="mClassId"
              [options]="mClassOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.mClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類編號"
              controlName="sClassId"
              [options]="sClassOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.sClassId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="goodsId"
              [options]="goodsIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.goodsId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="基準日"
              [control]="queryForm.controls.baseDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
            <app-button btnType="clear" [form]="queryForm" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="tableData()"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [loading]="tableLoading()"
      dataKey="ID"
      tableKey="ASS15080_Data"
      [showCheckBox]="false"
      [showEdit]="false"
      [showDetail]="false"
      [showDelete]="false"
      [queryFunction]="queryFunction"
      [showManage]="false"
      [lastQueryBody]="lastQueryBody"
      (dataChange)="tableData.set($event)"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            styleClass="p-2"
            label="匯出 PDF"
            icon="pi pi-file-pdf"
            [loading]="btnPDFLoading"
            (click)="onExportPDF()"
            [disabled]="tableData().length === 0"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
