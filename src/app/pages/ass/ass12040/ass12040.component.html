<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="採購單號" controlName="SUBPOENA_ID"
            [control]="qf().SUBPOENA_ID" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="品項編號" controlName="GOODS_ID"
            [options]="goodsIdOptions()" optionLabel="label" optionValue="value" [control]="qf().GOODS_ID"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人編號" controlName="EMP_ID" [options]="empIdOptions()"
            optionLabel="label" optionValue="value" [control]="qf().EMP_ID" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="部門代號" controlName="ORG_ID" [options]="orgIdOptions()"
            optionLabel="label" optionValue="value" [control]="qf().ORG_ID" [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="申請日期" [startControl]="qf().APPLY_DATE_FROM"
            [endControl]="qf().APPLY_DATE_TO" [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="供應商編號" controlName="SUPPLIER_ID"
            [options]="supplierIdOptions()" optionLabel="label" optionValue="value" [control]="qf().SUPPLIER_ID"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="稅額"
            [startControl]="qf().TAX_AMT_FROM" [endControl]="qf().TAX_AMT_TO"
            [submitted]="submitted"></app-input-number-range>
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="未稅總金額"
            [startControl]="qf().NTAX_AMT_FROM" [endControl]="qf().NTAX_AMT_TO"
            [submitted]="submitted"></app-input-number-range>
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="含稅總金額"
            [startControl]="qf().AMT_FROM" [endControl]="qf().AMT_TO" [submitted]="submitted"></app-input-number-range>
        </div>
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="採購單狀態" controlName="SUBPOENA_STATUS"
            [options]="subpoenaStatusOptions()" optionLabel="label" optionValue="value" [control]="qf().SUBPOENA_STATUS"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="審核人編號" controlName="APRV_EMP_ID"
            [options]="reviewerOptions()" optionLabel="label" optionValue="value" [control]="qf().APRV_EMP_ID"
            [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="審核日期" [startControl]="qf().APRV_DATE_FROM"
            [endControl]="qf().APRV_DATE_TO" [submitted]="submitted"></app-calendar-range>
        </div>
        <div class="grid p-fluid">
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="結帳日期" [startControl]="qf().PAY_DATE_FROM"
            [endControl]="qf().PAY_DATE_TO" [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉別" controlName="WH_ID" [options]="whIdOptions()"
            optionLabel="label" optionValue="value" [control]="qf().WH_ID" [submitted]="submitted"></app-dropdown>
          <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="項次列印筆數" controlName="pageSize"
            [control]="qf().pageSize" [submitted]="submitted"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="SUBPOENA_ID" tableKey="ASS12040_Data" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showDelete]="false" [showReportMode]="false" [showSignature]="true" [showEdit]="false"
      [editDisabled]="editDisabled" [addButton]="addButton" (detail)="onDetail($event)"></app-table-report>
  </div>
</div>
