<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">

            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="新保管單位" controlName="keeperUnit" [options]="organizationOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.keeperUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="新保管人" controlName="keeper" [options]="userCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.keeper" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="移轉生效日" [control]="dataForm.controls.transferDate"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="新使用單位" controlName="userUnit" [options]="organizationOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.userUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="新使用人" controlName="user" [options]="userCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.user" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
