<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="create"
                  (click)="onCreate()"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="能源類型"
                              controlName="eng_type"
                              [options]="service.engTypeSignal()"
                              optionLabel="Name"
                              optionValue="No"
                              appendTo="body"
                              [control]="qf().eng_type"
                              [loading]="service.engTypeLoading"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="錶號"
                              controlName="eng_meterNo"
                              [options]="service.engMeterNoSignal()"
                              optionLabel="Name"
                              optionValue="No"
                              appendTo="body"
                              [control]="qf().eng_meterNo"
                              [loading]="service.engMeterNoLoading"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="設備位置編號"
                              controlName="location_no"
                              [options]="service.locationSignal()"
                              optionLabel="Name"
                              optionValue="No"
                              appendTo="body"
                              [control]="qf().location_no"
                              [loading]="service.locationLoading"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="備註"
                            controlName="eng_remark"
                            [control]="qf().eng_remark"
                            [disabled]="false"
                            [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
      </form>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear"
                    (click)="onClear()"></app-button>
        <app-button btnType="query"
                    (click)="onSubmitQuery()"
                    [loading]="loading"></app-button>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [data]="service.ASS21010Data()"
               [columns]="columns"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"></app-table>
  </div>
</div>
