<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4"
                            label="能源類型"
                            controlName="ENG_Type"
                            [options]="service.engTypeSignal()"
                            optionLabel="Name"
                            optionValue="No"
                            [control]="qf().ENG_Type"
                            [submitted]="submitted"></app-multi-select>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="錶號"
                        controlName="ENG_MeterNo"
                        [options]="service.engMeterNoSignal()"
                        optionLabel="ENG_MeterNo"
                        optionValue="ENG_MeterNo"
                        [control]="qf().ENG_MeterNo"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="設備位置編號"
                        controlName="Location_No"
                        [options]="service.locationSignal()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="qf().Location_No"
                        [submitted]="submitted"></app-dropdown>
          <app-input-textarea class="col-12 md:col-6 lg:col-4"
                              label="備註"
                              controlName="ENG_Remark"
                              [control]="qf().ENG_Remark"
                              [submitted]="submitted">
          </app-input-textarea>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="true"
               [data]="service.ASS21010Data()"
               [dataKey]="'ID'"
               [tableKey]="'ASS21010'"
               [apiUrl]="'/ASS0000/ASS2000/queryASS21010'"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
               [lazy]="true"
               [loading]="loading"
               (edit)="onEdit($event)"
               (delete)="onDelete($event)"
               (detail)="onDetail($event)"></app-table>
  </div>
</div>
