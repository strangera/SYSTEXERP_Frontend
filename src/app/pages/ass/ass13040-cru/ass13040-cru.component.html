<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (clickEvent)="onCancel()" [loading]="loading"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="報廢單編號" controlName="scrapCode" [control]="dataForm.controls.scrapCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="報廢人員編號" controlName="userCode" [options]="userCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.userCode" [submitted]="submitted"
            [disabled]="isFormReadable"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="部門代號" controlName="departmentCode" [options]="departmentCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.departmentCode" [submitted]="submitted"
            [disabled]="isFormReadable"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="報廢廠商" controlName="scrapVendor" [options]="scrapVendorOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.scrapVendor" [submitted]="submitted"
            [disabled]="isFormReadable"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" controlName="scrapDate" label="報廢申請日期"
            [control]="dataForm.controls.scrapDate" [submitted]="submitted" [disabled]="isFormReadable"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="資產類型" controlName="assetsType" [options]="assetsTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.assetsType" [submitted]="submitted"
            [disabled]="isFormReadable"></app-dropdown>
        </div>
        <div class="col-12">
          <app-input-textarea label="報廢案件說明" controlName="remark" [control]="dataForm.controls.remark"
            [submitted]="submitted" [readonly]="isFormReadable"></app-input-textarea>
        </div>
      </div>

      <hr />
      <h5>報廢商品</h5>
      <app-table-edit #detailTable class="col-12" tableKey="ASS13040Detail" [columns]="editColumns" [data]="data"
        (dataChange)="data = $event" (insert)="onTableInsert()" [tableRequired]="true" [disabled]="isFormReadable"
        [showInsert]="!isFormReadable" [showDelete]="!isFormReadable" [canInsert]="false"></app-table-edit>

      <hr />
      <div class="col-12 p-0">
        <label>報廢照片（最多 3 張）</label>
        <div class="grid">
          <div class="col-12 md:col-4">
            <p-fileUpload #fileUpload1 [multiple]="false" accept=".bmp,.jpg,.jpeg,.png" maxFileSize="100000000"
              mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable" chooseLabel="選擇檔案"
              (onSelect)="onSelectFile1($event)" [showCancelButton]="false">
              <ng-template pTemplate="content">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile1 && existingFile1" role="button" (click)="openGalleriaFromSlot(1)"
                      class="text-blue-600">
                      {{ existingFile1 }}
                    </a>
                    <span *ngIf="formFile1">{{ formFile1.name }}</span>
                    <span *ngIf="!formFile1 && !existingFile1">尚未選擇檔案</span>
                  </div>
                  <button *ngIf="formFile1 && !isFormReadable" type="button"
                    class="p-button p-button-text p-button-danger p-button-sm w-auto" (click)="removeFile1()">
                    <i class="pi pi-trash"></i>
                  </button>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>
          <div class="col-12 md:col-4">
            <p-fileUpload #fileUpload2 [multiple]="false" accept=".bmp,.jpg,.jpeg,.png" maxFileSize="100000000"
              mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable" chooseLabel="選擇檔案"
              (onSelect)="onSelectFile2($event)" [showCancelButton]="false">
              <ng-template pTemplate="content">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile2 && existingFile2" role="button" (click)="openGalleriaFromSlot(2)"
                      class="text-blue-600">
                      {{ existingFile2 }}
                    </a>
                    <span *ngIf="formFile2">{{ formFile2.name }}</span>
                    <span *ngIf="!formFile2 && !existingFile2">尚未選擇檔案</span>
                  </div>
                  <button *ngIf="formFile2 && !isFormReadable" type="button"
                    class="p-button p-button-text p-button-danger p-button-sm w-auto" (click)="removeFile2()">
                    <i class="pi pi-trash"></i>
                  </button>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>
          <div class="col-12 md:col-4">
            <p-fileUpload #fileUpload3 [multiple]="false" accept=".bmp,.jpg,.jpeg,.png" maxFileSize="100000000"
              mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable" chooseLabel="選擇檔案"
              (onSelect)="onSelectFile3($event)" [showCancelButton]="false">
              <ng-template pTemplate="content">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile3 && existingFile3" role="button" (click)="openGalleriaFromSlot(3)"
                      class="text-blue-600">
                      {{ existingFile3 }}
                    </a>
                    <span *ngIf="formFile3">{{ formFile3.name }}</span>
                    <span *ngIf="!formFile3 && !existingFile3">尚未選擇檔案</span>
                  </div>
                  <button *ngIf="formFile3 && !isFormReadable" type="button"
                    class="p-button p-button-text p-button-danger p-button-sm w-auto" (click)="removeFile3()">
                    <i class="pi pi-trash"></i>
                  </button>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>
        </div>
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<p-galleria [value]="galleriaItems" [(visible)]="visible" [containerStyle]="{ 'max-width': '850px' }"
  [circular]="true" [fullScreen]="true" [showThumbnails]="false" [autoPlay]="true"
  [(activeIndex)]="galleriaActiveIndex">
  <ng-template pTemplate="item" let-item>
    <img [src]="item.url" alt="Image" style="width: 100%; display: block;" />
  </ng-template>
</p-galleria>

<app-ass13040-asset-dialog [(visible)]="dialogVisible" [existingAssetNos]="existingAssetNos"
  (assetsSelected)="onAssetsSelected($event)"></app-ass13040-asset-dialog>
