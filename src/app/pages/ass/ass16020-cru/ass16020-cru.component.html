<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (clickEvent)="onCancel()"></app-button>
    <app-button
      btnType="default"
      label="結案"
      *ngIf="isEditMode"
      (clickEvent)="onClosed()"
    ></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form
      [formGroup]="dataForm"
      (ngSubmit)="onSubmit(dataForm)"
      *ngIf="!isReportMode"
    >
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="倉別"
            controlName="WH_ID"
            [control]="dataForm.controls.WH_ID"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="盤點單號"
            controlName="INV_ID"
            [control]="dataForm.controls.INV_ID"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range
            calendarType="dateRange"
            label="盤點日期"
            [startControl]="dataForm.controls.SInventoryDate"
            [endControl]="dataForm.controls.EInventoryDate"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="EMP_ID" class="block">
            初盤人員
            <span class="text-red-500">*</span>
          </label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="EMP_ORG_ID"
                [options]="EMP_ORG_ID()"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.EMP_ORG_ID"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="EMP_ID"
                [options]="EMP_ID()"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.EMP_ID"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="EMP_ID2" class="block">
            複盤人員
            <span class="text-red-500">*</span>
          </label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="EMP_ORG_ID2"
                [options]="EMP_ORG_ID2()"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.EMP_ORG_ID2"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="EMP_ID2"
                [options]="EMP_ID2()"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.EMP_ID2"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="說明"
            controlName="NOTES"
            [control]="dataForm.controls.NOTES"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <app-table-edit
          tableKey="ASS16020Detail"
          class="col-12"
          [data]="data"
          [columns]="columns"
          (dataChange)="data = $event"
          [tableRequired]="true"
          [showCheckBox]="false"
          [canInsert]="isEditMode || data.length === 0"
        ></app-table-edit>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button
          btnType="submit"
          label="儲存"
          [loading]="loading"
        ></app-button>
      </div>
    </form>

    <!-- 報表模式 -->
    <div *ngIf="isReportMode && !isEditMode">
      <div class="flex gap-2 mb-2">
        <app-input-text
          label="盤點單號"
          controlName="INV_ID"
          [control]="reportdataForm.controls.INV_ID"
          [submitted]="submitted"
        ></app-input-text>
        <!-- <div class="block">盤點單號:</div>
        <div class="block">{{ reportRequest.INV_ID }}</div> -->
      </div>

      <div class="card">
        <div class="col-12">
          <app-table-report
            [data]="reportData"
            tableKey="ASS16020Report"
            [totalRecords]="totalRecords"
            [columns]="reportColumns"
            [footerData]="footerData"
            [showDelete]="false"
            [showReportMode]="false"
            [showSort]="false"
            [showManage]="false"
            [footerLabelField]="'group_name'"
            [subTotalData]="subTotalData"
            [groupRowsBy]="groupRowsBy"
          >
            <header>
              <div class="flex justify-content-end align-items-center gap-2">
                <p-button
                  styleClass="p-2"
                  label="盤點維護報表.PDF"
                  (click)="onExportPDF()"
                  [loading]="exportPdfLoading"
                  icon="pi pi-file"
                  [disabled]="
                    reportData.length === 0 || !hasPermission(Actions.Print)
                  "
                ></p-button>
                <p-button
                  styleClass="p-2"
                  label="盤點維護報表.XLSX"
                  (click)="onExportExcel()"
                  [loading]="exportExcelLoading"
                  icon="pi pi-file"
                  [disabled]="
                    reportData.length === 0 ||
                    !hasPermission(Actions.ExportExcel)
                  "
                ></p-button>
              </div>
            </header>
          </app-table-report>
        </div>
      </div>
    </div>
  </p-panel>
</div>
