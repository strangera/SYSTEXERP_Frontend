<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="倉別"
            controlName="warehouseType"
            [control]="dataForm.controls.warehouseType"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="盤點單號"
            controlName="inventoryNumber"
            [control]="dataForm.controls.inventoryNumber"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range
            calendarType="dateRange"
            label="盤點日期"
            [startControl]="dataForm.controls.SInventoryDate"
            [endControl]="dataForm.controls.EInventoryDate"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="初盤人員"
            controlName="initChecker"
            [options]="initCheckerOp"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.initChecker"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="複盤人員"
            controlName="rechecker"
            [options]="recheckerOp"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.rechecker"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="說明"
            controlName="remark"
            [control]="dataForm.controls.remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button
          *ngIf="!isEditMode"
          btnType="submit"
          label="確認登錄"
          [loading]="loading"
        ></app-button>

        <app-button
          *ngIf="!isEditMode"
          btnType="submit"
          label="上傳盤點檔"
          [loading]="loading"
        ></app-button>

        <app-button
          *ngIf="isEditMode"
          btnType="submit"
          label="確定修改"
          [loading]="loading"
        ></app-button>

        <app-button
          *ngIf="isEditMode"
          btnType="submit"
          label="確定結案"
          [loading]="loading"
        ></app-button>
      </div>
    </form>
  </p-panel>
</div>
