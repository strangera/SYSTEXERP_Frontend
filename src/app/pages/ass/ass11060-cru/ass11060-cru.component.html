<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-6">
          <app-input-text
            label="訂貨地址"
            controlName="ORDER_ADDR"
            [control]="dataForm.controls.ORDER_ADDR"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="訂貨電話"
            controlName="ORDER_TEL"
            [control]="dataForm.controls.ORDER_TEL"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="訂貨傳真"
            controlName="ORDER_FAX"
            [control]="dataForm.controls.ORDER_FAX"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-6">
          <app-input-text
            label="工廠地址"
            controlName="FACTO_ADDR"
            [control]="dataForm.controls.FACTO_ADDR"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="工廠電話"
            controlName="FACTO_TEL"
            [control]="dataForm.controls.FACTO_TEL"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="工廠傳真"
            controlName="FACTO_FAX"
            [control]="dataForm.controls.FACTO_FAX"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="false"
            label="廠商送貨期限(天)"
            controlName="DELIVERY_LIMIT"
            [control]="dataForm.controls.DELIVERY_LIMIT"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="送貨方式"
            controlName="DELIVERY"
            [options]="deliveryMethodOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.DELIVERY"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="退貨處理方式"
            controlName="RETURN_ORDER"
            [options]="returnMethodOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.RETURN_ORDER"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <app-input-textarea class="col-12"
                            label="備註"
                            controlName="VEN_Remark"
                            [control]="dataForm.controls.VEN_Remark"
                            [readonly]="isFormReadable"
                            [submitted]="submitted"></app-input-textarea>
      </div>
      @if (!isFormReadable) {
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
