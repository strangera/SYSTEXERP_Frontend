<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="設備位置編號" controlName="LOCATION_No" [options]="LOCATION_No_Option"
              optionLabel="LOCATION_Name" optionValue="LOCATION_No" [control]="queryForm.controls.LOCATION_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="FLOOR_NO" [options]="floorNoOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.FLOOR_NO" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="building_no" [options]="ECR_Group_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.building_no" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="AREA_NO" [options]="areaNoOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.AREA_NO" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="設備位置名稱" controlName="LOCATION_Name" [control]="queryForm.controls.LOCATION_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="設備位置說明" controlName="LOCATION_Remark" [control]="queryForm.controls.LOCATION_Remark"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report tableKey="TLS2J010" [data]="data" [columns]="columns" [totalRecords]="totalRecords" dataKey="id"
      [queryFunction]="ass21050Service.queryASS21050.bind(ass21050Service)" [lastQueryBody]="lastQueryBody"
      [loading]="loading" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)" [showDetail]="false" (edit)="onEdit($event)" [showCheckBox]="true" [showDelete]="true"
      [showReportMode]="false" [showExcel]="false" [isRowSelectable]="isRowSelectable">
    </app-table-report>

  </div>
</div>
