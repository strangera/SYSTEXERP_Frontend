<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="錶號位置編號" controlName="ENG_MeterNo" [options]="ENG_MeterNo_Option" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.ENG_MeterNo" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="FLOOR_NO" [options]="floorNoOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.FLOOR_NO" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="AREA_NO" [options]="areaNoOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.AREA_NO" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="說明" controlName="remark" [control]="queryForm.controls.remark"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="置放位置說明" controlName="remark" [control]="queryForm.controls.remark"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
     <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" [showDelete]="false"[showReportMode]="false"
      (detail)="onDetail($event)" dataKey="SeqNo" [multiSortMeta]="[{ field: 'VouNo', order: 1 }]"
      [totalRecords]="totalRecords" [showCheckBox]="true"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showExcel]="false" [showManage]="false">
    </app-table>
       <!-- <app-table-report tableKey="TLS2J010" [data]="data" [columns]="columns" [totalRecords]="totalRecords" dataKey="ID"
      [queryFunction]="tls2j010Service.queryTLS2J010.bind(tls2j010Service)" [lastQueryBody]="lastQueryBody"
      [loading]="loading" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"[showDetail]="false"
       (edit)="onEdit($event)" (delete)="onDelete()" [showCheckBox]="true" [showDelete]="true"
      [showReportMode]="false" [showExcel]="false" [isRowSelectable]="isRowSelectable">
    </app-table-report> -->

  </div>
</div>
