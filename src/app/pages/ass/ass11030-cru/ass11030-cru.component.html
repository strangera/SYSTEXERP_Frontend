<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="小分類代碼" controlName="smlCategoryCode"
                        [control]="dataForm.controls.smlCategoryCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="小分類名稱" controlName="smlCategoryName"
                        [control]="dataForm.controls.smlCategoryName" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="中分類代碼" controlName="midCategoryCode" [options]="midCategoryCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.midCategoryCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="中分類名稱" controlName="midCategoryName"
                        [control]="dataForm.controls.midCategoryName" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="大分類代碼" controlName="bigCategoryCode" [options]="bigCategoryCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.bigCategoryCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="大分類名稱" controlName="bigCategoryName"
                        [control]="dataForm.controls.bigCategoryName" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <app-editor-text label="說明" controlName="illustrate" [control]="dataForm.controls.illustrate"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
