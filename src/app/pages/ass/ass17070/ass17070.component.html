<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="統計日期" [startControl]="queryForm.controls.StartDate"
              [endControl]="queryForm.controls.EndDate" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代號" controlName="OrgID" [options]="orgOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OrgID" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼" controlName="BClassID" [options]="bClassOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.BClassID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼" controlName="MClassID" [options]="mClassOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.MClassID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼" controlName="SClassID" [options]="sClassOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.SClassID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編碼" controlName="GoodsID" [options]="goodsOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.GoodsID" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" tableKey="ASS17070_Data" [columns]="columns" [totalRecords]="totalRecords()"
      [loading]="tableLoading()" [lastQueryBody]="lastQueryBody" [queryFunction]="queryFunction" [showCheckBox]="false"
      [showReorder]="false" [showDelete]="false" [showReportMode]="true" [showDetail]="false" [showEdit]="false"
      [showManage]="false"></app-table-report>
  </div>
</div>
