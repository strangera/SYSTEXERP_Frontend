<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateYearOne"
            label="統計年份"
            [control]="queryForm.controls.YYYY"
            [submitted]="submitted"
          ></app-calendar>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="部門代號"
            controlName="ORG_ID"
            [options]="ORG_ID_Options"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="品項代碼/名稱"
            controlName="FASITEM_ID"
            [options]="FASITEM_ID_Options"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.FASITEM_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="大分類代碼/名稱"
            controlName="B_CLASS_ID"
            [options]="largeOption"
            optionLabel="Label"
            optionValue="No"
            [control]="queryForm.controls.B_CLASS_ID"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="中分類代碼/名稱"
            controlName="M_CLASS_ID"
            [options]="middleOption"
            optionLabel="Label"
            optionValue="No"
            [control]="queryForm.controls.M_CLASS_ID"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="小分類代碼/名稱"
            controlName="S_CLASS_ID"
            [options]="smallOption"
            optionLabel="Label"
            optionValue="No"
            [control]="queryForm.controls.S_CLASS_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="ASS17050"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      [showManage]="false"
      [showReportMode]="false"
      [showSort]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'ASSET_ID', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="匯出 PDF"
            [icon]="
              exportPDFLoading ? 'pi pi-spin pi-spinner' : 'pi pi-file-export'
            "
            [loading]="exportPDFLoading"
            [disabled]="data.length === 0"
            (click)="onExportPDF()"
          ></p-button>
        </div>
      </header>
    </app-table>
  </div>
</div>
