        </div>
        <div class="col-12 md:col-6 lg:col-4">

            optionValue="value"
            [control]="dataForm.controls.floor"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown

            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="查看平面圖"
            controlName="VFP"
            [options]="VFP"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.VFP"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <hr />
      <ng-container formArrayName="items">
        <ng-container
          *ngFor="let item of items.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete
                (click)="onRemoveItem(i)"
                [crudstatus]="crudstatus"
                class="col"
              ></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="專櫃編號/櫃位名稱/位置編號/招募編號"
                controlName="Pettycashcustodian"
                [options]="itemCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'itemCodeOptions')"
                [submitted]="submitted"
              ></app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="營業面積"
                controlName="unit"
                [control]="getFormControl(i, 'unit')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="比率(%)"
                controlName="returnQty"
                [control]="getFormControl(i, 'returnQty')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="專櫃分類"
                controlName="cCat"
                [options]="cCat"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'cCat')"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="備註"
                controlName="returnQty"
                [control]="getFormControl(i, 'returnQty')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
          </div>

          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd
          (click)="onAddItem()"
        ></app-button-dynamicallyadd> -->
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="clear"
                    (click)="onClear()"
                    *ngIf="!isFormReadable"></app-button>
        <app-button btnType="submit"
                    (click)="onSubmit()"
                    *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
