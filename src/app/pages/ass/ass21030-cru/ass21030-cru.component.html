<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                  <app-calendar calendarType="dateMonthOne"
                    label="結算年月"
                    controlName="ENG_YYMM"
                    [control]="dataForm.controls.ENG_YYMM"
                    [submitted]="submitted">
                  </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text
                    label="能源類型"
                    controlName="ENG_Type"
                    [control]="dataForm.controls.ENG_Type"
                    [submitted]="submitted"
                  ></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                  <app-input-text
                    label="錶號"
                    controlName="ENG_MeterNo"
                    [control]="dataForm.controls.ENG_MeterNo"
                    [submitted]="submitted"
                  ></app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar calendarType="dateOne"
                  label="本次抄錶日"
                  controlName="ENG_Date"
                  [control]="dataForm.controls.ENG_Date"
                  [submitted]="submitted">
                </app-calendar>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                  <app-input-number
                    label="本次抄錶度數"
                    controlName="ENG_CurrentReading"
                    [control]="dataForm.controls.ENG_CurrentReading"
                    [maxFractionDigits]="4"
                    [submitted]="submitted"
                  ></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                  <app-input-text
                    label="本次結算金額"
                    controlName="ENG_Amount"
                    [control]="dataForm.controls.ENG_Amount"
                    [submitted]="submitted"
                  ></app-input-text>
              </div>
            </div>

            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
                *ngIf="!isFormReadable">
                <app-button btnType="cancel" [form]="dataForm"></app-button>
                <app-button btnType="submit"></app-button>
            </div>
        </form>
    </p-panel>
</div>
