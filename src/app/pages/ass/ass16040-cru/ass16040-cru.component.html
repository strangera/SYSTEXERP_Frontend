<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 確認審核：僅 Edit 模式且有 Edit 權限時顯示（F-004） -->
    <app-button
      *ngIf="isFormEditable"
      btnType="default"
      label="確認審核"
      [loading]="loading"
      (click)="onApprove()"
    ></app-button>

    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">

        <!-- 申請人代號/名稱（唯讀，合併顯示） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="申請人代號/名稱"
            controlName="EMP_ID"
            [options]="empIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.EMP_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 部門代號/名稱（唯讀，合併顯示） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門代號/名稱"
            controlName="ORG_ID"
            [options]="orgIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 申請日期（唯讀） -->
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="申請日期"
          controlName="APPLY_DATE"
          [control]="dataForm.controls.APPLY_DATE"
          [submitted]="submitted"
          [disabled]="true"
        ></app-calendar>

       <!-- 建議需求(日) -->
<app-input-text
  class="col-12 md:col-6 lg:col-4"
  label="建議需求(日)"
  controlName="REQUIRE_DATE"
  [control]="dataForm.controls.REQUIRE_DATE"
  [submitted]="submitted"
  [disabled]="true"
></app-input-text>

        <!-- 倉別代號/名稱（唯讀，合併顯示） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="倉別代號/名稱"
            controlName="WH_ID"
            [options]="whIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.WH_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

     <!-- 主檔說明 -->
<app-input-text
  class="col-12 md:col-6 lg:col-4"
  label="說明"
  controlName="MASTER_NOTES"
  [control]="dataForm.controls.MASTER_NOTES"
  [submitted]="submitted"
  [disabled]="true"
></app-input-text>

      </div>

      <!-- 明細表格（唯讀） -->
      <div class="col-12">
        <app-table-report
          tableKey="ASS16040Detail"
          [data]="detailData"
          [columns]="detailColumns"
          [totalRecords]="detailData.length"
          [loading]="loading"
          [lazy]="false"
          [showCheckBox]="false"
          [showManage]="false"
          [showReorder]="false"
          [showDelete]="false"
        ></app-table-report>
      </div>
    </form>
  </p-panel>
</div>
