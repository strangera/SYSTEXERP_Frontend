<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 確認審核：僅 Edit 模式且有 Edit 權限時顯示 -->
    <app-button
      *ngIf="isFormEditable"
      btnType="default"
      label="確認審核"
      [loading]="loading"
      (click)="onApprove()"
    ></app-button>

    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">

        <!-- 申請人代號（唯讀） -->
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="申請人代號"
          controlName="EMP_ID"
          [options]="empIdOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.EMP_ID"
          [submitted]="submitted"
          [disabled]="true"
        ></app-dropdown>

        <!-- 部門代號（唯讀） -->
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="部門代號"
          controlName="ORG_ID"
          [options]="orgIdOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.ORG_ID"
          [submitted]="submitted"
          [disabled]="true"
        ></app-dropdown>

        <!-- 申請日期（唯讀） -->
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="申請日期"
          controlName="APPLY_DATE"
          [control]="dataForm.controls.APPLY_DATE"
          [submitted]="submitted"
          [disabled]="true"
        ></app-calendar>

        <!-- 建議需求(日)（唯讀） -->
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="建議需求(日)"
          controlName="NOTES"
          [control]="dataForm.controls.NOTES"
          [submitted]="submitted"
          [readonly]="true"
        ></app-input-text>

        <!-- 倉別（唯讀） -->
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="倉別"
          controlName="WH_ID"
          [options]="whIdOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.WH_ID"
          [submitted]="submitted"
          [disabled]="true"
        ></app-dropdown>

        <!-- 說明（唯讀） -->
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="說明"
          controlName="DESCRIPTION"
          [control]="dataForm.controls.DESCRIPTION"
          [submitted]="submitted"
          [readonly]="true"
        ></app-input-text>

        <!-- 明細表格（唯讀） -->
        <app-table-edit
          tableKey="ASS16040Detail"
          class="col-12"
          [data]="detailData"
          [columns]="detailColumns"
          [showCheckBox]="false"
          [showReorder]="false"
          [disabled]="true"
        ></app-table-edit>

      </div>
    </form>
  </p-panel>
</div>
