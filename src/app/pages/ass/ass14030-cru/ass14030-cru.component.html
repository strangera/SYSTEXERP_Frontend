<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票編號"
            controlName="VouNo"
            [control]="dataForm.controls.VouNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票種類"
            controlName="Voucher_Name"
            [control]="dataForm.controls.Voucher_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票型態"
            controlName="VouTypeName"
            [control]="dataForm.controls.VouTypeName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar
            calendarType="dateOne"
            label="傳票日期"
            controlName="VouDate"
            [control]="dataForm.controls.VouDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-6">
          <app-input-text
            label="傳票摘要"
            controlName="Remark"
            [control]="dataForm.controls.Remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="結帳單號"
            controlName="ORI_SLIP"
            [control]="dataForm.controls.ORI_SLIP"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票狀態"
            controlName="PostFlagName"
            [control]="dataForm.controls.PostFlagName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="建立者"
            controlName="CRT_USR_Name"
            [control]="dataForm.controls.CRT_USR_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="建立日"
            controlName="CRT_Date"
            [control]="dataForm.controls.CRT_Date"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="修改者"
            controlName="UPD_USR_Name"
            [control]="dataForm.controls.UPD_USR_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="修改日"
            controlName="UPD_Date"
            [control]="dataForm.controls.UPD_Date"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <hr />
      <app-table-edit
        tableKey="ASS14030Detail"
        [columns]="detailColumns"
        [(data)]="data"
        [loading]="loading"
        [disabled]="isFormReadable"
        [showCheckBox]="false"
        [showDelete]="false"
        [showReorder]="false"
        [canInsert]="false"
      ></app-table-edit>
    </form>
    @if (!isFormReadable) {
      <div class="col pt-4">
        <div class="grid justify-content-end gap-2">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading" (click)="onSubmit()"></app-button>
        </div>
      </div>
    }
  </p-panel>
</div>
