<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <!-- Row 1: 品項代碼、品項名稱 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品項代碼" controlName="itemCode" [control]="queryForm.controls.itemCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品項名稱" controlName="itemName" [control]="queryForm.controls.itemName"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- Row 2: 大分類代碼、中分類代碼、小分類代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼" controlName="bigCategoryCode" [options]="bigCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.bigCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼" controlName="midCategoryCode" [options]="midCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.midCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼" controlName="smlCategoryCode" [options]="smlCategoryCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.smlCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <!-- Row 3: 品項類別區分、基本單位、包裝單位 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項類別區分" controlName="itemCategory" [options]="itemCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.itemCategory" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="基本單位" controlName="itemUnit" [options]="itemUnitOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.itemUnit" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="包裝單位" controlName="packageUnit" [options]="packageUnitOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.packageUnit" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- Row 4: 保固方式、保養方式 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保固方式" controlName="warrantyMethod" [options]="warrantyMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.warrantyMethod"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保養方式" controlName="maintenanceMethod" [options]="maintenanceMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.maintenanceMethod"
              [submitted]="submitted"></app-dropdown>
          </div>
          <!-- Row 5: 說明 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="說明" controlName="illustrate" [control]="queryForm.controls.illustrate"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="ID" tableKey="ASS11040_Data" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [lazy]="false" [showCheckBox]="false" [selectedItems]="selectedRows"
      (selectionChange)="selectedRows = $event" [showDelete]="false" [showReportMode]="false" (edit)="onEdit($event)"
      (detail)="onDetail($event)"></app-table-report>
  </div>
</div>
