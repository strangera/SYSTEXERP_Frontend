<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <!-- 第一區塊：必填欄位 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-2">
            <app-calendar
              calendarType="dateOne"
              label="移轉日期"
              [control]="queryForm.controls.TRANSFER_DATE"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="新保管單位"
              controlName="NEW_HOLD_ORG_ID"
              [options]="orgOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NEW_HOLD_ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="新保管人"
              controlName="NEW_HOLD_EMP_ID"
              [options]="newHoldEmpOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NEW_HOLD_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="新使用單位"
              controlName="NEW_USE_ORG_ID"
              [options]="orgOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NEW_USE_ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="新使用人"
              controlName="NEW_USE_EMP_ID"
              [options]="newUseEmpOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NEW_USE_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <hr />
        <!-- 第二區塊：分類/進貨 -->
        <div class="grid p-fluid">
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="進貨類型"
              controlName="DEPRE_YN"
              [options]="purchaseTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.DEPRE_YN"
              [submitted]="submitted"
            ></app-dropdown>
          </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="財產編號"
              controlName="ASSET_ID"
              [options]="assetOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ASSET_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="標題"
              groupname="HEADLINE"
              [control]="queryForm.controls.HEADLINE"
              [options]="titleOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <!-- <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類代碼/名稱"
              controlName="B_CLASS_ID"
              [options]="bigClassOptions()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.B_CLASS_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-4 lg:col-4">
            <app-dropdown
              label="中分類代碼/名稱"
              controlName="M_CLASS_ID"
              [options]="midClassOptions()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.M_CLASS_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類代碼/名稱"
              controlName="S_CLASS_ID"
              [options]="smallClassOptions()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.S_CLASS_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>-->
        <hr />
        <!-- 第三區塊：保管/使用 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="HOLD_ORG_ID"
              [options]="orgOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.HOLD_ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管人"
              controlName="HOLD_EMP_ID"
              [options]="oldHoldEmpOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.HOLD_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="使用單位"
              controlName="USE_ORG_ID"
              [options]="orgOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.USE_ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="使用人"
              controlName="USE_EMP_ID"
              [options]="oldUseEmpOptions$ | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.USE_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="ASS13050"
    [data]="tableData()"
    [columns]="columns"
    [columnGroup]="columnGroup"
    [totalRecords]="totalRecords()"
    [loading]="tableLoading()"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="false"
    [showDetail]="false"
    [showManage]="false"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="下載報表"
          icon="pi pi-download"
          [loading]="btnReportLoading"
          (click)="onDownloadReport()"
          [disabled]="tableData().length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
