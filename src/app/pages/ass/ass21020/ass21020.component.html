<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="能源類型"
                              controlName="ENGType"
                              [options]="service.engTypeSignal()"
                              optionLabel="Name"
                              optionValue="No"
                              [control]="qf().ENGType"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="錶號"
                          controlName="No"
                          [options]="service.engMeterNoDropdownSignal()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="qf().ENG_MeterNo"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號"
                          controlName="TLT_No"
                          [options]="service.tltDropdownSignal()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="qf().TLT_No"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="設備位置編號"
                            controlName="Location_No"
                            [control]="qf().Location_No"
                            [disabled]="true"
                            [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="部別名稱"
                            controlName="TLT_Name"
                            [control]="qf().TLT_Name"
                            [disabled]="true"
                            [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="營業面積"
                            controlName="NET_SPACE"
                            [control]="qf().NET_SPACE"
                            [disabled]="true"
                            [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="面積比例(%)"
                            controlName="NET_SPACE_Ratio"
                            [control]="qf().NET_SPACE_Ratio"
                            [disabled]="true"
                            [submitted]="submitted"></app-input-text>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="設備位置編號"
                          controlName="Location_No"
                          [options]="service.locationSignal()"
                          optionLabel="Location_No"
                          optionValue="Location_No"
                          [control]="qf().Location_No"
                          [submitted]="submitted"></app-dropdown>
          </div> -->
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      (click)="onSubmit()"
                      [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="true"
               [data]="service.ASS21020Data()"
               [dataKey]="'ID'"
               [tableKey]="'ASS21020_Data'"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
               [lazy]="true"
               [loading]="loading"
               (edit)="onEdit($event)"
               (delete)="onDelete($event)"
               (detail)="onDetail($event)"></app-table>
  </div>
</div>
