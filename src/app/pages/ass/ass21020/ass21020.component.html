<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4"
                            label="能源類型"
                            controlName="ENGType"
                            [options]="service.engTypeSignal()"
                            optionLabel="Name"
                            optionValue="No"
                            [control]="qf().ENGType"
                            [submitted]="submitted"></app-multi-select>
          <div class="col-12 md:col-6 lg:col-4 flex align-items-end">
            <app-input-text class="flex-1"
                            label="錶號"
                            [pKeyFilter]="ptn"
                            [customPlaceholder]="'請選擇錶號'"
                            controlName="ENG_MeterNo"
                            [control]="qf().ENG_MeterNo"
                            (click)="dialogVisible = 'meterNo'"></app-input-text>
            <app-button class="ml-1"
                        btnType="clear"
                        (click)="onClearDialog('meterNo')"></app-button>
          </div>
          <div class="col-12 md:col-6 lg:col-4 flex align-items-end">
            <app-input-text class="flex-1"
                            label="專櫃編號"
                            [pKeyFilter]="ptn"
                            [customPlaceholder]="'請選擇專櫃編號'"
                            controlName="TLT_No"
                            [control]="qf().TLT_No"
                            (click)="dialogVisible = 'tltNo'"></app-input-text>
            <app-button class="ml-1"
                        btnType="clear"
                        (click)="onClearDialog('tltNo')"></app-button>
          </div>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="設備位置編號"
                          controlName="Location_No"
                          [control]="qf().Location_No"
                          [disabled]="true"
                          [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="部別名稱"
                          controlName="TLT_Name"
                          [control]="qf().TLT_Name"
                          [disabled]="true"
                          [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="營業面積"
                          controlName="NET_SPACE"
                          [control]="qf().NET_SPACE"
                          [disabled]="true"
                          [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="面積比例(%)"
                          controlName="NET_SPACE_Ratio"
                          [control]="qf().NET_SPACE_Ratio"
                          [disabled]="true"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="true"
               [data]="service.ASS21020Data()"
               [dataKey]="'ID'"
               [tableKey]="'ASS21020_Data'"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
               [lazy]="true"
               [loading]="loading"
               (edit)="onEdit($event)"
               (delete)="onDelete($event)"
               (detail)="onDetail($event)"></app-table>
  </div>
</div>


<app-dialog [visible]="!!dialogVisible"
            (visibleChange)="dialogVisible = !1"
            [header]="dialogVisible === 'meterNo' ? '選擇錶號' : '選擇專櫃編號'"
            (save)="onSaveDialog()"
            [disable]="dialogVisible === 'meterNo' ? !service.engMeterNoMap.size : !service.tltByFlagMap.size">
  <div class="row">
    <div class="col-12">
      <app-table [tableKey]="dialogVisible === 'meterNo' ? 'ASS21020_meterno_table' : 'ASS21020_locationno_table'"
                 [dataKey]="dialogVisible === 'meterNo' ? 'Id' : 'TLT_No'"
                 [data]="dialogVisible === 'meterNo' ? service.engMeterNoSignal() : service.tltNoSignal()"
                 [columns]="dialogVisible === 'meterNo' ? meterColumns : tltNoColumns"
                 [(selectedItems)]="selectedItemsDialog"
                 [showHeader]="false"
                 [showManage]="false"
                 [showCheckBox]="true"
                 [showCaption]="false"
                 [selectionMode]="'single'"
                 [emptyMessage]="dialogVisible === 'meterNo' ? '無可選擇的錶號' : '無可選擇的專櫃編號'">
      </app-table>
    </div>
  </div>
</app-dialog>
