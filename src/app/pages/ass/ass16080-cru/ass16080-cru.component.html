<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="default"
      label="調撥出庫"
      *ngIf="isOutWHMode"
    ></app-button>
    <app-button
      btnType="default"
      label="調撥入庫"
      *ngIf="isInWHMode"
    ></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="調撥單號"
            controlName="transferNote"
            [control]="dataForm.controls.transferNote"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="initOrgCode" class="block">調出倉別</label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="outWarehouse"
                [options]="Kurabe"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.outWarehouse"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="outWarehouseName"
                [options]="KurabeName"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.outWarehouseName"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="initOrgCode" class="block">調入倉別</label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="inWarehouse"
                [options]="Kurabe"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.inWarehouse"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="inWarehouseName"
                [options]="KurabeName"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.inWarehouseName"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="initOrgCode" class="block">申請人</label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="applicantCode"
                [options]="applicantCode"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.applicantCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="applicantName"
                [options]="applicantName"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.applicantName"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="initOrgCode" class="block">部門編號</label>
          <div class="grid">
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="departmentCode"
                [options]="departmentCode"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.departmentCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6">
              <app-dropdown
                [showLabel]="false"
                controlName="departmentName"
                [options]="departmentName"
                optionLabel="label"
                optionValue="value"
                [control]="dataForm.controls.departmentName"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            [control]="dataForm.controls.applicationDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea
            label="備註"
            controlName="retExp"
            [control]="dataForm.controls.retExp"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>

        <!-- 動態表單欄位... -->
        <app-table-edit
          tableKey="ASS16080Detail"
          class="col-12"
          [data]="data"
          [columns]="columns"
          [showCheckBox]="true"
          (delete)="onDelete($event)"
          (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows"
          [showCheckBox]="!isFormReadable"
          (dataChange)="data = $event"
          [disabled]="isFormReadable"
          [tableRequired]="true"
        ></app-table-edit>
      </div>
      <div class="pt-1"></div>
    </form>
    <div class="col pt-4">
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="resetTable()"
        ></app-button>
        <app-button
          btnType="submit"
          (clickEvent)="submitForm(dataForm)"
        ></app-button>
      </div>
    </div>
  </p-panel>
</div>
