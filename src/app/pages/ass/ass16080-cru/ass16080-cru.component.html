<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onBack()"></app-button>
  </div>

  <p-panel [header]="pageTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-3">
          <app-input-text
            label="調撥單號"
            controlName="WHMOVE_ID"
            [control]="dataForm.controls.WHMOVE_ID"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-input-text
            label="調撥狀態"
            controlName="WHMOVE_STATUS"
            [control]="dataForm.controls.WHMOVE_STATUS"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="調出倉別"
            controlName="OUT_WH_ID"
            [options]="whIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.OUT_WH_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="調入倉別"
            controlName="IN_WH_ID"
            [options]="whIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.IN_WH_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="申請人"
            controlName="EMP_ID"
            [options]="empIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.EMP_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="部門代號"
            controlName="ORG_ID"
            [options]="orgIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            controlName="APPLY_DATE"
            [control]="dataForm.controls.APPLY_DATE"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-input-text
            label="備註"
            controlName="NOTES"
            [control]="dataForm.controls.NOTES"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <app-fin32020table-edit
        [title]="detailTitle"
        [tableKey]="'ass16080Detail'"
        dataKey="DetailID"
        [data]="detailData"
        [columns]="detailColumns"
        [loading]="detailLoading"
        [disabled]="isFormReadable"
        [showReorder]="false"
        [showCheckBox]="false"
        [showInsert]="false"
        [canInsert]="false"
        [showDelete]="false"
        [keepDeletedData]="false"
        [showPaginator]="false"
        [scrollable]="false"
        [showCaption]="false"
        (dataChange)="onDetailDataChange($event)"
      ></app-fin32020table-edit>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [type]="'button'"
          (click)="onCancel()"
        ></app-button>

        <app-button
          *ngIf="canUpdateOut"
          [type]="'button'"
          label="調撥出庫"
          [loading]="loading"
          (click)="onUpdateOut()"
        ></app-button>

        <app-button
          *ngIf="canUpdateIn"
          [type]="'button'"
          label="調撥入庫"
          [loading]="loading"
          (click)="onUpdateIn()"
        ></app-button>
      </div>
    </form>
  </p-panel>
</div>
