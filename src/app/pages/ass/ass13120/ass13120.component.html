<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
      headerStyleClass="query-accordionTab">
      <form [formGroup]="queryForm" (ngSubmit)="onGenerate(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-3">
            <app-calendar calendarType="dateMonthOne" label="年月" controlName="DepreYM"
              [control]="queryForm.controls.DepreYM" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 flex align-items-center text-color-secondary">
            <span>最後傳票產生日期：{{ lastVoucherInfo }}</span>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="submit" label="傳票產生" icon="pi pi-plus" [loading]="creating"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
