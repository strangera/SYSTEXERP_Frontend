<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="變賣單號"
            controlName="soldNo"
            [control]="queryForm.controls.soldNo"
            [submitted]="submitted"
          ></app-input-text>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="資產代號"
            controlName="assetNo"
            [control]="queryForm.controls.assetNo"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="品項編號"
            controlName="goodsId"
            [options]="goodsIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.goodsId"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="購入日期"
            [startControl]="queryForm.controls.buyDateFrom"
            [endControl]="queryForm.controls.buyDateTo"
            [submitted]="submitted"
          ></app-calendar-range-quick>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="資產狀態"
            controlName="assetStatus"
            [options]="assetStatusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.assetStatus"
            [submitted]="submitted"
          ></app-dropdown>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="攤提代號"
            controlName="acpNo"
            [control]="queryForm.controls.acpNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="保管單位"
            controlName="keepOrgId"
            [options]="orgOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.keepOrgId"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="保管人"
            controlName="keepUserNo"
            [options]="userOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.keepUserNo"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="會計科目"
            controlName="accNo"
            [options]="accOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.accNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="使用單位"
            controlName="useOrgId"
            [options]="orgOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.useOrgId"
            [submitted]="submitted"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="使用人"
            controlName="useUserNo"
            [options]="userOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.useUserNo"
            [submitted]="submitted"
          ></app-dropdown>
          <app-input-number-range
            class="col-12 md:col-4 lg:col-4"
            [useGrouping]="false"
            label="購入金額"
            [startControl]="queryForm.controls.buyAmtFrom"
            [endControl]="queryForm.controls.buyAmtTo"
            [submitted]="submitted"
          ></app-input-number-range>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="驗收單號"
            controlName="rcvNo"
            [options]="rcvNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.rcvNo"
            [submitted]="submitted"
          ></app-dropdown>
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="入帳日期"
            [startControl]="queryForm.controls.txnDateFrom"
            [endControl]="queryForm.controls.txnDateTo"
            [submitted]="submitted"
          ></app-calendar-range-quick>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    dataKey="SOLD_NO"
    tableKey="ASS13080_Data"
    [data]="tableData()"
    [columns]="columns"
    [totalRecords]="totalRecords()"
    [loading]="tableLoading()"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
  ></app-table-report>
</div>
