<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="基準日"
              [control]="queryForm.controls.baseYYMM"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="keeperUnit"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.keeperUnit"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代碼"
              controlName="Accountcode"
              [options]="AccountcodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountcode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="itemCode"
              [options]="itemCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.itemCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <ul>
          <li>取得成本：異動後稅前價格</li>
          <li>年初累計折舊：自入帳日提列至查詢年度1/1之金額</li>
          <li>本期折舊金額：查詢年度已提列折舊</li>
          <li>本月折舊金額：查詢月份提列折舊</li>
          <li>累計折舊金額：自入帳日提列至查詢月份累計折舊金額</li>
        </ul>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
