<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠商編號"
              controlName="vendorId"
              [control]="queryForm.controls.vendorId"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠商統一編號"
              controlName="vendorUid"
              [control]="queryForm.controls.vendorUid"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱(中文)"
              controlName="vendorCName"
              [control]="queryForm.controls.vendorCName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="發票地址"
              controlName="vendorSName"
              [control]="queryForm.controls.invoiceAddress"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商名稱(英文)"
              controlName="vendorEName"
              [control]="queryForm.controls.vendorEName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商簡稱"
              controlName="vendorSName"
              [control]="queryForm.controls.vendorSName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人"
              controlName="principal"
              [control]="queryForm.controls.principal"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人職稱"
              controlName="principalTitle"
              [control]="queryForm.controls.principalTitle"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人身份証字號"
              controlName="principalUid"
              [control]="queryForm.controls.principalUid"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="負責人聯絡地址"
              controlName="principalAddress"
              [control]="queryForm.controls.principalAddress"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="負責人電話"
              controlName="principalPhone"
              [control]="queryForm.controls.principalPhone"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>

          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="負責人電子郵件"
              controlName="principalEmail"
              [control]="queryForm.controls.principalEmail"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="公司登記地址(中文)"
              controlName="companyAddress"
              [control]="queryForm.controls.companyAddress"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="公司登記電話"
              controlName="companyPhone"
              [control]="queryForm.controls.companyPhone"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="公司傳真"
              controlName="companyFax"
              [control]="queryForm.controls.companyFax"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="訂貨地址"
              controlName="orderingAddress"
              [control]="queryForm.controls.orderingAddress"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="訂貨電話"
              controlName="orderingPhone"
              [control]="queryForm.controls.orderingPhone"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="訂貨傳真"
              controlName="orderingFax"
              [control]="queryForm.controls.orderingFax"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="工廠地址"
              controlName="factoryAddress"
              [control]="queryForm.controls.factoryAddress"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="工廠電話"
              controlName="factoryPhone"
              [control]="queryForm.controls.factoryPhone"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-number
              [useGrouping]="false"
              label="工廠傳真"
              controlName="factoryFax"
              [control]="queryForm.controls.factoryFax"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="送貨方式"
              controlName="deliveryMethod"
              [options]="deliveryMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.deliveryMethod"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="退貨處理方式"
              controlName="returnMethod"
              [options]="returnMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.returnMethod"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="廠商送貨期限"
              [startControl]="queryForm.controls.startDeliveryDate"
              [endControl]="queryForm.controls.endDeliveryDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <hr />
        <app-editor-text
          label="附註"
          controlName="remark"
          [control]="queryForm.controls.remark"
          [style]="{ height: '100px' }"
          [submitted]="submitted"
        ></app-editor-text>
        <hr />
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
