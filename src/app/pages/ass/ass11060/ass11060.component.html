<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商編號"
              controlName="VENDOR_ID"
              [control]="queryForm.controls.VENDOR_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商統一編號"
              controlName="GUI_ID"
              [control]="queryForm.controls.GUI_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱(中文)"
              controlName="VENDOR_NAME"
              [control]="queryForm.controls.VENDOR_NAME"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="發票地址"
              controlName="VENDOR_REG_ADDR"
              [control]="queryForm.controls.VENDOR_REG_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商名稱(英文)"
              controlName="VENDOR_NAME_E"
              [control]="queryForm.controls.VENDOR_NAME_E"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商簡稱"
              controlName="VENDOR_NAME_S"
              [control]="queryForm.controls.VENDOR_NAME_S"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人"
              controlName="CHARGE_STAFF"
              [control]="queryForm.controls.CHARGE_STAFF"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人職稱"
              controlName="CHARGE_TITLE"
              [control]="queryForm.controls.CHARGE_TITLE"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人身份証字號"
              controlName="CHARGE_PID"
              [control]="queryForm.controls.CHARGE_PID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="負責人聯絡地址"
              controlName="CHARGE_ADDR"
              [control]="queryForm.controls.CHARGE_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="負責人電話"
              controlName="CHARGE_TEL"
              [control]="queryForm.controls.CHARGE_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="負責人電子郵件"
              controlName="CHARGE_EMAIL"
              [control]="queryForm.controls.CHARGE_EMAIL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="公司登記地址(中文)"
              controlName="companyAddress"
              [control]="queryForm.controls.companyAddress"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="公司登記電話"
              controlName="VENDOR_REG_TEL"
              [control]="queryForm.controls.VENDOR_REG_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="公司傳真"
              controlName="VENDOR_FAX"
              [control]="queryForm.controls.VENDOR_FAX"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="訂貨地址"
              controlName="ORDER_ADDR"
              [control]="queryForm.controls.ORDER_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="訂貨電話"
              controlName="ORDER_TEL"
              [control]="queryForm.controls.ORDER_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="訂貨傳真"
              controlName="ORDER_FAX"
              [control]="queryForm.controls.ORDER_FAX"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="工廠地址"
              controlName="FACTO_ADDR"
              [control]="queryForm.controls.FACTO_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="工廠電話"
              controlName="FACTO_TEL"
              [control]="queryForm.controls.FACTO_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="工廠傳真"
              controlName="FACTO_FAX"
              [control]="queryForm.controls.FACTO_FAX"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="送貨方式"
              controlName="DELIVERY"
              [options]="deliveryMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.DELIVERY"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="退貨處理方式"
              controlName="RETURN_ORDER"
              [options]="returnMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.RETURN_ORDER"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="廠商送貨期限(批號)"
              [startControl]="queryForm.controls.DELIVERY_LIMIT_FROM"
              [endControl]="queryForm.controls.DELIVERY_LIMIT_TO"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <hr />
        <app-editor-text
          label="附註"
          controlName="NOTES"
          [control]="queryForm.controls.NOTES"
          [style]="{ height: '100px' }"
          [submitted]="submitted"
        ></app-editor-text>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="ASS11060"
    dataKey="VENDOR_ID"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showTotal]="false"
    [showManage]="false"
    [showCheckBox]="false"
    [showDelete]="false"
    [lazy]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
  ></app-table>
</div>
