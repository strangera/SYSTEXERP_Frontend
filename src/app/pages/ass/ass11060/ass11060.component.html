<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit()"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商編號"
              controlName="VEN_No"
              [control]="queryForm.controls.VEN_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商統一編號"
              controlName="VEN_Uniform"
              [control]="queryForm.controls.VEN_Uniform"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱(中文)"
              controlName="VEN_Name"
              [control]="queryForm.controls.VEN_Name"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商名稱(英文)"
              controlName="VEN_EngName"
              [control]="queryForm.controls.VEN_EngName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="廠商簡稱"
              controlName="VEN_ShortName"
              [control]="queryForm.controls.VEN_ShortName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人"
              controlName="CHARGE_STAFF"
              [control]="queryForm.controls.CHARGE_STAFF"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人職稱"
              controlName="CHARGE_TITLE"
              [control]="queryForm.controls.CHARGE_TITLE"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="負責人身份証字號"
              controlName="CHARGE_PID"
              [control]="queryForm.controls.CHARGE_PID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="負責人聯絡地址"
              controlName="CHARGE_ADDR"
              [control]="queryForm.controls.CHARGE_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="負責人電話"
              controlName="CHARGE_TEL"
              [control]="queryForm.controls.CHARGE_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="負責人電子郵件"
              controlName="CHARGE_EMAIL"
              [control]="queryForm.controls.CHARGE_EMAIL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="公司登記地址(中文)"
              controlName="VEN_Address"
              [control]="queryForm.controls.VEN_Address"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="公司登記電話"
              controlName="VEN_Tel"
              [control]="queryForm.controls.VEN_Tel"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="公司傳真"
              controlName="VEN_Fax"
              [control]="queryForm.controls.VEN_Fax"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="訂貨地址"
              controlName="ORDER_ADDR"
              [control]="queryForm.controls.ORDER_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="訂貨電話"
              controlName="ORDER_TEL"
              [control]="queryForm.controls.ORDER_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="訂貨傳真"
              controlName="ORDER_FAX"
              [control]="queryForm.controls.ORDER_FAX"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="工廠地址"
              controlName="FACTO_ADDR"
              [control]="queryForm.controls.FACTO_ADDR"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="工廠電話"
              controlName="FACTO_TEL"
              [control]="queryForm.controls.FACTO_TEL"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-3">
            <app-input-text
              label="工廠傳真"
              controlName="FACTO_FAX"
              [control]="queryForm.controls.FACTO_FAX"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="送貨方式"
              controlName="DELIVERY"
              [options]="deliveryMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.DELIVERY"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="退貨處理方式"
              controlName="RETURN_ORDER"
              [options]="returnMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.RETURN_ORDER"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠商送貨期限"
              controlName="DELIVERY_LIMIT"
              [control]="queryForm.controls.DELIVERY_LIMIT"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <app-input-textarea
            class="col-12"
            label="附註"
            controlName="VEN_Remark"
            [control]="queryForm.controls.VEN_Remark"
            [submitted]="submitted" />
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="ASS11060"
    dataKey="VEN_No"
    [data]="tableData()"
    [columns]="columns"
    [totalRecords]="totalRecords()"
    [loading]="tableLoading()"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    [showDelete]="false"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出 PDF"
          icon="pi pi-file-pdf"
          [loading]="btnPDFLoading"
          (click)="onExportPDF()"
          [disabled]="tableData().length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
