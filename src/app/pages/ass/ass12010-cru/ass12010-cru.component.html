<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel header="新增資訊" class="line-height-3 m-0 mb-3">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6"
          label="部門代號"
          controlName="ORG_ID"
          [options]="orgIdOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().ORG_ID"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6"
          label="申請人代號"
          controlName="EMP_ID"
          [options]="filteredEmpIdOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().EMP_ID"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-dropdown>
      </div>
      <div class="grid p-fluid">
        <app-calendar
          class="col-12 md:col-6"
          calendarType="dateOne"
          label="需求日期"
          controlName="APPLY_DATE"
          [control]="df().APPLY_DATE"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-text
          class="col-12 md:col-6"
          label="需求期限(天)"
          controlName="NEED_NUM"
          [control]="df().NEED_NUM"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-input-text>
      </div>
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6"
          label="倉別"
          controlName="WH_ID"
          [options]="whIdOptions()"
          optionLabel="label"
          optionValue="value"
          [control]="df().WH_ID"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-dropdown>
        <app-input-text
          class="col-12 md:col-6"
          label="說明"
          controlName="REMARK"
          [control]="df().REMARK"
          [disabled]="isFormReadable"
          [submitted]="submitted"
        ></app-input-text>
      </div>

      <br />

      <app-table-edit
        tableKey="ASS12010_items"
        [data]="tableData()"
        [columns]="editColumns"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        (insert)="onTableInsert()"
        (dataChange)="tableData.set($event)"
        [showCheckBox]="!isFormReadable"
        [showDelete]="!isFormReadable"
        [showInsert]="!isFormReadable"
        [disabled]="isFormReadable"
        [canInsert]="true"
        [loading]="tableLoading()"
      ></app-table-edit>

      <!-- 底部操作按鈕 -->
      <div
        class="grid justify-content-end gap-2 m-0 mt-4 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          [disabled]="isFormReadable"
        ></app-button>
        <app-button
          btnType="submit"
          [loading]="loading"
          [disabled]="isFormReadable"
        ></app-button>
      </div>
    </form>
  </p-panel>
</div>
