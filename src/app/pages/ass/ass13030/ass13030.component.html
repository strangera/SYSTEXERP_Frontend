<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="攤提代號"
              controlName="shareCode"
              [options]="shareCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.shareCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="資產編號"
              controlName="assetsCode"
              [options]="assetsCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetsCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="購入日期"
              [startControl]="queryForm.controls.purchaseDateFrom"
              [endControl]="queryForm.controls.purchaseDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產狀態"
              controlName="assetStatus"
              [options]="assetsStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetStatus"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管人"
              controlName="keeper"
              [options]="userCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.keeper"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="keeperUnit"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.keeperUnit"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="使用人"
              controlName="user"
              [options]="userCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.user"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="使用單位"
              controlName="userUnit"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.userUnit"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產類型"
              controlName="assetType"
              [options]="assetTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.assetType"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代號"
              controlName="accountingCode"
              [options]="accountingCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountingCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="供應商編號"
              controlName="supplierCode"
              [options]="supplierCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.supplierCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="購入金額"
              [startControl]="queryForm.controls.purchaseAmountFrom"
              [endControl]="queryForm.controls.purchaseAmountTo"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="驗收單號"
              controlName="orderNumber"
              [options]="orderNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.orderNumber"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="入帳日期"
              [startControl]="queryForm.controls.entryDateFrom"
              [endControl]="queryForm.controls.entryDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="顯示筆數"
              controlName="displayNumber"
              [control]="queryForm.controls.displayNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <hr />
        <div class="col-12 md:col-4 lg:col-4">
          <p-checkbox
            label="已達耐用年限"
            controlName="outofLimit"
            [formControl]="queryForm.controls.outofLimit"
          ></p-checkbox>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
