<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="submitQuery()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="進貨起始日期" [startControl]="queryForm.controls.CHECK_DATE_S"
              [endControl]="queryForm.controls.CHECK_DATE_E" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="進貨單號" controlName="SUBPOENA_ID" [options]="subpoenaOptions" optionLabel="label"
              optionValue="value" [control]="qf().SUBPOENA_ID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="SUPPLIER_ID" [options]="supplierOptions" optionLabel="label"
              optionValue="value" [control]="qf().SUPPLIER_ID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人代號" controlName="EMP_ID" [options]="applicantOptions" optionLabel="label"
              optionValue="value" [control]="qf().EMP_ID" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report #tableReport [data]="tableData()" [dataKey]="'SUBPOENA_ID'" [tableKey]="'ASS15070_Data'"
      [columns]="columns" [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showEdit]="false" [showManage]="false" [showDetail]="false" [showDelete]="false"
      [showReportMode]="false">
      <header>
        <div class="flex justify-content-end align-items-center gap-2 mb-2">
          <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file" [loading]="exportPdfLoading"
            (click)="onExportPdf()"
            [disabled]="tableData().length === 0 || !hasPermission(Actions.Print)"></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
