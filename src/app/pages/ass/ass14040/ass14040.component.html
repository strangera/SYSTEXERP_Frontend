<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="query"
      label="試算"
      (click)="onCalc(queryForm)"
      [disabled]="!hasPermission(Actions.Trial)"
    ></app-button>
    <app-button
      btnType="query"
      label="結算"
      (click)="onClose(queryForm)"
      [disabled]="!hasPermission(Actions.Settle)"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="結算年月"
              [control]="queryForm.controls.YYYYMM"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <ul>
          <li>{{ latestMessage || "最近結算年月: --" }}</li>
        </ul>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
