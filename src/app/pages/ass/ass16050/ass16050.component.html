<!-- 查詢條件卡片 -->
<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 領用單號 -->
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="領用單號"
            controlName="MTAPPLY_ID"
            [control]="queryForm.controls.MTAPPLY_ID"
            [submitted]="submitted"
          ></app-input-text>

          <!-- 申請人代號/名稱 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="申請人代號/名稱"
            controlName="EMP_ID"
            [options]="userOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.EMP_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <!-- 品項代碼/名稱 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="品項代碼/名稱"
            controlName="FASITEM_ID"
            [options]="fasItemOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.FASITEM_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <!-- 部門代碼/名稱 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="部門代碼/名稱"
            controlName="ORG_ID"
            [options]="orgOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <!-- 申請日期（起迄） -->
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="申請日期"
            [startControl]="queryForm.controls.APPLY_DATE_S"
            [endControl]="queryForm.controls.APPLY_DATE_E"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <!-- 審核日期（起迄） -->
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="審核日期"
            [startControl]="queryForm.controls.APRV_DATE_S"
            [endControl]="queryForm.controls.APRV_DATE_E"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <!-- 發料日期 -->
          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            label="發料日期"
            calendarType="dateOne"
            [control]="queryForm.controls.CHECK_DATE"
            [submitted]="submitted"
          ></app-calendar>

          <!-- 審核者代號/名稱 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="審核者代號/名稱"
            controlName="APRV_EMP_ID"
            [options]="userOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.APRV_EMP_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <!-- 倉別代碼/名稱 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="倉別代碼/名稱"
            controlName="WH_ID"
            [options]="whOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.WH_ID"
            [submitted]="submitted"
          ></app-dropdown>

          <!-- 領用單狀態 -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="領用單狀態"
            controlName="STATUS"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.STATUS"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 查詢結果表格卡片 -->
<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS16050"
      dataKey="MTAPPLY_ID"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [loading]="loading"
      [showEdit]="false"
      [showDelete]="false"
      [showDetail]="true"
      [showReportMode]="false"
      (detail)="onDetail($event)"
    ></app-table-report>
  </div>
</div>
