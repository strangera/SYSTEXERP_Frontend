<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onBack()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-3">
          <app-input-text
            label="報廢單號"
            controlName="DAMAGEM_ID"
            [control]="dataForm.controls.DAMAGEM_ID"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="倉別"
            controlName="WH_ID"
            [options]="whIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.WH_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="申請人"
            controlName="EMP_ID"
            [options]="empIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.EMP_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-3">
          <app-dropdown
            label="部門代號"
            controlName="ORG_ID"
            [options]="orgIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-3">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            controlName="APPLY_DATE"
            [control]="dataForm.controls.APPLY_DATE"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-12 lg:col-9">
          <app-input-text
            label="備註"
            controlName="NOTES"
            [control]="dataForm.controls.NOTES"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

<app-fin32020table-edit
  [title]="'報廢明細'"
  [tableKey]="'ass16090Detail'"
  dataKey="LINE_NUM"
  [data]="detailData"
  [columns]="detailColumns"
  [loading]="detailLoading"
  [disabled]="isFormReadable"
  [showReorder]="!isFormReadable"
  [showCheckBox]="!isFormReadable"
  [showInsert]="false"
  [insertDisabled]="isFormReadable"
  [canInsert]="!isFormReadable"
  [showDelete]="!isFormReadable"
  [keepDeletedData]="false"
  [defaultInsertData]="defaultDetailRow"
  [showPaginator]="false"
  [scrollable]="false"
  [showCaption]="!isFormReadable"
  (dataChange)="onDetailDataChange($event)"
  (fieldChange)="onDetailFieldChange($event)"
  (delete)="onDetailDelete($event)"
  (cellClick)="onDetailCellClick($event)"
></app-fin32020table-edit>

    

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [type]="'button'"
          (click)="onCancel()"
        ></app-button>

        <app-button
          *ngIf="isEditMode"
          [type]="'button'"
          label="作廢"
          (click)="onVoid()"
        ></app-button>

        <app-button
          *ngIf="isEditMode"
          [type]="'button'"
          label="確認審核"
          (click)="onApprove()"
        ></app-button>

        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
      <app-dialog
  [(visible)]="goodsDialogVisible"
  [header]="'選擇品項'"
  [showFooter]="false"
>
  <form
    [formGroup]="goodsSearchForm"
    (ngSubmit)="onSearchGoods()"
    class="grid p-fluid mb-3"
  >
    <div class="col-12 md:col-4">
      <app-input-text
        label="品項編號"
        controlName="GoodsPrefix"
        [control]="goodsSearchForm.controls.GoodsPrefix"
        [submitted]="submitted"
      ></app-input-text>
    </div>

    <div class="col-12 md:col-6">
      <app-input-text
        label="品項名稱"
        controlName="Keyword"
        [control]="goodsSearchForm.controls.Keyword"
        [submitted]="submitted"
      ></app-input-text>
    </div>

    <div class="col-12 md:col-2 flex justify-content-end mt-2">
      <app-button btnType="query" [type]="'submit'"></app-button>
    </div>
  </form>

  <app-table2
    [tableKey]="'ass16090GoodsDialog'"
    dataKey="GOODS_ID"
    [columns]="goodsColumns"
    [data]="goodsList"
    [loading]="goodsLoading"
    [showCheckBox]="false"
    [showManage]="false"
    [showDetail]="true"
    [showEdit]="false"
    [showHeader]="true"
    [showFilter]="false"
    [showReportMode]="false"
    [showPaginator]="false"
    [showCaption]="false"
    selectionMode="single"
    [(selectedItems)]="goodsSelectedRows"
    (selectionChange)="onGoodsSelectionChange($event)"
    (detail)="onGoodsRowDetail($event)"
  ></app-table2>

  <div class="flex justify-content-end gap-2 mt-3">
    <app-button
      btnType="cancel"
      [type]="'button'"
      label="清除"
      (click)="onGoodsCancel()"
    ></app-button>
    <app-button
      btnType="submit"
      [type]="'button'"
      [disabled]="!goodsSelectedRows || !goodsSelectedRows.length"
      (click)="confirmGoodsSelection()"
    ></app-button>
  </div>
</app-dialog>
    </form>
  </p-panel>
</div>
