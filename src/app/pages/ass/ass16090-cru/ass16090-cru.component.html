<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="default"
      label="確認審核"
      *ngIf="isEditMode"
    ></app-button>
    <app-button btnType="default" label="作廢" *ngIf="isEditMode"></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="倉別"
            controlName="warehouse"
            [options]="warehouse"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.warehouse"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="申請人"
            controlName="applicantCode"
            [options]="applicantCode"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.applicantCode"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門編號"
            controlName="departmentCode"
            [options]="departmentCode"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.departmentCode"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            [control]="dataForm.controls.applicationDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea
            label="備註"
            controlName="retExp"
            [control]="dataForm.controls.retExp"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>

        <!-- 動態表單欄位... -->
        <app-table-edit
          tableKey="ASS16090Detail"
          class="col-12"
          [data]="data"
          [columns]="columns"
          [showCheckBox]="true"
          (delete)="onDelete($event)"
          (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows"
          [showCheckBox]="!isFormReadable"
          (dataChange)="data = $event"
          [disabled]="isFormReadable"
          [tableRequired]="true"
        ></app-table-edit>
      </div>
      <div class="pt-1"></div>
    </form>
    <div class="col pt-4">
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="resetTable()"
        ></app-button>
        <app-button
          btnType="submit"
          (clickEvent)="submitForm(dataForm)"
        ></app-button>
      </div>
    </div>
  </p-panel>
</div>
