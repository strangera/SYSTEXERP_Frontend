<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="default" label="轉入財資廠商" icon="pi pi-download"
      (click)="onImportFinancialVendors()" [disabled]="selectedItems.length === 0"
      [loading]="btnImportLoading"></app-button>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="建檔日期" [startControl]="qf().crtDateS"
              [endControl]="qf().crtDateE" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="接洽人員" controlName="prStaffId" [options]="staffOptions()" optionLabel="label"
              optionValue="value" [control]="qf().prStaffId" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商統一編號" controlName="vendorId" [options]="vendorOptions()" optionLabel="label"
              optionValue="value" [control]="qf().vendorId" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="營運模式" groupname="mangerType" [control]="qf().mangerType"
              [options]="mangerTypeOptions" [submitted]="submitted"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商名稱(中文)/簡稱" controlName="vendorName" [control]="qf().vendorName"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商名稱(英文)/簡稱" controlName="vendorNameE" [control]="qf().vendorNameE"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人" controlName="contactStaff" [control]="qf().contactStaff"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人電話" controlName="contactTel" [control]="qf().contactTel"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人職稱" controlName="contactTitle" [control]="qf().contactTitle"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人傳真" controlName="contactFax" [control]="qf().contactFax"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人行動電話" controlName="contactMobilePhone" [control]="qf().contactMobilePhone"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="聯絡人電子郵件" controlName="contactEmail" [control]="qf().contactEmail"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="公司地址" controlName="companyAddress" [control]="qf().companyAddress"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="公司負責人" controlName="chargeStaff" [control]="qf().chargeStaff"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="付款方式" groupname="payType" [control]="qf().payType" [options]="payTypeOptions"
              [submitted]="submitted"></app-radiobutton>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="票期" controlName="ticketPeriod" [control]="qf().ticketPeriod"
              [submitted]="submitted" keyFilter="num"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="服務項目" controlName="serviceItems" [control]="qf().serviceItems"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="備註" controlName="notes" [control]="qf().notes"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" [dataKey]="'ID'" [tableKey]="'ASS11070_Data'" [columns]="columns"
      [totalRecords]="totalRecords()" [showCheckBox]="true" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showDelete]="false" [lazy]="false"
      [loading]="tableLoading()" [lastQueryBody]="lastQueryBody" [queryFunction]="queryFunction" (edit)="onEdit($event)"
      (detail)="onDetail($event)">
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" [loading]="btnPDFLoading"
            (click)="onExportPDF()" [disabled]="tableData().length === 0"></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
