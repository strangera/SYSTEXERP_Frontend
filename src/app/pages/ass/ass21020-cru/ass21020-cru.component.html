<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="能源類型"
                      controlName="ENG_Type"
                      [showClear]="!1"
                      [options]="service.engTypeSignal()"
                      optionLabel="Name"
                      optionValue="No"
                      [control]="df().ENG_Type"
                      [submitted]="submitted"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="錶號"
                      controlName="ENG_MeterNo"
                      [showClear]="!1"
                      [options]="filteredMeterNo()"
                      optionLabel="ENG_MeterNo"
                      optionValue="ENG_MeterNo"
                      [control]="df().ENG_MeterNo"
                      [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="設備位置編號"
                        controlName="Location_No"
                        [control]="df().Location_No"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="樓層編號"
                        controlName="floor_no"
                        [control]="df().floor_no"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="樓層名稱"
                        controlName="floor_name"
                        [control]="df().floor_name"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="館別編號"
                        controlName="Building_No"
                        [control]="df().Building_No"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="館別名稱"
                        controlName="Building_Name"
                        [control]="df().Building_Name"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="平面圖X座標"
                        controlName="x_coord"
                        [control]="df().x_coord"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="平面圖Y座標"
                        controlName="y_coord"
                        [control]="df().y_coord"
                        [disabled]="!0"
                        [submitted]="submitted"></app-input-text>
      </div>


      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"
                    (click)="onKancel()"></app-button>
        <app-button btnType="submit"
                    [loading]="loading"
                    [disabled]="!canSave()"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>


<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="資料"
               class="line-height-3 m-0 mb-3">
        <app-table #tb
                   [showDetail]="!1"
                   [showEdit]="!1"
                   [alwaysEdit]="!0"
                   [alwaysBlurValidate]="!0"
                   [showCheckBox]="!isFormReadable"
                   [showRowEdit]="!0"
                   [showManage]="!0"
                   [showHeader]="!0"
                   [showInsert]="!isFormReadable"
                   [insertRowData]="!0"
                   [data]="filteredData()"
                   [totalRecords]="totalRecords()"
                   (delete)="onDelete($event)"
                   (fieldChange)="onFieldChange($event)"
                   [rowEditCanSave]="rowEditCanSave()"
                   (rowEditInit)="onRowInit()"
                   (rowEditSave)="onRowEdit($event)"
                   (rowEditCancel)="onRowEdit($event)"
                   [loading]="service.tableLoading()"
                   dataKey="Apply_No"
                   tableKey="ASS21020_detail"
                   [columns]="columns">
          @if (!isFormReadable) {
          <header>
            <div class="flex justify-content-end w-full border-1 surface-border p-2">
              <app-button label="自動依面積計算比率"
                          (click)="onAutoCalculate()"></app-button>
            </div>
          </header>
          }
        </app-table>
      </p-panel>
    </div>
  </div>
</div>
