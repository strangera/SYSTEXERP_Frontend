<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="錶號"
                        controlName="ENG_MeterNo"
                        [options]="service.engMeterNoSignal()"
                        optionLabel="ENG_MeterNo"
                        optionValue="ENG_MeterNo"
                        [control]="df().ENG_MeterNo"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="設備位置編號"
                          controlName="Location_No"
                          [control]="df().Location_No"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓層編號"
                          controlName="floor_no"
                          [control]="df().floor_no"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓層名稱"
                          controlName="floor_name"
                          [control]="df().floor_name"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="d-none lg:col-6"></div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓別編號"
                          controlName="floor_cat_no"
                          [control]="df().floor_cat_no"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓別名稱"
                          controlName="floor_cat_name"
                          [control]="df().floor_cat_name"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="d-none lg:col-6"></div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="平面圖X座標"
                          controlName="x_coord"
                          [control]="df().x_coord"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="平面圖Y座標"
                          controlName="y_coord"
                          [control]="df().y_coord"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable"
           class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"
                    (click)="onClear()"></app-button>
        <!-- <app-button btnType="submit"
                    [loading]="loading"></app-button> -->
      </div>
    </form>
  </p-panel>
</div>


<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="資料"
               class="line-height-3 m-0 mb-3">
        <app-table [showCheckBox]="true"
                   [showDetail]="false"
                   [showRowEdit]="true"
                   [showInsert]="dataForm.valid"
                   [insertRowData]="dataForm.valid"
                   [showExcel]="false"
                   (exportExcel)="onExportExcel()"
                   (importExcel)="onImportExcel($event)"
                   [data]="service.tltNoSignal()"
                   (selectionChange)="onSelectionChange($event)"
                   [totalRecords]="totalRecords()"
                   (rowEditInit)="onRowEditInit($event)"
                   (rowEditSave)="onRowEdit($event)"
                   (lazyLoadData)="onLazyLoadData($event, dataForm); onSubmit()"
                   [lazy]="true"
                   [loading]="loading"
                   [dataKey]="'TLT_No'"
                   [tableKey]="'ASS21020_detail'"
                   [columns]="columns">
          <header>
            <div class="flex align-items-center justify-content-between w-full border-1 surface-border p-2">
              <div></div>
              <app-button label="自動依面積計算比率"
                          (click)="onAutoCalculate()"></app-button>
            </div>
          </header>
        </app-table>
      </p-panel>
    </div>
  </div>
</div>
