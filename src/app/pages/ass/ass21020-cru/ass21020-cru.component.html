<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="能源類型" controlName="ENG_Type" [showClear]="!1"
          [options]="ENG_TypeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.ENG_Type"
          [submitted]="submitted"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="錶號" controlName="ENG_MeterNo"
          [options]="filteredENG_MeterNoOptions" optionLabel="ENG_MeterNo" optionValue="ENG_MeterNo"
          [control]="dataForm.controls.ENG_MeterNo" [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="設備位置編號" controlName="Location_No"
          [control]="dataForm.controls.Location_No" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="樓層編號" controlName="Floor_No"
          [control]="dataForm.controls.Floor_No" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="樓層名稱" controlName="Floor_Desc"
          [control]="dataForm.controls.Floor_Desc" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="館別編號" controlName="building_No"
          [control]="dataForm.controls.building_No" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="館別名稱" controlName="building_DESC"
          [control]="dataForm.controls.building_DESC" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="平面圖X座標" controlName="Draw_X"
          [control]="dataForm.controls.Draw_X" [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="平面圖Y座標" controlName="Draw_Y"
          [control]="dataForm.controls.Draw_Y" [submitted]="submitted"></app-input-text>
      </div>
      <hr />
      <app-table-edit [data]="data" dataStatusField="status" (dataChange)="data = $event" [loading]="loading"
        tableKey="ASS21020_detail" [columns]="columns" (selectionChange)="selectedItems = $event"
        [rowValidate]="validateRow" (fieldChange)="fieldChange()" [showInsert]="!isFormReadable"
        (insert)="dialogVisible = true" [selectedItems]="selectedItems" (dataChange)="data = $event"
        [tableRequired]="true" [disabled]="isFormReadable" [canInsert]="false">
        <header>
          <div class="flex justify-content-between align-items-center w-full">
            <div>
              <span *ngIf="errorMsg" class="font-bold text-red-600">比率加總必須為100%，目前加總為: {{ totalPercent }} %</span>
            </div>
            <p-button *ngIf="!isFormReadable" label="自動依面積計算比率" (click)="onAutoCalculate()"
              [disabled]="data.length === 0"></p-button>
          </div>
        </header>
      </app-table-edit>
      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>
<app-dialog [visible]="dialogVisible" header="選擇專櫃" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm">
    <div class="grid p-fluid">
      <app-input-text class="col-3" label="專櫃編號" controlName="TltNo" [control]="dialogQueryForm.controls.TltNo" />
      <app-input-text class="col-3" label="櫃位名稱" controlName="TltName" [control]="dialogQueryForm.controls.TltName" />
      <app-input-text class="col-3" label="位置編號" controlName="LocationNo"
        [control]="dialogQueryForm.controls.LocationNo" />
      <app-input-text class="col-3" label="招募編號" controlName="ApplyNo" [control]="dialogQueryForm.controls.ApplyNo" />
    </div>
  </form>
  <app-table-report tableKey="Ass21020CruDialogTable" dataKey="TalentId" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [totalRecords]="totalRecords" [loading]="dialogLoading">
  </app-table-report>
</app-dialog>
