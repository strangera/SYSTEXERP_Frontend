<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="錶號"
                        controlName="ENG_MeterNo"
                        [options]="service.engMeterNoSignal()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().ENG_MeterNo"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="設備位置編號"
                          controlName="Location_No"
                          [control]="df().Location_No"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓層編號"
                          controlName="floor_no"
                          [control]="df().floor_no"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓層名稱"
                          controlName="floor_name"
                          [control]="df().floor_name"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="d-none lg:col-6"></div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓別編號"
                          controlName="floor_cat_no"
                          [control]="df().floor_cat_no"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="樓別名稱"
                          controlName="floor_cat_name"
                          [control]="df().floor_cat_name"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="d-none lg:col-6"></div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="平面圖X座標"
                          controlName="x_coord"
                          [control]="df().x_coord"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="平面圖Y座標"
                          controlName="y_coord"
                          [control]="df().y_coord"
                          [disabled]="true"
                          [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="clear"
                    (click)="onClear()"
                    *ngIf="!isFormReadable"></app-button>
        <app-button btnType="submit"
                    (click)="onSubmit()"
                    *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>


<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="資料"
               class="line-height-3 m-0 mb-3">
        <app-table [showCheckBox]="false"
                   [showEdit]="false"
                   [showDetail]="false"
                   [showDelete]="false"
                   [showManage]="false"
                   [showReportMode]="false"
                   [isRowSelectable]="service.isRowSelectable"
                   [showExcel]="isFormEditable"
                   (exportExcel)="onExportExcel()"
                   (importExcel)="onImportExcel($event)"
                   [data]="service.ASS21020Detail()"
                   [dataKey]="'tlt_no'"
                   [tableKey]="'ASS21020_detail'"
                   [columns]="columns">
        </app-table>
      </p-panel>
    </div>
  </div>
</div>
