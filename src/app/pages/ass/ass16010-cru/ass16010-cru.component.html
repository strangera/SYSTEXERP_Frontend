<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="倉別"
            controlName="whCategory "
            [options]="whCategory"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.whCategory"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton
            label="盤點類型"
            [control]="dataForm.controls.invType"
            [options]="invType"
          ></app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="中分類"
            controlName="categoryOptions "
            [options]="categoryOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.categoryOptions"
          ></app-dropdown>
        </div>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
