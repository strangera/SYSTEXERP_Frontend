<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="倉別" controlName="whCategory " [options]="whCategory" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.whCategory" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="盤點類型" [control]="dataForm.controls.invType" [options]="invType"
            [submitted]="submitted">
          </app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="中分類" controlName="categoryOptions " [options]="categoryOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.categoryOptions" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>

    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
