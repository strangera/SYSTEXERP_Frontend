<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
          <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- <div class="col-12 md:col-6 lg:col-4">
              <app-radiobutton
                label="資料顯示"
                [control]="queryForm.controls.Querybystatus"
                [options]="Querybystatus"
                [submitted]="submitted"
              >
              </app-radiobutton>
            </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="統計日期" [startControl]="queryForm.controls.Sdate"
              [endControl]="queryForm.controls.Edate" [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代號" controlName="Departmentcode" [options]="Departmentcode" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Departmentcode" [submitted]="submitted"></app-dropdown>
          </div>



          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼" controlName="bigCategoryCode" [options]="bigCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.bigCategoryCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼" controlName="midCategoryCode" [options]="midCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.midCategoryCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼" controlName="smallCategoryCode" [options]="smallCategoryOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.smallCategoryCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品項編號" controlName="Itemnumber" [options]="Itemnumber" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Itemnumber" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-table>
  </div>
</div>
