<div class="card">
  <div class="flex justify-content-between gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="產生結算報表" [loading]="loading" [disabled]="!hasPermission(Actions.Print)"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="結算年月" controlName="ENG_YYMM"
            [control]="queryForm.controls.ENG_YYMM" [submitted]="submitted" calendarType="dateMonthOne" />
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="能源類型" controlName="ENG_Type"
            [control]="queryForm.controls.ENG_Type" [submitted]="submitted" [options]="ENG_TypeOptions"
            optionLabel="label" optionValue="value" [filter]="false" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button label="結算" [loading]="loading" (click)="onGenerateReport(queryForm)"
            [disabled]="!hasPermission(Actions.Settle)"></app-button>
          <app-button label="取消結算" [loading]="loading" (click)="onCancelClearing(queryForm)"
            [disabled]="!hasPermission(Actions.CancelSettle)"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
