<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      label="{{ '登入' }}"
      (click)="onCreate()"
    ></app-button>
    <app-button
      btnType="create"
      label="{{ '盤後調整' }}"
      (click)="onCreate()"
    ></app-button>
    <app-button
      btnType="create"
      label="{{ '盤後查詢' }}"
      (click)="onCreate()"
    ></app-button>
    <app-button
      btnType="create"
      label="{{ '盤點報表' }}"
      (click)="onCreate()"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="盤點單號"
              controlName="Inventoryordernumber"
              [control]="queryForm.controls.Inventoryordernumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="盤點狀態"
              controlName="Inventorystatus"
              [options]="Inventorystatus"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Inventorystatus"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="盤點日期"
              [startControl]="queryForm.controls.SInventorydate"
              [endControl]="queryForm.controls.EInventorydate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="結案日期"
              [startControl]="queryForm.controls.SClosingdate"
              [endControl]="queryForm.controls.EClosingdate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="盤點人員"
              controlName="Counter"
              [options]="usercode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Counter"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="說明"
              controlName="illustrate"
              [control]="queryForm.controls.illustrate"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="報表型態"
              [control]="queryForm.controls.Reporttype"
              [options]="Reporttype"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      tableKey="ASS16020"
      dataKey="inventoryNumber"
      [data]="data"
      [columns]="columns"
      [loading]="loading"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showCheckBox]="true"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
