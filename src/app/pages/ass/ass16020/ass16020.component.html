<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      label="{{ '登入' }}"
      (clickEvent)="onCreate(queryForm)"
    ></app-button>
    <app-button
      btnType="edit"
      label="{{ '盤後調整' }}"
      (clickEvent)="onAdjust(queryForm)"
    ></app-button>
    <app-button
      btnType="query"
      label="盤後查詢"
      (clickEvent)="onQueryDialog(queryForm)"
    ></app-button>
    <app-button
      btnType="report"
      label="{{ '盤點報表' }}"
      (clickEvent)="goReport(queryForm)"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="盤點單號"
              controlName="INV_ID"
              [control]="queryForm.controls.INV_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="盤點狀態"
              controlName="INV_STATUS"
              [options]="INV_STATUS"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.INV_STATUS"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="盤點日期"
              [startControl]="queryForm.controls.INV_DATE_FROM"
              [endControl]="queryForm.controls.INV_DATE_TO"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="結案日期"
              [startControl]="queryForm.controls.CLOSE_DATE_FROM"
              [endControl]="queryForm.controls.CLOSE_DATE_TO"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="盤點人員"
              controlName="EMP_ID"
              [options]="EMP_ID()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="說明"
              controlName="NOTES"
              [control]="queryForm.controls.NOTES"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="報表型態"
              [control]="queryForm.controls.REPORT_TYPE"
              [options]="REPORT_TYPE"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS16020"
      dataKey="INV_ID"
      [data]="data"
      [columns]="columns"
      [loading]="loading"
      [totalRecords]="totalRecords()"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showCheckBox]="true"
      [editDisabled]="editDisabled"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      (delete)="onDelete($event)"
    ></app-table-report>
  </div>
</div>

<!-- 盤後查詢 Dialog -->
<p-dialog
  header="盤後查詢"
  [(visible)]="arDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90vw', maxWidth: '1200px' }"
>
  <app-table-report
    tableKey="ASS16020_Query_Dialog"
    dataKey="INV_ID"
    [data]="QueryDialogData"
    [columns]="QueryDialogColumns"
    [loading]="loading"
    [totalRecords]="totalDialogRecords()"
    [showManage]="false"
    [showReportMode]="false"
    [showDelete]="false"
  ></app-table-report>
</p-dialog>
