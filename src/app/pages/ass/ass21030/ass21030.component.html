<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="create"
                  (click)="onCreate()"></app-button>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne"
                          label="結算年月"
                          controlName="settlement_date"
                          [control]="qf().settlement_date"
                          [submitted]="submitted">
            </app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="能源類型"
                          controlName="eng_type"
                          [options]="service.engTypeSignal()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="qf().eng_type"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="能源錶號"
                          controlName="eng_meterNo"
                          [options]="service.engMeterNoSignal()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="qf().eng_meterNo"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="結算狀態"
                          controlName="settlement_status"
                          [options]="service.settlementStatusSignal()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="qf().settlement_status"
                          [submitted]="submitted"></app-dropdown>
          </div>

<div class="card">
