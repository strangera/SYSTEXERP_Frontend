<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="中分類代碼"
                        controlName="CLASS_ID"
                        [control]="df().CLASS_ID"
                        [disabled]="isFormReadable"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="中分類名稱"
                        controlName="CLASS_NAME"
                        [control]="df().CLASS_NAME"
                        [disabled]="isFormReadable"
                        [submitted]="submitted"></app-input-text>
      </div>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="大分類代碼"
                      controlName="B_CLASS_ID"
                      [options]="bigClassOptions()"
                      optionLabel="label"
                      optionValue="value"
                      [control]="df().B_CLASS_ID"
                      [disabled]="isFormReadable"
                      [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="大分類名稱"
                        controlName="B_CLASS_NAME"
                        [control]="df().B_CLASS_NAME"
                        [disabled]="true"
                        [submitted]="submitted"></app-input-text>
      </div>
      <div class="grid p-fluid">
        <app-input-textarea class="col-12"
                            label="說明"
                            controlName="NOTES"
                            [control]="df().NOTES"
                            [readonly]="isFormReadable"
                            [submitted]="submitted"></app-input-textarea>
      </div>
      @if (!isFormReadable) {
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
