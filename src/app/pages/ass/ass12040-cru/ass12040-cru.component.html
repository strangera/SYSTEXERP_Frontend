<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
    <app-button
      label="審核確認"
      (click)="onApproveConfirm()"
    ></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm">
      <h5>採購主檔資料</h5>
      <div class="grid p-fluid">
        <div class="col-12">
          <app-input-textarea
            class="w-full"
            label="採購案說明"
            controlName="remark"
            [control]="df().remark"
            [rows]="5"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>
      </div>
      <hr />
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="採購單號"
            controlName="purchaseNumber"
            [control]="df().purchaseNumber"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="採購單狀態"
            controlName="paperStatus"
            [options]="paperStatusOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().paperStatus"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="供應商編號"
            controlName="supplierCode"
            [options]="supplierCodeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().supplierCode"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="申請人編號"
            controlName="applicantCode"
            [options]="applicantCodeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().applicantCode"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門代號"
            controlName="organizationNumber"
            [options]="orgIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().organizationNumber"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            [control]="df().applicationDate"
            [submitted]="submitted"
            [disabled]="true"
          ></app-calendar>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="false"
            label="未稅總金額"
            controlName="noTaxAmount"
            [control]="df().noTaxAmount"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="false"
            label="稅額"
            controlName="taxAmount"
            [control]="df().taxAmount"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="false"
            label="含稅總金額"
            controlName="totalTaxAmount"
            [control]="df().totalTaxAmount"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
      </div>
      <hr />
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="品項編號"
            controlName="itemCode"
            [options]="itemCodeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().itemCode"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="品項數量"
            controlName="itemNumber"
            [control]="df().itemNumber"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="單價(未稅)"
            controlName="singlePrice"
            [control]="df().singlePrice"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="總金額(未稅)"
            controlName="totalPrice"
            [control]="df().totalPrice"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="倉別"
            controlName="storage"
            [options]="storageOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().storage"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="委託部門"
            controlName="department"
            [options]="orgIdOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="df().department"
            [submitted]="submitted"
            [disabled]="true"
          ></app-dropdown>
        </div>
      </div>
      <hr />
      <div class="grid p-fluid">
        <div class="col-12">
          <app-input-textarea
            class="w-full"
            label="說明"
            controlName="itemRemark"
            [control]="df().itemRemark"
            [rows]="5"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>
      </div>
    </form>
  </p-panel>
</div>
