<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="倉別"
                          controlName="WH_ID"
                          [control]="qf().WH_ID"
                          [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="倉別名稱"
                          controlName="WH_NAME"
                          [control]="qf().WH_NAME"
                          [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="部門代號"
                        controlName="ATT_ORG_ID"
                        [options]="organizationOptions"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().ATT_ORG_ID"
                        [submitted]="submitted"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="備註"
                          controlName="NOTES"
                          [control]="qf().NOTES"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()"
                      dataKey="_pk"
                      tableKey="ASS11100_Data"
                      [columns]="columns"
                      [totalRecords]="totalRecords()"
                      [loading]="tableLoading()"
                      [lastQueryBody]="lastQueryBody"
                      [queryFunction]="queryFunction"
                      [showCheckBox]="true"
                      [selectedItems]="selectedItems"
                      (selectionChange)="selectedItems = $event"
                      (edit)="onEdit($event)"
                      (detail)="onDetail($event)"
                      (delete)="onDelete($event)"
                      [isRowSelectable]="isRowSelectable"></app-table-report>
  </div>
</div>
