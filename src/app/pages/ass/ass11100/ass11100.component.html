<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="倉別" controlName="storageType"
                            [control]="queryForm.controls.storageType" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="倉別名稱" controlName="storageName"
                            [control]="queryForm.controls.storageName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="部門代號" controlName=" organizationNumber"
                            [options]="organizationNumberOptions" optionLabel="label" optionValue="value"
                            [control]="queryForm.controls.organizationNumber" [submitted]="submitted"></app-dropdown>
                    </div>
                </div>
                <app-editor-text label="備註" controlName="remark" [control]="queryForm.controls.remark"
                    [style]="{ height: '100px' }" [submitted]="submitted">
                </app-editor-text>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
