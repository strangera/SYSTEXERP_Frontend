<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (isFormCreateable) {
      <app-button
        btnType="query"
        label="套用請購申請單"
        [loading]="applyListLoading || loading"
        (click)="openApplyDialog()"
      ></app-button>
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="供應商編號"
            controlName="SUPPLIER_ID"
            [control]="dataForm.controls.SUPPLIER_ID"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="報價期限"
            [control]="dataForm.controls.EXPDATE"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="說明"
            controlName="NOTES"
            [control]="dataForm.controls.NOTES"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <hr />
      <app-table-edit
        #tableEdit
        class="col-12"
        tableKey="ASS12020Detail"
        [columns]="editColumns"
        [data]="data"
        (dataChange)="data = $event"
        (insert)="onTableInsert()"
        [tableRequired]="true"
        [disabled]="isFormReadable"
        [showInsert]="false"
        [showDelete]="!isFormReadable"
        [canInsert]="true"
      ></app-table-edit>
    </form>
    @if (!isFormReadable) {
      <div class="col pt-4">
        <div class="grid justify-content-end gap-2">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button
            btnType="submit"
            [loading]="loading"
            (click)="onSubmit()"
          ></app-button>
        </div>
      </div>
    }
  </p-panel>
</div>

<app-dialog
  [(visible)]="displayApplyDialog"
  header="選擇請購申請單"
  [disable]="!selectedApplyRow"
  [loading]="applyListLoading"
  (save)="onApplyConfirm()"
>
  <div
    [style]="{ 'min-height': '50vh', 'max-height': '75vh' }"
    class="mt-3 mb-3"
  >
    <app-table
      [showReportMode]="false"
      [showCaption]="false"
      [showHeader]="false"
      [showManage]="false"
      [showDelete]="false"
      [showCheckBox]="true"
      [selectionMode]="'single'"
      dataKey="NEED_ID"
      [data]="applyListData"
      [columns]="applyListColumns"
      [selectedItems]="selectedApplyRow ? [selectedApplyRow] : []"
      (selectionChange)="onApplySelectionChange($event)"
      [totalRecords]="applyTotalRecords"
      [lazy]="true"
      (lazyLoadData)="onApplyLazyLoad($event)"
      [loading]="applyListLoading"
      [rows]="30"
    ></app-table>
  </div>
</app-dialog>
