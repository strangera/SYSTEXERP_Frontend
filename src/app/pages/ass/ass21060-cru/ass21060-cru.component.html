<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="能源類型" controlName="Energytype" [options]="Energytype" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Energytype" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="最大度數" controlName="maxDegree" [control]="dataForm.controls.maxDegree"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="單價" controlName="unitPrice" [control]="dataForm.controls.unitPrice"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="秏損率" controlName="WR" [control]="dataForm.controls.WR" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateMonthOne" label="起算年月" controlName="SDMY" [control]="dataForm.controls.SDMY"
            [submitted]="submitted">
          </app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark" [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p> {{ i + 1 }}</p>
            </div>
            <div>

            </div>
          </div>
          <div class="grid p-fluid">

          </div>

          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">

      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
