<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="供應商代碼/名稱"
          controlName="SUPPLIER_ID"
          [options]="SUPPLIER_ID_Options"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.SUPPLIER_ID"
          [submitted]="submitted"
        ></app-dropdown>
        <!-- <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="付款天數"
          controlName="TICKET_BE"
          [control]="dataForm.controls.TICKET_BE"
          [submitted]="submitted"
        ></app-input-number> -->
      </div>
      <!-- <div class="grid p-fluid">
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="未稅金額"
          controlName="NTX_AMT"
          [control]="dataForm.controls.NTX_AMT"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="稅額"
          controlName="TX_AMT"
          [control]="dataForm.controls.TX_AMT"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="含稅金額"
          controlName="AMT"
          [control]="dataForm.controls.AMT"
          [submitted]="submitted"
        ></app-input-number>
      </div> -->
      <hr />
      <div class="grid p-fluid">
        <app-table-edit
          title="發票資料"
          class="col-12"
          [columns]="supplierColumn"
          [data]="supplierData"
          [loading]="loading"
          [defaultInsertData]="defaultsupplier"
          (dataChange)="onSupplierDataChange($event)"
          [canInsert]="supplierData.length < 1"
          [rowValidate]="validateSupplierRow"
        ></app-table-edit>
        <app-table-edit
          title="單據資料"
          class="col-12"
          [columns]="itemColumn"
          [data]="itemData"
          [loading]="loading"
          (dataChange)="onItemDataChange($event)"
          [rowValidate]="validateItemRow"
          [showFooter]="true"
        ></app-table-edit>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="clearSubForm()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
