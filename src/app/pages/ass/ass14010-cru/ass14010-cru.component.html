<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="供應商編號"
          controlName="supplierId"
          [options]="supplierId_Options"
          optionLabel="Label"
          optionValue="No"
          [control]="dataForm.controls.supplierId"
          [submitted]="submitted"
        ></app-dropdown>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="付款天數"
          controlName="payDays"
          [control]="dataForm.controls.payDays"
          [submitted]="submitted"
        ></app-input-number>
      </div>
      <div class="grid p-fluid">
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="總金額"
          controlName="totalAmount"
          [control]="dataForm.controls.totalAmount"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="未稅金額"
          controlName="NTAX_AMT"
          [control]="dataForm.controls.NTAX_AMT"
          [submitted]="submitted"
        ></app-input-number>
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="稅額"
          controlName="TAX_AMT"
          [control]="dataForm.controls.TAX_AMT"
          [submitted]="submitted"
        ></app-input-number>
      </div>
      <hr />
      <div class="grid p-fluid">
        <app-table-edit
          title="單據資料"
          class="col-12"
          [columns]="serialColumn"
          [data]="serialData"
          [loading]="loading"
          (dataChange)="serialData = $event"
        ></app-table-edit>
        <app-table-edit
          title="發票資料"
          class="col-12"
          [columns]="invoiceColumn"
          [data]="invoiceData"
          [loading]="loading"
          (dataChange)="invoiceData = $event"
        ></app-table-edit>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="clearSubForm()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
