<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="統計年月"
              controlName="DATE_YM"
              [control]="queryForm.controls.DATE_YM"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="GOODS_ID"
              [options]="goodsIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.GOODS_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代碼"
              controlName="ACC_NO"
              [options]="accNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ACC_NO"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="ASS17110_Data"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      [loading]="loading"
      [lazy]="false"
      [allowMultilineHeader]="true"
      [showReorder]="false"
      [showManage]="false"
      [showDelete]="false"
      [showReportMode]="false"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            label="匯出 PDF"
            icon="pi pi-file-pdf"
            (click)="onExportPdf()"
            [disabled]="loading || exportPdfLoading || exportExcelLoading || data.length === 0"
            [loading]="exportPdfLoading"
          ></p-button>
          <p-button
            label="匯出 XLSX"
            icon="pi pi-file-excel"
            (click)="onExportExcel()"
            [disabled]="loading || exportPdfLoading || exportExcelLoading || data.length === 0"
            [loading]="exportExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
