<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                  </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="調出倉別"
              controlName="outWarehouse"
              [options]="Kurabe"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.outWarehouse"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="調入倉別"
              controlName="inWarehouse"
              [options]="Kurabe"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.inWarehouse"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="調撥單狀態"
              controlName="transferStatus"
              [options]="status"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.transferStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="調撥單號"
              controlName="transferNote"
              [control]="queryForm.controls.transferNote"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="申請人代號"
              controlName="applicantCode"
              [options]="usercode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.applicantCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品項編號"
              controlName="itemCode"
              [options]="itemCode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.itemCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門代號"
              controlName="departmentCode"
              [options]="departmentCode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.departmentCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="申請日期"
              [startControl]="queryForm.controls.SApplicationdate"
              [endControl]="queryForm.controls.EApplicationdate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="審核日期"
              [startControl]="queryForm.controls.SApprovalDate"
              [endControl]="queryForm.controls.EApprovalDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="審核者"
              controlName="applicantCode"
              [options]="usercode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.applicantCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="clear" [form]="queryForm"></app-button>
        <app-button
          btnType="query"
          [loading]="loading"
          (clickEvent)="onSubmitQuery(queryForm)"
        ></app-button>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
