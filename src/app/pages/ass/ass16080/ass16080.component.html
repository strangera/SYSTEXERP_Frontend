<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>

  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-4">
            <app-dropdown
              label="調出倉別"
              controlName="OUT_WH_ID"
              [options]="whIdOptions()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.OUT_WH_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-4">
            <app-dropdown
              label="調入倉別"
              controlName="IN_WH_ID"
              [options]="whIdOptions()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.IN_WH_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-4">
            <app-dropdown
              label="調撥狀態"
              controlName="WHMOVE_STATUS"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.WHMOVE_STATUS"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-4">
            <app-input-text
              label="調撥單號"
              controlName="WHMOVE_ID"
              [control]="queryForm.controls.WHMOVE_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-4">
            <app-dropdown
              label="申請人代號"
              controlName="EMP_ID"
              [options]="empIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-4">

                  <app-input-text
              label="品項編號"
              controlName="GOODS_ID"
              [control]="queryForm.controls.GOODS_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-4">
            <app-dropdown
              label="部門代號"
              controlName="ORG_ID"
              [options]="orgIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="申請日期"
              [startControl]="queryForm.controls.APPLY_DATE_S"
              [endControl]="queryForm.controls.APPLY_DATE_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="審核日期"
              [startControl]="queryForm.controls.APRV_DATE_S"
              [endControl]="queryForm.controls.APRV_DATE_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-4">
            <app-dropdown
              label="審核者"
              controlName="APRV_EMP_ID"
              [options]="empIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.APRV_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (click)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card" *ngIf="showTable">
  <app-table-report
    [tableKey]="'ass16080_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="true"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryASS16080ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showDetail]="true"
    (detail)="onDetail($event)"
    [showEdit]="false"
    (edit)="onEdit($event)"
    [addButton]="actionButtons"
    [expansionDataKey]="'Details'"
    [expansionColumns]="expansionColumns"
    [expansionLoadFn]="loadDetailForExpansion"
  ></app-table-report>
</div>
