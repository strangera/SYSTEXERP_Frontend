<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div >
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="清點單號"
              [startControl]="queryForm.controls.CHK_ID_S"
              [endControl]="queryForm.controls.CHK_ID_E"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="清點日期"
              [startControl]="queryForm.controls.CHK_DATE_S"
              [endControl]="queryForm.controls.CHK_DATE_E"
              [submitted]="submitted"
            ></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="清點人代碼"
              controlName="CHK_EMP_ID"
              [options]="userCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CHK_EMP_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產狀態(盤點後)"
              controlName="CHK_STATUS"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CHK_STATUS"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產類別"
              controlName="DEPRE_YN"
              [options]="assetTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.DEPRE_YN"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button
              btnType="clear"
              [form]="queryForm"
              (onClick)="onClearForm()"
            ></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    [data]="data"
    [totalRecords]="totalRecords"
    [columns]="columns"
    [loading]="loading"
    [showReportMode]="false"
    [showManage]="false"
    [showDelete]="false"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          label="匯出資產差異表 PDF"
          icon="pi pi-file-pdf"
          [loading]="btnExportPdfLoading"
          (onClick)="onExportPdf()"
          [disabled]="data.length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
