<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 基本資料區塊 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown *ngIf="isFormCreateable" label="大分類代碼/名稱" controlName="BigCategoryCode"
            [options]="bigCategoryOptions" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.BigCategoryCode" [submitted]="submitted">
          </app-dropdown>
          <app-input-text *ngIf="!isFormCreateable" label="大分類代碼/名稱" controlName="BigCategoryName"
            [control]="dataForm.controls.BigCategoryName" [disabled]="true" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown *ngIf="isFormCreateable" label="中分類代碼/名稱" controlName="MidCategoryCode"
            [options]="midCategoryOptions" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.MidCategoryCode" [submitted]="submitted">
          </app-dropdown>
          <app-input-text *ngIf="!isFormCreateable" label="中分類代碼/名稱" controlName="MidCategoryName"
            [control]="dataForm.controls.MidCategoryName" [disabled]="true" [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

      <!-- 採買入帳科目區塊 -->
      <div class="mt-3">
        <p-panel header="採買入帳科目" class="line-height-3 m-0">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="所屬會計科目(借)" controlName="AccountingDebitCode" [options]="accountingOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.AccountingDebitCode"
                [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="所屬會計科目(貸)" controlName="AccountingCreditCode" [options]="accountingOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.AccountingCreditCode"
                [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="進項稅額科目(借)" controlName="InputTaxDebitCode" [options]="accountingOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.InputTaxDebitCode"
                [submitted]="submitted">
              </app-dropdown>
            </div>
          </div>
          <div class="mt-3">
            <app-table-edit [showCheckBox]="isFormCreateable || isFormEditable" [showReorder]="false"
              [disabled]="!isFormCreateable && !isFormEditable" (fieldChange)="onPurchaseAccountFieldChange($event)"
              (dataChange)="onPurchaseAccountDataChange($event)" [data]="purchaseAccountDetails()" [loading]="false"
              [tableKey]="'ASS11090_PurchaseAccount'" [tableRequired]="false"
              [columns]="purchaseAccountColumns()"></app-table-edit>
          </div>
        </p-panel>
      </div>

      <!-- 費用結轉科目區塊 -->
      <div class="mt-3">
        <p-panel header="費用結轉科目" class="line-height-3 m-0">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="費用科目" controlName="ExpenseAccountCode" [options]="accountingOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ExpenseAccountCode"
                [submitted]="submitted">
              </app-dropdown>
            </div>
          </div>
          <div class="mt-3">
            <app-table-edit [showCheckBox]="isFormCreateable || isFormEditable" [showReorder]="false"
              [disabled]="!isFormCreateable && !isFormEditable" (fieldChange)="onExpenseTransferFieldChange($event)"
              (dataChange)="onExpenseTransferDataChange($event)" [data]="expenseTransferDetails()" [loading]="false"
              [tableKey]="'ASS11090_ExpenseTransfer'" [tableRequired]="false"
              [columns]="expenseTransferColumns()"></app-table-edit>
          </div>
        </p-panel>
      </div>

      <!-- 折舊攤提科目區塊 -->
      <div class="mt-3">
        <p-panel header="折舊攤提科目" class="line-height-3 m-0">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="折舊科目(借)" controlName="DepreciationDebitCode" [options]="accountingOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.DepreciationDebitCode"
                [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="累計折舊科目(貸)" controlName="AccumulatedDepreciationCreditCode2"
                [options]="accountingOptions" optionLabel="label" optionValue="value"
                [control]="dataForm.controls.AccumulatedDepreciationCreditCode2" [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="折舊年限" controlName="DepreciationLife" [control]="dataForm.controls.DepreciationLife"
                [submitted]="submitted">
              </app-input-text>
            </div>
          </div>
          <div class="mt-3">
            <app-table-edit [showCheckBox]="isFormCreateable || isFormEditable" [showReorder]="false"
              [disabled]="!isFormCreateable && !isFormEditable" (fieldChange)="onDepreciationFieldChange($event)"
              (dataChange)="onDepreciationDataChange($event)" [data]="depreciationDetails()" [loading]="false"
              [tableKey]="'ASS11090_Depreciation'" [tableRequired]="false"
              [columns]="depreciationColumns()"></app-table-edit>
          </div>
        </p-panel>
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
