<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="default" label="結案" icon="undefined"></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 領用單號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="領用單號"
            controlName="IssueNo"
            [control]="dataForm.controls.IssueNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 部門代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="部門代號"
            controlName="DepartmentCode"
            [control]="dataForm.controls.DepartmentCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 申請人代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="申請人代號"
            controlName="ApplicantCode"
            [control]="dataForm.controls.ApplicantCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 申請日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="申請日期"
            controlName="ApplicationDate"
            [control]="dataForm.controls.ApplicationDate"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 發料日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發料日期"
            controlName="ShippingDate"
            [control]="dataForm.controls.ShippingDate"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 驗收單狀態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="驗收單狀態"
            controlName="ReceiptStatus"
            [control]="dataForm.controls.ReceiptStatus"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 明細筆數 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="明細筆數"
            controlName="DetailCount"
            [control]="dataForm.controls.DetailCount"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 動態表單欄位... -->
        <app-table-edit
          tableKey="ASS16050Detail"
          class="col-12"
          [data]="data"
          [columns]="columns"
          [showCheckBox]="true"
          (delete)="onDelete($event)"
          (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows"
          [showCheckBox]="!isFormReadable"
          (dataChange)="data = $event"
          [disabled]="isFormReadable"
          [tableRequired]="true"
        ></app-table-edit>
      </div>
    </form>

    <!-- 提交和取消按鈕 -->
    <div class="col pt-4">
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" (click)="resetTable()"></app-button>
        <app-button
          btnType="submit"
          (click)="submitForm(dataForm)"
        ></app-button>
      </div>
    </div>
  </p-panel>
</div>
