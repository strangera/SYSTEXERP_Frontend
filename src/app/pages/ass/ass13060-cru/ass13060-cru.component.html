<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (isFormEditable) {
      <app-button
        icon="pi pi-verified"
        label="審核確認"
        (click)="onApprove()"
      ></app-button>
    }
    @if (isFormCreateable) {
      <app-button
        btnType="query"
        label="批次新增品項"
        (click)="openDialog()"
      ></app-button>
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="固資重估單編號"
          controlName="ASSET_EVAL_ID"
          [control]="dataForm.controls.ASSET_EVAL_ID"
          [submitted]="submitted"
        ></app-input-text>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="申請人員代碼/名稱"
          controlName="EMP_ID"
          [options]="empIdOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.EMP_ID"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="部門代碼/名稱"
          controlName="ORG_ID"
          [options]="orgIdOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.ORG_ID"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="申請日期"
          [control]="dataForm.controls.APPLY_DATE"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="固資重估說明"
          controlName="NOTES"
          [control]="dataForm.controls.NOTES"
          [submitted]="submitted"
        ></app-input-text>
      </div>
      <hr />
      <app-table-edit
        [data]="data"
        (dataChange)="data = $event"
        [loading]="loading"
        tableKey="ASS13060_detail"
        [columns]="columns"
        (selectionChange)="selectedItems = $event"
        [showInsert]="false"
        [showReorder]="isFormCreateable || isFormEditable"
        (insert)="openDialog()"
        [selectedItems]="selectedItems"
        [tableRequired]="true"
        [disabled]="isFormReadable"
        [canInsert]="false"
        [showDelete]="!isFormReadable"
      ></app-table-edit>
      <ng-container *ngIf="!isFormReadable">
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="cancel"
            [form]="dataForm"
            (clickEvent)="onReset()"
          ></app-button>
          <app-button
            btnType="submit"
            label="儲存"
            [loading]="loading"
            [disabled]="!canSave()"
          ></app-button>
        </div>
      </ng-container>
    </form>
  </p-panel>
</div>

<app-dialog
  [visible]="dialogVisible"
  header="資產查詢列表"
  (visibleChange)="dialogVisible = $event"
  (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0"
>
  <form [formGroup]="dialogQueryForm">
    <div class="grid p-fluid">
      <app-input-text
        class="col-12 md:col-6 lg:col-4"
        label="資產編號"
        controlName="ASSET_ID"
        [control]="dialogQueryForm.controls.ASSET_ID"
      ></app-input-text>
      <app-input-text
        class="col-12 md:col-6 lg:col-4"
        label="品項名稱"
        controlName="GOODS_NAME"
        [control]="dialogQueryForm.controls.GOODS_NAME"
      ></app-input-text>
      <app-dropdown
        class="col-12 md:col-6 lg:col-4"
        label="大分類編號"
        controlName="B_CLASS_ID"
        [options]="bClassOptions"
        optionLabel="label"
        optionValue="value"
        [control]="dialogQueryForm.controls.B_CLASS_ID"
      ></app-dropdown>
      <app-dropdown
        class="col-12 md:col-6 lg:col-4"
        label="中分類編號"
        controlName="M_CLASS_ID"
        [options]="mClassOptions"
        optionLabel="label"
        optionValue="value"
        [control]="dialogQueryForm.controls.M_CLASS_ID"
      ></app-dropdown>
      <app-dropdown
        class="col-12 md:col-6 lg:col-4"
        label="小分類編號"
        controlName="S_CLASS_ID"
        [options]="sClassOptions"
        optionLabel="label"
        optionValue="value"
        [control]="dialogQueryForm.controls.S_CLASS_ID"
      ></app-dropdown>
      <app-dropdown
        class="col-12 md:col-6 lg:col-4"
        label="保管人代碼/名稱"
        controlName="HOLD_EMP_ID"
        [options]="holdEmpIdOptions"
        optionLabel="label"
        optionValue="value"
        [control]="dialogQueryForm.controls.HOLD_EMP_ID"
      ></app-dropdown>
      <app-dropdown
        class="col-12 md:col-6 lg:col-4"
        label="保管單位代碼/名稱"
        controlName="HOLD_ORG_ID"
        [options]="holdOrgIdOptions"
        optionLabel="label"
        optionValue="value"
        [control]="dialogQueryForm.controls.HOLD_ORG_ID"
      ></app-dropdown>
     <app-dropdown
  class="col-12 md:col-6 lg:col-4"
  label="資產狀態"
  controlName="ASSET_STATUS"
  [options]="assetStatusOptions"
  optionLabel="label"
  optionValue="value"
  [control]="dialogQueryForm.controls.ASSET_STATUS"
></app-dropdown>
    </div>
    <div
      class="grid justify-content-end gap-2 m-0 mb-2 border-bottom-1 surface-border pb-3"
    >
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button
        btnType="query"
        [loading]="dialogLoading"
        (click)="onDialogQuery()"
      ></app-button>
    </div>
  </form>
  <app-table-report
    tableKey="ASS13060_AssetDialog"
    [showReportMode]="false"
    [data]="dialogData"
    [columns]="dialogColumns"
    [queryFunction]="assetQueryFunction"
    [showDelete]="false"
    [selectedItems]="selectedItemsDialog"
    [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event"
    [showManage]="false"
    [showCheckBox]="true"
    [totalRecords]="totalRecords"
    [loading]="dialogLoading"
    [lastQueryBody]="lastQueryBody"
  ></app-table-report>
</app-dialog>
