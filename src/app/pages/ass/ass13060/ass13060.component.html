<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="固資重估單編號" controlName="ASSET_EVAL_ID"
            [control]="qf().ASSET_EVAL_ID" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="商品管理編號" controlName="GOODS_ID"
            [control]="qf().GOODS_ID" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人員代碼/名稱" controlName="EMP_ID"
            [options]="empIdOptions()" optionLabel="label" optionValue="value" [control]="qf().EMP_ID"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="部門代碼/名稱" controlName="ORG_ID" [options]="orgIdOptions()"
            optionLabel="label" optionValue="value" [control]="qf().ORG_ID" [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="申請日期" [startControl]="qf().APPLY_DATE_S"
            [endControl]="qf().APPLY_DATE_E" [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請單狀態" controlName="ASSET_EVAL_STATUS"
            [options]="assetEvalStatusOptions()" optionLabel="label" optionValue="value"
            [control]="qf().ASSET_EVAL_STATUS" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="ID" tableKey="ASS13060_Data" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showDelete]="true" [showReportMode]="false" [showCheckBox]="true"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onBatchDelete($event)"
      [deleteDisabled]="deleteDisabledFn" [editDisabled]="editDisabled" (edit)="onEdit($event)"
      (detail)="onDetail($event)">
      <header>
        <div class="flex justify-content-end gap-2">
          <app-button icon="pi pi-print" label="匯出申請單 PDF" [loading]="loading" [disabled]="selectedItems.length === 0"
            (click)="onExportPDF()"></app-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
