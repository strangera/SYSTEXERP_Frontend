<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      [header]="'query-conditions' | translate"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="申請編號"
            controlName="RequestCode"
            [control]="qf().RequestCode"
            [submitted]="submitted"
          ></app-input-text>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="商品管理編號"
            controlName="ManagementCode"
            [control]="qf().ManagementCode"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="申請人員編號"
            controlName="UserCode"
            [options]="userCodeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().UserCode"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="部門代號"
            controlName="OrganizationNumber"
            [options]="organizationNumberOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().OrganizationNumber"
            [submitted]="submitted"
          ></app-dropdown>
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="申請日期"
            [startControl]="qf().ApplicationDateFrom"
            [endControl]="qf().ApplicationDateTo"
            [submitted]="submitted"
          ></app-calendar-range-quick>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="申請單狀態"
            controlName="RequestStatus"
            [options]="requestStatusOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="qf().RequestStatus"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="tableData()"
      dataKey="RevaluationNo"
      tableKey="ASS13060_Data"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [loading]="tableLoading()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [showDelete]="true"
      [showReportMode]="false"
      [showCheckBox]="true"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (delete)="onBatchDelete($event)"
      [deleteDisabled]="deleteDisabledFn"
      [editDisabled]="editDisabled"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table-report>
  </div>
</div>
