<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="申請編號" controlName="requestCode"
                            [control]="queryForm.controls.requestCode" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="商品管理編號" controlName="managementCode"
                            [control]="queryForm.controls.managementCode" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="申請人員編號" controlName="userCode" [options]="userCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.userCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="部門代號" controlName=" organizationNumber"
                            [options]="organizationNumberOptions" optionLabel="label" optionValue="value"
                            [control]="queryForm.controls.organizationNumber" [submitted]="submitted"></app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="申請日期"
                            [startControl]="queryForm.controls.applicationDateFrom"
                            [endControl]="queryForm.controls.applicationDateTo" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="申請單狀態" controlName="requestStatus" [options]="requestStatusOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.requestStatus"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-table>
    </div>
</div>
