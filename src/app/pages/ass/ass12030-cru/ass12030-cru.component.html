<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (isFormCreateable && createMode === 'quoted') {
      <app-button
        btnType="query"
        label="套用請購清單"
        [loading]="applyListLoading || loading"
        (click)="openApplyQuotedDialog()"
      ></app-button>
    }
    @if (isFormCreateable && createMode === 'unquoted') {
      <app-button
        btnType="query"
        label="套用詢價清單"
        [loading]="applyListLoading || loading"
        (click)="openApplyUnquotedDialog()"
      ></app-button>
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="採購案說明"
            controlName="NOTES"
            [control]="dataForm.controls.NOTES"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="申請人編號"
            controlName="EMP_ID"
            [options]="empIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.EMP_ID"
            [submitted]="submitted"
            [disabled]="isFormReadable"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門代號"
            controlName="ORG_ID"
            [options]="orgIdOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ORG_ID"
            [submitted]="submitted"
            [disabled]="isFormReadable"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            [control]="dataForm.controls.APPLY_DATE"
            [submitted]="submitted"
            [disabled]="isFormReadable"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="供應商編號"
            controlName="SUPPLIER_ID"
            [options]="supplierIdOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.SUPPLIER_ID"
            [submitted]="submitted"
            [disabled]="isFormReadable"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="支出類型"
            controlName="SUB_PAY_TYPE"
            [options]="subPayTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.SUB_PAY_TYPE"
            [submitted]="submitted"
            [disabled]="isFormReadable"
          ></app-dropdown>
        </div>
      </div>
      <hr />
      <app-table-edit
        #tableEdit
        class="col-12"
        tableKey="ASS12030Detail"
        [columns]="editColumns"
        [data]="data"
        (dataChange)="data = $event"
        (insert)="onTableInsert()"
        [tableRequired]="true"
        [disabled]="isFormReadable"
        [showInsert]="!isFormReadable"
        [showDelete]="!isFormReadable"
        [canInsert]="true"
      ></app-table-edit>
    </form>
    @if (!isFormReadable) {
      <div class="col pt-4">
        <div class="grid justify-content-end gap-2">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button
            btnType="submit"
            [loading]="loading"
            (click)="onSubmit()"
          ></app-button>
        </div>
      </div>
    }
  </p-panel>
</div>

<app-dialog
  [(visible)]="displayApplyDialog"
  [header]="applyDialogTitle"
  [disable]="!canConfirmApply"
  [loading]="applyListLoading"
  (save)="onApplyConfirm()"
>
  <div
    [style]="{ 'min-height': '50vh', 'max-height': '75vh' }"
    class="mt-3 mb-3"
  >
    @if (applyDialogMode === 'quoted') {
      <app-table
        [showReportMode]="false"
        [showCaption]="false"
        [showHeader]="false"
        [showManage]="false"
        [showDelete]="false"
        [showCheckBox]="true"
        [selectionMode]="'single'"
        dataKey="NEED_ID"
        [data]="applyQuotedData"
        [columns]="applyQuotedColumns"
        [selectedItems]="selectedQuotedRow ? [selectedQuotedRow] : []"
        (selectionChange)="onQuotedSelectionChange($event)"
      ></app-table>
    } @else {
      <app-table
        [showReportMode]="false"
        [showCaption]="false"
        [showHeader]="false"
        [showManage]="false"
        [showDelete]="false"
        [showCheckBox]="true"
        [selectionMode]="'single'"
        dataKey="FAQuotationM_ID"
        [data]="applyPurchaseData"
        [columns]="applyPurchaseColumns"
        [selectedItems]="selectedPurchaseRow ? [selectedPurchaseRow] : []"
        (selectionChange)="onPurchaseSelectionChange($event)"
      ></app-table>
    }
  </div>
</app-dialog>
