<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
    <p-accordion>
      <p-accordionTab
        header="{{ 'query-conditions' | translate }}"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmit(queryForm)"
        >
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="部門代號"
                  controlName=" organizationNumber"
                  [options]="organizationNumberOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.organizationNumber"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="版本"
                  controlName="version"
                  [control]="queryForm.controls.version"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="年"
                  controlName="year"
                  [control]="queryForm.controls.year"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="月"
                  controlName="month"
                  [control]="queryForm.controls.month"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="會計科目"
                  controlName=" organizationNumber"
                  [options]="organizationNumberOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.organizationNumber"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-serial-number-range label="金額" [startControl]="queryForm.controls.amountStart" [endControl]="queryForm.controls.amountEnd" [submitted]="submitted">
                </app-input-serial-number-range>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="備註"
                controlName="remark"
                [control]="queryForm.controls.remark"
                [submitted]="submitted"
              ></app-input-text>
            </div>

          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  <div class="card">
    <div class="col-12">
      <app-data-table
        [data]="data"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      ></app-data-table>
    </div>
  </div>
