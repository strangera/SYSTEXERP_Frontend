<div class="layout-wrapper" [ngClass]="containerClass" *ngIf="user">
  <div #appTopbarDiv class="layout-topbar justify-content-between flex-wrap lg:flex-nowrap">
    <a class="layout-topbar-logo" routerLink="/">
      <img [src]="logo" alt="logo">
      <span class="min-w-max">{{'management-platform-title' | translate}}</span>
    </a>
    <!--手機-->
    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
      (click)="layoutService.showProfileSidebar()">
      <i class="pi pi-ellipsis-v"></i>
    </button>
    <div #topbarmenu class="layout-topbar-menu lg:flex lg:flex-column justify-content-center align-items-end"
    [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
      <div class="flex flex-row align-items-center justify-content-center col-flex">
        <div class="text-center ml-1 block" [ngStyle]="{'color': 'rgb(146, 60, 60)'}">
          <button type="button" class="layout-topbar-button p-link min-w-max" pTooltip="個人資料"
            (click)="menu.toggle($event)">
            <span class="text-sm block" style="color: var(--text-color-secondary);">{{ data?.user_No }}</span>
            <span class="text-lg font-bold block" style="color: var(--text-color);">{{ data?.user_Name }}</span>
            <i class="pi pi-angle-down" style="color: var(--text-color);"></i>
          </button>
          <p-menu #menu [model]="items" [popup]="true" class="static" styleClass="border-round-xl p-2"
            [style]="{'width': '12rem'}" appendTo="body">
            <ng-template pTemplate="submenuheader" let-item>
              <span class="font-bold text-lg text-primary">{{ item.label }}</span>
            </ng-template>
            <ng-template pTemplate="item" let-item>
              <a pRipple class="flex justify-content-between align-items-center p-menuitem-link">
                <span [class]="item.icon"></span>
                <div class="w-full">
                  <span class="ml-2">{{ item.label }}</span>
                </div>
              </a>
            </ng-template>
          </p-menu>
        </div>
      </div>
    </div>
  </div>
  <div class="relative flex align-items-center justify-content-center flex-wrap gap-3 px-1 mt-5 pt-7">
    <div *ngIf="loading" class="col-12 flex align-items-center justify-content-center">
      <p-progressSpinner></p-progressSpinner>
    </div>
    <div *ngIf="errorMessage" class="col-12 text-red-500 text-center">
      {{ errorMessage }}
    </div>
    <div *ngIf="!loading" class="grid col-12 px-0 sm:px-4">
      <div *ngFor="let item of urlItems" pAnimateOnScroll enterClass="fadein"
        class="animation-duration-1000 col-12 sm:col-6 md:col-3 flex justify-content-center">
        <p-card styleClass="w-full h-full flex flex-column justify-content-between">
          <ng-template pTemplate="header">
            <img [src]="item.imageUrl" [alt]="item.name" style="width: 100%; display: block;">
          </ng-template>
          <ng-template pTemplate="content">
            <div class="flex flex-column align-items-center justify-content-center text-center h-full">
              <h3 class="text-2xl font-bold mb-2">{{ item.name }}</h3>
              <p class="text-gray-700">{{ item.description }}</p>
            </div>
          </ng-template>
          <ng-template pTemplate="footer">
            <div class="flex gap-3 mt-1 w-full">
              <p-button type="button" class="w-full" styleClass="w-full" label="前往入口"
                (click)="navigateToUrl(item)" icon="pi pi-external-link"></p-button>
            </div>
          </ng-template>
        </p-card>
      </div>
    </div>
  </div>
</div>

<p-dialog header="修改使用者密碼" [modal]="true" [(visible)]="visible" [style]="{ width: '40rem' }">
  <form [formGroup]="form" (ngSubmit)="onSubmit(form)">
    <span class="p-text-secondary block mb-5">更新您的密碼</span>
    <div class="field grid">
      <label for="oldPassword" class="col-12 mb-2 md:col-2 md:mb-0">舊密碼</label>
      <div class="col-12 md:col-10">
        <p-password id="oldPassword" formControlName="oldPassword" class="w-full" styleClass="w-full"
          inputStyleClass="w-full" placeholder="請輸入舊密碼" maxlength="8" [toggleMask]="true" appendTo="body"
          [feedback]="false" />
        <small *ngIf="form.controls['oldPassword'].touched && form.controls['oldPassword'].errors?.['required']"
          class="p-error block">舊密碼為必填項。</small>
      </div>
    </div>
    <div class="field grid">
      <label for="newPassword" class="col-12 mb-2 md:col-2 md:mb-0">密碼</label>
      <div class="col-12 md:col-10">
        <p-password id="newPassword" class="w-full" styleClass="w-full" inputStyleClass="w-full"
          formControlName="newPassword" placeholder="請輸入新密碼" maxlength="8" promptLabel="設定密碼" weakLabel="太簡單"
          mediumLabel="中等複雜度" strongLabel="複雜密碼" [toggleMask]="true" appendTo="body" [strongRegex]="strongRegex">
          <ng-template pTemplate="footer">
            <div class="flex flex-column">
              <p-divider />
              <p class="mt-2">密碼規則格式限制：</p>
              <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                <li>字數限制：4 至 8 個字元</li>
                <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                  <li>至少一個英文大寫字母（A–Z）</li>
                  <li>至少一個數字（0–9）</li>
                  <li>至少一個特殊符號</li>
                </ul>
              </ul>
            </div>
          </ng-template>
        </p-password>
        <small *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].errors?.['required']"
          class="p-error block">新密碼為必填項。</small>
        <small
          *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].errors?.['invalidPasswordStrength']"
          class="p-error block">密碼強度不足，請符合密碼規則。</small>
      </div>
    </div>
    <div class="field grid">
      <label for="confirmPassword" class="col-12 mb-2 md:col-2 md:mb-0">確認密碼</label>
      <div class="col-12 md:col-10">
        <p-password id="confirmPassword" class="w-full" styleClass="w-full" inputStyleClass="w-full"
          formControlName="confirmPassword" placeholder="請再次輸入密碼" maxlength="8" [toggleMask]="true" appendTo="body"
          [feedback]="false" />
        <small *ngIf="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].errors?.['required']"
          class="p-error block">確認密碼為必填項。</small>
        <small *ngIf="form.errors?.['passwordsMismatch']" class="p-error block">密碼與確認密碼不符。</small>
      </div>
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="取消" severity="secondary" (onClick)="visible = false" />
      <p-button label="確定" [loading]="formButtonLoading" type="submit" />
    </div>
  </form>
</p-dialog>
