<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票號碼" [control]="dataForm.controls.Subpoenanumber" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="傳票種類" controlName="Subpoenatype" [options]="Subpoenatype" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Subpoenatype" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票號碼" [control]="dataForm.controls.Subpoenatype" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="傳票日期" controlName="accountsummary"
            [control]="dataForm.controls.Subpoenadate" [submitted]="submitted"></app-calendar>
        </div>
        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="傳票狀態"
            controlName="Subpoenastatus"
            [options]="Subpoenastatus"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Subpoenastatus"
            [submitted]="submitted"
          ></app-dropdown>
        </div> -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票摘要" controlName="Subpoenasummary" [control]="dataForm.controls.Subpoenasummary"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="補發票" controlName="Makeupinvoice" [options]="Makeupinvoice" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Makeupinvoice" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="建立者" controlName="builder" [options]="usercode" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.builder" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="	建立日期" controlName="builddate"
            [control]="dataForm.controls.builddate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="修改者" controlName="modifyer" [options]="usercode" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.modifyer" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="修改日" controlName="modifydate"
            [control]="dataForm.controls.modifydate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-checkbox-one label="Quick Menu" controlName="uickMenu" [control]="dataForm.controls.uickMenu">
          </app-checkbox-one>
        </div>
      </div>

      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="科目代號" controlName="Accountcode" [options]="Accountcode" optionLabel="label"
                optionValue="value" [control]="getFormControl(i, 'Accountcode')" [submitted]="submitted">
              </app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="廠商/員工代號" controlName="vendorCodeOptions" [options]="vendorCodeOptions"
                optionLabel="label" optionValue="value" [control]="getFormControl(i, 'vendorCodeOptions')"
                [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="摘要" controlName="summary" [control]="getFormControl(i, 'summary')"
                [submitted]="submitted">>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="借方金額" controlName="Debitamount" [control]="getFormControl(i, 'Debitamount')"
                [submitted]="submitted">>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="貸方金額" controlName="Creditamount" [control]="getFormControl(i, 'Creditamount')"
                [submitted]="submitted">>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">

              <app-dropdown label="組織代號" controlName="Organization code" [options]="Organizationcode"
                optionLabel="label" optionValue="value" [control]="getFormControl(i, 'Organizationcode')"
                [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="立沖代號" controlName="StandingInstructionCode" [options]="StandingInstructionCode"
                optionLabel="label" optionValue="value" [control]="getFormControl(i, 'StandingInstructionCode')"
                [submitted]="submitted">>
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="活動代號" controlName="Activitycode" [options]="Activitycode" optionLabel="label"
                optionValue="value" [control]="getFormControl(i, 'Activitycode')" [submitted]="submitted">>
              </app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="對象別編號" controlName="Objectnumber" [control]="getFormControl(i, 'Objectnumber')"
                [submitted]="submitted">>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="對帳KEY值" controlName="ReconciliationKEYvalue"
                [control]="getFormControl(i, 'ReconciliationKEYvalue')" [submitted]="submitted">>
              </app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
