<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
      <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
        <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="中類代號"
                  controlName="midcategorycode,"
                  [control]="dataForm.controls.midcategorycode"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="中類名稱"
                  controlName="Objectnumber"
                  [control]="dataForm.controls.midcategoryname"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                  <app-input-text
                    label="中類英文名稱"
                    controlName="objectalias"
                    [control]="dataForm.controls.midcategoryEname"
                    [submitted]="submitted"
                  ></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-default
                      label="大類代號"
                      controlName="categoryCodeOptions"
                      [options]="categoryCodeOptions"
                      optionLabel="label"
                      optionValue="value"
                      [control]="dataForm.controls.categoryCodeOptions"
                      [submitted]="submitted"
                    >
                    </app-dropdown-default>
                  </div>
        </div>

      <div class="col pt-4">
        <div class="grid justify-content-end">
          <app-button-cancel (click)="onCancel()"></app-button-cancel>
          <app-button-submit
            (click)="submitForm(dataForm)"
            *ngIf="isFormEditable"
          ></app-button-submit>
        </div>
      </div>
