      <hr />
      <ng-container formArrayName="items">
        <ng-container
          *ngFor="let item of items.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete
                (click)="onRemoveItem(i)"
                [crudstatus]="crudstatus"
                class="col"
              ></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-default
                label="統一編號"
                controlName="unifiedNumberOptions"
                [options]="unifiedNumberOptions"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'unifiedNumberOptions')"
                [submitted]="submitted"
              >
              </app-dropdown-default>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-default
                label="廠商/員工代號"
                controlName="vendorCodeOptions"
                [options]="vendorCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'vendorCodeOptions')"
                [submitted]="submitted"
              >
              </app-dropdown-default>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="對象別編號"
                controlName="name"
                [control]="dataForm.controls.name"
                [submitted]="submitted"
                >>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="對象別名稱"
                controlName="name"
                [control]="dataForm.controls.name"
                [submitted]="submitted"
                >>
              </app-input-text>
            </div>
            
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd
          (click)="onAddItem()"
        ></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
