<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
    <p-accordion>
      <p-accordionTab
        header="{{ 'query-conditions' | translate }}"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmit(queryForm)"
        >
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-datemm-range
                label="日期(年)"
                controlName="accountsummary"
                [startControl]="queryForm.controls.Sdate"
                [endControl]="queryForm.controls.Edate"
                [submitted]="submitted"
              ></app-datemm-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
                <app-datemm-range
                  label="比較日期(年)"
                  controlName="accountsummary"
                  [startControl]="queryForm.controls.CSdate"
                  [endControl]="queryForm.controls.CEdate"
                  [submitted]="submitted"
                ></app-datemm-range>
              </div>
 

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="部門"
                controlName="department"
                [options]="departmentOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.department"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
                <app-radiobutton
                  label="類別"
                  [control]="queryForm.controls.category"
                  [options]="category"
                  [submitted]="submitted"
                >
                </app-radiobutton>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="是否為對象別"
                  controlName="ifOptions"
                  [options]="ifOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.ifOptions"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>

 
  

          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  <div class="card">
    <div class="col-12">
      <app-data-table
        [data]="data"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      ></app-data-table>
    </div>
  </div>
