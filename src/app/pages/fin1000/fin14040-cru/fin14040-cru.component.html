<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="退出/折讓單號" controlName="returnTicket" [control]="dataForm.controls.returnTicket" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="字軌" controlName="wordTrack" [control]="dataForm.controls.wordTrack" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="發票號碼" controlName="invoiceTicket" [control]="dataForm.controls.invoiceTicket" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="發票日期" controlName="invoiceDate" [control]="dataForm.controls.invoiceDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="退出/折讓日期" controlName="returnDate" [control]="dataForm.controls.returnDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="發票格式" controlName="invoiceFormat" [options]="invoiceFormatOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.invoiceFormat" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-datemm-one label="申報年月" [control]="dataForm.controls.onedatemm" [submitted]="submitted">
                    </app-datemm-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="區別" controlName="usage" [options]="categoryOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.usage" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="課稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.taxType" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="銷售額" controlName="salesAmount" [control]="dataForm.controls.salesAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="稅額" controlName="tax" [control]="dataForm.controls.tax" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退回/折讓金額" controlName="returnCash" [control]="dataForm.controls.returnCash" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退回/折讓稅額" controlName="returnTax" [control]="dataForm.controls.returnTax" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退回/折讓總金額" controlName="returnCashTotal" [control]="dataForm.controls.returnCashTotal" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已退回/折讓歷史總金額" controlName="returnHistoryTotal" [control]="dataForm.controls.returnHistoryTotal" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="剩餘總金額" controlName="remainCash" [control]="dataForm.controls.remainCash" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="憑證單號" controlName="voucherTicket" [control]="dataForm.controls.voucherTicket" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="傳票編號" controlName="summonsTicket" [control]="dataForm.controls.summonsTicket" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <hr/>
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>品項 {{i+1}}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="品名" controlName="itemName" [control]="getFormControl(i, 'itemName')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="數量" controlName="itemNumber" [control]="getFormControl(i, 'itemNumber')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="單價" controlName="singlePrice" [control]="getFormControl(i, 'singlePrice')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="金額" controlName="cash" [control]="getFormControl(i, 'cash')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
