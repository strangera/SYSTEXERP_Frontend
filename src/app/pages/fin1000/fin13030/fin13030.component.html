<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-demo label="明細表" (click)="onCreate()" class="col"></app-button-demo>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-demo label="彙總表" (click)="onCreate()" class="col"></app-button-demo>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-datemm-one label="申報年月" [control]="queryForm.controls.onedatemm" [submitted]="submitted">
                        </app-datemm-one>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="銷售日期" [startControl]="queryForm.controls.salesStartdate" [endControl]="queryForm.controls.saleEnddate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="收銀機編號" controlName="registerNumber" [control]="queryForm.controls.registerNumber" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="發票類別" controlName="invoiceType" [options]="invoiceTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.invoiceType" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="是否有統一編號" controlName="uIdCheck" [options]="whetherOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.uIdCheck" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="資料來源" controlName="infoSource" [options]="infoSourceOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.infoSource" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <ul>
                    <li>備註：</li>
                    <li>1.不含當日作廢與空白發票資料。</li>
                    <li>2.是否有統一編號與資料來源只使用於明細表。</li>
                </ul>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
