<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="發票類別" controlName="invoiceCategory" [options]="invoiceCategoryOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.invoiceCategory" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="廠商編號(統一編號)" controlName="vendorUid" [control]="dataForm.controls.vendorUid" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="收銀機編號" controlName="registerID" [control]="dataForm.controls.registerID" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-datemm-one label="申報年月" [control]="dataForm.controls.declareYm" [submitted]="submitted">
                    </app-datemm-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="銷售日期" [control]="dataForm.controls.salesDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="字軌" controlName="wordTrack" [control]="dataForm.controls.wordTrack" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number-range label="發票號碼" [startControl]="dataForm.controls.invoiceIDStart" [endControl]="dataForm.controls.invoiceIDEnd" [submitted]="submitted">
                    </app-input-serial-number-range>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="發票張數" controlName="invoiceNumber" [control]="dataForm.controls.invoiceNumber" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="應稅總金額" controlName="taxPrice" [control]="dataForm.controls.taxPrice" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="免稅銷售額" controlName="notaxPrice" [control]="dataForm.controls.notaxPrice" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="零稅率銷售額" controlName="notaxRatePrice" [control]="dataForm.controls.notaxRatePrice" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="稅額" controlName="tax" [control]="dataForm.controls.tax" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="狀態碼" controlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.status" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
