<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-one label="銷售日期" [control]="queryForm.controls.salesDate" [submitted]="submitted">
                        </app-date-one>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="收銀機代號" controlName="regidterCode" [options]="regidterCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.regidterCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="交易序號" controlName="transactionSerialnumber"
                            [control]="queryForm.controls.transactionSerialnumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="字軌" controlName="wordTrack" [control]="queryForm.controls.wordTrack"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="發票號碼" controlName="invoiceSerialnumber"
                            [control]="queryForm.controls.invoiceSerialnumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
