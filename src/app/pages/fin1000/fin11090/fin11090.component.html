<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" label="設定" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- <app-datemm-two label="發票年月" [control]="queryForm.controls.twodatemm" [submitted]="submitted">
                        </app-datemm-two> -->
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機編號" controlName="registerID" [options]="regidterCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.registerID" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <ul>
          <li>說明：</li>
          <li>1.　限設定當期與下一期發票卷數設定。</li>
          <li>2.　每期最後十天，可設定下一期發票卷數設定。</li>
          <li>3.　查詢條件:發票年月只使用在報表。</li>
        </ul>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
