<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateMonthOne" label="申報年月" [control]="dataForm.controls.declareYm"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="申報書種類" controlName="declareType" [options]="declareTypeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.declareType"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="進貨總金額之進貨及費用" controlName="import_Cost"
                        [control]="dataForm.controls.import_Cost" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="進貨總金額之固定資產" controlName="import_Assets"
                        [control]="dataForm.controls.import_Assets" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="進口免稅貨物" controlName="import_NoTaxGoods"
                        [control]="dataForm.controls.import_NoTaxGoods" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="購買國外勞務給付額" controlName="import_ForeignLabor"
                        [control]="dataForm.controls.import_ForeignLabor" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
        </form>
        <ul>註:
            <li>進貨總金額之進貨及費用和進貨總金額之固定資產欄位只需維護不得扣抵憑證之金額</li>
        </ul>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
