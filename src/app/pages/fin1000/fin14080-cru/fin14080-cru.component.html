<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="發票用途" controlName="invoiceFormat" [options]="formatOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.invoiceFormat" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="字軌" controlName="wordTrack" [control]="dataForm.controls.wordTrack"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="發票號碼" controlName="invoiceNumber"
                        [control]="dataForm.controls.invoiceNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="發票日期" controlName="invoiceDate"
                        [control]="dataForm.controls.invoiceDate" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateMonthOne" label="申報年月" [control]="dataForm.controls.declareYm"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="廠商編號(統一編號)" controlName="vendorUid"
                        [control]="dataForm.controls.vendorUid" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="發票總金額" controlName="totalPrice"
                        [control]="dataForm.controls.totalPrice" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="發票未稅金額" controlName="nonTaxPrice"
                        [control]="dataForm.controls.nonTaxPrice" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="發票稅額" controlName="taxPrice"
                        [control]="dataForm.controls.taxPrice" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="發票用途" controlName="usage" [options]="usageOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.usage" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="課稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.taxType" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="扣扺代號" controlName="deductionCode" [options]="deductionCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.deductionCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="類別區分" controlName="category" [options]="categoryOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.category" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="憑證單號" controlName="certificateNumber"
                        [control]="dataForm.controls.certificateNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="傳票號碼" controlName="summonsNumber"
                        [control]="dataForm.controls.summonsNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="彙總張數" controlName="totalNumber"
                        [control]="dataForm.controls.totalNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="彙加註記" controlName="plusRemark" [control]="dataForm.controls.plusRemark"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
