<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <!-- <app-datemm-two label="發票年月" [control]="dataForm.controls.onedatemm" [submitted]="submitted">
                    </app-datemm-two> -->
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="字軌" controlName="track" [control]="dataForm.controls.track" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number-range [useGrouping]="false" label="發票號碼"
            [startControl]="dataForm.controls.startserialticket" [endControl]="dataForm.controls.endserialticket"
            [submitted]="submitted">
          </app-input-number-range>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="類別" controlName="invoiceCategory" [options]="invoiceCategoryOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.invoiceCategory" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="有無副聯" controlName="viceTicket" [options]="whetherOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.viceTicket" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateMonthOne" label="申報年月" [control]="dataForm.controls.declareYm"
            [submitted]="submitted">
          </app-calendar>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="卷數" controlName="rollNumber" [control]="dataForm.controls.rollNumber"
            [submitted]="submitted">
          </app-input-number>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
