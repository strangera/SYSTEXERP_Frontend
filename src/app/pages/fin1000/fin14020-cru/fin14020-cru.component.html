<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="退出/折讓單號" controlName="returnTicket"
                        [control]="dataForm.controls.returnTicket" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="字軌" controlName="wordTrack" [control]="dataForm.controls.wordTrack"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="發票號碼" controlName="invoiceTicket"
                        [control]="dataForm.controls.invoiceTicket" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="發票日期" controlName="invoiceDate" [control]="dataForm.controls.invoiceDate"
                        [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="退出/折讓日期" controlName="returnDate" [control]="dataForm.controls.returnDate"
                        [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="發票格式" controlName="invoiceFormat" [options]="invoiceFormatOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.invoiceFormat"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-datemm-one label="申報年月" [control]="dataForm.controls.onedatemm" [submitted]="submitted">
                    </app-datemm-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="區別" controlName="usage" [options]="categoryOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.usage" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="課稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.taxType" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="銷售額" controlName="salesAmount" [control]="dataForm.controls.salesAmount"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="稅額" controlName="tax" [control]="dataForm.controls.tax"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退出/折讓金額" controlName="returnCash" [control]="dataForm.controls.returnCash"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退出/折讓稅額" controlName="returnTax" [control]="dataForm.controls.returnTax"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退出/折讓總金額" controlName="returnTotal"
                        [control]="dataForm.controls.returnTotal" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="已退出/折讓歷史總金額" controlName="already_ReturnTotal"
                        [control]="dataForm.controls.already_ReturnTotal" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="剩餘總金額" controlName="remaining_Total"
                        [control]="dataForm.controls.remaining_Total" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="憑證單號" controlName="voucherTicket"
                        [control]="dataForm.controls.voucherTicket" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="傳票編號" controlName="summonsTicket"
                        [control]="dataForm.controls.summonsTicket" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
