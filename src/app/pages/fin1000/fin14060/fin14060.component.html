<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="發票類型" controlName="invoiceCategory" [options]="invoiceCategoryOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.invoiceCategory"
              [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="使用別" controlName="usage" [options]="usageOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.usage" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <hr>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="字軌" controlName="wordTrack" [control]="queryForm.controls.wordTrack"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="發票號碼" controlName="invoiceNumber"
              [control]="queryForm.controls.invoiceNumber" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-two label="發票年月" [control]="queryForm.controls.invoiceYm" [submitted]="submitted">
            </app-datemm-two>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="發票日期"
              [startControl]="queryForm.controls.startInvoiceDate" [endControl]="queryForm.controls.endInvoiceDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="資料所屬年月"
              [startControl]="queryForm.controls.startInvoiceYm" [endControl]="queryForm.controls.endInvoiceYm"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-two label="申報年月" [control]="queryForm.controls.declareYm" [submitted]="submitted">
            </app-datemm-two>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="買受人統一編號" controlName="buyerUid" [options]="buyerUidOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.buyerUid" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="課稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.taxType" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="銷售金額" [startControl]="queryForm.controls.salesFrom"
              [endControl]="queryForm.controls.salesTo" [submitted]="submitted">
            </app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="稅額" [startControl]="queryForm.controls.taxFrom"
              [endControl]="queryForm.controls.taxTo" [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="傳票號碼" [startControl]="queryForm.controls.subpoenaFrom"
              [endControl]="queryForm.controls.subpoenaTo" [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="資產註記" controlName="assetsRemrk" [options]="assetsRemrkOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.assetsRemrk" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
