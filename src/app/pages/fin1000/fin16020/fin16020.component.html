<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="退出/折讓單號"
                            [startControl]="queryForm.controls.returnNumberFrom"
                            [endControl]="queryForm.controls.returnNumberTo" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="發票格式" controlName="invoiceFormat" [options]="invoiceFormatOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.invoiceFormat"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="字軌" controlName="wordTrack" [control]="queryForm.controls.wordTrack"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="發票號碼"
                            [startControl]="queryForm.controls.invoiceNumberFrom"
                            [endControl]="queryForm.controls.invoiceNumberTo" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="退出/折讓日期" [startControl]="queryForm.controls.returnDateFrom"
                            [endControl]="queryForm.controls.returnDateTo" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="區別" controlName="usage" [options]="categoryOptions" optionLabel="label"
                            optionValue="value" [control]="queryForm.controls.usage" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-datemm-one label="申報年月" [control]="queryForm.controls.declareYm" [submitted]="submitted">
                        </app-datemm-one>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-datemm-range label="資料所屬年月" [startControl]="queryForm.controls.belongYmFrom"
                            [endControl]="queryForm.controls.belongYmTo" [submitted]="submitted">
                        </app-datemm-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="憑證單號"
                            [startControl]="queryForm.controls.certificateNumberFrom"
                            [endControl]="queryForm.controls.certificateNumberTo" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="傳票號碼"
                            [startControl]="queryForm.controls.summonsNumberFrom"
                            [endControl]="queryForm.controls.summonsNumberTo" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="資料型態" groupname="dateType" [control]="queryForm.controls.dateType"
                            [options]="dateTypeOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="系統別" controlName="systemCategory" [options]="systemCategoryOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.systemCategory"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="每頁列印筆數" controlName="printPage"
                            [control]="queryForm.controls.printPage" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
