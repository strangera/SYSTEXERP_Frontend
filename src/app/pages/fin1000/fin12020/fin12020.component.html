<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-demo label="確定繳回" (click)="onCreate()" class="col"></app-button-demo>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-datemm-two label="發票年月" [control]="queryForm.controls.twodatemm" [submitted]="submitted">
                        </app-datemm-two>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="字軌" controlName="wordTrack" [control]="queryForm.controls.wordTrack" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="收銀機代號" controlName="registerID" [options]="registerIDOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.registerID" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="發票號碼" controlName="money" [control]="queryForm.controls.serialInvoice" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="發票號碼起迄" [startControl]="queryForm.controls.startserialInvoice" [endControl]="queryForm.controls.endserialInvoice" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number label="卷數" controlName="rollNumber" [control]="queryForm.controls.rollNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="使用狀態" controlName="usageStatus" [options]="usageStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.usageStatus" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
