<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true">
      <form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-5" label="文字輸入" controlName="name"
            [control]="queryForm.controls.name" [submitted]="submitted" />
        </div>
        <div class="grid p-fluid">
          <app-input-number class="col-12 md:col-6 lg:col-5" label="數字輸入" controlName="money"
            [control]="queryForm.controls.money" [submitted]="submitted" />
          <app-input-number-range class="col-12 md:col-6 lg:col-5" label="數字輸入(範圍)"
            [startControl]="queryForm.controls.startticket" [endControl]="queryForm.controls.endticket"
            [submitted]="submitted" />
          <app-dropdown class="col-12 md:col-6 lg:col-5" label="單選下拉" controlName="systemtypedefault"
            [options]="systemTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.systemtypedefault" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-5" label="多選下拉" controlName="systemtypemulti"
            [options]="systemTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.systemtypemulti" [submitted]="submitted" />
          <app-calendar calendarType="timeOne" class="col-12 md:col-6 lg:col-5" label="時分"
            [control]="queryForm.controls.onetime" [submitted]="submitted" />
          <app-calendar-range calendarType="timeRange" class="col-12 md:col-6 lg:col-5" label="時分"
            [startControl]="queryForm.controls.starttime" [endControl]="queryForm.controls.endtime"
            [submitted]="submitted" />
          <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="年月日"
            [control]="queryForm.controls.onetime" [submitted]="submitted" />
          <app-calendar-range calendarType="dateRange" class="col-12 md:col-6 lg:col-5" label="年月日"
            [startControl]="queryForm.controls.starttime" [endControl]="queryForm.controls.endtime"
            [submitted]="submitted" />
          <app-calendar calendarType="dateTimeOne" class="col-12 md:col-6 lg:col-5" label="年月日時分秒"
            [control]="queryForm.controls.onetime" [submitted]="submitted" />
          <app-calendar-range calendarType="dateTimeRange" class="col-12 md:col-6 lg:col-5" label="年月日時分秒"
            [startControl]="queryForm.controls.starttime" [endControl]="queryForm.controls.endtime"
            [submitted]="submitted" />
          <app-calendar calendarType="dateMonthOne" class="col-12 md:col-6 lg:col-5" label="月"
            [control]="queryForm.controls.onetime" [submitted]="submitted" />
          <app-calendar-range calendarType="dateMonthRange" class="col-12 md:col-6 lg:col-5" label="月"
            [startControl]="queryForm.controls.starttime" [endControl]="queryForm.controls.endtime"
            [submitted]="submitted" />
          <app-calendar calendarType="dateYearOne" class="col-12 md:col-6 lg:col-5" label="年"
            [control]="queryForm.controls.onetime" [submitted]="submitted" />
          <app-calendar-range calendarType="dateYearRange" class="col-12 md:col-6 lg:col-5" label="年"
            [startControl]="queryForm.controls.starttime" [endControl]="queryForm.controls.endtime"
            [submitted]="submitted" />
          <app-radiobutton class="col-12 md:col-4 lg:col-4" label="radio多選" groupname="systemtyperadio"
            [control]="queryForm.controls.radiolist" [options]="systemTypeOptions" [submitted]="submitted"
            (valueChange)="onSystemTypeChange($event)" />
          <app-editor-text class="col-12" label="編輯器" controlName="editortext" [control]="queryForm.controls.editortext"
            [submitted]="submitted" />
        </div>
        <hr />
        <div class="grid p-fluid">
          <app-file-upload class="col-12 md:col-6 lg:col-4" [uploadUrl]="uploadUrl" [fileType]="fileType" />
        </div>
        <!-- <div *appHasPermission="queryPermission" class="col"> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [isRowSelectable]="isRowSelectable" [showCheckBox]="true">
  </app-table>
</div>
<div class="card">
  <app-data-table-check [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
  </app-data-table-check>
</div>
<div class="card">
  <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
  </app-data-table>
</div>
