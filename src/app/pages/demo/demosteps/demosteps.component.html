<p-stepper [linear]="true" [formGroup]="userForm">
    <p-stepperPanel header="行銷設定">
        <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
            <div class="flex flex-column">
                <div class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium">
                    <app-step1 [formGroupName]="formGroupStep1"></app-step1>
                </div>
            </div>
            <div class="flex pt-4 justify-content-end fixed-bottom">
                <p-button label="下步" icon="pi pi-arrow-right" iconPos="right" (onClick)="nextCallback.emit()" />
            </div>
        </ng-template>
    </p-stepperPanel>
    
    <p-stepperPanel header="活動條件設定">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback" let-index="index">
            <div class="flex flex-column">
                <div class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium">
                    <app-step2 [formGroupName]="formGroupStep2"></app-step2>
                </div>
            </div>
            <div class="flex pt-4 justify-content-between fixed-bottom">
                <p-button label="上步" icon="pi pi-arrow-left" (onClick)="prevCallback.emit()" />
                <p-button label="下步" icon="pi pi-arrow-right" iconPos="right" (onClick)="nextCallback.emit()" />
            </div>
        </ng-template>
    </p-stepperPanel>
    
    <p-stepperPanel header="贈品設定">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback" let-index="index">
            <div class="flex flex-column">
                <div class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium">
                    <app-step3 [formGroupName]="formGroupStep3"></app-step3>
                </div>
            </div>
            <div class="flex pt-4 justify-content-between fixed-bottom">
                <p-button label="上步" icon="pi pi-arrow-left" (onClick)="prevCallback.emit()" />
                <p-button label="下步" icon="pi pi-arrow-right" iconPos="right" (onClick)="nextCallback.emit()" (onClick)="togglePreview()" />
            </div>
        </ng-template>
    </p-stepperPanel>

    <p-stepperPanel header="預覽資料">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback" let-index="index">
            <div class="flex flex-column">
                <div class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium">
                    <form [formGroup]="userForm">
                        <div [formGroupName]="'step1Info'">
                            <h5>Step1</h5>
                            <div class="grid p-fluid">
                                <div class="col-12 md:col-6 lg:col-4">
                                    <span>行銷代碼</span>
                                    <input pInputText id="serialnumber" type="text" formControlName="serialnumber" maxlength="10" />
                                </div>
                                <div class="col-12 md:col-6 lg:col-4">
                                    <span>促銷代碼</span>
                                    <input pInputText id="promocode" type="text" formControlName="promocode" />
                                </div>
                            </div>
                        </div>
                        <div [formGroupName]="'step2Info'">
                            <h5>Step2</h5>
                            <div class="grid p-fluid">
                                <div class="col-12 md:col-6 lg:col-4">
                                    <span>交易類別</span>
                                    <p-dropdown [options]="eventtypeOptions" optionLabel="name" optionValue="value" formControlName="eventtype"></p-dropdown>
                                </div>
                                <div class="col-12 md:col-6 lg:col-4">
                                    <span>活動類型</span>
                                    <p-dropdown [options]="coupontypeOptions" optionLabel="name" optionValue="value" formControlName="coupontype"></p-dropdown>
                                </div>
                            </div>
                        </div>
                        
                        <div [formGroupName]="'step3Info'">
                            <h5>Step3</h5>
                            <div formArrayName="items" class="grid p-fluid">
                                <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="col-11 md:col-11 lg:col-11">
                                    <span>贈品類別</span>
                                    <p-dropdown 
                                        [options]="giveawaytypeOptions" 
                                        optionLabel="name" 
                                        optionValue="value" 
                                        formControlName="giveawaytype">
                                    </p-dropdown>
                                    <!-- 可以在此處添加其他控件 -->
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
            <div class="flex pt-4 justify-content-between fixed-bottom">
                <p-button label="上步" icon="pi pi-arrow-left" (onClick)="prevCallback.emit()" (onClick)="togglePreview()"/>
                <p-button label="送出表單" icon="pi pi-arrow-right" iconPos="right" />
            </div>
        </ng-template>
    </p-stepperPanel>
</p-stepper>
