<form [formGroup]="stepForm">
    <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
            <hr />
            <div class="grid p-fluid">
                <div class="col-11 md:col-11 lg:col-11">
                    <span>贈品類別</span>
                    <p-dropdown [options]="giveawaytypeOptions" optionLabel="name" optionValue="value"
                        formControlName="giveawaytype"></p-dropdown>
                </div>
                <div class="col-1 md:col-1 lg:col-1">
                    <p-button severity="danger" (click)="removeItem(i)">删除</p-button>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-6">
                    <span>票券種類</span>
                    <p-dropdown [options]="tickettypeOptions" optionLabel="name" optionValue="value"
                        formControlName="tickettype"></p-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-6">
                    <span>票券分類</span>
                    <p-dropdown [options]="ticketclassificationOptions" optionLabel="name" optionValue="value"
                        formControlName="ticketclassification"></p-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-4 lg:col-4">
                    <span>贈品標題</span>
                    <input pInputText id="giveawaytitle" formControlName="giveawaytitle" />
                </div>
                <div class="col-12 md:col-8 lg:col-8">
                    <span>贈品說明</span>
                    <input pInputText id="giveawaydescribe" formControlName="giveawaydescribe" />
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-6">
                    <span>日期限制</span>
                    <div class="flex">
                        <p-calendar [showTime]="true" formControlName="usedstarttime"></p-calendar> ~
                        <p-calendar [showTime]="true" formControlName="usedendtime"></p-calendar>
                    </div>
                </div>
                <div class="col-12 md:col-3 lg:col-3">
                    <span>滿額門檻</span>
                    <input pInputText id="giveawaythresholdvalue" type="number"
                        formControlName="giveawaythresholdvalue" />
                </div>
                <div class="col-12 md:col-3 lg:col-3">
                    <span>次數限制 (0 不限制)</span>
                    <input pInputText id="giveawaycount" type="number" formControlName="giveawaycount" />
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-6">
                    <span>使用星期限制</span>
                    <div formArrayName="usedaylimits0">
                        <label *ngFor="let usedaylimit of getUsedayLimits0Controls(item).controls; let j = index">
                            <input type="checkbox" [formControlName]="j">
                            {{ usedaylist0[j].name }}
                        </label>
                    </div>
                    <div formArrayName="usedaylimits1">
                        <label *ngFor="let usedaylimit of getUsedayLimits1Controls(item).controls; let j = index">
                            <input type="checkbox" [formControlName]="j">
                            {{ usedaylist1[j].name }}
                        </label>
                    </div>
                </div>
                <div class="col-12 md:col-6 lg:col-6">
                    <span>商品價值與單位</span>
                    <div class="flex">
                        <input pInputText id="giveawayvalue" type="number" formControlName="giveawayvalue" />
                        <p-dropdown [options]="giveawayunitOptions" optionLabel="name" optionValue="value"
                            formControlName="giveawayunit"></p-dropdown>
                    </div>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-6">
                    <span>使用區域限制</span>
                    <p-pickList sourceHeader="可選區域" targetHeader="已選區域" [dragdrop]="true" filterBy="name"
                        [showSourceControls]="false" [showTargetControls]="false">
                        <ng-template let-product pTemplate="item">
                            <span class="font-bold">
                                {{ product.name }}
                            </span>
                        </ng-template>
                    </p-pickList>
                </div>
                <div class="col-12 md:col-6 lg:col-6">
                    <span>適用門市</span>
                    <p-pickList sourceHeader="可選區域" targetHeader="已選區域" [dragdrop]="true" filterBy="name"
                        [showSourceControls]="false" [showTargetControls]="false">
                        <ng-template let-product pTemplate="item">
                            <span class="font-bold">
                                {{ product.name }}
                            </span>
                        </ng-template>
                    </p-pickList>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-12 lg:col-12">
                    <span>使用說明</span>
                    <input pInputText id="Instructionsofuse" formControlName="Instructionsofuse" />
                </div>
            </div>
            <hr />
        </ng-container>
    </ng-container>
    <div class="grid p-fluid">
        <div class="col-1 md:col-1 lg:col-1">
            <p-button severity="success" (click)="addItem()">增加</p-button>
        </div>
    </div>
</form>
