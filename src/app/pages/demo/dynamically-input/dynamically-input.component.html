<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'create-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="cruForm" id="cruForm" (ngSubmit)="onSubmit(cruForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="名字" controlName="name" [control]="cruForm.controls.name" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <hr />
                <ng-container formArrayName="items">
                    <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                        <div class="grid p-fluid">
                            <div class="col-6 md:col-4 lg:col-2">
                                <app-dropdown-default label="系統別初始" controlName="CashRegisterType" [options]="CashRegisterTypeItems" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'CashRegisterType')" [submitted]="submitted">
                                </app-dropdown-default>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="名字" controlName="name" [control]="getFormControl(i, 'name')" [submitted]="submitted">
                                </app-input-text>
                            </div>
                        </div>
                        <div class="grid pt-3" style="justify-content: flex-end">
                            <div style="margin-right: 5px; padding: 3px">
                                <p-button (click)="onRemoveItem(i)" label="{{ 'delete' | translate }}" icon="pi pi-trash" severity="danger"></p-button>
                            </div>
                        </div>
                        <hr />
                    </ng-container>
                </ng-container>
                <div class="pt-1">
                    <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
                </div>
                <div class="grid pt-3" style="justify-content: flex-end">
                    <div style="margin-right: 5px; padding: 3px">
                        <p-button (click)="submitForm(cruForm)" label="確認" icon="pi pi-check" severity="info"></p-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
