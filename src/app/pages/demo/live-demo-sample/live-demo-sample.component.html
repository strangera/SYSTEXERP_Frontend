<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!--<div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-multi-dialog label="ID" controlName="systemid" [control]="queryForm.controls.systemid" [columns]="columns" [data]="systemTypeOptions" [filterFields]="filterFields" [submitted]="submitted">
                        </app-input-multi-dialog>
                    </div>
                </div>-->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-multi-dialog
              label="銀行代碼"
              controlName="systemid"
              [control]="queryForm.controls.systemid"
              [columns]="backcolumns"
              [data]="backOptions"
              [filterFields]="filterFields"
              [searchplaceholder]="backsearchplaceholder"
              [submitted]="submitted"
            >
            </app-input-multi-dialog>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
