<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="分析日期" controlName="analysisDateRange"
              [startControl]="queryForm.controls.SanalysisDate" [endControl]="queryForm.controls.EanalysisDate"
              [submitted]="submitted"></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-2">
            <app-input-text label="分析區間" controlName="analysisInterval" [control]="queryForm.controls.analysisInterval"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-2">
            <app-input-text label="分析期數" controlName="analysisPeriod" [control]="queryForm.controls.analysisPeriod"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="分析日期別" controlName="analysisDateType" [options]="analysisDateTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.analysisDateType"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠客代號" controlName="clientCode" [options]="clientCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.clientCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="立帳日期" controlName="accountDate" [startControl]="queryForm.controls.SaccountDate"
              [endControl]="queryForm.controls.EaccountDate" [submitted]="submitted"></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one label="收款日期" controlName="receiptDate" [control]="queryForm.controls.receiptDate"
              [submitted]="submitted"></app-date-one>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="科目代號" controlName="accountCode" [options]="accountCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.accountCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="已到期/未到期" controlName="dueStatus" [options]="dueStatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.dueStatus" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否顯示金額/總計(%)" groupname="systemtyperadio"
              [control]="queryForm.controls.displayAmount" [options]="displayAmountOptions" [submitted]="submitted">
            </app-radiobutton>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)"></app-data-table>
  </div>
</div>
