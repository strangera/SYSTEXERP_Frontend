<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="廠客代號" [startControl]="queryForm.controls.startFactoryID" [endControl]="queryForm.controls.endFactoryID" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="立帳日期" [startControl]="queryForm.controls.startEstablishDate" [endControl]="queryForm.controls.endEstablishfDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="科目代號" [startControl]="queryForm.controls.startSubjectID" [endControl]="queryForm.controls.endSubjectID" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>
                </div>
                <hr>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="應付金額是否顯示" groupname="systemtyperadio" [control]="queryForm.controls.display" [options]="showUpOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="帳款餘額為零是否顯示" groupname="showUp" [control]="queryForm.controls.showUp" [options]="showUpOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                </div>
                <hr>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
