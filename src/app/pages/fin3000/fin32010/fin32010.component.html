<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="應收ID" controlName="receiveID"
                            [control]="queryForm.controls.receiveID" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="組織代號" controlName="organizationCode" [options]="organizationCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.organizationCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-datemm-one label="帳款年月" [control]="queryForm.controls.accountYm" [submitted]="submitted">
                        </app-datemm-one>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="帳款帳次" controlName="accountCash"
                            [control]="queryForm.controls.accountCash" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="應收金額" [startControl]="queryForm.controls.startShouldReceive"
                            [endControl]="queryForm.controls.endShouldReceive" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="沖帳金額" [startControl]="queryForm.controls.startChargeback"
                            [endControl]="queryForm.controls.endChargeback" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="應收帳款餘額"
                            [startControl]="queryForm.controls.startReceivePayBalance"
                            [endControl]="queryForm.controls.endShouldReceiveBalance" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="預計收款日" [startControl]="queryForm.controls.startExpectReceiveDate"
                            [endControl]="queryForm.controls.endExpectReceivefDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="立帳日期" [startControl]="queryForm.controls.startEstablishDate"
                            [endControl]="queryForm.controls.endEstablishfDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="廠客代號" controlName="factoryID" [options]="factoryIDOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.factoryID"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="統一編號" controlName="uId"
                            [control]="queryForm.controls.uId" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="會計科目代號" controlName="accountingCode" [options]="accountingCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.accountingCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="帳款來源單號" controlName="accountSource"
                            [control]="queryForm.controls.accountSource" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="傳票號碼" controlName="summonsNumber"
                            [control]="queryForm.controls.summonsNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="傳票狀態" controlName="subpoenaStatus" [options]="subpoenaTypeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.subpoenaStatus"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="狀態" controlName="status" [options]="statusOptions" optionLabel="label"
                            optionValue="value" [control]="queryForm.controls.status" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="對象別編號" controlName="objectNumber" [options]="objectNumberOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.objectNumber"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="對帳KEY值" controlName="keyValue"
                            [control]="queryForm.controls.keyValue" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="摘要" controlName="summary" [control]="queryForm.controls.summary"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
