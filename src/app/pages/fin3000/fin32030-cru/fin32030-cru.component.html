<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-demo label="票據新增下一步" class="col"></app-button-demo>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="收款單號" controlName="receive_ID" [control]="dataForm.controls.receive_ID" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="收款日期" controlName="receive_Date" [control]="dataForm.controls.receive_Date" [submitted]="submitted"></app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="業務員代號" controlName="salesperson_Code" [options]="salesCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.salesperson_Code" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr/>
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>收款項目 {{i+1}}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="收款項目" controlName="receiveName" [options]="receiveOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'receiveName')" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="收款金額" controlName="receiveAmount" [control]="getFormControl(i, 'receiveAmount')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="備註" controlName="remark" [control]="getFormControl(i, 'remark')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="沖帳代號" controlName="offsetCode" [control]="getFormControl(i, 'offsetCode')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                    </div>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
