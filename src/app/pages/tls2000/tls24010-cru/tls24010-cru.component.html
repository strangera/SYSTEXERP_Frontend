<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>

  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <!-- Dropdown for 補登類別 -->
          <app-dropdown label="補登類別" controlName="supplementCategory" [options]="supplementCategoryOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls['supplementCategory']"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one label="銷售日期" [control]="dataForm.controls.saleDateStart" [submitted]="submitted"></app-date-one>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <!-- Dropdown for 收銀機號 -->
          <app-dropdown label="收銀機號" controlName="cashierCode" [options]="cashierOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls['cashierCode']" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <!-- Dropdown for 專櫃編號 -->
          <app-dropdown label="專櫃編號" controlName="counterCode" [options]="counterCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls['counterCode']" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <!-- Input for 交易序號 -->
          <app-input-number [useGrouping]="false" label="交易序號" controlName="transactionSerial"
            [control]="dataForm.controls['transactionSerial']" [submitted]="submitted"></app-input-number>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
      </div>
    </div>
  </p-panel>
</div>
