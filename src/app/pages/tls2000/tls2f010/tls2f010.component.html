<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" label="請款登入" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-one label="結帳年月" [control]="queryForm.controls.checkoutoOnedatemm" [submitted]="submitted">
            </app-datemm-one>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號" controlName="counterID" [options]="counterIDOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.counterID" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="單據種類" controlName="paperType" [options]="paperTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.paperType" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="發票/收據號碼" controlName="invoiceNumber"
              [control]="queryForm.controls.invoiceNumber" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="單據日期" [startControl]="queryForm.controls.invoiceStartdate"
              [endControl]="queryForm.controls.invoiceEnddate" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="結帳方式" controlName="checkoutMethod" [control]="queryForm.controls.checkoutMethod"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-one label="請款付款年月" [control]="queryForm.controls.requestOnedatemm" [submitted]="submitted">
            </app-datemm-one>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="帳次" controlName="bill" [control]="queryForm.controls.bill" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-one label="申報年月" [control]="queryForm.controls.declareOnedatemm" [submitted]="submitted">
            </app-datemm-one>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商統一編號" controlName="uID" [control]="queryForm.controls.uID" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="課稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.taxType" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="發票總額"
              [startControl]="queryForm.controls.startserialinvoice" [endControl]="queryForm.controls.endserialinvoice"
              [submitted]="submitted">
            </app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="未稅金額"
              [startControl]="queryForm.controls.startserialnonTax" [endControl]="queryForm.controls.endserialnonTax"
              [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="稅額" [startControl]="queryForm.controls.startserialTax"
              [endControl]="queryForm.controls.endserialTax" [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="格式" controlName="format" [control]="queryForm.controls.format"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="狀況" controlName="status" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.status" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="傳送日期" [startControl]="queryForm.controls.transferStartdate"
              [endControl]="queryForm.controls.transferEnddate" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="建立者" controlName="builder" [control]="queryForm.controls.builder"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <hr>
        <div class="grid p-fluid">
          <div class="col-12 md:col-4 lg:col-4">
            <app-checkbox-one label="是否貼現" controlName="usagec" [control]="queryForm.controls.usagec">
            </app-checkbox-one>
          </div>
        </div>
        <hr>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="建立日期" [startControl]="queryForm.controls.buildStartdate"
              [endControl]="queryForm.controls.buildEnddate" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="floor" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
