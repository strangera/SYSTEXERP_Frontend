<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
  
      <div *appHasPermission="addPermission">
        <app-button-action
          label="新增補登"
          icon=""
          (onClick)="onClearForm()"
        ></app-button-action>
        <app-button-action
          label="取消補登"
          icon=""
          (onClick)="onClearForm()"
        ></app-button-action>
      </div>
    </div>
    <p-accordion>
      <p-accordionTab
        header="{{ 'query-conditions' | translate }}"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmit(queryForm)"
        >
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="補登類別"
                controlName="supplementCategory"
                [options]="supplementCategoryOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.supplementCategory"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="銷售日期"
                [startControl]="queryForm.controls.saleDateStart"
                [endControl]="queryForm.controls.saleDateEnd"
                [submitted]="submitted"
              ></app-date-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="收銀機號"
                controlName="cashierCode"
                [options]="cashierOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.cashierCode"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="專櫃編號"
                controlName="counterCode"
                [options]="counterCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.counterCode"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-serial-number
                label="交易序號"
                controlName="transactionSerial"
                [control]="queryForm.controls.transactionSerial"
                [submitted]="submitted"
              ></app-input-serial-number>
            </div>
          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
