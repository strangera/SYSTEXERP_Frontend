<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="換開日期" [control]="queryForm.controls.onedatedd"
                                    [submitted]="submitted">
                                </app-date-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="三聯式發票號碼" controlName="invoice"
                                    [control]="queryForm.controls.invoice" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number [useGrouping]="false" label="買受人統一編號" controlName="serialnumber"
                                    [control]="queryForm.controls.serialnumber" [submitted]="submitted">
                                </app-input-number>
                            </div>
                        </div>
                        <ul>印表機設定-請將捲軸靠最右邊 IE設定列印格式-
                            <li>1.紙張大小: A4</li>
                            <li>2.頁首和頁尾請清空,</li>
                            <li>3.紙張列印方向:直印,</li>
                            <li>4.放紙:請將捲軸靠最左邊</li>
                        </ul>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <!-- <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div> -->
    </div>
</div>
