<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機號" controlName="cashierCode" [options]="cashierCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.cashierCode" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃" controlName="counterName" [options]="counterCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.counterName" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="起始日期" [startControl]="queryForm.controls.startDate"
              [endControl]="queryForm.controls.endDate" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="截止日期" [startControl]="queryForm.controls.endDate"
              [endControl]="queryForm.controls.endDate" [submitted]="submitted">
            </app-date-range>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table-check [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table-check>
  </div>
</div>
