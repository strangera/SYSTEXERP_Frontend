<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="專櫃編號"
              controlName="counterCode"
              [options]="counterCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.counterCode"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃名稱"
              controlName="counterName"
              [control]="queryForm.controls.counterName"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="違規類別編號"
              controlName="violationCategory"
              [options]="violationCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.violationCategory"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="扣款項目"
              controlName="deductionItem"
              [options]="deductionItemOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.deductionItem"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-serial-number-range
              label="金額"
              [startControl]="queryForm.controls.amountStart"
              [endControl]="queryForm.controls.amountEnd"
              [submitted]="submitted"
            >
            </app-input-serial-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="扣款日期"
              [startControl]="queryForm.controls.deductionDateStart"
              [endControl]="queryForm.controls.deductionDateEnd"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="違規日期"
              [startControl]="queryForm.controls.violationDateStart"
              [endControl]="queryForm.controls.violationDateEnd"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="單據編號"
              controlName="documentNumber"
              [control]="queryForm.controls.documentNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="開立單位"
              controlName="issuingUnit"
              [options]="organizationNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.issuingUnit"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="建立者(輸入代號)"
              controlName="createdBy"
              [control]="queryForm.controls.createdBy"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="樓層"
              controlName="floor"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.floor"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one
              label="維護日"
              [control]="queryForm.controls.maintenanceDate"
              [submitted]="submitted"
            >
            </app-date-one>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="狀態"
              controlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
