<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="業種" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="商品類別" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="小分類" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="組織" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="專櫃" class="col"></app-button-demo>
                </div>
                <div >
                    <app-button-action label="DEMO" (onClick)="demo()"></app-button-action>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-datemm-one label="年月" [control]="queryForm.controls.onedatemm" [submitted]="submitted">
                                </app-datemm-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="業種" controlName="industryCode" [options]="industryCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.industryCode" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="商品類別" controlName="productCategory" [options]="industryCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.productCategory" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="小分類" controlName="smallCategory" [options]="industryCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.smallCategory" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="組織" controlName="OrganizationType" [options]="OrganizationTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.OrganizationType" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="專櫃編號" controlName="money" [control]="queryForm.controls.serialnumber" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
