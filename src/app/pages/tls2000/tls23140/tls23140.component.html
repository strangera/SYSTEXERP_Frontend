<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="交易日期" [startControl]="queryForm.controls.transactionDateStart"
              [endControl]="queryForm.controls.transactionDateEnd" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="交易機號" controlName="transactionMachine" [options]="transactionMachineOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.transactionMachine"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="專櫃編號" controlName="counterNumber"
              [control]="queryForm.controls.counterNumber" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="單筆交易中有價卷總金額達N萬" controlName="voucherAmount"
              [control]="queryForm.controls.voucherAmount" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="交易序號" controlName="transactionSerialNumber"
              [control]="queryForm.controls.transactionSerialNumber" [submitted]="submitted">
            </app-input-number>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
