<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'create-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0">
                    <form [formGroup]="cruForm" id="cruForm" (ngSubmit)="onSubmit(cruForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-radiobutton label="發票類別" groupname="invoicetyperadio"
                                    [control]="cruForm.controls.invoiceType" [options]="invoiceTypeOptions"
                                    [submitted]="submitted">
                                </app-radiobutton>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="統一編號" controlName="uID" [control]="cruForm.controls.uID"
                                    [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="買受人" controlName="buyer" [control]="cruForm.controls.buyer"
                                    [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="地址" controlName="address" [control]="cruForm.controls.address"
                                    [submitted]="submitted">
                                </app-input-text>
                            </div>
                        </div>

                        <hr>
                        <ng-container formArrayName="items">
                            <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                                <div class="grid p-fluid">
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-date-one label="銷售日期" [control]="getFormControl(i, 'salesDate')"
                                            [submitted]="submitted">
                                        </app-date-one>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number [useGrouping]="false" label="收銀機代號" controlName="registerID"
                                            [control]="getFormControl(i, 'registerID')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number [useGrouping]="false" label="交易流水號" controlName="transferID"
                                            [control]="getFormControl(i, 'transferID')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                </div>
                                <div class="grid pt-3" style="justify-content: flex-end;">
                                    <div style="margin-right: 5px;padding: 3px;">
                                        <p-button (click)="onRemoveItem(i)" label="{{ 'delete' | translate }}"
                                            icon="pi pi-trash" severity="danger"></p-button>
                                    </div>
                                </div>
                                <hr>
                            </ng-container>
                        </ng-container>
                        <div class="pt-1">
                            <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
                        </div>
                        <div class="grid pt-3" style="justify-content: flex-end;">
                            <div style="margin-right: 5px;padding: 3px;">
                                <p-button (click)="submitForm(cruForm)" label="確認" icon="pi pi-check"
                                    severity="info"></p-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
    </div>
</div>
