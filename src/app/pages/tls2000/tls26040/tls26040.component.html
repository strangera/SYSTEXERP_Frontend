<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
      <app-button-action label="進入整批還原作業" icon="" (onClick)="onRE()" class="col"></app-button-action>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="預售日期"
              [startControl]="queryForm.controls.preSaleDateStart"
              [endControl]="queryForm.controls.preSaleDateEnd"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="結帳日期"
              [startControl]="queryForm.controls.checkoutDateStart"
              [endControl]="queryForm.controls.checkoutDateEnd"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="收銀機號"
              controlName="cashierCode"
              [control]="queryForm.controls.cashierCode"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="counterCode"
              [control]="queryForm.controls.counterCode"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="批號"
              controlName="batchNumber"
              [control]="queryForm.controls.batchNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table-check
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table-check>
  </div>
</div>
