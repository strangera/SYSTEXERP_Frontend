<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- Radio button and 查詢年月 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input type="radio" [checked]="queryForm.controls.radioOption.value === 'month'"
                  (click)="onRadioSelect('month')" />
              </div>
              <div class="col-10">
                <app-calendar calendarType="dateMonthOne" label="查詢年月" [control]="queryForm.controls.onedatemm"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
          </div>

          <!-- Radio button and 查詢日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input type="radio" [checked]="queryForm.controls.radioOption.value === 'dateRange'"
                  (click)="onRadioSelect('dateRange')" />
              </div>
              <div class="col-10">
                <app-calendar-range calendarType="dateRange" label="查詢日期"
                  [startControl]="queryForm.controls.queryStartDate" [endControl]="queryForm.controls.queryEndDate"
                  [submitted]="submitted">
                </app-calendar-range>
              </div>
            </div>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機代號" controlName="cashRegisterCode" [control]="queryForm.controls.cashRegisterCode"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="顯示非營運的專櫃" [options]="WhetherOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.whether" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>

        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
