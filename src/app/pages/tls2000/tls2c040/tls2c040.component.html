<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="傳票總類" controlName="subpoenaType" [options]="subpoenaTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.subpoenaType" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="傳票日期" [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate" [submitted]="submitted">
                                </app-date-range>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="傳票狀態" controlName="subpoenaStatus" [options]="subpoenaTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.subpoenaStatus" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="結帳單號" controlName="serialnumber" [control]="queryForm.controls.serialnumber" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
