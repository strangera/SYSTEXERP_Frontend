<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="新增條件" [selected]="true" class="line-height-3 m-0">
            <form [formGroup]="dataForm" id="queryForm" (ngSubmit)="onSubmit(dataForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="違規類別編號" controlName="violationCategoryId"
                            [options]="violationCategoryOptions" optionLabel="label" optionValue="value"
                            [control]="dataForm.controls.violationCategoryId" [submitted]="submitted">
                        </app-dropdown>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="違規編號" controlName="violationNumber"
                            [control]="dataForm.controls.violationNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="違規內容" controlName="violationContent"
                            [control]="dataForm.controls.violationContent" [submitted]="submitted">
                        </app-input-text>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="金額" [control]="dataForm.controls.amountStart"
                            [submitted]="submitted">
                        </app-input-number>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="金額是否可修改" controlName="amountEditable" [options]="whetherOptions"
                            optionLabel="label" optionValue="value" [control]="dataForm.controls.amountEditable"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
    <!-- 確認/取消 -->
    <div class="col pt-4">
        <div class="grid justify-content-end">
            <app-button btnType="cancel" (click)="onCancel()"></app-button>
            <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
        </div>
    </div>
    <!-- -------- -->
</div>
