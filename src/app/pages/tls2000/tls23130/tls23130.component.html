<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- Radio + 銷售日期區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input
                  type="radio"
                  formControlName="dateRadio"
                  [value]="'saleDate'"
                />
              </div>
              <div class="col-10">
                <app-date-range
                  label="日期"
                  [startControl]="queryForm.controls.saleDateStart"
                  [endControl]="queryForm.controls.saleDateEnd"
                  [submitted]="submitted"
                ></app-date-range>
              </div>
            </div>
          </div>

          <!-- Radio + 銷售年/月 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input
                  type="radio"
                  formControlName="dateRadio"
                  [value]="'saleMonthYear'"
                />
              </div>
              <div class="col-10">
                <app-datemm-one
                  label="年/月"
                  [control]="queryForm.controls.saleMonthYear"
                  [submitted]="submitted"
                ></app-datemm-one>
              </div>
            </div>
          </div>

          <!-- 卡種 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="卡種"
              controlName="bankType"
              [options]="bankOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankType"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>

  <!-- Data Table -->
  <div class="col-12">
    <div class="card">
      <app-data-table
        [data]="filteredData"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      ></app-data-table>
    </div>
  </div>
</div>
