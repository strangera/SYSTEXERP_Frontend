<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="部門" controlName="department" [options]="departmentOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.department"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number [useGrouping]="false" label="審核單號" controlName="reviewNumber"
                                    [control]="queryForm.controls.reviewNumber" [submitted]="submitted">
                                </app-input-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="銷售類型" controlName="salesType" [options]="salesTypeOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.salesType"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="扣款項目" controlName="deductionItems"
                                    [options]="deductionItemsOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.deductionItems" [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="活動起始日期" [startControl]="queryForm.controls.startdateFrom"
                                    [endControl]="queryForm.controls.startdateTo" [submitted]="submitted">
                                </app-date-range>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="活動結束日期" [startControl]="queryForm.controls.endDateFrom"
                                    [endControl]="queryForm.controls.endDateTo" [submitted]="submitted">
                                </app-date-range>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="是否已取過合約設定" controlName="overContract"
                                    [options]="whetherOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.overContract" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="狀態" controlName="contractStatus"
                                    [options]="contractStatusOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.contractStatus" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <!-- <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div> -->
    </div>
</div>
