<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-calendar calendarType="dateOne" label="日期" [control]="queryForm.controls.onedatedd"
                                    [submitted]="submitted">
                                </app-calendar>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="收銀機代碼" controlName="casherID"
                                    [control]="queryForm.controls.casherID" [submitted]="submitted">>
                                </app-input-text>
                            </div>
                        </div>
                        <hr>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-4 lg:col-4">
                                <app-checkbox-one label="是否檢核發票重複" controlName="duplicateCheck"
                                    [control]="queryForm.controls.duplicateCheck">
                                </app-checkbox-one>
                            </div>
                        </div>
                        <hr>
                        <h6>最近關帳日期:2020/2/9</h6>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
