<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar-range calendarType="dateRange" label="銷售日期-日報表"
                  [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate"
                  [submitted]="submitted">
                </app-calendar-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar calendarType="dateMonthOne" label="銷售年月-月報表" [control]="queryForm.controls.onedatemm"
                  [submitted]="submitted">
                </app-calendar>
              </div>
            </div>
            <hr>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number-range [useGrouping]="false" label="收銀機代號"
                  [startControl]="queryForm.controls.cahserStart" [endControl]="queryForm.controls.cahserEnd"
                  [submitted]="submitted">
                </app-input-number-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number-range [useGrouping]="false" label="專櫃編號"
                  [startControl]="queryForm.controls.counterStart" [endControl]="queryForm.controls.counterEnd"
                  [submitted]="submitted">
                </app-input-number-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select label="區域代號" controlName="regionCode" [options]="areaCodeOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.regionCode" [submitted]="submitted">
                </app-multi-select>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select label="收銀類別" controlName="cahserType" [options]="cahserTypeOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.cahserType"
                  [submitted]="submitted">
                </app-multi-select>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="樓層" controlName="floor" [options]="floorOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <hr>
            <div class="grid p-fluid">
              <div class="col-12 md:col-4 lg:col-4">
                <p-checkbox label="僅顯示溢欠" controlName="onlyShowOverflow">
                </p-checkbox>
              </div>
            </div>
            <hr>
            <h6>最近關帳日期:2020/2/9</h6>
            <div *appHasPermission="queryPermission" class="col">
              <div class="grid justify-content-end">
                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
      </div>
    </div>
  </div>
</div>
