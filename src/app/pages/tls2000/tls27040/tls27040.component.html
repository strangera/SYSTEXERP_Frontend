<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="收銀機號"
              controlName="cashierNumber"
              [control]="queryForm.controls.cashierNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="交易流水號"
              controlName="transactionNumber"
              [control]="queryForm.controls.transactionNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="counterNumber"
              [control]="queryForm.controls.counterNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="銷售狀況"
              controlName="salesStatus"
              [options]="salesStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.salesStatus"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="卡別"
              controlName="cardType"
              [options]="cardTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cardType"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-serial-number-range
              label="金額"
              [startControl]="queryForm.controls.amountStart"
              [endControl]="queryForm.controls.amountEnd"
              [submitted]="submitted"
            >
            </app-input-serial-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-datetime-range
              label="銷售日期"
              [startControl]="queryForm.controls.salesDateStart"
              [endControl]="queryForm.controls.salesDateEnd"
              [submitted]="submitted"
            >
            </app-datetime-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="卡號"
              controlName="cardNumber"
              [control]="queryForm.controls.cardNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="EDC號碼"
              controlName="edcNumber"
              [control]="queryForm.controls.edcNumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="請款日期"
              [startControl]="queryForm.controls.billingDateStart"
              [endControl]="queryForm.controls.billingDateEnd"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="交易類別"
              controlName="transactionType"
              [options]="transactionTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.transactionType"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="輸入狀態"
              controlName="inputStatus"
              [options]="inputStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.inputStatus"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="授權碼"
              controlName="authorizationCode"
              [control]="queryForm.controls.authorizationCode"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="分期期數"
              controlName="installmentPeriod"
              [options]="installmentPeriodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.installmentPeriod"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="收單銀行"
              controlName="acquiringBank"
              [options]="acquiringBankOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.acquiringBank"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="查詢篩選"
              controlName="queryFilter"
              [options]="queryFilterOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.queryFilter"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
