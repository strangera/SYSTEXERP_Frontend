<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <!-- 功能列 -->
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
  
    <p-accordion>
      <p-accordionTab
        header="修改條件"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <!-- 查詢條件表單 -->
        <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmitMOD()">
          <div class="grid p-fluid">
            <!-- 違規類別編號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="違規類別編號"
                controlName="violationCategoryCode"
                [control]="queryForm.controls.violationCategoryCode"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
  
            <!-- 違規類別名稱 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="違規類別名稱"
                controlName="violationCategoryName"
                [control]="queryForm.controls.violationCategoryName"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
          </div>
          
          <div *appHasPermission="queryPermission" class="col">
            <div class="grid justify-content-end">
              <!-- 清除按鈕 -->
              <app-button-clear (onClick)="onClearForm()"></app-button-clear>
  
              <!-- 確認按鈕 -->
              <app-button-action label="確認修改" type="submit"></app-button-action>
            </div>
          </div>
        </form>
      </p-accordionTab>
    </p-accordion>
  </div>
