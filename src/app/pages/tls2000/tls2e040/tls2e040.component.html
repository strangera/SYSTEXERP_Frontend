<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="2016查詢" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="AUTOFAX" class="col"></app-button-demo>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="AUTOMAIL" class="col"></app-button-demo>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="專櫃編號" controlName="counterNumber" [options]="counterNameOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.counterNumber" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="抽成方式" controlName="commissionMethod" [options]="commissionMethodOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.commissionMethod" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="樓層" controlName="floor" [options]="floorOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-datemm-one label="查詢年月" [control]="queryForm.controls.onedatemm" [submitted]="submitted">
                                </app-datemm-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="結帳方式/帳次" controlName="checkout" [options]="checkoutOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.checkout" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <!-- <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div> -->
    </div>
</div>
