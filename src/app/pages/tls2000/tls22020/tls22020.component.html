<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one
              label="銷售日期"
              [control]="queryForm.controls.saleDate"
              [submitted]="submitted"
            >
            </app-date-one>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-serial-number-range
              label="收銀機代號"
              [startControl]="queryForm.controls.cashierStartCode"
              [endControl]="queryForm.controls.cashierEndCode"
              [submitted]="submitted"
            >
            </app-input-serial-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="差異為0是否列出"
              controlName="listZeroDifference"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.listZeroDifference"
              [submitted]="submitted"
            >
            </app-dropdown-item>
          </div>
          <app-radiobutton
            groupname="displayOptions"
            [control]="queryForm.controls.displayOptions"
            [options]="machinedisplayOptions"
            [submitted]="submitted"
          >
          </app-radiobutton>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
