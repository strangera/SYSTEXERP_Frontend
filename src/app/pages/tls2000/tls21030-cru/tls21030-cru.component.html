<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <!-- <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div> -->
            </div>
            <p-panel [header]="formTitle" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="queryForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="結帳方式" controlName="settlementMethod" [options]="settlementMethodOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.settlementMethod" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="帳次" controlName="accountingPeriod" [options]="accountingPeriodOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.accountingPeriod" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="是否使用業主發票" controlName="useOwnerInvoice" [options]="useOwnerInvoiceOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.useOwnerInvoice" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-editor-text label="說明1" controlName="description1" [style]="{ height: '100px' }" [control]="dataForm.controls.description1" [submitted]="submitted">
                            </app-editor-text>
                        </div>

                        <div class="col-12 md:col-6 lg:col-4">
                            <app-editor-text label="說明2" controlName="description2" [style]="{ height: '100px' }" [control]="dataForm.controls.description2" [submitted]="submitted">
                            </app-editor-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-editor-text label="說明3" controlName="description3" [style]="{ height: '100px' }" [control]="dataForm.controls.description3" [submitted]="submitted">
                            </app-editor-text>
                        </div>
                    </div>
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button-cancel (click)="onCancel()"></app-button-cancel>
                        <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
