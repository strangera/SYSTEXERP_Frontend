<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <app-radiobutton label="領卡依據" groupname="receiveBasic" [control]="dataForm.controls.receiveBasic" [options]="receiveBasicOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="批次號" controlName="serialnumber" [control]="dataForm.controls.serialnumber" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="起始卡號" controlName="startNumber" [control]="dataForm.controls.startNumber" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="領卡數量" controlName="receiveNumber" [control]="dataForm.controls.receiveNumber" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="領用櫃號" controlName="receiveCounter" [control]="dataForm.controls.receiveCounter" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                    </div>
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button-cancel (click)="onCancel()"></app-button-cancel>
                        <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
