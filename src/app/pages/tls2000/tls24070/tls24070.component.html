<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 第一組：銷售日期、收銀機代號、原交易序號起迄號 -->
          <div class="col-12">
            <p-radioButton
              name="selectedGroup"
              value="group1"
              label=""
              formControlName="selectedGroup"
              inputId="group1"
              (onClick)="onGroupSelect('group1')"
            ></p-radioButton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="銷售日期"
              [startControl]="queryForm.controls.saleDateStart"
              [endControl]="queryForm.controls.saleDateEnd"
              [submitted]="submitted"
            ></app-date-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="收銀機號"
              controlName="cashierCode"
              [options]="cashierCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cashierCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-serial-number-range
              label="原交易序號起迄號"
              [startControl]="queryForm.controls.startSerialNumber"
              [endControl]="queryForm.controls.endSerialNumber"
              [submitted]="submitted"
            ></app-input-serial-number-range>
          </div>


          <!-- 第二組：原交易發票號碼 -->
          <div class="col-12">
            <p-radioButton
              name="selectedGroup"
              value="group2"
              label=""
              formControlName="selectedGroup"
              inputId="group2"
              (onClick)="onGroupSelect('group2')"
            ></p-radioButton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="原交易發票號碼"
              controlName="invoiceNumber"
              [control]="queryForm.controls.invoiceNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
            
              label="test"
              controlName="test"
              [control]="queryForm.controls.test"
              [submitted]="submitted"
            ></app-input-number>
          </div> -->
    
        </div>
      </form>

      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
  * 請注意 :
　　　　1、此作業為日結前才可修正!!
　　　　2、若使用電子發票，只允許清空作廢退貨發票號碼 !!
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-data-table>
  </div>
</div>
