<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div> -->
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機號" controlName="cashRegisterNumber" [control]="dataForm.controls.cashRegisterNumber"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="交易流水號" controlName="transactionSerialNumber"
            [control]="dataForm.controls.transactionSerialNumber" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="專櫃編號" controlName="counterID" [control]="dataForm.controls.counterID"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="卡別" controlName="cardCategory" [options]="cardCategoryOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.cardCategory" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="銷售狀況" controlName="salesCondition" [options]="salesConditionOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.salesCondition" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="金額" [control]="dataForm.controls.amount"
            [submitted]="submitted">
          </app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="入帳日" [control]="dataForm.controls.postingDate"
            [submitted]="submitted">
          </app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="卡號" controlName="cardID" [control]="dataForm.controls.cardID" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="EDC號碼" controlName="edcID" [control]="dataForm.controls.edcID" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="請款日期" [control]="dataForm.controls.billingDate"
            [submitted]="submitted">
          </app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="授權碼" controlName="authorizationCode" [control]="dataForm.controls.authorizationCode"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="輸入狀態" controlName="entryStatus" [options]="entryStatusOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.entryStatus" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="交易類別" controlName="transactionCategory" [options]="transactionCategoryOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.transactionCategory"
            [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="分期期數" controlName="installmentPeriodCount" [options]="installmentPeriodCountOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.installmentPeriodCount"
            [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="收單銀行" controlName="acquirerBank" [options]="acquirerBankOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.acquirerBank" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="timeOne" label="時間" [control]="dataForm.controls.transactionTime"
            [submitted]="submitted">
          </app-calendar>
        </div>
      </div>
    </form>
    <div class="card">
      <div class="col-12">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
      </div>
    </div>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
