<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission" class="col-2 md:col-2 lg:col-2">
            <p-button (click)="onCreate()" label="新增" icon="pi pi-plus" severity="info"></p-button>
        </div> -->
    <p-panel [header]="formTitle" class="line-height-3 m-0">
      <div class="col-12">
        <app-data-table
          [data]="data"
          [columns]="columns"
          (edit)="onEdit($event)"
          (detail)="onDetail($event)"
        >
        </app-data-table>
      </div>
      <div class="col pt-4">
        <div class="grid justify-content-end">
          <app-button-cancel (click)="onCancel()"></app-button-cancel>
          <app-button-submit
            (click)="submitForm(dataForm)"
            *ngIf="isFormEditable"
          ></app-button-submit>
        </div>
      </div>
    </p-panel>
  </div>
</div>
