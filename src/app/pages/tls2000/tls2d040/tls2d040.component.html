<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button btnType="create" label="扣款彙總表" class="col"></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number [useGrouping]="false" label="專櫃編號" controlName="counterID"
                  [control]="queryForm.controls.counterID" [submitted]="submitted">
                </app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select label="來源系統別" controlName="cashSource" [options]="cashSourceOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.cashSource"
                  [submitted]="submitted">
                </app-multi-select>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="扣款代號" controlName="deductionCode" [options]="deductionCodeOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.deductionCode"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar-range calendarType="dateMonthRange" label="扣款年月"
                  [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate"
                  [submitted]="submitted">
                </app-calendar-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number [useGrouping]="false" label="廠商編號" controlName="venderID"
                  [control]="queryForm.controls.venderID" [submitted]="submitted">
                </app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="活動代碼/名稱" controlName="eventCode" [options]="eventCodeOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.eventCode" [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <hr>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select label="是否開立發票" controlName="releaseInvoice" [options]="releaseInvoiceOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.releaseInvoice"
                  [submitted]="submitted">
                </app-multi-select>
              </div>
              <hr>
              <div class="col-12 md:col-4 lg:col-4">
                <app-radiobutton label="狀況(For匯總)" groupname="relyOn" [control]="queryForm.controls.relyOn"
                  [options]="relyOnOptions" [submitted]="submitted">
                </app-radiobutton>
              </div>
              <div class="col-12 md:col-4 lg:col-4">
                <app-dropdown label="組織代號" controlName="orgCode" [options]="orgCodeOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.orgCode" [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-4 lg:col-4">
                <app-radiobutton label="類型" groupname="category" [control]="queryForm.controls.category"
                  [options]="categoryOptions" [submitted]="submitted">
                </app-radiobutton>
              </div>
              <div class="col-12 md:col-4 lg:col-4">
                <app-dropdown label="業種代號" controlName="businessCode" [options]="businessCodeOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.businessCode"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-4 lg:col-4">
                <app-multi-select label="專櫃/自營櫃" controlName="operations" [options]="operationsOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.operations"
                  [submitted]="submitted">
                </app-multi-select>
              </div>
            </div>
            <hr>
            <div class="grid p-fluid">
              <div class="col-12 md:col-4 lg:col-4">
                <p-checkbox label="只顯示負值(只適用依專櫃統計)" controlName="onlyNegative">
                </p-checkbox>
              </div>
              <div class="col-12 md:col-4 lg:col-4">
                <p-checkbox label="只顯示當月應收為負值" controlName="onlyMonthNegative">
                </p-checkbox>
              </div>
            </div>
            <hr>
            <div *appHasPermission="queryPermission" class="col">
              <div class="grid justify-content-end">
                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
      </div>
    </div>
  </div>
</div>
