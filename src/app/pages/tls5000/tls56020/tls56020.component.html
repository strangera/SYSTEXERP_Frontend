<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="領用單編號"
              controlName="issuanceNoteCode"
              [control]="queryForm.controls.issuanceNoteCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="倉別"
              controlName="warehouseCode"
              [options]="warehouseOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.warehouseCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="管理編號"
              controlName="generalCode"
              [control]="queryForm.controls.generalCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="品牌編號"
              controlName="brandCode"
              [control]="queryForm.controls.brandCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="領用類別"
              controlName="issuanceType"
              [options]="issuanceTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.issuanceType"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="領用單狀態"
              controlName="issuanceNoteStatus"
              [options]="issuanceNoteStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.issuanceNoteStatus"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="申請人編號"
              controlName="applicantCode"
              [options]="applicantCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.applicantCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="審核人編號"
              controlName="approverCode"
              [options]="approverCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.approverCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="申請日期"
              [startControl]="queryForm.controls.applicationDateFrom"
              [endControl]="queryForm.controls.applicationDateTo"
              [submitted]="submitted"
            ></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="審核日期"
              [startControl]="queryForm.controls.approvalDateFrom"
              [endControl]="queryForm.controls.approvalDateTo"
              [submitted]="submitted"
            ></app-date-range>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
