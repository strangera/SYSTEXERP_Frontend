<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="顯示方式"
              controlName="displayMode"
              [options]="displayModeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.displayMode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="銷售單號"
              controlName="salesNo"
              [control]="queryForm.controls.salesNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="銷售日期"
              [startControl]="queryForm.controls.salesDateFrom"
              [endControl]="queryForm.controls.salesDateTo"
              [submitted]="submitted"
            ></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="品牌"
              controlName="brandCode"
              [options]="brandCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.brandCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="管理編號"
              controlName="managementID"
              [options]="managementIDOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.managementID"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="國際條碼"
              controlName="countryCode"
              [control]="queryForm.controls.countryCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商編號"
              controlName="warehouseNo"
              [control]="queryForm.controls.warehouseNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
