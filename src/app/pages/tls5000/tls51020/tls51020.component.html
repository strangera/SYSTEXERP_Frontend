<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="中分類代碼" controlName="mCode" [control]="queryForm.controls.mCode" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="中分類名稱" controlName="mName" [control]="queryForm.controls.mName" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="大分類代碼" controlName="bigCategory" [options]="bigCategoryOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.bigCategory" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <hr>
                        <app-editor-text label="說明" controlName="editortext" [control]="queryForm.controls.editortext" [style]="{ height: '100px' }" [submitted]="submitted">
                        </app-editor-text>
                        <hr>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table-check [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table-check>
            </div>
        </div>
    </div>
</div>
