<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="倉別"
              controlName="warehouseCode"
              [options]="warehouseOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.warehouseCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-datemm-one
              label="期初年月"
              controlName="initialDate"
              [control]="queryForm.controls.initialDate"
              [submitted]="submitted"
            ></app-datemm-one>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="管理編號"
              controlName="managementCode"
              [options]="managementIDOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.managementCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="品名"
              controlName="productName"
              [control]="queryForm.controls.productName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="國際條碼"
              controlName="vendorCode"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-data-table>
  </div>
</div>
