<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="採購單號" controlName="purchaseOrder" [control]="queryForm.controls.purchaseOrder" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="倉別" controlName="storage" [options]="storageOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.storage" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="管理編號" controlName="managementID" [options]="managementIDOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.managementID" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="品牌編號" controlName="brandID" [options]="brandIDOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.brandID" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="廠商編號" controlName="vendorID" [options]="vendorIDOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.vendorID" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="單據狀態" controlName="paperStatus" [options]="paperStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.paperStatus" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="申請人" controlName="applicant" [options]="applicantOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.applicant" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="申請日期" [startControl]="queryForm.controls.applicantStartdate" [endControl]="queryForm.controls.applicantEnddate" [submitted]="submitted">
                                </app-date-range>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="審核人" controlName="checkPerson" [options]="applicantOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.checkPerson" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="審核日期" [startControl]="queryForm.controls.checkStartdate" [endControl]="queryForm.controls.checkEnddate" [submitted]="submitted">
                                </app-date-range>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="結案人" controlName="closePerson" [options]="applicantOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.closePerson" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="結案日期" [startControl]="queryForm.controls.closeStartdate" [endControl]="queryForm.controls.closeEnddate" [submitted]="submitted">
                                </app-date-range>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
