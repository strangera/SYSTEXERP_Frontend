<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="廠商編號"
              controlName="vendorCode"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="品牌編號"
              controlName="brandCode"
              [options]="brandCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.brandCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="大分類"
              controlName="bigCategory"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bigCategory"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="中分類"
              controlName="midCategory"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.midCategory"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="小分類"
              controlName="smallCategory"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.smallCategory"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="進貨數量"
              controlName="quantity"
              [control]="queryForm.controls.quantity"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one
              label="啟用日期"
              [control]="queryForm.controls.startDate"
              [submitted]="submitted"
            ></app-date-one>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
