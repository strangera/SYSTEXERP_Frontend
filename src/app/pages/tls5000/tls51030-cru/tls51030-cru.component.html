<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid p-fluid ">
                <div class="col-20 md:col-10 lg:col-12">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="小分類代碼" controlName="sCode"
                                [control]="dataForm.controls.mCode" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="小分類名稱" controlName="sName" [control]="dataForm.controls.mName"
                                [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="大分類代碼" controlName="bigCategory" [options]="bigCategoryOptions"
                                optionLabel="label" optionValue="value" [control]="dataForm.controls.bigCategory"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="中分類代碼" controlName="middleCategory" [options]="middleCategoryOptions"
                                optionLabel="label" optionValue="value" [control]="dataForm.controls.middleCategory"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                    </div>
                    <hr>
                    <app-editor-text label="說明" controlName="editortext" [control]="dataForm.controls.editortext"
                        [style]="{ height: '100px' }" [submitted]="submitted">
                    </app-editor-text>
                    <hr>
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button btnType="cancel" (click)="onCancel()"></app-button>
                        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
