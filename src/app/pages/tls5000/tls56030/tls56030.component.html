<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="領用退回單編號" controlName="issuanceReturnCode"
              [control]="queryForm.controls.issuanceReturnCode" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人編號" controlName="applicantCode" [options]="applicantCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.applicantCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門編號" controlName="departmentCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.organizationNumber"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="申請日期"
              [startControl]="queryForm.controls.applicationDateFrom"
              [endControl]="queryForm.controls.applicationDateTo" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="領用退回單狀態" controlName="issuanceReturnStatus" [options]="issuanceReturnStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.issuanceReturnStatus"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
