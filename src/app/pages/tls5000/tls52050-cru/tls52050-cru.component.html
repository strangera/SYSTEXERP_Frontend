<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div> -->
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="變價單號"
            controlName="priceChangeOrderNumber"
            [control]="dataForm.controls.priceChangeOrderNumber"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="品牌代碼"
            controlName="brandCode"
            [options]="brandCodeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.brandCode"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="廠商代碼"
            controlName="vendorCode"
            [options]="vendorOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.vendorCode"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text
            label="進價售價變價單說明"
            controlName="priceChangeDescription"
            [control]="dataForm.controls.priceChangeDescription"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          ></app-editor-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one
            label="啟用日期"
            [control]="dataForm.controls.startDate"
            [submitted]="submitted"
          ></app-date-one>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="申請人"
            controlName="applicantCode"
            [options]="userCodeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.applicantCode"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one
            label="申請日期"
            [control]="dataForm.controls.applicationDate"
            [submitted]="submitted"
          ></app-date-one>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="進價折扣%"
            controlName="costPriceDiscount"
            [control]="dataForm.controls.costPriceDiscount"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="進價金額調整"
            controlName="costPriceAdjustment"
            [control]="dataForm.controls.costPriceAdjustment"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="售價折扣%"
            controlName="salePriceDiscount"
            [control]="dataForm.controls.salePriceDiscount"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="售價金額調整"
            controlName="salePriceAdjustment"
            [control]="dataForm.controls.salePriceAdjustment"
            [submitted]="submitted"
          ></app-input-number>
        </div>
      </div>

      <hr />
      <ng-container formArrayName="items">
        <ng-container
          *ngFor="let item of items.controls; let i = index"
          [formGroupName]="i"
        >
        <div class="grid align-items-center">
            <div class="col" style="flex: 1"> </div>
          <div>
            <app-button-dynamicallydelete
              (click)="onRemoveItem(i)"
              [crudstatus]="crudstatus"
              class="col"
            ></app-button-dynamicallydelete>
          </div>
        </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="商品管理編號/名稱"
                controlName="mgname"
                [control]="getFormControl(i, 'mgname')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="大分類"
                controlName="bigC"
                [control]="getFormControl(i, 'bigC')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="中分類"
                controlName="midC"
                [control]="getFormControl(i, 'midC')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="小分類"
                controlName="smallC"
                [control]="getFormControl(i, 'smallC')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="進價折數"
                controlName="discount"
                [control]="getFormControl(i, 'discount')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="調整前進價"
                controlName="padjprice"
                [control]="getFormControl(i, 'padjprice')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="調整後進價"
                controlName="aadjprice"
                [control]="getFormControl(i, 'aadjprice')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="調整前售價"
                controlName="padjprice"
                [control]="getFormControl(i, 'padjsaleprice')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="調整後售價"
                controlName="aadjprice"
                [control]="getFormControl(i, 'aadjsaleprice')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="單項說明"
                controlName="descript"
                [control]="getFormControl(i, 'descript')"
                [submitted]="submitted"
              ></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd
          (click)="onAddItem()"
        ></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
