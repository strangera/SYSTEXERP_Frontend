<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="銷售單號" controlName="salesCode" [control]="dataForm.controls.salesCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機號" controlName="machineCode" [control]="dataForm.controls.machineCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="交易序號" controlName="counterCode" [control]="dataForm.controls.counterCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="交易型態" controlName="transactionType" [options]="transactionTypeOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.transactionType"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="銷售金額" controlName="counterCode" [control]="dataForm.controls.counterCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="專櫃編號" controlName="counterCode" [options]="counterCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.counterCode" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number-range label="發票號碼" [startControl]="dataForm.controls.invoiceNumberFrom"
            [endControl]="dataForm.controls.invoiceNumberTo" [submitted]="submitted"></app-input-number-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text label="銷售說明" controlName="Description" [control]="dataForm.controls.Description"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-editor-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="銷售人員" controlName="salesPerson" [options]="userCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.salesPerson" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-range label="銷售日期" [startControl]="dataForm.controls.salesDateFrom"
            [endControl]="dataForm.controls.salesDateTo" [submitted]="submitted"></app-date-range>
        </div>
      </div>
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">

            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="商品管理編號/名稱" controlName="mgname" [control]="getFormControl(i, 'mgname')"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="單價(含稅)" controlName="price" [control]="getFormControl(i, 'price')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="數量" controlName="quantity" [control]="getFormControl(i, 'quantity')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="單位" controlName="unit" [control]="getFormControl(i, 'unit')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="總金額" controlName="sumprice" [control]="getFormControl(i, 'sumprice')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="折扣率" controlName="discountrate" [control]="getFormControl(i, 'discountrate')"
                [submitted]="submitted"></app-input-text>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="折扣" controlName="discount" [control]="getFormControl(i, 'discount')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="折讓" controlName="discount2" [control]="getFormControl(i, 'discount2')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="單項備註" controlName="remark" [control]="getFormControl(i, 'remark')"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
