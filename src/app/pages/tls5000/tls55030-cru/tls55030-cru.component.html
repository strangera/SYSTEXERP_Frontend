<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-datemm-one
            label="結帳年月"
            [control]="dataForm.controls.salesDateFrom"
            [submitted]="submitted"
          ></app-datemm-one>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="廠商編號"
            controlName="vendorCode"
            [options]="vendorOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.vendorCode"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票總金額"
            controlName="counterCode"
            [control]="dataForm.controls.counterCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票剩餘可折總金額"
            controlName="counterCode"
            [control]="dataForm.controls.counterCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="折讓總金額"
            controlName="counterCode"
            [control]="dataForm.controls.counterCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="餘額"
            controlName="counterCode"
            [control]="dataForm.controls.counterCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12">
          <app-data-table
            [data]="data"
            [columns]="columns"
            (edit)="onEdit($event)"
            (detail)="onDetail($event)"
          ></app-data-table>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="總金額"
            controlName="counterCode"
            [control]="dataForm.controls.counterCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12">
          <app-data-table
            [data]="data2"
            [columns]="columns2"
            (edit)="onEdit($event)"
            (detail)="onDetail($event)"
          ></app-data-table>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
