<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="倉別請領單編號" controlName="organizationRequestCode"
              [control]="queryForm.controls.organizationRequestCode" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請倉別" controlName="warehouseRequestCode" [options]="warehouseOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.warehouseRequestCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="商品管理編號" controlName="productManagerCode" [options]="productManagerOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.productManagerCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人編號" controlName="applicantCode" [options]="userCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.applicantCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門編號" controlName="organizationNumberCode" [options]="organizationNumberOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.organizationNumberCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range label="發貨日期" [startControl]="queryForm.controls.shipmentDateFrom"
              [endControl]="queryForm.controls.shipmentDateTo" [submitted]="submitted"></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別調撥單狀態" controlName="issuanceNoteStatus" [options]="issuanceNoteStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.issuanceNoteStatus"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
