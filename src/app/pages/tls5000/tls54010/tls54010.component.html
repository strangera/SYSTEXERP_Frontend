<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="銷售單號" controlName="salesCode" [control]="queryForm.controls.salesCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="銷售日期" [startControl]="queryForm.controls.salesDateFrom"
              [endControl]="queryForm.controls.salesDateTo" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機號" controlName="machineCode" [control]="queryForm.controls.machineCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="發票號碼" [startControl]="queryForm.controls.invoiceNumberFrom"
              [endControl]="queryForm.controls.invoiceNumberTo" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="交易序號範圍(起/迄)" [startControl]="queryForm.controls.transactionCodeFrom"
              [endControl]="queryForm.controls.transactionCodeTo" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="counterCode" [control]="queryForm.controls.counterCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="銷售狀態" controlName="salesStatus" [options]="salesStatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.salesStatus" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="銷售位置" controlName="salesLocation" [options]="salesLocationOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.salesLocation" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="銷售人員" controlName="salesPerson" [options]="userCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.salesPerson" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="交易型態" controlName="transactionType" [options]="transactionTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.transactionType"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)"></app-data-table>
  </div>
</div>
