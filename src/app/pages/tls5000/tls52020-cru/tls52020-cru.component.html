<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="退貨單編號" controlName="incomeOrder" [control]="dataForm.controls.incomeOrder" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="廠商編號" controlName="vendorID" [options]="vendorIDOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.vendorID" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="品牌編號" controlName="brand" [options]="brandOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.brand" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="倉別" controlName="storage" [options]="storageOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.storage" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="退貨金額" controlName="returnPrice" [control]="dataForm.controls.returnPrice" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="稅額" controlName="tax" [control]="dataForm.controls.tax" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="合計金額" controlName="totalPrice" [control]="dataForm.controls.totalPrice" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="申請人" controlName="applicant" [control]="dataForm.controls.applicant" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="申請日期" [control]="dataForm.controls.applicantdate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="售價總計" controlName="money" [control]="dataForm.controls.totalSales" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <hr>
            <app-editor-text label="退貨單說明" controlName="remark" [control]="dataForm.controls.remark" [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr>
            <!---->
            <hr>
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>商品 {{i+1}}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="商品管理編號/名稱" controlName="itemNumber" [control]="getFormControl(i, 'itemNumber')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="國際條碼" controlName="internationalBarcode" [control]="getFormControl(i, 'internationalBarcode')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="商品單位" controlName="itemUnit" [control]="getFormControl(i, 'itemUnit')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="包裝入數" controlName="packageNumber" [control]="getFormControl(i, 'packageNumber')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="稅別" controlName="taxType" [control]="getFormControl(i, 'taxType')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="數量" controlName="amount" [control]="getFormControl(i, 'amount')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="單價" controlName="singlePrice" [control]="getFormControl(i, 'singlePrice')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="小計" controlName="totalSinglePrice" [control]="getFormControl(i, 'totalSinglePrice')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="售價" controlName="salesPrice" [control]="getFormControl(i, 'salesPrice')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="售價小計" controlName="totalSalesPrice" [control]="getFormControl(i, 'totalSalesPrice')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr>
                    <app-editor-text label="單項備註" controlName="remark" [control]="getFormControl(i, 'remark')" [style]="{ height: '100px' }" [submitted]="submitted">
                    </app-editor-text>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
