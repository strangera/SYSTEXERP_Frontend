<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="品牌名稱(中文)"
              controlName="brandName"
              [options]="brandCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.brandName"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="管理編號"
              controlName="managementID"
              [options]="managementIDOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.managementID"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="管理編號
                  (管編,管編,管編)"
              controlName="managementIDText"
              [control]="queryForm.controls.managementIDText"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="國際條碼"
              controlName="barcode"
              [control]="queryForm.controls.barcode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商貨號"
              controlName="vendorItemNumber"
              [control]="queryForm.controls.vendorItemNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="大分類代碼"
              controlName="bigCategoryCode"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bigCategoryCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="中分類代碼"
              controlName="midCategoryCode"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.midCategoryCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="小分類代碼"
              controlName="smallCategoryCode"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.smallCategoryCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-editor-text
              label="系列"
              controlName="series"
              [style]="{ height: '100px' }"
              [control]="queryForm.controls.series"
              [submitted]="submitted"
            ></app-editor-text>
          </div>
          <!-- Additional fields for checkboxes and input fields -->
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="顯示庫存為零"
              formControlName="displayEmptyStock"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="顯示標準進價"
              formControlName="displayStandardCost"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="顯示圖片"
              formControlName="displayImage"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="顯示行數"
              controlName="rows"
              [control]="queryForm.controls.rows"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-data-table>
  </div>
</div>
