<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <h5>供應商資料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="供應商編號" controlName="supplierCode" [options]="supplierCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.supplierCode" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="付款天數" controlName="paymentDays" [control]="dataForm.controls.paymentDays" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="總金額" controlName="totalAmount" [control]="dataForm.controls.totalAmount" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="未稅(含免稅)金額" controlName="noTaxAmount" [control]="dataForm.controls.noTaxAmount" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="稅額" controlName="taxAmount" [control]="dataForm.controls.taxAmount" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
            <hr>
            <div class="card">
                <h5>單據資料</h5>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="總金額" controlName="totalAmount" [control]="dataForm.controls.totalAmount" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                </div>
                <hr>
                <ng-container formArrayName="items">
                    <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                        <div class="grid align-items-center">
                            <div class="col" style="flex: 1">
                                <h5>單據 {{ i + 1 }}</h5>
                            </div>
                            <div>
                                <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="驗收單號" controlName="orderNumber" [control]="getFormControl(i, 'orderNumber')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="未稅(含免稅)金額" controlName="noTaxAmount" [control]="getFormControl(i, 'noTaxAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="稅額" controlName="taxAmount" [control]="getFormControl(i, 'taxAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="總金額" controlName="totalAmount" [control]="getFormControl(i, 'totalAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <hr/>
                    </ng-container>
                </ng-container>
                <div class="pt-1">
                    <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
                </div>
            </div>
            <div class="card">
                <ng-container formArrayName="items">
                    <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                        <div class="grid align-items-center">
                            <div class="col" style="flex: 1">
                                <h5>單據 {{ i + 1 }}</h5>
                            </div>
                            <div>
                                <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="請款單據種類" controlName="requestType" [options]="requestTypeOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'requestType')" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="發票/收據號碼" controlName="invoiceNumber" [control]="getFormControl(i, 'invoiceNumber')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="發票/收據日期" controlName="invoiceDate" [control]="getFormControl(i, 'invoiceDate')" [submitted]="submitted">
                                </app-date-one>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="付款日期" [control]="getFormControl(i, 'payDatedd')" [submitted]="submitted">
                                </app-date-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-datemm-one label="申報年月" [control]="getFormControl(i, 'declareYm')" [submitted]="submitted">
                                </app-datemm-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="發票格式" controlName="invoiceFormat" [options]="invoiceFormatOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'invoiceFormat')" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="稅別" controlName="taxType" [options]="taxTypeOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'taxType')" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="未稅(含免稅)金額" controlName="noTaxAmount" [control]="getFormControl(i, 'noTaxAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="稅額" controlName="taxAmount" [control]="getFormControl(i, 'taxAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="總金額" controlName="totalAmount" [control]="getFormControl(i, 'totalAmount')" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <hr/>
                    </ng-container>
                </ng-container>
                <!-- <div class="pt-1">
                    <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
                </div> -->
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
