<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
          </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="盤點單號"
              controlName="Inventoryordernumber"
              [options]="Inventoryordenumber"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Inventoryordernumber"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="盤點狀態"
              controlName="Inventorystatus"
              [options]="Inventorystatus"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Inventorystatus"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="盤點日期"
              [startControl]="queryForm.controls.SInventorydate"
              [endControl]="queryForm.controls.EInventorydate"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="結案日期"
              [startControl]="queryForm.controls.SClosingdate"
              [endControl]="queryForm.controls.EClosingdate"
              [submitted]="submitted"
            >
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="盤點人員"
              controlName="Counter"
              [options]="usercode"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Counter"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="說明"
              controlName="illustrate"
              [control]="queryForm.controls.illustrate"
              [submitted]="submitted"
            >
            </app-input-text>

          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="報表型態"
              [control]="queryForm.controls.Reporttype"
              [options]="Reporttype"
              [submitted]="submitted"
            >
            </app-radiobutton>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
