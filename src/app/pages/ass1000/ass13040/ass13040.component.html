<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="商品報廢單編號" controlName="scrapCode" [control]="queryForm.controls.scrapCode" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="商品管理編號" controlName="manageCode" [options]="manageCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.manageCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="報廢人員編號" controlName="userCode" [options]="userCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.userCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="部門代號" controlName="departmentCode" [options]="departmentCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.departmentCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="報廢申請日期" [startControl]="queryForm.controls.scrapDateFrom" [endControl]="queryForm.controls.scrapDateTo" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="商品報廢單狀態" controlName="scrapStatus" [options]="scrapStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.scrapStatus" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
