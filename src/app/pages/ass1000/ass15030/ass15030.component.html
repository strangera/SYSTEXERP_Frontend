<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <!-- <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="報表型態" groupname="paperType" [control]="queryForm.controls.paperType"
                            [options]="paperTypeOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                </div>
                <hr />
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="會計科目代碼" controlName="Accountcode" [options]="AccountcodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.accountcode"
                            [submitted]="submitted"></app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="保管單位" controlName="keeperUnit" [options]="organizationOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.keeperUnit"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="購入日期"
                            [startControl]="queryForm.controls.purchaseDateFrom"
                            [endControl]="queryForm.controls.purchaseDateTo" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="大分類編號" controlName="bigCategoryCode" [options]="bigCategoryCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.bigCategoryCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="中分類編號" controlName="midCategoryCode" [options]="midCategoryCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.midCategoryCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="小分類編號" controlName="smlCategoryCode" [options]="midCategoryCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.smlCategoryCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="入帳日期"
                            [startControl]="queryForm.controls.entryDateFrom"
                            [endControl]="queryForm.controls.entryDateTo" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="品項編號" controlName="itemCode" [options]="itemCodeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.itemCode"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar calendarType="dateMonthOne" label="基準日" [control]="queryForm.controls.baseYYMM"
                            [submitted]="submitted">
                        </app-calendar>
                    </div>
                </div>
                <hr>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-4 lg:col-4">
                        <app-checkbox-one label="是否顯示取得金額為0" controlName="showReceiveAmount"
                            [control]="queryForm.controls.showReceiveAmount">
                        </app-checkbox-one>
                    </div>
                    <div class="col-12 md:col-4 lg:col-4">
                        <app-checkbox-one label="是否顯示當期報廢、變賣資料" controlName="showScrapData"
                            [control]="queryForm.controls.showScrapData">
                        </app-checkbox-one>
                    </div>
                </div>
                <hr>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="報表樣式" controlName="reportStyle" [options]="reportStyleOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.reportStyle"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
