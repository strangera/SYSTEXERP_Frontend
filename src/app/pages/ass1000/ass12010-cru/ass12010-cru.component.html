<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="申請人代號" controlName="applicantCode" [options]="applicantCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.applicantCode" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="部門代號" controlName=" organizationNumber" [options]="organizationNumberOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.organizationNumber" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="需求日期" [control]="dataForm.controls.requestDate" [submitted]="submitted">
                    </app-date-one>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="需求期限(天)" controlName="demandLimit" [control]="dataForm.controls.demandLimit" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="倉別" controlName="storage" [options]="storageOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.storage" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <hr/>
                <app-editor-text label="說明" controlName="remark" [control]="dataForm.controls.remark" [style]="{ height: '100px' }" [submitted]="submitted">
                </app-editor-text>
            <hr/>
            <hr />
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1">
                            <h5>品項 {{ i + 1 }}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="品項代碼" controlName="itemCode" [options]="itemCodeOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'itemCode')" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="保管人" controlName="keepingPerson" [options]="applicantCodeOptions" optionLabel="label" optionValue="value" [control]="getFormControl(i, 'keepingPerson')" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="保管單位" controlName="keepingUnit" [control]="getFormControl(i, 'keepingUnit')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="單位" controlName="unit" [control]="getFormControl(i, 'unit')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="數量" controlName="amount" [control]="getFormControl(i, 'amount')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr/>
                    <app-editor-text label="單項說明" controlName="editortext" [control]="getFormControl(i, 'amount')" [style]="{ height: '100px' }" [submitted]="submitted">
                    </app-editor-text>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
