<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <!-- <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div> -->
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="資產代號" controlName="assetsCode" [control]="queryForm.controls.assetsCode" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="品項編號" controlName="itemCode" [options]="itemCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.itemCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="攤提代號" controlName="shareCode" [control]="queryForm.controls.shareCode" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="購入日期" [startControl]="queryForm.controls.purchaseDateFrom" [endControl]="queryForm.controls.purchaseDateTo" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="資產狀態" controlName="assetStatus" [options]="assetsStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.assetStatus" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <hr>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-two-dialog label="保管人" controlName="keeper" [control]="queryForm.controls.keeper" [submitted]="submitted">
                        </app-input-two-dialog>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-two-dialog label="保管人" controlName="keeperUnit" [control]="queryForm.controls.keeperUnit" [submitted]="submitted">
                        </app-input-two-dialog>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-two-dialog label="使用人" controlName="user" [control]="queryForm.controls.user" [submitted]="submitted">
                        </app-input-two-dialog>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-two-dialog label="使用單位" controlName="userUnit" [control]="queryForm.controls.userUnit" [submitted]="submitted">
                        </app-input-two-dialog>
                    </div>
                </div>
                <hr>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="資產類型" controlName="assetType" [options]="assetTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.assetType" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="會計科目代號" controlName="accountingCode" [options]="accountingCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.accountingCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="購入金額" [startControl]="queryForm.controls.purchaseAmountFrom" [endControl]="queryForm.controls.purchaseAmountTo" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="驗收單號" controlName="orderNumber" [options]="orderNumberOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.orderNumber" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="入帳日期" [startControl]="queryForm.controls.entryDateFrom" [endControl]="queryForm.controls.entryDateTo" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="顯示筆數" controlName="displayNumber" [control]="queryForm.controls.displayNumber" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                </div>
                <hr>
                <div class="col-12 md:col-4 lg:col-4">
                    <app-checkbox-one label="已達耐用年限" controlName="outofLimit" [control]="queryForm.controls.outofLimit">
                    </app-checkbox-one>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
