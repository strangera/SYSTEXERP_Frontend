<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <!-- <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div> -->
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="清點單號" [startControl]="queryForm.controls.inventory_NumberFrom" [endControl]="queryForm.controls.inventory_NumberTo" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="清點日期" [startControl]="queryForm.controls.inventory_DateFrom" [endControl]="queryForm.controls.inventory_DateTo" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="清點人代碼" controlName="inventory_PersonCode" [options]="userCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.inventory_PersonCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="資產狀態(盤點後)" controlName="inventory_DataStatus" [options]="dataStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.inventory_DataStatus" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="資產類別" controlName="assetsType" [options]="assetsTypeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.assetsType" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
