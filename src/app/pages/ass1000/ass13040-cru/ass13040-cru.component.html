<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <h5>報廢主檔資料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="商品報廢單編號" controlName="scrapCode"
                        [control]="dataForm.controls.scrapCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="報廢人員編號" controlName="userCode" [options]="userCodeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.userCode" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="部門代號" controlName="departmentCode" [options]="departmentCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.departmentCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="報廢廠商" controlName="scrapVendor" [options]="scrapVendorOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.scrapVendor"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="報廢申請日期" [control]="dataForm.controls.scrapDate"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="資產類型" controlName="assetsType" [options]="assetsTypeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.assetsType"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <hr />
            <app-editor-text label="報廢案件說明" controlName="remark" [control]="dataForm.controls.remark"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr />
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1">
                            <h5>商品 {{ i + 1 }}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                                class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="商品管理編號" controlName="manageCode" [options]="manageCodeOptions"
                                optionLabel="label" optionValue="value" [control]="getFormControl(i, 'manageCode')"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="商品單位" controlName="unit" [control]="getFormControl(i, 'unit')"
                                [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="數量" controlName="amount" [control]="getFormControl(i, 'amount')"
                                [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr />
                    <app-editor-text label="單項說明 " controlName="singleRemark"
                        [control]="getFormControl(i, 'singleRemark')" [style]="{ height: '100px' }"
                        [submitted]="submitted">
                    </app-editor-text>
                    <hr />
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
