<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
        <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text
              label="調撥單號"
              controlName="dialnumber"
              [control]="queryForm.controls.dialnumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="建立日期"
              controlName="creationDate "
              [startControl]="queryForm.controls.ScreationDate"
              [endControl]="queryForm.controls.EcreationDate"
              [submitted]="submitted"
            ></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-range
              label="轉帳日期"
              controlName="transferdate "
              [startControl]="queryForm.controls.Stransferdate"
              [endControl]="queryForm.controls.Etransferdate"
              [submitted]="submitted"
            ></app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="轉入公司銀行科目代號"
              controlName="TCBAC"
              [options]="TCBACOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TCBAC"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="轉出公司銀行科目代號"
              controlName="TOCBAC"
              [options]="TOCBACOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TOCBAC"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-data-table>
  </div>
</div>
