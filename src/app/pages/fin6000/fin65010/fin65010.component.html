<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
    <p-accordion>
      <p-accordionTab
        header="{{ 'query-conditions' | translate }}"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmit(queryForm)"
        >
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="廠商代號"
                controlName="vander"
                [options]="vendorOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.vander"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-serial-number-range
                label="票據號碼"
                [startControl]="queryForm.controls.STicketnumber"
                [endControl]="queryForm.controls.ETicketnumber"
                [submitted]="submitted"
              >
              </app-input-serial-number-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="開票日期"
                controlName="generalCode"
                [startControl]="queryForm.controls.startdate"
                [endControl]="queryForm.controls.enddate"
                [submitted]="submitted"
              ></app-date-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
            label="開票單號"
            controlName="Billingordernumber"
            [options]="Billingordernumber"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.Billingordernumber"
            [submitted]="submitted"
          ></app-dropdown-item>
            </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-serial-number-range
              label="傳票號碼"
              [startControl]="queryForm.controls.Ssubpoenanumber"
              [endControl]="queryForm.controls.Esubpoenanumber"
              [submitted]="submitted"
            >
            </app-input-serial-number-range>
          </div>
          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  <div class="card">
    <div class="col-12">
      <app-data-table
        [data]="data"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      ></app-data-table>
    </div>
  </div>
