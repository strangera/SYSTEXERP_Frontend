<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- <div class="col-12 md:col-6 lg:col-4">
              <app-date-one

                [submitted]="submitted"

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="調撥單號"
            controlName="dialnumber"
            [control]="dataForm.controls.dialnumber"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="建立者"
            controlName="founder"
            [options]="founder"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.founder"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one
            label="建立日期"
            controlName="creationDate "
            [control]="dataForm.controls.creationDate"
            [submitted]="submitted"
          ></app-date-one>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one
            label="轉帳日期"
            controlName="transferdate "
            [control]="dataForm.controls.transferdate"
            [submitted]="submitted"
          ></app-date-one>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="轉入公司銀行科目代號"
            controlName="TCBAC"
            [options]="TCBACOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.TCBAC"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="轉出公司銀行科目代號"
            controlName="TOCBAC"
            [options]="TOCBACOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.TOCBAC"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="金額"
              controlName="dialnumber"
              [control]="dataForm.controls.dialnumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="手續費"
              controlName="dialnumber"
              [control]="dataForm.controls.dialnumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="dialnumber"
              [control]="dataForm.controls.dialnumber"
              [submitted]="submitted"
            >
            </app-input-text>
          </div>
      </div>

    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"

      </div>
    </div>
