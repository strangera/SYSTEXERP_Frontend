<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <!-- 異動使用者代碼 -->
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="異動使用者代碼" controlName="userCodeMod" [options]="userCodeModOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.userCodeMod" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <!-- 角色代碼 -->
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="角色代碼" controlName="roleCode" [options]="roleCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.roleCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <!-- 變更時間 -->
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="變更時間" [startControl]="queryForm.controls.changeStartTime" [endControl]="queryForm.controls.changeEndTime" [submitted]="submitted">
                        </app-date-range>
                    </div>
                </div>

                <!-- 查詢與清除按鈕區 -->
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-12">
        <app-data-table-report [data]="data" [columns]="columns"></app-data-table-report>
    </div>
</div>
