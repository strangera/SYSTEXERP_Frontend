<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onNext(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="請依據所要申請的系統權限，選擇主系統項目。" controlName="systemTypeDetailOptions" [options]="systemTypeDetailOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.systemTypeDetail" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-action label="下一步" icon="pi pi-arrow-right" (onClick)="onSubmitNext(queryForm)"></app-button-action>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
    </div>
</div>
