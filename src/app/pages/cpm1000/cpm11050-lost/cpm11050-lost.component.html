<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="action" label="重新廣播" icon="pi pi-book" class="col"></app-button>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="action" label="已領回" icon="pi pi-book" class="col"></app-button>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="記錄編號" controlName="recordCode"
                        [control]="dataForm.controls.recordCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-datetime-one label="登錄日期" controlName="registerDate" [control]="dataForm.controls.registerDate"
                        [submitted]="submitted">
                    </app-datetime-one>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="失物狀態" controlName="lostStatus" [options]="lostStatusOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.lostStatus"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="遺失日期" controlName="lossDate" [control]="dataForm.controls.lossDate"
                        [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="地點" controlName="location" [control]="dataForm.controls.location"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="轉出日期" controlName="location" [control]="dataForm.controls.transferDate"
                        [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="登錄者" controlName="register" [control]="dataForm.controls.register"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="物品類別" controlName="objectType" [options]="objectTypeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.objectType"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="服務人員" controlName="serviceStaff" [control]="dataForm.controls.serviceStaff"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="通知日期" controlName="notificationDate"
                        [control]="dataForm.controls.notificationDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-radiobutton label="是否廣播" groupname="broadcastStatus"
                        [control]="dataForm.controls.broadcastStatus" [options]="broadcastStatusOptions"
                        [submitted]="submitted">
                    </app-radiobutton>
                </div>
            </div>
            <hr />
            <app-editor-text label="物品敘述" controlName="objectDescription"
                [control]="dataForm.controls.objectDescription" [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr>
            <h5>領回資訊</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="領回日期" controlName="receiverDate" [control]="dataForm.controls.receiverDate"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="領回者姓名" controlName="receiverName" [control]="dataForm.controls.receiverName"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="領回人聯絡電話" controlName="receiverPhone"
                        [control]="dataForm.controls.receiverPhone" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="協助顧客領回處理人員" controlName="helperName" [control]="dataForm.controls.helperName"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr>
            <h5>遺失/拾獲者基本資料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="報失者/拾獲者姓名" controlName="reporterName"
                        [control]="dataForm.controls.reporterName" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="報失者/拾獲者身分別" controlName="reporterIdentity" [options]="reporterOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.reporterIdentity"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="報失者/拾獲者性別" controlName="finderGender" [options]="genderOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.reporterGender"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="電話(日)" controlName="dayPhone"
                        [control]="dataForm.controls.dayPhone" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="電話(夜)" controlName="nightPhone"
                        [control]="dataForm.controls.nightPhone" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="手機" controlName="cellphone"
                        [control]="dataForm.controls.cellphone" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="證件號碼" controlName="idNumber"
                        [control]="dataForm.controls.idNumber" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-8">
                    <app-input-text label="聯絡地址" controlName="address" [control]="dataForm.controls.address"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
