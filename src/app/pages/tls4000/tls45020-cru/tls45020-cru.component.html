<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="排程編號" controlName="ECR_SchNo" [control]="dataForm.controls.ECR_SchNo" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="設定啟用日期" controlName="ECR_SchDate" [control]="dataForm.controls.ECR_SchDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-multi-select label="排程狀態" controlName="ECR_SchStatus" [options]="ECR_SchStatus_Options" optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SchStatus" [submitted]="submitted">
                    </app-multi-select>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="dataForm.controls.SYS_StoreNo" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-datetime-one label="異動作業完成時間" controlName="ECR_SchFinTime" [control]="dataForm.controls.ECR_SchFinTime" [submitted]="submitted">
                    </app-datetime-one>
                </div>
            </div>
            <hr>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="原機台所屬專櫃編號" controlName="ORG_ECR_TLT_No" [control]="dataForm.controls.ORG_ECR_TLT_No" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="機台所屬專櫃編號" controlName="ECR_TLT_No" [control]="dataForm.controls.ECR_TLT_No" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="機台所屬收銀員" controlName="ORG_ECR_USR_No" [control]="dataForm.controls.ORG_ECR_USR_No" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="新機台所屬收銀員" controlName="ECR_USR_No" [control]="dataForm.controls.ECR_USR_No" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="原模版編號" controlName="ORG_ECR_TmplNo" [control]="dataForm.controls.ORG_ECR_TmplNo" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="新模版編號" controlName="ECR_TmplNo" [control]="dataForm.controls.ECR_TmplNo" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="原收銀機狀態" controlName="ORG_ECR_Status" [control]="dataForm.controls.ORG_ECR_Status" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="收銀機狀態" controlName="ECR_Status" [control]="dataForm.controls.ECR_Status" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
