<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="門市店號" controlName="STO_No" [control]="queryForm.controls.STO_No" [submitted]="submitted">
                                </app-input-text>
                            </div> -->
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="收銀機號" controlName="ECR_No" [control]="queryForm.controls.ECR_No"
                                    [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="開始時間" controlName="NOT_BegDateTime"
                                    [control]="queryForm.controls.NOT_BegDateTime" [submitted]="submitted">
                                </app-date-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="結束時間" controlName="NOT_EndDateTime"
                                    [control]="queryForm.controls.NOT_EndDateTime" [submitted]="submitted">
                                </app-date-one>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-datetime-one label="通告產生時間" [control]="queryForm.controls.NOT_DateTime" [submitted]="submitted">
                                </app-datetime-one>
                            </div> -->
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="通告顯示種類" controlName="NOT_Type" [options]="NOT_Type_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.NOT_Type" [submitted]="submitted">
                                </app-multi-select>
                            </div> -->
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="通告狀態" controlName="NOT_Status" [options]="NOT_Status_Options"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.NOT_Status"
                                    [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-8">
                                <app-input-text label="通告備註" controlName="NOT_Remark"
                                    [control]="queryForm.controls.NOT_Remark" [submitted]="submitted">
                                </app-input-text>
                            </div>
                        </div>
                        <!-- <hr/>
                            <app-editor-text label="通告內容" controlName="NOT_Desc" [control]="queryForm.controls.NOT_Desc" [style]="{ height: '100px' }" [submitted]="submitted">
                            </app-editor-text>
                        <hr> -->
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <app-data-table-group [data]="data" [columns]="columns" [subColumns]="subColumns" (edit)="onEdit($event)"
                (detail)="onDetail($event)">
            </app-data-table-group>
        </div>
    </div>
</div>
