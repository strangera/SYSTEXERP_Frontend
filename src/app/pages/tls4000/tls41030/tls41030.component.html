<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-demo label="專櫃人員密碼簽收表" class="col"></app-button-demo>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀員編號" controlName="USR_No" [control]="queryForm.controls.USR_No" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="收銀員姓名" controlName="USR_Name" [control]="queryForm.controls.USR_Name" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀員授權等級" controlName="USR_Auth" [control]="queryForm.controls.USR_Auth" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="收銀員狀態" controlName="USR_JobStatus" [options]="USR_JobStatus_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.USR_JobStatus" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="收銀員等級" controlName="USR_Class" [options]="USR_Class_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.USR_Class" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="收銀員區分" controlName="USR_RegType" [options]="USR_RegType_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.USR_RegType" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀員所屬櫃編" controlName="USR_TLT_No" [control]="queryForm.controls.USR_TLT_No" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="收銀員所屬專櫃名稱" controlName="USR_TLT_Name" [control]="queryForm.controls.USR_TLT_Name" [submitted]="submitted">
                                </app-input-text>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="啟用日期" controlName="USR_OnJobDate" [control]="queryForm.controls.USR_OnJobDate" [submitted]="submitted">
                                </app-date-one>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="停用日期" controlName="USR_QuitDate" [control]="queryForm.controls.USR_QuitDate" [submitted]="submitted">
                                </app-date-one>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
