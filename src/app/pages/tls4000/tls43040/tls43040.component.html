<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="機台群組編號" controlName="ECR_GrpNo"
                                    [control]="queryForm.controls.ECR_GrpNo" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="機台群組名稱" controlName="ECR_GrpName"
                                    [control]="queryForm.controls.ECR_GrpName" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="是否限制機台條件" controlName="ECR_DtlLimit"
                                    [options]="ECR_DtlLimit_Options" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.ECR_DtlLimit" [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <!-- <hr>
                        <app-editor-text label="機台群組備註" controlName="ECR_GrpDesc" [control]="queryForm.controls.ECR_GrpDesc" [style]="{ height: '100px' }" [submitted]="submitted">
                        </app-editor-text>
                        <hr /> -->
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
