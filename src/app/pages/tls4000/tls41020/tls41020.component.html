<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="queryForm.controls.SYS_StoreNo" [submitted]="submitted">
                                </app-input-serial-number>
                            </div> -->
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀機號" controlName="ECR_No" [control]="queryForm.controls.ECR_No" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="信用卡刷卡機代碼" controlName="EDC_No" [control]="queryForm.controls.EDC_No" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="收銀機位置" controlName="ECR_LocNo" [control]="queryForm.controls.ECR_LocNo" [submitted]="submitted">
                                </app-input-serial-number>
                            </div> -->
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="啟用日期" [startControl]="queryForm.controls.EDC_BegDate_From" [endControl]="queryForm.controls.EDC_BegDate_To" [submitted]="submitted">
                                </app-date-range>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-range label="停用日期" [startControl]="queryForm.controls.EDC_EdnDate_From" [endControl]="queryForm.controls.EDC_EdnDate_To" [submitted]="submitted">
                                </app-date-range>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="信用卡刷卡機狀態" controlName="EDC_Status" [options]="EDC_Status_Option" optionLabel="label" optionValue="value" [control]="queryForm.controls.EDC_Status" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="機台所屬專櫃編號" controlName="ECR_TLT_No" [control]="queryForm.controls.ECR_TLT_No" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="機台所屬專櫃名稱" controlName="ECR_TLT_Name" [control]="queryForm.controls.ECR_TLT_Name" [submitted]="submitted">
                                </app-input-text>
                            </div> -->
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第一台信用卡刷卡機IP" controlName="EDC_IP1" [control]="queryForm.controls.EDC_IP1" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第一台信用卡刷卡機端末機代碼" controlName="EDC_TmID1" [control]="queryForm.controls.EDC_TmID1" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第二台信用卡刷卡機IP" controlName="EDC_IP2" [control]="queryForm.controls.EDC_IP2" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第二台信用卡刷卡機端末機代碼" controlName="EDC_TmID2" [control]="queryForm.controls.EDC_TmID2" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第三台信用卡刷卡機IP" controlName="EDC_IP3" [control]="queryForm.controls.EDC_IP3" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-serial-number label="第三台信用卡刷卡機端末機代碼" controlName="EDC_TmID3" [control]="queryForm.controls.EDC_TmID3" [submitted]="submitted">
                                </app-input-serial-number>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
