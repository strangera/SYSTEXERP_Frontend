<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" label="反停用" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <h6>挑選條件</h6>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-editor-text label="收銀機代碼" controlName="editortext"
                                    [control]="queryForm.controls.editortext" [style]="{ height: '100px' }"
                                    [submitted]="submitted">
                                </app-editor-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="群組名稱" controlName="groupName" [options]="groupNameOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.groupName"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <hr>
                        <h6>群組資料類別</h6>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-4 lg:col-4">
                                <app-checkbox-one label="上傳 POS環境變數檔" controlName="uploadEnv"
                                    [control]="queryForm.controls.uploadEnv">
                                </app-checkbox-one>
                            </div>
                            <div class="col-12 md:col-4 lg:col-4">
                                <app-checkbox-one label="上傳 TOUCH功能按鈕開/關設定檔" controlName="uploadTouch"
                                    [control]="queryForm.controls.uploadTouch">
                                </app-checkbox-one>
                            </div>
                        </div>
                        <hr>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-date-one label="起始日期" [control]="queryForm.controls.onedatedd"
                                    [submitted]="submitted">
                                </app-date-one>
                            </div>
                        </div>
                        <hr>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
