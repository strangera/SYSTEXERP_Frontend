<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <!-- <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div> -->
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <!-- <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="queryForm.controls.SYS_StoreNo" [submitted]="submitted">
                        </app-input-text>
                    </div> -->
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="收銀機號" controlName="ECR_No" [control]="queryForm.controls.ECR_No"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number label="每期發票預設配號量" controlName="ECR_GUI_PeriodQty"
                            [control]="queryForm.controls.ECR_GUI_PeriodQty" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number label="發票最小安全存量" controlName="ECR_GUI_MinQty"
                            [control]="queryForm.controls.ECR_GUI_MinQty" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <!-- <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="收銀機名稱" controlName="ECR_Name" [control]="queryForm.controls.ECR_Name" [submitted]="submitted">
                        </app-input-text>
                    </div> -->
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="機台類型" controlName="ECR_Type" [options]="ECR_Type_Option"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.ECR_Type"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <hr>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
