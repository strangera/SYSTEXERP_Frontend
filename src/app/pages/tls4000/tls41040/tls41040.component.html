<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="queryForm.controls.SYS_StoreNo" [submitted]="submitted">
                                </app-input-text>
                            </div> -->
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number label="收銀機號" controlName="ECR_No"
                                    [control]="queryForm.controls.ECR_No" [submitted]="submitted">
                                </app-input-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="清機日期" controlName="ECR_SettleDD" [options]="ECR_SettleDD_Options"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.ECR_SettleDD"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-time-one label="清機時間" controlName="ECR_SettleHHNN"
                                    [control]="queryForm.controls.ECR_SettleHHNN" [submitted]="submitted">
                                </app-time-one>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
