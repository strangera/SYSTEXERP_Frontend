<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="中分類代碼" controlName="bus_class" [control]="queryForm.controls.bus_class"
              [submitted]="submitted">>
            </app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="中分類名稱" controlName="bus_class_name" [control]="queryForm.controls.bus_class_name"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="所屬大分類" controlName="industryType" [options]="option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.bus_type" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <!-- <div *appHasPermission="queryPermission" class="col"> -->
        <hr>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
    [showCheckBox]="true" dataKey="id" [multiSortMeta]="[{ field: 'bus_class', order: 1 }]"
    [totalRecords]="totalRecords" [loading]="loading">
  </app-table>
</div>
