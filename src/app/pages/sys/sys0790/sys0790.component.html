<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="使用者" controlName="UserCodeOptions" [options]="UserCodeOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.UserCodeOptions" [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar-range calendarType="dateTimeRange" label="LOG日期時間"
                  [startControl]="queryForm.controls.lastLoginStartTime"
                  [endControl]="queryForm.controls.lastLoginEndTime" [submitted]="submitted">
                </app-calendar-range>
              </div>

              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="作業代碼" controlName="systemTypeDetailOptions" [options]="systemTypeDetailOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.systemTypeDetail"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <div *appHasPermission="queryPermission" class="col">
              <div class="grid justify-content-end">
                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-12">
        <app-table [showCheckBox]="true" [data]="data" [columns]="columns" (edit)="onEdit($event)"
          (detail)="onDetail($event)">
        </app-table>
      </div>
    </div>
  </div>
</div>
