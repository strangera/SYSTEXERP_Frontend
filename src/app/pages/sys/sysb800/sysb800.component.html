<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- <app-input-number [useGrouping]="false" label="大分類代號" controlName="industryCode"
                  [control]="queryForm.controls.industryCode" [submitted]="submitted">>
                </app-input-number> -->
            <app-input-text label="大分類代號" controlName="industryCode" [control]="queryForm.controls.bus_type"
              [submitted]="submitted">>
            </app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <!-- <app-input-text label="大分類名稱" controlName="industryName" [control]="queryForm.controls.industryName"
                  [submitted]="submitted">
                </app-input-text> -->
            <app-input-text label="大分類名稱" controlName="bus_type_name" [control]="queryForm.controls.bus_type_name"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="備註" controlName="bus_type_desc" [control]="queryForm.controls.bus_type_desc"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="SYSB800" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
    [showCheckBox]="true" dataKey="id" [multiSortMeta]="[{ field: 'bus_type', order: 1 }]" [totalRecords]="totalRecords"
    [lazy]="true" (lazyLoadData)="onLazyLoadData($event, queryForm);onSubmit(queryForm)"
    [isRowSelectable]="isRowSelectable" [loading]="loading">
  </app-table>
</div>
