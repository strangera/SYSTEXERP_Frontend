<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="小分類代碼" controlName="bus_sclass" [control]="dataForm.controls.bus_sclass"
            [submitted]="submitted">>
          </app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text label="小分類名稱" controlName="bus_sclass_name" [control]="dataForm.controls.bus_sclass_name"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="所屬大分類代碼/名稱" controlName="bus_type" [options]="optionsBig" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.bus_type" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="中分類代碼/名稱" controlName="bus_class" [options]="optionsMid" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.bus_class" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <app-input-textarea class="col-12 md:col-6 lg:col-5" label="說明" controlName="textarea"
          [control]="dataForm.controls.bus_sclass_desc" [submitted]="submitted" />
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
      </div>
    </form>
  </p-panel>
</div>
