<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <h5>基 本 資 料</h5>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商編號" controlName="VEN_No" [control]="dataForm.controls.VEN_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="" [control]="dataForm.controls.VEN_Uniform" [submitted]="submitted" placeholder="輸入文字">
            <header>

              <app-radiobutton label="" [control]="dataForm.controls.VEN_Flag" [options]="[
      { value: '1', label: '統一編號' },
      { value: '2', label: '身份證字號' },
      { value: '3', label: '護照證號' }
    ]" [submitted]="submitted">
              </app-radiobutton>
            </header>
          </app-input-text>
        </div>



        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商統一編號或身份證字號" controlName="VEN_Uniform" [control]="dataForm.controls.VEN_Uniform"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="郵電負擔模式" controlName="VEN_RemitFeeMode" [control]="dataForm.controls.VEN_RemitFeeMode"
            [options]="remitFeeOptions" optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商名稱(中文)" controlName="VEN_Name" [control]="dataForm.controls.VEN_Name"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商名稱(英文)" controlName="VEN_EngName" [control]="dataForm.controls.VEN_EngName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商簡稱" controlName="VEN_ShortName" [control]="dataForm.controls.VEN_ShortName"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <h5>公 司 資 料</h5>
      <div class="grid p-fluid">

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司地址郵遞區號" controlName="VEN_Post" [control]="dataForm.controls.VEN_Post"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司登記地址" controlName="VEN_Address" [control]="dataForm.controls.VEN_Address"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司發票地址" controlName="VEN_GUIAddr" [control]="dataForm.controls.VEN_GUIAddr"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司電話" controlName="VEN_Tel" [control]="dataForm.controls.VEN_Tel"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司傳真" controlName="VEN_Fax" [control]="dataForm.controls.VEN_Fax"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司電子郵件" controlName="VEN_Email" [control]="dataForm.controls.VEN_Email"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司發票電子郵件" controlName="VEN_GUIEmail" [control]="dataForm.controls.VEN_GUIEmail"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <h5>聯 絡 人</h5>
      <div class="grid p-fluid">

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人" controlName="VEN_Boss" [control]="dataForm.controls.VEN_Boss"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人職稱" controlName="VEN_BossTitle" [control]="dataForm.controls.VEN_BossTitle"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人身份證字號" controlName="VEN_BossID" [control]="dataForm.controls.VEN_BossID"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人地址" controlName="VEN_BossAddr" [control]="dataForm.controls.VEN_BossAddr"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人電子郵件" controlName="VEN_BossEmail" [control]="dataForm.controls.VEN_BossEmail"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <h5>付 款 資 料</h5>
      <div class="grid p-fluid">

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="付款方式" controlName="VEN_PayType" [control]="dataForm.controls.VEN_PayType"
            [options]="payTypeOptions" optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="匯款銀行代碼" controlName="VEN_BNK_No" [control]="dataForm.controls.VEN_BNK_No"
            [options]="bankCodeOptions" optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="匯款帳號" controlName="VEN_BankAccountNo" [control]="dataForm.controls.VEN_BankAccountNo"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="匯款帳號名稱" controlName="VEN_AccountName" [control]="dataForm.controls.VEN_AccountName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="付款期限" controlName="VEN_PayConditionDay"
            [control]="dataForm.controls.VEN_PayConditionDay" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <h5>其 他 資 料</h5>
      <div class="grid p-fluid">

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="票據抬頭" controlName="VEN_CheckTitle" [control]="dataForm.controls.VEN_CheckTitle"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="VEN_Remark" [control]="dataForm.controls.VEN_Remark"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
