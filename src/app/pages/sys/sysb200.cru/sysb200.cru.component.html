<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <h5>基 本 資 料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商編號" controlName="manufacturerID"
                        [control]="dataForm.controls.manufacturerID" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-radiobutton groupname="manufacturerUID" [control]="dataForm.controls.manufacturerUID"
                        [options]="manufacturerUIDOptions" [submitted]="submitted">
                    </app-radiobutton>
                    <app-input-text controlName="manufacturerUID" [control]="dataForm.controls.manufacturerUID"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="郵電費負擔" controlName="postageCharge" [options]="postageChargeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.postageCharge"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商名稱(中文)" controlName="manufacturerCName"
                        [control]="dataForm.controls.manufacturerCName" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商名稱(英文)" controlName="manufacturerEName"
                        [control]="dataForm.controls.manufacturerEName" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商簡稱" controlName="manufacturerSName"
                        [control]="dataForm.controls.manufacturerSName" [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <hr>
            <h5>公 司 資 料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公司登記地址(中文)" controlName="registeredAddress"
                        [control]="dataForm.controls.registeredAddress" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="發票地址" controlName="mailingAddress"
                        [control]="dataForm.controls.mailingAddress" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" label="同公司登記地址" (click)="demoShowUp()" class="col"></app-button>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公司登記電話" controlName="registeredPhone"
                        [control]="dataForm.controls.registeredPhone" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公司傳真" controlName="companyFax" [control]="dataForm.controls.companyFax"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公司電子郵件" controlName="companyEmail" [control]="dataForm.controls.companyEmail"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="發票電子郵件" controlName="registeredEmail"
                        [control]="dataForm.controls.registeredEmail" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公司網址" controlName="companyWebsite"
                        [control]="dataForm.controls.companyWebsite" [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <hr>
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>聯 絡 人 資 料 {{i+1}}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                                class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人" controlName="contactPerson"
                                [control]="getFormControl(i, 'contactPerson')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人職稱" controlName="contactPersonTitle"
                                [control]="getFormControl(i, 'contactPersonTitle')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人身份証字號" controlName="contactPersonUID"
                                [control]="getFormControl(i, 'contactPersonUID')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人電話" controlName="contactPersonPhone"
                                [control]="getFormControl(i, 'contactPersonPhone')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人聯絡地址" controlName="contactAddress"
                                [control]="getFormControl(i, 'contactAddress')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="聯絡人電子郵件" controlName="contactEmail"
                                [control]="getFormControl(i, 'contactEmail')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd *ngIf="isRead()" label="聯絡人資料"
                    (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
            <hr>
            <h5>付 款 資 料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="付款方式" controlName="paynayMethod" [options]="paymentMethodOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.paynayMethod"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="廠商匯款銀行代號" controlName="payBankCode" [options]="payBankAccountOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.payBankCode"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商銀行帳號" controlName="payBankID" [control]="dataForm.controls.payBankID"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="廠商帳戶名稱" controlName="payBankAccount"
                        [control]="dataForm.controls.payBankAccount" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="付款期限(天數)" controlName="payDay" [options]="t111Options" optionLabel="SYS_Name"
                        optionValue="id" [control]="dataForm.controls.payDay" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="票據抬頭" controlName="ticketTitle" [control]="dataForm.controls.ticketTitle"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <hr>
            <h5>其 他 資 料</h5>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="審核狀態" controlName="approveState" [options]="approvalStatusOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.approveState"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-8">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
            </div>
            <!-- <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
                *ngIf="!isFormReadable">
                <app-button btnType="cancel"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div> -->
        </form>
    </p-panel>
</div>
