<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <p-tabView class="col-12">
          <p-tabPanel *ngFor="let module of privilegeBehaviorList">
            <ng-template pTemplate="header">
              <div class="flex align-items-center gap-2">
                <i [ngClass]="getIconClass(module.id)"></i>
                <span class="font-bold white-space-nowrap m-0">
                  {{module.label}}
                </span>
              </div>
            </ng-template>
            <p-accordion [multiple]="true" [activeIndex]="allIndexes">
              <p-accordionTab *ngFor="let tab of module.children">
                <ng-template pTemplate="header">
                  <div class="flex align-items-center gap-2">
                    <p-checkbox [label]="tab.label" [name]="tab['label']" [binary]="true"
                      (click)="onSelectAll($event, tab)" [(ngModel)]="tab.IsEnable"
                      [ngModelOptions]="{standalone: true}" />
                  </div>
                </ng-template>
                <p-table *ngFor=" let child of tab.children" [value]="child.children"
                  [(selection)]="child.selectChildren" [columns]="columns" dataKey="id" [rowTrackBy]="trackByRow"
                  styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines">
                  <ng-template pTemplate="header" let-columns>
                    <tr>
                      <th class="w-1rem">
                        <p-tableHeaderCheckbox />
                      </th>
                      <th colspan="3">{{ child.label }}</th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr>
                      <td>
                        <p-tableCheckbox [value]="rowData" />
                      </td>
                      <td>
                        <b>{{ rowData['label'] }}</b>
                      </td>
                      <td class="flex gap-2">
                        <div *ngFor="let row of rowData['children']" class="inline-flex gap-2 justify-content-center">
                          <p-checkbox [label]="row.label" [name]="rowData['label']" [binary]="true"
                            [(ngModel)]="row.IsEnable" [ngModelOptions]="{standalone: true}" />
                        </div>
                      </td>
                    </tr>
                  </ng-template>
                </p-table>
              </p-accordionTab>
            </p-accordion>
          </p-tabPanel>
        </p-tabView>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" />
      </div>
    </form>
  </p-panel>
</div>
