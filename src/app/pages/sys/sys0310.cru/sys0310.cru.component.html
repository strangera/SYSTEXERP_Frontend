<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="角色代碼" controlName="Role_No"
          [control]="dataForm.controls.Role_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="角色名稱" controlName="Role_Name"
          [control]="dataForm.controls.Role_Name" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="描述" controlName="Description"
          [control]="dataForm.controls.Description" [submitted]="submitted" />
        <p-tabView class="col-12">
          <p-tabPanel *ngFor="let module of privilegeBehaviorList">
            <ng-template pTemplate="header">
              <div class="flex align-items-center gap-2">
                <i [ngClass]="getIconClass(module.key)"></i>
                <span class="font-bold white-space-nowrap m-0">
                  {{module.data.label}}
                </span>
              </div>
            </ng-template>
            <p-treeTable #tt [value]="module.children" [columns]="columns" selectionMode="checkbox"
              [(selectionKeys)]="selectionKeys" dataKey="key" filterMode="lenient"
              styleClass="p-treetable-sm p-treetable-gridlines">
              <ng-template pTemplate="header" let-columns>
                <tr>
                  <th *ngFor="let col of columns">
                    {{ col.header }}
                  </th>
                </tr>
                <tr>
                  <th *ngFor="let col of columns">
                    <input pInputText type="text" (input)="onFilterInput($event, col.field, col.filterMatchMode)" />
                  </th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-rowNode let-rowData="rowData" let-columns="columns">
                <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode">
                  <td *ngFor="let col of columns; let i = index">
                    <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0" />
                    <p-treeTableCheckbox [value]="rowNode" *ngIf="i === 0" />
                    {{ rowData[col.field] }}
                  </td>
                </tr>
              </ng-template>
            </p-treeTable>
          </p-tabPanel>
        </p-tabView>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" />
      </div>
    </form>
  </p-panel>
</div>
