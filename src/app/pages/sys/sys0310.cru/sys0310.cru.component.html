<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="角色代碼" controlName="Role_No"
          [control]="dataForm.controls.Role_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="角色名稱" controlName="Role_Name"
          [control]="dataForm.controls.Role_Name" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="描述" controlName="Description"
          [control]="dataForm.controls.Description" [submitted]="submitted" />
        <p-tabView class="col-12" [(activeIndex)]="activeIndex">
          <p-tabPanel *ngIf="FIN00000Data">
            <ng-template pTemplate="header">
              <div class="flex align-items-center gap-2">
                <i [ngClass]="getIconClass(FIN00000Data.id)"></i>
                <span class="font-bold white-space-nowrap m-0">
                  {{FIN00000Data.label}}
                </span>
              </div>
            </ng-template>
            <div *ngFor="let item of FIN00000Data.children; trackBy: trackByFn"
              class="flex flex-column py-2 border-bottom-1 surface-border">
              <p-button [text]="true" styleClass="flex align-items-center justify-content-between"
                (click)="item.IsEnable = !item.IsEnable">
                <span class="font-bold text-xl">{{item.label}}</span>
                <p-inputSwitch #itemSwitch class="flex" [(ngModel)]="item.IsEnable"
                  [ngModelOptions]="{standalone: true}" styleClass="pointer-events-none" />
              </p-button>
              <div *ngIf="item.IsEnable" [@expandAnimation]
                class="flex-column gap-2 justify-content-between py-2 child-options-container">
                <p-accordion (onClose)="item.children[$event.index].IsEnable = false"
                  (onOpen)="item.children[$event.index].IsEnable = true">
                  <p-accordionTab [header]="i.label" *ngFor="let i of item.children; trackBy: trackByFn">
                    <ng-container *ngIf="i.IsEnable">
                      <div *ngFor="let program of i.children; trackBy: trackByFn" class="flex align-items-center gap-2">
                        <span class="min-w-max">{{program.label}}</span>
                        <div class="flex align-items-center gap-2 w-full">
                          <cdk-virtual-scroll-viewport itemSize="40"
                            class="checkbox-virtual-scroll-viewport overflow-hidden">
                            <div *cdkVirtualFor="let behavior of program.children; trackBy: trackByFn">
                              <p-checkbox [label]="behavior.label" [name]="program.label" [binary]="true"
                                [(ngModel)]="behavior.IsEnable" [ngModelOptions]="{standalone: true}" />
                            </div>
                          </cdk-virtual-scroll-viewport>
                        </div>
                      </div>
                    </ng-container>
                  </p-accordionTab>
                </p-accordion>
              </div>
            </div>
          </p-tabPanel>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
