<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <p-tabView class="col-12">
          <p-tabPanel *ngFor="let module of privilegeBehaviorList" [header]="module.label">
            <p-accordion [multiple]="true" [activeIndex]="allIndexes">
              <p-accordionTab [header]="tab.label" *ngFor="let tab of module.children">
                <p-table [value]="tab.children" [columns]="columns" [(selection)]="selectedItems" sortMode="multiple"
                  selectionMode="multiple" dataKey="id" [resizableColumns]="true"
                  styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines">
                  <ng-template pTemplate="header" let-columns>
                    <tr>
                      <th class="w-1rem">
                        <p-tableHeaderCheckbox />
                      </th>
                      <th *ngFor="let col of columns" class="text-center">
                        {{ col.header }}
                      </th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns"
                    let-expanded="expanded" let-ri="rowIndex">
                    <tr #htmlTableRowElement [pSelectableRow]="rowData" [pEditableRow]="rowData"
                      [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
                      <td>
                        <p-tableCheckbox class="flex justify-content-center pointer-events-none"
                          [pSelectableRow]="rowData" [value]="rowData" />
                      </td>
                      <td *ngFor="let col of columns" class="text-center">
                        <span>{{ rowData[col.field] }}</span>
                      </td>
                    </tr>
                  </ng-template>
                </p-table>
              </p-accordionTab>
            </p-accordion>
          </p-tabPanel>
        </p-tabView>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" />
      </div>
    </form>
  </p-panel>
</div>
