<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="使用者編號" controlName="User_No" [control]="queryForm.controls.User_No"
                            [submitted]="submitted"></app-input-text>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="使用者名稱" controlName="User_Name" [control]="queryForm.controls.User_Name"
                            [submitted]="submitted"></app-input-text>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <!-- <app-dropdown label="職稱代碼" controlName="title" [options]="titleOptions" optionLabel="label"
                            optionValue="value" [control]="queryForm.controls.title"
                            [submitted]="submitted"></app-dropdown> -->
                        <app-multi-select class="col-12 md:col-6 lg:col-5" label="職稱代碼" controlName="title"
                            [options]="titleOptions" optionLabel="label" optionValue="value"
                            [control]="queryForm.controls.title" [submitted]="submitted" />
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <!-- <app-dropdown label="組織編號" controlName="Org_ID" [options]="SYS3100_Options" optionLabel="Label"
                            optionValue="No" [control]="queryForm.controls.Org_ID"
                            [submitted]="submitted"></app-dropdown> -->
                        <app-multi-select class="col-12 md:col-6 lg:col-5" label="組織編號" controlName="Org_ID"
                            [options]="SYS3100_Options" optionLabel="Label" optionValue="No"
                            [control]="queryForm.controls.Org_ID" [submitted]="submitted" />
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range-quick class="col-12 md:col-6 lg:col-5" label="帳號有效起始日期"
                            [startControl]="queryForm.controls.str_date" [endControl]="queryForm.controls.end_date"
                            [submitted]="submitted" />
                    </div>

                    <!-- <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="上次登入時間"
                            [startControl]="queryForm.controls.lastLoginStartTime"
                            [endControl]="queryForm.controls.lastLoginEndTime"
                            [submitted]="submitted"></app-calendar-range>
                    </div> -->
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="使用者狀態" controlName="status" [options]="userStatusOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.status"
                            [submitted]="submitted"></app-dropdown>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="使用者型態" controlName="user_type" [options]="userTypeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.user_type"
                            [submitted]="submitted"></app-dropdown>
                    </div>
                </div>
                <!-- <div *appHasPermission="queryPermission" class="col"> -->
                <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
                    <app-button btnType="clear"></app-button>
                    <app-button btnType="query" [loading]="loading"></app-button>
                </div>
                <!-- </div> -->
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-table tableKey="SYS0110" [data]="data" [columns]="columns" (edit)="onEdit($event)"
            (detail)="onDetail($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
            (delete)="onDelete($event)" [showCheckBox]="true" dataKey="id"
            [multiSortMeta]="[{ field: 'User_No', order: 1 }]" [totalRecords]="totalRecords"
            (lazyLoadData)="onLazyLoadData($event, queryForm);onSubmit(queryForm)" [lazy]="true" [loading]="loading">
        </app-table>
    </div>
</div>
