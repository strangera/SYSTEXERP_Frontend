<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="角色代號" controlName="Role_No" [control]="dataForm.controls.Role_No"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="角色名稱" controlName="Role_Name" [control]="dataForm.controls.Role_Name"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="角色註記" controlName="Description" [control]="dataForm.controls.Description"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
      </div>

      <div class="card">
        <div class="col-12">
          <app-table-report tableKey="SYS0230CRU" [data]="assignedUsers" [columns]="assignedUsersColumns"
            [showManage]="false" dataKey="ID" [totalRecords]="assignedUsers.length" [lazy]="false"
            [selectedItems]="selectedAssignedUsers" (selectionChange)="selectedAssignedUsers = $event"
            [showReportMode]="false" [showDelete]="!isFormReadable" [showInsert]="!isFormReadable" (insert)="onInsert()"
            (delete)="onDelete($event)" [showCaption]="!isFormReadable" [showCheckBox]="!isFormReadable"
            [showDetail]="false" [showEdit]="false"></app-table-report>
        </div>
      </div>

      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇使用者" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedAvailableUsers.length === 0" (show)="onDialogShow()">
  <form [formGroup]="filterDialogForm" id="filterDialogForm" (ngSubmit)="filterAvailableUsers()">
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者編號" controlName="User_No"
        [control]="filterDialogForm.controls.User_No" [submitted]="submitted" [disabled]="false"></app-input-text>
      <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者名稱" controlName="User_Name"
        [control]="filterDialogForm.controls.User_Name" [submitted]="submitted" [disabled]="false"></app-input-text>
      <app-multi-select class="col-12 md:col-6 lg:col-4" label="組織代碼" controlName="Org_IdList"
        [options]="orgOptions | async" optionLabel="label" optionValue="value"
        [control]="filterDialogForm.controls.Org_IdList" [submitted]="submitted"></app-multi-select>
    </div>
  </form>
  <app-table-report tableKey="SYS0230DialogTable" dataKey="ID" [showReportMode]="false" [data]="availableUsers"
    [columns]="availableUsersColumns" [showDelete]="false" [selectedItems]="selectedAvailableUsers"
    [showCaption]="false" (selectionChange)="selectedAvailableUsers = $event" [showManage]="false" [showCheckBox]="true"
    [totalRecords]="availableUsers.length" [lazy]="false" [showDetail]="false" [showEdit]="false"></app-table-report>
</app-dialog>
