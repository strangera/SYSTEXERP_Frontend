<div class="card">
    <div class="grid align-items-center">
        <div class="flex gap-2 mb-2">
            <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
            <app-button btnType="back" (click)="onCancel()"></app-button>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="樓層編號" controlName="floorNumber"
                        [control]="dataForm.controls.floorNumber" [submitted]="submitted">>
                    </app-input-number>
                </div>
                <div class="col-12 md:col-12 lg:col-4">
                    <app-input-text label="樓層名稱" controlName="floorName" [control]="dataForm.controls.floorName"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
        </form>
        <div class="col pt-4" *ngIf="isFormEditable">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
