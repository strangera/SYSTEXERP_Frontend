<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="公告類別" controlName="ANS_Type" [options]="announcementOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ANS_Type" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="公告事項" controlName="Announcements" [control]="queryForm.controls.Announcements"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateTimeRange" label="有效開始日期時間"
              [startControl]="queryForm.controls.ANS_BegDateTime_From"
              [endControl]="queryForm.controls.ANS_BegDateTime_To" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateTimeRange" label="有效結束日期時間"
              [startControl]="queryForm.controls.ANS_EndDateTime_From"
              [endControl]="queryForm.controls.ANS_EndDateTime_To" [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="公告角色" controlName="ANS_Role" [options]="YNOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ANS_Role" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="階層代碼" controlName="section_no" [options]="roleCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.section_no" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼" controlName="group_no" [options]="announcementUserOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.group_no"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [showCheckBox]="true" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)"></app-table>
</div>
