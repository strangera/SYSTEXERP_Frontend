<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者編號" controlName="user_No"
            [control]="queryForm.controls.user_No" [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者名稱" controlName="user_Name"
            [control]="queryForm.controls.user_Name" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="sys0792" [data]="data" [columns]="columns" [showDetail]="false" [showEdit]="false"
    [loading]="loading" [totalRecords]="totalRecords" [showDelete]="false" [lastQueryBody]="lastQueryBody"
    [addButton]="addButtons" [queryFunction]="sys0792Service.querySYS0792.bind(sys0792Service)"></app-table-report>
</div>
