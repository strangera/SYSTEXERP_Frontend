<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="銀行代號" controlName="BNK_No"
          [control]="dataForm.controls.BNK_No" [submitted]="submitted">>
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="銀行名稱" controlName="BNK_Name"
          [control]="dataForm.controls.BNK_Name" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="銀行簡稱" controlName="BNK_ShortName"
          [control]="dataForm.controls.BNK_ShortName" [submitted]="submitted">
        </app-input-text>
        <app-table class="col-12" [data]="data" [columns]="columns" [showEdit]="false" [showDetail]="false"
          [showCheckBox]="true" [showInsert]="true" [showRowEdit]="true" (delete)="onDelete($event)"
          (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows" [showCaption]="!isFormReadable"
          [showManage]="!isFormReadable" [showCheckBox]="!isFormReadable" [showReportMode]="false"
          [insertRowData]="true" (dataChange)="data = $event"></app-table>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="resetTable()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
