<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <!-- 變更時間區間（必填） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="變更時間" [startControl]="queryForm.controls.StartDate"
              [endControl]="queryForm.controls.EndDate" [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <!-- 異動使用者代碼（下拉選單） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="異動使用者代碼" controlName="UserNo" [options]="userOptions() | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.UserNo" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 角色代碼（下拉選單） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="角色代碼" controlName="RoleCode" [options]="roleOptions() | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.RoleCode" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="SYS0620" [data]="data" [columns]="columns" [totalRecords]="totalRecords()"
    [lastQueryBody]="lastQueryBody" [loading]="loading" [showManage]="false" [showDelete]="false" [lazy]="false">
  </app-table-report>
</div>
