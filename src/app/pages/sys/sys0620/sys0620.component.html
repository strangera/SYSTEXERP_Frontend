<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 異動使用者代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="異動使用者代碼"
              controlName="userCodeMod"
              [options]="userCodeModOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.userCodeMod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 角色代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="角色代碼"
              controlName="roleCode"
              [options]="roleCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.roleCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 變更時間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="變更時間"
              [startControl]="queryForm.controls.changeStartTime"
              [endControl]="queryForm.controls.changeEndTime"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>

        <!-- 查詢與清除按鈕區 -->
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns"></app-table>
  </div>
</div>
