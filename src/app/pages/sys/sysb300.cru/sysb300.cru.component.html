<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <!-- 只有新增時可以輸入代碼 -->
          <app-input-text
            label="組織階層代碼"
            controlName="level_id"
            [control]="dataForm.controls.level_id"
            [submitted]="submitted"
            [disabled]="!(dataForm.controls.CanDel.value ?? true)"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text
            label="組織階層名稱"
            controlName="level_name"
            [control]="dataForm.controls.level_name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="上層組織代碼/名稱"
            controlName="p_level_id"
            [options]="upgroup_Options"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.p_level_id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
    <ul>
      <li>備註：</li>
      <li>若上層組織階層為空，表示此階層為公司組織階層之最上層。</li>
    </ul>
  </p-panel>
</div>
