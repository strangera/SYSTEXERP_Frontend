<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="組織階層代碼" controlName="level_id" [control]="dataForm.controls.level_id"
                        [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-12 lg:col-4">
                    <app-input-text label="組織階層名稱" controlName="level_name" [control]="dataForm.controls.level_name"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="上層組織" controlName="p_level_id" [options]="upgroup_Options" optionLabel="Label"
                        optionValue="No" [control]="dataForm.controls.p_level_id" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
        </form>
        <ul>
            <li>備註：</li>
            <li>1.若上層組織階層為空，表示此階層為公司組織階層之最上層。</li>
            <li>2.代碼大小順序表示階層上下關係(例：全公司為10、本部為20...)</li>
        </ul>
        <div class="col pt-4" *ngIf="!isFormReadable">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
