<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="使用者編號" controlName="user_No" [control]="dataForm.controls.user_No"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="使用者名稱" controlName="user_Name" [control]="dataForm.controls.user_Name"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
      </div>
      <div class="card">
        <app-table title="已分配角色" tableKey="SYS0230CRU" [data]="assignedRoles" [columns]="assignedRolesColumns"
          [showManage]="false" dataKey="ID" [multiSortMeta]="[{ field: 'ID', order: 1 }]"
          [selectedItems]="selectedAssignedRoles" (selectionChange)="selectedAssignedRoles = $event"
          [showReportMode]="false" [deleteData]="true" [showInsert]="true" (insert)="dialogVisible = true"
          (delete)="onDelete($event)" [disabled]="isFormReadable" [showCaption]="!isFormReadable"
          [showCheckBox]="!isFormReadable">
        </app-table>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇角色" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedAvailableRoles.length === 0">
  <form [formGroup]="filterDialogForm" id="filterDialogForm" (ngSubmit)="filterAvailableRoles()">
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="角色代號" controlName="filter_role_no"
        [control]="filterDialogForm.controls.filter_role_no" [submitted]="submitted"
        [disabled]="false"></app-input-text>
      <app-input-text class="col-12 md:col-6 lg:col-4" label="角色名稱" controlName="filter_role_name"
        [control]="filterDialogForm.controls.filter_role_name" [submitted]="submitted"
        [disabled]="false"></app-input-text>
    </div>
  </form>
  <app-table tableKey="SYS0220DialogTable" dataKey="ID" [showReportMode]="false" [data]="availableRoles"
    [columns]="availableRolesColumns" [showDelete]="false" [selectedItems]="selectedAvailableRoles"
    [showCaption]="false" (selectionChange)="selectedAvailableRoles = $event" [showHeader]="false" [showManage]="false"
    [showCheckBox]="true">
  </app-table>
</app-dialog>
