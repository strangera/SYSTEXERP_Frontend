<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="使用者編號" controlName="user_No" [control]="dataForm.controls.user_No"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="使用者名稱" controlName="user_Name" [control]="dataForm.controls.user_Name"
            [submitted]="submitted" [disabled]="true"></app-input-text>
        </div>
      </div>
      <div class="card">
        <app-table tableKey="SYS0230CRU" [data]="roleUserData" [columns]="roleUserColumns" [showCheckBox]="true"
          [showManage]="false" [showDelete]="false" dataKey="ID" [multiSortMeta]="[{ field: 'Match', order: -1 }]"
          [selectedItems]="selectedRoleUserData" (selectionChange)="selectedRoleUserData = $event"
          [showReportMode]="false" [deleteData]="true" [showInsert]="true" (dataChange)="roleUserData = $event"
          (insert)="dialogVisible = true" [disabled]="isFormReadable" [showCaption]="!isFormReadable"
          [showCheckBox]="!isFormReadable"></app-table>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇角色" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <app-table tableKey="tls52020DialogTable" dataKey="ID" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)">
  </app-table>
</app-dialog>
