<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="公告類別" controlName="ANS_Type" [options]="announcementOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.ANS_Type"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="公告事項" controlName="Announcements" [control]="dataForm.controls.Announcements"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateTimeOne" label="有效開始日期時間" controlName="ANS_BegDateTime"
                        [control]="dataForm.controls.ANS_BegDateTime" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateTimeOne" label="有效結束日期時間" controlName="ANS_EndDateTime"
                        [control]="dataForm.controls.ANS_EndDateTime" [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-multi-select label="公告角色" controlName="ANS_Role" [options]="YNOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.ANS_Role" [submitted]="submitted">
                    </app-multi-select>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-multi-select label="階層代碼" controlName="section_no" [options]="roleCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.section_no"
                        [submitted]="submitted">
                    </app-multi-select>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-multi-select label="組織代碼" controlName="group_no" [options]="announcementUserOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.group_no"
                        [submitted]="submitted">
                    </app-multi-select>
                </div>
            </div>
            <hr>
            <!-- <app-editor-text label="公告內容" controlName="anounce" [control]="dataForm.controls.anounce" [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text> -->
            <h6>通告內容</h6>
            <p-editor [(ngModel)]="dataForm.controls.ANS_Desc" [style]="{ height: '320px' }" />
            <hr>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
