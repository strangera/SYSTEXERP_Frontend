<div class="col-12 mb-3">
  <p-iconField iconPosition="left">
    <p-inputIcon styleClass="pi pi-search" />
    <input class="w-full" type="text" pInputText placeholder="搜尋程式名稱或代碼..."
      (input)="onSearch($any($event.target).value)" />
  </p-iconField>
</div>

<div class="col-12 relative" *ngIf="moduleDataList.length > 0; else loadingTmpl">
  <div class="absolute z-1 flex align-items-center gap-2" style="right: 1.5rem; top: 0.8rem;">
    <span class="text-sm font-medium text-500">當前作業總計:</span>
    <p-badge [value]="totalEnabled + ' / ' + totalAll" [severity]="totalEnabled === 0 ? 'warning' : 'info'"
      styleClass="text-lg px-3">
    </p-badge>
  </div>

  <p-tabView [(activeIndex)]="activeIndex">
    <p-tabPanel *ngFor="let module of moduleDataList; let idx = index; trackBy: trackByFn">
      <ng-template pTemplate="header">
        <i [ngClass]="getIconClass(module.id)"></i> <span>{{module.label}}</span>
      </ng-template>
      <ng-container *ngIf="activeIndex === idx">
        <ng-container *ngTemplateOutlet="moduleContent; context: { moduleData: module }"></ng-container>
      </ng-container>
    </p-tabPanel>
  </p-tabView>
</div>

<ng-template #loadingTmpl>
  <div class="col-12 py-5 text-center">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="8" fill="var(--surface-ground)" />
    <div class="mt-2">作業載入中...</div>
  </div>
</ng-template>

<ng-template #moduleContent let-moduleData="moduleData">
  <div *ngFor="let item of moduleData.children; trackBy: trackByFn" [hidden]="item.isHidden"
    class="flex flex-column py-2 surface-border">
    <p-button [text]="true" styleClass="flex align-items-center justify-content-between gap-2"
      (click)="item.isOpen = !item.isOpen">
      <div class="flex align-items-start gap-2">
        <p-triStateCheckbox [styleClass]="item.partialSelected ? 'partialSelected' : ''" checkboxFalseIcon="pi pi-minus"
          [ngModel]="item.IsEnable" (ngModelChange)="onCheckboxChange(item, $event)"
          [ngModelOptions]="{standalone: true}" (click)="$event.stopPropagation()"
          [disabled]="item.isDisable === true" />
        <span class="font-bold text-xl">{{item.label}}</span>
      </div>
      <span class="flex align-items-center gap-2">
        {{ item.isOpen ? ('收合' | translate) : ('展開' | translate) }}
        <i [ngClass]="item.isOpen ? 'pi pi-chevron-up' : 'pi pi-chevron-down'"></i>
      </span>
    </p-button>

    <div *ngIf="item.isOpen" class="flex-column gap-2 justify-content-between py-2 child-options-container">
      <p-accordion>
        <p-accordionTab *ngFor="let i of item.children; trackBy: trackByFn" [hidden]="i.isHidden">
          <ng-template pTemplate="header">
            <span class="flex align-items-center justify-content-between gap-2 w-full">
              <div class="flex align-items-start gap-2">
                <p-triStateCheckbox [styleClass]="i.partialSelected ? 'partialSelected' : ''"
                  checkboxFalseIcon="pi pi-minus" [ngModel]="i.IsEnable" (ngModelChange)="onCheckboxChange(i, $event)"
                  [ngModelOptions]="{standalone: true}" (click)="$event.stopPropagation()"
                  [disabled]="i.isDisable === true" />
                <span class="font-bold white-space-nowrap">{{i.label}}</span>
              </div>
              <span class="text-sm text-secondary">{{ i.enabledCount || 0 }} / {{ i.totalCount || 0 }} 個作業</span>
            </span>
          </ng-template>

          <ng-template pTemplate="content">
            <div *ngFor="let program of i.children; trackBy: trackByFn" [hidden]="program.isHidden"
              class="flex align-items-start gap-2 py-2 border-bottom-1 surface-border last:border-none">
              <p-triStateCheckbox [styleClass]="program.partialSelected ? 'partialSelected' : ''"
                checkboxFalseIcon="pi pi-minus" class="min-w-max w-25rem" [disabled]="program.isDisable === true"
                [label]="program.label + '(' + program.prog_id + ')' " [ngModel]="program.IsEnable"
                (ngModelChange)="onCheckboxChange(program, $event)" [ngModelOptions]="{standalone: true}" />
              <div class="flex flex-row flex-wrap gap-3">
                <div *ngFor="let behavior of program.actions; trackBy: trackByFn">
                  <p-checkbox [binary]="true" [label]="behavior.label" [disabled]="behavior.isDisable"
                    [ngModel]="behavior.IsEnable" (ngModelChange)="onCheckboxChange(behavior, $event)"
                    [ngModelOptions]="{standalone: true}" />
                </div>
              </div>
            </div>
          </ng-template>
        </p-accordionTab>
      </p-accordion>
    </div>
  </div>
</ng-template>
