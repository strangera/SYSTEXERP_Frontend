<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="系統別"
            controlName="sys_type"
            [options]="sysTypeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.sys_type"
            [submitted]="submitted"
          />
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="作業代碼"
            controlName="act_code"
            [options]="actCodeOptions()"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.act_code"
            [submitted]="submitted"
          />
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="資料型態描述"
            controlName="data_type_desc"
            [control]="queryForm.controls.data_type_desc"
            [submitted]="submitted"
          />
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    [exportContext]="{ apiUrl: 'querySYSBQ00' }"
    dataKey="id"
    [data]="data()"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showCheckBox]="true"
    (delete)="onDelete($event)"
    [totalRecords]="totalRecords()"
    [queryFunction]="tableQueryFunction"
    [lastQueryBody]="lastQueryBody()"
    [loading]="loading"
    (selectionChange)="selectedRows.set($event)"
    [selectedItems]="selectedRows()"
  ></app-table-report>
</div>
