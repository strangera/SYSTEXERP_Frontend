<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6" label="系統別" controlName="sys_type"
          [options]="sysTypeOptions()" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.sys_type" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6" label="作業代碼" controlName="act_code"
          [options]="actCodeOptions()" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.act_code" [submitted]="submitted" />
      </div>

      <app-table-edit
        tableKey="SYSBQ00_lines"
        [data]="tableData()"
        [columns]="editColumns"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        (dataChange)="tableData.set($event)"
        [showCheckBox]="true"
        [showDelete]="false"
        [showInsert]="false"
        [canInsert]="false"
        [disabled]="isFormReadable"
      ></app-table-edit>

      @if (!isFormReadable) {
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
