<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期區間" [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="查詢角度" controlName="queryAngle" [options]="queryAngleOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.queryAngleOptions"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="使用者編號" controlName="UserCodeOptions" [options]="UserCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.UserCodeOptions" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="角色代號" controlName="roleCodeOptions" [options]="roleCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.roleCodeOptions" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織編號" controlName="organizationNumberOptions" [options]="organizationNumberOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.organizationNumber"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="主系統編號" controlName="systemTypeDetailOptions" [options]="systemTypeDetailOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.systemTypeDetail"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="子系統編號" controlName="subsystemOptions" [options]="subsystemOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.subsystemOptions"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="作業編號" controlName="jobNumberOptions" [options]="jobNumberOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.jobNumberOptions"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="sys0791" [data]="data" [columns]="columns" [showManage]="false" [loading]="loading"
    [totalRecords]="totalRecords" [showDelete]="false" [lastQueryBody]="lastQueryBody"
    [queryFunction]="sys0791Service.querySYS0791.bind(sys0791Service)"></app-table-report>
</div>
