<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期區間" [startControl]="queryForm.controls.DateS"
              [endControl]="queryForm.controls.DateE" [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="使用者編號" controlName="UserNo" [options]="userOptions() | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.UserNo" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="角色編號" controlName="RoleNo" [options]="roleOptions() | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.RoleNo" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織編號" controlName="OrgId" [options]="orgOptions() | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OrgId" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="主系統編號" controlName="Prog1" [options]="mainSystemOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Prog1" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="子系統編號" controlName="Prog2" [options]="subSystemOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Prog2" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="作業編號" controlName="Prog3" [options]="jobNumberOptions()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Prog3" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm" (click)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="SYS0791" [data]="data" [columns]="columns" [totalRecords]="totalRecords()"
    [lastQueryBody]="lastQueryBody" [queryFunction]="sys0791Service.querySYS0791.bind(sys0791Service)"
    [loading]="loading" [showManage]="false" [showDelete]="false" [lazy]="false">
    <header class="flex align-items-center gap-3">
      <div class="flex align-items-center gap-3 pl-3 border-left-1 surface-border" style="height: 34px;">
        <span class="font-bold text-sm text-600">查詢角度：</span>
        <p-dropdown [options]="queryAngleOptions" [(ngModel)]="selectedQueryAngle" (onChange)="onAngleChange()"
          optionLabel="label" optionValue="value" [style]="{'width': '200px'}">
        </p-dropdown>
      </div>
    </header>
  </app-table-report>
</div>
