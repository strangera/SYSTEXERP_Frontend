<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者代碼" controlName="user_No"
          [control]="dataForm.controls.user_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者名稱" controlName="user_Name"
          [control]="dataForm.controls.user_Name" [submitted]="submitted" />

        <hr class="col-12" />

        <app-sys0300-tree class="col-12" [moduleDataList]="moduleDataList" (nodeChanged)="onPrivilegeChanged($event)" />
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
