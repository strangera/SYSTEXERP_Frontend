<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
      <!-- 動作按鈕區 -->
      <app-button
        btnType="create"
        label="重新設定"
        (click)="onReset()"
        icon="pi pi-undo"
        class="col"
      ></app-button>
      <app-button
        btnType="create"
        label="回上頁"
        (click)="onBack()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <h5 style="display: flex; align-items: center; gap: 8px">
      <span>使用者名稱:</span>
      <p style="color: red; margin: 0">張怡淳</p>
      <span>，使用者編號:</span>
      <p style="color: red; margin: 0">2014000091</p>
    </h5>
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!---->
      <p-accordion>
        <p-accordionTab
          header="系統權限設定"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <!--tree-->
          <p-tabView>
            <p-tabPanel
              *ngFor="let module of PrivilegeBehaviorlist"
              [header]="module.label"
            >
              <!-- 使用一個獨立的變數來包含整個 module 作為 p-tree 的根節點 -->
              <p-tree
                [value]="[module]"
                selectionMode="checkbox"
                class="w-full md:w-30rem"
                [(selection)]="selectedFiles"
              ></p-tree>
            </p-tabPanel>
          </p-tabView>
        </p-accordionTab>
      </p-accordion>
      <hr />
      <!---->
      <p-accordion>
        <p-accordionTab
          header="可讀資料設定"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <!--PickList-->
          <p-pickList
            [source]="sourceProducts"
            [target]="targetProducts"
            sourceHeader="櫃位名稱"
            targetHeader="已選取專櫃"
            [dragdrop]="true"
            [responsive]="false"
            [sourceStyle]="{ height: '20rem' }"
            [targetStyle]="{ height: '20rem' }"
            filterBy="cName"
            sourceFilterPlaceholder="收尋櫃位名稱"
            targetFilterPlaceholder="收尋櫃位名稱"
            breakpoint="1400px"
          >
            <ng-template let-product pTemplate="item">
              <div class="flex flex-wrap p-2 align-items-center gap-3">
                <div class="flex-1 flex flex-column gap-2">
                  <span class="font-bold">
                    {{ product.cName }}
                  </span>
                  <div class="flex align-products-center gap-2">
                    <i class="pi pi-tag text-sm"></i>
                    <span>{{ product.area }} | {{ product.floor }}</span>
                  </div>
                </div>
              </div>
            </ng-template>
          </p-pickList>
        </p-accordionTab>
      </p-accordion>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button
          btnType="submit"
          (click)="submitForm(dataForm)"
        ></app-button>
      </div>
    </div>
  </p-panel>
</div>
