<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="來源角色代碼"
            controlName="Role_No"
            [control]="dataForm.controls.Role_No"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="來源角色名稱"
            controlName="Role_Name"
            [control]="dataForm.controls.Role_Name"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="目標角色代碼"
            controlName="Role_No"
            [control]="dataForm.controls.Role_No"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="目標角色名稱"
            controlName="Role_Name"
            [control]="dataForm.controls.Role_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <p-checkbox
            label="X是否複製使用者權限"
            formControlName="showScrapData"
            [binary]="true"
          ></p-checkbox>
        </div>
      </div>

      <div class="card">
        <div class="col-13">
          <app-table
            tableKey="SYS0240CRU"
            [data]="roleUserData"
            [columns]="roleUserColumns"
            [showCheckBox]="true"
            [showManage]="false"
            dataKey="id"
            [multiSortMeta]="[{ field: 'partialSelected', order: -1 }]"
            [selectedItems]="selectedRoleUserData"
            (selectionChange)="onUserSelectionChange($event)"
            [loading]="loading"
          ></app-table>
        </div>
      </div>

      <p-tree
        [value]="roleUserData"
        selectionMode="checkbox"
        [(selection)]="selectedRoleUserData"
        [propagateSelectionUp]="true"
        [propagateSelectionDown]="true"
        [metaKeySelection]="false"
        selectionChange="onMembersSelected($event)"
        [style]="{ width: '100%' }"
      >
        <ng-template let-node pTemplate="default">
          <span>{{ node.label }}</span>
        </ng-template>
      </p-tree>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
