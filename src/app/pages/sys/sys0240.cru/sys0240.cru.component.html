<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="來源角色代碼"
            controlName="Role_No"
            [control]="dataForm.controls.Role_No"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="來源角色名稱"
            controlName="Role_Name"
            [control]="dataForm.controls.Role_Name"
            [submitted]="submitted"
            [disabled]="true"
          ></app-input-text>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="目標角色代碼"
            controlName="Target_No"
            [options]="targetOptions"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.Target_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <p-checkbox
            label="是否複製使用者權限"
            formControlName="IsAllCopy"
            [binary]="true"
          ></p-checkbox>
        </div>
      </div>

      <ng-container *ngIf="dataForm.controls.IsAllCopy.value === true">
        <div class="col-13">
          <app-table
            tableKey="SYS0240CRU"
            [data]="roleUserAuthData"
            [columns]="roleUserColumns"
            [showCheckBox]="false"
            [showManage]="false"
            [showReportMode]="false"
            [showDelete]="false"
            dataKey="ID"
            [multiSortMeta]="[{ field: 'Match', order: -1 }]"
            [selectedItems]="selectedRoleUserData"
            (selectionChange)="onUserSelectionChange($event)"
            [loading]="loading"
          ></app-table>
        </div>
      </ng-container>

      <ng-container *ngIf="roleUserData.length > 0">
        <app-tree-dropdown-nest
          [members]="roleUserData"
          [treeNodes]="treeNodes"
          [LeaveColumnLabel]="'label'"
          TitleButtonName="查看權限"
          TitleName="權限列表"
          [canSelectAll]="false"
          (confirmSelected)="onMembersSelected($event)"
          [onlySendLeaf]="false"
          [isNestedInput]="true"
        ></app-tree-dropdown-nest>
      </ng-container>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
