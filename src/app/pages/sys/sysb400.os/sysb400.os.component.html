<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
      <app-button
        btnType="create"
        label="上一頁"
        icon="pi pi-arrow-left"
        (click)="onBack()"
        class="col"
      ></app-button>
    </div>
  </div>

  <div>
    <p-panel [header]="formTitle" class="line-height-3 m-0">
      <div>
        <p-divider align="left" type="solid">
          <b class="text-primary">組織架構列表</b>
        </p-divider>
        <div class="grid p-fluid">
          <!-- add treeDropDown component   -->
          <app-tree-dropdown
            [members]="orgFlatTreeData"
            [Columns]="orgColumn"
            [LeaveColumnLabel]="LeaveLabel"
            (confirmSelected)="onLevelSelected($event)"
            [onlySendLeaf]="true"
          ></app-tree-dropdown>
          <!-- --- -->
        </div>
      </div>
      <div>
        <p-divider align="left" type="solid">
          <b class="text-primary">樹狀下拉</b>
        </p-divider>
        <div class="grid p-fluid">
          <!-- add treeDropDown component   -->
          <app-tree-dropdown
            [members]="flatTreeData"
            [Columns]="treeNodes"
            [LeaveColumnLabel]="LeaveColumnLabel"
            (confirmSelected)="onMembersSelected($event)"
            [onlySendLeaf]="true"
          ></app-tree-dropdown>
          <!-- --- -->
        </div>
      </div>
    </p-panel>
  </div>
</div>
