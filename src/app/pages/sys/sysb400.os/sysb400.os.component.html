<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div>
            <app-button btnType="create" label="上一頁" icon="pi pi-arrow-left" (click)="onBack()"
                class="col"></app-button>
        </div>
    </div>
    <p-panel [header]="formTitle" class="line-height-3 m-0">
        <p-button label="全公司" [outlined]="true" severity="secondary" class="mr-2" (onClick)="collapseAll()" />
        <p-button label="室/部" [outlined]="true" severity="secondary" class="mr-2" (onClick)="expandSpecificNodes1()" />
        <p-button label="Team(團隊)" [outlined]="true" severity="secondary" class="mr-2"
            (onClick)="expandSpecificNodes2()" />
        <p-button label="樓/組" [outlined]="true" severity="secondary" class="mr-2" (onClick)="expandSpecificNodes3()" />
        <div class="mb-2"></div>
        <p-tree [value]="nodes"></p-tree>
    </p-panel>
</div>
