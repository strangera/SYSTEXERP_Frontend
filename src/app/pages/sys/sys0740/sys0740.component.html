<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 作業代碼下拉選單 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="作業代碼" controlName="Prog_No"
            [control]="queryForm.controls.Prog_No" [submitted]="submitted" [options]="progNoOptions" optionLabel="label"
            optionValue="Prog_No"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="sys0740" [data]="data" [columns]="columns" (edit)="onEdit($event)" [showManage]="false"
    [showDetail]="false" [totalRecords]="totalRecords" [loading]="loading" [showDelete]="false"
    [lastQueryBody]="lastQueryBody" [queryFunction]="sys0740Service.querySys0740.bind(sys0740Service)">
  </app-table-report>
</div>
