<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="事件代碼" controlName="Description"
            [control]="queryForm.controls.Description" [submitted]="submitted" [options]="errotMsg" optionLabel="label"
            optionValue="value"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="使用者編號" controlName="User_No"
            [control]="queryForm.controls.User_No" [submitted]="submitted" [options]="userNoOptions" optionLabel="label"
            optionValue="user_No"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="登入者位置" controlName="From_IP"
            [control]="queryForm.controls.From_IP" [submitted]="submitted" />
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" startLabel="登入時間(起)" endLabel="登入時間(迄)"
            startControlName="Start_Date" endControlName="End_Date" [startControl]="queryForm.controls.Start_Date"
            [endControl]="queryForm.controls.End_Date" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table apiUrl="queryUserLoginError" tableKey="sys0760" [data]="data" [columns]="columns" [showManage]="false"
    [multiSortMeta]="[{ field: 'User_No', order: 1 }]" [totalRecords]="totalRecords" [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading"></app-table>
</div>
