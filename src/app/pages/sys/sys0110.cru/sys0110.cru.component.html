<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者編號" controlName="user_No"
          [control]="dataForm.controls.user_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者名稱" controlName="user_Name"
          [control]="dataForm.controls.user_Name" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="使用者密碼" controlName="user_Password"
          [control]="dataForm.controls.user_Password" [submitted]="submitted" [showButton]="isFormEditable"
          [buttonLabel]="'重製密碼'" (clickButton)="resetPassword()" [buttonLoading]="resetLoading"
          [showStar]="!isFormCreateable && showStar" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="組織代碼" controlName="org_ID"
          [options]="SYS3100_Options$ | async" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.org_ID" [submitted]="submitted" />
        <app-calendar-range class="col-12 lg:col-8" label="有效日期" [startControl]="dataForm.controls.str_date"
          [endControl]="dataForm.controls.end_date" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="使用者狀態" controlName="status" [options]="userStatusOptions"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.status" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="使用者型態" controlName="user_type" [options]="userTypeOptions"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.user_type" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="電子信箱" controlName="user_email"
          [control]="dataForm.controls.user_email" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="備註" controlName="remarks"
          [control]="dataForm.controls.remarks" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="使用者等級" controlName="user_priority"
          [control]="dataForm.controls.user_priority" [submitted]="submitted" [options]="user_priorityOptions"
          optionLabel="label" optionValue="value" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="職位" controlName="title" [options]="titleOptions"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.title" [submitted]="submitted" />
        <app-calendar *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="密碼到期日"
          controlName="USER_PwdExpireDate" [control]="dataForm.controls.USER_PwdExpireDate" [submitted]="submitted" />
        <app-table-edit title="專櫃權限清單" #table class="col-12" [columns]="columns" [data]="data"
          (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows" (dataChange)="data = $event"
          [disabled]="isFormReadable" [defaultInsertData]="defaultInsertData"></app-table-edit>
        <hr />

        <div class="col-12">
          <app-table-edit #table2 title="系統權限清單" [columns]="columnsReportRole" [data]="reportRoleData"
            (selectionChange)="selectedReportRoleRows = $event" [selectedItems]="selectedReportRoleRows"
            (dataChange)="reportRoleData = $event" [disabled]="isFormReadable">
            <div class="grid mt-2 border-top-1 surface-border">
              <div class="col-12">
                <div class="grid">
                  <app-multi-select class="col-12 md:col-6 lg:col-3" label="樓層代碼" controlName="FLOOR_ID"
                    [options]="SYS3800_Options$ | async" optionLabel="Name" optionValue="No"
                    [control]="dataForm.controls.FLOOR_ID" [submitted]="submitted" />
                  <app-multi-select class="col-12 md:col-6 lg:col-3" label="區域代碼" controlName="AREA_ID"
                    [options]="SYS3A00_Options$ | async" optionLabel="Name" optionValue="No"
                    [control]="dataForm.controls.AREA_ID" [submitted]="submitted" />
                  <app-multi-select class="col-12 md:col-6 lg:col-3" label="大分類代碼" controlName="BTYPE_ID"
                    [options]="BUS_TypeOptions$ | async" optionLabel="label" optionValue="value"
                    [control]="dataForm.controls.BTYPE_ID" [submitted]="submitted" />
                  <app-multi-select class="col-12 md:col-6 lg:col-3" label="專櫃編號" controlName="STORE_ID"
                    [options]="TLTTALENT_OPTIONS$ | async" optionLabel="label" optionValue="value"
                    [control]="dataForm.controls.STORE_ID" [submitted]="submitted" />
                </div>
              </div>
            </div>
            <ng-template #customCell let-rowData="rowData" let-col="col" let-index="index">
              <p-multiSelect *ngIf="col.field === 'ORG_ID'"
                [options]="(col.optionsAsync ? (col.options | async) : col.options) || []"
                [optionLabel]="col.optionLabel" [optionValue]="col.optionValue" [(ngModel)]="rowData[col.field]"
                (onChange)="onRoleValueChange(rowData, col, $event.value, index)" [placeholder]="'請選擇'"
                [showClear]="true" [filter]="true" appendTo="body" [style]="{'width': '100%'}"
                [ngModelOptions]="{standalone: true}" [maxSelectedLabels]="3" [disabled]="isFormReadable">
              </p-multiSelect>
              <ng-container *ngIf="col.field === 'SYS_ID'">
                <p-treeSelect [(ngModel)]="rowData[col.field + '_TreeNodes']" [ngModelOptions]="{standalone: true}"
                  [options]="sysTreeOptions" display="comma" [metaKeySelection]="false" selectionMode="checkbox"
                  placeholder="請選擇系統權限" appendTo="body" [style]="{'max-width': '10rem'}"
                  (onNodeSelect)="onTreeValueChange(rowData, col, index)" labelStyleClass="py-2"
                  (onNodeUnselect)="onTreeValueChange(rowData, col, index)" [disabled]="isFormReadable">
                </p-treeSelect>
              </ng-container>
            </ng-template>
          </app-table-edit>
        </div>
      </div>
      <!-- sys3700 -->
      <div class="grid p-fluid border-top-1 surface-border mt-2" *ngIf="!isFormCreateable">
        <app-calendar class="col-12 md:col-6 lg:col-4" label="建立日期" controlName="CRT_Date"
          [control]="dataForm.controls.CRT_Date" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員編號" controlName="CRT_USR_No"
          [control]="dataForm.controls.CRT_USR_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員姓名" controlName="CRT_USR_Name"
          [control]="dataForm.controls.CRT_USR_Name" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" label="變更日期" controlName="UPD_Date"
          [control]="dataForm.controls.UPD_Date" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員編號" controlName="UPD_USR_No"
          [control]="dataForm.controls.UPD_USR_No" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員姓名" controlName="UPD_USR_Name"
          [control]="dataForm.controls.UPD_USR_Name" [submitted]="submitted" />
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="resetTable()"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
