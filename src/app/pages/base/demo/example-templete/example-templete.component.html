<div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
</div>
<p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true">
        <form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
            </div>
            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
                <app-button btnType="clear" [form]="queryForm"></app-button>
                <app-button btnType="query" [loading]="loading"></app-button>
            </div>
        </form>
    </p-accordionTab>
</p-accordion>
<div class="card">
    <app-table tableKey="tableKey" dataKey="field" [data]="data" [columns]="columns" (edit)="onEdit($event)"
        (detail)="onDetail($event)" [showCheckBox]="true" [multiSortMeta]="[{ field: 'field', order: 1 }]"
        [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
        [lazy]="true" [loading]="loading">
    </app-table>
</div>
