<p-tabView styleClass="card">
  <p-tabPanel *ngFor="let tab of tabs">
    <ng-template pTemplate="header">
      <div class="flex align-items-center gap-2">
        <span class="font-bold white-space-nowrap m-0" [ngClass]="tab.class || 'text-900'">
          {{tab.title}}
        </span>
      </div>
    </ng-template>
    <ng-template #container></ng-template>
  </p-tabPanel>
</p-tabView>
