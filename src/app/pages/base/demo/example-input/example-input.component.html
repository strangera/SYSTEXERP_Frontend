<form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm)">
  <div class="flex">
    <div class="col-6">
      <div class="flex flex-column gap-2 mb-3">
        <h1>字串輸入框</h1>
      </div>
      <h5>文字輸入</h5>
      <div class='card flex flex-wrap gap-3 p-fluid justify-content-center'>
        <app-input-text label="Input Text" controlName="text" [control]="queryForm.controls.text"
          [submitted]="submitted" />
      </div>
      <h5>文字輸入(範圍)</h5>
      <div class='card flex flex-wrap gap-3 p-fluid justify-content-center'>
        <app-input-text-range label="Input Text Range" [startControl]="queryForm.controls.text1"
          [endControl]="queryForm.controls.text2" [submitted]="submitted" />
      </div>
      <h5>長文字</h5>
      <div class='card flex flex-wrap gap-3 p-fluid justify-content-center'>
        <app-input-textarea label="Input Textarea" controlName="textarea" [control]="queryForm.controls.textarea"
          [submitted]="submitted" />
      </div>
    </div>
    <div class="col-6">
      <div class="flex flex-column gap-2 mb-3">
        <h1>數字輸入框</h1>
      </div>
      <h5>數字輸入</h5>
      <div class='card flex flex-wrap gap-3 p-fluid justify-content-center'>
        <app-input-number label="Input Number" controlName="number" [control]="queryForm.controls.number"
          [submitted]="submitted" />
      </div>
      <h5>數字輸入(範圍)</h5>
      <div class='card flex flex-wrap gap-3 p-fluid justify-content-center'>
        <app-input-number-range startLabel="Input Number Range" endLabel="Input Number Range"
          [startControl]="queryForm.controls.number1" [endControl]="queryForm.controls.number2"
          [submitted]="submitted" />
      </div>
    </div>
  </div>
  <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
    <app-button btnType="clear" [form]="queryForm"></app-button>
    <app-button btnType="query" [loading]="loading"></app-button>
  </div>
</form>
