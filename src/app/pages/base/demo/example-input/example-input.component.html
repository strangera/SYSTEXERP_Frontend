<form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm)">
    <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-5" label="文字輸入" controlName="text"
            [control]="queryForm.controls.text" [submitted]="submitted" />
        <app-input-text-range class="col-12 md:col-6 lg:col-5" label="文字輸入" [startControl]="queryForm.controls.text1"
            [endControl]="queryForm.controls.text2" [submitted]="submitted" />
        <app-input-text-range class="col-12 md:col-6 lg:col-5" startLabel="文字輸入" endLabel="文字輸入"
            [startControl]="queryForm.controls.text3" [endControl]="queryForm.controls.text4" [submitted]="submitted" />
        <app-input-textarea class="col-12 md:col-6 lg:col-5" label="長文字輸入" controlName="textarea"
            [control]="queryForm.controls.textarea" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-5" label="數字輸入" controlName="number"
            [control]="queryForm.controls.number" [submitted]="submitted" />
        <app-input-number-range class="col-12 md:col-6 lg:col-5" label="數字輸入"
            [startControl]="queryForm.controls.number1" [endControl]="queryForm.controls.number2"
            [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
    </div>
</form>
