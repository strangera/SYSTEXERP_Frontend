<div class="sso-container" *ngIf="user">

  <div class="user-profile-float">
    <button type="button" class="profile-btn" (click)="menu.toggle($event)" pTooltip="個人資料">
      <div class="user-info">
        <span class="user-no">{{ (authService.user | async)?.user_No }}</span>
        <span class="user-name">{{ (authService.user | async)?.user_Name }}</span>
      </div>
      <i class="pi pi-user-edit"></i>
    </button>

    <p-menu #menu [model]="items" [popup]="true" styleClass="border-round-xl p-2" [style]="{'width': '12rem'}"
      appendTo="body">
      <ng-template pTemplate="submenuheader" let-item>
        <span class="font-bold text-lg text-primary">{{ item.label }}</span>
      </ng-template>
      <ng-template pTemplate="item" let-item>
        <a pRipple class="flex justify-content-between align-items-center p-menuitem-link">
          <span [class]="item.icon"></span>
          <span class="ml-2 w-full">{{ item.label }}</span>
        </a>
      </ng-template>
    </p-menu>
  </div>

  <button class="nav-btn prev" *ngIf="currentPage > 0" (click)="prevPage()">
    <i class="pi pi-chevron-left"></i>
  </button>
  <button class="nav-btn next" *ngIf="hasMorePages()" (click)="nextPage()">
    <i class="pi pi-chevron-right"></i>
  </button>

  <div *ngIf="loading" class="loading-overlay">
    <p-progressSpinner></p-progressSpinner>
    <span class="text-white mt-3">資料載入與系統準備中...</span>
  </div>

  <div class="center-logo-container">
    <div class="center-circle" (click)="$event.stopPropagation()">
      <img [src]="logo" alt="logo" class="center-img">
    </div>
  </div>
  <div *ngIf="!loading" class="slider-viewport" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <div class="slider-track" [style.transform]="'translateX(' + (currentPage * -100) + 'dvw)'">
      <div class="page-grid" *ngFor="let page of pagedItems">
        <div *ngFor="let item of page; let i = index" class="system-block" [style.background-color]="item.dynamicColor"
          (click)="navigateToUrl(item)">
          <div class="icon-circle" [style.border-color]="item.dynamicColor">
            <img [src]="imagesUrl +  item.System_ImgFile + '.svg'" [alt]="item.System_Name">
          </div>
          <div class="system-label" [style.color]="item.dynamicColor">
            {{ item.System_Name }}
          </div>
        </div>

        <div class="system-block empty" *ngFor="let empty of getFillerArray(page)"></div>
      </div>
    </div>
  </div>
</div>

<p-dialog header="修改使用者密碼" [modal]="true" [(visible)]="visible" [style]="{ width: '40rem' }" [closeOnEscape]="!noClose"
  [closable]="!noClose" [breakpoints]="{ '575px': '100vw' }">
  <app-change-password [secondaryAction]="noClose ? 'logout' : 'cancel'" [showExtendButton]="noClose"
    (cancelled)="visible = false" (extended)="visible = false"></app-change-password>
</p-dialog>
