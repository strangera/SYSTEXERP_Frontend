<p-card>
  <ng-template pTemplate="header">
    <div class="flex align-items-center p-4">
      <h3 class="font-bold text-blue-700 m-0 text-3xl">
        <i class="pi pi-megaphone mr-2 text-blue-500 text-2xl"></i>佈告欄
      </h3>
    </div>
  </ng-template>

  <ng-container *ngIf="systemNoticeData.length > 0; else noData">
    <div class="flex flex-column">
      <ng-container *ngFor="let item of systemNoticeData; let last = last">
        <div class="flex flex-column">
          <div class="flex justify-content-between align-items-center mb-3">
            <span class="text-600 text-sm font-italic">
              <i class="pi pi-calendar mr-1 text-blue-400"></i>
              {{ item.Pub_StartDate | date: 'yyyy/MM/dd' }} - {{ item.Pub_EndDate | date: 'yyyy/MM/dd' }}
            </span>
            <p-badge [value]="getNoticeTypeLabel(item.Pub_Type)" [severity]="getNoticeTypeSeverity(item.Pub_Type)"
              class="fadein animation-duration-500">
            </p-badge>
          </div>

          <div class="flex align-items-start">
            <div class="flex align-items-center justify-content-center mr-3 flex-shrink-0"
              [ngClass]="getNoticeIconBgColor(item.Pub_Type)"
              style="width: 2.5rem; height: 2.5rem; border-radius: 50%;">
              <i class="pi pi-bell text-lg text-white"></i>
            </div>

            <div class="flex flex-column flex-grow-1">
              <h4 class="font-bold text-800 m-0 mb-1 line-height-1-5">{{ item.Pub_Event }}</h4>
              <div class="text-700 line-height-2 p-text-word-break-all" [innerHTML]="item.Pub_Description"></div>
            </div>
          </div>
        </div>
        <p-divider *ngIf="!last" type="solid" class="my-0"></p-divider>
      </ng-container>
    </div>
  </ng-container>

  <ng-template #noData>
    <div class="text-center text-600 py-5">
      <i class="pi pi-info-circle text-2xl mb-2"></i>
      <p class="m-0">目前沒有任何佈告。🐈</p>
    </div>
  </ng-template>
</p-card>
