<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 第一行：出借編號(點擊彈跳選擇框)、歸還處理人員、歸還日期 -->
        <div class="col-12 md:col-4">
          <div
            [style.cursor]="!isRead ? 'pointer' : ''"
            (click)="!isRead && openLoanDialog()"
          >
            <app-input-text
              label="出借編號"
              controlName="LoanNo"
              [control]="dataForm.controls.LoanNo"
              [submitted]="submitted"
              [readonly]="true"
              [customPlaceholder]="'請選擇出借編號'"
            ></app-input-text>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <app-input-text
            label="歸還處理人員"
            controlName="ReturnUserName"
            [control]="dataForm.controls.ReturnUserName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-4">
          <app-calendar
            calendarType="dateOne"
            label="歸還日期"
            controlName="ReturnDate"
            [control]="dataForm.controls.ReturnDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 第二行：歸還時間、服務台位置編號、出借日期 -->
        <div class="col-12 md:col-4">
          <app-calendar
            calendarType="timeOne"
            label="歸還時間"
            controlName="ReturnTime"
            [control]="dataForm.controls.ReturnTime"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-4">
          <app-input-text
            label="服務台位置編號"
            controlName="ServiceID"
            [control]="dataForm.controls.ServiceID"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-4">
          <app-calendar
            calendarType="dateOne"
            label="出借日期"
            controlName="LoanDate"
            [control]="dataForm.controls.LoanDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 第三行：姓名、連絡電話 -->
        <div class="col-12 md:col-6">
          <app-input-text
            label="姓名"
            controlName="UserName"
            [control]="dataForm.controls.UserName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6">
          <app-input-text
            label="連絡電話"
            controlName="LoanPhone"
            [control]="dataForm.controls.LoanPhone"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 第四行：證件類型 -->
        <div class="col-12 md:col-6">
          <app-input-text
            label="證件類型"
            controlName="CertType"
            [control]="dataForm.controls.CertType"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <!-- 出借設備明細（唯讀） -->
      <div class="mt-3">
        <app-table-edit
          tableKey="cpm11040-detail"
          [data]="detailItems"
          [columns]="detailColumns"
          [disabled]="true"
          [showInsert]="false"
          [showDelete]="false"
          [showCheckBox]="false"
          [loading]="detailLoading"
          [dataStatusField]="''"
        ></app-table-edit>
      </div>

      <div
        *ngIf="crudstatus !== CRUD.Read"
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<!-- 出借編號選擇 Dialog -->
<p-dialog
  header="選擇出借編號"
  [(visible)]="showLoanDialog"
  [modal]="true"
  [style]="{ width: '80vw' }"
  (onHide)="closeLoanDialog()"
>
  <!-- 查詢條件 -->
  <form [formGroup]="loanQueryForm" class="grid p-fluid mb-3">
    <app-input-text
      class="col-12 md:col-4"
      label="借用人姓名"
      controlName="UserName"
      [control]="loanQueryForm.controls.UserName"
    ></app-input-text>
    <app-input-text
      class="col-12 md:col-4"
      label="電話"
      controlName="LoanPhone"
      [control]="loanQueryForm.controls.LoanPhone"
    ></app-input-text>
    <app-input-text
      class="col-12 md:col-4"
      label="設備號碼"
      controlName="DeviceID"
      [control]="loanQueryForm.controls.DeviceID"
    ></app-input-text>
  </form>
  <div class="flex justify-content-end mb-2">
    <app-button
      label="查詢"
      icon="pi pi-search"
      [type]="'button'"
      (click)="onQueryLoan()"
      [loading]="loanDialogLoading"
    ></app-button>
  </div>

  <!-- 結果 Table -->
  <app-table
    tableKey="LoanQuery"
    dataKey="LoanNo"
    [data]="loanDialogData"
    [columns]="loanDialogColumns"
    [loading]="loanDialogLoading"
    [showPaginator]="true"
    [rows]="30"
    [totalRecords]="loanDialogTotalRecords"
    [scrollable]="true"
    [scrollHeight]="'400px'"
    [showCheckBox]="true"
    [showManage]="false"
    [showFilter]="false"
    [showDelete]="false"
    [showCaption]="false"
    selectionMode="single"
    [lazy]="true"
    (lazyLoadData)="onLazyLoadLoan($event)"
    (select)="onLoanRowSelect($event)"
  ></app-table>

  <!-- Footer -->
  <ng-template pTemplate="footer">
    <app-button
      label="取消"
      severity="secondary"
      [type]="'button'"
      (click)="closeLoanDialog()"
    ></app-button>
    <app-button
      label="確定"
      [type]="'button'"
      (click)="confirmLoanSelection()"
    ></app-button>
  </ng-template>
</p-dialog>
