<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="重新廣播" (click)="onRebroadcast()" [loading]="RebroadcastLoading"></app-button>
    <app-button label="已結案" (click)="onClose()" [loading]="CloseLoading"></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="被尋人姓名" controlName="ByMissingPeople" [control]="dataForm.controls.ByMissingPeople"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="集合地點" controlName="CollectionSites" [control]="dataForm.controls.CollectionSites"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="被尋人稱謂" controlName="salutation" [control]="dataForm.controls.salutation"
            [submitted]="submitted" [options]="SALUTATIONOPTIONS" optionLabel="label"
            optionValue="value"></app-dropdown>
        </div>
        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="尋人者" controlName="missinG_PEOPLE" [control]="dataForm.controls.missinG_PEOPLE"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="與被尋人關係" controlName="relations" [control]="dataForm.controls.relations"
            [submitted]="submitted" [options]="RELATIONSOPTIONS" optionLabel="label" optionValue="value"></app-dropdown>
        </div> -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar label="登錄日期" controlName="RecDate" [control]="dataForm.controls.RecDate"
            [submitted]="submitted"></app-calendar>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
