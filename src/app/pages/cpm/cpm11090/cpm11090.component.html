<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="被尋人姓名" controlName="ByMissingPeople" [control]="queryForm.controls.ByMissingPeople"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="集合地點" controlName="CollectionSites" [control]="queryForm.controls.CollectionSites"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="登錄日期" [startControl]="queryForm.controls.RecDateFrom"
              [endControl]="queryForm.controls.RecDateTo" [submitted]=" submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="SEQ_ID" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showDelete]="false" [totalRecords]="totalRecords" [loading]="loading"
    [lastQueryBody]="lastQuery" [editDisabled]="isTableEditDisabled"
    [queryFunction]="cpm11090Service.queryCPM11090.bind(cpm11090Service)"></app-table-report>
</div>
