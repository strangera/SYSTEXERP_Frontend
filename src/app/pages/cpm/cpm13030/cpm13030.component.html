<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="日期" [startControl]="queryForm.controls.TXN_BDATE"
              [endControl]="queryForm.controls.TXN_EDATE" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="building_noList" [options]="ECR_Group_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.building_noList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織名稱" controlName="org_nameList" [options]="org_id_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_nameList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="tlt_noList" [options]="TLT_No_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_noList" [submitted]="submitted"></app-multi-select>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="櫃位名稱" controlName="TLT_NAME" [options]="TLT_NAME_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TLT_NAME" [submitted]="submitted"></app-dropdown>
          </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="報表格式" controlName="displayMode" [options]="displayModeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.displayMode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4" *ngIf="queryForm.value.displayMode === 'D'">
            <app-input-text label="發票號碼" controlName="TXN_GUIBegNo" [submitted]="submitted" [control]="queryForm.controls.TXN_GUIBegNo"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4" *ngIf="queryForm.value.displayMode === 'D'">
            <app-input-number-range label="發票金額" [startControl]="queryForm.controls.TXN_TotSaleAmtStart"
              [endControl]="queryForm.controls.TXN_TotSaleAmtEnd" [submitted]="submitted">
            </app-input-number-range>

          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="card">
    <app-customFooter-table tableKey="CPM13030" [data]="data" [columns]="columns" [columnGroup]="columnGroup"
      [footerData]="footerData" [subTotalData]="subTotalData" [showTotal]="true" [showSubTotal]="true"
      [totalRecords]="totalRecords" [multiSortMeta]="[{ field: 'ECR_Group', order: 1 }]" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [totalRecords]="totalRecords" [columnGroup]="columnGroup"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [showManage]="false" [showDelete]="false" [showReportMode]="false" [apiUrl]="'queryCPM13030'">
      <header>
        <div class="flex justify-content-between align-items-center gap-2">
          <div class="flex gap-2">
            <p-button styleClass="p-2" label="匯出阜爾APS停車抵扣表.PDF" [loading]="btnLoading" icon="pi pi-file-pdf"
              (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
            <p-button styleClass="p-2" label="匯出阜爾APS停車抵扣表.xlsx" [loading]="btnLoading2" icon="pi pi-file-excel"
              (click)="onExportExcel()" [disabled]="data.length === 0"></p-button>
          </div>
        </div>
      </header>
      <footer>
        <div class="flex align-items-center justify-content-between w-full border-1 surface-border p-2">
          <span class="ml-2">本報表金額為含稅金額</span>
        </div>
      </footer>
    </app-customFooter-table>
  </div>
