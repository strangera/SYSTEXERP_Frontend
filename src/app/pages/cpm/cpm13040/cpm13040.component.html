<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="日期" [startControl]="queryForm.controls.TXN_Date_Start"
              [endControl]="queryForm.controls.TXN_Date_End" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="卡別" controlName="CRD_Kind" [options]="CRD_Kind_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CRD_Kind" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織名稱" controlName="Org_ID" [options]="org_id_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Org_ID" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="TLT_No" [options]="TLT_No_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TLT_No" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 第一個表格 -->
<div class="card1 mt-3">
  <app-table-report dataKey="CardType" tableKey="header" [columns]="headerColumns" [data]="headerData"
    [totalRecords]="headerData.length" [showCaption]="false" [showManage]="false"
    [loading]="loadingHeader"></app-table-report>
</div>

<!-- 第二個表格 -->
<div class="card mt-5">
  <app-customFooter-table tableKey="CPM13040" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    dataKey="TXN_Date" (lazyLoadData)="onLazyLoadData($event, queryForm);" [footerData]="footerData" [showFooter]="true"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [lazy]="true" [loading]="loading"
    [showManage]="false" [showDelete]="false" [multiSortMeta]="multiSortMeta"
    [rowsPerPageOptions]="[30, 60, 90, 120, 150]" [expansionRowsPerPageOptions]="expansionRowsPerPageOptions"
    [rows]="30" [showReportMode]="false" [showTotal]="true" (submit)="onSubmit(queryForm)">

    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="POS聯名卡停車優惠明細.PDF" [loading]="btnLoading" icon="pi pi-file-pdf"
            (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
          <p-button styleClass="p-2" label="POS聯名卡停車優惠明細.xlsx" [loading]="btnLoading2" icon="pi pi-file-excel"
            (click)="onExportExcel()" [disabled]="data.length === 0"></p-button>
        </div>
      </div>
    </header>
    <footer>
      <div class="flex align-items-center justify-content-end w-full border-1 surface-border p-2">
        <span class="ml-2">本報表金額為含稅金額</span>
      </div>
    </footer>
  </app-customFooter-table>
</div>
