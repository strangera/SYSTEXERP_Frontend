<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="日期" [startControl]="queryForm.controls.TXN_Date_Start"
              [endControl]="queryForm.controls.TXN_Date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="卡別" controlName="CRD_Kind" [options]="CRD_Kind_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CRD_Kind" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織名稱" controlName="Org_Name" [options]="org_id_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Org_Name" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號" controlName="TLT_No" [options]="TLT_No_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TLT_No" [submitted]="submitted"></app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 第一個表格 -->
<div class="card1 mt-3">
  <app-table dataKey="CardType" tableKey="header" [columns]="headerColumns" [data]="headerData" [showPaginator]="false"
    [showManage]="false" [showDelete]="false" [loading]="loadingHeader"></app-table>
</div>

<!-- 第二個表格 -->
<div class="card mt-5">　
  <app-customFooter-table tableKey="CPM13040" [data]="data" [columns]="columns" [totalRecords]="totalRecords" dataKey="TXN_Date"
    (lazyLoadData)="onLazyLoadData($event, queryForm);" [footerData]="footerData" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [lazy]="true" [loading]="loading" [showManage]="false"
    [showDelete]="false" [multiSortMeta]="[{ field: 'TXN_Date', order: 1 }]" [showReportMode]="false" [showTotal]="true"
    (submit)="onSubmit(queryForm)">
    <footer>
      <div class="flex align-items-center justify-content-between w-full border-1 surface-border p-2">
        <span class="ml-2">本報表金額為含稅金額</span>
      </div>
    </footer>
  </app-customFooter-table>
</div>
