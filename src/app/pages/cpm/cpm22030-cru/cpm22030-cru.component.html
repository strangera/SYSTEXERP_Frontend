<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="action" label="任務設定" icon="pi pi-book" (click)="taskConfig()" class="col"></app-button>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 開始日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="開始日期" controlName="startDate"
            [control]="dataForm.controls.startDate" [submitted]="submitted"></app-calendar>
        </div>
        <!-- 結束日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="結束日期" controlName="endDate" [control]="dataForm.controls.endDate"
            [submitted]="submitted"></app-calendar>
        </div>
        <!-- 行銷檔期代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.marketingCampaignCode"
            [submitted]="submitted"></app-dropdown>
        </div>
        <!-- 檔期名稱 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="檔期名稱" controlName="campaignName" [control]="dataForm.controls.campaignName"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 活動負責人 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動負責人" controlName="activityOwner" [control]="dataForm.controls.activityOwner"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 活動類別 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動類別" controlName="activityCategory" [control]="dataForm.controls.activityCategory"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 活動代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動代號" controlName="activityCode" [control]="dataForm.controls.activityCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 活動說明 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動說明" controlName="activityDescription"
            [control]="dataForm.controls.activityDescription" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <!-- 任務代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="任務代號" controlName="taskCode" [control]="getFormControl(i, 'taskCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 任務名稱 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="任務名稱" controlName="taskName" [control]="getFormControl(i, 'taskName')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 任務說明 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="任務說明" controlName="taskDescription"
                [control]="getFormControl(i, 'taskDescription')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 任務負責人 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="任務負責人" controlName="taskOwner" [control]="getFormControl(i, 'taskOwner')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 進度狀態 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="進度狀態" controlName="progressStatus" [control]="getFormControl(i, 'progressStatus')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 預定起始日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="預定起始日期" controlName="plannedStartDate"
                [control]="getFormControl(i, 'plannedStartDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 預定結束日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="預定結束日期" controlName="plannedEndDate"
                [control]="getFormControl(i, 'plannedEndDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 預定工作天數 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="預定工作天數" controlName="plannedWorkDays"
                [control]="getFormControl(i, 'plannedWorkDays')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 實際起始日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="實際起始日期" controlName="actualStartDate"
                [control]="getFormControl(i, 'actualStartDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 實際結束日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="實際結束日期" controlName="actualEndDate"
                [control]="getFormControl(i, 'actualEndDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 實際工作天數 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="實際工作天數" controlName="actualWorkDays"
                [control]="getFormControl(i, 'actualWorkDays')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 備註 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="備註" controlName="remarks" [control]="getFormControl(i, 'remarks')"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
