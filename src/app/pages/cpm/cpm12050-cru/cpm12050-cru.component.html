<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="客戶意見編號" controlName="opinionCode"
                        [control]="dataForm.controls.opinionCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="件號" controlName="pieces"
                        [control]="dataForm.controls.pieces" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="顧客姓名" controlName="customerName" [control]="dataForm.controls.customerName"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="性別" controlName="gender" [options]="genderOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.gender" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-6">
                    <app-input-text label="聯絡住址" controlName="contactAddress"
                        [control]="dataForm.controls.contactAddress" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="聯絡電話" controlName="contactPhone"
                        [control]="dataForm.controls.contactPhone" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="行動電話" controlName="cellPhone"
                        [control]="dataForm.controls.cellPhone" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="電子信箱" controlName="email" [control]="dataForm.controls.email"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="客戶意見類別" controlName="opinionCategory" [options]="opinionCategoryOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.opinionCategory"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="客戶意見來源別" controlName="opinionSource" [options]="opinionSourceOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.opinionSource"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="客戶意見子類別" controlName="subOpinionSource" [options]="opinionSourceOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.subOpinionSource"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="對象" controlName="object" [control]="dataForm.controls.object"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateTimeOne" label="接件日期" [control]="dataForm.controls.receiveDate"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="建檔人員" controlName="builder" [control]="dataForm.controls.builder"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr>
            <app-editor-text label="顧客意見內容" controlName="emailContent" [control]="dataForm.controls.emailContent"
                [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr />
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="責任單位" controlName="responsibleUnit" [options]="responsibleUnitOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.responsibleUnit"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateTimeOne" label="通知相關單位處理日期" [control]="dataForm.controls.notifyDate"
                        [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="處理情況" controlName="handlingSituation" [options]="handlingOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.handlingSituation"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
