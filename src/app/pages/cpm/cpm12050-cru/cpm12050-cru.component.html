<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 意見類型 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="意見類型" controlName="KIND_ID" [control]="dataForm.controls.KIND_ID"
            [options]="kindIdOptions" [submitted]="submitted" optionLabel="label" optionValue="value"
            (valueChange)="onKindChange($event)"></app-dropdown>
        </div>
        <!-- 意見子類型 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="意見子類型" controlName="KIND_ID_SUB" [control]="dataForm.controls.KIND_ID_SUB"
            [options]="kindIdSubOptions" [submitted]="submitted" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <!-- 組織 -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-dropdown label="組織" controlName="ORG_ID_QUERY" [control]="dataForm.controls.ORG_ID_QUERY"
            [options]="orgIdQueryOptions" [submitted]="submitted" optionLabel="label" optionValue="value"
            (valueChange)="onOrgQueryChange($event)"></app-dropdown>
        </div>
        <!-- 責任單位 -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-dropdown label="責任單位" controlName="ORG_ID" [control]="dataForm.controls.ORG_ID" [options]="orgIdOptions"
            [submitted]="submitted" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="責任單位電子信箱" controlName="CLASS_EMAIL" [control]="dataForm.controls.CLASS_EMAIL"
            [submitted]="submitted"></app-input-text>
        </div>

        <!-- 建議來源 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="建議來源" controlName="SUGG_SOURCE" [control]="dataForm.controls.SUGG_SOURCE"
            [options]="suggSourceOptions" [submitted]="submitted" optionLabel="label"
            optionValue="value"></app-dropdown>
        </div>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="接件日期" controlName="COMPLAIN_DATE"
          [control]="dataForm.controls.COMPLAIN_DATE" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="通知相關單位處理日期"
          controlName="ALERT_DATE" [control]="dataForm.controls.ALERT_DATE" [submitted]="submitted"
          [disabled]="isFormReadable" />
        <div class="col-12 md:col-6 lg:col-4">
          <ng-container *ngIf="!isFormReadable">
            <!-- 編輯/建立模式：以 STATUS 控制項為來源（優先使用 STATUS） -->
            <app-dropdown label="處理狀況" controlName="STATUS" [control]="dataForm.controls.STATUS"
              [options]="statusOptions" [submitted]="submitted" optionLabel="label" optionValue="value"
              [disabled]="isFormReadable"></app-dropdown>
          </ng-container>
          <ng-container *ngIf="isFormReadable">
            <!-- 顯示一個 disabled 的下拉以確保樣式一致且不可互動，優先使用 STATUS 值 -->
            <app-dropdown label="處理狀況" controlName="STATUS" [control]="dataForm.controls.STATUS"
              [options]="statusOptions" [submitted]="submitted" optionLabel="label" optionValue="value"
              [disabled]="true"></app-dropdown>
          </ng-container>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="類別資訊" controlName="SUGG_TYPE" [control]="dataForm.controls.SUGG_TYPE"
            [options]="SUGG_TYPEOptions" [submitted]="submitted" optionLabel="label" optionValue="value"></app-dropdown>
        </div>

        <!-- 其他建議來源 -->
        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="其他建議來源"
            controlName="SUGG_SOURCE_OTHER"
            [control]="dataForm.controls.SUGG_SOURCE_OTHER"
            [submitted]="submitted"
          ></app-input-text>
        </div> -->
        <!-- 顧客意見內容 -->
        <div class="col-12">
          <app-input-textarea label="顧客意見內容" controlName="COMPLAIN_NOTES" [control]="dataForm.controls.COMPLAIN_NOTES"
            [submitted]="submitted"></app-input-textarea>
        </div>
        <!-- 分隔線 -->
        <div class="col-12">
          <hr class="m-0 mt-2 border-top-1 surface-border pt-3" />
        </div>
        <!-- 客戶姓名 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="客戶姓名" controlName="CUST_NAME" [control]="dataForm.controls.CUST_NAME"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 性別 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="性別" controlName="SEX" [control]="dataForm.controls.SEX" [options]="sexOptions"
            [submitted]="submitted" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <!-- 會員編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="會員編號" controlName="MEMBER_ID" [control]="dataForm.controls.MEMBER_ID"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 聯絡地址 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡地址" controlName="CONTACT_ADDR" [control]="dataForm.controls.CONTACT_ADDR"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 聯絡電話 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡電話" controlName="CONTACT_TEL" [control]="dataForm.controls.CONTACT_TEL"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 手機號碼 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="手機號碼" controlName="CELL_PHONE" [control]="dataForm.controls.CELL_PHONE"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- Email -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="Email" controlName="E_MAIL" [control]="dataForm.controls.E_MAIL"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 建檔人編號 -->
        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建檔人編號" controlName="CRT_USR_No" [control]="dataForm.controls.CRT_USR_No"
            [submitted]="submitted"></app-input-text>
        </div> -->
        <!-- 建檔人姓名 -->
        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建檔人姓名" controlName="CRT_USR_Name" [control]="dataForm.controls.CRT_USR_Name"
            [submitted]="submitted"></app-input-text>
        </div> -->
      </div>
      <div class="col-12">
        <label for="file">媒體檔案（最多 3 個）</label>
        <div class="grid">
          <div class="col-12 md:col-4">
            <!-- File 1 -->
            <p-fileUpload #fileUpload1 [multiple]="false" accept=".bmp,.jpg,.wmv,.avi,.mpeg,.mp4"
              maxFileSize="100000000" mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable"
              chooseLabel="選擇檔案" (onSelect)="onSelectFile1($event)" [showCancelButton]="false">
              <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile1 && existingFile1" (click)="openGalleriaFromSlot(1)" class="text-blue-600"
                      role="button">{{ existingFile1 }}</a>
                    <span *ngIf="formFile1">{{ formFile1.name }}</span>
                    <span *ngIf="!formFile1 && !existingFile1">尚未選擇檔案</span>
                  </div>
                  <div class="flex-shrink-0">
                    <button *ngIf="formFile1 && !isFormReadable" type="button" (click)="removeFile1()"
                      class="p-button p-button-text p-button-danger p-button-sm w-auto">
                      <i class="pi pi-trash text-lg"></i>
                    </button>
                    <!-- delete removed per request -->
                  </div>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
            <!-- <img [src]="getImageUrl()" alt="Image" style="width: 100%; display: block;" /> -->
          </div>

          <div class="col-12 md:col-4">
            <!-- File 2 -->
            <p-fileUpload #fileUpload2 [multiple]="false" accept=".bmp,.jpg,.wmv,.avi,.mpeg,.mp4"
              maxFileSize="100000000" mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable"
              chooseLabel="選擇檔案" (onSelect)="onSelectFile2($event)" [showCancelButton]="false">
              <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile2 && existingFile2" (click)="openGalleriaFromSlot(2)" class="text-blue-600"
                      role="button">{{ existingFile2 }}</a>
                    <span *ngIf="formFile2">{{ formFile2.name }}</span>
                    <span *ngIf="!formFile2 && !existingFile2">尚未選擇檔案</span>
                  </div>
                  <div class="flex-shrink-0">
                    <button *ngIf="formFile2 && !isFormReadable" type="button" (click)="removeFile2()"
                      class="p-button p-button-text p-button-danger p-button-sm w-auto">
                      <i class="pi pi-trash text-lg"></i>
                    </button>
                    <!-- delete removed per request -->
                  </div>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>

          <div class="col-12 md:col-4">
            <!-- File 3 -->
            <p-fileUpload #fileUpload3 [multiple]="false" accept=".bmp,.jpg,.wmv,.avi,.mpeg,.mp4"
              maxFileSize="100000000" mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable"
              chooseLabel="選擇檔案" (onSelect)="onSelectFile3($event)" [showCancelButton]="false">
              <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback">
                <div class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <div class="flex-1 overflow-hidden" style="text-overflow:ellipsis; white-space:nowrap;">
                    <a *ngIf="!formFile3 && existingFile3" (click)="openGalleriaFromSlot(3)" class="text-blue-600"
                      role="button">{{ existingFile3 }}</a>
                    <span *ngIf="formFile3">{{ formFile3.name }}</span>
                    <span *ngIf="!formFile3 && !existingFile3">尚未選擇檔案</span>
                  </div>
                  <div class="flex-shrink-0">
                    <button *ngIf="formFile3 && !isFormReadable" type="button" (click)="removeFile3()"
                      class="p-button p-button-text p-button-danger p-button-sm w-auto">
                      <i class="pi pi-trash text-lg"></i>
                    </button>
                    <!-- delete removed per request -->
                  </div>
                </div>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>
        </div>
      </div>

      <div class="col-12" *ngIf="!isFormCreateable">
        <app-table-edit [columns]="columns" [data]="data" [tableRequired]="false"
          [disabled]="isFormReadable && !forceEditAll" [rowEditDisabled]="rowEditDisabledWrapper"
          [isRowSelectable]="detailRowSelectable" (dataChange)="onTableDataChange($event)"
          [loading]="loading"></app-table-edit>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
<p-galleria #galleria [value]="galleriaItems" [(visible)]="visible" [containerStyle]="{ 'max-width': '850px' }"
  [circular]="true" [fullScreen]="true" [showThumbnails]="false" [autoPlay]="true"
  [(activeIndex)]="galleriaActiveIndex">
  <ng-template pTemplate="item" let-item>
    <ng-container *ngIf="item.type === 'image'">
      <!-- 點擊圖片開啟新分頁（會處理授權或直接開啟） -->
      <img [src]="item.url" alt="Image" style="width: 100%; display: block; cursor: zoom-in;"
        (click)="openInGalleria(item.url)" />
    </ng-container>
    <ng-container *ngIf="item.type === 'video'">
      <video [src]="item.url" controls style="width: 100%; display: block;">您的瀏覽器不支援影片標籤。</video>
    </ng-container>
  </ng-template>
</p-galleria>
