<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="設備代號"
          controlName="Device_ID"
          [control]="dataForm.controls.Device_ID"
          [submitted]="submitted"
        />
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="設備名稱"
          controlName="Device_Name"
          [control]="dataForm.controls.Device_Name"
          [submitted]="submitted"
        />
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="設備總量"
          controlName="Device_TotQty"
          [control]="dataForm.controls.Device_TotQty"
          [submitted]="submitted"
          [readonly]="true"
          [customPlaceholder]="'系統自動加總'"
        />
      </div>

      <app-table-edit
        class="col-12"
        tableKey="CPM11020Detail"
        [columns]="editColumns"
        [data]="data"
        (selectionChange)="selectedItems = $event"
        [selectedItems]="selectedItems"
        [keepDeletedData]="true"
        (dataChange)="onDataChange($event)"
        [tableRequired]="true"
        [disabled]="isFormReadable"
      />

      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="onReset()"
        />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
