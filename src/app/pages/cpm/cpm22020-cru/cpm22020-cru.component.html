<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" label="營業日期產生" icon="pi pi-book" (click)="BDG()" class="col"></app-button>
    </div>

  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 開始日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="開始日期" controlName="startDate"
            [control]="dataForm.controls.startDate" [submitted]="submitted"></app-calendar>
        </div>
        <!-- 結束日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="結束日期" controlName="endDate" [control]="dataForm.controls.endDate"
            [submitted]="submitted"></app-calendar>
        </div>
        <!-- 行銷檔期代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.marketingCampaignCode"
            [submitted]="submitted"></app-dropdown>
        </div>
        <!-- 檔期名稱 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="檔期名稱" controlName="campaignName" [control]="dataForm.controls.campaignName"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 檔期天數 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="檔期天數" controlName="campaignDays" [control]="dataForm.controls.campaignDays"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 營業目標金額 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="營業目標金額" controlName="salesTargetAmount" [control]="dataForm.controls.salesTargetAmount"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 去年開始日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="去年開始日期" controlName="lastYearStartDate"
            [control]="dataForm.controls.lastYearStartDate" [submitted]="submitted"></app-calendar>
        </div>
        <!-- 去年結束日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="去年結束日期" controlName="lastYearEndDate"
            [control]="dataForm.controls.lastYearEndDate" [submitted]="submitted"></app-calendar>
        </div>
      </div>
      <hr />
      <!-- 動態項目 -->
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <!-- 營業日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="營業日期" controlName="businessDate"
                [control]="getFormControl(i, 'businessDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 星期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="星期" controlName="weekDay" [control]="getFormControl(i, 'weekDay')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 預估營業額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="預估營業額" controlName="estimatedSales" [control]="getFormControl(i, 'estimatedSales')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 實際營業額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="實際營業額" controlName="actualSales" [control]="getFormControl(i, 'actualSales')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 來客數 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="來客數" controlName="customerCount" [control]="getFormControl(i, 'customerCount')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 客單價 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="客單價" controlName="averageSpending" [control]="getFormControl(i, 'averageSpending')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 去年日期 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateOne" label="去年日期" controlName="lastYearDate"
                [control]="getFormControl(i, 'lastYearDate')" [submitted]="submitted"></app-calendar>
            </div>
            <!-- 去年客單價 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="去年客單價" controlName="lastYearAverageSpending"
                [control]="getFormControl(i, 'lastYearAverageSpending')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 去年實際營業額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="去年實際營業額" controlName="lastYearActualSales"
                [control]="getFormControl(i, 'lastYearActualSales')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 去年來客數 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="去年來客數" controlName="lastYearCustomerCount"
                [control]="getFormControl(i, 'lastYearCustomerCount')" [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <!-- 動態新增按鈕 -->
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
