<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="館別" controlName="building_no" [options]="buildingNoOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.building_no" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="營業樓層" controlName="FLOOR_NO" [options]="floorNoOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.FLOOR_NO" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="營業區域" controlName="AREA_desc" [options]="areaNoOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.AREA_desc" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="服務台位置編號" controlName="Service_Id" [control]="dataForm.controls.Service_Id"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="服務台位置名稱" controlName="Service_Name" [control]="dataForm.controls.Service_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
