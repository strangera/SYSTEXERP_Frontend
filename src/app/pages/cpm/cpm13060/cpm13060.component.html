<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="日期"
              [startControl]="queryForm.controls.TXN_BDATE"
              [endControl]="queryForm.controls.TXN_EDATE"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="折扣規則"
              controlName="PKG_disc_rule_name"
              [options]="PKG_disc_rule_name_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PKG_disc_rule_name"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="cpm13060"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      [footerData]="footerData"
      [lastQueryBody]="historyRequestBody"
      [subTotalData]="subTotalData"
      [groupRowsBy]="groupRowsBy"
      [queryFunction]="cpm13060Service.queryCPM13060.bind(cpm13060Service)"
      [showReportMode]="false"
      [showManage]="false"
      [showDelete]="false"
    >
      <header>
        <div class="flex justify-content-between align-items-center gap-2">
          <div class="flex gap-2">
            <p-button
              styleClass="p-2"
              label="匯出APS停車抵扣報表.PDF"
              [loading]="btnLoading"
              icon="pi pi-file-pdf"
              (click)="onExportPDF()"
              [disabled]="data.length === 0"
            ></p-button>
            <p-button
              styleClass="p-2"
              label="匯出APS停車抵扣報表.xlsx"
              [loading]="btnLoading2"
              icon="pi pi-file-excel"
              (click)="onExportExcel()"
              [disabled]="data.length === 0"
            ></p-button>
          </div>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
