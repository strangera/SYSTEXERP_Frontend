<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 遺拾物品地點代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="遺拾物品地點代碼" controlName="SYS_Code" [control]="queryForm.controls.SYS_Code"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <!-- 遺拾物品地點名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="遺拾物品地點名稱" controlName="SYS_Name" [control]="queryForm.controls.SYS_Name"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="CPM11060" dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" (delete)="onDelete($event)" [showCheckBox]="true" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
    [queryFunction]="cpm11060Service.queryCPM11060.bind(cpm11060Service)" [loading]="loading">
  </app-table-report>
</div>
