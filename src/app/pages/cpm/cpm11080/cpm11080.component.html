<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="登錄日期" controlName="accountsummary"
              [startControl]="queryForm.controls.REC_DATE_FROM" [endControl]="queryForm.controls.REC_DATE_TO"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="失物類型" controlName="KIND" [options]="SubpoenastatusOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.KIND" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report tableKey="CPM11080" [data]="data" [columns]="columns" [addButton]="addButton"
      [showDelete]="false" [showReportMode]="false" dataKey="SEQ_ID" [totalRecords]="totalRecords"
      [showCheckBox]="false" [loading]="loading" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showExcel]="false" [showEdit]="false" [showDetail]="false"
      [showManage]="true">
    </app-table-report>
  </div>
</div>
