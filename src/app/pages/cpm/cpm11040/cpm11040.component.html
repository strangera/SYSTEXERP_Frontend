<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      [type]="'button'"
      (clickEvent)="onCreate()"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="借記/歸還編號"
            controlName="LoanNo"
            [control]="queryForm.controls.LoanNo"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="服務中心位置"
            controlName="ServiceId"
            [options]="serviceOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ServiceId"
            [submitted]="submitted"
            [showClear]="true"
          ></app-dropdown>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            label="出借日期"
            controlNameStart="LoanDateStart"
            controlNameEnd="LoanDateEnd"
            [startControl]="queryForm.controls.LoanDateStart"
            [endControl]="queryForm.controls.LoanDateEnd"
            [submitted]="submitted"
          ></app-calendar-range>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            label="歸還日期"
            controlNameStart="ReturnDateStart"
            controlNameEnd="ReturnDateEnd"
            [startControl]="queryForm.controls.ReturnDateStart"
            [endControl]="queryForm.controls.ReturnDateEnd"
            [submitted]="submitted"
          ></app-calendar-range>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="借用人姓名"
            controlName="UserName"
            [control]="queryForm.controls.UserName"
            [submitted]="submitted"
          ></app-input-text>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="連絡電話"
            controlName="LoanPhone"
            [control]="queryForm.controls.LoanPhone"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="證件類型"
            controlName="CertType"
            [options]="certTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.CertType"
            [submitted]="submitted"
            [showClear]="true"
          ></app-dropdown>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="證件編號"
            controlName="CertNo"
            [control]="queryForm.controls.CertNo"
            [submitted]="submitted"
          ></app-input-text>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="設備編號"
            controlName="DeviceID"
            [control]="queryForm.controls.DeviceID"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="設備名稱"
            controlName="DeviceName"
            [options]="deviceOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.DeviceName"
            [submitted]="submitted"
            [showClear]="true"
          ></app-dropdown>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="出借處理人員"
            controlName="LoanUserName"
            [control]="queryForm.controls.LoanUserName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="CPM11040"
    dataKey="ID"
    [data]="data"
    [columns]="columns"
    (delete)="onDelete($event)"
    (detail)="onDetail($event)"
    [showCheckBox]="true"
    [multiSortMeta]="[{ field: 'LoanDate', order: -1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [rows]="30"
    [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
    [loading]="loading"
    [showDelete]="false"
    [showCheckBox]="false"
    [showEdit]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  ></app-table>
</div>
