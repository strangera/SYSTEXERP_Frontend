<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 紀錄編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="紀錄編號"
            controlName="Loan_No"
            [control]="dataForm.controls.Loan_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 服務中心位置編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="服務中心位置編號"
            controlName="Service_Id"
            [options]="counterCodeOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Service_Id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <!-- 出借日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="出借日期"
            controlName="Loan_Date"
            [control]="dataForm.controls.Loan_Date"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <!-- 出借時間 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="timeOne"
            label="出借時間"
            controlName="Loan_Time"
            [control]="dataForm.controls.Loan_Time"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <!-- 借用人姓名 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="借用人姓名"
            controlName="User_Name"
            [control]="dataForm.controls.User_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 連絡電話 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="連絡電話"
            controlName="Loan_Phone"
            [control]="dataForm.controls.Loan_Phone"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 證件類型 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="證件類型"
            controlName="Cert_Type"
            [options]="certTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Cert_Type"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <!-- 證件編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="證件編號"
            controlName="Cert_No"
            [control]="dataForm.controls.Cert_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <!-- ===== 出借設備明細 ===== -->
      <div class="mt-4">
        <app-table-edit
          tableKey="cpm11030-detail"
          [data]="detailItems"
          [columns]="detailColumns"
          [disabled]="!isFormCreateable"
          [showInsert]="false"
          [showDelete]="isFormCreateable"
          [showCheckBox]="isFormCreateable"
          [dataStatusField]="''"
          (dataChange)="onDetailDataChange($event)"
        ></app-table-edit>
      </div>

      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
