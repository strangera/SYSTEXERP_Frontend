<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 出借編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="出借編號"
            controlName="Loan_No"
            [control]="dataForm.controls.Loan_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 出借處理人員(工號) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="出借處理人員(工號)"
            controlName="Loan_USR_No"
            [control]="dataForm.controls.Loan_USR_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 服務台位置編號（不連動） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="服務台位置編號"
            controlName="Service_Id"
            [options]="counterCodeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Service_Id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 異動日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="異動日期"
            controlName="Loan_Date"
            [control]="dataForm.controls.Loan_Date"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 出借時間（保留顯示，不影響 Daily insert） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="timeOne"
            label="出借時間"
            controlName="Loan_Time"
            [control]="dataForm.controls.Loan_Time"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 借用人姓名 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="借用人姓名"
            controlName="User_Name"
            [control]="dataForm.controls.User_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 連絡電話 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="連絡電話"
            controlName="Loan_Phone"
            [control]="dataForm.controls.Loan_Phone"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 證件類型 -->
        <div class="col-12 md:col-6 lg:col-4">

                    <app-dropdown
            label="證件類型"
            controlName="Cert_Type"
            [options]="counterCodeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Cert_Type"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 證件編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="證件編號"
            controlName="Cert_No"
            [control]="dataForm.controls.Cert_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- ✅ 設備代號：改 app-input-text（不連動） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="設備代號"
            controlName="Device_ID"
            [control]="dataForm.controls.Device_ID"
            [submitted]="submitted"
          ></app-input-text>
        
        </div>

        <!-- ✅ 設備名稱：自由輸入（不連動） -->
        <div class="col-12 md:col-6 lg:col-4">

                              <app-dropdown
            label="設備名稱"
            controlName="Device_Name"
            [options]="counterCodeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Device_Name"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- ✅ 本日庫存量：不預設 0（必填） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="本日庫存量"
            controlName="CSS_CurrentQty"
            [control]="dataForm.controls.CSS_CurrentQty"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="!isRead"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
