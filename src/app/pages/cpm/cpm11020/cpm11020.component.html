<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="設備代號/名稱"
            controlName="Device_id"
            [options]="deviceOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.Device_id"
            [submitted]="submitted"
          ></app-dropdown>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="設備名稱"
            controlName="Device_Name"
            [control]="queryForm.controls.Device_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="CPM11020"
    dataKey="ID"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (delete)="onDelete($event)"
    [showCheckBox]="true"
    [multiSortMeta]="[{ field: 'Device_ID', order: 1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [rows]="30"
    [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
    [loading]="loading"
    [showDelete]="true"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  ></app-table>
</div>
