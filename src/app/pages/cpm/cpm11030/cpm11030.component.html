<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 每日設備可出借量維護 -->
    <app-button
      [type]="'button'"
      label="每日設備可出借量維護"
      (clickEvent)="openDailyDialog()"
    ></app-button>

    <!-- 新增 -->
    <app-button
      btnType="create"
      [type]="'button'"
      (clickEvent)="onCreate()"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!-- 第一排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="出借編號"
              controlName="Loan_No"
              [control]="queryForm.controls.Loan_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="出借日期"
              [startControl]="queryForm.controls.Loan_BDate"
              [endControl]="queryForm.controls.Loan_EDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="借用人姓名"
              controlName="User_Name"
              [control]="queryForm.controls.User_Name"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <!-- 第二排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="出借處理人員(工號)"
              controlName="Loan_USR_No"
              [control]="queryForm.controls.Loan_USR_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="連絡電話"
              controlName="Loan_Phone"
              [control]="queryForm.controls.Loan_Phone"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="證件類型"
              controlName="Cert_Type"
              [options]="certTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Cert_Type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <!-- 第三排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="證件編號"
              controlName="Cert_No"
              [control]="queryForm.controls.Cert_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="設備名稱"
              controlName="Device_Name"
              [options]="deviceNameOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Device_Name"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="設備代號"
              controlName="Device_ID"
              [control]="queryForm.controls.Device_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <!-- 第四排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="服務中心位置編號"
              controlName="Service_Id"
              [options]="counterCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Service_Id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <!-- 按鈕列 -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 列表 -->
<!-- 列表 -->
<div class="card">
  <app-table-report
    [tableKey]="'cpm11030_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="true"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryCPM11030ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showDetail]="true"
    (detail)="onDetail($event)"
  >
    <header>
      <div class="flex justify-content-end align-items-center w-full">
        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="匯出PDF"
            [loading]="btnLoading"
            icon="pi pi-file-pdf"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="匯出Excel"
            [loading]="btnLoading"
            icon="pi pi-file-excel"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
<!-- Dialog：每日設備可出借量維護 -->
<app-dialog
  [(visible)]="dailyDialogVisible"
  header="每日設備可出借量維護"
  [loading]="dailyLoading"
  [disable]="dailySaving || dailyLoading || dailyRows.length === 0"
  [showFooter]="true"
  (save)="onDailySave()"
  (visibleChange)="onDailyDialogVisibleChange($event)"
>
  <form [formGroup]="dailyForm" class="p-fluid">
    <div class="grid justify-content-center p-fluid">
      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="服務台位置編號"
          controlName="Service_Id"
          [options]="counterCodeOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dailyForm.controls.Service_Id"
          [submitted]="dailySubmitted"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4">
        <app-calendar
          calendarType="dateOne"
          label="營業日期"
          controlName="CSS_Date"
          [control]="dailyForm.controls.CSS_Date"
          [submitted]="dailySubmitted"
        ></app-calendar>
      </div>

      <div
        class="col-12 md:col-12 lg:col-2 flex align-items-end justify-content-end"
      >
        <app-button
          [type]="'button'"
          btnType="query"
          [loading]="dailyLoading"
          (clickEvent)="onDailyQuery()"
        ></app-button>
      </div>
    </div>
  </form>

  <div class="mt-3">
    <app-table
      [tableKey]="'cpm11030_daily_equipment_' + dailyTableVer"
      [dataKey]="'_rowKey'"
      [title]="undefined"
      [columns]="dailyColumns"
      [data]="dailyRows"
      [loading]="dailyLoading"
      [showCaption]="false"
      [showHeader]="true"
      [showFilter]="false"
      [showReportMode]="false"
      [showReportPDF]="false"
      [showReportExcel]="false"
      [showExcel]="false"
      [showExcelExport]="false"
      [showExcelImport]="false"
      [showCustomExcelImport]="false"
      [showInsert]="false"
      [showDelete]="false"
      [showManage]="true"
      [showDetail]="false"
      [showEdit]="false"
      [showSerialNo]="false"
      [showCheckBox]="false"
      [showPaginator]="false"
      [scrollable]="true"
      [showSort]="false"
      [showRowEdit]="true"
      [alwaysEdit]="true"
      [alwaysBlurValidate]="false"
      [disabled]="dailySaving"
      emptyMessage="無資料"
      (rowEditSave)="onDailyRowEditSave($event)"
    ></app-table>
  </div>
</app-dialog>
