<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="專櫃品牌"
            controlName="KEYWORD"
            [control]="queryForm.controls.KEYWORD"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="營運狀態"
            controlName="TLT_OPENFLAG"
            [options]="TLT_OPENFLAG_OPTIONS"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.TLT_OPENFLAG"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="CPM11100"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    [showDelete]="false"
    [showEdit]="false"
    (detail)="onEdit($event)"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showReportMode]="false"
    [showDetail]="false"
    [addButton]="addButton"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="wrappedQueryFunction"
  ></app-table-report>
</div>
