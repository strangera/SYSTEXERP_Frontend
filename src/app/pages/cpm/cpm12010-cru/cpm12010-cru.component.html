<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="客戶意見類別編號" controlName="KIND_ID" [control]="dataForm.controls.KIND_ID"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="類別名稱" controlName="KIND_Name" [control]="dataForm.controls.KIND_Name"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <hr *ngIf="!isFormCreateable">
      <div *ngIf="!isFormCreateable" class="grid p-fluid">
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="建立日期"
          [control]="dataForm.controls.CRT_Date" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員" controlName="CRT_USR_No"
          [control]="dataForm.controls.CRT_USR_No" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員姓名" controlName="CRT_USR_Name"
          [control]="dataForm.controls.CRT_USR_Name" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="變更日期"
          [control]="dataForm.controls.UPD_Date" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員" controlName="UPD_USR_No"
          [control]="dataForm.controls.UPD_USR_No" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員姓名" controlName="UPD_USR_Name"
          [control]="dataForm.controls.UPD_USR_Name" />
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
