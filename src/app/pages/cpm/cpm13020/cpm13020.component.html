<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 交易日期 -->
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="交易日期"
            [startControl]="queryForm.controls.TXN_BDate"
            [endControl]="queryForm.controls.TXN_EDate"
            [submitted]="submitted">
          </app-calendar-range-quick>

          <!-- 付款別（單選，空值=全部） -->
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="支付別"
            controlName="PAY_No"
            [options]="paymentTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.PAY_No"
            [submitted]="submitted">
          </app-dropdown>

 
        </div>

        <!-- 檢視切換 -->
        <div class="flex align-items-center gap-4 mt-2">
          <div class="flex align-items-center gap-2">
            <p-radioButton
              name="reportMode"
              inputId="modeAll"
              value="ALL"
              [(ngModel)]="reportMode"
              [ngModelOptions]="{standalone: true}">
            </p-radioButton>
            <label for="modeAll" class="cursor-pointer">全館彙總</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-radioButton
              name="reportMode"
              inputId="modePos"
              value="POS"
              [(ngModel)]="reportMode"
              [ngModelOptions]="{standalone: true}">
            </p-radioButton>
            <label for="modePos" class="cursor-pointer">機台彙總</label>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-3 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <!-- 全館彙總 -->
    <app-table-report
      *ngIf="reportMode==='ALL'"
      tableKey="CPM13020_ALL"
      [lastQueryBody]="historyRequestBody"
      [data]="rows"
      [columns]="columnsAll"
      [totalRecords]="totalRecords"
      [showDelete]="false"
      [showManage]="false"
      [showReportMode]="false"
      [queryFunction]="queryAllForReport">

    </app-table-report>

    <!-- 機台彙總 -->
    <app-table-report
      *ngIf="reportMode==='POS'"
      tableKey="CPM13020_POS"
      [lastQueryBody]="historyRequestBody"
      [data]="rows"
      [columns]="columnsPos"
      [totalRecords]="totalRecords"
      [showDelete]="false"
      [showManage]="false"
      [showReportMode]="false"
      [queryFunction]="queryPosForReport">
    
    </app-table-report>
  </div>
</div>
