<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" (click)="onCreate()"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="接件日期"
              [startControl]="queryForm.controls.COMPLAIN_DATE_S"
              [endControl]="queryForm.controls.COMPLAIN_DATE_E"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="派單日期"
              [startControl]="queryForm.controls.ALERT_DATE_S"
              [endControl]="queryForm.controls.ALERT_DATE_E"
              [submitted]="submitted"
            />
          </div>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="處理狀態"
            controlName="STATUS"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.STATUS"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="CPM12060"
    dataKey="SEQ_ID"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showCheckBox]="false"
    [multiSortMeta]="[{ field: 'SEQ_ID', order: 1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
    [showDelete]="false"
    [showEdit]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  ></app-table>
</div>
