<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 折抵時數輸入框 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" label="折抵時數" controlName="PKNG_DiscHour"
            [control]="queryForm.controls.PKNG_DiscHour" [submitted]="submitted"></app-input-number>

          <!-- 折抵金額輸入框 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" label="折抵金額" controlName="PKNG_SaleAmt"
            [control]="queryForm.controls.PKNG_SaleAmt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showManage]="true" [showCheckBox]="true" (delete)="onDelete($event)" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [totalRecords]="totalRecords" [loading]="loading" [isRowSelectable]="isRowSelectable"
    [editDisabled]="editDisabled" [queryFunction]="cpm13010Service.queryCPM13010.bind(cpm13010Service)"
    [deleteDisabled]="deleteDisabled" [lastQueryBody]="lastQueryBody" tableHeaderCheckboxLabel="刪除/恢復">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button styleClass="p-2" label="恢復折抵" [loading]="btnLoading" icon="pi pi-undo" (click)="onRecoverDiscount()"
          [disabled]="selectedRows.length === 0 || isRecoverDisabled"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
