<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 折抵時數輸入框 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" label="折抵時數" controlName="PKNG_DiscHour"
            [control]="queryForm.controls.PKNG_DiscHour" [submitted]="submitted"></app-input-number>

          <!-- 折抵金額輸入框 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" label="折抵金額" controlName="PKNG_SaleAmt"
            [control]="queryForm.controls.PKNG_SaleAmt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showManage]="true" [showCheckBox]="true" (delete)="onDelete($event)" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [multiSortMeta]="[{ field: 'PKNG_SeqNo', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading">
    <header>
      <div class="flex gap-2 align-items-center">
        <p-button [ngStyle]="{ width: '35px', height: '35px' }" [style]="{ width: '35px', height: '35px' }"
          pTooltip="下傳" tooltipPosition="top" pButton icon="pi pi-upload" severity="success"
          class="p-button-rounded p-button-text" [disabled]="selectedRows.length === 0" (click)="onUpload()"
          [loading]="btnLoading" />
      </div>
    </header>
  </app-table>
</div>
