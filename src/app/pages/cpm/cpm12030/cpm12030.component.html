<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="子類別編號" [options]="KIND_SubIDOptions$ | async" optionLabel="label" optionValue="value"
              controlName="KIND_SubID" [control]="queryForm.controls.KIND_SubID" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="子類別名稱" controlName="KIND_SubName" [control]="queryForm.controls.KIND_SubName"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="客戶意見主類別" controlName="KIND_ID" [options]="KIND_IDOptions$ | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.KIND_ID" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    (delete)="onDelete($event)" [totalRecords]="totalRecords" [loading]="loading" [showCheckBox]="true"
    [showDelete]="true" (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows"
    [lastQueryBody]="lastQuery" [showDelete]="false"
    [queryFunction]="cpm12030Service.queryCPM12030.bind(cpm12030Service)"></app-table-report>
</div>
