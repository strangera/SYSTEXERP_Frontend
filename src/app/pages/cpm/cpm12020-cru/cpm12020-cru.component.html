<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="組織代碼/名稱" controlName="ORG_ID" [options]="ORG_IDOptions$ | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ORG_ID" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="責任單位編號" controlName="CLASS_ID" [control]="dataForm.controls.CLASS_ID">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="責任單位名稱" controlName="CLASS_NAME" [control]="dataForm.controls.CLASS_NAME"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid mt-2 border-top-1 surface-border pt-2">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建立日期" controlName="CRT_Date" [control]="dataForm.controls.CRT_Date">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建立人員" controlName="CRT_USR_Name" [control]="dataForm.controls.CRT_USR_Name">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="變更日期" controlName="UPD_Date" [control]="dataForm.controls.UPD_Date">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="變更人員" controlName="UPD_USR_Name" [control]="dataForm.controls.UPD_USR_Name">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
