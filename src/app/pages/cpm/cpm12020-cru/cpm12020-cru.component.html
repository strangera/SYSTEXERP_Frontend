<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="組織代碼" controlName="ORG_ID" [options]="ORG_IDOptions$ | async" optionLabel="value"
            optionValue="value" templateLabel="label" [control]="dataForm.controls.ORG_ID"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="組織名稱" controlName="ORG_NAME" [control]="dataForm.controls.ORG_NAME"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="類別代碼" controlName="CLASS_CODE" [control]="dataForm.controls.CLASS_CODE"
            [options]="CLASS_CODEOptions" optionLabel="label" optionValue="value" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="責任單位名稱" controlName="CLASS_NAME" [control]="dataForm.controls.CLASS_NAME"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
