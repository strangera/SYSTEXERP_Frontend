<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="顧客意見責任單位編號" controlName="opinionCode"
                        [control]="dataForm.controls.opinionCode" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="責任單位名稱" controlName="unitName" [control]="dataForm.controls.unitName"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>

        <div class="col pt-4">
            <div class="grid justify-content-end">
