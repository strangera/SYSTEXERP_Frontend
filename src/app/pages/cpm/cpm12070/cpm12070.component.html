<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="客戶意見類別" controlName="KIND_IDs" [options]="opinionOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.KIND_IDs" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="接件日期" [startControl]="queryForm.controls.DATE_FROM"
              [endControl]="queryForm.controls.DATE_TO" [submitted]="submitted">
            </app-calendar-range-quick>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="cpm12070" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [loading]="loading" [lastQueryBody]="historyRequestBody" [showDelete]="false" [showManage]="false"
    [queryFunction]="cpm12070Service.queryCPM12070.bind(cpm12070Service)" [showSort]="false">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出顧客意見類別統計表.PDF" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0" [loading]="btnLoading">
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
