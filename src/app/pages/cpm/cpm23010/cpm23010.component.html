<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- 建立按鈕，需有新增權限 -->
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 活動開始日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="活動開始日期" controlName="activityStartDate"
              [control]="queryForm.controls.activityStartDate" [submitted]="submitted"></app-calendar>
          </div>
          <!-- 活動結束日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="活動結束日期" controlName="activityEndDate"
              [control]="queryForm.controls.activityEndDate" [submitted]="submitted"></app-calendar>
          </div>
          <!-- 申請日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="申請日期" controlName="applicationDate"
              [control]="queryForm.controls.applicationDate" [submitted]="submitted"></app-calendar>
          </div>
          <!-- 行銷檔期代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.marketingCampaignCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 檔期名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="檔期名稱" controlName="campaignName" [control]="queryForm.controls.campaignName"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 用品管理單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="用品管理單號" controlName="supplyManagementNumber"
              [control]="queryForm.controls.supplyManagementNumber" [submitted]="submitted"></app-input-text>
          </div>
          <!-- 廠商編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="manufacturerCode" [options]="manufacturerOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.manufacturerCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 申請人員 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人員" controlName="applicant" [options]="applicantOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.applicant" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 用品狀況 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="用品狀況" controlName="supplyCondition" [options]="supplyConditionOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.supplyCondition"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <!-- 查詢與清除按鈕 -->
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-table>
  </div>
</div>
