<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="單號"
          controlName="SEQ_ID"
          [control]="dataForm.controls.SEQ_ID"
          [submitted]="submitted"
        />
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="客戶名稱"
          controlName="CUST_NAME"
          [control]="dataForm.controls.CUST_NAME"
          [submitted]="submitted"
        />
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="性別"
          controlName="SEX"
          [options]="SEXOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.SEX"
          [submitted]="submitted"
        ></app-dropdown>
      </div>
      <div class="grid p-fluid">
        <!-- <app-calendar
          calendarType="dateOne"
          label="提供日期"
          controlName="COMPLAIN_DATE"
          [control]="dataForm.controls.COMPLAIN_DATE"
          [submitted]="submitted"
        ></app-calendar> -->
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="處理單位"
          controlName="ORG_ID"
          [control]="dataForm.controls.ORG_ID"
          [submitted]="submitted"
        />
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="處理狀態"
          controlName="STATUS"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.STATUS"
          [submitted]="submitted"
        ></app-dropdown>
      </div>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="處理-時"
          controlName="ANSWER_DATE_MM"
          [control]="dataForm.controls.ANSWER_DATE_MM"
          [submitted]="submitted"
        />
      </div>

      <app-table-edit
        class="col-12"
        tableKey="CPM12060Detail"
        [columns]="editColumns"
        [data]="data"
        (selectionChange)="selectedItems = $event"
        [selectedItems]="selectedItems"
        [keepDeletedData]="true"
        (dataChange)="onDataChange($event)"
        [tableRequired]="true"
        [disabled]="isFormReadable"
      />

      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="onReset()"
        />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
