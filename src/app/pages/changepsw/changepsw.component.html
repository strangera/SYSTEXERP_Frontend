<div class="card mb-3">
  <div class="w-full">
    <div class="flex align-items-center justify-content-between mb-4">
      <h5>變更密碼</h5>
    </div>

    <p-toast></p-toast>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <h6>輸入舊密碼</h6>
      <input type="password" pInputText formControlName="oldPassword" placeholder="請輸入舊密碼" class="w-full mb-3" />

      <hr>

      <h6>輸入新密碼</h6>
      <input type="password" pInputText formControlName="newPassword" placeholder="請輸入新密碼" class="w-full mb-3" />
      <input type="password" pInputText formControlName="confirmPassword" placeholder="再次輸入新密碼" class="w-full mb-3" />

      <button pButton label="變更密碼" type="submit" [disabled]="passwordForm.invalid"></button>
    </form>
  </div>
</div>
