<form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
  <span class="p-text-secondary block mb-5">更新您的密碼</span>
  <div class="field grid">
    <label for="oldPassword" class="col-12 mb-2 md:col-2 md:mb-0">舊密碼</label>
    <div class="col-12 md:col-10">
      <p-password id="oldPassword" formControlName="oldPassword" class="w-full" styleClass="w-full"
        inputStyleClass="w-full" placeholder="請輸入舊密碼" maxlength="8" [toggleMask]="true" appendTo="body"
        [feedback]="false" />
      <small
        *ngIf="passwordForm.controls['oldPassword'].touched && passwordForm.controls['oldPassword'].errors?.['required']"
        class="p-error block">舊密碼為必填項。</small>
    </div>
  </div>
  <div class="field grid">
    <label for="newPassword" class="col-12 mb-2 md:col-2 md:mb-0">密碼</label>
    <div class="col-12 md:col-10">
      <p-password id="newPassword" class="w-full" styleClass="w-full" inputStyleClass="w-full"
        formControlName="newPassword" placeholder="請輸入新密碼" maxlength="8" promptLabel="設定密碼" weakLabel="太簡單"
        mediumLabel="中等複雜度" strongLabel="複雜密碼" [toggleMask]="true" appendTo="body" [strongRegex]="strongRegex">
        <ng-template pTemplate="footer">
          <div class="flex flex-column">
            <p-divider />
            <p class="mt-2">密碼規則格式限制：</p>
            <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
              <li>字數限制：4 至 8 個字元</li>
              <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                <li>至少一個英文大寫字母（A–Z）</li>
                <li>至少一個數字（0–9）</li>
                <li>至少一個特殊符號</li>
              </ul>
            </ul>
          </div>
        </ng-template>
      </p-password>
      <small
        *ngIf="passwordForm.controls['newPassword'].touched && passwordForm.controls['newPassword'].errors?.['required']"
        class="p-error block">新密碼為必填項。</small>
      <small
        *ngIf="passwordForm.controls['newPassword'].touched && passwordForm.controls['newPassword'].errors?.['invalidPasswordStrength']"
        class="p-error block">密碼強度不足，請符合密碼規則。</small>
    </div>
  </div>
  <div class="field grid">
    <label for="confirmPassword" class="col-12 mb-2 md:col-2 md:mb-0">確認密碼</label>
    <div class="col-12 md:col-10">
      <p-password id="confirmPassword" class="w-full" styleClass="w-full" inputStyleClass="w-full"
        formControlName="confirmPassword" placeholder="請再次輸入密碼" maxlength="8" [toggleMask]="true" appendTo="body"
        [feedback]="false" />
      <small
        *ngIf="passwordForm.controls['confirmPassword'].touched && passwordForm.controls['confirmPassword'].errors?.['required']"
        class="p-error block">確認密碼為必填項。</small>
      <small *ngIf="passwordForm.errors?.['passwordsMismatch']" class="p-error block">密碼與確認密碼不符。</small>
    </div>
  </div>
  <div class="flex justify-content-end gap-2">
    <!-- <p-button label="取消" severity="secondary" (onClick)="visible = false" /> -->
    <p-button label="確定" [loading]="formButtonLoading" type="submit" />
  </div>
</form>
