<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="退票日"
              [startControl]="queryForm.controls.backDateStart"
              [endControl]="queryForm.controls.backDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="chkNo"
              [control]="queryForm.controls.chkNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            [type]="'button'"
            label="支票退票"
            (clickEvent)="onBounce()"
          ></app-button>

          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- ✅ 列表：用 ID 當 dataKey 才能送 IdList -->
<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN64050_TABLE'"
    [dataKey]="'ID'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="true"
    [selectionMode]="'multiple'"
    [(selectedItems)]="selectedItems"
    [isRowSelectable]="isRowSelectable"
    [showManage]="true"
    [showDetail]="false"
    [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="false"
    [lazy]="true"
  >
    <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="匯出應收票據退票作業.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="匯出應收票據退票作業.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table>
</div>

<!-- ✅ 支票退票 Dialog -->
<p-dialog
  header="支票退票"
  [(visible)]="bounceDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '560px' }"
>
  <form [formGroup]="bounceForm" class="p-fluid">
    <div class="grid">
      <div class="col-12">
        <app-calendar
          calendarType="dateOne"
          label="退票日期"
          controlName="BackDate"
          [control]="bounceForm.controls.BackDate"
          [submitted]="submitted"
        ></app-calendar>
      </div>

      <div class="col-12">
        <app-input-text
          label="備註(選填)"
          controlName="CHK_Comment"
          [control]="bounceForm.controls.CHK_Comment"
          [submitted]="submitted"
        ></app-input-text>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="取消"
        severity="secondary"
        (onClick)="onBounceCancel()"
      ></p-button>
      <p-button
        label="確認"
        [loading]="btnLoading"
        (onClick)="onBounceConfirm()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
