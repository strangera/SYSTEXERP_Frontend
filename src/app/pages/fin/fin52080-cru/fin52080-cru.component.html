<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="科目代號"
                          controlName="AccNo"
                          [control]="df().AccNo"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="科目名稱"
                          controlName="AccCname"
                          [control]="df().AccCname"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="科目英文名稱"
                          controlName="AccEname"
                          [control]="df().AccEname"
                          [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="借/貸"
                        controlName="AccDC"
                        [options]="service.accDCOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().AccDC"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="統制/明細"
                        controlName="Ledger_MD"
                        [options]="service.ledgerMDOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Ledger_MD"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="三碼代號"
                        controlName="ClassNo"
                        [options]="service.classNoOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().ClassNo"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否為沖帳代號"
                        controlName="ABAT_YN"
                        [options]="service.whetherOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().ABAT_YN"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="傳票格式"
                        controlName="Voucher_Type"
                        [options]="service.voucherTypeOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Voucher_Type"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否為預算科目"
                        controlName="Budget_YN"
                        [options]="service.whetherOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Budget_YN"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否設定部門代號"
                        controlName="Org_YN"
                        [options]="service.whetherOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Org_YN"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <!-- <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="折舊攤提年限" controlName="rest_value" [control]="df().rest_value"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="殘值年限" controlName="rest_value2" [control]="df().rest_value2"
                [submitted]="submitted"></app-input-text>
            </div> -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否可輸"
                        controlName="Input_YN"
                        [options]="service.whetherOption"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="df().Input_YN"
                        [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>
