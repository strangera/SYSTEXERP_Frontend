<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateMonthRange"
              label="日期"
              [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="類別"
              [control]="queryForm.controls.Ledger_MD"
              [options]="Ledger_MDOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="部門"
              controlName="OrgList"
              [options]="OrgIdOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.OrgList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <!-- 是否含以下所屬部門 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsCludeDownOrg"
              formControlName="IsCludeDownOrg"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsCludeDownOrg">是否含以下所屬部門</label>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="對帳 Key 值"
              controlName="ProjectNo"
              [control]="queryForm.controls.ProjectNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="PrintSign"
              label="列印簽核欄"
              formControlName="PrintSign"
              [binary]="true"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="ShowZero"
              label="顯示零餘額科目"
              formControlName="ShowZero"
              [binary]="true"
            ></p-checkbox>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="flex justify-content-end align-items-center gap-2 p-2">
    <p-button
      styleClass="p-2"
      label="當期/累計損益表PDF"
      [loading]="btnLoading"
      icon="pi pi-file"
      (click)="onExportPDF()"
      [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
    ></p-button>
    <p-button
      styleClass="p-2"
      label="當期/累計損益表Excel"
      [loading]="btnLoading"
      icon="pi pi-file-excel"
      (click)="onExportExcel()"
      [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
    ></p-button>
  </div>
  <app-table-subheader-grouping
    [data]="data"
    [footerData]="footerData"
    [historyRequestBody]="historyRequestBody"
  ></app-table-subheader-grouping>
  @if (data.length) {
    <app-report-signature dataType="FIN55090" />
  }
</div>
