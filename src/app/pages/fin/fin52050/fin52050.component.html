<div class="card fin11020">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="大類代碼"
              controlName="ClassAttr"
              [control]="queryForm.controls.ClassAttr"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="大類名稱"
              controlName="ClassAttrCName"
              [control]="queryForm.controls.ClassAttrCName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="大類英文名稱"
              controlName="ClassAttrEname"
              [control]="queryForm.controls.ClassAttrEname"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="FIN52050"
    dataKey="ClassAttr"
    [data]="data"
    [columns]="columns"
    (detail)="onDetail($event)"
    [showCheckBox]="true"
    [showEdit]="true"
    [showDelete]="true"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
    [rows]="30"
    [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
    [multiSortMeta]="[{ field: 'ClassAttr', order: 1 }]"
    apiUrl="queryFIN52050"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
  ></app-table>
</div>
