<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- 申報年月 -->
            <app-year-month label="申報年月" [control]="queryForm.controls.INV_DeclareYM" [evenMonth]="true"
              [submitted]="submitted"></app-year-month>
          </div>
          <div class="col-12 md:col-8">
            <app-input-text-range label="退出/折讓單號" [startControl]="queryForm.controls.TXN_Ret_NoS"
              [endControl]="queryForm.controls.TXN_Ret_NoE" [submitted]="submitted"
              [errorForGroup]="true"></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="字軌" controlName="InvoiceTrack" [control]="queryForm.controls.InvoiceTrack"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-8">
            <app-input-text-range label="發票號碼" [startControl]="queryForm.controls.InvoiceNumberS"
              [endControl]="queryForm.controls.InvoiceNumberE" [submitted]="submitted"
              [errorForGroup]="true"></app-input-text-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading" label="列印"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
