<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-table
          tableKey="fin11200DetailTable"
          dataKey="ECR_No"
          title="加入零用金申請單據"
          class="col-12"
          [data]="data"
          [columns]="columns"
          [showManage]="false"
          [showCheckBox]="true"
          [showInsert]="true"
          (insert)="dialogVisible = true; this.selectedItemsDialog = []"
          (delete)="onDelete($event)"
          [selectedItems]="selectedData"
          (selectionChange)="selectedData = $event"
          [showReportMode]="false"
        ></app-table>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="resetTable()"
        ></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<app-dialog
  [visible]="dialogVisible"
  header="零用金申請單據"
  (visibleChange)="dialogVisible = $event"
  (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0"
>
  <form [formGroup]="dialogQueryForm" class="flex pb-2 align-items-end gap-2">
    <app-input-text
      class="flex-grow-1"
      label="申請日期"
      controlName="ECR_No"
      [control]="dialogQueryForm.controls.ECR_No"
      (input)="inputEnter()"
    />
    <app-input-text
      class="flex-grow-1"
      label="保管單位"
      controlName="ECR_Name"
      [control]="dialogQueryForm.controls.ECR_Name"
      (input)="inputEnter()"
    />
    <app-input-text
      class="flex-grow-1"
      label="保管人"
      controlName="ECR_Name2"
      [control]="dialogQueryForm.controls.ECR_Name2"
      (input)="inputEnter()"
    />
  </form>
  <app-table
    tableKey="fin11200DialogTable"
    dataKey="ECR_No"
    [data]="dialogData"
    [columns]="columns"
    [selectedItems]="selectedItemsDialog"
    (selectionChange)="selectedItemsDialog = $event"
    [showHeader]="false"
    [showManage]="false"
    [showCheckBox]="true"
    [emptyMessage]="'無可選擇的單據'"
    [isRowSelectable]="isRowSelectable.bind(this)"
    scrollHeight="350px"
    [showCaption]="false"
  ></app-table>
</app-dialog>
