<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range label="申請日期" [startControl]="dataForm.controls.DateFrom"
            [endControl]="dataForm.controls.DateTo" [submitted]="submitted" />
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="保管單位" controlName="Keep_OrgID" [options]="KeepOrgID_Options()" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Keep_OrgID" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="保管人" controlName="Keep_UsrNo" [options]="KeepUsrNo_Options()" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Keep_UsrNo" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="dataForm"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>
    </form>
    <app-table-report tableKey="fin11200DetailTable" dataKey="PCS_No" title="新增請款" class="col-12" [data]="data"
      [totalRecords]="data.length" [columns]="columns" [showManage]="false" [showCheckBox]="true"
      (insert)="dialogVisible = true; this.selectedItemsDialog = []" (delete)="onDelete($event)"
      [selectedItems]="selectedData" (selectionChange)="selectedData = $event"
      [showReportMode]="false"></app-table-report>

    <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="cancel" [form]="dataForm" (clickEvent)="resetTable()"></app-button>
      <app-button btnType="submit" [loading]="loading" (clickEvent)="onClaim()"></app-button>
    </div>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="零用金申請單據" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <app-table-report tableKey="fin11200DialogTable" dataKey="PCS_No" [data]="dialogData" [columns]="columns"
    [selectedItems]="selectedItemsDialog" (selectionChange)="selectedItemsDialog = $event" [showManage]="false"
    [showCheckBox]="true" [emptyMessage]="'無可選擇的單據'" [isRowSelectable]="isRowSelectable.bind(this)" scrollHeight="350px"
    [showCaption]="false" [totalRecords]="totalDialogRecords()"></app-table-report>
</app-dialog>
