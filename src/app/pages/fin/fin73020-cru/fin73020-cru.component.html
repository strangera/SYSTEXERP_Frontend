<p-table [value]="rows" class="custom-table">
    <ng-template pTemplate="header">
        <tr>
            <th>子系統項目</th>
            <th>作業名稱</th>
            <th>功能按鈕名稱</th>
            <th>備註</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
        <tr>
            <!-- 合併相同子系統項目 -->
            <td *ngIf="shouldShowSubsystemItem(row, rowIndex)" class="center" [attr.rowspan]="getRowspan(row.subsystemItem)">
                <div class="checkbox-label">
                    <input type="checkbox" [(ngModel)]="row.checked" (change)="onSubsystemCheckboxChange(row.subsystemItem, $event)" /> {{ row.subsystemItem }}
                </div>
            </td>
            <td class="center">
                <div class="checkbox-label">
                    <input type="checkbox" [(ngModel)]="row.operationChecked" (change)="onOperationCheckboxChange(row, $event)" /> {{ row.operationName }}
                </div>
            </td>
            <td class="center">
                <div class="checkbox-group">
                    <label *ngFor="let button of row.functionButtons | keyvalue; trackBy: trackByKey">
              <input
                type="checkbox"
                [ngModel]="getButtonValue(row, button.key)"
                (ngModelChange)="setButtonValue(row, button.key, $event)"
              />
              {{ button.key }}
            </label>
                </div>
            </td>
            <td class="center">
                <input type="text" [(ngModel)]="row.remark" class="remark-input" />
            </td>
        </tr>
    </ng-template>
</p-table>
