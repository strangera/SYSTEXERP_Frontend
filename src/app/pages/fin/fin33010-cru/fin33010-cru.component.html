<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="傳票編號" controlName="WSLIP_NO" [control]="dataForm.controls.WSLIP_NO"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票種類 (1/2/3 對應中文) -->
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="傳票種類" controlName="VouType" [options]="vouTypeOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.VouType" [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 傳票型態 (RM 等，來自 SYS1000 entry_type) -->
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="傳票型態" controlName="VoucherType" [options]="srcSheetTypeOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.VoucherType" [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 傳票日期 -->
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar label="傳票日期" controlName="VouDate" [control]="dataForm.controls.VouDate"
            [submitted]="submitted"></app-calendar>
        </div>
        <!-- 傳票摘要 -->
        <div class="col-12 md:col-6 lg:col-6">
          <app-input-text label="傳票摘要" controlName="Remark" [control]="dataForm.controls.Remark"
            [submitted]="submitted"></app-input-text>
        </div>


        <!-- <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="傳票狀態" controlName="PostFlag" [options]="postFlagOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.PostFlag" [submitted]="submitted"></app-dropdown>
        </div> -->
        <!-- 建立人員 -->
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="建立人員" controlName="CRT_USR_No" [control]="dataForm.controls.CRT_USR_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 建立日期 -->
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar label="建立日期" controlName="CRT_Date" [control]="dataForm.controls.CRT_Date"
            [submitted]="submitted"></app-calendar>
        </div>
      </div>

      <!-- 編輯資料 table -->
      <div class="col-12">
        <app-table-edit tableKey="TLS2C040Edit" [columns]="editColumns" [data]="editData"
          (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" [tableRequired]="true"
          [disabled]="false" [showInsert]="false" [canInsert]="false" [showCheckBox]="false" [showDelete]="false"
          [footerData]="editFooterData" />
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
