<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="調撥單號" controlName="dialnumber" [control]="queryForm.controls.dialnumber"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="建立日期" controlName="creationDate "
              [startControl]="queryForm.controls.ScreationDate" [endControl]="queryForm.controls.EcreationDate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="轉帳日期" controlName="transferdate "
              [startControl]="queryForm.controls.Stransferdate" [endControl]="queryForm.controls.Etransferdate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="轉入公司銀行科目代號" controlName="TCBAC" [options]="TCBACOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TCBAC" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="轉出公司銀行科目代號" controlName="TOCBAC" [options]="TOCBACOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TOCBAC" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否列印備註" controlName="ifOptions" [options]="ifOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ifOptions" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report apiUrl="queryfin62020" tableKey="fin62020query" dataKey="id" [lastQueryBody]="lastQueryBody"
    [totalRecords]="totalRecords" [data]="data" [showCheckBox]="true" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [columns]="columns" (delete)="onDelete($event)" [showManage]="false"
    [queryFunction]="fin62020Service.queryFIN62020.bind(fin62020Service)" [loading]="loading"></app-table-report>
</div>
