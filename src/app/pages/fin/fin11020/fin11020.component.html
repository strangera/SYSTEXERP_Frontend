<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
      <app-button btnType="create" label="二聯式發票領用明細表" (click)="onCreate()" class="col"></app-button>
    </div>
    <div>
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- <app-datemm-two label="發票年月" [control]="queryForm.controls.onedatemm" [submitted]="submitted">
                        </app-datemm-two> -->
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="字軌" controlName="track" [control]="queryForm.controls.track" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="發票號碼"
              [startControl]="queryForm.controls.startserialticket" [endControl]="queryForm.controls.endserialticket"
              [submitted]="submitted">
            </app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發票類別" controlName="invoiceCategory" [options]="invoiceCategoryOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.invoiceCategory"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="有無副聯" controlName="viceTicket" [options]="whetherOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.viceTicket" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <div class="col">
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-table>
  </div>
</div>
