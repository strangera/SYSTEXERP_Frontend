<div class="card fin11020">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <p-fileUpload #fileUpload mode="basic" chooseIcon="pi pi-upload" accept=".csv"
      (onSelect)="onFileUpload($event);fileUpload.clear()" [auto]="true" chooseLabel="匯入CSV"
      [chooseIcon]="uploadLoading ? 'pi pi-spin pi-spinner' : 'pi pi-upload'"
      [disabled]="uploadLoading || !this.hasPermission(Actions.ImportCSV)" />
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(起)" [control]="queryForm.controls.GUI_YYMM_start"
            [submitted]="submitted"></app-year-month>
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(迄)" [control]="queryForm.controls.GUI_YYMM_end"
            [submitted]="submitted"></app-year-month>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="track"
            [control]="queryForm.controls.GUI_Track" [submitted]="submitted" />
          <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
            [startControl]="queryForm.controls.GUI_No_start" [endControl]="queryForm.controls.GUI_No_end"
            [submitted]="submitted" [errorForGroup]="true" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="ID" [data]="data" [columns]="columns" [expansionColumns]="subColumns" (edit)="onEdit($event)"
    expansionDataKey="POS10171Details" (detail)="onDetail($event)" [showCheckBox]="true" (delete)="onDelete($event)"
    (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows" [isRowSelectable]="isRowSelectable"
    [multiSortMeta]="[{ field: 'GUI_YYMM', order: 1 },{ field: 'GUI_SerNo', order: 1 }]" [totalRecords]="totalRecords"
    [editDisabled]="editDisabled" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading">
  </app-table>
</div>
