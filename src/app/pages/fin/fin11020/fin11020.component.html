<div class="card fin11020">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <p-fileUpload #fileUpload mode="basic" chooseIcon="pi pi-upload" accept=".csv"
      (onSelect)="onFileUpload($event);fileUpload.clear()" [auto]="true" chooseLabel="匯入CSV" />
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateMonthRange" label="發票年月"
            [startControl]="queryForm.controls.GUI_YYMM_start" [endControl]="queryForm.controls.GUI_YYMM_end"
            [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="track"
            [control]="queryForm.controls.GUI_Track" [submitted]="submitted" />
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="發票號碼"
            [startControl]="queryForm.controls.GUI_No_start" [endControl]="queryForm.controls.GUI_No_end"
            [submitted]="submitted" [maxBoundary]="99999999" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="ID" [data]="data" [columns]="columns" [expansionColumns]="subColumns" expansionDataKey="details"
    (edit)="onEdit($event)" (detail)="onDetail($event)" [showCheckBox]="true" (delete)="onDelete($event)"
    (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows" [isRowSelectable]="isRowSelectable"
    [multiSortMeta]="[{ field: 'ID', order: 1 }]" [totalRecords]="totalRecords" [editDisabled]="editDisabled"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading">
  </app-table>
</div>
