<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="廠客代號"
              [startControl]="queryForm.controls.startFactoryID"
              [endControl]="queryForm.controls.endFactoryID"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <!-- 立帳日期區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="立帳日期"
              [startControl]="queryForm.controls.startEstablishDate"
              [endControl]="queryForm.controls.endEstablishfDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 科目代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="科目代號"
              [startControl]="queryForm.controls.startSubjectID"
              [endControl]="queryForm.controls.endSubjectID"
              [submitted]="submitted">
            </app-input-text-range>
          </div>
        </div>

        <hr />

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="應付金額是否顯示"
              groupname="display"
              [control]="queryForm.controls.display"
              [options]="showUpOptions"
              [submitted]="submitted">
            </app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="帳款餘額為零是否顯示"
              groupname="showUp"
              [control]="queryForm.controls.showUp"
              [options]="showUpOptions"
              [submitted]="submitted">
            </app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)">
          </app-button>

          <app-button
            btnType="query"
            [loading]="loading">
          </app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [tableKey]="'fin34010_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="false"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryFIN34010ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event">

    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出應收帳款明細表 Excel"
          icon="pi pi-file-excel"
          [loading]="btnExportLoading"
          (click)="downloadFIN34010Excel()"
          [disabled]="btnExportLoading">
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
