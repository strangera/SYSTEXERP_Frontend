<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
  <p-accordionTab header="{{ 'query-conditions' | translate }}" 
                  [selected]="true" 
                  class="line-height-3 m-0"
                  [headerStyleClass]="'query-accordionTab'">

    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">

      <div class="grid p-fluid">

        <!-- 申報年月 (必填) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar 
            label="申報年月" 
            calendarType="dateMonthOne"
            controlName="onedatemm"
            [control]="queryForm.controls.onedatemm"
            [submitted]="submitted">
          </app-calendar>
        </div>

        <!-- 字軌（兩位英文）-->
        <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="字軌(輸入英文字兩位)" controlName="track" [control]="queryForm.controls.track"
              [submitted]="submitted"></app-input-text>
        </div>

      </div>


      <div class="grid p-fluid">

        <!-- 廠商代號起 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown 
            label="廠商代號" 
            controlName="startFactoryID"
            [options]="factoryIDOptions" 
            optionLabel="label" 
            optionValue="value"
            [control]="queryForm.controls.startFactoryID"
            [submitted]="submitted">
          </app-dropdown>
        </div>
        
        <!-- 廠商代號迄 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown 
            label="　" 
            controlName="endFactoryID"
            [options]="factoryIDOptions"
            optionLabel="label" 
            optionValue="value"
            [control]="queryForm.controls.endFactoryID"
            [submitted]="submitted">
          </app-dropdown>
        </div>

      </div>


      <div class="grid p-fluid">

        <!-- 發票號碼起 -->
        <div class="col-12 md:col-6 lg:col-4">
               <app-input-text label="發票號碼(判斷前兩碼英文, 後八碼數字, 填滿10位)" controlName="startserialticket" [control]="queryForm.controls.startserialticket"
              [submitted]="submitted"></app-input-text>
        </div>
        
        <!-- 發票號碼迄 -->
        <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="　" controlName="endserialticket" [control]="queryForm.controls.endserialticket"
              [submitted]="submitted"></app-input-text>
        </div>

      </div>


      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="queryForm"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>

    </form>

  </p-accordionTab>
</p-accordion>
</div>
<div class="card">
  <app-table dataKey="VoucherNo"
             [data]="data"
             [columns]="columns"
             [showManage]="false"
             [showCheckBox]="true"
             [totalRecords]="totalRecords"
             [lazy]="true"
             [selectionMode]="null"
             [loading]="loading"
             (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)">
  

  </app-table>
</div>
