<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 申報年月 (必填) -->
          <app-year-month
            class="col-12 md:col-6 lg:col-4"
            label="申報年月"
            [control]="queryForm.controls.onedatemm"
            [submitted]="submitted"
            [evenMonth]="true"
          ></app-year-month>

          <!-- 字軌（兩位英文）-->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="字軌(輸入英文字兩位)"
              controlName="track"
              [control]="queryForm.controls.track"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <!-- 廠商編號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="廠商編號"
              controlName="startFactoryID"
              [options]="factoryIDOptions"
              optionLabel="label"
              optionValue="value"
              [startControl]="queryForm.controls.startFactoryID"
              [endControl]="queryForm.controls.endFactoryID"
              [submitted]="submitted"
            ></app-dropdown-range>
          </div>

          <!-- 發票號碼(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票號碼"
              controlNameStart="startserialticket"
              controlNameEnd="endserialticket"
              [startControl]="queryForm.controls.startserialticket"
              [endControl]="queryForm.controls.endserialticket"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    dataKey="VoucherNo"
    [data]="data"
    [columns]="columns"
    [showManage]="false"
    [showCheckBox]="true"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [selectionMode]="null"
    [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
