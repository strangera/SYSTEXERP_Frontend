<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="版本"
              controlName="BudgetVersion"
              [control]="queryForm.controls.BudgetVersion"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="年"
              controlName="BudgetYear"
              [control]="queryForm.controls.BudgetYear"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="審核狀態"
              controlName="BudgetStatus"
              [options]="budgetStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.BudgetStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [exportContext]="{ conditions: {} }"
    tableKey="FIN41030"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [lazy]="true"
    [showEdit]="false"
    [showCheckBox]="false"
    [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFIN41030Fn"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (dataChange)="data = $event"
    [addButton]="addButton"
  ></app-table-report>
</div>
