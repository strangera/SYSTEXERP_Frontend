<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票種類" controlName=" Subpoenatype" [options]="SubpoenatypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Subpoenatype" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" controlName="year"
              [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票拋轉狀態" controlName=" status" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.status" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票狀態" controlName=" Subpoenastatus" [options]="SubpoenastatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.Subpoenastatus"
              [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票編號" controlName=" Summonscode" [control]="queryForm.controls.Summonscode"
              [submitted]="submitted"></app-input-text>
          </div>


          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票摘要" controlName=" SummonsSummary" [control]="queryForm.controls.SummonsSummary"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="會計科目" controlName=" Subpoenastatus" [options]="accountingaccountOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.accountingaccount"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="vendorCode" [options]="vendorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.vendorCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName=" Summary" [control]="queryForm.controls.Summary"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="對象別編號" controlName="code" [options]="codeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.code" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="對帳KEY值" controlName=" Subpoenacode" [control]="queryForm.controls.Subpoenacode"
              [submitted]="submitted"></app-input-text>
          </div>

        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"></app-table>
  </div>
</div>
