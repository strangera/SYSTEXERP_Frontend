<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 主表單欄位 -->
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="收款單號"
          controlName="RCV_No"
          [control]="dataForm.controls.RCV_No"
          [submitted]="submitted"
          [readonly]="!isFormCreateable"
          [customPlaceholder]="isFormCreateable ? '系統自動產生' : ''"
        />
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="收款日期"
          controlName="RCV_Date"
          [control]="dataForm.controls.RCV_Date"
          [submitted]="submitted"
        />
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="業務員代號"
          controlName="Sales_Id"
          [options]="salesOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.Sales_Id"
          [submitted]="submitted"
          [showClear]="true"
          [filter]="true"
        />
      </div>
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-8"
          label="備註"
          controlName="Remark"
          [control]="dataForm.controls.Remark"
          [submitted]="submitted"
        />
      </div>

      <!-- 應收未收查詢按鈕 -->
      @if (!isFormReadable) {
        <div class="grid p-fluid mb-2">
          <div class="col-12">
            <app-button
              btnType="query"
              label="應收未收查詢"
              icon="pi pi-search"
              (click)="openARDialog()"
            />
          </div>
        </div>
      }

      <!-- 收款項目明細 -->
      <div class="mt-3 mb-2">
        <div class="flex align-items-center justify-content-between mb-2">
          <h4 class="m-0">收款項目明細</h4>
          @if (!isFormReadable) {
            <app-button
              btnType="create"
              label="新增項目"
              icon="pi pi-plus"
              (click)="addItem()"
            />
          }
        </div>

        <ng-container formArrayName="items">
          @if (items.controls.length === 0) {
            <div class="text-center p-3 surface-100 border-round">
              <p class="text-500">尚無收款項目，請點擊「新增項目」按鈕新增</p>
            </div>
          }
          @for (item of items.controls; track $index; let i = $index) {
            <div [formGroupName]="i" class="surface-50 border-round p-3 mb-2">
              <div class="flex align-items-center justify-content-between mb-2">
                <h5 class="m-0">收款項目 {{i + 1}}</h5>
                @if (!isFormReadable && items.controls.length > 1) {
                  <app-button
                    btnType="delete"
                    label="刪除"
                    icon="pi pi-trash"
                    (click)="removeItem(i)"
                  />
                }
              </div>
              <div class="grid p-fluid">
                <app-dropdown
                  class="col-12 md:col-6 lg:col-4"
                  label="收款項目"
                  controlName="CAP_Item"
                  [options]="recvItemOptions"
                  optionLabel="CAP_ItemName"
                  optionValue="CAP_Item"
                  [control]="getFormControl(i, 'CAP_Item')"
                  [submitted]="submitted"
                  [showClear]="true"
                  [filter]="true"
                />
                <app-input-number
                  class="col-12 md:col-6 lg:col-4"
                  label="收款金額"
                  controlName="ARS_Amt"
                  [control]="getFormControl(i, 'ARS_Amt')"
                  [submitted]="submitted"
                  [minFractionDigits]="2"
                  [maxFractionDigits]="2"
                />
                <app-input-text
                  class="col-12 md:col-6 lg:col-4"
                  label="備註"
                  controlName="NoteDesc"
                  [control]="getFormControl(i, 'NoteDesc')"
                  [submitted]="submitted"
                />
              </div>
            </div>
          }
        </ng-container>
      </div>

      <!-- 按鈕區 -->
      <div class="grid justify-content-end gap-2 m-0 mt-3 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (click)="onCancel()" />
        @if (!isFormReadable) {
          <app-button
            btnType="submit"
            label="確認"
            icon="pi pi-check"
            [loading]="loading"
            (click)="onSubmit(dataForm)"
          />
        }
      </div>
    </form>
  </p-panel>
</div>

<!-- 應收未收查詢對話框 -->
<p-dialog
  header="應收未收查詢"
  [(visible)]="showARDialog"
  [modal]="true"
  [style]="{ width: '90vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="arQueryForm">
    <div class="grid p-fluid mb-3">
      <app-input-text
        class="col-12 md:col-3"
        label="組織編號"
        controlName="STO_No"
        [control]="arQueryForm.controls.STO_No"
      />
      <app-input-text
        class="col-12 md:col-3"
        label="廠客代號"
        controlName="VEN_No"
        [control]="arQueryForm.controls.VEN_No"
      />
      <app-calendar
        class="col-12 md:col-2"
        calendarType="dateOne"
        label="立帳日期(起)"
        controlName="DateFrom"
        [control]="arQueryForm.controls.DateFrom"
      />
      <app-calendar
        class="col-12 md:col-2"
        calendarType="dateOne"
        label="立帳日期(迄)"
        controlName="DateTo"
        [control]="arQueryForm.controls.DateTo"
      />
      <div class="col-12 md:col-2 flex align-items-end">
        <app-button
          btnType="query"
          (click)="onQueryAR()"
          [loading]="arDialogLoading"
        ></app-button>
      </div>
    </div>
  </form>

  <app-table
    tableKey="ARQuery"
    dataKey="ARS_ID"
    [data]="arDialogData"
    [columns]="arDialogColumns"
    [showManage]="false"
    [showFilter]="false"
    [showDelete]="false"
    [showCheckBox]="false"
    [showCaption]="false"
    [loading]="arDialogLoading"
    (detail)="onSelectAR($event)"
  ></app-table>

  <ng-template pTemplate="footer">
    <app-button
      btnType="cancel"
      (click)="showARDialog = false"
    ></app-button>
  </ng-template>
</p-dialog>
