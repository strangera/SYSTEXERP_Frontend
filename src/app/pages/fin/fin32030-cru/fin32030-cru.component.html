<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div>
            <app-button btnType="create" label="票據新增下一步" class="col"></app-button>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="收款單號" controlName="receive_ID"
                        [control]="dataForm.controls.receive_ID" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="收款日期" controlName="receive_Date"
                        [control]="dataForm.controls.receive_Date" [submitted]="submitted"></app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="業務員代號" controlName="salesperson_Code" [options]="salesCodeOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.salesperson_Code"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr />
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>收款項目 {{i+1}}</h5>
                        </div>
                        <div>

                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="收款項目" controlName="receiveName" [options]="receiveOptions"
                                optionLabel="label" optionValue="value" [control]="getFormControl(i, 'receiveName')"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="收款金額" controlName="receiveAmount"
                                [control]="getFormControl(i, 'receiveAmount')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="備註" controlName="remark" [control]="getFormControl(i, 'remark')"
                                [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="沖帳代號" controlName="offsetCode"
                                [control]="getFormControl(i, 'offsetCode')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr />
                </ng-container>
            </ng-container>
            <div class="pt-1">

            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
