<div class="card">
  <!-- 頂部操作列與步驟切換按鈕 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 步驟切換按鈕 -->
    <app-button
      label="收款基本資料"
      (click)="switchButton(1)"
      [severity]="buttonID === 1 ? undefined : 'secondary'"
    ></app-button>

    <app-button
      label="票據資訊"
      (click)="switchButton(2)"
      [severity]="buttonID === 2 ? undefined : 'secondary'"
    ></app-button>

    <app-button
      label="應收帳款確認"
      (click)="switchButton(3)"
      [severity]="buttonID === 3 ? undefined : 'secondary'"
    ></app-button>

    <app-button
      btnType="back"
      label="回上一頁"
      (click)="onCancel()"
    ></app-button>
  </div>

  <!-- ============================================ -->
  <!-- 步驟 1: 收款基本資料與收款項目 -->
  <!-- ============================================ -->
  <ng-container *ngIf="buttonID === 1">
    <p-panel header="收款基本資料" class="mb-3">
      <form [formGroup]="step1Form">
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="收款單號"
            controlName="RCV_No"
            [control]="step1Form.controls.RCV_No"
            [readonly]="!isFormCreateable"
            [customPlaceholder]="isFormCreateable ? '系統自動產生' : ''"
          />
          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateOne"
            label="收款日期"
            controlName="RCV_Date"
            [control]="step1Form.controls.RCV_Date"
          />
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="業務員代號"
            controlName="Sales_Id"
            [options]="salesOptions"
            optionLabel="label"
            optionValue="value"
            [control]="step1Form.controls.Sales_Id"
            [showClear]="true"
            [filter]="true"
          />
          <app-input-text
            class="col-12"
            label="備註"
            controlName="Remark"
            [control]="step1Form.controls.Remark"
          />
        </div>
      </form>
    </p-panel>

    <!-- 收款項目明細 -->
    <p-panel header="收款項目明細">
      <app-table-edit
        tableKey="Step1Items"
        title="收款項目"
        [data]="step2TableData"
        [columns]="step2Columns"
        [disabled]="isFormReadable"
        [canInsert]="!isFormReadable"
        [showFooter]="true"
        [tableRequired]="true"
        [showDelete]="!isFormReadable"
        (dataChange)="onStep2DataChange($event)"
      ></app-table-edit>
    </p-panel>

    <!-- 步驟1按鈕 -->
    @if (!isFormReadable) {
      <div class="flex justify-content-end gap-2 pt-3">
        <app-button
          btnType="next"
          label="暫擋修改下一步"
          icon="pi pi-arrow-right"
          iconPos="right"
          (click)="switchButton(2)"
        />
      </div>
    }
  </ng-container>

  <!-- ============================================ -->
  <!-- 步驟 2: 票據資訊設定 -->
  <!-- ============================================ -->
  <ng-container *ngIf="buttonID === 2">
    <p-panel header="票據明細">
      <app-table-edit
        tableKey="Step2Checks"
        title="票據資訊"
        [data]="step3TableData"
        [columns]="step3Columns"
        [disabled]="isFormReadable"
        [canInsert]="!isFormReadable"
        [showFooter]="true"
        [tableRequired]="false"
        [scrollable]="true"
        [showCheckBox]="true"
        [showDelete]="!isFormReadable"
        (dataChange)="onStep3DataChange($event)"
      ></app-table-edit>
    </p-panel>

    <!-- 步驟2按鈕 -->
    @if (!isFormReadable) {
      <div class="flex justify-content-between gap-2 pt-3">
        <app-button
          btnType="back"
          label="回上一頁"
          icon="pi pi-arrow-left"
          (click)="switchButton(1)"
        />
        <app-button
          btnType="next"
          label="暫擋修改下一步"
          icon="pi pi-arrow-right"
          iconPos="right"
          (click)="switchButton(3)"
        />
      </div>
    }
  </ng-container>

  <!-- ============================================ -->
  <!-- 步驟 3: 應收帳款 -->
  <!-- ============================================ -->
  <ng-container *ngIf="buttonID === 3">
    <p-panel header="應收帳款">
      <app-table-edit
        tableKey="Step3AR"
        title="應收帳款"
        [data]="step4TableData"
        [columns]="step4Columns"
        [disabled]="isFormReadable"
        [canInsert]="!isFormReadable"
        [showFooter]="true"
        [tableRequired]="true"
        [showDelete]="!isFormReadable"
        (dataChange)="onStep4DataChange($event)"
      ></app-table-edit>
    </p-panel>

    <!-- 步驟3按鈕 -->
    <div class="flex justify-content-between gap-2 pt-3">
      <app-button
        btnType="back"
        label="回上一頁"
        icon="pi pi-arrow-left"
        (click)="switchButton(2)"
      />
      @if (!isFormReadable) {
        <app-button
          btnType="submit"
          label="確定修改"
          icon="pi pi-check"
          [loading]="loading"
          (click)="onFinalSubmit()"
        />
      }
    </div>
  </ng-container>
</div>
