<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" controlName="accountsummary"
              [startControl]="queryForm.controls.SVOUDATE" [endControl]="queryForm.controls.EVOUDATE"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代碼" controlName="ORG_ID" [options]="ORG_IDOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ORG_ID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="科目代號"
              controlName="dropdownRange"
              [startControl]="queryForm.controls.SACCNO"
              [endControl]="queryForm.controls.EACCNO"
              [submitted]="submitted"
              [options]="AccNo_Options"
              optionLabel="label"
              optionValue="value"
            ></app-dropdown-range>  
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="廠商編號"
              controlName="dropdownRange"
              [startControl]="queryForm.controls.SDetailNo"
              [endControl]="queryForm.controls.EDetailNo"
              [submitted]="submitted"
              [options]="ORG_IDOptions"
              optionLabel="label"
              optionValue="value"
            ></app-dropdown-range>  
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="立沖代號"
              [startControl]="queryForm.controls.SPTA" [endControl]="queryForm.controls.EPTA"
              [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="對象別編號" controlName=" SubDetailNo" [control]="queryForm.controls.SubDetailNo"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票型態" controlName="PostFlag" [options]="VouTypeListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PostFlag" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否為對象別" controlName="ifOptions" [options]="ifOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ifOptions" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table tableKey="TLS2a050" [showManage]="true" [data]="data" [columns]="columns"
      [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [showReportMode]="false"
      [showDelete]="false" [showEdit]="false" (detail)="onDetail($event)">
      <!-- <header>
        <p-button pButton tooltipPosition="top" pTooltip="匯出Excel" [style.width]="'35px'" [style.height]="'35px'"
          class="p-button-rounded p-button-text p-button-info" icon="fa fa-file-lines"
          [disabled]="!canPerformAction('70')" (click)="exportReport()" />
      </header> -->
    </app-table>
  </div>
</div>
