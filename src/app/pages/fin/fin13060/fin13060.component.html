<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 左欄 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="發票格式"
              controlName="PUR_VoucherType"
              [options]="PUR_VoucherTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PUR_VoucherType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="字軌"
              [control]="queryForm.controls.GUI_Track"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票號碼"
              [startControl]="queryForm.controls.PUR_GUINoStart"
              [endControl]="queryForm.controls.PUR_GUINoEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="發票日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.GUI_DateStart"
              [endControl]="queryForm.controls.GUI_DateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-query-year-month
              label="資料所屬年月"
              [control]="queryForm.controls.Rep_YYYYMM"
              [submitted]="submitted"
              [onlyOddMonths]="true"
            ></app-query-year-month>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-query-year-month
              label="申報年月"
              [control]="queryForm.controls.Apply_YYYYMM"
              [submitted]="submitted"
              [onlyOddMonths]="true"
            ></app-query-year-month>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠客代號"
              [control]="queryForm.controls.VendorCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="銷售人統一編號"
              [control]="queryForm.controls.SellerUniCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="買受人統一編號"
              [control]="queryForm.controls.BuyerUniCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="發票格式"
              controlName="PUR_VoucherType"
              [options]="PUR_VoucherTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PUR_VoucherType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票總金額"
              [startControl]="queryForm.controls.AmountStart"
              [endControl]="queryForm.controls.AmountEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="課稅別"
              controlName="PUR_TaxType"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PUR_TaxType"
              [options]="taxTypeOptions"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票未稅金額"
              [startControl]="queryForm.controls.TaxExcludedStart"
              [endControl]="queryForm.controls.TaxExcludedEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="稅額"
              [startControl]="queryForm.controls.TaxStart"
              [endControl]="queryForm.controls.TaxEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="憑證單號"
              [startControl]="queryForm.controls.Source_Doc_NoStart"
              [endControl]="queryForm.controls.Source_Doc_NoEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="傳票編號"
              [startControl]="queryForm.controls.Voucher_NoStart"
              [endControl]="queryForm.controls.Voucher_NoEnd"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="系統別"
              [control]="queryForm.controls.System_ID"
              [options]="System_IDOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資產註記"
              [control]="queryForm.controls.AssetNote"
              [options]="AssetNoteOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="remark"
              [control]="queryForm.controls.remark"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="建檔人員"
              [control]="queryForm.controls.Create_User"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="建檔日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.Create_DateStart"
              [endControl]="queryForm.controls.Create_DateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="修改人員"
              [control]="queryForm.controls.Update_User"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="修改日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.Update_DateStart"
              [endControl]="queryForm.controls.Update_DateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div> -->
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" (click)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="FIN13060"
    [data]="data"
    [columns]="columns"
    dataKey="Rep_YYYYMM"
    [multiSortMeta]="[{ field: 'Rep_YYYYMM', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="true"
    [showDelete]="true"
    [showCheckBox]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
