<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="格式代號" controlName="format_code" [control]="queryForm.controls.format_code"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="格式名稱" controlName="format_name" [control]="queryForm.controls.format_name"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table tableKey="FIN11050" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showDelete]="false" [showCheckBox]="false" dataKey="row_no"
      [multiSortMeta]="[{ field: 'format_code', order: 1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [isRowSelectable]="isRowSelectable" (edit)="onEdit($event)" (detail)="onDetail($event)"></app-table>
  </div>
</div>
