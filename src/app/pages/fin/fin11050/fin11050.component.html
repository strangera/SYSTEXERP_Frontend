<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <!-- 發票格式代號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="發票格式代號" controlName="INV_GUIType"
            [control]="queryForm.controls.INV_GUIType" [submitted]="submitted" placeholder="最長2個字"></app-input-text>
          <!-- 發票格式名稱 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="發票格式名稱" controlName="INV_GUIName"
            [control]="queryForm.controls.INV_GUIName" [submitted]="submitted" placeholder="最長100個字"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="id" tableKey="FIN11050" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showCheckBox]="true" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" (edit)="onEdit($event)" (detail)="onDetail($event)"
      (delete)="onDelete($event)" [isRowSelectable]="isRowSelectable"></app-table-report>
  </div>
</div>
