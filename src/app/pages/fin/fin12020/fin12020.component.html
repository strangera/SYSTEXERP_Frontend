<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range class="col-12 md:col-6 lg:col-8" label="發票年月區間" calendarType="dateMonthRange"
            [startControl]="queryForm.controls.invoice_month_start" [endControl]="queryForm.controls.invoice_month_end"
            [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="發票類別" controlName="invoice_type"
            [options]="invoiceTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.invoice_type" [submitted]="submitted" placeholder="請選擇"></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="prefix"
            [control]="queryForm.controls.prefix" [submitted]="submitted" placeholder="最長2個字串"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="發票號碼" controlName="invoice_no"
            [control]="queryForm.controls.invoice_no" [submitted]="submitted" placeholder="最長8個字串"></app-input-text>
          <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
            [startControl]="queryForm.controls.invoice_no_start" [endControl]="queryForm.controls.invoice_no_end"
            [submitted]="submitted" [errorForGroup]="true"></app-input-text-range>
        </div>
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="cashier_no"
            [options]="cashierNoOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.cashier_no" [submitted]="submitted" placeholder="請選擇"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="發票狀態" controlName="invoice_status"
            [options]="invoiceStatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.invoice_status" [submitted]="submitted" placeholder="請選擇"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="使用別" controlName="usage_type"
            [options]="usageTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.usage_type" [submitted]="submitted" placeholder="請選擇"></app-dropdown>
        </div>
        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="FIN12020" dataKey="invoice_month" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [multiSortMeta]="[{ field: 'invoice_month', order: -1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [showManage]="false">
  </app-table>
</div>
