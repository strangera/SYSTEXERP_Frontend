<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button
      btnType="create"
      [type]="'button'"
      (clickEvent)="onCreate()"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 票據號碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="billNumber"
              [control]="queryForm.controls.billNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="vendorCode"
              [options]="vendorCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 公司銀行科目代號（★必填） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="公司銀行科目代號"
              controlName="bankAccountCode"
              [options]="bankAccountCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankAccountCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 開票日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="開票日期"
              [startControl]="queryForm.controls.issueDateStart"
              [endControl]="queryForm.controls.issueDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 到期日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日"
              [startControl]="queryForm.controls.dueDateStart"
              [endControl]="queryForm.controls.dueDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 兌現日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="兌現日"
              [startControl]="queryForm.controls.cashDateStart"
              [endControl]="queryForm.controls.cashDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 票面金額 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="票面金額"
              [startControl]="queryForm.controls.amountStart"
              [endControl]="queryForm.controls.amountEnd"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>

          <!-- 票據抬頭 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="billTitle"
              [control]="queryForm.controls.billTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 票據禁止背書轉讓 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據禁止背書轉讓"
              controlName="endorsementProhibited"
              [options]="endorsementProhibitedOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.endorsementProhibited"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 備註 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="remarks"
              [control]="queryForm.controls.remarks"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 組織代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="organizationCode"
              [options]="organizationCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.organizationCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 活動代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代號"
              controlName="eventCode"
              [options]="eventCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.eventCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 票據狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據狀態"
              controlName="billStatus"
              [options]="billStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.billStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 狀態（確認/拋轉） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 領取狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="領取狀態"
              controlName="collectionStatus"
              [options]="collectionStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.collectionStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 領取日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="領取日期"
              [startControl]="queryForm.controls.collectionDateStart"
              [endControl]="queryForm.controls.collectionDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 應付票據開票單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="應付票據開票單號"
              controlName="paymentBillNumber"
              [control]="queryForm.controls.paymentBillNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 應付票據會計科目 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="應付票據會計科目"
              controlName="paymentAccount"
              [control]="queryForm.controls.paymentAccount"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 傳票號碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              controlName="voucherNumber"
              [control]="queryForm.controls.voucherNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 對象別編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="對象別編號"
              controlName="targetCode"
              [options]="targetCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.targetCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 對帳KEY值 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="對帳KEY值"
              controlName="reconciliationKey"
              [control]="queryForm.controls.reconciliationKey"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <!-- 按鈕列（比照 CPM11030） -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button
            btnType="query"
            [loading]="loading"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 列表 -->
<div class="card">
  <app-table-report
    [tableKey]="'fin63020_' + tableVer"
    [dataKey]="'RowNo'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="false"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryFIN63020ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showDetail]="true"
    (detail)="onDetail($event)"
  ></app-table-report>
</div>
