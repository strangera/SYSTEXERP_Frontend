<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 第1列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="billNumber"
              [control]="queryForm.controls.billNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="vendorCode"
              [options]="VendorNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="公司銀行科目代號"
              controlName="bankAccountCode"
              [options]="BankCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankAccountCode"
              [submitted]="submitted"
            ></app-dropdown>


          </div>

          <!-- 第2列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="開票日(起迄)"
              [startControl]="queryForm.controls.issueDateStart"
              [endControl]="queryForm.controls.issueDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日(起迄)"
              [startControl]="queryForm.controls.dueDateStart"
              [endControl]="queryForm.controls.dueDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="兌現日(起迄)"
              [startControl]="queryForm.controls.cashDateStart"
              [endControl]="queryForm.controls.cashDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 第3列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="票面金額"
              [startControl]="queryForm.controls.amountStart"
              [endControl]="queryForm.controls.amountEnd"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="billTitle"
              [control]="queryForm.controls.billTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據禁止背書轉讓"
              controlName="endorsementProhibited"
              [options]="endorsementProhibitedOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.endorsementProhibited"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第4列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="remarks"
              [control]="queryForm.controls.remarks"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="organizationCode"
              [options]="organizationCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.organizationCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代號"
              controlName="eventCode"
              [options]="eventCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.eventCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第5列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據狀態"
              controlName="billStatus"
              [options]="billStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.billStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="領取狀態"
              controlName="pickupType"
              [options]="pickupTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.pickupType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第6列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="領取日期(起迄)"
              [startControl]="queryForm.controls.pickupDateStart"
              [endControl]="queryForm.controls.pickupDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="應付票據開票單號"
              controlName="pamNo"
              [control]="queryForm.controls.pamNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="應付票據會計科目"
              controlName="apCheckAccNo"
              [control]="queryForm.controls.apCheckAccNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 第7列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              controlName="voucherNumber"
              [control]="queryForm.controls.voucherNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="對象別編號"
              controlName="partyTypeNo"
              [options]="targetCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.partyTypeNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="對帳KEY值"
              controlName="reconKey"
              [control]="queryForm.controls.reconKey"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            [type]="'button'"
            label="支票領取"
            (clickEvent)="onPickup()"
          ></app-button>

          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- ✅ 列表：改用 app-table 才有內建 checkbox + isRowSelectable -->
<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN63020_TABLE'"
    [dataKey]="'CheckNo'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="true"
    [selectionMode]="'multiple'"
    [(selectedItems)]="selectedItems"
    [isRowSelectable]="isRowSelectable"
    [showManage]="true"
    [showDetail]="true"
    [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="true"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [lazy]="true"
   
  >

   <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div></div>

        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="匯出應付票據維護報表.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="匯出應付票據維護報表.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table>
</div>

<!-- ✅ 支票領取 Dialog -->
<p-dialog
  header="支票領取"
  [(visible)]="pickupDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
>
  <form [formGroup]="pickupForm" class="p-fluid">
    <div class="grid">
      <div class="col-12">
        <app-input-text
          label="領取人姓名"
          controlName="PickName"
          [control]="pickupForm.controls.PickName"
          [submitted]="submitted"
        ></app-input-text>
      </div>

      <div class="col-12">
        <app-calendar
          calendarType="dateOne"
          label="領取日期"
          controlName="PickupDate"
          [control]="pickupForm.controls.PickupDate"
          [submitted]="submitted"
        ></app-calendar>
      </div>

      <div class="col-12 text-600">
        ※ ChkNoList 會自動取用目前勾選的票據號碼（領取狀態=未領才會送出）
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="取消"
        severity="secondary"
        (onClick)="onPickupCancel()"
      ></p-button>

      <p-button
        label="確認領取"
        [loading]="btnLoading"
        (onClick)="onPickupConfirm()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
