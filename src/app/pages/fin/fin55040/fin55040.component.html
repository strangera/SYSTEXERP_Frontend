<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" controlName="accountsummary"
              [startControl]="queryForm.controls.VouDate_Start" [endControl]="queryForm.controls.VouDate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門代碼" controlName="ORG_ID" [options]="ORG_IDOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ORG_ID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="科目代號" controlName="dropdownRange" [startControl]="queryForm.controls.AccNo_Start"
              [endControl]="queryForm.controls.AccNo_End" [submitted]="submitted" [options]="AccNo_Options"
              optionLabel="label" optionValue="value"></app-dropdown-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="廠商編號" [startControl]="queryForm.controls.DetailNo_Start"
              [endControl]="queryForm.controls.DetailNo_End" [submitted]="submitted"></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="立沖代號" [startControl]="queryForm.controls.PTA_Start"
              [endControl]="queryForm.controls.PTA_End" [submitted]="submitted"></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="對象別編號" controlName=" SubDetailNo" [control]="queryForm.controls.SubDetailNo"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票型態" controlName="PostFlag" [options]="PostFlagOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PostFlag" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否為對象別" controlName="IsSubDetail" [options]="ifOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.IsSubDetail" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <ng-template #accGroupHeader let-row>
      <div style="display: flex; justify-content: space-between; width: 100%">
        <span class="font-bold">科目：{{ row.AccNo }} - {{ row.AccCName }}</span>
        <div class="flex items-center gap-6">
          <span>科目立帳合計：{{ formatAmount(getAccSubtotal(row.AccNo, 'PTA1')) }}</span>
          <span>科目沖銷合計：{{ formatAmount(getAccSubtotal(row.AccNo, 'PTA2')) }}</span>
          <span>科目餘額：{{ formatAmount(getAccSubtotal(row.AccNo, 'PTA3')) }}</span>
        </div>
      </div>
    </ng-template>

    <app-fin29060-table-subheader [data]="data" [columns]="columns" [totalRecords]="totalRecords"
      [lastQueryBody]="lastQueryBody" [queryFunction]="fin55040Service.queryFIN55040.bind(fin55040Service)"
      [lazyBatchSize]="lazyBatchSize" [showManage]="false" (dataChange)="data = $event" (detail)="onDetail($event)"
      [groupRowsBy]="'AccNo'" [fullData]="fullData" [totalData]="totalData" [groupRowsByName]="'科目代號'"
      [showSubTotal]="true" [showTotal]="true" (detailWithColValue)="onDetailWithColValue($event)"
      [groupHeaderTemplate]="accGroupHeader">
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button styleClass="p-2" label="立沖科目明細表.PDF" icon="pi pi-file" (click)="printPDF(true)"
            [disabled]="data.length === 0" [loading]="btn_pdf_Loading"></p-button>
          <p-button styleClass="p-2" label="立沖科目明細表.XLSX" icon="pi pi-file" (click)="printPDF(false)"
            [disabled]="data.length === 0" [loading]="btn_excel_Loading"></p-button>
        </div>
      </header>
    </app-fin29060-table-subheader>
  </div>
</div>
