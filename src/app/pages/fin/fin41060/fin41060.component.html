<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門代號"
              controlName="Org_ID"
              [options]="orgIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Org_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="版本"
              controlName="Budget_Version"
              [control]="queryForm.controls.Budget_Version"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="年"
              controlName="Budget_Year"
              [control]="queryForm.controls.Budget_Year"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="審核狀態"
              controlName="Audit_Status"
              [options]="auditStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Audit_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [exportContext]="{ conditions: {} }"
    tableKey="FIN41060"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [lazy]="true"
    [showManage]="true"
    [showCheckBox]="false"
    [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFIN41060Fn"
    [addButton]="addButton"
    [buttonsLoading]="btnLoading"
    [ItemSize]="30"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (dataChange)="data = $event"
  ></app-table-report>
</div>
