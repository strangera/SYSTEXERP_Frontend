<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" controlName="accountsummary"
              [startControl]="queryForm.controls.VouDateFrom" [endControl]="queryForm.controls.VouDateTo"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="傳票編號" [startControl]="queryForm.controls.VouNoFrom"
              [endControl]="queryForm.controls.VouNoTo" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票型態" controlName="VoucherType" [options]="Subpoenastatus" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.VoucherType" [submitted]="submitted"></app-dropdown>
          </div>

        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" [showDelete]="false" (detail)="onDetail($event)"
    dataKey="id" [multiSortMeta]="[{ field: 'VouNo', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showExcel]="false"
    >
    <header>
      <div class="flex align-items-center mb-5">
        <p-button label="過帳" severity="success" (click)="onReview(selectedItems)" [disabled]="selectedCount === 0"
          [ngStyle]="{
            height: '16px',
            fontSize: '16px',
            padding: '0 2px',
            marginRight: '7px',
          }"></p-button>
      </div>
    </header>
  </app-table>
</div>
