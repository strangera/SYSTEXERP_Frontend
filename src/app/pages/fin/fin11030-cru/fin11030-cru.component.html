<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i"> -->
      <!-- <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
          <h5>銷項品項 {{i+1}}</h5>
        </div>
        <div>
          <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
            class="col"></app-button-dynamicallydelete>
        </div>
      </div> -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <!-- <app-input-text label="品項編號" controlName="itemSerialnumber"
          [control]="getFormControl(i, 'itemSerialnumber')" [submitted]="submitted">
          </app-input-text> -->
          <app-input-text label="品項編號" controlName="itemSerialnumber" [control]="dataForm.controls.col1"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="品項名稱" controlName="itemName" [control]="dataForm.controls.col2"
            [submitted]="submitted">
          </app-input-text>
          <!-- <app-input-text label="品項名稱" controlName="itemName" [control]="getFormControl(i, 'itemName')"
            [submitted]="submitted">
          </app-input-text> -->
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <!-- <app-dropdown label="使用別" controlName="usageType" [options]="usageTypeOptions" optionLabel="label"
            optionValue="value" [control]="getFormControl(i, 'usageType')" [submitted]="submitted">
          </app-dropdown> -->
          <app-dropdown label="使用別" controlName="usageType" [options]="usageTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.col3" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <!-- </ng-container>
      </ng-container> -->
      <!-- <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div> -->
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
