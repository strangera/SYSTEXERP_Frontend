<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <!-- 收銀機號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號" controlName="ECR_No" [options]="ECR_No_Options" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 參數代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="參數代號" controlName="ARG_No" [options]="ARG_No_Options" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.ARG_No" [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 參數說明 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="參數說明" controlName="ARG_Desc" [control]="queryForm.controls.ARG_Desc"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="ID" tableKey="FIN11210" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showCheckBox]="true" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" (edit)="onEdit($event)" (detail)="onDetail($event)"
      (delete)="onDelete($event)" [isRowSelectable]="isRowSelectable">
      <header>
        <p-button [ngStyle]="{ width: '35px', height: '35px' }" [style]="{ width: '35px', height: '35px' }"
          pTooltip="下傳" tooltipPosition="top" icon="pi pi-upload rotate-180" severity="success"
          class="p-button-rounded p-button-text" [disabled]="selectedItems.length === 0" (click)="onUpload()"
          [loading]="btnLoading" />
      </header>
    </app-table-report>
  </div>
</div>
