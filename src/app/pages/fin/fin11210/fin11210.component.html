<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="cashierNo"
            [control]="queryForm.controls.cashierNo" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="參數代號" controlName="code"
            [control]="queryForm.controls.code" [submitted]="submitted" [options]="codeOptions"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="參數說明" controlName="description"
            [control]="queryForm.controls.description" [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="FIN11210" dataKey="code" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [multiSortMeta]="[{ field: 'code', order: -1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [isRowSelectable]="isRowSelectable" [showDelete]="false" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event">
  </app-table>
</div>
