<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo" [submitted]="submitted"></app-calendar-range>
          </div>

          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="部門" controlName="OrgIdList" [options]="OrgIdListOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.OrgIdList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <!-- 科目代號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="科目代號" controlName="AccNoList" [options]="AccNoListOptions | async"
              optionLabel="label" optionValue="value" [startControl]="queryForm.controls.AccNoFrom"
              [endControl]="queryForm.controls.AccNoTo" [submitted]="submitted"></app-dropdown-range>
          </div>

          <!-- 廠商編號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="廠商編號" controlName="VendorNoList" [options]="VendorNoListOptions | async"
              optionLabel="label" optionValue="value" [startControl]="queryForm.controls.VendorFrom"
              [endControl]="queryForm.controls.VendorTo" [submitted]="submitted"></app-dropdown-range>
          </div>

          <!-- 立沖代號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="立沖代號(起訖)" controlNameStart="PTAFrom" controlNameEnd="PTATo"
              [startControl]="queryForm.controls.PTAFrom" [endControl]="queryForm.controls.PTATo"
              [submitted]="submitted"></app-input-text-range>
          </div>

          <!-- 對象別編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="對象別編號" controlName="TargetNoList" [options]="TargetNoListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Target" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 摘要 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="Notes" [control]="queryForm.controls.Notes"
              [submitted]="submitted"></app-input-text>
          </div>

          <!-- 傳票型態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票型態" controlName="VouTypeList" [options]="VouTypeListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VoucherType" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 傳票狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票狀態" controlName="VouStatusList" [options]="VouStatusListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.VouStatusList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <!-- 對帳key -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="對帳key" controlName="ACCT_KEY" [control]="queryForm.controls.ACCT_KEY"
              [submitted]="submitted"></app-input-text>
          </div>

          <!-- 是否為對象別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否為對象別" groupname="g1" [control]="queryForm.controls.IsTarget" [options]="[
                { label: '全部', value: null },
                { label: '是', value: 'Y' },
                { label: '否', value: 'N' },
              ]" [submitted]="submitted"></app-radiobutton>
          </div>

          <!-- 報表方式 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="報表方式" groupname="g2" [control]="queryForm.controls.ReportMode" [options]="[
                { label: '只含交易科目', value: '1' },
                { label: '含無交易科目', value: '2' },
              ]" [submitted]="submitted"></app-radiobutton>
          </div>
          <!-- 金額區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="金額"
              controlNameStart="AmtFrom"
              controlNameEnd="AmtTo"
              [startControl]="queryForm.controls.AmtFrom"
              [endControl]="queryForm.controls.AmtTo"
              [submitted]="submitted">
            </app-input-text-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <ng-template #accGroupHeader let-row>
    <span>會計科目：{{ row.AccCName }}</span>
  </ng-template>
  <app-table-subheader [data]="data" [totalRecords]="totalRecords" [loading]="loading"
    [groupHeaderTemplate]="accGroupHeader" (detail)="onDetail($event)">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF()"
          [loading]="PDFBtnLoading" [disabled]="loading || (data.length || 0) === 0"></p-button>

        <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportXLSX()"
          [loading]="XLSXBtnLoading" [disabled]="loading || (data.length || 0) === 0"></p-button>
      </div>
    </header>
  </app-table-subheader>
</div>
