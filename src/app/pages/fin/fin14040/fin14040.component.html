<div *ngIf="pageReady">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
    >
      <form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid gap-2">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- 申報年月 -->
            <app-year-month
              label="申報年月"
              [control]="queryForm.controls.INV_DeclareYM"
              [evenMonth]="true"
              [submitted]="submitted"
            ></app-year-month>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="稅籍編號"
              controlName="Tax_No"
              [options]="REP_TaxNo_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.Tax_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button
            btnType="query"
            [loading]="loading"
            label="{{ '下載媒體申報檔' | translate }}"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>

  <div class="card">
    <!-- PDF 預覽區 -->
    <div *ngIf="pdfUrl" style="height: 90vh">
      <iframe
        [src]="pdfUrl"
        width="100%"
        height="100%"
        style="border: none"
      ></iframe>
    </div>
  </div>
</ng-container>
