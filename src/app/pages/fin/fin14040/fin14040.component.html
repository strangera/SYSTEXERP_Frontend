<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="退出/折讓單號"
                            [startControl]="queryForm.controls.startReturnTicket"
                            [endControl]="queryForm.controls.endReturnTicket" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="字軌" controlName="wordTrack" [control]="queryForm.controls.wordTrack"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="發票號碼"
                            [startControl]="queryForm.controls.startInvoiceTicket"
                            [endControl]="queryForm.controls.endInvoiceTicket" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="退出/折讓日期"
                            [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate"
                            [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="發票格式" controlName="invoiceFormat" [options]="invoiceFormatOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.invoiceFormat"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar calendarType="dateMonthOne" label="申報年月" [control]="queryForm.controls.onedatemm"
                            [submitted]="submitted">
                        </app-calendar>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="憑證單號"
                            [startControl]="queryForm.controls.startVoucherTicket"
                            [endControl]="queryForm.controls.startVoucherTicket" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="傳票編號"
                            [startControl]="queryForm.controls.startSummonsTicket"
                            [endControl]="queryForm.controls.startSummonsTicket" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
