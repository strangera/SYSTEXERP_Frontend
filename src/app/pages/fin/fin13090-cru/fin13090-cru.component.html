<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="傳票編號"
          [control]="dataForm.controls.VouNo"
          [submitted]="submitted"
          [disabled]="crudstatus !== 'Create'"
        />
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="進項稅額-借方"
          [control]="dataForm.controls.TaxTotal"
          [submitted]="submitted"
          [disabled]="true"
        />
      </div>
      <div class="grid p-fluid">
        <app-table-edit
          title="發票資料"
          class="col-12"
          [columns]="detailColumn"
          [data]="detailData"
          (dataChange)="onDetailChange($event)"
          [loading]="detailloading"
          [defaultInsertData]="defaultdetail"
          [disabled]="isFormReadable"
          [isRowSelectable]="rowSelectableFn"
          [scrollable]="true"
        >
        </app-table-edit>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="clearSubForm()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<p-dialog
  [(visible)]="infoDialogVisible"
  header="提示"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '360px' }"
>
  <p class="m-0 line-height-3">請輸入發票號碼或憑證單號</p>
  <ng-template pTemplate="footer">
    <p-button label="確定" (click)="infoDialogVisible = false" />
  </ng-template>
</p-dialog>
