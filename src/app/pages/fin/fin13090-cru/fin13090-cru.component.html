<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="傳票編號"
          [control]="dataForm.controls.VouNo"
          [submitted]="submitted"
          [disabled]="crudstatus !== 'Create'"
        />
        <app-input-number
          class="col-12 md:col-6 lg:col-4"
          label="進項稅額貸方"
          [control]="dataForm.controls.TaxTotal"
          [submitted]="submitted"
          [disabled]="true"
        />
      </div>
      <div class="grid p-fluid">
        <app-table-edit
          title="發票資料"
          class="col-12"
          [columns]="detailColumn"
          [data]="detailData"
          (dataChange)="onDetailChange($event)"
          [loading]="detailloading"
          [defaultInsertData]="defaultdetail"
          [disabled]="isFormReadable"
          [isRowSelectable]="rowSelectableFn"
          [scrollable]="true"
        >
          <ng-template #customCell let-rowData="rowData" let-col="col" let-index="index">
            <input
              class="p-inputtext p-component"
              [value]="rowData[col.field] ?? ''"
              (input)="rowData[col.field] = $any($event.target).value"
              [disabled]="!!col.disabled?.(rowData[col.field], index, rowData)"
              (dblclick)="openVendorDialog(rowData, !!col.disabled?.(rowData[col.field], index, rowData))"
              style="width:100%"
            />
          </ng-template>
        </app-table-edit>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="clearSubForm()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<p-dialog
  [(visible)]="infoDialogVisible"
  header="提示"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '360px' }"
>
  <p class="m-0 line-height-3">請輸入發票號碼或憑證單號</p>
  <ng-template pTemplate="footer">
    <p-button label="確定" (click)="infoDialogVisible = false" />
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="vendorDialogVisible"
  header="廠商查詢"
  [modal]="true"
  [draggable]="true"
  [style]="{ width: '680px' }"
>
  <div class="p-inputgroup mb-3" style="display:flex">
    <input
      class="p-inputtext p-component"
      placeholder="輸入廠商編號或名稱"
      [(ngModel)]="vendorKeyword"
      (input)="filterVendors()"
      style="flex:1"
    />
    <p-button icon="pi pi-search" (click)="filterVendors()" />
  </div>
  <p-table
    [value]="vendorFiltered"
    [scrollable]="true"
    scrollHeight="380px"
    styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>廠商編號</th>
        <th>廠商名稱</th>
        <th>統一編號</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-v>
      <tr style="cursor:pointer" (click)="selectVendor(v)">
        <td>{{ v.VEN_No }}</td>
        <td>{{ v.Name }}</td>
        <td>{{ v.No }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3" class="text-center p-3">查無資料</td></tr>
    </ng-template>
  </p-table>
</p-dialog>
