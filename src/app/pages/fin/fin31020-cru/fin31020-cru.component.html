<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調整科目代號" controlName="CAR_AccNo" [options]="AccNoOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.CAR_AccNo" [submitted]="submitted"
            [disabled]="dataForm.controls.CAR_AccNo.disabled" />
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="加減項" controlName="CAR_Type" [options]="minusOption" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.CAR_Type" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="Remark" [control]="dataForm.controls.Remark" [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
