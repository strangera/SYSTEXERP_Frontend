<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
  </div>

  @if (hasData()) {
  <p-panel header="編輯零用金會計科目">
    <form [formGroup]="editForm"
          (ngSubmit)="onSave()">
      <div class="grid p-fluid">

        <app-dropdown
          class="col-12 md:col-6 lg:col-3"
          label="應付費用會計科目"
          controlName="APEXP_LID"
          [control]="ef().APEXP_LID"
          [options]="gls1005Options()"
          optionLabel="DisplayName"
          optionValue="No"
          [submitted]="submitted"
        ></app-dropdown>

        <app-dropdown
          class="col-12 md:col-6 lg:col-3"
          label="應付費用會計科目(共同)"
          controlName="APEXP_LID_COMMON"
          [control]="ef().APEXP_LID_COMMON"
          [options]="gls1005Options()"
          optionLabel="DisplayName"
          optionValue="No"
          [submitted]="submitted"
        ></app-dropdown>

        <app-dropdown
          class="col-12 md:col-6 lg:col-3"
          label="進項稅額會計科目"
          controlName="PTAX_LID"
          [control]="ef().PTAX_LID"
          [options]="gls1005Options()"
          optionLabel="DisplayName"
          optionValue="No"
          [submitted]="submitted"
        ></app-dropdown>

        <app-dropdown
          class="col-12 md:col-6 lg:col-3"
          label="進項稅額會計科目(共同)"
          controlName="PTAX_LID_COMMON"
          [control]="ef().PTAX_LID_COMMON"
          [options]="gls1005Options()"
          optionLabel="DisplayName"
          optionValue="No"
          [submitted]="submitted"
        ></app-dropdown>

      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    (click)="loadData()"></app-button>
        <app-button btnType="submit"
                    [loading]="savingLoading()"></app-button>
      </div>
    </form>
  </p-panel>
  }
</div>
