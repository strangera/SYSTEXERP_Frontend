<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="支出請款單號" controlName="PCS_RqstNo" [options]="pcsRqstNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PCS_RqstNo" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="產生日期" startControlName="PCS_RqstDate_S" endControlName="PCS_RqstDate_E"
              [startControl]="queryForm.controls.PCS_RqstDate_S" [endControl]="queryForm.controls.PCS_RqstDate_E"
              [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="狀態" controlName="PCS_Status" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PCS_Status" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4 flex align-items-end">
            <p-checkbox inputId="printSignOff" [binary]="true" [formControl]="queryForm.controls.printSignOff"
              label="列印簽核欄"></p-checkbox>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    apiUrl="queryFIN73030"
    [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [lazy]="false"
    [data]="data"
    (dataChange)="data = $event" dataKey="rowKey" tableKey="FIN73030" [columns]="columns"
    [expansionColumns]="expansionColumns" expansionDataKey="expansionLines" [totalRecords]="totalRecords"
    [loading]="loading" [showManage]="false">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" (onClick)="onExportPdf()"
          [disabled]="exportDisabled()" [loading]="exportPdfLoading"></p-button>
        <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file-excel" (onClick)="onExportExcel()"
          [disabled]="exportDisabled()" [loading]="exportExcelLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
