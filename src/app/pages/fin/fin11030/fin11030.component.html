<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="品項編號" controlName="itemSerialnumber"
            [control]="queryForm.controls.itemSerialnumber" [submitted]="submitted">
          </app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="品項名稱" controlName="itemName"
            [control]="queryForm.controls.itemName" [submitted]="submitted">
          </app-input-text>
        </div>
        <!-- <div *appHasPermission="queryPermission" class="col"> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="fin11030" [data]="data" dataKey="col1" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true">
  </app-table>
</div>
