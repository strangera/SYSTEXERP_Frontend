<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 發票年月起迄 -->
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(起)"
            [control]="queryForm.controls.SAL_GUIYYYYMM_start" [submitted]="submitted"></app-year-month>
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(迄)"
            [control]="queryForm.controls.SAL_GUIYYYYMM_end" [submitted]="submitted"></app-year-month>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="track"
            [control]="queryForm.controls.SAL_GUITrack" [submitted]="submitted" />
          <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
            [startControl]="queryForm.controls.SAL_GUINo_start" [endControl]="queryForm.controls.SAL_GUINo_end"
            [submitted]="submitted" [errorForGroup]="true" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="發票類別" controlName="GUI_Type" optionLabel="label"
            optionValue="value" [control]="queryForm.controls.SAL_GUIPaper" [options]="SAL_GUIPaperOptions" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)" [showCheckBox]="true"
    (delete)="onDelete($event)" [showDetail]="false" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [editDisabled]="editDisabled" [multiSortMeta]="[{ field: 'id', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading">
  </app-table>
</div>
