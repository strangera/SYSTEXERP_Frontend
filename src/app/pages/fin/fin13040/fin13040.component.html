<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="發票類型" controlName="InvoiceType" [options]="InvoiceType_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.InvoiceType" [submitted]="submitted">
            </app-multi-select>
          </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="使用別" controlName="SAL_Type" [options]="SAL_Type_Options" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.SAL_Type" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="字軌" [control]="queryForm.controls.GUI_Track"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range startControlName="InvoiceNo_S" endControlName="InvoiceNo_E" startLabel="發票號碼起"
              endLabel="發票號碼訖" [startControl]="queryForm.controls.InvoiceNo_S"
              [endControl]="queryForm.controls.InvoiceNo_E" [submitted]="submitted"
              [errorForGroup]="true"></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="發票年月" calendarType="dateMonthOne" [control]="queryForm.controls.InvoiceDateYM"
              [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="發票日期" calendarType="dateRange" [startControl]="queryForm.controls.InvoiceDate_S"
              [endControl]="queryForm.controls.InvoiceDate_E" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar controlName="INV_Data_YM_S" calendarType="dateMonthOne" label="資料所屬年月"
              [control]="queryForm.controls.INV_Data_YM_S" [submitted]="submitted">
            </app-calendar>
          </div>

          <!-- 申報年月 -->
          <app-year-month class="col-12 md:col-6 lg:col-4" label="申報年月" [control]="queryForm.controls.INV_DeclareYM"
            [submitted]="submitted" [evenMonth]="true" (valueChanges)="loadGuiTrackOptions($event)"></app-year-month>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="買受人統一編號" controlName="Buyer_Uniform" [control]="queryForm.controls.Buyer_Uniform"
              [options]="Buyer_Uniform_Options" optionLabel="label" optionValue="value"
              [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="課稅別" controlName="PUR_TaxType" [options]="taxTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PUR_TaxType" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="銷售金額" [allowUnlimited]="true" [useGrouping]="true"
              [startControl]="queryForm.controls.PUR_Amt_S" [endControl]="queryForm.controls.PUR_Amt_E">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="稅額" [allowUnlimited]="true" [useGrouping]="true"
              [startControl]="queryForm.controls.PUR_Tax_S" [endControl]="queryForm.controls.PUR_Tax_E">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="傳票號碼 " [startControl]="queryForm.controls.Voucher_No_S"
              [endControl]="queryForm.controls.Voucher_No_E"></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="資產註記" [control]="queryForm.controls.AssetType" [options]="AssetNoteOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="FIN13040" [data]="data" [columns]="columns" dataKey="ID" [showDelete]="false"
    [showReportMode]="false" [totalRecords]="totalRecords" [lazy]="true" [loading]="loading" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showManage]="true" [showCheckBox]="false" [footerData]="footerData"
    [addButton]="addButton" [queryFunction]="queryFn" [lastQueryBody]="lastQueryBody" [editDisabled]="editDisabled">
  </app-table-report>
</div>
