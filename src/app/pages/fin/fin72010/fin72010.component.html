<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="零用金單號" controlName="PCS_No" [options]="PCS_No_Options()" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PCS_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="申請日期" [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="零用金額" [startControl]="queryForm.controls.AmtFrom"
              [endControl]="queryForm.controls.AmtTo" [submitted]="submitted"></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金申請人</label>
            <p-inputGroup>
              <input type="text" pInputText formControlName="PCS_UsrDisplay" placeholder="請選擇"
                class="user-display-input" readonly />
              <button *ngIf="queryForm.get('PCS_UsrDisplay')?.value" type="button" aria-label="清除" pButton
                icon="pi pi-times" class="clear-user-button" (click)="clearUser('PCS')"></button>
              <button type="button" aria-label="搜尋" pButton icon="pi pi-angle-down"
                (click)="openUserDialog('PCS_UsrNo')"></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金保管人</label>
            <p-inputGroup>
              <input type="text" pInputText formControlName="Keep_UsrDisplay" placeholder="請選擇"
                class="user-display-input" readonly />
              <button *ngIf="queryForm.get('Keep_UsrDisplay')?.value" type="button" aria-label="清除" pButton
                icon="pi pi-times" class="clear-user-button" (click)="clearUser('Keep')"></button>
              <button type="button" aria-label="搜尋" pButton icon="pi pi-angle-down"
                (click)="openUserDialog('Keep_UsrNo')"></button>
            </p-inputGroup>
          </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="保管單位" controlName="Keep_OrgID" [options]="keepingUnit_Options()" optionLabel="label"
                optionValue="value" [control]="queryForm.controls.Keep_OrgID" [submitted]="submitted"></app-dropdown>
            </div>
        </div>
        <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="狀態" controlName="PCS_Status" [options]="status_Options" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.PCS_Status" [submitted]="submitted"></app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table-report tableKey="FIN72010" [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)" [showDelete]="false"  [showEdit]="false"  [showDetail]="false" [showCheckBox]="false" dataKey="id"
      [totalRecords]="totalRecords()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="fin72010Service.queryFIN72010.bind(fin72010Service)" [lazy]="true" [loading]="loading"
      [isRowSelectable]="isRowSelectable" [addButton]="addButton"></app-table-report>
  </div>
</div>

<p-dialog header="使用者代碼" [(visible)]="userDialogVisible" [modal]="true" [style]="{ width: '70vw' }" [draggable]="false"
  [resizable]="false">
  <form [formGroup]="userQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="user_No" class="block mb-2">使用者代碼</label>
        <input id="user_No" pInputText formControlName="user_No" />
      </div>

      <div class="col-12 md:col-6">
        <label for="user_Name" class="block mb-2">使用者名稱</label>
        <input id="user_Name" pInputText formControlName="user_Name" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input id="Org_ID" pInputText formControlName="Org_ID" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input id="Org_Name" pInputText formControlName="Org_Name" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button type="button" label="查詢" icon="pi pi-search" (click)="queryUserData()"></p-button>

      <p-button type="button" label="清除" icon="pi pi-times" (click)="clearUserQuery()"></p-button>
    </div>
  </form>

  <p-table [value]="userResultData()" [scrollable]="true" scrollHeight="350px" [tableStyle]="{ 'min-width': '50rem' }"
    selectionMode="single" [(selection)]="selectedUser" (onRowSelect)="onSelectUser($event.data)">
    <ng-template pTemplate="header">
      <tr>
        <th>使用者代碼</th>
        <th>使用者名稱</th>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.user_No }}</td>
        <td>{{ row.user_Name }}</td>
        <td>{{ row.Org_ID }}</td>
        <td>{{ row.Org_Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
