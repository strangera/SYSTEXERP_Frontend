<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金單號"
              controlName="KeepQuota_No"
              [options]="KeepQuota_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.KeepQuota_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="申請日期"
              [startControl]="queryForm.controls.applyDateFrom"
              [endControl]="queryForm.controls.applyDateTo"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="零用金額"
              [startControl]="queryForm.controls.startKeepQuota"
              [endControl]="queryForm.controls.endKeepQuota"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金申請人</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                formControlName="PettycashapplicantName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('Pettycashapplicant')"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金保管人</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                formControlName="PettycashcustodianName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('Pettycashcustodian')"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="status"
              [options]="status_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <label for="keepingUnit" class="block">保管單位</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                controlName="keepingUnit"
                formControlName="keepingUnitName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openKeepDeptDialog()"
              ></button>
            </p-inputGroup>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN72010"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'HOS_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
      [isRowSelectable]="isRowSelectable"
    ></app-table>
  </div>
</div>

<p-dialog
  header="使用者代碼"
  [(visible)]="userDialogVisible"
  [modal]="true"
  [style]="{ width: '70vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="userQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="user_No" class="block mb-2">使用者代碼</label>
        <input id="user_No" pInputText formControlName="user_No" />
      </div>

      <div class="col-12 md:col-6">
        <label for="user_Name" class="block mb-2">使用者名稱</label>
        <input id="user_Name" pInputText formControlName="user_Name" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input id="Org_ID" pInputText formControlName="Org_ID" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input id="Org_Name" pInputText formControlName="Org_Name" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button
        type="button"
        label="查詢"
        icon="pi pi-search"
        (click)="queryUsers()"
      ></p-button>

      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        (click)="clearUserQuery()"
      ></p-button>
    </div>
  </form>

  <p-table
    [value]="userResultData"
    [scrollable]="true"
    scrollHeight="350px"
    [tableStyle]="{ 'min-width': '50rem' }"
    selectionMode="single"
    [(selection)]="selectedUser"
    (onRowSelect)="onSelectUser($event.data)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>使用者代碼</th>
        <th>使用者名稱</th>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.user_No }}</td>
        <td>{{ row.user_Name }}</td>
        <td>{{ row.Org_ID }}</td>
        <td>{{ row.Org_Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>

<p-dialog
  header="組織代碼"
  [(visible)]="keepDeptDialogVisible"
  [modal]="true"
  [style]="{ width: '60vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="keepDeptQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input pInputText formControlName="Org_ID" placeholder="組織代碼" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input pInputText formControlName="Org_Name" placeholder="組織名稱" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button
        type="button"
        label="查詢"
        icon="pi pi-search"
        (click)="queryKeepDept()"
      ></p-button>

      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        (click)="clearKeepDeptQuery()"
      ></p-button>
    </div>
  </form>

  <p-table
    [value]="keepDeptResultData"
    [scrollable]="true"
    scrollHeight="320px"
    selectionMode="single"
    [(selection)]="selectedKeepDept"
    (onRowSelect)="onSelectKeepDept($event.data)"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.No }}</td>
        <td>{{ row.Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
