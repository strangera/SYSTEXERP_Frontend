<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="公司銀行代號"
            controlName="BNK_No"
            [options]="bankNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.BNK_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="分行代號"
            controlName="BNK_BranchNo"
            [control]="dataForm.controls.BNK_BranchNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="帳號(甲存)"
            controlName="BNK_AccNo"
            [control]="dataForm.controls.BNK_AccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="前置碼"
            controlName="CHK_Track"
            [control]="dataForm.controls.CHK_Track"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="起始碼"
            controlName="CHK_BegNo"
            [control]="dataForm.controls.CHK_BegNo"
            [submitted]="submitted"
            [autoPadZero]="true"
            [padLength]="7"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="終止碼"
            controlName="CHK_EndNo"
            [control]="dataForm.controls.CHK_EndNo"
            [submitted]="submitted"
            [autoPadZero]="true"
            [padLength]="7"
          ></app-input-text>
        </div>

        <div *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="已用號碼"
            controlName="CHK_LastUsedNo"
            [control]="dataForm.controls.CHK_LastUsedNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="狀態"
            controlName="CHK_Status"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.CHK_Status"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="起用日"
            controlName="CHK_UseDate"
            [control]="dataForm.controls.CHK_UseDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="停用日"
            controlName="CHK_StopDate"
            [control]="dataForm.controls.CHK_StopDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
      </div>

      <!-- 空白支票作廢設定 (僅新增模式不顯示) -->
      <div *ngIf="!isFormCreateable" class="mt-3">
        <hr class="border-top-1 surface-border" />
        <app-table-edit
          #voidTable
          tableKey="fin61010-void"
          title="空白支票作廢設定"
          [data]="voidItems"
          [columns]="voidColumns"
          [showReorder]="false"
          [canInsert]="isFormEditable"
          [rowEditDisabled]="isOriginalVoidRow"
          (dataChange)="voidItems = $event"
        ></app-table-edit>
      </div>

      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
