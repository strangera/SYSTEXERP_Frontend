<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-4">
          <app-input-text label="格式代號" controlName="format_code" [control]="dataForm.controls.format_code"
            [submitted]="submitted" placeholder="必填, 最長2個字串">
          </app-input-text>
        </div>
        <div class="col-12 md:col-4">
          <app-input-text label="格式名稱" controlName="format_name" [control]="dataForm.controls.format_name"
            [submitted]="submitted" placeholder="必填, 最長100個字串">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
