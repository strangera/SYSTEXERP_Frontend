<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel *ngIf="initialized" [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="應付ID" controlName="ACP_No" [control]="dataForm.controls.ACP_No" [submitted]="submitted"
            [showButton]="isFormCreateable" buttonLabel="查詢" (clickButton)="displaySearchDialog = true"
            (blurEvent)="onAcpNoBlur($event)">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="立帳日期" [control]="dataForm.controls.ACP_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商編號" controlName="VEN_No" [control]="dataForm.controls.VEN_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商名稱" controlName="VEN_Name" [control]="dataForm.controls.VEN_Name"
            [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="true" label="應付金額" controlName="ACP_Amt"
            [control]="dataForm.controls.ACP_Amt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="true" label="保留款金額" controlName="ACP_ReserveAmt"
            [control]="dataForm.controls.ACP_ReserveAmt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="true" label="應付帳款餘額" controlName="ACP_BalanceAmt"
            [control]="dataForm.controls.ACP_BalanceAmt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="true" label="退保留款金額" controlName="RET_Amt"
            [control]="dataForm.controls.RET_Amt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="true" label="已產生保留款" controlName="sam" [control]="dataForm.controls.sam"
            [submitted]="submitted"></app-input-number>
        </div>
      </div>

      <!-- 保留退款明細編輯 Table -->
      <div class="mt-3">
        <app-table-edit title="保留退款明細" tableKey="FIN24020_ITEMS" [columns]="editColumns" [showFooter]="false"
          [showPaginator]="false" [scrollable]="true" [data]="tableData" [disabled]="isFormReadable"
          (dataChange)="onTableDataChange($event)" [defaultInsertData]="tableDefaults"></app-table-edit>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="initializeFormFromRowData()" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<p-dialog header="應付帳款查詢選擇" [(visible)]="displaySearchDialog" [modal]="true"
  [style]="{ width: '75vw', 'min-width': '700px' }" [draggable]="false" [resizable]="false">

  <form [formGroup]="dialogQueryForm" class="grid p-fluid mb-3">
    <app-input-text class="col-12 md:col-4" label="廠客代號" controlName="VEN_No"
      [control]="dialogQueryForm.controls.VEN_No"></app-input-text>
    <app-input-text class="col-12 md:col-4" label="廠客名稱" controlName="VEN_Name"
      [control]="dialogQueryForm.controls.VEN_Name"></app-input-text>
    <app-calendar-range-quick class="col-12 md:col-4" calendarType="dateRange" label="立帳日期"
      [startControl]="dialogQueryForm.controls.ACP_Date_From"
      [endControl]="dialogQueryForm.controls.ACP_Date_To"></app-calendar-range-quick>

    <div class="col-12 flex justify-content-end gap-2 border-top-1 surface-border pt-2">
      <app-button btnType="query" (click)="onApsDialogSearch()"></app-button>
    </div>
  </form>

  <app-table-report [dataKey]="'ACP_No'" [data]="apsDialogData" [columns]="apsDialogColumns" [showCaption]="false"
    [showManage]="false" [lazy]="false" (itemClick)="onApsRowClick($event)" [totalRecords]="apsDialogData.length" />
</p-dialog>
