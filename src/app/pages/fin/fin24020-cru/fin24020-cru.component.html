<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-table
            [control]="dataForm.controls.ACP_No"
            [submitted]="submitted"
            templateLabel="ACP_No"
            optionLabel="ACP_No"
            optionValue="ACP_No"
            [suggestions]="apsSuggestions"
            [fieldsConfig]="apsFieldsConfig"
            [formGroup]="dialogQueryForm"
            [dialogData]="apsDialogData"
            [dialogColumns]="apsDialogColumns"
            [loading]="apsDialogLoading"
            [lazy]="false"
            (select)="onApsSelect($event)"
            (inputValueChanged)="onApsInputChange($event)"
            (formValueChanged)="onDialogQueryFormValueChanged($event)"
          >
            <app-input-text
              class="col-12 md:col-6"
              label="廠客代號"
              controlName="VEN_No"
              [control]="dialogQueryForm.controls.VEN_No"
              [submitted]="submitted"
            ></app-input-text>
            <app-input-text
              class="col-12 md:col-6"
              label="廠客名稱"
              controlName="VEN_Name"
              [control]="dialogQueryForm.controls.VEN_Name"
              [submitted]="submitted"
            ></app-input-text>
            <app-calendar
              class="col-12 md:col-6"
              calendarType="dateOne"
              label="立帳日期"
              [control]="dialogQueryForm.controls.ACP_Date"
              [submitted]="submitted"
            ></app-calendar>
          </app-dropdown-table>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="立帳日期"
            [control]="dataForm.controls.ACP_Date"
            [submitted]="submitted"
            [readonly]="true"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠商編號"
            controlName="VEN_No"
            [control]="dataForm.controls.VEN_No"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠商名稱"
            controlName="VEN_Name"
            [control]="dataForm.controls.VEN_Name"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="true"
            label="應付金額"
            controlName="ACP_Amt"
            [control]="dataForm.controls.ACP_Amt"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="true"
            label="保留款金額"
            controlName="ACP_ReserveAmt"
            [control]="dataForm.controls.ACP_ReserveAmt"
            [submitted]="submitted"
            [readonly]="isFormReadable"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="true"
            label="應付帳款餘額"
            controlName="ACP_BalanceAmt"
            [control]="dataForm.controls.ACP_BalanceAmt"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="true"
            label="退保留款金額"
            controlName="RET_Amt"
            [control]="dataForm.controls.RET_Amt"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            [useGrouping]="true"
            label="已產生保留款"
            controlName="sam"
            [control]="dataForm.controls.sam"
            [submitted]="submitted"
            [readonly]="true"
          ></app-input-number>
        </div>
      </div>

      <!-- 保留退款明細編輯 Table -->
      <div class="mt-3">
        <app-table-edit
          title="保留退款明細"
          tableKey="FIN24020_ITEMS"
          [columns]="editColumns"
          [showFooter]="false"
          [showPaginator]="false"
          [scrollable]="true"
          [data]="tableData"
          [disabled]="isFormReadable"
          (dataChange)="onTableDataChange($event)"
        ></app-table-edit>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="onLocalCancel()"
        />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
