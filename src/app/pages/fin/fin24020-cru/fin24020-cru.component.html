<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="應付ID" controlName="ACP_No" [control]="dataForm.controls.ACP_No"
            [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateMonthOne" label="立帳日期" [control]="dataForm.controls.ACP_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="廠商編號" controlName="VEN_No" [options]="VEN_No_ParamOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="廠商名稱" controlName="VEN_Name" [options]="VEN_No_ParamOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_Name" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="應付金額" controlName="ACP_Amt"
            [control]="dataForm.controls.ACP_Amt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="保留款金額" controlName="ACP_ReserveAmt"
            [control]="dataForm.controls.ACP_ReserveAmt" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="應付帳款餘額" controlName="sam_termno"
            [control]="dataForm.controls.sam_termno" [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="已產生保留款" controlName="sam" [control]="dataForm.controls.sam"
            [submitted]="submitted"></app-input-number>
        </div>

      </div>
      <!--
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否產生付款資料" controlName="PTA_Key" [options]="VEN_No_ParamOptions | async"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.PTA_Key"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="NoteDesc" [control]="dataForm.controls.NoteDesc"
            [submitted]="submitted"></app-input-text>
        </div>
      </div> -->

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
