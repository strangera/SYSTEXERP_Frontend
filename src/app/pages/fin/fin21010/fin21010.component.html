<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="公司銀行科目 代碼/名稱"
              controlName="BNK_DepositAccNo"
              [options]="GLS1005_BNK_DepositAccNo_Option"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.BNK_DepositAccNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="全省銀行 代碼/名稱"
              controlName="BNK_No"
              [options]="APS1004_Option"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.BNK_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="帳號"
              controlName="BNK_AccNo"
              [control]="queryForm.controls.BNK_AccNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="帳戶名稱"
              controlName="BNK_AccName1"
              [control]="queryForm.controls.BNK_AccName1"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="存款代碼"
              controlName="BNK_AccType"
              [options]="BNK_AccType_Option"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.BNK_AccType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="應收票據"
              controlName="BNK_CheckInAccNo"
              [options]="GLS1005_BNK_CheckInAccNo_Option"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.BNK_CheckInAccNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="應付票據"
              controlName="BNK_CheckOutAccNo"
              [options]="GLS1005_BNK_CheckOutAccNo_Option"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.BNK_CheckOutAccNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <!-- <div> -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN21010"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      (delete)="onDelete($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showCheckBox]="true"
      dataKey="id"
      [multiSortMeta]="[{ field: 'id', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
      [isRowSelectable]="isRowSelectable"
    ></app-table>
  </div>
</div>
