<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text-range
            class="col-12 md:col-6 lg:col-4"
            label="傳票編號"
            [startControl]="queryForm.controls.VouNoStart"
            [endControl]="queryForm.controls.VouNoEnd"
            [submitted]="submitted"
          />
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="傳票日期"
            [startControl]="queryForm.controls.VouDateStart"
            [endControl]="queryForm.controls.VouDateEnd"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table
      tableKey="FIN13090"
      [data]="data"
      [columns]="columns"
      [(selectedItems)]="selectedItems"
      [showCheckBox]="false"
      [loading]="loading"
      [showDelete]="false"
      [multiSortMeta]="[{ field: 'VouNo', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
