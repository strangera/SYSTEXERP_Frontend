<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="report" (click)="onExport()" label="匯出申報資料" [disabled]="data.length === 0"
      [loading]="exportLoading"></app-button>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 營業人統編 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="營業人統編" controlName="STO_Uniform"
            [control]="queryForm.controls.STO_Uniform" [submitted]="submitted" placeholder="最長8個字"></app-input-text>
          <!-- 營業人名稱 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="營業人名稱" controlName="STO_TaxName"
            [control]="queryForm.controls.STO_TaxName" [submitted]="submitted" placeholder="最長60個字"></app-input-text>
          <!-- 營業地址 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="營業地址" controlName="STO_Addr"
            [control]="queryForm.controls.STO_Addr" [submitted]="submitted" placeholder="最長100個字"></app-input-text>
          <!-- 總繳代號 -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="總繳代號" controlName="REP_OrgCodeList"
            [options]="orgCodeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.REP_OrgCodeList" [submitted]="submitted"
            placeholder="各單位(分支機構)分別申報, 單一機構報總"></app-multi-select>
          <!-- 狀態 -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="狀態" controlName="STO_StatusList"
            [options]="reviewStatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.STO_StatusList" [submitted]="submitted" placeholder="是, 否"></app-multi-select>
          <!-- 申報年月起迄 -->
          <app-year-month class="col-12 md:col-6 lg:col-4" label="申報年月(起)"
            [control]="queryForm.controls.REP_GUIYM_start" [submitted]="submitted" [evenMonth]="true"></app-year-month>
          <app-year-month class="col-12 md:col-6 lg:col-4" label="申報年月(迄)" [control]="queryForm.controls.REP_GUIYM_end"
            [submitted]="submitted" [evenMonth]="true"></app-year-month>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report [data]="data"
                      dataKey="id"
                      tableKey="FIN11010"
                      [columns]="columns"
                      [totalRecords]="totalRecords"
                      [loading]="loading"
                      [lastQueryBody]="lastQueryBody"
                      [queryFunction]="queryFunction"
                      [showCheckBox]="false"
                      [showDelete]="false"
                      (edit)="onEdit($event)"
                      (detail)="onDetail($event)"
                      [addButton]="addButton"
                      [buttonsLoading]="btnLoading"
                      [editDisabled]="editDisabled"></app-table-report>
  </div>
</div>
