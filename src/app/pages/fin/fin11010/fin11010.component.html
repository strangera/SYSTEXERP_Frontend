<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onExport()" label="匯出申報資料"></app-button>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="營業人統編" controlName="tax_id" [control]="queryForm.controls.tax_id"
              [submitted]="submitted" placeholder="最長8個字申"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="營業人名稱" controlName="tax_name" [control]="queryForm.controls.tax_name"
              [submitted]="submitted" placeholder="最長60個字申"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="營業地址" controlName="address" [control]="queryForm.controls.address"
              [submitted]="submitted" placeholder="最長100個字申"></app-input-text>
          </div>

        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="總繳代號" controlName="main_code" [options]="mainCodeOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.main_code" [submitted]="submitted"
              placeholder="各單位(分支機構)分別申報, 單一機構報總"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="審核狀態" controlName="review_status" [options]="reviewStatusOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.review_status" [submitted]="submitted"
              placeholder="是, 否"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="申報年月"
              [startControl]="queryForm.controls.declare_month_start"
              [endControl]="queryForm.controls.declare_month_end" [submitted]="submitted"></app-calendar-range>
          </div>

        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table tableKey="FIN11010" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
      [showDelete]="false" [showCheckBox]="false" dataKey="id" [multiSortMeta]="[{ field: 'tax_id', order: 1 }]"
      [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true" [loading]="loading" [isRowSelectable]="isRowSelectable" [showManage]="false"></app-table>
  </div>
</div>
