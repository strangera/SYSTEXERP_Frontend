<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="預支單號" controlName="advanceSheetNumber"
              [control]="queryForm.controls.advanceSheetNumber" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="申請日期"
              [startControl]="queryForm.controls.startRequestDate" [endControl]="queryForm.controls.endRequestDate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="預支金額" [startControl]="queryForm.controls.startAdvanceAmount"
              [endControl]="queryForm.controls.endAdvanceAmount" [submitted]="submitted"></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="預計核銷日"
              [startControl]="queryForm.controls.startWriteOffDate" [endControl]="queryForm.controls.endWriteOffDate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>申請廠商/員工</label>
            <div class="p-inputgroup">
              <input pInputText [value]="queryForm.controls.requsetEmployee.value" readonly placeholder="請選擇廠商/員工"
                (click)="openPicker()" />
              <button type="button" pButton icon="pi pi-search" (click)="openPicker()"></button>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="付款方式" controlName="payoutMethod" optionLabel="label" optionValue="value"
              [options]="payoutMethodOptions$ | async" [control]="queryForm.controls.payoutMethod"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="匯款銀行代號" controlName="transferAccount" optionLabel="label" optionValue="value"
              [options]="bankOptions$ | async" [control]="queryForm.controls.transferAccount"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="銀行帳號" controlName="bankAccount" [control]="queryForm.controls.bankAccount"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="帳戶名稱" controlName="accountName" [control]="queryForm.controls.accountName"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="統一編號/身分證字號" controlName="ticketTitle" [control]="queryForm.controls.ticketTitle"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="預計付款日"
              [startControl]="queryForm.controls.startExpectPayDate" [endControl]="queryForm.controls.endExpectPayfDate"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="summary" [control]="queryForm.controls.summary"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" [form]="queryForm"></app-button>
            <app-button btnType="query" (onClick)="onSubmit(queryForm)" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table-report tableKey="FIN23010" dataKey="id" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
      [lastQueryBody]="lastQueryBody" [queryFunction]="tableQueryFunction" [loading]="loading" [showCheckBox]="true"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (edit)="onEdit($event)"
      (detail)="onDetail($event)" (delete)="onDelete()" [isRowSelectable]="isRowSelectable"
      [editDisabled]="editDisabled" [addButton]="addButton">
    </app-table-report>
  </div>
</div>

<app-fin23010-ven-emp-picker [(visible)]="pickerVisible" (selected)="onPickerSelected($event)" />
