<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="繳票" (click)="onCreate(UpdateType.Deposit)"></app-button>
    <app-button btnType="create" label="取消繳票" (click)="onCreate(UpdateType.CancelDeposit)"></app-button>
    <app-button btnType="create" label="退票" (click)="onCreate(UpdateType.Refund)"></app-button>
    <app-button btnType="create" label="取消退票" (click)="onCreate(UpdateType.CancelRefund)"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠客代號" controlName="VEN_No" [options]="VEN_NoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠客名稱" controlName="VEN_Name" [control]="queryForm.controls.VEN_Name"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="櫃位名稱" controlName="TLT_Name" [options]="TLT_NameOptions | async" optionLabel="label"
              optionValue="label" [control]="queryForm.controls.TLT_Name" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="合約起日" controlName="tlt_bdate"
              [startControl]="queryForm.controls.tlt_bdateStart" [endControl]="queryForm.controls.tlt_bdateEnd"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="合約迄日" controlName="tlt_edate"
              [startControl]="queryForm.controls.tlt_edateStart" [endControl]="queryForm.controls.tlt_edateEnd"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="收票日期" controlName="Deposit_Date"
              [startControl]="queryForm.controls.Deposit_DateStart" [endControl]="queryForm.controls.Deposit_DateEnd"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="保證票到期日" controlName="CHK_ExpireDate"
              [startControl]="queryForm.controls.CHK_ExpireDateStart"
              [endControl]="queryForm.controls.CHK_ExpireDateEnd" [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="變更日期" controlName="UPD_Date"
              [startControl]="queryForm.controls.UPD_DateStart" [endControl]="queryForm.controls.UPD_DateEnd"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="票據編號" controlName="CHK_No" [control]="queryForm.controls.CHK_No"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="票據狀態" controlName="Status" [options]="StatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Status" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保證票類型" controlName="CHK_Type" [options]="CHK_TypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CHK_Type" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織代碼" controlName="org_id" [options]="org_idOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_id" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="Remark" [control]="queryForm.controls.Remark"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保證類別" controlName="Deposit_Type" [options]="Deposit_TypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Deposit_Type" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="金額" controlName="CHK_Amt_Range"
              [startControl]="queryForm.controls.CHK_Amt" [endControl]="queryForm.controls.CHK_Amt"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="lastQuery" [showDelete]="false"
    [queryFunction]="fin35010Service.queryFIN35010.bind(fin35010Service)"></app-table-report>
</div>
