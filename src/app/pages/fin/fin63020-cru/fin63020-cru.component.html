<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="票據號碼" controlName="CheckNo" [control]="dataForm.controls.CheckNo" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠客代號" controlName="VendorNo" [control]="dataForm.controls.VendorNo" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠客名稱" controlName="VEN_Name" [control]="dataForm.controls.VEN_Name" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司銀行科目代號" controlName="CompanyAccNo" [control]="dataForm.controls.CompanyAccNo" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="公司銀行科目名稱" controlName="CompanyAccName" [control]="dataForm.controls.CompanyAccName" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="票面金額" controlName="CheckAmount" [control]="dataForm.controls.CheckAmount" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-12">
          <app-input-text label="票據抬頭" controlName="CheckTitle" [control]="dataForm.controls.CheckTitle" [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="開票日" controlName="IssueDate" [control]="dataForm.controls.IssueDate" [submitted]="submitted"></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="到期日" controlName="ExpireDate" [control]="dataForm.controls.ExpireDate" [submitted]="submitted"></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="兌現日" controlName="PayDate" [control]="dataForm.controls.PayDate" [submitted]="submitted"></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="領取日期" controlName="PickupDate" [control]="dataForm.controls.PickupDate" [submitted]="submitted"></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="撤票日期" controlName="WithdrawDate" [control]="dataForm.controls.WithdrawDate" [submitted]="submitted"></app-calendar>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="票據禁止背書轉讓" controlName="NoEndorseYn" [options]="endorsementProhibitedOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.NoEndorseYn" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="狀態" controlName="CheckStatus" [options]="checkStatusOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.CheckStatus" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="票據狀態(確認/拋轉)" controlName="StatusFlag" [options]="statusOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.StatusFlag" [submitted]="submitted"></app-dropdown>
        </div>
     <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="兌現傳票編號" controlName="VouNo_paid" [control]="dataForm.controls.VouNo_paid" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="領取狀態" controlName="PickupType" [options]="pickupTypeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.PickupType" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
  label="組織代號"
  controlName="OrgId"
  [options]="organizationCodeOptions"
  optionLabel="label"
  optionValue="value"
  [control]="dataForm.controls.OrgId"
  [submitted]="submitted"
></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動代號" controlName="ProjectNo" [control]="dataForm.controls.ProjectNo" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="應付票據開票單號" controlName="PamNo" [control]="dataForm.controls.PamNo" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="應付票據會計科目" controlName="CompanyAccDisplay" [control]="dataForm.controls.CompanyAccDisplay" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票號碼" controlName="VoucherNoIssued" [control]="dataForm.controls.VoucherNoIssued" [submitted]="submitted"></app-input-text>
        </div>

   

        <div class="col-12 md:col-6 lg:col-12">
          <app-input-text label="備註" controlName="Remark" [control]="dataForm.controls.Remark" [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <div class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3" *ngIf="!isRead">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
