<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <!-- 銀行代號 -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-input-text
            label="銀行代號"
            controlName="CompanyAccNo"
            [control]="dataForm.controls.CompanyAccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 分行代號 -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-input-text
            label="分行代號"
            controlName="CompanyAccName"
            [control]="dataForm.controls.CompanyAccName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
                <!-- 銀行名稱 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="銀行名稱"
            controlName="BankName"
            [control]="dataForm.controls.CompanyAccName"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 帳號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="帳號"
            controlName="ApCheckAccNo"
            [control]="dataForm.controls.ApCheckAccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
         

                <!-- 支票號碼 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="支票號碼"
            controlName="CheckNo"
            [control]="dataForm.controls.CheckNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
                <!-- 支票金額 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="支票金額"
            controlName="CheckAmount"
            [control]="dataForm.controls.CheckAmount"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 支票狀態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="支票狀態"
            controlName="CheckStatus"
            [options]="chkStatusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.CheckStatus"
            [submitted]="submitted"
          ></app-dropdown>
        </div>


               <!-- 收款編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="收款編號"
            controlName="PamNo"
            [control]="dataForm.controls.PamNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
                <!-- 收款對象(代號) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="收款對象"
            controlName="VendorNo"
            [control]="dataForm.controls.VendorNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>



        <!-- 託收日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="託收日期"
            controlName="IssueDate"
            [control]="dataForm.controls.IssueDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>



        <!-- 到期日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="到期日期"
            controlName="ExpireDate"
            [control]="dataForm.controls.ExpireDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>



        <!-- 兌現日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="兌現日期"
            controlName="PayDate"
            [control]="dataForm.controls.PayDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>



        <!-- 抽票日期（先借用 PickupDate） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="抽票日期"
            controlName="PickupDate"
            [control]="dataForm.controls.PickupDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>




        <!-- 退票日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="退票日期"
            controlName="WithdrawDate"
            [control]="dataForm.controls.WithdrawDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>



        <!-- 託收銀行代號(1) -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-input-text
            label="託收銀行代號"
            controlName="TrustBankCode1"
            [control]="dataForm.controls.CompanyAccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 託收分行代號(2) -->
        <div class="col-12 md:col-6 lg:col-2">
          <app-input-text
            label="託收分行代號"
            controlName="TrustBankCode2"
            [control]="dataForm.controls.CompanyAccName"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 託收銀行全名 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="託收銀行全名"
            controlName="TrustBankFullName"
            [control]="dataForm.controls.CompanyAccName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        
        <!-- 託收帳戶 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="託收帳戶"
            controlName="TrustAccount"
            [control]="dataForm.controls.VoucherNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

                <!-- 備註 -->
        <div class="col-12 md:col-6 lg:col-8">
          <app-input-text
            label="備註"
            controlName="Remark"
            [control]="dataForm.controls.Remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>

      </div>

      <!-- 按鈕列 -->
      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="!isRead"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
