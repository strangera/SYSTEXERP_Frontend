<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="預支單號" controlName="advanceSheetNumber" [control]="dataForm.controls.advanceSheetNumber"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" controlName="requestDate"
            [control]="dataForm.controls.requestDate" [submitted]="submitted">
          </app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="預支金額" controlName="advanceAmount" [control]="dataForm.controls.advanceAmount"
            [submitted]="submitted">
          </app-input-number>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="預計核銷日" controlName="writeOffDate"
            [control]="dataForm.controls.writeOffDate" [submitted]="submitted">
          </app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label>申請廠商/員工<span class="text-red-500"> *</span></label>
          <div class="p-inputgroup">
            <input pInputText readonly [value]="venDisplayValue" placeholder="請選擇廠商/員工" (click)="openPicker()" />
            <button type="button" pButton icon="pi pi-search" (click)="openPicker()"
              [disabled]="dataForm.disabled"></button>
          </div>
          <small class="p-error" *ngIf="submitted && dataForm.controls.requsetEmployee.invalid">必填</small>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="付款方式" controlName="payoutMethod" optionLabel="label" optionValue="value"
            [options]="payoutMethodOptions$ | async" [control]="dataForm.controls.payoutMethod" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="匯款銀行代號" controlName="transferAccount" [control]="dataForm.controls.transferAccount"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="銀行帳號" controlName="bankAccount" [control]="dataForm.controls.bankAccount"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="帳戶名稱" controlName="accountName" [control]="dataForm.controls.accountName"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="票據禁止背書轉讓" controlName="ticketTransfer" optionLabel="label" optionValue="value"
            [options]="ctrlYNOptions" [control]="dataForm.controls.ticketTransfer" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="票據抬頭" controlName="ticketTitle" [control]="dataForm.controls.ticketTitle"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="預計付款日" controlName="eExpectPayDate"
            [control]="dataForm.controls.eExpectPayDate" [submitted]="submitted">
          </app-calendar>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="費用組織" controlName="organization" optionLabel="label" optionValue="value"
            [options]="organizationOptions$ | async" [control]="dataForm.controls.organization" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="摘要" controlName="summary" [control]="dataForm.controls.summary"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<app-fin23010-ven-emp-picker [(visible)]="pickerVisible" (selected)="onPickerSelected($event)" />
