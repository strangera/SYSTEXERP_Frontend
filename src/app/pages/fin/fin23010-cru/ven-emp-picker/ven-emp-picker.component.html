<!-- @format -->
<p-dialog header="選擇申請員工" [(visible)]="visible" [modal]="true" [style]="{ width: '960px' }" (onShow)="onShow()"
  (onHide)="close()">
  <div class="flex flex-column gap-3">
    <!-- 關鍵字輸入：debounce後即時查詢，無需查詢按鈕 -->
    <input pInputText [(ngModel)]="keyword" placeholder="輸入員工編號/姓名即時查詢" class="w-full"
      (ngModelChange)="onKeywordChange()" />

    <p-table [value]="rows" [paginator]="true" [rows]="20" [rowsPerPageOptions]="[20, 50]" [loading]="loading"
      [scrollable]="true" scrollHeight="420px" dataKey="VenNo">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12%">代號</th>
          <th style="width: 16%">名稱</th>
          <th style="width: 8%">付款方式</th>
          <th style="width: 10%">全省銀行代號</th>
          <th style="width: 14%">銀行帳號</th>
          <th style="width: 14%">帳戶名稱</th>
          <th style="width: 12%">開票抬頭</th>
          <th style="width: 6%">票期</th>
          <th style="width: 8%">審核狀態</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr class="cursor-pointer" (click)="pick(row)">
          <td>{{ row.VenNo }}</td>
          <td>{{ row.VenName }}</td>
          <td>{{ row.PayType }} {{ row.PayTypeName }}</td>
          <td>{{ row.BnkNo }}</td>
          <td>{{ row.BnkAccNo }}</td>
          <td>{{ row.BnkAccountName }}</td>
          <td>{{ row.CheckTitle }}</td>
          <td>{{ row.PayConditionDay }}</td>
          <td>{{ row.VenStatusName }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="9">{{ hasSearched ? '查無資料' : '請輸入關鍵字查詢' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-dialog>
