<!-- @format -->
<p-dialog
  header="選擇申請廠商/員工"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '700px' }"
  (onShow)="onShow()"
  (onHide)="close()"
>
  <div class="flex flex-column gap-3">
    <!-- 模式切換 -->
    <div class="flex gap-4">
      <div class="flex align-items-center gap-2">
        <p-radioButton name="mode" value="vendor" [(ngModel)]="mode" (ngModelChange)="onModeChange()" inputId="fin23010-mode-vendor" />
        <label for="fin23010-mode-vendor" class="cursor-pointer">廠商</label>
      </div>
      <div class="flex align-items-center gap-2">
        <p-radioButton name="mode" value="employee" [(ngModel)]="mode" (ngModelChange)="onModeChange()" inputId="fin23010-mode-employee" />
        <label for="fin23010-mode-employee" class="cursor-pointer">員工</label>
      </div>
    </div>

    <!-- 搜尋列 -->
    <div class="flex gap-2">
      <input
        pInputText
        [(ngModel)]="keyword"
        [placeholder]="mode === 'vendor' ? '廠商編號/名稱' : '員工編號/姓名'"
        class="flex-1"
        (keyup.enter)="onSearch()"
      />
      <p-button label="查詢" icon="pi pi-search" (click)="onSearch()" [loading]="loading" />
    </div>

    <!-- 廠商清單(前端關鍵字篩選) -->
    @if (mode === 'vendor') {
      <p-table
        [value]="filteredVendors"
        [paginator]="true"
        [rows]="pageSize"
        [rowsPerPageOptions]="[20, 50, 100]"
        [loading]="loading"
        [scrollable]="true"
        scrollHeight="380px"
        dataKey="VEN_No"
      >
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 30%">廠商編號</th>
            <th style="width: 40%">廠商名稱</th>
            <th style="width: 30%">簡稱</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr class="cursor-pointer" (click)="pickVendor(row)">
            <td>{{ row.VEN_No }}</td>
            <td>{{ row.Name }}</td>
            <td>{{ row.ShortName }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="3">{{ hasSearched ? '查無資料' : '請輸入查詢條件' }}</td></tr>
        </ng-template>
      </p-table>
    } @else {
      <!-- 員工清單(後端分頁) -->
      <p-table
        [value]="employees"
        [paginator]="true"
        [rows]="pageSize"
        [rowsPerPageOptions]="[20, 50, 100]"
        [lazy]="true"
        [totalRecords]="totalRecords"
        [loading]="loading"
        [scrollable]="true"
        scrollHeight="380px"
        dataKey="user_No"
        (onLazyLoad)="onEmployeeLazyLoad($event)"
      >
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 40%">員工編號</th>
            <th style="width: 60%">員工姓名</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr class="cursor-pointer" (click)="pickEmployee(row)">
            <td>{{ row.user_No }}</td>
            <td>{{ row.user_Name }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="2">{{ hasSearched ? '查無資料' : '請輸入查詢條件' }}</td></tr>
        </ng-template>
      </p-table>
    }
  </div>
</p-dialog>
