<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="查詢日期起"
              controlName="StartDate"
              [control]="queryForm.controls.StartDate"
              [submitted]="submitted">
            </app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="查詢日期迄"
              controlName="EndDate"
              [control]="queryForm.controls.EndDate"
              [submitted]="submitted">
            </app-calendar>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>

    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    tableKey="FIN62040"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"

    [showSort]="false"
    [showReorder]="false"
    [showCheckBox]="false"
    [showManage]="false"
    [showDelete]="false"
    [showCaption]="true"
    [showFilter]="false"
    [showSummary]="false"
    [showReportMode]="false"
    [showExcelExport]="false"
    [showExcelImport]="false"
    [lazy]="false">

    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="出納區間報表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportPDF()"
          [disabled]="data.length === 0">
        </p-button>

        <p-button
          styleClass="p-2"
          label="出納區間報表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file-excel"
          (click)="onExportXLSX()"
          [disabled]="data.length === 0">
        </p-button>
      </div>
    </header>

  </app-table-report>
</div>
