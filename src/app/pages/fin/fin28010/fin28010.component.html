<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4" style="cursor:pointer"
            (click)="openWslipDialog(); $event.stopPropagation()">
            <app-input-text label="匯款單號" controlName="WSLIP_NO" [control]="queryForm.controls.WSLIP_NO"
              [submitted]="submitted" [readonly]="true" [customPlaceholder]="'點擊選取匯款單號'"
              [alwaysShowPlaceholder]="true"></app-input-text>
          </div>
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="傳票日期" controlName="VouDate"
            [control]="queryForm.controls.VouDate" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 匯款單號開窗 Dialog -->
<app-dialog [visible]="wslipDialogVisible" header="選取匯款單號" (visibleChange)="wslipDialogVisible = $event"
  [showFooter]="false" width="800px">
  <app-table [data]="wslipDialogData" [columns]="wslipDialogColumns" [totalRecords]="wslipDialogTotalRecords"
    [loading]="wslipDialogLoading" [showCheckBox]="true" [selectionMode]="'single'" [selectedItems]="selectedWslipItem"
    [showManage]="false" [showDelete]="false" [showExcel]="false" [showReportMode]="false" [lazy]="false"
    dataKey="WSLIP_NO" (selectionChange)="onWslipSelect($event)">
  </app-table>
</app-dialog>
