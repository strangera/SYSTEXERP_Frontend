<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="盤點單號"
              controlName="type01"
              [control]="queryForm.controls.type01"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管人"
              controlName="type02"
              [options]="KeepQuota_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.type02"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="額度"
              [startControl]="queryForm.controls.startKeepQuota"
              [endControl]="queryForm.controls.endKeepQuota"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="變更時間範圍"
              [startControl]="queryForm.controls.applyDateFrom"
              [endControl]="queryForm.controls.applyDateTo"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="支出請款單號"
              controlName="type03"
              [options]="KeepQuota_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.type03"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="盤點單狀態"
              controlName="type04"
              [options]="KeepQuota_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.type04"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="盤點餘額"
              [startControl]="queryForm.controls.startType05"
              [endControl]="queryForm.controls.endType05"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="說明"
              controlName="type06"
              [control]="queryForm.controls.type06"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="keepingUnit"
              [options]="keepingUnit_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.keepingUnit"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN72050"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'HOS_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
      [isRowSelectable]="isRowSelectable"
    ></app-table>
  </div>
</div>
