<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!-- Row 1 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="盤點單號"
              controlName="PCC_No"
              [control]="queryForm.controls.PCC_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管人代碼/名稱"
              controlName="Keep_UsrNo"
              [options]="keepUser_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Keep_UsrNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="true"
              label="額度"
              [startControl]="queryForm.controls.Keep_QuotaAmt_From"
              [endControl]="queryForm.controls.Keep_QuotaAmt_To"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="盤點日期"
              [startControl]="queryForm.controls.PCC_DateFrom"
              [endControl]="queryForm.controls.PCC_DateTo"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="支出請款單號"
              controlName="PCS_RqstNo"
              [options]="PCS_RqstNo_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PCS_RqstNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="盤點單狀態"
              controlName="PCC_Status"
              [options]="status_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.PCC_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <!-- Row 3 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="true"
              label="盤點餘額"
              [startControl]="queryForm.controls.PCC_DIFF_AMT_From"
              [endControl]="queryForm.controls.PCC_DIFF_AMT_To"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="說明"
              controlName="PCS_Remark"
              [control]="queryForm.controls.PCS_Remark"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位代碼/名稱"
              controlName="Keep_OrgID"
              [options]="keepingUnit_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Keep_OrgID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-13">
    <app-table-report
      tableKey="FIN72050"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="PCS_PST_No"
      [totalRecords]="totalRecords()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="fin72050Service.queryFIN72050.bind(fin72050Service)"
      [lazy]="true"
      [loading]="loading"
    ></app-table-report>
  </div>
</div>
