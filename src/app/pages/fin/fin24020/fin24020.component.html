<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="應付ID" controlName="shouldPayID"
                            [control]="queryForm.controls.shouldPayID" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="廠客代號" controlName="factoryID" [options]="factoryIDOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.factoryID"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar calendarType="dateMonthOne" label="年月" [control]="queryForm.controls.onedatemm"
                            [submitted]="submitted">
                        </app-calendar>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="帳次" controlName="accountCash"
                            [control]="queryForm.controls.accountCash" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="退保留款日期"
                            [startControl]="queryForm.controls.startRefundDate"
                            [endControl]="queryForm.controls.endRefundDate" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="退保留款金額" [startControl]="queryForm.controls.startRefundRetainer"
                            [endControl]="queryForm.controls.endRefundRetainer" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="是否產生付款資料" controlName="generatePayout" [options]="whetherOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.generatePayout"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="備註" controlName="remark" [control]="queryForm.controls.remark"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-table>
    </div>
</div>
