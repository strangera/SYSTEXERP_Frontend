<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="年月"
              calendarType="dateMonthOne"
              controlName="YM"
              [control]="queryForm.controls.YM"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="比較年月"
              calendarType="dateMonthOne"
              controlName="CompareYM"
              [control]="queryForm.controls.CompareYM"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName="Org_ID"
              [options]="orgOptions"
              optionLabel="formLabel"
              optionValue="value"
              [showClear]="true"
              [control]="queryForm.controls.Org_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 是否含以下所屬部門 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsCludeDownOrg"
              formControlName="IsCludeDownOrg"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsCludeDownOrg">是否含以下所屬部門</label>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="類別"
              groupname="ReportType"
              [options]="reportTypeOptions"
              [control]="queryForm.controls.ReportType"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="單位金額表示"
              groupname="AmtUnit"
              [options]="amtUnitOptions"
              [control]="queryForm.controls.AmtUnit"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card" *ngIf="showTable">
  <app-table-report
    tableKey="FIN42040"
    dataKey="SortNo"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [lastQueryBody]="historyRequestBody"
    [queryFunction]="queryFIN42040ForReport"
    [showDelete]="false"
    [showDetail]="false"
    [showSort]="false"
    [ItemSize]="24.44"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="去年同期比較表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportPDF()"
          [disabled]="data.length === 0"
        ></p-button>

        <p-button
          styleClass="p-2"
          label="去年同期比較表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file-excel"
          (click)="onExportXLSX()"
          [disabled]="data.length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
