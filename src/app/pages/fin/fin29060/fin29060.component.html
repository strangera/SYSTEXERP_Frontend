<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="廠客代號" [startControl]="queryForm.controls.VendorNoFrom"
              [endControl]="queryForm.controls.VendorNoTo" [submitted]="submitted" [options]="VendorNoOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="立帳日期"
              [startControl]="queryForm.controls.BillingDateFrom" [endControl]="queryForm.controls.BillingDateTo"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="開票/匯款日期"
              [startControl]="queryForm.controls.startTransferDate" [endControl]="queryForm.controls.endTransferDate"
              [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="科目代號" [startControl]="queryForm.controls.AccNoFrom"
              [endControl]="queryForm.controls.AccNoTo" [submitted]="submitted" [options]="AccNoOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="summary" [control]="queryForm.controls.summary"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="未付款是否顯示" groupname="noPay" [control]="queryForm.controls.noPay" [options]="[
                { label: '顯示', value: 'Y' },
                { label: '不顯示', value: 'N' }
              ]" [submitted]="submitted">
            </app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="帳款餘額為零是否顯示" groupname="showUp" [control]="queryForm.controls.showUp" [options]="[
               { label: '顯示', value: 'Y' },
                { label: '不顯示', value: 'N' }
              ]" [submitted]="submitted">
            </app-radiobutton>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" [showDelete]="false" (detail)="onDetail($event)"
    [showReportMode]="false" [showManage]="false" dataKey="SeqNo" [multiSortMeta]="[{ field: 'VouNo', order: 1 }]"
    [totalRecords]="totalRecords" [showCheckBox]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showExcel]="false">
  </app-table>
</div>
