<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="廠商代號" [startControl]="queryForm.controls.VEN_No_From"
              [endControl]="queryForm.controls.VEN_No_To" [submitted]="submitted" [options]="VendorNoOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="立帳日期" [startControl]="queryForm.controls.ODM_Date_From"
              [endControl]="queryForm.controls.ODM_Date_To" [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="開票/匯款日期"
              [startControl]="queryForm.controls.PayRefDate_From" [endControl]="queryForm.controls.PayRefDate_To"
              [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="會計科目代號" [startControl]="queryForm.controls.AccNo_From"
              [endControl]="queryForm.controls.AccNo_To" [submitted]="submitted" [options]="AccNoOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="ACP_Desc" [control]="queryForm.controls.ACP_Desc"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="未付款是否顯示" groupname="ShowUnpaid" [control]="queryForm.controls.ShowUnpaid" [options]="[
                { label: '顯示', value: 'Y' },
                { label: '不顯示', value: 'N' }
              ]" [submitted]="submitted">
            </app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="帳款餘額為零是否顯示" groupname="ShowZeroBalance"
              [control]="queryForm.controls.ShowZeroBalance" [options]="[
               { label: '顯示', value: 'Y' },
                { label: '不顯示', value: 'N' }
              ]" [submitted]="submitted">
            </app-radiobutton>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" [showDelete]="true" (detail)="onDetail($event)" [showReportMode]="false"
    [showManage]="true" dataKey="SeqNo" [multiSortMeta]="[{ field: 'ACP_No', order: 1 }]" [totalRecords]="totalRecords"
    [showCheckBox]="false" [showEdit]="false" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true" [loading]="loading" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [showExcel]="false">
  </app-table>
</div>
