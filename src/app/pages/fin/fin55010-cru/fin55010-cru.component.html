<div class="card" *ngIf="initialized">
  <!-- 左上：匯出分類帳明細PDF -->
  <div class="col-12">
    <app-button
      label="列印"
      icon="pi pi-file-pdf"
      (click)="onExportPDF()"
      [loading]="PDFBtnLoading"
    ></app-button>
  </div>
  <!-- 固定抬頭 -->
  <div class="flex flex-column align-items-center mb-3">
    <div class="col-12 text-2xl font-bold mb-1 text-center">
      {{ brand.companyFullName }}
    </div>
    <div class="col-12 text-xl font-bold text-center">轉帳傳票</div>
  </div>

  <!-- 四項資訊 -->
  <div class="grid text-sm text-700">
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票日期：</span>
      <span class="font-medium">{{ meta?.vouDate || "" }}</span>
    </div>
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票型態：</span>
      <span class="font-medium">
        {{ meta?.VoucherType || "" }}/ {{ meta?.VoucherType_Name || "" }}
      </span>
    </div>
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票編號：</span>
      <span class="font-medium">{{ meta?.vouNo || "" }}</span>
    </div>
    <div class="col-12 md:col-3">
      <span class="mr-2">狀態：</span>
      <span class="font-medium">{{ meta?.vouStatus || "" }}</span>
    </div>
  </div>
</div>

<div class="card">
  <app-table-report
    tableKey="FIN55010CRU"
    dataKey="__rowid"
    [data]="rows"
    [columns]="columns"
    [showCheckBox]="false"
    [showManage]="false"
    [showDelete]="false"
    [totalRecords]="rows.length || 0"
    [lazy]="false"
    [loading]="loading"
    [showReportMode]="false"
    [showCaption]="false"
    [footerData]="footerData"
    [showSummary]="false"
    [ItemSize]="25"
  ></app-table-report>

  <div *ngIf="!loading && rows.length === 0" class="mt-3 text-600">
    查無明細資料。請回列表重新查詢，或確認此傳票號碼是否包含明細。
  </div>
</div>
