<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 匯款日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="匯款日期" [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo" [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 匯款銀行代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="匯款銀行代號" controlName="BNK_No" [options]="BankCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.BNK_No" [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠客代號" controlName="VEN_No" [options]="VendorNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 匯款單號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="匯款單號" controlNameStart="PamNoFrom" controlNameEnd="PamNoTo"
              [startControl]="queryForm.controls.PamNoFrom" [endControl]="queryForm.controls.PamNoTo"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <!-- 匯款狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="匯款狀態" controlName="RmtStatus" [options]="RmtStatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.RmtStatus" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <!-- 右上角工具列：匯出 PDF -->
  <div class="flex justify-content-end gap-2 mb-2">
    <app-button label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF(queryForm)" [loading]="exportPDFbtnLoading"
      [disabled]="loading || (data.length || 0) === 0">
    </app-button>

    <app-button label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportXLSX(queryForm)"
      [loading]="exportXLSXbtnLoading" [disabled]="loading || (data.length || 0) === 0">
    </app-button>
  </div>
  <app-table tableKey="FIN29020" dataKey="ID" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [multiSortMeta]="[]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [showManage]="false" [showReportMode]="false">
  </app-table>
</div>
