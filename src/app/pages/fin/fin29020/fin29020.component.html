<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 開票日期(起訖) - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="開票日期" [startControl]="queryForm.controls.IssueDateFrom"
              [endControl]="queryForm.controls.IssueDateTo" [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 銀行代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="銀行代號" controlName="BankCodeList" [options]="BankCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.BankCodeList" [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 開票單號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="開票單號(起訖)" controlNameStart="CheckNoFrom" controlNameEnd="CheckNoTo"
              [startControl]="queryForm.controls.CheckNoFrom" [endControl]="queryForm.controls.CheckNoTo"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="廠客代號" controlName="VendorNoList" [options]="VendorNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VendorNoList" [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 到期日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="到期日" controlName="DueDate" [control]="queryForm.controls.DueDate"
              [submitted]="submitted">
            </app-calendar>
          </div>

          <!-- 票據狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="票據狀態" controlName="CheckStatusList" [options]="CheckStatusListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.CheckStatusList"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

    [showReportMode]="false" [showGroupheader]="false">

    </app-button>
