<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 匯款日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="匯款日期" [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo" [submitted]="submitted"></app-calendar-range>
          </div>

          <!-- 匯款銀行代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="匯款銀行代號" controlName="BNK_No" [options]="VEN_BNK_No_ParamOptions" optionLabel="label"
              optionValue="BNK_id" [control]="queryForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠客代號" controlName="VEN_No" [options]="VendorNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 匯款單號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="匯款單號" controlNameStart="WslipNoFrom" controlNameEnd="WslipNoTo"
              [startControl]="queryForm.controls.WslipNoFrom" [endControl]="queryForm.controls.WslipNoTo"
              [submitted]="submitted"></app-input-text-range>
          </div>

          <!-- 匯款狀態 -->
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="匯款狀態"
              controlName="RmtStatus"
              [options]="RmtStatusOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.RmtStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div> -->
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="FIN29020" dataKey="WslipNo" [data]="data" [columns]="columns" [footerData]="footerData"
    [subTotalData]="subtotalData" [totalRecords]="totalRecords" [loading]="loading" groupRowsBy="RmtDate"
    [showSort]="false" [lastQueryBody]="lastQueryBody" [showManage]="false" [showDelete]="false"
    [showReportMode]="false" [showSignature]="true" [queryFunction]="fin29020Service.queryFIN29020.bind(fin29020Service)">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出匯款明細表.PDF" icon="pi pi-file-pdf" (click)="onExportPDF()"
          [loading]="exportPDFbtnLoading"
          [disabled]="loading || data.length === 0 || !hasPermission(Actions.Print)"></p-button>
        <p-button styleClass="p-2" label="匯出匯款明細表.Excel" icon="pi pi-file-excel" (click)="onExportXLSX()"
          [loading]="exportXLSXbtnLoading"
          [disabled]="loading || data.length === 0 || !hasPermission(Actions.ExportExcel)"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
