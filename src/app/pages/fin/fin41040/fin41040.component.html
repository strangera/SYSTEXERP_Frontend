<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            label="年"
            calendarType="dateYearOne"
            [control]="queryForm.controls.BudgetYear"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button
            btnType="query"
            label="產生"
            [loading]="loading"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN41040"
      [data]="data"
      [columns]="columns"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showDelete]="false"
      [showEdit]="false"
      [showDetail]="false"
      [showCheckBox]="false"
      [showReportMode]="false"
      [showSort]="false"
      [showCaption]="false"
      [showPaginator]="false"
      [showSerialNo]="false"
      dataKey="budget_year"
      [loading]="loading"
      [addButton]="addButton"
    ></app-table>
  </div>
</div>
