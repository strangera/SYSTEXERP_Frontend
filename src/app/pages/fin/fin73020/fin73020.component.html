<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="支出請款單號"
              controlName="PCS_RqstNo"
              [control]="queryForm.controls.PCS_RqstNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="產生日期"
              [startControl]="queryForm.controls.RqstDate_S"
              [endControl]="queryForm.controls.RqstDate_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金申請人"
              controlName="PCS_UsrNo"
              [options]="applicantOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PCS_UsrNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金保管人"
              controlName="Keep_UsrNo"
              [options]="custodianOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Keep_UsrNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="單據狀態"
              controlName="PCS_Status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PCS_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="Keep_OrgID"
              [options]="custodianDeptOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Keep_OrgID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [type]="'button'"
            (click)="onClear(queryForm)"
          ></app-button>

          <app-button
            btnType="query"
            [loading]="loading"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [tableKey]="'FIN73020_Data_' + tableVer"
    [dataKey]="'dataKey'"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFIN73020ForReport"
    [data]="data"
    [columns]="columns"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [showReorder]="false"
  [showSort]="true"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  >
    <header>
      <div class="flex justify-content-end align-items-center w-full">
        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="支出請款單表.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="支出請款單表.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file-excel"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
