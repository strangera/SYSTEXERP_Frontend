<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="三碼代號" controlName="threecodecategorycode,"
            [control]="dataForm.controls.threecodecategorycode" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="三碼名稱" controlName="Objectnumber" [control]="dataForm.controls.threecodecategoryname"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="三碼英文名稱" controlName="objectalias" [control]="dataForm.controls.threecodecategoryEname"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="中類代號" controlName="categoryCodeOptions" [options]="categoryCodeOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.categoryCodeOptions"
            [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>

    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
