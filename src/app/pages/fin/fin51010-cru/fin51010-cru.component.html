<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>

  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 傳票編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票編號" controlName="summonsCode" [control]="dataForm.controls.summonsCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票種類 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票種類" controlName="subpoenaType" [control]="dataForm.controls.subpoenaType"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票型態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票型態" controlName="subpoenaForm" [control]="dataForm.controls.subpoenaForm"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票日期" controlName="subpoenaDate" [control]="dataForm.controls.subpoenaDate"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票摘要 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票摘要" controlName="subpoenaSummary" [control]="dataForm.controls.subpoenaSummary"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 結帳單號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="結帳單號" controlName="checkoutNumber" [control]="dataForm.controls.checkoutNumber"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 傳票拋轉狀態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳票拋轉狀態" controlName="subpoenaTransferStatus"
            [control]="dataForm.controls.subpoenaTransferStatus" [submitted]="submitted"></app-input-text>
        </div>
        <!-- 建立者 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建立者" controlName="creator" [control]="dataForm.controls.creator"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 建立日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建立日期" controlName="creationDate" [control]="dataForm.controls.creationDate"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 修改/拋轉者 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="修改/拋轉者" controlName="modifier" [control]="dataForm.controls.modifier"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 修改/拋轉日 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="修改/拋轉日" controlName="modificationDate" [control]="dataForm.controls.modificationDate"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <!-- 動態新增項目 -->
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p> {{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <!-- 科目代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="科目代號" controlName="subjectCode" [control]="getFormControl(i, 'subjectCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 摘要 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="摘要" controlName="summary" [control]="getFormControl(i, 'summary')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 借方金額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="借方金額" controlName="debitAmount" [control]="getFormControl(i, 'debitAmount')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 貸方金額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="貸方金額" controlName="creditAmount" [control]="getFormControl(i, 'creditAmount')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 組織代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="組織代號" controlName="organizationCode"
                [control]="getFormControl(i, 'organizationCode')" [submitted]="submitted"></app-input-text>
            </div>
            <!-- 活動代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="活動代號" controlName="activityCode" [control]="getFormControl(i, 'activityCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 立沖代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="立沖代號" controlName="reversalCode" [control]="getFormControl(i, 'reversalCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 廠商編號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="廠商編號" controlName="vendorCode" [control]="getFormControl(i, 'vendorCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 對象別編號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="對象別編號" controlName="objectCode" [control]="getFormControl(i, 'objectCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 對帳KEY值 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="對帳KEY值" controlName="reconciliationKey"
                [control]="getFormControl(i, 'reconciliationKey')" [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>

      <!-- 動態新增按鈕 -->
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>

    <!-- 提交和取消按鈕 -->
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
