<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="發票日期" calendarType="dateOne"
            [control]="queryForm.controls.TXN_Date" [submitted]="submitted"></app-calendar>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_NoList"
            [options]="cashierNoOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.ECR_NoList" [submitted]="submitted"></app-multi-select>
          <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="發票號碼(起)" endLabel="發票號碼(訖)"
            [startControl]="queryForm.controls.TXN_GUINo_Start" [endControl]="queryForm.controls.TXN_GUINo_End"
            [submitted]="submitted" [errorForGroup]="true"></app-input-text-range>
        </div>
        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="FIN13070" [data]="data" [columns]="columns" [multiSortMeta]="[]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="true" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showManage]="false"
    [showCheckBox]="true" (delete)="onDelete($event)" [deleteIcon]="'pi pi-times'" [deletepTooltip]="'取消作廢'">
  </app-table>
</div>
