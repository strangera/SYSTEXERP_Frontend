<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="常用傳票代號"
                          controlName="TempNo"
                          [control]="qf().TempNo"
                          [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="常用傳票名稱"
                          controlName="TempName"
                          [control]="qf().TempName"
                          [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票種類"
                        controlName="VouType"
                        [options]="service.vouTypeOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().VouType"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="建立者"
                        controlName="CRT_USR_No"
                        [options]="service.usrList()"
                        optionLabel="label"
                        optionValue="value"
                        [disabled]="service.usrLoading()"
                        [control]="qf().CRT_USR_No"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="修改者"
                        controlName="UPD_USR_No"
                        [options]="service.usrList()"
                        optionLabel="label"
                        optionValue="value"
                        [disabled]="service.usrLoading()"
                        [control]="qf().UPD_USR_No"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="service.tableLoading()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>


<div class="card">
  <div class="col-12">
    <app-table [data]="service.FIN52030Data()"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"
               [loading]="service.tableLoading()"
               [dataKey]="'id'"
               [tableKey]="'FIN52030'"></app-table>
  </div>
</div>
