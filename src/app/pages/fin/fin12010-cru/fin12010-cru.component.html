<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <!-- <app-datemm-two label="發票年月" [control]="dataForm.controls.twodatemm" [submitted]="submitted">
                    </app-datemm-two> -->
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="字軌" controlName="wordTrack" [control]="dataForm.controls.wordTrack"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number-range [useGrouping]="false" label="發票號碼"
            [startControl]="dataForm.controls.startserialInvoice" [endControl]="dataForm.controls.endserialInvoice"
            [submitted]="submitted">
          </app-input-number-range>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="使用別" controlName="usageType" [options]="usageTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.usageType" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
