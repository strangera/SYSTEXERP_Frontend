<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="發票年月"
          [control]="dataForm.controls.SAL_GUIYYYYMM" [submitted]="submitted" [minDate]="minDate" />
        <app-input-text class="col-12 lg:col-6 xl:col-4" label="字軌" controlName="SAL_GUITrack"
          [control]="dataForm.controls.SAL_GUITrack" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="券數(1券=50張)" controlName="GUI_Qty"
          [control]="dataForm.controls.GUI_Qty" [max]="99999999" [useGrouping]="false" [submitted]="submitted" />
        <app-input-text-range class="col-12 lg:col-6 xl:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
          [startControl]="dataForm.controls.SAL_GUIBegNo" [endControl]="dataForm.controls.SAL_GUIEndNo"
          [submitted]="submitted" [errorForGroup]="true" />
        <app-dropdown class="col-12 lg:col-6 xl:col-4" label="使用別" controlName="SAL_Type" [options]="usageTypeOptions"
          optionLabel="SYS_Name" optionValue="SYS_Code" [control]="dataForm.controls.SAL_Type"
          [submitted]="submitted"></app-dropdown>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
