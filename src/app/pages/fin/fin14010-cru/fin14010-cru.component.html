<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="資料別" controlName="REP_DataType" [options]="REP_DataType_Option"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.REP_DataType"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateMonthOne" class="col-12 md:col-6 lg:col-5" label="資料所屬年月"
            [control]="dataForm.controls.REP_GUIYM" [submitted]="submitted" />
        </div>
      </div>
      <hr>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="購買國外勞務給付額" controlName="REP_PurBuyExternal" [control]="dataForm.controls.REP_PurBuyExternal"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="進口免稅貨物" controlName="REP_PurImportNoTax" [control]="dataForm.controls.REP_PurImportNoTax"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="固定資產" controlName="REP_PurcTotalSaleAmt" [control]="dataForm.controls.REP_PurcTotalSaleAmt"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="進貨及費用" controlName="REP_PurfTotalSaleAmt" [control]="dataForm.controls.REP_PurfTotalSaleAmt"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="上期(月)累積留抵稅額" controlName="REP_TaxSum08" [control]="dataForm.controls.REP_TaxSum08"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="得退稅限額合計" controlName="REP_TaxSum13" [control]="dataForm.controls.REP_TaxSum13"
          [maxFractionDigits]="2" [submitted]="submitted" />  
        </div>
      </div>
    
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" />
      </div>
    </form>
  </p-panel>
</div>
