<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 基本資料 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="票據號碼"
            controlName="CHK_No"
            [control]="dataForm.controls.CHK_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="廠客代號"
            controlName="VEN_No"
            [options]="vendorOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.VEN_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="銀行代號"
            controlName="BNK_Key"
            [options]="bankNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.BNK_Key"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="客戶銀行帳號"
            controlName="BNK_AccNo"
            [control]="dataForm.controls.BNK_AccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="託收日"
            controlName="CHK_ColleDate"
            [control]="dataForm.controls.CHK_ColleDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="託收銀行"
            controlName="COL_BNK_id"
            [options]="colBankAccOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.COL_BNK_id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="收票日"
            controlName="CHK_ReceDate"
            [control]="dataForm.controls.CHK_ReceDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>
       
<div class="col-12 md:col-6 lg:col-4">
  <app-input-text
    label="收票業務員"
    controlName="Sales_Id"
    [control]="dataForm.controls.Sales_Id"
    [submitted]="submitted"
    [disabled]="true"
  ></app-input-text>
</div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="收款單號"
            controlName="RCV_No"
            [control]="dataForm.controls.RCV_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>


        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="到期日"
            controlName="CHK_ExpireDate"
            [control]="dataForm.controls.CHK_ExpireDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="預兌日"
            controlName="CHK_PreDate"
            [control]="dataForm.controls.CHK_PreDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="兌現日"
            controlName="CHK_CashDate"
            [control]="dataForm.controls.CHK_CashDate"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="票面金額"
            controlName="CHK_Amt"
            [control]="dataForm.controls.CHK_Amt"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="是否客票"
            controlName="Ticket_YN"
            [options]="ticketYNOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Ticket_YN"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="票據種類"
            controlName="CHK_Type"
            [options]="chkTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.CHK_Type"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-12">
          <app-input-text
            label="備註"
            controlName="CHK_Comment"
            [control]="dataForm.controls.CHK_Comment"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <!-- 其他資料 -->
      <p-panel header="其他資料" class="line-height-3 m-0">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="ORG_ID"
              [options]="orgOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.ORG_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代號"
              controlName="ProjectNo"
              [options]="projectOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.ProjectNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="TranStatus"
              [options]="tranStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.TranStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

         <div class="col-12 md:col-6 lg:col-4">
  <app-dropdown
    label="票據狀態"
    controlName="CHK_Status"
    [options]="chkStatusOptions"
    optionLabel="label"
    optionValue="value"
    [control]="dataForm.controls.CHK_Status"
    [submitted]="submitted"
  ></app-dropdown>
</div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="應收票據科目名稱"
              controlName="AccName"
              [control]="dataForm.controls.AccName"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              controlName="VouNo"
              [control]="dataForm.controls.VouNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="對象別"
              controlName="ObjectType"
              [control]="dataForm.controls.ObjectType"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="對應KEY值"
              controlName="ObjectKey"
              [control]="dataForm.controls.ObjectKey"
              [submitted]="submitted"
            ></app-input-text>
          </div>
                  <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="託收帳戶"
            controlName="COL_BNK_id"
            [options]="colBankAccOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.COL_BNK_id"
            [submitted]="submitted"
          ></app-dropdown>
        </div> -->
        </div>
      </p-panel>

      <div
        class="mt-2 text-red-500"
        *ngIf="crudstatus !== CRUDStatus.Read && !isEditable"
      >
        ※ 此票據已拋轉/已兌現/已退票，依規格不可再修改。
      </div>

      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="crudstatus !== CRUDStatus.Read && isEditable"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
