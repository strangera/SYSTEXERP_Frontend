<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="card">
        <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords" [selectedItems]="selectedItems"
          (selectedItemsChange)="selectedItems = $event" [showCheckBox]="true" [showPaginator]="true"
          [selectionMode]="'multiple'" [rowsPerPageOptions]="[10, 25, 50, 100]" [loading]="loading"
          tableKey="FIN29060CRU">
        </app-table>
      </div>

    </form>
  </p-panel>
</div>
