<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="發票年月"
          [control]="dataForm.controls.GUI_YYMM" [submitted]="submitted" [minDate]="minDate" />
        <app-input-number *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="序號" controlName="GUI_SerNo"
          [control]="dataForm.controls.GUI_SerNo" [useGrouping]="false" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="GUI_Track"
          [control]="dataForm.controls.GUI_Track" [submitted]="submitted" />
        <app-input-text-range class="col-12 md:col-6 lg:col-8" startLabel="發票起始號碼" endLabel="發票結束號碼"
          [startControl]="dataForm.controls.GUI_BegNo" [endControl]="dataForm.controls.GUI_EndNo"
          [submitted]="submitted" [errorForGroup]="true" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="券數(1券=50張)" controlName="GUI_Qty"
          [control]="dataForm.controls.GUI_Qty" [max]="99999999" [useGrouping]="false" [submitted]="submitted" />
        <app-input-number *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="發票號碼已分配張數"
          controlName="GUI_AssignQty" [control]="dataForm.controls.GUI_AssignQty" [useGrouping]="false" />
        <app-dropdown *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="發票狀態" controlName="GUI_Status"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.GUI_Status"
          [options]="guiStatusOptions" />
        <app-dropdown *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="發票類別" controlName="GUI_Type"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.GUI_Type" [options]="guiTypeOptions" />
        <app-input-text *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="匯入檔案名稱" controlName="GUI_File"
          [control]="dataForm.controls.GUI_File" />
      </div>
      <!-- <hr *ngIf="!isFormCreateable">
      <div *ngIf="!isFormCreateable" class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-3" label="設定確認人員一" controlName="GUI_VERIFY1"
          [control]="dataForm.controls.GUI_VERIFY1" />
        <app-input-text class="col-12 md:col-6 lg:col-3" label="設定確認人員一姓名" controlName="GUI_VERIFY1_Name"
          [control]="dataForm.controls.GUI_VERIFY1_Name" />
        <app-input-text class="col-12 md:col-6 lg:col-3" label="設定確認人員二" controlName="GUI_VERIFY2"
          [control]="dataForm.controls.GUI_VERIFY2" />
        <app-input-text class="col-12 md:col-6 lg:col-3" label="設定確認人員二姓名" controlName="GUI_VERIFY2_Name"
          [control]="dataForm.controls.GUI_VERIFY2_Name" />
      </div> -->
      <hr *ngIf="!isFormCreateable">
      <div *ngIf="!isFormCreateable" class="grid p-fluid">
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="建立日期"
          [control]="dataForm.controls.CRT_Date" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員" controlName="CRT_USR_No"
          [control]="dataForm.controls.CRT_USR_No" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員姓名" controlName="CRT_USR_Name"
          [control]="dataForm.controls.CRT_USR_Name" />
        <!-- <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="變更日期"
          [control]="dataForm.controls.UPD_Date" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員" controlName="UPD_USR_No"
          [control]="dataForm.controls.UPD_USR_No" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變更人員姓名" controlName="UPD_USR_Name"
          [control]="dataForm.controls.UPD_USR_Name" /> -->
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" />
      </div>
    </form>
  </p-panel>
</div>
