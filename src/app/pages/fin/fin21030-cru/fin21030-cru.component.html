<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠客編號" controlName="VEN_No" [control]="dataForm.controls.VEN_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠客簡稱" controlName="VEN_ShortName" [control]="dataForm.controls.VEN_ShortName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="郵遞區號" controlName="VEN_Post" [control]="dataForm.controls.VEN_Post"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="郵寄地址" controlName="VEN_Address" [control]="dataForm.controls.VEN_Address"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="聯絡人" controlName="VEN_Boss" [control]="dataForm.controls.VEN_Boss"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="電話" controlName="VEN_Tel" [control]="dataForm.controls.VEN_Tel"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商傳真" controlName="VEN_Fax" [control]="dataForm.controls.VEN_Fax"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="統一編號" controlName="VEN_Uniform" [control]="dataForm.controls.VEN_Uniform"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="郵電負擔模式" controlName="VEN_RemitFeeMode" [control]="dataForm.controls.VEN_RemitFeeMode"
            [options]="remitFeeOptions" optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="貼現廠商" controlName="VEN_DiscYN" [options]="VEN_DiscYNOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_DiscYN" [submitted]="submitted"></app-dropdown>
        </div>
        <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="貼現日期"
          [startControl]="dataForm.controls.VEN_DiscDateB" [endControl]="dataForm.controls.VEN_DiscDateE"
          [submitted]="submitted" />
      </div>
      <div class="col-12 mt-5">
        <h5>帳 戶 資 料</h5>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="禁止背書轉讓" controlName="VEN_CTRLYN" [options]="VEN_CTRLYNOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_CTRLYN" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="付款方式" controlName="VEN_PayType" [options]="VEN_PayTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_PayType" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商匯款銀行代號" controlName="VEN_BNK_No" [control]="dataForm.controls.VEN_BNK_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商銀行帳號" controlName="VEN_BankAccountNo" [control]="dataForm.controls.VEN_BankAccountNo"
            [submitted]="submitted"></app-input-text>
        </div>


        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="廠商帳戶名稱" controlName="VEN_AccountName" [control]="dataForm.controls.VEN_AccountName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="付款期限" controlName="VEN_PayConditionDay"
            [control]="dataForm.controls.VEN_PayConditionDay" [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="票據抬頭" controlName="VEN_CheckTitle" [control]="dataForm.controls.VEN_CheckTitle"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="審核狀態" controlName="VEN_Status" [options]="approvalOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_Status" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="匯款統編" controlName="GUI_ID_WIRE" [control]="dataForm.controls.GUI_ID_WIRE"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
