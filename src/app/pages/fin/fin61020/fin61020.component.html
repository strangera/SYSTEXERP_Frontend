<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="業務員代號" controlName="Sales_Id" [control]="queryForm.controls.Sales_Id"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="員工編號" controlName="User_no" [control]="queryForm.controls.User_no"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="員工姓名" controlName="User_Name" [control]="queryForm.controls.User_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-dropdown label="組織代號" controlName="ORG_ID" [control]="queryForm.controls.ORG_ID"
              [submitted]="submitted" [options]="orgOptions | async" optionLabel="label"
              optionValue="value"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="lastQuery" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" (delete)="onDelete($event)" [showCheckBox]="true"
    [queryFunction]="fin61020Service.queryFIN61020.bind(fin61020Service)"></app-table-report>
</div>
