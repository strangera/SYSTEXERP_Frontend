<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div >
      <app-button
        btnType="create"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text
              label="業務員代號"
              controlName="Salespersoncode"
              [control]="queryForm.controls.Salespersoncode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text
              label="員工編號"
              controlName="Employeenumber"
              [control]="queryForm.controls.Employeenumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text
              label="員工姓名"
              controlName="Employeename"
              [control]="queryForm.controls.Employeename"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text
              label="組織代號"
              controlName="Organizationcode"
              [control]="queryForm.controls.Organizationcode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
