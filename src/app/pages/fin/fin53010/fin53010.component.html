<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-number-range class="col-12 md:col-6 lg:col-4"
                                  [useGrouping]="false"
                                  label="傳票號碼"
                                  [startControl]="qf().VouNoStart"
                                  [endControl]="qf().VouNoEnd"
                                  [submitted]="submitted"></app-input-number-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票種類"
                        controlName="VouType"
                        [options]="service.vouTypeOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().VouType"
                        [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateRange"
                              label="傳票日期"
                              controlName="VouDate"
                              [startControl]="qf().VouDateStart"
                              [endControl]="qf().VouDateEnd"
                              [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票狀態"
                        controlName="PostFlag"
                        [options]="service.postFlagOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().PostFlag"
                        [submitted]="submitted"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="傳票摘要"
                          controlName="remark"
                          [control]="qf().Remark"
                          [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票型態"
                        controlName="VoucherType"
                        [options]="service.voucherTypeList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().VoucherType"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="建立者"
                        controlName="CRT_USR_No"
                        [control]="qf().CRT_USR_No"
                        [options]="service.usrList()"
                        [loading]="service.usrLoading()"
                        optionLabel="label"
                        optionValue="value"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="修改者"
                        controlName="UPD_USR_No"
                        [control]="qf().UPD_USR_No"
                        [options]="service.usrList()"
                        [loading]="service.usrLoading()"
                        optionLabel="label"
                        optionValue="value"
                        [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateRange"
                              label="建立日期"
                              controlName="crtDate"
                              [startControl]="qf().CrtDateStart"
                              [endControl]="qf().CrtDateEnd"
                              [submitted]="submitted"></app-calendar-range>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateRange"
                              label="修改日期"
                              controlName="updDate"
                              [startControl]="qf().UpdDateStart"
                              [endControl]="qf().UpdDateEnd"
                              [submitted]="submitted"></app-calendar-range>
          <app-radiobutton class="col-12 md:col-6 lg:col-4"
                           label="ROC/IFRS"
                           groupname="VouAccType"
                           [control]="qf().VouAccType"
                           [options]="service.vouAccTypeOptions()"
                           [submitted]="submitted"></app-radiobutton>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="service.tableLoading()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>


<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="!0"
               [data]="service.FIN53010Data()"
               [columns]="columns"
               [totalRecords]="service.totalRecords()"
               (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
               [lazy]="true"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"
               [multiSortMeta]="multiSortMeta"
               [loading]="service.tableLoading()"
               [dataKey]="'id'"
               [tableKey]="'FIN53010'"></app-table>
  </div>
</div>
