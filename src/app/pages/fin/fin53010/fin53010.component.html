<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-number-range class="col-12 md:col-6 lg:col-4"
                                  [useGrouping]="false"
                                  label="傳票號碼"
                                  [startControl]="qf().startSubpoenaNo"
                                  [endControl]="qf().endSubpoenaNo"
                                  [submitted]="submitted"></app-input-number-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票種類"
                        controlName="subpoenaType"
                        [options]="service.subpoenaTypes()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().subpoenaType"
                        [submitted]="submitted"></app-dropdown>
          <app-calendar-range calendarType="dateRange"
                              label="傳票日期(起訖)"
                              controlName="accountsummary"
                              [startControl]="qf().sSubpoenaDate"
                              [endControl]="qf().eSubpoenaDate"
                              [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票狀態"
                        controlName="subpoenaStatus"
                        [options]="service.subpoenaStatus()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().subpoenaStatus"
                        [submitted]="submitted"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="傳票摘要"
                          controlName="subpoenaSummary"
                          [control]="qf().subpoenaSummary"
                          [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="傳票型態"
                        controlName="subpoenaType2"
                        [options]="service.subpoenaTypes2()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().subpoenaType2"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="建立者"
                        controlName="creator"
                        [options]="service.usrList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().creator"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="修改者"
                        controlName="modifier"
                        [options]="service.usrList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().modifier"
                        [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateRange"
                              label="建立日期"
                              controlName="builddate"
                              [startControl]="qf().sBuildDate"
                              [endControl]="qf().eBuildDate"
                              [submitted]="submitted"></app-calendar-range>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateRange"
                              label="修改日期"
                              controlName="modifydate"
                              [startControl]="qf().sModifyDate"
                              [endControl]="qf().eModifyDate"
                              [submitted]="submitted"></app-calendar-range>
          <app-radiobutton class="col-12 md:col-6 lg:col-4"
                           label="ROC/IFRS"
                           groupname="rocifrs"
                           [control]="qf().rocifrs"
                           [options]="service.rocifrsOptions()"
                           [submitted]="submitted">
          </app-radiobutton>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="service.tableLoading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>


<div class="card">
  <div class="col-12">
    <app-table [data]="filteredData()"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"
               [loading]="service.tableLoading"
               [dataKey]="'id'"
               [tableKey]="'FIN53010'"></app-table>
  </div>
</div>
