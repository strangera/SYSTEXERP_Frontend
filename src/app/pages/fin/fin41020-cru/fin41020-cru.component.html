<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>

  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 部門代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="部門代號" controlName="departmentCode" [control]="dataForm.controls.departmentCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 版本 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="版本" controlName="version" [control]="dataForm.controls.version"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 年 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="年" controlName="year" [control]="dataForm.controls.year"
            [submitted]="submitted"></app-input-text>
        </div>
        <!-- 會計科目 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="會計科目" controlName="accountCode" [control]="dataForm.controls.accountCode"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <!-- 動態新增項目 -->
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <!-- 月 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="月" controlName="month" [control]="getFormControl(i, 'month')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 金額 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="金額" controlName="amount" [control]="getFormControl(i, 'amount')"
                [submitted]="submitted"></app-input-text>
            </div>
            <!-- 備註 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="備註" controlName="remark" [control]="getFormControl(i, 'remark')"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>

      <!-- 動態新增按鈕 -->
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>

    <!-- 提交和取消按鈕 -->
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
