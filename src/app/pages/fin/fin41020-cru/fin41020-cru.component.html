<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 部門代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="部門代號"
            controlName="OrgId"
            [control]="dataForm.controls.OrgId"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 版本 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="版本"
            controlName="BudgetVersion"
            [control]="dataForm.controls.BudgetVersion"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 年 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="年"
            controlName="BudgetYear"
            [control]="dataForm.controls.BudgetYear"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 會計科目 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="會計科目"
            controlName="AccNo"
            [control]="dataForm.controls.AccNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <!-- 動態表單欄位... -->
      <app-table-edit
        tableKey="FIN41020Detail"
        class="col-12"
        [data]="data"
        [columns]="columns"
        [showCheckBox]="false"
        (selectionChange)="selectedRows = $event"
        [selectedItems]="selectedRows"
        (dataChange)="data = $event"
        [disabled]="isFormReadable"
        [tableRequired]="true"
        [showReorder]="false"
        [showDelete]="false"
      ></app-table-edit>

      <!-- 提交和取消按鈕 -->
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="resetTable()"
        ></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
