<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="保管人代碼"
                      controlName="Keep_UsrNo"
                      [options]="usrNoDisplayOptions()"
                      optionLabel="displayLabel"
                      optionValue="Keep_UsrNo"
                      [loading]="service.usrLoading()"
                      [control]="df().Keep_UsrNo"
                      [submitted]="submitted"></app-dropdown>

        <app-input-number class="col-12 md:col-6 lg:col-4"
                          label="零用金額度"
                          controlName="Keep_QuotaAmt"
                          [minFractionDigits]="0"
                          [maxFractionDigits]="0"
                          [control]="df().Keep_QuotaAmt"
                          [submitted]="submitted"></app-input-number>

        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="保管單位"
                      controlName="Keep_Orgid"
                      [options]="orgIdDisplayOptions()"
                      optionLabel="displayLabel"
                      optionValue="Org_No"
                      [loading]="service.orgLoading()"
                      [control]="df().Keep_Orgid"
                      [submitted]="submitted"></app-dropdown>

        <app-input-textarea class="col-12 md:col-6 lg:col-4"
                            label="說明"
                            controlName="Keep_Remark"
                            [control]="df().Keep_Remark"
                            [styleClass]="'h-10rem'"
                            [submitted]="submitted"></app-input-textarea>
      </div>

      @if (!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"></app-button>
        <app-button btnType="submit"
                    [loading]="loading"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>
