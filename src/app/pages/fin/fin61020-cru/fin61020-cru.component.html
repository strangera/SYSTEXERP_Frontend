<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text label="業務員代號" controlName="Sales_Id" [control]="dataForm.controls.Sales_Id"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-dropdown label="員工編號" controlName="User_no" [control]="dataForm.controls.User_no" [submitted]="submitted"
            [options]="userOptions | async" optionLabel="user_No" optionValue="user_No"
            templateLabel="label"></app-dropdown>
        </div>

        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text label="員工姓名" controlName="User_Name" [control]="dataForm.controls.User_Name"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-dropdown label="組織代號" controlName="ORG_ID" [control]="dataForm.controls.ORG_ID" [submitted]="submitted"
            [options]="orgOptions | async" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
