<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="建立日期"
          controlName="CreateDate"
          [control]="dataForm.controls.CreateDate"
          [submitted]="submitted"
        />
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="匯款日期"
          controlName="TransferDate"
          [control]="dataForm.controls.TransferDate"
          [submitted]="submitted"
        />
      </div>
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="銀行代號"
          controlName="BankCode"
          [options]="bankOptions"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.BankCode"
          [submitted]="submitted"
          [showClear]="true"
          [filter]="true"
        />
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="銀行名稱"
          controlName="BankName"
          [control]="dataForm.controls.BankName"
          [submitted]="submitted"
          [readonly]="true"
        />
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="匯款來源單號"
            controlName="TransferSourceNo"
            [options]="transferSourceOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.TransferSourceNo"
            [submitted]="submitted"
            [showClear]="true"
            [filter]="true"
          />
          <div class="mt-2">
            <app-button
              btnType="submit"
              label="查詢匯款來源單號"
              icon="pi pi-search"
              (click)="openTransferSourceDialog()"
              severity="secondary"
            ></app-button>
          </div>
        </div>
      </div>

      <div
        class="grid justify-content-end gap-2 m-0 mt-3 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" (click)="onCancel()" />
        <app-button
          btnType="submit"
          label="確認形成"
          icon="pi pi-check"
          [loading]="loading"
          (click)="onSubmit(dataForm)"
          severity="success"
        />
      </div>
    </form>
  </p-panel>
</div>

<!-- 匯款來源單號查詢對話框 -->
<p-dialog
  header="查詢匯款來源單號"
  [(visible)]="showTransferSourceDialog"
  [modal]="true"
  [style]="{ width: '80vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="transferSourceQueryForm">
    <div class="grid p-fluid mb-3">
      <app-input-text
        class="col-12 md:col-6"
        label="匯款來源單號"
        controlName="SourceNo"
        [control]="transferSourceQueryForm.controls.SourceNo"
      />
      <div class="col-12 md:col-6 flex align-items-end">
        <app-button
          btnType="query"
          (click)="onQueryTransferSource()"
        ></app-button>
      </div>
    </div>
  </form>

  <app-table
    tableKey="TransferSourceQuery"
    dataKey="SourceNo"
    [data]="transferSourceData"
    [columns]="transferSourceColumns"
    [showCheckBox]="false"
  ></app-table>

  <ng-template pTemplate="footer">
    <app-button
      btnType="cancel"
      (click)="showTransferSourceDialog = false"
    ></app-button>
  </ng-template>
</p-dialog>
