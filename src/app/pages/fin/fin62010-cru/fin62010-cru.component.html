<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="調撥單號" controlName="Tran_No" [control]="dataForm.controls.Tran_No"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="建立者" controlName="CRT_USR_Name" [control]="dataForm.controls.CRT_USR_Name"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="建立日期" controlName="CRT_Date"
            [control]="dataForm.controls.CRT_Date" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="轉帳日期" controlName="Tran_Date"
            [control]="dataForm.controls.Tran_Date" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="轉入公司銀行科目代號" controlName="BNK_No_In" [options]="BNK_NoOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.BNK_No_In" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="轉出公司銀行科目代號" controlName="BNK_No_Out" [options]="BNK_NoOptions | async"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.BNK_No_Out"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="金額" controlName="Tran_Amt" [control]="dataForm.controls.Tran_Amt"
            [submitted]="submitted">
          </app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="手續費" controlName="Fee_Amt" [control]="dataForm.controls.Fee_Amt"
            [submitted]="submitted">
          </app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="備註" controlName="Remark" [control]="dataForm.controls.Remark"
            [submitted]="submitted">
          </app-input-textarea>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
