<p-table #dt [columns]="columns" [value]="data" [scrollable]="true" [dataKey]="dataKey" scrollHeight="flex"
  sortMode="multiple" [rowTrackBy]="trackByFn" [resizableColumns]="true" [reorderableColumns]="true"
  (onColReorder)="onColReorder($event)" styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped"
  [loading]="loading" rowGroupMode="subheader" [groupRowsBy]="groupRowsBy">

  <ng-template pTemplate="header" let-columns>
    <tr class="bg-gray-100">
      <th *ngFor="let col of columns" pReorderableColumn pResizableColumn [pSortableColumn]="col.sortField ?? col.field"
        class="text-center wrap-header font-bold" style="min-width: 55px">
        {{ col.header }}
        <p-sortIcon *ngIf="col.showSort !== false && data.length" [field]="col.field" />
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="groupheader" let-rowData>
    <tr pRowGroupHeader class="bg-bluegray-50">
      <td [attr.colspan]="columns.length" class="py-3">
        <span class="font-bold text-xl text-bluegray-800">[{{rowData.ItemTitle}}]</span>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="groupfooter" let-rowData>
    <tr class="font-semibold bg-gray-50 border-bottom-1 border-gray-200">
      <td *ngFor="let col of columns" [ngStyle]="{'text-align': col.align || 'center'}" class="py-2">
        <ng-container
          *ngIf="col.field === 'Balance' || col.field === 'Pct' || col.field === 'BalanceTotal'; else otherCell">
          <span class="text-blue-700 font-bold">
            {{ getGroupSubtotal(rowData, col) }}
          </span>
        </ng-container>

        <ng-template #otherCell>
          <span *ngIf="col.field === 'AccNo'" class="text-600 italic">
            {{ rowData.ItemTitle }} 小計：
          </span>
        </ng-template>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns">
    <tr [style]="{ height: '28px' }">
      <td *ngFor="let col of columns" [ngStyle]="{'text-align': col.align ? col.align : 'center'}">
        {{ col.format ? col.format(rowData?.[col.field], rowIndex, rowData) : rowData?.[col.field] }}
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="footer" let-columns>
    <tr *ngIf="footerData" class="bg-bluegray-700 text-white font-bold border-top-2 border-bluegray-900">
      <ng-container *ngFor="let col of columns">
        <td [ngStyle]="{'text-align': col.align || 'center'}" class="py-3">
          <span>
            {{ col.format ? col.format(footerData[col.field]) : footerData[col.field] }}
          </span>
        </td>
      </ng-container>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="columns.length">
        <div class="flex flex-column justify-content-center align-items-center p-5 text-400">
          <i class="pi pi-search text-4xl mb-2"></i>
          <span class="font-bold text-xl">目前查無報表資料</span>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
