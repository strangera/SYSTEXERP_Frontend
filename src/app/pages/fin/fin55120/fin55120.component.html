<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="日期(年月)" controlName="accountsummary"
              [control]="queryForm.controls.SSubpoenadate" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="類別" [control]="queryForm.controls.category" [options]="category"
              [submitted]="submitted">
            </app-radiobutton>
          </div>
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox label="列印簽核欄" controlName="Approvalcolumn">
            </p-checkbox>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="帳款餘額為零是否顯示" controlName="display" [options]="display" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.display" [submitted]="submitted"></app-dropdown>
          </div>


        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>



      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"></app-table>
  </div>
</div>
