<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="匯款/開票/調撥日期"
              [startControl]="queryForm.controls.TxnDate_From"
              [endControl]="queryForm.controls.TxnDate_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="銀行代號"
              [startControl]="queryForm.controls.BNK_No"
              [endControl]="queryForm.controls.BNK_No"
              [submitted]="submitted"
              [options]="BankOptions"
              optionLabel="label"
              optionValue="value"
            ></app-dropdown-range>
          </div>

          <!-- 匯款/開票/調撥單號(起迄) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="匯款/開票/調撥單號"
              controlName="DocNo_From"
              [startControl]="queryForm.controls.DocNo_From"
              [endControl]="queryForm.controls.DocNo_To"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="型態"
              [control]="queryForm.controls.TxnType"
              [options]="TxnTypeOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-subheader
      tableKey="Seqno"
      dataKey="TxnDocumentNo"
      [data]="data"
      [columns]="columns"
      [showCheckBox]="false"
      [showManage]="false"
      [showDelete]="false"
      (detail)="onDetail($event)"
      [multiSortMeta]="[]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [groupRowsBy]="''"
      [groupRowsByName]="''"
      [showGroupheader]="false"
      [loading]="loading"
      [showSerialNo]="false"
      [showPaginator]="false"
      [showReportMode]="false"
      [showSort]="false"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="付款交易明細表.PDF"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
            [loading]="pdfBtnLoading"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="付款交易明細表.XLSX"
            icon="pi pi-file"
            (click)="onExportExcel()"
            [disabled]="data.length === 0"
            [loading]="excelBtnLoading"
          ></p-button>
        </div>
      </header>
    </app-table-subheader>
  </div>
</div>
