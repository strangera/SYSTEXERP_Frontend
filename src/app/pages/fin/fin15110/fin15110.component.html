<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="銷售日期" [startControl]="queryForm.controls.TXN_DT_S"
              [endControl]="queryForm.controls.TXN_DT_E" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="收銀機號" controlName="dropdownRange" [startControl]="queryForm.controls.ECR_No_S"
              [endControl]="queryForm.controls.ECR_No_E" [submitted]="submitted" [options]="ECRNoOptions"
              optionLabel="Name" optionValue="No"></app-dropdown-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="資料種類" controlName="DataType" [options]="DATE_TYPEOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.DataType" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>



<div class="card mt-5">
  <app-customFooter-table tableKey="FIN15110" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [footerData]="footerData" dataKey="Ecr_No" [lazy]="true" [loading]="loading" [showManage]="false"
    [showDelete]="false" [multiSortMeta]="queryForm.controls.SortBy.value" [showReportMode]="false" [showTotal]="true"
    (lazyLoadData)="onLazyLoadData($event)">

    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="二電發票表.PDF" [loading]="btnLoading" icon="pi pi-file-pdf"
            (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
          <p-button styleClass="p-2" label="二電發票表.xlsx" [loading]="btnLoading2" icon="pi pi-file-excel"
            (click)="onExportExcel()" [disabled]="data.length === 0"></p-button>
        </div>
      </div>
    </header>
  </app-customFooter-table>
</div>
