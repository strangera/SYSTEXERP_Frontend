<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="公司銀行代號" controlName="companyBankCode"
            [control]="queryForm.controls.companyBankCode" [submitted]="submitted"></app-input-text>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="狀態" controlName="statusList"
            [options]="statusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.statusList" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="FIN61010"
      dataKey="id"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords"
      [loading]="loading"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [showCheckBox]="false"
      [showDelete]="false"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)">
    </app-table-report>
  </div>
</div>
