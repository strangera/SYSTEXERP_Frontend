<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" controlName="accountsummary"
              [startControl]="queryForm.controls.DateFrom" [endControl]="queryForm.controls.DateTo"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="類別" [control]="queryForm.controls.Ledger_MD" [options]="typeOptions"
              [submitted]="submitted" groupname="Ledger_MD"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門" controlName="OrgId" [options]="ORG_IDOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OrgId" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid p-fluid">
              <div class="col pb-0">
                <app-dropdown label="科目代號" controlName="AccNoFrom" [options]="AccNo_Options | async" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.AccNoFrom" [submitted]="submitted"
                  (valueChange)="onAccNoFromChange($event)"></app-dropdown>
              </div>
              <div class="flex flex-column justify-content-center align-items-center pt-3">
                <span class="text-center">~</span>
              </div>
              <div class="col pb-0">
                <app-dropdown label="科目代號" controlName="AccNoTo" [options]="AccNo_Options | async" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.AccNoTo" [submitted]="submitted"></app-dropdown>
              </div>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="會科是否全部顯示" [control]="queryForm.controls.ShowAll" [options]="display"
              [submitted]="submitted" groupname="ShowAll"></app-radiobutton>
          </div>
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox label="列印簽核欄" [formControl]="queryForm.controls.PrintSign" binary="true">
            </p-checkbox>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report [columns]="columns" [data]="data" [loading]="loading" [totalRecords]="totalRecords"
    [showReportMode]="false" [columnGroup]="columnGroup" [lazy]="false" [showManage]="false" [showDelete]="false"
    [footerData]="footerData" [ItemSize]="25">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出試算表.PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0" [loading]="false"></p-button>
        <p-button styleClass="p-2" label="產出試算表.XLSX" [loading]="btnLoading" icon="pi pi-file" (click)="onExportXLSX()"
          [disabled]="data.length === 0" [loading]="false"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
