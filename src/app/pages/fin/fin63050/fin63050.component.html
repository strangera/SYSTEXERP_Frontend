<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick calendarType="dateRange" label="撤票日" controlName="generalCode"
              [startControl]="queryForm.controls.WithdrawDateFrom" [endControl]="queryForm.controls.WithdrawDateTo"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="票據號碼" controlName="ChkNo" [control]="queryForm.controls.ChkNo"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="RowNo" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    (edit)="onEdit($event)" (detail)="onDetail($event)" [lastQueryBody]="lastQuery"
    [queryFunction]="fin63050Service.queryFIN63050.bind(fin63050Service)" [loading]="loading" [showDelete]="false"
    [showCheckBox]="true" (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
    [isRowSelectable]="isRowSelectable" [showReportMode]="false" [editDisabled]="editDisabled">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="支票撤票" [loading]="btnLoading" (click)="onWithdraw()"
            [disabled]="data.length === 0 || selectedItems.length === 0" [loading]="btnLoading"></p-button>
        </div>
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="匯出應付票據撤票作業資料.PDF" [loading]="btnLoading" icon="pi pi-file"
            (click)="onExportPDF()" [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
            [loading]="btnLoading"></p-button>
          <p-button styleClass="p-2" label="匯出應付票據撤票作業資料.XLSX" [loading]="btnLoading" icon="pi pi-file"
            (click)="onExportXLSX()" [disabled]="data.length === 0 || !hasPermission(Actions.ExportExcel)"
            [loading]="btnLoading"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>


<app-dialog [visible]="dialogVisible" header="支票撤票" (visibleChange)="dialogVisible = $event"
  (save)="saveDialog(dialogQueryForm)" width="400px">
  <form [formGroup]="dialogQueryForm">
    <div class="grid p-fluid">
      <app-calendar class="col-12" label="撤票日期" controlName="WithdrawDate"
        [control]="dialogQueryForm.controls.WithdrawDate" />
      <app-dropdown class="col-12" label="原因" controlName="Remark" [control]="dialogQueryForm.controls.Remark"
        [options]="RemarkOptions" optionLabel="label" optionValue="value" />
    </div>
  </form>
</app-dialog>
