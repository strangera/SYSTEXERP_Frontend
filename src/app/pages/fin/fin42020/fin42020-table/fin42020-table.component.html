<p-table
  [value]="detailData"
  [scrollable]="true"
  [columns]="columns"
  scrollHeight="700px"
  [tableStyle]="{ 'min-width': '60rem' }"
>
  <!-- 三層表頭 -->
  <ng-template pTemplate="header">
    <!-- 第1層 -->
    <tr>
      <th
        rowspan="3"
        class="text-center wrap-header p-2"
        style="min-width: 30px"
      >
        科目代號
      </th>
      <th
        rowspan="3"
        class="text-center wrap-header p-2"
        style="min-width: 30px"
      >
        科目名稱
      </th>

      <th colspan="8" class="text-center wrap-header p-2">本月</th>
      <th colspan="7" class="text-center wrap-header p-2">累計</th>
    </tr>

    <!-- 第2層 -->
    <tr>
      <!-- 本月 -->
      <th colspan="2" class="text-center wrap-header p-2">本期</th>
      <th colspan="2" class="text-center wrap-header p-2">去年</th>
      <th rowspan="2" class="text-center wrap-header p-2">增減率(%)</th>
      <th rowspan="2" class="text-center wrap-header p-2">預算</th>
      <th rowspan="2" class="text-center wrap-header p-2">預算與本期差異</th>
      <th rowspan="2" class="text-center wrap-header p-2">預算比增減率</th>

      <!-- 累計 -->
      <th colspan="2" class="text-center wrap-header p-2">本期累計</th>
      <th colspan="2" class="text-center wrap-header p-2">去年累計</th>
      <th rowspan="2" class="text-center wrap-header p-2">增減率(%)</th>
      <th rowspan="2" class="text-center wrap-header p-2">預算</th>
      <th rowspan="2" class="text-center wrap-header p-2">預算比增減率</th>
    </tr>

    <!-- 第3層 -->
    <tr>
      <!-- 本月 -->
      <th class="text-center wrap-header p-2" style="min-width: 80px">金額</th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">
        佔比(%)
      </th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">金額</th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">
        佔比(%)
      </th>

      <!-- 累計 -->
      <th class="text-center wrap-header p-2" style="min-width: 80px">金額</th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">
        佔比(%)
      </th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">金額</th>
      <th class="text-center wrap-header p-2" style="min-width: 80px">
        佔比(%)
      </th>
    </tr>
  </ng-template>

  <!-- 資料列 -->
  <ng-template
    pTemplate="body"
    let-rowData
    let-rowIndex="rowIndex"
    let-columns="columns"
  >
    <tr
      [ngClass]="{
        'font-bold text-sm': isSummaryRow(rowData),
      }"
    >
      <td
        *ngFor="let col of columns"
        style="text-overflow: ellipsis; min-width: 55px"
        [ngStyle]="getCellLineStyle(rowData, col.field, rowIndex)"
        [class]="{
          'text-left': col.align === 'left' || !col.align,
          'text-center': col.align === 'center',
          'text-right': col.align === 'right',
        }"
      >
        <span>
          {{
            col.format ? col.format(rowData?.[col.field]) : rowData?.[col.field]
          }}
        </span>
      </td>
    </tr>
  </ng-template>

  <!-- 查無資料 -->
  <ng-template pTemplate="emptymessage">
    <tr *ngIf="hasSearched">
      <td [attr.colspan]="columns.length">
        <div
          class="flex justify-content-center align-items-center min-h-full p-5 font-bold text-xl text-500"
        >
          <i class="pi pi-search mr-2"></i>
          查無資料
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
