<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="年月"
              controlName="YM"
              [control]="queryForm.controls.YM"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName=" Org_ID"
              [options]="ORG_ID_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Org_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 是否含以下所屬部門 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsCludeDownOrg"
              formControlName="IsCludeDownOrg"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsCludeDownOrg">是否含以下所屬部門</label>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="類別"
              [control]="queryForm.controls.ReportType"
              [options]="typeOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="單位金額表示"
              groupname="systemtyperadio"
              [control]="queryForm.controls.AmtUnit"
              [options]="unitOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <!-- 是否為ROC報表 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsROC"
              formControlName="IsROC"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsROC">是否為ROC報表</label>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button
            btnType="query"
            [loading]="loading"
            (click)="onSubmit(queryForm)"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="flex justify-content-end align-items-center gap-2 p-2">
    <p-button
      styleClass="p-2"
      label="預算、實績比較表.PDF"
      (click)="onExportPDF()"
      [loading]="exportPDFLoading"
      icon="pi pi-file"
      [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
    ></p-button>
    <p-button
      styleClass="p-2"
      label="預算、實績比較表.XLSX"
      (click)="onExportExcel()"
      [loading]="exportExcelLoading"
      icon="pi pi-file"
      [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
    ></p-button>
  </div>
  <app-table-subheader-report [data]="data"></app-table-subheader-report>
</div>
