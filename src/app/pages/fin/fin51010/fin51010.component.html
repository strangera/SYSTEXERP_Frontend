<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="讀取HR傳票資料" icon="pi pi-address-book" [loading]="hrLoading" (click)="onReadHR()"
      [disabled]="loading">
    </app-button>
  </div>

  <p-accordion #queryAccordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票型態" controlName="SrcSheetType" [options]="SrcSheetTypeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.SrcSheetType"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" [startControl]="queryForm.controls.VouDate_From"
              [endControl]="queryForm.controls.VouDate_To" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票拋轉狀態" controlName="Trans_Status" [options]="TransStatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Trans_Status"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票狀態" controlName="PostFlag" [options]="PostFlagOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PostFlag"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票編號" controlName="VouNo" [control]="queryForm.controls.VouNo"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票摘要" controlName="Remark" [control]="queryForm.controls.Remark"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="會計科目" controlName="AccNo" [options]="AccNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.AccNo"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="DetailNo" [options]="DetailNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.DetailNo"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="NoteDesc" [control]="queryForm.controls.NoteDesc"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="對象別編號" controlName="SubDetailNo" [options]="SubDetailNoOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.SubDetailNo"></app-dropdown>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
  <!-- 快速篩選未拋轉傳票區塊 -->
  <div class="p-3 border-round-xl mt-3 border-1 surface-border surface-card shadow-1">
    <!-- 頂部標題列與總數統計 -->
    <div class="flex align-items-center justify-content-between mb-3 pb-2 border-bottom-1 surface-border">
      <div class="flex align-items-center gap-2">
        <div
          class="w-2rem h-2rem border-circle flex align-items-center justify-content-center bg-primary-100 text-primary">
          <i class="pi pi-bolt text-lg"></i>
        </div>
        <div>
          <span class="text-base font-bold surface-900 mr-2">快速篩選未拋轉傳票</span>
          <span class="text-xs text-500 font-normal hidden sm:inline">(點擊下方型態可自動帶入條件並查詢)</span>
        </div>
      </div>
      <div class="flex align-items-center gap-2">
        <span class="text-xs text-500 font-medium">總未拋轉：</span>
        <span class="px-2.5 py-1 border-round-pill text-xs font-bold bg-primary text-primary-inverse shadow-1">
          {{ totalUnTransferredCount }} 筆
        </span>
      </div>
    </div>

    <!-- 分組系統別 Grid 網格區域 -->
    <div class="grid grid-nogutter gap-3">
      <div class="col-12 md:col-6 lg:col-4 xl:col-3 flex flex-column" *ngFor="let group of groupedCountData">
        <!-- 系統別獨立卡片外框 -->
        <div
          class="border-1 surface-border border-round-lg surface-50 p-2.5 flex-1 flex flex-column gap-2 transition-duration-200 hover:border-primary-300">

          <!-- 系統別表頭 Header -->
          <div
            class="flex align-items-center justify-content-between px-2.5 py-1.5 surface-card border-round border-1 surface-border shadow-1">
            <div class="flex align-items-center gap-2 overflow-hidden">
              <i [class]="group.icon + ' text-primary text-sm'"></i>
              <span class="font-bold text-xs surface-800 text-overflow-ellipsis overflow-hidden white-space-nowrap">
                {{ group.name }}
              </span>
            </div>
            <span class="text-xs px-2 py-0.5 border-round-pill font-semibold flex-shrink-0"
              [ngClass]="group.totalCnt > 0 ? 'bg-primary-100 text-primary-700' : 'bg-surface-200 text-500'">
              未拋轉: {{ group.totalCnt }}
            </span>
          </div>

          <!-- 該系統下的傳票型態列表 -->
          <div class="flex flex-column gap-1.5">
            <div *ngFor="let item of group.items"
              class="flex align-items-center justify-content-between p-2 border-round cursor-pointer transition-all transition-duration-150 border-1 outline-none select-none"
              [style.background-color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--highlight-bg)' : 'var(--surface-card)'"
              [style.border-color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--primary-color)' : 'var(--surface-border)'"
              [ngClass]="{
                 'shadow-1 font-bold': queryForm.get('SrcSheetType')?.value === item.SrcSheetType,
                 'hover:surface-hover': queryForm.get('SrcSheetType')?.value !== item.SrcSheetType
               }" role="button" tabindex="0" (click)="onSelectType(item)" (keydown.enter)="onSelectType(item)">

              <!-- 傳票名稱與代號 -->
              <div class="flex align-items-center gap-2 flex-1 overflow-hidden">
                <i class="pi pi-file-import text-xs"
                  [style.color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--primary-color)' : 'var(--text-color-secondary)'">
                </i>
                <span class="text-xs text-overflow-ellipsis overflow-hidden white-space-nowrap"
                  style="color: var(--text-color);">
                  {{ item.Voucher_Name }}
                </span>
                <span class="text-xs text-500 font-normal">({{ item.SrcSheetType }})</span>
              </div>

              <!-- 未拋轉數量 Badge -->
              <span class="px-2 py-0.5 border-round-pill text-xs font-semibold flex-shrink-0"
                [style.background-color]="item.CNT > 0 ? 'var(--primary-color)' : 'var(--surface-200)'"
                [style.color]="item.CNT > 0 ? 'var(--primary-color-text)' : 'var(--text-color-secondary)'">
                {{ item.CNT }}
              </span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <app-table-report dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="lastQuery" [showDelete]="false"
    [queryFunction]="fin51010Service.queryFIN51010.bind(fin51010Service)" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [showCheckBox]="true" [editDisabled]="isEditDisabled">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button styleClass="p-button-sm p-button-primary" label="拋轉傳票" [rounded]="true" [loading]="btnLoading"
          icon="pi pi-send" (click)="onTransfer()" [disabled]="isTransferDisabled"> </p-button>

        <p-button styleClass="p-button-sm p-button-danger" label="作廢" [rounded]="true" [loading]="btnLoading"
          icon="pi pi-trash" (click)="onVoid()" [disabled]="isVoidDisabled"> </p-button>
      </div>
    </header>
  </app-table-report>
</div>
