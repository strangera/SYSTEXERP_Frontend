<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="讀取HR傳票資料" icon="pi pi-address-book" [loading]="hrLoading" (click)="onReadHR()"
      [disabled]="loading">
    </app-button>
  </div>

  <p-accordion #queryAccordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票型態" controlName="SrcSheetType" [options]="SrcSheetTypeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.SrcSheetType"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" [startControl]="queryForm.controls.VouDate_From"
              [endControl]="queryForm.controls.VouDate_To" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票拋轉狀態" controlName="Trans_Status" [options]="TransStatusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Trans_Status"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="傳票狀態" controlName="PostFlag" [options]="PostFlagOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PostFlag"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票編號" controlName="VouNo" [control]="queryForm.controls.VouNo"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="傳票摘要" controlName="Remark" [control]="queryForm.controls.Remark"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="會計科目" controlName="AccNo" [options]="AccNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.AccNo"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="DetailNo" [options]="DetailNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.DetailNo"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="摘要" controlName="NoteDesc" [control]="queryForm.controls.NoteDesc"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="對象別編號" controlName="SubDetailNo" [options]="SubDetailNoOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.SubDetailNo"></app-dropdown>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
  <div class="p-2 border-round mt-3 border-1"
    style="background-color: var(--table-header-bg-group); border-color: var(--table-header-bg-group);">

    <div class="text-sm font-bold mb-2 ml-2 flex align-items-center" style="color: var(--surface-700);">
      <i class="pi pi-bolt mr-1"></i>快速篩選未拋轉傳票
    </div>

    <p-dataView #dv [value]="countData" layout="list" emptyMessage="無未拋轉的傳票型態">
      <ng-template pTemplate="list" let-items>
        <div class="grid grid-nogutter">
          <div class="col-12 md:col-4 p-1" *ngFor="let item of items">
            <div
              class="flex align-items-center p-2 px-3 gap-3 cursor-pointer border-round transition-duration-150 outline-none border-1"
              [style.background-color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--highlight-bg)' : 'var(--surface-card)'"
              [style.border-color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--primary-color)' : 'var(--surface-border)'"
              [ngClass]="{'shadow-1': queryForm.get('SrcSheetType')?.value === item.SrcSheetType}" role="button"
              tabindex="0" (click)="onSelectType(item)" (keydown.enter)="onSelectType(item)">

              <div class="flex align-items-center gap-2 flex-1 overflow-hidden">
                <i class="pi pi-file-import"
                  [style.color]="queryForm.get('SrcSheetType')?.value === item.SrcSheetType ? 'var(--primary-color)' : 'var(--text-color-secondary)'">
                </i>
                <span class="font-medium text-sm white-space-nowrap overflow-hidden text-overflow-ellipsis"
                  style="color: var(--text-color);">
                  {{ item.Voucher_Name }}
                </span>
                <span class="text-xs" style="color: var(--text-color-secondary);">({{ item.SrcSheetType }})</span>
              </div>

              <div class="flex align-items-center flex-shrink-0">
                <span class="px-2 py-1 border-round-pill text-xs font-bold"
                  [style.background-color]="item.CNT > 0 ? 'var(--primary-color)' : 'var(--surface-200)'"
                  [style.color]="item.CNT > 0 ? 'var(--primary-color-text)' : 'var(--text-color-secondary)'">
                  未拋轉數量： {{ item.CNT }}
                </span>
                <i class="pi pi-chevron-right ml-2 text-xs" style="color: var(--surface-400);"></i>
              </div>

            </div>
          </div>
        </div>
      </ng-template>
    </p-dataView>
  </div>
</div>

<div class="card">
  <app-table-report dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="lastQuery" [showDelete]="false"
    [queryFunction]="fin51010Service.queryFIN51010.bind(fin51010Service)" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [showCheckBox]="true" [editDisabled]="isEditDisabled">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button styleClass="p-button-sm p-button-primary" label="拋轉傳票" [rounded]="true" [loading]="btnLoading"
          icon="pi pi-send" (click)="onTransfer()" [disabled]="isTransferDisabled"> </p-button>

        <p-button styleClass="p-button-sm p-button-danger" label="作廢" [rounded]="true" [loading]="btnLoading"
          icon="pi pi-trash" (click)="onVoid()" [disabled]="isVoidDisabled"> </p-button>
      </div>
    </header>
  </app-table-report>
</div>
