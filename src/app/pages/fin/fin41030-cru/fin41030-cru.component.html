<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="年度"
            controlName="BudgetYear"
            [control]="dataForm.controls.BudgetYear"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="版本"
            controlName="BudgetVersion"
            [control]="dataForm.controls.BudgetVersion"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="審核狀態"
            controlName="BudgetStatus"
            [options]="budgetStatusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.BudgetStatus"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
    </form>
  </p-panel>
</div>
