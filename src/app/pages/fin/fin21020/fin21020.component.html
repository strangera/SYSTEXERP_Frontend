<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="複製費率" (click)="onCopyRate()"></app-button>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="公司銀行科目代號/名稱" controlName="BNK_No" [options]="bankCodeOptions" optionLabel="label"
              optionValue="No" [control]="queryForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="金額上限" [startControl]="queryForm.controls.Remit_UAmount_Start"
              [endControl]="queryForm.controls.Remit_UAmount_End" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="金額下限" [startControl]="queryForm.controls.Remit_BAmount_Start"
              [endControl]="queryForm.controls.Remit_BAmount_End" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="廠商負擔電匯手續費" [startControl]="queryForm.controls.Remit_Fee"
              [endControl]="queryForm.controls.Remit_Fee" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="公司負擔電匯手續費" [startControl]="queryForm.controls.Comp_Remit_Fee"
              [endControl]="queryForm.controls.Comp_Remit_Fee" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="廠商負擔電匯手續費回饋收入" [startControl]="queryForm.controls.Cash_Back_Amt"
              [endControl]="queryForm.controls.Cash_Back_Amt" [submitted]="submitted"></app-input-number-range>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <p-table #dt [columns]="columns" [value]="virtualData" [scrollable]="true" scrollHeight="500px" [rows]="30"
    [virtualScroll]="true" (onLazyLoad)="loadDataLazy($event)" [virtualScrollOptions]="{
      delay: 0,
      itemSize: 46,
      inline: true,
      lazy: true,
      autoSize: true,
      appendOnly:false,
      onScroll: onScroll,
      }">
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th>序號</th>
        <th *ngFor="let col of columns">
          {{col.header}}
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
      <tr style="height:46px">
        <td>{{ rowIndex + 1 }}</td>
        <td *ngFor="let col of columns">
          {{rowData[col.field]}}
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-dialog [visible]="dialogVisible()" header="複製費率" (visibleChange)="dialogVisible.set($event)" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogForm" id="DialogForm">
    <div class="grid p-fluid justify-content-between align-items-end">
      <app-dropdown class="col-12" label="公司銀行科目代號/名稱" controlName="BNK_No" [control]="dialogForm.controls.BNK_No"
        [options]="bankCodeOptions" optionLabel="label" optionValue="No" [submitted]="dialogSubmitted()"></app-dropdown>
    </div>
  </form>
  <app-table tableKey="Fin21020DialogTable" dataKey="No" [data]="dataDialog" [columns]="columnsDialog"
    [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true">
  </app-table>
</app-dialog>
