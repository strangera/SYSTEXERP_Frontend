<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-4">
            <app-calendar label="發票日期" controlName="invoice_date" [control]="queryForm.controls.invoice_date"
              [submitted]="submitted">
            </app-calendar>
          </div>
          <div class="col-12 md:col-4">
            <app-input-text label="收銀機代號" controlName="cashier_no" [control]="queryForm.controls.cashier_no"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-4">
            <app-input-text label="交易序號" controlName="txn_seq" [control]="queryForm.controls.txn_seq"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-4">
            <app-input-text label="字軌" controlName="prefix" [control]="queryForm.controls.prefix"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-4">
            <app-input-text label="發票號碼" controlName="invoice_no" [control]="queryForm.controls.invoice_no"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table tableKey="FIN11090" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showDelete]="false" dataKey="invoice_date"
      [multiSortMeta]="[{ field: 'invoice_date', order: -1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [isRowSelectable]="isRowSelectable" [showManage]="false" [showCheckBox]="true" [showPaginator]="false">
    </app-table>
    <div class="grid justify-content-end gap-2 m-0 mt-2">
      <app-button btnType="submit" (click)="onConfirm(selectedItems)"
        [disabled]="selectedItems.length === 0">確認</app-button>
    </div>
  </div>
</div>
