<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="調整單號" controlName="adjust_ID"
                        [control]="dataForm.controls.adjust_ID" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="調整日期" controlName="adjust_Date"
                        [control]="dataForm.controls.adjust_Date" [submitted]="submitted"></app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr />
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>應收帳款 {{i+1}}</h5>
                        </div>
                        <div>

                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="應收帳款單號" controlName="receiveID"
                                [control]="getFormControl(i, 'receiveID')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="調整科目代號" controlName="adjustID"
                                [control]="getFormControl(i, 'adjustID')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="調整科目代號" controlName="adjustAmount"
                                [control]="getFormControl(i, 'adjustAmount')" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="備註" controlName="adjustRemark"
                                [control]="getFormControl(i, 'adjustRemark')" [submitted]="submitted">
                            </app-input-text>
                        </div>
                    </div>
                    <hr />
                </ng-container>
            </ng-container>
            <div class="pt-1">

            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
            </div>
        </div>
    </p-panel>
</div>
