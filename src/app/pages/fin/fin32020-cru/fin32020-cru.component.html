<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form
      [formGroup]="dataForm"
      id="dataForm"
      (ngSubmit)="onSubmit(dataForm)"
    >
      <!-- 主檔欄位 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-number
            [useGrouping]="false"
            label="調整單號"
            controlName="adjust_ID"
            [control]="dataForm.controls.adjust_ID"
            [submitted]="submitted"
          >
          </app-input-number>
        </div>

        <div class="col-12 md:col-12 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="調整日期"
            controlName="adjust_Date"
            [control]="dataForm.controls.adjust_Date"
            [submitted]="submitted"
          >
          </app-calendar>
        </div>

        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text
            label="備註"
            controlName="remark"
            [control]="dataForm.controls.remark"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
      </div>

      <!-- ================= 調整明細：FIN32020TableEditComponent ================= -->
      <app-fin32020table-edit
        [title]="'調整明細'"
        [tableKey]="'fin32020Detail'"
        dataKey="SeqNo"
        [data]="detailData"
        [columns]="detailColumns"
        [loading]="detailLoading"
        [disabled]="isFormReadable"
        [showReorder]="true"
        [showCheckBox]="false"
        [showInsert]="!isFormReadable"
        [insertDisabled]="isFormReadable"
        [canInsert]="!isFormReadable"
        [showDelete]="!isFormReadable"
        [keepDeletedData]="false"
        [defaultInsertData]="defaultDetailRow"
        [showPaginator]="false"
        [scrollable]="false"
         [showCaption]="false" 
        (dataChange)="onDetailDataChange($event)"
        (fieldChange)="onDetailFieldChange($event)"
        (delete)="onDetailDelete($event)"
        (cellClick)="onDetailCellClick($event)"
      >
      </app-fin32020table-edit>

      <!-- Footer 按鈕 -->
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [type]="'button'"
          (click)="onCancel()"
        ></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<!-- ====== 應收帳款單號查詢 Dialog ====== -->
<app-dialog
  [(visible)]="arsDialogVisible"
  [header]="'選擇應收帳款'"
>
  <form
    [formGroup]="arsSearchForm"
    (ngSubmit)="onSearchARS()"
    class="grid p-fluid mb-3"
  >
    <!-- 廠客代號 -->
    <div class="col-12 md:col-4 lg:col-3">
      <app-input-text
        label="廠客代號"
        controlName="VEN_No"
        [control]="arsSearchForm.controls.VEN_No"
        [submitted]="false"
      ></app-input-text>
    </div>

    <!-- 立帳日 -->
    <div class="col-12 md:col-4 lg:col-3">

                 <app-calendar-range
              calendarType="dateRange"
              label="立帳日"
              [startControl]="arsSearchForm.controls.ARS_Date_From"
              [endControl]="arsSearchForm.controls.ARS_Date_To"
              [submitted]="submitted"
            ></app-calendar-range>
    </div>


    <!-- 查詢按鈕 -->
    <div class="col-12 md:col-4 lg:col-3 flex align-items-end">
      <app-button btnType="query" [type]="'submit'"></app-button>
    </div>
  </form>

  <app-table
    [tableKey]="'fin32020Ars'"
    dataKey="ARS_No"
    [columns]="arsColumns"
    [data]="arsList"
    [loading]="arsLoading"
    [showCheckBox]="false"
    [showManage]="false"
    [showDetail]="true"
    [showEdit]="false"
    [showHeader]="true"
    [showFilter]="false"
    [showReportMode]="false"
    [showPaginator]="false"
    (detail)="onSelectARS($event)"
  >
  </app-table>
</app-dialog>


<!-- ====== 調整科目代號查詢 Dialog ====== -->
<app-dialog
  [(visible)]="adjAccDialogVisible"
  [header]="'選擇調整科目'"
>
  <app-table
    [tableKey]="'fin32020AdjAcc'"
    dataKey="CAR_AccNo"
    [columns]="adjAccColumns"
    [data]="adjAccList"
    [loading]="adjAccLoading"
    [showCheckBox]="false"
    [showManage]="false"
    [showDetail]="true"
    [showEdit]="false"
    [showHeader]="true"
    [showFilter]="false"
    [showReportMode]="false"
    [showPaginator]="false"
    (detail)="onSelectAdjAcc($event)"
  >
  </app-table>
</app-dialog>
