<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
      <app-button
        btnType="create"
        (click)="onClickCreate()"
        label="{{ 'create' | translate }}"
      ></app-button>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="調整單號"
              controlName="adjust_ID"
              [control]="queryForm.controls.adjust_ID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="調整日期"
              [startControl]="queryForm.controls.adjust_Date_From"
              [endControl]="queryForm.controls.adjust_Date_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="remark"
              [control]="queryForm.controls.remark"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="傳票單號"
              [startControl]="queryForm.controls.summons_ID_From"
              [endControl]="queryForm.controls.summons_ID_To"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (click)="onClear(queryForm)"
          ></app-button>

          <app-button
            btnType="query"
            [loading]="loading"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [tableKey]="'fin32020_' + tableVer"
    [dataKey]="'ADJ_No'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="true"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryFIN32020ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showDetail]="true"
    (detail)="onDetail($event)"
    [showEdit]="canShowEdit"
    (edit)="onEdit($event)"
    [expansionDataKey]="'_Details'"
    [expansionColumns]="expansionColumns"
    [expansionMultiSortMeta]="[{ field: 'ARS_No', order: 1 }]"
    [expansionLoadFn]="loadDetailForExpansion"
  >
  </app-table-report>
</div>
