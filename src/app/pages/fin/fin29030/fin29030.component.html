<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="開票日期"
              [startControl]="queryForm.controls.IssueDateFrom"
              [endControl]="queryForm.controls.IssueDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="銀行代號"
              controlName="BNK_No"
              [options]="BNK_No_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.BNK_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="開票單號"
              [startControl]="queryForm.controls.CHK_NoFrom"
              [endControl]="queryForm.controls.CHK_NoTo"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="VEN_No"
              [options]="VEN_No_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.VEN_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="到期日"
              [control]="queryForm.controls.ExpireDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="票據狀態"
              controlName="CHK_Status"
              [options]="CHK_Status_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CHK_Status"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN29030"
      [data]="data"
      [columns]="columns"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'CHK_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
    ></app-table>
  </div>
</div>
