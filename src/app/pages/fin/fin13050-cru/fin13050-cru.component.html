<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 應付帳款類型 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="應付帳款類型"
            controlName="ACP_Type"
            [options]="ACP_TypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ACP_Type"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 統一編號（供應商） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="統一編號"
            controlName="PUR_VenUniform"
            [options]="PUR_VenUniformOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_VenUniform"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 發票狀態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="發票狀態"
            controlName="PUR_GUIStatus"
            [options]="PUR_GUIStatusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_GUIStatus"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 已沖金額 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="已沖金額"
            [control]="dataForm.controls.PUR_GUIBalance"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票格式 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="發票格式"
            controlName="PUR_VoucherType"
            [options]="PUR_VoucherTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_VoucherType"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 字軌 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="字軌"
            [control]="dataForm.controls.PUR_GUITrack"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票號碼（進來就只會是 8 碼） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票號碼"
            [control]="dataForm.controls.PUR_GUINo"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            label="發票日期"
            calendarType="dateOne"
            [control]="dataForm.controls.PUR_GUIDate"
            [submitted]="submitted">
          </app-calendar>
        </div>

        <!-- 申報年月 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calenderone
            controlName="PUR_RepYYYYMM"
            calendarType="dateMonthOne"
            label="申報年月"
            [control]="dataForm.controls.PUR_RepYYYYMM"
            [submitted]="submitted">
          </app-calenderone>
        </div>

        <!-- 金額群組 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票總金額"
            [control]="dataForm.controls.PUR_Amt"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票未稅金額"
            [control]="dataForm.controls.PUR_Net"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票稅額"
            [control]="dataForm.controls.PUR_Tax"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票用途 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="直接扣抵法稅額分攤種類"
            [control]="dataForm.controls.PUR_DirectType"
            [options]="invoicePurposeOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 課稅別 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="課稅別"
            controlName="PUR_TaxType"
            [options]="taxTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_TaxType"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 扣抵代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="扣抵代號"
            [control]="dataForm.controls.PUR_DiscNo"
            [options]="deductOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 類別區分 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="類別區分"
            [control]="dataForm.controls.PUR_Type"
            [options]="typeOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 廠商編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="廠商編號"
            controlName="PUR_VenNo"
            [options]="VendorNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_VenNo"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 廠商名稱（唯讀） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠商名稱"
            [control]="dataForm.controls.PUR_VenName"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 憑證單號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="憑證單號"
            [control]="dataForm.controls.Source_Doc_No"
            [submitted]="submitted"
            placeholder="請輸入憑證單號（16 位英數）">
          </app-input-text>
        </div>

        <!-- 傳票號碼（唯讀） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="傳票號碼"
            [control]="dataForm.controls.Voucher_No"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 系統別（SAL_Type） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="系統別"
            [control]="dataForm.controls.SAL_Type"
            [options]="salTypeOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 備註 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註"
            [control]="dataForm.controls.PUR_Remark"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
