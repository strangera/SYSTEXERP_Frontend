<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <!-- 發票格式 → PUR_VoucherType -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="發票格式"
            controlName="PUR_VoucherType"
            [options]="PUR_VoucherTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_VoucherType"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 字軌 → PUR_GUITrack -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="字軌"
            [control]="dataForm.controls.PUR_GUITrack"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票號碼 → PUR_GUINo -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票號碼"
            [control]="dataForm.controls.PUR_GUINo"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票日期（Date）→ 送出轉成 ISO 字串 PUR_GUIDate -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            label="發票日期"
            calendarType="dateOne"
            [control]="dataForm.controls.PUR_GUIDate"
            [submitted]="submitted">
          </app-calendar>
        </div>

        <!-- 申報年月（yyyyMM）→ PUR_RepYYYYMM -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            controlName="PUR_RepYYYYMM"
            calendarType="dateMonthOne"
            label="申報年月"
            [control]="dataForm.controls.PUR_RepYYYYMM"
            [submitted]="submitted">
          </app-calendar>
        </div>

        <!-- 廠商統一編號 → PUR_VenUniform -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠商編號(統一編號)"
            [control]="dataForm.controls.PUR_VenUniform"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 金額群組：PUR_Amt / PUR_Net / PUR_Tax -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票總金額"
            [control]="dataForm.controls.PUR_Amt"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票未稅金額"
            [control]="dataForm.controls.PUR_Net"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="發票稅額"
            [control]="dataForm.controls.PUR_Tax"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <!-- 發票用途 → PUR_DirectType -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="發票用途"
            [control]="dataForm.controls.PUR_DirectType"
            [options]="invoicePurposeOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 課稅別 → PUR_TaxType -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="課稅別"
            controlName="PUR_TaxType"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PUR_TaxType"
            [options]="taxTypeOptions"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 扣抵代號 → PUR_DiscNo -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="扣抵代號"
            [control]="dataForm.controls.PUR_DiscNo"
            [options]="deductOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 類別區分 → PUR_Type -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="類別區分"
            [control]="dataForm.controls.PUR_Type"
            [options]="typeOptions"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!-- 憑證單號 / 傳票號碼 / 系統別 / 備註 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="憑證單號"
            [control]="dataForm.controls.Source_Doc_No"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="傳票號碼"
            [control]="dataForm.controls.Voucher_No"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="系統別"
            [control]="dataForm.controls.SAL_Type"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註"
            [control]="dataForm.controls.PUR_Remark"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

      <!-- 按鈕列 -->
      <div class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
