<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="公司銀行科目代號/名稱" controlName="BNK_No" [options]="bankCodeOptions" optionLabel="label"
            optionValue="No" [control]="dataForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
        </div>
        <app-table-edit class="col-12" title="費率對照明細" tableKey="FIN21020Detail" [columns]="columns" [data]="data"
          (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" (dataChange)="data = $event"
          [rowValidate]="validateEntireRow" [tableRequired]="true" [showReorder]="false"
          [isRowSelectable]="isRowSelectable" [disabled]="isFormReadable" [showExcel]="true"
          (exportExcel)="onExportExcel()" (importExcel)="onImportExcel($event)" [showExcelImport]="!isFormReadable"
          [exportExcelLoading]="excelBtnLoading()" [loading]="loading" [showExcelExport]="false" />
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (click)="data = []"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
