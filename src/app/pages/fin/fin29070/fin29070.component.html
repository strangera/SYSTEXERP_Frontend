<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 廠商編號(起訖) -->
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown-range label="廠商編號" controlName="VEN_No" [startControl]="queryForm.controls.VEN_No_From"
              [endControl]="queryForm.controls.VEN_No_To" [submitted]="submitted" [options]="vendorOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <!-- 立帳日期(起訖) - 必填 -->
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range calendarType="dateRange" label="立帳日期" [startControl]="queryForm.controls.ODM_Date_From"
              [endControl]="queryForm.controls.ODM_Date_To" [submitted]="submitted">
            </app-calendar-range>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<app-table
  tableKey="FIN29070"
  dataKey="VoucherNo"
  [data]="data"
  [columns]="columns"
  [showCheckBox]="false"
  [showDelete]="false"
  [selectedItems]="selectedItems"
  (selectionChange)="selectedItems = $event"
  [multiSortMeta]="[{ field: 'VendorNo', order: 1 }]"
  [totalRecords]="totalRecords"
  (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  [lazy]="true"
  [loading]="loading"
  [showManage]="false"
  [showReportMode]="false"
>

  <header>
    <div class="flex justify-content-end gap-2">
      <app-button
        label="廠商應付對應科目明細表.PDF"
        icon="pi pi-file-pdf"
        (click)="onExportPDF(queryForm)"
        [loading]="exportPDFbtnLoading"
        [disabled]="loading || (data.length || 0) === 0">
      </app-button>

      <app-button
        label="廠商應付對應科目明細表.xlsx"
        icon="pi pi-file-excel"
        (click)="onExportExcel(queryForm)"
        [loading]="exportExcelbtnLoading"
        [disabled]="loading || (data.length || 0) === 0">
      </app-button>
    </div>
  </header>

</app-table>
  @if (data.length) {
    <app-report-signature dataType="FIN29070" />
  }
