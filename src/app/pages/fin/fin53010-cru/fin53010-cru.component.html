<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (isFormCreateable) {
      <app-button
        btnType="query"
        label="套用常用傳票"
        [loading]="service.fin52030Loading() || loading"
        (click)="getVocherTemplate()"
      ></app-button>
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="傳票號碼"
          controlName="VouNo"
          [control]="df().VouNo"
          [disabled]="!0"
          [submitted]="submitted"
        ></app-input-text>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="傳票種類"
          controlName="VouType"
          [showClear]="!1"
          [disabled]="!isFormCreateable"
          [options]="service.vouTypeOptions"
          optionLabel="label"
          optionValue="value"
          [control]="df().VouType"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="傳票型態"
          controlName="VoucherType"
          [showClear]="!1"
          [disabled]="!0"
          [control]="df().VoucherType"
          [options]="service.voucherTypeOptions()"
          optionLabel="label"
          optionValue="value"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="傳票日期"
          controlName="VouDate"
          [disabled]="!isFormCreateable"
          [control]="df().VouDate"
          [submitted]="submitted"
        ></app-calendar>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="傳票摘要"
          controlName="Remark"
          [control]="df().Remark"
          [submitted]="submitted"
        ></app-input-text>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="補發票"
          controlName="INVOptions"
          [showClear]="!1"
          [filter]="!1"
          [disabled]="!isFormCreateable"
          [options]="service.INVOptions"
          optionLabel="label"
          optionValue="value"
          [control]="df().INV_YN"
          [submitted]="submitted"
        ></app-dropdown>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="建立者"
          controlName="CRT_USR_No"
          [control]="df().CRT_USR_No"
          [disabled]="!0"
          [options]="service.usrOptions()"
          optionLabel="label"
          optionValue="value"
          [loading]="service.usrLoading()"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="建立日期"
          controlName="CRT_Date"
          [control]="df().CRT_Date"
          [disabled]="!0"
          [submitted]="submitted"
        ></app-calendar>
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="修改者"
          controlName="UPD_USR_No"
          [control]="df().UPD_USR_No"
          [disabled]="!0"
          [options]="service.usrOptions()"
          optionLabel="label"
          optionValue="value"
          [loading]="service.usrLoading()"
          [submitted]="submitted"
        ></app-dropdown>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="修改日期"
          controlName="UPD_Date"
          [control]="df().UPD_Date"
          [disabled]="!0"
          [submitted]="submitted"
        ></app-calendar>
        <app-radiobutton
          class="col-12 md:col-6 lg:col-4"
          label="ROC/IFRS"
          groupname="VouAccType"
          [disabled]="!isFormCreateable"
          [control]="df().VouAccType"
          [options]="service.vouAccTypeOptions"
          [submitted]="submitted"
        ></app-radiobutton>
      </div>

      @if (!isFormReadable) {
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>

<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="資料" class="line-height-3 m-0 mb-3">
        <app-table-edit
          [showCheckBox]="isFormCreateable"
          [showReorder]="isFormCreateable"
          [disabled]="!isFormCreateable"
          (fieldChange)="onFieldChange($event)"
          (dataChange)="onDataChange($event)"
          (rowReorderData)="onRowReorder($event)"
          [data]="tableData()"
          [defaultInsertData]="defaultInsertData()"
          [footerData]="footerData()"
          [loading]="tableLoading()"
          [tableKey]="'FIN52030_detail'"
          [tableRequired]="true"
          [columns]="columns()"
        ></app-table-edit>
      </p-panel>
    </div>
  </div>
</div>

<ng-template
  #venUsrTemplate
  let-rowData
  let-col="col"
  let-overlayPanel="overlayPanel"
>
  <div class="col-12">
    <div class="flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">選擇廠商/員工</h6>
      <p-dropdown
        [options]="templateOptions"
        [(ngModel)]="selectedTemplateType"
        [ngModelOptions]="{ standalone: true }"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇類型"
        [disabled]="service.usrLoading() || service.venLoading()"
        (onChange)="onTemplateTypeChange($event)"
        styleClass="w-10rem"
      ></p-dropdown>
    </div>

    <div class="mb-3">
      <input
        pInputText
        class="w-full"
        [(ngModel)]="templateSearchTerm"
        [ngModelOptions]="{ standalone: true }"
        placeholder="搜尋..."
      />
    </div>

    <div class="max-h-30rem">
      <p-table
        [value]="getFilteredTemplateData()"
        [scrollable]="true"
        scrollHeight="400px"
        selectionMode="single"
        dataKey="value"
        styleClass="p-datatable-sm"
        [paginator]="!0"
        [rows]="10"
        [showCurrentPageReport]="!0"
        currentPageReportTemplate="顯示 {first} 到 {last} 筆，共 {totalRecords} 筆"
        [loading]="loading"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>代號</th>
            <th>名稱</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr
            class="cursor-pointer hover:surface-hover"
            (click)="selectTemplateItem(rowData, item); overlayPanel.hide()"
          >
            <td>{{ item.value }}</td>
            <td>{{ item.label }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="2" class="text-center p-3">無符合條件的資料</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div
      class="flex justify-content-end gap-2 mt-3 pt-2 border-top-1 surface-border"
    >
      <button
        pButton
        label="取消"
        class="p-button-text"
        (click)="overlayPanel.hide()"
      ></button>
      <button
        pButton
        label="清除"
        class="p-button-outlined"
        (click)="selectTemplateItem(rowData); overlayPanel.hide()"
      ></button>
    </div>
  </div>
</ng-template>

<app-dialog
  [(visible)]="displayDialog"
  header="選擇常用傳票"
  [disable]="!selectedDetail().length"
  [loading]="service.vocTempLoading()"
  (save)="onApplyTemplate()"
>
  <div class="grid p-fluid mt-3 mb-3">
    <app-dropdown
      class="col-12 md:col-6 lg:col-4"
      label="傳票種類"
      controlName="VouType"
      [showClear]="!1"
      [options]="service.vouTypeOptions"
      optionLabel="label"
      optionValue="value"
      [control]="df().VouType"
      (valueChange)="vouTypeChange($event)"
    ></app-dropdown>
    <app-input-text
      class="col-12 md:col-6 lg:col-4"
      label="傳票號碼/代號"
      (inputChange)="vouTermChange($event)"
    ></app-input-text>
    <app-checkbox
      class="col-12 md:col-6 lg:col-4"
      label="明細數量 (有/無/全部)"
      [tri]="!0"
      (valueChange)="detailCountTemp.set($event)"
    ></app-checkbox>
  </div>

  <div [style]="{ 'min-height': '50vh', 'max-height': '75vh' }">
    <app-table
      [showReportMode]="!1"
      [showCaption]="!1"
      [showHeader]="!1"
      [showManage]="!1"
      [showDelete]="!1"
      [showCheckBox]="!0"
      [selectionMode]="'single'"
      [dataKey]="'id'"
      [tableKey]="'FIN53010_VocherTemplate'"
      [data]="filteredVoucherTemplateOptions()"
      [columns]="templateColumns"
      (selectionChange)="selectedDetail.set($event)"
    ></app-table>
  </div>
</app-dialog>
