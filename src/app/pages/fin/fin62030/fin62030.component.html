<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 調撥單號(起) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="調撥單號(起)"
              controlName="Tran_NoFrom"
              [control]="queryForm.controls.Tran_NoFrom"
              [submitted]="submitted"
              [options]="tranNoOptions"
              [optionLabel]="'label'"
              [optionValue]="'value'"
            ></app-dropdown>
          </div>
          <!-- 調撥單號(迄) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="調撥單號(迄)"
              controlName="Tran_NoTo"
              [control]="queryForm.controls.Tran_NoTo"
              [submitted]="submitted"
              [options]="tranNoOptions"
              [optionLabel]="'label'"
              [optionValue]="'value'"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="FIN62030"
    dataKey="Tran_No"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [multiSortMeta]="[]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
    [showDelete]="false"
    [showManage]="false"
    [showReportMode]="false"
  >
    <header>
      <p-button label="預覽" (click)="onPreview()" />
    </header>
  </app-table>
</div>
