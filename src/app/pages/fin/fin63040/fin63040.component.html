<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 公司銀行科目代號（必填） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="公司銀行科目代號"
              controlName="CompanyAccNo"
              [options]="BankCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CompanyAccNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 兌現日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="兌現日"
              [startControl]="queryForm.controls.PayDateFrom"
              [endControl]="queryForm.controls.PayDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 到期日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日"
              [startControl]="queryForm.controls.ExpireDateFrom"
              [endControl]="queryForm.controls.ExpireDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 票據號碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="ChkNo"
              [control]="queryForm.controls.ChkNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            [type]="'button'"
            label="支票兌現"
            (clickEvent)="onCash()"
          ></app-button>

          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- ✅ 列表：lazy=true + #finTable（套用 FIN63020 的排序修正） -->
<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN63040_TABLE'"
    [dataKey]="'CheckNo'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="true"
    [selectionMode]="'multiple'"
    [(selectedItems)]="selectedItems"
    [isRowSelectable]="isRowSelectable"
    [showManage]="true"
    [showDetail]="true"
    [showEdit]="true"
        [showReportMode]="false"
    [showDelete]="false"
    [lazy]="true"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
  >
    <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div></div>

        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="匯出兌現報表.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="匯出兌現報表.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table>
</div>

<!-- ✅ 支票兌現 Dialog -->
<p-dialog
  header="支票兌現"
  [(visible)]="cashDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
>
  <form [formGroup]="cashForm" class="p-fluid">
    <div class="grid">
      <div class="col-12">
        <app-calendar
          calendarType="dateOne"
          label="兌現日"
          controlName="PayDate"
          [control]="cashForm.controls.PayDate"
          [submitted]="submitted"
        ></app-calendar>
      </div>

      <div class="col-12 text-600">
        ※ ChkNoList 會自動取用目前勾選的票據號碼（僅「可兌現=Y」才會送出）
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="取消"
        severity="secondary"
        (onClick)="onCashCancel()"
      ></p-button>

      <p-button
        label="確認兌現"
        [loading]="btnLoading"
        (onClick)="onCashConfirm()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
