<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="系統年結年度"
              controlName="systemYear"
              [control]="queryForm.controls.systemYear"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="系統開帳年月"
              controlName="accountingStartMonth"
              [control]="queryForm.controls.accountingStartMonth"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="系統關帳年月"
              controlName="accountingEndMonth"
              [control]="queryForm.controls.accountingEndMonth"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="傳票日期預設"
              controlName="defaultVoucherDate"
              [control]="queryForm.controls.defaultVoucherDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="預設組織"
              controlName="defaultOrganization"
              [options]="departmentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.defaultOrganization"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="累積盈虧科目"
              controlName="accumulatedProfitLossAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accumulatedProfitLossAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="本期損益科目"
              controlName="currentProfitLossAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.currentProfitLossAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="現金科目"
              controlName="cashAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cashAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="應收帳款科目"
              controlName="accountsReceivableAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountsReceivableAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="應付帳款科目"
              controlName="accountsPayableAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountsPayableAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="進項稅額科目"
              controlName="inputTaxAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.inputTaxAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="銷項稅額科目"
              controlName="outputTaxAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.outputTaxAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="郵電費科目"
              controlName="postAndTelecomFeeAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.postAndTelecomFeeAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="貼現日利率"
              controlName="discountRate"
              [control]="queryForm.controls.discountRate"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="貼現手續費收入科目"
              controlName="discountFeeRevenueAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.discountFeeRevenueAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="貼現銷項稅額科目"
              controlName="discountOutputTaxAccount"
              [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="銀行匯款手續費科目"
              controlName="bankTransferFeeAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankTransferFeeAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="預支費用科目"
              controlName="advanceExpenseAccount"
              [options]="accountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.advanceExpenseAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="應付票據是否需領用才拋轉傳票"
              controlName="billTransferCondition"
              [options]="accountingaccountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.billTransferCondition"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
