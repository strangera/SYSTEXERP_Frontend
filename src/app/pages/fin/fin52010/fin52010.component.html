<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4"
                          label="系統年結年度"
                          controlName="AccYear"
                          [disabled]="!0"
                          [control]="qf().AccYear"
                          [submitted]="submitted"></app-input-text>
          <app-calendar-range class="col-12 md:col-6 lg:col-4"
                              calendarType="dateYearRange"
                              label="系統開關帳年月"
                              controlName="OpenCloseDate"
                              [startControl]="qf().OpenDate"
                              [endControl]="qf().CloseDate"
                              [submitted]="submitted"></app-calendar-range>
          <app-calendar class="col-12 md:col-6 lg:col-4"
                        calendarType="dateOne"
                        label="傳票日期預設"
                        controlName="DefaultVouDate"
                        [control]="qf().DefaultVouDate"
                        [submitted]="submitted"></app-calendar>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="預設組織"
                        controlName="ORG_ID"
                        [options]="service.tblUserOrgidList()"
                        optionLabel="label"
                        optionValue="value"
                        [showClear]="!1"
                        [control]="qf().ORG_ID"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="累積盈虧科目"
                        controlName="AccNoTotPL"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoTotPL"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="本期損益科目"
                        controlName="AccNoCurPL"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoCurPL"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="現金科目"
                        controlName="CashAccNo"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().CashAccNo"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="應收帳款科目"
                        controlName="AccNoAR"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoAR"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="應付帳款科目"
                        controlName="AccNoAP"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoAP"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="進項稅額科目"
                        controlName="AccNoInTax"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoInTax"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="銷項稅額科目"
                        controlName="AccNoOutTax"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoOutTax"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="郵電費科目"
                        controlName="AccNoPost"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoPost"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="銀行匯款手續費科目"
                        controlName="AccNoRemitFee"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().AccNoRemitFee"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="預支費用科目"
                        controlName="advanceExpenseAccNo"
                        [options]="service.accNoList()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().advanceExpenseAccNo"
                        [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="應付票據是否需領用才拋轉傳票"
                        controlName="billTransferCon"
                        [options]="service.billTransferConOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [control]="qf().billTransferCon"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="service.tableLoading()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>


<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="!0"
               [data]="service.FIN52010Data()"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"
               [loading]="service.tableLoading()"
               [dataKey]="'id'"
               [tableKey]="'FIN52010'"></app-table>
  </div>
</div>
