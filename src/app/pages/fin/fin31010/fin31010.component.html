<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收款項目代號" controlName="CAP_Item" [control]="queryForm.controls.CAP_Item"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收款項目名稱" controlName="CAP_Name" [control]="queryForm.controls.CAP_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="會計科目代號" controlName="AccNo" [control]="queryForm.controls.AccNo"
              [submitted]="submitted" [options]="AccNoOptions | async" optionLabel="label"
              optionValue="value"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="備註" controlName="Remark" [control]="queryForm.controls.Remark"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="CAP_Item" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true" (delete)="onDelete()" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
    [queryFunction]="fin31010Service.queryFin31010.bind(fin31010Service)" [loading]="loading"></app-table-report>
</div>
