<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="發票類型" controlName="InvoiceType" [options]="InvoiceType_Options" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.InvoiceType" [submitted]="submitted">
          </app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="使用別" controlName="SAL_Type" [options]="SAL_Type_Options" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.SAL_Type" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="字軌" [control]="dataForm.controls.INV_GUITrack"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="發票號碼" [control]="dataForm.controls.INV_GUINumber"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range label="發票日期" calendarType="dateRange" [startControl]="dataForm.controls.InvoiceDate_Start"
            [endControl]="dataForm.controls.InvoiceDate_End" [submitted]="submitted"></app-calendar-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="買受人統一編號" controlName="Buyer_Uniform" [control]="dataForm.controls.Buyer_Uniform"
            [options]="Buyer_Uniform_Options" optionLabel="label" optionValue="value"
            [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="課稅別" controlName="PUR_TaxType" [options]="taxTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.PUR_TaxType" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text-range label="傳票號碼 " [startControl]="dataForm.controls.startVoucher_No"
            [endControl]="dataForm.controls.endVoucher_No"></app-input-text-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="資產註記" [control]="dataForm.controls.AssetType" [options]="AssetNoteOptions"
            optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="發票抬頭" [control]="dataForm.controls.PUR_InvoiceTitle"
            [submitted]="submitted"></app-input-text>
        </div>
        <app-table #table class="col-12" dataKey="ID" [columns]="columns" [data]="data" dataStatusField="status"
          [showInsert]="!isTableDisabled" [showRowEdit]="!isTableDisabled" [showCheckBox]="!isTableDisabled"
          [showDelete]="true" [deleteData]="false" (delete)="onDeleteRow($event)" [showEdit]="false"
          [showDetail]="false" [showCaption]="!isFormReadable" [showManage]="!isFormReadable" [showReportMode]="false"
          [insertRowData]="true" [disabled]="isTableDisabled" (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows" (dataChange)="data = $event" (rowEditSave)="onRowEdit($event.newData)">
        </app-table>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
