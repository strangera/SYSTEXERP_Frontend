<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'查詢條件'" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="支出請款單號" controlName="PCS_RqstNo" [options]="paymentRequestNoOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.PCS_RqstNo"
              [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-table [control]="queryForm.controls.Keep_UsrNo" [submitted]="submitted" optionLabel="label"
              optionValue="value" templateLabel="templateLabel" [suggestions]="custodianSuggestions"
              [fieldsConfig]="custodianFieldsConfig" (inputValueChanged)="onCustodianAutoCompleteInputChange($event)"
              [formGroup]="custodianDialogForm" (formValueChanged)="onCustodianDialogFormValueChanged($event)"
              [dialogData]="custodianDialogData" [dialogColumns]="custodianDialogColumns"
              [totalRecords]="custodianDialogData.length" (select)="onCustodianSelected($event)">
              <app-input-text class="col-12 md:col-6" label="使用者代碼" controlName="userNo"
                [control]="custodianDialogForm.controls.userNo"></app-input-text>
              <app-input-text class="col-12 md:col-6" label="使用者名稱" controlName="userName"
                [control]="custodianDialogForm.controls.userName"></app-input-text>
              <app-input-text class="col-12 md:col-6" label="組織代碼" controlName="orgNo"
                [control]="custodianDialogForm.controls.orgNo"></app-input-text>
              <app-input-text class="col-12 md:col-6" label="組織名稱" controlName="orgName"
                [control]="custodianDialogForm.controls.orgName"></app-input-text>
            </app-dropdown-table>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-table [control]="queryForm.controls.Keep_OrgID" [submitted]="submitted" optionLabel="label"
              optionValue="value" templateLabel="templateLabel" [suggestions]="custodianDeptSuggestions"
              [fieldsConfig]="custodianDeptFieldsConfig" (inputValueChanged)="
                onCustodianDeptAutoCompleteInputChange($event)
              " [formGroup]="custodianDeptDialogForm"
              (formValueChanged)="onCustodianDeptDialogFormValueChanged($event)" [dialogData]="custodianDeptDialogData"
              [dialogColumns]="custodianDeptDialogColumns" [totalRecords]="custodianDeptDialogData.length"
              (select)="onCustodianDeptSelected($event)">
              <app-input-text class="col-12 md:col-6" label="組織代碼" controlName="orgNo"
                [control]="custodianDeptDialogForm.controls.orgNo"></app-input-text>
              <app-input-text class="col-12 md:col-6" label="組織名稱" controlName="orgName"
                [control]="custodianDeptDialogForm.controls.orgName"></app-input-text>
            </app-dropdown-table>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="申請日期" [startControl]="queryForm.controls.PCS_Date_S"
              [endControl]="queryForm.controls.PCS_Date_E" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="請款日期" [startControl]="queryForm.controls.PCS_RqstDate_S"
              [endControl]="queryForm.controls.PCS_RqstDate_E" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="撥補日期" [startControl]="queryForm.controls.PCS_PayDate_S"
              [endControl]="queryForm.controls.PCS_PayDate_E" [submitted]="submitted"></app-calendar-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report apiUrl="queryFIN73040" [lastQueryBody]="lastQueryBody" [queryFunction]="queryFIN73040ForReport"
    [data]="data" dataKey="dataKey" tableKey="FIN73040_Data" [columns]="columns" [totalRecords]="totalRecords"
    [loading]="loading" [showManage]="false" [showDelete]="false" [showReportMode]="false" groupRowsBy="PCS_RqstNo"
    [subTotalData]="fin73040SubTotalData" [footerData]="fin73040FooterData" footerLabelField="RowTypeDesc">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0"></p-button>
        <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file" (click)="onExportExcel()"
          [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
