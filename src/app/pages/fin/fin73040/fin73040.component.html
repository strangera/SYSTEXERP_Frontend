<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      [header]="'查詢條件'"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="支出請款單號"
              controlName="paymentRequestNo"
              [options]="paymentRequestNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.paymentRequestNo"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金保管人"
              controlName="custodianNo"
              [options]="custodianOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.custodianNo"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="custodianDeptNo"
              [options]="custodianDeptOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.custodianDeptNo"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="申請日期(起訖)"
              controlName="applyDateStart"
              [startControl]="queryForm.controls.applyDateStart"
              [endControl]="queryForm.controls.applyDateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="請款日期(起訖)"
              controlName="paymentDateStart"
              [startControl]="queryForm.controls.paymentDateStart"
              [endControl]="queryForm.controls.paymentDateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="撥補日期(起訖)"
              controlName="replenishDateStart"
              [startControl]="queryForm.controls.replenishDateStart"
              [endControl]="queryForm.controls.replenishDateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    apiUrl="queryFIN73040"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="service.queryFIN73040.bind(service)"
    [data]="data"
    dataKey="dataKey"
    tableKey="FIN73040_Data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showManage]="false"
  >
  </app-table-report>
</div>
