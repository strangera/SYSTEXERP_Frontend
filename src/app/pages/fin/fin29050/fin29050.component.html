<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="立帳日期" [startControl]="queryForm.controls.ACP_Date_From"
              [endControl]="queryForm.controls.ACP_Date_To" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="廠商編號" [startControl]="queryForm.controls.VEN_No_From"
              [endControl]="queryForm.controls.VEN_No_To" [submitted]="submitted" [options]="VendorNoOptions"
              optionLabel="label" optionValue="value"></app-dropdown-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="應付金額" [startControl]="queryForm.controls.ACP_Amt_From"
              [endControl]="queryForm.controls.ACP_Amt_To" [submitted]="submitted"></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="科目代號" [startControl]="queryForm.controls.AccNo_From"
              [endControl]="queryForm.controls.AccNo_To" [submitted]="submitted" [options]="AccNoOptions"
              optionLabel="label" optionValue="value"></app-dropdown-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="帳款餘額為零是否顯示" groupname="ShowZeroBalance"
              [control]="queryForm.controls.ShowZeroBalance" [options]="[
                { label: '顯示', value: 'A' },
                { label: '不顯示', value: 'N' },
              ]" [submitted]="submitted"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="未付金額是否包含保留款餘額" groupname="UnpaidIncludeReserve"
              [control]="queryForm.controls.UnpaidIncludeReserve" [options]="[
                { label: '是', value: 'A' },
                { label: '否', value: 'N' },
              ]" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-subheader tableKey="VoucherNo" dataKey="VoucherNo" [data]="data" [columns]="columns"
      [showCheckBox]="false" [showManage]="false" [showDelete]="false" (detail)="onDetail($event)" [multiSortMeta]="[]"
      [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true" [groupRowsBy]="''" [groupRowsByName]="''" [showGroupheader]="false" [loading]="loading"
      [showSerialNo]="false" [showPaginator]="false" [showReportMode]="false" [showSort]="false">
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button styleClass="p-2" label="應付帳款明細表.PDF" icon="pi pi-file" (click)="onExportPDF()"
            [disabled]="data.length === 0" [loading]="pdfBtnLoading"></p-button>
          <p-button styleClass="p-2" label="應付帳款明細表.XLSX" icon="pi pi-file" (click)="onExportExcel()"
            [disabled]="data.length === 0" [loading]="excelBtnLoading"></p-button>
        </div>
      </header>
    </app-table-subheader>
  </div>
</div>
