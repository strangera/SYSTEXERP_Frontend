<div class="card fin11020">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" (click)="onCreate()"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateMonthRange" label="資料所屬年月(快速碼)"
            [startControl]="queryForm.controls.REP_GUIYM_start" [endControl]="queryForm.controls.REP_GUIYM_end"
            [submitted]="submitted" /> -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar calendarType="dateMonthOne"
                label="資料所屬年月"
                controlName="REP_GUIYM"
                [control]="queryForm.controls.REP_GUIYM"
                [submitted]="submitted">
              </app-calendar>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)" [showCheckBox]="true"
    (delete)="onDelete($event)" [showDetail]="false" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [multiSortMeta]="[{ field: 'ID', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading">
  </app-table>
</div>
