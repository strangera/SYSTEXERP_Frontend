<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商代號"
              controlName="VEN_No"
              [options]="VEN_No_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.VEN_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="票據號碼"
              [startControl]="queryForm.controls.CHK_No_S"
              [endControl]="queryForm.controls.CHK_No_E"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="開票日期"
              [startControl]="queryForm.controls.CHK_IssueDate_S"
              [endControl]="queryForm.controls.CHK_IssueDate_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="開票單號"
              controlName="PAM_No"
              [options]="PAM_No_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.PAM_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="傳票號碼"
              [startControl]="queryForm.controls.VouNo_S"
              [endControl]="queryForm.controls.VouNo_E"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN65010"
      pageSizeSetting="A3"
      [data]="data"
      [columns]="columns"
      [showSort]="false"
      [showManage]="false"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [showDelete]="false"
      [showCheckBox]="false"
      dataKey="id"
      [multiSortMeta]="[{ field: 'CheckNo', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [loading]="loading"
    ></app-table>
  </div>
</div>
