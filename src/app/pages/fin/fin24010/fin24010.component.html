<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="應付ID"
              controlName="shouldPayID"
              [control]="queryForm.controls.shouldPayID"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="organizationCode"
              [options]="organizationCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.organizationCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="帳款年月"
              [control]="queryForm.controls.accountYm"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="帳款帳次"
              controlName="accountCash"
              [control]="queryForm.controls.accountCash"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="應付金額"
              [startControl]="queryForm.controls.startShouldPay"
              [endControl]="queryForm.controls.endShouldPay"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="沖帳金額"
              [startControl]="queryForm.controls.startChargeback"
              [endControl]="queryForm.controls.endChargeback"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="應付金額餘額"
              [startControl]="queryForm.controls.startShouldPayBalance"
              [endControl]="queryForm.controls.endShouldPayBalance"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="保留款金額"
              [startControl]="queryForm.controls.startRetainer"
              [endControl]="queryForm.controls.endRetainer"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="退保留款金額"
              [startControl]="queryForm.controls.startRefundRetainer"
              [endControl]="queryForm.controls.endRefundRetainer"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="付款方式"
              controlName="paymentMethod"
              [options]="paymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.paymentMethod"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="匯款銀行代號"
              controlName="transferBankAccount"
              [options]="bankAccountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.transferBankAccount"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="銀行帳號"
              controlName="bankAccount"
              [control]="queryForm.controls.bankAccount"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="帳戶名稱"
              controlName="bankAccountName"
              [control]="queryForm.controls.bankAccountName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="票據禁止背書轉讓"
              controlName="ticketTransfer"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ticketTransfer"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="票據抬頭"
              controlName="ticketTitle"
              [control]="queryForm.controls.ticketTitle"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="預計付款日"
              [startControl]="queryForm.controls.startExpectPayDate"
              [endControl]="queryForm.controls.endExpectPayfDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="立帳日期"
              [startControl]="queryForm.controls.startEstablishDate"
              [endControl]="queryForm.controls.endEstablishfDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="factoryID"
              [options]="factoryIDOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.factoryID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="統一編號"
              controlName="uId"
              [control]="queryForm.controls.uId"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="會計科目代號"
              controlName="accountingCode"
              [options]="accountingCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.accountingCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="帳款來源單號"
              controlName="accountSource"
              [control]="queryForm.controls.accountSource"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="摘要"
              controlName="summary"
              [control]="queryForm.controls.summary"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="傳票號碼"
              controlName="summonsNumber"
              [control]="queryForm.controls.summonsNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="傳票狀態"
              controlName="subpoenaStatus"
              [options]="subpoenaTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.subpoenaStatus"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="狀態"
              controlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="是否貼現"
              controlName="whetherDiscount"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whetherDiscount"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="對象別編號"
              controlName="objectNumber"
              [options]="objectNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.objectNumber"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="對帳KEY值"
              controlName="keyValue"
              [control]="queryForm.controls.keyValue"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
