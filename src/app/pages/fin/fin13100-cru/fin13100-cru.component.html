<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="goBack()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="傳票編號"
            controlName="VouNo"
            [control]="dataForm.controls.VouNo"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            label="傳票日期"
            controlName="VouDate"
            [control]="dataForm.controls.VouDate"
            [submitted]="submitted">
          </app-calendar>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="傳票狀態"
            controlName="PostFlag"
            [control]="dataForm.controls.PostFlag"
            [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="銷項稅額-貸方"
            controlName="TotalTaxAmt"
            [control]="dataForm.controls.TotalTaxAmt"
            [submitted]="submitted">
          </app-input-number>
        </div>
      </div>



      <app-fin32020table-edit
        title="列表明細"
        tableKey="FIN13100CRU_DETAIL"
        dataKey="RowId"
        [data]="detailRows"
        [columns]="detailColumns"
        [loading]="detailLoading"
        [disabled]="isRead"
        [showReorder]="!isRead"
        [showCheckBox]="!isRead"
        [showDelete]="!isRead"
        [showInsert]="false"
        [canInsert]="!isRead"
        [keepDeletedData]="false"
        [defaultInsertData]="defaultDetailRow"
        [showCaption]="!isRead"
        [showPaginator]="false"
        [scrollable]="false"
        (dataChange)="onDetailRowsChange($event)"
        (fieldChange)="onDetailFieldChange($event)"
        (delete)="onDetailDelete($event)">
      </app-fin32020table-edit>

      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="!isRead">
        <app-button
          btnType="cancel"
          [type]="'button'"
          (click)="onCancel()">
        </app-button>

        <app-button
          btnType="submit"
          [loading]="loading">
        </app-button>
      </div>
    </form>
  </p-panel>
</div>
