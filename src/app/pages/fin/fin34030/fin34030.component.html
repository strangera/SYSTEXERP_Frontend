<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="fncCode"
              [options]="fncCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.fncCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 立帳日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="立帳日期"
              [startControl]="queryForm.controls.sPostDate"
              [endControl]="queryForm.controls.ePostDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 收/付款日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="收/付款日期"
              [startControl]="queryForm.controls.sRpd"
              [endControl]="queryForm.controls.eRpd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 調整日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="調整日期"
              [startControl]="queryForm.controls.sAdjDate"
              [endControl]="queryForm.controls.eAdjDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 應付金額是否顯示 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="應付金額是否顯示"
              groupname="displayAmountRadio"
              [control]="queryForm.controls.displayAmount"
              [options]="displayAmountOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- 帳款餘額為零是否顯示 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="帳款餘額為零是否顯示"
              groupname="zeroBalanceDisplayRadio"
              [control]="queryForm.controls.showZeroBalance"
              [options]="showZeroBalanceOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- 是否只顯示專櫃 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="是否只顯示專櫃"
              groupname="displayOnlyCounter"
              [control]="queryForm.controls.displayOnlyCounter"
              [options]="displayOnlyCounterOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
      </form>

      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
