<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 廠客代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="廠客代號"
              controlName="PartyNoList"
              [options]="partyNoOptions | async"
              [optionLabel]="'label'"
              [optionValue]="'value'"
              [control]="queryForm.controls.PartyNoList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 立帳日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="立帳日期"
              [startControl]="queryForm.controls.DocDateFrom"
              [endControl]="queryForm.controls.DocDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 收/付款日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="收/付款日期"
              [startControl]="queryForm.controls.PayDateFrom"
              [endControl]="queryForm.controls.PayDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 調整日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="調整日期"
              [startControl]="queryForm.controls.AdjDateFrom"
              [endControl]="queryForm.controls.AdjDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>

        <hr />

        <div class="grid p-fluid">
          <!-- 應付金額是否顯示 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="應付金額是否顯示"
              groupname="ShowAPAmount"
              [control]="queryForm.controls.ShowAPAmount"
              [options]="showAPAmountOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- 帳款餘額為零是否顯示 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="帳款餘額為零是否顯示"
              groupname="ShowZeroBalance"
              [control]="queryForm.controls.ShowZeroBalance"
              [options]="showZeroBalanceOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- 是否只顯示專櫃 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="是否只顯示專櫃"
              groupname="OnlyTLT"
              [control]="queryForm.controls.OnlyTLT"
              [options]="onlyTLTOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [tableKey]="'fin34030_' + tableVer"
    [dataKey]="'ARAP_DocNo'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="false"
    [showFilter]="true"
    [showExcel]="false"
    [queryFunction]="queryFIN34030ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出 PDF"
          icon="pi pi-file-pdf"
          [loading]="btnExportPdfLoading"
          (click)="downloadFIN34030PDF()"
          [disabled]="btnExportPdfLoading"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
