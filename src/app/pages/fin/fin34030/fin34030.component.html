<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="廠客代號" controlName="PartyNoList" [options]="partyNoOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.PartyNoList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="立帳日期" [startControl]="queryForm.controls.DocDateFrom"
              [endControl]="queryForm.controls.DocDateTo" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="收/付款日期" [startControl]="queryForm.controls.PayDateFrom"
              [endControl]="queryForm.controls.PayDateTo" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="調整日期" [startControl]="queryForm.controls.AdjDateFrom"
              [endControl]="queryForm.controls.AdjDateTo" [submitted]="submitted"></app-calendar-range>
          </div>
        </div>

        <hr />

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="應付金額是否顯示" groupname="ShowAPAmount" [control]="queryForm.controls.ShowAPAmount"
              [options]="showFlagOptions" [submitted]="submitted"></app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="帳款餘額為零是否顯示" groupname="ShowZeroBalance"
              [control]="queryForm.controls.ShowZeroBalance" [options]="showFlagOptions"
              [submitted]="submitted"></app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否只顯示專櫃" groupname="OnlyTLT" [control]="queryForm.controls.OnlyTLT"
              [options]="onlyTLTOptions" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report [tableKey]="'fin34030'" [dataKey]="'ARAP_DocNo'" [columns]="columns" [data]="data"
    [totalRecords]="totalRecords" [loading]="loading" [showManage]="false" [showReportMode]="false" [showSignature]="true"
    [footerData]="footerData" [lastQueryBody]="lastQueryBody" [showDelete]="false" groupRowsBy="PartyNo"
    (linkClick)="onLinkClick($event)" [ItemSize]="60">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button styleClass="p-2" label="應收應付帳款查詢.PDF" icon="pi pi-file-pdf" [loading]="btnExportPdfLoading"
          (click)="downloadFIN34030PDF()" [disabled]="!data.length"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
