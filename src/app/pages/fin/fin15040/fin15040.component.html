<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div >
      <app-button
        btnType="create"
        label="產生媒體檔案"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
    <div >
      <app-button
        btnType="create"
        label="產生媒體磁片"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
    <div >
      <app-button
        btnType="create"
        label="錯誤記錄查詢"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="申報年月"
              [control]="queryForm.controls.declareYm"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="稅籍編號"
              controlName="taxNumber"
              [options]="taxNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.taxNumber"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="申報書種類"
              controlName="declareType"
              [options]="declareTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.declareType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
