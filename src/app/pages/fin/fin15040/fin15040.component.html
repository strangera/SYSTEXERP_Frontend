<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 發票日期起迄 -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="發票日期"
            [startControl]="queryForm.controls.InvoiceDateStart" [endControl]="queryForm.controls.InvoiceDateEnd"
            [submitted]="submitted"></app-calendar-range>

          <!-- 發票格式 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="發票格式" controlName="InvoiceFormat"
            [options]="invoiceFormatOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.InvoiceFormat" [submitted]="submitted"></app-dropdown>

          <!-- 字軌 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="字軌" controlName="Character"
            [control]="queryForm.controls.Character" [submitted]="submitted"></app-input-text>

          <!-- 發票號碼起迄 -->
          <app-input-text-range class="col-12 md:col-6 lg:col-4" label="發票號碼"
            [startControl]="queryForm.controls.InvoiceNumberStart" [endControl]="queryForm.controls.InvoiceNumberEnd"
            [submitted]="submitted"></app-input-text-range>

          <!-- 申報年月 -->
          <app-calendar class="col-12 md:col-6 lg:col-4" label="申報年月" calendarType="dateMonthOne"
            [control]="queryForm.controls.DeclareYearMonth" [submitted]="submitted"></app-calendar>

          <!-- 資料所屬年月起迄 -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="資料所屬年月" calendarType="dateMonthRange"
            [startControl]="queryForm.controls.DataYearMonthStart" [endControl]="queryForm.controls.DataYearMonthEnd"
            [submitted]="submitted"></app-calendar-range>

          <!-- 廠商編號(統一編號) -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="廠商編號(統一編號)" controlName="SellerUniform"
            [control]="queryForm.controls.SellerUniform" [submitted]="submitted"></app-input-text>

          <!-- 課稅別 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="課稅別" controlName="TaxType" [options]="taxTypeOptions"
            [optionLabel]="'label'" [optionValue]="'value'" [control]="queryForm.controls.TaxType"
            [submitted]="submitted"></app-dropdown>

          <!-- 憑證單號起迄 -->
          <app-input-text-range class="col-12 md:col-6 lg:col-4" label="憑證單號"
            [startControl]="queryForm.controls.VoucherNumberStart" [endControl]="queryForm.controls.VoucherNumberEnd"
            [submitted]="submitted"></app-input-text-range>

          <!-- 傳票號碼起迄 -->
          <app-input-text-range class="col-12 md:col-6 lg:col-4" label="傳票號碼"
            [startControl]="queryForm.controls.TransmissionNumberStart"
            [endControl]="queryForm.controls.TransmissionNumberEnd" [submitted]="submitted"></app-input-text-range>

          <!-- 系統別 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="系統別" controlName="SystemType"
            [options]="systemTypeOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.SystemType" [submitted]="submitted"></app-dropdown>

          <!-- 資產註記 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="資產註記" controlName="AssetRemark"
            [control]="queryForm.controls.AssetRemark" [submitted]="submitted"></app-input-text>

          <!-- 傳票建立者 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="傳票建立者" controlName="InvoiceCreator"
            [control]="queryForm.controls.InvoiceCreator" [submitted]="submitted"></app-input-text>

          <!-- 是否有統一編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否有統一編號" controlName="IsUniform"
            [options]="isUniformOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.IsUniform" [submitted]="submitted"></app-dropdown>

          <!-- 列印方式 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="列印方式" controlName="PrintType"
            [options]="printTypeOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.PrintType" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="FIN15040" dataKey="Sequence" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [multiSortMeta]="[{ field: 'Sequence', order: -1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [showManage]="false" [showDelete]="false">
  </app-table>
</div>
