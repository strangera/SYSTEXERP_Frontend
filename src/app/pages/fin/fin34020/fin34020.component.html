<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 廠客代號：range -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="廠客代號"
              controlName="VEN_No_From"
              [startControl]="queryForm.controls.VEN_No_From"
              [endControl]="queryForm.controls.VEN_No_To"
              [submitted]="submitted"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
            >
            </app-dropdown-range>
          </div>

          <!-- 科目代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="科目代號"
              controlName="AccNoList"
              [options]="accNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.AccNoList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 月結天數 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="月結天數"
              controlName="MoneyTypeList"
              [options]="moneyTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.MoneyTypeList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 立帳日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="立帳日期"
              [startControl]="queryForm.controls.ARS_Date_From"
              [endControl]="queryForm.controls.ARS_Date_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 收款日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="收款日期"
              [startControl]="queryForm.controls.RCV_Date_From"
              [endControl]="queryForm.controls.RCV_Date_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 調整日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="調整日期"
              [startControl]="queryForm.controls.ADJ_Date_From"
              [endControl]="queryForm.controls.ADJ_Date_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- ✅ 是否顯示應收金額（對應後端 ShowARSAmount string(1)） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              [label]="'是否顯示應收金額'"
              [groupname]="'ShowARSAmount'"
              [control]="queryForm.controls.ShowARSAmount"
              [options]="showOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- ✅ 帳款餘額為零是否顯示（對應後端 ShowZeroBalance string(1)） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              [label]="'帳款餘額為零是否顯示'"
              [groupname]="'ShowZeroBalance'"
              [control]="queryForm.controls.ShowZeroBalance"
              [options]="showOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN34020_TABLE'"
    [dataKey]="'ARS_No'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="false"
    [showManage]="false"
    [showDetail]="false"
    [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="false"
    [lazy]="true"
  >
    <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div></div>

        <div class="flex gap-2">
            <p-button
            styleClass="p-2"
            label="匯出應收帳款調整明細報表.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="匯出應收帳款調整明細報表.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

        
        </div>
      </div>
    </header>
  </app-table>
</div>
