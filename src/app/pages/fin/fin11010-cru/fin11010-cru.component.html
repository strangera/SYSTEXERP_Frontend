<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <app-input-text class="col-12 md:col-6 lg:col-4" label="公司代號(統一編號)" controlName="STO_Uniform"
                    [control]="dataForm.controls.STO_Uniform" [submitted]="submitted"></app-input-text>
                <app-input-text class="col-12 md:col-6 lg:col-4" label="營業人名稱" controlName="STO_TaxName"
                    [control]="dataForm.controls.STO_TaxName" [submitted]="submitted"></app-input-text>
                <app-input-text class="col-12 md:col-6 lg:col-4" label="稅籍編號" controlName="STO_TaxNo"
                    [control]="dataForm.controls.STO_TaxNo" [submitted]="submitted"></app-input-text>
                <app-input-text class="col-12 md:col-6 lg:col-4" label="負責人姓名" controlName="STO_ManagerName"
                    [control]="dataForm.controls.STO_ManagerName" [submitted]="submitted"></app-input-text>

                <app-input-text class="col-12 md:col-6 lg:col-4" label="營業地址" controlName="STO_Addr"
                    [control]="dataForm.controls.STO_Addr" [submitted]="submitted"></app-input-text>

                <app-dropdown class="col-12 md:col-6 lg:col-4" label="總繳代號" controlName="REP_OrgCode"
                    [options]="repOrgCodeOptions" optionLabel="Name" optionValue="No"
                    [control]="dataForm.controls.REP_OrgCode" [submitted]="submitted"></app-dropdown>

                <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否採直接扣抵法" controlName="STO_Direct"
                    [options]="directDeductOptions" optionLabel="Name" optionValue="No"
                    [control]="dataForm.controls.STO_Direct" [submitted]="submitted"></app-dropdown>

                <app-input-text class="col-12 md:col-6 lg:col-4" label="總公司統編" controlName="STO_HQUniform"
                    [control]="dataForm.controls.STO_HQUniform" [submitted]="submitted"></app-input-text>

                <app-dropdown class="col-12 md:col-6 lg:col-4" label="自行或委託辦理申報註記" controlName="STO_ApplyFlag"
                    [options]="applyFlagOptions" optionLabel="Name" optionValue="No"
                    [control]="dataForm.controls.STO_ApplyFlag" [submitted]="submitted"></app-dropdown>

                <app-input-text class="col-12 md:col-6 lg:col-4" label="(代理)申報人姓名" controlName="STO_ApplyName"
                    [control]="dataForm.controls.STO_ApplyName" [submitted]="submitted"></app-input-text>

                <app-input-text class="col-12 md:col-6 lg:col-4" label="(代理)申報人電話" controlName="STO_ApplyTEL"
                    [control]="dataForm.controls.STO_ApplyTEL" [submitted]="submitted"></app-input-text>

                <app-input-text class="col-12 md:col-6 lg:col-4" label="申報人分機" controlName="STO_ApplyTEL_ext"
                    [control]="dataForm.controls.STO_ApplyTEL_ext" [submitted]="submitted"></app-input-text>
                <app-input-text class="col-12 md:col-6 lg:col-4" label="代理申報人證書(登錄)字號" controlName="STO_ApplyID"
                    [control]="dataForm.controls.STO_ApplyID" [submitted]="submitted"></app-input-text>

                <app-calendar class="col-12 md:col-6 lg:col-4" label="申報年月起" controlName="REP_BegGUIYM"
                    [control]="dataForm.controls.REP_BegGUIYM" [submitted]="submitted"
                    calendarType="dateMonthOne"></app-calendar>
                <app-calendar class="col-12 md:col-6 lg:col-4" label="申報年月迄" controlName="REP_EndGUIYM"
                    [control]="dataForm.controls.REP_EndGUIYM" [submitted]="submitted"
                    calendarType="dateMonthOne"></app-calendar>
            </div>
            <div *ngIf="!isFormReadable"
                class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
                <app-button btnType="cancel" [form]="dataForm"></app-button>
                <app-button btnType="submit" [loading]="loading"></app-button>
            </div>
        </form>
    </p-panel>
    <!-- 註解文字 -->
    <div>
        <ul>
            <li>請注意 :</li>
            <li>1、代理申報人證書(登錄)字號 : 自行申報者免填，請填列完整年度及字號（例：097台財稅證字第0000001號）。</li>
        </ul>
    </div>
</div>
