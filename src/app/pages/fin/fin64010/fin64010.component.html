<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 第1列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="chkNo"
              [control]="queryForm.controls.chkNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收款對象(廠客)"
              controlName="venNo"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.venNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="客戶銀行帳號"
              controlName="custBankAccNo"
              [control]="queryForm.controls.custBankAccNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 第2列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="票面銀行代號"
              controlName="bankKeyList"
              [options]="bankKeyOptions"
              
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankKeyList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="託收帳戶-公司銀行科目"
              controlName="companyAccNoList"
              [options]="companyAccOptions"
              
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.companyAccNoList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收票業務員"
              controlName="salesIdList"
              [options]="salesOptions"
              
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.salesIdList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 第3列：日期區 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="託收日"
              [startControl]="queryForm.controls.colleDateFrom"
              [endControl]="queryForm.controls.colleDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="收票日"
              [startControl]="queryForm.controls.receDateFrom"
              [endControl]="queryForm.controls.receDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日"
              [startControl]="queryForm.controls.expireDateFrom"
              [endControl]="queryForm.controls.expireDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 第4列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="預兌日"
              [startControl]="queryForm.controls.preDateFrom"
              [endControl]="queryForm.controls.preDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="兌現日"
              [startControl]="queryForm.controls.cashDateFrom"
              [endControl]="queryForm.controls.cashDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
             
              label="票面金額"
              [startControl]="queryForm.controls.amtFrom"
              [endControl]="queryForm.controls.amtTo"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <!-- 第5列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據種類"
              controlName="chkType"
              [options]="chkTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.chkType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否客票"
              controlName="ticketYN"
              [options]="ticketYNOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ticketYN"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="收款單號"
              controlName="rcvNo"
              [control]="queryForm.controls.rcvNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 第6列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="comment"
              [control]="queryForm.controls.comment"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="orgId"
              [options]="orgOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.orgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代號"
              controlName="projectNo"
              [options]="projectOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.projectNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第7列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="tranStatus"
              [options]="tranStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tranStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據狀態"
              controlName="chkStatus"
              [options]="chkStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.chkStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              controlName="vouNo"
              [control]="queryForm.controls.vouNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 第8列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="chkTitle"
              [control]="queryForm.controls.chkTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="公司代號(取科目名稱用)"
              controlName="compNo"
              [control]="queryForm.controls.compNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN64010_TABLE'"
    [dataKey]="'ID'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="false"
    [showManage]="true"
    [showDetail]="true"
    [showEdit]="true"
    [lazy]="true"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
  >
  </app-table>
</div>
