<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 第1列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="ChkNo"
              [control]="queryForm.controls.ChkNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠客代號"
              controlName="VenNo"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.VenNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="銀行代號"
              controlName="BankNoList"
              [options]="bankNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.BankNoList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="客戶銀行帳號"
              controlName="CustBankAccNo"
              [control]="queryForm.controls.CustBankAccNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="託收日"
              [startControl]="queryForm.controls.ColleDateFrom"
              [endControl]="queryForm.controls.ColleDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="公司銀行科目代號"
              controlName="CompanyAccNoList"
              [options]="companyAccOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CompanyAccNoList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 第2列 -->
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="公司代號"
              controlName="CompNo"
              [control]="queryForm.controls.CompNo"
              [submitted]="submitted"
            ></app-input-text>
          </div> -->

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="收票日"
              [startControl]="queryForm.controls.ReceDateFrom"
              [endControl]="queryForm.controls.ReceDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收票業務員"
              controlName="SalesIdList"
              [options]="salesOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.SalesIdList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 第3列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="收款單號"
              controlName="RcvNo"
              [control]="queryForm.controls.RcvNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日"
              [startControl]="queryForm.controls.ExpireDateFrom"
              [endControl]="queryForm.controls.ExpireDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="預兌日"
              [startControl]="queryForm.controls.PreDateFrom"
              [endControl]="queryForm.controls.PreDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 第4列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="兌現日"
              [startControl]="queryForm.controls.PayDateFrom"
              [endControl]="queryForm.controls.PayDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="票面金額"
              [startControl]="queryForm.controls.AmtFrom"
              [endControl]="queryForm.controls.AmtTo"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據種類"
              controlName="ChkType"
              [options]="chkTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ChkType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第5列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否客票"
              controlName="TicketYN"
              [options]="ticketYNOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TicketYN"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              controlName="Comment"
              [control]="queryForm.controls.Comment"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="ChkTitle"
              [control]="queryForm.controls.ChkTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div> -->

          <!-- 第6列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="OrgId"
              [options]="orgOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.OrgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代號"
              controlName="ProjectNo"
              [options]="projectOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ProjectNo"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="TranStatus"
              [options]="tranStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TranStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 第7列 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="票據狀態"
              controlName="ChkStatus"
              [options]="chkStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ChkStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              controlName="VouNo"
              [control]="queryForm.controls.VouNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [type]="'button'" (clickEvent)="onClear(queryForm)"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN64010_TABLE'"
    [dataKey]="'ID'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="false"
    [showManage]="true"
    [showDetail]="true"
        [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="true"
    [lazy]="true"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [editDisabled]="isEditDisabled"
  ></app-table>
</div>
