<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button
        btnType="create"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="三碼代號"
              controlName="three-codecategorycode,"
              [control]="queryForm.controls.threecodecategorycode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="三碼名稱"
              controlName="Objectnumber"
              [control]="queryForm.controls.threecodecategoryname"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="三碼英文名稱"
              controlName="objectalias"
              [control]="queryForm.controls.threecodecategoryEname"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中類代號"
              controlName="mediumcategorycode"
              [options]="mediumcategorycodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.mediumcategorycode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
