<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票編號"
            controlName="VouNo"
            [control]="dataForm.controls.VouNo"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票種類"
            controlName="Voucher_Name"
            [control]="dataForm.controls.Voucher_Name"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="傳票型態"
            controlName="VoucherType"
            [control]="dataForm.controls.VoucherType"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar
            label="傳票日期"
            controlName="VouDate"
            [control]="dataForm.controls.VouDate"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6">
          <app-input-text
            label="傳票摘要"
            controlName="Remark"
            [control]="dataForm.controls.Remark"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text
            label="建立者"
            controlName="CRT_USR_Name"
            [control]="dataForm.controls.CRT_USR_Name"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar
            label="建立日"
            controlName="CRT_Date"
            [control]="dataForm.controls.CRT_Date"
          ></app-calendar>
        </div>
      </div>

      <div class="mt-3">
        @if (initTable) {
          <app-table-edit
            title="傳票明細"
            [data]="data"
            [columns]="columns"
            [showDelete]="false"
            [showInsert]="true"
            insertText="新增科目"
            [canInsert]="false"
            [showCheckBox]="false"
            [showFooter]="true"
            [loading]="loading"
            [disabled]="!isFormCreateable"
            (insert)="onAddAccountingLine()"
          >
            <ng-template #customCell let-rowData="rowData" let-col="col">
              @if (col.field === '_delete' && rowData._dataStatus === 'new' && isFormCreateable) {
                <button
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  class="p-button-danger p-button-text p-button-rounded"
                  (click)="onDeleteAccountingLine(rowData)"
                ></button>
              }
            </ng-template>
          </app-table-edit>
        }
      </div>

      @if (isFormCreateable) {
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onResetDetail()"></app-button>
          <app-button
            label="確定拋轉"
            icon="pi pi-send"
            [loading]="loading"
            [disabled]="!initTable"
            (click)="onConfirmPosting()"
          ></app-button>
        </div>
      }
    </form>
  </p-panel>
</div>
