<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" formControlName="invoice_month" label="發票年月"
          [required]="true"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" formControlName="prefix" label="字軌"
          [required]="true"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" formControlName="invoice_month_start" label="發票年月(起)"
          [required]="true"></app-input-text>
      </div>
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" formControlName="invoice_month_end" label="發票年月(迄)"
          [required]="true"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" formControlName="cashier_no" label="收銀員代號"
          [required]="true"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" formControlName="invoice_status" label="發票狀態"
          [options]="invoiceStatusOptions" [required]="true"></app-dropdown>
      </div>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" formControlName="usage_type" label="使用類型"
          [options]="usageTypeOptions" [required]="true"></app-dropdown>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
