<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 發票格式 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="發票格式"
              controlName="PUR_VoucherType"
              [options]="PUR_VoucherTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PUR_VoucherType"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 字軌 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="字軌"
              [control]="queryForm.controls.PUR_GUITrack"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 發票號碼（前端區間 -> 後端單值，送出時合併） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="發票號碼"
              [startControl]="queryForm.controls.PUR_GUINoStart"
              [endControl]="queryForm.controls.PUR_GUINoEnd"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <!-- 發票日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="發票日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.PUR_GUIDate_Start"
              [endControl]="queryForm.controls.PUR_GUIDate_End"
              [submitted]="submitted">
            </app-calendar-range>
            
          </div>

          <!-- 發票年月（可選） -->
          <div class="col-12 md:col-6 lg:col-4">
           <app-calendar
            controlName="PUR_GUIDate_YYYYMM"
            calendarType="dateMonthOne"
            label="資料所屬年月"
            [control]="queryForm.controls.PUR_GUIDate_YYYYMM"
            [submitted]="submitted">
          </app-calendar>
          </div>

          <!-- 資料所屬年月 -->
          <div class="col-12 md:col-6 lg:col-4">

            <app-calendar
            controlName="PUR_RepYYYYMM"
            calendarType="dateMonthOne"
            label="申報年月"
            [control]="queryForm.controls.PUR_RepYYYYMM"
            [submitted]="submitted">
          </app-calendar>
          </div>

          <!-- 廠商統編 -->
          <div class="col-12 md:col-6 lg:col-4">
             <app-dropdown
    label="廠商編號(統一編號)"
    controlName="PUR_VenUniform"
    [options]="vendorOptions"
    optionLabel="label"
    optionValue="value"
    [control]="queryForm.controls.PUR_VenUniform"
    [submitted]="submitted">
  </app-dropdown>
          </div>

          <!-- 發票總金額 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票總金額"
              [startControl]="queryForm.controls.PUR_Amt_Small"
              [endControl]="queryForm.controls.PUR_Amt_Big"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <!-- 未稅金額 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票未稅金額"
              [startControl]="queryForm.controls.PUR_Net_Small"
              [endControl]="queryForm.controls.PUR_Net_Big"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <!-- 稅額 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票稅額"
              [startControl]="queryForm.controls.PUR_Tax_Small"
              [endControl]="queryForm.controls.PUR_Tax_Big"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <!-- 發票用途（多選=>逗號字串） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="發票用途"
              [control]="queryForm.controls.PUR_DirectType"
              [options]="directTypeOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 課稅別（多選=>逗號字串） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="課稅別"
              [control]="queryForm.controls.PUR_TaxType"
              [options]="taxTypeOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 類別區分（多選=>逗號字串） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="類別區分"
              [control]="queryForm.controls.PUR_Type"
              [options]="typeOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 憑證單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="憑證單號"
              [control]="queryForm.controls.Source_Doc_No"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 傳票號碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票號碼"
              [control]="queryForm.controls.Voucher_No"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 銷售類型（若不用可不填） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="銷售類型"
              [control]="queryForm.controls.SAL_Type"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 備註 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              [control]="queryForm.controls.PUR_Remark"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 建/改檔者與日期（可選） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="建檔人員" [control]="queryForm.controls.CRT_USR_Name" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="建檔日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.CRT_Date_Start"
              [endControl]="queryForm.controls.CRT_Date_End"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="修改人員" [control]="queryForm.controls.UPD_USR_Name" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="修改日期"
              calendarType="dateRange"
              [startControl]="queryForm.controls.UPD_Date_Start"
              [endControl]="queryForm.controls.UPD_Date_End"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="FIN13050"
    [data]="data"
    [columns]="columns"
    dataKey="id"
    [multiSortMeta]="[{ field: 'PUR_GUIDate', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="true"
    [showDelete]="true"
    [showCheckBox]="true"
    (delete)="onDelete($event)"  
    (lazyLoadData)="onLazyLoadData($event, queryForm)">
  </app-table>
</div>
