<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      [header]="'query-conditions' | translate"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="保管人代碼"
            controlName="Keep_UsrNo"
            [options]="usrNoDisplayOptions()"
            optionLabel="displayLabel"
            optionValue="Keep_UsrNo"
            [loading]="service.usrLoading()"
            [control]="qf().Keep_UsrNo"
            [submitted]="submitted"
          ></app-dropdown>

          <app-input-number-range
            class="col-12 md:col-6 lg:col-4"
            [startLabel]="'零用金額度'"
            [startControl]="qf().Keep_QuotaAmt_S"
            [endControl]="qf().Keep_QuotaAmt_E"
            [minFractionDigits]="0"
            [maxFractionDigits]="0"
            [submitted]="submitted"
          ></app-input-number-range>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="保管單位"
            controlName="Keep_Orgid"
            [options]="orgIdDisplayOptions()"
            optionLabel="displayLabel"
            optionValue="Org_No"
            [loading]="service.orgLoading()"
            [control]="qf().Keep_Orgid"
            [submitted]="submitted"
          ></app-dropdown>

          <app-input-textarea
            class="col-12 md:col-6 lg:col-4"
            label="說明"
            controlName="Keep_Remark"
            [control]="qf().Keep_Remark"
            [styleClass]="'h-10rem'"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="FIN71020"
      dataKey="ID"
      [data]="tableData()"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="service.loadFIN71020.bind(service)"
      [loading]="tableLoading()"
      [showCheckBox]="true"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      (delete)="onDelete($event)"
    ></app-table-report>
  </div>
</div>
