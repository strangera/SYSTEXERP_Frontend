<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab [header]="'query-conditions' | translate"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="保管人代碼"
                        controlName="usrNo"
                        [options]="service.UsrNos()"
                        optionLabel="Keep_UsrName"
                        optionValue="Keep_UsrNo"
                        [loading]="service.usrLoading()"
                        [control]="qf().usrNo"
                        [submitted]="submitted"></app-dropdown>

          <app-input-number-range class="col-12 md:col-6 lg:col-4"
                                  [startLabel]="'零用金額度'"
                                  [startControl]="qf().SKeepQuotaAmt"
                                  [endControl]="qf().EKeepQuotaAmt"
                                  [minFractionDigits]="0"
                                  [maxFractionDigits]="0"
                                  [submitted]="submitted"></app-input-number-range>

          <app-dropdown class="col-12 md:col-6 lg:col-4"
                        label="保管單位"
                        controlName="orgId"
                        [options]="service.OrgIds()"
                        optionLabel="Org_Name"
                        optionValue="Org_No"
                        [loading]="service.orgLoading()"
                        [control]="qf().orgId"
                        [submitted]="submitted"></app-dropdown>

          <app-input-textarea class="col-12 md:col-6 lg:col-4"
                              label="說明"
                              controlName="remark"
                              [control]="qf().remark"
                              [styleClass]="'h-10rem'"
                              [submitted]="submitted"></app-input-textarea>
        </div>


        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"
                      [form]="queryForm"></app-button>
          <app-button btnType="query"
                      [loading]="service.tableLoading()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>


<div class="card">
  <div class="col-12">
    <app-table [data]="filteredData()"
               [columns]="columns"
               [totalRecords]="totalRecords()"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"
               [tableKey]="'FIN71020'"
               [dataKey]="'id'"
               (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
               [lazy]="true"
               [loading]="service.tableLoading()"></app-table>
  </div>
</div>
