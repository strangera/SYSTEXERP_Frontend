<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="back()"></app-button>
  </div>

  <!-- ====== 固定抬頭 ====== -->
  <div class="flex flex-column align-items-center mb-3">
    <div class="text-2xl font-bold mb-1 text-center">
      南紡流通事業股份有限公司(南紡購物中心)
    </div>
    <div class="text-xl font-bold text-center">
      轉帳傳票
    </div>
  </div>

  <!-- 第二行：四項資訊（全部來自 store meta；頁數不顯示） -->
  <div class="grid text-sm text-700">
    <!-- 傳票日期 -->
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票日期：</span>
      <span class="font-medium">{{ meta?.vouDate || header?.VouDate || '' }}</span>
    </div>
    <!-- 傳票型態 -->
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票型態：</span>
      <span class="font-medium">{{ meta?.vouType || '' }}</span>
    </div>
    <!-- 傳票編號 -->
    <div class="col-12 md:col-3">
      <span class="mr-2">傳票編號：</span>
      <span class="font-medium">{{ meta?.vouNo || vouNo || '' }}</span>
    </div>
    <!-- 狀態 -->
    <div class="col-12 md:col-3">
      <span class="mr-2">狀態：</span>
      <span class="font-medium">{{ meta?.vouStatus || '' }}</span>
    </div>
  </div>
</div>

<div class="card">
  <app-table
    tableKey="FIN55050CRU"
    dataKey="__rowid"
    [data]="rows"
    [columns]="columns"
    [showCheckBox]="false"
    [showManage]="false"
    [showDelete]="false"
    [multiSortMeta]="[]"
    [totalRecords]="rows?.length || 0"
    [lazy]="false"
    [loading]="false"
    [showSerialNo]="true"
    [showPaginator]="false">
  </app-table>

  <div *ngIf="rows?.length === 0" class="mt-3 text-600">
    查無明細資料。請回列表重新查詢，或確認此傳票號碼是否包含明細。
  </div>
</div>
