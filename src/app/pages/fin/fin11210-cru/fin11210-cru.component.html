<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="參數代碼" controlName="code"
          [control]="dataForm.controls.code" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="參數內容" controlName="content"
          [control]="dataForm.controls.content" [submitted]="submitted" />
      </div>
    </form>
  </p-panel>
</div>
