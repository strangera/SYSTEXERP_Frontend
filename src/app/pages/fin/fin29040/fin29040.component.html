<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 查詢年月(起訖) - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="查詢年月" [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="factoryID" [options]="factoryIDOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.factoryID" [submitted]="submitted"></app-dropdown>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="報表方式" groupname="showUp" [control]="queryForm.controls.showUp"
              [options]="showUpOptions" [submitted]="submitted"></app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4"></div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="FIN29080" dataKey="ExpectedPayDate" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [lazy]="false" [loading]="loading" [showManage]="false" [showReportMode]="false"
    [subTotalData]="summaryData" groupRowsBy="PartyNo">
    <header>
      <div class="flex justify-content-end gap-2 mb-2">
        <app-button label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF(queryForm)"
          [loading]="exportPDFbtnLoading" [disabled]="loading || (data.length || 0) === 0"></app-button>
        <app-button label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportExcel(queryForm)"
          [loading]="exportExcelbtnLoading" [disabled]="loading || (data.length || 0) === 0"></app-button>
      </div>
    </header>
  </app-table-report>
  @if (data.length) {
    <app-report-signature dataType="FIN29040" />
  }
</div>
