<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 匯款單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="匯款單號"
              controlName="transferSource"
              [options]="transferSourceOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.transferSource"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 建立日期(起迄) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="建立日期"
              [startControl]="queryForm.controls.buildDateFrom"
              [endControl]="queryForm.controls.buildDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 匯款日期(起迄) 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="匯款日期"
              [startControl]="queryForm.controls.transferDateFrom"
              [endControl]="queryForm.controls.transferDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>

        <div class="grid p-fluid">
          <!-- 銀行代號 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="銀行代號"
              controlName="bankCode"
              [control]="queryForm.controls.bankCode"
              [submitted]="submitted"
            ></app-input-number>
          </div>

          <!-- 銀行名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="銀行名稱"
              controlName="bankName"
              [control]="queryForm.controls.bankName"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 拋轉傳票 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="拋轉傳票"
              controlName="tossSummon"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tossSummon"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <!-- 傳票編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="傳票編號"
              controlName="SummonNumber"
              [control]="queryForm.controls.SummonNumber"
              [submitted]="submitted"
            ></app-input-number>
          </div>

          <!-- 檔案名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="檔案名稱"
              controlName="fileName"
              [control]="queryForm.controls.fileName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          >
          </app-button>

          <app-button
            btnType="query"
            [loading]="loading"
          >
          </app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 主表 -->
<div class="card">
  <app-table-report
    [tableKey]="'fin26010_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="true"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryFIN26010ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="true"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產生匯款檔"
          icon="pi pi-file"
          [loading]="btnGenerateFileLoading"
          (click)="generateRemitFile()"
          [disabled]="
            btnGenerateFileLoading ||
            loading ||
            !selectedItems ||
            selectedItems.length === 0
          "
        >
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
