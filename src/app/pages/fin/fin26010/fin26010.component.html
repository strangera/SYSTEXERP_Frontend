<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 匯款單號 WSLIP_NO -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="匯款單號"
              controlName="SummonNumber"
              [control]="queryForm.controls.transferSource"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 建立日期(起迄) CRT_DateFrom / CRT_DateTo -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="建立日期"
              [startControl]="queryForm.controls.buildDateFrom"
              [endControl]="queryForm.controls.buildDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 匯款日期(起迄) RMT_DateFrom / RMT_DateTo -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="匯款日期"
              [startControl]="queryForm.controls.transferDateFrom"
              [endControl]="queryForm.controls.transferDateTo"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 銀行代號 BNK_id：用 dropdown，選項文字 BNK_No-BNK_BRANCHNAME，值為 BNK_DepositAccNo -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="銀行代號"
              controlName="bankCode"
              [options]="bankOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bankCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 拋轉傳票 Status (Y/N) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="拋轉傳票"
              controlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 傳票編號 VouNo -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="傳票編號"
              controlName="SummonNumber"
              [control]="queryForm.controls.SummonNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 檔案名稱 File_Name -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="檔案名稱"
              controlName="fileName"
              [control]="queryForm.controls.fileName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          >
          </app-button>

          <app-button btnType="query" [loading]="loading"> </app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 主表 -->
<div class="card">
  <app-table-report
    [tableKey]="'fin26010_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="false"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryFIN26010ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="true"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產生匯款檔"
          icon="pi pi-file"
          [loading]="btnGenerateFileLoading"
          (click)="generateRemitFile()"
          [disabled]="
            btnGenerateFileLoading ||
            loading ||
            !selectedItems ||
            selectedItems.length === 0
          "
        >
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
