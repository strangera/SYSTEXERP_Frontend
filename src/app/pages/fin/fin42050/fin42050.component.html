<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="類別"
              groupname="reportTypeRadio"
              [control]="queryForm.controls.ReportType"
              [options]="ReportType_Options"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName="Org_ID"
              [options]="OrgId_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.Org_ID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 是否含以下所屬部門 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsCludeDownOrg"
              formControlName="IsCludeDownOrg"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsCludeDownOrg">是否含以下所屬部門</label>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="單位金額表示"
              groupname="amtUnitRadio"
              [control]="queryForm.controls.AmtUnit"
              [options]="AmtUnit_Options"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <!-- 是否為ROC報表 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsROC"
              formControlName="IsROC"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsROC">是否為ROC報表</label>
          </div>

          <!-- 實際值 -->
          <div class="col-12">
            <fieldset>
              <legend>實際值</legend>
              <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                  <app-calendar
                    calendarType="dateMonthOne"
                    label="年月"
                    controlName="ActualYM"
                    [control]="queryForm.controls.ActualYM"
                    [submitted]="submitted"
                  ></app-calendar>
                </div>
              </div>
            </fieldset>
          </div>

          <!-- 預算版本1 -->
          <div class="col-12">
            <fieldset>
              <legend>預算版本1</legend>
              <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                  <app-calendar
                    calendarType="dateMonthOne"
                    label="年月"
                    controlName="BudgetYM1"
                    [control]="queryForm.controls.BudgetYM1"
                    [submitted]="submitted"
                  ></app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                  <app-input-text
                    label="版本別"
                    controlName="BudgetVersion1"
                    [control]="queryForm.controls.BudgetVersion1"
                    [submitted]="submitted"
                  ></app-input-text>
                </div>
              </div>
            </fieldset>
          </div>

          <!-- 預算版本2 -->
          <div class="col-12">
            <fieldset>
              <legend>預算版本2</legend>
              <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                  <app-calendar
                    calendarType="dateMonthOne"
                    label="年月"
                    controlName="BudgetYM2"
                    [control]="queryForm.controls.BudgetYM2"
                    [submitted]="submitted"
                  ></app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                  <app-input-text
                    label="版本別"
                    controlName="BudgetVersion2"
                    [control]="queryForm.controls.BudgetVersion2"
                    [submitted]="submitted"
                  ></app-input-text>
                </div>
              </div>
            </fieldset>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      tableKey="FIN42050"
      [data]="data"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [showDelete]="false"
      [showManage]="false"
      [showCheckBox]="false"
      [showSort]="false"
      [showReportMode]="false"
      dataKey="SortNo"
      [lazy]="true"
      [loading]="loading"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="預算版本比較表.PDF"
            [loading]="btnPDFLoading"
            (click)="exportPDF()"
            icon="pi pi-file"
            [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="預算版本比較表.XLSX"
            [loading]="btnExcelLoading"
            icon="pi pi-file-excel"
            (click)="exportExcel()"
            [disabled]="
              data.length === 0 || !hasPermission(Actions.ExportExcel)
            "
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
