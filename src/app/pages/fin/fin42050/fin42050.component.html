<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12">
            <app-radiobutton
              label="類別"
              [control]="queryForm.controls.type"
              [options]="typeOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <!-- 區域 1: 實際值 -->
          <div class="col-12">
            <fieldset class="no-border">
              <legend>實際值</legend>
              <div class="col-12">
                <app-calendar
                  calendarType="dateMonthOne"
                  label="年月"
                  controlName="year"
                  [control]="queryForm.controls.year1"
                  [submitted]="submitted"
                ></app-calendar>
              </div>
            </fieldset>
          </div>

          <!-- 區域 2: 預算版本1 -->
          <div class="col-12">
            <fieldset class="no-border">
              <legend>預算版本1</legend>
              <div class="col-12">
                <app-calendar
                  calendarType="dateMonthOne"
                  label="年月"
                  controlName="year"
                  [control]="queryForm.controls.year2"
                  [submitted]="submitted"
                ></app-calendar>
              </div>
              <div class="col-12">
                <app-input-text
                  label="版本別"
                  controlName="version1"
                  [control]="queryForm.controls.version1"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
            </fieldset>
          </div>

          <!-- 區域 3: 預算版本2 -->
          <div class="col-12">
            <fieldset class="no-border">
              <legend>預算版本2</legend>
              <div class="col-12">
                <app-calendar
                  calendarType="dateMonthOne"
                  label="年月"
                  controlName="year"
                  [control]="queryForm.controls.year"
                  [submitted]="submitted"
                ></app-calendar>
              </div>
              <div class="col-12">
                <app-input-text
                  label="版本別"
                  controlName="version2"
                  [control]="queryForm.controls.version2"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
            </fieldset>
          </div>

          <!-- 其他表單字段 -->
          <div class="col-12">
            <app-dropdown
              label="部門"
              controlName="department"
              [options]="departmentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.department"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12">
            <app-radiobutton
              label="單位金額表示"
              groupname="systemtyperadio"
              [control]="queryForm.controls.unit"
              [options]="unitOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
