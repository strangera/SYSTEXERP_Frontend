<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
    </div>
    <p-accordion>
        <p-accordionTab header="查詢條件" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">

                    <!-- 發票號碼起迄 -->
                    <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="發票號碼(起)" endLabel="發票號碼(迄)"
                        [startControl]="queryForm.controls.invNoStart" [endControl]="queryForm.controls.invNoEnd"
                        [submitted]="submitted" [errorForGroup]="true"></app-input-text-range>

                    <!-- 發票日期起迄 -->
                    <app-calendar-range class="col-12 md:col-6 lg:col-4" label="發票日期(起迄)" calendarType="dateRange"
                        [startControl]="queryForm.controls.invDateStart" [endControl]="queryForm.controls.invDateEnd"
                        [submitted]="submitted"></app-calendar-range>

                    <!-- 資料所屬年月(起迄) -->
                    <app-calendar-range class="col-12 md:col-6 lg:col-4" label="資料所屬年月(起迄)"
                        calendarType="dateMonthRange" [startControl]="queryForm.controls.invYmStart"
                        [endControl]="queryForm.controls.invYmEnd" [submitted]="submitted"></app-calendar-range>
                </div>

                <div class="grid p-fluid">
                    <!-- 申報年月 -->
                    <app-calendar class="col-12 md:col-6 lg:col-4" label="申報年月" controlName="declareYm"
                        [control]="queryForm.controls.declareYm" [submitted]="submitted"></app-calendar>

                    <!-- 買受人統一編號 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="買受人統一編號" controlName="buyerTaxNo"
                        [control]="queryForm.controls.buyerTaxNo" [submitted]="submitted"
                        placeholder="最長10個字串"></app-input-text>

                    <!-- 貨物或勞務名稱 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="貨物或勞務名稱" controlName="goodsName"
                        [control]="queryForm.controls.goodsName" [submitted]="submitted"
                        placeholder="最長20個字串"></app-input-text>
                </div>

                <div class="grid p-fluid">
                    <!-- 貨物或勞務數量 -->
                    <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="貨物或勞務數量(起)" endLabel="貨物或勞務數量(迄)"
                        [startControl]="queryForm.controls.goodsQtyStart" [endControl]="queryForm.controls.goodsQtyEnd"
                        [submitted]="submitted" [errorForGroup]="true"></app-input-text-range>

                    <!-- 外銷方式 -->
                    <app-dropdown class="col-12 md:col-6 lg:col-4" label="外銷方式" controlName="exportMethod"
                        [options]="exportMethodOptions" optionLabel="label" optionValue="value"
                        [control]="queryForm.controls.exportMethod" [submitted]="submitted"
                        placeholder="請選擇"></app-dropdown>

                    <!-- 證明文件號碼 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="證明文件號碼" controlName="docNo"
                        [control]="queryForm.controls.docNo" [submitted]="submitted"
                        placeholder="最長10個字串"></app-input-text>
                </div>

                <div class="grid p-fluid">
                    <!-- 證明文件名稱 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="證明文件名稱" controlName="docName"
                        [control]="queryForm.controls.docName" [submitted]="submitted"
                        placeholder="最長20個字串"></app-input-text>

                    <!-- 出口報單號碼 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="出口報單號碼" controlName="exportNo"
                        [control]="queryForm.controls.exportNo" [submitted]="submitted"
                        placeholder="最長10個字串"></app-input-text>

                    <!-- 出口報單類別 -->
                    <app-dropdown class="col-12 md:col-6 lg:col-4" label="出口報單類別" controlName="exportType"
                        [options]="exportTypeOptions" optionLabel="label" optionValue="value"
                        [control]="queryForm.controls.exportType" [submitted]="submitted"
                        placeholder="請選擇"></app-dropdown>
                </div>

                <div class="grid p-fluid">
                    <!-- 非經海關出口金額 -->
                    <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="非經海關出口金額(起)"
                        endLabel="非經海關出口金額(迄)" [startControl]="queryForm.controls.nonCustomsAmtStart"
                        [endControl]="queryForm.controls.nonCustomsAmtEnd" [submitted]="submitted"
                        [errorForGroup]="true"></app-input-text-range>

                    <!-- 經海關出口金額 -->
                    <app-input-text-range class="col-12 md:col-6 lg:col-4" startLabel="經海關出口金額(起)" endLabel="經海關出口金額(迄)"
                        [startControl]="queryForm.controls.customsAmtStart"
                        [endControl]="queryForm.controls.customsAmtEnd" [submitted]="submitted"
                        [errorForGroup]="true"></app-input-text-range>

                    <!-- 輸出或結匯日期(起迄) -->
                    <app-calendar-range class="col-12 md:col-6 lg:col-4" label="輸出或結匯日期(起迄)" calendarType="dateRange"
                        [startControl]="queryForm.controls.exportDateStart"
                        [endControl]="queryForm.controls.exportDateEnd" [submitted]="submitted"></app-calendar-range>
                </div>

                <div class="grid p-fluid">
                    <!-- 備註 -->
                    <app-input-text class="col-12 md:col-6 lg:col-4" label="備註" controlName="remark"
                        [control]="queryForm.controls.remark" [submitted]="submitted"
                        placeholder="最長100個字串"></app-input-text>
                </div>
                <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
                    <app-button btnType="clear"></app-button>
                    <app-button btnType="query" [loading]="loading"></app-button>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <app-table tableKey="FIN13030" dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)"
        (detail)="onDetail($event)" [multiSortMeta]="[{ field: 'invNoStart', order: -1 }]" [totalRecords]="totalRecords"
        (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
        [showDelete]="true" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event">
    </app-table>
</div>
