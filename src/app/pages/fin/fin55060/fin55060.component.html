<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
        class="grid p-fluid"
      >
        <!-- 查詢條件列 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range
            label="日期"
            calendarType="dateRange"
            [startControl]="queryForm.controls.TXN_BDATE"
            [endControl]="queryForm.controls.TXN_EDATE"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門"
            controlName="ORG_ID"
            [options]="ORG_IDOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ORG_ID"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="活動代碼"
            controlName="ProjectNo"
            [options]="ProjectNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ProjectNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="科目代號"
            controlName="AccNo"
            [options]="AccNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.AccNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="明細代號"
            controlName="DetailNo"
            [options]="DetailNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.DetailNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 查詢/清除按鈕 -->
        <div class="col-12 text-right mt-2">
          <app-button btnType="clear" (onClick)="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 查詢結果報表 -->
<div class="card">
  <app-table-report
    [title]="'分類帳報表'"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"

    [queryFunction]="queryFIN55060ForReport"
    [lastQueryBody]="lastQueryBody"


    [loading]="loading"

  ></app-table-report>
</div>
