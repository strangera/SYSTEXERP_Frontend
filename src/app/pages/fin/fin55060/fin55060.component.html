<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" [startControl]="queryForm.controls.TXN_BDATE"
              [endControl]="queryForm.controls.TXN_EDATE" [submitted]="submitted"></app-calendar-range>
          </div>

          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門" controlName="OrgId" [options]="org_idListOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OrgId" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 活動代碼(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="活動代碼" controlName="ProjectNo" [options]="ProjectNoListOptions | async"
              optionLabel="label" optionValue="value" [startControl]="queryForm.controls.PTAFrom"
              [endControl]="queryForm.controls.PTATo" [submitted]="submitted"></app-dropdown-range>
          </div>

          <!-- 科目代號(起訖) -->
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown-range label="科目代號" controlName="AccNo" [options]="AccNoListOptions | async"
              optionLabel="label" optionValue="value" [startControl]="queryForm.controls.AccNoFrom"
              [endControl]="queryForm.controls.AccNoTo" [submitted]="submitted"></app-dropdown-range>
          </div>

          <!-- 廠商編號(起訖) -->
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown-range label="廠商編號" controlName="Vendor" [options]="DetailNoListOptions | async"
              optionLabel="label" optionValue="value" [startControl]="queryForm.controls.VendorFrom"
              [endControl]="queryForm.controls.VendorTo" [submitted]="submitted"></app-dropdown-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-subheader [data]="data" [totalRecords]="totalRecords" [loading]="loading" (detail)="onDetail($event)">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF()"
          [loading]="PDFBtnLoading" [disabled]="loading || (data.length || 0) === 0"></p-button>
        <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportXLSX()"
          [loading]="XLSXBtnLoading" [disabled]="loading || (data.length || 0) === 0"></p-button>
        <!-- 新增「匯出 Excel (不分頁)」按鈕 -->
        <p-button styleClass="p-2" label="匯出 Excel（不分頁）" icon="pi pi-file-excel" (click)="onExportXLSXSingleSheet()"
          [loading]="XLSXSingleSheetBtnLoading" [disabled]="loading || (data.length || 0) === 0"></p-button>
      </div>
    </header>
  </app-table-subheader>
</div>
