<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="日期" [startControl]="queryForm.controls.TXN_BDATE"
              [endControl]="queryForm.controls.TXN_EDATE" [submitted]="submitted">
            </app-calendar-range>
          </div>
          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="部門" controlName="org_idList" [options]="org_idListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_idList" [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 活動 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="活動" controlName="ProjectNoList" [options]="ProjectNoListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.ProjectNoList"
              [submitted]="submitted">
            </app-multi-select>
          </div>
          <!-- 科目代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="科目代號" controlName="AccNoList" [options]="AccNoListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.AccNoList" [submitted]="submitted">
            </app-multi-select>
          </div>
          <!-- 廠商代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="廠商代號" controlName="DetailNoList" [options]="DetailNoListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.DetailNoList"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-subheader tableKey="FIN55060" dataKey="AccNo" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showManage]="false" [showDelete]="false" [multiSortMeta]="[]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showSerialNo]="true" [showPaginator]="true">
  </app-table-subheader>
</div>
