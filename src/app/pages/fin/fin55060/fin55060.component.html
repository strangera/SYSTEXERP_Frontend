<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="日期"
              [startControl]="queryForm.controls.TXN_BDATE"
              [endControl]="queryForm.controls.TXN_EDATE"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName="OrgId"
              [options]="org_idListOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.OrgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 活動代碼(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="活動代碼"
              controlName="ProjectNo"
              [options]="ProjectNoListOptions"
              optionLabel="label"
              optionValue="value"
              [startControl]="queryForm.controls.PTAFrom"
              [endControl]="queryForm.controls.PTATo"
              [submitted]="submitted"
            ></app-dropdown-range>
          </div>

          <!-- 科目代號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="科目代號"
              controlName="AccNo"
              [options]="AccNoListOptions"
              optionLabel="label"
              optionValue="value"
              [startControl]="queryForm.controls.AccNoFrom"
              [endControl]="queryForm.controls.AccNoTo"
              [submitted]="submitted"
            ></app-dropdown-range>
          </div>

          <!-- 廠商代號(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="廠商代號"
              controlName="Vendor"
              [options]="DetailNoListOptions"
              optionLabel="label"
              optionValue="value"
              [startControl]="queryForm.controls.VendorFrom"
              [endControl]="queryForm.controls.VendorTo"
              [submitted]="submitted"
            ></app-dropdown-range>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 表格 + 匯出按鈕在同一個 CARD，分頁模式依 FIN55050（不顯示 paginator / serialNo） -->
<div class="card">
  <div class="flex justify-content-end gap-2 mb-2">
    <app-button
      label="匯出 PDF"
      icon="pi pi-file-pdf"
      (clickEvent)="onExportPDF()"
      [loading]="PDFBtnLoading"
      [disabled]="loading || (data.length || 0) === 0"
    ></app-button>

    <app-button
      label="匯出 Excel"
      icon="pi pi-file-excel"
      (clickEvent)="onExportXLSX()"
      [loading]="XLSXBtnLoading"
      [disabled]="loading || (data.length || 0) === 0"
    ></app-button>
  </div>

  <app-table-subheader
    tableKey="FIN55060"
    dataKey="AccNo4"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    [showManage]="false"
    [showDelete]="false"
    [multiSortMeta]="[]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    [showSerialNo]="false"
    [showPaginator]="false"
    [showReportMode]="false"
    [groupRowsBy]="'AccNo4'"
    [groupRowsByName]="'AccNo4Name'"
    (detail)="onDetail($event)"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showSort]="false"
  ></app-table-subheader>
</div>
