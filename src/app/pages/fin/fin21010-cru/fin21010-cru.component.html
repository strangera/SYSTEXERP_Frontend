<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="公司銀行科目 代碼/名稱" controlName="BNK_DepositAccNo"
            [options]="GLS1005_BNK_DepositAccNo_Option | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.BNK_DepositAccNo" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="全省銀行 代碼/名稱" controlName="BNK_No" [options]="APS1004_Option | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="帳號" controlName="BNK_AccNo" [control]="dataForm.controls.BNK_AccNo"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="帳戶名稱" controlName="BNK_AccName1" [control]="dataForm.controls.BNK_AccName1"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="存款代碼" controlName="BNK_AccType" [options]="BNK_AccType_Option" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.BNK_AccType" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="應收票據" controlName="BNK_CheckInAccNo" [options]="GLS1005_BNK_CheckInAccNo_Option | async"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.BNK_CheckInAccNo"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="應付票據" controlName="BNK_CheckOutAccNo"
            [options]="GLS1005_BNK_CheckOutAccNo_Option | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.BNK_CheckOutAccNo" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
