<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateMonthRange"
              label="日期(年)"
              controlName="accountsummary"
              [startControl]="queryForm.controls.Sdate"
              [endControl]="queryForm.controls.Edate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateMonthRange"
              label="比較日期(年)"
              controlName="accountsummary"
              [startControl]="queryForm.controls.CSdate"
              [endControl]="queryForm.controls.CEdate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName="department"
              [options]="departmentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.department"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="類別"
              [control]="queryForm.controls.category"
              [options]="category"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為對象別"
              controlName="ifOptions"
              [options]="ifOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ifOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
