<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="常用傳票代號"
                        controlName="typeCode"
                        [control]="df().typeCode"
                        [submitted]="submitted"></app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="常用傳票名稱"
                        controlName="subpoenaName"
                        [control]="df().subpoenaName"
                        [submitted]="submitted"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="傳票種類"
                      controlName="subpoenaType"
                      [options]="service.subpoenaTypes()"
                      optionLabel="Name"
                      optionValue="No"
                      [showClear]="false"
                      [control]="df().subpoenaType"
                      [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="建立者"
                        controlName="creator"
                        [control]="df().creator"
                        [disabled]="true"
                        [submitted]="submitted"></app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4"
                      label="建立日"
                      controlName="createDate"
                      [control]="df().createDate"
                      [disabled]="true"
                      [submitted]="submitted"></app-calendar>
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="修改者"
                        controlName="modifier"
                        [control]="df().modifier"
                        [disabled]="true"
                        [submitted]="submitted"></app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4"
                      label="修改日"
                      controlName="modifyDate"
                      [control]="df().modifyDate"
                      [disabled]="true"
                      [submitted]="submitted"></app-calendar>
      </div>
      <div *ngIf="!isFormReadable"
           class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"></app-button>
        <app-button btnType="submit"
                    [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>


<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="資料"
               class="line-height-3 m-0 mb-3">
        <app-table [showManage]="false"
                   [showReorder]="true"
                   [showTotal]="true"
                   [showInsert]="!isFormReadable"
                   [showEdit]="!isFormReadable"
                   [showDelete]="!isFormReadable"
                   [insertRowData]="true"
                   (fieldChange)="onFieldChange($event)"
                   (rowEditInit)="onRowEditInit($event)"
                   (rowEditSave)="onRowEditSave($event)"
                   (rowEditCancel)="onRowEditCancel($event)"
                   (delete)="onDelete($event)"
                   (insert)="onInsert($event)"
                   [data]="filteredData()"
                   [totalRecords]="totalRecords()"
                   [loading]="service.tableLoading"
                   [dataKey]="'id'"
                   [tableKey]="'FIN52030_detail'"
                   [columns]="columns">
        </app-table>
      </p-panel>
    </div>
  </div>
</div>
