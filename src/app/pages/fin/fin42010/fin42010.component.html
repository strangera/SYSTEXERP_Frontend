<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="版本"
              controlName="version"
              [control]="queryForm.controls.version"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateYearOne"
              label="年"
              controlName="year"
              [control]="queryForm.controls.year"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName=" department"
              [options]="departmentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.department"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="單位金額表示"
              groupname="systemtyperadio"
              [control]="queryForm.controls.unit"
              [options]="unitOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <div class="flex justify-content-end align-items-center gap-2 p-2">
      <p-button
        styleClass="p-2"
        label="預計損益表.PDF"
        [loading]="btnLoading"
        icon="pi pi-file"
        [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
      ></p-button>
      <p-button
        styleClass="p-2"
        label="預計損益表.XLSX"
        [loading]="btnLoading"
        icon="pi pi-file"
        [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
      ></p-button>
    </div>
    <app-table-subheader-report [data]="data"></app-table-subheader-report>
  </div>
</div>
