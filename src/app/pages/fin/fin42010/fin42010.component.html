<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="預算版本"
              controlName="BudgetVersion"
              [control]="queryForm.controls.BudgetVersion"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateYearOne"
              label="年"
              controlName="BudgetYear"
              [control]="queryForm.controls.BudgetYear"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName=" OrgId"
              [options]="OrgId_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.OrgId"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 是否含以下所屬部門 -->
          <div class="col-12 md:col-4 lg:col-4 mt-4">
            <p-checkbox
              inputId="IsCludeDownOrg"
              formControlName="IsCludeDownOrg"
              [binary]="true"
              trueValue="Y"
              falseValue="N"
            ></p-checkbox>
            <label for="IsCludeDownOrg">是否含以下所屬部門</label>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="單位金額表示"
              groupname="systemtyperadio"
              [control]="queryForm.controls.AmtUnit"
              [options]="AmtUnit_Options"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="是否顯示整年度預算為0的會科"
              groupname="systemzeroradio"
              [control]="queryForm.controls.ShowZero"
              [options]="Zero_Options"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="FIN42010"
      [data]="data"
      [columns]="columns"
      [expansionRowsPerPageOptions]="[100, 300, 500, 600]"
      [rows]="600"
      [rowsPerPageOptions]="[100, 300, 500, 600]"
      [showDelete]="false"
      [showManage]="false"
      [showCheckBox]="false"
      [showSort]="false"
      [showReportMode]="false"
      dataKey="SortNo"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="預計損益表.PDF"
            [loading]="btnPDFLoading"
            (click)="printPDF(true)"
            icon="pi pi-file"
            [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="預計損益表.XLSX"
            [loading]="btnExcelLoading"
            icon="pi pi-file"
            (click)="printPDF(false)"
            [disabled]="
              data.length === 0 || !hasPermission(Actions.ExportExcel)
            "
          ></p-button>
        </div>
      </header>
    </app-table>
    @if (data.length) {
      <app-report-signature dataType="FIN42010" />
    }
  </div>
</div>
