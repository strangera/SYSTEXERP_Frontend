<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 第1列：公司銀行科目代號(多選) / 到期日(起迄) / 票據號碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="公司銀行科目代號"
              controlName="companyAccNoList"
              [options]="companyAccOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.companyAccNoList"
              [submitted]="submitted"
              
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="到期日"
              [startControl]="queryForm.controls.expireDateStart"
              [endControl]="queryForm.controls.expireDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據號碼"
              controlName="chkNo"
              [control]="queryForm.controls.chkNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 第2列：到期傳票編號 / 狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="到期傳票編號"
              controlName="vouNoExpire"
              [control]="queryForm.controls.vouNoExpire"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="chkStatus"
              [options]="chkStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.chkStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button
            [type]="'button'"
            label="支票託收"
            (clickEvent)="onCollect()"
          ></app-button>

          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>

          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- ✅ 列表：app-table 勾選 + isRowSelectable -->
<div class="card">
  <app-table
    #finTable
    [tableKey]="'FIN64020_TABLE'"
    [dataKey]="'CHK_No'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showSerialNo]="true"
    [showCheckBox]="true"
    [selectionMode]="'multiple'"
    [(selectedItems)]="selectedItems"
    [isRowSelectable]="isRowSelectable"
    [showManage]="true"
    [showDetail]="false"
    [showReportMode]="false"
    [showDelete]="false"
    [showEdit]="false"
    [lazy]="true"
  >
    <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div></div>

        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="匯出應收票據託收作業.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="匯出應收票據託收作業.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table>
</div>

<!-- ✅ 支票託收 Dialog -->
<p-dialog
  header="支票託收"
  [(visible)]="collectDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '560px' }"
>
  <form [formGroup]="collectForm" class="p-fluid">
    <div class="grid">
      <div class="col-12">
        <app-calendar
          calendarType="dateOne"
          label="託收日期"
          controlName="CollectDate"
          [control]="collectForm.controls.CollectDate"
          [submitted]="submitted"
        ></app-calendar>
      </div>

      <div class="col-12">
        <app-dropdown
          label="託收銀行"
          controlName="CollectBankNo"
          [options]="collectBankOptions"
          optionLabel="label"
          optionValue="value"
          [control]="collectForm.controls.CollectBankNo"
          [submitted]="submitted"
        ></app-dropdown>
      </div>


    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button label="取消" severity="secondary" (onClick)="onCollectCancel()"></p-button>
      <p-button label="確認" [loading]="btnLoading" (onClick)="onCollectConfirm()"></p-button>
    </div>
  </ng-template>
</p-dialog>
