<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="銷售日期" [startControl]="queryForm.controls.Sale_DateStart"
              [endControl]="queryForm.controls.Sale_DateEnd" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="產檔日期" [startControl]="queryForm.controls.Gen_DateStart"
              [endControl]="queryForm.controls.Gen_DateEnd" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range startLabel="起始發票號碼(含字軌)" endLabel="結束發票號碼(含字軌)"
              [startControl]="queryForm.controls.TXN_GUINoStart" [endControl]="queryForm.controls.TXN_GUINoEnd"
              [submitted]="submitted" [errorForGroup]="true" />
          </div>
        </div>
        <div class="grid p-fluid">
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range startLabel="起始收銀機代號" endLabel="結束收銀機代號"
            [startControl]="queryForm.controls.ECR_No_start" [endControl]="queryForm.controls.ECR_No_end"
            [submitted]="submitted" [errorForGroup]="true" />
          </div> -->
          <app-dropdown class=" col-12 md:col-6 lg:col-4" label="收銀機號(起)" controlName="ECR_NoStart"
            [options]="POS_NOSOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.ECR_NoStart" [submitted]="submitted" />
          <app-dropdown class=" col-12 md:col-6 lg:col-4" label="收銀機號(迄)" controlName="ECR_NoEnd"
            [options]="POS_NOSOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.ECR_NoEnd"
            [submitted]="submitted" />
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="查詢條件依據" controlName="Query_Cond" [options]="contact_type_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Query_Cond" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否只顯示異常" groupname="Is_ShowErr" [control]="queryForm.controls.Is_ShowErr"
              [options]="show_error_Option" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<!-- 單一 app-table -->
<div class="card mt-2">
  <app-table tableKey="FIN11060"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true" [showTotal]="true" [showManage]="false"
    [totalRecords]="totalRecords"
    [lazy]="true" [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    (delete)="onDelete($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    dataKey="key" [multiSortMeta]="showSort">
  </app-table>
</div>
