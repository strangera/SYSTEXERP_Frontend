<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="傳票編號"
              [startControl]="queryForm.controls.VouNoStart"
              [endControl]="queryForm.controls.VouNoEnd"
              [submitted]="submitted">
            </app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="傳票日期"
              [startControl]="queryForm.controls.VouDateStart"
              [endControl]="queryForm.controls.VouDateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
        </div>



        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading" (onClick)="onSubmit(queryForm)"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    tableKey="FIN13100"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [lazy]="true"
    [dataKey]="'VouNo'"
    [showManage]="true"
    [showEdit]="true"
    [showDetail]="true"
    [showDelete]="false"
    [showCheckBox]="false"
    [apiUrl]="'queryFIN13100'"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFIN13100Fn"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (dataChange)="data = $event">
  </app-table-report>
</div>
