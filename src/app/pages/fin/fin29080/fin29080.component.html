<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 查詢日期(起訖) - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="查詢日期" [startControl]="queryForm.controls.QueryDateFrom"
              [endControl]="queryForm.controls.QueryDateTo" [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 預計付款日(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="預計付款日"
              [startControl]="queryForm.controls.PaymentDateFrom" [endControl]="queryForm.controls.PaymentDateTo"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <!-- 右上角工具列：匯出 PDF -->
  <div class="flex justify-content-end gap-2 mb-2">
    <app-button label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF()" [loading]="btnLoading"
      [disabled]="loading || (data.length || 0) === 0">
    </app-button>
  </div>

  <app-table tableKey="FIN29080" dataKey="ID" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [multiSortMeta]="[]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [showManage]="false" [showReportMode]="false">
  </app-table>
</div>
