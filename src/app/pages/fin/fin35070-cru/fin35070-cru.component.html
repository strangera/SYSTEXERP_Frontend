<p-organizationChart [value]="data" selectionMode="single">
    <ng-template let-node pTemplate="default">
      <div 
        class="node-wrapper"
        [ngClass]="{
          'selected-node': selectedNode?.label === node.label,
          'disabled-node': nodeLevels.get(node.label ?? '') === 3
        }"
        (click)="onNodeSelect({node: node})"
      >
        <div class="node-header">{{ node.label ?? 'Unknown' }}</div>
      </div>
    </ng-template>
  </p-organizationChart>
