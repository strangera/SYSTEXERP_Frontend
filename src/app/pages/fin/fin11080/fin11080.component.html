<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="'FIN11080'" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 銷售日期起迄 -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="銷售日期" calendarType="dateRange"
            [startControl]="queryForm.controls.TXN_Date_Start" [endControl]="queryForm.controls.TXN_Date_End"
            [submitted]="submitted"></app-calendar-range>
        </div>
        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="fin11080" dataKey="TXN_Date" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="false" [loading]="loading" [showManage]="false" [showDelete]="false"
    [multiSortMeta]="[{ field: 'TXN_Date', order: -1 }]" [expansionColumns]="expansionColumns"
    [expansionDataKey]="'TXN_GUINo'" [expansionLoadFn]="loadExpansionData">
  </app-table>
</div>
