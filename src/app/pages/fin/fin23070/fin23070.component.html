<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="預支單號"
            controlName="PREP_NO"
            [control]="queryForm.controls.PREP_NO"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="申請廠商/員工"
            controlName="VEN_No"
            [options]="vendorOrEmployeeOptions | async"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.VEN_No"
            [submitted]="submitted"
          ></app-dropdown>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="申請日期"
            [startControl]="queryForm.controls.APPY_DateS"
            [endControl]="queryForm.controls.APPY_DateE"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>
        <div class="grid p-fluid">
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="實際核銷日期"
            [startControl]="queryForm.controls.ActClose_DateS"
            [endControl]="queryForm.controls.ActClose_DateE"
            [submitted]="submitted"
          ></app-calendar-range>
          <app-input-number-range
            class="col-12 md:col-6 lg:col-4"
            label="預支金額"
            [startControl]="queryForm.controls.PREP_AmtS"
            [endControl]="queryForm.controls.PREP_AmtE"
            [submitted]="submitted"
          ></app-input-number-range>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="付款方式"
            controlName="VEN_PayType"
            [options]="payTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.VEN_PayType"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="顯示核銷明細"
            controlName="ShowDetail"
            [options]="showDetailOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ShowDetail"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
@if (queryForm.value.ShowDetail === "N") {
  <div class="card">
    <app-table-report
      [data]="data"
      [dataKey]="'PrepNo'"
      [tableKey]="'FIN23070_Data'"
      [columns]="columns"
      [totalRecords]="totalRecords"
      [showCheckBox]="false"
      [showManage]="false"
      [showDelete]="false"
      [lazy]="true"
      [loading]="loading"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="暫付款核銷報表.PDF"
            icon="pi pi-file"
            (click)="printExport(true)"
            [disabled]="data.length === 0"
            [loading]="btnPdfLoading"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="暫付款核銷報表.XLSX"
            icon="pi pi-file"
            (click)="printExport(false)"
            [disabled]="data.length === 0"
            [loading]="btnExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
}
@if (queryForm.value.ShowDetail === "Y") {
  <div class="card">
    <app-table-report
      [data]="detailData"
      [totalRecords]="detailData.length"
      [dataKey]="'RedeemNo'"
      [tableKey]="'FIN23070_Detail_Data'"
      [columns]="detailColumns"
      [showCheckBox]="false"
      [showManage]="false"
      [showDelete]="false"
      [lazy]="false"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="暫付款核銷報表.PDF"
            icon="pi pi-file"
            (click)="printExport(true)"
            [disabled]="data.length === 0"
            [loading]="btnPdfLoading"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="暫付款核銷報表.XLSX"
            icon="pi pi-file"
            (click)="printExport(false)"
            [disabled]="data.length === 0"
            [loading]="btnExcelLoading"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
}
