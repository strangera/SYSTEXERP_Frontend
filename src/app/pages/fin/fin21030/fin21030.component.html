<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="廠客代號" controlName="vendorCode"
                            [control]="queryForm.controls.vendorCode" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="廠客名稱" controlName="vendorName" [control]="queryForm.controls.vendorName"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="廠商簡稱" controlName="vendorSName"
                            [control]="queryForm.controls.vendorSName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="郵遞區號" controlName="postCode"
                            [control]="queryForm.controls.postCode" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="郵寄地址" controlName="postAddress"
                            [control]="queryForm.controls.postAddress" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="聯絡人" controlName="contactPerson"
                            [control]="queryForm.controls.contactPerson" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="電話" controlName="phone" [control]="queryForm.controls.phone"
                            [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="傳真" controlName="fax"
                            [control]="queryForm.controls.fax" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="統一編號" controlName="uId"
                            [control]="queryForm.controls.uId" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="郵電費負擔" controlName="postBelong" [options]="postBelongOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.postBelong"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="貼現廠商" controlName="payoutVendor" [options]="whetherOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.payoutVendor"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="禁止背書轉讓" controlName="noTransfer" [options]="whetherOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.noTransfer"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="付款方式" controlName="paymentMethod" [options]="paymentMethodOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.paymentMethod"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="廠商匯款銀行代號" controlName="vendorTransferAccount"
                            [control]="queryForm.controls.vendorTransferAccount" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="廠商銀行帳號" controlName="vendorAccount"
                            [control]="queryForm.controls.vendorAccount" [submitted]="submitted">
                        </app-input-number>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="廠商帳戶名稱" controlName="vendorAccountName"
                            [control]="queryForm.controls.vendorAccountName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="付款期限" controlName="payoutLimit"
                            [control]="queryForm.controls.payoutLimit" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="票據抬頭" controlName="ticketTitle"
                            [control]="queryForm.controls.ticketTitle" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="系統別" controlName="systemType" [options]="systemTypeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.systemType"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="審核狀態" controlName="status" [options]="statusOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.status"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-table>
    </div>
</div>
