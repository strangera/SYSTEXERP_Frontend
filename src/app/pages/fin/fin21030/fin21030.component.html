<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠客代號"
              controlName="vendorCode"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠客名稱"
              controlName="vendorName"
              [control]="queryForm.controls.vendorName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商簡稱"
              controlName="vendorSName"
              [control]="queryForm.controls.vendorSName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="郵遞區號"
              controlName="postCode"
              [control]="queryForm.controls.postCode"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="郵寄地址"
              controlName="postAddress"
              [control]="queryForm.controls.postAddress"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯絡人"
              controlName="contactPerson"
              [control]="queryForm.controls.contactPerson"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="電話"
              controlName="phone"
              [control]="queryForm.controls.phone"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="傳真"
              controlName="fax"
              [control]="queryForm.controls.fax"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="統一編號"
              controlName="uId"
              [control]="queryForm.controls.uId"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="郵電負擔模式"
              controlName="VEN_RemitFeeMode"
              [control]="queryForm.controls.VEN_RemitFeeMode"
              [options]="remitFeeOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="貼現廠商"
              controlName="payoutVendor"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.payoutVendor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="禁止背書轉讓"
              controlName="noTransfer"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.noTransfer"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="付款方式"
              controlName="paymentMethod"
              [options]="paymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.paymentMethod"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠商匯款銀行代號"
              controlName="vendorTransferAccount"
              [control]="queryForm.controls.vendorTransferAccount"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="廠商銀行帳號"
              controlName="vendorAccount"
              [control]="queryForm.controls.vendorAccount"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商帳戶名稱"
              controlName="vendorAccountName"
              [control]="queryForm.controls.vendorAccountName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="付款期限"
              controlName="payoutLimit"
              [control]="queryForm.controls.payoutLimit"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="ticketTitle"
              [control]="queryForm.controls.ticketTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="系統別"
              controlName="systemType"
              [options]="systemTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.systemType"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="審核狀態"
              controlName="VEN_Status"
              [options]="approvalOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.VEN_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS2A020"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showCheckBox]="false"
    dataKey="id"
    [multiSortMeta]="[{ field: 'VEN_No', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="true"
    [loading]="loading"
    [showDelete]="false"
  ></app-table>
</div>
