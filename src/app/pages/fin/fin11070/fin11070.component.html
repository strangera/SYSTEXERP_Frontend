<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="寫入產製空白發票" (click)="insertFIN11070()"></app-button>
    <app-button btnType="create" label="轉檔" (click)="downloadFIN11070()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid gap-2">
          <!-- 申報年月 -->
          <app-year-month class="col-12 md:col-6 lg:col-4" label="申報年月" [control]="queryForm.controls.GUI_YYMM"
            [submitted]="submitted"></app-year-month>
        </div>
        <!-- 說明文字 -->
        <div class="grid p-fluid">
          <div class="col-12 pl-3">
            <ul class="mb-0 pl-3">
              <li>請注意：</li>
              <li>1、申報年月需小於系統日申報期間。</li>
            </ul>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="TXN_No" tableKey="FIN11070_Data" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" [showCheckBox]="false" [showManage]="false"
      [showDelete]="false"></app-table-report>
  </div>
</div>
