<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="帳款年月"
              [startControl]="queryForm.controls.ACP_YYYYMM_Start" [endControl]="queryForm.controls.ACP_YYYYMM_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號" controlName="VEN_No" [options]="VEN_NoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="目前保留金額為零是否顯示" groupname="ShowIfReserveAmtZero"
              [control]="queryForm.controls.ShowIfReserveAmtZero"
              [options]="[{ label: '是', value: true }, { label: '否', value: false }]"
              [submitted]="submitted"></app-radiobutton>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="fin29010" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [showReportMode]="false" [showSignature]="true"
    [queryFunction]="fin29010Service.queryFIN29010.bind(fin29010Service)" [loading]="loading" [footerData]="footerData">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出保留款彙總表.PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0 || !hasPermission(Actions.Print)" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出保留款彙總表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0  || !hasPermission(Actions.ExportExcel)"
          [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
