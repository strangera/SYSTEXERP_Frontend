<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="品項代號" controlName="INV_ItemNo"
            [control]="queryForm.controls.INV_ItemNo" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="品項名稱" controlName="INV_ItemName"
            [control]="queryForm.controls.INV_ItemName" [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="INV_ItemNo" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showCheckBox]="true" (delete)="onDelete($event)" (selectionChange)="selectedRows = $event"
    [selectedItems]="selectedRows" [multiSortMeta]="[{ field: 'ID', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading"></app-table>
</div>
