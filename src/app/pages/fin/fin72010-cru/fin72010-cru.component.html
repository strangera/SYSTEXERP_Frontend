<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 基本資料 顯示畫面 -->
      <ng-container>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金單號"
              controlName="KeepQuota_No"
              [options]="KeepQuota_No_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="dataForm.controls.KeepQuota_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="申請日期"
              [control]="dataForm.controls.applyDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金申請人"
              controlName="Pettycashapplicant"
              [options]="Pettycashapplicant_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="dataForm.controls.Pettycashapplicant"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金保管人"
              controlName="Pettycashcustodian"
              [options]="Pettycashcustodian_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="dataForm.controls.Pettycashcustodian"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="申請人組織代號"
              controlName="keepingUnit"
              [control]="dataForm.controls.keepingUnit"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="保管人組織代號"
              controlName="custodianUnit"
              [control]="dataForm.controls.custodianUnit"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="keepingUnit"
              [options]="keepingUnit_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="dataForm.controls.keepingUnit"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </ng-container>

      <ng-container>
        <!-- 明細 POS2064 -->
        <app-table-edit
          title="收支明細"
          tableKey="VEN_No"
          [data]="POS2020Data"
          class="col-12"
          [columns]="POS2020DataColumn"
          (selectionChange)="selectedPOS2020Items = $event"
          [selectedItems]="selectedPOS2020Items"
          [dataStatusValue]="{
            Original: 'old',
            New: 'new',
            Modified: 'modified',
            Deleted: 'deleted',
          }"
          [rowValidate]="validate2020Row"
          [defaultInsertData]="defaultNew2020"
          (dataChange)="POS2020Data = $event"
          dataStatusField="status"
          [loading]="loading"
        ></app-table-edit>
      </ng-container>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="reset51070()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
