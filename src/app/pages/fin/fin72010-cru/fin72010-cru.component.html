<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 基本資料 顯示畫面 -->
      <ng-container>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金單號"
              controlName="PCS_No"
              [options]="PCS_No_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.PCS_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="申請日期"
              [control]="dataForm.controls.PCS_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="PCS_UsrDisplay" class="block">
              零用金申請人
              <span class="required-star">*</span>
            </label>

            <p-inputGroup>
              <input
                id="PCS_UsrDisplay"
                type="text"
                pInputText
                formControlName="PCS_UsrDisplay"
                placeholder="請選擇"
                class="user-display-input"
                readonly
              />

              <button
                *ngIf="dataForm.get('PCS_UsrDisplay')?.value"
                type="button"
                aria-label="清除零用金申請人"
                pButton
                icon="pi pi-times"
                class="clear-user-button"
                (click)="clearUser('PCS')"
                [disabled]="isRead"
              ></button>

              <button
                type="button"
                aria-label="選擇零用金申請人"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('PCS_UsrNo')"
                [disabled]="isRead"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="Keep_UsrDisplay" class="block">
              零用金保管人
              <span class="required-star">*</span>
            </label>

            <p-inputGroup>
              <input
                id="Keep_UsrDisplay"
                type="text"
                pInputText
                formControlName="Keep_UsrDisplay"
                placeholder="請選擇"
                class="user-display-input"
                readonly
              />

              <button
                *ngIf="dataForm.get('Keep_UsrDisplay')?.value"
                type="button"
                aria-label="清除零用金保管人"
                pButton
                icon="pi pi-times"
                class="clear-user-button"
                (click)="clearUser('Keep')"
                [disabled]="isRead"
              ></button>

              <button
                type="button"
                aria-label="選擇零用金保管人"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('Keep_UsrNo')"
                [disabled]="isRead"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="申請人組織代號"
              controlName="PCS_OrgID"
              [control]="dataForm.controls.PCS_OrgID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="保管人組織代號"
              controlName="Keep_OrgID"
              [control]="dataForm.controls.Keep_OrgID"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保管單位"
              controlName="Keep_OrgID"
              [options]="keeperUnit_Options()"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.Keep_OrgID"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </ng-container>

      <ng-container>
        <!-- 明細 POS2064 -->
        <app-table-edit
          #tableEdit
          title="收支明細"
          tableKey="AccNo"
          [data]="Detaildata"
          class="col-12"
          [columns]="DetailColumn"
          (selectionChange)="selectedPOS2064Items = $event"
          [selectedItems]="selectedPOS2064Items"
          [dataStatusValue]="{
            Original: 'old',
            New: 'new',
            Modified: 'modified',
            Deleted: 'deleted',
          }"
          [dataStatusField]="'status'"
          [rowValidate]="validateDetailRow"
          (dataChange)="onDetailDataChange($event)"
          (delete)="deleteDetail($event)"
          [loading]="loading"
          [disabled]="isFormReadable"
          [tableRequired]="true"
        ></app-table-edit>
      </ng-container>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="reset51070()"
        ></app-button>

        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<p-dialog
  header="使用者代碼"
  [(visible)]="userDialogVisible"
  [modal]="true"
  [style]="{ width: '70vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="userQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="user_No" class="block mb-2">使用者代碼</label>
        <input id="user_No" pInputText formControlName="user_No" />
      </div>

      <div class="col-12 md:col-6">
        <label for="user_Name" class="block mb-2">使用者名稱</label>
        <input id="user_Name" pInputText formControlName="user_Name" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input id="Org_ID" pInputText formControlName="Org_ID" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input id="Org_Name" pInputText formControlName="Org_Name" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button
        type="button"
        label="查詢"
        icon="pi pi-search"
        (click)="queryUserData()"
      ></p-button>

      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        (click)="clearUserQuery()"
      ></p-button>
    </div>
  </form>

  <p-table
    [value]="userResultData()"
    [scrollable]="true"
    scrollHeight="350px"
    [tableStyle]="{ 'min-width': '50rem' }"
    selectionMode="single"
    [(selection)]="selectedUser"
    (onRowSelect)="onSelectUser($event.data)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>使用者代碼</th>
        <th>使用者名稱</th>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.user_No }}</td>
        <td>{{ row.user_Name }}</td>
        <td>{{ row.Org_ID }}</td>
        <td>{{ row.Org_Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>

<p-dialog
  header="新增成功"
  [(visible)]="saveSuccessDialogVisible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '30vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <p class="line-height-3 m-0">{{ saveSuccessMessage }}</p>

  <div class="flex justify-content-end gap-2 mt-3">
    <p-button label="確定" icon="pi pi-check" (click)="confirmSaveSuccess()"></p-button>
  </div>
</p-dialog>
