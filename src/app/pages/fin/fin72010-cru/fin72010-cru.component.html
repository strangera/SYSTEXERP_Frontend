<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 基本資料 顯示畫面 -->
      <ng-container>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="零用金單號"
              controlName="KeepQuota_No"
              [options]="KeepQuota_No_Options"
              optionLabel="Label"
              optionValue="No"
              [control]="dataForm.controls.KeepQuota_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="申請日期"
              [control]="dataForm.controls.applyDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金申請人</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                formControlName="PettycashapplicantName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('Pettycashapplicant')"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="cashApplicant" class="block">零用金保管人</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                formControlName="PettycashcustodianName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openUserDialog('Pettycashcustodian')"
              ></button>
            </p-inputGroup>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="申請人組織代號"
              controlName="applicantUnit"
              [control]="dataForm.controls.applicantUnit"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="保管人組織代號"
              controlName="custodianUnit"
              [control]="dataForm.controls.custodianUnit"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="keepingUnit" class="block">保管單位</label>
            <p-inputGroup>
              <input
                type="text"
                pInputText
                controlName="keepingUnit"
                formControlName="keepingUnitName"
                placeholder="請選擇"
                readonly
              />
              <button
                type="button"
                aria-label="搜尋"
                pButton
                icon="pi pi-angle-down"
                (click)="openKeepDeptDialog()"
              ></button>
            </p-inputGroup>
          </div>
        </div>
      </ng-container>

      <ng-container>
        <!-- 明細 POS2064 -->
        <app-table-edit
          title="收支明細"
          tableKey="type01"
          [data]="POS2064Data"
          class="col-12"
          [columns]="POS2064DataColumn"
          (selectionChange)="selectedPOS2064Items = $event"
          [selectedItems]="selectedPOS2064Items"
          [dataStatusValue]="{
            Original: 'old',
            New: 'new',
            Modified: 'modified',
            Deleted: 'deleted',
          }"
          [rowValidate]="validate2064Row"
          [defaultInsertData]="defaultNew2064"
          (dataChange)="POS2064Data = $event"
          dataStatusField="status"
          [loading]="loading"
        ></app-table-edit>
      </ng-container>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="reset51070()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<p-dialog
  header="使用者代碼"
  [(visible)]="userDialogVisible"
  [modal]="true"
  [style]="{ width: '70vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="userQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="user_No" class="block mb-2">使用者代碼</label>
        <input id="user_No" pInputText formControlName="user_No" />
      </div>

      <div class="col-12 md:col-6">
        <label for="user_Name" class="block mb-2">使用者名稱</label>
        <input id="user_Name" pInputText formControlName="user_Name" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input id="Org_ID" pInputText formControlName="Org_ID" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input id="Org_Name" pInputText formControlName="Org_Name" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button
        type="button"
        label="查詢"
        icon="pi pi-search"
        (click)="queryUsers()"
      ></p-button>

      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        (click)="clearUserQuery()"
      ></p-button>
    </div>
  </form>

  <p-table
    [value]="userResultData"
    [scrollable]="true"
    scrollHeight="350px"
    [tableStyle]="{ 'min-width': '50rem' }"
    selectionMode="single"
    [(selection)]="selectedUser"
    (onRowSelect)="onSelectUser($event.data)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>使用者代碼</th>
        <th>使用者名稱</th>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.user_No }}</td>
        <td>{{ row.user_Name }}</td>
        <td>{{ row.Org_ID }}</td>
        <td>{{ row.Org_Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>

<p-dialog
  header="組織代碼"
  [(visible)]="keepDeptDialogVisible"
  [modal]="true"
  [style]="{ width: '60vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="keepDeptQueryForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6">
        <label for="Org_ID" class="block mb-2">組織代碼</label>
        <input pInputText formControlName="Org_ID" placeholder="組織代碼" />
      </div>

      <div class="col-12 md:col-6">
        <label for="Org_Name" class="block mb-2">組織名稱</label>
        <input pInputText formControlName="Org_Name" placeholder="組織名稱" />
      </div>
    </div>

    <div class="flex gap-2 mb-3">
      <p-button
        type="button"
        label="查詢"
        icon="pi pi-search"
        (click)="queryKeepDept()"
      ></p-button>

      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        (click)="clearKeepDeptQuery()"
      ></p-button>
    </div>
  </form>

  <p-table
    [value]="keepDeptResultData"
    [scrollable]="true"
    scrollHeight="320px"
    selectionMode="single"
    [(selection)]="selectedKeepDept"
    (onRowSelect)="onSelectKeepDept($event.data)"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>組織代碼</th>
        <th>組織名稱</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr [pSelectableRow]="row" style="cursor: pointer">
        <td>{{ row.No }}</td>
        <td>{{ row.Name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
