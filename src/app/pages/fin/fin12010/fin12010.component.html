<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="配號" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 發票年月 -->
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(起)"
            [control]="queryForm.controls.SAL_GUIYYYYMM_start" [submitted]="submitted"></app-year-month>
          <app-year-month class="col-12 md:col-6 lg:col-4" label="發票年月(迄)"
            [control]="queryForm.controls.SAL_GUIYYYYMM_end" [submitted]="submitted"></app-year-month>

          <app-input-text class="col-12 lg:col-6 xl:col-4" label="字軌" controlName="SAL_GUITrack"
            [control]="queryForm.controls.SAL_GUITrack" [submitted]="submitted" />
          <app-input-text-range class="col-12 lg:col-6 xl:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
            [startControl]="queryForm.controls.SAL_GUINo_start" [endControl]="queryForm.controls.SAL_GUINo_end"
            [submitted]="submitted" [errorForGroup]="true" />
          <app-multi-select class="col-12 lg:col-6 xl:col-4" label="使用別" controlName="SAL_Type"
            [options]="usageTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.SAL_TypeList" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="fin12010" dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    [showDetail]="false" [showCheckBox]="true" [lastQueryBody]="lastQueryBody"
    [queryFunction]="fin12010Service.queryFIN12010.bind(fin12010Service)" [totalRecords]="totalRecords"
    [loading]="loading" (delete)="onDelete($event)" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event">
  </app-table-report>
</div>
