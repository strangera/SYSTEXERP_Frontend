<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="配號" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range calendarType="dateMonthRange" label="發票年月" class="col-12 lg:col-6 xl:col-4" label="發票年"
            [startControl]="queryForm.controls.SAL_GUIYYYYMM_start" [endControl]="queryForm.controls.SAL_GUIYYYYMM_end"
            [submitted]="submitted" />
          <app-input-text class="col-12 lg:col-6 xl:col-4" label="字軌" controlName="SAL_GUITrack"
            [control]="queryForm.controls.SAL_GUITrack" [submitted]="submitted" />
          <app-input-text-range class="col-12 lg:col-6 xl:col-4" startLabel="發票起始號碼" endLabel="發票結束號碼"
            [startControl]="queryForm.controls.SAL_GUINo_start" [endControl]="queryForm.controls.SAL_GUINo_end"
            [submitted]="submitted" [errorForGroup]="true" />
          <app-multi-select class="col-12 lg:col-6 xl:col-4" label="使用別" controlName="SAL_GUIPaper"
            [options]="usageTypeOptions" optionLabel="SYS_Name" optionValue="SYS_Code"
            [control]="queryForm.controls.SAL_GUIPaper" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="fin12010" dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true" [multiSortMeta]="[{ field: 'SAL_GUIYYYYMM', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" (delete)="onDelete($event)" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event">
  </app-table>
</div>
