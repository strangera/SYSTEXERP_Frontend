<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="匯款來源單號"
            controlName="WSLIP_NO"
            [control]="queryForm.controls.WSLIP_NO"
            [submitted]="submitted"
          ></app-input-text>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="建立日期"
            [startControl]="queryForm.controls.D_Date_Start"
            [endControl]="queryForm.controls.D_Date_End"
            [submitted]="submitted"
          ></app-calendar-range>
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateRange"
            label="匯款日期"
            [startControl]="queryForm.controls.RMT_Date_Start"
            [endControl]="queryForm.controls.RMT_Date_End"
            [submitted]="submitted"
          ></app-calendar-range>
        </div>
        <div class="grid p-fluid">
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="銀行ID"
            controlName="BNK_id"
            [control]="queryForm.controls.BNK_id"
            [submitted]="submitted"
          ></app-input-text>
          <app-input-text
            class="col-12 md:col-6 lg:col-4"
            label="銀行帳戶名稱"
            controlName="BNK_AccName"
            [control]="queryForm.controls.BNK_AccName"
            [submitted]="submitted"
          ></app-input-text>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="轉傳票狀態"
            controlName="VouStatus"
            [options]="vouStatusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.VouStatus"
            [submitted]="submitted"
            [showClear]="true"
          ></app-dropdown>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="FIN25020"
    dataKey="WSLIP_NO"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (delete)="onDelete($event)"
    [showEdit]="false"
    [showCheckBox]="true"
    [showReportMode]="false"
    [showReportExcel]="false"
    [showReportPDF]="false"
    [addButton]="addButton"
    [multiSortMeta]="[{ field: 'WSLIP_NO', order: 1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
    [showDelete]="true"
    [selectedItems]="selectedItems"
    [isRowSelectable]="isRowSelectable"
    (selectionChange)="selectedItems = $event"
  ></app-table>
</div>
