<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <span><B><u>日期查詢條件</u></B></span>
          </div>
          <div class="col-12 md:col-6 lg:col-12">
            <app-radiobutton  groupname="querydateradio" [control]="queryForm.controls.radiolist" [options]="daterangeOptions" [submitted]="submitted" (valueChange)="onSystemTypeChange($event)"></app-radiobutton>

          </div>
          <div style="display:flex"  class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '1'">
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range label="日期範圍" [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate" [submitted]="submitted">
              </app-date-range>
          </div>
        </div>
        <div style="display:flex" class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '2'">
          <div class="col-12 md:col-6 lg:col-2">
            <app-dateyy-one label="年度 (起)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
            </app-dateyy-one>
        </div>
      <div class="col-12 md:col-6 lg:col-2">
        <app-input-number label="週數" controlName="weeks" [control]="queryForm.controls.weeks" [submitted]="submitted">
        </app-input-number>
    </div>
    <div class="col-12 md:col-6 lg:col-4">
<span>日期範圍 (起)</span>
<input type="text" [readOnly]="true" pInputText [disabled]="true">
  </div>
  </div>
  <div style="display:flex" class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '2'">
  <div class="col-12 md:col-6 lg:col-2">
    <app-dateyy-one label="年度 (訖)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
    </app-dateyy-one>
</div>
<div class="col-12 md:col-6 lg:col-2">
<app-input-number label="週數" controlName="weeks" [control]="queryForm.controls.weeks" [submitted]="submitted">
</app-input-number>
</div>
<div class="col-12 md:col-6 lg:col-4">
<span>日期範圍 (訖)</span>
<input type="text" [readOnly]="true" pInputText [disabled]="true">
</div>
      </div>

      <div style="display:flex" class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '3'">
        <div class="col-12 md:col-6 lg:col-4">
          <app-datemm-range label="月範圍" [startControl]="queryForm.controls.startdate" [endControl]="queryForm.controls.enddate" [submitted]="submitted">
          </app-datemm-range>
      </div>
    </div>

    <div style="display:flex" class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '4'">
      <div class="col-12 md:col-6 lg:col-2">
        <app-dateyy-one label="年度 (起)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
        </app-dateyy-one>
    </div>
  <div class="col-12 md:col-6 lg:col-2">
    <app-dropdown-default label="半年別" controlName="systemtypedefault" [options]="halfyearOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.halfyear" [submitted]="submitted">
    </app-dropdown-default>
</div>
<div class="col-12 md:col-6 lg:col-1 mt-4 ml-6"><i class="pi pi-arrow-right"></i></div>

    <div class="col-12 md:col-6 lg:col-2">
      <app-dateyy-one label="年度 (訖)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
      </app-dateyy-one>
  </div>
<div class="col-12 md:col-6 lg:col-2">
  <app-dropdown-default label="半年別" controlName="systemtypedefault" [options]="halfyearOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.halfyear" [submitted]="submitted">
  </app-dropdown-default>
</div>
</div>

  <div style="display:flex" class="col-12 md:col-6 lg:col-12" *ngIf="selectedOption == '5'">
    <div class="col-12 md:col-6 lg:col-2">
      <app-dateyy-one label="年度 (起)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
      </app-dateyy-one>
  </div>
  <div class="col-12 md:col-6 lg:col-2">
    <app-dateyy-one label="年度 (訖)" [control]="queryForm.controls.onedateyy" [submitted]="submitted">
    </app-dateyy-one>
</div>
</div>


          <div class="col-12 md:col-6 lg:col-12 m-2">
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-12">
            <span><B><u>合約查詢條件</u></B></span>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="樓層" controlName="floor" [options]="floorOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.floor" [submitted]="submitted">
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="區域" controlName="region" [options]="regionOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.region" [submitted]="submitted">
            </app-dropdown-item>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="業種/商品類別" controlName="floor" [options]="businessTypeCodeOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.businessTypeCode" [submitted]="submitted">
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="櫃別" controlName="operations" [options]="operationsOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.type" [submitted]="submitted">
            </app-dropdown-item>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="抽成別" controlName="commissionMethod" [options]="commissionTypeOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.commissionType" [submitted]="submitted">
            </app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="組織" controlName="organizationCode" [options]="organizationOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.organizationCode" [submitted]="submitted">
            </app-dropdown-item>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item label="專櫃編號" controlName="counterCode" [options]="counterCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.counterCode" [submitted]="submitted"></app-dropdown-item>
          </div>
          <div class="col-12 md:col-6 lg:col-4">


          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="銷售金額是否含稅" groupname="taxradio" [control]="queryForm.controls.tax" [options]="taxOptions" [submitted]="submitted">
            </app-radiobutton>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12" *ngIf="selectedOption == '1'">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)">
    </app-data-table>
  </div>
  <div class="col-12" *ngIf="selectedOption == '2' || selectedOption == '3' || selectedOption == '4' || selectedOption == '5' || selectedOption == '6' || selectedOption == '7'">
    <app-data-table
      [data]="data"
      [columns]="columns2"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
