<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="公司代號(統一編號)" controlName="unifiedNumber" [control]="queryForm.controls.unifiedNumber" [submitted]="submitted">>
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-12 lg:col-4">
                        <app-input-text label="公司名稱(中文)" controlName="companyCName" [control]="queryForm.controls.companyCName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-12 lg:col-4">
                        <app-input-text label="公司名稱(英文)" controlName="companyEName" [control]="queryForm.controls.companyEName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="商場名稱" controlName="mallName" [control]="queryForm.controls.mallName" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="稅籍編號" controlName="taxNumber" [control]="queryForm.controls.taxNumber" [submitted]="submitted">>
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="負責人" controlName="principal" [control]="queryForm.controls.principal" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-12 lg:col-4">
                        <app-input-text label="聯絡人" controlName="contactPerson" [control]="queryForm.controls.contactPerson" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="聯絡人電話" controlName="contactPersonPhone" [control]="queryForm.controls.contactPersonPhone" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-12 lg:col-4">
                        <app-input-text label="聯絡人傳真" controlName="contactPersonFax" [control]="queryForm.controls.contactPersonFax" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="郵遞區號" controlName="postalCode" [control]="queryForm.controls.postalCode" [submitted]="submitted">>
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-12 lg:col-4">
                        <app-input-serial-number label="營業登記證號" controlName="BusinessCertificateNumber" [control]="queryForm.controls.BusinessCertificateNumber" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="公司電話" controlName="companyPhone" [control]="queryForm.controls.companyPhone" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-12 lg:col-6">
                        <app-input-text label="公司(營業處)地址(中文)" controlName="companyCAddress" [control]="queryForm.controls.companyCAddress" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-6">
                        <app-input-text label="公司(營業處)地址(英文)" controlName="companyEAddress" [control]="queryForm.controls.companyEAddress" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-12 lg:col-6">
                        <app-input-text label="公司登記地址(中文)" controlName="registeredCAddress" [control]="queryForm.controls.registeredCAddress" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-6">
                        <app-input-text label="公司登記地址(英文)" controlName="registeredEAddress" [control]="queryForm.controls.registeredEAddress" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-3">
                        <app-input-text label="公司網址" controlName="companyWebsite" [control]="queryForm.controls.companyWebsite" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-12 lg:col-3">
                        <app-input-text label="電子信箱" controlName="email" [control]="queryForm.controls.email" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-12 lg:col-6">
                        <app-input-text label="發票地址" controlName="invoiceAddress" [control]="queryForm.controls.invoiceAddress" [submitted]="submitted">
                        </app-input-text>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-3">
                        <app-input-text label="郵寄電話" controlName="mailingPhone" [control]="queryForm.controls.mailingPhone" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-12 lg:col-3">
                        <app-input-text label="郵寄傳真" controlName="mailingFex" [control]="queryForm.controls.mailingFex" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-6">
                        <app-input-text label="郵寄地址" controlName="mailingAddress" [control]="queryForm.controls.mailingAddress" [submitted]="submitted">>
                        </app-input-text>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <app-data-table-check [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table-check>
</div>
