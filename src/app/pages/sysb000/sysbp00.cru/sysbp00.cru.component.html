<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="參數來源" controlName="parameterSource" [control]="dataForm.controls.parameterTitle"
            [submitted]="submitted">>
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="參數標題" controlName="parameterTitle" [control]="dataForm.controls.parameterTitle"
            [submitted]="submitted">>
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-4 lg:col-4">
          <p-checkbox label="是否唯讀" controlName="readonly">
          </p-checkbox>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="參數說明" controlName="parameterInfo" [control]="dataForm.controls.parameterInfo"
            [submitted]="submitted">>
          </app-input-text>
        </div>
      </div>
      <!---->
      <hr>
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1;">
              <h5>參數 {{i+1}}</h5>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="參數項目" controlName="parameterItem" [control]="getFormControl(i, 'parameterItem')"
                [submitted]="submitted">>
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="參數狀態" controlName="parameterStatus" [options]="codeStatusOptions" optionLabel="label"
                optionValue="value" [control]="getFormControl(i, 'parameterStatus')" [submitted]="submitted">
              </app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number [useGrouping]="false" label="排序序號" controlName="order"
                [control]="getFormControl(i, 'order')" [submitted]="submitted">
              </app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="參數內容" controlName="parameterContent"
                [control]="getFormControl(i, 'parameterContent')" [submitted]="submitted">>
              </app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
