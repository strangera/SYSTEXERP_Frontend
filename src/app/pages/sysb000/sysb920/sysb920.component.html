<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission"> -->
    <div>
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
    <!-- </div> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="小分類代碼" controlName="bus_sclass" [control]="queryForm.controls.bus_sclass"
              [submitted]="submitted">>
            </app-input-text>
          </div>
          <div class="col-12 md:col-12 lg:col-4">
            <app-input-text label="小分類名稱" controlName="bus_sclass_name" [control]="queryForm.controls.bus_sclass_name"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="所屬大分類" controlName="bus_type" [options]="industryTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.bus_type" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="中分類" controlName="bus_class" [options]="productTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.bus_class" [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>
        <!-- <div *appHasPermission="queryPermission" class="col"> -->
        <hr>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
    [showCheckBox]="true" dataKey="id" [multiSortMeta]="queryForm.controls.SortBy.value" [totalRecords]="totalRecords"
    (lazyLoad)="loadData($event)" [lazy]="true" [loading]="loading">
  </app-table>
</div>
