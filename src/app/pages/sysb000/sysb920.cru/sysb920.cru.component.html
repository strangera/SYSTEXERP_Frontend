<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="小分類代碼" controlName="bus_sclass" [control]="dataForm.controls.bus_sclass"
            [submitted]="submitted">>
          </app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text label="小分類名稱" controlName="bus_sclass_name" [control]="dataForm.controls.bus_sclass_name"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="所屬大分類名稱" controlName="bus_type" [options]="industryTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.bus_type" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="中分類名稱" controlName="bus_class" [options]="productTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.bus_class" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
