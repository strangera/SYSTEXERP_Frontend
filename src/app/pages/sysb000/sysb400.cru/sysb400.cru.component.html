<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="階層代碼" controlName="group_no" [options]="upgroup_Option" optionLabel="label" optionValue="value" [control]="dataForm.controls.group_no" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="組織代碼" controlName="section_no" [control]="dataForm.controls.section_no" [submitted]="submitted">>
                    </app-input-text>
                </div>
                <div class="col-12 md:col-12 lg:col-4">
                    <app-input-text label="組織名稱" controlName="section_name" [control]="dataForm.controls.section_name" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            
            <!-- 上層組織代碼區域：僅當 group_no 不為零時顯示 -->
            <div class="grid p-fluid" *ngIf="dataForm.get('group_no')?.value != 0">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="上層階層代碼" controlName="upperOrgLevel" [options]="upgroup_Option" optionLabel="label" optionValue="value" [control]="dataForm.controls.upgroup_no" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="上層組織代碼" controlName="upperOrgCode" [control]="dataForm.controls.upsection_no" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
