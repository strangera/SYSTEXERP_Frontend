<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="action" label="組織架構列表" icon="pi pi-sitemap" (click)="onSitemap()" class="col">
      </app-button>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="組織階層" controlName="level_id" [control]="queryForm.controls.level_id">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="組織碼" controlName="org_id" [control]="queryForm.controls.org_id">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="組織名稱" controlName="org_name" [control]="queryForm.controls.org_name">
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- <app-dropdown label="上層組織代碼" controlName="p_org_id" [options]="level_nameOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.p_org_id">
            </app-dropdown> -->
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <!-- <app-input-text label="上層階層代碼" controlName="p_level_id" [control]="queryForm.controls.p_level_id">
            </app-input-text> -->
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="是否停用" controlName="stop_flag" [options]="whetherOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.stop_flag" [submitted]="submitted">
            </app-multi-select> -->
        </div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading" (onClick)="onSubmit(queryForm)">
          </app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>

  <div class="card">
    <div class="col-13">
      <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
      </app-data-table>
    </div>
  </div>
</div>
