<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="大分類代號" controlName="bus_type" [control]="dataForm.controls.bus_type"
            [submitted]="submitted">>
          </app-input-text>
        </div>
        <div class="col-12 md:col-12 lg:col-4">
          <app-input-text label="大分類名稱" controlName="bus_type_name" [control]="dataForm.controls.bus_type_name"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <hr>
      <app-editor-text label="備註" controlName="bus_type_desc" [control]="dataForm.controls.bus_type_desc"
        [style]="{ height: '100px' }" [submitted]="submitted">
      </app-editor-text>
      <hr>
    </form>
    <h6>
      說明:業種代號為2碼, 且第1碼字元為1~9
    </h6>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
