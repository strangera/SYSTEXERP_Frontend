<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="業種代號" controlName="industryCode" [control]="dataForm.controls.industryCode" [submitted]="submitted">>
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-12 lg:col-4">
                    <app-input-text label="業種名稱" controlName="industryName" [control]="dataForm.controls.industryName" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr>
            <app-editor-text label="備註" controlName="remark" [control]="dataForm.controls.remark" [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr>
        </form>
        <h6>
            說明:業種代號為2碼, 且第1碼字元為1~9
        </h6>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
