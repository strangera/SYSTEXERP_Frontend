<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="盤點單號" controlName="Inventoryordernumber"
              [control]="queryForm.controls.Inventoryordernumber" [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="保管人" controlName="Pettycashcustodian" [options]="usercode" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Pettycashcustodian"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="額度" [startControl]="queryForm.controls.SQuota"
              [endControl]="queryForm.controls.EQuota" [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-5">
            <app-date-range label="變更時間範圍" [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate" [submitted]="submitted">
            </app-date-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="支出請款單號" controlName="PettyCashOrderNumber" [options]="PettyCashOrderNumber"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.PettyCashOrderNumber"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="盤點單狀態" controlName="status" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.status" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="盤點餘額" [startControl]="queryForm.controls.SCountbalance"
              [endControl]="queryForm.controls.ECountbalance" [submitted]="submitted">
            </app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="說明" controlName="description" [control]="queryForm.controls.description"
              [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
