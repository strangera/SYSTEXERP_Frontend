<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- 建立按鈕，需有新增權限 -->
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 行銷活動類別代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="行銷活動類別代號"
              controlName="marketingCategoryCode"
              [options]="marketingCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.marketingCategoryCode"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <!-- 行銷活動類別名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="行銷活動類別名稱"
              controlName="marketingCategoryName"
              [control]="queryForm.controls.marketingCategoryName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 任務名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="任務名稱"
              controlName="taskName"
              [control]="queryForm.controls.taskName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <!-- 查詢與清除按鈕 -->
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
