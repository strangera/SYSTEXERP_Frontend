<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 活動年度別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dateyy-range label="活動年度別" controlName="activityYear" [startControl]="queryForm.controls.startYear"
              [endControl]="queryForm.controls.endYear" [submitted]="submitted"></app-dateyy-range>
          </div>

          <!-- 行銷檔期代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.marketingCampaignCode"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>

      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (click)="onClearForm()"></app-button>
          <app-button btnType="query" (click)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
