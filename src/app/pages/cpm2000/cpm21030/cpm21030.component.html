<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="場地代號" controlName="filedCode" [options]="filedCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.filedCode" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="場地名稱" controlName="filedName" [control]="queryForm.controls.filedName" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="區域" controlName="area" [options]="areaOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.area" [submitted]="submitted">
                            </app-dropdown-item>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown-item label="管理部門" controlName=" organizationNumber" [options]="organizationNumberOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.organizationNumber" [submitted]="submitted"></app-dropdown-item>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="面積(坪)" controlName="square" [control]="queryForm.controls.square" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="座位數量" controlName="sitNumber" [control]="queryForm.controls.sitNumber" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number label="可容納人數" controlName="capacity" [control]="queryForm.controls.capacity" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-multi-select label="場地狀況" controlName="fieldStatus" [options]="fieldStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.fieldStatus" [submitted]="submitted">
                            </app-multi-select>
                        </div>
                    </div>
                    <hr/>
                    <app-editor-text label="備註" controlName="remark" [control]="queryForm.controls.remark" [style]="{ height: '100px' }" [submitted]="submitted">
                    </app-editor-text>
                    <hr/>
                    <div *appHasPermission="queryPermission" class="col">
                        <div class="grid justify-content-end">
                            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                            <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                        </div>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
