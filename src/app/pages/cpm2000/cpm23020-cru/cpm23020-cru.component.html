<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>

  <!-- Panel for the Form -->
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 用品管理單號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="用品管理單號" controlName="suppliesManagementNumber"
            [control]="dataForm.controls.suppliesManagementNumber" [submitted]="submitted"></app-input-text>
        </div>

        <!-- 用品狀況 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="用品狀況" controlName="suppliesCondition" [options]="suppliesConditionOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.suppliesCondition"
            [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 行銷檔期代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignCodeOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.marketingCampaignCode"
            [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 檔期名稱 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="檔期名稱" controlName="campaignName" [control]="dataForm.controls.campaignName"
            [submitted]="submitted"></app-input-text>
        </div>

        <!-- 廠商編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="廠商編號" controlName="manufacturerCode" [options]="manufacturerCodeOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.manufacturerCode"
            [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 入庫日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-date-one label="入庫日期" controlName="lastStorageDate" [control]="dataForm.controls.lastStorageDate"
            [submitted]="submitted"></app-date-one>
        </div>

        <!-- 入庫人員 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="入庫人員" controlName="lastStoragePerson" [options]="lastStoragePersonOptions"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.lastStoragePerson"
            [submitted]="submitted"></app-dropdown>
        </div>

        <!-- 備註 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" controlName="remarks" [control]="dataForm.controls.remarks"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>

      <!-- Dynamic form fields for items -->
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p>{{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>

          <div class="grid p-fluid">
            <!-- 活動代號 / 說明 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="活動代號 / 說明" controlName="activityCode" [control]="getFormControl(i, 'activityCode')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 活動用品代號 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="活動用品代號" controlName="suppliesCode" [control]="getFormControl(i, 'suppliesCode')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 活動用品名稱 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="活動用品名稱" controlName="suppliesName" [control]="getFormControl(i, 'suppliesName')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 實際需要數量 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="實際需要數量" controlName="requiredQuantity"
                [control]="getFormControl(i, 'requiredQuantity')" [submitted]="submitted"></app-input-text>
            </div>

            <!-- 已入庫數量 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="已入庫數量" controlName="storedQuantity" [control]="getFormControl(i, 'storedQuantity')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 未入庫數量 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="未入庫數量" controlName="notStoredQuantity"
                [control]="getFormControl(i, 'notStoredQuantity')" [submitted]="submitted"></app-input-text>
            </div>

            <!-- 本次入庫數量 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="本次入庫數量" controlName="thisStorageQuantity"
                [control]="getFormControl(i, 'thisStorageQuantity')" [submitted]="submitted"></app-input-text>
            </div>

            <!-- 入庫價格(未稅)-單價 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="入庫價格(未稅)-單價" controlName="unitPrice" [control]="getFormControl(i, 'unitPrice')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 入庫價格(未稅)-總價 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="入庫價格(未稅)-總價" controlName="totalPrice" [control]="getFormControl(i, 'totalPrice')"
                [submitted]="submitted"></app-input-text>
            </div>

            <!-- 總入庫金額(未稅) -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="總入庫金額(未稅)" controlName="totalStorageAmount"
                [control]="getFormControl(i, 'totalStorageAmount')" [submitted]="submitted"></app-input-text>
            </div>

            <!-- 備註 -->
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="備註" controlName="remarks" [control]="getFormControl(i, 'remarks')"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>

      <!-- Button to add dynamic form fields -->
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>

    <!-- Action Buttons -->
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
      </div>
    </div>
  </p-panel>
</div>
