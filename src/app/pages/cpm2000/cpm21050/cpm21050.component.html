<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- 建立按鈕，需有新增權限 -->
    <div *appHasPermission="addPermission">
      <app-button-create (click)="onCreate()" class="col"></app-button-create>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 活動用品代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="活動用品代號"
              controlName="activityItemCode"
              [control]="queryForm.controls.activityItemCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 活動用品名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="活動用品名稱"
              controlName="activityItemName"
              [control]="queryForm.controls.activityItemName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 設備類別代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="設備類別代號"
              controlName="equipmentCategory"
              [options]="equipmentCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.equipmentCategory"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <!-- 用品性質 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-item
              label="用品性質"
              controlName="supplyNature"
              [options]="supplyNatureOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.supplyNature"
              [submitted]="submitted"
            ></app-dropdown-item>
          </div>
          <!-- 廠牌型號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠牌型號"
              controlName="brandModel"
              [control]="queryForm.controls.brandModel"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 規格明細 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="規格明細"
              controlName="specificationDetail"
              [control]="queryForm.controls.specificationDetail"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 產品序號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="產品序號"
              controlName="productSerialNumber"
              [control]="queryForm.controls.productSerialNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 附屬設備 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="附屬設備"
              controlName="accessoryEquipment"
              [control]="queryForm.controls.accessoryEquipment"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 存放地點 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="存放地點"
              controlName="storageLocation"
              [control]="queryForm.controls.storageLocation"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <!-- 保管人 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="保管人"
              controlName="custodian"
              [control]="queryForm.controls.custodian"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
      <!-- 查詢與清除按鈕 -->
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button-clear (onClick)="onClearForm()"></app-button-clear>
          <app-button-query
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button-query>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    >
    </app-data-table>
  </div>
</div>
