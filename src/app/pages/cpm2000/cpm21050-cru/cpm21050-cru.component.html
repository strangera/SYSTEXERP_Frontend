<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 活動用品代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="活動用品代號"
            controlName="activityItemCode"
            [control]="dataForm.controls.activityItemCode"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 活動用品名稱 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="活動用品名稱"
            controlName="activityItemName"
            [control]="dataForm.controls.activityItemName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 設備類別代號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="設備類別代號"
            controlName="equipmentCategory"
            [options]="equipmentCategoryOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.equipmentCategory"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <!-- 用品性質 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="用品性質"
            controlName="supplyNature"
            [options]="supplyNatureOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.supplyNature"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <!-- 廠牌型號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠牌型號"
            controlName="brandModel"
            [control]="dataForm.controls.brandModel"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 規格明細 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="規格明細"
            controlName="specificationDetail"
            [control]="dataForm.controls.specificationDetail"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 產品序號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="產品序號"
            controlName="productSerialNumber"
            [control]="dataForm.controls.productSerialNumber"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 附屬設備 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="附屬設備"
            controlName="accessoryEquipment"
            [control]="dataForm.controls.accessoryEquipment"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 存放地點 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="存放地點"
            controlName="storageLocation"
            [control]="dataForm.controls.storageLocation"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <!-- 保管人 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="保管人"
            controlName="custodian"
            [control]="dataForm.controls.custodian"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
