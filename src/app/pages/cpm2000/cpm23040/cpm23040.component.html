<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- 建立按鈕，需有新增權限 -->
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 活動開始日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one label="活動開始日期" controlName="activityStartDate"
              [control]="queryForm.controls.activityStartDate" [submitted]="submitted"></app-date-one>
          </div>
          <!-- 活動結束日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one label="活動結束日期" controlName="activityEndDate" [control]="queryForm.controls.activityEndDate"
              [submitted]="submitted"></app-date-one>
          </div>
          <!-- 繳回日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-date-one label="繳回日期" controlName="returnDate" [control]="queryForm.controls.returnDate"
              [submitted]="submitted"></app-date-one>
          </div>
          <!-- 行銷檔期代號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="行銷檔期代號" controlName="marketingCampaignCode" [options]="marketingCampaignOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.marketingCampaignCode"
              [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 檔期名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="檔期名稱" controlName="campaignName" [control]="queryForm.controls.campaignName"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 繳回單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="繳回單號" controlName="returnNumber" [control]="queryForm.controls.returnNumber"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 備註 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="備註" controlName="remarks" [control]="queryForm.controls.remarks"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 繳回人員 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="繳回人員" controlName="returnPersonnel" [options]="returnPersonnelOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.returnPersonnel"
              [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <!-- 查詢與清除按鈕 -->
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)"></app-data-table>
  </div>
</div>
