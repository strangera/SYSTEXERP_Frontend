<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="預支單號" controlName="prepaySheetNumber" [control]="queryForm.controls.prepaySheetNumber" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="申請廠商/員工" controlName="requsetEmployee" [options]="requsetEmployeeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.requsetEmployee" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="申請日期" [startControl]="queryForm.controls.startRequestDate" [endControl]="queryForm.controls.endRequestDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="實際核銷日期" [startControl]="queryForm.controls.startWriteOffDate" [endControl]="queryForm.controls.endWriteOffDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="預支金額" [startControl]="queryForm.controls.startAdvanceAmount" [endControl]="queryForm.controls.endAdvanceAmount" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="付款方式" controlName="payoutMethod" [options]="payoutMethodOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.payoutMethod" [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <hr />
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="顯示核銷明細" groupname="writeOffDetail" [control]="queryForm.controls.writeOffDetail" [options]="writeOffDetailOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                </div>
                <hr />
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                        <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
