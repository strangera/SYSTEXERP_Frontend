<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="預支單號" controlName="advanceSheetNumber"
                            [control]="queryForm.controls.advanceSheetNumber" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-calendar-range calendarType="dateRange" label="申請日期"
                            [startControl]="queryForm.controls.startRequestDate"
                            [endControl]="queryForm.controls.endRequestDate" [submitted]="submitted">
                        </app-calendar-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="申請廠商/員工" controlName="requsetEmployee" [options]="requsetEmployeeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.requsetEmployee"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
