<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-one label="分析日期" [control]="queryForm.controls.analyzeDatedd" [submitted]="submitted">
                        </app-date-one>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number [useGrouping]="false" label="分析區間\期數" controlName="periods"
                            [control]="queryForm.controls.periods" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="分析日期別" controlName="dateType" [options]="dateTypeOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.dateType"
                            [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="廠客代號"
                            [startControl]="queryForm.controls.startFactoryID"
                            [endControl]="queryForm.controls.endFactoryID" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="立帳日期" [startControl]="queryForm.controls.startEstablishDate"
                            [endControl]="queryForm.controls.endEstablishfDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-one label="付款日期" [control]="queryForm.controls.payDatedd" [submitted]="submitted">
                        </app-date-one>
                    </div>
                </div>
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-multi-select label="已到期/未到期" controlName="expired" [options]="expiredOptions"
                            optionLabel="label" optionValue="value" [control]="queryForm.controls.expired"
                            [submitted]="submitted">
                        </app-multi-select>
                    </div>
                </div>
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
