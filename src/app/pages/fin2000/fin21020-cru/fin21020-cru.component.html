<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="公司銀行科目代號" controlName="companyBankCode" [options]="bankCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.companyBankCode" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <hr/>
            <ng-container formArrayName="items">
                <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <div class="grid align-items-center">
                        <div class="col" style="flex: 1;">
                            <h5>費率 {{i+1}}</h5>
                        </div>
                        <div>
                            <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus" class="col"></app-button-dynamicallydelete>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="金額上限" controlName="maxCash" [control]="getFormControl(i, 'maxCash')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="金額下限" controlName="minCash" [control]="getFormControl(i, 'minCash')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="廠商負擔電匯手續費" controlName="vendorFee" [control]="getFormControl(i, 'vendorFee')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="廠商負擔電匯手續費回饋收入" controlName="vendorRevenue" [control]="getFormControl(i, 'vendorRevenue')"  [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-serial-number label="公司負擔電匯手續費" controlName="companyFee" [control]="getFormControl(i, 'companyFee')" [submitted]="submitted">
                            </app-input-serial-number>
                        </div>
                    </div>
                    <hr/>
                </ng-container>
            </ng-container>
            <div class="pt-1">
                <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
