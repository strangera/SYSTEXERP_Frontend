<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
            [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="廠商代號"
                            [startControl]="queryForm.controls.startFactoryID"
                            [endControl]="queryForm.controls.endFactoryID" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="立帳日期" [startControl]="queryForm.controls.startBillDate"
                            [endControl]="queryForm.controls.endBillDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range label="應付金額" [startControl]="queryForm.controls.startShouldPay"
                            [endControl]="queryForm.controls.endShouldPay" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                </div>
                <hr />
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number-range [useGrouping]="false" label="科目代號"
                            [startControl]="queryForm.controls.startSubjectID"
                            [endControl]="queryForm.controls.endSubjectID" [submitted]="submitted">
                        </app-input-number-range>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="帳款餘額為零是否顯示" groupname="showUp" [control]="queryForm.controls.showUp"
                            [options]="showUpOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-radiobutton label="未付金額是否包含保留款餘額" groupname="anyRemain"
                            [control]="queryForm.controls.anyRemain" [options]="showUpOptions" [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                </div>
                <hr />
                <div *appHasPermission="queryPermission" class="col">
                    <div class="grid justify-content-end">
                        <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                        <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                            [loading]="loading"></app-button>
                    </div>
                </div>
            </form>
        </p-accordionTab>
    </p-accordion>
</div>
<div class="card">
    <div class="col-13">
        <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-data-table>
    </div>
</div>
