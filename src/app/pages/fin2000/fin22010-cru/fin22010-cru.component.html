<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
            <app-button-demo label="下一步" class="col"></app-button-demo>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="請款單號" controlName="requestSheet" [control]="dataForm.controls.requestSheet" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-date-one label="請款日期" controlName="requestDate" [control]="dataForm.controls.requestDate" [submitted]="submitted">
                    </app-date-one>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="請款人" controlName="requestPerson" [control]="dataForm.controls.requestPerson" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-serial-number label="付款期數" controlName="payPeriod" [control]="dataForm.controls.payPeriod" [submitted]="submitted">
                    </app-input-serial-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="廠商代號" controlName="vendorCode" [options]="vendorCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.vendorCode" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="請款金額" controlName="requestAmount" [control]="dataForm.controls.requestAmount" [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註" controlName="remark" [control]="dataForm.controls.remark" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
