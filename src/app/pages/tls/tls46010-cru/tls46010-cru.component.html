<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="門市店號" controlName="SYS_StoreNo" [control]="dataForm.controls.SYS_StoreNo" [submitted]="submitted">
                            </app-input-text>
                        </div> -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="主機編號" controlName="SYS_SrvNo" [control]="dataForm.controls.SYS_SrvNo"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="主機狀態" controlName="SYS_SrvStatus" [options]="SYS_SrvStatus_Option" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.SYS_SrvStatus" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="主機IP" controlName="SYS_SrvIP" [control]="dataForm.controls.SYS_SrvIP"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number [useGrouping]="false" label="主機連接埠" controlName="SYS_SrvPort"
            [control]="dataForm.controls.SYS_SrvPort" [submitted]="submitted">
          </app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="主機名稱" controlName="SYS_SrvName" [control]="dataForm.controls.SYS_SrvName"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="主機登入帳號" controlName="SYS_SrvUsrID" [control]="dataForm.controls.SYS_SrvUsrID"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="主機登入密碼" controlName="SYS_SrvUsrPwd" [control]="dataForm.controls.SYS_SrvUsrPwd"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <hr>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="後台系統下載目錄" controlName="SYS_SRVDDir" [control]="dataForm.controls.SYS_SRVDDir"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="後台系統上傳目錄" controlName="SYS_SRVUDir" [control]="dataForm.controls.SYS_SRVUDir"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳輸程式下載目錄" controlName="SYS_MyPOSDDir" [control]="dataForm.controls.SYS_MyPOSDDir"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="傳輸程式上傳目錄" controlName="SYS_MyPOSUDir" [control]="dataForm.controls.SYS_MyPOSUDir"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="前台系統下載目錄" controlName="SYS_SRVDDirClt" [control]="dataForm.controls.SYS_SRVDDirClt"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="前台系統上傳目錄" controlName="SYS_SRVUDirClt" [control]="dataForm.controls.SYS_SRVUDirClt"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
