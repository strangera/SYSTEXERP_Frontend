<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="年月"
            controlName="budget_yymm" [control]="queryForm.controls.budget_yymm" [submitted]="submitted"></app-calendar>
          <app-dropdown class="col-12 col-6 lg:col-4" label="大分類代碼/名稱" controlName="bus_type"
            [control]="queryForm.controls.bus_type" [options]="CAT_LNoOptions" optionLabel="label" optionValue="No" />
          <app-dropdown class="col-12 col-6 lg:col-4" label="中分類代碼/名稱" controlName="bus_class"
            [control]="queryForm.controls.bus_class" [options]="CAT_MNoOptions" optionLabel="label" optionValue="No" />
          <app-dropdown class="col-12 col-6 lg:col-4" label="小分類代碼/名稱" controlName="bus_sclass"
            [control]="queryForm.controls.bus_sclass" [options]="CAT_SNoOptions" optionLabel="label" optionValue="No" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="組織代號/名稱" controlName="org_ids"
            [options]="org_idOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.org_ids" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號/名稱" controlName="tlt_nos"
            [options]="tlt_noOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.tlt_nos" [submitted]="submitted"></app-multi-select>
          <app-radiobutton class="col-12" label="報表格式" controlName="report_type"
            [control]="queryForm.controls.report_type" [options]="report_typeOptions"
            [submitted]="submitted"></app-radiobutton>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS2G040" dataKey="tlt_no" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [loading]="loading" [showManage]="false" [showDelete]="false" [showReportMode]="false"
    [lastQueryBody]="lastQueryForm" [footerData]="footerTotal" [loading]="loading"
    [queryFunction]="tls2g040Service.queryTLS2G040.bind(tls2g040Service)">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0" [loading]="btnLoading || !hasPermission(Actions.Print)"></p-button>
        <p-button styleClass="p-2" label="產出XLSX" [loading]="btnLoading" icon="pi pi-file" (click)="onExportXLSX()"
          [disabled]="data.length === 0" [loading]="btnLoading || !hasPermission(Actions.ExportExcel)"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
