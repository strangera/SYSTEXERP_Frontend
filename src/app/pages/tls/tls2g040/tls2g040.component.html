<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" label="大分類"></app-button>
    <app-button btnType="create" label="中分類"></app-button>
    <app-button btnType="create" label="小分類"></app-button>
    <app-button btnType="create" label="組織"></app-button>
    <app-button btnType="create" label="專櫃"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="年月"
            controlName="budget_date" [control]="queryForm.controls.budget_date" [submitted]="submitted"></app-calendar>
          <app-input-group class="col-12 md:col-6 lg:col-4" label="大分類代碼/名稱" controlName="bus_type"
            [control]="queryForm.controls.bus_type" [value]="bus_type_name" [submitted]="submitted"
            [options]="bus_typeOptions | async" optionLabel="Name" optionValue="value" templateLabel="label"
            [columns]="bus_typeColumns" />
          <app-input-group class="col-12 md:col-6 lg:col-4" label="中分類代碼/名稱" controlName="bus_class"
            [control]="queryForm.controls.bus_class" [value]="bus_class_name" [submitted]="submitted"
            [options]="bus_classOptions || []" optionLabel="Name" templateLabel="label" customLabel="No"
            [columns]="bus_classColumns" />
          <app-input-group class="col-12 md:col-6 lg:col-4" label="小分類代碼/名稱" controlName="bus_sclass"
            [control]="queryForm.controls.bus_sclass" [value]="bus_sclass_name" [submitted]="submitted"
            [options]="bus_sclassOptions || []" optionLabel="Name" templateLabel="label" customLabel="No"
            [columns]="bus_sclassColumns"></app-input-group>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="組織代號/名稱" controlName="org_id"
            [options]="org_idOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.org_id" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號/名稱" controlName="tlt_no"
            [options]="tlt_noOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.tlt_no" [submitted]="submitted"></app-multi-select>
          <app-radiobutton class="col-12" label="報表格式" controlName="report_type"
            [control]="queryForm.controls.report_type" [options]="report_typeOptions"
            [submitted]="submitted"></app-radiobutton>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS2G040" dataKey="tlt_no" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [loading]="loading" [showManage]="false" [showDelete]="false" [showReportMode]="false"></app-table-report>
</div>
