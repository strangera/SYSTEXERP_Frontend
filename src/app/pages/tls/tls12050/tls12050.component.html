<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            選擇館別
            <app-dropdown
              [options]="dropdown1"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.building_no"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-10 lg:col-6">
            選擇樓層
            <app-dropdown
              [options]="dropdown2"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.FLOOR_NO"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>

  <div class="card mt-5">
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <!-- 左圖區塊 -->
      <div style="flex: 2 1 0; min-width: 400px">
        <p-image
          *ngIf="selectedImage"
          [src]="selectedImage"
          (onImageError)="onImageError($event)"
          [attr.alt]="'目前選擇樓層：' + selectedFloor"
          [preview]="true"
          imageClass="w-full h-auto max-w-full"
        />
      </div>

      <!-- 右側營運資訊 -->
      <div style="flex: 1 1 0; min-width: 300px; margin-top: 100px">
        <table
          style="width: 100%; border-collapse: collapse"
          border="1"
          cellspacing="10"
          cellpadding="10"
        >
          <tbody>
            <tr>
              <td colspan="2"><b>目前營運資訊</b></td>
            </tr>
            <tr>
              <td style="width: 28%; background-color: rgb(185, 236, 219)">
                <b>項目</b>
              </td>
              <td style="width: 72%; background-color: rgb(185, 236, 219)">
                <b>資訊</b>
              </td>
            </tr>
            <!-- <tr>
              <td>檢視進度</td>
              <td>
                <app-multi-select
                  [control]="queryForm.controls.statusList"
                  [options]="dropdown3"
                  optionLabel="label"
                  optionValue="value"
                  [selectedItemsLabel]="'已選 {0} 項'"
                  [maxSelectedLabels]="0"
                  [panelStyle]="{ width: '320px' }"
                ></app-multi-select>
              </td>
            </tr> -->
            <tr>
              <td>樓層</td>
              <td>{{ selectedFloor }}</td>
            </tr>
            <tr>
              <td>館別</td>
              <td>{{ selectedBuildingLabel }}</td>
            </tr>

            <tr>
              <td style="background-color: rgb(185, 236, 219)">總計</td>
              <td style="background-color: rgb(185, 236, 219)">{{ All_Count }}</td>
            </tr>
            <tr>
              <td ><b>狀態</b></td>
              <td>
                <b>佔比 (%)</b>
              </td>
            </tr>
            <tr>
              <td>閒置</td>
              <td>{{ Idle }}</td>
            </tr>
            <tr>
              <td>洽談中</td>
              <td>{{ Under_Negotiation }}</td>
            </tr>
            <tr>
              <td>營運中</td>
              <td>{{ In_Operation }}</td>
            </tr>
            <tr>
              <td>停用</td>
              <td>{{ Outof_Service }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
