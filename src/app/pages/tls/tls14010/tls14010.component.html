<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="tlt_no" [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃名稱(品牌) " controlName="tlt_name" [control]="queryForm.controls.tlt_name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="位置編號 " controlName="location_no" [control]="queryForm.controls.location_no"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floorList" [options]="tlt_floorOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.tlt_floorList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="area_noList" [options]="areaOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.area_noList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類" controlName="bus_typeList" [options]="bus_typeOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.bus_typeList" [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" controlName="tlt_openflagList" [options]="tlt_openOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_openflagList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range class="col-12 md:col-6 lg:col-5" label="版本編號"
              [startControl]="queryForm.controls.Version_start" [endControl]="queryForm.controls.Version_start"
              [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="合約狀態" controlName="apply_status" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.apply_status" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick class="col-12 md:col-6 lg:col-5" label="日期條件"
              [startControl]="queryForm.controls.Date_start" [endControl]="queryForm.controls.Date_end"
              [submitted]="submitted" />
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table tableKey="TLS14010" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showCheckBox]="false" dataKey="id"
      [showManage]="false" [multiSortMeta]="[{ field: 'tlt_no', order: 1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
      [loading]="loading"></app-table>
  </div>
</div>
