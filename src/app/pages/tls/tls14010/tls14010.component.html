<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="tlt_noList" [options]="tlt_noOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.tlt_noList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃名稱" controlName="tlt_name" [control]="queryForm.controls.tlt_name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="位置編號" controlName="location_noList" [options]="location_noOptions"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.location_noList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別" controlName="tlt_building" [options]="buildingOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.tlt_building" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floorList" [options]="tlt_floorOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.tlt_floorList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="area_noList" [options]="areaOptions" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.area_noList" [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類" controlName="bus_typeList" [options]="bus_typeOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.bus_typeList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼" controlName="org_idList" [options]="org_idOptions" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.org_idList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" controlName="tlt_openflagList" [options]="tlt_openOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_openflagList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="合約狀態" controlName="apply_statusList" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.apply_statusList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="版本編號(起)" controlName="contract_subno_start"
              [control]="queryForm.controls.contract_subno_start" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="版本編號(迄) " controlName="contract_subno_end"
              [control]="queryForm.controls.contract_subno_end" [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range class="col-12 md:col-6 lg:col-5" label="營運日期"
              [startControl]="queryForm.controls.tlt_bdate" [endControl]="queryForm.controls.tlt_edate"
              [submitted]="submitted" />
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table-report tableKey="TLS14010" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showCheckBox]="false" [showDelete]="false" dataKey="id"
      [showManage]="false" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
      [queryFunction]="tls14010Service.queryTLS14010.bind(tls14010Service)" [loading]="loading"[ItemSize]="69"></app-table-report>
  </div>
</div>
