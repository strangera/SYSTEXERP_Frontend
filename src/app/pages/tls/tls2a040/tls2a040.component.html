<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="交易序號" controlName="TXN_No" [control]="queryForm.controls.TXN_No"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="銷售日期" [startControl]="queryForm.controls.TXN_Date_Start"
              [endControl]="queryForm.controls.TXN_Date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range label="金額" [startControl]="queryForm.controls.TXN_PayAmt_Start"
              [endControl]="queryForm.controls.TXN_PayAmt_End" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="狀況" controlName="check_statusList" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.check_statusList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="Floor_No" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Floor_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別" controlName="Building_No" [options]="buildingNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Building_No" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="查詢種類" controlName="docType" [control]="queryForm.controls.docType" [options]="[
                { label: '信用卡', value: 'creditcard' },
                { label: '有價券', value: 'voucher' },
                { label: '作廢發票', value: 'voidInvoice' },
              ]" (valueChange)="onDocTypeChange($event)">
            </app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text [label]="getDocLabel()" controlName="referenceNo" [control]="queryForm.controls.referenceNo"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div>
          <div>
            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
              <app-button btnType="clear" [form]="queryForm"></app-button>
              <app-button btnType="query" [loading]="loading"></app-button>
            </div>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table dataKey="id" [data]="data" [columns]="columns" [showCheckBox]="true"
    (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
    [multiSortMeta]="[{ field: 'TXN_Date,ECR_No,TXN_No', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true"
    [loading]="loading" (lazyLoadData)="onLazyLoadData($event,queryForm); onSubmit(queryForm)" [showPaginator]="true"
    [showReportMode]="false" [showDelete]="false" [showDetail]="false" [showEdit]="false" [showManage]="false">
    <header>
      <div class="flex align-items-center">
        <p-button label="匯出切結書" severity="success" (click)="exportReport(selectedItems)"
          [disabled]="selectedCount === 0" styleClass="small-btn"></p-button>
      </div>
    </header>
  </app-table>
</div>
