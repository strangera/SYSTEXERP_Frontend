<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
      <app-button btnType="back" (click)="onCancel()" class="col"></app-button>
    </div>
  </div>

  <div class="card">
    <app-table2
      [tableKey]="tableKey"
      [data]="data"
      [columns]="columns"
      dataKey="_rowKey"
      [lazy]="false"
      [loading]="loading"
      [showCheckBox]="false"
      [showReportMode]="false"
      [showDelete]="false"
      [showManage]="false"
      [totalRecords]="totalRecords"
      [showTotal]="true"
      [scrollHeight]="'60vh'">
    </app-table2>
  </div>
</div>
