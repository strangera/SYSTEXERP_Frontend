<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 盤點單編號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="盤點單編號" controlName="PST_No"
          [control]="dataForm.controls.PST_No" [submitted]="submitted"></app-input-text>

        <!-- 倉別代碼/名稱 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉別代碼/名稱" controlName="HOS_No" [options]="hosOptions"
          [control]="dataForm.controls.HOS_No" [submitted]="submitted"></app-dropdown>

        <!-- 品牌代碼/名稱 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No" [options]="logoOptions"
          [control]="dataForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>

        <!-- 盤點基準日期（起訖） -->
        <app-calendar class="col-12 md:col-6 lg:col-4" label="盤點基準日期" calendarType="dateOne"
          [control]="dataForm.controls.PST_Date" [submitted]="submitted"></app-calendar>

        <!-- 盤點單說明 -->
        <app-input-textarea class="col-12" label="盤點單說明" controlName="PST_Remark"
          [control]="dataForm.controls.PST_Remark" [submitted]="submitted"></app-input-textarea>

      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
