<!-- // 點單開立 -->
<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="盤點單編號" controlName="inventoryCode" [control]="dataForm.controls.inventoryCode"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
          <!-- 倉別 dropdown -->
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌代碼" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="盤點基準日期" [control]="dataForm.controls.inventoryDateFrom"
            [submitted]="submitted"></app-calendar>
          <!-- 盤點基準日期 -->
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text label="盤點單說明" controlName="Description" [control]="dataForm.controls.Description"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-editor-text>
        </div>
      </div>



      <div class="col-12 md:col-6 lg:col-4">
        <app-button btnType="create" label="全品項載入" (click)="switchloadbtn1()" class="col"></app-button>

      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-button btnType="create" label="單項輸入" (click)="switchloadbtn2()" class="col"></app-button>

      </div>




      <!---->
      <hr />
      <ng-container formArrayName="items">
        <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <!-- <p>名稱 {{ i + 1 }}</p> -->
            </div>
            <div>
              <app-button-dynamicallydelete (click)="onRemoveItem(i)" [crudstatus]="crudstatus"
                class="col"></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="商品管理編號/名稱" controlName="mgname" [control]="getFormControl(i, 'mgname')"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="國際條碼" controlName="barcode" [control]="getFormControl(i, 'barcode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="廠商貨號" controlName="vendorCode" [control]="getFormControl(i, 'vendorCode')"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="單項備註" controlName="remark" [control]="getFormControl(i, 'remark')"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
