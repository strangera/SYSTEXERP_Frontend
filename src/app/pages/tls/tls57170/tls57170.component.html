<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 存貨年月 - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="存貨年月" [control]="queryForm.controls.STK_YM" [submitted]="submitted" view="month"
              dateFormat="yy-mm">
            </app-calendar>
          </div>

          <!-- 門市編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="門市編號" [control]="queryForm.controls.SYS_StoreNo" [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 倉別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="倉別" [control]="queryForm.controls.HOS_No" [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 品牌 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="品牌" [control]="queryForm.controls.LOGO_No" [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 商品管理編號 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="商品管理編號" [control]="queryForm.controls.PLU_MagNo" [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 國際條碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="國際條碼" [control]="queryForm.controls.PLU_No" [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 廠商貨號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商貨號" [control]="queryForm.controls.PLU_OrgPLUNo" [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 推銷費用率 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="推銷費用率" [control]="queryForm.controls.FeeRate" [submitted]="submitted" type="number"
              step="0.01" placeholder="例: 0.12">
            </app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <!-- 右上角工具列：匯出 PDF & Excel -->
  <div class="flex justify-content-end gap-2 mb-2">
    <app-button label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF(queryForm)" [loading]="exportPDFbtnLoading"
      [disabled]="loading || (data.length || 0) === 0">
    </app-button>

    <app-button label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportExcel(queryForm)"
      [loading]="exportExcelbtnLoading" [disabled]="loading || (data.length || 0) === 0">
    </app-button>
  </div>

  <app-table tableKey="TLS57170" dataKey="PLU_MagNo" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [multiSortMeta]="[]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [showManage]="false" [showReportMode]="false">
  </app-table>
</div>
