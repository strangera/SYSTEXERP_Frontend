<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div >
          <app-button
            btnType="create"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="舊餘代卡卡號"
                  controlName="oldCardID"
                  [control]="queryForm.controls.oldCardID"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="新餘代卡卡號"
                  controlName="newCardID"
                  [control]="queryForm.controls.newCardID"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
            </div>
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <!-- <div class="card">
            <div class="col-13">
                <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-table>
            </div>
        </div> -->
  </div>
</div>
