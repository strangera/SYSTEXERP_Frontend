<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0 mb-3">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="活動編號"
                        controlName="pod_no"
                        [control]="df().pod_no"
                        [disabled]="true"
                        [submitted]="submitted"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-8"
                      label="活動名稱"
                      controlName="pod_desc"
                      [options]="service.campaignData()"
                      optionLabel="CampaignName"
                      optionValue="CampaignId"
                      [control]="df().pod_desc"
                      [loading]="service.campaignLoading()"
                      [submitted]="submitted"></app-dropdown>
      </div>

      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="活動類型"
                      controlName="pod_type"
                      [options]="service.podTypeItems()"
                      optionLabel="Name"
                      optionValue="No"
                      [disabled]="true"
                      [control]="df().pod_type"
                      [submitted]="submitted"></app-dropdown>
        <app-calendar-range class="col-12 md:col-6 lg:col-4"
                            calendarType="dateRange"
                            label="活動日期"
                            [startControl]="df().pod_sdate"
                            [endControl]="df().pod_edate"
                            [submitted]="submitted">
        </app-calendar-range>
        <app-calendar class="col-12 md:col-6 lg:col-4"
                      label="活動正檔日期"
                      controlName="pod_busdate"
                      [control]="df().pod_busdate"
                      [disabled]="false"
                      [submitted]="submitted"></app-calendar>
      </div>
      <div *ngIf="!isFormReadable"
           class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"></app-button>
        <p-fileUpload #fileUpload
                      [styleClass]="'p-3'"
                      [mode]="'basic'"
                      [accept]="'.xlsx,.xls,.csv,.ods'"
                      chooseLabel="選擇 Excel 檔案"
                      [auto]="true"
                      [customUpload]="true"
                      (uploadHandler)="handleUpload($event)"></p-fileUpload>
        <app-button btnType="CSV"
                    label="匯出 Excel 樣本"
                    (click)="onExportExcelTemplate()"></app-button>
        <app-button btnType="submit"
                    label="存檔"
                    [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<!-- 專櫃資料表格 -->
<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="專櫃資料"
               class="line-height-3 m-0 mb-3">
        <app-table [showCheckBox]="true"
                   [showRowEdit]="true"
                   [showInsert]="true"
                   [insertRowData]="true"
                   [data]="service.TLS26080Detail()"
                   [dataKey]="'tlt_no'"
                   [tableKey]="'TLS26080_Counter'"
                   [columns]="counterColumns"
                   [columnGroup]="counterColumnsGroup"
                   [totalRecords]="service.detailTotalRecords()"
                   (lazyLoadData)="onLazyLoadData($event, dataForm); onSubmit()"
                   [lazy]="true"
                   [loading]="service.dataLoading()"
                   (rowEditSave)="onInsert($event)"></app-table>
      </p-panel>
    </div>
  </div>
</div>
