<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>

  <!-- 活動基本資料 -->
  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0 mb-3">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <!-- 活動編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="活動編號"
                          controlName="pod_no"
                          [control]="dataForm.controls.pod_no"
                          [disabled]="true"
                          [submitted]="submitted"></app-input-text>
        </div>

        <!-- 活動名稱 -->
        <div class="col-12 md:col-6 lg:col-8">
          <app-dropdown label="活動名稱"
                        controlName="pod_desc"
                        [options]="service.campaignData()"
                        optionLabel="CampaignName"
                        optionValue="CampaignId"
                        [control]="dataForm.controls.pod_desc"
                        [submitted]="submitted"></app-dropdown>
        </div>
        <!-- <div class="col-12 md:col-6 lg:col-8">
          <app-input-text label="活動名稱"
                          controlName="pod_desc"
                          [control]="dataForm.controls.pod_desc"
                          [disabled]="false"
                          [submitted]="submitted">
          </app-input-text>
        </div> -->
      </div>

      <div class="grid p-fluid">
        <!-- 活動週期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <!-- <app-radiobutton label="活動起始日期"
                           groupname="calcDateType"
                           [control]="dataForm.controls.calcDateType"
                           [options]="calcDateType"
                           [submitted]="submitted">
          </app-radiobutton> -->
          <app-calendar-range calendarType="dateRange"
                              label="活動日期"
                              [startControl]="dataForm.controls.pod_sdate"
                              [endControl]="dataForm.controls.pod_edate"
                              [submitted]="submitted">
          </app-calendar-range>
        </div>

        <!-- 活動正檔 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar label="活動正檔日期"
                        controlName="pod_busdate"
                        [control]="dataForm.controls.pod_busdate"
                        [disabled]="false"
                        [submitted]="submitted"></app-calendar>
        </div>

        <!-- 扣款項目 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="扣款代碼"
                        controlName="cap_item"
                        [options]="service.capItems()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="dataForm.controls.cap_item"
                        [submitted]="submitted"></app-dropdown>
        </div>
      </div>
    </form>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear"
                  (click)="onClear()"></app-button>
      <app-button *ngIf="isFormCreateable"
                  btnType="query"
                  label="讀取環友資料"
                  (click)="queryCampaign()"></app-button>
      <app-button btnType="submit"
                  label="存檔"
                  (click)="onSubmit(dataForm)"></app-button>
    </div>
  </p-panel>
</div>

<!-- 專櫃資料表格 -->
<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="專櫃資料"
               class="line-height-3 m-0 mb-3">
        <app-table [showCheckBox]="true"
                   [showRowEdit]="true"
                   [alwaysEdit]="true"
                   [alwaysBlurValidate]="true"
                   [insertRowData]="true"
                   [data]="service.TLS26080Detail()"
                   [dataKey]="'tlt_no'"
                   [tableKey]="'TLS26080_Counter'"
                   (onBlur)="onBlurCounter($event)"
                   [columns]="counterColumns"></app-table>

        <!-- 選中專櫃提示 -->
        <!-- <div *ngIf="selectedCounter"

      </p-panel>
    </div>
  </div>
</div>
