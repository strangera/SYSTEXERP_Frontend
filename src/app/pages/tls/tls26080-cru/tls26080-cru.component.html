<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0 mb-3">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="活動編號" controlName="pod_no" [control]="df().pod_no"
          [disabled]="true" [submitted]="submitted"></app-input-text>
        <app-dropdown-table class="col-12 md:col-6 lg:col-8" label="活動名稱" controlName="pod_desc"
          [formGroup]="campaignForm" [dialogData]="campaignData()" [dialogColumns]="campaignColumns"
          optionLabel="CampaignName" optionValue="CampaignId" [fieldsConfig]="fieldsConfig"
          (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
          [control]="df().pod_desc" [loading]="loading" [submitted]="submitted"></app-dropdown-table>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="活動類型" controlName="pod_type"
          [options]="service.podTypeItems" optionLabel="label" optionValue="value" [disabled]="true"
          [control]="df().pod_type" [loading]="loading" [submitted]="submitted"></app-dropdown>
        <app-calendar-range class="col-12 md:col-6 lg:col-4" label="活動起始日期" [startControl]="df().pod_sdate"
          [endControl]="df().pod_edate" [submitted]="submitted">
        </app-calendar-range>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="活動正檔日期" controlName="pod_busdate"
          [control]="df().pod_busdate" [disabled]="false" [submitted]="submitted"></app-calendar>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="活動類型" controlName="pod_type"
          [options]="service.podTypeItems" optionLabel="label" optionValue="value" [disabled]="true"
          [control]="df().pod_type2" [loading]="loading" [submitted]="submitted"></app-dropdown>
        <app-calendar-range class="col-12 md:col-6 lg:col-4" label="活動兌回日期" [startControl]="df().pod_back_sdate"
          [endControl]="df().pod_back_edate" [submitted]="submitted">
        </app-calendar-range>
        @if (!isFormCreateable) {
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="審核狀態" controlName="pod_status"
          [options]="service.podStatusItems" optionLabel="label" optionValue="value" [disabled]="true"
          [control]="df().pod_status" [submitted]="submitted"></app-dropdown>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="審核人員" controlName="approved_usr_name"
          [control]="df().approved_usr_name" [disabled]="true" [submitted]="submitted"></app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="審核日期"
          controlName="approved_date" [control]="df().approved_date" [disabled]="true"
          customPlaceholder="核准後自動產生" [submitted]="submitted"></app-calendar>
        }

        <!-- 日期驗證錯誤提示 -->
        @if(dataForm.errors) {
        <div class="flex align-items-center col-12 md:col-6 lg:col-4">
          @if(dataForm.errors['invalidBackDateRange']) {
          <p class="text-red-500 text-sm m-0">
            <i class="pi pi-exclamation-triangle mr-2"></i>
            兌回起始日期必須小於兌回結束日期
          </p>
          }
          @if(dataForm.errors['invalidBackSDate']) {
          <p class="text-red-500 text-sm m-0">
            <i class="pi pi-exclamation-triangle mr-2"></i>
            兌回起始日期不可早於活動起始日期
          </p>
          }
          @if(dataForm.errors['invalidBusDate']) {
          <p class="text-red-500 text-sm m-0">
            <i class="pi pi-exclamation-triangle mr-2"></i>
            活動正檔日期必須在活動起始日期期間內
          </p>
          }
        </div>
        }
      </div>

      @if(!isFormReadable) {
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <p-fileUpload #fileUpload [styleClass]="'p-3'" [mode]="'basic'" [accept]="'.xlsx,.xls,.csv,.ods'"
          chooseLabel="選擇 Excel 檔案" [auto]="true" [customUpload]="true"
          (uploadHandler)="handleUpload($event)"></p-fileUpload>
        <app-button btnType="CSV" label="匯出 Excel 樣本" (click)="onExportExcelTemplate()"></app-button>
        <app-button btnType="CSV" label="匯出空白Excel範本" (click)="onExportBlankExcelTemplate()"></app-button>
        <app-button btnType="submit" label="存檔" [loading]="loading"></app-button>
      </div>
      }
    </form>
  </p-panel>
</div>

<!-- 選擇專櫃 Dialog -->
<app-dialog [visible]="displayDialog()" header="選擇專櫃" (visibleChange)="displayDialog.set($event)" (save)="saveDialog()"
  [disable]="!selectedItemsDialog().length" width="860px">

  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQueryDialog()">
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_no"
        [control]="dqf().tlt_no"></app-input-text>
      <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃名稱" controlName="tlt_name"
        [control]="dqf().tlt_name"></app-input-text>
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading()"></app-button>
    </div>
  </form>
  <hr />

  <app-table-report tableKey="TLS26080_TalentDialog" dataKey="talent_id" [data]="dialogData()" [columns]="dialogColumns"
    [totalRecords]="dialogData().length" [selectedItems]="selectedItemsDialog()"
    (selectionChange)="selectedItemsDialog.set($event)" [showCaption]="false" [showFilter]="false"
    [showReportMode]="false" [showExcel]="false" [showDelete]="false" [showManage]="false" [showCheckBox]="true"
    [queryFunction]="queryTalentDialog" [loading]="dialogLoading()" [ItemSize]="30">
  </app-table-report>
</app-dialog>

<!-- 專櫃資料表格 -->
<div class="card">
  <div class="grid p-fluid">
    <div class="col-12">
      <p-panel header="專櫃資料" class="line-height-3 m-0 mb-3">
        <!-- <app-table-edit #dt
                        [tableKey]="'TLS26080_Counter'"
                        [data]="tableData()"
                        (dataChange)="tableData.set($event)"
                        (fieldChange)="fieldChanges.set($event)"
                        [selectedItems]="selectedItems()"
                        (selectionChange)="selectedItems.set($event)"
                        [isRowSelectable]="isRowSelectable"
                        [columns]="counterColumns()"
                        [columnGroup]="counterColumnsGroup()"
                        (insert)="displayDialog.set(true)"
                        [canInsert]="false"
                        [tableRequired]="true"
                        [showInsert]="!isFormReadable"
                        [showReorder]="false"
                        [disabled]="isFormReadable"
                        [loading]="tableLoading()"></app-table-edit> -->
        <app-table #dt [tableKey]="'TLS26080_Counter'" [dataKey]="'_rowKey'" [data]="tableData()"
          (dataChange)="tableData.set($event)" (fieldChange)="fieldChanges.set($event)"
          [selectedItems]="selectedItems()" (selectionChange)="selectedItems.set($event)"
          [columns]="counterColumns()" [columnGroup]="counterColumnsGroup()"
          [rowValidate]="validateEntireRow" [showRowValidationHint]="true" [tableRequired]="true"
          errorMessage="請至少新增一筆專櫃資料" [showInsert]="!isFormReadable" [showDelete]="!isFormReadable"
          [showEdit]="!isFormReadable" [showCheckBox]="!isFormReadable" [showRowEdit]="!isFormReadable"
          [showManage]="!isFormReadable" [alwaysEdit]="!isFormReadable" (insert)="openDialog()"
          [disabled]="isFormReadable" (delete)="onDelete()" [loading]="tableLoading()">
        </app-table>
      </p-panel>
    </div>
  </div>
</div>
