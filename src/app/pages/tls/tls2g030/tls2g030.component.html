<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateYearOne" label="年" controlName="budget_yy"
              [control]="queryForm.controls.budget_yy" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼/名稱" controlName="bus_type" [options]="bus_typeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.bus_type"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="tlt_no" [options]="tlt_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_no" [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS2G030" dataKey="tlt_no" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [columnGroup]="columnGroup" [loading]="loading" [showManage]="false" [showDelete]="false" [showReportMode]="false"
    [lastQueryBody]="lastQueryFormValue" [queryFunction]="tls2g030Service.queryTLS2G030.bind(tls2g030Service)"
    [footerData]="footerTotal" [loading]="loading">
    <header>
      <div class="flex align-items-center justify-content-between">
        <span class="font-bold">
          {{ yyyy ? ('專櫃預估業績報表 年度: ' + yyyy) : '' }}
        </span>
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="產出PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
            [disabled]="data.length === 0"></p-button>
          <p-button styleClass="p-2" label="產出XLSX" [loading]="btnLoading" icon="pi pi-file" (click)="onExportXLSX()"
            [disabled]="data.length === 0"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
