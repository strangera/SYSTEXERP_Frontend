<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-calendar calendarType="dateYearOne" label="年"
                                    [control]="queryForm.controls.onedatetyy" [submitted]="submitted">
                                </app-calendar>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="業種" controlName="industryCode" [options]="industryCodeOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.industryCode"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="專櫃" controlName="counter" [options]="counterOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.counter"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
