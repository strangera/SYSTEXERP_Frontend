<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <p-fileUpload #fileUpload
                    mode="basic"
                    chooseIcon="pi pi-upload"
                    class="p-button p-button-sm"
                    accept=".xlsx, .xls, .csv"
                    (onSelect)="onFileUpload($event);fileUpload.clear()"
                    [auto]="true"
                    chooseLabel="匯入EXCEL" />
      <app-button btnType="create"
                  (click)="onCreate()"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別"
                          controlName="sys3800"
                          [options]="tls26010Service.sys3800List()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="queryForm.controls.sys3800"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層"
                          controlName="sys3900"
                          [options]="tls26010Service.sys3900List()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="queryForm.controls.sys3900"
                          [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號"
                              controlName="ecrNos"
                              [options]="tls26010Service.ECRList()"
                              optionLabel="Name"
                              optionValue="No"
                              [control]="queryForm.controls.ecrNos"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號"
                              controlName="tltNos"
                              [options]="tls26010Service.TLTList()"
                              optionLabel="Name"
                              optionValue="No"
                              [control]="queryForm.controls.tltNos"
                              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange"
                                label="起始日期"
                                [startControl]="queryForm.controls.podSdateS"
                                [endControl]="queryForm.controls.podSdateE"
                                [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange"
                                label="截止日期"
                                [startControl]="queryForm.controls.podEdateS"
                                [endControl]="queryForm.controls.podEdateE"
                                [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear"
                      (click)="onClearForm()"></app-button>
          <app-button btnType="query"
                      (click)="onSubmitQuery(queryForm)"
                      [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table [showCheckBox]="true"
               [data]="tls26010Service.TLS26010List()"
               [tableKey]="'TLS26010'"
               [dataKey]="'pod_no'"
               [columns]="columns"
               [addButton]="addButton"
               [selectedItems]="selectedItems"
               (selectionChange)="selectedItems = $event"
               (delete)="onDelete($event)"
               (edit)="onEdit($event)"
               (detail)="onDetail($event)"></app-table>
  </div>
</div>
