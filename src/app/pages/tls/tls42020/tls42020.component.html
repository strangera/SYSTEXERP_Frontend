<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 菜單類別 -->
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="菜單類別" controlName="menuType"
            [options]="menuTypeOptions" [control]="queryForm.controls.menuType" [submitted]="submitted"
            optionLabel="label" optionValue="value"></app-multi-select>
          <!-- 專櫃編號/名稱 -->
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="專櫃編號/名稱" controlName="tltNo"
            [options]="tltNoOptions" [control]="queryForm.controls.tltNo" [submitted]="submitted" optionLabel="label"
            optionValue="value"></app-multi-select>
          <app-calendar class="col-12 md:col-6 lg:col-6" label="有效起始日期" calendarType="dateOne"
            [control]="queryForm.controls.SBM_BegDate" [submitted]="submitted"></app-calendar>
          <app-calendar class="col-12 md:col-6 lg:col-6" label="有效結束日期" calendarType="dateOne"
            [control]="queryForm.controls.SBM_EndDate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS42020" [data]="data" dataKey="id" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [multiSortMeta]="[{ field: 'TLT_No', order: 0 }]" [lazy]="true" [loading]="loading" [showDelete]="true"
    [expansionColumns]="expansionColumns" expansionDataKey="ID" [expansionShowPaginator]="false"
    [expansionLoadFn]="loadDetails" [showCheckBox]="true" (delete)="onDelete(selectedItems)" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showExcel]="true" [showExcelExport]="false" [showExcelImport]="false"
    [showCustomExcelImport]="true" (importExcel)="onImport($event)">
  </app-table>
</div>

<app-dialog [visible]="dialogVisible" header="匯入菜單" (visibleChange)="dialogVisible = $event" [showFooter]="false"
  [disable]="false" [height]="'auto'" [width]="'auto'">
  <ul>
    <li>下載 <a (click)="downloadTemplate()" style="cursor: pointer;">範例檔案</a>，並新增菜單內容。</li>
    <li>將編輯好的檔案，上傳至此。</li>
  </ul>
  <form [formGroup]="queryForm2">
    <div class="col-12"><app-radiobutton label="異動方式" controlName="uploadType"
        [control]="queryForm2.controls.uploadType" [options]="uploadTypeOptions"
        [submitted]="submitted"></app-radiobutton>
    </div>
  </form>
  <app-file-upload #fileUpload [accept]="'.xlsx,.xls'" [customUpload]="true" (uploadHandler)="onFileUpload($event)"
    (select)="onFileSelect($event)"></app-file-upload>
</app-dialog>
