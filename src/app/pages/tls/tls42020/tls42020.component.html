<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="複製設定" (click)="openCopyDialog()"></app-button>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 菜單類別 -->
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="菜單類別" controlName="menuType"
            [options]="menuTypeOptions" [control]="queryForm.controls.menuType" [submitted]="submitted"
            optionLabel="label" optionValue="value"></app-multi-select>
          <!-- 專櫃編號/名稱 -->
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="專櫃編號/名稱" controlName="TLT_No"
            [options]="tltNoOptions | async" [control]="queryForm.controls.TLT_No" [submitted]="submitted"
            optionLabel="label" optionValue="value"></app-multi-select>
          <app-calendar class="col-12 md:col-6 lg:col-6" label="有效起始日期" calendarType="dateOne"
            [control]="queryForm.controls.SBM_BegDate" [submitted]="submitted"></app-calendar>
          <app-calendar class="col-12 md:col-6 lg:col-6" label="有效結束日期" calendarType="dateOne"
            [control]="queryForm.controls.SBM_EndDate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS42020" [data]="data" dataKey="id" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls42020Service.queryTLS42020.bind(tls42020Service)" [loading]="loading"
    [expansionColumns]="expansionColumns" expansionDataKey="ID" [expansionLoadFn]="loadDetails" [showCheckBox]="true"
    (delete)="onDelete(selectedItems)" (edit)="onEdit($event)" (detail)="onDetail($event)" [showExcel]="true"
    [showExcelExport]="false" [showExcelImport]="false" [showCustomExcelImport]="true"
    (importExcel)="dialogVisible = true">
    <header>
      <p-button [style]="{ width: '35px', height: '35px', 'border-radius': '50%' }" pTooltip="下傳" tooltipPosition="top"
        icon="pi pi-upload rotate-180" severity="success" class="p-button-rounded p-button-text"
        [disabled]="selectedItems.length === 0" (click)="onUpload()" [loading]="btnLoading" />
    </header>
  </app-table-report>
</div>

<app-dialog [visible]="dialogVisible" header="匯入菜單" (visibleChange)="dialogVisible = $event" [showFooter]="false"
  [disable]="false" [height]="'auto'" [width]="'auto'">
  <ul>
    <li>
      下載
      <a (click)="downloadTemplate()" style="cursor: pointer">範例檔案</a>
      ，並新增菜單內容。
    </li>
    <li>將編輯好的檔案，上傳至此。</li>
  </ul>
  <form [formGroup]="queryForm2">
    <div class="col-12">
      <app-radiobutton label="異動方式" controlName="uploadType" [control]="queryForm2.controls.uploadType"
        [options]="uploadTypeOptions" [submitted]="submitted"></app-radiobutton>
    </div>
  </form>
  <app-file-upload #fileUpload [accept]="'.xlsx,.xls'" [customUpload]="true"
    (uploadHandler)="onFileUpload($event)"></app-file-upload>
</app-dialog>

<app-dialog [visible]="copyDialogVisible" header="複製設定" (visibleChange)="copyDialogVisible = $event"
  (save)="saveCopyDialog(copyDialogForm)" [loading]="loading" [width]="'900px'">
  <form [formGroup]="copyDialogForm" class="grid p-fluid">
    <app-dropdown class="col-12" label="來源菜單" controlName="Source_No" [control]="copyDialogForm.controls.Source_No"
      [options]="copySourceOptions" optionLabel="label" optionValue="value" [submitted]="submitted"
      (changeEvent)="onCopySourceChange($event)"></app-dropdown>

    <hr class="col-12" />

    <app-dropdown class="col-12 md:col-6" label="目標專櫃" controlName="Target_TLT_No"
      [control]="copyDialogForm.controls.Target_TLT_No" [options]="targetTltNoOptions | async" optionLabel="label"
      optionValue="value" [submitted]="submitted"></app-dropdown>
    <app-dropdown class="col-12 md:col-6" label="目標菜單類別" controlName="Target_SBM_Type"
      [control]="copyDialogForm.controls.Target_SBM_Type" [options]="menuTypeOptions" optionLabel="label"
      optionValue="value" [submitted]="submitted"></app-dropdown>
    <app-calendar class="col-12 md:col-6" label="目標有效起始日期" calendarType="dateOne"
      [control]="copyDialogForm.controls.Target_SBM_BegDate" [submitted]="submitted"></app-calendar>
    <app-calendar class="col-12 md:col-6" label="目標有效結束日期" calendarType="dateOne"
      [control]="copyDialogForm.controls.Target_SBM_EndDate" [submitted]="submitted"></app-calendar>
  </form>

  @if (submitted && !selectedSourceItem) {
  <small class="text-red-500 block mt-2">
    ❌ 請先選擇來源菜單
  </small>
  }
  @if (submitted && isTargetSameAsSource) {
  <small class="text-red-500 block mt-2">
    ❌ 目標專櫃不可與來源專櫃相同
  </small>
  }

  <app-table-report tableKey="TLS42020CopySourceDetail" dataKey="ID" [lazy]="false" [showManage]="false"
    [showDelete]="false" [showReportMode]="false" [showExcel]="false" [data]="copySourceDetail"
    [columns]="copySourceExpansionColumns" [totalRecords]="copySourceDetail.length"
    [loading]="copySourceDetailLoading"></app-table-report>
</app-dialog>
