<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate(queryForm)" label="新增"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="菜單類別" controlName="menuType"
            [options]="menuTypeOptions" [control]="queryForm.controls.menuType"
            [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-6" label="專櫃編號/名稱" controlName="tltNo"
            [options]="tltNoOptions" [control]="queryForm.controls.tltNo" [submitted]="submitted"></app-multi-select>
          <app-calendar-range class="col-12 md:col-6 lg:col-6" label="有效起始日期" calendarType="dateMonthRange"
            [startControl]="queryForm.controls.SBM_BegDate_start" [endControl]="queryForm.controls.SBM_BegDate_end"
            [submitted]="submitted"></app-calendar-range>
          <app-calendar-range class="col-12 md:col-6 lg:col-6" label="有效結束日期" calendarType="dateMonthRange"
            [startControl]="queryForm.controls.SBM_EndDate_start" [endControl]="queryForm.controls.SBM_EndDate_end"
            [submitted]="submitted"></app-calendar-range>
        </div>

        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS42020" [dataKey]="'tltNo'" [data]="data" [columns]="columns" [multiSortMeta]="[]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showDelete]="true"
    [showManage]="true" [showCheckBox]="true" [expansionColumns]="expansionColumns" [expansionDataKey]="'details'"
    [expansionLoadFn]="loadDetails" [showExcel]="true" [showExcelImport]="true" [showExcelExport]="false"
    (importExcel)="importExcel()">
  </app-table>
</div>
