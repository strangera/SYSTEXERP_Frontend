<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
</div>
<div class="card">
  <app-table-report
    tableKey="tls32040"
    [lastQueryBody]="historyRequestBody"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [showDelete]="false"
    [showManage]="false"
    [showReportMode]="false"
    [queryFunction]="tls32040Service.queryTLS32040Detail.bind(tls32040Service)"
    [loading]="loading"
  >
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button
          styleClass="p-2"
          label="單組織業績報表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onReport(false)"
          [disabled]="data.length === 0"
          [loading]="btnLoading"
        ></p-button>
        <p-button
          styleClass="p-2"
          label="單組織業績報表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onReport(true)"
          [disabled]="data.length === 0"
          [loading]="btnLoading"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
