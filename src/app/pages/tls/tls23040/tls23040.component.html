<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart" [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"></app-calendar-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號" [control]="queryForm.controls.ECR_No" [options]="ECRNoOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="交易序號" [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End" [submitted]="submitted"></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" [control]="queryForm.controls.TLT_No" [options]="CounterOptions"
              optionLabel="formLabel" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="交易型態" [control]="queryForm.controls.TXN_Status" [options]="txnStatusOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="狀態旗標" [control]="queryForm.controls.TXN_FlagStatus" [options]="statusFlagOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="停車卡號" [control]="queryForm.controls.TXN_PkngUID"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="會員卡號" [control]="queryForm.controls.TXN_MemCard"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票號碼" [control]="queryForm.controls.TXN_GUIBegNo"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" [control]="queryForm.controls.tlt_building" [options]="BUILDING_NO_Options"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [control]="queryForm.controls.tlt_floor" [options]="floorOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼/名稱" [control]="queryForm.controls.org_id" [options]="OrganizationCodeOptions"
              optionLabel="formLabel" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="原交易日期"
            [startControl]="queryForm.controls.ORG_TXN_DateStart" [endControl]="queryForm.controls.ORG_TXN_DateEnd"
            [submitted]="submitted"></app-calendar-range>

          <div *ngIf="viewMode === 'invoice'" class="col-12 md:col-6 lg:col-4 flex align-items-center gap-2 pt-4">
            <p-checkbox inputId="ExcludeNoGUI" formControlName="ExcludeNoGUI" [binary]="true"></p-checkbox>
            <label for="ExcludeNoGUI" class="cursor-pointer text-sm text-gray-700">
              排除無發票號碼交易
            </label>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card mb-2">
  <div class="flex gap-4 align-items-center">
    <p-radioButton name="viewMode" inputId="vm-invoice" label="發票明細" value="invoice" [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }" (onClick)="onViewChange()"></p-radioButton>
    <p-radioButton name="viewMode" inputId="vm-payment" label="付款明細" value="payment" [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }" (onClick)="onViewChange()"></p-radioButton>
    <p-radioButton name="viewMode" inputId="vm-discount" label="折扣/金額明細" value="discount" [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }" (onClick)="onViewChange()"></p-radioButton>
  </div>
</div>

<div class="card">
  <app-table-report [tableKey]="'TLS23040_' + viewMode" [lastQueryBody]="historyRequestBody" [data]="activeRows"
    [columns]="activeColumns" [totalRecords]="totalRecords" [loading]="loading" [showManage]="false"
    [showDelete]="false" [showReportMode]="false" [queryFunction]="queryTLS23040ForReport" [footerData]="activeFooter"
    groupRowsBy="_grpKey" [ItemSize]="60">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button type="button" label="發票報表.PDF" styleClass="p-2" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDFClick($event)" [disabled]="!historyRequestBody || lastTotalCount === 0"></p-button>
        <p-button type="button" label="發票報表.XLSX" styleClass="p-2" [loading]="btnLoading" icon="pi pi-file-excel"
          (click)="onExportXLSX()" [disabled]="!historyRequestBody || lastTotalCount === 0"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
