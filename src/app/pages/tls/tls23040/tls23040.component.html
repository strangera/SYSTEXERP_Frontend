<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted">
          </app-calendar-range-quick>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="交易序號"
              controlName="TXN_No_Start"
              [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="交易型態"
              controlName="TXN_Status"
              [options]="txnStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_Status"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="狀態旗標"
              controlName="TXN_FlagStatus"
              [options]="statusFlagOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_FlagStatus"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="停車卡號"
              controlName="TXN_PkngUID"
              [control]="queryForm.controls.TXN_PkngUID"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="會員卡號"
              controlName="TXN_MemCard"
              [control]="queryForm.controls.TXN_MemCard"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="發票號碼"
              controlName="TXN_GUIBegNo"
              [control]="queryForm.controls.TXN_GUIBegNo"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 檢視模式切換 -->
<div class="card mb-2">
  <div class="flex gap-4 align-items-center">
    <p-radioButton
      name="viewMode"
      inputId="vm-invoice"
      label="發票明細"
      value="invoice"
      [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }"
      (onClick)="onViewChange()">
    </p-radioButton>

    <p-radioButton
      name="viewMode"
      inputId="vm-payment"
      label="付款明細"
      value="payment"
      [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }"
      (onClick)="onViewChange()">
    </p-radioButton>

    <p-radioButton
      name="viewMode"
      inputId="vm-discount"
      label="折扣/金額明細"
      value="discount"
      [(ngModel)]="viewMode"
      [ngModelOptions]="{ standalone: true }"
      (onClick)="onViewChange()">
    </p-radioButton>
  </div>
</div>

<!-- 單一表格：動態欄位/資料/群組/小計/總計 -->
<div class="card">
  <app-table2
    tableKey="TLS23040"
    [dataKey]="'_rowKey'"
    [data]="activeData"
    [columns]="activeColumns"
    [showTotal]="true"
    [showSubTotal]="activeShowSubTotal"
    [groupRowsBy]="activeGroupBy"
    [externalTotals]="activeExternalTotals"
    [externalTotalFieldMap]="activeExternalTotalFieldMap"
    [externalSubtotals]="activeExternalSubtotals"
    [externalSubtotalFieldMap]="activeExternalSubtotalFieldMap"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [showCheckBox]="false"
    [multiSortMeta]="sortMeta"
    [serverFetch]="fetchTLS23040"  
    [lazy]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm)">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產出發票報表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportPDF()"
          [disabled]="invoiceRows.length === 0">
        </p-button>

        <p-button
          styleClass="p-2"
          label="產出發票報表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file-excel"
          (click)="onExportXLSX()"
          [disabled]="invoiceRows.length === 0">
        </p-button>
      </div>
    </header>
  </app-table2>
</div>
