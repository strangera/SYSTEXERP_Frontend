<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 銷售日期區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              calendarType="dateRange"
              label="銷售日期區間"
              [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd"
              [submitted]="submitted"
            ></app-calendar-range-quick>
          </div>

          <!-- Radio + 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- Radio + 大分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="大分類"
              [options]="bus_typeOptions"
              [control]="queryForm.controls.bus_type"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 是否顯示大分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否顯示大分類"
              controlName="ShowBusType"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ShowBusType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="區域"
              controlName="area_no"
              [options]="regionOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.area_no"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 組織代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              class="col-12"
              label="顯示大分類"
              groupname="show_bus_type"
              [control]="queryForm.controls.ShowBusType"
              [options]="WhetherOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="TLS23120"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    dataKey="TXN_No"
    [multiSortMeta]="[{ field: 'TLT_No', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
