<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 銷售日期區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="銷售日期"
              [startControl]="queryForm.controls.saleDateStart"
              [endControl]="queryForm.controls.saleDateEnd"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- Radio + 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input type="radio" formControlName="locationRadio" [value]="'organizationCode'" />
              </div>
              <div class="col-10">
                <app-dropdown
                  label="專櫃編號"
                  controlName="organizationCode"
                  [options]="organizationOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.organizationCode"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
            </div>
          </div>

          <!-- Radio + 區域 + 樓層 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input type="radio" formControlName="locationRadio" [value]="'regionOrFloor'" />
              </div>
              <div class="col-10">
                <app-dropdown
                  label="區域"
                  controlName="regionCode"
                  [options]="regionOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.regionCode"
                  [submitted]="submitted"
                ></app-dropdown>
                <app-multi-select
                  label="樓層"
                  [options]="floorOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.tlt_floor"
                  [submitted]="submitted"
                ></app-multi-select>
              </div>
            </div>
          </div>

          <!-- Radio + 大分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <div class="grid align-items-center">
              <div class="col-2">
                <input type="radio" formControlName="locationRadio" [value]="'businessTypeCode'" />
              </div>
              <div class="col-10">
                <app-dropdown
                  label="大分類"
                  controlName="businessTypeCode"
                  [options]="businessTypeCodeOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.businessTypeCode"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
            </div>
          </div>

          <!-- 是否顯示業種 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否顯示業種"
              controlName="whetherDisplayBusinessType"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whetherDisplayBusinessType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 組織代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS23120"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true"
    dataKey="TXN_No"
    [multiSortMeta]="[{ field: 'area', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
