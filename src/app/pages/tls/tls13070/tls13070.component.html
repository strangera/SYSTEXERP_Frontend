<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃招募編號" controlName="Apply_No" [control]="queryForm.controls.Apply_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代號" controlName="BUS_Type" [options]="BUS_TypeOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.BUS_Type" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="TLT_No" [control]="queryForm.controls.TLT_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="櫃位名稱" controlName="TLT_Name" [control]="queryForm.controls.TLT_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商統一編號" controlName="VEN_Uniform" [options]="VEN_UniformOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.VEN_Uniform"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="版本編號"
              [startControl]="queryForm.controls.Contract_SubNo_Start"
              [endControl]="queryForm.controls.Contract_SubNo_End" [submitted]="submitted"></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="合約狀態" controlName="approve_status" [options]="approve_statusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.approve_status"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="區域" controlName="Area_No" [options]="Area_NoOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.Area_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="FLOOR_No" [options]="FLOOR_NoOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.FLOOR_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="洽談者" controlName="contact_USR_No" [options]="contact_USR_NoOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.contact_USR_No"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織" controlName="org_id" [options]="org_idOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_id" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" controlName="tlt_openflagList" [options]="tlt_openflagListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_openflagList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成額計算方式" controlName="comm_comp_typeList" [options]="comm_comp_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.comm_comp_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="回函日期"
              [startControl]="queryForm.controls.feedback_date_Start"
              [endControl]="queryForm.controls.feedback_date_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="回函期限" [startControl]="queryForm.controls.due_date_Start"
              [endControl]="queryForm.controls.due_date_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="洽談日期"
              [startControl]="queryForm.controls.contact_Date_Start" [endControl]="queryForm.controls.contact_Date_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營業型態" controlName="paper_typeList" [options]="paper_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.paper_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約起始日"
              [startControl]="queryForm.controls.tlt_bdate_Start" [endControl]="queryForm.controls.tlt_bdate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約截止日"
              [startControl]="queryForm.controls.tlt_edate_Start" [endControl]="queryForm.controls.tlt_edate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運起始日"
              [startControl]="queryForm.controls.tlt_contract_bdate_Start"
              [endControl]="queryForm.controls.tlt_contract_bdate_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運截止日"
              [startControl]="queryForm.controls.tlt_contract_edate_Start"
              [endControl]="queryForm.controls.tlt_contract_edate_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="tlt_kindList" [options]="tlt_kindListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_kindList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="裝潢方式" controlName="deco_typeList" [options]="deco_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.deco_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="tlt_term_typeList" [options]="tlt_term_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_term_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="結帳方式" controlName="money_typeList" [options]="money_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.money_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="付款方式" controlName="paytypeList" [options]="paytypeListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.paytypeList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="配合方式" controlName="store_wayList" [options]="store_wayListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.store_wayList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否開立業主發票" controlName="rece_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.rece_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否使用業主收銀機" controlName="pos_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.pos_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否為業主收現" controlName="cash_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.cash_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="apply_No" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showCheckBox]="true" [multiSortMeta]="queryForm.controls.SortBy.value" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false"></app-table>
</div>
