<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃招募編號" controlName="Apply_No" [control]="queryForm.controls.Apply_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代號" controlName="bus_typeList" [options]="BUS_TypeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.bus_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="tlt_noList" [control]="queryForm.controls.tlt_noList"
              [submitted]="submitted" [options]="Tlt_NoOptions | async" optionLabel="label"
              optionValue="value"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="櫃位名稱" controlName="tlt_name" [control]="queryForm.controls.tlt_name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="廠商統一編號" controlName="ven_uniform_List" [options]="VEN_UniformOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.ven_uniform_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="版本編號"
              [startControl]="queryForm.controls.contract_subno_Start"
              [endControl]="queryForm.controls.contract_subno_End" [submitted]="submitted"></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="合約狀態" controlName="approve_status_List" [options]="approve_statusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.approve_status_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="area_no_List" [options]="Area_NoOptions | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.area_no_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floor_List" [options]="FLOOR_NoOptions | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.tlt_floor_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="洽談者" controlName="contact_USR_No_List" [options]="contact_USR_NoOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.contact_USR_No_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織" controlName="org_id_List" [options]="org_idOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_id_List" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" controlName="tlt_openflag_List" [options]="tlt_openflagListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_openflag_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成額計算方式" controlName="comm_comp_type_List" [options]="comm_comp_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.comm_comp_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="回函日期" [startControl]="queryForm.controls.feedback_date_Start"
              [endControl]="queryForm.controls.feedback_date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="回函期限" [startControl]="queryForm.controls.due_date_Start"
              [endControl]="queryForm.controls.due_date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="洽談日期" [startControl]="queryForm.controls.contact_Date_Start"
              [endControl]="queryForm.controls.contact_Date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營業型態" controlName="paper_type_List" [options]="paper_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.paper_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="契約起始日" [startControl]="queryForm.controls.tlt_bdate_Start"
              [endControl]="queryForm.controls.tlt_bdate_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="契約截止日" [startControl]="queryForm.controls.tlt_edate_Start"
              [endControl]="queryForm.controls.tlt_edate_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="營運起始日" [startControl]="queryForm.controls.tlt_contract_bdate_Start"
              [endControl]="queryForm.controls.tlt_contract_bdate_End"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="營運截止日" [startControl]="queryForm.controls.tlt_contract_edate_Start"
              [endControl]="queryForm.controls.tlt_contract_edate_End"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="tlt_kind_List" [options]="tlt_kindListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_kind_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="裝潢方式" controlName="deco_type_List" [options]="deco_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.deco_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="tlt_term_type_List" [options]="tlt_term_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_term_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="結帳方式" controlName="money_type_List" [options]="money_typeListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.money_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="付款方式" controlName="paytype_List" [options]="paytypeListOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.paytype_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="配合方式" controlName="store_way_List" [options]="store_wayListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.store_way_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否開立業主發票" controlName="rece_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.rece_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否使用業主收銀機" controlName="pos_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.pos_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn [showAll]="true" label="是否為業主收現" controlName="cash_yn" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.cash_yn" [submitted]="submitted"></app-radiobutton-yn>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-tls13070-table tableKey="FIN21020query" dataKey="id" [lastQueryBody]="lastQueryBody" [loading]="loading"
    [totalRecords]="totalRecords" [data]="data" [aps1003_A]="aps1003_A" [aps1003_B]="aps1003_B" [aps1003_C]="aps1003_C"
    [aps1003_D]="aps1003_D" [queryFunction]="tls13070Service.queryTLS13070.bind(tls13070Service)"></app-tls13070-table>
</div>
