<div class="grid align-items-center">
    <div class="col" style="flex: 1;">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div>
        <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
</div>

<p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'">
        <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmitQuery(queryForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="館別" controlName="BUILDING_NO" [options]="BUILDING_NO_Options"
                        optionLabel="label" optionValue="value" [control]="queryForm.controls.BUILDING_NO"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="樓層" controlName="FLOOR_NO" [options]="floorOptions" optionLabel="label"
                        optionValue="value" [control]="queryForm.controls.FLOOR_NO" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="區域" controlName="AREA_NO" [options]="RegionCodeOptions" optionLabel="label"
                        optionValue="value" [control]="queryForm.controls.AREA_NO" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="位置代碼" [control]="queryForm.controls.LOCATION_No" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="組織代碼" controlName="ORG_NO" [options]="OrganizationCodeOptions"
                        optionLabel="label" optionValue="value" [control]="queryForm.controls.ORG_No"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="營業坪數" [control]="queryForm.controls.GROSS_SPACE" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="簽約坪數" [control]="queryForm.controls.NET_SPACE" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="用途" controlName="Location_Purpose" [options]="usageOptions" optionLabel="label"
                        optionValue="value" [control]="queryForm.controls.Location_Purpose" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-multi-select label="狀態" controlName="LOCATION_Status" [options]="LOCATION_Status_Options"
                        optionLabel="label" optionValue="value" [control]="queryForm.controls.LOCATION_Status"
                        [submitted]="submitted">
                    </app-multi-select>
                </div>
            </div>
            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
            </div>
        </form>
    </p-accordionTab>
</p-accordion>

<div class="card">
    <div class="col-13">
        <app-table [columns]="columns" [data]="data" [title]="'專櫃位置資料維護'" [totalRecords]="totalRecords"
            [lazy]="enableLazy" [showCheckBox]="true" [selectedItems]="selectedItems" (lazyLoad)="onLazyLoad($event)"
            (edit)="onEdit($event)" (detail)="onDetail($event)" (delete)="onDelete($event)">
        </app-table>
    </div>
</div>
