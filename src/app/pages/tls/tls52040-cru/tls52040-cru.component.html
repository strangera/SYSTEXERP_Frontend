<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="退貨驗收單號" controlName="RJM_No"
          [control]="dataForm.controls.RJM_No" [submitted]="submitted" />
      </div>
      <hr>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No"
          [options]="vendorOptions | async" optionLabel="label" optionValue="VEN_No"
          [control]="dataForm.controls.VEN_No" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
          [options]="brandOptions | async" optionLabel="label" optionValue="No" [control]="dataForm.controls.LOGO_No"
          [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
          [options]="warehouseOptions | async" optionLabel="label" optionValue="No" [control]="dataForm.controls.HOS_No"
          [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="退貨驗收金額" controlName="RJM_TotalBuyNet"
          [control]="dataForm.controls.RJM_TotalBuyNet" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="稅額" controlName="RJM_TotalBuyTax"
          [control]="dataForm.controls.RJM_TotalBuyTax" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="合計金額" controlName="RJM_TotalBuyAmt"
          [control]="dataForm.controls.RJM_TotalBuyAmt" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="申請人" controlName="APPLY_USR_Name"
          [control]="dataForm.controls.APPLY_USR_Name" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="申請日期" controlName="RJM_Date"
          [control]="dataForm.controls.APPLY_Date" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="售價總計" controlName="RJM_TotalSaleAmt"
          [control]="dataForm.controls.RJM_TotalSaleAmt" [submitted]="submitted" />
        <app-input-textarea class="col-12" label="退貨驗收單說明" controlName="RJM_Remark"
          [control]="dataForm.controls.RJM_Remark" [submitted]="submitted" />
      </div>
      <app-table-edit class="col-12" tableKey="TLS52040Detail" [columns]="editColumns" [data]="data"
        (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" errorMessage="請至少選擇一個驗收項目！"
        (dataChange)="data = $event;calculateTotals()" [tableRequired]="true" [disabled]="isFormReadable"
        [showDelete]="false" (insert)="onShowDialog()" [showInsert]="isFormCreateable || rowdata?.RJM_Status === '1'"
        [canInsert]="false" [insertDisabled]="dataForm.controls.VEN_No.value && dataForm.controls.LOGO_No.value &&
        dataForm.controls.HOS_No.value ? false : true" [multiSortMeta]="[{ field: 'ODM_No', order: 1 }]" />
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onReset()" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇退貨單" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0" [height]="'500px'">
  <app-table tableKey="tls52030DialogTable" dataKey="CRN_No" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [multiSortMeta]="[{ field: 'CRN_No', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, dataForm);" [lazy]="true"
    [loading]="dialogLoading">
  </app-table>
</app-dialog>
