<div class="flex gap-2 mb-2">
  <app-menubar [ProgNo]="ProgNo"
               class="flex-1"></app-menubar>
  <!-- <app-button btnType="create"
              (click)="onCreate()"
              [label]="'create' | translate"></app-button> -->
</div>
<p-accordion>
  <p-accordionTab [header]="'query-conditions' | translate"
                  [selected]="true">
    <form [formGroup]="queryForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="傳票種類"
                      [showClear]="false"
                      controlName="ENTRY_TYPE"
                      [options]="service.getEntryTypes()"
                      optionLabel="Name"
                      optionValue="No"
                      [control]="qf().ENTRY_TYPE"
                      [submitted]="submitted"></app-dropdown>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear"
                    [form]="queryForm"></app-button>
        <app-button btnType="submit"
                    [loading]="loading"></app-button>
      </div>
    </form>
  </p-accordionTab>
</p-accordion>


<div class="card">
  <app-table tableKey="tableKey"
             [dataKey]="'id'"
             [data]="service.TLS21020Data()"
             [columns]="columns"
             (edit)="onEdit($event)"
             (detail)="onDetail($event)"
             (rowEditInit)="onRowEditInit($event)"
             (rowEditSave)="onRowEditSave($event)"
             (rowEditCancel)="onRowEditCancel($event)"
             (fieldChange)="onFieldChange($event)"
             [columnGroup]="tableGroup"
             [showCheckBox]="true"
             [showInsert]="true"
             [showDelete]="true"
             [showRowEdit]="true"
             [rowEditCanSave]="rowEditValidSignal()"
             [totalRecords]="service.totalRecords()"
             (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit()"
             [lazy]="true"
             [loading]="loading">
  </app-table>
</div>
