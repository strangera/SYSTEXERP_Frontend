<div class="flex gap-2 mb-2">
  <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
</div>
<p-accordion>
  <p-accordionTab [header]="'query-conditions' | translate" [selected]="true">
    <form [formGroup]="queryForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="傳票種類" [showClear]="false" controlName="ENTRY_TYPE"
          [options]="service.entryTypeOptions()" optionLabel="label" optionValue="value" [control]="qf().ENTRY_TYPE"
          [submitted]="submitted">
        </app-dropdown>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="queryForm"></app-button>
        <app-button btnType="submit" [label]="'存檔'" [disabled]="!qf().ENTRY_TYPE.value || !tableData().length"
          [loading]="loading"></app-button>
      </div>
    </form>
  </p-accordionTab>
</p-accordion>


<div class="card">
  <app-table-edit #dt class="col-12" tableKey="TLS21020Detail" [columns]="columns()" [data]="tableData()"
    (dataChange)="tableData.set($event)" [selectedItems]="selectedItems()" (selectionChange)="selectedItems.set($event)"
    [rowValidate]="validateRow" [tableRequired]="true" [showReorder]="false" [showCheckBox]="false" [showDelete]="false"
    [canInsert]="false" [loading]="tableLoading()" [defaultInsertData]="defaultInsertData"></app-table-edit>
</div>
