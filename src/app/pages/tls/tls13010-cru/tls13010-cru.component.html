<div class="card">
  <!-- 固定操作按鈕 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <app-button
      btnType="next"
      label="下一步(代扣款)"
      (click)="onSubmitNext()"
    ></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <!-- 表單內容 -->
  <p-accordion [multiple]="true">
    <!-- 基本資訊 -->
    <p-accordionTab
      header="基本資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃名稱"
              controlName="brandName"
              [control]="dataForm.controls.brandName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃招募編號"
              controlName="recruitmentCode"
              [control]="dataForm.controls.recruitmentCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="counterNumber"
              [control]="dataForm.controls.counterNumber"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類"
              controlName="industryType"
              [options]="businessTypeCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.industryType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="廠商統一編號"
              controlName="vendorCode"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱"
              controlName="vendorName"
              [control]="dataForm.controls.vendorName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="營業型態"
              controlName="businessType"
              [options]="businessTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.businessType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 櫃位地點資訊 -->
    <p-accordionTab
      header="櫃位地點資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <div class="col-12">
        <app-table
          [data]="filteredData"
          [columns]="columns"
          [showCheckBox]="true"
          dataKey="locationCode"
          [loading]="loading"
          [showDetail]="false"
          [showRowEdit]="true"
          [showInsert]="true"
          [showEdit]="false"
        >
          <ng-template pTemplate="caption">
            <div class="flex justify-content-end">
              <app-button
                btnType="create"
                label="依營業坪數計算業績分攤"
                icon=""
                (onClick)="calculatePerformanceShare()"
              ></app-button>
            </div>
          </ng-template>
        </app-table>
      </div>
    </p-accordionTab>

    <!-- 合約資訊 -->
    <p-accordionTab
      header="合約資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約起始日"
              controlName="contractStartDate"
              [control]="dataForm.controls.contractStartDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約截止日"
              controlName="contractEndDate"
              [control]="dataForm.controls.contractEndDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="洽談日期"
              controlName="discussDate"
              [control]="dataForm.controls.discussDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函日期"
              controlName="callbackDate"
              [control]="dataForm.controls.callbackDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函截止日"
              controlName="callbackEndDate"
              [control]="dataForm.controls.callbackEndDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="洽談者"
              controlName="discussPerson"
              [options]="UserCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.discussPerson"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 營運資訊 -->
    <p-accordionTab
      header="營運資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代號"
              controlName="organizationCode"
              [options]="OrganizationNumberOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.organizationCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類"
              controlName="productCategory"
              [options]="productCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.productCategory"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類"
              controlName="subCategory"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.subCategory"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="營運起始日"
              controlName="startBusinessStartDate"
              [control]="dataForm.controls.startBusinessStartDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="營運截止日"
              controlName="startBusinessEndDate"
              [control]="dataForm.controls.startBusinessEndDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 財務資訊 -->
    <p-accordionTab
      header="財務資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="抽成別"
              controlName="commissionType"
              [options]="commissionTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.commissionType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="抽成額計算方式"
              controlName="commissionCalculation"
              [options]="commissionCalculationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.commissionCalculation"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為抽成"
              controlName="isCommission"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.isCommission"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="預收租金"
              controlName="advanceRent"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.advanceRent"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="預收租金期數"
              controlName="advanceRentPeriods"
              [control]="dataForm.controls.advanceRentPeriods"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="固定租金"
              controlName="fixedRent"
              [control]="dataForm.controls.fixedRent"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="押金"
              controlName="deposit"
              [control]="dataForm.controls.deposit"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="年目標營業額(業主)"
              controlName="annualOwnerTarget"
              [control]="dataForm.controls.annualOwnerTarget"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="年預估營業額(廠商)"
              controlName="annualVendorEstimate"
              [control]="dataForm.controls.annualVendorEstimate"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="保證金付款方式"
              controlName="depositPaymentMethod"
              [options]="depositPaymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.depositPaymentMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="履約保證金"
              controlName="performanceBond"
              [control]="dataForm.controls.performanceBond"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="裝潢方式"
              controlName="decorationStyle"
              [options]="decorationStyleOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.decorationStyle"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="施工保證金付款方式"
              controlName="constructionDepositPaymentMethod"
              [options]="constructionDepositPaymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.constructionDepositPaymentMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="施工保證金"
              controlName="constructionBond"
              [control]="dataForm.controls.constructionBond"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="付款期限(天數)"
              controlName="paymentDaysAfterCheckout"
              [control]="dataForm.controls.paymentDaysAfterCheckout"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 業務資訊 -->
    <p-accordionTab
      header="業務資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="櫃別"
              controlName="counterCategory"
              [options]="counterCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.counterCategory"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否使用業主商店代號"
              controlName="useOwnerStoreCode"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.useOwnerStoreCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="包底類別"
              controlName="packageCategory"
              [options]="packageCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.packageCategory"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="超出部份處理方式"
              controlName="excessHandlingMethod"
              [options]="excessHandlingMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.excessHandlingMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否開立業主發票"
              controlName="issueOwnerInvoice"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.issueOwnerInvoice"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否使用業主收銀機"
              controlName="useOwnerCashRegister"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.useOwnerCashRegister"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為業主收現"
              controlName="isOwnerCashCollection"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.isOwnerCashCollection"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="結帳方式"
              controlName="checkoutMethod"
              [options]="checkoutMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.checkoutMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="配合方式"
              controlName="cooperationMethod"
              [options]="cooperationMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.cooperationMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="對帳方式"
              controlName="reconciliationMethod"
              [options]="reconciliationMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.reconciliationMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="付款方式"
              controlName="paymentMethod"
              [options]="paymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.paymentMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否配合聯名卡"
              controlName="isCooperationWithCard"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.isCooperationWithCard"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯名卡折數"
              controlName="cardDiscount"
              [control]="dataForm.controls.cardDiscount"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="請款單據別"
              controlName="invoiceDocumentType"
              [options]="invoiceDocumentTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.invoiceDocumentType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="是否抄錶"
              controlName="meterReading"
              [options]="options1"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.meterReading"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="有無保證票"
              controlName="guaranteeNote"
              [options]="options2"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.guaranteeNote"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="保證金備註"
              controlName="depositRemarks"
              [control]="dataForm.controls.depositRemarks"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 參加活動資訊 -->
    <p-accordionTab
      header="參加活動資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="全館消費滿額集點活動"
              formControlName="activity1"
              [binary]="true"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="滿仟送佰"
              formControlName="activity2"
              [binary]="true"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="有價券"
              formControlName="activity3"
              [binary]="true"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="會員卡"
              formControlName="activity4"
              [binary]="true"
            ></p-checkbox>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 聯絡資訊 -->
    <p-accordionTab
      header="聯絡資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="電子信箱"
              controlName="email"
              [control]="dataForm.controls.email"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="發票電子郵件"
              controlName="invoiceEmail"
              [control]="dataForm.controls.invoiceEmail"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="票據抬頭"
              controlName="billTitle"
              [control]="dataForm.controls.billTitle"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃電話號碼"
              controlName="counterPhone"
              [control]="dataForm.controls.counterPhone"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商匯款銀行代號"
              controlName="bankCode"
              [options]="bankCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.bankCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商帳戶名稱"
              controlName="vendorAccountName"
              [control]="dataForm.controls.vendorAccountName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
