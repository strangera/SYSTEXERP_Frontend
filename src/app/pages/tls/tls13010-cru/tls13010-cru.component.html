<div class="card">
  <!-- 固定操作按鈕 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <app-button
      btnType="next"
      label="下一步(代扣款)"
      (click)="onSubmitNext()"
    ></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <!-- 表單內容 -->
  <p-accordion [multiple]="true">
    <!-- 基本資訊 -->
    <p-accordionTab
      header="基本資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃名稱"
              controlName="tlt_name"
              [control]="dataForm.controls.tlt_name"
              [submitted]="submitted"
              [disabled]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃招募編號"
              controlName="apply_no"
              [control]="dataForm.controls.apply_no"
              [submitted]="submitted"
              [disabled]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="tlt_no"
              [control]="dataForm.controls.tlt_no"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱"
              controlName="VEN_Name"
              [control]="dataForm.controls.VEN_Name"
              [submitted]="submitted"
              [disabled]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商統一編號"
              controlName="ven_uniform"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.ven_uniform"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="營業型態"
              controlName="paper_type"
              [options]="businessTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.paper_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 櫃位地點資訊 -->
    <p-accordionTab
      header="櫃位地點資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <div class="col-12">
        <app-table
          [data]="filteredData"
          [columns]="columns"
          [showCheckBox]="false"
          dataKey="locationCode"
          [loading]="loading"
          [showDetail]="false"
          [showRowEdit]="true"
          [showInsert]="true"
          [showEdit]="false"
          [showReportMode]="false"
          [showFooter]="false"
          [showPaginator]="false"
        >
          <ng-template pTemplate="caption">
            <div class="flex justify-content-end">
              <app-button
                btnType="create"
                label="依營業坪數計算業績分攤"
                icon=""
                (onClick)="calculatePerformanceShare()"
              ></app-button>
            </div>
          </ng-template>
        </app-table>
      </div>
    </p-accordionTab>

    <!-- 合約資訊 -->
    <p-accordionTab
      header="合約資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="dataForm"
        id="dataForm"
        (ngSubmit)="onSubmit(dataForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約起始日"
              controlName="tlt_bdate"
              [control]="dataForm.controls.tlt_bdate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約截止日"
              controlName="tlt_edate"
              [control]="dataForm.controls.tlt_edate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="洽談日期"
              controlName="contact_Date"
              [control]="dataForm.controls.contact_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函日期"
              controlName="feedback_date"
              [control]="dataForm.controls.feedback_date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函截止日"
              controlName="due_date"
              [control]="dataForm.controls.due_date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="洽談者"
              controlName="contact_USR_Name"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.contact_USR_Name"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 營運資訊 -->
    <p-accordionTab
      header="營運資訊"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"

      <form
        [formGroup]="dataForm"

              label="大分類"

              optionValue="value"

          <div class="col-12 md:col-6 lg:col-4">

          <div class="col-12 md:col-6 lg:col-4">

          <div class="col-12 md:col-6 lg:col-4">

          </div>
          <div class="col-12 md:col-6 lg:col-4">

          <div class="col-12 md:col-6 lg:col-4">

          <div class="col-12 md:col-6 lg:col-4">

    <!-- 聯絡資訊 -->
