<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="銷售日期" [startControl]="queryForm.controls.saleDateStart"
              [endControl]="queryForm.controls.saleDateEnd" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="修正日期"
              [startControl]="queryForm.controls.correctionDateStart"
              [endControl]="queryForm.controls.correctionDateEnd" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機號" controlName="cashierCode" [control]="queryForm.controls.cashierCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="報表型態" controlName="reportType" [options]="reportTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.reportType" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS24010" dataKey="BNK_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)"></app-table>
</div>
