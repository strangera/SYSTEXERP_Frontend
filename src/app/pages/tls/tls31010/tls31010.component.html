<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="日期"
              controlName="TXN_Date"
              [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_NO"
              [options]="tlt_noListOption | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TLT_NO"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="館別"
              controlName="tlt_building"
              [options]="tlt_building_Option | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              controlName="tlt_floor"
              [options]="tlt_floor_Option | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="區域"
              controlName="area_no"
              [options]="area_no_Option | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.area_no"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <app-category-select formControlName="category"></app-category-select>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="櫃別"
              controlName="tlt_kind"
              [options]="tlt_kind_Option"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_kind"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="抽成別"
              controlName="tlt_term_type"
              [options]="tlt_term_type"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_term_type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織"
              controlName="org_id"
              [options]="org_id_Option | async"
              optionLabel="label"
              optionValue="No"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="銷售金額是否含稅"
              controlName="TaxType"
              [options]="[
                { label: '含稅', value: '0' },
                { label: '未稅', value: '1' },
              ]"
              [control]="queryForm.controls.TaxType"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn
              label="是否開立業主發票"
              controlName="IsRece_Yn"
              [control]="queryForm.controls.IsRece_Yn"
              [submitted]="submitted"
              [showAll]="true"
            ></app-radiobutton-yn>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div class="flex flex-wrap gap-3 p-2">
              <label for="displayStatus">顯示狀態</label>
              <p-checkbox
                label="預售"
                [binary]="true"
                formControlName="PreSale"
              ></p-checkbox>
              <p-checkbox
                label="消費人數"
                [binary]="true"
                formControlName="ConsumerNum"
              ></p-checkbox>
            </div>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
  <p class="text-sm text-500 mt-2 mb-0">{{ autoRefreshHintText }}</p>
</div>
<div class="card">
  <app-table-report
    [exportContext]="{ apiUrl: 'queryTLS31010' }"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [columnGroup]="columnGroup"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [footerData]="footerData"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls31010Service.queryTLS31010.bind(tls31010Service)"
    [ItemSize]="24.44"
    [hideSignature]="true"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產出即時業績查詢報表"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onReport()"
          [disabled]="data.length === 0 || !hasPermission(Actions.Print)"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
