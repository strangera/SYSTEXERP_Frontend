<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div *ngIf="isFormCreateable" class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="大分類" controlName="bus_type" [control]="dataForm.controls.bus_type"
            [options]="busTypeOptions" optionLabel="Name" optionValue="No" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <!-- <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="dataForm"></app-button>
          <app-button btnType="query" label="查詢" [loading]="loading" (click)="onQuery()"></app-button>
        </div> -->
      <!--  動態 table-edit -->
      <app-table-edit class="col-12" tableKey="TLS2J020Detail" [columns]="columns" [data]="data" [showDelete]="false"
        (dataChange)="data = $event" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
        [disabled]="isFormReadable" [showExcel]="false" [canInsert]="false" [disabled]="isFormReadable"
        [tableRequired]="true" [validateOnlySelected]="false">
      </app-table-edit>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onCancelDetail()" />
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>

    </form>
  </p-panel>
</div>
