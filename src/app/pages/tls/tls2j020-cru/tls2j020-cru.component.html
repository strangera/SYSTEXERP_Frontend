<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <!-- 只有新增顯示下拉 -->
        <div class="col-12 md:col-6 lg:col-4" *ngIf="mode === 'Create'">
          <app-dropdown label="大分類"
            controlName="bus_type"
            [control]="dataForm.controls.bus_type"
            [options]="busTypeOptions"
            optionLabel="Name"
            optionValue="No"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <!--  動態 table-edit -->
        <app-table-edit
          class="col-12"
          tableKey="TLS2J020Detail"
          [columns]="columns"
          [data]="data"
          (dataChange)="data = $event"
          [selectedItems]="selectedItems"
          (selectionChange)="selectedItems = $event"
          [disabled]="isFormReadable"
          [showExcel]="false">
        </app-table-edit>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
