<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <app-button btnType="create" label="下一步(抽成設定)" (click)="onSubmitNext()"
      [disabled]="getTotalSelectedCount() === 0"></app-button>
    <app-button btnType="back" (click)="onClearAndExit()"></app-button>
  </div>

  <!-- 載入中指示器 -->
  <div *ngIf="loading" class="flex justify-content-center align-items-center p-4">
    <p-progressSpinner></p-progressSpinner>
    <span class="ml-2">載入扣款資料中...</span>
  </div>

  <!-- 主要內容 -->
  <div *ngIf="!loading">
    <!-- 全域控制按鈕 -->
    <div class="flex gap-2 mb-3 p-3 bg-blue-50 border-round">
      <div class="flex align-items-center gap-2">
        <app-button [label]="getCommonModeText()" icon="pi pi-filter" (click)="toggleCommonMode()"
          [outlined]="showMode !== 'common'"></app-button>

        <app-button [label]="getSelectedModeText()" icon="pi pi-check-square" (click)="toggleSelectedMode()"
          [outlined]="!showOnlySelected"></app-button>

        <span class="text-sm text-gray-600 ml-2">
          目前模式: {{ getCurrentDisplayMode() }}
        </span>
      </div>
    </div>

    <!-- Scroll Container Wrapper -->
    <div class="scroll-container">
      <!-- 合約基本資訊顯示 - 使用 expandable-edit-table -->
      <p-accordion *ngIf="currentContractData">
        <p-accordionTab header="專櫃契約書資訊" [selected]="true" class="line-height-3 m-0">
          <div class="col-12">
            <app-expandable-edit-table class="custom-table-red" [data]="contractInfoData"
              [mainColumns]="contractInfoColumns" [showCheckBox]="false" [showPaginator]="false" [showAddButton]="false"
              [showBatchDelete]="false" [loading]="loading" [dataKey]="'id'" [readonly]="true" [detailKey]="''"
              [emptyMessage]="'沒有合約資訊'"></app-expandable-edit-table>
          </div>
        </p-accordionTab>
      </p-accordion>

      <!-- 無資料顯示 -->
      <div *ngIf="!hasAnyData()" class="text-center p-5">
        <i class="pi pi-info-circle text-4xl text-gray-400 mb-3"></i>
        <h5 class="text-gray-600 mb-2">沒有找到扣款資料</h5>
        <p class="text-gray-500 mb-3">
          目前合約（{{ currentTalentId }}）沒有設定任何扣款項目
        </p>
        <app-button label="重新載入資料" icon="pi pi-refresh" (click)="reloadData()"></app-button>
      </div>

      <!-- 動態生成各類型扣款表格 -->
      <div *ngFor="let capType of capTypes" [hidden]="!hasDataForType(capType)">
        <p-accordion>
          <p-accordionTab [header]="getCapTypeName(capType)" [selected]="true">
            <!-- 特殊說明（針對特定類型） -->
            <div *ngIf="capType === 'D' || capType === 'E'" class="mb-3 p-2 bg-yellow-50 border-round">
              <span class="text-yellow-800">
                <i class="pi pi-info-circle mr-2"></i>
                {{
                capType === "D" ? "比率分攤" : "活動扣款"
                }}(比率或元欄位如輸入比率請輸入1以下數字，如2%請輸入0.02!!)
              </span>
            </div>

            <!-- 無資料顯示 -->
            <div *ngIf="!hasDataForType(capType)" class="text-center p-4 bg-gray-50 border-round">
              <i class="pi pi-inbox text-3xl text-gray-400 mb-2"></i>
              <p class="text-gray-500 m-0">
                目前沒有 {{ getCapTypeName(capType) }} 項目
                <span *ngIf="showMode === 'common' && !showOnlySelected">
                  （僅顯示契約項目 + 常用項目）
                </span>
                <span *ngIf="showMode === 'all' && !showOnlySelected">
                  （顯示全部項目）
                </span>
                <span *ngIf="showOnlySelected">（僅顯示已勾選項目）</span>
              </p>
            </div>

            <!-- 使用 expandable-edit-table 組件 -->
            <div *ngIf="hasDataForType(capType)" class="col-12">
              <app-expandable-edit-table [data]="fareData[capType]" [mainColumns]="getColumnsForType(capType)"
                [showCheckBox]="false" [showPaginator]="false" [showAddButton]="false" [showBatchDelete]="false"
                [loading]="loading" [dataKey]="'id'" [readonly]="isViewMode" [detailKey]="''"
                [emptyMessage]="'尚未設定' + getCapTypeName(capType) + '項目'" (save)="onFareTableSave($event, capType)"
                (edit)="onFareTableEdit($event, capType)"
                (cancel)="onFareTableCancel($event, capType)"></app-expandable-edit-table>
            </div>

            <!-- 底部操作按鈕 -->
            <div *ngIf="hasDataForType(capType)"
              class="flex justify-content-between align-items-center mt-3 pt-3 border-top-1 border-gray-200">
              <div class="flex align-items-center gap-2">
                <span class="text-sm text-gray-600">
                  目前顯示模式:
                  <span class="font-semibold">
                    {{ getCurrentDisplayMode() }}
                  </span>
                </span>
              </div>

              <div class="flex gap-2">
                <app-button label="全部選擇" icon="pi pi-check-square" styleClass="green-button"
                  (click)="selectAllByType(capType)">
                </app-button>

                <app-button label="取消選擇" icon="pi pi-times" styleClass="red-button" [outlined]="true"
                  (click)="deselectAllByType(capType)">
                </app-button>
              </div>
            </div>
          </p-accordionTab>
        </p-accordion>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
        <app-button btnType="create" label="下一步(抽成設定)" (click)="onSubmitNext()"
          [disabled]="getTotalSelectedCount() === 0"></app-button>
        <app-button btnType="back" (click)="onClearAndExit()"></app-button>
      </div>
    </div>
  </div>
</div>
