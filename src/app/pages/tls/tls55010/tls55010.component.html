<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onQuery(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="結帳日期" controlName="TXN_Date" [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"></app-calendar>
          </div>
        </div>
        <div class="my-3">
          <p>最近關帳日期：{{cls_date}}</p>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" label="日節前檢查" [loading]="loading"></app-button>
          <app-button type="button" label="確定日結" (clickEvent)="onSubmit(queryForm)"
            [loading]="insertLoading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class=" card">
  <app-table dataKey="master_key" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showDelete]="false" [expansionColumns]="expansionColumns" expansionDataKey="details" [showPaginator]="false"
    [showManage]="false" [showCaption]="false" [showSort]="false"></app-table>
</div>
