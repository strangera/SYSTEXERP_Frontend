<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 存貨年月 - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="存貨年月" [startControl]="queryForm.controls.DateFrom"
              [endControl]="queryForm.controls.DateTo" [submitted]="submitted"></app-calendar-range-quick>
          </div>

          <!-- 倉別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" [control]="queryForm.controls.HOS_NO" controlName="HOS_NO" [submitted]="submitted"
              [options]="HOS_NOOptions | async" [optionLabel]="'label'" [optionValue]="'value'"></app-dropdown>
          </div>

          <!-- 品牌 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌" [control]="queryForm.controls.LOGO_No" [submitted]="submitted"
              [options]="LOGO_NoOptions | async" [optionLabel]="'label'" [optionValue]="'value'"></app-dropdown>
          </div>
          <!-- 管理編號 -->
          <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.PLU_MagNo"
            templateLabel="label" [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo"
            [suggestions]="suggestions" [fieldsConfig]="fieldsConfig" [showOverlay]="false"
            (inputValueChanged)="onAutoCompleteInputChange($event)">
          </app-dropdown-table>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="國際條碼" controlName="PLU_No" [control]="queryForm.controls.PLU_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="商品名稱" controlName="PLU_Name" [control]="queryForm.controls.PLU_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 顯示方式 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="顯示方式" controlName="ShowType" [options]="ModeOptions"
            optionLabel="label" optionValue="value" [filter]="false" [control]="queryForm.controls.ShowType"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report [data]="data" [columns]="columns" [columnGroup]="columnGroup" [showDelete]="false"
    [totalRecords]="totalRecords" [loading]="loading" [showManage]="false" [showReportMode]="false"
    [lastQueryBody]="lastQueryBody" [queryFunction]="tls57190Service.queryTLS57190.bind(tls57190Service)"
    [footerData]="footerData">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="每日商品進銷存報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0 || !hasPermission(Actions.Print)"></p-button>
        <p-button styleClass="p-2" label="每日商品進銷存報表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0 || !hasPermission(Actions.ExportExcel)"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
