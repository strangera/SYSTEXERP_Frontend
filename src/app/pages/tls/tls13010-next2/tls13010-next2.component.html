<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <app-button btnType="create" label="下一步(XX設定)"></app-button>
    <app-button btnType="cancel" (click)="onCancel()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="專櫃契約書資訊" [selected]="true" class="line-height-3 m-0">
      <div class="col-12 custom-table-red">
        <app-table tableKey="stocks" [lazy]="true" [loading]="loading" [showEdit]="false" [showDetail]="false"
          [showRowEdit]="false" [data]="inventoryItems" [columns]="stocksColumns" [showManage]="false">
        </app-table>
      </div>
    </p-accordionTab>
  </p-accordion>

  <!-- 顶部选项卡 -->
  <div class="setting-tabs mt-3">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link" [ngClass]="{'active': selectedSettingTab === 'discount'}"
          (click)="changeSettingTab('discount')">折扣設定</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [ngClass]="{'active': selectedSettingTab === 'annual'}"
          (click)="changeSettingTab('annual')">年度總業績抽成設定</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [ngClass]="{'active': selectedSettingTab === 'level'}"
          (click)="changeSettingTab('level')">折扣別層級抽成設定</a>
      </li>
    </ul>
  </div>

  <!-- 根据选项卡切换内容 -->
  <div class="setting-content mt-2">
    <!-- 折扣設定 -->
    <div *ngIf="selectedSettingTab === 'discount'">
      <p-accordion>
        <p-accordionTab header="抽成設定" [selected]="true" class="line-height-3 m-0">
          <app-expandable-edit-table [data]="commissionItems" [mainColumns]="commissionColumns"
            [detailKey]="'detailItems'" [dataKey]="'id'" [showCheckBox]="false" [readonly]="false"
            (edit)="onItemEdit($event)" (save)="onItemSave($event)" (cancel)="onItemCancel($event)">

            <!-- 展开部分的自定义折扣设定内容 -->
            <ng-template #expandedContent let-rowData>
              <div class="p-3">
                <h3>折扣設定</h3>
                <table class="table">
                  <thead>
                    <tr>
                      <th>選擇</th>
                      <th>折扣別</th>
                      <th>合約起始日</th>
                      <th>合約終止日</th>
                      <th>抽成率 (%)</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of rowData.discountSettingItems; let j = index">
                      <td><p-checkbox [(ngModel)]="item.selected"></p-checkbox></td>
                      <td>
                        <p-dropdown [options]="discounts" [(ngModel)]="item.discountType" optionLabel="label"
                          optionValue="value" [placeholder]="'選擇折扣別'">
                        </p-dropdown>
                      </td>
                      <td><p-calendar [(ngModel)]="item.startDate"></p-calendar></td>
                      <td><p-calendar [(ngModel)]="item.endDate"></p-calendar></td>
                      <td><p-inputNumber [(ngModel)]="item.rate"></p-inputNumber></td>
                      <td>
                        <button pButton pRipple type="button" icon="pi pi-trash"
                          class="p-button-rounded p-button-danger p-button-text"
                          (click)="removeDiscountSettingItem(rowData, j)"></button>
                      </td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="6">
                        <button pButton pRipple type="button" label="新增項目" icon="pi pi-plus" class="p-button-text"
                          (click)="addDiscountSettingItem(rowData)"></button>
                      </td>
                    </tr>
                  </tfoot>
                </table>

                <div class="button-group mt-3">
                  <button pButton pRipple type="button" label="確定" icon="pi pi-check" class="p-button-success mr-2"
                    (click)="onDetailSave(rowData, 'discount')"></button>
                  <button pButton pRipple type="button" label="取消" icon="pi pi-times" class="p-button-danger mr-2"
                    (click)="onDetailCancel(rowData)"></button>
                  <button pButton pRipple type="button" label="清除內容" icon="pi pi-trash" class="p-button-secondary"
                    (click)="onDetailClear(rowData, 'discount')"></button>
                </div>
              </div>
            </ng-template>
          </app-expandable-edit-table>
        </p-accordionTab>
      </p-accordion>
    </div>

    <!-- 年度總業績抽成設定 -->
    <div *ngIf="selectedSettingTab === 'annual'">
      <p-accordion>
        <p-accordionTab header="抽成設定" [selected]="true" class="line-height-3 m-0">
          <app-expandable-edit-table [data]="commissionItems" [mainColumns]="commissionColumns"
            [detailKey]="'detailItems'" [dataKey]="'id'" [showCheckBox]="false" [readonly]="false"
            (edit)="onItemEdit($event)" (save)="onItemSave($event)" (cancel)="onItemCancel($event)">

            <!-- 展开部分的自定义年度业绩设定内容 -->
            <ng-template #expandedContent let-rowData>
              <div class="p-3">
                <h3>年度總業績抽成設定</h3>
                <table class="table">
                  <thead>
                    <tr>
                      <th>選擇</th>
                      <th>帳務起</th>
                      <th>帳務迄</th>
                      <th>業績超過金額含</th>
                      <th>抽成率</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of rowData.annualPerformanceItems; let j = index">
                      <td><p-checkbox [(ngModel)]="item.selected"></p-checkbox></td>
                      <td><p-calendar [(ngModel)]="item.startDate"></p-calendar></td>
                      <td><p-calendar [(ngModel)]="item.endDate"></p-calendar></td>
                      <td><p-inputNumber [(ngModel)]="item.discountAmount"></p-inputNumber></td>
                      <td><p-inputNumber [(ngModel)]="item.rate"></p-inputNumber></td>
                      <td>
                        <button pButton pRipple type="button" icon="pi pi-trash"
                          class="p-button-rounded p-button-danger p-button-text"
                          (click)="removeAnnualPerformanceItem(rowData, j)"></button>
                      </td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="6">
                        <button pButton pRipple type="button" label="新增項目" icon="pi pi-plus" class="p-button-text"
                          (click)="addAnnualPerformanceItem(rowData)"></button>
                      </td>
                    </tr>
                  </tfoot>
                </table>

                <div class="button-group mt-3">
                  <button pButton pRipple type="button" label="確定" icon="pi pi-check" class="p-button-success mr-2"
                    (click)="onDetailSave(rowData, 'annual')"></button>
                  <button pButton pRipple type="button" label="取消" icon="pi pi-times" class="p-button-danger mr-2"
                    (click)="onDetailCancel(rowData)"></button>
                  <button pButton pRipple type="button" label="清除內容" icon="pi pi-trash" class="p-button-secondary"
                    (click)="onDetailClear(rowData, 'annual')"></button>
                </div>
              </div>
            </ng-template>
          </app-expandable-edit-table>
        </p-accordionTab>
      </p-accordion>
    </div>

    <!-- 折扣別層級抽成設定 -->
    <div *ngIf="selectedSettingTab === 'level'">
      <p-accordion>
        <p-accordionTab header="抽成設定" [selected]="true" class="line-height-3 m-0">
          <app-expandable-edit-table [data]="commissionItems" [mainColumns]="commissionColumns"
            [detailKey]="'detailItems'" [dataKey]="'id'" [showCheckBox]="false" [readonly]="false"
            (edit)="onItemEdit($event)" (save)="onItemSave($event)" (cancel)="onItemCancel($event)">

            <!-- 展开部分的自定义折扣层级设定内容 -->
            <ng-template #expandedContent let-rowData>
              <div class="p-3">
                <h3>折扣別層級抽成設定</h3>
                <table class="table">
                  <thead>
                    <tr>
                      <th>選擇</th>
                      <th>折扣別</th>
                      <th>業績計算金額(起)</th>
                      <th>業績計算金額(迄)</th>
                      <th>抽成率</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of rowData.discountLevelItems; let j = index">
                      <td><p-checkbox [(ngModel)]="item.selected"></p-checkbox></td>
                      <td>
                        <p-dropdown [options]="discounts" [(ngModel)]="item.discountType" optionLabel="label"
                          optionValue="value" [placeholder]="'選擇折扣別'">
                        </p-dropdown>
                      </td>
                      <td><p-inputNumber [(ngModel)]="item.startAmount"></p-inputNumber></td>
                      <td><p-inputNumber [(ngModel)]="item.endAmount"></p-inputNumber></td>
                      <td><p-inputNumber [(ngModel)]="item.rate"></p-inputNumber></td>
                      <td>
                        <button pButton pRipple type="button" icon="pi pi-trash"
                          class="p-button-rounded p-button-danger p-button-text"
                          (click)="removeDiscountLevelItem(rowData, j)"></button>
                      </td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="6">
                        <button pButton pRipple type="button" label="新增項目" icon="pi pi-plus" class="p-button-text"
                          (click)="addDiscountLevelItem(rowData)"></button>
                      </td>
                    </tr>
                  </tfoot>
                </table>

                <div class="button-group mt-3">
                  <button pButton pRipple type="button" label="確定" icon="pi pi-check" class="p-button-success mr-2"
                    (click)="onDetailSave(rowData, 'level')"></button>
                  <button pButton pRipple type="button" label="取消" icon="pi pi-times" class="p-button-danger mr-2"
                    (click)="onDetailCancel(rowData)"></button>
                  <button pButton pRipple type="button" label="清除內容" icon="pi pi-trash" class="p-button-secondary"
                    (click)="onDetailClear(rowData, 'level')"></button>
                </div>
              </div>
            </ng-template>
          </app-expandable-edit-table>
        </p-accordionTab>
      </p-accordion>
    </div>
  </div>

  <div class="pt-3">
    <app-button-dynamicallyadd (click)="onAddCommissionItem()"></app-button-dynamicallyadd>
  </div>
</div>
