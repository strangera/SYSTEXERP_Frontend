<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="合約編號" controlName="contract_no" [control]="queryForm.controls.contract_no"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼/名稱" controlName="bus_typeList" [options]="businessTypeCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.bus_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="tlt_no" [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="櫃位名稱" controlName="tlt_name" [control]="queryForm.controls.tlt_name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="廠商統一編號/名稱" controlName="ven_uniform_List" [options]="vendorOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.ven_uniform_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="位置" controlName="locationList" [options]="locationOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.locationList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="版本編號"
              [startControl]="queryForm.controls.contract_subno_Start"
              [endControl]="queryForm.controls.contract_subno_End" [submitted]="submitted"></app-input-number-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="合約狀態" controlName="approve_status_List" [options]="contractStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.approve_status_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="area_no_List" [options]="regionOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.area_no_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floor_List" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_floor_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="洽談者編號/名稱" controlName="contact_USR_No_List" [options]="negotiatorOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.contact_USR_No_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織編號/名稱" controlName="org_id_List" [options]="organizationOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.org_id_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" controlName="tlt_openflag_List" [options]="operationStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_openflag_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成額計算方式" controlName="comm_comp_type_List" [options]="commissionCalculationOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.comm_comp_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="回函日期"
              [startControl]="queryForm.controls.feedback_date_Start"
              [endControl]="queryForm.controls.feedback_date_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="回函截止日"
              [startControl]="queryForm.controls.due_date_Start" [endControl]="queryForm.controls.due_date_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="洽談日期"
              [startControl]="queryForm.controls.contact_Date_Start" [endControl]="queryForm.controls.contact_Date_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營業型態" controlName="paper_type_List" [options]="businessTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.paper_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約起始日"
              [startControl]="queryForm.controls.tlt_bdate_Start" [endControl]="queryForm.controls.tlt_bdate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約截止日"
              [startControl]="queryForm.controls.tlt_edate_Start" [endControl]="queryForm.controls.tlt_edate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運起始日"
              [startControl]="queryForm.controls.tlt_contract_bdate_Start"
              [endControl]="queryForm.controls.tlt_contract_bdate_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運截止日"
              [startControl]="queryForm.controls.tlt_contract_edate_Start"
              [endControl]="queryForm.controls.tlt_contract_edate_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="tlt_kind_List" [options]="tltKindOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_kind_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="裝潢方式" controlName="deco_type_List" [options]="decorationMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.deco_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="tlt_term_type_List" [options]="commissionTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_term_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="結帳方式" controlName="money_type_List" [options]="moneyTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.money_type_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="付款方式" controlName="paytype_List" [options]="paymentMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.paytype_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="配合方式" controlName="store_way_List" [options]="storeWayMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.store_way_List"
              [submitted]="submitted"></app-multi-select>
          </div>
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否開立業主發票" controlName="rece_yn"
            [control]="queryForm.controls.rece_yn" [submitted]="submitted" [showAll]="true"></app-radiobutton-yn>
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否使用業主收銀機" controlName="pos_yn"
            [control]="queryForm.controls.pos_yn" [submitted]="submitted" [showAll]="true">
          </app-radiobutton-yn>
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否為業主收現" controlName="cash_yn"
            [control]="queryForm.controls.cash_yn" [submitted]="submitted" [showAll]="true">
          </app-radiobutton-yn>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
      <div></div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table tableKey="TLS14020" dataKey="id" [data]="data" [columns]="columns" (detail)="onDetail($event)"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showReportMode]="false"
      [showDetail]="false" [showEdit]="false" [showCheckBox]="false" [showDelete]="false" [addButton]="addButton"
      [multiSortMeta]="[{ field: 'contract_no', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [loading]="loading"></app-table>
    <!-- (detail)="onDetail($event)" (delete)="onDelete($event)" -->
  </div>
</div>
<app-dialog [visible]="dialogVisible_log" header="顯示合約" [showFooter]="false"
  (visibleChange)="dialogVisible_log = $event" height="60%">
  <app-table tableKey="TLS14020DialogTable" dataKey="id" [data]="dialogData" [columns]="dialogColumns"
    [showReportMode]="false" [showDelete]="false" [showManage]="false"
    [multiSortMeta]="[{ field: 'contract_version', order: 0 }]" [totalRecords]="dialogTotalRecords"
    [showCaption]="false" [loading]="dialogLoading" (itemClick)="downloadContractLog($event)"></app-table>
</app-dialog>
<app-dialog [visible]="dialogVisible_print" header="匯出檔案" [showFooter]="false"
  (visibleChange)="dialogVisible_print = $event" height="30%" width="300px" minHeight="250px">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onDialogSubmit(dialogQueryForm)">
    <div class="grid p-fluid">
      <div class="col-12">
        <p-checkbox class="field-checkbox" formControlName="exportContract" [binary]="true" label="契約書" />
      </div>
      <div class="col-12">
        <p-checkbox class="field-checkbox" formControlName="exportRules" [binary]="true" label="進駐廠商營運管理規範" />
      </div>
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="submit" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
