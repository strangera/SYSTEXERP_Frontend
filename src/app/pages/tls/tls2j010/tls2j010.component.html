<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品項名稱" controlName="CHG_ItemName" [control]="queryForm.controls.CHG_ItemName"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report tableKey="TLS2J010" [data]="data" [columns]="columns" [totalRecords]="totalRecords" dataKey="ID"
      [queryFunction]="tls2j010Service.queryTLS2J010.bind(tls2j010Service)" [lastQueryBody]="lastQueryBody"
      [loading]="loading" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"[showDetail]="false"
       (edit)="onEdit($event)" (delete)="onDelete()" [showCheckBox]="true" [showDelete]="true"
      [showReportMode]="false" [showExcel]="false" [isRowSelectable]="isRowSelectable">
    </app-table-report>


  </div>
</div>
