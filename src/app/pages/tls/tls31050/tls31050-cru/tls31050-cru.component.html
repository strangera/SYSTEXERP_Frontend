<p-dialog [visible]="visible" (visibleChange)="visibleChange.emit($event)" [header]="rowData?.tlt_term_desc ?? ''"
  [modal]="true" [maximizable]="true" [style]="{ width: '95vw' }" [contentStyle]="{ overflow: 'auto', padding: '0' }">
  <app-table-report tableKey="tls31050-detail" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [columnGroup]="columnGroup" [totalRecords]="totalRecords" [showDelete]="false" [showEdit]="false"
    [showManage]="false" [loading]="loading" [footerData]="footershowTotal" [queryFunction]="detailQueryFn"
    [exportContext]="{ apiUrl: 'queryTLS31050Detail' }">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="單抽成別之營業報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(false)" [disabled]="data.length === 0"></p-button>
        <p-button styleClass="p-2" label="單抽成別之營業報表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(true)" [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-table-report>
</p-dialog>
