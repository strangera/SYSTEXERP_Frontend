<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 銷售日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="銷售日期" [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd" [submitted]="submitted" />
          </div>

          <!-- 收銀機號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="TLT_NoList" [control]="queryForm.controls.TLT_NoList"
              [submitted]="submitted" [options]="tltNoOptions | async" optionLabel="label" optionValue="value" />
          </div>

          <!-- 顯示條件 -->
          <div class="col-12 lg:col-8">
            <app-radiobutton label="顯示條件" groupname="radioOption" [control]="queryForm.controls.IsLossStatus"
              [submitted]="submitted" [options]="[
                { value: null, label: '全部' },
                { value: '1', label: '有欠落' },
                { value: '2', label: '無欠落' },
              ]"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report tableKey="TLS22030" [data]="data" dataKey="ID" [columns]="columns" [showEdit]="false"
      [showManage]="false" [showDelete]="false" [totalRecords]="totalRecords" [showReportMode]="false"
      [loading]="loading" [lastQueryBody]="historyRequestBody" [ItemSize]="24.34"
      [queryFunction]="tls22030Service.queryTLS22030.bind(tls22030Service)" [lazy]="true">
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button styleClass="p-2" label="序號報表.PDF" icon="pi pi-file" (click)="onExportPDF()"
            [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
          <p-button styleClass="p-2" label="序號報表.Excel" icon="pi pi-file" (click)="onExportExcel()"
            [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
