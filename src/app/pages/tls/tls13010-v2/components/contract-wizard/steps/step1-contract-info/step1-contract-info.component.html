<!-- @format -->

<fieldset style="border: none; padding: 0; margin: 0">
  <p-accordion [multiple]="true">
    <!-- 基本資訊 -->
    <p-accordionTab
      header="基本資訊"
      [selected]="true"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="form">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃招募編號"
              controlName="apply_no"
              [control]="getControl('apply_no')"
              [customPlaceholder]="'系統自動產生'"
              [alwaysShowPlaceholder]="true"
              [readonly]="true"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="tlt_no"
              [control]="getControl('tlt_no')"
              [customPlaceholder]="'系統自動產生'"
              [alwaysShowPlaceholder]="true"
              [readonly]="true"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商統一編號"
              controlName="vendor_ven_no"
              [options]="pos2013Options"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('vendor_ven_no')"
              [readonly]="isFormReadonly"
              (valueChange)="onVendorChange($event)"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商編號"
              controlName="ven_no"
              [control]="getControl('ven_no')"
              [submitted]="submitted"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱"
              controlName="VEN_Name"
              [control]="getControl('VEN_Name')"
              [customPlaceholder]="'選擇廠商統一編號自動帶入'"
              [alwaysShowPlaceholder]="true"
              [submitted]="submitted"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="櫃位名稱"
              controlName="tlt_name"
              [control]="getControl('tlt_name')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="版次"
              controlName="contract_subno"
              [control]="getControl('contract_subno')"
              [submitted]="submitted"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="營運狀況"
              controlName="tlt_openflag"
              [options]="tltopenflagOption"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('tlt_openflag')"
              [submitted]="submitted"
              [readonly]="true"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="審核狀態"
              controlName="approve_status"
              [options]="approveStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('approve_status')"
              [submitted]="submitted"
              [readonly]="true"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 洽談階段資訊 -->
    <p-accordionTab
      header="洽談階段資訊"
      [selected]="true"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="form">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="營業型態"
              controlName="paper_type"
              [options]="dropdownService.paperTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('paper_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="組織代碼"
              controlName="org_id"
              [options]="dropdownService.orgOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('org_id')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類"
              controlName="bus_type"
              [options]="dropdownService.bustypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('bus_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類"
              controlName="bus_class"
              [options]="dropdownService.busClassOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('bus_class')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類"
              controlName="bus_sclass"
              [options]="dropdownService.busSClassOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('bus_sclass')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約起始日"
              controlName="tlt_bdate"
              [control]="getControl('tlt_bdate')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="契約截止日"
              controlName="tlt_edate"
              [control]="getControl('tlt_edate')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="營運起始日"
              controlName="tlt_contract_bdate"
              [control]="getControl('tlt_contract_bdate')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="營運截止日"
              controlName="tlt_contract_edate"
              [control]="getControl('tlt_contract_edate')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函日期"
              controlName="feedback_date"
              [control]="getControl('feedback_date')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="回函截止日"
              controlName="due_date"
              [control]="getControl('due_date')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="洽談日期"
              controlName="contact_Date"
              [control]="getControl('contact_Date')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="洽談者"
              controlName="contact_USR_No"
              [options]="negotiatorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('contact_USR_No')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="建立者"
              controlName="crt_usr_name"
              [control]="getControl('crt_usr_name')"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="建立時間"
              controlName="crt_date"
              [control]="getControl('crt_date')"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="修改者"
              controlName="upd_usr_name"
              [control]="getControl('upd_usr_name')"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="修改時間"
              controlName="upd_date"
              [control]="getControl('upd_date')"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="審核者"
              controlName="app_usr_name"
              [control]="getControl('app_usr_name')"
              [readonly]="true"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="審核時間"
              controlName="app_date"
              [control]="getControl('app_date')"
              [readonly]="true"
            ></app-input-text>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 櫃位地點資訊 -->
    <p-accordionTab
      header="櫃位地點資訊"
      [selected]="true"
      [headerStyleClass]="'query-accordionTab'"
    >
      <app-table-edit #locationTableRef
        class="col-12"
        tableKey="TLS13010Step1Location"
        [columns]="locationEditColumns"
        [data]="displayLocationData"
        (selectionChange)="selectedLocationRows = $event"
        [selectedItems]="selectedLocationRows"
        [showCheckBox]="!isFormReadonly"
        [keepDeletedData]="true"
        [dataStatusField]="'_status'"
        [defaultInsertData]="locationDefaultInsertData"
        [disabled]="crudstatus === CRUDStatus.Read"
        (dataChange)="onLocationDataChange($event)"
      >
        <ng-template #customCell let-rowData="rowData" let-col="col">
          <ng-container *ngIf="col.field === 'location_no'">
            <span *ngIf="crudstatus === CRUDStatus.Read">
              {{ rowData.location_no }}
            </span>
            <button
              *ngIf="crudstatus !== CRUDStatus.Read"
              pButton
              [label]="rowData.location_no || '請選擇...'"
              icon="pi pi-map-marker"
              class="p-button-sm p-button-outlined p-button-secondary w-full text-left"
              (click)="openLocationPicker(rowData)"
            ></button>
          </ng-container>
        </ng-template>
      </app-table-edit>
    </p-accordionTab>

    <!-- 商務條件 -->
    <p-accordionTab
      header="商務條件"
      [selected]="true"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="form">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="櫃別"
              controlName="tlt_kind"
              [options]="tltKindOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('tlt_kind')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="裝潢方式"
              controlName="deco_type"
              [options]="decorationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('deco_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="抽成別"
              controlName="tlt_term_type"
              [options]="tltTermTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('tlt_term_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
            <small
              class="block mt-1 text-orange-600 text-xs"
              *ngIf="hasCommissionTypeChanged()"
            >
              ⚠️ 抽成別已變更，原有設定將在送出時被清除
            </small>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="抽成額計算方式"
              controlName="comm_comp_type"
              [options]="commCompTypeDropdown"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('comm_comp_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否使用業主商店代號"
              controlName="edc_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('edc_yn')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="包底類別"
              controlName="tlt_ctype_mtotal"
              [options]="tltctypemtotalOption"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('tlt_ctype_mtotal')"
              [submitted]="submitted"
              [readonly]="isFormReadonly || isMtotalReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="超出部份處理方式"
              controlName="overall_status"
              [options]="overallStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('overall_status')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="預收租金"
              controlName="rent_ahead"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('rent_ahead')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="預收租金期數"
              controlName="rent_period"
              [control]="getControl('rent_period')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="固定租金"
              controlName="base_rent"
              [control]="getControl('base_rent')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="押金"
              controlName="deposit"
              [control]="getControl('deposit')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否開立業主發票"
              controlName="rece_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('rece_yn')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否使用業主收銀機"
              controlName="pos_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('pos_yn')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為業主收現"
              controlName="cash_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('cash_yn')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為抽成"
              controlName="comm_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('comm_yn')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="結帳方式"
              controlName="money_type"
              [options]="moneyTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('money_type')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="配合方式"
              controlName="store_way"
              [options]="storeWayOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('store_way')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="對帳方式"
              controlName="check_typeList"
              [options]="checkTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('check_typeList')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="付款方式"
              controlName="paytype"
              [options]="paytypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('paytype')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否配合聯名卡"
              controlName="vip_yn"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('vip_yn')"
              [submitted]="submitted"
              [readonly]="true"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="聯名卡折數"
              controlName="credit_card"
              [control]="getControl('credit_card')"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
            <small
              class="block mt-1 text-blue-600 text-base"
              *ngIf="form.get('vip_yn')?.value === 'Y'"
            >
              (95折請輸入0.95)
            </small>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="目標營業額(業主)"
              controlName="total_amt"
              [control]="getControl('total_amt')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="目標營業額單位(業主)"
              controlName="total_amt_unit"
              [options]="total_amt_unitOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('total_amt_unit')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="預估營業額(廠商)"
              controlName="total_amt_vendor"
              [control]="getControl('total_amt_vendor')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="目標營業額單位(廠商)"
              controlName="total_amt_vendor_unit"
              [options]="total_amt_vendor_unit_options"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('total_amt_vendor_unit')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="準時開業保證金"
              controlName="open_fees"
              [control]="getControl('open_fees')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="準時開業保證金付款方式"
              controlName="open_deposit"
              [options]="depositPaymentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('open_deposit')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="施工保證金"
              controlName="construct_fees"
              [control]="getControl('construct_fees')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="施工保證金付款方式"
              controlName="construct_deposit"
              [options]="depositPaymentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="getControl('construct_deposit')"
              [submitted]="submitted"
              [readonly]="isFormReadonly"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="契約屆滿保證金"
              controlName="expiration_fees"

      </form>
    </p-accordionTab>
  </p-accordion>
</fieldset>

<!-- 位置選擇 Dialog -->
<p-dialog
  header="選擇位置"
  [(visible)]="locationPickerVisible"
  [modal]="true"
  [style]="{ width: '90vw', maxWidth: '1300px' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="location-picker-dialog"
>
  <!-- 篩選列 -->
  <div class="flex flex-wrap gap-2 align-items-end mb-3">
    <app-input-text
      label="位置編號"
      controlName="pickerLocationNoFilter"
      [control]="pickerLocationNoFilter"
      style="min-width: 130px"
    ></app-input-text>
    <app-dropdown
      label="館別"
      controlName="pickerBuildingFilter"
      [control]="pickerBuildingFilter"
      [options]="dropdownService.buildingOptions"
      optionLabel="label"
      optionValue="value"
      style="min-width: 130px"
    ></app-dropdown>
    <app-dropdown
      label="樓層"
      controlName="pickerFloorFilter"
      [control]="pickerFloorFilter"
      [options]="dropdownService.floorOptions"
      optionLabel="label"
      optionValue="value"
      style="min-width: 130px"
    ></app-dropdown>
    <app-dropdown
      label="區域"
      controlName="pickerAreaFilter"
      [control]="pickerAreaFilter"
      [options]="dropdownService.regionOptions"
      optionLabel="label"
      optionValue="value"
      style="min-width: 130px"
    ></app-dropdown>
    <app-dropdown
      label="狀態"
      controlName="locationStatusFilter"
      [control]="locationStatusFilter"
      [options]="locationStatusOptions"
      optionLabel="label"
      optionValue="value"
      [showClear]="false"
      style="min-width: 120px"
    ></app-dropdown>
    <button
      pButton
      label="查詢"
      icon="pi pi-search"
      class="p-button-sm"
      [loading]="locationPickerLoading"
      (click)="onPickerSearch()"
    ></button>
  </div>

  <app-table
    [data]="filteredPickerData"
    [columns]="locationPickerColumns"
    [loading]="locationPickerLoading"
    [selectionMode]="'single'"
    [showCheckBox]="true"
    [showCaption]="false"
    [showPage]="false"
    [showManage]="false"
    [dataKey]="'value'"
    [isRowSelectable]="isLocationSelectable"
    [(selectedItems)]="locationPickerSelectedRow"
  ></app-table>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="確認選擇"
      icon="pi pi-check"
      class="p-button-sm"
      [disabled]="!locationPickerSelectedRow?.length"
      (click)="onLocationPickerConfirm()"
    ></button>
    <button
      pButton
      label="取消"
      icon="pi pi-times"
      class="p-button-sm p-button-outlined ml-2"
      (click)="locationPickerVisible = false"
    ></button>
  </ng-template>
</p-dialog>
