<div class="card">
  <!-- 操作按鈕區域 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="back"
      (click)="goBack()"
      label="返回查詢"
    ></app-button>
    <app-button
      btnType="previous"
      (click)="goToPreviousStep()"
      label="上一步"
      icon="pi pi-arrow-left"
    ></app-button>
    <app-button
      *ngIf="!isViewMode"
      btnType="next"
      (click)="goToNextStep()"
      label="下一步(條件設定)"
    ></app-button>
  </div>

  <!-- 步驟指示器 -->
  <div class="step-indicator mb-3">
    <span class="step completed">1. 合約基本資料</span>
    <span class="step completed">2. 代扣款設定</span>
    <span class="step active">3. 抽成設定</span>
    <span class="step">4. 條件設定</span>
  </div>

  <!-- 抽成類型顯示 -->
  <div class="mb-3 p-3 surface-ground border-round">
    <span class="font-semibold">目前抽成類型：</span>
    <span class="text-primary font-bold">{{ commissionTypeName }}</span>
  </div>

  <!-- 抽成設定區域 -->
  <div *ngIf="requiresCommission">
    <!-- 新增按鈕 -->
    <div class="mb-2" *ngIf="!isFormReadonly">
      <p-button
        label="新增抽成項目"
        icon="pi pi-plus"
        (onClick)="addCommissionItem()"
      ></p-button>
    </div>

    <!-- 抽成列表 -->
    <p-accordion [multiple]="true">
      <ng-container *ngFor="let item of getActiveItems(); let i = index">
        <p-accordionTab [header]="'抽成項目 ' + (i + 1)">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-3">
              <label class="block mb-2">抽成比率(%)</label>
              <p-inputNumber
                [(ngModel)]="item.charge_rate"
                [disabled]="isFormReadonly"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                suffix="%"
                (onInput)="onItemChange(item)"
              ></p-inputNumber>
            </div>
            <div class="col-12 md:col-6 lg:col-3">
              <app-calendar
                label="起始日期"
                [(ngModel)]="item.cag_bdate"
                [readonly]="isFormReadonly"
                (ngModelChange)="onItemChange(item)"
              ></app-calendar>
            </div>
            <div class="col-12 md:col-6 lg:col-3">
              <app-calendar
                label="結束日期"
                [(ngModel)]="item.cag_edate"
                [readonly]="isFormReadonly"
                (ngModelChange)="onItemChange(item)"
              ></app-calendar>
            </div>
            <div class="col-12 md:col-6 lg:col-3">
              <label class="block mb-2">備註</label>
              <input
                type="text"
                pInputText
                [(ngModel)]="item.cag_remark"
                [disabled]="isFormReadonly"
                (input)="onItemChange(item)"
              />
            </div>
          </div>

          <!-- 折扣設定區域 -->
          <div class="mt-3">
            <div class="flex justify-content-between align-items-center mb-2">
              <h4 class="m-0">折扣設定</h4>
              <p-button
                *ngIf="!isFormReadonly"
                label="新增折扣"
                icon="pi pi-plus"
                size="small"
                (onClick)="addDiscountItem(item)"
              ></p-button>
            </div>

            <p-table
              [value]="getActiveDiscounts(item)"
              styleClass="p-datatable-sm"
            >
              <ng-template pTemplate="header">
                <tr>
                  <th>折扣比率(%)</th>
                  <th>起始日期</th>
                  <th>結束日期</th>
                  <th style="width: 80px" *ngIf="!isFormReadonly">操作</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-discount let-j="rowIndex">
                <tr>
                  <td>
                    <p-inputNumber
                      [(ngModel)]="discount.discount_rate"
                      [disabled]="isFormReadonly"
                      [minFractionDigits]="0"
                      [maxFractionDigits]="2"
                      suffix="%"
                      (onInput)="onItemChange(item)"
                    ></p-inputNumber>
                  </td>
                  <td>
                    <input
                      type="text"
                      pInputText
                      [(ngModel)]="discount.tlt_bdate"
                      [disabled]="isFormReadonly"
                      placeholder="YYYY-MM-DD"
                      (input)="onItemChange(item)"
                    />
                  </td>
                  <td>
                    <input
                      type="text"
                      pInputText
                      [(ngModel)]="discount.tlt_edate"
                      [disabled]="isFormReadonly"
                      placeholder="YYYY-MM-DD"
                      (input)="onItemChange(item)"
                    />
                  </td>
                  <td *ngIf="!isFormReadonly">
                    <p-button
                      icon="pi pi-trash"
                      severity="danger"
                      [text]="true"
                      (onClick)="removeDiscountItem(item, j)"
                    ></p-button>
                  </td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td [attr.colspan]="isFormReadonly ? 3 : 4" class="text-center">
                    尚未設定折扣
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>

          <!-- 刪除按鈕 -->
          <div class="mt-3 text-right" *ngIf="!isFormReadonly">
            <p-button
              label="刪除此抽成項目"
              icon="pi pi-trash"
              severity="danger"
              (onClick)="removeCommissionItem(i)"
            ></p-button>
          </div>
        </p-accordionTab>
      </ng-container>
    </p-accordion>

    <div *ngIf="getActiveItems().length === 0" class="text-center p-5 surface-ground border-round">
      <i class="pi pi-info-circle text-2xl mb-2 block"></i>
      <span>尚未設定抽成項目，請點擊「新增抽成項目」按鈕</span>
    </div>
  </div>

  <!-- 不需要抽成設定的提示 -->
  <div *ngIf="!requiresCommission" class="text-center p-5 surface-ground border-round">
    <i class="pi pi-check-circle text-green-500 text-3xl mb-3 block"></i>
    <span class="text-lg">
      目前抽成類型「{{ commissionTypeName }}」不需要設定抽成項目
    </span>
  </div>

  <!-- 底部導航按鈕 -->
  <div class="flex justify-content-end gap-2 mt-3">
    <app-button
      btnType="previous"
      (click)="goToPreviousStep()"
      label="上一步"
      icon="pi pi-arrow-left"
    ></app-button>
    <app-button
      *ngIf="!isViewMode"
      btnType="next"
      (click)="goToNextStep()"
      label="下一步(條件設定)"
    ></app-button>
  </div>
</div>
