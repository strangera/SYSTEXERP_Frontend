<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="產生發票"
            class="col"
          ></app-button>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="重新列印"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar
                  calendarType="dateMonthOne"
                  label="帳款年月"
                  [control]="queryForm.controls.onedatemm"
                  [submitted]="submitted"
                ></app-calendar>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="專櫃編號"
                  controlName="money"
                  [control]="queryForm.controls.serialnumber"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number-range
                  [useGrouping]="false"
                  label="發票號碼"
                  [startControl]="queryForm.controls.startInvoiceNumber"
                  [endControl]="queryForm.controls.endInvoiceNumber"
                  [submitted]="submitted"
                ></app-input-number-range>
              </div>
            </div>
            <hr />
            <div class="grid p-fluid">
              <div class="col-12 md:col-4 lg:col-4">
                <p-checkbox
                  label="發票封面是否列印"
                  formControlName="usagec"
                ></p-checkbox>
              </div>
            </div>
            <hr />
            <ul>
              <li>印表機設定：</li>
              <ul>
                <li>紙張大小：A4</li>
                <li>頁首和頁尾請清空</li>
                <li>紙張列印方向：直印</li>
                <li>放紙：請將捲軸靠最左邊</li>
              </ul>
            </ul>
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
  </div>
</div>
