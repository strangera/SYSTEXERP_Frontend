<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="產生發票" icon="pi pi-plus" (click)="onCreateInvoice(queryForm)" [loading]="loading"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="帳款年月"
            controlName="SamYyyymm" [control]="queryForm.controls.SamYyyymm" [submitted]="submitted" />
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="TltNo" [options]="tlt_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TltNo" [submitted]="submitted"></app-multi-select>
          </div>
          <app-input-text-range class="col-12 md:col-6 lg:col-4" label="發票號碼"
            [startControl]="queryForm.controls.GuiNoStart" [endControl]="queryForm.controls.GuiNoEnd"
            [submitted]="submitted"></app-input-text-range>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls2h020" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [lastQueryBody]="lastQueryBody" [showDelete]="false" [showReportMode]="false" [showCheckBox]="true"
    [showManage]="false" [queryFunction]="queryWithSort.bind(this)" [showDetail]="false" [showEdit]="false"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [loading]="loading"
    [ItemSize]="30">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="列印發票PDF" [rounded]="true" icon="pi pi-file" (click)="onReprint(queryForm)"
            [disabled]="data.length === 0 || selectedItems.length === 0" [loading]="loading"></p-button>
        </div>
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="AUTOMAIL" [rounded]="true" icon="pi pi-envelope"
            (click)="dialogVisible = true" [disabled]="data.length === 0 || selectedItems.length === 0"
            [loading]="loading"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>

<app-dialog [visible]="dialogVisible" header="AutoMail" [showFooter]="false" (visibleChange)="dialogVisible = $event"
  width="400px">
  <form [formGroup]="dialogForm" (ngSubmit)="autoMail(dialogForm)">
    <div class="grid p-fluid">
      <app-dropdown class="col-12" label="寄件者" [control]="dialogForm.controls.SMTP_No"
        [options]="SMTP_NoOptions | async" optionLabel="Name" optionValue="No" [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="submit" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
