<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" controlName="cls_date" label="發票日期" [readonly]="true"
              [control]="queryForm.controls.cls_date" [submitted]="submitted"></app-calendar>
          </div>
        </div>
        <h6>最後發票鎖定日期：
          <span *ngIf="loadingDates">讀取中...</span>
          <span *ngIf="!loadingDates">{{ closeDate }}</span>
        </h6>
        <h6>最近關帳日期：
          <span *ngIf="loadingDates">讀取中...</span>
          <span *ngIf="!loadingDates">{{ (lastCloseDate | date: 'yyyy/MM/dd') ?? 'N/A' }}</span>
        </h6>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="report" [loading]="loading" label="轉檔" (click)="onInvoiceSummary()"
            [disabled]="!hasPermission(Actions.TransferFile)"></app-button>
          <app-button btnType="report" [loading]="loading" label="鎖定" (click)="onLock()"
            [disabled]="!hasPermission(Actions.Lock)"></app-button>
          <app-button btnType="report" [loading]="loading" label="反鎖定" (click)="onUnLock()"
            [disabled]="!hasPermission(Actions.Unlock)"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
