<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button> -->
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="匯檔發票日期"
              [control]="queryForm.controls.onedatedd"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>

        
            <h6>最近關帳日期：{{ closeDate }}</h6>
            <h6>最近匯總日期:2020/2/6</h6>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="clear" (click)="onClearForm()"></app-button>
        <app-button btnType="query" [loading]="loading" label="轉檔"></app-button>
      </div>
      </form>
    </p-accordionTab>
    
  </p-accordion>
</div>
