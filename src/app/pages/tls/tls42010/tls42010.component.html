<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="EXCEL匯入"
            class="col"
          ></app-button>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="複製菜單"
            class="col"
          ></app-button>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <div class="grid p-fluid">
              <!-- <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="分店編號" controlName="STO_No" [control]="queryForm.controls.STO_No" [submitted]="submitted">
                                </app-input-text>
                            </div> -->
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="菜單類別"
                  controlName="SBM_Type"
                  [options]="SBM_Type_Options"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.SBM_Type"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="商品條碼"
                  controlName="PLU_No"
                  [control]="queryForm.controls.PLU_No"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="專櫃編號"
                  controlName="TLT_No"
                  [control]="queryForm.controls.TLT_No"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="櫃位名稱"
                  controlName="TLT_Name"
                  [control]="queryForm.controls.TLT_Name"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar-range
                  calendarType="dateTimeRange"
                  label="有效啟始日期"
                  [startControl]="queryForm.controls.SBM_BegDate_From"
                  [endControl]="queryForm.controls.SBM_BegDate_To"
                  [submitted]="submitted"
                ></app-calendar-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar-range
                  calendarType="dateTimeRange"
                  label="有效結束日期"
                  [startControl]="queryForm.controls.SBM_EndDate_From"
                  [endControl]="queryForm.controls.SBM_EndDate_To"
                  [submitted]="submitted"
                ></app-calendar-range>
              </div>
            </div>
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <app-table
        [data]="data"
        [columns]="columns"
        [expansionColumns]="subColumns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      ></app-table>
    </div>
  </div>
</div>
