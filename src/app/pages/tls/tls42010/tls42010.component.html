<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="鍵盤編號"
              controlName="USR_Level"
              [control]="queryForm.controls.USR_Level"
              [submitted]="submitted"
              [options]="kbFuncOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="請選擇鍵盤編號"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-12">
            <app-input-textarea
              label="鍵盤備註"
              controlName="ECR_KBDesc"
              [control]="queryForm.controls.ECR_KBDesc"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            >
              >
            </app-input-textarea>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="TLS2A020"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showCheckBox]="false"
    dataKey="id"
    [totalRecords]="totalRecords"
    [showManage]="true"
    [loading]="loading"
    [showDelete]="false"
    [showDetail]="true"
    [lastQueryBody]="lastQueryForm"
    [footerData]="footerTotal"
    [queryFunction]="tls42010Service.queryTLS42010M.bind(tls42010Service)"
  ></app-table-report>
</div>
