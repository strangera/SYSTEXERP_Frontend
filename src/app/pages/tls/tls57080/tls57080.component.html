<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 查詢日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="查詢日期" [startControl]="queryForm.controls.StartDate"
              [endControl]="queryForm.controls.EndDate" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <!-- 管理編號 -->
          <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.PLU_MagNo"
            templateLabel="label" [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo"
            [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
            (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
            [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
            [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table>
          <!-- 國際條碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="國際條碼" controlName="PLU_No" [control]="queryForm.controls.PLU_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" controlName="HOS_No" [options]="HOS_NoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.HOS_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品名" controlName="PLU_Name" [control]="queryForm.controls.PLU_Name"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls57050" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [showReportMode]="false" [loading]="loading"
    [queryFunction]="tls57080Service.queryTLS57080.bind(tls57080Service)">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出庫存數量異動明細表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出庫存數量異動明細表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
