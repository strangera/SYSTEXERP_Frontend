<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="銷售日期" [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="發票類型" controlName="MIG_TypeList" [options]="migTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.MIG_TypeList"
              [submitted]="submitted" />
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="TLS22040" dataKey="RowKey" [data]="data" [columns]="columns" [showCheckBox]="false"
    [totalRecords]="totalRecords" [loading]="loading" [columnGroup]="columnGroup4" [showManage]="true"
    [showDelete]="false" [showDetail]="false" [showEdit]="false" [addButton]="addButton"
    [lastQueryBody]="lastQueryBody" [queryFunction]="tableQueryFunction"></app-table-report>
</div>
