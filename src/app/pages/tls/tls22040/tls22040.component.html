<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="產檔日期"
              [startControl]="queryForm.controls.tlt_bdate_start"
              [endControl]="queryForm.controls.tlt_bdate_end"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="銷售日期"
              [startControl]="queryForm.controls.tlt_bdate_start"
              [endControl]="queryForm.controls.tlt_bdate_end"
              [submitted]="submitted"
            />
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="id"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    dataKey="id"
    [multiSortMeta]="[{ field: 'pendingApprovalRegisterCode', order: 1 }]"
    [lazy]="true"
    [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="false"
    [showDelete]="false"
  ></app-table>
</div>
