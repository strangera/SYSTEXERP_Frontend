<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼" controlName="bus_type" [control]="queryForm.controls.bus_type"
              [submitted]="submitted" [options]="busTypeOptions" optionLabel="Name" optionValue="No">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品項名稱" controlName="CHG_ItemName" [control]="queryForm.controls.CHG_ItemName"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="稅別" controlName="Item_TaxType" [options]="Item_TaxType_Option"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.Item_TaxType"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="data"
      [columns]="columns"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      (edit)="onEdit($event)"
      [showDelete]="false"
      [showReportMode]="false"
      [dataKey]="'id'"
      [totalRecords]="totalRecords"
      [showCheckBox]="true"
      [loading]="loading"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showExcel]="false"
      [showManage]="false">
    </app-table-report>
  </div>
</div>
