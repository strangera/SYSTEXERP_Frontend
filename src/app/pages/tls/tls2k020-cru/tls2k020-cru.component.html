<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <app-radiobutton label="領卡依據" groupname="receiveBasic"
                            [control]="dataForm.controls.receiveBasic" [options]="receiveBasicOptions"
                            [submitted]="submitted">
                        </app-radiobutton>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="批次號" controlName="serialnumber"
                                [control]="dataForm.controls.serialnumber" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="起始卡號" controlName="startNumber"
                                [control]="dataForm.controls.startNumber" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="領卡數量" controlName="receiveNumber"
                                [control]="dataForm.controls.receiveNumber" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="領用櫃號" controlName="receiveCounter"
                                [control]="dataForm.controls.receiveCounter" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button btnType="cancel" (click)="onCancel()"></app-button>
                        <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
