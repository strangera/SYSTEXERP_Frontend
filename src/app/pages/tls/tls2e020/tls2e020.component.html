<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="確定結算" icon="pi pi-plus" (click)="onSettle(queryForm)" [loading]="settleLoding"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="查詢年月" controlName="sam_yyymm"
              [control]="queryForm.controls.sam_yyymm" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="結帳方式" controlName="money_type" [options]="money_typeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.money_type" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="帳次" controlName="sam_termno" [options]="sam_termnoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.sam_termno" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button label="租金結算鎖定" [loading]="lockLoding" (clickEvent)="onLock(queryForm)"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report [data]="data" [columns]="columns" [totalRecords]="totalRecords" [showDelete]="false"
    [loading]="loading" [showManage]="false" [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls2e020Service.queryTls2e020.bind(tls2e020Service)"></app-table-report>
</div>
