<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="銷售日期"
              [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd"
              [submitted]="submitted">
            </app-calendar-range-quick>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              class="col-12"
              label="是否收銀"
              groupname="rece_yn"
              [control]="queryForm.controls.rece_yn"
              [options]="WhetherOptions"
              [submitted]="submitted">
            </app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <!-- ✅ 改用 table2，啟用總計/小計；以 ECR_No 群組 -->
  <app-table2
    tableKey="TLS23060"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    dataKey="_rowKey"
    [multiSortMeta]="sortMeta"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    [showDetail]="false"
    [showManage]="false"
    [showDelete]="false"
    [showSubTotal]="true"
    [showTotal]="true"
    [groupRowsBy]="'ECR_No'"
    [externalTotals]="detailTotals"
    [externalTotalFieldMap]="detailTotalFieldMap"
    [externalSubtotals]="detailSubtotals"
    [externalSubtotalFieldMap]="detailSubtotalFieldMap"
    (lazyLoadData)="onLazyLoadData($event, queryForm)"
    [serverFetch]="fetchTLS23060"  >
  <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產出收銀機區間報表.PDF"
          icon="pi pi-file"
          [loading]="btnLoading"
          [disabled]="data.length === 0"
          (click)="onExportPDF()">
        </p-button>
<!-- 
        <p-button
          styleClass="p-2"
          label="產出收銀機區間報表.XLSX"
          icon="pi pi-file-excel"
          [loading]="btnLoading"
          [disabled]="data.length === 0"
          (click)="onExportXLSX()">
        </p-button> -->
      </div>
    </header>
  </app-table2>
</div>
