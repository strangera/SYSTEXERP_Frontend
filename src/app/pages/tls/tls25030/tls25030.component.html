<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 新增 -->
    <app-button
      btnType="create"
      [type]="'button'"
      (clickEvent)="onCreate()"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!-- 第一排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="單據編號"
              controlName="fine_no"
              [control]="queryForm.controls.fine_no"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號"
              controlName="tlt_no"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <!-- 第二排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="違規日期"
              [startControl]="queryForm.controls.fine_date_s"
              [endControl]="queryForm.controls.fine_date_e"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="扣款日期"
              [startControl]="queryForm.controls.deduct_date_s"
              [endControl]="queryForm.controls.deduct_date_e"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="開立單位"
              controlName="org_id"
              [options]="orgOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <!-- 第三排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="違規類別"
              controlName="violation_type"
              [options]="violationTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.violation_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="扣款項目"
              controlName="cap_item"
              [options]="capItemOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cap_item"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.floors"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <!-- 第四排 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="金額"
              [startControl]="queryForm.controls.amount_s"
              [endControl]="queryForm.controls.amount_e"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="建立者(工號)"
              controlName="crt_usr_no"
              [control]="queryForm.controls.crt_usr_no"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <!-- 按鈕列 -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button
            btnType="clear"
            [type]="'button'"
            (clickEvent)="onClear(queryForm)"
          ></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 列表 -->
<div class="card">
  <app-table-report
    [tableKey]="'tls25030_' + tableVer"
    [dataKey]="'_rowKey'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="viewTotalRecords"
    [loading]="loading"
    [showManage]="true"
    [showFilter]="true"
    [showExcel]="false"
    [footerData]="footerData"
    [queryFunction]="queryTLS25030ForReport"
    [lastQueryBody]="lastQueryBody"
    [showDelete]="false"
    [showReportMode]="false"
    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    [editDisabled]="isEditDisabled"
    [addButton]="addButton"
    (selectionChange)="selectedItems = $event"
    [showDetail]="true"
    (detail)="onDetail($event)"
    (edit)="onEdit($event)"
  ></app-table-report>
</div>
