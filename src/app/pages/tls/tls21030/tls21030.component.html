<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="結帳方式" controlName="settlementMethod"
            [options]="settlementMethodOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.settlementMethod" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="帳次" controlName="accountingPeriod"
            [options]="accountingPeriodOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.accountingPeriod" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="是否使用業主發票" controlName="useOwnerInvoice"
            [options]="useOwnerInvoiceOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.useOwnerInvoice" [submitted]="submitted"></app-multi-select>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="說明1" controlName="description1"
            [control]="queryForm.controls.description1" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="說明2" controlName="description2"
            [control]="queryForm.controls.description2" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="說明3" controlName="description3"
            [control]="queryForm.controls.description3" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="counterID"
            [control]="queryForm.controls.counterID" [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="BNK_No" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showCheckBox]="true" [multiSortMeta]="[{ field: 'BNK_No', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading"></app-table>
</div>
