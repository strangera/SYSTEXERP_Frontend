<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="結帳方式" controlName="settlementMethod" [options]="settlementMethodOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.settlementMethod"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="帳次" controlName="accountingPeriod" [options]="accountingPeriodOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.accountingPeriod"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="是否使用業主發票" controlName="useOwnerInvoice" [options]="useOwnerInvoiceOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.useOwnerInvoice"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="說明1" controlName="description1" [control]="queryForm.controls.description1"
                  [submitted]="submitted">
                </app-input-text>
              </div>

              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="說明2" controlName="description2" [control]="queryForm.controls.description2"
                  [submitted]="submitted">
                </app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="說明3" controlName="description3" [control]="queryForm.controls.description3"
                  [submitted]="submitted">
                </app-input-text>
              </div>
            </div>
          </form>
          <div *appHasPermission="queryPermission" class="col">
            <div class="grid justify-content-end">
              <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
              <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
            </div>
          </div>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-12">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
        </app-table>
      </div>
    </div>
  </div>
</div>
