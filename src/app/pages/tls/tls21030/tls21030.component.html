<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="結帳方式" controlName="settlementMethod"
            [options]="settlementMethodOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.money_type" [submitted]="submitted" />
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="帳次" controlName="accountingPeriod"
            [options]="accountingPeriodOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.term_no" [submitted]="submitted" />
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否使用業主發票" controlName="isSettled"
            [control]="queryForm.controls.rece_yn" [submitted]="submitted" [showAll]="true" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="說明" controlName="bill_remark"
            [control]="queryForm.controls.bill_remark" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_noList"
            [control]="queryForm.controls.tlt_noList" [options]="TLTTALENT_DropDownList | async" optionLabel="label"
            optionValue="No" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS21030" dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true" [totalRecords]="totalRecords" [loading]="loading"
    (delete)="onDelete($event)" [selectedItems]="selectedItems"
    [queryFunction]="tls21030Service.queryTLS21030.bind(tls21030Service)" [lastQueryBody]="lastQueryBody"
    (selectionChange)="selectedItems = $event"></app-table-report>
</div>
