<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 上方主表單 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="鍵盤編號"
            controlName="USR_Level"
            [control]="dataForm.controls.USR_Level"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="收銀畫面名稱"
            controlName="TSB_Name"
            [options]="TSB_NameOptions"
            optionLabel="Name"
            optionValue="No"
            [control]="dataForm.controls.TSB_Name"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="鍵盤型態"
            controlName="ECR_KBType"
            [options]="ECR_KBTypeOptions"
            optionLabel="Name"
            optionValue="No"
            [control]="dataForm.controls.ECR_KBType"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12">
          <app-input-textarea
            label="鍵盤備註"
            controlName="ECR_KBDesc"
            [control]="dataForm.controls.ECR_KBDesc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>
      </div>

      <!-- 下方：左鍵盤 + 右設定 -->
      <div class="grid p-fluid mt-5">
        <!-- 左：鍵盤設定明細 -->
        <div class="col-12 md:col-8">
          <p-panel header="鍵盤設定明細">
            <p-tabView
              [activeIndex]="dataForm.controls.activePage.value"
              (onChange)="onTabChange($event)"
              class="kb-tabview"
            >
              <p-tabPanel
                *ngFor="let _ of pageList; index as i"
                [header]="(i + 1).toString()"
              >
                <div
                  class="kb-grid"
                  [style.gridTemplateColumns]="'repeat(' + xCount + ', 1fr)'"
                  [style.gridTemplateRows]="'repeat(' + yCount + ', 60px)'"
                >
                  <button
                    *ngFor="let k of visibleKeys"
                    type="button"
                    class="kb-key"
                    [class.active]="selected?.code === k.code"
                    [ngClass]="'type-' + (k.type || 'normal')"
                    (click)="selectKey(k)"
                  >
                    <!-- 按鈕顯示 KB_Display1 優先，沒填才顯示代碼 -->
                    <div class="kb-label">{{ k.KB_Display1 || k.code }}</div>
                    <div class="kb-sub" *ngIf="k.KB_Display1 && k.KB_Display1 !== k.code">
                      {{ k.code }}
                    </div>
                  </button>
                </div>
              </p-tabPanel>
            </p-tabView>
          </p-panel>
        </div>

        <!-- 右：設定區 -->
        <div class="col-12 md:col-4">
          <div class="grid">
            <div class="col-12">
              <p-selectButton
                [options]="tabOptions"
                [ngModel]="selectedTab"
                (onChange)="onTabChangeTab($event)"
                [multiple]="false"
                [unselectable]="false"
                [ngModelOptions]="{ standalone: true }"
              ></p-selectButton>
            </div>

            <!-- 功能分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'func'">
              <app-dropdown
                label="功能代碼/名稱"
                [control]="getControl('KB_Func')" as FormControl
                [options]="KB_FuncOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <!-- 按鈕分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-dropdown
                label="是否啟用"
                [control]="getControl('KB_Switch')"
                [options]="KB_SwitchOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-input-text
                label="案鍵顯示(第一行)"
                [control]="getControl('KB_Display1')"
              ></app-input-text>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-input-text
                label="案鍵顯示(第二行)"
                [control]="getControl('KB_Display2')"
              ></app-input-text>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <label for="kb-color">按鍵顏色</label>
              <div class="flex align-items-center gap-2">
                <input
                  id="kb-color"
                  type="text"
                  class="p-inputtext p-component"
                  [value]="selectedKeyForm.get('KB_Color')?.value"
                  readonly
                />
                <p-colorPicker
                  [formControl]="getControl('color')"
                  appendTo="body"
                  format="rgb"
                ></p-colorPicker>
              </div>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-dropdown
                label="按鍵形狀"
                [control]="getControl('KB_Style')"
                [options]="KB_StyleOptions"
                optionLabel="SYS_Name"
                optionValue="SYS_Code"
              ></app-dropdown>
            </div>

            <!-- 字型分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'font'">
              <app-dropdown
                label="顯示字型"
                [control]="getControl('KB_Font')"
                [options]="KB_FontOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'font'">
              <app-dropdown
                label="顯示字型大小"
                [control]="getControl('KB_Size')"
                [options]="KB_SizeOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'font'">
              <app-dropdown
                label="字型樣式"
                [control]="getControl('KB_Fonttyped')"
                [options]="KB_FonttypedOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'font'">
              <label for="KB_FontColor">字型顏色</label>
              <div class="flex align-items-center gap-2">
                <input
                  id="KB_FontColor"
                  type="text"
                  class="p-inputtext p-component"
                  [value]="selectedKeyForm.get('KB_FontColor')?.value"
                  readonly
                />
                <p-colorPicker
                  [formControl]="getControl('FontColor')"
                  appendTo="body"
                  format="rgb"
                ></p-colorPicker>
              </div>
            </div>

            <!-- 其他分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'other'">
              <app-input-text
                label="參數1"
                [control]="getControl('KB_Arg1')"
              ></app-input-text>
            </div>
            <div class="col-12" *ngIf="selectedTab === 'other'">
              <app-input-text
                label="參數2"
                [control]="getControl('KB_Arg2')"
              ></app-input-text>
            </div>
            <div class="col-12" *ngIf="selectedTab === 'other'">
              <app-input-text
                label="參數3"
                [control]="getControl('KB_Arg3')"
              ></app-input-text>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部按鈕 -->
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
