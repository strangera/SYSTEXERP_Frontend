<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 上方主表單 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="鍵盤編號" controlName="USR_Level" [control]="dataForm.controls.USR_Level"
            [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="收銀畫面名稱" controlName="TSB_Name" [options]="TSB_NameOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.TSB_Name" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="鍵盤型態" controlName="ECR_KBType" [options]="ECR_KBTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_KBType" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12">
          <app-input-textarea label="鍵盤備註" controlName="ECR_KBDesc" [control]="dataForm.controls.ECR_KBDesc"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-input-textarea>
        </div>
      </div>

      <!-- 下方：左鍵盤 + 右設定 -->
      <div class="grid p-fluid mt-5" *ngIf="dataForm.controls.TSB_Name.value">
        <!-- 左：鍵盤設定明細 -->
        <div class="col-12 md:col-8">
          <p-panel header="鍵盤設定明細">
            <div class="flex justify-content-end gap-2 mb-2">
              <app-button label="新增頁數" btnType="create" (click)="addPage()" class="btn-small" styleClass="py-2"
                icon="pi pi-plus"></app-button>
              <app-button label="刪除頁數" btnType="delete" (click)="deletePage()" class="btn-small" styleClass="py-2"
                icon="pi pi-minus" [disabled]="pages.length <= 1"></app-button>
            </div>
            <app-tls42010-grid [pages]="pages" [activeIndex]="activeIndex" [selected]="selected" [xCount]="xCount"
              [yCount]="yCount" (activeIndexChange)="onPageChange($event)"
              (keyClick)="selectKey($event.key, $event.event)">
            </app-tls42010-grid>
          </p-panel>
        </div>

        <!-- 右：設定區 -->
        <div class="col-12 md:col-4">
          <app-tls42010-editor [form]="selectedKeyForm" [funcOptions$]="KB_FuncOptions$"
            [styleOptions]="KB_StyleOptions" [selectedKey]="selected" (mergeAction)="toggleMergeOption($event)"
            (attrAction)="handleAttrAction($event.action, $event.event)"
            (fontTypeChange)="toggleFonttyped($event.index, $event.checked)">
          </app-tls42010-editor>
        </div>
      </div>

      <!-- 底部按鈕（編輯/建立模式可見；檢視模式隱藏） -->
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onCancelClicked()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
