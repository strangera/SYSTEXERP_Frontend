<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="鍵盤編號"
            controlName="USR_Level"
            [control]="dataForm.controls.USR_Level"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="收銀畫面名稱"
            controlName="TSB_Name"
            [options]="TSB_NameOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.TSB_Name"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="鍵盤型態"
            controlName="ECR_KBType"
            [options]="ECR_KBTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ECR_KBType"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-12">
          <app-input-textarea
            label="鍵盤備註"
            controlName="ECR_KBDesc"
            [control]="dataForm.controls.ECR_KBDesc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>
      </div>
      <div class="grid p-fluid mt-5">
        <div class="col-12 md:col-8">
          <p-panel header="鍵盤設定明細">
            <div
              class="kb-grid"
              [style.gridTemplateColumns]="'repeat(' + xCount + ', 1fr)'"
              [style.gridTemplateRows]="'repeat(' + yCount + ', 60px)'"
            >
              <button
                *ngFor="let k of keys"
                type="button"
                class="kb-key"
                [class.active]="selected?.code === k.code"
                [ngClass]="'type-' + (k.type || 'normal')"
                (click)="selectKey(k)"
              >
                <div class="kb-label">{{ k.label || k.code }}</div>
                <div class="kb-sub" *ngIf="k.label && k.label !== k.code">
                  {{ k.code }}
                </div>
              </button>
            </div>
          </p-panel>
        </div>
          <div class="col-12 md:col-4">
            <!-- <app-dropdown
              label="頁數"
              controlName="KG_KeyPage"
              [options]="KG_KeyPageOptions"
              optionLabel="label"
              optionValue="code"
              [control]="dataForm.controls.KG_KeyPage"
              [submitted]="submitted"
            ></app-dropdown> -->

          </div>
           <div class="col-12 md:col-4">
            <!-- <app-dropdown
              label="按鈕"
              controlName="KG_button"
              [options]="KG_buttonOptions"
              optionLabel="label"
              optionValue="code"
              [control]="dataForm.controls.KG_button"
              [submitted]="submitted"
            ></app-dropdown> -->

          </div>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
