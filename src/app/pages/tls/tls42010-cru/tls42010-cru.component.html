<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 上方主表單 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="鍵盤編號"
            controlName="USR_Level"
            [control]="dataForm.controls.USR_Level"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="收銀畫面名稱"
            controlName="TSB_Name"
            [options]="TSB_NameOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.TSB_Name"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="鍵盤型態"
            controlName="ECR_KBType"
            [options]="ECR_KBTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ECR_KBType"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12">
          <app-input-textarea
            label="鍵盤備註"
            controlName="ECR_KBDesc"
            [control]="dataForm.controls.ECR_KBDesc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          ></app-input-textarea>
        </div>
      </div>

      <!-- 下方：左鍵盤 + 右設定 -->
      <div class="grid p-fluid mt-5">
        <!-- 左：鍵盤設定明細 -->
        <div class="col-12 md:col-8">
          <p-panel header="鍵盤設定明細">
            <div
              class="kb-grid"
              [style.gridTemplateColumns]="'repeat(' + xCount + ', 1fr)'"
              [style.gridTemplateRows]="'repeat(' + yCount + ', 60px)'"
            >
              <button
                *ngFor="let k of keys"
                type="button"
                class="kb-key"
                [class.active]="selected?.code === k.code"
                [ngClass]="'type-' + (k.type || 'normal')"
                (click)="selectKey(k)"
              >
                <div class="kb-label">{{ k.label || k.code }}</div>
                <div class="kb-sub" *ngIf="k.label && k.label !== k.code">
                  {{ k.code }}
                </div>
              </button>
            </div>
          </p-panel>
        </div>

        <!-- 右：頁數/按鈕/分頁切換 + 功能代碼/名稱 -->
        <div class="col-12 md:col-4">
          <div class="grid">
            <div class="col-12">
              <p-selectButton
                [options]="tabOptions"
                [ngModel]="selectedTab"
                (onChange)="selectedTab = $event.value"
                [multiple]="false"
                [unselectable]="false"
                [ngModelOptions]="{ standalone: true }"
              ></p-selectButton>
            </div>

            <!-- 功能分頁 -->
            <!-- 功能分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'func'">
              <app-dropdown
                label="功能代碼/名稱"
                [control]="dataForm.controls.func"
                [options]="KB_FuncOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <!-- 按鈕分頁 -->
            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-dropdown
                label="是否啟用"
                [control]="dataForm.controls.KB_Switch"
                [options]="KB_SwitchOptions"
                optionLabel="label"
                optionValue="value"
                [showClear]="true"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-input-text
                label="案鍵顯示(第一行)"
                [control]="dataForm.controls.KB_Display1"
              ></app-input-text>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-input-text
                label="案鍵顯示(第二行)"
                [control]="dataForm.controls.KB_Display2"
              ></app-input-text>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-dropdown
                label="按鍵顏色"
                [control]="dataForm.controls.KB_Color"
                [options]="KB_ColorOptions"
                optionLabel="label"
                optionValue="value"
              ></app-dropdown>
            </div>

            <div class="col-12" *ngIf="selectedTab === 'button'">
              <app-dropdown
                label="按鍵形狀"
                [control]="dataForm.controls.KB_Style"
                [options]="KB_StyleOptions"
                optionLabel="label"
                optionValue="value"
              ></app-dropdown>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部按鈕 -->
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
