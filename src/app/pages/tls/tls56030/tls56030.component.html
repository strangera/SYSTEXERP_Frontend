<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="領用單退回編號" controlName="RPM_No"
              [control]="queryForm.controls.RPM_No" [submitted]="submitted"></app-input-text>
          </div>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉別" controlName="HOS_No"
            [options]="warehouseOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.HOS_NoList" [submitted]="submitted"></app-multi-select>
          <!-- 管理編號 -->
          <!-- <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.queryNo"
            [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo" [suggestions]="suggestions"
            [fieldsConfig]="fieldsConfig" (inputValueChanged)="onAutoCompleteInputChange($event)"
            (formValueChanged)="onFormValueChanged($event)" [formGroup]="opForm" [dialogData]="opData"
            [dialogColumns]="opColumns" [loading]="opLoading" [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table> -->

          <!-- 品牌代碼 (對應 LOGO_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼" controlName="LOGO_No" [options]="brandOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.LOGO_NoList"
            [submitted]="submitted"></app-multi-select>
          <!-- 廠商編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門編號" controlName="org_id" [options]="departmentOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.org_idList" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="領用單退回狀態" controlName="issuanceNoteStatus" [options]="issuanceNoteStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.RPM_StatusList"
              [submitted]="submitted"></app-dropdown>
          </div>
          <hr />
        </div>
        <div class="grid p-fluid">
          <!-- 申請人員 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人編號" controlName="APPLY_USR" [options]="userOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.APPLY_USRList" [submitted]="submitted" />
          <!-- 申請日期 -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted" />
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS2A020" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [showCheckBox]="false" dataKey="id" [multiSortMeta]="[{ field: 'VEN_No', order: 1 }]" [totalRecords]="totalRecords"
    [lazy]="true" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [showManage]="true"
    [loading]="loading" [showDelete]="false"></app-table>
</div>
