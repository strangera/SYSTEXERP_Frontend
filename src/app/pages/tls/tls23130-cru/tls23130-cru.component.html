<div class="card">
  <!-- 上方功能列 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <!-- 報表區塊 -->
  <div class="card">
    <app-report-table-group
      [columns]="columns"
      [data]="data"
      [subtotalFields]="[
        'amount',
        'initialPayment',
        'monthlyPayment'
      ]"
      [enableGrouping]="false"
      [reportTitle]="'信用卡分期資料'"
      [currentPage]="1"
      [dateStart]="dateStart"
      [dateEnd]="dateEnd"
      [printedAt]="printedAt"
      [showTotalOnly]="false"
      [pdfSummaryText]="[]"
      [defaultMergedView]="true"
      [showExpandColumn]="false"
      [detailFieldKeys]="['TXN_Date']"
    >
    </app-report-table-group>
  </div>
</div>
