<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onBack()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      [header]="formTitle"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <!-- 標籤檔 -->
      <ng-container *ngIf="state.destination === 'label'">
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmitLabel(queryForm)"
        >
          <div class="grid p-fluid">
            <!-- 商品管理編號 / 國際條碼 / 廠商貨號 (合併查詢) -->
            <app-dropdown-table
              class="col-12 md:col-6 lg:col-4"
              [control]="queryForm.controls.KeyWord"
              templateLabel="label"
              [submitted]="submitted"
              optionLabel="PLU_MagNo"
              optionValue="PLU_MagNo"
              [suggestions]="suggestions"
              [fieldsConfig]="fieldsConfig"
              (inputValueChanged)="onAutoCompleteInputChange($event)"
              (formValueChanged)="onformValueChanged($event)"
              [formGroup]="opForm"
              [dialogData]="opData"
              [dialogColumns]="opColumns"
              [loading]="opLoading"
              [totalRecords]="opTotalRecords"
              [showOverlay]="false"
            >
              <!-- overlayPanel 查詢欄位 -->
              <app-input-text
                class="col-12 md:col-6"
                label="商品管理編號"
                controlName="PLU_MagNo"
                [control]="opForm.controls.PLU_MagNo"
              />
              <app-input-text
                class="col-12 md:col-6"
                label="商品名稱"
                controlName="PLU_Name"
                [control]="opForm.controls.PLU_Name"
              />
            </app-dropdown-table>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number
                label="標籤數量"
                controlName="Label_Qty"
                [control]="queryForm.controls.Label_Qty"
                [submitted]="submitted"
              ></app-input-number>
            </div>
          </div>

          <ng-container>
            <!-- 預覽區塊 -->
            <div *ngIf="previewLabelData" class="text-blue-600 mt-2">
              商品管理碼：{{ previewLabelData.PLU_MagNo }} 商品名稱{{
                previewLabelData.PLU_Name
              }}
              <br />

              商品售價：{{ previewLabelData.PLU_SalePrc }} 商品單位：{{
                previewLabelData.PLU_Unit
              }}
              <br />

              廠商貨號：{{ previewLabelData.PLU_OrgPLUNo }} 國際條碼：{{
                previewLabelData.PLU_No
              }}
            </div>
          </ng-container>
          <!-- <div> -->
          <div
            class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
          >
            <app-button btnType="clear" [form]="queryForm"></app-button>
            <app-button
              btnType="query"
              icon="pi pi-plus"
              label="加入"
              [loading]="loading"
            ></app-button>
            <app-button
              (click)="exportLabel()"
              label="確認產生標籤檔"
              [disabled]="!hasPermission(Actions.TagPrint)"
            ></app-button>
          </div>
          <!-- </div> -->
        </form>
      </ng-container>

      <!-- 變價歷史紀錄 -->
      <ng-container *ngIf="state.destination === 'history'">
        <form
          [formGroup]="queryPriceForm"
          id="queryPriceForm"
          (ngSubmit)="onSubmitPrice(queryPriceForm)"
        >
          <div class="grid p-fluid">
            <!-- 商品管理編號 / 國際條碼 / 廠商貨號 (合併查詢) -->
            <app-dropdown-table
              class="col-12 md:col-6 lg:col-4"
              [control]="queryPriceForm.controls.KeyWord"
              templateLabel="label"
              [submitted]="submitted"
              optionLabel="PLU_MagNo"
              optionValue="PLU_MagNo"
              [suggestions]="suggestions"
              [fieldsConfig]="fieldsConfig"
              (inputValueChanged)="onAutoCompleteInputChange($event)"
              (formValueChanged)="onformValueChanged($event)"
              [formGroup]="opForm"
              [dialogData]="opData"
              [dialogColumns]="opColumns"
              [loading]="opLoading"
              [totalRecords]="opTotalRecords"
              [showOverlay]="false"
            >
              <!-- overlayPanel 查詢欄位 -->
              <app-input-text
                class="col-12 md:col-6"
                label="商品管理編號"
                controlName="PLU_MagNo"
                [control]="opForm.controls.PLU_MagNo"
              />
              <app-input-text
                class="col-12 md:col-6"
                label="商品名稱"
                controlName="PLU_Name"
                [control]="opForm.controls.PLU_Name"
              />
            </app-dropdown-table>
          </div>
          <!-- <div> -->
          <div
            class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
          >
            <app-button btnType="clear" [form]="queryForm"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
          <!-- </div> -->
        </form>
      </ng-container>
    </p-accordionTab>
  </p-accordion>
</div>
<ng-container *ngIf="state.destination === 'label'">
  <div class="card">
    <div class="col-13">
      <app-expandable-edit-table
        #labelTable
        title="產生標籤檔"
        [mainColumns]="labelColumn"
        [data]="labelData"
        [loading]="expandlabelLoading"
        detailKey=""
        dataKey="id"
        [showCheckBox]="true"
        [showPaginator]="false"
        [showAddButton]="false"
        [showDetailTabs]="false"
        [showDetailAddButton]="false"
        (save)="onRowSave($event)"
        (cancel)="onRowCancel($event)"
        (batchDelete)="deleteLabel($event)"
      ></app-expandable-edit-table>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="state.destination === 'history'">
  <div class="card">
    <div class="col-13">
      <app-table
        tableKey="TLS51070OS"
        [data]="priceData[0] ? [priceData[0]] : []"
        [columns]="priceColumn1"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        [showCaption]="false"
        [showCheckBox]="false"
        [showPaginator]="false"
        [showManage]="false"
        dataKey="id"
        [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]"
        [totalRecords]="totalRecords"
        (lazyLoadData)="
          onLazyLoadData($event, queryPriceForm); onSubmitPrice(queryPriceForm)
        "
        [lazy]="true"
        [loading]="loading"
      ></app-table>
      <br />

      <app-table
        tableKey="TLS51070OS"
        [data]="priceData"
        [columns]="priceColumn2"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        [showCheckBox]="false"
        [showCaption]="false"
        [showManage]="false"
        dataKey="id"
        [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]"
        [totalRecords]="totalRecords"
        (lazyLoadData)="
          onLazyLoadData($event, queryPriceForm); onSubmitPrice(queryPriceForm)
        "
        [lazy]="true"
        [loading]="loading"
      ></app-table>
    </div>
  </div>
</ng-container>
