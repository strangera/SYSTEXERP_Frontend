<app-table-edit title="付款別修正" dataKey="PAY_Name" [data]="payNoData" [columns]="columns"
  (dataChange)="payNoData = $event" (fieldChange)="onFieldChange($event)" [rowEditDisabled]="rowEditDisabled"
  [isRowSelectable]="isRowSelectable">
  <header>
    @if (hasCheckedData) {
    <div style="text-align: right;">
      <i class="pi pi-info-circle" style="margin-right: 0.5rem; font-size: 1.2rem; color: red;"></i>
      <span style="color: red; font-weight: bold; font-size: 1.2rem;">已審核付款別不可異動，付款別下拉選單註明已審核項目</span>
    </div>
    }
  </header>
</app-table-edit>
