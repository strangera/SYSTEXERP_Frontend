<p-divider align="left" type="solid" styleClass="pb-2">
  <span class="text-center text-xl font-bold text-primary">支付工具</span>
</p-divider>
<p-table [value]="POS5008Data" [(selection)]="POS5008SelectedItems" dataKey="ID" [rowTrackBy]="trackByRow"
  [resizableColumns]="true" styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines">
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th class="w-1rem">序號</th>
      <th class="w-1rem"><p-tableHeaderCheckbox /></th>
      <th class="text-center">付款別</th>
      <th class="text-center">金額</th>
      <th class="text-center">信用卡別</th>
      <th class="text-center">信用卡卡號/券號/應收付款對象</th>
      <th class="text-center">分期數</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData>
    <tr style="height:35px">
      <td class="text-center">{{ rowIndex + 1 }}</td>
      <td><p-tableCheckbox [pSelectableRow]="rowData" [value]="rowData" /></td>
      <td class="text-center">
        <input pInputText class="w-full min-w-max" [(ngModel)]="rowData.PAY_Name" placeholder="請選擇付款別"
          [disabled]="true" />
      </td>
      <td>
        <p-inputNumber styleClass="w-full min-w-max" [(ngModel)]="rowData.TXN_PayAmt" name="txnPayAmt" [min]="0"
          [max]="9999999999.9999" [maxFractionDigits]="4" [minFractionDigits]="0" mode="decimal" required
          placeholder="請輸入金額" />
      </td>
      <td>
        <p-dropdown *ngIf="rowData.PAY_Type === '0'" [(ngModel)]="rowData.CRD_Type" styleClass="w-full"
          placeholder="請選擇信用卡別" [options]="CRD_TypeOptions" optionLabel="label" optionValue="value" appendTo="body"
          [disabled]="rowData.PAY_Type === '0' ? false : true" [filter]="true" [showClear]="true" />
      </td>
      <td>
        <input *ngIf="rowData.PAY_Type === '0'" pInputText class="w-full min-w-max" [(ngModel)]="rowData.CRD_No"
          placeholder="請輸入信用卡卡號" maxLength="20" [required]="rowData.PAY_Type === '0'" />
        <input *ngIf="rowData.PAY_Type !== '0' && rowData.PAY_Type !== 'A'" pInputText class="w-full min-w-max"
          [(ngModel)]="rowData.TXN_CouponNo" placeholder="請輸入券號" maxLength="50"
          [required]="rowData.PAY_Type !== '0' && rowData.PAY_Type !== 'A'" />
        <input *ngIf="rowData.PAY_Type === 'A'" pInputText class="w-full min-w-max" [(ngModel)]="rowData.TXN_PayDesc"
          placeholder="請輸入應收付款對象" maxLength="100" [required]="rowData.PAY_Type === 'A'" />
      </td>
      <td>
        <p-dropdown *ngIf="rowData.PAY_Type === '0'" [(ngModel)]="rowData.TERM_No" styleClass="w-full"
          placeholder="請選擇分期數" [options]="sys_typeOptions" optionLabel="SYS_Name" optionValue="SYS_Code" appendTo="body"
          [disabled]="rowData.PAY_Type === '0' ? false : true" [filter]="true" [showClear]="true" />
      </td>
    </tr>
  </ng-template>
</p-table>
