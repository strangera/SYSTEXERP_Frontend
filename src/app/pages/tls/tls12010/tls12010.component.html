<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="建立日期"
            [control]="queryForm.controls.CRT_Date" controlName="CRT_Date" [submitted]="submitted" />
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="接洽人員代碼" controlName="contact_USR_No" [control]="queryForm.controls.contact_USR_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="接洽人員姓名" controlName="contact_USR_Name" [control]="queryForm.controls.contact_USR_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商類型" controlName="cus_type" [options]="cus_type_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.cus_type" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商統一編號" controlName="cus_uniform_id" [control]="queryForm.controls.cus_uniform_id"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商名稱" controlName="VEN_Name" [control]="queryForm.controls.VEN_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商英文名稱" controlName="VEN_EngName" [control]="queryForm.controls.VEN_EngName"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類" controlName="bus_type" [options]="bus_type_Option" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.bus_type" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌" controlName="tlt_name" [options]="tlt_name_Option" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.tlt_name" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="品牌英文" controlName="tlt_EngName" [control]="queryForm.controls.tlt_EngName"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人" controlName="VEN_Boss" [control]="queryForm.controls.VEN_Boss"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人電話" controlName="VEN_BossTel" [control]="queryForm.controls.VEN_BossTel"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人頭銜" controlName="VEN_BossTitle" [control]="queryForm.controls.VEN_BossTitle"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人傳真" controlName="VEN_BossFax" [control]="queryForm.controls.VEN_BossFax"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人行動電話" controlName="VEN_BossMobile" [control]="queryForm.controls.VEN_BossMobile"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商聯絡人電子郵件" controlName="VEN_BossEmail" [control]="queryForm.controls.VEN_BossEmail"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="公司通訊地址" controlName="VEN_Addr" [control]="queryForm.controls.VEN_Addr"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="公司負責人" controlName="VEN_PersonInCharge" [control]="queryForm.controls.VEN_PersonInCharge"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="經營方式" controlName="business_type" [options]="business_type_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.business_type" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number label="需求面積" controlName="demanded_area"
            [control]="queryForm.controls.demanded_area" [maxFractionDigits]="3" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="商品出產地" controlName="country_of_origin" [control]="queryForm.controls.country_of_origin"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="備註" controlName="remarks" [control]="queryForm.controls.remarks"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="TLS12010"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      (delete)="onDelete($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showCheckBox]="true"
      dataKey="id"
      [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
      [isRowSelectable]="isRowSelectable"
    ></app-table>
  </div>
</div>
