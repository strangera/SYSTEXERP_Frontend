<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 銷售日期起迄 -->
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            calendarType="dateRange"
            [startControl]="queryForm.controls.Sale_DateStart"
            [endControl]="queryForm.controls.Sale_DateEnd"
            [submitted]="submitted"
          ></app-calendar-range>

          <!-- 館別(多選) -->
          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="館別"
            controlName="tlt_building"
            [options]="buildingOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.tlt_building"
            [submitted]="submitted"
          ></app-multi-select>

          <!-- 組織代碼/名稱 -->
          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="組織代碼/名稱"
            controlName="Org_ID"
            [options]="orgOptions"
            optionLabel="Name"
            optionValue="No"
            [control]="queryForm.controls.Org_ID"
            [submitted]="submitted"
          ></app-multi-select>

          <!-- 樓層(多選) -->
          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="樓層"
            controlName="tlt_floor"
            [options]="floorOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.tlt_floor"
            [submitted]="submitted"
          ></app-multi-select>

          <!-- 收銀機號(多選) -->
          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="收銀機號"
            controlName="ECR_No"
            [options]="ecrOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.ECR_No"
            [submitted]="submitted"
          ></app-multi-select>

          <!-- 專櫃編號(多選) -->
          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="專櫃編號"
            controlName="TLT_No"
            [options]="tltOptions"
            optionLabel="label"
            optionValue="value"
            [control]="queryForm.controls.TLT_No"
            [submitted]="submitted"
          ></app-multi-select>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="TLS26020"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    dataKey="tlt_no"
    [totalRecords]="totalRecords"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryFunction"
    [lazy]="true"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [showReportMode]="false"
    [expansionColumns]="expansionColumns"
    expansionDataKey="id"
    [expansionLoadFn]="loadDetails.bind(this)"
    [expansionMultiSortMeta]="[
      { field: 'TXN_DATE', order: -1 },
      { field: 'ECR_NO', order: 1 },
      { field: 'TXN_NO', order: -1 },
    ]"
    [footerData]="footerData"
  >
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button
            styleClass="p-2"
            label="預售總表.PDF"
            [loading]="exportPdfLoading"
            icon="pi pi-file-pdf"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="預售總表.xlsx"
            [loading]="exportExcelLoading"
            icon="pi pi-file-excel"
            (click)="onExportExcel()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
