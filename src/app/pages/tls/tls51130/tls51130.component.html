<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品牌 (編號/名稱)"
              controlName="LOGO_No"
              [options]="LOGOOptions"
              [control]="queryForm.controls.LOGO_No"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類 (編號/名稱)"
              [options]="CAT_LOptions"
              [control]="queryForm.controls.CAT_LNo"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    apiUrl="queryTLS51130"
    tableKey="TLS51130"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"

    [lazy]="true"
    (lazyLoadData)="onLazy($event)"

    [loading]="loading"
    [scrollable]="true"

    [showManage]="true"
    (detail)="onDetail($event)"
    (edit)="onEdit($event)"
    [showCheckBox]="true"
    [showDelete]="true"
    (delete)="onDelete($event)"

    dataKey="id"
    [multiSortMeta]="[{ field: 'LOGO_No', order: 1 }]"
  ></app-table>
</div>
