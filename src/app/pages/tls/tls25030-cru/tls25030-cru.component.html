<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">

        <!-- 單據編號（Edit/Read 顯示） -->
        <div class="col-12 md:col-6 lg:col-4" *ngIf="crudstatus !== CRUD.Create">
          <app-input-text
            label="單據編號"
            controlName="fine_no"
            [control]="dataForm.controls.fine_no"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 專櫃編號 -->
        <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號"
              controlName="tlt_no"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="dataForm.controls.tlt_no"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

        <!-- 合約編號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="合約編號"
            controlName="talent_id"
            [control]="dataForm.controls.talent_id"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 開立單位 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="開立單位"
            controlName="org_id"
            [options]="orgOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.org_id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 違規日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="違規日期"
            controlName="fine_date"
            [control]="dataForm.controls.fine_date"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 金額 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="金額"
            controlName="fine_amount"
            [control]="dataForm.controls.fine_amount"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 違規條文 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="違規條文"
            controlName="Violation_type"
            [options]="violationTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.Violation_type"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 繳款方式 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="繳款方式"
            controlName="pay_type"
            [options]="payTypeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.pay_type"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- 扣款日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="扣款日期"
            controlName="deduct_date"
            [control]="dataForm.controls.deduct_date"
            [submitted]="submitted"
          ></app-calendar>
        </div>

        <!-- 違約事項說明 -->
        <div class="col-12">
          <app-input-text
            label="違約事項說明"
            controlName="Violation_Facts"
            [control]="dataForm.controls.Violation_Facts"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 備註 -->
        <div class="col-12 md:col-6">
          <app-input-text
            label="違約其他-說明"
            controlName="violation_otherdesc"
            [control]="dataForm.controls.violation_otherdesc"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <div class="col-12 md:col-6">
          <app-input-text
            label="繳款其他-說明"
            controlName="pay_otherdesc"
            [control]="dataForm.controls.pay_otherdesc"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <div class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3" *ngIf="!isRead">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
