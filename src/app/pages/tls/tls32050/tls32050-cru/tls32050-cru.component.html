<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [header]="rowData?.OrgName ?? ''"
  [modal]="true"
  [maximizable]="true"
  [style]="{ width: '95vw' }"
  [contentStyle]="{ overflow: 'auto', padding: '0' }"
>
  <app-table-report
    tableKey="tls32050-detail"
    [lastQueryBody]="historyRequestBody"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [showDelete]="false"
    [showEdit]="false"
    [showManage]="false"
    [loading]="loading"
    [queryFunction]="detailQueryFn"
    [exportContext]="{ apiUrl: 'queryTLS32060' }"
  ></app-table-report>
</p-dialog>
