<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions" optionLabel="label" optionValue="No" [control]="queryForm.controls.HOS_No"
            [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandCodeOptions" optionLabel="label" optionValue="No" [control]="queryForm.controls.LOGO_No"
            [submitted]="submitted" />
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No" [options]="vendorOptions"
            optionLabel="label" optionValue="No" [control]="queryForm.controls.VEN_No" [submitted]="submitted" />
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.ODM_Date_Start" [endControl]="queryForm.controls.ODM_Date_End"
            [submitted]="submitted" />
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="單據類型" controlName="ODM_Type"
            [options]="documentTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.ODM_Type" [submitted]="submitted"></app-multi-select>
          <app-multi-select label="單據狀態" class="col-12 md:col-6 lg:col-4" controlName="Status"
            [options]="documentStatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.Status" [submitted]="submitted"></app-multi-select>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="驗收/驗退單號" controlName="ODM_No"
            [control]="queryForm.controls.ODM_No" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="顯示方式" controlName="DisplayMode"
            [options]="displayModeOptions" optionLabel="label" optionValue="value" [filter]="false"
            [control]="queryForm.controls.DisplayMode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="tls57100" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [showReportMode]="false"
    [queryFunction]="tls57100Service.queryTLS57100.bind(tls57100Service)" [loading]="loading">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出驗收/驗退單據統計表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出驗收/驗退單據統計表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
