<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 倉別 (對應 HOS_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.HOS_No"
            [submitted]="submitted" />
          <!-- 品牌代碼 (對應 LOGO_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.LOGO_No"
            [submitted]="submitted" />
          <!-- 廠商編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No" [options]="vendorOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted" />
          <!-- 申請日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted" />
          <!-- 審核日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted" />
          <!-- 單據類型 -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="單據類型" controlName="ODM_Type"
            [options]="documentTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.ODM_Type" [submitted]="submitted"></app-multi-select>
          <!-- 驗收/驗退單號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="驗收/驗退單號" controlName="ODM_No"
            [control]="queryForm.controls.ODM_No" [submitted]="submitted"></app-input-text>
          <!-- 顯示方式 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="顯示方式" controlName="DisplayMode"
            [options]="displayModeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.DisplayMode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords" [showDelete]="false"
    [showReportMode]="false" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [showManage]="false">
  </app-table>
</div>
