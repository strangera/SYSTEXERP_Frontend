<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="dataForm.controls.SYS_StoreNo"
                  [submitted]="submitted"></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No"
                  [submitted]="submitted"></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="收銀機名稱" controlName="ECR_GUI_PeriodQty" [control]="dataForm.controls.ECR_Name"
                  [submitted]="submitted"></app-input-text>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="機台類型" controlName="ECR_Type" [options]="ECR_Type_Option" optionLabel="label"
                  optionValue="value" [control]="dataForm.controls.ECR_Type" [submitted]="submitted"></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="機台所屬專櫃編號" controlName="ECR_TLT_No" [control]="dataForm.controls.ECR_TLT_No"
                  [submitted]="submitted"></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="機台所屬專櫃名稱" controlName="ECR_TLT_Name" [control]="dataForm.controls.ECR_TLT_Name"
                  [submitted]="submitted"></app-input-text>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="機台所屬收銀員" controlName="ECR_USR_No" [control]="dataForm.controls.ECR_USR_No"
                  [submitted]="submitted"></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="機台所屬收銀員姓名" controlName="ECR_USR_Name" [control]="dataForm.controls.ECR_USR_Name"
                  [submitted]="submitted"></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="收銀機狀態" controlName="ECR_Status" [options]="ECR_Status_Option" optionLabel="label"
                  optionValue="value" [control]="dataForm.controls.ECR_Status" [submitted]="submitted"></app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="啟用日期"
                  [control]="dataForm.controls.ECR_ActiveDate" controlName="ECR_ActiveDate" [submitted]="submitted" />
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="到期日期"
                  [control]="dataForm.controls.ECR_ExpireDate" controlName="ECR_ExpireDate" [submitted]="submitted" />
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="停用日期"
                  [control]="dataForm.controls.ECR_CloseDate" controlName="ECR_CloseDate" [submitted]="submitted" />
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="發票使用類別" controlName="ECR_GUI_Type" [options]="ECR_GUI_Type_Option" optionLabel="label"
                  optionValue="value" [control]="dataForm.controls.ECR_GUI_Type" [submitted]="submitted"></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number label="每期電子發票預設配號數量" controlName="ECR_GUI_PeriodQty" [control]="dataForm.controls.ECR_GUI_PeriodQty"
                  [min]="50" [max]="999999999" [submitted]="submitted"></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number label="電子發票最小安全存量" controlName="ECR_GUI_MinQty" [control]="dataForm.controls.ECR_GUI_MinQty"
                  [min]="50" [max]="999999999" [submitted]="submitted"></app-input-number>
              </div>
            </div>
            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
                *ngIf="!isFormReadable">
                <app-button btnType="cancel" [form]="dataForm"></app-button>
                <app-button btnType="submit"></app-button>
            </div>
        </form>
    </p-panel>
</div>
