<div class="card">
  <!-- 上方功能列 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <!-- 報表區塊 -->
  <div class="card">
    <app-report-table-group 
      [columns]="columns"
      [data]="data"
      [subtotalFields]="[
    'TXN_PayAmt'
 
  ]"
      [enableGrouping]="false"             
      [reportTitle]="'付款別明細表'"
      [currentPage]="1"
      [dateStart]="dateStart"
      [dateEnd]="dateEnd"
      [printedAt]="printedAt"
      [showTotalOnly]="false"
      [pdfSummaryText]="[]"
      [defaultMergedView]="true"
      [showExpandColumn]="true"
      [detailFieldKeys]="['TXN_Date']"
 >
    </app-report-table-group>
  </div>
</div>
