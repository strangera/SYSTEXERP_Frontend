<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button
        btnType="create"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" label="Excel轉入" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="專櫃編號"
              controlName="counterID"
              [control]="queryForm.controls.counterID"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="扣款項目"
              controlName="deductionItems"
              [options]="deductionItemsOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.deductionItems"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              [useGrouping]="false"
              label="會計科目代號"
              controlName="accountingCode"
              [control]="queryForm.controls.accountingCode"
              [submitted]="submitted"
            >
              >
            </app-input-number>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織"
              controlName="organization"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.organization"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="扣款日期"
              [control]="queryForm.controls.debitDay"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="扣款年月"
              [control]="queryForm.controls.onedatemm"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-4 lg:col-4">
            <app-dropdown
              label="是否開立發票"
              controlName="establish"
              [options]="establishOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.establish"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="維護日"
              [control]="queryForm.controls.maintenanceDay"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="建立者"
              controlName="builder"
              [options]="builderOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.builder"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="樓層"
              controlName="floor"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.floor"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動代碼/名稱"
              controlName="eventCode"
              [options]="eventCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.eventCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid"></div>
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
