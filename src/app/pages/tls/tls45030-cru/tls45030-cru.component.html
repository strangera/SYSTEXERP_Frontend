<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateOne" label="交易日期" controlName="TXN_Date"
                        [control]="dataForm.controls.TXN_Date" [submitted]="submitted">
                    </app-calendar>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="收銀機所屬門市店號" controlName="SYS_StoreNo"
                        [control]="dataForm.controls.SYS_StoreNo" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="交易序號" controlName="TXN_No" [control]="dataForm.controls.TXN_No"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="班別" controlName="FNS_Class" [control]="dataForm.controls.FNS_Class"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="dateTimeOne" label="操作日期時間" controlName="FNS_DateTime"
                        [control]="dataForm.controls.FNS_DateTime" [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number [useGrouping]="false" label="收銀員編號" controlName="FNS_Op_Cod"
                        [control]="dataForm.controls.FNS_Op_Cod" [submitted]="submitted">
                    </app-input-number>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="方式" controlName="FNS_Flag" [options]="FNS_Flag_Option" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.FNS_Flag" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="金額" controlName="FNS_Amount" [control]="dataForm.controls.FNS_Amount"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="非銷售資料" controlName="FNS_Data" [control]="dataForm.controls.FNS_Data"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="專櫃編號" controlName="TLT_No" [control]="dataForm.controls.TLT_No"
                        [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>

        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
