<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <!-- 新增扣款 -->
    <form *ngIf="currentCreateType === 'normal'" [formGroup]="dataFormNormal" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <!-- 扣款項目 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="扣款項目" controlName="CAP_Item"
          [options]="FilterCAP_ItemOptions" optionLabel="label" optionValue="value"
          [control]="dataFormNormal.controls.CAP_Item" [submitted]="submitted"
          (valueChange)="onCAP_ItemChange($event)"></app-dropdown>

        <!-- 扣款名稱 (唯讀) -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="扣款名稱" controlName="CAP_Name"
          [control]="dataFormNormal.controls.CAP_Name" [submitted]="submitted"></app-input-text>

        <!-- 扣款日期（關閉日曆時同步更新下方明細的 tpy_date） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar label="扣款日期" controlName="tpy_date" calendarType="dateOne"
            [control]="dataFormNormal.controls.tpy_date" [submitted]="submitted"
            (calendarEvent)="onNormalFormDateChange($event)"></app-calendar>
        </div>

        <!-- 扣款金額（變更時同步更新下方明細的 tpy_net） -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="扣款金額" controlName="tpy_net" [control]="dataFormNormal.controls.tpy_net"
            [submitted]="submitted" (valueChange)="onNormalFormAmountChange($event)"></app-input-number>
        </div>

        <!-- 課稅別 (唯讀) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="課稅別" controlName="cap_taxtype" [options]="cap_taxtypeOptions" optionLabel="label"
            optionValue="value" [control]="dataFormNormal.controls.cap_taxtype" [submitted]="submitted"
            [disabled]="true"></app-dropdown>
        </div>

        <!-- 會計科目 (唯讀) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="會計科目" controlName="AccNo" [options]="AccNoOptions" optionLabel="label"
            optionValue="value" [control]="dataFormNormal.controls.AccNo" [submitted]="submitted"
            [disabled]="true"></app-dropdown>
        </div>
        <!--
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="組織代號/名稱" controlName="org_id" [options]="org_idOptions"
            [control]="dataFormNormal.controls.org_id" [submitted]="submitted"></app-dropdown>
        </div> -->

        <!-- 是否開立發票 (可修改) -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="是否開立發票" groupname="GUI_FLAGOption" [control]="dataFormNormal.controls.GUI_FLAG"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>
      </div>

      <!-- table-edit：一般扣款明細（點擊開啟專櫃選擇彈窗） -->
      <app-table-edit #normalTable title="整批新增專櫃" tableKey="talent_id" [data]="data" class="col-12" dataKey="rowId"
        [columns]="columnsNormal" (selectionChange)="normalSelectedItems = $event" [selectedItems]="normalSelectedItems"
        (dataChange)="onCounterDataChange($event)" (fieldChange)="onFieldChange($event)" [loading]="loading"
        [tableRequired]="true" [disabled]="isDetailMode" [showCheckBox]="!isDetailMode" [showDelete]="!isDetailMode"
        [canInsert]="false" [showInsert]="!isDetailMode" [enableTabInsert]="true"
        (insert)="onOpenTalentDialog()"></app-table-edit>

      <!-- 按鈕 -->
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataFormNormal" (clickEvent)="onLocalCancel('normal')" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
    <!-- 新增專櫃扣款 -->
    <form *ngIf="currentCreateType === 'counter'" [formGroup]="dataFormCounter" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4" style="cursor:pointer" role="button" tabindex="0" aria-label="專櫃編號/名稱 選擇"
          (click)="onOpenTalentDialog(); $event.stopPropagation()"
          (keydown.enter)="$event.preventDefault(); onOpenTalentDialog()">
          <app-input-text label="專櫃編號/名稱" controlName="tlt_no_display" [control]="counterTltDisplayControl"
            [submitted]="submitted" [readonly]="true" [customPlaceholder]="'點擊選取專櫃編號'"
            [alwaysShowPlaceholder]="true"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number label="總金額" controlName="totalCash" [control]="dataFormCounter.controls.totalCash"
            [submitted]="submitted"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="活動代碼/名稱" controlName="pod_no" [options]="pod_noOptions" optionLabel="label"
            optionValue="value" [control]="dataFormCounter.controls.pod_no" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="招募編號" controlName="apply_no" [control]="dataFormCounter.controls.apply_no"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="版次" controlName="contract_subno" [control]="dataFormCounter.controls.contract_subno"
            [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="組織代號/名稱" controlName="org_id" [options]="org_idOptions" optionLabel="label"
            optionValue="value" [control]="dataFormCounter.controls.org_id" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="營運起始日" controlName="tlt_contract_bdate"
            [control]="dataFormCounter.controls.tlt_contract_bdate" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="營運截止日" controlName="tlt_contract_edate"
            [control]="dataFormCounter.controls.tlt_contract_edate" [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <app-table-edit #counterTable title="新增專櫃扣款" tableKey="TLSD010Detail" [data]="data" class="col-12" dataKey="rowId"
        [columns]="columnsCounter" (selectionChange)="counterSelectedItems = $event"
        [selectedItems]="counterSelectedItems" (dataChange)="onCounterDataChange($event)" dataStatusField="status"
        [loading]="loading" [tableRequired]="true" [disabled]="isDetailMode" [showCheckBox]="!isDetailMode"
        [showDelete]="!isDetailMode" [canInsert]="!isDetailMode" [showInsert]="false"></app-table-edit>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataFormCounter" (clickEvent)="onLocalCancel('counter')" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="talentDialogVisible" header="選擇專櫃" (visibleChange)="talentDialogVisible = $event"
  (save)="onTalentDialogSave()" [disable]="!selectedTalents || selectedTalents.length === 0"
  [showFooter]="currentCreateType !== 'counter'">

  <form [formGroup]="talentDialogQueryForm" (ngSubmit)="onTalentDialogQuery(talentDialogQueryForm)">
    <div class="grid p-fluid">
      <app-calendar class="col-12 md:col-6 lg:col-4" label="扣款日期" controlName="tpy_date" calendarType="dateOne"
        [control]="talentDialogQueryForm.controls.tpy_date"></app-calendar>
      <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_no"
        [control]="talentDialogQueryForm.controls.tlt_no"></app-input-text>
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="talentDialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="talentDialogLoading"></app-button>
    </div>
  </form>
  <hr />

  <app-table-report tableKey="tls2d010TalentDialogTable" dataKey="talent_id" [data]="talentDialogData"
    [columns]="talentDialogColumns" [selectedItems]="selectedTalents" (selectionChange)="selectedTalents = $event"
    [showCaption]="false" [showFilter]="false" [showReportMode]="false" [showExcel]="false" [showDelete]="false"
    [showManage]="false" [showCheckBox]="currentCreateType !== 'counter'" [totalRecords]="talentTotalRecords"
    [lastQueryBody]="talentLastQueryBody" [queryFunction]="queryTalentDialog" [loading]="talentDialogLoading"
    (itemClick)="onTalentDialogRowClick($event)" [ItemSize]="24.34">
  </app-table-report>
</app-dialog>
