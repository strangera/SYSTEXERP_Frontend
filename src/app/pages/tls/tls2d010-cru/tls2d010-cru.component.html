<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="專櫃編號/名稱"
            controlName="tlt_no"
            [options]="tlt_noOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.tlt_no"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="總金額"
            controlName="totalCash"
            [control]="dataForm.controls.totalCash"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="活動代碼/名稱"
            controlName="pod_no"
            [options]="pod_noOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.pod_no"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="契約編號"
            controlName="contract_no"
            [control]="dataForm.controls.contract_no"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="版次"
            controlName="contract_subno"
            [control]="dataForm.controls.contract_subno"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="營運起始日"
            controlName="tlt_contract_bdate"
            [control]="dataForm.controls.tlt_contract_bdate"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="營運起始日"
            controlName="tlt_contract_edate"
            [control]="dataForm.controls.tlt_contract_edate"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <!-- <app-table
        dataKey="id"
        [data]="data6"
        [columns]="columns6"
        [showRowEdit]="true"
        [showInsert]="true"
        [rowEditDisabled]="rowEditDisabled"
        [showEdit]="false"
        [showDetail]="false"
        [insertRowData]="true"
        [showCheckBox]="true"
        [selectedItems]="selectedItems6"
        (selectionChange)="selectedItems6 = $event"
        [deleteData]="true"
        (dataChange)="data6 = $event"
        [defaultInsertData]="defaultInsertData"
      ></app-table> -->
     <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
