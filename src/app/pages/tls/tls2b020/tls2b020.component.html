<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button> -->
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="銷售年/月"
              [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀員代號"
              controlName="USR_No"
              [options]="cashierOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.USR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
      
        
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="收銀員區分"
              groupname="cashierradio"
              [control]="queryForm.controls.cashierDistinction"
              [options]="cashierDistinctionOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="溢欠狀態"
              groupname="overflowradio"
              [control]="queryForm.controls.overflowStatus"
              [options]="overflowStatusOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
      
      <h6>最近關帳日期：{{ closeDate }}</h6>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="clear" (click)="onClearForm()"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>
      </form>
    </p-accordionTab>
    
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS2B010"
    [data]="data"
    [columns]="columns"
    dataKey="Rep_YYYYMM"
    [multiSortMeta]="[{ field: 'Rep_YYYYMM', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    [showCheckBox]="false"
    [showSubtotal]="true"
    [subtotalFields]="subtotalFields"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
<div class="flex justify-content-end gap-6 text-lg font-bold mt-3 pr-3">
<div class="flex justify-content-end gap-6 text-lg font-bold mt-3 pr-3">
  {{ overflowStatusDisplay }}
</div>
</div>
