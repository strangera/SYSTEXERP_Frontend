<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <!-- 日期查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12">
            <B><u>日期查詢條件</u></B>
            <!-- 報表類型：預設為 3=月營業報表 -->
            <app-radiobutton groupname="DayType" [control]="queryForm.controls.DayType" [submitted]="submitted"
              [options]="DayTypeOptions"></app-radiobutton>
          </div>
        </div>

        <!--
          【變更】移除 週/月/半年/年 報表的專屬選擇器。
          輔助計算欄位 year/week/month/halfYear 仍保留在 Form Group 中，
          但由 TypeScript 邏輯自動設定當前值，不再由使用者選擇。
        -->
        <div class="grid p-fluid">
          <!-- 由於所有報表類型都將直接操作 BaseDateFrom/To 和 CompareDateFrom/To，
               因此此處不需再顯示額外的年/月/週/半年選擇器 -->
        </div>

        <hr>

        <!-- 基準日期範圍 (必填) - 【變更】使用 app-calendar-range-quick 且始終啟用 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="基準日期區間" [startControl]="queryForm.controls.BaseDateFrom"
              [endControl]="queryForm.controls.BaseDateTo" [submitted]="submitted" />
          </div>
        </div>

        <!-- 比較日期範圍 (必填) - 【變更】使用 app-calendar-range-quick 且始終啟用 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="比較日期區間" [startControl]="queryForm.controls.CompareDateFrom"
              [endControl]="queryForm.controls.CompareDateTo" [submitted]="submitted" />
          </div>
        </div>

        <hr>
        <!-- 合約查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12">
            <span>
              <B><u>合約查詢條件</u></B>
            </span>
          </div>
          <!-- 新增：館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="BuildingList" [options]="auditoriumOptions | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.BuildingList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 原有欄位 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="FloorList" [options]="floorOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.FloorList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="AreaList" [options]="regionOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.AreaList" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類" controlName="BusTypeList" [options]="businessTypeCodeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.BusTypeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="中分類" controlName="BusClassList" [options]="BusClassListOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.BusClassList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="CounterKindList" [options]="operationsOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CounterKindList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="TermTypeList" [options]="commissionTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TermTypeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織" controlName="OrgList" [options]="organizationOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.OrgList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="TalentNoList" [options]="counterCodeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TalentNoList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="銷售金額是否含稅" groupname="taxradio" [control]="queryForm.controls.TaxMode"
              [options]="taxOptions" [submitted]="submitted"></app-radiobutton>
          </div>
          <!-- 新增：是否開立業主發票 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否開立業主發票" groupname="invoiceRadio" [control]="queryForm.controls.OwnerInvFlag"
              [options]="ownerInvoiceOptions" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report dataKey="talent_id" [data]="data" [columns]="columns" [showDelete]="false" [showManage]="false"
    [totalRecords]="totalRecords" [loading]="loading" [columnGroup]="columnGroup" [lazy]="false"
    [footerData]="footerData" [showReportMode]="false" [subTotalData]="subFooterData" [showSort]="false"
    [lastQueryBody]="historyRequestBody" [queryFunction]="tls32020Service.queryTLS32020.bind(tls32020Service)"
    groupRowsBy="YM">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出銷售排名分析報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出銷售排名分析報表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
