<div class="tls32020-report">
  <app-table-report
    [dataKey]="dataKey"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [lazy]="lazy"
    [columnGroup]="columnGroup"
    [topColumnGroup]="topColumnGroup"
    [footerData]="footerData"
    [subTotalData]="subTotalData"
    [lastQueryBody]="lastQueryBody"
    [groupRowsBy]="groupRowsBy"
    [showSubTotalGroupValue]="showSubTotalGroupValue"
    [showManage]="showManage"
    [showEdit]="showEdit"
    [showDetail]="showDetail"
    [showDelete]="showDelete"
  >
    <header>
      <ng-content select="[reportHeader]"></ng-content>
    </header>
  </app-table-report>
</div>
