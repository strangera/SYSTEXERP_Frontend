<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- Radio + 銷售日期 -->
          <div class="col-12 md:col-6 lg:col-4">
  
                <app-calendar-range-quick
                  calendarType="dateRange"
                  label="日期"
                  [startControl]="queryForm.controls.saleDateStart"
                  [endControl]="queryForm.controls.saleDateEnd"
                  [submitted]="submitted"
                ></app-calendar-range-quick>
              </div>


          <!-- 卡種 -->
             <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="卡種"
              controlName="CRD_Type"
              [options]="cardTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.BNK_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>



          <!-- 館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
                  
         
                    <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 組織代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button btnType="report" label="報表模式" (clickEvent)="goToReportMode()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS23130"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    dataKey="BNK_No"
    [multiSortMeta]="[{ field: 'BNK_No', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
<p-dialog header="限制筆數" [(visible)]="showPageSizeDialog" [modal]="true" [closable]="false" [style]="{ width: '300px' }">
  <div class="p-fluid">
    <div class="field">
      <label for="pageSize">限制筆數</label>
      <input id="pageSize" type="number" pInputText [(ngModel)]="customPageSize" min="1" style="width: 100%" />
    </div>

    </div>
    <ng-template pTemplate="footer">
      <button type="button" pButton label="取消" class="p-button-text" (click)="showPageSizeDialog = false"></button>
      <button type="button" pButton label="確定" (click)="confirmPageSizeAndNavigate()" [loading]="loading"></button>
    </ng-template>

</p-dialog>
