<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <!-- 日期查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-12">
            <app-radiobutton groupname="reportType" [control]="dateForm.controls.reportType"
              [options]="reportTypeOptions" [submitted]="submitted"
              (valueChange)="onReportTypeChange($event)"></app-radiobutton>
          </div>
          <!-- 日營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '1'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 日期 -->
              <div class="col-12">
                <app-calendar calendarType="dateOne" label="日期" [control]="dateForm.controls.onedatedd"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
          </div>
          <!-- 週營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '2'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 年度 -->
              <div class="col-12">
                <app-calendar calendarType="dateYearOne" label="年度" [control]="dateForm.controls.onedateyy"
                  [submitted]="submitted"></app-calendar>
              </div>
              <!-- 週數 -->
              <div class="col-12">
                <app-input-text label="週數" controlName="weeks" [control]="dateForm.controls.weeks"
                  (blurEvent)="queryWeek($event)" [submitted]="submitted"></app-input-text>
              </div>
              <!-- 基準日期範圍 -->
              <div class="col-12">
                <app-calendar-range-quick label="日期範圍" [startControl]="dateForm.controls.startdate"
                  [endControl]="dateForm.controls.enddate" [submitted]="submitted" />
              </div>
            </div>
          </div>
          <!-- 月營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '3'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 年月 -->
              <div class="col-12">
                <app-calendar calendarType="dateMonthOne" label="年月" [control]="dateForm.controls.onedatemm"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
          </div>
          <!-- 半年營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '4'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 年度 -->
              <div class="col-12">
                <app-calendar calendarType="dateYearOne" label="年度" [control]="dateForm.controls.halfyear_onedateyy"
                  [submitted]="submitted"></app-calendar>
              </div>
              <!-- 半年別 -->
              <div class="col-12">
                <app-dropdown label="半年別" controlName="halfyear" [options]="halfyearOptions" optionLabel="label"
                  optionValue="value" [control]="dateForm.controls.halfyear" [submitted]="submitted"></app-dropdown>
              </div>
            </div>
          </div>
          <!-- 年營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '5'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 年度 -->
              <div class="col-12">
                <app-calendar calendarType="dateYearOne" label="年度" [control]="dateForm.controls.year_onedateyy"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
          </div>
          <!-- 區間營業報表 -->
          <div class="flex col-12" *ngIf="dateForm.controls.reportType.value === '6'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <!-- 基準日期範圍 -->
              <div class="col-12">
                <app-calendar-range-quick label="日期範圍" [startControl]="dateForm.controls.sad_startdate"
                  [endControl]="dateForm.controls.sad_enddate" [submitted]="submitted" />
              </div>
            </div>
          </div>
        </div>
        <hr>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="Buildings" [options]="tlt_building_Option" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.Buildings" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="Floors" [options]="tlt_floor_Option" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.Floors" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="Areas" [options]="area_no_Option" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.Areas" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼/名稱" controlName="CatLNos" [options]="bus_type_Option" optionLabel="label"
              optionValue="No" [control]="queryForm.controls.CatLNos" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="中分類代碼/名稱" controlName="CatMNos" [options]="bus_class_Option" optionLabel="label"
              [control]="queryForm.controls.CatMNos" [submitted]="submitted" [group]="true"
              optionGroupLabel="CatLNos" optionGroupChildren="items"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="CabinetKinds" [options]="tlt_kind_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CabinetKinds" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="ChargeTypes" [options]="tlt_term_type" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ChargeTypes"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織" controlName="OrgIds" [options]="org_id_Option" optionLabel="label"
              optionValue="No" [control]="queryForm.controls.OrgIds" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="銷售金額是否含稅" controlName="IncludeTax" [control]="queryForm.controls.IncludeTax" [options]="TaxType_Option"
              [submitted]="submitted"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn label="是否開立業主發票" controlName="BizInvFlag" [control]="queryForm.controls.BizInvFlag"
              [submitted]="submitted" [showAll]="true"></app-radiobutton-yn>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls31080" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns" [columnGroup]="columnGroup"
    [totalRecords]="totalRecords" (detail)="onDetail1($event)" [showDelete]="false" [showEdit]="false"
    [showManage]="true" [showReportMode]="false" [queryFunction]="tls31080Service.queryTLS31080.bind(tls31080Service)"
    [footerData]="footershowTotal" [footerPercentData]="footershowPercent">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="各型態之營業報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(queryForm, false)" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="各型態之營業報表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(queryForm, true)" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
