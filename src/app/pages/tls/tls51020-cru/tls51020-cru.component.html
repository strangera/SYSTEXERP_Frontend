<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="中分類代碼"
            controlName="CAT_MNo"
            [control]="dataForm.controls.CAT_MNo"
            [submitted]="submitted"
            [disabled]="isCATMNoDisabled"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="中分類名稱"
            controlName="CAT_MName"
            [control]="dataForm.controls.CAT_MName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="大分類代碼/名稱"
            controlName="CAT_LNo"
            [options]="bigCategoryOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.CAT_LNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <app-input-textarea
          class="col-12 md:col-6 lg:col-5"
          label="說明"
          controlName="textarea"
          [control]="dataForm.controls.CAT_MRemark"
          [submitted]="submitted"
        />
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="smartclear"
          (clickEvent)="clearFormExceptCATMNo()"
        />
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
