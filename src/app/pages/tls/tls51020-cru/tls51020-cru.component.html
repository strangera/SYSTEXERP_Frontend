<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="中分類代碼" controlName="CAT_MNo" [control]="dataForm.controls.CAT_MNo"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="中分類名稱" controlName="CAT_MName" [control]="dataForm.controls.CAT_MName"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="大分類代碼/名稱" controlName="CAT_LNo" [options]="bigCategoryOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.CAT_LNo" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <hr>
      <div class="grid p-fluid">
        <app-input-textarea class="col-12 md:col-6 lg:col-5" label="說明" controlName="textarea"
          [control]="dataForm.controls.CAT_MRemark" [submitted]="submitted" />
      </div>
      <hr>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
