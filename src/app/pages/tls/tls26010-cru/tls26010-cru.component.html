<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range calendarType="dateRange" label="截止日期" [startControl]="dataForm.controls.age"
            [endControl]="dataForm.controls.age" [submitted]="submitted">
          </app-calendar-range>
        </div>

      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
<app-button btnType="create" label="收銀機號查詢" icon="pi pi-search"></app-button>
<div class="card">
  <div class="col-12">
    <app-data-table-check [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table-check>
  </div>
</div>
<app-button btnType="create" label="專櫃編號查詢" icon="pi pi-search"></app-button>
<div class="card">
  <div class="col-12">
    <app-data-table-check [data]="data2" [columns]="columns2" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table-check>
  </div>
</div>
