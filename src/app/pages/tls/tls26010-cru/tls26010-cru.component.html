<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4"
                        label="預售活動編號"
                        controlName="pod_no"
                        [control]="df().pod_no"
                        [submitted]="submitted"
                        [disabled]="!0">
        </app-input-text>
        <app-calendar-range class="col-12 md:col-6 lg:col-8"
                            calendarType="dateRange"
                            label="預售期間"
                            [startControl]="df().pod_sdate"
                            [endControl]="df().pod_edate"
                            [submitted]="submitted">
        </app-calendar-range>
        <app-input-text class="col-12 md:col-8 lg:col-8"
                        label="預售名稱"
                        controlName="pod_desc"
                        [control]="df().pod_desc"
                        [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-4 lg:col-4"
                        label="核准狀態"
                        controlName="pod_status"
                        [control]="df().pod_status"
                        [disabled]="!0">
        </app-input-text>
      </div>
      <div *ngIf="!isFormReadable"
           class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel"
                    [form]="dataForm"></app-button>
        <app-button btnType="submit"
                    [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
<div class="card">
  <div *ngIf="!isFormReadable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增收銀機"
                  [loading]="service.ecrLoading()"
                  (click)="onOpenDialog('ecr')"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="!0"
               [showEdit]="!1"
               [showDetail]="!1"
               [showManage]="!1"
               [showReportMode]="!1"
               [isRowSelectable]="service.isRowSelectable"
               (lazyLoadData)="onLazyLoadData($event, dataForm); onSubmit()"
               [lazy]="!0"
               [data]="ecrTableData()"
               [dataKey]="'ecr_no'"
               [tableKey]="'TLS26010_ECR'"
               [loading]="service.tableLoading()"
               [columns]="columns">
    </app-table>
  </div>
</div>
<div class="card">
  <div *ngIf="!isFormReadable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增專櫃"
                  [loading]="service.tltLoading()"
                  (click)="onOpenDialog('tlt')"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="!0"
               [showEdit]="!1"
               [showDetail]="!1"
               [showManage]="!1"
               [showReportMode]="!1"
               [isRowSelectable]="service.isRowSelectable"
               [showExcel]="isFormEditable"
               (exportExcel)="onExportExcel()"
               (importExcel)="onImportExcel($event)"
               (lazyLoadData)="onLazyLoadData($event, dataForm); onSubmit()"
               [lazy]="!0"
               [loading]="service.tableLoading()"
               [data]="tltTableData()"
               [dataKey]="'tlt_no'"
               [tableKey]="'TLS26010_TLT'"
               [columns]="columns2">
    </app-table>
  </div>
</div>

<app-dialog [visible]="!!dialogVisible()"
            [header]="dialogHeader()"
            (visibleChange)="onVisibleChange($event); dt.dt.reset()"
            (save)="onDialogSubmit()"
            [height]="'auto'"
            [loading]="loading">
  <form [formGroup]="dataForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="館別"
                          controlName="sys3800"
                          [options]="service.sys3800Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="df().sys3800"
                          [loading]="service.sys3800Loading()"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="樓層"
                          controlName="sys3900"
                          [options]="service.sys3900Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="df().sys3900"
                          [loading]="service.sys3900Loading()"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="區域"
                          controlName="sys3A00"
                          [options]="service.sys3A00Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="df().sys3A00"
                          [loading]="service.sys3A00Loading()"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12">
        <app-table #dt
                   [showCheckBox]="!0"
                   [showManage]="!1"
                   [showDelete]="!1"
                   [showReportMode]="!1"
                   [rows]="10"
                   [selectedItems]="dialogSelectedData"
                   (selectionChange)="onSelectionChange($event)"
                   [data]="dialogData()"
                   [dataKey]="dialogDataKey()"
                   [tableKey]="dialogTableKey()"
                   [columns]="dialogColumn()"
                   [loading]="dialogLoading()">
        </app-table>
      </div>
      <!-- <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select *ngIf="dialogVisible() === 'ecr'"
                          [appendTo]="'body'"
                          label="收銀機號"
                          controlName="ecr_nos"
                          [options]="service.ECRList"
                          optionLabel="ecr_name"
                          optionValue="ecr_no"
                          [control]="df().ecr_nos"
                          [submitted]="submitted"></app-multi-select>
        <app-multi-select *ngIf="dialogVisible() === 'tlt'"
                          [appendTo]="'body'"
                          label="專櫃名稱"
                          controlName="tlt_nos"
                          [options]="service.TLTList"
                          optionLabel="tlt_name"
                          optionValue="tlt_no"
                          [control]="df().tlt_nos"
                          [submitted]="submitted"></app-multi-select>
      </div> -->
    </div>
  </form>
</app-dialog>
