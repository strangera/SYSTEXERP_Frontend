<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="預售編號"
          controlName="pod_no"
          [control]="dataForm.controls.pod_no"
          [readonly]="true"
          [submitted]="submitted"
          customPlaceholder="系統自動產生"
        ></app-input-text>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="預售名稱"
          controlName="pod_desc"
          [control]="dataForm.controls.pod_desc"
          [submitted]="submitted"
        ></app-input-text>
        <app-calendar-range
          class="col-12 md:col-6 lg:col-4"
          label="預售期間"
          calendarType="dateRange"
          [startControl]="dataForm.controls.pod_sdate"
          [endControl]="dataForm.controls.pod_edate"
          [submitted]="submitted"
        ></app-calendar-range>
      </div>
      <div class="grid p-fluid">
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="核准狀態"
          controlName="pod_status"
          [options]="pod_status_Option"
          optionLabel="label"
          optionValue="value"
          [control]="dataForm.controls.pod_status"
          [readonly]="true"
          [submitted]="submitted"
        ></app-dropdown>
        <app-input-text
          class="col-12 md:col-6 lg:col-4"
          label="核准人員"
          controlName="approved_usr_name"
          [control]="dataForm.controls.approved_usr_name"
          [readonly]="true"
          [submitted]="submitted"
        ></app-input-text>
        <app-calendar
          class="col-12 md:col-6 lg:col-4"
          calendarType="dateOne"
          label="核准日期"
          controlName="approved_date"
          [control]="dataForm.controls.approved_date"
          [submitted]="submitted"
          [readonly]="true"
          customPlaceholder="核准後自動產生"
        ></app-calendar>
      </div>
      <!-- ECR明細檔 -->
      <app-table-edit
        title="收銀機"
        tableKey="ecrTable"
        [dataKey]="'ECR_No'"
        [data]="ecrData"
        class="col-12"
        [columns]="ecrColumn"
        (selectionChange)="selectedECRItems = $event"
        [selectedItems]="selectedECRItems"
        [showCheckBox]="!isFormReadable"
        [showInsert]="!isFormReadable"
        [showDelete]="!isFormReadable"
        [canInsert]="false"
        (insert)="dialogVisible('ecr')"
        [dataStatusValue]="{
          Original: 'original',
          New: 'new',
          Modified: 'modified',
          Deleted: 'deleted',
        }"
        [rowValidate]="validateECR"
        [defaultInsertData]="defaultNewECR"
        (dataChange)="ecrData = $event"
        dataStatusField="status"
        [loading]="ecrLoading"
        [keepDeletedData]="true"
      ></app-table-edit>

      <!-- TLT明細檔 -->
      <app-table-edit
        title="專櫃"
        tableKey="tltTable"
        [dataKey]="'tlt_no'"
        [data]="tltData"
        class="col-12"
        [columns]="tltColumn"
        (selectionChange)="selectedTLTItems = $event"
        [selectedItems]="selectedTLTItems"
        [showCheckBox]="!isFormReadable"
        [showInsert]="!isFormReadable"
        [showDelete]="!isFormReadable"
        [canInsert]="false"
        (insert)="onTltInsertClick()"
        [dataStatusValue]="{
          Original: 'original',
          New: 'new',
          Modified: 'modified',
          Deleted: 'deleted',
        }"
        [rowValidate]="validateTLT"
        (dataChange)="onTltDataChange($event)"
        dataStatusField="status"
        [loading]="tltLoading"
        [keepDeletedData]="true"
        [showExcel]="!isFormReadable"
        [showExcelExport]="true"
        [showExcelImport]="true"
        (exportExcel)="onExportTltExcel()"
        (importExcel)="onImportTltExcel($event)"
      ></app-table-edit>

      <!-- 收銀機 Dialog選單 -->
      <app-dialog
        [visible]="ecrDialogVisible"
        (visibleChange)="ecrDialogVisible = $event"
        [header]="'選擇收銀機'"
        (save)="onDialogECRSubmit()"
        [height]="'auto'"
        [loading]="loading"
      >
        <form [formGroup]="ecrDialogForm">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="館別"
                controlName="sys3800"
                [options]="building_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="ecrDialogForm.controls.sys3800"
                [submitted]="submitted"
              ></app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="樓層"
                controlName="sys3900"
                [options]="floor_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="ecrDialogForm.controls.sys3900"
                [submitted]="submitted"
              ></app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="區域"
                controlName="sys3A00"
                [options]="area_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="ecrDialogForm.controls.sys3A00"
                [submitted]="submitted"
              ></app-dropdown>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="收銀機號"
                controlName="ecr_no"
                [control]="ecrDialogForm.controls.ecr_no"
                [submitted]="submitted"
              ></app-input-text>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="專櫃編號/名稱"
                [options]="tlt_noOption"
                optionLabel="Label"
                optionValue="No"
                [control]="ecrDialogForm.controls.tlt_no"
                [submitted]="submitted"
              ></app-dropdown>
            </div>

            <div class="col-12">
              <app-table
                #ecrDialogTable
                [showCheckBox]="true"
                [showManage]="false"
                [showDelete]="false"
                [showReportMode]="false"
                [rows]="10"
                [selectedItems]="ecrDialogSelected"
                (selectionChange)="onSelectionECRChange($event)"
                [data]="ecrDialogData"
                [dataKey]="'ecr_no'"
                [tableKey]="'ecrDialogTable'"
                [columns]="ecrDialogColumn"
                [loading]="ecrDialogLoading"
              ></app-table>
            </div>
          </div>
        </form>
      </app-dialog>

      <!-- 專櫃 Dialog選單 -->
      <app-dialog
        [visible]="tltDialogVisible"
        (visibleChange)="tltDialogVisible = $event"
        [header]="'選擇專櫃'"
        (save)="onDialogTLTSubmit()"
        [height]="'auto'"
        [loading]="loading"
      >
        <form [formGroup]="tltDialogForm">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="館別"
                controlName="sys3800"
                [options]="building_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="tltDialogForm.controls.sys3800"
                [submitted]="submitted"
              ></app-multi-select>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="樓層"
                controlName="sys3900"
                [options]="floor_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="tltDialogForm.controls.sys3900"
                [submitted]="submitted"
              ></app-multi-select>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="區域"
                controlName="sys3A00"
                [options]="area_Option"
                optionLabel="Name"
                optionValue="No"
                appendTo="body"
                [control]="tltDialogForm.controls.sys3A00"
                [submitted]="submitted"
              ></app-multi-select>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="專櫃編號"
                controlName="tlt_no"
                [control]="tltDialogForm.controls.tlt_no"
                [submitted]="submitted"
              ></app-input-text>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="專櫃名稱"
                controlName="tlt_name"
                [control]="tltDialogForm.controls.tlt_name"
                [submitted]="submitted"
              ></app-input-text>
            </div>

            <div class="col-12">
              <app-table
                #ecrDialogTable
                [showCheckBox]="true"
                [showManage]="false"
                [showDelete]="false"
                [showReportMode]="false"
                [rows]="10"
                [selectedItems]="tltDialogSelected"
                (selectionChange)="onSelectionTLTChange($event)"
                [data]="tltDialogData"
                [dataKey]="'tlt_no'"
                [tableKey]="'tltDialogTable'"
                [columns]="tltDialogColumn"
                [loading]="tltDialogLoading"
              ></app-table>
            </div>
          </div>
        </form>
      </app-dialog>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (click)="reset26010()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
