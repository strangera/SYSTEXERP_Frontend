<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>
  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="預售活動編號"
                          controlName="pod_no"
                          [control]="dataForm.controls.pod_no"
                          [submitted]="submitted"
                          [disabled]="true">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-8">
          <app-calendar-range calendarType="dateRange"
                              label="預售期間"
                              [startControl]="dataForm.controls.pod_sdate"
                              [endControl]="dataForm.controls.pod_edate"
                              [submitted]="submitted">
          </app-calendar-range>
        </div>
        <div class="col-12 md:col-8 lg:col-8">
          <app-input-text label="預售名稱"
                          controlName="pod_desc"
                          [control]="dataForm.controls.pod_desc"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-4 lg:col-4">
          <app-input-text label="核准狀態"
                          controlName="pod_status"
                          [control]="df.pod_status"
                          [disabled]="true">
          </app-input-text>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="clear"
                    (click)="onClear()"
                    *ngIf="!isFormReadable"></app-button>
        <app-button btnType="submit"
                    (click)="onSubmit()"
                    *ngIf="!isFormReadable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
<div class="card">
  <div *ngIf="!isFormReadable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增收銀機"
                  (click)="onOpenDialog('ecr')"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="false"
               [showEdit]="false"
               [showDetail]="false"
               [showDelete]="false"
               [showManage]="false"
               [showReportMode]="false"
               [isRowSelectable]="service.isRowSelectable"
               [data]="ecrTableFiltered"
               [dataKey]="'ecr_no'"
               [tableKey]="'TLS26010_ECR'"
               [columns]="columns">
    </app-table>
  </div>
</div>
<div class="card">
  <div *ngIf="!isFormReadable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增專櫃"
                  (click)="onOpenDialog('tlt')"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="false"
               [showEdit]="false"
               [showDetail]="false"
               [showDelete]="false"
               [showManage]="false"
               [showReportMode]="false"
               [isRowSelectable]="service.isRowSelectable"
               [showExcel]="isFormEditable"
               (exportExcel)="onExportExcel()"
               (importExcel)="onImportExcel($event)"
               [data]="tltTableFiltered"
               [dataKey]="'tlt_no'"
               [tableKey]="'TLS26010_TLT'"
               [columns]="columns2">
    </app-table>
  </div>
</div>

<app-dialog [visible]="!!dialogVisible()"
            [header]="dialogVisible() === 'ecr' ? '新增收銀機' : '新增專櫃'"
            (visibleChange)="onVisibleChange($event)"
            (save)="onDialogSubmit()"
            [height]="'auto'">
  <form [formGroup]="dataForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="館別"
                          controlName="sys3800"
                          [options]="service.sys3800Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="dataForm.controls.sys3800"
                          [loading]="service.sys3800Loading"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="樓層"
                          controlName="sys3900"
                          [options]="service.sys3900Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="dataForm.controls.sys3900"
                          [loading]="service.sys3900Loading"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select label="區域"
                          controlName="sys3A00"
                          [options]="service.sys3A00Data()"
                          optionLabel="Name"
                          optionValue="No"
                          appendTo="body"
                          [control]="dataForm.controls.sys3A00"
                          [loading]="service.sys3A00Loading"
                          [submitted]="submitted"></app-multi-select>
      </div>
      <div class="col-12">
        <app-table [showCheckBox]="true"
                   [showManage]="false"
                   [showDelete]="false"
                   [showReportMode]="false"
                   [selectedItems]="selectedDialogData"
                   (selectionChange)="onSelectionChange($event)"
                   [data]="dialogData"
                   [dataKey]="dialogDataKey"
                   [tableKey]="dialogTableKey"
                   [columns]="dialogColumn"
                   [loading]="service.ecrLoading || service.tltLoading">
        </app-table>
      </div>
      <!-- <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select *ngIf="dialogVisible() === 'ecr'"
                          [appendTo]="'body'"
                          label="收銀機號"
                          controlName="ecr_nos"
                          [options]="service.ECRList"
                          optionLabel="ecr_name"
                          optionValue="ecr_no"
                          [control]="dataForm.controls.ecr_nos"
                          [submitted]="submitted"></app-multi-select>
        <app-multi-select *ngIf="dialogVisible() === 'tlt'"
                          [appendTo]="'body'"
                          label="專櫃名稱"
                          controlName="tlt_nos"
                          [options]="service.TLTList"
                          optionLabel="tlt_name"
                          optionValue="tlt_no"
                          [control]="dataForm.controls.tlt_nos"
                          [submitted]="submitted"></app-multi-select>
      </div> -->
    </div>
  </form>
</app-dialog>
