<div class="card">
  <div class="grid align-items-center">
    <div class="col">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div class="flex gap-2">
      <app-button btnType="back"
                  (click)="onCancel()"></app-button>
    </div>
  </div>
  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="預售活動編號"
                          controlName="pod_no"
                          [control]="dataForm.controls.pod_no"
                          [submitted]="submitted"
                          [disabled]="true">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-8">
          <app-calendar-range calendarType="dateRange"
                              label="預售期間"
                              [startControl]="dataForm.controls.pod_sdate"
                              [endControl]="dataForm.controls.pod_edate"
                              [submitted]="submitted">
          </app-calendar-range>
        </div>
        <div class="col-12 md:col-8 lg:col-8">
          <app-input-text label="預售名稱"
                          controlName="pod_desc"
                          [control]="dataForm.controls.pod_desc"
                          [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-4 lg:col-4">
          <app-input-text label="核准狀態"
                          controlName="pod_status"
                          [control]="podStatus"
                          [disabled]="true">
          </app-input-text>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel"
                    (click)="onCancel()"
                    *ngIf="isFormCreateable || isFormEditable"></app-button>
        <app-button btnType="submit"
                    (click)="onSubmit(dataForm)"
                    *ngIf="isFormEditable || isFormCreateable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
<div class="card">
  <div *ngIf="isFormEditable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增收銀機"
                  (click)="dialogVisible.set('ecr'); submitted = false"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="!isFormReadable"
               [showEdit]="false"
               [showDetail]="false"
               [showDelete]="false"
               [showManage]="false"
               [showReportMode]="false"
               [data]="ecrTableFiltered"
               [dataKey]="'tlt_no'"
               [tableKey]="'TLS26010_ECR'"
               [columns]="columns">
    </app-table>
  </div>
</div>
<div class="card">
  <div *ngIf="isFormEditable"
       class="grid p-fluid">
    <div class="col-12 md:col-6 lg:col-4">
      <app-button btnType="create"
                  label="新增專櫃"
                  (click)="dialogVisible.set('tlt'); submitted = false"></app-button>
    </div>
  </div>
  <div class="col-12">
    <app-table [showCheckBox]="!isFormReadable"
               [showEdit]="false"
               [showDetail]="false"
               [showDelete]="false"
               [showManage]="false"
               [showReportMode]="false"
               [showExcel]="isFormEditable"
               (exportExcel)="onExportExcel()"
               (importExcel)="onImportExcel($event)"
               [data]="tltTableFiltered"
               [dataKey]="'tlt_no'"
               [tableKey]="'TLS26010_TLT'"
               [columns]="columns2">
    </app-table>
  </div>
</div>

<app-dialog [visible]="!!dialogVisible()"
            [header]="dialogVisible() === 'ecr' ? '新增收銀機' : '新增專櫃'"
            (visibleChange)="dialogVisible.set(!1)"
            (save)="saveDialog(dataForm)"
            [height]="'50vh'">
  <form [formGroup]="dataForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown label="館別"
                      controlName="sys3800"
                      [options]="service.sys3800List()"
                      optionLabel="Name"
                      optionValue="No"
                      [control]="dataForm.controls.sys3800"
                      [submitted]="submitted"
                      (changeEvent)="dialogChange($event)"></app-dropdown>
      </div>
      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown label="樓層"
                      controlName="sys3900"
                      [options]="service.sys3900List()"
                      optionLabel="Name"
                      optionValue="No"
                      [control]="dataForm.controls.sys3900"
                      [submitted]="submitted"
                      (changeEvent)="dialogChange($event)"></app-dropdown>
      </div>
      <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="區域"
                        controlName="sys3A00"
                        [options]="service.sys3A00List()"
                        optionLabel="Name"
                        optionValue="No"
                        [control]="dataForm.controls.sys3A00"
                        [submitted]="submitted"></app-dropdown>
        </div> -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-multi-select *ngIf="dialogVisible() === 'ecr'"
                          label="收銀機號"
                          controlName="ECR_Nos"
                          [options]="service.ECRList"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="dataForm.controls.ECR_Nos"
                          [submitted]="submitted"></app-multi-select>
        <app-multi-select *ngIf="dialogVisible() === 'tlt'"
                          label="專櫃名稱"
                          controlName="tlt_nos"
                          [options]="service.TLTList"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="dataForm.controls.tlt_nos"
                          [submitted]="submitted"></app-multi-select>
      </div>
    </div>
  </form>
</app-dialog>
