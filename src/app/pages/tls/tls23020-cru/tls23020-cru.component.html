
<div class="card">
  <!-- 上方功能列 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>


  <!-- 明細表 -->
<app-report-table-group
  [columns]="columns"
  [data]="data"
  [subtotalFields]="
    displayMode === 'Detail'
      ? ['TXN_TotGUI', 'TXN_TotSaleAmt', 'TXN_TotPayAmt']
      : ['TXN_TotSaleAmt']
  "
  [groupByField]="displayMode === 'Summary' ? 'tlt_name' : null"
  [groupByLabel]="'櫃位名稱'"
  [enableGrouping]="displayMode === 'Summary'"
  [defaultMergedView]="displayMode === 'Detail'"
  
  [reportTitle]="
    displayMode === 'Detail'
      ? '折扣別明細表'
      : '折扣別彙總表'
  "
  [currentPage]="1"
  [dateStart]="dateStart"
  [dateEnd]="dateEnd"
  [printedAt]="printedAt"
  [showTotalOnly]="true"
  [pdfSummaryText]="pdfSummary"
  [showExpandColumn]="false"
  [allowMergeToggle]="false"
></app-report-table-group>

  <div class="mt-4 text-sm text-red-600 leading-6 font-semibold whitespace-pre-line">
    <ng-container *ngFor="let line of pdfSummary">
      {{ line }}
      <br />
    </ng-container>
  </div>
