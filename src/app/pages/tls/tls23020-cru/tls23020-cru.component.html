
<div class="card">
  <!-- 上方功能列 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>


  <!-- 明細表 -->
<app-report-table-group
  [columns]="columns"
  [data]="data"
  [subtotalFields]="
    displayMode === 'Detail'
      ? ['PLU_SalePrc', 'TXN_Net', 'TXN_Tax','TXN_Disc']
      : ['TXN_TotSaleAmt', 'TXN_TotNet', 'Pre_TotSaleAmt', 'Pre_TotNet', 'Pre_TotTax']
  "
  [groupByField]="displayMode === 'Summary' ? 'tlt_name' : 'TXN_No'"
  [groupByLabel]="displayMode === 'Summary' ? '櫃位名稱' : '交易序號'"
  [enableGrouping]="true"
  [defaultMergedView]="false"
  [reportTitle]="displayMode === 'Detail' ? '折扣別報表' : '折扣別報表'"
  [currentPage]="1"
  [dateStart]="dateStart"
  [dateEnd]="dateEnd"
  [printedAt]="printedAt"
  [showTotalOnly]="false"
  [showExpandColumn]="false"
  [allowMergeToggle]="true"
  [showGroupedBody]="true"
></app-report-table-group>
