
<div class="card">
  <!-- 上方功能列 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

<ng-container *ngIf="displayMode === 'Report'">
  <!-- 明細表 -->
  <app-report-table-group
    [data]="data"
    [columns]="columns"
    [subtotalFields]="['PLU_SalePrc']"
    [groupByField]="'TXN_GUINo'"
    [groupByLabel]="'發票號碼'"
    reportTitle="銷售統計報表"
    [totalCount]="data.length"
    [currentPage]="1"
    [dateStart]="dateStart"
    [dateEnd]="dateEnd"
    [printedAt]="printedAt"
    [showTotalOnly]="true"
    [enableGrouping]="true"
    [allowMergeToggle]="true" 
    [pdfSummaryText]="pdfSummary"
    [defaultMergedView]="false">
  </app-report-table-group>

  <div class="mt-4 text-sm text-red-600 leading-6 font-semibold whitespace-pre-line">
    <ng-container *ngFor="let line of pdfSummary">
      {{ line }}
      <br />
    </ng-container>
  </div>
</ng-container>
