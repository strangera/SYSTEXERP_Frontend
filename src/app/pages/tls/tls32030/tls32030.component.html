<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <!-- 日期查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-12">
            <app-radiobutton groupname="DayType" [control]="queryForm.controls.DayType" [submitted]="submitted"
              [options]="DayTypeOptions"></app-radiobutton>
          </div>
          <!-- 日營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '1'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar calendarType="dateOne" label="比較日期" [control]="queryForm.controls.day"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar calendarType="dateOne" label="基準日期" [control]="queryForm.controls.CompareDay"
                  [submitted]="submitted"></app-calendar>
              </div>
            </div>
          </div>
          <!-- 週營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '2'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="year"
                    [control]="queryForm.controls.year" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="週次" controlName="week" [options]="weekOptions" optionLabel="label"
                    optionValue="value" [control]="queryForm.controls.week" [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="比較日期範圍" [startControl]="queryForm.controls.ViewCompareFrom"
                    [endControl]="queryForm.controls.ViewCompareTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="CompareYear"
                    [control]="queryForm.controls.CompareYear" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="週次" controlName="CompareWeek" [options]="weekOptions" optionLabel="label"
                    optionValue="value" [control]="queryForm.controls.CompareWeek" [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="基準日期範圍" [startControl]="queryForm.controls.ViewBaseFrom"
                    [endControl]="queryForm.controls.ViewBaseTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
          </div>
          <!-- 月營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '3'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="year"
                    [control]="queryForm.controls.year" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="月份" controlName="month" [options]="monthOptions" optionLabel="label"
                    optionValue="value" [control]="queryForm.controls.month" [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="比較日期範圍" [startControl]="queryForm.controls.ViewCompareFrom"
                    [endControl]="queryForm.controls.ViewCompareTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="CompareYear"
                    [control]="queryForm.controls.CompareYear" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="月份" controlName="CompareMonth" [options]="monthOptions" optionLabel="label"
                    optionValue="value" [control]="queryForm.controls.CompareMonth" [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="基準日期範圍" [startControl]="queryForm.controls.ViewBaseFrom"
                    [endControl]="queryForm.controls.ViewBaseTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
          </div>
          <!-- 半年營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '4'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="year"
                    [control]="queryForm.controls.year" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="半年別" controlName="halfYear" [options]="halfYearOptions" optionLabel="label"
                    optionValue="value" [control]="queryForm.controls.halfYear" [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="比較日期範圍" [startControl]="queryForm.controls.ViewCompareFrom"
                    [endControl]="queryForm.controls.ViewCompareTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="grid p-fluid p-2">
                <div class="col-6">
                  <app-calendar calendarType="dateYearOne" label="年度" controlName="CompareYear"
                    [control]="queryForm.controls.CompareYear" [submitted]="submitted" />
                </div>
                <div class="col-6">
                  <app-dropdown label="半年別" controlName="CompareHalfYear" [options]="halfYearOptions"
                    optionLabel="label" optionValue="value" [control]="queryForm.controls.CompareHalfYear"
                    [submitted]="submitted" />
                </div>
                <div class="col-12">
                  <app-calendar-range label="基準日期範圍" [startControl]="queryForm.controls.ViewBaseFrom"
                    [endControl]="queryForm.controls.ViewBaseTo" [submitted]="submitted" />
                </div>
              </div>
            </div>
          </div>
          <!-- 年營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '5'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar calendarType="dateYearOne" label="年度" controlName="year"
                  [control]="queryForm.controls.year" [submitted]="submitted" />
              </div>
              <div class="col-12">
                <app-calendar-range label="比較日期範圍" [startControl]="queryForm.controls.ViewCompareFrom"
                  [endControl]="queryForm.controls.ViewCompareTo" [submitted]="submitted" />
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar calendarType="dateYearOne" label="年度" controlName="CompareYear"
                  [control]="queryForm.controls.CompareYear" [submitted]="submitted" />
              </div>
              <div class="col-12">
                <app-calendar-range label="基準日期範圍" [startControl]="queryForm.controls.ViewBaseFrom"
                  [endControl]="queryForm.controls.ViewBaseTo" [submitted]="submitted" />
              </div>
            </div>
          </div>
          <!-- 區間營業報表 -->
          <div class="flex col-12" *ngIf="queryForm.controls.DayType.value === '6'">
            <div class="col-6 flex flex-column border-right-1 surface-border">
              <div class="col-12 flex justify-content-center">
                <B><u>比較資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar-range label="比較日期區間" [startControl]="queryForm.controls.CompareDateFrom"
                  [endControl]="queryForm.controls.CompareDateTo" [submitted]="submitted" />
              </div>
            </div>
            <div class="col-6 flex flex-column">
              <div class="col-12 flex justify-content-center">
                <B><u>基準資料查詢條件</u></B>
              </div>
              <div class="col-12">
                <app-calendar-range label="基準日期區間" [startControl]="queryForm.controls.BaseDateFrom"
                  [endControl]="queryForm.controls.BaseDateTo" [submitted]="submitted" />
              </div>
            </div>
          </div>
        </div>
        <hr />

        <!-- 合約查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="BuildingList" [options]="auditoriumOptions | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.BuildingList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="FloorList" [options]="floorOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.FloorList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" controlName="AreaList" [options]="regionOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.AreaList" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12">
            <app-category-select formControlName="category"></app-category-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="櫃別" controlName="TltKindList" [options]="operationsOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TltKindList" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成別" controlName="TermTypeList" [options]="commissionTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TermTypeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織" controlName="OrgList" [options]="organizationOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.OrgList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="TltNoList" [options]="counterCodeOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TltNoList"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="銷售金額是否含稅" groupname="AmtTaxMode" [control]="queryForm.controls.AmtTaxMode"
              [options]="taxOptions" [submitted]="submitted"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="是否開立業主發票" groupname="ReceFilter" [control]="queryForm.controls.ReceFilter"
              [options]="ReceFilterOptions" [submitted]="submitted"></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div class="flex flex-wrap gap-3 p-2">
              <label for="displayStatus">顯示狀態</label>
              <p-checkbox label="預售" [binary]="true" formControlName="PreSale"></p-checkbox>
              <p-checkbox label="消費人數" [binary]="true" formControlName="ConsumerNum"></p-checkbox>
            </div>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report dataKey="TltNo" [data]="data" [columns]="columns" [columnGroup]="columnGroup" [showDelete]="false"
    [showManage]="false" [totalRecords]="totalRecords" [loading]="loading" [lazy]="false" [footerData]="footerData"
    [queryFunction]="tls32030Service.queryTLS32030.bind(tls32030Service)" [customTemplates]="{
      Base_LocationNo: locationTemplate,
      Comp_LocationNo: locationTemplate,
    }">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出成長率分析報表.PDF" [loading]="pdfBtnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="
            !historyRequestBody ||
            data.length === 0 ||
            !hasPermission(Actions.Print)
          "></p-button>
        <p-button styleClass="p-2" label="產出成長率分析報表.XLSX" [loading]="excelBtnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="
            !historyRequestBody ||
            data.length === 0 ||
            !hasPermission(Actions.ExportExcel)
          "></p-button>
      </div>
    </header>
  </app-table-report>
</div>
<ng-template #locationTemplate let-rowData let-column="column">
  <div class="flex flex-column align-items-start gap-1">
    <div *ngFor="let loc of rowData[column.field] | locationSplit">
      {{ loc }}
    </div>
  </div>
</ng-template>
