<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form *ngIf="initComponent" [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="調撥單編號" controlName="MVM_No" [control]="dataForm.controls.MVM_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌代碼" controlName="LOGO_No" [options]="brandOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調出倉別" controlName="OUT_HOS_No" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.OUT_HOS_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調入倉別" controlName="IN_HOS_No" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.IN_HOS_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="數量" controlName="Confirm_TotQty" [control]="dataForm.controls.Confirm_TotQty"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="金額" controlName="Confirm_TotBuyNet" [control]="dataForm.controls.Confirm_TotBuyNet"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人編號/姓名" controlName="APPLY_USR_No" [control]="dataForm.controls.APPLY_USR_No"
            [submitted]="submitted" [options]="userOptions" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="審核日期" [control]="dataForm.controls.APRV_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="審核人編號/姓名" controlName="APRV_USR_No" [control]="dataForm.controls.APRV_USR_No"
            [submitted]="submitted" [options]="userOptions" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="發貨日期" [control]="dataForm.controls.OUTGODS_DATE"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="發貨人編號/姓名" controlName="OUTGODS_USR_No" [control]="dataForm.controls.OUTGODS_USR_No"
            [submitted]="submitted" [options]="userOptions" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="驗收日期" [control]="dataForm.controls.Confirm_DATE"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="驗收人編號/姓名" controlName="Confirm_USR_No" [control]="dataForm.controls.Confirm_USR_No"
            [submitted]="submitted" [options]="userOptions" optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="倉別調撥單說明" controlName="MVM_Remark" [control]="dataForm.controls.MVM_Remark"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-input-textarea>
        </div>
      </div>
      <app-table-edit [columns]="editColumns" [data]="data" [showCheckBox]="false" [loading]="loading"
        (dataChange)="onTableDataChange($event)" [tableRequired]="true" [disabled]="isFormReadable" [showInsert]="false"
        [showDelete]="false" [canInsert]="false" />
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (click)="loadData()"></app-button>
        <app-button btnType="submit" [loading]="loading" label="儲存"></app-button>
        <app-button [loading]="loading" label="確認收貨" (click)="onConfirm(dataForm)"
          [disabled]="dataChanged"></app-button>
      </div>
    </form>
  </p-panel>
</div>
