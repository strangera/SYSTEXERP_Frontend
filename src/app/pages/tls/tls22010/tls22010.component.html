<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="日期" calendarType="dateOne" [control]="queryForm.controls.TXN_DATE"
              [submitted]="submitted"></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [options]="floorOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.floor_noList" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="status1">系統帳</label>
            <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value"
              [formControl]="queryForm.controls.status1" placeholder="請選擇"></p-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="status2">清機帳</label>
            <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value"
              [formControl]="queryForm.controls.status2" placeholder="請選擇"></p-dropdown>
          </div>

          <div class="col-12 lg:col-8">
            <app-radiobutton label="查詢條件" groupname="radioOption" [control]="queryForm.controls.ShowStatus"
              [submitted]="submitted" [options]="[
                { value: '1', label: '只顯示有交易之機台' },
                { value: '2', label: '顯示所有之機台' },
                { value: '3', label: '顯示可能離線之機台' },
                { value: '4', label: '顯示未清機之機台' },
              ]" (valueChange)="queryForm.controls.ShowStatus.setValue($event)"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table tableKey="TLS22010" [data]="data" [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
      [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true" [showReportMode]="false" [showDelete]="false" [loading]="loading" [columns]="columns7"
      (detail)="onDetail($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
      [showRowEdit]="false" [showEdit]="false"></app-table>
  </div>
</div>
