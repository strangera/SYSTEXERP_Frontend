<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number-range [useGrouping]="false" label="收銀機編號"
                  [startControl]="queryForm.controls.startserialregister"
                  [endControl]="queryForm.controls.endserialregister" [submitted]="submitted">
                </app-input-number-range>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="顯示類型" controlName="showupType" [options]="showupTypeOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.showupType" [submitted]="submitted">
                </app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="設定檔群組" controlName="settingFiles" [options]="settingFilesOptions"
                  optionLabel="label" optionValue="value" [control]="queryForm.controls.settingFiles"
                  [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <div *appHasPermission="queryPermission" class="col">
              <div class="grid justify-content-end">
                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <!-- <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div> -->
  </div>
</div>
