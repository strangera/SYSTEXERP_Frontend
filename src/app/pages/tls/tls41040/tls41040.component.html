<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 收銀機號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="開始時間"
              controlName="NOT_BegDateTime"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NOT_BegDateTime"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="結束時間"
              controlName="NOT_EndDateTime"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NOT_EndDateTime"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="通告狀態"
              controlName="NOT_Status"
              [options]="NOT_Status_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NOT_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="機台群組備註"
              controlName="ECR_GrpDesc"
              [control]="queryForm.controls.ECR_GrpDesc"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      tableKey="TLS22010"
      [data]="data"
      [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [showReportMode]="false"
      [showDelete]="false"
      [loading]="loading"
      (detail)="onDetail($event)"
      [showRowEdit]="false"
      [showEdit]="false"
      [columns]="columns"
    ></app-table>
  </div>
</div>
