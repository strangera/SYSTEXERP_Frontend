<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <!-- 日期時間與狀態 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar label="通告產生時間" controlName="NOT_DateTime" calendarType="dateTimeOne"
            [control]="dataForm.controls.NOT_DateTime" [submitted]="submitted"></app-calendar>
        </div>

        <div class="col-12 md:col-8">
          <app-calendar-range startLabel="有效開始日期" endLabel="有效結束日期" startControlName="NOT_BegDateTime"
            endControlName="NOT_EndDateTime" calendarType="dateTimeRange"
            [startControl]="dataForm.controls.NOT_BegDateTime" [endControl]="dataForm.controls.NOT_EndDateTime"
            [submitted]="submitted"></app-calendar-range>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="通告狀態" controlName="NOT_Status" [options]="NOT_Status_Option" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.NOT_Status" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-8">
          <app-input-textarea label="通告備註" controlName="NOT_Remark" [control]="dataForm.controls.NOT_Remark"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-input-textarea>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="是否即時顯示" groupname="NOT_DispRt" [control]="dataForm.controls.NOT_DispRt"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="暫停時是否顯示" groupname="NOT_DispSpd" [control]="dataForm.controls.NOT_DispSpd"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="按下功能鍵是否顯示" groupname="NOT_DispBtn" [control]="dataForm.controls.NOT_DispBtn"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="客顯器是否顯示" groupname="NOT_DispCd" [control]="dataForm.controls.NOT_DispCd"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-radiobutton label="是否銷貨明細表列印" groupname="NOT_Prn" [control]="dataForm.controls.NOT_Prn"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]"></app-radiobutton>
        </div>

        <div class=" col-12 md:col-6 lg:col-4">
          <app-radiobutton label="是否限制播放條件" groupname="NOT_DtlLimit" [control]="dataForm.controls.NOT_DtlLimit"
            [submitted]="submitted" [options]="[
              { value: 'Y', label: '是' },
              { value: 'N', label: '否' },
            ]" (valueChange)="onNotDtlLimitChange($event)"></app-radiobutton>
        </div>

        <div class="col-12 md:col-6 lg:col-12">
          <app-input-textarea label="通告內容" controlName="NOT_Desc" [control]="dataForm.controls.NOT_Desc"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-input-textarea>
        </div>
      </div>
      <app-table-edit *ngIf="dataForm.controls.NOT_DtlLimit.value === 'Y'" tableKey="tls41040Detail" [columns]="columns"
        [data]="data" [dataStatusField]="'status'" [disabled]="isFormReadable" [tableRequired]="true"
        [selectedItems]="selectedRows" (selectionChange)="selectedRows = $event" (dataChange)="data = $event"
        [loading]="loading" [disabled]="isFormReadable">
      </app-table-edit>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onCancelClicked()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
