<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="收銀機所屬門市店號" controlName="SYS_StoreNo"
                        [control]="dataForm.controls.SYS_StoreNo" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No"
                        [submitted]="submitted">
                    </app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="清機日期" controlName="ECR_SettleDD" [options]="ECR_SettleDD_Options"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SettleDD"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar calendarType="timeOne" label="清機時間" controlName="ECR_SettleHHNN"
                        [control]="dataForm.controls.ECR_SettleHHNN" [submitted]="submitted">
                    </app-calendar>
                </div>
            </div>

        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
