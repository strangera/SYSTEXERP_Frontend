<p-dialog [visible]="visible" (visibleChange)="visibleChange.emit($event)" [header]="rowData?.BusTypeName ?? ''"
  [modal]="true" [maximizable]="true" [style]="{ width: '95vw' }" [contentStyle]="{ overflow: 'auto', padding: '0' }">
  <app-table-report tableKey="tls31090-detail" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [showDelete]="false" [showEdit]="false" [showManage]="false" [loading]="loading"
    [footerData]="footerData" [queryFunction]="detailQueryFn" [exportContext]="{ apiUrl: 'queryTLS31090Detail' }">
  </app-table-report>
</p-dialog>
