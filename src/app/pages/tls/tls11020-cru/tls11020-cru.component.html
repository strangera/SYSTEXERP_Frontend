<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>

    <!-- 離開 / 返回查詢頁 -->
    <app-button btnType="back" (clickEvent)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle">
    <form
      [formGroup]="dataForm"
      (ngSubmit)="onSubmit()"
      class="grid formgrid p-fluid"
    >
      <!-- 第一列：扣款代碼、扣款名稱 -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-input-text
          label="扣款代碼"
          [control]="dataForm.controls.CAP_Item"
          [readonly]="true"
        ></app-input-text>
      </div>

      <div class="col-12 md:col-6 lg:col-4">
        <app-input-text
          label="扣款名稱"
          [control]="dataForm.controls.CAP_Name"
        ></app-input-text>
      </div>

      <!-- 第二列：扣款類別、會計科目 -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="扣款類別"
          [control]="dataForm.controls.CAP_Type"
          [options]="deductionCategoryOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="會計科目"
          [control]="dataForm.controls.AccNo"
          [options]="accountOptions"
          optionLabel="formLabel"
          optionValue="value"
        ></app-dropdown>
      </div>

      <!-- 第三列：發票旗標、課稅別、常用否 -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="是否開立發票"
          [control]="dataForm.controls.GUI_FLAG"
          [options]="[
            { label: '是', value: 'Y' },
            { label: '否', value: 'N' },
          ]"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="課稅別"
          [control]="dataForm.controls.CAP_TaxType"
          [options]="[
            { label: '0-免稅', value: '0' },
            { label: '1-應稅', value: '1' },
          ]"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4">
        <app-dropdown
          label="是否常用"
          [control]="dataForm.controls.IsCommonlyUsed"
          [options]="[
            { label: '是', value: 'Y' },
            { label: '否', value: 'N' },
          ]"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <!-- 合約列印區分 / 分攤比率 -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-input-text
          label="合約列印區分"
          [control]="dataForm.controls.Print_Area"
          placeholder="請輸入合約列印區分"
        ></app-input-text>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isBaseRateVisible">
        <app-input-text
          label="分攤比率"
          [control]="dataForm.controls.CAP_BaseRate"
        ></app-input-text>
      </div>

      <!-- 備註 -->
      <div class="col-12 md:col-6 lg:col-4">
        <app-input-text
          label="備註"
          [control]="dataForm.controls.CAP_Remark"
        ></app-input-text>
      </div>

      <!-- 銷售類型 / 收單行 / 分期期數（只有 D 類才顯示） -->
      <div class="col-12 md:col-6 lg:col-4" *ngIf="isBaseRateVisible">
        <app-dropdown
          label="銷售類型"
          [control]="dataForm.controls.CAP_SALETYPE"
          [options]="capSaletypeOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isBaseRateVisible">
        <app-dropdown
          label="收單行"
          [control]="dataForm.controls.EDC_BANK"
          [options]="edcBankOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isInstmsTypeVisible">
        <app-dropdown
          label="分期期數"
          [control]="dataForm.controls.INSTMS_TYPE"
          [options]="instmsTypeOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <!-- 支付別編號：非券類=單選(SYS1000)，券類(5)=多選(POS1006) -->
      <div class="col-12 md:col-6 lg:col-4" *ngIf="isBaseRateVisible && !isPayNoMulti">
        <app-dropdown
          label="支付別編號"
          [control]="dataForm.controls.PAY_NO"
          [options]="payNoOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isPayNoMulti">
        <app-multi-select
          label="支付別編號"
          [control]="dataForm.controls.PAY_NO_MULTI"
          [options]="payNoVoucherOptions"
          optionLabel="label"
          optionValue="value"
        ></app-multi-select>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isCalcTypeVisible">
        <app-dropdown
          label="券類計算方式"
          [control]="dataForm.controls.CALC_TYPE"
          [options]="calcTypeOptions"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isDownPaymentVisible">
        <app-input-text
          label="超過基準金額"
          [control]="dataForm.controls.DOWN_PAYMENT"
          placeholder="請輸入金額"
          type="number"
        ></app-input-text>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isOverBaseRateVisible">
        <app-input-text
          label="超過基準比率"
          [control]="dataForm.controls.OVER_BASE_RATE"
          placeholder="例：0.3"
          type="number"
        ></app-input-text>
      </div>

      <div class="col-12 md:col-6 lg:col-4" *ngIf="isBaseRateVisible">
        <app-dropdown
          label="是否是活動"
          [control]="dataForm.controls.CALC_SOURCE"
          [options]="[
            { label: '否', value: '0' },
            { label: '是', value: '1' },
          ]"
          optionLabel="label"
          optionValue="value"
        ></app-dropdown>
      </div>

      <!-- 底部按鈕列：只在 非 Read 模式 顯示 -->
      <div
        class="col-12 flex justify-content-end gap-2 mt-3"
        *ngIf="crudstatus !== CRUDStatus.Read"
      >
        <!-- 清除 -->
        <app-button
          btnType="cancel"
          type="button"
          (clickEvent)="onClear()"
        ></app-button>

        <!-- 送出 -->
        <app-button btnType="submit" type="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
