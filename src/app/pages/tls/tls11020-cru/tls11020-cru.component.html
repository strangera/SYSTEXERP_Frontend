<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1;">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="inputForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="扣款項目編號" [control]="inputForm.controls.CAP_Item" [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="扣款類別" [options]="deductionCategoryOptions" optionLabel="label" optionValue="value"
            [control]="inputForm.controls.CAP_Type" [submitted]="submitted" [style.width.%]="100">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="扣款項目名稱" [control]="inputForm.controls.CAP_Name" [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="會計科目" [control]="inputForm.controls.AccNo" [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否開立發票" [options]="[{ label: '開立', value: 'Y' }, { label: '不開立', value: 'N' }]"
            optionLabel="label" optionValue="value" [control]="inputForm.controls.GUI_FLAG" [submitted]="submitted"
            [style.width.%]="100">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="課稅別" [options]="[{ label: '免稅', value: '0' }, { label: '應稅', value: '1' }]"
            optionLabel="label" optionValue="value" [control]="inputForm.controls.CAP_TaxType" [submitted]="submitted"
            [style.width.%]="100">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="是否為常用" [options]="[{ label: '常用', value: 'Y' }, { label: '不常用', value: 'N' }]"
            optionLabel="label" optionValue="value" [control]="inputForm.controls.IsCommonlyUsed"
            [submitted]="submitted" [style.width.%]="100">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="列印區分" [control]="inputForm.controls.Print_Area" [submitted]="submitted">
          </app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="備註" [control]="inputForm.controls.CAP_Remark" [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
    </form>
  </p-panel>

  <div class="col pt-4">
    <div class="grid justify-content-end">
      <app-button btnType="cancel" (click)="onCancel()"></app-button>
      <app-button btnType="submit" (click)="onSubmit()"></app-button>
    </div>
  </div>
</div>
