<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1;">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
      <form [formGroup]="inputForm">
        <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-10"></div>
            <div class="col-12 md:col-6 lg:col-2">
                <div class="flex justify-content-end">
               
                          <div>
                            <app-button btnType="create" (click)="addItem()" class="col"></app-button>
                        </div>
                </div>
              </div>
          <div class="col-12 md:col-6 lg:col-4">
           
            <app-input-text pInputText formControlName="deductionItemNumber" maxlength="3" label="扣款項目編號"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>扣款類別</label>
            <app-dropdown [options]="deductionCategoryOptions" optionLabel="label" optionValue="value"
                        formControlName="deductionCategory" [style.width.%]="100"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>扣款項目名稱</label>
            <input pInputText formControlName="deductionItemName" />
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label>會計科目</label>
            <input pInputText formControlName="accNo" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>是否開立發票</label>
            <p-dropdown [options]="[{ label: '開立', value: 'Y' }, { label: '不開立', value: 'N' }]"
                        formControlName="guiFlag"></p-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>課稅別</label>
            <p-dropdown [options]="[{ label: '免稅', value: '0' }, { label: '應稅', value: '1' }]"
                        formControlName="capTaxType"></p-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>是否為常用</label>
            <p-dropdown [options]="[{ label: '常用', value: 'Y' }, { label: '不常用', value: 'N' }]"
                        formControlName="isCommonlyUsed"></p-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>列印區分</label>
            <input pInputText formControlName="printArea" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label>備註</label>
            <input pInputText formControlName="remark" />
          </div>

        </div>
      </form>
  

    </p-panel>
    <div class="col pt-4">
        <div class="grid justify-content-end">
            <app-button btnType="cancel" (click)="onCancel()"></app-button>
            <app-button btnType="submit" (click)="submitForm(dataForm)" ></app-button>
        </div>
    </div>
  </div>
