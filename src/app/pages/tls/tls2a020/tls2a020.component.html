<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="銷售日期" calendarType="dateOne" [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" [options]="floorOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_floor" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別" [options]="BUILDING_NO_Options" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_building" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 lg:col-8">
            <app-radiobutton label="查詢條件" groupname="SortOrder" [control]="queryForm.controls.SortOrder"
              [submitted]="submitted" [options]="[
                { value: 'ECR', label: '未審核收銀機號' },
                { value: 'payTool', label: '未審核支付工具' },
              ]" (valueChange)="queryForm.controls.SortOrder.setValue($event)"></app-radiobutton>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS2A020" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [showCheckBox]="false" dataKey="id"
    [multiSortMeta]="[{ field: 'TXN_Date', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true" [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [showManage]="false"
    [showDelete]="false"></app-table>
</div>
