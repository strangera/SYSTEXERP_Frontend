<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select
                  label="部門"
                  controlName="department"
                  [options]="departmentOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.department"
                  [submitted]="submitted"
                ></app-multi-select>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select
                  label="券別"
                  controlName="coupon"
                  [options]="couponOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.coupon"
                  [submitted]="submitted"
                ></app-multi-select>
              </div>
            </div>
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-13">
        <app-table
          [data]="data"
          [columns]="columns"
          (edit)="onEdit($event)"
          (detail)="onDetail($event)"
        ></app-table>
      </div>
    </div>
  </div>
</div>
