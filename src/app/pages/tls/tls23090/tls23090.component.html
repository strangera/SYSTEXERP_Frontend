<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 銷售日期 -->
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <!-- 收銀機代號 -->

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機代號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 信用卡卡別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="信用卡別"
              controlName="CRD_Type"
              [options]="cardTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CRD_Type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 信用卡卡號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="信用卡號"
              controlName="CRD_No"
              [control]="queryForm.controls.CRD_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 金額 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="金額"
              controlName="TXN_PayAmt"
              [control]="queryForm.controls.TXN_PayAmt"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否分期"
              controlName="IsHaveTERM_No"
              [options]="WhetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.IsHaveTERM_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="期別"
              controlName="IPeriod"
              [options]="installmentPeriodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.IPeriod"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
                    <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收單行"
              controlName="AcqBank"
              [options]="acquiringBankOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.AcqBank"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
                              <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="連線狀態"
              controlName="ConnStatus"
              [options]="connectionStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ConnStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          

          <!-- 館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 樓層 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 組織代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <!-- 查詢按鈕區 -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="report" label="報表模式" (clickEvent)="goToReportMode()"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<p-dialog header="限制筆數" [(visible)]="showPageSizeDialog" [modal]="true" [closable]="false" [style]="{ width: '300px' }">
  <div class="p-fluid">
    <div class="field">
      <label for="pageSize">限制筆數</label>
      <input id="pageSize" type="number" pInputText [(ngModel)]="customPageSize" min="1" style="width: 100%" />
    </div>

    <div class="field mt-3">
      <label>查詢模式</label>
      <div class="flex flex-column gap-2">
        <div class="flex align-items-center gap-2">
          <p-radioButton name="displayMode" [value]="'CreditCardDetail'" [(ngModel)]="displayMode"
            inputId="mode-credit-card"></p-radioButton>
          <label for="mode-credit-card">信用卡明細查詢</label>
        </div>
        <div class="flex align-items-center gap-2">
          <p-radioButton name="displayMode" [value]="'CounterCardAnalysis'" [(ngModel)]="displayMode"
            inputId="mode-counter-analysis"></p-radioButton>
          <label for="mode-counter-analysis">專櫃卡別分析查詢</label>
        </div>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button type="button" pButton label="取消" class="p-button-text" (click)="showPageSizeDialog = false"></button>
    <button type="button" pButton label="確定" (click)="confirmPageSizeAndNavigate()" [loading]="loading"></button>
  </ng-template>
</p-dialog>
