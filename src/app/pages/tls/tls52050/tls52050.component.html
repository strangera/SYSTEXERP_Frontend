<div class="card tls52050">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button [outlined]="true" label="匯出EXCEL範本" [disabled]="!this.hasPermission(Actions.ExportTemplate)"
      (click)="excelExportService.exportTemplate(excelColumns, '進價/售價變價作業Excel範本')"></app-button>
    <p-fileUpload #fileUpload mode="basic" chooseIcon="pi pi-upload" accept=".xlsx,.xls"
      (onSelect)="importExcel($event);fileUpload.clear()" [auto]="true" chooseLabel="匯入EXCEL"
      [disabled]="!this.hasPermission(Actions.ImportCSV)" />
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="變價單號" controlName="MAM_No"
            [control]="queryForm.controls.MAM_No" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No"
            [options]="vendorOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.LOGO_No" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="進價變價單狀態" controlName="MAM_Status"
            [options]="MAM_StatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.MAM_Status" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="申請人編號/名稱" controlName="APPLY_USR_No"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APPLY_USR_No" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" class="col-12 md:col-6 lg:col-4" n label="審核人編號/名稱"
            controlName="APRV_USR_No" [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APRV_USR_No" [submitted]="submitted"></app-multi-select>
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
          <div class="col-12 md:col-6 lg:col-4 flex align-items-center">
            <p-checkbox formControlName="showReturnPriceOrdersOnly" [binary]="true"
              inputId="showReturnPriceOrdersOnlyCheckbox" />
            <label for="showReturnPriceOrdersOnlyCheckbox" class="ml-2">僅顯示回價變價單</label>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="tls52050Table" dataKey="MAM_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showDelete]="false" [multiSortMeta]="queryForm.controls.SortBy.value"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [addButton]="addButton" [buttonsLoading]="btnLoading()" [editDisabled]="editDisabled">
  </app-table>
</div>
<app-dialog [visible]="dialogVisible()" header="選擇商品明細" (visibleChange)="dialogVisible.set($event)"
  (save)="saveDialog()">
  <app-table-edit class="col" tableKey="tls52050CruDialogTable" dataKey="PLU_MagNo" [data]="dialogData"
    [columns]="dialogColumns" [multiSortMeta]="[{ field: 'PLU_MagNO', order: 1 }]" [canInsert]="false"
    [showDelete]="false" [showCheckBox]="false">
  </app-table-edit>
</app-dialog>
