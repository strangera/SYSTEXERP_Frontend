<div class="card tls52050">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <p-fileUpload #fileUpload mode="basic" chooseIcon="pi pi-upload" accept=".csv"
      (onSelect)="onFileUpload($event);fileUpload.clear()" [auto]="true" chooseLabel="匯入CSV" />
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="變價單號" controlName="MAM_No"
            [control]="queryForm.controls.MAM_No" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商代碼" controlName="VEN_No" [options]="vendorOptions"
            optionLabel="label" optionValue="VEN_No" [control]="queryForm.controls.VEN_No"
            [submitted]="submitted"></app-dropdown>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼" controlName="LOGO_No" [options]="brandOptions"
            optionLabel="Name" optionValue="No" [control]="queryForm.controls.LOGO_No"
            [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="進價變價單狀態" controlName="MAM_Status"
            [options]="MAM_StatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.MAM_Status" [submitted]="submitted"></app-multi-select>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人" controlName="APPLY_USR_No"
            [options]="vendorOptions" optionLabel="user_Name" optionValue="user_No"
            [control]="queryForm.controls.APPLY_USR_No" [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" class="col-12 md:col-6 lg:col-4" n label="審核人編號"
            controlName="APRV_USR_No" [options]="userOptions" optionLabel="user_Name" optionValue="user_No"
            [control]="queryForm.controls.APRV_USR_No" [submitted]="submitted"></app-dropdown>
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
          <div class="col-12 md:col-6 lg:col-4 flex align-items-center">
            <p-checkbox formControlName="showReturnPriceOrdersOnly" [binary]="true"
              inputId="showReturnPriceOrdersOnlyCheckbox" />
            <label for="showReturnPriceOrdersOnlyCheckbox" class="ml-2">僅顯示回價變價單</label>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS52050" dataKey="MAM_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showDelete]="false" [multiSortMeta]="[{ field: 'MAM_No', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading" [addButton]="addButton">
  </app-table>
</div>
