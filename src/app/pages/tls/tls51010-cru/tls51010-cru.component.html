<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="大分類代碼" controlName="CAT_LNo" [control]="dataForm.controls.CAT_LNo"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="大分類名稱" controlName="CAT_LName" [control]="dataForm.controls.CAT_LName"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>
      <hr>
      <app-editor-text label="說明" controlName="CAT_LRemark" [control]="dataForm.controls.CAT_LRemark"
        [style]="{ height: '100px' }" [submitted]="submitted">
      </app-editor-text>
      <hr>
    </form>
    <div class="col pt-4" *ngIf="!isFormReadable">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)"></app-button>
      </div>
    </div>
  </p-panel>
</div>
