<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="活動申請編號"
            controlName="pod_no"
            [control]="dataForm.controls.pod_no"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!--活動編號-->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="活動編號/名稱"
            controlName="act_no"
            [options]="act_no_Options"
            optionLabel="Label"
            optionValue="act_no"
            [control]="dataForm.controls.act_no"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="活動名稱"
            controlName="pod_desc"
            [control]="dataForm.controls.pod_desc"
            [submitted]="submitted"
          ></app-input-text>
        </div> -->
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range
            calendarType="dateRange"
            label="活動期間"
            [startControl]="dataForm.controls.pod_sdate"
            [endControl]="dataForm.controls.pod_edate"
            [submitted]="submitted"
          />
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="活動狀態"
            controlName="pod_status"
            [options]="pod_status_Options"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.pod_status"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <hr />
      <!-- 核准人員 -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="核准人員編號"
            controlName="approved_userno"
            [control]="dataForm.controls.approved_userno"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="核准人員姓名"
            controlName="approved_usr_name"
            [control]="dataForm.controls.approved_usr_name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            label="核准日期"
            controlName="approved_date"
            [control]="dataForm.controls.approved_date"
            [submitted]="submitted"
          ></app-calendar>
        </div>
      </div>
      <hr />
      <!-- 折扣別維護 -->
      <app-table-edit
        class="col-12"
        tableKey="TLS29010Detail"
        [columns]="TALPORDERD_OPENDisc_Detail_Columns"
        [data]="opendisc_Detail"
        dataKey="_tempId"
        (selectionChange)="selectedItems = $event"
        [selectedItems]="selectedItems"
        [keepDeletedData]="true"
        (dataChange)="onDataChange($event)"
        [tableRequired]="true"
        [disabled]="isFormReadable"
        dataStatusField="status"
        [dataStatusValue]="{
          Original: 'original',
          New: 'new',
          Modified: 'modified',
          Deleted: 'deleted',
        }"
      />

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="onReset()"
        ></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
