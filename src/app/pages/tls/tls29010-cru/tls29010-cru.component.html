<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="店部編號" controlName="str_no" [control]="dataForm.controls.str_no"
                    [submitted]="submitted"></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="活動編號" controlName="pod_no" [control]="dataForm.controls.pod_no"
                    [submitted]="submitted"></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-number label="合約編號系統" controlName="talent_id" [control]="dataForm.controls.talent_id"
                    [submitted]="submitted"></app-input-number>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="抽成類別" controlName="tlt_id" [control]="dataForm.controls.tlt_id"
                    [submitted]="submitted"></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="專櫃編號" controlName="tlt_no" [options]="tlt_No_Option" optionLabel="Name"
                    optionValue="No" [control]="dataForm.controls.tlt_no" [submitted]="submitted"></app-dropdown>  
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="折數(條碼)" controlName="cag_barcode" [control]="dataForm.controls.cag_barcode"
                    [submitted]="submitted"></app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="是否使用" controlName="use_flag" [options]="whetherOption" optionLabel="label"
                    optionValue="value" [control]="dataForm.controls.use_flag" [submitted]="submitted"></app-dropdown>
                </div>
            </div>

            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
                *ngIf="!isFormReadable">
                <app-button btnType="cancel" [form]="dataForm"></app-button>
                <app-button btnType="submit"></app-button>
            </div>
        </form>
    </p-panel>
</div>
