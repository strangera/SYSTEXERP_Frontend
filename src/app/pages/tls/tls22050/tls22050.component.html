<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="查詢年月"
              calendarType="dateMonthOne"
              [control]="queryForm.controls.salesDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="查詢日期"
              [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate"
              [minDate]="salesMinDate"
              [maxDate]="salesMaxDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label for="status1">POS類型</label>
            <p-dropdown
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [formControl]="queryForm.controls.status1"
              placeholder="請選擇"
            ></p-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <label for="status2">顯示條件</label>
            <p-dropdown
              [options]="status2Options"
              optionLabel="label"
              optionValue="value"
              [formControl]="queryForm.controls.status2"
              placeholder="請選擇"
            ></p-dropdown>
          </div>
        </div>
        <div>
          <div
            class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
          >
            <app-button btnType="clear"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table
      tableKey="TLS22050"
      [data]="data"
      [columns]="columns"
    ></app-table>
  </div>
</div>
