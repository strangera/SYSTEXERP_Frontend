<div class="card">
  <div class="flex align-items-center gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="交易日期"
              [startControl]="queryForm.controls.TXN_Date_S"
              [endControl]="queryForm.controls.TXN_Date_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="繳袋型態"
            [options]="bagTypeOptions"
            optionLabel="Name"
            optionValue="No"
            controlName="BAG_TYPE"
            [control]="queryForm.controls.BAG_TYPE"
          ></app-dropdown>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="狀態"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            controlName="Status"
            [control]="queryForm.controls.Status"
          ></app-dropdown>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="收銀機代碼"
            [options]="ECR_NoOptions$ | async"
            optionLabel="label"
            optionValue="value"
            controlName="ECR_No"
            [control]="queryForm.controls.ECR_No"
          ></app-dropdown>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="專櫃編號"
            [options]="TLT_NoOptions$ | async"
            optionLabel="label"
            optionValue="value"
            controlName="TLT_No"
            [control]="queryForm.controls.TLT_No"
          ></app-dropdown>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [exportContext]="{ apiUrl: 'queryTLS28050' }"
    tableKey="tls28050"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showDelete]="false"
    [showManage]="false"
    [lazy]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls28050Service.queryTLS28050.bind(tls28050Service)"
  ></app-table-report>
</div>
