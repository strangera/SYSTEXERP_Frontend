<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    <app-button btnType="create" label="複製機台" class="col"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="" controlName=""
            [control]="queryForm.controls." [submitted]="submitted"></app-input-number>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="" controlName="" [control]="queryForm.controls."
            [submitted]="submitted"></app-input-text>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label=""
            [startControl]="queryForm.controls." [endControl]="queryForm.controls."
            [submitted]="submitted"></app-calendar-range>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="" controlName="ECR_Status" [options]=""
            optionLabel="label" optionValue="value" [control]="queryForm.controls.ECR_Status"
            [submitted]="submitted"></app-multi-select>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
    [showCheckBox]="true" dataKey="id" [multiSortMeta]="queryForm.controls.SortBy.value ?? []"
    [totalRecords]="totalRecords" [lazy]="true" [loading]="loading"></app-table>
</div>
