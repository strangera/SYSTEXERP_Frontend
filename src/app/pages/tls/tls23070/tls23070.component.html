<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="銷售月份"
              calendarType="dateMonthOne"
              [control]="queryForm.controls.TXN_Month"
              [submitted]="submitted">
            </app-calendar>
          </div>

          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted">
          </app-calendar-range-quick>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <!-- ✅ 改用 app-table-report；補上必填的 lastQueryBody / queryFunction -->
  <app-table-report
    tableKey="TLS23070"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    dataKey="_rowKey"
    [lastQueryBody]="historyRequestBody"
    [queryFunction]="queryTLS23070ForReport"
     [groupRowsBy]="'TXN_Date'"
     >

    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出專櫃收銀機月報表.PDF"
          icon="pi pi-file"
          [loading]="btnLoading"
          [disabled]="data.length === 0"
          (click)="onExportPDF()">
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
