<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="銷售月份" calendarType="dateMonthOne" [control]="queryForm.controls.TXN_Month"
              [submitted]="submitted"></app-calendar>
          </div>

          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart" [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"></app-calendar-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" [control]="queryForm.controls.tlt_no" [options]="CounterOptions"
              optionLabel="formLabel" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" [control]="queryForm.controls.tlt_building" [options]="BUILDING_NO_Options"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [control]="queryForm.controls.tlt_floor" [options]="floorOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼/名稱" [control]="queryForm.controls.org_id" [options]="OrganizationCodeOptions"
              optionLabel="formLabel" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <button pButton type="submit" class="p-button p-component" [disabled]="mainLoading">
            <span class="p-button-label">查詢</span>
          </button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report *ngIf="mainTableVisible" [tableKey]="'TLS23070_MAIN_' + mainRenderKey" [columns]="columns"
    [data]="data" [totalRecords]="totalRecords" [loading]="mainLoading" dataKey="_rowKey" [lazy]="false"
    [lastQueryBody]="historyRequestBody" [showManage]="false" [showDelete]="false" [showDetail]="true"
    (detail)="onDetail($event)" [footerData]="footerData" [showReportMode]="false" [showReorder]="false">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button styleClass="p-2" label="專櫃收銀機月報表.XLSX" icon="pi pi-file-excel" [loading]="btnLoading"
          [disabled]="!totalRecords || totalRecords === 0" (click)="onExportExcel()"></p-button>
        <p-button styleClass="p-2" label="專櫃收銀機月報表.PDF" icon="pi pi-file" [loading]="btnLoading"
          [disabled]="!totalRecords || totalRecords === 0" (click)="onExportPDF()"></p-button>
      </div>
    </header>
  </app-table-report>
</div>

<app-dialog [visible]="dialogVisible" header="專櫃/機台明細" (visibleChange)="onDialogClose($event)" [showFooter]="false"
  width="95vw">
  <app-table-report *ngIf="detailTableVisible" [tableKey]="'TLS23070_DETAIL_' + detailRenderKey"
    [columns]="detailColumns" [data]="dialogData" [totalRecords]="dialogTotalRecords" [loading]="detailLoading"
    dataKey="_rowKey" [lazy]="false" [lastQueryBody]="dialogHistoryRequestBody" [showManage]="false"
    [showDelete]="false" [showDetail]="false" [footerData]="dialogFooterData"
    [showReportMode]="false"></app-table-report>
</app-dialog>
