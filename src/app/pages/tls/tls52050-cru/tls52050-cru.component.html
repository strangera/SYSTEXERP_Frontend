<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變價單號" controlName="MAM_No"
          [control]="dataForm.controls.MAM_No" [submitted]="submitted"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼" controlName="LOGO_No" [options]="brandOptions"
          optionLabel="Name" optionValue="No" [control]="dataForm.controls.LOGO_No"
          [submitted]="submitted"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商代碼" controlName="VEN_No" [options]="vendorOptions"
          optionLabel="label" optionValue="VEN_No" [control]="dataForm.controls.VEN_No"
          [submitted]="submitted"></app-dropdown>
        <app-input-textarea class="col-12 md:col-6 lg:col-4" label="進價售價變價單說明" controlName="MAM_InvDesc"
          [control]="dataForm.controls.MAM_InvDesc" [submitted]="submitted"></app-input-textarea>
        <app-calendar-range class="col-12 md:col-6 lg:col-4" startLabel="生效日期(起)" endLabel="生效日期(迄)"
          [startControl]="dataForm.controls.MAM_BegDate" [endControl]="dataForm.controls.MAM_EndDate"
          [submitted]="submitted">
          <footer>
            <div class="flex align-items-center pt-2">
              <p-checkbox [binary]="true" inputId="MAM_MethodCheckbox" [formControl]="dataForm.controls.MAM_Method"
                [trueValue]="'1'" [falseValue]="'H'" label="僅顯示回價變價單">
              </p-checkbox>
            </div>
          </footer>
        </app-calendar-range>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人" controlName="RJM_USR_No" [options]="userOptions"
          optionLabel="user_Name" optionValue="user_No" [control]="dataForm.controls.APPLY_USR_No"
          [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="申請日期" controlName="RJM_Date"
          [control]="dataForm.controls.APPLY_Date" [submitted]="submitted" />
        <!-- <app-input-number class="col-12 md:col-6 lg:col-4" label="進價折扣%" controlName="costPriceDiscount"
          [control]="dataForm.controls.costPriceDiscount" [submitted]="submitted"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="進價金額調整" controlName="costPriceAdjustment"
          [control]="dataForm.controls.costPriceAdjustment" [submitted]="submitted"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="售價折扣%" controlName="salePriceDiscount"
          [control]="dataForm.controls.salePriceDiscount" [submitted]="submitted"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="售價金額調整" controlName="salePriceAdjustment"
          [control]="dataForm.controls.salePriceAdjustment" [submitted]="submitted"></app-input-number> -->
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
