<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="變價單號" controlName="MAM_No"
          [control]="dataForm.controls.MAM_No" [submitted]="submitted"></app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼" controlName="LOGO_No"
          [options]="brandOptions | async" optionLabel="Name" optionValue="No" [control]="dataForm.controls.LOGO_No"
          [submitted]="submitted"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商代碼" controlName="VEN_No"
          [options]="vendorOptions | async" optionLabel="label" optionValue="VEN_No"
          [control]="dataForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
        <app-input-textarea class="col-12 md:col-6 lg:col-4" label="進價售價變價單說明" controlName="MAM_Remark"
          [control]="dataForm.controls.MAM_Remark" [submitted]="submitted"></app-input-textarea>
        <app-calendar-range class="col-12 lg:col-8" startLabel="生效日期(起)" endLabel="生效日期(迄)"
          startControlName="MAM_BegDate" endControlName="MAM_EndDate" [startControl]="dataForm.controls.MAM_BegDate"
          [endControl]="dataForm.controls.MAM_EndDate" [submitted]="submitted"
          [endMinDate]="dataForm.value.MAM_BegDate">
          <footer>
            <div class="flex align-items-center pt-2">
              <p-checkbox [binary]="true" formControlName="MAM_Method" inputId="MAM_Method"
                [formControl]="dataForm.controls.MAM_Method" [trueValue]="'1'" [falseValue]="'H'" label="是否為永久變價">
              </p-checkbox>
            </div>
          </footer>
        </app-calendar-range>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="申請人" controlName="RJM_USR_No"
          [control]="dataForm.controls.APPLY_USR_No" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="申請日期" controlName="RJM_Date"
          [control]="dataForm.controls.APPLY_Date" [submitted]="submitted" />
      </div>
      <hr />
      <div class="grid p-fluid">
        <app-input-number class="col-12 md:col-6 lg:col-3" label="進價折扣%" controlName="costPriceDiscount"
          [control]="dataForm.controls.costPriceDiscount" [submitted]="submitted" suffix="%"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-3" label="進價金額調整" controlName="costPriceAmount"
          [control]="dataForm.controls.costPriceAmount" [submitted]="submitted" [min]="null" [minFractionDigits]="2"
          [maxFractionDigits]="2"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-3" label="售價折扣%" controlName="salePriceDiscount"
          [control]="dataForm.controls.salePriceDiscount" [submitted]="submitted" suffix="%"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-3" label="售價金額調整" controlName="salePriceAmount"
          [control]="dataForm.controls.salePriceAmount" [submitted]="submitted" [min]="null"></app-input-number>
      </div>
      <hr />
      <app-table dataKey="id" [columns]="columns" [columnGroup]="columnGroup" [data]="data"
        [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showEdit]="false"
        [showDetail]="false" [showInsert]="true" [showRowEdit]="true" (rowEditSave)="onRowEditSave($event)"
        [showCaption]="isFormCreateable" [showReportMode]="false" [showManage]="!isFormReadable"
        [multiSortMeta]="[{ field: 'PO_No', order: 1 }]" (insert)="dialogVisible = true"
        [showCheckBox]="!isFormReadable" [deleteData]="true" (dataChange)="data = $event" dataStatusField="DATA_STATUS"
        [insertDisabled]="dataForm.controls.VEN_No.value && dataForm.controls.LOGO_No.value ? false : true" />
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-dropdown-table class="col-12" [control]="dialogQueryForm.controls.PLU_MagNo" [submitted]="submitted"
        optionLabel="label" optionValue="PLU_MagNo" [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
        (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
        [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
        [totalRecords]="opTotalRecords">
        <app-input-text class="col-12 md:col-6" label="商品管理編號/國際條碼/廠商貨號" controlName="queryNo"
          [control]="opForm.controls.queryNo" />
        <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
          [control]="opForm.controls.PLU_Name" />
      </app-dropdown-table>
      <app-input-text class="col-12" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="大分類代碼" controlName="CAT_LNo"
        [control]="dialogQueryForm.controls.CAT_LNo" [options]="CAT_LNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="中分類代碼" controlName="CAT_MNo"
        [control]="dialogQueryForm.controls.CAT_MNo" [options]="CAT_MNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="小分類代碼" controlName="CAT_SNo"
        [control]="dialogQueryForm.controls.CAT_SNo" [options]="CAT_SNoOptions" optionLabel="label" optionValue="No" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr />
  <app-table tableKey="tls52010CruDialogTable" dataKey="PLU_MagNo" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, dialogQueryForm); onQuery(dialogQueryForm)"
    [lazy]="true" [loading]="dialogLoading">
  </app-table>
</app-dialog>
