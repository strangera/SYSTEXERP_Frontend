<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 查詢年份 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="查詢年份" calendarType="dateYearOne" [control]="queryForm.controls.budget_yy"
              [submitted]="submitted"></app-calendar>
          </div>
          <!-- 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="TLT_NoList" [control]="queryForm.controls.TLT_NoList"
              [submitted]="submitted" [options]="tltNoOptions" optionLabel="label" optionValue="value" />
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table-report tableKey="TLS2g020" [loading]="loading" [showEdit]="true" [showManage]="true"
      [showDelete]="false" [showDetail]="false" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFn" dataKey="talent_id" [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)" expansionDataKey="Mdeatil" [expansionColumns]="expansionColumns"
      [exportContext]="{ dataKeyName: 'Mdeatil' }"></app-table-report>
  </div>
</div>
