<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 傳票種類 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票種類" controlName="SrcSheetTypeList" [options]="srcSheetTypeOptions"
              optionLabel="Display" optionValue="No" [control]="queryForm.controls.SrcSheetTypeList"
              [submitted]="submitted">
            </app-multi-select>
          </div>
          <!-- 傳票日期(起訖) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" [startControl]="queryForm.controls.VouDate_Start"
              [endControl]="queryForm.controls.VouDate_End" [submitted]="submitted">
            </app-calendar-range>
          </div>
          <!-- 傳票狀態 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票狀態" controlName="TransStatusList" [options]="transStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TransStatusList"
              [submitted]="submitted">
            </app-multi-select>
          </div>
          <!-- 結帳單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="結帳單號" controlName="No" [control]="queryForm.controls.No" [submitted]="submitted">
            </app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS2C040" [data]="data" [columns]="columns" [showCheckBox]="false" [showDelete]="false"
    [showEdit]="false" (detail)="onEdit($event)" [totalRecords]="totalRecords" [loading]="loading"
    [showReportMode]="false" [addButton]="addButton" [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls2c040Service.queryTLS2C040.bind(tls2c040Service)">
  </app-table-report>
</div>
