<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票總類" controlName="subpoenaType" [options]="subpoenaTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.subpoenaType"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="傳票日期" [startControl]="queryForm.controls.startdate"
              [endControl]="queryForm.controls.enddate" [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="傳票狀態" controlName="subpoenaStatus" [options]="subpoenaStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.subpoenaStatus"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="結帳單號" controlName="serialnumber" [control]="queryForm.controls.serialnumber"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS2C040" [data]="data" [columns]="columns" dataKey="UID"
    [multiSortMeta]="[{ field: 'UID', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true" [loading]="loading"
    [showManage]="false" [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"></app-table>
</div>
