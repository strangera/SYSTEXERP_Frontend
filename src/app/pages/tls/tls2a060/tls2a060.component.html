<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" label="銷售日期" [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="Floor_No" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Floor_No" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="收銀機號" controlName="dropdownRange"
              [startControl]="queryForm.controls.ECR_No_Start" [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted" [options]="ECRNoOptions" optionLabel="Name" optionValue="No"></app-dropdown-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別" controlName="Building_No" [options]="buildingNoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.Building_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發票種類" controlName="TXN_GUIPaper" [options]="TXNGUIPaperOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TXN_GUIPaper" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-edit [loading]="loading" [columns]="columns" [(data)]="data" [footerData]="footerData"
    [showCheckBox]="false" [showDelete]="false" [showReorder]="false" [showSort]="true" [disabled]="isClose"
    [scrollable]="true" [showPaginator]="true" [canInsert]="false"
    (fieldChange)="onCellValueChange($event.rowData)"></app-table-edit>
  <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3 bg-white sticky-bottom">
    <app-button btnType="submit" label="審核" [loading]="loading" (clickEvent)="onCheck()"
      [disabled]="isClose"></app-button>
  </div>
</div>
