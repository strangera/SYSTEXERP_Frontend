<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 採購單號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="採購單號" controlName="PO_No"
            [control]="queryForm.controls.PO_No" [submitted]="submitted" />
          <!-- 單據狀態 (採購單狀態) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="採購單狀態" controlName="PO_Status"
            [options]="poStatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.PO_StatusList" [submitted]="submitted" />
          <!-- 商品管理編號/國際條碼/廠商貨號 -->
          <app-dropdown-table class="col-12 md:col-6 lg:col-4" [showOverlay]="false"
            [control]="queryForm.controls.queryNo" [submitted]="submitted" templateLabel="label" optionLabel="PLU_MagNo"
            optionValue="PLU_MagNo" [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
            (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
            [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
            [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table>
          <!-- 倉別 (對應 HOS_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.HOS_NoList" [submitted]="submitted" />
          <!-- 品牌代碼 (對應 LOGO_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.LOGO_NoList" [submitted]="submitted" />
          <!-- 廠商編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No"
            [options]="vendorOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.VEN_No" [submitted]="submitted" />
        </div>
        <hr />
        <div class="grid p-fluid">
          <!-- 申請人員 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人" controlName="APPLY_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APPLY_USR" [submitted]="submitted" />
          <!-- 申請日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted" />
        </div>
        <div class="grid p-fluid">
          <!-- 審核人員 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="審核人" controlName="APRV_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APRV_USR" [submitted]="submitted" />
          <!-- 審核日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted" />
        </div>
        <div class="grid p-fluid">
          <!-- 結案人員 (強制結案人員) -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="結案人" controlName="CLOS_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CLOS_USR" [submitted]="submitted" />
          <!-- 結案日期 (強制結案日期) -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="結案日期"
            [startControl]="queryForm.controls.CLOS_Date_Start" [endControl]="queryForm.controls.CLOS_Date_End"
            [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table apiUrl="queryTLS52010" tableKey="TLS52010" dataKey="PO_No" [data]="data" [columns]="columns"
    (edit)="onEdit($event)" (detail)="onDetail($event)" [showCheckBox]="true" [editDisabled]="editDisabled"
    [multiSortMeta]="[
      { field: 'APPLY_Date', order: -1 },
      { field: 'PO_No', order: 1 },
    ]" [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true" [loading]="loading" [showDelete]="false" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [addButton]="addButton" [buttonsLoading]="btnLoading">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button label="列印採購單PDF" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="列印採購單"
          tooltipPosition="top" icon="fa fa-file-pdf" [rounded]="true" severity="danger" [loading]="printLoading"
          (click)="print(selectedItems,'pdf')" [disabled]="selectedCount === 0 || !this.hasPermission(Actions.Print)" />
        <p-button label="列印採購單EXCEL" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="列印採購單"
          tooltipPosition="top" icon="fa fa-file-lines" [rounded]="true" severity="success" [loading]="printLoading"
          (click)="print(selectedItems,'excel')"
          [disabled]="selectedCount === 0 || !this.hasPermission(Actions.ExportExcel)" />
        <p-button label="結案" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="結案"
          tooltipPosition="top" [rounded]="true" severity="help" (click)="close(selectedItems)"
          [disabled]="disabledClose || selectedCount === 0 || !this.hasPermission(Actions.CloseCase)" />
        <span *ngIf="disabledClose && selectedCount > 0" @slideInFromLeft class="text-sm text-red-600">
          採購單狀態為「部分驗收」可強制結案
        </span>
      </div>
    </header>
  </app-table>
</div>
