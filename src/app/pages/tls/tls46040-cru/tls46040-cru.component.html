<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid p-fluid ">
                <div class="col-20 md:col-10 lg:col-12">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="排程編號" controlName="ECR_SchNo"
                                [control]="dataForm.controls.ECR_SchNo" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-calendar calendarType="dateOne" label="設定啟用日期" controlName="ECR_SchDate"
                                [control]="dataForm.controls.ECR_SchDate" [submitted]="submitted">
                            </app-calendar>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="排程狀態" controlName="ECR_SchStatus" [options]="ECR_SchStatus_Options"
                                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SchStatus"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <!-- <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="收銀機所屬門市店號" controlName="SYS_StoreNo" [control]="dataForm.controls.SYS_StoreNo" [submitted]="submitted">
                            </app-input-number>
                        </div> -->
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="收銀機號" controlName="ECR_No"
                                [control]="dataForm.controls.ECR_No" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="新機台所屬專櫃編號" controlName="ECR_TLT_No"
                                [control]="dataForm.controls.ECR_TLT_No" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="原機台所屬專櫃編號" controlName="ORG_ECR_TLT_No"
                                [control]="dataForm.controls.ORG_ECR_TLT_No" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="新機台所屬收銀員" controlName="ECR_USR_No"
                                [control]="dataForm.controls.ECR_USR_No" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="原機台所屬收銀員" controlName="ORG_ECR_USR_No"
                                [control]="dataForm.controls.ORG_ECR_USR_No" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="新環境變數編號" controlName="ECR_TmplNo"
                                [control]="dataForm.controls.ECR_TmplNo" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="原環境變數編號" controlName="ORG_ECR_TmplNo"
                                [control]="dataForm.controls.ORG_ECR_TmplNo" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="新收銀機狀態" controlName="ECR_Status"
                                [control]="dataForm.controls.ECR_Status" [submitted]="submitted">
                            </app-input-number>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="原收銀機狀態" controlName="ORG_ECR_Status"
                                [control]="dataForm.controls.ORG_ECR_Status" [submitted]="submitted">
                            </app-input-number>
                        </div>
                    </div>
                    <hr>
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-calendar calendarType="dateTimeOne" label="異動作業完成時間" controlName="ECR_SchFinTime"
                                [control]="dataForm.controls.ECR_SchFinTime" [submitted]="submitted">
                            </app-calendar>
                        </div>
                    </div>
                    <!-- <hr>
                    <h5>建立人員</h5>
                    <div class="grid p-fluid">

                            <app-calendar calendarType="dateOne" label="建立日期" controlName="CRT_Date" [control]="dataForm.controls.CRT_Date" [submitted]="submitted">

                        </div>

                            </app-input-text>
                        </div>
                    </div>

                            </app-calendar>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">

                            </app-input-text>
                        </div>
                    </div> -->
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button btnType="cancel" (click)="onCancel()"></app-button>
                        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
