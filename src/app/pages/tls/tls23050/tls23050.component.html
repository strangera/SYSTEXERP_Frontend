<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [control]="queryForm.controls.TXN_Date"
            [submitted]="submitted"
          ></app-calendar>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              class="col-12"
              label="類型"
              groupname="rece_yn"
              [control]="queryForm.controls.rece_yn"
              [options]="WhetherOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              [control]="queryForm.controls.ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="館別"
              [control]="queryForm.controls.tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [control]="queryForm.controls.tlt_floor"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [control]="queryForm.controls.org_id"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    tableKey="TLS23050"
    [lastQueryBody]="historyRequestBody"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [showReportMode]="false"
    [queryFunction]="queryTLS23050ForReport"
    [footerData]="footerData"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="收銀機日報表.PDF"
          icon="pi pi-file"
          [loading]="btnLoading"
          [disabled]="data.length === 0"
          (click)="onExportPDF()"
        ></p-button>
        <p-button
          styleClass="p-2"
          label="收銀機日報表.XLSX"
          icon="pi pi-file-excel"
          [loading]="btnLoading"
          [disabled]="data.length === 0"
          (click)="onExportXLSX()"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
