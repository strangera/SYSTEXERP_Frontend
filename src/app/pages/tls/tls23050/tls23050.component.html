<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 銷售日期 -->

         <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <!-- 是否收銀 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否收銀"
              controlName="rece_yn"
              [options]="WhetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.rece_yn"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 收銀機號 -->
   
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機代號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

 

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

       

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS23050"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true"
    dataKey="ECR_No"
    [multiSortMeta]="[{ field: 'TXN_DateStart', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)">
  </app-table>
</div>
