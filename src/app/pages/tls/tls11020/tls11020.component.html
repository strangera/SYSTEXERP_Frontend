<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="扣款項目編號"
              [control]="queryForm.controls.CAP_Item"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="扣款類別"
              [options]="deductionCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CAP_Type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="扣款項目名稱"
              [control]="queryForm.controls.CAP_Name"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="備註"
              [control]="queryForm.controls.CAP_Remark"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS11020"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    (delete)="onDelete($event)"
    [showCheckBox]="true"
    dataKey="id"
    [multiSortMeta]="[{ field: 'CAP_Item', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
