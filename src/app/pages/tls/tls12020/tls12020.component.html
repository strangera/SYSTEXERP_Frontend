<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="位置編號" controlName="positionNumber"
                                    [options]="positionNumberOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.positionNumber" [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="廠商統一編號" controlName="vendorUID" [options]="vendorUIDOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.vendorUID"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="廠商名稱(中文)" controlName="vendorCName"
                                    [control]="queryForm.controls.vendorCName" [submitted]="submitted">>
                                </app-input-text>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="廠商名稱(英文)" controlName="vendorEName"
                                    [control]="queryForm.controls.vendorEName" [submitted]="submitted">>
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-calendar-range calendarType="dateRange" label="訪談日期"
                                    [startControl]="queryForm.controls.startdate"
                                    [endControl]="queryForm.controls.enddate" [submitted]="submitted">
                                </app-calendar-range>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="訪談人員" controlName="interviewer" [options]="interviewerOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.interviewer"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="意願等級" controlName="willingnessLevel"
                                    [options]="willingnessLevelOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.willingnessLevel" [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
