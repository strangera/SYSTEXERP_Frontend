<div class="card">
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="card">
          <!-- TabMenu 移到這裡 -->
          <p-tabMenu
            [model]="items"
            [(activeItem)]="activeItem"
            class="mb-3"
            (activeItemChange)="onTabChange($event)"
          ></p-tabMenu>

          <!-- DataView 列表/卡片切換 -->
          <p-dataView [value]="filteredData" [layout]="layout">
            <!-- 頂部 -->
            <ng-template pTemplate="header">
              <div class="w-full">
                <!-- 標題 + 切換按鈕 -->
                <div class="flex justify-content-between align-items-center mb-2">
                  <span class="font-bold">機台列表</span>
                  <p-dataViewLayoutOptions (layout)="layout"></p-dataViewLayoutOptions>
                </div>

                <!-- 狀態說明 -->
                <div class="status-container mb-2">
                  <span class="status-label">狀態說明：</span>
                  <div class="status-chip"><i class="pi pi-desktop"></i> 開機</div>
                  <div class="status-chip logout"><i class="pi pi-sign-out"></i> 登出</div>
                  <div class="status-chip success"><i class="pi pi-sync"></i> 交易中</div>
                  <div class="status-chip"><i class="pi pi-users"></i> 完成交班</div>
                  <div class="status-chip warning"><i class="pi pi-pause"></i> 暫停交易</div>
                  <div class="status-chip purple"><i class="pi pi-wallet"></i> 完成清帳</div>
                </div>
              </div>
            </ng-template>

            <!-- List 模式 -->
            <ng-template pTemplate="list" let-data>
              <div class="grid grid-nogutter">
                <div class="col-12" *ngFor="let row of data; let i = index">
                  <div class="flex flex-row justify-content-between align-items-center p-3 border-bottom-1 surface-border">
                    <div class="flex-1">
                      <div><b>序號：</b>{{ i + 1 }}</div>
                      <div><b>位置編號：</b>{{ row.ECR_LocNo }}</div>
                      <div><b>專櫃編號：</b>{{ row.TLT_No }}</div>
                      <div><b>櫃位名稱：</b>{{ row.TLT_Name }}</div>
                    </div>
                    <div class="flex align-items-center gap-2">
                      <i [ngClass]="getStatusIcon(row.EOS_Status)"
                         [ngStyle]="{ color: getStatusColor(row.EOS_Status) }"></i>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>

            <!-- Grid 模式 -->
            <ng-template pTemplate="grid" let-data>
              <div class="grid grid-nogutter">
                <div class="col-12 sm:col-6 md:col-4 xl:col-3 p-2" *ngFor="let row of data; let i = index">
                  <div class="p-3 border-1 surface-border surface-card border-round relative">
                    <!-- 狀態 Icon 右上角 -->
                    <i class="status-icon"
                       [ngClass]="getStatusIcon(row.EOS_Status)"
                       [ngStyle]="{ color: getStatusColor(row.EOS_Status) }"></i>

                    <!-- 主要內容 -->
                    <div class="grid-content">
                      <div class="grid-title">{{ row.ECR_LocNo }}</div>
                      <div class="grid-subtitle">{{ row.TLT_No }} {{ row.TLT_Name }}</div>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>
          </p-dataView>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
