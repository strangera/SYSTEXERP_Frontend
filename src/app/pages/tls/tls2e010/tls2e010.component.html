<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      label="結算"
      icon="pi pi-plus"
      (click)="onSettle(queryForm)"
      [loading]="loading"
      [disabled]="!hasPermission(Actions.Settle)"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateMonthRange"
              label="租金結算年月"
              helpMsg="[結算]或[租金結算鎖定]時，租金結算年月必須相同"
              [startControl]="queryForm.controls.sam_yyymm_start"
              [endControl]="queryForm.controls.sam_yyymm_end"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="單一專櫃查詢"
              controlName="tlt_no"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"
              [options]="tlt_noOptions$ | async"
              optionLabel="label"
              optionValue="value"
              helpMsg="僅【結算】、【查詢】時使用"
            ></app-dropdown>
          </div>
        </div>
        <h6>結算流程 :</h6>
        <ol>
          <li>每個月結算，可單一櫃結算或整批結算</li>
          <li>若已有結算紀錄時，在尚未鎖定前，皆可重新結算。</li>
          <li>鎖定時，執行以下作業</li>
          <ol type="A">
            <li>傳票資料產生</li>
            <li>租金發票套印作業：租金發票資料產生及套印</li>
            <li>
              暫存傳票審核作業：租金傳票拋至總帳系統，租金發票拋至媒申系統
            </li>
          </ol>
        </ol>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button
            label="租金結算鎖定"
            icon="pi pi-lock"
            [loading]="loading"
            (clickEvent)="onLock(queryForm)"
            [disabled]="!hasPermission(Actions.Lock)"
          ></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [showDelete]="false"
    [loading]="loading"
    [showManage]="false"
    [lastQueryBody]="lastQueryBody"
    [footerData]="footerData"
    [queryFunction]="tls2e010Service.queryTls2e010.bind(tls2e010Service)"
  ></app-table-report>
</div>
