<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="結算" icon="pi pi-plus" (click)="onSettle(queryForm)" [loading]="settleLoding"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="租金結算年月" controlName="sam_yyymm"
              [control]="queryForm.controls.sam_yyymm" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="單一專櫃查詢" controlName="tlt_no" [control]="queryForm.controls.tlt_no"
              [submitted]="submitted" [options]="tlt_noOptions$ | async" optionLabel="label" optionValue="value">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="起迄年月"
              [startControl]="queryForm.controls.sam_yyymm_start" [endControl]="queryForm.controls.sam_yyymm_end"
              [submitted]="submitted"></app-calendar-range>
          </div>
        </div>
        <h6>結算流程 :</h6>
        <ol>
          <li>每個月結算，可單一櫃結算或整批結算</li>
          <li>若已有結算紀錄時，在尚未鎖定前，皆可重新結算。</li>
          <li>鎖定時，執行以下作業</li>
          <ol type="A">
            <li>傳票資料產生</li>
            <li>租金發票套印作業：租金發票資料產生及套印</li>
            <li>暫存傳票審核作業：租金傳票拋至總帳系統，租金發票拋至媒申系統</li>
          </ol>
        </ol>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button label="租金結算鎖定" [loading]="lockLoding" (clickEvent)="onLock(queryForm)"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [multiSortMeta]="queryForm.controls.SortBy.value" [totalRecords]="totalRecords" [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showManage]="false"></app-table>
</div>
