<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form
      [formGroup]="dataForm"
      id="dataFormForm"
      (ngSubmit)="onSubmit(dataForm)"
    >
      <div class="card">
        <app-table
          dataKey="id"
          [data]="data"
          [columns]="columns"
          [showCheckBox]="true"
          [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
          [totalRecords]="totalRecords"
          [lazy]="true"
          [loading]="loading"
          [showRowEdit]="true"
          [showReportMode]="false"
          [showEdit]="false"
          [showDetail]="false"
          [showDelete]="false"
          (fieldChange)="onFieldChange($event)"
        ></app-table>
      </div>
    </form>
  </p-panel>
</div>
