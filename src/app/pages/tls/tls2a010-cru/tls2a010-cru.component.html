<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataFormForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="card">
        <app-table-edit [title]="'交易明細'" [columns]="columns" [(data)]="data" [loading]="loading"
          [multiSortMeta]="[{ field: 'TXN_No', order: 1 }]" [showCheckBox]="false" [showInsert]="false"
          [showDelete]="false" [showExcel]="false" [disabled]="false" [canInsert]="false" [footerData]="footerData"
          (fieldChange)="onFieldChange($event)">
        </app-table-edit>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
