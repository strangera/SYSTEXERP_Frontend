<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataFormForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="card">
        <app-customFooter-table dataKey="TXN_No" [data]="data" [columns]="columns" [showCheckBox]="false"
          [multiSortMeta]="[{ field: 'TXN_No', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true"
          (lazyLoadData)="onLazyLoadData($event, dataForm); loadAllData()" [loading]="loading" [showRowEdit]="true"
          [showReportMode]="false" [showEdit]="false" [showDetail]="false" [showDelete]="false"
          [footerData]="footerData" [showTotal]="true" [showPaginator]="true"[showPage]="false"
          (fieldChange)="onFieldChange($event)"></app-customFooter-table>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="submit" [loading]="false" />
      </div>
    </form>
  </p-panel>
</div>
