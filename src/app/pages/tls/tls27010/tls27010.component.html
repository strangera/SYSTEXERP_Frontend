<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="上傳檔案" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <div class="grid p-fluid">
        <app-file-upload #fileUpload class="col-12" name="myFile" [accept]="allowedFileTypes" [multiple]="true"
          chooseLabel="選擇 CSV 或 TXT 檔案" uploadLabel="上傳" cancelLabel="清除" [auto]="false" [customUpload]="true"
          mode="advanced" (select)="files = $event.files" [loading]="loading"
          [disabled]="!hasPermission(Actions.Upload)" emptyMessage="拖曳檔案到此處或點擊「選擇 CSV 或 TXT 檔案」按鈕。"
          (uploadHandler)="handleCustomUpload($event)"></app-file-upload>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <p-accordion>
    <p-accordionTab header="查詢條件" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="檔案日期" controlName="TSDP_SendTime"
            [control]="queryForm.controls.TSDP_SendTime" [submitted]="submitted"></app-calendar>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="檔案來源" controlName="TSDP_FileSrcList"
            [options]="TSDP_FileSrcListOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.TSDP_FileSrcList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="處理狀態" controlName="TSDP_ProcStatusList"
            [options]="TSDP_ProcStatusListOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.TSDP_ProcStatusList" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report dataKey="id" [data]="data" [columns]="columns" [showEdit]="false" [showDetail]="false"
    [showManage]="false" [totalRecords]="totalRecords" [loading]="loading" [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls27010Service.queryTLS27010.bind(tls27010Service)"></app-table-report>
</div>
