<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 月份（選了會同步把日期設成整月） -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="銷售月份"
              [calendarType]="'dateMonthOne'"
              [control]="queryForm.controls.TXN_Month"
              [submitted]="submitted">
            </app-calendar>
          </div>

          <!-- 日期區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="銷售日期"
              [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No_List"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No_List"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收銀機類型"
              controlName="ECR_Type"
              [options]="cahserTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_Type"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="區域"
              controlName="area_no"
              [options]="regionOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.area_no"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4 align-items-center flex">
            <p-checkbox
              binary="true"
              [inputId]="'onlyOver'"
              formControlName="OnlyShowOverAmount"
              label="僅顯示溢欠">
            </p-checkbox>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [type]="'button'" (clickEvent)="onClear(queryForm)"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [tableKey]="'tls2b030'"
    [dataKey]="'TLT_Name'"
    [columns]="columns"
    [data]="data"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showManage]="false"
    [showHeader]="true"
    [showFilter]="true"
    [showReportMode]="true"
    [showExcel]="false"
    [footerData]="footerData"

    [queryFunction]="queryFn"
    [lastQueryBody]="lastQueryBody"

    [showCheckBox]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
  >
  </app-table-report>
</div>
