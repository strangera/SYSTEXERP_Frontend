<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- ✅ 初始化會由 TS 回填 昨天~昨天 -->
          <div class="col-12 md:col-6 lg:col-4">
<app-calendar-range
  class="required"
  label="銷售日期-日報表"
  [startControl]="$any(queryForm.get('TXN_Date_Start'))"
  [endControl]="$any(queryForm.get('TXN_Date_End'))"
  [submitted]="submitted"
></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
<app-calendar
  class="form-item"
  [class.required]="($any(queryForm.get('TXN_Date_Start'))?.disabled && $any(queryForm.get('TXN_Date_End'))?.disabled)"
  label="銷售年月-月報表"
  controlName="TXN_YearMonth"
  [calendarType]="'dateMonthOne'"
  [control]="$any(queryForm.get('TXN_YearMonth'))"
  [submitted]="submitted"
></app-calendar>
          </div>
        </div>

        <hr />

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="$any(queryForm.get('ECR_No_List'))"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="$any(queryForm.get('TLT_No_List'))"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收銀機類型"
              controlName="ECR_Type"
              [options]="cahserTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="$any(queryForm.get('ECR_Type'))"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="$any(queryForm.get('tlt_building'))"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="$any(queryForm.get('tlt_floor'))"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="區域"
              controlName="area_no"
              [options]="regionOptions"
              optionLabel="label"
              optionValue="value"
              [control]="$any(queryForm.get('area_no'))"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <hr />

        <div class="grid p-fluid">
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox
              label="僅顯示溢欠"
              [formControl]="$any(queryForm.get('onlyShowOverflow'))"
              binary="true"
            ></p-checkbox>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" (click)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS2B030"
    [data]="data"
    [columns]="columns"
    dataKey="Rep_YYYYMM"
    [multiSortMeta]="[{ field: 'Rep_YYYYMM', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    [showCheckBox]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
