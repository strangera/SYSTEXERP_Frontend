<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="資料轉入"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <h6>檔案名稱</h6>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-file-upload
                  [uploadUrl]="uploadUrl"
                  [fileType]="fileType"
                ></app-file-upload>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="工作表名稱"
                  controlName="folderName"
                  [control]="queryForm.controls.folderName"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
            </div>
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
        <ul>
          <li>請注意：</li>
          <ul>
            <li>Excel 檔名須為英文或數字！</li>
            <li>Excel 範本檔下載！</li>
          </ul>
        </ul>
      </p-accordion>
    </div>
    <!-- <div class="card">
            <div class="col-13">
                <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-table>
            </div>
        </div> -->
  </div>
</div>
