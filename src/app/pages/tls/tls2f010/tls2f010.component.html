<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="結帳年月" controlName="sam_yyymm"
            [control]="queryForm.controls.sam_yyymm" [submitted]="submitted" />
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="tlt_no" [options]="tlt_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_no" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="單據種類" controlName="PUR_GUIType" [options]="invoiceTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PUR_GUIType" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票/收據號碼" controlName="PUR_GUINO" [control]="queryForm.controls.PUR_GUINO"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="單據日期"
              [startControl]="queryForm.controls.PUR_GUIDate_Start" [endControl]="queryForm.controls.PUR_GUIDate_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="結帳方式" controlName="COMM_MONEY_TYPE" [options]="money_typeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.COMM_MONEY_TYPE"
              [submitted]="submitted"></app-multi-select>
          </div>
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="請款付款年月" controlName="COMM_YM"
            [control]="queryForm.controls.COMM_YM" [submitted]="submitted" />
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="帳次" controlName="sam_termno" [options]="sam_termnoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.sam_termno" [submitted]="submitted"></app-dropdown>
          </div>
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="申報年月" controlName="DEC_YM"
            [control]="queryForm.controls.DEC_YM" [submitted]="submitted" />

        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號/名稱" controlName="ven_no" [options]="ven_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ven_no" [submitted]="submitted"></app-dropdown>
          </div>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="課稅別" controlName="PUR_TaxType"
            [options]="taxTypeOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.PUR_TaxType" [submitted]="submitted"></app-multi-select>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="發票總額"
            [startControl]="queryForm.controls.ACP_GUIAmt_Start" [endControl]="queryForm.controls.ACP_GUIAmt_End"
            [submitted]="submitted"></app-input-number-range>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="未稅金額"
            [startControl]="queryForm.controls.ACP_GUINet_Start" [endControl]="queryForm.controls.ACP_GUINet_End"
            [submitted]="submitted"></app-input-number-range>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="稅額"
            [startControl]="queryForm.controls.ACP_GUITax_Start" [endControl]="queryForm.controls.ACP_GUITax_End"
            [submitted]="submitted"></app-input-number-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發票格式" controlName="PUR_GUIPaper" [options]="invoiceFormatOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PUR_GUIPaper" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="狀況" controlName="check_statusList" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.check_statusList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="傳送日期"
              [startControl]="queryForm.controls.COMM_NUM_Start" [endControl]="queryForm.controls.COMM_NUM_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員" controlName="CRT_USR_No"
            [control]="queryForm.controls.CRT_USR_No" />
        </div>

        <div class="grid p-fluid">

          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox label="是否貼現" [binary]="true" controlName="DEDUCT_YN" formControlName="DEDUCT_YN"></p-checkbox>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateMonthRange" label="建立日期"
              [startControl]="queryForm.controls.CRT_Date_Start" [endControl]="queryForm.controls.CRT_Date_End"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floorList" [options]="tlt_floorOptions | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.tlt_floorList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls27090" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [lastQueryBody]="lastQueryBody" [showDelete]="false" [footerData]="footerData" [showManage]="false"
    [loading]="loading">

  </app-table-report>
</div>
