<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="請款登入"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="結帳年月"
            controlName="sam_yyymm" [control]="queryForm.controls.sam_yyymm" [submitted]="submitted" />
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號/名稱" controlName="tlt_no" [options]="tlt_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.tlt_no" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="單據種類" controlName="PUR_GUIType" [options]="invoiceTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PUR_GUIType" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票/收據號碼" controlName="PUR_GUINO" [control]="queryForm.controls.PUR_GUINO"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="單據日期"
              [startControl]="queryForm.controls.PUR_GUIDate_From" [endControl]="queryForm.controls.PUR_GUIDate_To"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <app-year-month class="col-12 md:col-6 lg:col-4" label="申報年月" [control]="queryForm.controls.DEC_YM"
            [submitted]="submitted" [evenMonth]="true"></app-year-month>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="結帳方式" controlName="COMM_MONEY_TYPE" [options]="money_typeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.COMM_MONEY_TYPE" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div style="position:relative">
              <app-dropdown label="帳次" controlName="sam_termno" [options]="sam_termnoOptions" optionLabel="label"
                optionValue="value" [control]="queryForm.controls.sam_termno" [submitted]="submitted"></app-dropdown>
              <div *ngIf="sam_termnoOptions.length === 0" role="button" aria-disabled="true"
                (click)="onSamTermnoOverlayClick($event)"
                style="position:absolute;inset:0;cursor:pointer;background:transparent;">
              </div>
            </div>

          </div>
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateMonthOne" label="請款付款年月"
            controlName="COMM_YM" [control]="queryForm.controls.COMM_YM" [submitted]="submitted" />

        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商統一編號" controlName="ven_uniform" [options]="venUniformOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.ven_uniform"
              [submitted]="submitted"></app-dropdown>
          </div>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="課稅別" controlName="PUR_TaxType"
            [options]="taxTypeOptions" [optionLabel]="'label'" [optionValue]="'value'"
            [control]="queryForm.controls.PUR_TaxType" [submitted]="submitted"></app-multi-select>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="發票總額"
            [startControl]="queryForm.controls.ACP_GUIAmt_From" [endControl]="queryForm.controls.ACP_GUIAmt_To"
            [submitted]="submitted"></app-input-number-range>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="未稅金額"
            [startControl]="queryForm.controls.ACP_GUINet_From" [endControl]="queryForm.controls.ACP_GUINet_To"
            [submitted]="submitted"></app-input-number-range>

          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="稅額"
            [startControl]="queryForm.controls.ACP_GUITax_From" [endControl]="queryForm.controls.ACP_GUITax_To"
            [submitted]="submitted"></app-input-number-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發票格式" controlName="PUR_GUIPaper" [options]="invoiceFormatOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PUR_GUIPaper" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="建立日期" [startControl]="queryForm.controls.CRT_Date_From"
              [endControl]="queryForm.controls.CRT_Date_To" [submitted]="submitted"></app-calendar-range>
          </div>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員" controlName="CRT_USR_No"
            [control]="queryForm.controls.CRT_USR_No" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="狀況" controlName="Status" [options]="statusOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.Status"
            [submitted]="submitted"></app-multi-select>
        </div>
        <div class="grid p-fluid">

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="floor_no" [options]="tlt_floorOptions | async" optionLabel="Name"
              optionValue="No" [control]="queryForm.controls.floor_no" [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls2f010" dataKey="id" [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [lastQueryBody]="lastQueryBody" [queryFunction]="getCurrentQueryFunction()" [showDelete]="true"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [isRowSelectable]="isRowSelectable"
    [deleteDisabled]="deleteDisabled" [editDisabled]="editDisabled" [showReportMode]="false" [showCheckBox]="true"
    (edit)="onEdit($event)" [footerData]="footerData" [showManage]="true" [showExcel]="true" (detail)="onDetail($event)"
    (delete)="onDelete($event)" [showExcelExport]="true" [exportExcelLoading]="excelLoading"
    (exportExcel)="downloadTemplate()" (importExcel)="onImportExcel($event)" [loading]="loading">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="廠商請款發票明細.PDF" [loading]="btnLoading" icon="pi pi-file-pdf"
            (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
          <p-button styleClass="p-2" label="廠商請款發票明細.xlsx" [loading]="btnLoading2" icon="pi pi-file-excel"
            (click)="onExportExcel()" [disabled]="data.length === 0"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
