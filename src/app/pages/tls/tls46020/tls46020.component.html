<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="複製設定"
      (click)="dialogVisible = true; dialogQueryForm.reset(); submitted = false"></app-button>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="環境變數編號" controlName="ECR_TmplNo"
            [control]="queryForm.controls.ECR_TmplNo" [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-8" label="有效日期" controlName="ECR_EffDate"
            [startControl]="queryForm.controls.ECR_TmplBegDate" [endControl]="queryForm.controls.ECR_TmplEndDate"
            [submitted]="submitted" />
          <app-input-textarea class="col-12" label="模版備註" controlName="ECR_TmplDesc"
            [control]="queryForm.controls.ECR_TmplDesc" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="ECR_TmplNo" [lastQueryBody]="lastQueryFormValue" [loading]="loading"
    [queryFunction]="tls46020Service.queryTLS46020.bind(tls46020Service)" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [showCheckBox]="true" (delete)="onDelete($event)" [data]="data" [columns]="columns" [pageSizeSetting]="'A0'"
    [totalRecords]="totalRecords"></app-table-report>
</div>

<app-dialog [visible]="dialogVisible" header="複製環境變數" (visibleChange)="dialogVisible = $event"
  (save)="saveDialog(dialogQueryForm)" [height]="'auto'">
  <form [formGroup]="dialogQueryForm" class="flex gap-2">
    <app-dropdown (changeEvent)="onDialogChange($event)" class="flex-1" label="來源環境變數" controlName="ECR_No"
      [control]="dialogQueryForm.controls.ECR_TmplNo" [options]="dialogOptions" optionLabel="label" optionValue="No"
      [submitted]="submitted" />
    <app-dropdown (changeEvent)="onDialogChange2($event)" class="flex-1" label="目的環境變數" controlName="Target_ECR_No"
      [control]="dialogQueryForm.controls.Target_ECR_No" [options]="mergedDialogOptions" optionLabel="label"
      optionValue="No" [submitted]="submitted" />
  </form>
  <span class="text-red-500" *ngIf="submitted && isValid">
    無法複製到相同的環境變數
  </span>
</app-dialog>
