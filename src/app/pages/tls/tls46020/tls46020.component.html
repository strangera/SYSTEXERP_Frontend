<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="複製設定" (click)="onCreate()"></app-button>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="環境變數編號" controlName="ECR_TmplNo"
            [control]="queryForm.controls.ECR_TmplNo" [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-8" label="有效日期" controlName="ECR_EffDate"
            [startControl]="queryForm.controls.ECR_TmplBegDate" [endControl]="queryForm.controls.ECR_TmplEndDate"
            [submitted]="submitted" />
          <app-input-textarea class="col-12" label="模版備註" controlName="ECR_TmplDesc"
            [control]="queryForm.controls.ECR_TmplDesc" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [multiSortMeta]="[{ field: 'ECR_TmplNo', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading"></app-table>
</div>
