<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="信用卡 BIN 碼" controlName="CRD_BinCode"
            [control]="queryForm.controls.CRD_BinCode" [submitted]="submitted"></app-input-text>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發卡銀行代號" controlName="BNK_No" [options]="BNK_NoOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
          </div>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="信用卡卡別" controlName="CRD_Type"
            [options]="cardTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CRD_TypeList" [submitted]="submitted"></app-multi-select>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="信用卡卡種" controlName="CRD_Kind"
            [options]="cardCategoryOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CRD_KindList" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="CRD_BinCode" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [totalRecords]="totalRecords" [showCheckBox]="true" (delete)="onDelete($event)"
    (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" [isRowSelectable]="isRowSelectable"
    [loading]="loading" [showExcel]="true" [showExcelExport]="true" [lastQueryBody]="lastQueryBody"
    (exportExcel)="downloadTemplate()" [queryFunction]="tls21040Service.queryTLS21040.bind(tls21040Service)"
    [exportExcelLoading]="excelLoading" (importExcel)="onImportExcel($event)"></app-table-report>
</div>
