<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
  <app-multi-select
  label="收銀機號"
  controlName="ECR_No"
  [options]="ECRNoOptions"
  optionLabel="label"
  optionValue="value"
  [control]="queryForm.controls.ECR_No"
  [submitted]="submitted"
></app-multi-select>
          </div>

    

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.ECR_TLT_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>
      <div class="col-12 md:col-6 lg:col-4"></div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="啟用日期"
              [startControl]="queryForm.controls.EDC_BegDate_From"
              [endControl]="queryForm.controls.EDC_BegDate_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="停用日期"
              [startControl]="queryForm.controls.EDC_EdnDate_From"
              [endControl]="queryForm.controls.EDC_EdnDate_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4"></div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中信刷卡機狀態"
              controlName="EDC_Status1"
              [options]="EDC_Status_Option"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.EDC_Status1"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
             
              label="中信刷卡機IP"
              controlName="EDC_IP1"
              [control]="queryForm.controls.EDC_IP1"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
             
              label="中信刷卡機端末機號"
              controlName="EDC_TmID1"
              [control]="queryForm.controls.EDC_TmID1"
              [submitted]="submitted"
            ></app-input-text>
          </div>


                    <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="聯合刷卡機狀態"
              controlName="EDC_Status2"
              [options]="EDC_Status_Option"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.EDC_Status2"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
             
              label="聯合刷卡機IP"
              controlName="EDC_IP2"
              [control]="queryForm.controls.EDC_IP2"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
             
              label="聯合刷卡機端末機號"
              controlName="EDC_TmID2"
              [control]="queryForm.controls.EDC_TmID2"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4"></div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS41020"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    dataKey="ECR_No"              
    [totalRecords]="totalRecords"
    [lazy]="true"
    [showManage]="true"
    (edit)="onEdit($event)"
    [loading]="loading"
    [showCheckBox]="true"
    [showDelete]="true"
    (delete)="onDelete($event)"
    (detail)="onDetail($event, queryForm.value)"
    (lazyLoadData)="onLazyLoadData($event)"
  ></app-table>
</div>
