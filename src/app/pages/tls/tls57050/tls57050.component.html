<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="顯示方式" controlName="displayMode" [options]="displayModeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.displayMode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="銷售單號" controlName="salesCode" [control]="queryForm.controls.salesCode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="銷售日期" [startControl]="queryForm.controls.salesDateFrom"
              [endControl]="queryForm.controls.salesDateTo" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機號" controlName="receiptMachineCode"
              [control]="queryForm.controls.receiptMachineCode" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="交易序號" controlName="transactionSeqCode"
              [control]="queryForm.controls.transactionSeqCode" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="管理編號" controlName="managementID" [options]="managementIDOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.managementID" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="國際條碼" controlName="barcode" [control]="queryForm.controls.barcode"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="廠商貨號" controlName="barcode" [control]="queryForm.controls.VendorProductNumber"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showManage]="false">
  </app-table>
</div>
