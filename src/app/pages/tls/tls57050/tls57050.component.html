<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="顯示方式" controlName="ReportType" [options]="displayModeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ReportType" [submitted]="submitted"
              [filter]="false"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="銷售單號" controlName="TXN_SaleNoteNo" [control]="queryForm.controls.TXN_SaleNoteNo"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" startLabel="銷售起始日期" endLabel="銷售結束日期"
              startControlName="TXN_DateStart" endControlName="TXN_DateEnd" [submitted]="submitted"
              [startControl]="queryForm.controls.TXN_Date_Start" [endControl]="queryForm.controls.TXN_Date_End" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機號/名稱" controlName="ECR_No" [options]="ECR_NoOptions" optionLabel="label"
              optionValue="No" [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="交易序號" controlName="TXN_No" [control]="queryForm.controls.TXN_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌代碼/名稱" controlName="LOGO_No" [options]="brandCodeOptions" optionLabel="label"
              optionValue="No" [control]="queryForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-table [control]="queryForm.controls.PLU_MagNo" [submitted]="submitted" optionLabel="PLU_MagNo"
              optionValue="PLU_MagNo" templateLabel="label" [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
              (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
              [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
              [totalRecords]="opTotalRecords">
              <app-input-text class="col-12 md:col-6" label="商品管理編號" controlName="queryNo"
                [control]="opForm.controls.queryNo" />
              <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
                [control]="opForm.controls.PLU_Name" />
            </app-dropdown-table>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="國際條碼" controlName="PLU_No" [control]="queryForm.controls.PLU_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商貨號/名稱" controlName="VEN_No" [control]="queryForm.controls.VEN_No"
              [submitted]="submitted" optionLabel="label" optionValue="VEN_No" [options]="vendorOptions"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords" [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showManage]="false">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button styleClass="p-2" label="產出進貨/退貨單據統計表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出進貨/退貨單據統計表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table>
</div>
