<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart" [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"></app-calendar-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號" [control]="queryForm.controls.ECR_No" [options]="ECRNoOptions | async"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range2 label="交易序號" [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End" [submitted]="submitted" [digitsOnly]="true"
              [rangeMaxLength]="10"></app-input-text-range2>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" [control]="queryForm.controls.TLT_No" [options]="CounterOptions | async"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票起始號碼" [control]="queryForm.controls.TXN_GUIBegNo"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票結束號碼" [control]="queryForm.controls.TXN_GUIEndNo"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="交易型態" [control]="queryForm.controls.TXN_Status" [options]="txnStatusOptions$ | async"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="狀態旗標" [control]="queryForm.controls.TXN_FlagStatus" [options]="statusFlagOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀員號碼" [control]="queryForm.controls.USR_No" [options]="cashierOptions | async"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="預售/訂金單號" [control]="queryForm.controls.TXN_PreOrderNo"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="停車卡號" [control]="queryForm.controls.TXN_PkngUID"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="會員卡號" [control]="queryForm.controls.TXN_MemCard"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="統一編號" [control]="queryForm.controls.TXN_Uniform"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="愛心碼" [control]="queryForm.controls.TXN_GUILoveCode"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="載具種類" [control]="queryForm.controls.TXN_GUI_CarrType"
              [options]="carrierTypeOptions" optionLabel="label" optionValue="value"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="載具號碼" [control]="queryForm.controls.TXN_GUIVehicle"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否開立業主發票" [control]="queryForm.controls.rece_yn" [options]="whetherOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否為業主收現" [control]="queryForm.controls.cash_yn" [options]="whetherOptions"
              optionLabel="label" optionValue="value" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" [control]="queryForm.controls.tlt_building"
              [options]="BUILDING_NO_Options | async" optionLabel="Name" optionValue="No"
              [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [control]="queryForm.controls.tlt_floor" [options]="floorOptions | async"
              optionLabel="Name" optionValue="No" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼/名稱" [control]="queryForm.controls.org_id"
              [options]="OrganizationCodeOptions | async" optionLabel="label" optionValue="value"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report [tableKey]="isSummaryMode ? 'TLS23010summary' : 'TLS23010'"
    [data]="isSummaryMode ? summaryData : data" [columns]="isSummaryMode ? summaryColumns : columns"
    [footerData]="isSummaryMode ? buildFooterFromSummaryTotals() : buildFooterFromTotals()"
    [lastQueryBody]="historyRequestBody" [queryFunction]="queryTLS23010ForReport" [totalRecords]="totalRecords"
    dataKey="TXN_No" [showDelete]="false" [showManage]="false" [showReportMode]="false"
    [expansionColumns]="isSummaryMode ? [] : detailcolumns" [expansionLoadFn]="isSummaryMode ? undefined : loadDetails">

    <header>
      <div class="flex justify-content-between align-items-center w-full">
        <div class="flex align-items-center">
          <p-checkbox inputId="showSummary" [formControl]="queryForm.controls.showSummary" binary="true"
            (onChange)="onSubmit(queryForm)" label="顯示彙總"></p-checkbox>
        </div>
        <div class="flex gap-2">
          <p-button styleClass="p-2" [label]="isSummaryMode ? '彙總型態別報表.PDF' : '型態別報表.PDF'" [loading]="btnLoading"
            icon="pi pi-file" (click)="onExportPDF()"
            [disabled]="(isSummaryMode ? summaryData.length === 0 : data.length === 0) && !historyRequestBody">
          </p-button>
          <p-button styleClass="p-2" [label]="isSummaryMode ? '彙總型態別報表.XLSX' : '型態別報表.XLSX'" [loading]="btnLoading"
            [icon]="isSummaryMode ? 'pi pi-file-excel' : 'pi pi-file'" (click)="onExportXLSX()"
            [disabled]="(isSummaryMode ? summaryData.length === 0 : data.length === 0) && !historyRequestBody">
          </p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>

<div class="mt-4 border-t pt-3 text-sm text-red-700 font-medium font-mono" *ngIf="pdfSummary.length">
  <div *ngFor="let line of pdfSummary" style="white-space: pre-wrap;">{{ line }}</div>
</div>
