<p-table #dt [columns]="selectedColumns" [value]="virtualData" [scrollable]="true" [dataKey]="dataKey"
  scrollHeight="450px" sortMode="multiple" (onSort)="onSort($event)" (sortFunction)="customSort($event)"
  [customSort]="!lazy" [resetPageOnSort]="false" [rowTrackBy]="trackByFn" [resizableColumns]="true"
  [reorderableColumns]="true" (onColReorder)="onColReorder($event)"
  styleClass="p-datatable-sm p-datatable-gridlines " [lazy]="lazy" [virtualScrollItemSize]="46"
  [virtualScrollDelay]="0" [virtualScrollOptions]="{
    inline: true,
    trackBy: trackByFn,
    autoSize: true,
    onScroll: onScroll,
  }" [loading]="loading">
  <ng-template pTemplate="caption">
    <app-table-caption [data]="data" [columns]="columns" (columnsEvent)="columns = $event" [dataKey]="dataKey"
      [selectedColumns]="selectedColumns" (selectedColumnsEvent)="selectedColumns = $event" [tableKey]="tableKey"
      [showReportMode]="showReportMode" [showDelete]="showDelete" [showPage]="false"
      [totalRecords]="dt.totalRecords">
      <header><ng-content select="header"></ng-content></header>
    </app-table-caption>
  </ng-template>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th class="w-1rem text-center" pFrozenColumn>序號</th>
      <th *ngFor="let col of columns" pReorderableColumn pResizableColumn
        [pSortableColumn]="col.sortField ?? col.field" [pSortableColumnDisabled]="col.showSort === false"
        class="text-center wrap-header" style="min-width: 55px">
        {{ col.header }}
        <p-sortIcon *ngIf="col.showSort !== false && data.length" [field]="col.field" />
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns">
    <tr [style]="{ height: '46px' }">
      <td class="text-center" pFrozenColumn>{{ rowIndex + 1 }}</td>
      <td *ngFor="let col of columns" [ngStyle]="{
          'text-align': col.align ? col.align : 'center',
          'text-overflow': 'ellipsis',
          'min-width': col.width || '55px',
          width: col.width
        }">
        <ng-container *ngIf="col.type === 'html'">
          <div [innerHTML]="sanitizer.bypassSecurityTrustHtml(rowData[col.field])" class="html-cell"></div>
        </ng-container>
        <span *ngIf="!col.type">
          {{ col.format ? col.format(rowData?.[col.field], rowIndex, rowData) : rowData?.[col.field] }}
        </span>
      </td>
    </tr>
    <ng-container *ngIf="_loading && data.length < totalRecords && rowIndex === data.length - 1">
      <tr *ngFor="let i of [0, 1, 2, 3]" style="height:46px">
        <td pFrozenColumn>
          <p-skeleton />
        </td>
        <td *ngFor="let col of columns">
          <p-skeleton />
        </td>
      </tr>
    </ng-container>
  </ng-template>
  <ng-template pTemplate="footer" let-columns>
    <tr *ngIf="footerData" class="font-bold text-sm bg-gray-200 text-primary">
      <td class="text-center" pFrozenColumn>
        <span class="font-bold">{{ footerLabel }}</span>
      </td>
      <ng-container *ngFor="let col of columns">
        <td [ngStyle]="{'text-align': col.align ? col.align : 'center'}">
          <span class="font-bold">
            <ng-container *ngIf="allowFooterHtml && col.type === 'html'">
              <div
                [innerHTML]="sanitizer.bypassSecurityTrustHtml(col.format ? col.format(footerData[col.field]) : footerData[col.field])">
              </div>
            </ng-container>
            <ng-container *ngIf="!allowFooterHtml || col.type !== 'html'">
              {{ col.format ? col.format(footerData[col.field]) : footerData[col.field] }}
            </ng-container>
          </span>
        </td>
      </ng-container>
    </tr>
  </ng-template>
  <ng-template pTemplate="summary">
    <div class="flex align-items-center justify-content-between p-2">
      <div [style.min-width.px]="150" class="flex align-items-center"></div>
      <div class="flex align-items-center">
        <span [pTooltip]="'已載入筆數 ' + data.length">
          總筆數: {{ totalRecords }} 筆
        </span>
        <p-button icon="pi pi-arrow-up" (click)="dt.scrollTo({ top: 0, behavior: 'smooth'});"
          styleClass="p-button-text p-button-sm ml-2" pTooltip="滾動到頂部" />
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr *ngIf="hasSearched">
      <td [attr.colspan]="1 + columns.length">
        <div class="flex justify-content-center align-items-center min-h-full p-5 font-bold text-xl text-500">
          <i class="pi pi-search mr-2"></i>
          查無資料
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
