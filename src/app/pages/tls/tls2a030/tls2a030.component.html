<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="銷售日期"
              [startControl]="queryForm.controls.SaleDateStart"
              [endControl]="queryForm.controls.SaleDateEnd"
              [submitted]="submitted"
            />
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range
              label="收銀機號"
              controlName="dropdownRange"
              [startControl]="queryForm.controls.ECR_No_Start"
              [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
            ></app-dropdown-range>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS2A030"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showCheckBox]="true"
    dataKey="id"
    [multiSortMeta]="[{ field: 'pendingApprovalRegisterCode', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="false"
  ></app-table>
</div>
