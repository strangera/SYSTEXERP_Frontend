<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range label="銷售日期" [startControl]="queryForm.controls.SaleDateStart"
              [endControl]="queryForm.controls.SaleDateEnd" [submitted]="submitted" />
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="收銀機號" controlName="dropdownRange"
              [startControl]="queryForm.controls.ECR_No_Start" [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted" [options]="ECRNoOptions" optionLabel="label"
              optionValue="value"></app-dropdown-range>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-tls2a030-table-report [data]="data" [columns]="columns" dataKey="PAY_NO" tableKey="tls2a030"
    [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="historyRequestBody"
    [queryFunction]="tls2a030Service.queryTLS2A030.bind(tls2a030Service)" [showDelete]="false"
    [showReportMode]="false" [footerData]="footerData" [allowFooterHtml]="true">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <p-button styleClass="p-2" label="查詢每天資料" icon="pi pi-calendar" (click)="onQueryByDay()"></p-button>
        <p-button styleClass="p-2" label="匯出溢欠彙總表.XLSX" [loading]="btnLoading2" icon="pi pi-file-excel"
          (click)="onExportExcel()" [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-tls2a030-table-report>
</div>
