<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="'TLS55070'" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 銷售單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="銷售單號"
              controlName="TXN_SaleNoteNo"
              [control]="queryForm.controls.TXN_SaleNoteNo">
            </app-input-text>
          </div>

          <!-- 日期區間 -->
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd">
          </app-calendar-range-quick>

          <!-- 收銀機號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="value"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 發票號碼區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="發票號碼"
              [startControl]="queryForm.controls.TXN_GUIBegNoStart"
              [endControl]="queryForm.controls.TXN_GUIBegNoEnd">
            </app-input-text-range>
          </div>

          <!-- 交易序號區間 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              label="交易序號"
              [startControl]="queryForm.controls.TXN_NoStart"
              [endControl]="queryForm.controls.TXN_NoEnd">
            </app-input-number-range>
          </div>

          <!-- LOGO_No / TLT_No / HOS_NO / USR_No -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品牌編號"
              controlName="LOGO_No"
              [options]="logoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.LOGO_No">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="倉別"
              controlName="HOS_NO"
              [options]="hosOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.HOS_NO">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="銷售人員"
              controlName="USR_No"
              [options]="cashierOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.USR_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 交易狀態 / 是否顯示狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="交易狀態"
              controlName="TXN_Status"
              [options]="txnStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_Status">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="異常資料顯示"
              controlName="IsShowStatus"
              [options]="yesNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.IsShowStatus">
            </app-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 明細表（群組小計：以銷售單號為一組，使用 SumTXN_SaleAmt） -->
<div class="card">
  <app-tls2b010table
    #saleTable
    tableKey="TLS55070"
    [data]="data"
    [columns]="columns"
    [dataKey]="'_rowKey'"
    [loading]="activated && loading"
    [lazy]="true"
    [totalRecords]="totalRecords"
    [multiSortMeta]="sortMeta"
    [showManage]="false"
    [showDelete]="false"
     [autoLoad]="false"   
    [showReportMode]="false"
    [groupRowsBy]="groupByField"
    [mergedColumns]="['TXN_SaleNoteNo']"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="匯出銷售明細.xlsx"
          [loading]="btnLoadingExcel"
          icon="pi pi-file-excel"
          (click)="onExportExcel()"
          [disabled]="data.length === 0">
        </p-button>

        <p-button
          styleClass="p-2"
          label="匯出銷售明細.pdf"
          [loading]="btnLoadingPDF"
          icon="pi pi-file-pdf"
          (click)="onExportPDF()"
          [disabled]="data.length === 0">
        </p-button>
      </div>
    </header>

    <!-- lazy 載入 -->
    <ng-container (lazyLoadData)="onLazyLoadData($event, queryForm)"></ng-container>
  </app-tls2b010table>
</div>
