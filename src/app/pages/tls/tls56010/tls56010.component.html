<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 大分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼/名稱" controlName="CAT_LNo" [options]="bigCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_LNo" [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 中分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼/名稱" controlName="CAT_MNo" [options]="midCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_MNo" [submitted]="submitted">
            </app-dropdown>
          </div>

          <!-- 小分類 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼/名稱" controlName="CAT_SNo" [options]="smallCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_SNo" [submitted]="submitted">
            </app-dropdown>
          </div>
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-dropdown-table class="col-12" [showOverlay]="false" [control]="queryForm.controls.PLU_MagNo"
            [submitted]="submitted" optionLabel="label" optionValue="PLU_No" [suggestions]="suggestions"
            [fieldsConfig]="fieldsConfig" (inputValueChanged)="onAutoCompleteInputChange($event)">
          </app-dropdown-table>
          <!-- 品牌代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="品牌代碼" controlName="LOGO_No" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.LOGO_No" [submitted]="submitted">
            </app-multi-select>
          </div>

          <!-- 只顯示低於安全庫存 -->
          <div class="col-12 md:col-6 lg:col-4 mt-5">
            <p-checkbox [binary]="true" label="只顯示低於安全庫存" formControlName="isSafetyStock">
            </p-checkbox>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS56010" [data]="data" [columns]="columns" [showCheckBox]="false" dataKey="id" [showSort]="true"
    [multiSortMeta]="queryForm.value.SortBy || [{ field: 'PLU_MagNo', order: 1 }]" [totalRecords]="totalRecords"
    [lazy]="true" [loading]="loading" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="false" [showDelete]="false">
  </app-table>
</div>
