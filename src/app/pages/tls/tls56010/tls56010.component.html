<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類代碼"
              controlName="bigCategoryCode"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bigCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類代碼"
              controlName="midCategoryCode"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.midCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類代碼"
              controlName="smallCategoryCode"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.smallCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="管理編號"
              controlName="generalCode"
              [options]="managementIdOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.generalCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品牌編號"
              controlName="brandCode"
              [options]="brandCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.brandCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="只顯示低於安全庫存"
              formControlName="isSafetyStock"
            ></p-checkbox>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="TLS2A020"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [showCheckBox]="true"
    dataKey="id"
    [multiSortMeta]="[{ field: 'pendingApprovalRegisterCode', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="false"
  ></app-table>
</div>
