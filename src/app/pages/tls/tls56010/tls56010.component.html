<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 大分類代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類代碼"
              controlName="bigCategoryCode"
              [options]="bigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bigCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 中分類代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="中分類代碼"
              controlName="midCategoryCode"
              [options]="midCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.midCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 小分類代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="小分類代碼"
              controlName="smallCategoryCode"
              [options]="smallCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.smallCategoryCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 管理編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-table
              [control]="queryForm.controls.queryNo"
              [submitted]="submitted"
              optionLabel="PLU_MagNo"
              optionValue="PLU_MagNo"
              [suggestions]="suggestions"
              [fieldsConfig]="fieldsConfig"
              (inputValueChanged)="onAutoCompleteInputChange($event)"
              (formValueChanged)="onformValueChanged($event)"
              [formGroup]="opForm"
              [dialogData]="opData"
              [dialogColumns]="opColumns"
              [loading]="opLoading"
              [totalRecords]="opTotalRecords"
            >
              <app-input-text
                class="col-12 md:col-6"
                label="管理編號"
                controlName="queryNo"
                [control]="opForm.controls.queryNo"
              ></app-input-text>
              <app-input-text
                class="col-12 md:col-6"
                label="商品名稱"
                controlName="PLU_Name"
                [control]="opForm.controls.PLU_Name"
              ></app-input-text>
            </app-dropdown-table>
          </div>
          <!-- 品牌編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品牌編號"
              controlName="brandCode"
              [options]="brandCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.brandCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 安全庫存 -->
          <div class="col-12 md:col-6 lg:col-4 mt-5">
            <p-checkbox
              binary="true"
              label="只顯示低於安全庫存"
              formControlName="isSafetyStock"
            ></p-checkbox>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS2A020"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true"
    dataKey="id"
    [multiSortMeta]="[{ field: 'pendingApprovalRegisterCode', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [showManage]="false"
  ></app-table>
</div>
