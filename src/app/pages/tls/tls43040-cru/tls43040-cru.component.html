<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="機台群組編號"
            controlName="ECR_GrpNo"
            [control]="dataForm.controls.ECR_GrpNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="機台群組名稱"
            controlName="ECR_GrpName"
            [control]="dataForm.controls.ECR_GrpName"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="是否限制機台條件"
            controlName="ECR_DtlLimit"
            [options]="ECR_DtlLimit_Options"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ECR_DtlLimit"
            [submitted]="submitted"
            (valueChange)="onEcrDtlLimitChange($event)"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="機台群組備註"
            controlName="ECR_GrpDesc"
            [control]="dataForm.controls.ECR_GrpDesc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          >
            >
          </app-input-text>
        </div>
        <app-table
          #table
          class="col-12"
          dataKey="ID"
          [columns]="columns"
          [data]="data"
          [showInsert]="!isTableDisabled"
          [showRowEdit]="!isTableDisabled"
          [showCheckBox]="!isTableDisabled"
          [showEdit]="false"
          [showDetail]="false"
          [showCaption]="!isFormReadable"
          [showManage]="!isFormReadable"
          [showReportMode]="false"
          [insertRowData]="true"
          [disabled]="isTableDisabled"
          (selectionChange)="selectedRows = $event"
          [selectedItems]="selectedRows"
          (dataChange)="data = $event"
          dataStatusField="status"
        ></app-table>
      </div>

      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
