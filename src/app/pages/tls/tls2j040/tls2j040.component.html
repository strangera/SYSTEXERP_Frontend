<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          
          <!-- 換開日期 (TxnDate) -->
          <app-calendar class="col-12 md:col-6 lg:col-4" label="換開日期" controlName="TxnDate" [control]="queryForm.controls.TxnDate" [submitted]="submitted"></app-calendar>
                     
          <!-- 三聯式發票號碼 (TxnGUINo) -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="三聯式發票號碼" controlName="TxnGUINo" [control]="queryForm.controls.TxnGUINo" [submitted]="submitted"></app-input-text>
          
          <!-- 買受人統一編號 (TxnUniform) -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="買受人統一編號" controlName="TxnUniform" [control]="queryForm.controls.TxnUniform" [submitted]="submitted"></app-input-text>
          
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
    <app-table tableKey="TLS2J040" dataKey="TxnGUINo" [data]="data" [columns]="columns"
        [showCheckBox]="false" [showEdit]="false" [showDetail]="false" [showManage]="false" [showDelete]="false"
        [multiSortMeta]="[{ field: 'TxnGUINo', order: 1 }]" apiUrl="queryTLS2J040"
        [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
        [lazy]="true" [loading]="loading"
        (selectionChange)="selectedRows = $event"
        [selectedItems]="selectedRows"
        (itemClick)="onRowClick($event)"
        >
    </app-table>
</div>
