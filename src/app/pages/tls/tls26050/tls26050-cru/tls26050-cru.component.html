<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [header]="(rowData?.team_name ?? '') + ' / ' + (rowData?.division_name ?? '')"
  [modal]="true"
  [maximizable]="true"
  [style]="{ width: '95vw' }"
  [contentStyle]="{ overflow: 'auto', padding: '0' }"
>
  <app-table-report
    tableKey="tls26050-detail"
    [lastQueryBody]="historyRequestBody"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [showDelete]="false"
    [showEdit]="false"
    [showManage]="false"
    [loading]="loading"
    [queryFunction]="detailQueryFn"
    [exportContext]="{ apiUrl: 'queryTLS26070' }"
  ></app-table-report>
</p-dialog>
