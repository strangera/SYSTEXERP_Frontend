<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期"
            [control]="queryForm.controls.TXN_Date" [submitted]="submitted" [maxDate]="now"></app-calendar>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號/名稱" [control]="queryForm.controls.TLT_NOList"
            [submitted]="submitted" [options]="TLTTALENT_DropDownList" optionLabel="label" optionValue="No" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="收銀機號/名稱" [control]="queryForm.controls.ECR_NoList"
            [submitted]="submitted" [options]="ECR_NoOptions" optionLabel="label" optionValue="No" />
          <app-input-number class="col-12 md:col-6 lg:col-4" label="金額" controlName="ACT_PayAmt"
            [control]="queryForm.controls.ACT_PayAmt" [submitted]="submitted" [max]="99999999"
            [maxFractionDigits]="4"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="id" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [multiSortMeta]="[{ field: 'id', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false"></app-table>
</div>
