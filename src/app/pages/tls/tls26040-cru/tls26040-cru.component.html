<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="'查詢未結帳資料'" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 銷售日期起迄 -->
        <app-calendar-range class="col-12 md:col-6 lg:col-4" label="銷售日期"
          [startControl]="dataForm.controls.sad_date_start" [endControl]="dataForm.controls.sad_date_end"
          [submitted]="submitted"></app-calendar-range>

        <!-- 專櫃編號(多選) -->
        <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_noList"
          [options]="tltNoOptions" [control]="dataForm.controls.tlt_noList" [submitted]="submitted"
          [optionLabel]="'label'" [optionValue]="'value'"></app-multi-select>

        <!-- 篩選條件 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="篩選條件" controlName="IsNotlt_no"
          [options]="isNotltNoOptions" [control]="dataForm.controls.IsNotlt_no" [submitted]="submitted"
          [optionLabel]="'label'" [optionValue]="'value'"></app-dropdown>

        <!-- 收銀機號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_No" [submitted]="submitted">
          </app-multi-select>
        </div>

        <!-- 交易序號  -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="交易序號" [control]="dataForm.controls.TXN_No" [submitted]="submitted"></app-input-text>
        </div>

      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<div class="card">
  <app-table tableKey="TLS26040_CRU" dataKey="id" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems=$event;selectionChange($event)"
    [multiSortMeta]="[{ field: 'sad_date', order: -1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, dataForm);onSubmit(dataForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false" [showCheckBox]="true" [showManage]="false" [expansionColumns]="expansionColumns"
    expansionDataKey="details" [expansionShowPaginator]="true" [expansionRows]="50" [expansionLoadFn]="loadDetails"
    [expansionMultiSortMeta]="[{ field: 'TXN_Date', order: -1 }]" [showReportMode]="false" [showPaginator]="false">
    <header>
      <div class="flex justify-content-between align-items-center">
        <div class="flex align-items-center gap-2">
          <span>預售總金額：{{totalAmount}}</span>
        </div>
        <div class="flex align-items-center gap-2">
          <app-calendar label="結帳日期" [control]="dataForm2.controls.sad_preorder_date"></app-calendar>
          <span>預估結帳金額：{{estAmount}}</span>
          <app-button label="結帳選定資料" [disabled]="selectedItems.length === 0 || dataForm2.invalid" [loading]="loading"
            (click)="onCheckout()" [loading]="btnLoading"></app-button>
        </div>
      </div>
    </header>
  </app-table>
</div>
