<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <!-- 設定結帳日期 -->
  <div class="mb-3">
    <p-panel [header]="'設定結帳日期'" class="line-height-3 m-0">
      <div class="grid p-fluid">
        <!-- 結帳日期 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            label="結帳日期"
            [control]="dataForm2.controls.sad_preorder_date"
          ></app-calendar>
        </div>

        <!-- 預估結帳金額 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="預估結帳金額"
            [control]="dataForm2.controls.est_amount"
          ></app-input-number>
        </div>
      </div>
      <div class="m-0 mt-2 border-top-1 surface-border pt-3">
        <app-table
          tableKey="TLS26040_Checkout"
          dataKey="rowKey"
          [data]="checkoutData"
          [columns]="checkoutColumns"
          [selectedItems]="selectedCheckoutItems"
          (selectionChange)="
            selectedCheckoutItems = $event; selectionChange($event)
          "
          [showSort]="false"
          (delete)="onRemove($event)"
          [showCheckBox]="true"
          [showManage]="false"
          [showReportMode]="false"
          [showPaginator]="false"
          [showFilter]="false"
          [showPage]="false"
          [emptyMessage]="'尚無認列資料'"
        >
          <header>
            <div class="flex justify-content-end">
              <app-button
                label="結帳選定資料"
                [disabled]="
                  selectedCheckoutItems.length === 0 || dataForm2.invalid
                "
                (click)="onCheckout()"
                [loading]="btnLoading"
              ></app-button>
            </div>
          </header>
        </app-table>
      </div>
    </p-panel>
  </div>
  <!-- 查詢未結帳資料 -->
  <p-panel
    *ngIf="dataForm2.controls.sad_preorder_date.valid"
    [header]="'查詢未結帳資料'"
    class="line-height-3 m-0"
  >
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 預售日期起迄 -->
        <app-calendar-range
          class="col-12 md:col-6 lg:col-4"
          label="預售日期"
          [startControl]="dataForm.controls.sad_date_start"
          [endControl]="dataForm.controls.sad_date_end"
          [submitted]="submitted"
        ></app-calendar-range>

        <!-- 收銀機號 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select
            label="收銀機號"
            controlName="ECR_NoList"
            [options]="ECRNoOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.ECR_NoList"
            [submitted]="submitted"
          ></app-multi-select>
        </div>

        <!-- 交易序號  -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="交易序號"
            [control]="dataForm.controls.TXN_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>

        <!-- 專櫃編號(多選) -->
        <app-multi-select
          class="col-12 md:col-6 lg:col-4"
          label="專櫃編號"
          controlName="tlt_noList"
          [options]="tltNoOptions"
          [control]="dataForm.controls.tlt_noList"
          [submitted]="submitted"
          [optionLabel]="'label'"
          [optionValue]="'value'"
        ></app-multi-select>

        <!-- 篩選條件 -->
        <app-dropdown
          class="col-12 md:col-6 lg:col-4"
          label="篩選條件"
          controlName="IsNotlt_no"
          [options]="isNotltNoOptions"
          [control]="dataForm.controls.IsNotlt_no"
          [submitted]="submitted"
          [optionLabel]="'label'"
          [optionValue]="'value'"
        ></app-dropdown>
      </div>
      <div
        *ngIf="!isFormReadable"
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
      >
        <app-button
          btnType="cancel"
          [form]="dataForm"
          (clickEvent)="reset()"
        ></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>

<div class="card">
  <app-table
    tableKey="TLS26040_CRU"
    dataKey="rowKey"
    [data]="data"
    [columns]="columns"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [totalRecords]="totalRecords"
    [showSort]="false"
    (lazyLoadData)="onLazyLoadData($event, dataForm); onSubmit(dataForm)"
    [lazy]="true"
    [loading]="loading"
    [showDelete]="false"
    [showCheckBox]="true"
    [showEdit]="false"
    [showReportMode]="false"
    [showPaginator]="false"
    [showFilter]="false"
    [showPage]="false"
    (detail)="onDetail($event)"
    [isRowSelectable]="isRowSelectable.bind(this)"
  >
    <header>
      <div class="flex justify-content-between align-items-baseline">
        <app-button
          label="新增認列"
          severity="success"
          [disabled]="selectedItems.length === 0"
          (click)="onAdd()"
        />
        <span class="text-red-500 text-sm font-bold">
          查詢預售總金額：{{ totalAmount | number }}
        </span>
      </div>
    </header>
  </app-table>
</div>

<app-dialog
  [visible]="dialogVisible"
  header="預售明細資料"
  (visibleChange)="dialogVisible = $event"
  (save)="saveDialog()"
  [showFooter]="false"
  [loading]="dialogLoading"
>
  <app-table
    tableKey="TLS26040DialogTable"
    dataKey="TXN_No"
    [data]="dialogData"
    [columns]="dialogColumns"
    [showHeader]="false"
    [showManage]="false"
    [showCheckBox]="false"
    scrollHeight="350px"
    [showCaption]="false"
  ></app-table>
</app-dialog>
