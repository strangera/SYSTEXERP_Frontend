<div class="card">
  <!-- 頂部操作按鈕 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <!-- 非最後一步：顯示下一步 -->
    <app-button
      *ngIf="!isLastStep"
      btnType="create"
      [label]="nextStepLabel"
      (click)="goToNextStep()"
    ></app-button>
    <!-- 最後一步 + 非檢視模式：顯示確認 -->
    <app-button
      *ngIf="isLastStep && !isViewMode"
      btnType="submit"
      label="確認"
      (click)="onSave()"
      [loading]="isSaving"
    ></app-button>
    <app-button btnType="back" (click)="onClearAndExit()"></app-button>
  </div>

  <!-- 步驟指示器 -->
  <div class="steps-header">
    <p-steps
      [model]="steps"
      [activeIndex]="visualStepIndex"
      [readonly]="false"
      (activeIndexChange)="goToStep($event)"
    ></p-steps>
  </div>

  <!-- Commission Type Change Warning -->
  <div
    *ngIf="hasCommissionTypeChanged()"
    class="p-3 mb-3 border-round surface-200"
  >
    <i class="pi pi-exclamation-triangle text-orange-500 mr-2"></i>
    <span class="text-orange-700">抽成別已變更，部分設定可能需要重新調整</span>
  </div>

  <!-- Step Content -->
  <div [ngSwitch]="currentStep" class="step-content">
    <!-- Step 1: Contract Info -->
    <app-step1-contract-info
      *ngSwitchCase="0"
      [form]="dataForm"
      [locationData]="wizardState.locationData"
      [dataReady]="step1DataReady"
      [isViewMode]="isViewMode"
      [isCreateMode]="isFormCreateable"
      [submitted]="submitted"
      (dataChange)="onStep1DataChange($event)"
      (renewalDataLoaded)="onRenewalDataLoaded($event)"
      (openSearchDialog)="openContractSearchDialog()"
    ></app-step1-contract-info>

    <!-- Step 2: Deduction -->
    <app-step2-deduction
      *ngSwitchCase="1"
      [fareItems]="wizardState.fareItems"
      [contractForm]="dataForm"
      [locationData]="wizardState.locationData"
      [crudstatus]="crudstatus"
      [isViewMode]="isViewMode"
      (dataChange)="onStep2DataChange($event)"
    ></app-step2-deduction>

    <!-- Step 3: Commission -->
    <app-step3-commission
      *ngSwitchCase="2"
      [commissionItems]="wizardState.commissionItems"
      [commissionType]="currentCommissionType"
      [crudstatus]="crudstatus"
      [contractStartDate]="dataForm.get('tlt_bdate')?.value || ''"
      [contractEndDate]="dataForm.get('tlt_edate')?.value || ''"
      [contractInfo]="$any(wizardState.contractInfo)"
      [discountOptions]="discountOptions"
      [isViewMode]="isViewMode"
      [capSaletype1]="dataForm.get('cap_saletype1')?.value"
      [capSaletype2]="dataForm.get('cap_saletype2')?.value"
      [capSaletype3]="dataForm.get('cap_saletype3')?.value"
      [capSaletype5]="dataForm.get('cap_saletype5')?.value"
      (commissionItemsChange)="onStep3DataChange($event)"
    ></app-step3-commission>

    <!-- Step 4: Condition -->
    <app-step4-condition
      *ngSwitchCase="3"
      [conditionItems]="$any(wizardState.conditionItems)"
      [commissionType]="currentCommissionType"
      [crudstatus]="crudstatus"
      [talentId]="dataForm.get('talent_id')?.value || ''"
      [contractStartDate]="dataForm.get('tlt_bdate')?.value || ''"
      [contractEndDate]="dataForm.get('tlt_edate')?.value || ''"
      [contractInfoData]="contractInfoDataForStep4"
      [isViewMode]="isViewMode"
      (conditionItemsChange)="onStep4DataChange($any($event))"
    ></app-step4-condition>
  </div>

  <!-- 底部操作按鈕 -->
  <div
    class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
  >
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <!-- 非最後一步：顯示下一步 -->
    <app-button
      *ngIf="!isLastStep"
      btnType="create"
      [label]="nextStepLabel"
      (click)="goToNextStep()"
    ></app-button>
    <!-- 最後一步 + 非檢視模式：顯示確認 -->
    <app-button
      *ngIf="isLastStep && !isViewMode"
      btnType="submit"
      label="確認"
      (click)="onSave()"
      [loading]="isSaving"
    ></app-button>
    <app-button btnType="back" (click)="onClearAndExit()"></app-button>
  </div>
</div>

<!-- 合約查詢對話框（續約用） -->
<app-dialog
  [visible]="showContractSearchDialog"
  (visibleChange)="showContractSearchDialog = $event"
  header="查詢原合約"
  width="1100px"
  [showFooter]="false"
>
  <!-- 搜尋條件 -->
  <form
    [formGroup]="contractSearchForm"
    (ngSubmit)="searchContracts()"
    class="grid p-fluid mb-2"
  >
    <div class="col-12 md:col-4">
      <app-input-text
        label="專櫃編號"
        controlName="tlt_no"
        [control]="contractSearchForm.controls.tlt_no"
      ></app-input-text>
    </div>
    <div class="col-12 md:col-4">
      <app-input-text
        label="櫃位名稱"
        controlName="tlt_name"
        [control]="contractSearchForm.controls.tlt_name"
      ></app-input-text>
    </div>
    <div class="col-12 md:col-4">
      <app-multi-select
        label="廠商統一編號"
        [options]="vendorUIDOptions"
        optionLabel="label"
        optionValue="value"
        [control]="contractSearchForm.controls.ven_uniformList"
      ></app-multi-select>
    </div>
  </form>
  <div class="mb-3">
    <app-button
      btnType="query"
      label="查詢"
      (click)="searchContracts()"
      [loading]="isSearchingContracts"
    ></app-button>
  </div>

  <!-- 查詢結果表格 -->
  <app-table
    tableKey="TLS13020_SEARCH"
    [data]="contractSearchResults"
    [columns]="searchColumns"
    [showCheckBox]="true"
    [selectionMode]="'single'"
    [selectedItems]="selectedSearchRow"
    [showManage]="false"
    [showDelete]="false"
    [showReportMode]="false"
    [showFilter]="false"
    [loading]="isSearchingContracts"
    dataKey="tlt_no"
    (itemClick)="onSelectContractRow($event)"
  ></app-table>
  <p *ngIf="contractSearchResults.length > 0" class="text-sm text-500 mt-1">
    共
    {{
      contractSearchResults.length
    }}
    筆（每個專櫃最後一版），點選列即可帶入續約資料
  </p>
</app-dialog>

<!-- 成功確認對話框 -->
<app-dialog
  [visible]="showSuccessDialog"
  (visibleChange)="onSuccessDialogClose($event)"
  (save)="onSuccessConfirm()"
  header="儲存成功"
  width="420px"
>
  <ng-container *ngIf="successDialogItems.length > 0">
    <div class="flex flex-column gap-3">
      <!-- 成功 banner -->
      <div
        class="flex align-items-center gap-3 p-3 border-round"
        style="background: #f0fdf4"
      >
        <i class="pi pi-check-circle text-3xl" style="color: #16a34a"></i>
        <span class="font-bold text-lg" style="color: #15803d">
          {{ successDialogItems[0].value }}
        </span>
      </div>
      <!-- 詳細資料 -->
      <div class="flex flex-column">
        <div
          *ngFor="let item of successDialogItems.slice(1); let last = last"
          class="flex align-items-center py-2 px-1"
          [style.border-bottom]="last ? 'none' : '1px solid #e5e7eb'"
        >
          <span class="text-500 text-sm" style="min-width: 120px">
            {{ item.label }}
          </span>
          <span class="font-semibold text-sm">{{ item.value }}</span>
        </div>
      </div>
    </div>
  </ng-container>
</app-dialog>
