<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="確定日結" icon="pi pi-check" (click)="defineDateCheckout()"></app-button>
    <app-button label="反日結" icon="pi pi-undo" (click)="undefineDateCheckout()"></app-button>
    <app-button label="本日重算" icon="pi pi-refresh" (click)="undefineDateCheckout()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="結帳日期" calendarType="dateOne"
            [control]="queryForm.controls.onedatedd" [submitted]="submitted"></app-calendar>
        </div>
        <div class="my-3">
          <p>最近關帳日期：{{closeDate}}</p>
        </div>
        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report [data]="tableData()" dataKey="id" tableKey="tls2c030" [columns]="columns"
      [totalRecords]="totalRecords()" [loading]="tableLoading()" [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction" (dataChange)="onTableDataChange($event)" [showManage]="false"
      [showDelete]="false"></app-table-report>
  </div>
</div>
