<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <div class="card">
    <div class="col-12">
      <app-table
        [data]="data"
        [columns]="columnscru"
        [showCheckBox]="false"
        dataKey="id"
        [multiSortMeta]="[{ field: 'id', order: 1 }]"
        [totalRecords]="totalRecords"
        (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
        [lazy]="true"
        [loading]="loading"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        apiUrl="queryTLS22010_Detail"
        [showManage]="false"
        [showDelete]="false"

      >

      </app-table>
    </div>
  </div>
</div>
