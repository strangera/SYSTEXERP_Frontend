<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <div class="card">
    <div class="col-12">
      <app-table
        tableKey="TLS22010CRU"
        [data]="data"
        [columns]="columnscru"
        [showCheckBox]="false"
        dataKey="TXN_No"
        [multiSortMeta]="queryForm.controls.SortBy.value"
        [totalRecords]="totalRecords"
        (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
        [lazy]="true"
        [loading]="loading"
        [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event"
        [showManage]="false"
        [showDelete]="false"
        apiUrl="queryTLS22010_Detail"
      ></app-table>
    </div>
  </div>
</div>
