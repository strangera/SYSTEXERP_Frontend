<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      label="結算"
      icon="pi pi-plus"
      (click)="onSettle(queryForm)"
      [loading]="loading"
      [disabled]="!hasPermission(Actions.Settle)"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              controlName="sam_yyymm"
              label="結算年月"
              [control]="queryForm.controls.sam_yyymm"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="結帳方式"
              controlName="money_type"
              [options]="sam_termnoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.money_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號/名稱"
              controlName="tlt_no"
              [options]="tlt_noOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"
              helpMsg="僅【結算】時使用"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="樓層"
              controlName="tlt_floor"
              [options]="tlt_floorOptions | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
              helpMsg="僅【結算】時使用"
            ></app-dropdown>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    dataKey="id"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showDelete]="false"
    [showManage]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls2d030Service.queryTLS2D030.bind(tls2d030Service)"
  ></app-table-report>
</div>
