<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <div class="card">
    <!-- 📊 資訊列：總筆數/已載入/頁次 -->
<div class="flex flex-wrap items-center justify-between mb-2 px-2 text-sm">
  <div>
    <span class="text-gray-600">總筆數：</span>
    <!-- 後端有回傳總筆數就顯示，否則用目前已載入筆數 -->
    <strong *ngIf="totalCount; else useLoaded">{{ totalCount | number }}</strong>
    <ng-template #useLoaded>
      <strong>{{ data.length | number }}</strong><span class="text-gray-500">（目前）</span>
    </ng-template>

    <!-- 額外提示目前已載入 -->
    <span *ngIf="totalCount" class="text-gray-500">
      （已載入 {{ data.length | number }} 筆{{ allPagesLoaded ? '' : '，尚有更多…' }}）
    </span>
  </div>

  <!-- 顯示頁次（若有 totalPage） -->
  <div *ngIf="totalPage" class="text-gray-600">
    頁次：<strong>{{ currentPage }}</strong> / {{ totalPage }}
  </div>
</div>
 <app-report-table-group
  [columns]="columns"
  [data]="data"
   [subtotalFields]="displayMode === 'Detail'
                      ? ['TXN_TotGUI','TXN_TotSaleAmt','TXN_TotPayAmt']
                      : ['TXN_TotGUI']"     
  [groupByField]="displayMode === 'Summary' ? 'tlt_name' : null"
  [groupByLabel]="'櫃位名稱'"
  [enableGrouping]="displayMode === 'Summary'"
  [defaultMergedView]="displayMode === 'Detail'"
  [reportTitle]="displayMode === 'Detail' ? '型態別明細表' : '型態別彙總表'"
  [currentPage]="currentPage"
  [dateStart]="dateStart"
  [dateEnd]="dateEnd"
  [printedAt]="printedAt"
  [showTotalOnly]="true"
  [allowMergeToggle]="false"
  [detailColumns]="detailColumns"
  [fetchDetailFn]="fetchDetailData"
  [detailFieldKeys]="['TXN_Date','ECR_No','TXN_No']"
  [showExpandColumn]="displayMode === 'Detail'"
  [rowExpandMode]="'single'"
  [dataKey]="'TXN_Key'"
  



 [showGrandTotal]="showGrandTotal"
  (reachBottom)="onReachBottom()"
></app-report-table-group>
  </div>
</div>
