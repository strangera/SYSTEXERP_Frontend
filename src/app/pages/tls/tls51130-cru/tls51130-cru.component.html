<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="品牌"
            [options]="LOGOOptions"
            [control]="dataForm.controls.LOGO_No"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="大分類"
            [options]="CAT_LOptions"
            [control]="dataForm.controls.CAT_LNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="中分類"
            [options]="CAT_MOptions"
            [control]="dataForm.controls.CAT_MNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="小分類"
            [options]="CAT_SOptions"
            [control]="dataForm.controls.CAT_SNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="品牌進貨折數"
            controlName="Source_Doc_No"
            [control]="dataForm.controls.PLU_OrderPrcRate"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註"
            controlName="Voucher_No"
            [control]="dataForm.controls.DISC_Remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>

      <!-- 按鈕列 -->
      <div
        class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="smartclear" />
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
