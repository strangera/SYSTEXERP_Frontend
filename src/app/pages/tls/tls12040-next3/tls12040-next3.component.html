<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" label="上一步" (click)="onCancel()"></app-button>
    <app-button
      [hidden]="isReadOnlyMode"
      btnType="submit"
      label="確認"
      (click)="onSubmitNext()"
    ></app-button>
    <app-button
      btnType="cancel"
      label="離開"
      (click)="onClearAndExit()"
    ></app-button>
  </div>

  <!-- 載入中指示器 -->
  <div
    *ngIf="loading"
    class="flex justify-content-center align-items-center p-4"
  >
    <p-progressSpinner></p-progressSpinner>
    <span class="ml-2">載入條件設定資料中...</span>
  </div>

  <!-- 主要內容 -->
  <div *ngIf="!loading">
    <!-- 專櫃契約書資訊 -->
    <p-accordion *ngIf="currentContractData">
      <p-accordionTab
        header="專櫃契約書資訊"
        [selected]="true"
        class="line-height-3 m-0"
      >
        <div class="col-12">
          <app-expandable-edit-table
            class="custom-table-red"
            [data]="contractInfoData"
            [mainColumns]="contractInfoColumns"
            [showCheckBox]="false"
            [showPaginator]="false"
            [showAddButton]="false"
            [showBatchDelete]="false"
            [loading]="loading"
            [dataKey]="'id'"
            [readonly]="true"
            [detailKey]="''"
            [emptyMessage]="'沒有合約資訊'"
          ></app-expandable-edit-table>
        </div>
      </p-accordionTab>
    </p-accordion>

    <!-- 動態表格渲染 -->
    <ng-container *ngFor="let tableConfig of getVisibleTableConfigurations()">
      <p-accordion>
        <p-accordionTab
          [header]="tableConfig.title"
          [selected]="true"
          class="line-height-3 m-0"
        >
          <div>
            <app-expandable-edit-table
              [data]="getTableData(tableConfig)"
              [mainColumns]="getTableColumns(tableConfig)"
              [showCheckBox]="getTableSetting(tableConfig, 'showCheckBox')"
              [showPaginator]="false"
              [showAddButton]="getTableSetting(tableConfig, 'showAddButton')"
              [showBatchDelete]="
                getTableSetting(tableConfig, 'showBatchDelete')
              "
              [showActionColumn]="
                getTableSetting(tableConfig, 'showActionColumn')
              "
              [autoAddRowOnTab]="
                getTableSetting(tableConfig, 'autoAddRowOnTab')
              "
              [showSequenceNumber]="
                getTableSetting(tableConfig, 'showSequenceNumber')
              "
              [loading]="loading"
              [dataKey]="'id'"
              [readonly]="
                getTableSetting(tableConfig, 'readonly') || isViewMode
              "
              [forceEditMode]="
                !isReadOnlyMode && getTableSetting(tableConfig, 'forceEditMode')
              "
              [detailKey]="''"
              [emptyMessage]="tableConfig.emptyMessage"
              (addMainItem)="callTableMethod(tableConfig.addMethod)"
              (save)="onTableSave($event, tableConfig.commissionType)"
              (edit)="onTableEdit($event, tableConfig.commissionType)"
              (cancel)="onTableCancel($event, tableConfig.commissionType)"
              (batchDelete)="onBatchDelete($event, tableConfig.commissionType)"
              (fieldChange)="
                onTableFieldChange($event, tableConfig.commissionType)
              "
              [showBatchDelete]="!isReadOnlyMode"
              [showAddButton]="!isReadOnlyMode"
            ></app-expandable-edit-table>
          </div>
        </p-accordionTab>
      </p-accordion>
    </ng-container>

    <!-- 如果抽成別不在已知類型中，顯示提示 -->
    <div *ngIf="shouldShowUnsupportedTypeMessage()" class="text-center p-5">
      <i class="pi pi-info-circle text-4xl text-gray-400 mb-3"></i>
      <h5 class="text-gray-600 mb-2">此抽成類型暫不支援條件設定</h5>
      <p class="text-gray-500 mb-3">
        當前抽成類型代碼：
        <strong>{{ getCurrentCommissionTypeName() }}</strong>
      </p>
      <p class="text-gray-500 text-sm">
        可直接進入下一步，或返回前一步修改抽成類型
      </p>
    </div>
  </div>
</div>

<!-- 確認對話框 -->
<p-dialog
  [(visible)]="showConfirmDialog"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="p-fluid"
  header="最終確認"
  [style]="{ width: '450px' }"
>
  <div class="flex align-items-center justify-content-center mb-4">
    <i class="pi pi-exclamation-triangle text-4xl text-orange-500 mr-3"></i>
    <span class="text-lg">確定要提交契約資料嗎？</span>
  </div>

  <div class="text-sm text-gray-600 mb-4">
    <p class="mb-2">提交後將會：</p>
    <ul class="list-disc pl-4">
      <li>儲存所有契約設定資料</li>
      <li>完成契約建立流程</li>
    </ul>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="取消"
        icon="pi pi-times"
        [text]="true"
        severity="secondary"
        (click)="onConfirmDialogResult(false)"
      ></p-button>
      <p-button
        label="確定提交"
        icon="pi pi-check"
        severity="success"
        (click)="onConfirmDialogResult(true)"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
