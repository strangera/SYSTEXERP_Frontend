<div class="card">
  <!-- 固定操作按鈕 -->
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <!-- 查詢表單 -->
  <p-accordion [multiple]="true">
    <!-- 基本資訊 -->
    <p-accordionTab
      header="{{ '基本資訊' }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-number
              [useGrouping]="false"
              label="專櫃招募編號"
              controlName="recruitmentCode"
              [control]="queryForm.controls.recruitmentCode"
              [submitted]="submitted"
              maxlength="8"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="專櫃名稱"
              controlName="counterName"
              [control]="queryForm.controls.counterName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="專櫃編號"
              controlName="counterCode"
              [options]="counterCodeOptions"
              [control]="queryForm.controls.counterCode"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="大分類"
              controlName="businessTypeCode"
              [options]="businessTypeCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.businessTypeCodeOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="廠商統一編號"
              controlName="vendorCode"
              [options]="vendorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.vendorCode"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="營業型態"
              controlName="businessType"
              [options]="businessTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.businessType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 地點資訊 -->
    <p-accordionTab
      header="{{ '櫃位地點資訊' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="位置"
              controlName="locationCode"
              [options]="locationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.locationCode"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="區域"
              controlName="regionCode"
              [options]="regionOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.regionCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="樓層"
              controlName="floorCode"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.floorCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 合約資訊 -->
    <p-accordionTab
      header="{{ '合約資訊' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="合約狀態"
              controlName="contractStatus"
              [options]="contractStatusOptions"
              optionLabelalk="label"
              optionValue="value"
              [control]="queryForm.controls.contractStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="洽談者"
              controlName="negotiator"
              [options]="negotiatorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.negotiator"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="回函日期"
              [startControl]="queryForm.controls.responseStartDate"
              [endControl]="queryForm.controls.responseEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="回函截止日"
              [startControl]="queryForm.controls.responseDeadlineStartDate"
              [endControl]="queryForm.controls.responseDeadlineEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="洽談日期"
              [startControl]="queryForm.controls.negotiationStartDate"
              [endControl]="queryForm.controls.negotiationEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="契約起始日"
              [startControl]="queryForm.controls.contractStartDate"
              [endControl]="queryForm.controls.contractEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="契約截止日"
              [startControl]="queryForm.controls.contractDeadlineStartDate"
              [endControl]="queryForm.controls.contractDeadlineEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 營運資訊 -->
    <p-accordionTab
      header="{{ '營運資訊' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="營運狀況"
              controlName="operationStatus"
              [options]="operationStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.operationStatus"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="組織"
              controlName="organizationCode"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.organizationCode"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="營運起始日"
              [startControl]="queryForm.controls.operationStartDate"
              [endControl]="queryForm.controls.operationEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-calendar-range
              calendarType="dateRange"
              label="營運截止日"
              [startControl]="queryForm.controls.operationDeadlineStartDate"
              [endControl]="queryForm.controls.operationDeadlineEndDate"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
      </form>
    </p-accordionTab>

    <!-- 財務與其他資訊 -->
    <p-accordionTab
      header="{{ '財務與其他資訊' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="抽成額計算方式"
              controlName="commissionCalculation"
              [options]="commissionCalculationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.commissionCalculation"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="抽成別"
              controlName="commissionType"
              [options]="commissionTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.commissionType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="結帳方式"
              controlName="settlementMethod"
              [options]="settlementMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.settlementMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="付款方式"
              controlName="paymentMethod"
              [options]="paymentMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.paymentMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="配合方式"
              controlName="cooperationMethod"
              [options]="cooperationMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cooperationMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="請款單據別"
              controlName="settlementMethod"
              [options]="settlementMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.settlementMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="櫃別"
              controlName="counterCategory"
              [options]="counterCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.counterCategory"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="裝潢方式"
              controlName="decorationMethod"
              [options]="decorationMethodOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.decorationMethod"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="月結天數"
              controlName="counterName"
              [control]="queryForm.controls.counterName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-input-text
              label="超出部份處理方式"
              controlName="counterName"
              [control]="queryForm.controls.counterName"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="是否開立業主發票"
              controlName="issueOwnerInvoice"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="是否使用業主收銀機"
              controlName="useOwnerCashRegister"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-dropdown
              label="是否為業主收現"
              controlName="ownerCashCollection"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="是否抄表"
              controlName="IsMeterRead"
              [options]="isMeterReadOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.isMeterReadOption"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="有無保證金"
              controlName="IsGuaranteedByNote"
              [options]="isGuaranteedByNoteOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.isGuaranteedByNoteOption"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <app-multi-select
              label="保證金付款方式"
              controlName="IsGuaranteedByNote"
              [options]="isTestOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.isTestOption"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
  <hr />
  <div
    class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
  >
    <app-button btnType="clear"></app-button>
    <app-button btnType="query" [loading]="loading"></app-button>
  </div>
</div>

<!-- 資料表格 -->
<div class="card">
  <div class="col-12">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)"
      [showCheckBox]="true"
      dataKey="id"
      [multiSortMeta]="queryForm.controls.SortBy.value"
      [totalRecords]="totalRecords"
      [lazy]="true"
      [loading]="loading"
    ></app-table>
  </div>
</div>
