<div class="card">
  <!-- 操作按鈕區域 - 參考 SYSB800 的格式 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>

  <!-- 查詢條件區域 -->
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!-- 基本資訊 -->
        <div class="mb-4">
          <h6 class="text-primary mb-3">{{ "基本資訊" | translate }}</h6>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="專櫃招募編號"
                controlName="recruitmentCode"
                [control]="queryForm.controls.recruitmentCode"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="專櫃名稱"
                controlName="counterName"
                [control]="queryForm.controls.counterName"
                [submitted]="submitted"
              ></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="專櫃編號"
                controlName="counterCode"
                [options]="counterCodeOptions"
                [control]="queryForm.controls.counterCode"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="大分類"
                controlName="businessTypeCode"
                [options]="businessTypeCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.businessTypeCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="廠商統一編號"
                controlName="vendorCode"
                [options]="vendorOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.vendorCode"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="營業型態"
                controlName="businessType"
                [options]="businessTypeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.businessType"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>

        <!-- 地點資訊 -->
        <div class="mb-4">
          <h6 class="text-primary mb-3">{{ "櫃位地點資訊" | translate }}</h6>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="位置"
                controlName="locationCode"
                [options]="locationOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.locationCode"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="區域"
                controlName="regionCode"
                [options]="regionOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.regionCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="樓層"
                controlName="floorCode"
                [options]="floorOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.floorCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
          </div>
        </div>

        <!-- 合約資訊 -->
        <div class="mb-4">
          <h6 class="text-primary mb-3">{{ "合約資訊" | translate }}</h6>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="合約狀態"
                controlName="contractStatus"
                [options]="contractStatusOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.contractStatus"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="洽談者"
                controlName="negotiator"
                [options]="negotiatorOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.negotiator"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="回函日期"
                [startControl]="queryForm.controls.responseStartDate"
                [endControl]="queryForm.controls.responseEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="回函截止日"
                [startControl]="queryForm.controls.responseDeadlineStartDate"
                [endControl]="queryForm.controls.responseDeadlineEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="洽談日期"
                [startControl]="queryForm.controls.negotiationStartDate"
                [endControl]="queryForm.controls.negotiationEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="契約起始日"
                [startControl]="queryForm.controls.contractStartDate"
                [endControl]="queryForm.controls.contractEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="契約截止日"
                [startControl]="queryForm.controls.contractDeadlineStartDate"
                [endControl]="queryForm.controls.contractDeadlineEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
          </div>
        </div>

        <!-- 營運資訊 -->
        <div class="mb-4">
          <h6 class="text-primary mb-3">{{ "營運資訊" | translate }}</h6>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="營運狀況"
                controlName="operationStatus"
                [options]="operationStatusOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.operationStatus"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="組織"
                controlName="organizationCode"
                [options]="organizationOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.organizationCode"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="營運起始日"
                [startControl]="queryForm.controls.operationStartDate"
                [endControl]="queryForm.controls.operationEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-calendar-range
                calendarType="dateRange"
                label="營運截止日"
                [startControl]="queryForm.controls.operationDeadlineStartDate"
                [endControl]="queryForm.controls.operationDeadlineEndDate"
                [submitted]="submitted"
              ></app-calendar-range>
            </div>
          </div>
        </div>

        <!-- 財務與其他資訊 -->
        <div class="mb-4">
          <h6 class="text-primary mb-3">{{ "財務與其他資訊" | translate }}</h6>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="抽成額計算方式"
                controlName="commissionCalculation"
                [options]="commissionCalculationOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.commissionCalculation"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="抽成別"
                controlName="commissionType"
                [options]="commissionTypeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.commissionType"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="結帳方式"
                controlName="settlementMethod"
                [options]="settlementMethodOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.settlementMethod"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="付款方式"
                controlName="paymentMethod"
                [options]="paymentMethodOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.paymentMethod"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="配合方式"
                controlName="cooperationMethod"
                [options]="cooperationMethodOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.cooperationMethod"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="櫃別"
                controlName="counterCategory"
                [options]="counterCategoryOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.counterCategory"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="裝潢方式"
                controlName="decorationMethod"
                [options]="decorationMethodOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.decorationMethod"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="是否開立業主發票"
                controlName="issueOwnerInvoice"
                [options]="whetherOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.issueOwnerInvoice"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="是否使用業主收銀機"
                controlName="useOwnerCashRegister"
                [options]="whetherOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.useOwnerCashRegister"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown
                label="是否為業主收現"
                controlName="ownerCashCollection"
                [options]="whetherOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.ownerCashCollection"
                [submitted]="submitted"
              ></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="是否抄表"
                controlName="isMeterReadOption"
                [options]="isMeterReadOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.isMeterReadOption"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="有無保證金"
                controlName="isGuaranteedByNoteOption"
                [options]="isGuaranteedByNoteOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.isGuaranteedByNoteOption"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-multi-select
                label="保證金付款方式"
                controlName="isTestOption"
                [options]="isTestOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.isTestOption"
                [submitted]="submitted"
              ></app-multi-select>
            </div>
          </div>
        </div>

        <!-- 查詢按鈕區域 -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" (click)="onClearForm()"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 資料表格區域 -->
<div class="card">
  <app-table
    tableKey="TLS13010"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    (delete)="onDelete($event)"
    [showCheckBox]="true"
    dataKey="talent_id"
    [multiSortMeta]="[{ field: 'talent_id', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [isRowSelectable]="isRowSelectable"
    [loading]="loading"
  ></app-table>
</div>
