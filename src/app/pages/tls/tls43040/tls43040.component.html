<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="群組代碼" controlName="ECR_GrpNo" [control]="queryForm.controls.ECR_GrpNo"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="群組名稱" controlName="ECR_GrpName" [control]="queryForm.controls.ECR_GrpName"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="機台群組備註" controlName="ECR_GrpDesc" [control]="queryForm.controls.ECR_GrpDesc"
              [style]="{ height: '100px' }" [submitted]="submitted">
              >
            </app-input-text>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table tableKey="TLS43040" dataKey="ECR_GrpNo" [data]="data" [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
      [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true" [showReportMode]="false" [showDelete]="false" [loading]="loading" (detail)="onDetail($event)"
      [showRowEdit]="false" [showEdit]="false" [columns]="columns7" expansionDataKey="ECR_Details"
      [expansionColumns]="expansionColumns7"></app-table>
  </div>
</div>
