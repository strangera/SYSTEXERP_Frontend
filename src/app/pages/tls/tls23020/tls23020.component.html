<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"
          ></app-calendar-range-quick>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="交易序號"
              [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="字軌發票號碼"
              controlName="TXN_GUINo"
              [control]="queryForm.controls.TXN_GUINo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="單項售價"
              [startControl]="queryForm.controls.PLU_SalePrc_Start"
              [endControl]="queryForm.controls.PLU_SalePrc_End"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="稅別"
              controlName="TXN_TaxType"
              [options]="taxableOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_TaxType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="商品抽成類別"
              controlName="tlt_id"
              [options]="deductionbigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="單品編號"
              controlName="PLU_MagNo"
              [control]="queryForm.controls.PLU_MagNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="歸屬折扣別"
              controlName="TXN_DiscCode"
              [options]="discountOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_DiscCode"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label>顯示狀態</label>
            <p-checkbox
              label="自營櫃無單品條碼"
              binary="true"
              formControlName="IsNoPLU_No"
            ></p-checkbox>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否開立業主發票"
              controlName="rece_yn"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.rece_yn"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為業主收現收現"
              controlName="cash_yn"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cash_yn"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="col-12 md:col-6 lg:col-4">
  <p-checkbox
    inputId="showSummary"
    [ngModelOptions]="{ standalone: true }"
    [(ngModel)]="showSummary"
    binary="true"
    (onChange)="onToggleSummary()"
    label="顯示彙總"
  ></p-checkbox>
</div>

<div class="card">
  <div class="col-12">
    <!-- ✅ 明細表 -->
    <app-table2
      *ngIf="!showSummary"
      tableKey="TLS23020"
      [data]="data"
      [columns]="columns"
      [showCheckBox]="false"
      dataKey="_rowKey"
      [multiSortMeta]="sortMeta"
      [totalRecords]="totalRecords"
      [lazy]="true"
      [loading]="loading"
      [showManage]="false"
      [showDelete]="false"
      (lazyLoadData)="onLazyLoadData($event, queryForm)"
      [showSubTotal]="true"
      [showTotal]="true"
      [groupRowsBy]="'tlt_no'"
      [externalTotals]="detailTotals"
      [externalTotalFieldMap]="detailTotalFieldMap"
      [externalSubtotals]="detailSubtotals"
      [externalSubtotalFieldMap]="detailSubtotalFieldMap"
    >
      <header>
        <div class="flex justify-content-end gap-2">
          <p-button
            styleClass="p-2"
            label="產出折扣別報表.PDF"
            [loading]="btnLoading"
            icon="pi pi-file"
            (click)="onExportPDF()"
            [disabled]="data.length === 0"
          ></p-button>

          <p-button
            styleClass="p-2"
            label="產出折扣別報表.XLSX"
            [loading]="btnLoading"
            icon="pi pi-file-excel"
            (click)="onExportXLSX()"
            [disabled]="data.length === 0"
          ></p-button>
        </div>
      </header>
    </app-table2>

    <!-- ✅ 彙總表 -->
    <app-table
      *ngIf="showSummary"
      tableKey="TLS23020summary"
      [data]="summaryData"
      [columns]="summaryColumns"
      [totalRecords]="summaryData.length || 0"
      [loading]="loading"
      [showCheckBox]="false"
      [showManage]="false"
      [showDelete]="false"
    ></app-table>
  </div>
</div>
