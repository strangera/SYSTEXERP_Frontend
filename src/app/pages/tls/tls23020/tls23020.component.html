<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-calendar-range
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted"
          ></app-calendar-range>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              [control]="queryForm.controls.ECR_No"
              [options]="ECRNoOptions"
              optionLabel="formLabel"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="交易序號"
              [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              [control]="queryForm.controls.TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="發票號碼"
              [control]="queryForm.controls.TXN_GUINo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="單項售價"
              [startControl]="queryForm.controls.TXN_SaleAmt_Start"
              [endControl]="queryForm.controls.TXN_SaleAmt_End"
              [submitted]="submitted"
            ></app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="稅別"
              [control]="queryForm.controls.PLU_TaxType"
              [options]="taxableOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="原折扣別"
              [control]="queryForm.controls.PRM_TXN_DiscCode"
              [options]="discountOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="商品抽成類別"
              [control]="queryForm.controls.tlt_id"
              [options]="deductionbigCategoryOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="單品編號"
              [control]="queryForm.controls.PLU_MagNo"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="歸屬折扣別"
              [control]="queryForm.controls.TXN_DiscCode"
              [options]="discountOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4 flex align-items-center pt-4">
            <p-checkbox
              label="自營櫃無單品條碼"
              binary="true"
              formControlName="IsNoPLU_No"
            ></p-checkbox>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否開立業主發票"
              [control]="queryForm.controls.rece_yn"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為業主收現"
              [control]="queryForm.controls.cash_yn"
              [options]="whetherOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="館別"
              [control]="queryForm.controls.tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [control]="queryForm.controls.tlt_floor"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [control]="queryForm.controls.org_id"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      *ngIf="!queryForm.get('showSummary')?.value"
      tableKey="TLS23020"
      [lastQueryBody]="historyRequestBody"
      [data]="data"
      [columns]="columns"
      dataKey="_rowKey"
      [totalRecords]="totalRecords"
      [showDelete]="false"
      [showManage]="false"
      [showReportMode]="false"
      [queryFunction]="queryTLS23020ForReport"
      [footerData]="buildFooterFromTotals()"
      groupRowsBy="groupKey"
    >
      <header>
        <div class="flex justify-content-between align-items-center w-full">
          <div class="flex align-items-center">
            <p-checkbox
              inputId="showSummary"
              [formControl]="queryForm.controls.showSummary"
              binary="true"
              (onChange)="onToggleSummary()"
              label="顯示彙總"
            ></p-checkbox>
          </div>
          <div class="flex gap-2">
            <p-button
              styleClass="p-2"
              label="折扣別報表.PDF"
              [loading]="btnLoading"
              icon="pi pi-file"
              (click)="onExportPDF()"
              [disabled]="data.length === 0"
            ></p-button>
            <p-button
              styleClass="p-2"
              label="折扣別報表.XLSX"
              [loading]="btnLoading"
              icon="pi pi-file-excel"
              (click)="onExportXLSX()"
              [disabled]="data.length === 0"
            ></p-button>
          </div>
        </div>
      </header>
    </app-table-report>

    <app-table-report
      *ngIf="queryForm.get('showSummary')?.value"
      tableKey="TLS23020summary"
      [data]="summaryData"
      [columns]="summaryColumns"
      [totalRecords]="totalRecords"
      [lazy]="false"
      [showReportMode]="false"
      [showDelete]="false"
      [showManage]="false"
      [footerData]="summaryFooter"
      [ItemSize]="24.44"
    >
      <header>
        <div class="flex justify-content-between align-items-center w-full">
          <div class="flex align-items-center">
            <p-checkbox
              inputId="showSummary"
              [formControl]="queryForm.controls.showSummary"
              binary="true"
              (onChange)="onToggleSummary()"
              label="顯示彙總"
            ></p-checkbox>
          </div>
          <div class="flex gap-2">
            <p-button
              styleClass="p-2"
              label="彙總折扣別報表.PDF"
              [loading]="btnLoading"
              icon="pi pi-file"
              (click)="onExportPDF()"
              [disabled]="summaryData.length === 0"
            ></p-button>
            <p-button
              styleClass="p-2"
              label="彙總折扣別報表.XLSX"
              [loading]="btnLoading"
              icon="pi pi-file-excel"
              (click)="onExportXLSX()"
              [disabled]="summaryData.length === 0"
            ></p-button>
          </div>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
