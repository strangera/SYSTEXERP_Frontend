<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="交易日期*"
              [startControl]="queryForm.controls.TXN_DateStart"
              [endControl]="queryForm.controls.TXN_DateEnd"
              [submitted]="submitted">
            </app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機機號" controlName="ECR_No"
              [control]="queryForm.controls.ECR_No" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="交易序號(起/迄)"
              [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="TLT_No"
              [control]="queryForm.controls.TLT_No" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票號碼" controlName="TXN_GUINo"
              [control]="queryForm.controls.TXN_GUINo" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="單項售價"
              [startControl]="queryForm.controls.PLU_SalePrc_Start"
              [endControl]="queryForm.controls.PLU_SalePrc_End"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="稅別" controlName="TXN_TaxType" [options]="taxableOptions"
              optionLabel="label" optionValue="value"
              [control]="queryForm.controls.TXN_TaxType" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="原始折扣代碼" controlName="ORG_TXN_DiscCode"
              [options]="discountOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.ORG_TXN_DiscCode" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="分類抽成類別" controlName="tlt_id"
              [options]="commissionTypeOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_id" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="商品管理編號" controlName="PLU_MagNo"
              [control]="queryForm.controls.PLU_MagNo" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃折數代碼" controlName="TXN_DiscCode"
              [options]="discountOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.TXN_DiscCode" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="自營櫃無條碼商品"
              binary="true"
              formControlName="IsNoPLU_No">
            </p-checkbox>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否代收" controlName="rece_yn"
              [options]="whetherOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.rece_yn" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否代售" controlName="cash_yn"
              [options]="whetherOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.cash_yn" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="所屬大樓" controlName="tlt_building"
              [options]="BUILDING_NO_Options" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_building" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="所屬樓層" controlName="tlt_floor"
              [options]="floorOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_floor" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="組織代碼" controlName="org_id"
              [options]="OrganizationCodeOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.org_id" [submitted]="submitted">
            </app-dropdown>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS23020"
    [data]="data"
    [columns]="columns"
    [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    [showCheckBox]="false"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)">
  </app-table>
</div>
