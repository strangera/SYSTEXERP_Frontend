<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 退貨單號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="退貨單號" controlName="CRN_No"
            [control]="queryForm.controls.CRN_No" [submitted]="submitted"></app-input-text>
          <!-- 單據狀態 (採購單狀態) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="退貨單狀態" controlName="CRN_Status"
            [options]="crnstatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CRN_StatusList" [submitted]="submitted"></app-multi-select>
          <!-- 管理編號 -->
          <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.queryNo"
            templateLabel="label" [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo"
            [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
            (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
            [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
            [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table>
          <!-- 倉別 (對應 HOS_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.HOS_NoList" [submitted]="submitted"></app-multi-select>
          <!-- 品牌代碼 (對應 LOGO_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.LOGO_NoList" [submitted]="submitted"></app-multi-select>
          <!-- 廠商編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No"
            [options]="vendorOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
        </div>
        <hr />
        <div class="grid p-fluid">
          <!-- 申請人員 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人" controlName="APPLY_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APPLY_USR" [submitted]="submitted"></app-dropdown>
          <!-- 申請日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
        </div>
        <div class="grid p-fluid">
          <!-- 審核人員 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="審核人" controlName="APRV_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APRV_USR" [submitted]="submitted"></app-dropdown>
          <!-- 審核日期 -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
        </div>
        <div class="grid p-fluid">
          <!-- 結案人員 (強制結案人員) -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="結案人" controlName="CLOS_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CLOS_USR" [submitted]="submitted"></app-dropdown>
          <!-- 結案日期 (強制結案日期) -->
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="結案日期"
            [startControl]="queryForm.controls.CLOS_Date_Start" [endControl]="queryForm.controls.CLOS_Date_End"
            [submitted]="submitted"></app-calendar-range-quick>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS52020" dataKey="CRN_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true"
    [multiSortMeta]="[{ field: 'APPLY_Date', order: -1 }, { field: 'CRN_No', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [addButton]="addButton" [buttonsLoading]="btnLoading" [editDisabled]="editDisabled">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button label="列印退貨單" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="列印退貨單"
          tooltipPosition="top" icon="pi pi-print" [rounded]="true" severity="success" (click)="print(selectedItems)"
          [disabled]="selectedCount === 0" />
        <p-button label="結案" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="結案"
          tooltipPosition="top" [rounded]="true" severity="danger" (click)="close(selectedItems)"
          [disabled]="disabledClose || selectedCount === 0" />
        <span *ngIf="disabledClose && selectedCount > 0" @slideInFromLeft class="text-sm text-red-600">
          退貨單狀態為「已審核」或「部分驗收」可強制結案
        </span>
      </div>
    </header>
  </app-table>
</div>
