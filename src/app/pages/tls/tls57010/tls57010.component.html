<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick startLabel="採購日期(起)" endLabel="採購日期(迄)" startControlName="APPLY_Date_Start"
              endControlName="APPLY_Date_End" [startControl]="queryForm.controls.APPLY_Date_Start"
              [endControl]="queryForm.controls.APPLY_Date_End" [submitted]="submitted"></app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="採購單號" controlName="PO_NO" [control]="queryForm.controls.PO_NO"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號/名稱" controlName="VEN_No" [options]="VEN_NoOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-dropdown-table class="col-12" [showOverlay]="false" [control]="queryForm.controls.PLU_MagNo"
            [submitted]="submitted" optionLabel="label" optionValue="PLU_No" [suggestions]="suggestions"
            [fieldsConfig]="fieldsConfig" (inputValueChanged)="onAutoCompleteInputChange($event)">
          </app-dropdown-table>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="單據狀態" controlName="PO_StatusList" [options]="PO_StatusListOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.PO_StatusList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="品牌代碼/名稱" controlName="LOGO_NoList" [options]="LOGO_NoListOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.LOGO_NoList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="顯示方式" controlName="ShowType" [options]="showTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ShowType" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-customFooter-table *ngIf="columns && columns.length > 0" tableKey="tls57070" dataKey="LOGO_No" [data]="data"
    [columns]="columns" [totalRecords]="totalRecords" [footerData]="footerData" [lazy]="true" [loading]="loading"
    (lazyLoadData)="onLazyLoadData($event, queryForm)" [showReportMode]="false" [showManage]="false"
    [showDelete]="false" [subTotalData]="DetailSumData" [showTotal]="true" [columnGroup]="columnGroup"
    [groupRowsBy]="queryForm.value.ShowType === 'D' ? 'PO_No' : ''" [multiSortMeta]="[
      queryForm.value.ShowType === 'M' ?
      { field: 'PO_No', order: 1 } :
      { field: 'PO_No', order: 1 },{ field: 'APPLY_Date', order: 1 },
    ]">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出採購統計表.PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="產出採購統計表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-customFooter-table>
</div>
