<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" startControlName="APPLY_Date_Start"
            endControlName="APPLY_Date_End" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted" />
          <!-- 品牌代碼 (對應 LOGO_No) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_NoList"
            [options]="LOGO_NoOptions$ | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.LOGO_NoList" [submitted]="submitted" />
          <!-- 廠商編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號/名稱" controlName="VEN_No"
            [options]="VEN_NoOptions$ | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.VEN_No" [submitted]="submitted" />
          <!-- 管理編號 -->
          <!-- <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.queryNo"
            templateLabel="label" [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo"
            [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
            (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
            [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
            [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table> -->
          <!-- 單據狀態 (採購單狀態) -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="採購單狀態" controlName="PO_Status"
            [options]="PO_StatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.PO_StatusList" [submitted]="submitted" />
          <!-- 包含已採購未交量 -->
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox label="包含已採購未交量" binary="true" formControlName="IncludeUnpaid"></p-checkbox>
          </div>
          <!-- 採購單號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="採購單號" controlName="PO_No"
            [control]="queryForm.controls.PO_No" [submitted]="submitted" />
          <!-- 顯示方式 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="顯示方式" controlName="DisplayMode"
            [options]="displayModeOptions" optionLabel="label" optionValue="value" [filter]="false"
            [control]="queryForm.controls.DisplayMode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" />
          <app-button btnType="query" [loading]="loading" />
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

</div>
