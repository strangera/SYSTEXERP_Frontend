<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid p-fluid ">
        <div class="col-20 md:col-10 lg:col-12">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
      </div>
      <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="小分類代碼" controlName="CAT_SNo" [control]="dataForm.controls.CAT_SNo"
                [submitted]="submitted">
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="小分類名稱" controlName="CAT_SName" [control]="dataForm.controls.CAT_SName"
                [submitted]="submitted">
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="大分類代碼" controlName="CAT_LNo" [options]="bigCategoryOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.CAT_LNo" [submitted]="submitted">
              </app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="中分類代碼" controlName="CAT_MNo" [options]="middleCategoryOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.CAT_MNo" [submitted]="submitted">
              </app-dropdown>
            </div>
          </div>
          <hr>
          <app-editor-text label="說明" controlName="CAT_SRemark" [control]="dataForm.controls.CAT_SRemark"
            [style]="{ height: '100px' }" [submitted]="submitted">
          </app-editor-text>
          <hr>
        </form>
        <div class="col pt-4">
          <div class="grid justify-content-end">
            <app-button btnType="cancel" (click)="onCancel()"></app-button>
            <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="!isFormReadable"></app-button>
          </div>
        </div>
      </p-panel>
    </div>
  </div>
</div>
