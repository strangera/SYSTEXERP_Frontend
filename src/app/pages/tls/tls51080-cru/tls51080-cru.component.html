<div class="card">
    <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="back" (click)="onCancel()"></app-button>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="倉庫代碼" controlName="HOS_No" [control]="dataForm.controls.HOS_No"
                        [submitted]="submitted"></app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="倉庫名稱" controlName="HOS_NAME" [control]="dataForm.controls.HOS_NAME"
                        [submitted]="submitted"></app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="所屬部門" controlName="org_id" [options]="SYS3100_Options" optionLabel="Label"
                        optionValue="No" [control]="dataForm.controls.org_id" [submitted]="submitted"></app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="館別" controlName="building_no" [options]="building_noOptions"
                        optionLabel="Name" optionValue="No" [control]="dataForm.controls.building_no"
                        [submitted]="submitted"></app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="備註說明" controlName="HOS_Remark" [control]="dataForm.controls.HOS_Remark"
                        [submitted]="submitted"></app-input-text>
                </div>
            </div>
            <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
                *ngIf="!isFormReadable">
                <app-button btnType="cancel" [form]="dataForm"></app-button>
                <app-button btnType="submit"></app-button>
            </div>
        </form>
    </p-panel>
</div>
