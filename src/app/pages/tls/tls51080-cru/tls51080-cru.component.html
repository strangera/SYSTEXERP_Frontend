<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid p-fluid ">
                <div class="col-20 md:col-10 lg:col-12">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
                <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
                    <div class="grid p-fluid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-number [useGrouping]="false" label="分倉別編號" controlName="storageID"
                                [control]="dataForm.controls.storageID" [submitted]="submitted">
                            </app-input-number>
                            <h6>自動編號</h6>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-input-text label="倉別名稱" controlName="storageName"
                                [control]="dataForm.controls.storageName" [submitted]="submitted">
                            </app-input-text>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <app-dropdown label="部門編號 / 分店" controlName="department" [options]="departmentOptions"
                                optionLabel="label" optionValue="value" [control]="dataForm.controls.department"
                                [submitted]="submitted">
                            </app-dropdown>
                        </div>
                    </div>
                    <hr>
                    <app-editor-text label="備註" controlName="editortext" [control]="dataForm.controls.editortext"
                        [style]="{ height: '100px' }" [submitted]="submitted">
                    </app-editor-text>
                    <hr>
                </form>
                <div class="col pt-4">
                    <div class="grid justify-content-end">
                        <app-button btnType="cancel" (click)="onCancel()"></app-button>
                        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
                    </div>
                </div>
            </p-panel>
        </div>
    </div>
</div>
