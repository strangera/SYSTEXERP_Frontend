<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="品牌編碼"
            controlName="LOGO_No"
            [control]="dataForm.controls.LOGO_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="品牌中文名稱"
            controlName="LOGO_CH_NAME"
            [control]="dataForm.controls.LOGO_CH_NAME"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="品牌英文名稱"
            controlName="LOGO_EN_NAME"
            [control]="dataForm.controls.LOGO_EN_NAME"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="標準進貨折數"
            controlName="PLU_OrderPrcRate"
            [control]="dataForm.controls.PLU_OrderPrcRate"
            [maxFractionDigits]="2"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="建議倉別"
            controlName="HOS_No"
            [options]="storageOptions"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.HOS_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註說明"
            controlName="LOGO_Remark"
            [control]="dataForm.controls.LOGO_Remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
