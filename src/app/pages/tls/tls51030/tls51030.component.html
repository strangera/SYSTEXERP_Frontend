<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="flex gap-2 mb-2">
        <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
        <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
      </div>
      <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'">
          <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="小分類代碼" controlName="CAT_SNo" [control]="queryForm.controls.CAT_SNo"
                  [submitted]="submitted">
                </app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text label="小分類名稱" controlName="CAT_SName" [control]="queryForm.controls.CAT_SName"
                  [submitted]="submitted">
                </app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="大分類代碼" controlName="CAT_LNo" [options]="bigCategoryOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.CAT_LNo" [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown label="中分類代碼" controlName="CAT_MNo" [options]="middleCategoryOptions" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.CAT_MNo" [submitted]="submitted">
                </app-dropdown>
              </div>
            </div>
            <hr>
            <!-- <app-editor-text label="說明" controlName="editortext" [control]="queryForm.controls.editortext"
                            [style]="{ height: '100px' }" [submitted]="submitted">
                        </app-editor-text> -->
            <!-- <hr> -->
            <!-- <div *appHasPermission="queryPermission" class="col"> -->
            <div class="grid justify-content-end">
              <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
              <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
            </div>
            <!-- </div> -->
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-13">
        <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
          (delete)="onDelete($event)" [showCheckBox]="true" dataKey="id"
          [multiSortMeta]="[{ field: 'CAT_SNo', order: 1 }] " [totalRecords]="totalRecords"
          (lazyLoadData)="onSubmit($event)" [form]="queryForm" [loading]="loading">
        </app-table>
      </div>
    </div>
  </div>
</div>
