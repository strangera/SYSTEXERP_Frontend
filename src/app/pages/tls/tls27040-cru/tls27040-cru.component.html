<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <!-- 步驟 1: 初始查詢區塊 (僅在新增模式且未驗證時顯示) -->
  <p-panel *ngIf="isFormCreateable && !isQueryValidated" header="新增實收檔前置檢查" class="line-height-3 m-0">
    <form [formGroup]="initialQueryForm" (ngSubmit)="onInitialQuerySubmit(initialQueryForm)">
      <div class="grid p-fluid">
        <!-- 收單行 -->
        <app-dropdown class="col-12 md:col-6 lg:col-3" label="收單行" controlName="tableName" [options]="POS611XOptions"
          optionLabel="label" optionValue="value" [control]="initialQueryForm.controls.tableName"
          [submitted]="initialQuerySubmitted" [filter]="false" />
        <!-- 收銀機號 -->
        <app-dropdown class="col-12 md:col-6 lg:col-3" label="收銀機號" controlName="ECR_No"
          [control]="initialQueryForm.controls.ECR_No" [options]="ECR_NoOptions | async" optionLabel="label"
          optionValue="value" [submitted]="initialQuerySubmitted" />
        <!-- 交易流水號 -->
        <app-input-text class="col-12 md:col-6 lg:col-3" label="交易流水號" controlName="TXN_No"
          [control]="initialQueryForm.controls.TXN_No" [submitted]="initialQuerySubmitted" [autoPadZero]="true" [padLength]="8"/>
        <!-- 銷售日期 -->
        <app-calendar class="col-12 md:col-6 lg:col-3" label="銷售日期" controlName="TXN_Date"
          [control]="initialQueryForm.controls.TXN_Date" [submitted]="initialQuerySubmitted" />
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button label="驗證並新增" btnType="query" [loading]="initialQueryLoading"></app-button>
      </div>
    </form>
  </p-panel>

  <!-- 步驟 2: 詳細表單區塊 (在 Read/Update 模式或新增模式且已驗證時顯示) -->
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0" *ngIf="!isFormCreateable || isQueryValidated">

    <!-- POS6118 Form -->
    <form *ngIf="rowdata?.tableName === 'POS6118'" [formGroup]="POS6118dataForm" id="dataForm"
      (ngSubmit)="onSubmit(POS6118dataForm)">
      <div class="grid p-fluid">
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="收單行" controlName="tableName"
          [control]="POS6118dataForm.controls.tableName" [options]="POS611XOptions" optionLabel="label"
          optionValue="value" [filter]="true" />
      </div>
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
          [control]="POS6118dataForm.controls.ECR_No" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
          [control]="POS6118dataForm.controls.TXN_No" [submitted]="submitted">
        </app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="銷售日期" controlName="NCML_TxnDate"
          [control]="POS6118dataForm.controls.NCML_TxnDate" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="TLT_No"
          [control]="POS6118dataForm.controls.TLT_No" [options]="TLT_NoOptions | async" optionLabel="label"
          optionValue="value" [submitted]="submitted">
        </app-dropdown>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="請款日期" controlName="NCML_Date"
          [control]="POS6118dataForm.controls.NCML_Date" [submitted]="submitted" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="支付卡別簡碼" controlName="NCML_PayCrdType"
          [options]="PayCrdTypeOptions" optionLabel="label" optionValue="value"
          [control]="POS6118dataForm.controls.NCML_PayCrdType" [submitted]="submitted" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="銷售狀況" controlName="NCML_TxnType"
          [options]="POS6118_TxnTypeOptions" optionLabel="label" optionValue="value"
          [control]="POS6118dataForm.controls.NCML_TxnType" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="交易金額" controlName="NCML_TxnAmt"
          [control]="POS6118dataForm.controls.NCML_TxnAmt" [submitted]="submitted" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="卡別" controlName="CRD_Type"
          [options]="CRDTypeOptions" optionLabel="label" optionValue="value"
          [control]="POS6118dataForm.controls.CRD_Type" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="NCML_CrdNo"
          [control]="POS6118dataForm.controls.NCML_CrdNo" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="NCML_TmID"
          [control]="POS6118dataForm.controls.NCML_TmID" [submitted]="submitted">
        </app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="入帳日" controlName="NCML_BatCloseDate"
          [control]="POS6118dataForm.controls.NCML_BatCloseDate" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="NCML_ApprovalCode"
          [control]="POS6118dataForm.controls.NCML_ApprovalCode" [submitted]="submitted">
        </app-input-text>
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="輸入狀況" controlName="NCML_EntryFg"
          [options]="EntryFgOptions" [control]="POS6118dataForm.controls.NCML_EntryFg" [submitted]="submitted"
          optionLabel="label" optionValue="value" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="NCML_CrdTxnFg"
          [options]="pos6118TxnFgOptions" [control]="POS6118dataForm.controls.NCML_CrdTxnFg" [submitted]="submitted"
          optionLabel="label" optionValue="value" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="NCML_TermNo"
          [options]="TermNoOptions" [control]="POS6118dataForm.controls.NCML_TermNo" [submitted]="submitted"
          optionLabel="label" optionValue="value" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="timeOne" label="銷售時間" controlName="NCML_TxnTime"
          [control]="POS6118dataForm.controls.NCML_TxnTime" [submitted]="submitted" />
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>

    <!-- POS6119 Form -->
    <form *ngIf="rowdata?.tableName === 'POS6119'" [formGroup]="POS6119dataForm" id="dataForm"

        <app-calendar class="col-12 md:col-6 lg:col-4" label="銷售日期" controlName="CTBC_TxnTime"

        <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="TLT_No"
          [control]="POS6119dataForm.controls.TLT_No" [options]="TLT_NoOptions | async" optionLabel="label"
          optionValue="value" [submitted]="submitted">
        </app-dropdown>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="請款日期" controlName="CTBC_Date"

        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="資料型態" controlName="CTBC_DataType"
          [options]="pos6119TxnFgOptions" optionLabel="label" optionValue="value"
          [control]="POS6119dataForm.controls.CTBC_DataType" [submitted]="submitted" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="卡別" controlName="CRD_Type"
          [options]="CRDTypeOptions" optionLabel="label" optionValue="value"
          [control]="POS6119dataForm.controls.CRD_Type" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="CTBC_CrdNo"
          [control]="POS6119dataForm.controls.CTBC_CrdNo" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="CTBC_TmID"
          [control]="POS6119dataForm.controls.CTBC_TmID" [submitted]="submitted">
        </app-input-text>
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="交易類別碼" controlName="CTBC_TxnCode"
          [options]="POS6119_TxnCodeOptions" optionLabel="label" optionValue="value"
          [control]="POS6119dataForm.controls.CTBC_TxnCode" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="交易金額" controlName="CTBC_TxnAmt"
          [control]="POS6119dataForm.controls.CTBC_TxnAmt" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" label="入帳日" controlName="CTBC_PayDate"
          [control]="POS6119dataForm.controls.CTBC_PayDate" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="CTBC_ApprovalCode"
          [control]="POS6119dataForm.controls.CTBC_ApprovalCode" [submitted]="submitted">
        </app-input-text>
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="輸入狀況" controlName="CTBC_EntryFg"
          [options]="EntryFgOptions" [control]="POS6119dataForm.controls.CTBC_EntryFg" [submitted]="submitted"
          optionLabel="label" optionValue="value"></app-dropdown>
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="CTBC_TermNo"
          [options]="TermNoOptions" optionLabel="label" optionValue="value"
          [control]="POS6119dataForm.controls.CTBC_TermNo" [submitted]="submitted" />
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>

    <!-- POS6119P Form -->
    <form *ngIf="rowdata?.tableName === 'POS6119P'" [formGroup]="POS6119PdataForm" id="dataForm"
      (ngSubmit)="onSubmit(POS6119PdataForm)">
      <div class="grid p-fluid">
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="收單行" controlName="tableName"
          [control]="POS6119PdataForm.controls.tableName" [options]="POS611XOptions" optionLabel="label"

      </div>
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
          [control]="POS6119PdataForm.controls.ECR_No" [submitted]="submitted">

        <app-calendar class="col-12 md:col-6 lg:col-4" label="請款日期" controlName="CTBC_Date"

          [options]="CRDTypeOptions" optionLabel="label" optionValue="value"
          [control]="POS6119PdataForm.controls.CRD_Type" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="CTBC_CrdNo"
          [control]="POS6119PdataForm.controls.CTBC_CrdNo" [submitted]="submitted">
        </app-input-text>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="交易金額" controlName="CTBC_TxnAmt"
          [control]="POS6119PdataForm.controls.CTBC_TxnAmt" [submitted]="submitted" />
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="CTBC_TxnType"
          [options]="POS6119P_TxnTypeOptions" [control]="POS6119PdataForm.controls.CTBC_TxnType" [submitted]="submitted"
          optionLabel="label" optionValue="value" />
        <app-calendar class="col-12 md:col-6 lg:col-4" label="入帳日" controlName="CTBC_PayDate"
          [control]="POS6119PdataForm.controls.CTBC_PayDate" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="CTBC_TmID"
          [control]="POS6119PdataForm.controls.CTBC_TmID" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="CTBC_ApprovalCode"
          [control]="POS6119PdataForm.controls.CTBC_ApprovalCode" [submitted]="submitted">
        </app-input-text>
        <app-dropdown [filter]="false" class="col-12 md:col-6 lg:col-4" label="輸入狀況" controlName="CTBC_EntryFg"
          [options]="EntryFgOptions" [control]="POS6119PdataForm.controls.CTBC_EntryFg" [submitted]="submitted"

      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">

  </p-panel>
</div>
