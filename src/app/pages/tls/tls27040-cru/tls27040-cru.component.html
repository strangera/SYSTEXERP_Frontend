<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="cashRegisterNumber"
          [control]="dataForm.controls.cashRegisterNumber" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="transactionSerialNumber"
          [control]="dataForm.controls.transactionSerialNumber" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="counterID"
          [control]="dataForm.controls.counterID" [submitted]="submitted">
        </app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="卡別" controlName="cardCategory"
          [options]="cardCategoryOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.cardCategory" [submitted]="submitted">
        </app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="銷售狀況" controlName="salesCondition"
          [options]="salesConditionOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.salesCondition" [submitted]="submitted">
        </app-dropdown>
        <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="金額"
          [control]="dataForm.controls.amount" [submitted]="submitted">
        </app-input-number>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="入帳日"
          [control]="dataForm.controls.postingDate" [submitted]="submitted">
        </app-calendar>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="cardID"
          [control]="dataForm.controls.cardID" [submitted]="submitted">
        </app-input-text>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="edcID"
          [control]="dataForm.controls.edcID" [submitted]="submitted">
        </app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="請款日期"
          [control]="dataForm.controls.billingDate" [submitted]="submitted">
        </app-calendar>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="authorizationCode"
          [control]="dataForm.controls.authorizationCode" [submitted]="submitted">
        </app-input-text>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="輸入狀態" controlName="entryStatus"
          [options]="entryStatusOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.entryStatus" [submitted]="submitted">
        </app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="transactionCategory"
          [options]="transactionCategoryOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.transactionCategory" [submitted]="submitted">
        </app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="installmentPeriodCount"
          [options]="installmentPeriodCountOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.installmentPeriodCount" [submitted]="submitted">
        </app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="收單銀行" controlName="acquirerBank"
          [options]="acquirerBankOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.acquirerBank" [submitted]="submitted">
        </app-dropdown>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="timeOne" label="時間"
          [control]="dataForm.controls.transactionTime" [submitted]="submitted">
        </app-calendar>
      </div>
    </form>
    <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="cancel" [form]="dataForm"></app-button>
      <app-button btnType="submit" [loading]="loading"></app-button>
    </div>
  </p-panel>
</div>
