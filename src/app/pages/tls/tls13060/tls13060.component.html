<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃招募編號" controlName="apply_no"
            [control]="queryForm.controls.apply_no" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="廠商統一編號" controlName="ven_uniform"
            [options]="vandorCategoryOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.ven_uniformList" [submitted]="submitted" />
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_no"
            [control]="queryForm.controls.tlt_no" [submitted]="submitted" [options]="tlt_nocationOptions | async"
            optionLabel="label" optionValue="value" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="櫃位名稱" controlName="tlt_name"
            [control]="queryForm.controls.tlt_name" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="位置編號" controlName="location_no"
            [options]="locationOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.location_noList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="館別" controlName="building_noList"
            [options]="building_noList | async" optionLabel="Name" optionValue="No"
            [control]="queryForm.controls.building_noList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="組織代碼/名稱" controlName="org_idList"
            [options]="org_idList | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.org_idList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="營運狀況" controlName="tlt_openflagList"
            [options]="tlt_openflagOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.tlt_openflagList" [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="合約起始日"
            [startControl]="queryForm.controls.tlt_bdate_start" [endControl]="queryForm.controls.tlt_bdate_end"
            [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="契約截止日"
            [startControl]="queryForm.controls.tlt_edate_start" [endControl]="queryForm.controls.tlt_edate_end"
            [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="營運起始日"
            [startControl]="queryForm.controls.tlt_contract_bdate_start"
            [endControl]="queryForm.controls.tlt_contract_bdate_end" [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="營運截止日"
            [startControl]="queryForm.controls.tlt_contract_edate_start"
            [endControl]="queryForm.controls.tlt_contract_edate_end" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="抽成別" controlName="tlt_term_type"
            [options]="tlt_term_typeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.tlt_term_typeList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" class="col-12 md:col-6 lg:col-4" label="付款方式"
            controlName="paytype" [options]="paytypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.paytypeList" [submitted]="submitted" />
          <!-- 替換 app-multi-select 為 app-radiobutton-yn -->
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否開立業主發票" controlName="rece_yn"
            [control]="queryForm.controls.rece_yn" [submitted]="submitted" [showAll]="true">
          </app-radiobutton-yn>
          <!-- 替換 app-multi-select 為 app-radiobutton-yn -->
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否使用業主收銀機" controlName="pos_yn"
            [control]="queryForm.controls.pos_yn" [submitted]="submitted" [showAll]="true">
          </app-radiobutton-yn>
          <!-- 替換 app-multi-select 為 app-radiobutton-yn -->
          <app-radiobutton-yn class="col-12 md:col-6 lg:col-4" label="是否為業主收現" controlName="cash_yn"
            [control]="queryForm.controls.cash_yn" [submitted]="submitted" [showAll]="true">
          </app-radiobutton-yn>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report
    tableKey="TLS13060"
    dataKey="id"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="queryTLS13060Fn"
    (dataChange)="data = $event">
  </app-table-report>
</div>
