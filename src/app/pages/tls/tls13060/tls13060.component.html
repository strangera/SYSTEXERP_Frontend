<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="專櫃招募編號" controlName="counterCode"
              [control]="queryForm.controls.counterCode" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商統一編號" controlName="vendorCode" [options]="vendorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.vendorCode" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number [useGrouping]="false" label="專櫃編號" controlName="counterCode"
              [control]="queryForm.controls.counterCode" [submitted]="submitted">
            </app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃名稱" controlName="counterName" [control]="queryForm.controls.counterName"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="位置編號" controlName="LocationCodeOptions" [options]="LocationCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.locationCode"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="營運狀況" controlName="operationStatus" [options]="operationStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.operationStatus"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約起始日"
              [startControl]="queryForm.controls.contractStartDate" [endControl]="queryForm.controls.contractEndDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="契約截止日"
              [startControl]="queryForm.controls.contractStartDate" [endControl]="queryForm.controls.contractEndDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運起始日"
              [startControl]="queryForm.controls.contractStartDate" [endControl]="queryForm.controls.contractEndDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="營運截止日"
              [startControl]="queryForm.controls.operationStartDate" [endControl]="queryForm.controls.operationEndDate"
              [submitted]="submitted">
            </app-calendar-range>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
                  <app-dropdown
                    label="樓層"
                    controlName="floorCode"
                    [options]="floorOptions"
                    optionLabel="label"
                    optionValue="value"
                    [control]="queryForm.controls.floorCode"
                    [submitted]="submitted"
                  >
                  </app-dropdown>
                </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="抽成別" controlName="commissionType" [options]="commissionTypeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.commissionType" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="付款方式" controlName="paymentOptions" [options]="paymentOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.paymentMethod" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否開立業主發票" controlName="issueOwnerInvoice" [options]="whetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否使用業主收銀機" controlName="useOwnerCashRegister" [options]="whetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否為業主收現" controlName="ownerCashCollection" [options]="whetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.whetherOptions"
              [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-table>
  </div>
</div>
