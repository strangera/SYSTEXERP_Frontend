<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="tlt_noList" [options]="tlt_noListOption | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_noList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="抽成方式" controlName="tlt_term_typeList" [options]="tlt_term_typeListOption"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_term_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" controlName="tlt_floorList" [options]="tlt_floorListOption | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.tlt_floorList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="查詢年月" [control]="queryForm.controls.sam_yyymm"
              controlName="sam_yyymm" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="結帳方式" controlName="money_typeList" [options]="money_typeListOption"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.money_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="帳次" controlName="sam_termnoList" [options]="sam_termnoListOption"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.sam_termnoList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="tlt_buildingList" [options]="tlt_buildingListOption | async"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.tlt_buildingList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="對帳方式" controlName="check_typeList" [options]="check_typeListOption"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.check_typeList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="統一編號" controlName="ven_uniform" [control]="queryForm.controls.ven_uniform"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls57090" dataKey="id" [lastQueryBody]="historyRequestBody" [data]="data"
    [columns]="columns" [totalRecords]="totalRecords" [numToleratedItems]="5" [showDelete]="false" [showManage]="false" [loading]="loading"
    [queryFunction]="tls2e080Service.queryTLS2E080.bind(tls2e080Service)" [showCheckBox]="true"
    (selectButton)="onSelectButton($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="專櫃對帳單PDF" [rounded]="true" icon="pi pi-file" (click)="exportPDF()"
            [disabled]="data.length === 0 || selectedItems.length === 0 || !hasPermission(Actions.Report)"
            [loading]="btnLoading"></p-button>
        </div>
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="網路對帳" [rounded]="true" icon="pi pi-globe" (click)="netReport()"
            [disabled]="data.length === 0 || selectedItems.length === 0 || !hasPermission(Actions.OnlineCheck)"
            [loading]="btnLoading"></p-button>
          <p-button styleClass="p-2" label="AUTOMAIL" [rounded]="true" icon="pi pi-envelope"
            (click)="dialogVisible = true"
            [disabled]="data.length === 0 || selectedItems.length === 0 || !hasPermission(Actions.AUTOMAIL)"
            [loading]="btnLoading"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
<app-dialog [visible]="dialogVisible" header="AutoMail" [showFooter]="false" (visibleChange)="dialogVisible = $event"
  width="400px">
  <form [formGroup]="dialogForm" (ngSubmit)="autoMail(dialogForm)">
    <div class="grid p-fluid">
      <app-dropdown class="col-12" label="寄件者" controlName="SMTP_No" [control]="dialogForm.controls.SMTP_No"
        [options]="SMTP_NoOptions | async" optionLabel="Name" optionValue="No" [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="submit" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
