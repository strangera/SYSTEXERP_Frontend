<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" label="AUTOFAX"></app-button>
    <app-button btnType="create" label="AUTOMAIL"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號" controlName="counterName" [options]="counterNameOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.counterName" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="抽成方式" controlName="commissionMethod" [options]="commissionMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.commissionMethod"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="floor" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="查詢年月" [control]="queryForm.controls.onedatemm"
              [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="結帳方式/帳次" controlName="checkout" [options]="checkoutOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.checkout" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="館別" controlName="floor" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="對帳方式" controlName="settlementMethod" [options]="settlementMethodOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.settlementMethod"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="統一編號" controlName="floor" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.floor" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [multiSortMeta]="[{ field: 'HOS_NAME', order: 1 }]" [showReportMode]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showManage]="false" [showDelete]="false">
  </app-table>
</div>
