<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" label="2016查詢" class="col"></app-button>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" label="AUTOFAX" class="col"></app-button>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" label="AUTOMAIL" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="專櫃編號" controlName="counterName" [options]="counterNameOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.counterName"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="抽成方式" controlName="commissionMethod"
                                    [options]="commissionMethodOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.commissionMethod" [submitted]="submitted">
                                </app-dropdown>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="樓層" controlName="floor" [options]="floorOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.floor"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-calendar calendarType="dateMonthOne" label="查詢年月"
                                    [control]="queryForm.controls.onedatemm" [submitted]="submitted">
                                </app-calendar>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown label="結帳方式/帳次" controlName="checkout" [options]="checkoutOptions"
                                    optionLabel="label" optionValue="value" [control]="queryForm.controls.checkout"
                                    [submitted]="submitted">
                                </app-dropdown>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <!-- <div class="card">
            <div class="col-13">
                <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-table>
            </div>
        </div> -->
    </div>
</div>
