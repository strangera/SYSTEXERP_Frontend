<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="變價歷史紀錄"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
        <div *appHasPermission="addPermission">
          <app-button
            btnType="create"
            label="產生標籤檔"
            (click)="onCreate()"
            class="col"
          ></app-button>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="商品管理編號"
                  controlName="merchantID"
                  [control]="queryForm.controls.merchantID"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="商品名稱"
                  controlName="merchantName"
                  [control]="queryForm.controls.merchantName"
                  [submitted]="submitted"
                ></app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="國際條碼"
                  controlName="internationalCode"
                  [control]="queryForm.controls.internationalCode"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-number
                  [useGrouping]="false"
                  label="廠商貨號"
                  controlName="venderCode"
                  [control]="queryForm.controls.venderCode"
                  [submitted]="submitted"
                ></app-input-number>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="品牌代碼"
                  controlName="brandCode"
                  [options]="brandCodeOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.brandCode"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="大分類代碼"
                  controlName="lCategory"
                  [options]="storageOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.lCategory"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="中分類代碼"
                  controlName="mCategory"
                  [options]="storageOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.mCategory"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="小分類代碼"
                  controlName="sCategory"
                  [options]="storageOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.sCategory"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="商品型態"
                  controlName="merchantType"
                  [options]="merchantTypeOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.merchantType"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
            </div>
            <div class="grid p-fluid">
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown
                  label="商品單位"
                  controlName="merchantUnit"
                  [options]="merchantUnitOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.merchantUnit"
                  [submitted]="submitted"
                ></app-dropdown>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-multi-select
                  label="商品狀態"
                  controlName="merchantStatus"
                  [options]="merchantStatusOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.merchantStatus"
                  [submitted]="submitted"
                ></app-multi-select>
              </div>
            </div>
            <hr />
            <app-editor-text
              label="說明"
              controlName="illustrate"
              [control]="queryForm.controls.illustrate"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            ></app-editor-text>
            <hr />
            <hr />
            <app-editor-text
              label="系列"
              controlName="editortext"
              [control]="queryForm.controls.editortext"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            ></app-editor-text>
            <hr />
            <div>
              <div class="grid justify-content-end">
                <app-button
                  btnType="clear"
                  (onClick)="onClearForm()"
                ></app-button>
                <app-button
                  btnType="query"
                  (onClick)="onSubmitQuery(queryForm)"
                  [loading]="loading"
                ></app-button>
              </div>
            </div>
          </form>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div class="card">
      <div class="col-13">
        <app-table
          [data]="data"
          [columns]="columns"
          (edit)="onEdit($event)"
          (detail)="onDetail($event)"
        ></app-table>
      </div>
    </div>
  </div>
</div>
