<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="領用退回單編號" controlName="RPM_No" [control]="dataForm.controls.RPM_No"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="部門編號" controlName="org_id" [options]="departmentOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.org_id" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌代碼/名稱" controlName="LOGO_No" [options]="brandOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.LOGO_No" [submitted]="submitted" />
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="倉庫代碼/名稱" controlName="HOS_No" [options]="warehouseOptions" optionLabel="Name"
            optionValue="No" [control]="dataForm.controls.HOS_No" [submitted]="submitted" />
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人編號" controlName="APPLY_USR_No" [options]="userOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.APPLY_USR_No" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid mt-2 surface-50 border-round p-2">
        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退數量合計" controlName="RPM_TotQty"
          [control]="dataForm.controls.RPM_TotQty" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退未稅進價小計" controlName="RPM_TotBuyNet"
          [control]="dataForm.controls.RPM_TotBuyNet" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退進價稅額小計" controlName="RPM_TotBuyTax"
          [control]="dataForm.controls.RPM_TotBuyTax" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退進價合計" controlName="RPM_TotBuyAmt"
          [control]="dataForm.controls.RPM_TotBuyAmt" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退未稅售價小計" controlName="RPM_TotSaleNet"
          [control]="dataForm.controls.RPM_TotSaleNet" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退售價稅額小計" controlName="RPM_TotSaleTax"
          [control]="dataForm.controls.RPM_TotSaleTax" [useGrouping]="true" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-3" label="領退售價合計" controlName="RPM_TotSaleAmt"
          [control]="dataForm.controls.RPM_TotSaleAmt" [useGrouping]="true" [submitted]="submitted" />
      </div>
      <div class="grid p-fluid mt-2">
        <div class="col-12 md:col-6 lg:col-8">
          <app-input-textarea label="領用單說明" controlName="RPM_Remark" [control]="dataForm.controls.RPM_Remark"
            [submitted]="submitted"></app-input-textarea>
        </div>
      </div>
      <app-table-edit class="col-12" tableKey="TLS56030Detail" [columns]="editColumns" [data]="data"
        (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
        (dataChange)="data = $event; calculateTotals()" [tableRequired]="true" [rowValidate]="validateEntireRow"
        [disabled]="isFormReadable || !(dataForm.controls.RPM_No.value && dataForm.controls.LOGO_No.value) ? true : false"
        (insert)="dialogVisible = true" [showInsert]="isFormCreateable"
        [insertDisabled]="dataForm.controls.RPM_No.value && dataForm.controls.LOGO_No.value ? false : true"
        [showCheckBox]="isFormCreateable" (delete)="onDelete()" />

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-dropdown-table class="col-12" [control]="dialogQueryForm.controls.PLU_MagNo" [submitted]="submitted"
        optionLabel="PLU_MagNo" optionValue="PLU_MagNo" [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
        (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
        [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
        [totalRecords]="opTotalRecords">
        <app-input-text class="col-12 md:col-6" label="商品管理編號/國際條碼/廠商貨號" controlName="queryNo"
          [control]="opForm.controls.queryNo" />
        <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
          [control]="opForm.controls.PLU_Name" />
      </app-dropdown-table>
      <app-input-text class="col-12" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr />
  <app-table tableKey="tls52010CruDialogTable" dataKey="_TABLE_KEY" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="
      onLazyLoadData($event, dialogQueryForm); onQuery(dialogQueryForm)
    " [lazy]="true" [loading]="dialogLoading"></app-table>
</app-dialog>
<!-- (edit)="onEdit($event)" (detail)="onDetail($event)" -->
