<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="顯示方式"
            controlName="DisplayMode"
            [options]="displayModeOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="false"
            [control]="queryForm.controls.DisplayMode"
            [submitted]="submitted"
          ></app-dropdown>

          <app-calendar
            class="col-12 md:col-6 lg:col-4"
            calendarType="dateOne"
            label="存貨日期"
            controlName="stockDate"
            [control]="queryForm.controls.stockDate"
            [submitted]="submitted"
          ></app-calendar>

          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="倉庫代碼/名稱"
            controlName="HOS_No"
            [options]="warehouseOptions"
            optionLabel="label"
            optionValue="No"
            [control]="queryForm.controls.HOS_No"
            [submitted]="submitted"
          ></app-multi-select>

          <app-multi-select
            class="col-12 md:col-6 lg:col-4"
            label="品牌代碼/名稱"
            controlName="LOGO_No"
            [options]="brandCodeOptions"
            optionLabel="label"
            optionValue="No"
            [control]="queryForm.controls.LOGO_No"
            [submitted]="submitted"
          />
          <app-input-number
            class="col-12 md:col-6 lg:col-4"
            label="顯示行數"
            controlName="ODM_No"
            [control]="queryForm.controls.ODM_No"
            [useGrouping]="false"
            [submitted]="submitted"
          ></app-input-number>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
