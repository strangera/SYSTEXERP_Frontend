<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreateData(queryForm)"
      [pTooltip]="checkTXN_GUIPaper? '新增時，請將補登類別改為「補原機台」「手開二聯式發票」' : ''" tooltipPosition="bottom"
      [disabled]="checkTXN_GUIPaper" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 補登類別 -->
          <app-radiobutton class="col-12" label="補登類別" [control]="queryForm.controls.TXN_GUIPaper"
            [submitted]="submitted" [options]="TXN_GUIPaperOptions" optionLabel="label" optionValue="value" />
        </div>
        <div class="grid p-fluid">
          <!-- 銷售日期 → POS5006.SalesDate -->
          <app-calendar class="col-12 md:col-6" label="銷售日期" [control]="queryForm.controls.TXN_Date"
            [submitted]="submitted" [maxDate]="today"></app-calendar>
          <!-- 收銀機號 → POS5006.ECR_No -->
          <app-dropdown class="col-12 md:col-6" label="收銀機號" [control]="queryForm.controls.ECR_No"
            [submitted]="submitted" [options]="ECR_NoOptions | async" optionLabel="label" optionValue="value"
            (changeEvent)="onECRNoChange($event)" />
          <!-- 專櫃編號 → POS5006.TLT_No -->
          <app-dropdown class="col-12 md:col-6" label="專櫃編號" [control]="queryForm.controls.TLT_No"
            [submitted]="submitted" [options]="TLT_NoOptions" optionLabel="label" optionValue="No" />
          <!-- 交易序號 → POS5006.TXN_No -->
          <app-input-number class="col-12 md:col-6" label="交易序號" [control]="queryForm.controls.TXN_No"
            [submitted]="submitted" [max]="99999999" [useGrouping]="false"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button type="button" icon="pi pi-file-pdf" label="匯出報表PDF" (click)="onExportPDF(queryForm)"
            [loading]="btnLoading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="TXN_No" tableKey="TLS24010Table" [lastQueryBody]="historyRequestBody" [data]="data"
    [columns]="columns" [totalRecords]="totalRecords" [showDelete]="false" [showReportMode]="false" [showEdit]="false"
    [queryFunction]="tls24010Service.queryTLS24010.bind(tls24010Service)" groupRowsBy="ODM_No" [loading]="loading"
    [addButton]="addButton" (detail)="onDetailData($event)">
  </app-table-report>
</div>
<p-menu #menu [model]="items" [popup]="true" styleClass="w-auto" />
