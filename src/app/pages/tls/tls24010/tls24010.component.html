<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增補登" icon="" />
    <app-button btnType="create" (click)="onCreate()" label="取消補登" icon="" />
    <app-button btnType="create" (click)="onCreate()" label="非業主發票業績匯入" icon="pi pi-spin pi-cog" />
    <app-button btnType="create" (click)="onCreate()" label="修改" icon="pi pi-check" severity="danger" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 補登類別 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="補登類別" controlName="supplementCategory"
            [options]="supplementCategoryOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.supplementCategory" [submitted]="submitted" />
          <!-- 銷售日期 -->
          <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期"
            [control]="queryForm.controls.saleDateStart" [submitted]="submitted"></app-calendar>
          <!-- 收銀機號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="cashierCode"
            [options]="cashierOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.cashierCode" [submitted]="submitted"></app-dropdown>
          <!-- 專櫃編號 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="counterCode"
            [options]="counterCodeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.counterCode" [submitted]="submitted"></app-dropdown>
          <!-- 交易序號 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="交易序號"
            controlName="transactionSerial" [control]="queryForm.controls.transactionSerial"
            [submitted]="submitted"></app-input-number>
          <!-- 電子發票載具種類 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="電子發票載具種類" controlName="invoiceCarrierType"
            [options]="invoiceCarrierTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.invoiceCarrierType" [submitted]="submitted"
            labelStyle="color: red;"></app-dropdown>
          <!-- 來客數 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="來客數"
            controlName="visitorCount" [control]="queryForm.controls.visitorCount" [submitted]="submitted"
            labelStyle="color: red;"></app-input-number>
          <!-- 收銀員編號 -->
          <app-input-number class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="收銀員編號"
            controlName="cashierNumber" [control]="queryForm.controls.cashierNumber" [submitted]="submitted"
            labelStyle="color: red;"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS24010" dataKey="BNK_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)"></app-table>
</div>
