<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreateData()" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 補登類別 -->
          <app-radiobutton class="col-12" label="補登類別" [control]="queryForm.controls.TXN_GUIPaper"
            [submitted]="submitted" [options]="TXN_GUIPaperOptions" optionLabel="label" optionValue="value" />
        </div>
        <div class="grid p-fluid">
          <!-- 銷售日期 → POS5006.SalesDate -->
          <app-calendar class="col-12 md:col-6" label="銷售日期" [control]="queryForm.controls.TXN_Date"
            [submitted]="submitted" [maxDate]="today" (calendarEvent)="onDateSelect($event)"></app-calendar>
          <!-- 收銀機號 → POS5006.ECR_No -->
          <app-dropdown class="col-12 md:col-6" label="收銀機號" [control]="queryForm.controls.ECR_No"
            [submitted]="submitted" [options]="ECR_NoOptions" optionLabel="label" optionValue="No" />
          <!-- 專櫃編號 → POS5006.TLT_No -->
          <app-dropdown class="col-12 md:col-6" label="專櫃編號" [control]="queryForm.controls.TLT_No"
            [submitted]="submitted" [options]="TLT_NoOptions" optionLabel="label" optionValue="No" />
          <!-- 交易序號 → POS5006.TXN_No -->
          <app-input-number class="col-12 md:col-6" label="交易序號" [control]="queryForm.controls.TXN_No"
            [submitted]="submitted" [max]="99999999" [useGrouping]="false"></app-input-number>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS24010Table" dataKey="TXN_No" [data]="data" [columns]="columns" (detail)="onDetail($event)"
    [multiSortMeta]="[{ field: 'APPLY_Date', order: -1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showDelete]="false" [addButton]="addButton" [showEdit]="false"></app-table>
</div>
<p-menu #menu [model]="items" [popup]="true" styleClass="w-auto" />
