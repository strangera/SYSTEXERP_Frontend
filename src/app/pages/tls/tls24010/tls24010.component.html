<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreateData(queryForm)" [pTooltip]="getTooltipMessage()"
      tooltipPosition="bottom" [disabled]="checkTXN_GUIPaper || isClosed" />
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 補登類別 -->
          <app-radiobutton class="col-12" label="補登類別" [control]="queryForm.controls.TXN_GUIPaper"
            (valueChange)="onTXNGuipaperChanged($event)" [submitted]="submitted" [options]="TXN_GUIPaperOptions"
            optionLabel="label" optionValue="value" />
        </div>
        <div class="grid p-fluid">
          <!-- 銷售日期 → POS5006.SalesDate -->
          <app-calendar class="col-12 md:col-6" [label]="TXN_Date_Label" [control]="queryForm.controls.TXN_Date"
            [submitted]="submitted" [maxDate]="now"></app-calendar>
          <!-- 收銀機號 → POS5006.ECR_No -->
          <app-auto-complete class="col-12 md:col-6" label="收銀機號" [control]="queryForm.controls.ECR_No"
            [submitted]="submitted" [options]="ECR_NoOptions | async" optionLabel="label" optionValue="value"
            (valueChange)="onECRNoChanged($event)"></app-auto-complete>
          <!-- 專櫃編號 → POS5006.TLT_No -->
          <app-dropdown class="col-12 md:col-6" label="專櫃編號" [control]="queryForm.controls.TLT_No"
            [submitted]="submitted" [options]="TLT_NoOptions" optionLabel="label" optionValue="No" />
          <!-- 交易序號 → POS5006.TXN_No -->
          <app-input-text class="col-12 md:col-6" label="交易序號" [control]="queryForm.controls.TXN_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
          <app-button type="button" icon="pi pi-file-pdf" label="匯出報表PDF" (click)="onExportPDF(queryForm)"
            [loading]="btnLoading" [disabled]="!hasPermission('60')"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="TXN_No" tableKey="TLS24010Table" [lastQueryBody]="historyRequestBody" [data]="data"
    [columns]="columns" [totalRecords]="totalRecords" [showReportMode]="false" [showEdit]="false" [showDelete]="false"
    [queryFunction]="tableQueryFunction" [loading]="loading" [addButton]="addButton" (detail)="onDetailData($event)">
  </app-table-report>
</div>
<p-menu #menu [model]="items" [popup]="true" styleClass="w-auto" />
<ng-template #customTimeTemp let-ctx="data">
  <div class="flex flex-column gap-2 mt-4">
    <label for="Void_Date" class="font-bold block">作廢日期</label>
    <p-calendar inputId="Void_Date" [(ngModel)]="ctx.selectedDate" [showTime]="true" [timeOnly]="false"
      [showSeconds]="false" hourFormat="24" appendTo="body" styleClass="w-full" dateFormat="yy/mm/dd" view="date"
      placeholder="請選擇作廢日期">
    </p-calendar>
  </div>
</ng-template>
