<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
            <app-button btnType="create" label="新增網路訊息" (click)="onCreate()" class="col"></app-button>
        </div>
        <div *appHasPermission="addPermission">
            <app-button btnType="create" label="新增客顯訊息" (click)="onCreate()" class="col"></app-button>
        </div> -->
    <div *appHasPermission="addPermission">
      <app-button
        btnType="create"
        (click)="onCreate()"
        class="col"
      ></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="通告編號"
              controlName="NOT_No"
              [control]="queryForm.controls.NOT_No"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="建立日期"
              controlName="NOT_Date"
              [control]="queryForm.controls.NOT_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateTimeRange"
              label="有效開始日期時間"
              [startControl]="queryForm.controls.NOT_BegDate_From"
              [endControl]="queryForm.controls.NOT_BegDate_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateTimeRange"
              label="有效結束日期時間"
              [startControl]="queryForm.controls.NOT_EndDate_From"
              [endControl]="queryForm.controls.NOT_EndDate_To"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="媒體檔案名稱"
              controlName="NOT_File"
              [control]="queryForm.controls.NOT_File"
              [submitted]="submitted"
            ></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="狀態"
              controlName="NOT_Status"
              [options]="NOT_Status_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.NOT_Status"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="優先順序" controlName="NOT_No" [control]="queryForm.controls.NOT_No" [submitted]="submitted">
                        </app-input-text>
                    </div> -->
        </div>
        <!-- <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-number label="媒體檔播放秒數" controlName="NOT_PlayTime" [control]="queryForm.controls.NOT_PlayTime" [submitted]="submitted">
                        </app-input-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown label="是否限制播放條件" controlName="是否限制播放條件" [options]="NOT_DtlLimit_Options" optionLabel="label" [control]="queryForm.controls.NOT_DtlLimit" [submitted]="submitted">
                        </app-dropdown>
                    </div>
                </div> -->
        <!-- <hr>
                <app-editor-text label="備註" controlName="NOT_Note" [control]="queryForm.controls.NOT_Note" [style]="{ height: '100px' }" [submitted]="submitted">
                </app-editor-text>
                <hr> -->
        <div>
          <div class="grid justify-content-end">
            <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
            <app-button
              btnType="query"
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
    ></app-table>
  </div>
</div>
