<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-panel [header]="formTitle" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="倉別調撥單編號" controlName="issuanceReturnCode"
            [control]="dataForm.controls.issuanceReturnCode" [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="金額" controlName="amount" [control]="dataForm.controls.amount" [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="數量" controlName="amount" [control]="dataForm.controls.quantity"
            [submitted]="submitted">
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調出倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.inwarehouseCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調入倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.exwarehouseCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text label="倉別調撥單 說 明" controlName="remark" [control]="dataForm.controls.remark"
            [style]="{ height: '100px' }" [submitted]="submitted">
          </app-editor-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人編號" controlName="applicantCode" [options]="applicantCodeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.applicantCode" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.applicationDateFrom"
            [submitted]="submitted"></app-calendar>
        </div>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>
        <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
      </div>
    </div>
  </p-panel>
</div>
<div class="card">
  <div class="col-12">
    <app-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"></app-table>
  </div>
</div>
