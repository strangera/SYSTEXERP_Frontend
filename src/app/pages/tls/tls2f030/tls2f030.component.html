<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="結帳年月"
              controlName="sam_yyymm"
              [control]="queryForm.controls.sam_yyymm"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="結帳方式"
              controlName="money_type"
              [options]="money_typeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.money_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="帳次"
              controlName="sam_termno"
              [options]="sam_termnoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.sam_termno"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              controlName="floor_no"
              [options]="floor_noOptions | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.floor_no"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table
    tableKey="TLS2F030"
    dataKey="tlt_no"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showTotal]="true"
    [sumData]="sumData"
    [showManage]="false"
    [showCheckBox]="false"
    [showDelete]="false"
    [showReportMode]="false"
    [lazy]="true"
    [rows]="30"
    [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
    [multiSortMeta]="[{ field: 'tlt_no', order: 1 }]"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  >
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="PDF"
          icon="pi pi-file-pdf"
          [loading]="btnLoadingPDF"
          [disabled]="data.length === 0"
          (click)="onExportPDF()"
        ></p-button>
        <p-button
          styleClass="p-2"
          label="Excel"
          icon="pi pi-file-excel"
          [loading]="btnLoadingExcel"
          [disabled]="data.length === 0"
          (click)="onExportExcel()"
        ></p-button>
      </div>
    </header>
  </app-table>
</div>
