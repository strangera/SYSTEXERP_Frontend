<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12">
          <span *ngIf="IsExist && isFormCreateable" class="p-error">銷售日期與收銀機號已存在，請重新輸入！</span>
        </div>
        <!-- 銷售日期 -->
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期" controlName="TXN_Date"
          [control]="dataForm.controls.TXN_Date" [submitted]="submitted" [maxDate]="now"></app-calendar>
        <!-- 收銀機號 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No" [options]="ECR_NoOptions"
          optionLabel="label" optionValue="No" [control]="dataForm.controls.ECR_No"
          [submitted]="submitted"></app-dropdown>
      </div>
      <hr />
      <div class="grid p-fluid">
        <!-- 磁卡編號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="磁卡編號" controlName="magneticCard"
          [control]="dataForm.controls.magneticCard" [submitted]="submitted"></app-input-text>
      </div>
      <div class="grid p-fluid">
        <!-- 專櫃編號 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" [control]="dataForm.controls.TLT_NO"
          [submitted]="submitted" [options]="TLTTALENT_DropDownList" optionLabel="No" optionValue="No"
          templateLabel="label" controlName="TLT_NO"></app-dropdown>
        <!-- 櫃位名稱 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="櫃位名稱" controlName="TLT_Name"
          [control]="dataForm.controls.TLT_Name" [submitted]="submitted"></app-input-text>
      </div>
      <hr />
      <div class="grid p-fluid">
        <!-- 編輯畫面的金額(disable) -->
        <app-input-number *ngIf="!isFormCreateable" class="col-12 md:col-6 lg:col-4" label="金額"
          controlName="PayAmt" [control]="dataForm.controls.PayAmt" [submitted]="submitted"
          [max]="99999999" [maxFractionDigits]="4"></app-input-number>
        <!-- 新增畫面時的金額，編輯畫面時的修改金額 -->
        <app-input-number *ngIf="!isFormReadable" class="col-12 md:col-6 lg:col-4"
          [label]="isFormCreateable ? '金額' : '修改金額'" controlName="MOD_PayAmt" [control]="dataForm.controls.MOD_PayAmt"
          [submitted]="submitted" [max]="99999999" [maxFractionDigits]="4"></app-input-number>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
