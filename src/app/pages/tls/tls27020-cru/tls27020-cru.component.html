<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 銷售日期 -->
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期"
          [control]="dataForm.controls.saleDate" [submitted]="submitted"></app-calendar>
        <!-- 收銀機號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="cashRegisterNumber"
          [control]="dataForm.controls.cashRegisterNumber" [submitted]="submitted"></app-input-text>
        <!-- 條碼 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="條碼" controlName="barcode"
          [control]="dataForm.controls.barcode" [submitted]="submitted"></app-input-text>
        <!-- 磁卡編號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="磁卡編號" controlName="magneticCardNumber"
          [control]="dataForm.controls.magneticCardNumber" [submitted]="submitted"></app-input-text>
        <!-- 專櫃編號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="counterNumber"
          [control]="dataForm.controls.counterNumber" [submitted]="submitted"></app-input-text>
        <!-- 櫃位名稱 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="櫃位名稱" controlName="counterName"
          [control]="dataForm.controls.counterName" [submitted]="submitted"></app-input-text>
        <!-- 金額 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="金額" controlName="amount"
          [control]="dataForm.controls.amount" [submitted]="submitted"></app-input-text>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
