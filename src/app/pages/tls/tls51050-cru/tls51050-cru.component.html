<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="單位編碼"
            controlName="UNIT_No"
            [control]="dataForm.controls.UNIT_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="單位名稱"
            controlName="UNIT_NAME"
            [control]="dataForm.controls.UNIT_NAME"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="單位屬性"
            controlName="UNIT_Attribute"
            [options]="attributeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.UNIT_Attribute"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註說明"
            controlName="UNIT_Remark"
            [control]="dataForm.controls.UNIT_Remark"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
