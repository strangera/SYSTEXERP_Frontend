<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick startLabel="交易日期(起)" endLabel="交易日期(迄)" startControlName="Txn_Date_Start"
              endControlName="Txn_Date_End" [startControl]="queryForm.controls.Txn_Date_Start"
              [endControl]="queryForm.controls.Txn_Date_End" [submitted]="submitted">
            </app-calendar-range-quick>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號/名稱" controlName="ECR_No_List" [control]="queryForm.controls.ECR_No_List"
              [submitted]="submitted" [options]="ECR_NoOptions" optionLabel="label" optionValue="No" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號/名稱" controlName="TLT_No_List" [control]="queryForm.controls.TLT_No_List"
              [submitted]="submitted" [options]="TLTTALENT_DropDownList" optionLabel="label" optionValue="No" />
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS45030Table" dataKey="id" [data]="data" [showManage]="false" [columns]="columns"
    [showCheckBox]="false" [showEdit]="false" [showDelete]="false" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading">
  </app-table>
</div>
