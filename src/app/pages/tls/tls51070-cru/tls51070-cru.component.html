<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="基本資料"></app-button>
    <app-button label="商品規格"></app-button>
    <app-button label="商品規格(二)"></app-button>
    <app-button label="商品資訊"></app-button>
    <app-button label="商品圖檔"></app-button>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="商品管理編號"
            controlName="PLU_MagNo"
            [control]="dataForm.controls.PLU_MagNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="商品名稱"
            controlName="PLU_Name"
            [control]="dataForm.controls.PLU_Name"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="國際條碼"
            controlName="PLU_No"
            [control]="dataForm.controls.PLU_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="廠商貨號"
            controlName="PLU_OrgPLUNo"
            [control]="dataForm.controls.PLU_OrgPLUNo"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="品牌代碼"
            controlName="LOGO_No"
            [options]="brandOption"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.LOGO_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="大分類代碼"
            controlName="CAT_LNo"
            [options]="largeOption"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.CAT_LNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="中分類代碼"
            controlName="CAT_MNo"
            [options]="middleOption"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.CAT_MNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="小分類代碼"
            controlName="CAT_SNo"
            [options]="smallOption"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.CAT_SNo"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="商品型態"
            controlName="PLU_Attribute"
            [options]="attributeOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PLU_Attribute"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="商品單位"
            controlName="PLU_Unit"
            [options]="unitOptions"
            optionLabel="Label"
            optionValue="No"
            [control]="dataForm.controls.PLU_Unit"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="EC商品狀態"
            controlName="PLU_ECStatus"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.PLU_ECStatus"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="說明"
            controlName="PLU_Reserve1"
            [control]="dataForm.controls.PLU_Reserve1"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="系列"
            controlName="PLU_Reserve3"
            [control]="dataForm.controls.PLU_Reserve3"
            [submitted]="submitted"
          ></app-input-text>
        </div>
      </div>
      <div
        class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        *ngIf="!isFormReadable"
      >
        <app-button btnType="cancel"></app-button>
        <app-button btnType="submit"></app-button>
      </div>
    </form>
  </p-panel>
</div>
