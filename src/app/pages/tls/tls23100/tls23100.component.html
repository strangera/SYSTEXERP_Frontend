<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 銷售日期 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateRange"
              label="銷售日期"
              [startControl]="queryForm.controls.pstarttime"
              [endControl]="queryForm.controls.pendtime"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <!-- 專櫃編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="專櫃編號"
              controlName="counterCode"
              [control]="queryForm.controls.counterCode"
              [submitted]="submitted"
            ></app-input-text>
          </div>

          <!-- 付款別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="付款別"
              controlName="paymentType"
              [options]="paymentTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.paymentType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 館別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 樓層 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <!-- 組織代碼/名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 查詢結果 -->
<div class="card">
  <app-table
    tableKey="TLS23100"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="true"
    dataKey="transactionNumber"
    [multiSortMeta]="[{ field: 'counterCode', order: 1 }]"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
  ></app-table>
</div>
