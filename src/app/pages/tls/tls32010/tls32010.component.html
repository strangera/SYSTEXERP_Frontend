<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <!-- 日期查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-12">
            <B><u>日期查詢條件</u></B>
            <app-radiobutton
              groupname="reportType"
              [control]="queryForm.controls.reportType"
              [options]="reportTypeOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
          <!-- 區間營業報表 -->
          <div
            class="flex col-12"
            *ngIf="queryForm.controls.reportType.value == '6'"
          >
            <app-calendar-range-quick
              class="col-12 md:col-6 lg:col-4"
              label="日期範圍"
              [startControl]="queryForm.controls.sad_startdate"
              [endControl]="queryForm.controls.sad_enddate"
              [submitted]="submitted"
            />
          </div>

          <!-- 活動區間營業報表 -->
          <div
            class="flex col-12"
            *ngIf="queryForm.controls.reportType.value == '7'"
          >
            <!-- 活動 -->
            <app-dropdown
              class="col-12 md:col-6 lg:col-4"
              label="活動"
              controlName="eventID"
              [options]="EventIDOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.eventID"
              [submitted]="submitted"
            ></app-dropdown>
            <!-- 日期範圍 -->
            <app-calendar-range-quick
              class="col-12 md:col-6 lg:col-4"
              label="日期範圍"
              [startControl]="queryForm.controls.event_startdate"
              [endControl]="queryForm.controls.event_enddate"
              [submitted]="submitted"
            />
          </div>
        </div>

        <!-- 合約查詢條件 -->
        <div class="grid p-fluid">
          <div class="col-12 m-0 mt-4 border-top-1 surface-border pt-3">
            <span>
              <B><u>合約查詢條件</u></B>
            </span>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              controlName="floor"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.floor"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="區域"
              controlName="region"
              [options]="regionOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.region"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="大分類/中分類"
              controlName="bus_type"
              [options]="businessTypeCodeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bus_type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="櫃別"
              controlName="tlt_kind"
              [options]="operationsOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_kind"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="抽成別"
              controlName="tlt_term_type"
              [options]="commissionTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_term_type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織"
              controlName="org_id"
              [options]="organizationOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="tlt_no"
              [options]="counterCodeOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"
            ></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="銷售金額是否含稅"
              groupname="taxradio"
              [control]="queryForm.controls.tax"
              [options]="taxOptions"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS32010"
    dataKey="talent_id"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    [showDelete]="false"
    [showManage]="false"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    [multiSortMeta]="[{ field: 'team_name', order: -1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
    [columnGroup]="columnGroup"
  ></app-table>
</div>
