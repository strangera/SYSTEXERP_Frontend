<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="調整單號" controlName="adj_no" [control]="queryForm.controls.adj_no"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="調整日期" controlName="adj_date" [control]="queryForm.controls.adj_date"
              [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="結帳年月" controlName="sam_yyymm"
              [control]="queryForm.controls.sam_yyymm" [submitted]="submitted"></app-calendar>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="adj_no" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [totalRecords]="totalRecords" [loading]="loading" (delete)="onDelete($event)"
    [queryFunction]="tls2e060Service.queryTls2e060.bind(tls2e060Service)" [lastQueryBody]="lastQueryBody"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable" [editDisabled]="editDisabled"></app-table-report>
</div>
