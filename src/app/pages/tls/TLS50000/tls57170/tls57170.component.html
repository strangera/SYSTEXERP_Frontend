<div class="card">
  <div class="flex gap-2 mb-2 align-items-center">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 存貨年月 - 必填 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateMonthOne"
              label="存貨年月"
              [control]="queryForm.controls.STK_YM"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <!-- 倉別 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="倉別"
              [control]="queryForm.controls.HOS_No"
              [submitted]="submitted"
              [options]="HOS_NOOptions | async"
              [optionLabel]="'label'"
              [optionValue]="'value'"
            ></app-multi-select>
          </div>

          <!-- 品牌 (多選) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="品牌"
              [control]="queryForm.controls.LOGO_No"
              [submitted]="submitted"
              [options]="LOGO_NoOptions | async"
              [optionLabel]="'label'"
              [optionValue]="'value'"
            ></app-multi-select>
          </div>

          <!-- 商品管理編號/國際條碼/廠商貨號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-table
              [control]="queryForm.controls.PLU_MagNo"
              templateLabel="label"
              [submitted]="submitted"
              optionLabel="PLU_MagNo"
              optionValue="PLU_MagNo"
              [suggestions]="suggestions"
              [fieldsConfig]="fieldsConfig"
              (inputValueChanged)="onAutoCompleteInputChange($event)"
              (formValueChanged)="onformValueChanged($event)"
              [formGroup]="opForm"
              [dialogData]="opData"
              [dialogColumns]="opColumns"
              [loading]="opLoading"
              [totalRecords]="opTotalRecords"
              selectionMode="multiple"
              [showCheckBox]="true"
            >
              <app-input-text
                class="col-12 md:col-6"
                label="商品管理編號/國際條碼/廠商貨號"
                controlName="queryNo"
                [control]="opForm.controls.queryNo"
              />
              <app-input-text
                class="col-12 md:col-6"
                label="商品名稱"
                controlName="PLU_Name"
                [control]="opForm.controls.PLU_Name"
              />
            </app-dropdown-table>
          </div>

          <!-- 推銷費用率 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="推銷費用率, ex: 0.12"
              [control]="queryForm.controls.FeeRate"
              [submitted]="submitted"
            ></app-input-text>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report
      [data]="tableData()"
      dataKey="PLU_MagNo"
      tableKey="TLS57170"
      [columns]="columns"
      [totalRecords]="totalRecords()"
      [loading]="tableLoading()"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="queryFunction"
      [showCheckBox]="false"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showManage]="false"
      [showReportMode]="false"
      [groupRowsBy]="'LOGO_No'"
      [subTotalData]="subTotalData"
      [subTotalLabel]="'總計'"
    >
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button
            styleClass="p-2"
            label="存貨評價分析表.PDF"
            [loading]="exportPDFbtnLoading"
            icon="pi pi-file"
            (click)="onExportPDF(queryForm)"
            [disabled]="tableData().length === 0"
          ></p-button>
          <p-button
            styleClass="p-2"
            label="存貨評價分析表.XLSX"
            [loading]="exportExcelbtnLoading"
            icon="pi pi-file"
            (click)="onExportExcel(queryForm)"
            [disabled]="tableData().length === 0"
          ></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
