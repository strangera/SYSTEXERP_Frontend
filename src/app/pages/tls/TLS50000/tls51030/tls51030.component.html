<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="小分類代碼" controlName="CAT_SNo" [control]="queryForm.controls.CAT_SNo"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="小分類名稱" controlName="CAT_SName" [control]="queryForm.controls.CAT_SName"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼/名稱" controlName="CAT_LNo" [options]="bigCategoryOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_LNo" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="中分類代碼/名稱" controlName="CAT_MNo" [options]="middleCategoryOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.CAT_MNo" [submitted]="submitted"
              [group]="true" optionGroupLabel="label" optionGroupChildren="items"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report [data]="data()" [columns]="columns" (edit)="onEdit($event)" (delete)="onDelete($event)"
    (detail)="onDetail($event)" [showCheckBox]="true" dataKey="id" [totalRecords]="totalRecords()" [loading]="loading"
    [isRowSelectable]="isRowSelectable" [lastQueryBody]="lastQueryBody()" [queryFunction]="query">
  </app-table-report>
</div>
