<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateMonthOne" label="結帳年月" [control]="queryForm.controls.ACP_YYYYMM"
              controlName="ACP_YYYYMM" [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="廠商編號/名稱" controlName="VEN_No" [options]="ven_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號" controlName="TLT_No" [options]="tlt_noOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.TLT_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="統一編號" controlName="VEN_Uniform" [control]="queryForm.controls.VEN_Uniform"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="發票號碼" controlName="PUR_GUINo" [control]="queryForm.controls.PUR_GUINo"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="tls57180" dataKey="VEN_No" [lastQueryBody]="historyRequestBody" [data]="data"
    [columns]="columns" [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [loading]="loading"
    [queryFunction]="tls57180Service.queryTLS57180.bind(tls57180Service)" [showCheckBox]="true"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    (selectAllChange)="isAllSelected = $event">
    <header>
      <div class="flex justify-content-between align-items-center gap-2">
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="匯出PDF" [rounded]="true" icon="pi pi-file" (click)="exportPDF()"
            [disabled]="data.length === 0 || selectedItems.length === 0 || !hasPermission(Actions.Print)"
            [loading]="btnLoading"></p-button>
        </div>
        <div class="flex gap-2">
          <p-button styleClass="p-2" label="AUTOMAIL" [rounded]="true" icon="pi pi-file" (click)="dialogVisible = true"
            [disabled]="data.length === 0 || selectedItems.length === 0 || !hasPermission(Actions.AUTOMAIL)"
            [loading]="btnLoading"></p-button>
        </div>
      </div>
    </header>
  </app-table-report>
</div>
<app-dialog [visible]="dialogVisible" header="AutoMail" [showFooter]="false" (visibleChange)="dialogVisible = $event"
  width="400px">
  <form [formGroup]="dialogForm" (ngSubmit)="autoMail(dialogForm)">
    <div class="grid p-fluid">
      <app-dropdown class="col-12" label="寄件者" controlName="SMTP_No" [control]="dialogForm.controls.SMTP_No"
        [options]="SMTP_NoOptions | async" optionLabel="Name" optionValue="No" [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="submit" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
