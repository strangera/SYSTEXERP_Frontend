<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              label="庫存基準日期"
              controlName="STK_Date"
              [control]="queryForm.controls.STK_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="倉別"
              controlName="HOS_NO"
              [options]="HOS_NOOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.HOS_NO"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="品牌"
              controlName="LOGO_No"
              [options]="LOGO_NoOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.LOGO_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-product-autocomplete
            class="col-12"
            [control]="queryForm.controls.PLU_MagNo"
            [submitted]="submitted"
            optionValue="PLU_No"
            [extraFilters]="{
              HOS_No: queryForm.controls.HOS_NO.value,
              LOGO_No: queryForm.controls.LOGO_No.value,
            }"
          ></app-product-autocomplete>
          <div class="col-12 md:col-6 lg:col-4">
            <p-checkbox
              label="顯示負庫存"
              formControlName="showNegativeStock"
              [binary]="true"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="顯示行數"
              controlName="pageSize"
              [control]="queryForm.controls.pageSize"
              [submitted]="submitted"
            ></app-input-number>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    tableKey="tls57150"
    [lastQueryBody]="historyRequestBody"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [showDelete]="false"
    [showManage]="false"
    [showReportMode]="false"
    [loading]="loading"
    [columnGroup]="columnGroup"
    [queryFunction]="tls57160Service.queryTLS57160.bind(tls57160Service)"
    [footerData]="footerTotal"
    [showSort]="false"
  >
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button
          styleClass="p-2"
          label="產出庫齡分析表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportPDF()"
          [disabled]="data.length === 0"
        ></p-button>
        <p-button
          styleClass="p-2"
          label="產出庫齡分析表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportXLSX()"
          [disabled]="data.length === 0"
        ></p-button>
      </div>
    </header>
  </app-table-report>
</div>
