<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions" optionLabel="label" optionValue="No" [control]="queryForm.controls.HOS_No"
            [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandCodeOptions" optionLabel="label" optionValue="No" [control]="queryForm.controls.LOGO_No"
            [submitted]="submitted" />

          <app-calendar-range-quick class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="盤點調整日期"
            [startControl]="queryForm.controls.PST_Date_Start" [endControl]="queryForm.controls.PST_Date_End"
            [submitted]="submitted" />

          <app-input-text class="col-12 md:col-6 lg:col-4" label="盤點單號" controlName="PST_NO"
            [control]="queryForm.controls.PST_NO" [submitted]="submitted" />
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-dropdown-table class="col-12" [showOverlay]="false" [control]="queryForm.controls.PLU_MagNo"
            [submitted]="submitted" optionLabel="label" optionValue="PLU_No" [suggestions]="suggestions"
            [fieldsConfig]="fieldsConfig" (inputValueChanged)="onAutoCompleteInputChange($event)">
          </app-dropdown-table>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="IsOnlyShowDiff" class="block font-medium mb-2">顯示方式</label>
            <div class="flex align-items-center">
              <p-radioButton inputId="IsOnlyShowDiff" name="IsOnlyShowDiff" [value]="true" label="差異顯示"
                formControlName="IsOnlyShowDiff" [inputId]="'差異顯示'"></p-radioButton>
              <p-radioButton inputId="IsOnlyShowDiff" name="IsOnlyShowDiff" [value]="false" label="全部顯示"
                formControlName="IsOnlyShowDiff" [inputId]="'全部顯示'" class="ml-3"></p-radioButton>
            </div>
          </div>

          <app-dropdown class="col-12 md:col-6 lg:col-4" label="彙總/明細" controlName="DisplayMode"
            [options]="displayModeOptions" optionLabel="label" optionValue="value" [filter]="false"
            [control]="queryForm.controls.DisplayMode" [submitted]="submitted"></app-dropdown>

        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="tls57150" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns"
    [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [showReportMode]="false" [loading]="loading"
    [queryFunction]="tls57150Service.queryTLS57150.bind(tls57150Service)" [footerData]="footerTotal"
    [groupRowsBy]="queryForm.value.DisplayMode === 1 ? undefined : 'PST_NO'" [showSort]="false"
    [subTotalData]="subTotalData">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="產出盤點統計表.PDF" [loading]="btnLoading" icon="pi pi-file" (click)="onExportPDF()"
          [disabled]="data.length === 0"></p-button>
        <p-button styleClass="p-2" label="產出盤點統計表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
