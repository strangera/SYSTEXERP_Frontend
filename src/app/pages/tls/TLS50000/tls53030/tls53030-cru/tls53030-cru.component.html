<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <!-- 盤點單編號 -->
        <app-input-text class="col-12 md:col-6 lg:col-4" label="盤點單編號" controlName="PST_No"
          [control]="dataForm.controls.PST_No" [submitted]="submitted"></app-input-text>

        <!-- 倉別代碼/名稱 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉別代碼/名稱" controlName="HOS_No" [options]="hosOptions"
          [control]="dataForm.controls.HOS_No" [submitted]="submitted" [optionLabel]="'label'"
          [optionValue]="'value'"></app-dropdown>

        <!-- 品牌代碼/名稱 -->
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No" [options]="logoOptions"
          [control]="dataForm.controls.LOGO_No" [submitted]="submitted" [optionLabel]="'label'"
          [optionValue]="'value'"></app-dropdown>

        <!-- 盤點基準日期 -->
        <app-calendar class="col-12 md:col-6 lg:col-4" label="盤點基準日期" calendarType="dateOne"
          [control]="dataForm.controls.PST_Date" [submitted]="submitted"></app-calendar>

        <!-- 盤點類別 -->
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="盤點類別" controlName="PST_Type" [options]="pstTypeOptions"
            [control]="dataForm.controls.PST_Type" [submitted]="submitted" optionLabel="label"
            optionValue="value"></app-dropdown>
        </div>

        <!-- 盤點狀態 -->
        <div class="col-12 md:col-6 lg:col-4">
          <!-- 盤點狀態 -->
          <app-dropdown label="盤點狀態" controlName="PST_Status" [options]="pstStatusOptions"
            [control]="dataForm.controls.PST_Status" [submitted]="submitted" optionLabel="label"
            optionValue="value"></app-dropdown>
        </div>
      </div>
      <!-- 明細資料表 -->
      <div class="col-12">
        <app-table-edit tableKey="TLS53030Detail" [columns]="detailColumns" [data]="filteredDetailData"
          (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" [tableRequired]="true"
          [disabled]="isFormReadable" [showInsert]="false" [showDelete]="false" [showCheckBox]="false"
          [canInsert]="false" [loading]="detailLoading" [showPaginator]="true">

          <div class="col-12 flex justify-content-end mb-2">
            <p-selectButton [options]="filterOptions" [ngModel]="filterMode" optionLabel="label" optionValue="value"
              [ngModelOptions]="{standalone: true}" (onChange)="onFilterChange($event)" [disabled]="detailLoading">
              <ng-template let-item pTemplate="item">
                <i [class]="item.icon" class="mr-2"></i>
                <span>{{ item.label }} ({{ item.value === 'ALL' ? totalCount : diffCount }})</span>
              </ng-template>
            </p-selectButton>
          </div>
        </app-table-edit>
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="resetTable()"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
