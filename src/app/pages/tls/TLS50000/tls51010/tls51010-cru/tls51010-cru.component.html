<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="大分類代碼" controlName="CAT_LNo"
          [control]="dataForm.controls.CAT_LNo" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="大分類名稱" controlName="CAT_LName"
          [control]="dataForm.controls.CAT_LName" [submitted]="submitted" />
        <app-input-textarea class="col-12 md:col-6 lg:col-5" label="說明" controlName="CAT_LRemark"
          [control]="dataForm.controls.CAT_LRemark" [submitted]="submitted" />
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
