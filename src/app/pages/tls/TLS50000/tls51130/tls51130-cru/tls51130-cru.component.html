<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="品牌 (編號/名稱)"
            [options]="LOGOOptions"
            [control]="dataForm.controls.LOGO_No"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="大分類 (編號/名稱)"
            [options]="CAT_LOptions"
            [control]="dataForm.controls.CAT_LNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="中分類 (編號/名稱)"
            [options]="CAT_MOptions"
            [control]="dataForm.controls.CAT_MNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="小分類 (編號/名稱)"
            [options]="CAT_SOptions"
            [control]="dataForm.controls.CAT_SNo"
            optionLabel="label"
            optionValue="value"
            [submitted]="submitted">
          </app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-number
            label="進貨折數"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            [step]="0.01"
            controlName="PLU_OrderPrcRate"
            [control]="dataForm.controls.PLU_OrderPrcRate"
            [submitted]="submitted">
          </app-input-number>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="備註"
            controlName="DISC_Remark"
            [control]="dataForm.controls.DISC_Remark"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

<div class="grid justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3" *ngIf="!isFormReadable">
  <!-- 🔹 取消：由 component 自己控，只還原表單 -->
  <button
    pButton
    type="button"
    label="取消"
    icon="pi pi-undo"
    class="p-button-outlined p-button-secondary"
    (click)="onCancelForm()">
  </button>

  <!-- 🔹 送出：仍用共用的 app-button -->
  <app-button btnType="submit"></app-button>
</div>
    </form>
  </p-panel>
</div>
