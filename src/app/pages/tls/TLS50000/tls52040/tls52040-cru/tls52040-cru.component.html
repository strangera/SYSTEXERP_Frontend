<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    @if (!isFormReadable) {
    <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onReset()" />
    <!-- 按鈕搬到 form 外，故意用 btnType="default" 覆寫 label/icon 還原「確認」外觀，
           避免 btnType="submit" 強制產生的 type="submit" 在沒有關聯 form 的情況下留下語意隱患，
           一律靠 (clickEvent) 顯式呼叫 onSubmit，行為與原本一致 -->
    <app-button btnType="default" label="確認" icon="pi pi-check" [loading]="loading" (clickEvent)="onSubmit(dataForm)" />
    }
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">

      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-3" label="退貨驗收單號" controlName="RJM_No"
          [control]="dataForm.controls.RJM_No" [submitted]="submitted" />
      </div>

      <div class="grid p-fluid mt-2">
        <div class="col-12 md:col-8 lg:col-8">
          <app-dropdown label="廠商編號/名稱" controlName="VEN_No" [options]="vendorOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.VEN_No" [submitted]="submitted" />
        </div>
        <app-dropdown class="col-12 md:col-4 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
          [options]="warehouseOptions | async" optionLabel="label" optionValue="No" [control]="dataForm.controls.HOS_No"
          [submitted]="submitted" />
      </div>

      <div class="grid p-fluid mt-2 surface-50 border-round p-2">
        <app-input-number class="col-12 md:col-6 lg:col-3" label="退貨驗收金額" controlName="RJM_TotalBuyNet"
          [control]="dataForm.controls.RJM_TotalBuyNet" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="稅額" controlName="RJM_TotalBuyTax"
          [control]="dataForm.controls.RJM_TotalBuyTax" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="合計金額" controlName="RJM_TotalBuyAmt"
          [control]="dataForm.controls.RJM_TotalBuyAmt" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="售價總計" controlName="RJM_TotalSaleAmt"
          [control]="dataForm.controls.RJM_TotalSaleAmt" [useGrouping]="true" [submitted]="submitted" />
      </div>

      <div class="grid p-fluid mt-2">
        <app-input-text class="col-12 md:col-4 lg:col-2" label="申請人" controlName="APPLY_USR_Name"
          [control]="dataForm.controls.APPLY_USR_Name" [submitted]="submitted" />

        <app-calendar class="col-12 md:col-4 lg:col-2" label="申請日期" controlName="APPLY_Date"
          [control]="dataForm.controls.APPLY_Date" [submitted]="submitted" />

        <app-calendar class="col-12 md:col-4 lg:col-2" label="審核日期" controlName="APRV_Date"
          [control]="dataForm.controls.APRV_Date" [submitted]="submitted" />

        <app-input-textarea class="col-12 lg:col-6" label="退貨驗收單說明" controlName="RJM_Remark"
          [control]="dataForm.controls.RJM_Remark" [submitted]="submitted" [rows]="1" />
      </div>

      <div class="mt-4">
        <div class="flex justify-content-between align-items-center mb-2">
          <span class="text-xl font-bold text-primary"><i class="pi pi-check-circle mr-2"></i>退貨驗收項目明細</span>
        </div>
        <app-table-edit class="col-12" tableKey="TLS52040Detail" [columns]="editColumns" [data]="data"
          (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" errorMessage="請至少選擇一個驗收項目！"
          (dataChange)="data = $event;calculateTotals()" [tableRequired]="true" [disabled]="isFormReadable"
          [showDelete]="false" (insert)="onShowDialog()" [showInsert]="isFormCreateable || rowdata?.RJM_Status === '1'"
          [canInsert]="false" [insertDisabled]="!(dataForm.controls.VEN_No.value && dataForm.controls.HOS_No.value)"
          [multiSortMeta]="[{ field: 'ODM_No', order: 1 }]" [showCheckBox]="false" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇退貨單" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0" [width]="'80vw'">
  <div class="p-2">
    <app-table-report dataKey="CRN_No" [showReportMode]="false" [data]="dialogData" [columns]="dialogColumns"
      [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
      (selectionChange)="selectedItemsDialog = $event" [showManage]="false" [showCheckBox]="true"
      [isRowSelectable]="isRowSelectable.bind(this)" [totalRecords]="totalRecords" [loading]="dialogLoading"
      scrollHeight="400px" [lastQueryBody]="dialogLastQueryParams" [showSort]="false"
      [queryFunction]="tls52040Service.GetPOS2031P.bind(tls52040Service)">
    </app-table-report>
  </div>
</app-dialog>
