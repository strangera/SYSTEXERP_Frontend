<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="領用單編號" controlName="SPM_No" [control]="dataForm.controls.SPM_No"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
          [options]="filteredLogoOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.LOGO_No"
          [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉庫代碼/名稱" controlName="HOS_No"
          [options]="filteredWarehouseOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.HOS_No" [submitted]="submitted" />
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="部門編號" controlName="org_id" [options]="departmentOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.org_id" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="領用類別" controlName="SPM_Type" [options]="issuanceTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.SPM_Type" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人編號" controlName="APPLY_USR_No" [options]="userOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.APPLY_USR_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>

      </div>
      <div class="grid p-fluid mt-2 surface-50 border-round p-2">
        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用數量合計" controlName="SPM_TotQty"
          [control]="dataForm.controls.SPM_TotQty" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用未稅進價小計" controlName="SPM_TotBuyNet"
          [control]="dataForm.controls.SPM_TotBuyNet" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用進價稅額小計" controlName="SPM_TotBuyTax"
          [control]="dataForm.controls.SPM_TotBuyTax" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="合計金額" controlName="SPM_TotBuyAmt"
          [control]="dataForm.controls.SPM_TotBuyAmt" [useGrouping]="true" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用未稅售價小計" controlName="SPM_TotSaleNet"
          [control]="dataForm.controls.SPM_TotSaleNet" [useGrouping]="true" [submitted]="submitted" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用售價稅額小計" controlName="SPM_TotSaleTax"
          [control]="dataForm.controls.SPM_TotSaleTax" [useGrouping]="true" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-3" label="領用售價合計" controlName="SPM_TotSaleAmt"
          [control]="dataForm.controls.SPM_TotSaleAmt" [useGrouping]="true" [submitted]="submitted" />
      </div>
      <div class="grid p-fluid mt-2">

        <div class="col-12 md:col-6 lg:col-8">
          <app-input-textarea class="col-12" label="領用單說明" controlName="SPM_remark"
            [control]="dataForm.controls.SPM_remark" [submitted]="submitted" />
        </div>
      </div>
      <app-table-edit class="col-12" tableKey="TLS52010Detail" [columns]="editColumns" [data]="data"
        (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
        (dataChange)="data = $event;calculateTotals()" [tableRequired]="true" [rowValidate]="validateEntireRow"
        [disabled]="isFormReadable || !dataForm.controls.LOGO_No.value" (insert)="dialogVisible = true"
        [showInsert]="!isFormReadable"
        [insertDisabled]="dataForm.controls.org_id.value && dataForm.controls.LOGO_No.value ? false : true" />

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" (clickEvent)="onLocalCancel()" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-dropdown-table class="col-12" [showOverlay]="false" [control]="dialogQueryForm.controls.PLU_MagNo"
        [submitted]="submitted" optionLabel="label" optionValue="PLU_No" [suggestions]="suggestions"
        [fieldsConfig]="fieldsConfig" (inputValueChanged)="onAutoCompleteInputChange($event)">
      </app-dropdown-table>
      <app-input-text class="col-12" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="大分類代碼" controlName="CAT_LNo"
        [control]="dialogQueryForm.controls.CAT_LNo" [options]="CAT_LNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="中分類代碼" controlName="CAT_MNo"
        [control]="dialogQueryForm.controls.CAT_MNo" [options]="CAT_MNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 col-6 lg:col-4" label="小分類代碼" controlName="CAT_SNo"
        [control]="dialogQueryForm.controls.CAT_SNo" [options]="CAT_SNoOptions" optionLabel="label" optionValue="No" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr />
  <app-table-report tableKey="tls52010CruDialogTable" dataKey="PLU_MagNo" [showReportMode]="false"
    [data]="dialogData" [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog"
    [showCaption]="false" (selectionChange)="selectedItemsDialog = $event" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [totalRecords]="totalRecords"
    [lastQueryBody]="dialogLastQueryBody" [queryFunction]="queryDialogDetail" [loading]="dialogLoading">
  </app-table-report>
</app-dialog>
