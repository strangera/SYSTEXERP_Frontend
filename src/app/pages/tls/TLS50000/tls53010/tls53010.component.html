<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <!-- 盤點單編號 -->
            <app-input-text label="盤點單編號" controlName="PST_No" [control]="queryForm.controls.PST_No"
              [submitted]="submitted"></app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <!-- 倉別代碼/名稱 -->
            <app-multi-select label="倉別代碼/名稱" controlName="HOS_No" [options]="hosOptions"
              [control]="queryForm.controls.HOS_No" [submitted]="submitted" optionLabel="label"
              optionValue="value"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <!-- 品牌代碼/名稱 -->
            <app-multi-select label="品牌代碼/名稱" controlName="LOGO_No" [options]="logoOptions"
              [control]="queryForm.controls.LOGO_No" [submitted]="submitted" optionLabel="label"
              optionValue="value"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <!-- 盤點基準日期（起訖） -->
            <app-calendar-range label="盤點基準日期" calendarType="dateRange"
              [startControl]="queryForm.controls.PST_DateStart" [endControl]="queryForm.controls.PST_DateEnd"
              [submitted]="submitted"></app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <!-- 盤點狀態 -->
            <app-multi-select label="盤點狀態" controlName="PST_Status" [options]="pstStatusOptions"
              [control]="queryForm.controls.PST_Status" [submitted]="submitted" optionLabel="label"
              optionValue="value"></app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS53010" dataKey="PST_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    [showCheckBox]="true" (detail)="onDetail($event)" [showDelete]="false" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls53010Service.queryTLS53010.bind(tls53010Service)" [loading]="loading"
    [addButton]="addButton" [buttonsLoading]="buttonsLoading" [editDisabled]="editDisabled">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button label="匯出盤點單" icon="pi pi-file-excel" (click)="onExportSelected()"
          [disabled]="selectedItems.length === 0" [loading]="exportSelectedLoading">
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
