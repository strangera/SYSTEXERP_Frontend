<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form *ngIf="initComponent" [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="調撥單編號" controlName="MVM_No" [control]="dataForm.controls.MVM_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌代碼" controlName="LOGO_No" [options]="brandOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="金額" controlName="APPLY_TotBuyNet" [control]="dataForm.controls.APPLY_TotBuyNet"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="數量" controlName="APPLY_TotQty" [control]="dataForm.controls.APPLY_TotQty"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調出倉別" controlName="OUT_HOS_No" [options]="warehouseOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.OUT_HOS_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="調入倉別" controlName="IN_HOS_No" [options]="warehouseOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.IN_HOS_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人編號/姓名" controlName="APPLY_USR_No" [control]="dataForm.controls.APPLY_USR_No"
            [submitted]="submitted" [options]="userOptions | async" optionLabel="label"
            optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="倉別調撥單說明" controlName="MVM_Remark" [control]="dataForm.controls.MVM_Remark"
            [style]="{ height: '100px' }" [submitted]="submitted"></app-input-textarea>
        </div>
      </div>
      <app-table-edit class="col-12" [columns]="editColumns" [data]="data" (selectionChange)="selectedItems = $event"
        [selectedItems]="selectedItems" (dataChange)="data = $event;calculateTotals()" [tableRequired]="true"
        [disabled]="isFormReadable || !(dataForm.controls.OUT_HOS_No.value && dataForm.controls.LOGO_No.value) ? true : false"
        (insert)="dialogVisible = true" [loading]="loading"
        [showInsert]="dataForm.controls.OUT_HOS_No.value && dataForm.controls.LOGO_No.value ? true : false"
        [insertDisabled]="dataForm.controls.OUT_HOS_No.value && dataForm.controls.LOGO_No.value ? false : true" />

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (click)="initaializeData()"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-product-autocomplete class="col-12" [control]="dialogQueryForm.controls.queryNo" [submitted]="submitted"
        [extraFilters]="{ HOS_No: dataForm.controls.OUT_HOS_No.value, LOGO_No: dataForm.controls.LOGO_No.value}" />
      <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>

  <hr />
  <app-table-report tableKey="tls56040CruDialogTable" dataKey="PLU_MagNo" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showManage]="false" [showCheckBox]="true"
    [totalRecords]="totalRecords" [queryFunction]="tls52010Service.queryPOS2004Detail.bind(tls52010Service)"
    [lastQueryBody]="dialogLastQueryBody" [loading]="dialogLoading" [isRowSelectable]="isRowSelectable.bind(this)">
  </app-table-report>
</app-dialog>
