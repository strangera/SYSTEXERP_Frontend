<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">

        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-3" label="退貨單號" controlName="CRN_No"
            [control]="queryForm.controls.CRN_No" [submitted]="submitted"></app-input-text>

          <app-multi-select class="col-12 md:col-6 lg:col-3" label="退貨單狀態" controlName="CRN_Status"
            [options]="crnstatusOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CRN_StatusList" [submitted]="submitted"></app-multi-select>

          <app-multi-select class="col-12 md:col-6 lg:col-3" label="倉庫代碼/名稱" controlName="HOS_No"
            [options]="warehouseOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.HOS_NoList" [submitted]="submitted"></app-multi-select>

          <app-multi-select class="col-12 md:col-6 lg:col-3" label="品牌代碼/名稱" controlName="LOGO_No"
            [options]="brandOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.LOGO_NoList" [submitted]="submitted"></app-multi-select>

          <app-dropdown class="col-12 md:col-12 lg:col-6" label="廠商編號/名稱" controlName="VEN_No"
            [options]="vendorOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.VEN_No" [submitted]="submitted"></app-dropdown>

          <app-product-autocomplete class="col-12 md:col-12 lg:col-6" [control]="queryForm.controls.queryNo"
            [submitted]="submitted" />
        </div>

        <hr class="border-top-1 surface-border my-3" />

        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-4 lg:col-3" label="申請人" controlName="APPLY_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APPLY_USR" [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-8 lg:col-5" calendarType="dateRange" label="申請日期"
            [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
            [submitted]="submitted"></app-calendar-range>
          <div class="lg:col-4 hidden lg:block"></div> <app-dropdown class="col-12 md:col-4 lg:col-3" label="審核人"
            controlName="APRV_USR" [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.APRV_USR" [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-8 lg:col-5" calendarType="dateRange" label="審核日期"
            [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
            [submitted]="submitted"></app-calendar-range>
          <div class="lg:col-4 hidden lg:block"></div>

          <app-dropdown class="col-12 md:col-4 lg:col-3" label="結案人" controlName="CLOS_USR"
            [options]="userOptions | async" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CLOS_USR" [submitted]="submitted"></app-dropdown>
          <app-calendar-range class="col-12 md:col-8 lg:col-5" calendarType="dateRange" label="結案日期"
            [startControl]="queryForm.controls.CLOS_Date_Start" [endControl]="queryForm.controls.CLOS_Date_End"
            [submitted]="submitted"></app-calendar-range>
        </div>

        <div class="flex justify-content-end gap-2 m-0 mt-3 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report tableKey="TLS52020" dataKey="CRN_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [showCheckBox]="true" [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls52020Service.queryTLS52020.bind(tls52020Service)" [totalRecords]="totalRecords"
    [loading]="loading" [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [addButton]="addButton" [buttonsLoading]="btnLoading" [editDisabled]="editDisabled">
    <header>
      <div class="flex align-items-center gap-2">
        <p-button label="列印" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="直接列印退貨單"
          tooltipPosition="top" icon="pi pi-print" [rounded]="true" severity="secondary" [loading]="printLoading"
          (click)="printDirect(selectedItems)" [disabled]="selectedCount === 0 || !this.hasPermission(Actions.Print)" />
        <p-button label="列印退貨單PDF"[ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="列印退貨單"
          tooltipPosition="top" icon="fa fa-file-pdf" [rounded]="true" severity="danger" [loading]="printLoading"
          (click)="print(selectedItems,'pdf')" [disabled]="selectedCount === 0 || !this.hasPermission(Actions.Print)" />
        <p-button label="列印退貨單EXCEL" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="列印退貨單"
          tooltipPosition="top" icon="fa fa-file-lines" [rounded]="true" severity="success" [loading]="printLoading"
          (click)="print(selectedItems,'excel')"
          [disabled]="selectedCount === 0 || !this.hasPermission(Actions.ExportExcel)" />
        <p-button label="結案" [ngStyle]="{ height: '35px' }" [style]="{ height: '35px' }" pTooltip="結案"
          tooltipPosition="top" [rounded]="true" severity="help" (click)="close(selectedItems)"
          [disabled]="disabledClose || selectedCount === 0 || !this.hasPermission(Actions.CloseCase)" />
        <span *ngIf="disabledClose && selectedCount > 0" @slideInFromLeft class="text-sm text-red-600">
          退貨單狀態為「已審核」或「部分驗收」可強制結案
        </span>
      </div>
    </header>
  </app-table-report>
</div>
