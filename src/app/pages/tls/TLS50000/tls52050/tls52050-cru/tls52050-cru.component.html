<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">

      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-3" label="變價單號" controlName="MAM_No"
          [control]="dataForm.controls.MAM_No" [submitted]="submitted" />

        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No"
          [options]="brandOptions | async" optionLabel="label" optionValue="value" [control]="dataForm.controls.LOGO_No"
          [submitted]="submitted" [helpMsg]="isFormEditable && data.length ? '已有明細資料，不可修改品牌':''" />

        <app-dropdown class="col-12 md:col-12 lg:col-5" label="廠商編號/名稱" controlName="VEN_No"
          [options]="vendorOptions | async" optionLabel="label" optionValue="value" [control]="dataForm.controls.VEN_No"
          [submitted]="submitted" />
      </div>

      <div class="grid p-fluid mt-2">
        <app-calendar-range class="col-12 lg:col-8" startLabel="生效日期(起)" endLabel="生效日期(迄)"
          startControlName="MAM_BegDate" endControlName="MAM_EndDate" [startControl]="dataForm.controls.MAM_BegDate"
          [endControl]="dataForm.controls.MAM_EndDate" [submitted]="submitted"
          [endMinDate]="dataForm.value.MAM_BegDate">
          <footer>
            <div class="flex align-items-center pt-2">
              <p-checkbox [binary]="true" formControlName="MAM_Method" inputId="MAM_Method"
                [formControl]="dataForm.controls.MAM_Method" [trueValue]="'1'" [falseValue]="'H'" label="是否為永久變價">
              </p-checkbox>
            </div>
          </footer>
        </app-calendar-range>

        <app-input-textarea class="col-12 lg:col-4" label="變價單說明" controlName="MAM_Remark"
          [control]="dataForm.controls.MAM_Remark" [submitted]="submitted" [rows]="2" />
      </div>

      <div class="grid p-fluid mt-2">
        <app-input-text class="col-12 md:col-6 lg:col-2" label="申請人" controlName="APPLY_USR_No"
          [control]="dataForm.controls.APPLY_USR_No" [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-3" label="申請日期" controlName="APPLY_Date"
          [control]="dataForm.controls.APPLY_Date" [submitted]="submitted" />
      </div>

      <div class="mt-4 mb-2 flex align-items-center">
        <span class="text-lg font-bold text-600"><i class="pi pi-cog mr-2"></i>批次調整設定</span>
      </div>
      <div class="grid p-fluid surface-50 border-round p-3 border-1 surface-border">
        <app-input-number class="col-12 md:col-6 lg:col-3" label="進價折扣%" controlName="costPriceDiscount"
          [control]="dataForm.controls.costPriceDiscount" [submitted]="submitted" suffix="%" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="進價金額調整" controlName="costPriceAmount"
          [control]="dataForm.controls.costPriceAmount" [submitted]="submitted" [min]="null" [minFractionDigits]="2"
          [maxFractionDigits]="2" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="售價折扣%" controlName="salePriceDiscount"
          [control]="dataForm.controls.salePriceDiscount" [submitted]="submitted" suffix="%" />

        <app-input-number class="col-12 md:col-6 lg:col-3" label="售價金額調整" controlName="salePriceAmount"
          [control]="dataForm.controls.salePriceAmount" [submitted]="submitted" [min]="null" />
      </div>

      <div class="mt-4">
        <div class="flex justify-content-between align-items-center mb-2">
          <span class="text-xl font-bold text-primary"><i class="pi pi-dollar mr-2"></i>變價商品明細</span>
        </div>
        <app-table-edit class="col-12" tableKey="TLS53010Detail" [columns]="editColumns" [columnGroup]="columnGroup"
          [data]="data" (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
          [rowValidate]="validateEntireRow" errorMessage="請至少選擇一個變價項目！" (dataChange)="data = $event"
          [tableRequired]="true"
          [disabled]="isFormReadable || !(dataForm.controls.VEN_No.value && dataForm.controls.LOGO_No.value)"
          (insert)="dialogVisible = true" [showInsert]="isFormCreateable || rowdata?.MAM_Status === '0'"
          [insertDisabled]="!(dataForm.controls.VEN_No.value && dataForm.controls.LOGO_No.value)" />
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-4 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onReset()" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇變價商品" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-product-autocomplete class="col-12" [control]="dialogQueryForm.controls.PLU_MagNo" [submitted]="submitted"
        [extraFilters]="{ VEN_No: dataForm.controls.VEN_No.value, LOGO_No: dataForm.controls.LOGO_No.value}" />

      <app-input-text class="col-12" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />

      <app-dropdown class="col-12 md:col-4" label="大類" controlName="CAT_LNo"
        [control]="dialogQueryForm.controls.CAT_LNo" [options]="CAT_LNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 md:col-4" label="中類" controlName="CAT_MNo"
        [control]="dialogQueryForm.controls.CAT_MNo" [options]="CAT_MNoOptions" optionLabel="label" optionValue="No" />
      <app-dropdown class="col-12 md:col-4" label="小類" controlName="CAT_SNo"
        [control]="dialogQueryForm.controls.CAT_SNo" [options]="CAT_SNoOptions" optionLabel="label" optionValue="No" />
    </div>
    <div class="flex justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr class="my-3" />
  <app-table tableKey="tls52010CruDialogTable" dataKey="PLU_MagNo" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, dialogQueryForm); onQuery(dialogQueryForm)"
    [lazy]="true" [loading]="dialogLoading">
  </app-table>
</app-dialog>
