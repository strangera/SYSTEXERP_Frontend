<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="商品報廢單編號" controlName="DAM_No" [control]="queryForm.controls.DAM_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="品牌代碼" controlName="LOGO_NoList" [options]="brandOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.LOGO_NoList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="商品報廢單狀態" controlName="DAM_StatusList" [options]="scrapStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.DAM_StatusList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人" controlName="APPLY_USR" [options]="userOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.APPLY_USR" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="審核人" controlName="APRV_USR" [options]="userOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.APRV_USR" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="申請日期" startControlName="APPLY_Date_Start"
              endControlName="APPLY_Date_End" [startControl]="queryForm.controls.APPLY_Date_Start"
              [endControl]="queryForm.controls.APPLY_Date_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="審核日期" startControlName="APRV_Date_Start"
              endControlName="APRV_Date_End" [startControl]="queryForm.controls.APRV_Date_Start"
              [endControl]="queryForm.controls.APRV_Date_End" [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="倉別" controlName="HOS_NoList" [options]="warehouseOptions | async"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.HOS_NoList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="DAM_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    [lastQueryBody]="lastQuery" [queryFunction]="tls56070Service.queryTLS56070.bind(tls56070Service)"
    (detail)="onDetail($event)" [totalRecords]="totalRecords" [showCheckBox]="true" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [showDelete]="false" [loading]="loading" [editDisabled]="editDisabled"
    [isRowSelectable]="isRowSelectable">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button styleClass="p-2 p-button-success" label="審核" icon="fa-regular fa-square-check"
          (click)="batchUpdateStatus('2')" [disabled]="!canExecuteAction('1')" [loading]="btnLoading()">
        </p-button>

        <p-button styleClass="p-2 p-button-danger" label="報廢" icon="pi pi-trash" (click)="batchUpdateStatus('3')"
          [disabled]="!canExecuteAction('2')" [loading]="btnLoading()">
        </p-button>
      </div>
    </header>
  </app-table-report>
</div>
