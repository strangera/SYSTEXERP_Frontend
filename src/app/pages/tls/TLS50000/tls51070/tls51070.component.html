<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button label="變價歷史紀錄" (click)="gotoTls51070OS('history')"></app-button>
    <app-button label="產生標籤檔" (click)="gotoTls51070OS('label')"
      [disabled]="!hasPermission(Actions.TagPrint)"></app-button>
    <p-fileUpload id="customButton" #fileUpload mode="basic" chooseIcon="pi pi-upload" accept=".png"
      (onSelect)="onIMGUpload($event); fileUpload.clear()" [auto]="true" [multiple]="true"
      [disabled]="!hasPermission(Actions.ImageImport)" chooseLabel="匯入圖片" />
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-product-autocomplete class="col-12" [control]="queryForm.controls.KeyWord" [submitted]="submitted"
            optionValue="PLU_No"></app-product-autocomplete>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="商品名稱" controlName="PLU_Name" [control]="queryForm.controls.PLU_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌代碼/名稱" controlName="LOGO_No" [options]="brandOption | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="專櫃編號/名稱" controlName="TLT_NO" [options]="TLT_NO_Option" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.TLT_NO" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類代碼/名稱" controlName="CAT_LNo" [options]="largeOption | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_LNo" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="中分類代碼/名稱" controlName="CAT_MNo" [options]="middleOption" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.CAT_MNo" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="小分類代碼/名稱" controlName="CAT_SNo" [options]="smallOption" optionLabel="Label"
              optionValue="No" [control]="queryForm.controls.CAT_SNo" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="商品型態" controlName="PLU_Attribute" [options]="attributeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PLU_Attribute" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="商品單位" controlName="PLU_Unit" [options]="unitOptions | async" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PLU_Unit" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="EC商品狀態" controlName="PLU_ECStatus" [options]="statusOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.PLU_ECStatus" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="說明" controlName="PLU_Reserve1" [control]="queryForm.controls.PLU_Reserve1"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="系列" controlName="PLU_Reserve3" [control]="queryForm.controls.PLU_Reserve3"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table-report tableKey="TLS51070" [data]="data" [columns]="columns" (edit)="onEdit($event)"
      (detail)="onDetail($event)" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
      (delete)="onDelete($event)" [deleteDisabled]="rowNotDeletable" [showExcel]="true" [showExcelImport]="false"
      [showCustomExcelImport]="true" (exportExcel)="onExportExcel()" [exportExcelLoading]="excelLoading"
      (importExcel)="importForm.reset();importDialogVisible = true" [showCheckBox]="true" dataKey="id"
      [totalRecords]="totalRecords" [loading]="loading" [lastQueryBody]="lastQueryBody"
      [queryFunction]="tls51070Service.queryTLS51070.bind(tls51070Service)"
      [customTemplates]="{ CanDel: canDelTemplate }">
      <header>
        <p-button [style]="{ width: '35px', height: '35px', 'border-radius': '50%' }" pTooltip="下傳POS"
          tooltipPosition="top" icon="pi pi-upload rotate-180" severity="success" class="p-button-rounded p-button-text"
          [disabled]="selectedItems.length === 0 || !hasPermission(Actions.Download)" (click)="onUpload()"
          [loading]="btnLoading" />
      </header>
    </app-table-report>
    <ng-template #canDelTemplate let-rowData>
      @if (!rowData.CanDel) {
      <p-tag severity="secondary" icon="pi pi-trash" styleClass="can-del-tag" pTooltip="此商品資料已被使用，無法刪除"
        tooltipPosition="top"></p-tag>
      }
    </ng-template>
  </div>
</div>

<app-dialog [visible]="importDialogVisible" header="匯入Excel" (visibleChange)="importDialogVisible = $event"
  [showFooter]="false" [disable]="false" [height]="'auto'" [width]="'500px'">
  <div class="mb-3">
    <ul class="pl-3 m-0 line-height-3 text-600">
      <li>若有填寫頁籤名稱，系統僅會匯入指定頁籤。</li>
      <li>若未填寫，系統將匯入檔案內的所有頁籤。</li>
    </ul>
  </div>

  <form [formGroup]="importForm" class="mb-3">
    <div class="grid p-fluid">
      <div class="col-12">
        <app-input-text label="指定頁籤" controlName="sheetName" [control]="importForm.controls.sheetName"></app-input-text>
      </div>
    </div>
  </form>

  <app-file-upload [accept]="'.xlsx,.xls'" [customUpload]="true" [loading]="excelLoading"
    (uploadHandler)="onImportExcelSubmit($event)" chooseLabel="匯入檔案"></app-file-upload>
</app-dialog>
