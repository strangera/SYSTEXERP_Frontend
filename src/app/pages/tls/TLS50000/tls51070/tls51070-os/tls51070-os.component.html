<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab [header]="formTitle" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <ng-container *ngIf="state.destination === 'label'">
        <div class="col-12">
          <app-table-edit #labelTable [columns]="labelColumn" [data]="labelData" [loading]="loading"
            (dataChange)="labelData = $event"></app-table-edit>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button (click)="exportLabel()" label="確認產生標籤檔" [disabled]="!hasPermission(Actions.TagPrint)"
            [loading]="loading"></app-button>
        </div>
      </ng-container>
      <!-- 變價歷史紀錄 -->
      <ng-container *ngIf="state.destination === 'history'">
        <form [formGroup]="queryPriceForm" id="queryPriceForm" (ngSubmit)="onSubmitPrice(queryPriceForm)">
          <div class="grid p-fluid">
            <!-- 國際條碼/商品管理編號/廠商貨號 -->
            <app-product-autocomplete class="col-12" [control]="queryPriceForm.controls.KeyWord" optionValue="PLU_No"
              controlName="KeyWord" (enterKey)="onSubmitPrice(queryPriceForm)"></app-product-autocomplete>
          </div>
          <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
            <app-button btnType="clear" [form]="queryPriceForm"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </form>
      </ng-container>
    </p-accordionTab>
  </p-accordion>
</div>

<ng-container *ngIf="state.destination === 'history'">
  <div class="card">
    <app-table-report tableKey="TLS51070OS" [data]="priceData[0] ? [priceData[0]] : []" [columns]="priceColumn1"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" [showCaption]="false"
      [showCheckBox]="false" [showManage]="false" dataKey="id" [totalRecords]="totalRecords"
      [lastQueryBody]="lastQueryBody"
      [queryFunction]="tls51070Service.queryTLS51070_PriceChangeRecord.bind(tls51070Service)" [loading]="loading"
      [showSummary]="false"></app-table-report>
    <br />
    <app-table-report tableKey="TLS51070OS" [data]="priceData" [columns]="priceColumn2" [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event" [showCheckBox]="false" [showCaption]="false" [showManage]="false"
      dataKey="id" [totalRecords]="totalRecords" [lastQueryBody]="lastQueryBody"
      [queryFunction]="tls51070Service.queryTLS51070_PriceChangeRecord.bind(tls51070Service)"
      [loading]="loading"></app-table-report>
  </div>
</ng-container>
