<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">

        <div class="grid p-fluid">

          <div class="col-12 lg:col-8">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6">
                <app-dropdown label="顯示方式" controlName="ShowType" [options]="showTypeOptions" optionLabel="label"
                  optionValue="value" [filter]="false" [control]="queryForm.controls.ShowType"
                  [submitted]="submitted"></app-dropdown>
              </div>
              <div class="col-12 md:col-6">
                <app-calendar calendarType="dateMonthOne" label="基準月份" controlName="BaseYM"
                  [control]="queryForm.controls.BaseYM" [submitted]="submitted"></app-calendar>
              </div>
              <div class="col-12 md:col-6">
                <app-dropdown label="倉別" controlName="HOS_No" [options]="warehouseOptions | async" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.HOS_No" [submitted]="submitted"></app-dropdown>
              </div>
              <div class="col-12 md:col-6">
                <app-dropdown label="品牌" controlName="LOGO_No" [options]="brandCodeOptions | async" optionLabel="label"
                  optionValue="value" [control]="queryForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
              </div>
              <div class="col-12 md:col-6">
                <app-input-number label="顯示行數" controlName="PageSize" [control]="queryForm.controls.PageSize"
                  [submitted]="submitted"></app-input-number>
              </div>
            </div>
          </div>

          <div class="col-12 lg:col-4 flex flex-column">
            <div class="surface-ground p-3 border-round border-1 surface-border flex-1">
              <app-tls57120-range-group [form]="queryForm" [submitted]="submitted"></app-tls57120-range-group>
            </div>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>

      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report tableKey="tls57120" [lastQueryBody]="lastQueryBody" [data]="data" [columns]="columns"
    [columnGroup]="columnGroup" [totalRecords]="totalRecords" [footerData]="footerData" [showDelete]="false"
    [showManage]="false" [showReportMode]="false" [loading]="loading"
    [queryFunction]="tls57120Service.queryTLS57120.bind(tls57120Service)" [showEdit]="false" [showDetail]="false">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="滯銷商品統計表.pdf" [loading]="btnPDFLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
        <p-button styleClass="p-2" label="滯銷商品統計表.xlsx" [loading]="btnExcelLoading" icon="pi pi-file"
          (click)="onExportXLSX()" [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
