<app-table-report
  class="tls57070-table"
  tableKey="tls57070"

  [data]="data"
  (dataChange)="dataChange.emit($event)"

  [columns]="columns"
  [totalRecords]="totalRecords"

  [footerData]="footerData"
  [subTotalData]="subTotalData"

  [columnGroup]="columnGroup"

  [groupRowsBy]="groupRowsBy"

  [loading]="loading"

  [lastQueryBody]="lastQueryBody"

  [queryFunction]="
    tls57070Service.queryTLS57070.bind(tls57070Service)
  "

  [showReportMode]="false"
  [showManage]="false"
  [showDelete]="false"
  [showSort]="false"

  [ItemSize]="itemSize"
>

  <header>
    <div class="flex justify-content-end align-items-center gap-2">

      <p-button
        styleClass="p-2"
        label="產出存貨月結表.PDF"
        [loading]="btnLoading"
        icon="pi pi-file"
        (click)="exportPDF.emit()"
        [disabled]="data.length === 0">
      </p-button>

      <p-button
        styleClass="p-2"
        label="產出存貨月結表.XLSX"
        [loading]="btnLoading"
        icon="pi pi-file"
        (click)="exportXLSX.emit()"
        [disabled]="data.length === 0">
      </p-button>

    </div>
  </header>

</app-table-report>
