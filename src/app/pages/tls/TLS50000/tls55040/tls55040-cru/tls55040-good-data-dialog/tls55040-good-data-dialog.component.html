<app-dialog [visible]="visible" header="商品資料查詢" (visibleChange)="closeDialog()" (save)="saveAndImport()"
  [disable]="ODMselectedItems.length === 0" [height]="'500px'">
  <div class="grid p-fluid" [formGroup]="selectedTotalForm">
    <div class="col-12 md:col-6 lg:col-4">
      <app-input-number label="選取的進貨未稅總額" controlName="selectedTotal"
        [control]="selectedTotalForm.controls.selectedTotal"></app-input-number>
    </div>
    <div class="col-12 md:col-6 lg:col-4">
      <app-input-number label="含稅總額" controlName="taxIncludedTotal"
        [control]="selectedTotalForm.controls.taxIncludedTotal"></app-input-number>
    </div>
  </div>
  <app-table-report dataKey="ODM_No" [lastQueryBody]="ODMLastQueryBody" [totalRecords]="ODMtotalRecords"
    [data]="ODMData" [columns]="ODMColumns" [selectedItems]="ODMselectedItems"
    (selectionChange)="ODMselectedItems = $event; updateSelectedTotals()" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [loading]="ODMLoading" [showCaption]="false"
    [queryFunction]="tls55040Service.queryTLS55040GoodData.bind(tls55040Service)">
  </app-table-report>
</app-dialog>
