<ng-template #formTemplate>
  <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
        [control]="queryForm.controls.ECR_No" [submitted]="submitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
        [control]="queryForm.controls.TXN_No" [submitted]="submitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="TLT_No"
        [control]="queryForm.controls.TLT_No" [submitted]="submitted" />
    </div>
    <hr />
    <!-- 中信、中信-停車專用欄位 -->
    <div class="grid p-fluid">
      <!-- 銷售狀態、交易類型 -->
      <app-multi-select class="col-12 md:col-6 lg:col-4" label="銷售狀態" controlName="CTBC_TxnCode"
        [options]="CTBC_TxnCodeOptions" optionLabel="label" optionValue="value"
        [control]="queryForm.controls.CTBC_TxnTypeList" [submitted]="submitted" />
      <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="金額"
        [startControl]="queryForm.controls.CTBC_TxnAmt_Start" [endControl]="queryForm.controls.CTBC_TxnAmt_End"
        [submitted]="submitted" />
      <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateTimeRange" label="銷售日期"
        [startControl]="queryForm.controls.CTBC_TxnDate_Start" [endControl]="queryForm.controls.CTBC_TxnDate_End"
        [submitted]="submitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="CTBC_CrdNo"
        [control]="queryForm.controls.CTBC_CrdNo" [submitted]="submitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="CTBC_TmID"
        [control]="queryForm.controls.CTBC_TmID" [submitted]="submitted" />
      <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="請款日期"
        [startControl]="queryForm.controls.CTBC_BusDate_Start" [endControl]="queryForm.controls.CTBC_BusDate_End"
        [submitted]="submitted" />
      <app-multi-select class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="CTBC_DataType"
        [options]="BusCrdTxnFgOptions" optionLabel="label" optionValue="value"
        [control]="queryForm.controls.CTBC_DataTypeList" [submitted]="submitted" />
      <app-multi-select class="col-12 md:col-6 lg:col-4" label="輸入狀態" controlName="CTBC_Check" [options]="CheckOptions"
        optionLabel="label" optionValue="value" [control]="queryForm.controls.CTBC_CheckList" [submitted]="submitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="CTBC_ApprovalCode"
        [control]="queryForm.controls.CTBC_ApprovalCode" [submitted]="submitted" />
      <app-multi-select class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="CTBC_TermNo"
        [options]="TermNoOptions" optionLabel="SYS_Name" optionValue="SYS_Code"
        [control]="queryForm.controls.CTBC_TermNoList" [submitted]="submitted" />
    </div>
    <hr />
    <div class="grid p-fluid">
      <app-radiobutton class="col-12" label="查詢篩選" controlName="queryFilter" [options]="queryFilterForPos6119POptions"
        optionLabel="label" optionValue="value" [control]="queryForm.controls.radioBtn" [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear"></app-button>
      <app-button btnType="query" [loading]="loading"></app-button>
    </div>
  </form>

</ng-template>
<ng-template #tableTemplate>
  <app-table tableKey="POS6119P" dataKey="ID" [data]="POS6119PData" [columns]="POS6119P_columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [multiSortMeta]="[{ field: 'ID', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    apiUrl="queryPOS6119P" [showCheckBox]="true" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"></app-table>
</ng-template>
