<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onOpenDialog()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <label for="Bank">收單行<span class="required">*</span></label>
          <p-dropdown inputId="Bank" [(ngModel)]="selectedBank" [options]="POS611XOptions" optionLabel="label"
            optionValue="value" [filter]="false" placeholder="請選擇收單行" />
        </div>
      </div>
      <hr *ngIf="selectedBank" />
      <ng-container [ngTemplateOutlet]="currentFormTemplate"></ng-container>
    </p-accordionTab>
  </p-accordion>
</div>
<div *ngIf="selectedBank" class="card">
  <ng-container *ngTemplateOutlet="currentTableTemplate"></ng-container>
</div>
<div style="display: none;">
  <app-tls27040-pos6118 #pos6118></app-tls27040-pos6118>
  <app-tls27040-pos6119 #pos6119></app-tls27040-pos6119>
  <app-tls27040-pos6119p #pos6119p></app-tls27040-pos6119p>
</div>
<app-dialog [visible]="dialogVisible" header="新增實收檔" [showFooter]="false" (visibleChange)="dialogVisible = $event"
  height="h-10rem">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onDialogSubmit(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-dropdown class="col-12 md:col-6 lg:col-4" label="收單銀行" controlName="tableName" [options]="POS611XOptions"
        optionLabel="label" optionValue="table" [control]="dialogQueryForm.controls.tableName" [submitted]="submitted"
        [filter]="false" />
    </div>
    <hr />
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
        [control]="dialogQueryForm.controls.ECR_No" [submitted]="dialogSubmitted" />
      <app-input-text class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
        [control]="dialogQueryForm.controls.TXN_No" [submitted]="dialogSubmitted" />
      <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期"
        [control]="dialogQueryForm.controls.TXN_Date" [submitted]="dialogSubmitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
