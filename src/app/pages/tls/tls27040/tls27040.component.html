<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
            [control]="queryForm.controls.ECR_No" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
            [control]="queryForm.controls.TXN_No" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="TLT_No"
            [control]="queryForm.controls.TLT_No" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="銷售狀況" controlName="TxnType" [options]="TxnTypeOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.TxnType"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="卡別" controlName="PayCrdType"
            [options]="PayCrdTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.PayCrdType" [submitted]="submitted"></app-dropdown>
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="金額"
            [startControl]="queryForm.controls.TxnAmtStart" [endControl]="queryForm.controls.TxnAmtEnd"
            [submitted]="submitted"></app-input-number-range>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateTimeRange" label="銷售日期"
            [startControl]="queryForm.controls.TxnDateTimeStart" [endControl]="queryForm.controls.TxnDateTimeEnd"
            [submitted]="submitted"></app-calendar-range>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="CrdNo"
            [control]="queryForm.controls.CrdNo" [submitted]="submitted"></app-input-text>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="TmID"
            [control]="queryForm.controls.TmID" [submitted]="submitted"></app-input-text>
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="請款日期"
            [startControl]="queryForm.controls.BatCloseDateStart" [endControl]="queryForm.controls.BatCloseDateEnd"
            [submitted]="submitted"></app-calendar-range>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="CrdTxnFg" [options]="CrdTxnFgOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.CrdTxnFg"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="輸入狀態" controlName="Check" [options]="CheckOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.Check"
            [submitted]="submitted"></app-dropdown>
          <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="ApprovalCode"
            [control]="queryForm.controls.ApprovalCode" [submitted]="submitted"></app-input-text>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="TermNo" [options]="TermNoOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.TermNo"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="收單銀行" controlName="POS611X" [options]="POS611XOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.POS611X"
            [submitted]="submitted"></app-dropdown>
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="查詢篩選" controlName="queryFilter"
            [options]="queryFilterOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.queryFilter" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="BNK_No" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [multiSortMeta]="[{ field: 'BNK_No', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading"></app-table>
</div>
