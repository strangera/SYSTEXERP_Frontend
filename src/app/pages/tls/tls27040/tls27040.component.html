<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onOpenDialog()"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="收單銀行" controlName="POS611X" [options]="POS611XOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.POS611X" [submitted]="submitted"
            [filter]="false" />
        </div>
        <hr *ngIf="selectedBank" />
        <div *ngIf="selectedBank" class="grid p-fluid">
          <!-- 共通性 -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
            [control]="queryForm.controls.ECR_NoList" [submitted]="submitted" [options]="ECR_NoListOptions"
            optionLabel="label" optionValue="No" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
            [control]="queryForm.controls.TXN_NoList" [submitted]="submitted" [options]="TXN_NoListOptions"
            optionLabel="label" optionValue="No" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="TLT_No"
            [control]="queryForm.controls.TLT_NoList" [submitted]="submitted" [options]="TLT_NoListOptions"
            optionLabel="label" optionValue="No" />
        </div>
        <hr *ngIf="selectedBank" />
        <!-- 聯合專用欄位 -->
        <div *ngIf="selectedBank && selectedBank === '0'" class="grid p-fluid">
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="銷售狀況" controlName="NCML_TxnType"
            [options]="TxnTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.NCML_TxnTypeList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="卡別" controlName="NCML_PayCrdType"
            [options]="PayCrdTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.NCML_PayCrdTypeList" [submitted]="submitted" />
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="金額"
            [startControl]="queryForm.controls.NCML_TxnAmt_Start" [endControl]="queryForm.controls.NCML_TxnAmt_End"
            [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="銷售日期"
            [startControl]="queryForm.controls.NCML_TxnDate_Start" [endControl]="queryForm.controls.NCML_TxnDate_End"
            [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="timeRange" label="銷售時間"
            [startControl]="queryForm.controls.NCML_TxnTime_Start" [endControl]="queryForm.controls.NCML_TxnTime_End"
            [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="NCML_CrdNo"
            [control]="queryForm.controls.NCML_CrdNo" [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="NCML_TmID"
            [control]="queryForm.controls.NCML_TmID" [submitted]="submitted" />
          <app-calendar-range class="col-12 md:col-6 lg:col-4" calendarType="dateRange" label="請款日期"
            [startControl]="queryForm.controls.NCML_BatCloseDate_Start"
            [endControl]="queryForm.controls.NCML_BatCloseDate_End" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="交易類別" controlName="NCML_CrdTxnFg"
            [options]="CrdTxnFgOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.NCML_CrdTxnFgList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="輸入狀態" controlName="NCML_Check"
            [options]="CheckOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.NCML_CheckList" [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="NCML_ApprovalCode"
            [control]="queryForm.controls.NCML_ApprovalCode" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="分期期數" controlName="NCML_TermNo"
            [options]="TermNoOptions" optionLabel="SYS_Name" optionValue="SYS_Code"
            [control]="queryForm.controls.NCML_TermNoList" [submitted]="submitted" />
        </div>
        <!-- 中信、中信-停車專用欄位 -->
        <div *ngIf="selectedBank && selectedBank !== '0'" class="grid p-fluid">
          <!-- 銷售狀態、交易類型 -->
          <app-multi-select *ngIf="selectedBank === '1'" class="col-12 md:col-6 lg:col-4" label="銷售狀態"
            controlName="CTBC_TxnCode" [options]="CTBC_TxnCodeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_TxnCode" [submitted]="submitted" />
          <app-multi-select *ngIf="selectedBank === '2'" class="col-12 md:col-6 lg:col-4" label="交易類型"
            controlName="CTBC_TxnType" [options]="CTBC_TxnTypeOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_TxnType" [submitted]="submitted" />
          <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="金額"
            [startControl]="queryForm.controls.CTBC_TxnAmtStart" [endControl]="queryForm.controls.CTBC_TxnAmtEnd"
            [submitted]="submitted" />
          <app-calendar-range *ngIf="selectedBank === '1'" class="col-12 md:col-6 lg:col-4" calendarType="dateTimeRange"
            label="銷售日期" [startControl]="queryForm.controls.CTBC_TxnTimeStart"
            [endControl]="queryForm.controls.CTBC_TxnTimeEnd" [submitted]="submitted" />
          <app-calendar-range *ngIf="selectedBank === '2'" class="col-12 md:col-6 lg:col-4" calendarType="dateRange"
            label="銷售日期" [startControl]="queryForm.controls.CTBC_TxnDateStart"
            [endControl]="queryForm.controls.CTBC_TxnDateEnd" [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="卡號" controlName="CTBC_CrdNo"
            [control]="queryForm.controls.CTBC_CrdNo" [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="EDC號碼" controlName="CTBC_TmID"
            [control]="queryForm.controls.CTBC_TmID" [submitted]="submitted" />
          <app-calendar-range *ngIf="selectedBank === '1'" class="col-12 md:col-6 lg:col-4" calendarType="dateRange"
            label="請款日期" [startControl]="queryForm.controls.CTBC_DateStart"
            [endControl]="queryForm.controls.CTBC_DateEnd" [submitted]="submitted" />
          <app-calendar-range *ngIf="selectedBank === '2'" class="col-12 md:col-6 lg:col-4" calendarType="dateRange"
            label="請款日期" [startControl]="queryForm.controls.CTBC_BusDateStart"
            [endControl]="queryForm.controls.CTBC_BusDateEnd" [submitted]="submitted" />
          <app-multi-select *ngIf="selectedBank !== '2'" class="col-12 md:col-6 lg:col-4" label="交易類別"
            controlName="CTBC_DataType" [options]="CrdTxnFgOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_DataType" [submitted]="submitted" />
          <app-multi-select *ngIf="selectedBank === '2'" class="col-12 md:col-6 lg:col-4" label="交易類別"
            controlName="CTBC_DataType" [options]="BusCrdTxnFgOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_DataType" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="輸入狀態" controlName="CTBC_Check"
            [options]="CheckOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.CTBC_Check"
            [submitted]="submitted" />
          <app-input-text class="col-12 md:col-6 lg:col-4" label="授權碼" controlName="CTBC_ApprovalCode"
            [control]="queryForm.controls.CTBC_ApprovalCode" [submitted]="submitted" />
          <app-multi-select *ngIf="selectedBank === '1'" class="col-12 md:col-6 lg:col-4" label="分期期數"
            controlName="CTBC_TermNo" [options]="TermNoOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_TermNo" [submitted]="submitted" />
        </div>
        <hr *ngIf="selectedBank" />
        <div *ngIf="selectedBank" class="grid p-fluid">
          <app-radiobutton class="col-12" label="查詢篩選" controlName="queryFilter" [options]="queryFilterOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.queryFilter"
            [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table dataKey="ID" [data]="data" [columns]="currentColumns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [multiSortMeta]="[{ field: 'ID', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [apiUrl]="selectApi"></app-table>
</div>


<app-dialog [visible]="dialogVisible" header="新增實收檔" [showFooter]="false" (visibleChange)="dialogVisible = $event"
  height="h-10rem">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onDialogSubmit(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="ECR_No"
        [control]="dialogQueryForm.controls.ECR_No" [submitted]="submitted" />
      <app-input-number class="col-12 md:col-6 lg:col-4" label="交易流水號" controlName="TXN_No"
        [control]="dialogQueryForm.controls.TXN_No" [submitted]="submitted" [useGrouping]="false" [max]="99999999" />
      <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateOne" label="銷售日期"
        [control]="dialogQueryForm.controls.CTBC_TxnDate" [submitted]="submitted" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
</app-dialog>
