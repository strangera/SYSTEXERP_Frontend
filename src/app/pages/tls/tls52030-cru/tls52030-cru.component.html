<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="進貨驗收單號" controlName="ODM_No"
          [control]="dataForm.controls.ODM_No" [submitted]="submitted" />
      </div>
      <hr>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="廠商編號" controlName="VEN_No" [options]="vendorOptions"
          optionLabel="label" optionValue="VEN_No" [control]="dataForm.controls.VEN_No" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌編號" controlName="LOGO_No" [options]="brandOptions"
          optionLabel="Name" optionValue="No" [control]="dataForm.controls.LOGO_No" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉別" controlName="HOS_No" [options]="warehouseOptions"
          optionLabel="Name" optionValue="No" [control]="dataForm.controls.HOS_No" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="進貨驗收金額" controlName="ODM_TotalBuyNet"
          [control]="dataForm.controls.ODM_TotalBuyNet" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="稅額" controlName="ODM_TotalBuyTax"
          [control]="dataForm.controls.ODM_TotalBuyTax" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="合計金額" controlName="ODM_TotalBuyAmt"
          [control]="dataForm.controls.ODM_TotalBuyAmt" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="申請人" controlName="ODM_USR_No" [options]="userOptions"
          optionLabel="user_Name" optionValue="user_No" [control]="dataForm.controls.ODM_USR_No"
          [submitted]="submitted" />
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateTimeOne" label="申請日期" controlName="ODM_Date"
          [control]="dataForm.controls.ODM_Date" [submitted]="submitted" />
        <app-input-number class="col-12 md:col-6 lg:col-4" label="售價總計" controlName="ODM_TotalSaleAmt"
          [control]="dataForm.controls.ODM_TotalSaleAmt" [submitted]="submitted" />
        <app-input-textarea class="col-12" label="進貨驗收單說明" controlName="ODM_Remark"
          [control]="dataForm.controls.ODM_Remark" [submitted]="submitted" />
      </div>
      <app-table dataKey="PO_No" [columns]="columns" [data]="data" [selectedItems]="selectedItems"
        (selectionChange)="selectedItems = $event" [showEdit]="false" [showDetail]="false" [showInsert]="true"
        (insert)="onShowDialog()" [showRowEdit]="true" (delete)="onDelete($event)" (rowEditSave)="onRowEditSave($event)"
        [showCaption]="isFormCreateable" [showReportMode]="false" [showManage]="!isFormReadable"
        [multiSortMeta]="[{ field: 'PO_No', order: 1 }]" [insertDisabled]="dataForm.controls.VEN_No.value && dataForm.controls.LOGO_No.value &&
        dataForm.controls.HOS_No.value ? false : true" [showDelete]="false" [showCheckBox]="false" />
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇採購單" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0" [height]="'500px'">
  <app-table tableKey="tls52030DialogTable" dataKey="PO_No" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [isRowSelectable]="isRowSelectable.bind(this)" [multiSortMeta]="[{ field: 'PO_No', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, dataForm);" [lazy]="true"
    [loading]="dialogLoading">
  </app-table>
</app-dialog>
