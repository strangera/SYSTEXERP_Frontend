<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">

    <!-- ======= 新增模式：顯示查詢 + table-edit ======= -->
    <form *ngIf="!isViewMode" [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="來源發票號碼" controlName="TXN_GUIBegNo"
            [control]="dataForm.controls.TXN_GUIBegNo" [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="dataForm"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>

      <!-- 來源發票 table -->
      <app-table title="來源發票" tableKey="TLSD010Detail" [data]="data" class="col-12"
        [columns]="columnsnatural" (selectionChange)="selectedItems = $event"
        [selectedItems]="selectedItems" dataStatusField="status" [loading]="loading">
      </app-table>

      <!-- 編輯兩個 table-edit -->
      <div class="card">
        <app-table-edit title="換開發票" tableKey="TLSD010Detail" class="col-12"
          [data]="data" [columns]="columnschange" (selectionChange)="selectedItems = $event"
          [selectedItems]="selectedItems" dataStatusField="status"
          [loading]="loading" [tableRequired]="true">
        </app-table-edit>

        <app-table-edit title="商品明細" tableKey="TLSD010Detail" class="col-12"
          [data]="data" [columns]="columnsdetail" (selectionChange)="selectedItems = $event"
          [selectedItems]="selectedItems" dataStatusField="status"
          [loading]="loading" [tableRequired]="true">
        </app-table-edit>

        <!-- 按鈕 -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      </div>
    </form>

    <!-- ======= 查看模式：三個純 app-table ======= -->
    <ng-container *ngIf="isViewMode" class="mt-0">
      <app-table title="來源發票" tableKey="TLSD010Detail" class="col-12"
        [data]="data" [columns]="columnsNaturalView" [loading]="loading">
      </app-table>

      <app-table title="換開發票" tableKey="TLSD010Detail" class="col-12"
        [data]="data" [columns]="columnsChangeView" [loading]="loading">
      </app-table>

      <app-table title="換開發票明細" tableKey="TLSD010Detail" class="col-12"
        [data]="data" [columns]="columnsDetailView" [loading]="loading">
      </app-table>
    </ng-container>

  </p-panel>
</div>
