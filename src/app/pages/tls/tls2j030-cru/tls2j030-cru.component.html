<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="來源發票號碼" controlName="TXN_GUIBegNo" [control]="dataForm.controls.TXN_GUIBegNo"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="dataForm"></app-button>
        <app-button btnType="query" [loading]="loading"></app-button>
      </div>
    </form>
    <app-table title="來源發票" tableKey="TLSD010Detail" [data]="data" class="col-12" [columns]="columnsnatural"
      (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" dataStatusField="status"
      [loading]="loading"></app-table>
    <div class="card">
      <app-table-edit title="換開發票" tableKey="TLSD010Detail" [data]="data" class="col-12" [columns]="columnschange"
        (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" dataStatusField="status"
        [loading]="loading" [tableRequired]="true"></app-table-edit>

      <app-table-edit title="商品明細" tableKey="TLSD010Detail" [data]="data" class="col-12" [columns]="columnsdetail"
        (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems" dataStatusField="status"
        [loading]="loading" [tableRequired]="true"></app-table-edit>

      <!-- 按鈕 -->
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" />
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </div>

  </p-panel>
</div>
