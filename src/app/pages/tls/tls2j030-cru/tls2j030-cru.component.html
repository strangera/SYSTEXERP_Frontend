<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">

    <!-- ======= 新增模式：顯示查詢 + table-edit ======= -->
    <form *ngIf="!isViewMode" [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="來源發票號碼" controlName="TXN_GUIBegNo" [control]="dataForm.controls.TXN_GUIBegNo"
            [submitted]="submitted">
          </app-input-text>
        </div>
      </div>

      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear" [form]="dataForm"></app-button>
        <app-button btnType="query" [loading]="queryLoading" (click)="querySourceInvoice()"></app-button>
      </div>

      <!-- 來源發票 table -->
      <p-divider align="left" type="solid" styleClass="pb-2 mb-0">
        <span class="text-center text-xl font-bold text-primary">
          來源發票
        </span>
      </p-divider>
      <app-table tableKey="TLSD010Detail" [data]="data" class="col-12" [columns]="columnsnatural" dataKey="TXN_GUIBegNo"
        [showCaption]="false" [showManage]="false" [showCheckBox]="false" dataStatusField="status"
        [showReportMode]="false" [loading]="queryLoading">
      </app-table>

      <!-- 編輯兩個 table-edit -->
      <div class="card">
        <p-divider align="left" type="solid" styleClass="pb-2 mb-0">
          <span class="text-center text-xl font-bold text-primary">
            換開發票
          </span>
        </p-divider>
        <app-table-edit #changeEdit tableKey="ChangeEdit" class="col-12" [data]="changeEditData"
          [columns]="columnschange" dataStatusField="status" [tableRequired]="true" [showDelete]="true"
          [showInsert]="false" [showCheckBox]="true" [canInsert]="changeEditData.length < 2" (dataChange)="onChangeEditDataChange($event)"
          (fieldChange)="onChangeFieldChange($event)">
        </app-table-edit>
        <p-divider align="left" type="solid" styleClass="pb-2 mb-0">
          <span class="text-center text-xl font-bold text-primary">
            換開發票明細
          </span>
        </p-divider>
        <app-table-edit #detailEdit tableKey="DetailEdit" class="col-12" [data]="detailEditData"
          [columns]="columnsdetail" dataStatusField="status" [tableRequired]="true" [showDelete]="true"
          [showInsert]="false" [canInsert]="true" [showCheckBox]="true" (dataChange)="onDetailEditDataChange($event)"
          (fieldChange)="onDetailFieldChange($event)">
        </app-table-edit>


        <!-- 按鈕 -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="cancel" [form]="dataForm" (clickEvent)="onCancelDetail()"></app-button>
          <app-button btnType="submit" [loading]="loading"></app-button>
        </div>
      </div>
    </form>

    <!-- ======= 查看模式：三個純 app-table ======= -->
    <ng-container *ngIf="isViewMode" class="mt-0">

      <app-table title="來源發票" tableKey="TLS2J030Detail_Natural" class="col-12" [data]="detailNaturalData" dataKey="ID"
        [showManage]="false" [showDelete]="false" [showCaption]="false" [columns]="columnsNaturalView"
        [loading]="loading">
      </app-table>

      <app-table title="換開發票" tableKey="TLS2J030Detail_Change" class="col-12" [data]="detailChangeData" dataKey="ID"
        [showManage]="false" [showDelete]="false" [showCaption]="false" [columns]="columnsChangeView"
        [loading]="loading">
      </app-table>

      <app-table title="換開發票明細" tableKey="TLS2J030Detail_Item" class="col-12" [data]="detailItemData" dataKey="ID"
        [showManage]="false" [showDelete]="false" [showCaption]="false" [columns]="columnsDetailView"
        [loading]="loading">
      </app-table>

    </ng-container>

  </p-panel>
</div>
