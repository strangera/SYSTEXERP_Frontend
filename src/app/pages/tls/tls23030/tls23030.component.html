<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted">
          </app-calendar-range-quick>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="收銀機號" controlName="ECR_No" [options]="ECRNoOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.ECR_No" [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range label="交易序號"
              [startControl]="queryForm.controls.TXN_No_Start" [endControl]="queryForm.controls.TXN_No_End" [submitted]="submitted">
            </app-input-text-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" controlName="TLT_No" [options]="CounterOptions"
              optionLabel="formLabel" optionValue="value" [control]="queryForm.controls.TLT_No" [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="付款別" controlName="PAY_NO" [options]="paymentTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.PAY_NO" [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range [useGrouping]="false" label="金額"
              [startControl]="queryForm.controls.TXN_PayAmt_Start" [endControl]="queryForm.controls.TXN_PayAmt_End" [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="交易型態" controlName="TXN_Status" [options]="txnStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.TXN_Status" [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="會員卡號" controlName="TXN_MemCard" [control]="queryForm.controls.TXN_MemCard" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="信用卡別" controlName="CRD_Type" [options]="cardTypeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.CRD_Type" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="信用卡卡號" controlName="CRD_No" [control]="queryForm.controls.CRD_No" [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否分期" controlName="IsHaveTERM_No" [options]="WhetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.IsHaveTERM_No" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label class="mb-1">是否查詢券類大批</label>
            <p-checkbox [binary]="true" formControlName="VOU_Check" inputId="VOU_Check"></p-checkbox>
            <label for="VOU_Check" class="ml-2 mt-1 text-sm text-gray-600">
              是（此條件需配合付款別為「商品券」或「紙張禮券」）
            </label>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="券類(已開/未開)" controlName="pay_taxtype" [options]="ticketStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.pay_taxtype" [submitted]="submitted">
            </app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織代碼/名稱" [options]="OrganizationCodeOptions"
              optionLabel="formLabel" optionValue="value" [control]="queryForm.controls.org_id" [submitted]="submitted">
            </app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否開立業主發票" controlName="rece_yn" [options]="WhetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.rece_yn" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="是否為業主收現" controlName="cash_yn" [options]="WhetherOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.cash_yn" [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" controlName="tlt_building" [options]="BUILDING_NO_Options"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.tlt_building" [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [options]="floorOptions" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_floor" [submitted]="submitted">
            </app-multi-select>
          </div>


        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 明細/彙總切換 -->


<div class="card">
  <!-- 明細表 -->
<app-table-report
  *ngIf="!queryForm.get('showSummary')?.value"
  tableKey="TLS23030"
  [lastQueryBody]="historyRequestBody"
  [data]="data"
  [columns]="columns"
  [totalRecords]="totalRecords"
  [showDelete]="false"
  [showManage]="false"
  [showReportMode]="false"
  [queryFunction]="queryTLS23030ForReport"
  [footerData]="detailFooter"
  [groupRowsBy]="'groupKey'">
  <header>
    <div class="flex justify-content-between align-items-center w-full">
      <div class="flex align-items-center">
        <p-checkbox
          inputId="showSummary"
          [formControl]="queryForm.controls.showSummary"
          binary="true"
          (onChange)="onToggleSummary()"
          label="顯示彙總">
        </p-checkbox>
      </div>
      <div class="flex gap-2">
        <p-button styleClass="p-2" label="付款別報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="data.length === 0"></p-button>
        <p-button styleClass="p-2" label="付款別報表.XLSX" [loading]="btnLoading" icon="pi pi-file-excel"
          (click)="onExportXLSX()" [disabled]="data.length === 0"></p-button>
      </div>
    </div>
  </header>
</app-table-report>

  <!-- 彙總表（修正：只在 showSummary 顯示，綁定彙總資料/欄位/函式） -->
 <app-table-report
  *ngIf="queryForm.get('showSummary')?.value"
  tableKey="TLS23030_SUMMARY"
  [lastQueryBody]="historyRequestBody"
  [data]="summaryData"
  [columns]="summaryColumns"
  [totalRecords]="summaryData.length"
  [showDelete]="false"
  [showManage]="false"
  [showReportMode]="false"
  [queryFunction]="queryTLS23030SummaryForReport"
  [footerData]="buildSummaryFooter()">
  <header>
    <div class="flex justify-content-between align-items-center w-full">
      <div class="flex align-items-center">
        <p-checkbox
          inputId="showSummary"
          [formControl]="queryForm.controls.showSummary"
          binary="true"
          (onChange)="onToggleSummary()"
          label="顯示彙總">
        </p-checkbox>
      </div>

      <div class="flex gap-4 align-items-center pr-2">
        <span>總金額：{{ summaryTotals.totalPayAmt | number:'1.0-0' }}</span>
        <span>總備抵稅額：{{ summaryTotals.totalTaxAlwnc | number:'1.0-0' }}</span>

        <p-button styleClass="p-2" label="彙總付款別報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onExportPDF()" [disabled]="summaryData.length === 0"></p-button>

        <p-button styleClass="p-2" label="彙總付款別報表.XLSX" [loading]="btnLoading" icon="pi pi-file-excel"
          (click)="onExportXLSX()" [disabled]="summaryData.length === 0"></p-button>
      </div>
    </div>
  </header>
</app-table-report>

  <!-- 付款別彙總（小表） -->
  <app-table-report
    *ngIf="historyRequestBody"
    tableKey="TLS23030_PAYMENT_SUMMARY"
    [lastQueryBody]="historyRequestBody"
    [columns]="paymentSummaryColumns"
    [data]="paymentSummary"
    [totalRecords]="paymentSummary.length || 0"
    [showDelete]="false"
    [showManage]="false"
    [showReportMode]="false"
    [queryFunction]="queryTLS23030PaymentSummaryForReport"
    [footerData]="buildPaymentSummaryFooterFromState()">
  </app-table-report>
</div>
