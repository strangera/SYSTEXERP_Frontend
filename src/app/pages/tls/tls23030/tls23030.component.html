<!-- src/app/pages/tls/tls23030/tls23030.component.html -->
<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar-range-quick
            class="col-12 md:col-6 lg:col-4"
            label="銷售日期"
            [startControl]="queryForm.controls.TXN_DateStart"
            [endControl]="queryForm.controls.TXN_DateEnd"
            [submitted]="submitted">
          </app-calendar-range-quick>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="交易序號"
              [startControl]="queryForm.controls.TXN_No_Start"
              [endControl]="queryForm.controls.TXN_No_End"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="付款別"
              controlName="PAY_NO"
              [options]="paymentTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PAY_NO"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number-range
              [useGrouping]="false"
              label="金額"
              [startControl]="queryForm.controls.TXN_PayAmt_Start"
              [endControl]="queryForm.controls.TXN_PayAmt_End"
              [submitted]="submitted">
            </app-input-number-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="交易型態"
              controlName="TXN_Status"
              [options]="txnStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.TXN_Status"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="會員卡號"
              controlName="TXN_MemCard"
              [control]="queryForm.controls.TXN_MemCard"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="信用卡別"
              controlName="CRD_Type"
              [options]="cardTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.CRD_Type"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="信用卡卡號"
              controlName="CRD_No"
              [control]="queryForm.controls.CRD_No"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否分期"
              controlName="IsHaveTERM_No"
              [options]="WhetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.IsHaveTERM_No"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <div class="flex flex-column">
              <label class="mb-1">是否查詢券類大批</label>
              <p-checkbox binary="false" formControlName="VOU_Check" inputId="VOU_Check"></p-checkbox>
              <label for="VOU_Check" class="ml-2 mt-1 text-sm text-gray-600">
                是(此條件必須配合付款別選擇[商品券]或[紙張禮券])
              </label>
            </div>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="券類(已開/未開)"
              controlName="pay_taxtype"
              [options]="ticketStatusOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.pay_taxtype"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否開立業主發票"
              controlName="rece_yn"
              [options]="WhetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.rece_yn"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="是否為業主收現"
              controlName="cash_yn"
              [options]="WhetherOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.cash_yn"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="tlt_building"
              [options]="BUILDING_NO_Options"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_building"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_floor"
              [submitted]="submitted">
            </app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代碼/名稱"
              [options]="OrganizationCodeOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.org_id"
              [submitted]="submitted">
            </app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<!-- 明細/彙總切換 -->
<div class="col-12 md:col-6 lg:col-4">
  <p-checkbox
    inputId="showSummary"
    [ngModelOptions]="{ standalone: true }"
    [(ngModel)]="showSummary"
    binary="true"
    (onChange)="onToggleSummary()"
    label="顯示彙總">
  </p-checkbox>
</div>

<div class="card">
  <!-- ✅ 明細表（使用 app-table2，啟用小計/總計，依付款別分組） -->
  <app-table2
    *ngIf="!showSummary"
    tableKey="TLS23030"
    [data]="data"
    [columns]="columns"
    [showCheckBox]="false"
    dataKey="_rowKey"
    [multiSortMeta]="sortMeta"
    [totalRecords]="totalRecords"
    [lazy]="true"
    [loading]="loading"
    [showManage]="false"
    [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm)"
    [showSubTotal]="true"
    [showTotal]="true"
    [groupRowsBy]="groupByField"
    [externalTotals]="detailTotals"
    [externalTotalFieldMap]="detailTotalFieldMap"
    [externalSubtotals]="detailSubtotals"
    [externalSubtotalFieldMap]="detailSubtotalFieldMap">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button
          styleClass="p-2"
          label="產出付款別報表.PDF"
          [loading]="btnLoading"
          icon="pi pi-file"
          (click)="onExportPDF()"
          [disabled]="data.length === 0">
        </p-button>

        <p-button
          styleClass="p-2"
          label="產出付款別報表.XLSX"
          [loading]="btnLoading"
          icon="pi pi-file-excel"
          (click)="onExportXLSX()"
          [disabled]="data.length === 0">
        </p-button>
      </div>
    </header>
  </app-table2>

  <!-- ✅ 彙總表（維持原本樣式；上方 header 顯示總額） -->
<app-table
  *ngIf="showSummary"
  tableKey="TLS23030summary"
  [data]="summaryData"
  [columns]="summaryColumns"
  [totalRecords]="summaryData.length || 0"
  [loading]="loading"
  [showCheckBox]="false"
  [showManage]="false"
  [showDelete]="false">
  <header>
    <div class="flex gap-4 justify-content-end align-items-center pr-2">
      <span>總金額：{{ summaryTotals.totalPayAmt | number:'1.0-0' }}</span>
      <span>總備抵稅額：{{ summaryTotals.totalTaxAlwnc | number:'1.0-0' }}</span>

      <p-button
        styleClass="p-2"
        label="彙總付款別報表.PDF"
        [loading]="btnLoading"
        icon="pi pi-file"
        (click)="onExportPDF()"
        [disabled]="summaryData.length === 0">
      </p-button>

      <p-button
        styleClass="p-2"
        label="彙總付款別報表.XLSX"
        [loading]="btnLoading"
        icon="pi pi-file-excel"
        (click)="onExportXLSX()"
        [disabled]="summaryData.length === 0">
      </p-button>
    </div>
  </header>
</app-table>
</div>
