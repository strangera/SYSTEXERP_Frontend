<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">

      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 查詢年月起迄 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="查詢年月 (起)" calendarType="dateMonthOne" [control]="queryForm.controls.startMonth"
              [submitted]="submitted"></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="查詢年月 (迄)" calendarType="dateMonthOne" [control]="queryForm.controls.endMonth"
              [submitted]="submitted"></app-calendar>
          </div>

        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>

    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TargetAchievement" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [showCheckBox]="false" dataKey="id"
    [multiSortMeta]="[{ field: 'targetCode', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true"
    [loading]="loading" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [showManage]="true"
    [showManage]="false" [showDelete]="false">
  </app-table>
</div>
