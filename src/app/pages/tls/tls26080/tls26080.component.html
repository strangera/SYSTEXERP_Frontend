<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="create"
      (click)="onCreate()"
      label="{{ 'create' | translate }}"
    ></app-button>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <!-- 活動類型 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動類型"
              controlName="activityType"
              [options]="activityTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.activityType"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="部門"
              controlName="department"
              [options]="departmentOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.department"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 活動群組 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動群組"
              controlName="activityGroup"
              [options]="activityGroupOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.activityGroup"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 活動名稱 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="活動名稱"
              controlName="activityName"
              [options]="activityNameOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.activityName"
              [submitted]="submitted"
            ></app-dropdown>
          </div>

          <!-- 活動起始日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="活動起始日"
              [control]="queryForm.controls.activityStartDate"
              controlName="activityStartDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <!-- 活動結束日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="活動結束日"
              [control]="queryForm.controls.activityEndDate"
              controlName="activityEndDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>

          <!-- 活動正檔日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="活動正檔日"
              [control]="queryForm.controls.activityOfficialDate"
              controlName="activityOfficialDate"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    tableKey="TLS26080"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    (detail)="onDetail($event)"
    [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event"
    (delete)="onDelete($event)"
    [showCheckBox]="true"
    dataKey="id"
  ></app-table>
</div>
