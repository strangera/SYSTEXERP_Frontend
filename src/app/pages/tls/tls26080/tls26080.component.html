<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"
                label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 活動單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="活動單號"
                            controlName="pod_no"
                            [control]="queryForm.controls.pod_no"
                            [disabled]="false"
                            [submitted]="submitted">
            </app-input-text>
          </div>

          <!-- 活動名稱 -->
          <div class="col-12 md:col-6 lg:col-8">
            <app-input-text label="活動名稱"
                            controlName="pod_desc"
                            [control]="queryForm.controls.pod_desc"
                            [disabled]="false"
                            [submitted]="submitted">
            </app-input-text>
          </div>
        </div>


        <div class="grid p-fluid">
          <!-- 活動起始日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange"
                                label="活動起始日期"
                                [startControl]="queryForm.controls.pod_sdate"
                                [endControl]="queryForm.controls.pod_edate"
                                [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 活動正檔 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="活動正檔日期"
                          controlName="pod_busdate"
                          [control]="queryForm.controls.pod_busdate"
                          [disabled]="false"
                          [submitted]="submitted"></app-calendar>
          </div>
        </div>

        <div class="grid p-fluid">
          <!-- 扣款項目 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="扣款代碼"
                              controlName="cap_item"
                              [options]="service.capItems()"
                              optionLabel="Name"
                              optionValue="No"
                              [control]="queryForm.controls.cap_item"
                              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear"
                      (click)="onClearForm()"></app-button>
          <app-button btnType="query"
                      (click)="onSubmitQuery()"
                      [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table [tableKey]="'TLS26080'"
             [data]="service.TLS26080List()"
             [dataKey]="'pod_no'"
             [columns]="columns"
             (edit)="onEdit($event)"
             [editDisabled]="editableStatus"
             (detail)="onDetail($event)"
             [selectedItems]="selectedItems"
             (selectionChange)="selectedItems = $event"
             (delete)="onDelete($event)"
             [showCheckBox]="true"
             dataKey="id"></app-table>
</div>
