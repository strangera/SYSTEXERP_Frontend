<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="create"
                (click)="onCreate()"
                label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}"
                    [selected]="true"
                    class="line-height-3 m-0"
                    [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 部門 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="部門"
                          controlName="org_id"
                          [options]="service.departmentItems()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="queryForm.controls.org_id"
                          [submitted]="submitted"></app-dropdown>
          </div>

          <!-- 活動單號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="活動單號"
                            controlName="pod_no"
                            [control]="queryForm.controls.pod_no"
                            [disabled]="false"
                            [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="lg:col-4 d-none"></div>

          <!-- 扣款項目 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="扣款項目"
                              controlName="cap_item"
                              [options]="service.capItems()"
                              optionLabel="Name"
                              optionValue="No"
                              [control]="queryForm.controls.cap_item"
                              [submitted]="submitted"></app-multi-select>
          </div>

          <!-- 活動起始日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange"
                                label="活動起始日期"
                                [startControl]="queryForm.controls.podSdateS"
                                [endControl]="queryForm.controls.podSdateE"
                                [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 活動結束日 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange"
                                label="活動結束日期"
                                [startControl]="queryForm.controls.podEdateS"
                                [endControl]="queryForm.controls.podEdateE"
                                [submitted]="submitted">
            </app-calendar-range>
          </div>

          <!-- 核准狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="狀態"
                          controlName="pod_status"
                          [options]="service.podStatusItems()"
                          optionLabel="Name"
                          optionValue="No"
                          [control]="queryForm.controls.pod_status"
                          [submitted]="submitted"></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear"
                      (click)="onClearForm()"></app-button>
          <app-button btnType="query"
                      (click)="onSubmitQuery()"
                      [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS26080"
             [data]="service.TLS26080List()"
             [columns]="columns"
             (edit)="onEdit($event)"
             (detail)="onDetail($event)"
             [selectedItems]="selectedItems"
             (selectionChange)="selectedItems = $event"
             (delete)="onDelete($event)"
             [showCheckBox]="true"
             dataKey="id"></app-table>
</div>
