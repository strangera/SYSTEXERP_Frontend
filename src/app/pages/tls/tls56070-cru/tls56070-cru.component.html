<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="報廢單編號" controlName="DAM_No" [control]="dataForm.controls.DAM_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌代碼" controlName="LOGO_No" [options]="brandOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="報廢倉別" controlName="HOS_No" [options]="warehouseOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.HOS_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="報廢案由說明" controlName="DAM_Remark" [control]="dataForm.controls.DAM_Remark"
            [submitted]="submitted"></app-input-textarea>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="申請人" controlName="APPLY_USR_Name" [control]="dataForm.controls.APPLY_USR_Name"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>
        <app-table-edit class="col-12" tableKey="TLS56070Detail" [columns]="editColumns" [data]="data"
          (selectionChange)="selectedItems = $event" [selectedItems]="selectedItems"
          (insert)="dialogVisible = true;selectedItemsDialog = [];dialogData = []" [tableRequired]="true"
          [canInsert]="false" [showInsert]="isFormCreateable || rowdata?.DAM_Status === '1'"
          [insertDisabled]="!(dataForm.controls.HOS_No.value && dataForm.controls.LOGO_No.value)"
          [rowValidate]="validateRow" (dataChange)="onTableDataChange($event)"
          [disabled]="isFormReadable"></app-table-edit>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm" (click)="loadData()"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-product-autocomplete class="col-12" [control]="dialogQueryForm.controls.queryNo" [submitted]="submitted"
        [extraFilters]="{ VEN_No: dataForm.controls.HOS_No.value, LOGO_No: dataForm.controls.LOGO_No.value}" />
      <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
        [control]="dialogQueryForm.controls.PLU_Name" />
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear" [form]="dialogQueryForm"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr />
  <app-table-report dataKey="PLU_MagNo" [showReportMode]="false" [data]="dialogData" [columns]="dialogColumns"
    [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    [lastQueryBody]="lastDialogQueryParams" (selectionChange)="selectedItemsDialog = $event" [showManage]="false"
    [showCheckBox]="true" [totalRecords]="totalRecords" [loading]="dialogLoading"
    [isRowSelectable]="isRowSelectable.bind(this)"
    [queryFunction]="tls52010Service.queryPOS2004Detail.bind(this.tls52010Service)">
  </app-table-report>
</app-dialog>
