<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="商品報廢單編號" controlName="SCRP_No" [control]="dataForm.controls.SCRP_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="品牌編號" controlName="LOGO_No" [options]="brandOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.LOGO_No" [submitted]="submitted"
            (ngModelChange)="onBrandChange()"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-textarea label="報廢案由說明" controlName="SCRP_Reason" [control]="dataForm.controls.SCRP_Reason"
            [submitted]="submitted"></app-input-textarea>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="申請人" controlName="APPLY_USR_No" [options]="userOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.APPLY_USR_No" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="報廢倉別" controlName="HOS_No" [options]="warehouseOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.HOS_No" [submitted]="submitted"
            (ngModelChange)="onWarehouseChange()"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="申請日期" [control]="dataForm.controls.APPLY_Date"
            [submitted]="submitted"></app-calendar>
        </div>
      </div>
      <hr />
      <app-table dataKey="PLU_MagNo" [columns]="columns" [data]="data" [selectedItems]="selectedItems"
        [showCheckBox]="isFormCreateable" (selectionChange)="selectedItems = $event" [showEdit]="false"
        [showDetail]="false" [showInsert]="true" (insert)="dialogVisible = true" [showRowEdit]="true"
        [deleteData]="true" [showManage]="!isFormReadable" [showReportMode]="false"
        [insertDisabled]="dataForm.controls.HOS_No.value && dataForm.controls.LOGO_No.value ? false : true"
        [showCaption]="isFormCreateable" (dataChange)="data = $event"></app-table>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>

<app-dialog [visible]="dialogVisible" header="選擇商品明細" (visibleChange)="dialogVisible = $event" (save)="saveDialog()"
  [disable]="selectedItemsDialog.length === 0">
  <form [formGroup]="dialogQueryForm" (ngSubmit)="onQuery(dialogQueryForm)">
    <div class="grid p-fluid">
      <app-dropdown-table class="col-12" [control]="dialogQueryForm.controls.PLU_MagNo" [submitted]="submitted"
        optionLabel="PLU_MagNo" optionValue="PLU_MagNo" [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
        (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
        [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
        [totalRecords]="opTotalRecords">
        <app-input-text class="col-12 md:col-6" label="商品管理編號/國際條碼" controlName="queryNo"
          [control]="opForm.controls.queryNo" />
        <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
          [control]="opForm.controls.PLU_Name" />
      </app-dropdown-table>
    </div>
    <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
      <app-button btnType="clear"></app-button>
      <app-button btnType="query" [loading]="dialogLoading"></app-button>
    </div>
  </form>
  <hr />
  <app-table tableKey="tls56070CruDialogTable" dataKey="PLU_MagNo" [showReportMode]="false" [data]="dialogData"
    [columns]="dialogColumns" [showDelete]="false" [selectedItems]="selectedItemsDialog" [showCaption]="false"
    (selectionChange)="selectedItemsDialog = $event" [showHeader]="false" [showManage]="false" [showCheckBox]="true"
    [multiSortMeta]="[{ field: 'PLU_MagNo', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, dialogQueryForm); onQuery(dialogQueryForm)" [lazy]="true"
    [loading]="dialogLoading">
  </app-table>
</app-dialog>
