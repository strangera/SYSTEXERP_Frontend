<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo"
                 class="flex-1"></app-menubar>
    <app-button btnType="back"
                (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate"
           class="line-height-3 m-0">
    <form [formGroup]="dataForm"
          id="dataForm"
          (ngSubmit)="onSubmit()">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4"
                      label="傳票種類"
                      [disabled]="true"
                      controlName="ENTRY_TYPE"
                      [options]="service.getEntryTypes()"
                      optionLabel="label"
                      optionValue="value"
                      [control]="df().ENTRY_TYPE"
                      [submitted]="submitted"></app-dropdown>

        <app-table-edit class="col-12"
                        title="會計科目明細"
                        tableKey="TLS21020Detail"
                        [columns]="columns"
                        [data]="service.TLS21020Data()"
                        (selectionChange)="selectedItems = $event"
                        [selectedItems]="selectedItems"
                        (dataChange)="service.TLS21020Data.set($event)"
                        [rowValidate]="validateEntireRow"
                        [tableRequired]="true"
                        [showReorder]="false"
                        [insertDisabled]="!df().ENTRY_TYPE.value"
                        [loading]="service.tableLoading()"
                        [defaultInsertData]="defaultInsertData"
                        [isRowSelectable]="rowEditValid"></app-table-edit>
      </div>
      <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="clear"
                    [form]="dataForm"></app-button>
        <app-button btnType="submit"
                    [label]="'存檔'"
                    [disabled]="canSave()"
                    [loading]="service.tableLoading()"></app-button>
      </div>
    </form>
  </p-panel>
</div>
