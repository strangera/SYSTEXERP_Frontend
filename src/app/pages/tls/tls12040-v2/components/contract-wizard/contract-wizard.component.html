<div class="card">
  <!-- 頂部操作按鈕 -->
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button
      btnType="back"
      label="上一步"
      (click)="onCancel()"
    ></app-button>
    <!-- 非最後一步：顯示下一步 -->
    <app-button
      *ngIf="!isLastStep"
      btnType="create"
      [label]="nextStepLabel"
      (click)="goToNextStep()"
    ></app-button>
    <!-- 最後一步 + 非檢視模式：顯示確認 -->
    <app-button
      *ngIf="isLastStep && !isViewMode"
      btnType="submit"
      label="確認"
      (click)="onSave()"
      [loading]="isSaving"
    ></app-button>
    <app-button btnType="back" (click)="onClearAndExit()"></app-button>
  </div>

  <!-- 步驟指示器 -->
  <div class="steps-header">
    <p-steps
      [model]="steps"
      [activeIndex]="visualStepIndex"
      [readonly]="false"
      (activeIndexChange)="goToStep($event)"
    ></p-steps>
  </div>

  <!-- Commission Type Change Warning -->
  <div *ngIf="hasCommissionTypeChanged()" class="p-3 mb-3 border-round surface-200">
    <i class="pi pi-exclamation-triangle text-orange-500 mr-2"></i>
    <span class="text-orange-700">
      抽成別已變更，部分設定可能需要重新調整
    </span>
  </div>

  <!-- Step Content -->
  <div [ngSwitch]="currentStep" class="step-content">
    <!-- Step 1: Contract Info -->
    <app-step1-contract-info
      *ngSwitchCase="0"
      [form]="dataForm"
      [locationData]="wizardState.locationData"
      [dataReady]="step1DataReady"
      [isViewMode]="isViewMode"
      [isCreateMode]="isFormCreateable"
      [submitted]="submitted"
      (dataChange)="onStep1DataChange($event)"
      (renewalDataLoaded)="onRenewalDataLoaded($event)"
    ></app-step1-contract-info>

    <!-- Step 2: Deduction -->
    <app-step2-deduction
      *ngSwitchCase="1"
      [fareItems]="wizardState.fareItems"
      [contractForm]="dataForm"
      [locationData]="wizardState.locationData"
      [crudstatus]="crudstatus"
      [isViewMode]="isViewMode"
      (dataChange)="onStep2DataChange($event)"
    ></app-step2-deduction>

    <!-- Step 3: Commission -->
    <app-step3-commission
      *ngSwitchCase="2"
      [commissionItems]="wizardState.commissionItems"
      [commissionType]="currentCommissionType"
      [crudstatus]="crudstatus"
      [contractStartDate]="dataForm.get('tlt_bdate')?.value || ''"
      [contractEndDate]="dataForm.get('tlt_edate')?.value || ''"
      [contractInfo]="$any(wizardState.contractInfo)"
      [discountOptions]="discountOptions"
      [isViewMode]="isViewMode"
      [capSaletype1]="dataForm.get('cap_saletype1')?.value"
      [capSaletype2]="dataForm.get('cap_saletype2')?.value"
      [capSaletype3]="dataForm.get('cap_saletype3')?.value"
      [capSaletype5]="dataForm.get('cap_saletype5')?.value"
      (commissionItemsChange)="onStep3DataChange($event)"
    ></app-step3-commission>

    <!-- Step 4: Condition -->
    <app-step4-condition
      *ngSwitchCase="3"
      [conditionItems]="wizardState.conditionItems"
      [contractInfo]="wizardState.contractInfo"
      [commissionType]="currentCommissionType"
      [isViewMode]="isViewMode"
      (dataChange)="onStep4DataChange($event)"
    ></app-step4-condition>
  </div>

  <!-- 底部操作按鈕 -->
  <div
    class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
  >
    <app-button
      btnType="back"
      label="上一步"
      (click)="onCancel()"
    ></app-button>
    <!-- 非最後一步：顯示下一步 -->
    <app-button
      *ngIf="!isLastStep"
      btnType="create"
      [label]="nextStepLabel"
      (click)="goToNextStep()"
    ></app-button>
    <!-- 最後一步 + 非檢視模式：顯示確認 -->
    <app-button
      *ngIf="isLastStep && !isViewMode"
      btnType="submit"
      label="確認"
      (click)="onSave()"
      [loading]="isSaving"
    ></app-button>
    <app-button btnType="back" (click)="onClearAndExit()"></app-button>
  </div>
</div>
