<!-- 載入中指示器 -->
<div *ngIf="loading" class="flex justify-content-center align-items-center p-4">
  <p-progressSpinner></p-progressSpinner>
  <span class="ml-2">載入抽成設定資料中...</span>
</div>

<!-- 主要內容 -->
<div *ngIf="!loading">
  <!-- 專櫃契約書資訊 -->
  <p-accordion>
    <p-accordionTab
      header="專櫃契約書資訊"
      [selected]="true"
      class="line-height-3 m-0"
    >
      <div class="col-12">
        <app-expandable-edit-table
          class="custom-table-red"
          [data]="contractInfoData"
          [mainColumns]="contractInfoColumns"
          [showCheckBox]="false"
          [showPaginator]="false"
          [showAddButton]="false"
          [showBatchDelete]="false"
          [loading]="loading"
          dataKey="id"
          [readonly]="true"
          detailKey=""
          emptyMessage="沒有合約資訊"
        ></app-expandable-edit-table>
      </div>
    </p-accordionTab>
  </p-accordion>

  <!-- 抽成設定區塊 -->
  <div class="setting-content mt-2">
    <p-accordion>
      <p-accordionTab
        header="抽成設定"
        [selected]="true"
        class="line-height-3 m-0"
      >
        <!-- 表格內容 -->
        <div *ngIf="dataLoaded">
          <app-expandable-edit-table
            (fieldChange)="onFieldChange($event)"
            (detailFieldChange)="onDetailFieldChange($event)"
            [data]="processedCommissionData"
            [mainColumns]="commissionColumns"
            detailKey="detailItems"
            dataKey="id"
            [showPaginator]="false"
            [showCheckBox]="!isViewMode"
            [showDetailTabs]="true"
            [detailTabOptions]="settingTabs"
            defaultDetailTab="discount"
            [detailColumnsMap]="{
              discount: discountColumns,
              annual: annualColumns,
              level: levelColumns
            }"
            emptyMessage="尚未設定抽成項目，請點擊新增按鈕開始設定"
            (detailTabChange)="onDetailTabChange($event)"
            (edit)="onItemEdit($event)"
            (save)="onItemSave($event)"
            (cancel)="onItemCancel($event)"
            [autoAddRowOnTab]="true"
            [autoAddDetailRowOnTab]="true"
            [forceEditMode]="!isViewMode"
            [showAddButton]="!isViewMode"
            [showBatchDelete]="!isViewMode"
            [showDetailAddButton]="!isViewMode"
            [showDetailBatchDelete]="!isViewMode"
            [showActionColumn]="false"
            [showDetailActionColumn]="false"
            (detailEdit)="onDetailEdit($event)"
            (detailSave)="onDetailSave($event)"
            (beforeSave)="onBeforeDetailSave($event)"
            (detailCancel)="onDetailCancel($event)"
            (batchDelete)="onBatchDelete($event)"
            (detailBatchDelete)="onDetailBatchDelete($event)"
            (addMainItem)="onAddCommissionItem()"
            (addDetailItem)="onAddDetailItem($event)"
            (dropdownChange)="onDropdownChange($event)"
            (detailButtonClick)="onDetailButtonClick($event)"
          ></app-expandable-edit-table>
        </div>

        <!-- 資料載入中提示 -->
        <div *ngIf="!dataLoaded" class="text-center p-5">
          <p-progressSpinner></p-progressSpinner>
          <p class="mt-2 text-gray-600">正在載入抽成設定資料...</p>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>

  <!-- 狀態資訊 -->
  <div class="flex justify-content-between align-items-center mt-3 pt-3">
    <div class="flex align-items-center gap-2">
      <span *ngIf="dataLoaded" class="text-sm text-gray-600">
        目前共有 <span class="font-semibold">{{ getCommissionItemCount() }}</span> 個抽成項目
      </span>
      <span *ngIf="!dataLoaded" class="text-xs text-orange-500">(載入中...)</span>
      <span *ngIf="dataLoaded && !commissionDataLoaded" class="text-xs text-red-500">(載入失敗)</span>
    </div>
  </div>
</div>

<!-- 確認對話框 -->
<p-dialog
  header="確認提交"
  [modal]="true"
  [closable]="false"
  [visible]="showConfirmDialog"
  [style]="{ width: '450px' }"
  styleClass="confirm-dialog"
>
  <div class="p-4">
    <div class="flex align-items-center mb-3">
      <i class="pi pi-exclamation-triangle text-orange-500 mr-3" style="font-size: 1.5rem"></i>
      <span class="text-lg">確定要提交契約資料嗎？</span>
    </div>
    <p class="ml-6 text-gray-600">提交後將無法修改。</p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="取消"
        icon="pi pi-times"
        styleClass="p-button-secondary"
        (onClick)="showConfirmDialog = false"
      ></p-button>
      <p-button
        label="確認提交"
        icon="pi pi-check"
        styleClass="p-button-primary"
        (onClick)="showConfirmDialog = false"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
