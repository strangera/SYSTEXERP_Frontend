<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="查詢年" calendarType="dateYearOne" [control]="queryForm.controls.sad_date"
              [submitted]="submitted"></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" [control]="queryForm.controls.tlt_noList" [submitted]="submitted"
              [options]="tltNoOptions" optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [control]="queryForm.controls.tlt_floorList" [options]="floorOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="館別" [control]="queryForm.controls.tlt_buildingList" [options]="buildingNoOptions"
              optionLabel="label" optionValue="value" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="組織" [control]="queryForm.controls.org_idList" [options]="org_id_Option"
              optionLabel="label" optionValue="No" />
          </div>
        </div>
        <div>
          <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
            <app-button btnType="clear" [form]="queryForm"></app-button>
            <app-button btnType="query" [loading]="loading"></app-button>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-table-report tableKey="TLS2e100" [data]="data" [footerData]="footerData" [columns]="columns"
      [totalRecords]="totalRecords" [queryFunction]="tls2e100Service.queryTLS2E100.bind(tls2e100Service)"
      [lastQueryBody]="lastQueryBody" [loading]="loading" [showManage]="false" [showDelete]="false"
      [showReportMode]="false" dataKey="apply_no" [groupRowsBy]="groupRowsBy" [loading]="loading">
      <header>
        <div class="flex justify-content-end align-items-center gap-2">
          <p-button styleClass="p-2" label="年度對帳單.PDF" icon="pi pi-file" (click)="onExportPDF()"
            [disabled]="data.length === 0" [loading]="pdfBtnLoading"></p-button>
          <p-button styleClass="p-2" label="年度對帳單.XLSX" icon="pi pi-file" (click)="onExportExcel()"
            [disabled]="data.length === 0" [loading]="excelBtnLoading"></p-button>
        </div>
      </header>
    </app-table-report>
  </div>
</div>
