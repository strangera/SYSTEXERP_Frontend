<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              calendarType="dateMonthRange"
              label="查詢年月"
              [startControl]="queryForm.controls.sam_yyymm_Start"
              [endControl]="queryForm.controls.sam_yyymm_End"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="結帳方式"
              controlName="money_typeList"
              [options]="money_typeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.money_typeList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="抽成方式"
              controlName="tlt_term_typeList"
              [options]="tlt_term_typeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_term_typeList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商編號/名稱"
              controlName="ven_no"
              [options]="ven_noOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ven_no"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="專櫃編號/名稱"
              controlName="tlt_noList"
              [options]="tlt_noOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.tlt_noList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="組織代號/名稱"
              controlName="org_idList"
              [options]="org_idOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.org_idList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="樓層"
              controlName="tlt_floorList"
              [options]="tlt_floorOptions | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.tlt_floorList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="館別"
              controlName="tlt_buildingList"
              [options]="tlt_buildingOptions | async"
              optionLabel="Name"
              optionValue="No"
              [control]="queryForm.controls.tlt_buildingList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="大分類代碼/名稱"
              controlName="bus_typeList"
              [options]="bus_typeOptions | async"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.bus_typeList"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="中分類代碼/名稱"
              controlName="bus_class"
              [options]="bus_classOptions"
              optionLabel="label"
              [control]="queryForm.controls.bus_classList"
              [submitted]="submitted"
              [group]="true"
              optionGroupLabel="label"
              optionGroupChildren="items"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="請款單據別"
              controlName="invoice_type"
              [options]="invoiceTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.invoice_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton-yn
              [showAll]="true"
              label="是否開立業主發票"
              controlName="rece_yn"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.rece_yn"
              [submitted]="submitted"
            ></app-radiobutton-yn>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox
              label="只顯示應付帳款小於0"
              [binary]="true"
              controlName="acc_payableNeg"
              formControlName="acc_payableNeg"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox
              label="只顯示進貨總額小於0"
              [binary]="true"
              controlName="sam_ap_amtNeg"
              formControlName="sam_ap_amtNeg"
            ></p-checkbox>
          </div>
          <div class="col-12 md:col-4 lg:col-4">
            <p-checkbox
              label="只顯示包底抽成不足"
              [binary]="true"
              controlName="isUnderLimitAmt"
              formControlName="isUnderLimitAmt"
            ></p-checkbox>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number
              label="結帳後幾日付款"
              controlName="check_day"
              [control]="queryForm.controls.check_day"
              [submitted]="submitted"
            ></app-input-number>
          </div>
          <div class="col-12 md:col-6 lg:col-4" [hidden]="reportType === '1'">
            <app-radiobutton
              label="是否含稅"
              controlName="is_tax"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.is_tax"
              [submitted]="submitted"
              [options]="taxOptions"
              (valueChange)="onTaxChange($event)"
            ></app-radiobutton>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton
              label="櫃位類型"
              controlName="store_way"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.store_way"
              [options]="[
                { label: '全部', value: null },
                { label: '專櫃', value: '1' },
                { label: '自營', value: '2' },
              ]"
              [submitted]="submitted"
            ></app-radiobutton>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="flex justify-content-center my-3">
  <p-selectButton
    [options]="typeOptions"
    [(ngModel)]="reportType"
    (onChange)="switchReport($event.value)"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
  ></p-selectButton>
</div>

@if (
  queryForm.get("store_way")?.value === null ||
  queryForm.get("store_way")?.value === "1"
) {
  <div class="card">
    <div class="flex align-items-center mb-2">
      <span class="text-xl font-bold">一般專櫃</span>
    </div>
    <app-table-report
      [exportContext]="{
        apiUrl: apiUrl,
        conditions: lastQueryBody1,
      }"
      tableKey="tls27090_1"
      [data]="data1"
      [columns]="columns"
      [columnGroup]="columnGroup"
      [totalRecords]="totalRecords1"
      [lastQueryBody]="lastQueryBody1"
      [showDelete]="false"
      [footerData]="footerData1"
      [showReportMode]="false"
      [queryFunction]="getCurrentQueryFunction()"
      [showManage]="false"
      [loading]="loading"
       [ItemSize]="60"
    >
      <header>
        <div class="flex justify-content-between align-items-center gap-2">
          <div class="flex gap-2">
            <p-button
              styleClass="p-2"
              label="專櫃帳款結算彙總表.PDF"
              [loading]="btnLoading"
              icon="pi pi-file-pdf"
              (click)="onExportPDF()"
              [disabled]="data1.length === 0"
            ></p-button>
            <p-button
              styleClass="p-2"
              label="專櫃帳款結算彙總表.xlsx"
              [loading]="btnLoading2"
              icon="pi pi-file-excel"
              (click)="onExportExcel()"
              [disabled]="data1.length === 0"
            ></p-button>
          </div>
        </div>
      </header>
    </app-table-report>
  </div>
}

@if (
  queryForm.get("store_way")?.value === null ||
  queryForm.get("store_way")?.value === "2"
) {
  <div class="card mt-4">
    <div class="flex align-items-center mb-2">
      <span class="text-xl font-bold">自營專櫃</span>
    </div>
    <app-table-report
      [exportContext]="{
        apiUrl: apiUrl,
        conditions: lastQueryBody2,
      }"
      tableKey="tls27090_2"
      [data]="data2"
      [columns]="columns"
      [columnGroup]="columnGroup"
      [totalRecords]="totalRecords2"
      [showReportMode]="false"
      [lastQueryBody]="lastQueryBody2"
      [showDelete]="false"
      [footerData]="footerData2"
      [queryFunction]="getCurrentQueryFunction()"
      [showManage]="false"
      [loading]="loading2"
       [ItemSize]="60"
    ></app-table-report>
  </div>
}
