<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="銷售類型" controlName="salesType" [options]="salesTypeOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.salesType" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="扣款項目" controlName="deductionItems" [options]="deductionItemsOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.deductionItems"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="活動大分類" controlName="eventLarge" [options]="eventOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.eventLarge" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="活動中分類" controlName="eventMedium" [options]="eventOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.eventMedium" [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="活動子檔期" controlName="eventSmall" [options]="eventOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.eventSmall" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="活動類型" controlName="eventCategory" [options]="eventCategoryOptions"
                        optionLabel="label" optionValue="value" [control]="dataForm.controls.eventCategory"
                        [submitted]="submitted">
                    </app-dropdown>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-calendar-range calendarType="dateRange" label="活動起訖"
                        [startControl]="dataForm.controls.eventDateFrom" [endControl]="dataForm.controls.eventDateTo"
                        [submitted]="submitted">
                    </app-calendar-range>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown label="部門" controlName="department" [options]="departmentOptions" optionLabel="label"
                        optionValue="value" [control]="dataForm.controls.department" [submitted]="submitted">
                    </app-dropdown>
                </div>
            </div>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button btnType="cancel" (click)="onCancel()"></app-button>
                <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
            </div>
        </div>
    </p-panel>
</div>
