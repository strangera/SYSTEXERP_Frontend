<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機號" controlName="ECR_No" [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機名稱" controlName="ECR_GUI_PeriodQty" [control]="queryForm.controls.ECR_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="機台類型" controlName="ECR_Type" [options]="ECR_Type_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_Type" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="ECR_TLT_No" [control]="queryForm.controls.ECR_TLT_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃名稱" controlName="ECR_TLT_Name" [control]="queryForm.controls.ECR_TLT_Name"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="收銀機狀態" controlName="ECR_Status" [options]="ECR_Status_Option" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.ECR_Status" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number label="每期電子發票預設配號數量" controlName="ECR_GUI_PeriodQty"
            [control]="queryForm.controls.ECR_GUI_PeriodQty" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number label="電子發票最小安全存量" controlName="ECR_GUI_MinQty"
            [control]="queryForm.controls.ECR_GUI_MinQty" [submitted]="submitted" />
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table tableKey="TLS41050" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
      [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
      [showDelete]="false" [showCheckBox]="false" dataKey="id" [multiSortMeta]="[{ field: 'HOS_No', order: 1 }]"
      [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true" [loading]="loading" [isRowSelectable]="isRowSelectable"></app-table>
  </div>
</div>
