<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="盤點單編號" controlName="inventorySerialNo"
              [control]="queryForm.controls.inventorySerialNo" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="倉別" controlName="warehouseCode" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.warehouseCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌編號" controlName="brandCode" [options]="brandCodeOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.brandCode" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="盤點基準日期"
              [startControl]="queryForm.controls.inventoryDateFrom" [endControl]="queryForm.controls.inventoryDateTo"
              [submitted]="submitted"></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="盤點單狀態" controlName="storageInventoryStatus" [options]="storageInventoryStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.storageInventoryStatus"
              [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-radiobutton label="顯示差異" controlName="showDifference" [control]="queryForm.controls.showDifference"
              [options]="showDifferenceOptions" [submitted]="submitted"></app-radiobutton>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table tableKey="TLS53030" [data]="data" [columns]="columns" dataKey="ID"
    [multiSortMeta]="[{ field: 'ID', order: 1 }]" [totalRecords]="totalRecords" [lazy]="true" [loading]="loading"
    [showManage]="true" [showDetail]="false" [showEdit]="false" [showDelete]="false"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [addButton]="addButton"></app-table>
</div>
