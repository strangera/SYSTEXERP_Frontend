<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
</div>  
<div class="card">
  <app-table-report tableKey="tls31080" [lastQueryBody]="historyRequestBody" [data]="data" [columns]="columns" [columnGroup]="columnGroup"
    [totalRecords]="totalRecords" [showDelete]="false" [showManage]="false" [showReportMode]="false"
    [queryFunction]="tls31080Service.queryTLS31080Detail.bind(tls31080Service)"
    [footerData]="footershowTotal" [footerPercentData]="footershowPercent">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="單型態之營業報表.PDF" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(false)" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
        <p-button styleClass="p-2" label="單型態之營業報表.XLSX" [loading]="btnLoading" icon="pi pi-file"
          (click)="onReport(true)" [disabled]="data.length === 0" [loading]="btnLoading"></p-button>
      </div>
    </header>
  </app-table-report>
</div>
