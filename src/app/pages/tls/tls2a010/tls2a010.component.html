<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="銷售日期"
              [control]="queryForm.controls.TXN_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="樓層"
              controlName="FLOOR_NO"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.FLOOR_NO"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="收銀機號"
              [startControl]="queryForm.controls.ECR_No_Start"
              [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="付款別"
              controlName="PAY_NO"
              [options]="paymentToolOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.PAY_NO"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="building_no"
              [options]="buildingNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.building_no"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
      </form>
      <div>
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button
            btnType="query"
            (onClick)="onSubmitQuery(queryForm)"
            [loading]="loading"
          ></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table
    dataKey="id"
    [data]="data"
    [columns]="columns"
    (edit)="onEdit($event)"
    [showCheckBox]="true"
    (selectionChange)="selectedItems = $event"
    [selectedItems]="selectedItems"
    [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]"
    [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
    [lazy]="true"
    [loading]="loading"
    [showPaginator]="true"
    [showReportMode]="true"
  ></app-table>
</div>
