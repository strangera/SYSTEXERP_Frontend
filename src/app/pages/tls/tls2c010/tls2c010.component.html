<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="銷售日期" calendarType="dateOne"
            [control]="queryForm.controls.TXN_Date" [submitted]="submitted"></app-calendar>
        </div>
        <div class="my-3">
          <p>最近關帳日期：{{closeDate}}</p>
          <p>借方支付工具除信用卡外拋實收</p>
        </div>
        <div class="justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3" style="display: flex;">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="flex justify-content-end gap-2">
    <p-button label="匯出excel" severity="success" [icon]="'fa-regular fa-file-lines'" (click)="onExportExcel()"
      [disabled]="!hasPermission('70')" [loading]="exportBtnLoding" />
    <p-button label="列印PDF" severity="info" [icon]="'fa-regular fa-file-pdf'" (click)="onExportPdf()"
      [disabled]="!hasPermission('60')" [loading]="pdfBtnLoding" />
  </div>

  <!-- YY -->
  <div class="col-12 pb-0">
    <span>開立業主發票(拋傳票)</span>
    <div class="table-with-label">
      <div class="table-label">借方</div>
      <app-table tableKey="yy_up" [data]="data_yy_up" [columns]="columns_yy_up" [loading]="loading" [showDelete]="false"
        [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>
  <div class="col-12 pt-0">
    <div class="table-with-label">
      <div class="table-label">貸方</div>
      <app-table tableKey="yy_down" [data]="data_yy_down" [columns]="columns_yy_down" [loading]="loading"
        [showDelete]="false" [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>

  <!-- NY -->
  <div class="col-12 pb-0 mt-4">
    <span>非開立業主發票(拋傳票)</span>
    <div class="table-with-label">
      <div class="table-label">借方</div>
      <app-table tableKey="ny_up" [data]="data_ny_up" [columns]="columns_ny_up" [loading]="loading" [showDelete]="false"
        [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>
  <div class="col-12 pt-0">
    <div class="table-with-label">
      <div class="table-label">貸方</div>
      <app-table tableKey="ny_down" [data]="data_ny_down" [columns]="columns_ny_down" [loading]="loading"
        [showDelete]="false" [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>

  <!-- NN -->
  <div class="col-12 pb-0 mt-4">
    <span>非開立業主發票及收現(不拋傳票)</span>
    <div class="table-with-label">
      <div class="table-label">借方</div>
      <app-table tableKey="nn_up" [data]="data_nn_up" [columns]="columns_nn_up" [loading]="loading" [showDelete]="false"
        [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>
  <div class="col-12 pt-0">
    <div class="table-with-label">
      <div class="table-label">貸方</div>
      <app-table tableKey="nn_down" [data]="data_nn_down" [columns]="columns_nn_down" [loading]="loading"
        [showDelete]="false" [showManage]="false" [showReportMode]="false" [showPaginator]="false" [showCaption]="false"
        [showSort]="false"></app-table>
    </div>
  </div>
</div>
