<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm">
      <div class="grid p-fluid">
        <div class="flex flex-wrap col-12 md:col-8">
          <app-input-text class="col-12 md:col-6" label="通告編號" controlName="NOT_No" [control]="dataForm.controls.NOT_No"
            [submitted]="submitted" />
          <app-calendar class="col-12 md:col-6 lg:col-6" calendarType="dateOne" label="建立日期" controlName="NOT_Date"
            [control]="dataForm.controls.NOT_Date" [submitted]="submitted" />
          <app-calendar class="col-12 md:col-6 lg:col-6" calendarType="dateTimeOne" label="有效開始日期時間"
            controlName="NOT_BegDate" [control]="dataForm.controls.NOT_BegDate" [submitted]="submitted" />
          <app-calendar class="col-12 md:col-6 lg:col-6" calendarType="dateTimeOne" label="有效結束日期時間"
            controlName="NOT_EndDate" [control]="dataForm.controls.NOT_EndDate" [submitted]="submitted" />
          <app-dropdown class="col-12 md:col-6 lg:col-6" label="狀態" controlName="NOT_Status"
            [options]="NOT_Status_Options" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.NOT_Status" [submitted]="submitted" [filter]="false" />
          <app-input-number class="col-12 md:col-6 lg:col-6" [useGrouping]="false" label="優先順序"
            controlName="NOT_Priority" [control]="dataForm.controls.NOT_Priority" [submitted]="submitted" />
          <app-input-number class="col-12 md:col-6 lg:col-6" label="媒體檔播放秒數" controlName="NOT_PlayTime"
            [control]="dataForm.controls.NOT_PlayTime" [submitted]="submitted" [useGrouping]="false" />
          <app-dropdown class="col-12 md:col-6 lg:col-6" label="是否限制播放條件" controlName="NOT_DtlLimit"
            [options]="NOT_DtlLimit_Options" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.NOT_DtlLimit" [submitted]="submitted" [filter]="false" />
        </div>
        <div class="flex flex-column col-12 md:col-4">
          <div class="col-12">
            <label for="file">媒體檔案名稱</label>
            <p-fileUpload #fileUpload [multiple]="false" accept=".bmp,.jpg,.wmv,.avi,.mpeg,.mp4" maxFileSize="100000000"
              mode="advanced" [showUploadButton]="false" [disabled]="isFormReadable" chooseLabel="選擇檔案"
              [showCancelButton]="false" [disabled]="dataForm.controls.NOT_Status.value === '1' || this.isFormReadable">
              <ng-template pTemplate="content" let-files let-removeFileCallback="removeFileCallback">
                <div *ngIf="mediaItems().length > 0; else noURL"
                  class="flex align-items-center justify-content-between gap-2">
                  <i class="pi pi-file text-blue-600 text-xl flex-shrink-0"></i>
                  <p-button label="{{ mediaItems()[0].name }}" [link]="true" (click)="visible.set(true)"
                    [ngClass]="{ 'flex-1': true, 'overflow-hidden': true }"
                    [ngStyle]="{ 'text-overflow': 'ellipsis', 'white-space': 'nowrap' }">
                  </p-button>
                </div>
                <ng-template #noURL>
                  <div class="p-3">查無圖片</div>
                </ng-template>
              </ng-template>
              <ng-template pTemplate="file"></ng-template>
            </p-fileUpload>
          </div>
          <app-input-textarea class="col-12" label="備註" controlName="NOT_Note" [control]="dataForm.controls.NOT_Note"
            [submitted]="submitted" styleClass="h-10rem" />
        </div>
        <app-table-edit *ngIf="dataForm.controls.NOT_Status.value !== '1'" title="廣告資訊設定" tableKey="TLS43010Detail"
          [data]="data" class="col-12" [data]="data" [columns]="columns" (dataChange)="data = $event"
          [disabled]="dataForm.controls.NOT_Status.value === '1' || isFormReadable">
        </app-table-edit>
      </div>
    </form>
  </p-panel>
</div>
<p-galleria [value]="mediaItems()" [(visible)]="visible" [containerStyle]="{ 'max-width': '850px' }" [circular]="true"
  [fullScreen]="true" [showThumbnails]="false" [autoPlay]="true">
  <ng-template pTemplate="item" let-item>
    <ng-container *ngIf="item.type === 'image'">
      <img [src]="item.url" alt="Image" style="width: 100%; display: block;" />
    </ng-container>
    <ng-container *ngIf="item.type === 'video'">
      <video [src]="item.url" controls style="width: 100%; display: block;">
        您的瀏覽器不支援影片標籤。
      </video>
    </ng-container>
  </ng-template>
</p-galleria>
