<p-table #dt [columns]="columns" [value]="virtualData" [scrollable]="true" [dataKey]="dataKey" scrollHeight="700px"
  sortMode="multiple" (onSort)="onSort($event)" [customSort]="false" [resetPageOnSort]="false" [rowTrackBy]="trackByFn"
  styleClass="p-datatable-sm p-datatable-gridlines" [lazy]="true" [virtualScrollItemSize]="46" [virtualScrollDelay]="0"
  [virtualScrollOptions]="{ inline: true, trackBy: trackByFn, autoSize: true, onScroll: onScroll }" [loading]="loading">

  <ng-template pTemplate="caption">
    <app-table-caption [data]="data" [columns]="columns" (columnsEvent)="columns = $event" [dataKey]="dataKey"
      [selectedColumns]="columns" [tableKey]="tableKey" [showDelete]="false" [showPage]="false"
      [totalRecords]="totalRecords" [PrintRemark]="true">
    </app-table-caption>
  </ng-template>

  <ng-template pTemplate="header" let-columns>
    <tr>
      <th class="w-1rem text-center">序號</th>
      <th *ngFor="let col of columns" [pSortableColumn]="col.field" class="text-center wrap-header"
        style="min-width: 55px">
        {{ col.header }}
        <p-sortIcon *ngIf="data.length" [field]="col.field" />
      </th>
      <th class="w-1rem text-center" alignFrozen="right" pFrozenColumn [frozen]="true">管理</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns">
    <tr [style.height.px]="46" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
      <td class="text-center">{{ rowIndex + 1 }}</td>

      <td *ngFor="let col of columns" [ngStyle]="{ 'text-align': col.align || 'center' }">
        <ng-container *ngIf="col.field === 'ECR_SchStatus'">
          <p-tag [value]="getFormattedValue(col, rowData[col.field], rowIndex, rowData)"
            [severity]="rowData.ECR_SchStatus === 'A' ? 'success' : (rowData.ECR_SchStatus === 'C' ? 'secondary' : 'info')">
          </p-tag>
        </ng-container>

        <ng-container *ngIf="['ECR_FLD_ID', 'ECR_FLD_OrgVal_Display', 'ECR_FLD_NewVal_Display'].includes(col.field)">
          <div class="flex align-items-center justify-content-center gap-1">
            <ng-container *ngIf="col.field === 'ECR_FLD_ID'">
              <span class="px-2 py-1 border-round text-sm font-semibold"
                [ngClass]="getFieldConfig(rowData['ECR_FLD_ID']).class">
                <i class="pi mr-1" [ngClass]="getFieldConfig(rowData['ECR_FLD_ID']).icon"></i>
                {{ getFieldConfig(rowData['ECR_FLD_ID']).label }}
              </span>
            </ng-container>
            <span *ngIf="col.field !== 'ECR_FLD_ID'"
              [class]="col.field === 'ECR_FLD_NewVal_Display' ? 'font-semibold text-blue-600' : 'text-600'">
              {{ rowData[col.field] }}
            </span>
          </div>
        </ng-container>

        <ng-container
          *ngIf="!['ECR_SchStatus', 'ECR_FLD_ID', 'ECR_FLD_OrgVal_Display', 'ECR_FLD_NewVal_Display'].includes(col.field)">
          {{ getFormattedValue(col, rowData[col.field], rowIndex, rowData) }}
        </ng-container>
      </td>

      <td class="no-wrap icon-button text-center" alignFrozen="right" pFrozenColumn [frozen]="true">
        <div class="flex justify-content-center gap-2">
          <p-button [text]="true" [outlined]="true" pTooltip="編輯" tooltipPosition="top" icon="pi pi-pencil"
            (click)="edit.emit(rowData)" [disabled]="editDisabled(rowData) || !hasPermission('30')" />
          <p-button pTooltip="查看" tooltipPosition="top" icon="pi pi-eye" (click)="detail.emit(rowData)"
            [disabled]="!hasPermission('10')" />
        </div>
      </td>
    </tr>

    <ng-container *ngIf="_loading && data.length < totalRecords && rowIndex === data.length - 1">
      <tr *ngFor="let i of [0, 1, 2, 3]" style="height: 46px">
        <td pFrozenColumn><p-skeleton /></td>
        <td *ngFor="let col of columns"><p-skeleton /></td>
        <td alignFrozen="right" pFrozenColumn [frozen]="true"><p-skeleton /></td>
      </tr>
    </ng-container>
  </ng-template>

  <ng-template pTemplate="summary">
    <div class="flex align-items-center justify-content-end p-2">
      <span [pTooltip]="'已載入筆數 ' + data.length">總筆數: {{ totalRecords }} 筆</span>
      <p-button icon="pi pi-arrow-up" (click)="dt.scrollTo({ top: 0, behavior: 'smooth' })"
        styleClass="p-button-text p-button-sm ml-2" pTooltip="滾動到頂部" />
    </div>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr *ngIf="hasSearched">
      <td [attr.colspan]="2 + columns.length">
        <div class="flex justify-content-center align-items-center p-5 font-bold text-xl text-500">
          <i class="pi pi-search mr-2"></i> 查無資料
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
