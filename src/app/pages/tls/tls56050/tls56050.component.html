<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 移入/出編號 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="倉別請領單編號" controlName="MVM_No" [control]="queryForm.controls.MVM_No"
              [submitted]="submitted"></app-input-text>
          </div>
          <!-- 移轉狀態 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="倉別調撥單狀態" controlName="MVM_StatusList" [options]="issuanceNoteStatusOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.MVM_StatusList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 國際條碼/商品管理編號/廠商貨號 -->
          <app-product-autocomplete class="col-12" [control]="queryForm.controls.queryNo" [submitted]="submitted" />
          <!-- 品牌代碼 -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="品牌代碼/名稱" controlName="LOGO_NoList" [options]="brandOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.LOGO_NoList" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 調出倉別 (對應SYS_StoreNo) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="調出倉別" controlName="OUT_HOS_NoList" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OUT_HOS_NoList"
              [submitted]="submitted"></app-multi-select>
          </div>
          <!-- 調入倉別 (對應MVM_MoveStoreNo) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="調入倉別" controlName="IN_HOS_NoList" [options]="warehouseOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.IN_HOS_NoList"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <!-- 申請人員 (對應CRT_USR_No) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="申請人編號/名稱" controlName="APPLY_USR" [options]="userOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.APPLY_USR" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 移轉日期 (申請日期) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick calendarType="dateRange" label="申請日期"
              [startControl]="queryForm.controls.APPLY_Date_Start" [endControl]="queryForm.controls.APPLY_Date_End"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
        </div>
        <div class="grid p-fluid">
          <!-- 審核人員 (對應UPD_USR_No) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="審核人編號/名稱" controlName="APRV_USR" [options]="userOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.APRV_USR" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- 移入驗收日期/移出確認日期 (審核日期) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick calendarType="dateRange" label="審核日期"
              [startControl]="queryForm.controls.APRV_Date_Start" [endControl]="queryForm.controls.APRV_Date_End"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
        </div>
        <div class="grid p-fluid">
          <!-- 發貨人 (對應MVM_SenderNo) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="發貨人編號/名稱" controlName="OUTGODS_USR" [options]="userOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.OUTGODS_USR" [submitted]="submitted"></app-dropdown>
          </div>
          <!-- (發貨日期) -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick calendarType="dateRange" label="發貨日期"
              [startControl]="queryForm.controls.OUTGODS_Date_Start" [endControl]="queryForm.controls.OUTGODS_Date_End"
              [submitted]="submitted"></app-calendar-range-quick>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table-report dataKey="MVM_No" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    (detail)="onDetail($event)" [totalRecords]="totalRecords" [loading]="loading" [showDelete]="false"
    [editDisabled]="editDisabled" [lastQueryBody]="lastQuery"
    [queryFunction]="tls52010Service.queryTLS52010.bind(tls52010Service)"></app-table-report>
</div>
