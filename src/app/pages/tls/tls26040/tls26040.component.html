<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <!-- 預售日期(起訖) -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="預售日期" calendarType="dateRange"
            [startControl]="queryForm.controls.preOrderDateFrom" [endControl]="queryForm.controls.preOrderDateTo"
            [submitted]="submitted"></app-calendar-range>
          <!-- 結帳日期(起訖) -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="結帳日期" calendarType="dateRange"
            [startControl]="queryForm.controls.settlementDateFrom" [endControl]="queryForm.controls.settlementDateTo"
            [submitted]="submitted"></app-calendar-range>
          <!-- 收銀機號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀機號" controlName="receivingMachineNo"
            [control]="queryForm.controls.receivingMachineNo" [submitted]="submitted"></app-input-text>
          <!-- 專櫃編號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="counterCode"
            [control]="queryForm.controls.counterCode" [submitted]="submitted"></app-input-text>
          <!-- 批號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="批號" controlName="batchNo"
            [control]="queryForm.controls.batchNo" [submitted]="submitted"></app-input-text>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS26040" dataKey="ID" [data]="data" [columns]="columns" [selectedItems]="selectedItems"
    (selectionChange)="selectedItems = $event" [multiSortMeta]="[{ field: 'ID', order: 1 }]"
    [totalRecords]="totalRecords" (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [loading]="loading">
  </app-table>
</div>
