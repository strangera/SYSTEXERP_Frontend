<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="訪談日期" [startControl]="queryForm.controls.contact_Date_Start"
              [endControl]="queryForm.controls.contact_Date_End" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="訪談人員代碼/名稱" controlName="contact_USR_No" [options]="contact_USR_Option"
              optionLabel="Name" optionValue="No" [control]="queryForm.controls.contact_USR_No"
              [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button label="意願報表" (click)="onWillingClick(queryForm)"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card" *ngIf="activeReport === 'query'">
  <app-report-table-group [columns]="intervew_columns" [data]="interview_data" [enableGrouping]="false"
    [reportTitle]="'專櫃訪談紀錄追蹤表'" [currentPage]="1" [dateStart]="'contact_Date_Start'" [dateEnd]="'contact_Date_End'"
    [showTotalOnly]="false" [defaultMergedView]="true">
  </app-report-table-group>
</div>

<div class="card" *ngIf="activeReport === 'willing'">
  <app-report-table-group [columns]="willing_columns" [data]="willing_data" [enableGrouping]="false"
    [subtotalFields]="['All_Counts']" [reportTitle]="'意願報表'" [currentPage]="1" [dateStart]="'contact_Date_Start'"
    [dateEnd]="'contact_Date_End'" [showTotalOnly]="false" [defaultMergedView]="true">
  </app-report-table-group>
</div>
