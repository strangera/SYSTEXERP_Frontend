<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="訪談日期"
            [startControl]="queryForm.controls.contact_DateStart" [endControl]="queryForm.controls.contact_DateEnd"
            [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="訪談人員代碼/名稱" controlName="contact_USR_Name" [options]="contact_USR_Option" optionLabel="Label"
                optionValue="No" [control]="queryForm.controls.contact_USR_Name" [submitted]="submitted"></app-dropdown>
          </div>
        </div>
        <!-- <div> -->
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-13">
    <app-table
      tableKey="TLS12070"
      [data]="data"
      [columns]="columns"
      (edit)="onEdit($event)"
      (detail)="onDetail($event)"
      (delete)="onDelete($event)"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showCheckBox]="true"
      dataKey="id"
      [multiSortMeta]="[{ field: 'contact_USR_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)"
      [lazy]="true"
      [loading]="loading"
    ></app-table>
    
  </div>
  <app-report-table-group [columns]="columns" [data]="data"
    [subtotalFields]="['contact_USR_Name']" [enableGrouping]="false"
    [reportTitle]="'專櫃訪談紀錄追蹤表'" [currentPage]="1" [dateStart]="'CreatedDateStart'" [dateEnd]="'CreatedDateEnd'" [showTotalOnly]="false"
    [defaultMergedView]="true">
  </app-report-table-group>
</div>
