<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onQueryClick(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick
              label="訪談日期"
              [startControl]="queryForm.controls.contact_Date_Start"
              [endControl]="queryForm.controls.contact_Date_End"
              [submitted]="submitted"
            />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="訪談人員代碼/名稱"
              controlName="contact_USR_No"
              [options]="contact_USR_Option"
              optionLabel="Label"
              optionValue="No"
              [control]="queryForm.controls.contact_USR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
        </div>
        <!-- <div> -->
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button
            label="意願報表"
            (click)="onWillingClick(queryForm)"
          ></app-button>
          <app-button
            btnType="query"
            [loading]="loading"
            (click)="onQueryClick(queryForm)"
          ></app-button>
        </div>
        <!-- </div> -->
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card" *ngIf="activeReport === 'query'">
  <div class="col-13">
    <h6>專櫃訪談紀錄追蹤表</h6>
    <app-table
      tableKey="TLS12070"
      [data]="interview_data"
      [columns]="intervew_columns"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      (detail)="onDetail1($event)"
      [showCheckBox]="false"
      [showManage]="true"
      [showEdit]="false"
      [showDelete]="false"
      dataKey="contact_USR_No"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [multiSortMeta]="[{ field: 'contact_USR_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="
        onLazyLoadData($event, queryForm); onQueryClick(queryForm)
      "
      [lazy]="true"
      [loading]="loading"
      apiUrl="queryTLS12070_Count"
    ></app-table>
  </div>
</div>

<div class="card" *ngIf="activeReport === 'willing'">
  <div class="col-13">
    <h6>意願報表</h6>
    <app-table
      tableKey="TLS12070"
      [data]="willing_data"
      [columns]="willing_columns"
      [selectedItems]="selectedItems"
      (selectionChange)="selectedItems = $event"
      [showCheckBox]="false"
      [showManage]="false"
      [showDelete]="false"
      dataKey="id"
      [expansionRowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [rows]="30"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]"
      [multiSortMeta]="[{ field: 'contact_USR_No', order: 1 }]"
      [totalRecords]="totalRecords"
      (lazyLoadData)="
        onLazyLoadData($event, queryForm); onWillingClick(queryForm)
      "
      [lazy]="true"
      [loading]="loading"
      apiUrl="queryTLS12070_Summary"
    ></app-table>
  </div>
</div>
