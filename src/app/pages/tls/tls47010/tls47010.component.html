<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>


  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="收銀機號"
              controlName="ECR_No"
              [options]="ECRNoOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.ECR_No"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="專櫃編號"
              controlName="TLT_No"
              [options]="CounterOptions"
              optionLabel="formLabel"
              optionValue="value"
              [control]="queryForm.controls.TLT_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="資料類別"
              controlName="dataType"
              [options]="dataTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.dataType"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text-range
              label="單品資料異動下傳 異動區間"
              [startControl]="queryForm.controls.range_Start"
              [endControl]="queryForm.controls.range_End"
              [submitted]="submitted"
            ></app-input-text-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-query-year-month
              label="發票字軌資料"
              [control]="queryForm.controls.YYYYMM"
              [submitted]="submitted"
              [onlyOddMonths]="true"
            ></app-query-year-month>
          </div> -->
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" (click)="onClearForm()"></app-button>
          <app-button
  label="確定下傳"
  icon="pi pi-cloud-upload"
  (click)="onDownload()"
  severity="primary"
></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
