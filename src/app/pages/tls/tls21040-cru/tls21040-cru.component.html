<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="信用卡 BIN 碼" controlName="CRD_BinCode"
          [control]="dataForm.controls.CRD_BinCode" [submitted]="submitted"></app-input-text>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="發卡銀行代號" controlName="BNK_No" [options]="BNK_NoOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.BNK_No" [submitted]="submitted"></app-dropdown>
        </div>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="信用卡卡別" controlName="CRD_Type" [options]="cardTypeOptions"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.CRD_Type"
          [submitted]="submitted"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="信用卡卡種" controlName="CRD_Kind"
          [options]="cardCategoryOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.CRD_Kind"
          [submitted]="submitted"></app-dropdown>
        <app-calendar-range class="col-12 lg:col-8" startLabel="生效日期" endLabel="終止日期"
          [startControl]="dataForm.controls.Active_Date" [endControl]="dataForm.controls.Disable_Date"
          [submitted]="submitted"></app-calendar-range>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
