<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="銀行代碼" controlName="bankCode"
          [control]="dataForm.controls.bankCode" [submitted]="submitted" />
        <app-input-text class="col-12 md:col-6 lg:col-4" label="銀行名稱" controlName="bankName"
          [control]="dataForm.controls.bankName" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="卡種" controlName="cardType" [options]="cardTypeOptions"
          optionLabel="label" optionValue="value" [control]="dataForm.controls.cardType" [submitted]="submitted" />
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="卡別" controlName="cardCategory"
          [options]="cardCategoryOptions" optionLabel="label" optionValue="value"
          [control]="dataForm.controls.cardCategory" [submitted]="submitted"></app-dropdown>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="第N碼開始取" controlName="ntRetrieve"
          [control]="dataForm.controls.ntRetrieve" [submitted]="submitted"></app-input-number>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="取N碼" controlName="retrieve"
          [control]="dataForm.controls.retrieve" [submitted]="submitted"></app-input-number>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="卡種識別碼" controlName="cardIdentifier"
          [control]="dataForm.controls.cardIdentifier" [submitted]="submitted"></app-input-text>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading"></app-button>
      </div>
    </form>
  </p-panel>
</div>
