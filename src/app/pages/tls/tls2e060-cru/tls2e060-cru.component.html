<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1" />
    <app-button btnType="back" (click)="onCancel()" />
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="調整單號" controlName="adj_no"
          [control]="dataForm.controls.adj_no" [submitted]="submitted"></app-input-text>
        <app-calendar class="col-12 md:col-6 lg:col-4" label="調整日期" controlName="adj_date"
          [control]="dataForm.controls.adj_date" [submitted]="submitted"></app-calendar>
      </div>
      <div class="grid p-fluid">
        <app-calendar calendarType="dateMonthOne" class="col-12 md:col-6 lg:col-4" label="結帳年月" controlName="sam_yyymm"
          [control]="dataForm.controls.sam_yyymm" [submitted]="submitted"></app-calendar>
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="專櫃編號" controlName="tlt_no"
          [control]="dataForm.controls.tlt_no" [options]="tlt_noOptions" optionLabel="label" optionValue="tlt_no"
          [submitted]="submitted" (valueChange)="onTltNoChange($event)"></app-dropdown>
      </div>
      <div class="grid p-fluid">
        <app-input-text class="col-12 md:col-6 lg:col-4" label="契約編號" controlName="contract_no"
          [control]="dataForm.controls.contract_no" [submitted]="submitted"></app-input-text>
        <div class="col-12 md:col-6 lg:col-4 flex gap-2">
          <app-dropdown class="flex-1" label="結帳方式" controlName="money_type"
            [control]="dataForm.controls.money_type" [options]="money_typeOptions" optionLabel="label"
            optionValue="value" [submitted]="submitted"></app-dropdown>
          <app-dropdown class="flex-1" label="帳次" controlName="sam_termno"
            [control]="dataForm.controls.sam_termno" [options]="sam_termnoOptions" optionLabel="label"
            optionValue="value" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-4" label="調整稅別" controlName="adj_taxtype"
          [control]="dataForm.controls.adj_taxtype" [options]="adj_taxtypeOptions" optionLabel="label"
          optionValue="value" [submitted]="submitted"></app-dropdown>
        <app-input-number class="col-12 md:col-6 lg:col-4" label="調整金額" controlName="adj_amount"
          [control]="dataForm.controls.adj_amount" [submitted]="submitted"></app-input-number>
      </div>
      <div class="grid p-fluid">
        <app-input-textarea class="col-12 md:col-8" label="備註" controlName="remarks"
          [control]="dataForm.controls.remarks" [submitted]="submitted"></app-input-textarea>
      </div>
      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
