<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-dropdown class="col-12 md:col-6 lg:col-6" label="菜單類別" controlName="SBM_Type" [options]="menuTypeOptions"
          [control]="dataForm.controls.SBM_Type" [submitted]="submitted" [optionLabel]="'label'"
          [optionValue]="'value'"></app-dropdown>
        <app-dropdown class="col-12 md:col-6 lg:col-6" label="專櫃編號/名稱" controlName="TLT_No" [options]="tltNoOptions"
          [control]="dataForm.controls.TLT_No" [submitted]="submitted" [optionLabel]="'label'" [optionValue]="'value'"
          (valueChange)="loadPLU_MagNoOptions($event)"></app-dropdown>
        <app-calendar class="col-12 md:col-6 lg:col-6" label="有效起始日期" calendarType="dateOne"
          [control]="dataForm.controls.SBM_BegDate" [submitted]="submitted"></app-calendar>
        <app-calendar class="col-12 md:col-6 lg:col-6" label="有效結束日期" calendarType="dateOne"
          [control]="dataForm.controls.SBM_EndDate" [submitted]="submitted"></app-calendar>
      </div>

      <!-- 明細 -->
      <app-table class="col-12" tableKey="TLS42020Detail" dataKey="ID" [columns]="columns" [data]="data"
        [showEdit]="false" [showDetail]="false" [showCheckBox]="true" [showInsert]="true" [showRowEdit]="true"
        (delete)="onDelete($event)" (selectionChange)="selectedRows = $event" [selectedItems]="selectedRows"
        [showCaption]="!isFormReadable" [showManage]="!isFormReadable" [showCheckBox]="!isFormReadable"
        [insertRowData]="true" (dataChange)="data = $event" [showReportMode]="false"
        (fieldChange)="onFieldChange($event)" [showFilter]="false"></app-table>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>

  </p-panel>
</div>
