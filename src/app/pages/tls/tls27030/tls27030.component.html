<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="上傳檔案" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-file-upload #fileUpload1 label="[聯合]請款檔" class="col-12" name="NCML" accept=".dat" [multiple]="true"
              chooseLabel="選擇 DAT 檔案" uploadLabel="上傳" cancelLabel="清除" [auto]="false" [customUpload]="true"
              mode="advanced" (select)="files1 = $event.files" [loading]="loading"
              emptyMessage="拖曳檔案到此處或點擊「選擇 DAT 檔案」按鈕。" [disabled]="!hasPermission(Actions.Upload)"
              (uploadHandler)="handleCustomUpload($event,'NCML')"></app-file-upload>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-file-upload #fileUpload2 label="[中信]請款檔" class="col-12" name="CTBC" accept=".txt" [multiple]="true"
              chooseLabel="選擇 TXT 檔案" uploadLabel="上傳" cancelLabel="清除" [auto]="false" [customUpload]="true"
              mode="advanced" (select)="files2 = $event.files" [loading]="loading"
              emptyMessage="拖曳檔案到此處或點擊「選擇 TXT 檔案」按鈕。" [disabled]="!hasPermission(Actions.Upload)"
              (uploadHandler)="handleCustomUpload($event,'CTBC')"></app-file-upload>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-file-upload #fileUpload3 label="[中信-停車場]請款檔" class="col-12" name="CTBCPrk" accept=".xls,.xlsx"
              [multiple]="true" chooseLabel="選擇 XLS 或 XLSX 檔案" uploadLabel="上傳" cancelLabel="清除" [auto]="false"
              [customUpload]="true" mode="advanced" (select)="files3 = $event.files" [loading]="loading"
              emptyMessage="拖曳檔案到此處或點擊「選擇 XLS 或 XLSX 檔案」按鈕。" [disabled]="!hasPermission(Actions.Upload)"
              (uploadHandler)="handleCustomUpload($event,'CTBCPrk')"></app-file-upload>
          </div>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <p-accordion>
    <p-accordionTab header="查詢條件" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-calendar class="col-12 md:col-6 lg:col-4" label="檔案日期" controlName="CTBC_SendTime"
            [control]="queryForm.controls.CTBC_SendTime" [submitted]="submitted"></app-calendar>
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="檔案類型" controlName="CTBC_FileType"
            [options]="CTBC_FileTypeListOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_FileTypeList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="檔案來源" controlName="CTBC_FileSrcList"
            [options]="CTBC_FileSrcListOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_FileSrcList" [submitted]="submitted" />
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="處理狀態" controlName="CTBC_ProcStatusList"
            [options]="CTBC_ProcStatusListOptions" optionLabel="label" optionValue="value"
            [control]="queryForm.controls.CTBC_ProcStatusList" [submitted]="submitted" />
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report dataKey="id" [data]="data" [columns]="columns" [showEdit]="false" [showDetail]="false"
    [showManage]="false" [totalRecords]="totalRecords" [loading]="loading" [showDelete]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls27030Service.queryTLS27030.bind(tls27030Service)"></app-table-report>
</div>
