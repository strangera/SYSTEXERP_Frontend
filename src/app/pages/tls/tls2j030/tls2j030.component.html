<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="cruForm" id="cruForm" (ngSubmit)="onSubmit(cruForm)">
                        <ng-container formArrayName="items">
                            <ng-container *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                                <div class="grid p-fluid">
                                    <div class="col-6 md:col-4 lg:col-4">
                                        <app-dropdown label="收銀機型態" controlName="CashRegisterType"
                                            [options]="CashRegisterTypeItems" optionLabel="label" optionValue="value"
                                            [control]="getFormControl(i, 'CashRegisterType')" [submitted]="submitted">
                                        </app-dropdown>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-calendar calendarType="dateOne" label="銷售日期"
                                            [control]="getFormControl(i, 'onedatedd')" [submitted]="submitted">
                                        </app-calendar>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number [useGrouping]="false" label="收銀機代號" controlName="registerID"
                                            [control]="getFormControl(i, 'registerID')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                </div>
                                <div class="grid p-fluid">
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number [useGrouping]="false" label="交易流水號"
                                            controlName="transactionID" [control]="getFormControl(i, 'transactionID')"
                                            [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number [useGrouping]="false" label="專櫃編號" controlName="counterID"
                                            [control]="getFormControl(i, 'counterID')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number-range [useGrouping]="false" label="二聯發票號碼"
                                            [startControl]="getFormControl(i, 'twoInvoiceStart')"
                                            [endControl]="getFormControl(i, 'twoInvoiceEnd')" [submitted]="submitted">
                                        </app-input-number-range>
                                    </div>
                                </div>
                                <div class="grid p-fluid">
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number label="應稅金額" controlName="taxMoney"
                                            [control]="getFormControl(i, 'taxMoney')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                    <div class="col-12 md:col-6 lg:col-4">
                                        <app-input-number label="免稅金額" controlName="noTaxMoney"
                                            [control]="getFormControl(i, 'noTaxMoney')" [submitted]="submitted">
                                        </app-input-number>
                                    </div>
                                </div>
                                <div class="grid pt-3" style="justify-content: flex-end;">
                                    <div style="margin-right: 5px;padding: 3px;">
                                        <p-button (click)="onRemoveItem(i)" label="删除" icon="pi pi-trash"
                                            severity="danger"></p-button>
                                    </div>
                                </div>
                                <hr>
                            </ng-container>
                        </ng-container>
                        <div class="pt-1">
                            <app-button-dynamicallyadd (click)="onAddItem()"></app-button-dynamicallyadd>
                        </div>
                        <div class="grid pt-3" style="justify-content: flex-end;">
                            <div style="margin-right: 5px;padding: 3px;">
                                <p-button (click)="submitForm(cruForm)" label="確認" icon="pi pi-check"
                                    severity="info"></p-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
    </div>
</div>
