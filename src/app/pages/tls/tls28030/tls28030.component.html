<div class="card">
  <div class="flex align-items-center gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="入帳日"
              [startControl]="queryForm.controls.TXN_Date_S"
              [endControl]="queryForm.controls.TXN_Date_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range
              label="繳袋日期"
              [startControl]="queryForm.controls.Bak_Date_S"
              [endControl]="queryForm.controls.Bak_Date_E"
              [submitted]="submitted"
            ></app-calendar-range>
          </div>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="收銀機號"
            controlName="ECR_No"
            optionLabel="label"
            optionValue="value"
            [options]="ECR_NoOptions$ | async"
            [control]="queryForm.controls.ECR_No"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="專櫃編號"
            controlName="TLT_No"
            optionLabel="label"
            optionValue="value"
            [options]="TLT_NoOptions$ | async"
            [control]="queryForm.controls.TLT_No"
          ></app-dropdown>

          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="館別"
            [options]="buildingOptions$ | async"
            optionLabel="Name"
            optionValue="No"
            controlName="ECR_Group"
            [control]="queryForm.controls.ECR_Group"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="樓層"
            [options]="floorOptions$ | async"
            optionLabel="Name"
            optionValue="No"
            controlName="ECR_LocNo"
            [control]="queryForm.controls.ECR_LocNo"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="機台屬性"
            [options]="machineTypeOptions"
            optionLabel="label"
            optionValue="value"
            controlName="ECR_Type"
            [control]="queryForm.controls.ECR_Type"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="表別"
            [options]="bagTypeOptions"
            optionLabel="label"
            optionValue="value"
            controlName="BAG_Type"
            [control]="queryForm.controls.BAG_Type"
          ></app-dropdown>
          <app-dropdown
            class="col-12 md:col-6 lg:col-4"
            label="狀態"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            controlName="Status"
            [control]="queryForm.controls.Status"
          ></app-dropdown>

          <div class="col-12 md:col-6 lg:col-4 flex align-items-center gap-2">
            <p-checkbox
              label="只顯示虛擬機台"
              [binary]="true"
              formControlName="IsVirtualOnly"
            ></p-checkbox>
          </div>
        </div>

        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table-report
    [exportContext]="{ apiUrl: 'queryTLS28030' }"
    tableKey="tls28030"
    [data]="data"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showDelete]="false"
    [showManage]="false"
    [lazy]="false"
    [lastQueryBody]="lastQueryBody"
    [queryFunction]="tls28030Service.queryTLS28030.bind(tls28030Service)"
  ></app-table-report>
</div>
