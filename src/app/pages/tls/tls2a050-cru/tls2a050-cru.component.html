<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <div class="card">
    <p-table
      [value]="detailData"
      rowGroupMode="rowspan"
      groupRowsBy="representative.PAY_Name"
      sortField="representative.PAY_Name"
      sortMode="single"
      [tableStyle]="{ 'min-width': '60rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>付款別</th>
          <th>收銀機號</th>
          <th>交易序號</th>
          <th>系統金額</th>
          <th>實收金額</th>
          <th>帳差</th>
        </tr>
      </ng-template>

      <ng-template
        pTemplate="body"
        let-rowData
        let-rowgroup="rowgroup"
        let-rowspan="rowspan"
      >
        <tr>
          <td *ngIf="rowgroup" [attr.rowspan]="rowspan">
            {{ rowData.PAY_Name }}
          </td>
          <td>{{ rowData.ECR_No }}</td>
          <td>{{ rowData.TXN_No }}</td>
          <td>{{ rowData.BOOK_PayAmt | number }}</td>
          <td>{{ rowData.ACT_PayAmt | number }}</td>
          <td>{{ rowData.OVER_PayAmt | number }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
