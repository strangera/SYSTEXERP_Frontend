<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <div class="card">
    <p-table
      [value]="detailData"
      rowGroupMode="rowspan"
      groupRowsBy="PAY_Name"
      sortField="PAY_Name"
      sortMode="single"
      [tableStyle]="{ 'min-width': '60rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>付款別</th>
          <th>收銀機號</th>
          <th>交易序號</th>
          <th>系統金額</th>
          <th>實收金額</th>
          <th>帳差</th>
        </tr>
      </ng-template>

      <ng-template
        pTemplate="body"
        let-row
        let-rowgroup="rowgroup"
        let-rowspan="rowspan"
      >
        <tr
          ngClass="{
            'bg-yellow-100 font-bold': row.isTotal
          }"
        >
          <!-- 付款別，只在群組第一筆出現 (不含合計) -->
          <td *ngIf="rowgroup && !row.isTotal" [attr.rowspan]="rowspan">
            {{ row.PAY_Name }}
          </td>

          <td>{{ row.ECR_No || "" }}</td>
          <td>{{ row.TXN_No || "" }}</td>
          <td>{{ row.BOOK_PayAmt | number }}</td>
          <td>{{ row.ACT_PayAmt | number }}</td>
          <td>{{ row.OVER_PayAmt | number }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
