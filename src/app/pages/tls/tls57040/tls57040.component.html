<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌名稱" controlName="LOGO_No" [options]="brandCodeOptions"
            optionLabel="label" optionValue="value" [control]="queryForm.controls.LOGO_No" [submitted]="submitted">
          </app-dropdown>

          <app-dropdown-table class="col-12 md:col-6 lg:col-4" [control]="queryForm.controls.PLU_MagNo"
            [submitted]="submitted" optionLabel="PLU_MagNo" optionValue="PLU_MagNo" templateLabel="label"
            [suggestions]="suggestions" [fieldsConfig]="fieldsConfig"
            (inputValueChanged)="onAutoCompleteInputChange($event)" (formValueChanged)="onformValueChanged($event)"
            [formGroup]="opForm" [dialogData]="opData" [dialogColumns]="opColumns" [loading]="opLoading"
            [totalRecords]="opTotalRecords">
            <app-input-text class="col-12 md:col-6" label="商品管理編號" controlName="queryNo"
              [control]="opForm.controls.queryNo" />
            <app-input-text class="col-12 md:col-6" label="商品名稱" controlName="PLU_Name"
              [control]="opForm.controls.PLU_Name" />
          </app-dropdown-table>

          <app-input-text class="col-12 md:col-6 lg:col-4" label="國際條碼" controlName="PLU_No"
            [control]="queryForm.controls.PLU_No" [submitted]="submitted">
          </app-input-text>

          <app-input-text class="col-12 md:col-6 lg:col-4" label="廠商貨號" controlName="PLU_OrgPLUNo"
            [control]="queryForm.controls.PLU_OrgPLUNo" [submitted]="submitted">
          </app-input-text>

          <app-dropdown class="col-12 col-6 lg:col-4" label="大分類代碼" controlName="CAT_LNo"
            [control]="queryForm.controls.CAT_LNo" [options]="CAT_LNoOptions" optionLabel="label" optionValue="No" />
          <app-dropdown class="col-12 col-6 lg:col-4" label="中分類代碼" controlName="CAT_MNo"
            [control]="queryForm.controls.CAT_MNo" [options]="CAT_MNoOptions" optionLabel="label" optionValue="No" />
          <app-dropdown class="col-12 col-6 lg:col-4" label="小分類代碼" controlName="CAT_SNo"
            [control]="queryForm.controls.CAT_SNo" [options]="CAT_SNoOptions" optionLabel="label" optionValue="No" />

          <app-input-textarea class="col-12 md:col-8" label="系列" controlName="PLU_Reserve3"
            [control]="queryForm.controls.PLU_Reserve3" [submitted]="submitted">
          </app-input-textarea>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <div class="field-checkbox">
              <p-checkbox formControlName="ShowCurrentQty" binary="true" inputId="ShowCurrentQty"></p-checkbox>
              <label for="ShowCurrentQty" class="ml-2">顯示庫存為零</label>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div class="field-checkbox">
              <p-checkbox formControlName="ShowOrderPrc" binary="true" inputId="ShowOrderPrc"></p-checkbox>
              <label for="ShowOrderPrc" class="ml-2">顯示標準進價</label>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <div class="field-checkbox">
              <p-checkbox formControlName="ShowImage" binary="true" inputId="ShowImage"></p-checkbox>
              <label for="ShowImage" class="ml-2">顯示圖片</label>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-number label="顯示行數" controlName="pageSize" [control]="queryForm.controls.pageSize"
              [submitted]="submitted" [useGrouping]="false"></app-input-number>
          </div>
        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords"
    [multiSortMeta]="[{ field: 'LOGO_No', order: 1 },{ field: 'PLU_MagNo', order: 1 }]"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [showManage]="false" [rowsPerPageOptions]="rowsPerPageOptions" [rows]="rows">
  </app-table>
</div>
