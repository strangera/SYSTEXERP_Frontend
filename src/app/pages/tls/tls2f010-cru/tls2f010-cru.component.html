<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateYearOne" label="結帳年月" controlName="sam_yyymm"
          [control]="dataForm.controls.sam_yyymm" [submitted]="submitted" />
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="專櫃編號/名稱" controlName="tlt_no" [options]="tlt_noOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.tlt_no" [submitted]="submitted"></app-multi-select>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="單據種類" controlName="PUR_GUIType" [options]="invoiceTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.PUR_GUIType" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="發票/收據號碼" controlName="PUR_GUINO" [control]="dataForm.controls.PUR_GUINO"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range calendarType="dateRange" label="單據日期" [startControl]="dataForm.controls.PUR_GUIDate_Start"
            [endControl]="dataForm.controls.PUR_GUIDate_End" [submitted]="submitted"></app-calendar-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="結帳方式" controlName="COMM_MONEY_TYPE" [options]="money_typeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.COMM_MONEY_TYPE"
            [submitted]="submitted"></app-multi-select>
        </div>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateYearOne" label="請款付款年月" controlName="COMM_YM"
          [control]="dataForm.controls.COMM_YM" [submitted]="submitted" />
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="帳次" controlName="sam_termno" [options]="sam_termnoOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.sam_termno" [submitted]="submitted"></app-dropdown>
        </div>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateYearOne" label="申報年月" controlName="DEC_YM"
          [control]="dataForm.controls.DEC_YM" [submitted]="submitted" />

      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="廠商編號/名稱" controlName="ven_no" [options]="ven_noOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ven_no" [submitted]="submitted"></app-dropdown>
        </div>
        <app-multi-select class="col-12 md:col-6 lg:col-4" label="課稅別" controlName="PUR_TaxType"
          [options]="taxTypeOptions" [optionLabel]="'label'" [optionValue]="'value'"
          [control]="dataForm.controls.PUR_TaxType" [submitted]="submitted"></app-multi-select>

        <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="發票總額"
          [startControl]="dataForm.controls.ACP_GUIAmt_Start" [endControl]="dataForm.controls.ACP_GUIAmt_End"
          [submitted]="submitted"></app-input-number-range>

        <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="未稅金額"
          [startControl]="dataForm.controls.ACP_GUINet_Start" [endControl]="dataForm.controls.ACP_GUINet_End"
          [submitted]="submitted"></app-input-number-range>

        <app-input-number-range class="col-12 md:col-6 lg:col-4" [useGrouping]="false" label="稅額"
          [startControl]="dataForm.controls.ACP_GUITax_Start" [endControl]="dataForm.controls.ACP_GUITax_End"
          [submitted]="submitted"></app-input-number-range>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="發票格式" controlName="PUR_GUIPaper" [options]="invoiceFormatOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.PUR_GUIPaper" [submitted]="submitted">
          </app-dropdown>
        </div>
      </div>
      <!-- <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="狀況" controlName="check_statusList" [options]="statusOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.check_statusList"
            [submitted]="submitted"></app-multi-select>
        </div> -->
      <hr />
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range calendarType="dateRange" label="傳送日期" [startControl]="dataForm.controls.COMM_NUM_Start"
            [endControl]="dataForm.controls.COMM_NUM_End" [submitted]="submitted"></app-calendar-range>
        </div>
        <app-input-text class="col-12 md:col-6 lg:col-4" label="建立人員" controlName="CRT_USR_No"
          [control]="dataForm.controls.CRT_USR_No" />
      </div>
      <!-- <hr /> -->
      <!-- <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <p-checkbox label="是否貼現" [binary]="true" controlName="DEDUCT_YN" formControlName="DEDUCT_YN"></p-checkbox>
        </div>
      </div> -->
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar-range calendarType="dateRange" label="建立日期" [startControl]="dataForm.controls.CRT_Date_Start"
            [endControl]="dataForm.controls.CRT_Date_End" [submitted]="submitted"></app-calendar-range>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="樓層" controlName="tlt_floorList" [options]="tlt_floorOptions | async"
            optionLabel="Name" optionValue="No" [control]="dataForm.controls.tlt_floorList"
            [submitted]="submitted"></app-multi-select>
        </div>
      </div>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>
    </form>
  </p-panel>
</div>
