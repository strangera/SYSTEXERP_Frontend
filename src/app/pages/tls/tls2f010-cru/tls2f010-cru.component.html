<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="專櫃編號/名稱" controlName="tlt_no" [options]="tlt_noOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.tlt_no" [submitted]="submitted"></app-multi-select>
        </div>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateYearOne" label="所屬結帳年月" controlName="COMM_YM"
          [control]="dataForm.controls.COMM_YM" [submitted]="submitted" />
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-multi-select label="結帳方式" controlName="COMM_MONEY_TYPE" [options]="money_typeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.COMM_MONEY_TYPE"
            [submitted]="submitted"></app-multi-select>
        </div>
        <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="dateYearOne" label="請款付款年月" controlName="COMM_YM"
          [control]="dataForm.controls.COMM_YM" [submitted]="submitted" />
      </div>
      <br />

      <app-table tableKey="ChangeEdit" class="col-12" [data]="changeEditData" [columns]="columns1"
        dataStatusField="status" [showCaption]="false" [showManage]="false" [showCheckBox]="false"
        [showPaginator]="false" [showReportMode]="false" [showReportMode]="false">
      </app-table>
      <br />

      <app-table tableKey="b" [data]="changeEditData" class="col-12" [columns]="columns2" dataKey="TXN_GUIBegNo"
        [showCaption]="false" [showManage]="false" [showCheckBox]="false" dataStatusField="status" [scrollable]="false"
        [showPaginator]="false" [showReportMode]="false" [loading]="queryLoading">
      </app-table>

      <app-table-edit #detailEdit title="新增單據" tableKey="DetailEdit" class="col-12" [(data)]="detailEditData"
        [columns]="columns3" dataStatusField="status" [tableRequired]="true" [showDelete]="true" [showInsert]="false"
        [canInsert]="true" [showCheckBox]="true" (dataChange)="onDetailEditDataChange($event)"
        (fieldChange)="onDetailFieldChange($event)">
      </app-table-edit>

      <div *ngIf="!isFormReadable" class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
        <app-button btnType="cancel" [form]="dataForm"></app-button>
        <app-button btnType="submit" [loading]="loading" />
      </div>

    </form>
  </p-panel>
</div>
