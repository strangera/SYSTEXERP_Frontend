<p-table #dt [columns]="selectedColumns" [value]="virtualData" [scrollable]="true"
  [scrollHeight]="autoHeight ? undefined : '450px'" sortMode="multiple" (sortFunction)="customSort($event)"
  [customSort]="true" [resetPageOnSort]="false" [selectionMode]="showRadioButton ? 'single' : null"
  [selection]="selectedItem" (selectionChange)="onSingleSelectionChange($event)" [rowTrackBy]="trackByFn"
  [resizableColumns]="true" [reorderableColumns]="true" (onColReorder)="onColReorder($event)"
  styleClass="p-datatable-sm p-datatable-gridlines " [virtualScrollItemSize]="46" [virtualScrollDelay]="0"
  [virtualScrollOptions]="{
    inline: true,
    trackBy: trackByFn,
    autoSize: true,
  }" [loading]="loading">
  <ng-template pTemplate="caption">
    <app-table-caption [data]="data" [columns]="columns" (columnsEvent)="columns = $event"
      [selectedColumns]="selectedColumns" (selectedColumnsEvent)="selectedColumns = $event" [tableKey]="tableKey"
      [showFilter]="false" [showReportMode]="false" [showDelete]="false" [showPage]="false"
      [totalRecords]="dt.totalRecords">
    </app-table-caption>
  </ng-template>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th scope="col" class="w-1rem text-center" pFrozenColumn>序號</th>
      <th scope="col" class="w-1rem text-center" *ngIf="showRadioButton">選取</th>
      <th *ngFor="let col of columns" scope="col" pReorderableColumn pResizableColumn
        [pSortableColumn]="col.sortField ?? col.field" [pSortableColumnDisabled]="col.showSort === false"
        class="text-center wrap-header" style="min-width: 55px">
        {{ col.header }}
        <p-sortIcon *ngIf="col.showSort !== false && data.length" [field]="col.field" />
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns">
    <tr [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex" [style]="{ height: '46px' }">
      <td class="text-center" pFrozenColumn>{{ rowIndex + 1 }}</td>
      <td *ngIf="showRadioButton" class="text-center">
        <p-tableRadioButton [value]="rowData" />
      </td>
      <td *ngFor="let col of columns" [ngStyle]="{
          'text-align': col.align ? col.align : 'center',
          'text-overflow': 'ellipsis',
          'min-width': col.width || '55px',
          width: col.width
        }">
        <span>
          {{ col.format ? col.format(rowData?.[col.field], rowIndex, rowData) : rowData?.[col.field] }}
        </span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="footer" let-columns>
    <tr *ngIf="extraFooterData" class="bg-gray-200">
      <td [attr.colspan]="1 + (showRadioButton ? 1 : 0)" pFrozenColumn></td>
      <td [attr.colspan]="columns.length" style="padding:6px">
        <div style="display:flex;flex-wrap:nowrap;justify-content:flex-end;align-items:center;gap:12px">
          <ng-container *ngFor="let item of getExtraFooterArray(); let last = last">
            <div style="display:inline-flex;align-items:center;gap:8px;min-width:180px;white-space:nowrap;">
              <span style="color:var(--text-secondary);font-size:0.9rem">{{ item.label }} :</span>
              <span class="font-bold">{{ item.value }}</span>
              <span *ngIf="!last"
                style="display:inline-block;width:1px;height:18px;background:var(--surface-border);margin-left:8px"></span>
            </div>
          </ng-container>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="summary">
    <div class="flex align-items-center justify-content-between p-2">
      <div [style.min-width.px]="150" class="flex align-items-center">
        <span *ngIf="showRadioButton && selectedItem" [@fadeInOut] class="block" style="line-height: normal;">
          已選擇 1 筆
        </span>
      </div>
      <div class="flex align-items-center">
        <span [pTooltip]="'已載入筆數 ' + data.length">
          總筆數: {{ totalRecords }} 筆
        </span>
        <p-button icon="pi pi-arrow-up" (click)="dt.scrollTo({ top: 0, behavior: 'smooth'});"
          styleClass="p-button-text p-button-sm ml-2" pTooltip="滾動到頂部" />
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="1 + (showRadioButton ? 1 : 0) + columns.length">
        <div class="flex justify-content-center align-items-center min-h-full p-5 font-bold text-xl text-500">
          <i class="pi pi-search mr-2"></i>
          查無資料
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
