<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range calendarType="dateRange" label="銷售日期" [startControl]="queryForm.controls.saleDateStart"
              [endControl]="queryForm.controls.saleDateEnd" [submitted]="submitted">
            </app-calendar-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="收銀機號" controlName="cashierCode" [control]="queryForm.controls.cashierCode"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="counterCode" [control]="queryForm.controls.counterCode"
              [submitted]="submitted">
            </app-input-text>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="大分類" controlName="businessTypeCode" [options]="businessTypeCodeOptions"
              optionLabel="label" optionValue="value" [control]="queryForm.controls.businessTypeCode"
              [submitted]="submitted">
            </app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="依機台統計" controlName="machineStats" [options]="floorOptions" optionLabel="label"
              optionValue="value" [control]="queryForm.controls.machineStats" [submitted]="submitted">
            </app-dropdown>
          </div>
        </div>
      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
