<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
</div>  
<div class="card">
  <app-table [data]="data" [columns]="columns" [totalRecords]="totalRecords" 
    [showReportMode]="false" [showManage]="false" [showReportMode]="false" [showDetail]="false"
    [multiSortMeta]="[{ field: 'tlt_building', order: 1 }]" [columnGroup]="columnGroup"
    (lazyLoadData)="onLazyLoadData($event, dataForm)" [lazy]="true" [loading]="loading"
    [showManage]="true" [showEdit]="false" [showDelete]="false">
    <header>
      <div class="flex justify-content-end gap-2">
        <p-button styleClass="p-2" label="單大分類之營業報表" icon="pi pi-file"
        (click)="onReport(true)"  [disabled]="data.length === 0"></p-button>
      </div>
    </header>
  </app-table>
</div>
