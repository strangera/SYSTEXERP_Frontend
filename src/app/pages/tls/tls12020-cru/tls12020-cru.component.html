<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form [formGroup]="dataForm" (ngSubmit)="onSubmit()">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="廠商統一編號"
              controlName="vendorUID"
              [options]="vendorUIDOptions"
              optionLabel="VEN_No"
              optionValue="VEN_No"
              [control]="dataForm.controls.vendorUID"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱(中文)"
              controlName="vendorCName"
              [control]="dataForm.controls.vendorCName"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商名稱(英文)"
              controlName="vendorEName"
              [control]="dataForm.controls.vendorEName"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="品牌"
              controlName="brand"
              [control]="dataForm.controls.brand"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="大分類"
              controlName="bus_type"
              [options]="industryCodeOptions"
              optionLabel="Name"
              optionValue="No"
              [control]="dataForm.controls.bus_type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="廠商聯絡人"
              controlName="VEN_Boss"
              [control]="dataForm.controls.VEN_Boss"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯絡人電話(O)"
              controlName="VEN_BossTel"
              [control]="dataForm.controls.VEN_BossTel"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯絡人頭銜"
              controlName="VEN_BossTitle"
              [control]="dataForm.controls.VEN_BossTitle"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯絡人行動電話"
              controlName="VEN_BossMobile"
              [control]="dataForm.controls.VEN_BossMobile"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="聯絡人電子郵件"
              controlName="VEN_BossEmail"
              [control]="dataForm.controls.VEN_BossEmail"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text
              label="公司住址"
              controlName="VEN_Addr"
              [control]="dataForm.controls.VEN_Addr"
              [submitted]="submitted"
            >
              >
            </app-input-text>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="dateOne"
              label="訪談日期"
              [control]="dataForm.controls.contact_Date"
              [submitted]="submitted"
            ></app-calendar>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar
              calendarType="timeOne"
              label="訪談時間(24H)"
              [control]="dataForm.controls.contact_Time"
              [submitted]="submitted"
            ></app-calendar>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="意願等級"
              controlName="willing_level"
              [options]="willinglevelOptions"
              optionLabel="label"
              optionValue="No"
              [control]="dataForm.controls.willing_level"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="館別"
              controlName="building_no"
              [options]="buildingNoOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.building_no"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="接洽樓層"
              controlName="FLOOR_NO"
              [options]="floorOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.FLOOR_NO"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="接洽位置編號"
              controlName="LOCATION_No"
              [options]="LOCATION_Options"
              optionLabel="Name"
              optionValue="No"
              [control]="dataForm.controls.LOCATION_No"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <hr />
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="訪談人員"
              controlName="contact_USR_Name"
              [options]="contact_USR_NameOptions"
              optionLabel="Name"
              optionValue="No"
              [control]="dataForm.controls.contact_USR_Name"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-12">
            <app-input-textarea
              label="洽談重點及交換資料記錄"
              controlName="contact_record"
              [control]="dataForm.controls.contact_record"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            ></app-input-textarea>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-12">
            <app-input-textarea
              label="備註"
              controlName="contact_remarks"
              [control]="dataForm.controls.contact_remarks"
              [style]="{ height: '100px' }"
              [submitted]="submitted"
            ></app-input-textarea>
          </div>
        </div>
        <div
          class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3"
        >
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
