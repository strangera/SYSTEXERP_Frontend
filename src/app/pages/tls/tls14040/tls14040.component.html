<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃編號" controlName="tlt_no" [control]="queryForm.controls.tlt_no"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="保證票型態"
              [options]="ticket_typeOption"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ticket_type"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="票據編號" controlName="ticket_no" [control]="queryForm.controls.ticket_no"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="票據種類"
              [options]="ticket_kindOption"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.ticket_kind"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="保證票金額" controlName="ticket_amount" [control]="queryForm.controls.ticket_amount"
              [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="票據到期日期"
            [control]="queryForm.controls.expiry_date" controlName="expiry_date" [submitted]="submitted" />
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select
              label="票據收票狀態"
              [options]="get_ticket_statusOption"
              optionLabel="label"
              optionValue="value"
              [control]="queryForm.controls.get_ticket_status"
              [submitted]="submitted"
            ></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="繳票日期"
            [control]="queryForm.controls.get_date" controlName="get_date" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="退票日期"
            [control]="queryForm.controls.return_date" controlName="return_date" [submitted]="submitted" />
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar calendarType="dateOne" class="col-12 md:col-6 lg:col-5" label="封存日期"
            [control]="queryForm.controls.close_date" controlName="close_date" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="保證票摘要-合約主檔" controlName="ticket_remarks" [control]="queryForm.controls.ticket_remarks"
              [submitted]="submitted"></app-input-text>
          </div>
        </div>
        
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS14040" [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)"
    [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event" (delete)="onDelete($event)"
    [showCheckBox]="true" dataKey="id" [multiSortMeta]="[{ field: 'tlt_no', order: 1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true"
    [isRowSelectable]="isRowSelectable" [loading]="loading"></app-table>
</div>
