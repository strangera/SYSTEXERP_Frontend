<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <!-- <app-button btnType="create" (click)="onCreate()" label="{{ 'create' | translate }}"></app-button> -->
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="專櫃編號" [options]="tlt_noListOption" optionLabel="Label" optionValue="No"
              [control]="queryForm.controls.tlt_noList" [submitted]="submitted"></app-multi-select>
          </div>
          <!-- <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="專櫃名稱" controlName="tlt_name" [control]="queryForm.controls.tlt_name"
              [submitted]="submitted"></app-input-text>
          </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="位置編號" [options]="locationOption" optionLabel="Name" optionValue="No"
              [control]="queryForm.controls.location_noList" [submitted]="submitted"></app-multi-select>
          </div>
        </div>
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="區域" [options]="areaOption" optionLabel="Name" optionValue="No"
              [control]="queryForm.controls.area_noList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="樓層" [options]="floorOption" optionLabel="Name" optionValue="No"
              [control]="queryForm.controls.tlt_floorList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="大分類代碼/名稱" [options]="bus_typeOption" optionLabel="Label" optionValue="No"
              [control]="queryForm.controls.bus_typeList" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="營運狀況" [options]="tlt_openflagOption" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.tlt_openflagList" [submitted]="submitted"></app-multi-select>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="合約附號_起始" controlName="contract_subno_start"
              [control]="queryForm.controls.contract_subno_start" [submitted]="submitted"></app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="合約附號_終止" controlName="contract_subno_end"
              [control]="queryForm.controls.contract_subno_end" [submitted]="submitted"></app-input-text>
          </div>

        </div>

        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="申請案件狀態" [options]="apply_statusOption" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.apply_statusList" [submitted]="submitted"></app-multi-select>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar-range-quick label="合約期間" [startControl]="queryForm.controls.tlt_bdate"
              [endControl]="queryForm.controls.tlt_edate" [submitted]="submitted" />
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-multi-select label="審核狀態" [options]="approveOption" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.approve_statusList" [submitted]="submitted"></app-multi-select>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-report-table-group [columns]="columns" [data]="data"
    [subtotalFields]="['open_fees','construct_fees','expiration_fees']" [enableGrouping]="false"
    [reportTitle]="'保證票彙總表'" [currentPage]="1" [dateStart]="'SalesDateStart'" [dateEnd]="'SalesDateEnd'" [showTotalOnly]="false"
    [defaultMergedView]="true">
  </app-report-table-group>
</div>
