<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="card">
          <!-- TabMenu -->
          <p-tabMenu
            [model]="items"
            [(activeItem)]="activeItem"
            class="mb-3"
            (activeItemChange)="onTabChange($event)"
          ></p-tabMenu>

          <!-- DataView -->
          <p-dataView [value]="pagedData" [layout]="layout">
            <!-- Header -->
            <ng-template pTemplate="header">
              <div class="w-full">
                <div
                  class="flex justify-content-between align-items-center mb-4 mt-2"
                >
                  <!-- 搜尋框 -->
                  <div class="search-bar-container flex-1">
                    <span class="p-input-icon-left search-bar">
                      <i class="pi pi-search"></i>
                      <input
                        pInputText
                        type="text"
                        name="globalFilter"
                        class="w-full"
                        placeholder="搜尋專櫃編號、名稱、收銀機代號"
                        [(ngModel)]="globalFilter"
                        [ngModelOptions]="{ standalone: true }"
                        (input)="applyFilter()"
                      />
                    </span>
                  </div>

                  <!-- 切換 layout -->
                  <p-dataViewLayoutOptions
                    (layoutChange)="onLayoutChange($event)"
                  ></p-dataViewLayoutOptions>
                </div>

                <!-- 狀態說明 -->
                <div class="status-container mb-2">
                  <span class="status-label">狀態說明：</span>
                  <div class="status-chip">
                    <i class="pi pi-desktop"></i>
                    關機
                  </div>
                  <div class="status-chip logout">
                    <i class="pi pi-sign-out"></i>
                    離線
                  </div>
                  <div class="status-chip success">
                    <i class="pi pi-sync"></i>
                    交易中
                  </div>
                </div>
              </div>
            </ng-template>

            <!-- Grid 模式 -->
            <ng-template pTemplate="grid" let-row>
              <div class="custom-grid">
                <div class="custom-grid-item" *ngFor="let row of pagedData">
                  <div
                    class="p-3 border-1 surface-border surface-card relative"
                  >
                    <!-- 右上角：判斷是否顯示關機 icon 或 EDC chips -->
                    <div class="status-container-grid">
                      <i
                        *ngIf="isShutdown(row)"
                        class="pi pi-desktop shutdown-icon"
                      ></i>

                      <ng-container *ngIf="!isShutdown(row)">
                        <span [ngClass]="getEdcStatusClass(row.EDC_Online1)">
                          <i [ngClass]="getStatusIcon(row.EDC_Online1)"></i>
                          中信
                        </span>
                        <span [ngClass]="getEdcStatusClass(row.EDC_Online2)">
                          <i [ngClass]="getStatusIcon(row.EDC_Online2)"></i>
                          聯信
                        </span>
                      </ng-container>
                    </div>

                    <!-- 主要內容 -->
                    <div class="grid-content">
                      <div class="grid-title">{{ row.ECR_LocNo }}</div>
                      <div class="grid-subtitle">
                        {{ row.TLT_No }} {{ row.TLT_Name }}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>

            <!-- List 模式 -->
            <ng-template pTemplate="list" let-row>
              <div class="grid grid-nogutter">
                <div
                  class="col-12"
                  *ngFor="let row of pagedData; let i = index"
                >
                  <div
                    class="flex flex-row justify-content-between align-items-center p-3 border-bottom-1 surface-border"
                  >
                    <!-- 左側 -->
                    <div class="flex-1">
                      <div>
                        <b>序號：</b>
                        {{ first + i + 1 }}
                      </div>
                      <div>
                        <b>位置編號：</b>
                        {{ row.ECR_LocNo }}
                      </div>
                      <div>
                        <b>專櫃編號：</b>
                        {{ row.TLT_No }}
                      </div>
                      <div>
                        <b>櫃位名稱：</b>
                        {{ row.TLT_Name }}
                      </div>
                    </div>

                    <!-- 右側：判斷是否顯示關機 icon 或 EDC chips -->
                    <div class="status-container-list">
                      <i
                        *ngIf="isShutdown(row)"
                        class="pi pi-desktop shutdown-icon"
                      ></i>

                      <ng-container *ngIf="!isShutdown(row)">
                        <span [ngClass]="getEdcStatusClass(row.EDC_Online1)">
                          <i [ngClass]="getStatusIcon(row.EDC_Online1)"></i>
                          中信
                        </span>
                        <span [ngClass]="getEdcStatusClass(row.EDC_Online2)">
                          <i [ngClass]="getStatusIcon(row.EDC_Online2)"></i>
                          聯信
                        </span>
                      </ng-container>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>
          </p-dataView>

          <!-- 分頁 -->
          <p-paginator
            [rows]="rows"
            [first]="first"
            [totalRecords]="filteredData.length"
            (onPageChange)="onPageChange($event)"
          ></p-paginator>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
