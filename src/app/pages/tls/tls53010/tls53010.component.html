<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="create" (click)="onCreate()" label="新增"></app-button>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

          <!-- 盤點單編號 -->
          <app-input-text class="col-12 md:col-6 lg:col-4" label="盤點單編號" controlName="PST_No"
            [control]="queryForm.controls.PST_No" [submitted]="submitted"></app-input-text>

          <!-- 倉別代碼/名稱 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="倉別代碼/名稱" controlName="HOS_No" [options]="hosOptions"
            [control]="queryForm.controls.HOS_No" [submitted]="submitted"></app-dropdown>

          <!-- 品牌代碼/名稱 -->
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="品牌代碼/名稱" controlName="LOGO_No" [options]="logoOptions"
            [control]="queryForm.controls.LOGO_No" [submitted]="submitted"></app-dropdown>

          <!-- 盤點基準日期（起訖） -->
          <app-calendar-range class="col-12 md:col-6 lg:col-4" label="盤點基準日期" calendarType="dateRange"
            [startControl]="queryForm.controls.PST_Date_B" [endControl]="queryForm.controls.PST_Date_E"
            [submitted]="submitted"></app-calendar-range>

          <!-- 盤點單狀態 -->
          <app-multi-select class="col-12 md:col-6 lg:col-4" label="盤點單狀態" controlName="PST_Status"
            [options]="pstStatusOptions" [control]="queryForm.controls.PST_Status"
            [submitted]="submitted"></app-multi-select>

        </div>
        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <app-table tableKey="TLS53010" dataKey="ID" [data]="data" [columns]="columns" (edit)="onEdit($event)"
    [showDetail]="false" [showDelete]="false" [selectedItems]="selectedItems" (selectionChange)="selectedItems = $event"
    [multiSortMeta]="[{ field: 'ID', order: -1 }]" [totalRecords]="totalRecords"
    (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
    [addButton]="addButton">
  </app-table>
</div>
