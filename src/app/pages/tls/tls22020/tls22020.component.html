<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="銷售日期" controlName="TXN_Date" calendarType="dateOne"
              [control]="queryForm.controls.TXN_Date" [submitted]="submitted"></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="收銀機號" controlName="dropdownRange"
              [startControl]="queryForm.controls.ECR_No_Start" [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted" [options]="ECRNoOptions" optionLabel="label"
              optionValue="value"></app-dropdown-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="status1">差異為0是否列出</label>
            <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" controlName="IsZeroShow"
              [formControl]="queryForm.controls.status1" placeholder="請選擇"></p-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-table tableKey="TLS22010" [data]="data" [columns]="selectedColumns" [columnGroup]="columnGroup"
      [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [showManage]="false" [showDelete]="false" [showPaginator]="false" [showReportMode]="false"
      [showExcelImport]="false">
      <header>
        <p-button pButton tooltipPosition="top" pTooltip="匯出Excel" [style.width]="'35px'" [style.height]="'35px'"
          class="p-button-rounded p-button-text p-button-info" icon="fa-regular fa-file-lines"
          [disabled]="!canPerformAction('70')" (click)="exportReport()" />
      </header>
      <ng-template pTemplate="footer" let-columns>
        <tr>
          <td *ngFor="let col of columns">
            {{ col.field === "ECR_No" ? "總計" : total[col.field] || "" }}
          </td>
        </tr>
      </ng-template>
    </app-table>
  </div>
</div>
