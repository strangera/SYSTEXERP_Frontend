<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
  </div>

  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">
          <div class="col-12 md:col-6 lg:col-4">
            <app-calendar label="銷售日期" controlName="TXN_Date" calendarType="dateOne"
              [control]="queryForm.controls.TXN_Date" [submitted]="submitted"></app-calendar>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown-range label="收銀機號" controlName="dropdownRange"
              [startControl]="queryForm.controls.ECR_No_Start" [endControl]="queryForm.controls.ECR_No_End"
              [submitted]="submitted" [options]="ECRNoOptions" optionLabel="Name" optionValue="No"></app-dropdown-range>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="IsZeroShow">差異為0是否列出</label>
            <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" formControlName="IsZeroShow"
              placeholder="請選擇"></p-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <label for="IsOpenInvoice">是否開立業主發票</label>
            <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" formControlName="rece_yn"
              placeholder="請選擇"></p-dropdown>
          </div>
        </div>

        <div class="grid justify-content-end gap-2 m-0 mt-2 border-top-1 surface-border pt-3">
          <app-button btnType="clear" [form]="queryForm"></app-button>
          <app-button btnType="query" [loading]="loading"></app-button>
        </div>
      </form>
    </p-accordionTab>
  </p-accordion>
</div>
<div class="card">
  <div class="col-12">
    <app-customFooter-table tableKey="TLS22010" [data]="data" [columns]="selectedColumns" [columnGroup]="columnGroup"
      [multiSortMeta]="[{ field: 'ECR_No', order: 1 }]" [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[30, 60, 90, 120, 150]" [expansionRowsPerPageOptions]="expansionRowsPerPageOptions"
      (lazyLoadData)="onLazyLoadData($event, queryForm); onSubmit(queryForm)" [lazy]="true" [loading]="loading"
      [showManage]="false" [showDelete]="false" [showReportMode]="false" [showTotal]="true" [footerData]="footerData"
      [rows]="30">
      <header>
        <p-button pButton tooltipPosition="top" pTooltip="匯出Excel" [style.width]="'35px'" [style.height]="'35px'"
          class="p-button-rounded p-button-text p-button-info" icon="fa fa-file-lines" [disabled]="!hasPermission('70')"
          (click)="exportReport()" />
      </header>
    </app-customFooter-table>
  </div>
</div>
