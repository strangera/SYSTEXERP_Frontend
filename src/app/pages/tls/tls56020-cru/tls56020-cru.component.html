<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="領用單編號"
            controlName="SPM_No"
            [control]="dataForm.controls.SPM_No"
            [submitted]="submitted"
          ></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown
              label="領用類別"
              controlName="SPM_Type"
              [options]="issuanceTypeOptions"
              optionLabel="label"
              optionValue="value"
              [control]="dataForm.controls.SPM_Type"
              [submitted]="submitted"
            ></app-dropdown>
          </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text
            label="領用單說明"
            controlName="SPM_remark"
            [control]="dataForm.controls.SPM_remark"
            [style]="{ height: '50px' }"
            [submitted]="submitted"
          ></app-editor-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="申請人編號"
            controlName="APPLY_USR_No"
            [options]="userOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.APPLY_USR_No"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="部門編號"
            controlName="departmentCode"
            [options]="org_id"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.org_id"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar
            calendarType="dateOne"
            label="申請日期"
            [control]="dataForm.controls.APPLY_Date_Start"
            [submitted]="submitted"
          ></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="倉別"
            controlName="HOS_No"
            [options]="warehouseOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.HOS_NoList"
            [submitted]="submitted"
          ></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown
            label="品牌編號"
            controlName="LOGO_No"
            [options]="brandOptions"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.LOGO_NoList"
            [submitted]="submitted"
          ></app-dropdown>
        </div>
      </div>
      <hr />

    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button btnType="cancel" (click)="onCancel()"></app-button>

          (click)="submitForm(dataForm)"
