<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()"></app-button>
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機名稱" controlName="ECR_Name" [control]="dataForm.controls.ECR_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台所屬專櫃編號" controlName="ECR_TLT_No" [control]="dataForm.controls.ECR_TLT_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台所屬專櫃名稱" controlName="ECR_TLT_Name" [control]="dataForm.controls.ECR_TLT_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <hr />
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="機台類型" controlName="ECR_Type" [options]="typeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_Type" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="機台用途別" controlName="ECR_SAL_Type" [options]="salTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_SAL_Type" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="位置編號" controlName="ECR_LocNo" [control]="dataForm.controls.ECR_LocNo"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台所屬收銀員" controlName="ECR_USR_No" [control]="dataForm.controls.ECR_USR_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台所屬收銀員姓名" controlName="ECR_USR_Name" [control]="dataForm.controls.ECR_USR_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="收銀機狀態" controlName="ECR_Status" [options]="statusOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_Status" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="啟用日期" controlName="ECR_ActiveDate"
            [control]="dataForm.controls.ECR_ActiveDate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="停用日期" controlName="ECR_CloseDate"
            [control]="dataForm.controls.ECR_CloseDate" [submitted]="submitted"></app-calendar>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機電腦名稱" controlName="ECR_ComName" [control]="dataForm.controls.ECR_ComName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台網路IP" controlName="ECR_IP" [control]="dataForm.controls.ECR_IP"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="後台主機IP" controlName="ECR_SrvIP"
            [control]="dataForm.controls.ECR_SrvIP" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown class="col-12 md:col-6 lg:col-4" label="環境變數編號" controlName="ECR_TmplNo"
            [control]="dataForm.controls.ECR_TmplNo" [submitted]="submitted"></app-dropdown>
        </div>
      </div>
      <hr />
      <p-accordion [multiple]="true">
        <p-accordionTab header="收銀設定">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="交易序號模式" controlName="ECR_SernoType" [options]="sernoTypeOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_SernoType" [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="系統對時間隔(秒)" controlName="ECR_TimeTickInvl"
                [control]="dataForm.controls.ECR_TimeTickInvl" [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="上下傳異動檔間隔(秒)" controlName="ECR_Interval"
                [control]="dataForm.controls.ECR_Interval" [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="單筆交易數量上限" controlName="ECR_MaxQty" [control]="dataForm.controls.ECR_MaxQty"
                [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="單筆交易金額上限" controlName="ECR_MaxAmt" [control]="dataForm.controls.ECR_MaxAmt"
                [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="單一明細金額上限" controlName="ECR_MaxItemAmt"
                [control]="dataForm.controls.ECR_MaxItemAmt" [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="單筆交易最大折扣比率限制" controlName="ECR_MaxDisc" [control]="dataForm.controls.ECR_MaxDisc"
                [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="信用卡刷卡機連線時限(秒)" controlName="ECR_EdcTimeout"
                [control]="dataForm.controls.ECR_EdcTimeout" [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="信用卡刷卡機連動日結(Y/N)" controlName="ECR_EdcSettle" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_EdcSettle"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否強制輸入付款金額(Y/N)" controlName="ECR_ForceInput" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_ForceInput"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否輸入來客數(Y/N)" controlName="ECR_CustCntEntry" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_CustCntEntry"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否輸入客層數(Y/N)" controlName="ECR_CustTypeEntry" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_CustTypeEntry"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否強制輸入營業員(Y/N)" controlName="ECR_ClerkEntry" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_ClerkEntry"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否強制輸入會員編號(Y/N)" controlName="ECR_ForceMember" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_ForceMember"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="開抽屜是否輸入密碼(Y/N)" controlName="ECR_BoxReqCode" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_BoxReqCode"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否允許執行補印發票(Y/N)" controlName="ECR_ReprintGUI" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_ReprintGUI"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="發票使用類別" controlName="ECR_GUI_Type" [options]="guiTypeOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_GUI_Type" [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="機台每期電子發票預設配號數量" controlName="ECR_GUI_PeriodQty"
                [control]="dataForm.controls.ECR_GUI_PeriodQty" [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="機台電子發票最小安全存量" controlName="ECR_GUI_MinQty"
                [control]="dataForm.controls.ECR_GUI_MinQty" [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="清機提示日期" controlName="ECR_SettleDD" [options]="settleDDOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_SettleDD" [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="清機提示時間-時分" controlName="ECR_SettleHHNN"
                [control]="dataForm.controls.ECR_SettleHHNN" [submitted]="submitted"></app-input-text>
            </div>
          </div>
        </p-accordionTab>
        <hr />
        <p-accordionTab header="報表設定">
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否執行自我報帳(Y/N)" controlName="ECR_SelfReport" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SelfReport"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印收銀員交班表(Y/N)" controlName="ECR_SaleRpt1" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt1"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印收銀機財務報表(Y/N)" controlName="ECR_SaleRpt2" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt2"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印時段銷售報表(Y/N)" controlName="ECR_SaleRpt3" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt3"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印部門銷售報表(Y/N)" controlName="ECR_SaleRpt4" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt4"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印單品銷售報表(Y/N)" controlName="ECR_SaleRpt5" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt5"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印銷貨明細表(Y/N)" controlName="ECR_SaleRpt6" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt6"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印作廢明細表(Y/N)" controlName="ECR_SaleRpt7" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt7"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印自我報帳(現額報告)帳條(Y/N)" controlName="ECR_SaleRpt8" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt8"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印保全現金帳條(現金明細表)(Y/N)" controlName="ECR_SaleRpt9" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_SaleRpt9"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="保留(Y/N)" controlName="ECR_SaleRpt10" [options]="yesNoOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_SaleRpt10" [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="零用金是否需要認證(Y/N)" controlName="ECR_PcashValid" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_PcashValid"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="中途取現是否需要認證(Y/N)" controlName="ECR_PickUpValid" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_PickUpValid"
                [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否列印商標(Y/N)" controlName="ECR_PrnLogo" [options]="yesNoOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_PrnLogo" [submitted]="submitted"></app-dropdown>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標1(店名)" controlName="ECR_Logo1" [control]="dataForm.controls.ECR_Logo1"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標2(地址)" controlName="ECR_Logo2" [control]="dataForm.controls.ECR_Logo2"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標3(電話)" controlName="ECR_Logo3" [control]="dataForm.controls.ECR_Logo3"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標4(統一編號)" controlName="ECR_Logo4" [control]="dataForm.controls.ECR_Logo4"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標5" controlName="ECR_Logo5" [control]="dataForm.controls.ECR_Logo5"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="商標6" controlName="ECR_Logo6" [control]="dataForm.controls.ECR_Logo6"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否允許作廢交易(Y/N)" controlName="ECR_VoidTxn" [options]="yesNoOptions" optionLabel="label"
                optionValue="value" [control]="dataForm.controls.ECR_VoidTxn" [submitted]="submitted"></app-dropdown>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="作廢交易限制天數" controlName="ECR_VoidRstDay"
                [control]="dataForm.controls.ECR_VoidRstDay" [submitted]="submitted"></app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown label="是否允許開立折讓單(Y/N)" controlName="ECR_CreditNote" [options]="yesNoOptions"
                optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_CreditNote"
                [submitted]="submitted"></app-dropdown>
            </div>
          </div>
        </p-accordionTab>
        <hr />
        <p-accordionTab header="周邊設定">
          <h4>輸入</h4>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="機台鍵盤等級" controlName="ECR_KBLevel" [control]="dataForm.controls.ECR_KBLevel"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="鍵盤型態" controlName="ECR_KBType" [control]="dataForm.controls.ECR_KBType"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="掃描器型態" controlName="ECR_Scanner" [control]="dataForm.controls.ECR_Scanner"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="掃描器連接埠" controlName="ECR_ScannerCom" [control]="dataForm.controls.ECR_ScannerCom"
                [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <hr />
          <h4>顯示</h4>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="收銀畫面樣式" controlName="ECR_ScrType" [control]="dataForm.controls.ECR_ScrType"
                [submitted]="submitted"></app-input-text>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="客戶顯示器型態" controlName="ECR_CD" [control]="dataForm.controls.ECR_CD"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="客戶顯示器連接埠" controlName="ECR_CDCom" [control]="dataForm.controls.ECR_CDCom"
                [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="收銀外接顯示器名稱" controlName="ECR_ExtScr" [control]="dataForm.controls.ECR_ExtScr"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="收銀外接顯示器連接埠" controlName="ECR_ExtScrCom"
                [control]="dataForm.controls.ECR_ExtScrCom" [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <hr />
          <h4>印表機</h4>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="發票印表機型態" controlName="ECR_GUIPr" [control]="dataForm.controls.ECR_GUIPr"
                [submitted]="submitted"></app-input-text>
