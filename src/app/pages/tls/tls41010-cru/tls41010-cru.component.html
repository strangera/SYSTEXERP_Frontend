<div class="card">
  <div class="flex gap-2 mb-2">
    <app-menubar [ProgNo]="ProgNo" class="flex-1"></app-menubar>
    <app-button btnType="back" (click)="onCancel()" />
  </div>

  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-tlt-no-picker label="專櫃編號" controlName="ECR_TLT_No" [control]="dataForm.controls.ECR_TLT_No"
            [options]="CounterOptions" [columns]="tltNoPickerColumns" [dialogWidth]="'1300px'"
            [submitted]="submitted" (rowSelect)="onCounterRowSelect($event)"></app-tlt-no-picker>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="櫃位名稱" controlName="ECR_TLT_Name" [control]="dataForm.controls.ECR_TLT_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機號" controlName="ECR_No" [control]="dataForm.controls.ECR_No"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機名稱" controlName="ECR_Name" [control]="dataForm.controls.ECR_Name"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <hr />
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="機台類型" controlName="ECR_Type" [options]="typeOptions" templateLabel="label"
            optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_Type"
            [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="機台用途別" controlName="ECR_SAL_Type" [options]="salTypeOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_SAL_Type" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-auto-complete label="位置編號" controlName="ECR_LocNo" [control]="dataForm.controls.ECR_LocNo"
            [options]="LocOptions" optionLabel="Name" optionValue="No" [submitted]="submitted"></app-auto-complete>
          @if (locNoWarning) {
            <small class="text-orange-600 text-sm block">
              <i class="pi pi-exclamation-triangle mr-1"></i>{{ locNoWarningMessage }}
            </small>
          }
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="館別" controlName="ECR_Group" [control]="dataForm.controls.ECR_Group"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="樓層" controlName="ECR_SubGroup" [control]="dataForm.controls.ECR_SubGroup"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="區域" controlName="ECR_AreaNo" [control]="dataForm.controls.ECR_AreaNo"
            [submitted]="submitted"></app-input-text>
        </div>
      </div>
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="收銀員" controlName="ECR_USR_No" [control]="dataForm.controls.ECR_USR_No"
            [options]="CashierOptions" optionLabel="label" optionValue="No" [submitted]="submitted"></app-dropdown>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀員姓名" controlName="ECR_USR_Name" [control]="dataForm.controls.ECR_USR_Name"
            [submitted]="submitted"></app-input-text>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="收銀機狀態" controlName="ECR_Status" [options]="statusOptions" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_Status" [submitted]="submitted"></app-dropdown>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="啟用日期" controlName="ECR_ActiveDate"
            [control]="dataForm.controls.ECR_ActiveDate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="到期日期" controlName="ECR_ExpireDate"
            [control]="dataForm.controls.ECR_ExpireDate" [submitted]="submitted"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-calendar calendarType="dateOne" label="停用日期" controlName="ECR_CloseDate"
            [control]="dataForm.controls.ECR_CloseDate" [submitted]="submitted"></app-calendar>
        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="收銀機電腦名稱" controlName="ECR_ComName" [control]="dataForm.controls.ECR_ComName"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text label="機台網路IP" controlName="ECR_IP" [control]="dataForm.controls.ECR_IP"
            [submitted]="submitted"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="主機 IP" controlName="ECR_SrvIP" [options]="ECR_SrvIP_Option" optionLabel="label"
            optionValue="Name" [control]="dataForm.controls.ECR_SrvIP">
          </app-dropdown>

        </div>
      </div>

      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown label="環境變數編號" controlName="ECR_TmplNo" [options]="ECR_TmplNo_Option" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.ECR_TmplNo" [submitted]="submitted"></app-dropdown>
        </div>
        <div class="col-12 md:col-8">
          <app-input-textarea label="備註" controlName="ECR_Desc" [control]="dataForm.controls.ECR_Desc"
            [submitted]="submitted"></app-input-textarea>
        </div>
      </div>

      <p-accordion>
        <p-accordionTab header="收銀設定">
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="交易序號模式" controlName="ECR_SernoType"
              [options]="sernoTypeOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SernoType" [submitted]="submitted"></app-dropdown>
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="發票使用類別" controlName="ECR_GUI_Type"
              [options]="ECR_GUI_Type_Option" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_GUI_Type" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="系統對時間隔(秒)" controlName="ECR_TimeTickInvl"
              [control]="dataForm.controls.ECR_TimeTickInvl" [submitted]="submitted"></app-input-number>
            <app-input-number class="col-12 md:col-6 lg:col-4" label="上下傳異動檔間隔(秒)" controlName="ECR_Interval"
              [control]="dataForm.controls.ECR_Interval" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-number class="col-12 md:col-6 lg:col-4" label="單筆交易數量上限" controlName="ECR_MaxQty"
              [control]="dataForm.controls.ECR_MaxQty" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="單筆交易金額上限" controlName="ECR_MaxAmt"
              [control]="dataForm.controls.ECR_MaxAmt" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-number class="col-12 md:col-6 lg:col-4" label="單一明細金額上限" controlName="ECR_MaxItemAmt"
              [control]="dataForm.controls.ECR_MaxItemAmt" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="單筆交易最大折扣比率限制" controlName="ECR_MaxDisc"
              [control]="dataForm.controls.ECR_MaxDisc" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="信用卡刷卡機連線時限(秒)" controlName="ECR_EdcTimeout"
              [control]="dataForm.controls.ECR_EdcTimeout" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="信用卡刷卡機連動日結" controlName="ECR_EdcSettle"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_EdcSettle" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否強制輸入付款金額" controlName="ECR_ForceInput"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_ForceInput" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否輸入來客數" controlName="ECR_CustCntEntry"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_CustCntEntry" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否輸入客層" controlName="ECR_CustTypeEntry"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_CustTypeEntry" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否強制輸入營業員" controlName="ECR_ClerkEntry"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_ClerkEntry" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否強制輸入會員編號" controlName="ECR_ForceMember"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_ForceMember" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="清機提示日期" controlName="ECR_SettleDD"
              [options]="settleDDOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SettleDD" [submitted]="submitted" />
            <app-calendar class="col-12 md:col-6 lg:col-4" calendarType="timeOne" label="清機提示時間"
              controlName="ECR_SettleHHNN" [control]="dataForm.controls.ECR_SettleHHNN" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否允許作廢交易" controlName="ECR_VoidTxn"
              [options]="yesNoOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_VoidTxn"
              [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="作廢交易限制天數" controlName="ECR_VoidRstDay"
              [control]="dataForm.controls.ECR_VoidRstDay" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否允許開立折讓單" controlName="ECR_CreditNote"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_CreditNote" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否允許回復已作廢交易" controlName="ECR_RestoreVoid"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_RestoreVoid" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="機台每期電子發票預設配號數量" controlName="ECR_GUI_PeriodQty"
              [control]="dataForm.controls.ECR_GUI_PeriodQty" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="機台電子發票最小安全存量" controlName="ECR_GUI_MinQty"
              [control]="dataForm.controls.ECR_GUI_MinQty" [submitted]="submitted" />
          </div>
        </p-accordionTab>
        <hr />
        <p-accordionTab header="報表設定">
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否執行自我報帳" controlName="ECR_SelfReport"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SelfReport" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否列印收銀員交班表" controlName="ECR_SaleRpt1"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SaleRpt1" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否列印收銀機財務報表" controlName="ECR_SaleRpt2"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SaleRpt2" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否列印銷貨明細表" controlName="ECR_SaleRpt6"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SaleRpt6" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否列印作廢明細表" controlName="ECR_SaleRpt7"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_SaleRpt7" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="零用金是否需要認證" controlName="ECR_PcashValid"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_PcashValid" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="中途取現是否需要認證" controlName="ECR_PickUpValid"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_PickUpValid" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否允許補印發票" controlName="ECR_ReprintGUI"
              [options]="yesNoOptions" optionLabel="label" optionValue="value"
              [control]="dataForm.controls.ECR_ReprintGUI" [submitted]="submitted" />
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="是否列印商標" controlName="ECR_PrnLogo"
              [options]="yesNoOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.ECR_PrnLogo"
              [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="商標門市名稱" controlName="ECR_Logo1"
              [control]="dataForm.controls.ECR_Logo1" [submitted]="submitted" />
            <app-input-text class="col-12 md:col-6 lg:col-4" label="商標門市地址" controlName="ECR_Logo2"
              [control]="dataForm.controls.ECR_Logo2" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="商標門市電話" controlName="ECR_Logo3"
              [control]="dataForm.controls.ECR_Logo3" [submitted]="submitted" />
            <app-input-text class="col-12 md:col-6 lg:col-4" label="商標門市統一編號" controlName="ECR_Logo4"
              [control]="dataForm.controls.ECR_Logo4" [submitted]="submitted" />
          </div>
        </p-accordionTab>
        <hr />
        <p-accordionTab header="周邊設定">
          <h4>輸入</h4>
          <div class="grid p-fluid">
            <app-dropdown class="col-12 md:col-6 lg:col-4" label="機台鍵盤編號" controlName="ECR_KBLevel"
              [control]="dataForm.controls.ECR_KBLevel" [options]="KBLevelOptions" optionLabel="label"
              optionValue="value" [submitted]="submitted"></app-dropdown>
            <app-input-text class="col-12 md:col-6 lg:col-4" label="鍵盤型態" controlName="ECR_KBType"
              [control]="dataForm.controls.ECR_KBType" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="掃描器型態" controlName="ECR_Scanner"
              [control]="dataForm.controls.ECR_Scanner" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="掃描器連接埠" controlName="ECR_ScannerCom"
              [control]="dataForm.controls.ECR_ScannerCom" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="MSR型態" controlName="ECR_MSR"
              [control]="dataForm.controls.ECR_MSR" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="MSR連接埠" controlName="ECR_MSRCom"
              [control]="dataForm.controls.ECR_MSRCom" [submitted]="submitted" />
          </div>
          <hr />
          <h4>顯示</h4>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀畫面樣式" controlName="ECR_ScrType"
              [control]="dataForm.controls.ECR_ScrType" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="收銀外接顯示器名稱" controlName="ECR_ExtScr"
              [control]="dataForm.controls.ECR_ExtScr" [submitted]="submitted" />

            <app-input-number class="col-12 md:col-6 lg:col-4" label="收銀外接顯示器連接埠" controlName="ECR_ExtScrCom"
              [control]="dataForm.controls.ECR_ExtScrCom" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="客戶顯示器型態" controlName="ECR_CD"
              [control]="dataForm.controls.ECR_CD" [submitted]="submitted" />

            <app-input-number class="col-12 md:col-6 lg:col-4" label="客戶顯示器連接埠" controlName="ECR_CDCom"
              [control]="dataForm.controls.ECR_CDCom" [submitted]="submitted" />
          </div>
          <hr />
          <h4>列印</h4>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="發票印表機型態" controlName="ECR_GUIPrn"
              [control]="dataForm.controls.ECR_GUIPrn" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="發票印表機連接埠" controlName="ECR_GUICom"
              [control]="dataForm.controls.ECR_GUICom" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="收據印表機型態" controlName="ECR_SlipPrn"
              [control]="dataForm.controls.ECR_SlipPrn" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="收據印表機連接埠" controlName="ECR_SlipPrnCom"
              [control]="dataForm.controls.ECR_SlipPrnCom" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="訂單印表機型態" controlName="ECR_OrderPrn"
              [control]="dataForm.controls.ECR_OrderPrn" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="訂單印表機連接埠" controlName="ECR_OrderPrnCom"
              [control]="dataForm.controls.ECR_OrderPrnCom" [submitted]="submitted" />
          </div>
          <div class="grid p-fluid">
            <app-input-text class="col-12 md:col-6 lg:col-4" label="標籤印表機型態" controlName="ECR_LablePrn"
              [control]="dataForm.controls.ECR_LablePrn" [submitted]="submitted" />
            <app-input-number class="col-12 md:col-6 lg:col-4" label="標籤印表機連接埠" controlName="ECR_LablePrnCom"
              [control]="dataForm.controls.ECR_LablePrnCom" [submitted]="submitted" />
          </div>

          <hr />
          <h4>信用卡</h4>

          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="信用卡刷卡機型態" controlName="ECR_EDC" [control]="dataForm.controls.ECR_EDC"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="信用卡刷卡機連接埠" controlName="ECR_EDCCom" [control]="dataForm.controls.ECR_EDCCom"
                [submitted]="submitted"></app-input-number>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text label="第二台信用卡刷卡機型態" controlName="ECR_EDC2" [control]="dataForm.controls.ECR_EDC2"
                [submitted]="submitted"></app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number label="第二台信用卡刷卡機連接埠" controlName="ECR_EDC2Com" [control]="dataForm.controls.ECR_EDC2Com"
                [submitted]="submitted"></app-input-number>
            </div>
          </div>
