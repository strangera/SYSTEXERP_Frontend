<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true"
                    class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number [useGrouping]="false" label="扣款項目編號" controlName="deductionItemNumber"
                                    [control]="queryForm.controls.deductionItemNumber" [submitted]="submitted">
                                </app-input-number>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="扣款類別" controlName="deductionCategory"
                                    [options]="deductionCategoryOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.deductionCategory" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="扣款項目名稱" controlName="deductionItemName"
                                    [control]="queryForm.controls.deductionItemName" [submitted]="submitted">>
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="扣款類別" controlName="deductionCategory"
                                    [options]="deductionCategoryOptions" optionLabel="label" optionValue="value"
                                    [control]="queryForm.controls.deductionCategory" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <div class="grid p-fluid">
              
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="備註" controlName="remark" [control]="queryForm.controls.remark"
                                    [submitted]="submitted">>
                                </app-input-text>
                            </div>
                        </div>
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
                                <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)"
                                    [loading]="loading"></app-button>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
