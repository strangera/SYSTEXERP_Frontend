<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="館別" controlName="BUILDING_NO" [options]="BUILDING_NO_Options" optionLabel="label" optionValue="value" [control]="dataForm.controls.BUILDING_NO" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="樓層代碼" controlName="FLOOR_NO" [options]="floorOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.FLOOR_NO" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="區域代碼" controlName="AREA_NO" [options]="RegionCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.AREA_NO" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="位置編號" controlName="LOCATION_No" [control]="dataForm.controls.LOCATION_No" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="組織代碼" controlName="ORG_NO" [options]="RegionCodeOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.ORG_No" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="營業坪數(坪)" controlName="GROSS_SPACE" [control]="dataForm.controls.GROSS_SPACE" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="簽約坪數(坪)" controlName="NET_SPACE" [control]="dataForm.controls.NET_SPACE" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="用途" controlName="Location_Purpose" [options]="usageOptions" optionLabel="label" optionValue="value" [control]="dataForm.controls.Location_Purpose" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-dropdown-item label="狀態" controlName="LOCATION_Status" [options]="LOCATION_Status_Options" optionLabel="label" optionValue="value" [control]="dataForm.controls.LOCATION_Status" [submitted]="submitted">
                    </app-dropdown-item>
                </div>
            </div>
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="平面圖X座標" controlName="X_coordinate" [control]="dataForm.controls.X_coordinate" [submitted]="submitted">
                    </app-input-text>
                </div>
                <div class="col-12 md:col-6 lg:col-4">
                    <app-input-text label="平面圖Y座標" controlName="Y_coordinate" [control]="dataForm.controls.Y_coordinate" [submitted]="submitted">
                    </app-input-text>
                </div>
            </div>
            <hr/>
            <app-editor-text label="備註" controlName="Location_Remark" [control]="dataForm.controls.Location_Remark" [style]="{ height: '100px' }" [submitted]="submitted">
            </app-editor-text>
            <hr/>
        </form>
        <div class="col pt-4">
            <div class="grid justify-content-end">
                <app-button-cancel (click)="onCancel()"></app-button-cancel>
                <app-button-submit (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button-submit>
            </div>
        </div>
    </p-panel>
</div>
