<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="grid align-items-center">
        <div class="col" style="flex: 1">
          <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
      </div>
      <p-accordion>
        <p-accordionTab
          header="{{ 'query-conditions' | translate }}"
          [selected]="true"
          class="line-height-3 m-0"
          [headerStyleClass]="'query-accordionTab'"
        >
          <!-- <form
            [formGroup]="queryForm"
            id="queryForm"
            (ngSubmit)="onSubmit(queryForm)"
          >
        </form> -->
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-number
                label="專櫃編號"
                controlName="counterCode"
                [control]="queryForm.controls.counterCode"
                [submitted]="submitted"
              >
              </app-input-number>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="專櫃名稱"
                controlName="counterName"
                [control]="queryForm.controls.counterName"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="樓層"
                controlName="floorCode"
                [options]="floorOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.floorCode"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="區域"
                controlName="regionCode"
                [options]="regionOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.regionCode"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="業種"
                controlName="businessTypeCode"
                [options]="businessTypeCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.businessTypeCode"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="專櫃營運狀態"
                controlName="operationStatus"
                [options]="operationStatusOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.operationStatus"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="合約起始日"
                [startControl]="queryForm.controls.contractStartDate"
                [endControl]="queryForm.controls.contractEndDate"
                [submitted]="submitted"
              >
              </app-date-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="合約截止日"
                [startControl]="queryForm.controls.contractDeadlineStartDate"
                [endControl]="queryForm.controls.contractDeadlineEndDate"
                [submitted]="submitted"
              >
              </app-date-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="扣款類別"
                controlName="deductionCategory"
                [options]="deductionCategoryOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.deductionCategory"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="扣款(代號)名稱"
                controlName="deductionCodeName"
                [options]="deductionCodeNameServOptions"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.deductionCodeName"
                [submitted]="submitted"
              >
              </app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="扣款起日"
                [startControl]="queryForm.controls.deductionStartDate"
                [endControl]="queryForm.controls.deductionEndDate"
                [submitted]="submitted"
              >
              </app-date-range>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-date-range
                label="扣款迄日"
                [startControl]="queryForm.controls.deductionDeadlineStartDate"
                [endControl]="queryForm.controls.deductionDeadlineEndDate"
                [submitted]="submitted"
              >
              </app-date-range>
            </div>
          </div>

          <div *appHasPermission="queryPermission" class="col">
            <div class="grid justify-content-end">
              <app-button-clear (onClick)="onClearForm()"></app-button-clear>
              <app-button-query
                (onClick)="onSubmitQuery(queryForm)"
                [loading]="loading"
              ></app-button-query>
            </div>
          </div>
        </p-accordionTab>
      </p-accordion>
    </div>
  </div>
</div>
