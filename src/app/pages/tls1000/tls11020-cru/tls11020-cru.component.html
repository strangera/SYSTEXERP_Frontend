<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
        <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
            <div style="overflow-x: auto; overflow-y: auto; min-height: 300px;">
                <table class="table w-full" style="min-width: 1200px; white-space: nowrap;">
                    <thead style="background-color: #c1c9f5;">
                        <tr>
                            <th style="width: 30px;">扣款項目編號</th>
                            <th>扣款項目名稱</th>
                            <th style="width: 500px;">扣款類別</th>
                            <th>會計科目</th>
                            <th>是否開立發票</th>
                            <th>課稅別</th>
                            <th>是否為常用</th>
                            <th>列印區分</th>
                            <th>備註</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody formArrayName="items">
                        <tr *ngFor="let row of items.controls; let i = index" [formGroupName]="i">
                            <td>
                                <input pInputText formControlName="deductionItemNumber" maxlength="3"
                                    style="width: 100%;" />
                            </td>
                            <td>
                                <input pInputText formControlName="deductionItemName" />
                            </td>
                            <td style="width: 500px;">
                                <p-dropdown [options]="deductionCategoryOptions" optionLabel="label" optionValue="value"
                                    formControlName="deductionCategory"
                                    [style]="{ 'width': '100%', 'min-width': '100px' }">
                                </p-dropdown>
                            </td>


                            <td>
                                <input pInputText formControlName="accNo" />
                            </td>
                            <td>
                                <p-dropdown [options]="[{ label: '開立', value: 'Y' }, { label: '不開立', value: 'N' }]"
                                    formControlName="guiFlag">
                                </p-dropdown>
                            </td>
                            <td>
                                <p-dropdown [options]="[{ label: '免稅', value: '0' }, { label: '應稅', value: '1' }]"
                                    formControlName="capTaxType">
                                </p-dropdown>
                            </td>
                            <td>
                                <p-dropdown [options]="[{ label: '常用', value: 'Y' }, { label: '不常用', value: 'N' }]"
                                    formControlName="isCommonlyUsed">
                                </p-dropdown>
                            </td>
                            <td>
                                <input pInputText formControlName="printArea" />
                            </td>
                            <td>
                                <input pInputText formControlName="remark" />
                            </td>
                            <td>
                                <!-- 新增按鈕（第一列） -->
                                <button *ngIf="i === 0" pButton type="button" icon="pi pi-plus" label="新增"
                                    class="p-button-sm p-button-success mr-2" (click)="onAddItem()">
                                </button>

                                <!-- 刪除按鈕（非第一列） -->
                                <button *ngIf="i !== 0" pButton type="button" icon="pi pi-trash" label="刪除"
                                    class="p-button-sm p-button-danger" (click)="confirmRemove(i)">
                                </button>
                        </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </p-panel>

    <div class="col pt-4">
        <div class="grid justify-content-end">
            <app-button btnType="cancel" (click)="onCancel()"></app-button>
            <app-button btnType="submit" (click)="submitForm(dataForm)" *ngIf="isFormEditable"></app-button>
        </div>
    </div>

</div>
