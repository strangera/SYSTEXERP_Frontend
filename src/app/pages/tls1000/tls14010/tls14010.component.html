<div class="card">
    <div class="grid align-items-center">
        <div class="col" style="flex: 1;">
            <app-menubar [ProgNo]="ProgNo"></app-menubar>
        </div>
    </div>
    <p-accordion>
        <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
            <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number label="專櫃編號" controlName="counterCode" [control]="queryForm.controls.counterCode" [submitted]="submitted">
                        </app-input-serial-number>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-text label="專櫃名稱(品牌)" controlName="counterName" [control]="queryForm.controls.counterName" [submitted]="submitted">
                        </app-input-text>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="位置編號" controlName="LocationCodeOptions" [options]="LocationCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.LocationCodeOptions" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="區域" controlName="regionCode" [options]="regionOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.regionCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="樓層" controlName="floorCode" [options]="floorOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.floorCode" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="業種" controlName="businessTypeCode" [options]="businessTypeCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.businessTypeCodeOptions" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="營運狀況" controlName="operationStatus" [options]="operationStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.operationStatus" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>
                    <div class="col-12 md:col-6 lg:col-4">
                        <app-input-serial-number-range label="版本編號" [startControl]="queryForm.controls.startserial" [endControl]="queryForm.controls.endserial" [submitted]="submitted">
                        </app-input-serial-number-range>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-dropdown-item label="合約狀態" controlName="contractStatus" [options]="contractStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.contractStatus" [submitted]="submitted">
                        </app-dropdown-item>
                    </div>

                    <div class="col-12 md:col-6 lg:col-4">
                        <app-date-range label="日期條件" [startControl]="queryForm.controls.startDate" [endControl]="queryForm.controls.endDate" [submitted]="submitted">
                        </app-date-range>
                    </div>
                </div>
            </form>
            <div *appHasPermission="queryPermission" class="col">
                <div class="grid justify-content-end">
                    <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                    <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                </div>
            </div>
        </p-accordionTab>
    </p-accordion>
</div>
