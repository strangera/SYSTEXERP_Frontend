<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="grid align-items-center">
                <div class="col" style="flex: 1;">
                    <app-menubar [ProgNo]="ProgNo"></app-menubar>
                </div>
                <div *appHasPermission="addPermission">
                    <app-button-create (click)="onCreate()" class="col"></app-button-create>
                </div>
            </div>
            <p-accordion>
                <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0" [headerStyleClass]="'query-accordionTab'">
                    <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="館別" controlName="BUILDING_NO" [options]="BUILDING_NO_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.BUILDING_NO" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="樓層" controlName="FLOOR_NO" [options]="floorOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.FLOOR_NO" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="區域" controlName="AREA_NO" [options]="RegionCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.AREA_NO" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="位置代碼" controlName="LOCATION_No" [control]="queryForm.controls.LOCATION_No" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="組織代碼" controlName="ORG_NO" [options]="RegionCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.ORG_No" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="營業坪數" controlName="GROSS_SPACE" [control]="queryForm.controls.GROSS_SPACE" [submitted]="submitted">
                                </app-input-text>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-text label="簽約坪數" controlName="NET_SPACE" [control]="queryForm.controls.NET_SPACE" [submitted]="submitted">
                                </app-input-text>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="用途" controlName="Location_Purpose" [options]="usageOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.Location_Purpose" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="狀態" controlName="LOCATION_Status" [options]="LOCATION_Status_Options" optionLabel="label" optionValue="value" [control]="queryForm.controls.LOCATION_Status" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div>
                        <!--
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-dropdown-item label="組織代號" controlName="organizationCode" [options]="OrganizationCodeOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.organizationCode" [submitted]="submitted">
                                </app-dropdown-item>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number-range label="營業坪數" [startControl]="queryForm.controls.businessSquareMin" [endControl]="queryForm.controls.businessSquareMax" [submitted]="submitted"></app-input-number-range>
                            </div>
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-input-number-range label="簽約坪數" [startControl]="queryForm.controls.contractedSquareMin" [endControl]="queryForm.controls.contractedSquareMax" [submitted]="submitted"></app-input-number-range>
                            </div>
                        </div>
                        <div class="grid p-fluid">
                            <div class="col-12 md:col-6 lg:col-4">
                                <app-multi-select label="狀態" controlName="status" [options]="userStatusOptions" optionLabel="label" optionValue="value" [control]="queryForm.controls.status" [submitted]="submitted">
                                </app-multi-select>
                            </div>
                        </div> -->
                        <div *appHasPermission="queryPermission" class="col">
                            <div class="grid justify-content-end">
                                <app-button-clear (onClick)="onClearForm()"></app-button-clear>
                                <app-button-query (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button-query>
                            </div>
                        </div>
                    </form>
                </p-accordionTab>
            </p-accordion>
        </div>
        <div class="card">
            <div class="col-13">
                <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
                </app-data-table>
            </div>
        </div>
    </div>
</div>
