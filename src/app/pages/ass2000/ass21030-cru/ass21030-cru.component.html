<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="水錶編號編號"
            controlName="meterPosCode"
            [options]="meterPosCode"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.meterPosCode"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="設備位置編號"
            controlName="meterNo"
            [control]="dataForm.controls.meterNo"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="樓層編號"
            controlName="floorCat"
            [control]="dataForm.controls.floorCat"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="樓層名稱"
            controlName="floor"
            [options]="floor"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.floor"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="樓別編號"
            controlName="floor"
            [options]="floor"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.floor"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="樓別名稱"
            controlName="floor"
            [options]="floor"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.floor"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="平面圖X座標"
            controlName="xCoordinate"
            [control]="dataForm.controls.xCoordinate"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="平面圖Y座標"
            controlName="yCoordinate"
            [control]="dataForm.controls.yCoordinate"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="查看平面圖"
            controlName="VFP"
            [options]="VFP"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.VFP"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
      </div>
      <hr />
      <ng-container formArrayName="items">
        <ng-container
          *ngFor="let item of items.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="grid align-items-center">
            <div class="col" style="flex: 1">
              <p> {{ i + 1 }}</p>
            </div>
            <div>
              <app-button-dynamicallydelete
                (click)="onRemoveItem(i)"
                [crudstatus]="crudstatus"
                class="col"
              ></app-button-dynamicallydelete>
            </div>
          </div>
          <div class="grid p-fluid">
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="專櫃編號/專櫃名稱/位置編號/招募編號"
                controlName="Pettycashcustodian"
                [options]="itemCodeOptions"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'itemCodeOptions')"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>

            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="營業面積"
                controlName="unit"
                [control]="getFormControl(i, 'unit')"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="比率(%)"
                controlName="returnQty"
                [control]="getFormControl(i, 'returnQty')"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="專櫃分類"
                controlName="cCat"
                [options]="cCat"
                optionLabel="label"
                optionValue="value"
                [control]="getFormControl(i, 'cCat')"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="備註"
                controlName="returnQty"
                [control]="getFormControl(i, 'returnQty')"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
          </div>

          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd
          (click)="onAddItem()"
        ></app-button-dynamicallyadd>
      </div>
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
