<div class="card">
    <div class="grid align-items-center">
      <div class="col" style="flex: 1">
        <app-menubar [ProgNo]="ProgNo"></app-menubar>
      </div>
      <div *appHasPermission="addPermission">
            <app-button-create (click)="onCreate()" class="col"></app-button-create>
          </div>
    </div>
    <p-accordion>
      <p-accordionTab
        header="{{ 'query-conditions' | translate }}"
        [selected]="true"
        class="line-height-3 m-0"
        [headerStyleClass]="'query-accordionTab'"
      >
        <form
          [formGroup]="queryForm"
          id="queryForm"
          (ngSubmit)="onSubmit(queryForm)"
        >
          <div class="grid p-fluid">
            <!-- <div class="col-12 md:col-6 lg:col-4">
                <app-radiobutton
                  label="資料顯示"
                  [control]="queryForm.controls.Querybystatus"
                  [options]="Querybystatus"
                  [submitted]="submitted"
                >
                </app-radiobutton>
              </div> -->
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="瓦斯錶編號"
                  controlName="ironNumberOptions"
                  [options]="ironNumberOptions"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.ironNumberOptions"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="專櫃編號"
                  controlName="Counternumber"
                  [options]="Counternumber"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.Counternumber"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="專櫃分類"
                  controlName="Counterclassification"
                  [options]="Counterclassification"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.Counterclassification"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-input-text
                label="設備位置編號"
                controlName="remark"
                [control]="queryForm.controls.remark"
                [submitted]="submitted"
              >
              </app-input-text>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="部別名稱"
                  controlName="remark"
                  [control]="queryForm.controls.remark"
                  [submitted]="submitted"
                >
                </app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="營業面積"
                  controlName="remark"
                  [control]="queryForm.controls.remark"
                  [submitted]="submitted"
                >
                </app-input-text>
              </div>
              <div class="col-12 md:col-6 lg:col-4">
                <app-input-text
                  label="面積比例(%)"
                  controlName="remark"
                  [control]="queryForm.controls.remark"
                  [submitted]="submitted"
                >
                </app-input-text>
              </div>
            <!-- <div class="col-12 md:col-6 lg:col-4">
                  <app-datemm-one
                    label="統計年月"
                    [control]="queryForm.controls.Sdate"
                  
                    [submitted]="submitted"
                  >
                  </app-datemm-one>
                </div> -->

  
      
            <!-- <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="品項編號"
                controlName="Itemnumber"
                [options]="Itemnumber"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.Itemnumber"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div>
            <div class="col-12 md:col-6 lg:col-4">
              <app-dropdown-item
                label="會計科目代碼"
                controlName="Kurabe"
                [options]="Kurabe"
                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.Kurabe"
                [submitted]="submitted"
              ></app-dropdown-item>
            </div> -->
          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  
  <div class="card">
    <div class="col-12">
      <app-data-table
        [data]="data"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      >
      </app-data-table>
    </div>
  </div>
