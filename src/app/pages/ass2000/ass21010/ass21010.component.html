<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <div *appHasPermission="addPermission">
      <app-button btnType="create" (click)="onCreate()" class="col"></app-button>
    </div>
  </div>
  <p-accordion>
    <p-accordionTab header="{{ 'query-conditions' | translate }}" [selected]="true" class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'">
      <form [formGroup]="queryForm" id="queryForm" (ngSubmit)="onSubmit(queryForm)">
        <div class="grid p-fluid">

              </app-radiobutton>
            </div> -->
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="錶號位置編號" controlName="code" [control]="queryForm.controls.code"
              [submitted]="submitted">
            </app-input-text>
          </div>

                </app-datemm-one>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="樓層" controlName="floor" [options]="floor" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.floor" [submitted]="submitted"></app-dropdown>
          </div>

          <div class="col-12 md:col-6 lg:col-4">
            <app-dropdown label="區域" controlName="location" [options]="location" optionLabel="label" optionValue="value"
              [control]="queryForm.controls.location" [submitted]="submitted"></app-dropdown>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="說明" controlName="illustrate" [control]="queryForm.controls.illustrate"
              [submitted]="submitted">
            </app-input-text>
          </div>
          <div class="col-12 md:col-6 lg:col-4">
            <app-input-text label="置放位置說明" controlName="Placementinstructions"
              [control]="queryForm.controls.Placementinstructions" [submitted]="submitted">
            </app-input-text>
          </div>

                label="中分類代碼"
                controlName="midCategoryCode"

                optionLabel="label"
                optionValue="value"
                [control]="queryForm.controls.midCategoryCode"
                [submitted]="submitted"
              ></app-dropdown>

      </form>
      <div *appHasPermission="queryPermission" class="col">
        <div class="grid justify-content-end">
          <app-button btnType="clear" (onClick)="onClearForm()"></app-button>
          <app-button btnType="query" (onClick)="onSubmitQuery(queryForm)" [loading]="loading"></app-button>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<div class="card">
  <div class="col-12">
    <app-data-table [data]="data" [columns]="columns" (edit)="onEdit($event)" (detail)="onDetail($event)">
    </app-data-table>
  </div>
</div>
