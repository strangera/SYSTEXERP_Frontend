<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
  </div>
  <p-panel [header]="formTitle | translate" class="line-height-3 m-0">
    <form [formGroup]="dataForm" id="dataForm" (ngSubmit)="onSubmit(dataForm)">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="錶號位置編號"
            controlName="meterPosCode "
            [control]="dataForm.controls.meterPosCode"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="樓層"
            controlName="floor"
            [options]="floor"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.floor"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <app-dropdown-item
            label="區域"
            controlName="area"
            [options]="area"
            optionLabel="label"
            optionValue="value"
            [control]="dataForm.controls.area"
            [submitted]="submitted"
          ></app-dropdown-item>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="流水號"
            controlName="SN"
            [control]="dataForm.controls.SN"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="平面圖X座標"
            controlName="xCoordinate"
            [control]="dataForm.controls.xCoordinate"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-input-text
            label="平面圖Y座標"
            controlName="yCoordinate"
            [control]="dataForm.controls.yCoordinate"
            [submitted]="submitted"
          >
          </app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text
            label="說明"
            controlName="desc"
            [control]="dataForm.controls.desc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          >
          </app-editor-text>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <app-editor-text
            label="置放位置說明"
            controlName="placementDesc"
            [control]="dataForm.controls.placementDesc"
            [style]="{ height: '100px' }"
            [submitted]="submitted"
          >
          </app-editor-text>
        </div>
      </div>

      <ng-container formArrayName="items">
        <ng-container
          *ngFor="let item of items.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="grid align-items-center">

          <hr />
        </ng-container>
      </ng-container>
      <div class="pt-1">
        <app-button-dynamicallyadd
          (click)="onAddItem()"
        ></app-button-dynamicallyadd>
      </div> -->
    </form>
    <div class="col pt-4">
      <div class="grid justify-content-end">
        <app-button-cancel (click)="onCancel()"></app-button-cancel>
        <app-button-submit
          (click)="submitForm(dataForm)"
          *ngIf="isFormEditable"
        ></app-button-submit>
      </div>
    </div>
  </p-panel>
</div>
