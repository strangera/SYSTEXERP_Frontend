<div class="card">
  <div class="grid align-items-center">
    <div class="col" style="flex: 1">
      <app-menubar [ProgNo]="ProgNo"></app-menubar>
    </div>
    <!-- <div *appHasPermission="addPermission">
          <app-button-create (click)="onCreate()" class="col"></app-button-create>
        </div> -->
  </div>
  <p-accordion>
    <p-accordionTab
      header="{{ 'query-conditions' | translate }}"
      [selected]="true"
      class="line-height-3 m-0"
      [headerStyleClass]="'query-accordionTab'"
    >
      <form
        [formGroup]="queryForm"
        id="queryForm"
        (ngSubmit)="onSubmit(queryForm)"
      >
        <div class="grid p-fluid">

              <div class="col-12 md:col-6 lg:col-4">
                <app-datemm-one
                  label="結算年月"
                  controlName="remark"
                  [control]="queryForm.controls.remark"
                  [submitted]="submitted"
                >
                </app-datemm-one>
              </div>

              <div class="col-12 md:col-6 lg:col-4">
                <app-dropdown-item
                  label="能源類型"
                  controlName="Energytype"
                  [options]="Energytype"
                  optionLabel="label"
                  optionValue="value"
                  [control]="queryForm.controls.Energytype"
                  [submitted]="submitted"
                ></app-dropdown-item>
              </div>
          
          </div>
        </form>
        <div *appHasPermission="queryPermission" class="col">
          <div class="grid justify-content-end">
            <app-button-clear (onClick)="onClearForm()"></app-button-clear>
            <app-button-query
              (onClick)="onSubmitQuery(queryForm)"
              [loading]="loading"
            ></app-button-query>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  
  <div class="card">
    <div class="col-12">
      <app-data-table
        [data]="data"
        [columns]="columns"
        (edit)="onEdit($event)"
        (detail)="onDetail($event)"
      >
      </app-data-table>
    </div>
  </div>
