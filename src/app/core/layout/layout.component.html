<app-progress-bar />
<div class="layout-wrapper" [ngClass]="containerClass()" *ngIf="user">
  <app-topbar (topMenuClick)="selectedTopMenuProgNo.set($event)"></app-topbar>
  <div #sidebarContainer class="px-0 pt-0 layout-sidebar w-full sm:w-24rem border-noround sm:border-round-xl">
    <div #scrollContent class="layout-sidebar-scroll-content flex w-full sticky top-0 z-5 pt-3 px-3 pb-2">
      <div class="flex flex-row justify-content-between align-items-center gap-2 w-full lg:flex-row-reverse">
        <button type="button" class="p-link" (click)="onToggleTheme()">
          <i class="pi text-2xl cursor-pointer transition-colors duration-300 hover:scale-110" [ngClass]="{
                        'pi-sun text-yellow-500 hover:text-yellow-300': !isDarkMode(),
                        'pi-moon text-blue-500 hover:text-blue-300': isDarkMode()
                    }"></i>
        </button>

        <button type="button" class="p-link layout-sidebar-close-button lg:hidden"
          (click)="layoutService.onOutsideClick()">
          <i class="pi pi-times text-2xl cursor-pointer" style="color: var(--text-color);"></i>
        </button>
      </div>
    </div>
    <app-menulist [activeTopMenuProgNo]="selectedTopMenuProgNo()"></app-menulist>
  </div>

  <div #layoutMainContainer class="layout-main-container mt-0">
    <div class="layout-main">
      <!-- <div *ngIf="loadingService.isLoading()" class="custom-loading-fixed-mask" [ngStyle]="loadingMaskStyle()">
        <div class="flex flex-column align-items-center">
          <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4"></p-progressSpinner>
          <span class="text-white mt-2 font-bold text-xl">正在執行中, 請稍候...</span>
        </div>
      </div> -->

      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="layout-mask" tabindex="0" role="button" aria-label="關閉側邊欄" (click)="layoutService.onOutsideClick()"
    (keydown.enter)="layoutService.onOutsideClick()"></div>
</div>
