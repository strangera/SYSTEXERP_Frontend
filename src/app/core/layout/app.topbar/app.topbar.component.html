<div #appTopbarDiv class="layout-topbar justify-content-between flex-wrap lg:flex-nowrap">
  <a class="layout-topbar-logo" pRipple>
    <img fetchpriority="high" loading="lazy" src="assets/layout/images/logo.webp" alt="logo">
    <span class="min-w-max">{{'management-platform-title' | translate}}</span>
  </a>

  <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
    (click)="layoutService.showProfileSidebar()">
    <i class="pi pi-ellipsis-v"></i>
  </button>
  <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
    <i class="pi pi-align-left"></i>
  </button>

  <div class="topbar-menu flex-grow-1 flex flex-row align-items-center">
    <ng-container *ngFor="let item of topLevelMenuItems()">
      <p-button [label]="item.prog_name" [rounded]="true" [text]="true" severity="secondary" [icon]="item.icon"
        (click)="onTopMenuItemClick(item)"
        [styleClass]="activeTopMenuItem()?.prog_No === item.prog_No ? 'active-top-menu-item' : ''"
        tooltipPosition="bottom" pTooltip="{{item.label}}">
      </p-button>
    </ng-container>
  </div>

  <div #topbarmenu class="layout-topbar-menu lg:flex lg:flex-column justify-content-center align-items-end"
    [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.isProfileSidebarVisible()}">

    <app-topbar-time />

    <div
      class="flex flex-column lg:flex-row align-items-stretch lg:align-items-center justify-content-center col-flex gap-2 lg:gap-0">

      <app-topbar-version />

      <app-topbar-search [funRightsWithLabel]="allFunRightsWithLabel()" (navigateSuccess)="onSearchNavigateSuccess()" />

      <app-topbar-favorites />

      <app-topbar-user [user]="user()" />

    </div>
  </div>
</div>
