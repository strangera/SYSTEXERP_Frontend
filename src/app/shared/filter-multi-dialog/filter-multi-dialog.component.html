<div class="filter-multi-dialog-container">
  <!-- 標題 Label，緊貼下方格子 -->
  <label class="font-bold dialog-label">{{ label }}</label>

  <!-- 主內容 -->
  <div class="flex flex-column">
    <div class="flex align-items-center">
      <!-- 顯示代碼的輸入框 -->
      <input type="text" pInputText [(ngModel)]="selectedValueMajor" placeholder="" disabled class="code-input" />
      <!-- 顯示名稱的輸入框 -->
      <input type="text" pInputText [(ngModel)]="selectedValueMinor" placeholder="" disabled class="name-input" />
      <!-- 放大鏡按鈕 -->
      <p-button icon="pi pi-search" class="search-button" (click)="showDialog()"></p-button>
    </div>
  </div>

  <p-dialog [header]="label" [(visible)]="visible" [modal]="true" class="w-full md:w-6 lg:w-4">
    <!-- 多列查詢框 -->
    <div class="flex flex-wrap gap-3 query-fields-container">
      <div *ngFor="let field of searchFields" class="field-container">
        <label>{{ field.placeholder }}</label>
        <input type="text" pInputText [formControl]="getFormControl(field.field)" placeholder="{{ field.placeholder }}"
          class="w-full" />
      </div>
    </div>

    <div class="flex gap-2">
      <p-button label="查詢" icon="pi pi-search" (click)="onSearch(dt1)"></p-button>
      <p-button label="清除" icon="pi pi-times" class="p-button-secondary" (click)="onClear(dt1)"></p-button>
    </div>

    <!-- 表格 -->
    <p-table #dt1 [value]="data" selectionMode="single" [(selection)]="selectedItem" (onRowSelect)="onRowSelect($event)"
      scrollable="true" scrollHeight="500px" styleClass="p-datatable-striped p-datatable-gridlines">
      <!-- 表頭 -->
      <ng-template pTemplate="header">
        <tr>
          <th *ngFor="let col of getVisibleColumns()">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <!-- 表身 -->
      <ng-template pTemplate="body" let-rowData>
        <tr [pSelectableRow]="rowData">
          <td *ngFor="let col of getVisibleColumns()">
            {{ rowData[col.field] }}
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-dialog>
</div>
