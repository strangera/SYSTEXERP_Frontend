<p-confirmDialog #cd>
  <ng-template pTemplate="headless" let-message>
    <div class="flex flex-column align-items-center p-5 surface-overlay border-round">
      <div *ngIf="showIcon || message.icon"
        class="border-circle bg-primary inline-flex justify-content-center align-items-center h-6rem w-6rem">
        <i class="pi pi-{{ message.icon || 'question' }} text-5xl"></i>
      </div>
      <span class="font-bold text-2xl block mb-2 mt-4">
        {{ message.header }}
      </span>
      <p class="mb-0" [innerHTML]="message.message"></p>
      <div class="w-full mb-4">
        <ng-container
          *ngTemplateOutlet="currentConfirmOpts?.contentTemplate || null; context: currentConfirmOpts?.templateContext">
        </ng-container>
      </div>
      <div class="flex align-items-center gap-2 mt-4">
        <p-button [title]="message.acceptLabel" [label]="message.acceptLabel" (click)="onConfirmAccept(cd)"
          severity="primary" styleClass="w-8rem">
        </p-button>

        <p-button *ngFor="let btn of extraButtons" [label]="btn.label" [severity]="btn.severity || 'secondary'"
          styleClass="w-8rem" (click)="onExtraButtonClick(btn)">
        </p-button>

        <p-button *ngIf="currentConfirmOpts?.showRejectButton !== false" [title]="message.rejectLabel"
          [label]="message.rejectLabel" (click)="cd.reject()" outlined="true" styleClass="w-8rem">
        </p-button>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>

<p-toast position="bottom-right" preventOpenDuplicates="true"
  [breakpoints]="{ '960px': { width: '100%', right: '0', left: '0' } }">
  <ng-template let-message pTemplate="headless" let-closeFn="closeFn">
    <div class="p-3 flex gap-3 relative">
      <i class="pi {{ getIcon(message.severity) }} text-2xl"></i>
      <div class="flex flex-column flex-1">
        <div class="font-bold text-lg">{{ message.summary }}</div>
        <div class="p-toast-detail" [innerHTML]="message.detail"></div>
      </div>
      <p-button [text]="true" [rounded]="true" [severity]="getSeverity(message.severity)" (onClick)="closeFn($event)">
        <i class="pi pi-times text-sm" (onClick)="closeFn($event)"></i>
      </p-button>
    </div>
  </ng-template>
</p-toast>



<p-dialog [header]="msgBoxHeader" [(visible)]="msgBoxDisplay" [modal]="true" [closeOnEscape]="true"
  [dismissableMask]="true" (onHide)="hideAndCleanMsgBox();" class="msg-box-dialog">
  <div class="msg-box-content">
    <pre>{{ msgBoxMessage }}</pre>
  </div>
  <ng-template pTemplate="footer">
    <button type="button" pButton icon="pi pi-check" iconPos="left" label="確定" (click)="hideAndCleanMsgBox();">
      <span class="sr-only">OK</span>
    </button>
  </ng-template>
</p-dialog>
