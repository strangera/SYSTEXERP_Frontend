<p-confirmDialog #cd>
  <ng-template pTemplate="headless" let-message>
    <div class="flex flex-column align-items-center p-5 surface-overlay border-round">
      <div class="border-circle bg-primary inline-flex justify-content-center align-items-center h-6rem w-6rem">
        <i class="pi pi-{{ message.icon }} text-5xl"></i>
      </div>
      <span class="font-bold text-2xl block mb-2 mt-4">
        {{ message.header }}
      </span>
      <p class="mb-0" [innerHTML]="message.message"></p>
      <div class="flex align-items-center gap-2 mt-4">
        <p-button title="確定" label="確定" (click)="cd.accept()" severity="primary" styleClass="w-8rem">
        </p-button>
        <p-button title="取消" label="取消" (click)="cd.reject()" outlined="true" styleClass="w-8rem ">
        </p-button>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>

<p-toast position="top-right" preventOpenDuplicates="true"
  [breakpoints]="{ '960px': { width: '100%', right: '0', left: '0' } }"></p-toast>

<p-dialog [header]="msgBoxHeader" [(visible)]="msgBoxDisplay" [modal]="true" [closeOnEscape]="true"
  [dismissableMask]="true" (onHide)="hideAndCleanMsgBox();" class="msg-box-dialog">
  <div class="msg-box-content">
    <pre>{{ msgBoxMessage }}</pre>
  </div>
  <ng-template pTemplate="footer">
    <button type="button" pButton icon="pi pi-check" iconPos="left" label="確定" (click)="hideAndCleanMsgBox();">
      <span class="sr-only">OK</span>
    </button>
  </ng-template>
</p-dialog>
