<div class="relative w-full">
  <div class="w-full overflow-x-auto whitespace-nowrap scrollbar-inner">
    <p-breadcrumb class="inline-block min-w-max w-full"
      [model]="customBreadcrumbItems.length ? customBreadcrumbItems : breadcrumbItems" [home]="home">
      <ng-template pTemplate="item" let-item>
        <div class="cursor-pointer" [routerLink]="item.url">
          <span class="text-sm font-semibold text-gray-700 dark:text-gray-200"
            [ngClass]="noProgNo ? 'text-red-500' : ''">
            {{ item.label }}
          </span>
          <i *ngIf="item.isLast && !noProgNo"
            [class]="isFavorite ? 'pi pi-star-fill text-yellow-400' : 'pi pi-star text-color'"></i>
        </div>
      </ng-template>
    </p-breadcrumb>
  </div>
</div>
