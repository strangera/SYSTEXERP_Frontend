@if (lines()) {
    <div class="flex gap-2">
        @if (lines()!.line1) {
            <div class="flex-1 border-bottom-2 border-400 text-sm pb-5">{{ lines()!.line1 }}</div>
        }
        @if (lines()!.line2) {
            <div class="flex-1 border-bottom-2 border-400 text-sm pb-5">{{ lines()!.line2 }}</div>
        }
        @if (lines()!.line3) {
            <div class="flex-1 border-bottom-2 border-400 text-sm pb-5">{{ lines()!.line3 }}</div>
        }
        @if (lines()!.line4) {
            <div class="flex-1 border-bottom-2 border-400 text-sm pb-5">{{ lines()!.line4 }}</div>
        }
        @if (lines()!.line5) {
            <div class="flex-1 border-bottom-2 border-400 text-sm pb-5">{{ lines()!.line5 }}</div>
        }
    </div>
}
