<label [for]="controlName">
  {{ label }}
  <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
</label>
<textarea [id]="controlName" [formControl]="control" [readonly]="readonly"
  [placeholder]="control.disabled || readonly ? '' : fieldState.placeholder" [minlength]="fieldState.minLength" [maxlength]="fieldState.maxLength"
  [rows]="rows" cols="30" [autoResize]="true" [ngClass]="{ 'ng-invalid ng-dirty': submitted && control.errors }"
  pInputTextarea [attr.aria-label]="label || fieldState.placeholder" title="{{ label || fieldState.placeholder }}" [class]="textareaClasses"
  appEnterToTab></textarea>
@if ((submitted || (control.touched && control.invalid)) && fieldState.getErrorMessage(control); as msg) {
  <div class="text-red-600 text-sm">{{ msg }}</div>
}
