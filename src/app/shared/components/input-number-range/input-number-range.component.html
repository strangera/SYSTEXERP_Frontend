<div class="flex" style="height: 18px">
  <label class="col p-0 m-0 pr-2" [for]="startControlName">
    {{ label === "" ? startLabel : label + descLabel }}
    <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
  </label>
  <div class="col-fixed py-0">
    <span class="text-center"></span>
  </div>
  <label class="col p-0 m-0" [hidden]="label!==''" [for]="endControlName">{{ endLabel }}
    <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
  </label>
</div>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-number-start">
      <app-input-number class="w-full" [controlName]="startControlName" [control]="startControl" [submitted]="submitted"
        [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits" [useGrouping]="useGrouping"
        [mode]="mode" [suffix]="suffix" [step]="step" [showButtons]="showButtons" [allowUnlimited]="allowUnlimited"
        (changeEvent)="onStartInputChange($event)" (blurEvent)="onStartBlur($event)"></app-input-number>
    </p-inputGroup>
  </div>
  <div class="flex flex-column justify-content-center align-items-center pt-3" [ngStyle]="{ 'height': '33.56px' }">
    <span class="text-center" [ngStyle]="{ 'line-height': '2.8' }">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-number-end">
      <app-input-number class="w-full" [controlName]="endControlName" [control]="endControl" [submitted]="submitted"
        [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits" [useGrouping]="useGrouping"
        [mode]="mode" [suffix]="suffix" [step]="step" [showButtons]="showButtons" [allowUnlimited]="allowUnlimited"
        (changeEvent)="onEndInputChange($event)" (blurEvent)="onEndBlur($event)"></app-input-number>
    </p-inputGroup>
  </div>
</div>
