<label [for]="controlName">{{ label }}
  <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
</label>
<p-editor *ngIf="!control.disabled" [id]="controlName" [formControl]="control" [style]="{ height: '500px' }"
  (onTextChange)="onTextChange($event)" (onInit)="onInit($event)" [readonly]="control.disabled"
  [placeholder]="control.disabled ? '' : fieldState.placeholder" [modules]="modules" appEnterToTab>
</p-editor>
<p-editor *ngIf="control.disabled" [id]="controlName" [formControl]="control" [style]="{ height: '500px' }"
  [readonly]="control.disabled" [placeholder]="control.disabled ? '' : fieldState.placeholder" [modules]="{}" appEnterToTab>
</p-editor>

@if ((submitted || (control.touched && control.invalid)) && fieldState.getErrorMessage(control); as msg) {
  <div class="text-red-600 text-sm">{{ msg }}</div>
}
