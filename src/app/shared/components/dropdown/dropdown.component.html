<label [hidden]="!showLabel || label === ''" [for]="controlName">
  {{ label }}
  <span *ngIf="control.hasValidator(Validators.required)" class="text-red-500">*</span>
  <ng-content select="header"></ng-content>
</label>

<ng-container *ngIf="!readonly; else readonlyMode">
  <div class="relative w-full" (focusout)="onComponentBlur($event)">

    <p-dropdown #dd styleClass="w-full" [styleClass]="editable ? 'w-full editable-dropdown-hide-label' : 'w-full'"
      [id]="controlName" [formControl]="control" [attr.aria-describedby]="controlName"
      panelStyleClass="editable-dropdown-panel" [placeholder]="editable ? '' : (customPlaceholder || fieldState.placeholder)"
      [options]="options" [optionLabel]="optionLabel" [optionValue]="optionValue" [showClear]="showClear"
      [filterBy]="filterBy || optionLabel" [autofocusFilter]="false"
      [ngClass]="{ 'ng-dirty ng-invalid': submitted && control.errors }" (onHide)="onDropdownHide()"
      [dropdownIcon]="control.disabled ? 'hidden' : 'pi pi-angle-down'" (onChange)="onDropdownChange($event)"
      [dataKey]="optionValue" appendTo="body" [resetFilterOnHide]="true" [virtualScroll]="options.length > 10"
      [virtualScrollItemSize]="40" [scrollHeight]="'250px'" [editable]="false" [loading]="loading" [filter]="filter"
      appEnterToTab [group]="group">

      <ng-template let-options pTemplate="item">
        <div class="flex align-items-center gap-2">
          <div> {{ templateLabel !== "" ? options[templateLabel] : options[optionLabel] }} </div>
        </div>
      </ng-template>
      <ng-template let-group pTemplate="group">
        <div class="flex align-items-center">
          <span>{{ group.label }}</span>
        </div>
      </ng-template>
    </p-dropdown>

    <input *ngIf="editable" [disabled]="control.disabled" type="text"
      class="absolute top-0 left-0 h-full border-none bg-transparent pl-3 disabled-input-style"
      [style.width]="control.disabled ? '100%' : 'calc(100% - 4.5rem)'" [style.z-index]="control.disabled ? '10' : '1'"
      style="outline: none;border-radius: 6px;" [value]="selectedOptionLabel"
      [placeholder]="customPlaceholder || fieldState.placeholder" (input)="onNativeInput($event)"
      (focus)="onNativeInputFocus($event)" (click)="$event.stopPropagation(); !control.disabled && dd.show()"
      (keydown)="onInputKeyDown($event)" appEnterToTab />
  </div>
</ng-container>

<ng-template #readonlyMode>
  <div class="readonly-dropdown">
    <input type="text" [id]="controlName" [value]="selectedOptionLabel" [placeholder]="customPlaceholder || fieldState.placeholder"
      [class]="dropdownClasses" [ngClass]="{ 'ng-dirty ng-invalid': submitted && control.errors }" pInputText
      readonly />
  </div>
</ng-template>

@if (showErrorMessage && (submitted || (control.touched && control.invalid)) && fieldState.getErrorMessage(control, errorForGroup); as msg) {
  <div class="text-red-600 text-sm">{{ msg }}</div>
}
<small *ngIf="helpMsg || showErrorMessage" [id]="controlName"> {{helpMsg}} </small>
