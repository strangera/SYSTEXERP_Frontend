<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-dropdown [id]="controlName" [formControl]="control" [placeholder]="placeholder" [options]="options" [autoDisplayFirst]="true" [optionLabel]="optionLabel" [optionValue]="optionValue" [ngClass]="{'is-invalid': submitted && control.errors}">
</p-dropdown>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>
