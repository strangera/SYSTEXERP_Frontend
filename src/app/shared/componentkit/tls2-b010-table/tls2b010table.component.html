<p-divider align="left" type="solid" *ngIf="title" styleClass="pb-2">
  <span class="text-center text-xl font-bold text-primary">{{ title }}</span>
</p-divider>

<p-blockUI [target]="dt" [blocked]="disabled"></p-blockUI>

<p-table
  #dt
  [value]="data"
  [columns]="selectedColumns"
  [(selection)]="selectedItems"
  sortMode="multiple"
  [selectionMode]="showCheckBox && IsPrint ? selectionMode : null"
  [dataKey]="dataKey"
  [rowTrackBy]="trackByRow"
  [resizableColumns]="true"
  [reorderableColumns]="true"
  (onColReorder)="onColReorder($event)"
  [paginator]="showPaginator && IsPrint && !rowEditing && !loading"
  [scrollable]="scrollable"
  [showCurrentPageReport]="IsPrint && showPaginator"
  [multiSortMeta]="multiSortMeta"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [scrollHeight]="scrollHeight"
  [rows]="rows"
  [first]="first"
  (onPage)="onPageChange($event)"
  (onLazyLoad)="loadDataLazy($event)"
  [lazy]="lazy || !IsPrint"

  tableStyleClass="h-full"
  [styleClass]="'p-datatable-sm p-datatable-striped' 
                + (IsPrint ? ' p-datatable-gridlines' : '') 
                + ' table-font-md'"

  [virtualScroll]="!IsPrint && groupRowsByArray.length === 0"
  [virtualScrollItemSize]="35"
  [virtualScrollDelay]="250"

  currentPageReportTemplate="第{currentPage}頁 / 總共{totalPages}頁 (總筆數:{totalRecords})"
  (selectionChange)="onSelectionChange($event)"
  (onRowSelect)="select.emit($event)"
  (onRowUnselect)="unSelect.emit($event)"
  [rowSelectable]="rowSelectableWrapper"
  [loading]="loading && data.length === 0"

  paginatorDropdownAppendTo="body"
  editMode="row"
  [groupRowsBy]="groupRowsByArray.length ? groupRowsByArray : undefined"
  [rowGroupMode]="groupRowsByArray.length ? 'subheader' : undefined"
>
  <!-- ===== Caption / 工具列 ===== -->
  <ng-template pTemplate="caption">
    <div class="grid align-items-center justify-content-between mx-0" *ngIf="showCaption && !rowEditing">
      <div class="caption-left button-group flex gap-2 py-2">
        <!-- 欄位過濾 -->
        <p-multiSelect
          *ngIf="showFilter"
          [options]="columns"
          [(ngModel)]="selectedColumns"
          optionLabel="header"
          dropdownIcon="pi pi-cog"
          pTooltip="過濾欄位"
          tooltipPosition="top"
          (onChange)="onHeaderFilterChange($event)"
        />
        <!-- 報表模式 -->
        <p-button
          [icon]="IsPrint ? 'pi pi-file' : 'pi pi-times'"
          [rounded]="true"
          *ngIf="showReportMode && data.length > 0"
          (click)="toggleVisibility()"
          [pTooltip]="IsPrint ? '報表模式' : '關閉報表模式'"
          tooltipPosition="top"
          [outlined]="!IsPrint"
          [disabled]="!canPerformAction('50')"
        />
        <!-- 報表/匯出（非報表模式） -->
        <div [@toggleButtons]="!IsPrint ? 'visible' : 'hidden'" [ngClass]="IsPrint ? 'hidden' : 'flex'" class="gap-2">
          <p-button
            tooltipPosition="top"
            pTooltip="列印PDF"
            class="p-button-rounded p-button-text p-button-info"
            icon="fa-regular fa-file-pdf"
            (click)="customReport ? exportEvent.emit('PDF') : export('PDF')"
            [disabled]="!canPerformAction('60')">
          </p-button>

          <p-button
            tooltipPosition="top"
            pTooltip="匯出Excel"
            class="p-button-rounded p-button-text p-button-info"
            icon="fa-regular fa-file-lines"
            (click)="customReport ? exportEvent.emit('Excel') : export('Excel')"
            [disabled]="!canPerformAction('70')">
          </p-button>
        </div>

        <!-- 新增 / 刪除 -->
        <p-button
          *ngIf="IsPrint && showInsert && !rowEditing && !disabled"
          (click)="insertRow()"
          pTooltip="新增"
          tooltipPosition="top"
          icon="pi pi-plus"
          severity="success"
          class="p-button-rounded p-button-text"
          [disabled]="insertDisabled">
        </p-button>
        <p-button
          *ngIf="IsPrint && showDelete && !rowEditing && !disabled"
          (click)="deleteRow(selectedItems)"
          [pTooltip]="deletepTooltip"
          tooltipPosition="top"
          [icon]="deleteIcon"
          severity="danger"
          class="p-button-text"
          [rounded]="true"
          [disabled]="selectedItems?.length <= 0">
        </p-button>
      </div>

      <!-- 置中自訂 header -->
      <div *ngIf="IsPrint" class="flex-grow-1 p-2">
        <ng-content select="header"></ng-content>
      </div>

      <!-- 右側：匯出/分頁下拉 -->
      <div *ngIf="IsPrint" class="flex gap-2 py-2">
        <!-- 匯出 / 匯入 Excel -->
        <div *ngIf="showExcel" class="flex gap-2 align-items-center">
          <p-button
            *ngIf="showExcelExport"
            label="匯出excel範本"
            severity="success"
            [icon]="exportExcelLoading ? 'pi pi-spin pi-spinner' : 'pi pi-file-export'"
            (click)="onExportExcel()"
          />
          <p-fileUpload
            *ngIf="showExcelImport"
            #fileUpload
            styleClass="p-button-info"
            mode="basic"
            chooseIcon="pi pi-file-import"
            accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            severity="info"
            (onSelect)="onImportExcel($event)"
            [auto]="true"
            chooseLabel="Excel匯入"
          />
          <p-button
            *ngIf="showCustomExcelImport"
            severity="info"
            label="Excel匯入"
            [icon]="'pi pi-file-import'"
            (click)="onImportExcel()"
          />
        </div>

        <!-- 右上分頁下拉（與 paginator 同步） -->
        <p-dropdown
          *ngIf="showPage && IsPrint && dt.totalRecords > 0"
          [options]="pages"
          [ngModel]="selectedPage"
          optionValue="value"
          (onChange)="goToPage($event.value)"
          appendTo="body"
          [virtualScroll]="true"
          [virtualScrollItemSize]="40"
          [filter]="true"
          [style]="{ minWidth: '10rem' }"
        />
      </div>
    </div>
  </ng-template>

  <!-- ===== 單列表頭 ===== -->
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th class="w-1rem">序號</th>

      <th class="w-1rem"
          *ngIf="IsPrint && showCheckBox && !rowEditing && selectionMode === 'multiple'">
        <p-tableHeaderCheckbox [disabled]="disabled"></p-tableHeaderCheckbox>
      </th>

      <!-- Left 固定欄 -->
      <th
        *ngFor="let col of leftFixedHeaderColumns; trackBy: trackByCol"
        class="text-center wrap-header"
        pReorderableColumn
        pResizableColumn
        pFrozenColumn
        [frozen]="IsPrint && (col.frozen ?? false)"
        [alignFrozen]="col.alignFrozen || 'right'"
        [pSortableColumn]="showSort && !rowEditing ? col.sortField ?? col.field : undefined"
        [pSortableColumnDisabled]="!showSort || rowEditing || col.showSort === false"
        [style.minWidth]="getColMinWidth(col)">
        {{ col.header }} <span *ngIf="col.required" class="required">*</span>
        <p-sortIcon
          *ngIf="showSort && !rowEditing && col.showSort !== false && data.length"
          [field]="col.sortField ?? col.field">
        </p-sortIcon>
      </th>

      <!-- 其他欄位 -->
      <th
        *ngFor="let col of headerRow1Columns; trackBy: trackByCol"
        class="text-center wrap-header"
        pReorderableColumn
        pResizableColumn
        pFrozenColumn
        [frozen]="IsPrint && (col.frozen ?? false)"
        [alignFrozen]="col.alignFrozen || 'right'"
        [pSortableColumn]="showSort && !rowEditing ? col.sortField ?? col.field : undefined"
        [pSortableColumnDisabled]="!showSort || rowEditing || col.showSort === false"
        [style.minWidth]="getColMinWidth(col)">
        {{ col.header }} <span *ngIf="col.required" class="required">*</span>
        <p-sortIcon
          *ngIf="showSort && !rowEditing && col.showSort !== false && data.length"
          [field]="col.sortField ?? col.field">
        </p-sortIcon>
      </th>

      <!-- 管理欄 -->
      <th
        *ngIf="!alwaysEdit || (alwaysEdit && rowEditing)"
        [hidden]="!IsPrint || !showManage"
        class="w-1rem text-center"
        alignFrozen="right"
        pFrozenColumn
        [frozen]="IsPrint">
        管理
      </th>
    </tr>
  </ng-template>

  <!-- ===== 群組列頭占位（保留群組功能） ===== -->
  <ng-template pTemplate="rowgroupheader" let-rowData let-columns="columns">
    <tr class="p-rowgroup-header">
      <td [attr.colspan]="getVisibleHeaderCount"></td>
    </tr>
  </ng-template>

  <!-- ===== 單列 BODY ===== -->
  <ng-template
    pTemplate="body"
    let-rowIndex="rowIndex"
    let-rowData
    let-columns="columns"
    let-editing="editing">

    <tr
      #htmlTableRowElement
      [attr.data-key]="rowData[dataKey]"
      [pSelectableRow]="rowData"
      [pSelectableRowIndex]="rowIndex"
      [pEditableRow]="rowData"
      [ngClass]="{ 'p-disabled-row': !isRowSelectable(rowData) }"
      (click)="itemClick.emit(rowData)">

      <td class="text-center">
        {{ rowIndex + 1 }}
      </td>

      <td *ngIf="IsPrint && showCheckBox && !rowEditing && selectionMode === 'multiple'">
        <p-tableCheckbox
          class="flex justify-content-center pointer-events-none"
          [pSelectableRow]="rowData"
          [value]="rowData"
          [disabled]="!isRowSelectable(rowData) || disabled"/>
      </td>

      <!-- Left 固定欄 -->
      <td
        *ngFor="let col of leftFixedHeaderColumns; trackBy: trackByCol"
        class="text-center"
        [ngClass]="col.style"
        [alignFrozen]="col.alignFrozen || 'right'"
        pFrozenColumn
        [frozen]="IsPrint && (col.frozen ?? false)"
        [style.minWidth]="getColMinWidth(col)">
        <span *ngIf="!col.type">
          {{ col.format ? col.format(rowData[col.field]) : rowData[col.field] }}
        </span>
      </td>

      <!-- 其他欄位 -->
      <td
        *ngFor="let col of headerRow1Columns; trackBy: trackByCol"
        class="text-center"
        [ngClass]="col.style"
        [alignFrozen]="col.alignFrozen || 'right'"
        pFrozenColumn
        [frozen]="IsPrint && (col.frozen ?? false)"
        [style.minWidth]="getColMinWidth(col)"
        (click)="editing ? $event.stopPropagation() : null"
        (dblclick)="detailRow(rowData)">
        <span *ngIf="!col.type">
          {{ col.format ? col.format(rowData[col.field]) : rowData[col.field] }}
        </span>
      </td>

      <!-- 管理欄 -->
      <td
        *ngIf="!alwaysEdit || (alwaysEdit && rowEditing)"
        [hidden]="!IsPrint || !showManage"
        [ngClass]="{'flex justify-content-center gap-2': IsPrint && showManage}"
        class="no-wrap icon-button"
        alignFrozen="right"
        pFrozenColumn
        [frozen]="IsPrint"
        [style.text-align]="'center'">
        <p-button *ngIf="showDetail" icon="pi pi-search" text pTooltip="檢視" tooltipPosition="top"
                  (click)="detailRow(rowData)"></p-button>
        <p-button *ngIf="showEdit" icon="pi pi-pencil" text severity="warning" pTooltip="編輯"
                  tooltipPosition="top" [disabled]="editDisabled(rowData)"
                  (click)="editRow(rowData)"></p-button>
        <ng-container *ngFor="let b of addButton">
          <p-button [icon]="b.icon" [label]="b.label" [severity]="b.severity"
                    [text]="b.text !== false" (click)="onSelectButton({ rowData, button: b })"></p-button>
        </ng-container>
      </td>
    </tr>
  </ng-template>

  <!-- ===== 載入中骨架 ===== -->
  <ng-template pTemplate="loadingbody" let-columns="columns">
    <tr style="height: 35px">
      <td *ngFor="let _ of [].constructor(getVisibleHeaderCount)">
        <p-skeleton />
      </td>
    </tr>
  </ng-template>

  <!-- ===== 空資料 ===== -->
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="getVisibleHeaderCount">
        <div class="flex justify-content-center align-items-center min-h-full p-2 font-bold text-xl">
          {{ emptyMessage }}
        </div>
      </td>
    </tr>
  </ng-template>

  <!-- ===== Summary Slot（純顯示，不含合計） ===== -->
  <ng-template pTemplate="summary">
    <div *ngIf="showFooter && IsPrint" class="p-2 font-semibold table-footer">
      <ng-content select="footer"></ng-content>
    </div>
  </ng-template>
</p-table>

<!-- 匯出對話框 -->
<app-tls2b010table-export
  [visible]="exportDialog"
  header="列印選項"
  (visibleChange)="exportDialog = $event"
  (save)="exportStatus === 'PDF' ? exportPDFDownload($event, selectedColumns, apiUrl)
                                  : exportExcelDownload($event, selectedColumns, apiUrl)"
  [exportStatus]="exportStatus">
</app-tls2b010table-export>
