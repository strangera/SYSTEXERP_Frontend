<div class="card">
  <p-table [value]="formArray.controls" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of columns" style="min-width: 150px;">{{ col.header }}</th>
        <th style="width: 100px;">操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-control let-rowIndex="rowIndex">
      <tr [formGroup]="control">
        <td *ngFor="let col of columns">
          <ng-container [ngSwitch]="col.type">
            <!-- 下拉選單 -->
            <app-dropdown *ngSwitchCase="'dropdown'" [controlName]="col.field"
              [options]="dropdownOptions[col.field] || []" optionLabel="label" optionValue="value"
              [control]="getControl(rowIndex, col.field)" [submitted]="submitted" [showClear]="true"></app-dropdown>
            <!-- 文字輸入 -->
            <app-input-text *ngSwitchCase="'text'" [controlName]="col.field" [control]="getControl(rowIndex, col.field)"
              [submitted]="submitted" [readonly]="col.readonly"></app-input-text>
            <!-- 數字輸入 -->
            <app-input-number *ngSwitchCase="'number'" [controlName]="col.field"
              [control]="getControl(rowIndex, col.field)" [submitted]="submitted"
              [useGrouping]="false"></app-input-number>
            <!-- 日期選擇 -->
            <app-calendar *ngSwitchCase="'calendar'" [controlName]="col.field" calendarType="dateOne"
              [control]="getControl(rowIndex, col.field)" [submitted]="submitted"></app-calendar>
          </ng-container>
        </td>
        <td>
          <app-button-dynamicallydelete (click)="onRemoveRow(rowIndex)"
            [crudstatus]="'edit'"></app-button-dynamicallydelete>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div class="pt-2">
    <app-button-dynamicallyadd label="新增位置" (click)="onAddRow()"></app-button-dynamicallyadd>
  </div>
</div>
