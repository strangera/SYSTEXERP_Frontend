<div class="grid p-fluid">
  <ng-container *ngFor="let field of fieldsConfig">
    <div class="col pb-0">
      <ng-container *ngIf="field.mainDataField; else elseBlock">
        <label [for]="field.field">{{ field.header }}
          <span *ngIf="isRequired" class="text-red-500">*</span>
        </label>
        <p-autoComplete [formControl]="control" [id]="field.field" [optionLabel]="optionLabel"
          (click)="op.toggle($event)" (input)="onInputChange();op.hide()" (onFocus)="op.toggle($event)"
          [suggestions]="suggestions" [optionValue]="optionValue" [placeholder]="control.disabled ? '' : placeholder">
          <ng-template let-options pTemplate="item">
            <div class="flex align-items-center gap-2">
              <div>{{ templateLabel !== '' ? options[templateLabel] : options[optionLabel] }}</div>
            </div>
          </ng-template>
        </p-autoComplete>
        <app-control-messages [onerror]="submitted || (control.touched && control.invalid)"
          [control]="control"></app-control-messages>
      </ng-container>
      <ng-template #elseBlock>
        <label for="{{ field.field }}">{{ field.header }}</label>
        <input type="text" pInputText [disabled]="true" [value]="getFieldValue(field)" [disabled]="true" />
      </ng-template>
    </div>
  </ng-container>
</div>

<p-overlayPanel #op [style]="{'max-width': '700px'}" [appendTo]="'body'">
  <form [formGroup]="formGroup" class="grid p-fluid">
    <ng-content />
    <app-table class="col-12" [dataKey]="optionValue" [data]="dialogData" [selectedItems]="selectedItems"
      (select)="onSelectionChange($event)" [columns]="dialogColumns" [showHeader]="false" [showPage]="false"
      [showCheckBox]="true" selectionMode="single" [showManage]="false" scrollHeight="200px" [loading]="loading"
      [multiSortMeta]="[{ field: optionValue, order: -1 }]" [totalRecords]="totalRecords"
      (lazyLoadData)="onLazyLoadData($event, formGroup)" [lazy]="lazy" [showCaption]="false" />
  </form>
</p-overlayPanel>
