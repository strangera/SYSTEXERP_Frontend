<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-toggleButton [formControl]="control" [onLabel]="onLabel" [offLabel]="offLabel" [styleClass]="styleClass" [ariaLabel]="ariaLabel" [ngClass]="{'ng-invalid ng-dirty': control.invalid && (submitted || control.touched)}">
</p-toggleButton>
