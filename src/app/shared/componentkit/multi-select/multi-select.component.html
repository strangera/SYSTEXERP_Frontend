<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-multiSelect [id]="controlName" [options]="options" [optionLabel]="optionLabel" [optionValue]="optionValue" [formControl]="control" [ngClass]="{'is-invalid': submitted && control.errors}">
</p-multiSelect>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>
