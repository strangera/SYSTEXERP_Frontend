<div class="container">
  <label for="addressResult">地址</label>

  <!-- 使用表格來對齊輸入框和按鈕 -->
  <table style="width: 100%; border-collapse: collapse;">
    <tr>
      <td style="width: 100%; padding-right: 10px;">
        <input
          type="text"
          id="addressResult"
          [value]="addressResult"
          readonly
          placeholder="請填寫地址"
        />
      </td>
      <td style="width: auto;">
        <!-- 獨立樣式的按鈕 -->
        <button
          pButton
          type="button"
          icon="pi pi-home"
          class="icon-button address-btn"
          (click)="openAddressForm()">
        </button>
      </td>
    </tr>
  </table>

  <!-- 浮動視窗 -->
  <div class="modal" [class.show]="showModal" (click)="onCancel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>填寫地址</h3>

      <!-- 縣市下拉選單 -->
      <div>
        <label for="city">縣市</label>
        <select id="city" [(ngModel)]="address.city" (change)="onCityChange()">
          <option value="" disabled selected>選擇縣市</option>
          <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
        </select>
      </div>

      <!-- 鄉鎮市區下拉選單 -->
      <div>
        <label for="district">鄉鎮市區</label>
        <select id="district" [(ngModel)]="address.district">
          <option value="" disabled selected>選擇鄉鎮市區</option>
          <option *ngFor="let district of districts" [value]="district">{{ district }}</option>
        </select>
      </div>

      <!-- 詳細地址輸入框 -->
      <div>
        <label for="detail">詳細地址</label>
        <input
          type="text"
          id="detail"
          [(ngModel)]="address.detail"
          placeholder="輸入詳細地址"
        />
      </div>

      <!-- 動作按鈕 -->
      <div class="form-actions">
        <button (click)="onSave()">確定</button>
        <button (click)="onCancel()">取消</button>
        <button (click)="onClear()">清除</button>
      </div>
    </div>
  </div>
</div>
