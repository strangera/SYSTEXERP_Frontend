<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-inputGroup>
    <input hidden [id]="controlName" type="text" [formControl]="control" [(ngModel)]="selectedValueID" [ngClass]="{'is-invalid': submitted && control.errors}" pInputText />
    <input type="text" [(ngModel)]="selectedValueType" pInputText disabled />
    <input type="text" [(ngModel)]="selectedValueMajor" pInputText disabled />
    <input type="text" [(ngModel)]="selectedValueMinor" pInputText disabled />
    <p-button icon="pi pi-times" severity="secondary" (click)="clearAllInputs()" />
    <p-button icon="pi pi-search" severity="secondary" (click)="showDialog()" />
</p-inputGroup>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>

<p-dialog header="三層式查詢" [(visible)]="visible" [modal]="true">
    <p-table>
        <ng-template pTemplate="caption">
            <!-- 顯示路徑 -->
            <div *ngIf="selectedType || selectedSystem" class="p-pt-3">
                <p>{{ selectedType?.type }} > {{ selectedSystem?.name }}</p>
            </div>
            <!-- 搜尋內容 -->
            <div class="flex justify-content-between flex-column sm:flex-row">
                <span class="p-input-icon-left mb-2">
                <i class="pi pi-search"></i>
                <input pInputText type="text" #filter (input)="onGlobalFilter($event)" placeholder="Search Keyword" class="w-full"/>
            </span>
            </div>
        </ng-template>
    </p-table>

    <!-- 類別選擇表格 -->
    <p-table #dt1 *ngIf="!selectedType" (onRowSelect)="onTypeSelect($event)" [value]="filteredCategories" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>類別名稱</th>
                <th>類別代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-category>
            <tr [pSelectableRow]="category">
                <td>{{ category.type }}</td>
                <td>{{ category.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- 系統選擇表格 -->
    <p-table #dt2 *ngIf="selectedType && !selectedSystem" (onRowSelect)="onSystemSelect($event)" [value]="selectedType.systems" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>上層</th>
                <th>系統名稱</th>
                <th>系統代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-system>
            <tr [pSelectableRow]="system">
                <td>{{ selectedType?.type }} ></td>
                <td>{{ system.name }}</td>
                <td>{{ system.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- 子系統選擇表格 -->
    <p-table #dt3 *ngIf="selectedSystem" (onRowSelect)="onRowSelect($event)" [value]="selectedSystem.names" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>上層</th>
                <th>子系統名稱</th>
                <th>子系統代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item">
                <td>{{ selectedType?.type }} > {{ selectedSystem?.name }} ></td>
                <td>{{ item.name }}</td>
                <td>{{ item.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Footer 按鈕 -->
    <ng-template pTemplate="footer">
        <p-button icon="pi pi-arrow-left" (click)="selectedSystem ? goBackToSystems() : goBackToCategories()" label="上一層" severity="secondary"></p-button>
        <p-button icon="pi pi-times" (click)="visible = false" label="取消" severity="secondary"></p-button>
    </ng-template>
</p-dialog>
