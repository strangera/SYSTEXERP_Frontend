<label [hidden]="!showLabel || label === ''" [for]="controlName">
  {{ label }}
  <span *ngIf="isRequired" class="text-red-500">*</span>
  <ng-content select="header"></ng-content>
</label>

<ng-container *ngIf="!readonly; else readonlyMode">
  <p-calendar
    [formControl]="control"
    [id]="controlName"
    [placeholder]="control.disabled ? '' : customPlaceholder || placeholder"
    [timeOnly]="timeOnly"
    [showTime]="showTime"
    [hourFormat]="hourFormat"
    [showSeconds]="showSeconds"
    [view]="view"
    [dateFormat]="dateFormat"
    [ngClass]="{ 'ng-invalid ng-dirty': submitted && control.errors }"
    [iconDisplay]="'input'"
    [keepInvalid]="true"
    [showIcon]="!control.disabled"
    [minDate]="minDate"
    [maxDate]="maxDate"
    [appendTo]="'body'"
    (onClose)="onClose()"
    (onInput)="onInput($event)"
    (onSelect)="calendarEvent.emit($event)"
    (onBlur)="onBlur($event)"
    (keydown.enter)="handleEnterKey($event)"
    [maxlength]="maxLength"
  >
    <ng-template pTemplate="inputicon" let-clickCallBack="clickCallBack">
      <i *ngIf="timeOnly" class="pi pi-clock pointer-events-none"></i>
      <i *ngIf="!timeOnly" class="pi pi-calendar pointer-events-none"></i>
    </ng-template>
  </p-calendar>
</ng-container>

<ng-template #readonlyMode>
  <app-readonly-calendar-display
    [control]="control"
    [calendarType]="calendarType"
    [showSeconds]="showSeconds"
    [placeholder]="placeholder"
    [submitted]="submitted"
    [controlName]="controlName"
  ></app-readonly-calendar-display>
</ng-template>

<app-control-messages
  [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control"
></app-control-messages>

<small *ngIf="helpMsg || showErrorMessage" [id]="controlName">
  {{ helpMsg }}
</small>
