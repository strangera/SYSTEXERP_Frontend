<div class="selection-container">
    <!-- 父類別選擇區 -->
    <div class="parent-selection">
        <label [for]="controlName">{{ parentLabel }}
            <span *ngIf="isRequired" class="required">*</span>
        </label>
        <p-inputGroup>
            <input hidden [id]="controlName" type="text" [formControl]="control" [(ngModel)]="selectedValueID" 
                   [ngClass]="{'is-invalid': submitted && control.errors}" pInputText />
            <input type="text" [(ngModel)]="selectedValueMajor" pInputText disabled placeholder="主系統代碼" />
            <input type="text" [(ngModel)]="selectedValueMinor" pInputText disabled placeholder="主系統名稱" />
            <p-button icon="pi pi-times" severity="secondary" (click)="clearSubInputs(true)" />
            <p-button icon="pi pi-search" severity="secondary" (click)="showDialog()" />
        </p-inputGroup>
    </div>

    <!-- 子類別選擇區 -->
    <div class="child-selection">
        <label [for]="controlName">{{ subLabel }}
            <span *ngIf="isRequired" class="required">*</span>
        </label>
        <p-inputGroup>
            <input hidden [id]="controlName" type="text" [formControl]="control" [(ngModel)]="selectedSubValueID" 
                   [ngClass]="{'is-invalid': submitted && control.errors}" pInputText />
            <input type="text" [(ngModel)]="selectedSubValueMajor" pInputText disabled placeholder="子系統代碼" />
            <input type="text" [(ngModel)]="selectedSubValueMinor" pInputText disabled placeholder="子系統名稱" />
            <p-button icon="pi pi-times" [disabled]="!selectedItem" severity="secondary" (click)="clearSubInputs()" />
            <p-button icon="pi pi-search" [disabled]="!selectedItem" severity="secondary" (click)="showSubDialog()" />
        </p-inputGroup>
    </div>
</div>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>

<!-- 父類別選擇對話框 -->
<p-dialog [(visible)]="visible" modal="true" header="選擇主系統" [style]="{width: '400px'}" (onHide)="visible = false">
    <p-table #dt1 [value]="filteredParent" selectionMode="single" [(selection)]="selectedItem" (onRowSelect)="onRowSelect($event)">
        <ng-template pTemplate="caption">
            <div class="flex justify-content-between flex-column sm:flex-row">
                <span class="p-input-icon-left mb-2">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Search Keyword" class="w-full"/>
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th>系統代碼</th>
                <th>系統名稱</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item">
                <td>{{ item.code }}</td>
                <td>{{ item.name }}</td>
            </tr>
        </ng-template>
    </p-table>
    <ng-template pTemplate="footer">
        <p-button icon="pi pi-times" (click)="visible = false" label="取消" severity="secondary"></p-button>
    </ng-template>
</p-dialog>

<!-- 子類別選擇對話框 -->
<p-dialog [(visible)]="visible2" modal="true" header="選擇子系統" [style]="{width: '400px'}" (onHide)="visible2 = false">
    <p-table #dt2 [value]="filteredParent" selectionMode="single" [(selection)]="selectedSubItem" (onRowSelect)="onRowSelectSub($event)">
        <ng-template pTemplate="caption">
            <div class="flex justify-content-between flex-column sm:flex-row">
                <span class="p-input-icon-left mb-2">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" #subFilter (input)="onGlobalFilterSub(dt2, $event)" placeholder="Search Subsystem" class="w-full"/>
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th>子系統代碼</th>
                <th>子系統名稱</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-subItem>
            <tr [pSelectableRow]="subItem">
                <td>{{ subItem.code }}</td>
                <td>{{ subItem.name }}</td>
            </tr>
        </ng-template>
    </p-table>
    <ng-template pTemplate="footer">
        <p-button icon="pi pi-times" (click)="visible2 = false" label="取消" severity="secondary"></p-button>
    </ng-template>
</p-dialog>
