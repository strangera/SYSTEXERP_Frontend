<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="text-red-500">*</span>
</label>
<p-editor *ngIf="!control.disabled" [id]="controlName" [formControl]="control" [style]="{ height: '500px' }"
  (onTextChange)="onTextChange($event)" (onInit)="onInit($event)" [readonly]="control.disabled"
  [placeholder]="control.disabled ? '' : placeholder" [modules]="modules" (keydown.enter)="handleEnterKey($event)">
</p-editor>
<p-editor *ngIf="control.disabled" [id]="controlName" [formControl]="control" [style]="{ height: '500px' }"
  [readonly]="control.disabled" [placeholder]="control.disabled ? '' : placeholder" [modules]="{}"
  (keydown.enter)="handleEnterKey($event)">
</p-editor>

<app-control-messages [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control"></app-control-messages>
