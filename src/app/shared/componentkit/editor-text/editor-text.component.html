<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-editor [id]="controlName" [formControl]="control" [style]="{ height: '300px' }"
  [styleClass]="submitted && control.errors|| control.touched && control.errors ? 'ng-invalid ng-dirty' : ''"
  (onTextChange)="onTextChange($event)" (onInit)="onInit($event)" [readonly]="control.disabled"
  [placeholder]="control.disabled ? '' : placeholder" [modules]="modules">
</p-editor>

<app-control-messages [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control"></app-control-messages>
