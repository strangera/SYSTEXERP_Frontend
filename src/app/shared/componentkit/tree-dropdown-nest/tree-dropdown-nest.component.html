<div class="card flex justify-content-center">
  <p-button
    (onClick)="op.toggle($event)"
    icon="pi pi-share-alt"
    label="{{ TitleButtonName }}"
  />
  <p-overlayPanel #op [appendTo]="'body'">
    <div class="flex flex-column gap-3 w-25rem">
      <span class="font-medium text-900 block mb-2">{{ TitleName }}</span>

      <div class="font-bold mb-2 flex gap-4">
        <ng-container *ngFor="let col of treeNodes; let i = index">
          <span
            tabindex="0"
            (click)="expandToLevel(i + 1)"
            (keydown)="onKeyDownExpand($event, i + 1)"
            role="button"
            class="cursor-pointer text-primary"
          >
            {{ col }}
          </span>
          <span *ngIf="i < treeNodes.length - 1">/</span>
        </ng-container>
      </div>

      <!-- <p-tree
        [value]="treeData"
        selectionMode="checkbox"
        [(selection)]="selectedMembers"
        (selectionChange)="onSelectionChange($event)"
        [filter]="true"
        filterPlaceholder="Strict Filter"
        [propagateSelectionUp]="true"
        [propagateSelectionDown]="true"
      ></p-tree> -->

      <p-tree
        [value]="treeData"
        selectionMode="checkbox"
        [(selection)]="selectedMembers"
        (selectionChange)="onSelectionChange($event)"
        [filter]="true"
        filterPlaceholder="Strict Filter"
        [propagateSelectionUp]="true"
        [propagateSelectionDown]="true"
      >
        <ng-template let-node pTemplate="default">
          <span
            [ngClass]="{
              'selectable-node': node.selectable,
              'unselectable-node': !node.selectable,
            }"
          >
            {{ node.label }}
          </span>
        </ng-template>
      </p-tree>

      <div class="flex flex-wrap gap-2 mb-6">
        <p-button
          label="全選"
          icon="pi pi-check-square"
          (click)="selectAll()"
        />
        <p-button
          label="取消全選"
          icon="pi pi-times"
          (click)="clearSelection()"
        />
        <p-button
          label="確定"
          icon="pi pi-users"
          (onClick)="sendTreeSelect()"
          class="align-self-end"
        />
      </div>
    </div>
  </p-overlayPanel>
</div>
