<div class="card flex justify-content-center">
    <p-button (onClick)="op.toggle($event)" icon="pi pi-share-alt" label="Share" />
    <p-overlayPanel #op>
        <div class="flex flex-column gap-3 w-25rem">
            <!-- 選擇框 -->
            <div>
                <span class="font-medium text-900 block mb-2">Select Members</span>
                <div class="flex flex-column gap-3 w-25rem">
                    <p-multiSelect [options]="flattenMembers(members)" [(ngModel)]="selectedMembers" optionLabel="name"
                        placeholder="Select members" display="chip" class="w-full" panelClass="custom-panel"
                        [filter]="true" filterBy="name,email,phone" [style]="{'display': 'flex'}">
                        <ng-template let-member pTemplate="item">
                            <div class="flex flex-column">
                                <span>{{ member.name }}</span>
                                <small class="text-color-secondary">{{ member.email }}</small>
                                <small class="text-color-secondary">{{ member.phone }}</small>
                            </div>
                        </ng-template>
                    </p-multiSelect>
                    <p-button label="確定" icon="pi pi-users" (onClick)="inviteMembers()" class="align-self-end" />
                </div>
            </div>

            <!-- 顯示 Team Members -->
            <ul class="list-none p-0 m-0 flex flex-column gap-3">
                <li *ngFor="let dept of members" class="flex flex-column gap-2">
                    <div class="clickable-item font-bold text-primary pl-1" tabindex="0" (click)="toggleSelection(dept)"
                        (keydown)="onKeyDown($event, dept)"
                        [ngClass]="{'bg-primary-reverse': isAnyMemberSelected(dept)}">
                        <i class="pi pi-folder-open mr-2"></i>{{ dept.department }}
                    </div>
                    <ul class="list-none p-0 m-0 flex flex-column gap-2 pl-4 border-left-2 border-gray-300">
                        <li *ngFor="let role of dept.roles" class="flex flex-column gap-2">
                            <div class="clickable-item font-medium text-900 pl-1" tabindex="0"
                                (click)="toggleSelection(role)" (keydown)="onKeyDown($event, role)"
                                [ngClass]="{'bg-primary-reverse': isAnyMemberSelected(role)}">
                                <i class="pi pi-users mr-2 text-sm"></i>{{ role.role }}
                            </div>
                            <ul class="list-none p-0 m-0 flex flex-column gap-2 pl-4 border-left-1 border-gray-200">
                                <li *ngFor="let member of role.members"
                                    class="clickable-item flex align-items-center gap-2 pl-1"
                                    (click)="toggleSelection(member)" (keydown)="onKeyDown($event, member)" tabindex="0"
                                    [ngClass]="{'selected': isAnyMemberSelected(member)}">
                                    <i class="pi pi-user text-sm mr-2 text-gray-500"></i>
                                    <div>
                                        <span class="font-medium">{{ member.name }}</span>
                                        <div class="text-sm text-color-secondary">{{ member.email }}</div>
                                        <div class="text-sm text-color-secondary">{{ member.phone }}</div>
                                    </div>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </p-overlayPanel>
</div>
