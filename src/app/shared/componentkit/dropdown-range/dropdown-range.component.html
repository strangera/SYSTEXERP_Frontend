<div class="flex" style="height: 18px;">
  <label class="col p-0 m-0 pr-2" [for]="startControlName">{{ label === '' ? startLabel : label +
    '(起迄)' }}
    <span *ngIf="isRequired" class="text-red-500">*</span>
  </label>
  <div class="col-fixed py-0">
    <span class="text-center"></span>
  </div>
  <label class="col p-0 m-0" [hidden]="label!==''" [for]="endControlName">{{ endLabel }}
    <span *ngIf="isRequired" class="text-red-500">*</span>
  </label>
</div>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-text-start">
      <app-dropdown class="w-full" [controlName]="startControlName" [options]="options" [optionLabel]="optionLabel"
        [optionValue]="optionValue" [control]="startControl" [submitted]="submitted"
        (changeEvent)="onStartDropdownChange($event)" />
    </p-inputGroup>
  </div>
  <div class="flex flex-column justify-content-center align-items-center pt-3" [ngStyle]="{ 'height': '33.56px' }">
    <span class="text-center" [ngStyle]="{ 'line-height': '2.8' }">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-text-end">
      <app-dropdown class="w-full" [controlName]="endControlName" [options]="options" [optionLabel]="optionLabel"
        [optionValue]="optionValue" [control]="endControl" [submitted]="submitted"
        (changeEvent)="onEndDropdownChange($event)" [errorForGroup]="errorForGroup" />
    </p-inputGroup>
  </div>
</div>
