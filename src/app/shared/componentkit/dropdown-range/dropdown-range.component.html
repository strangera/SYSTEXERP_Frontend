<label [hidden]="!showLabel || label===''" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
  <ng-content select="header"></ng-content>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-text-start">
      <app-dropdown class="w-full" [label]="startLabel || ''" [controlName]="startControlName" [options]="options"
        [optionLabel]="optionLabel" [optionValue]="optionValue" [control]="startControl" [submitted]="submitted"
        (changeEvent)="onStartDropdownChange($event)" />
    </p-inputGroup>
  </div>
  <div class="flex justify-content-center align-items-center"
    [ngStyle]="{ 'margin-top': startLabel ? '27px' : '7px', 'height': '43px' }">
    <span class="text-center">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-text-end">
      <app-dropdown class="w-full" [label]="endLabel || ''" [controlName]="endControlName" [options]="options"
        [optionLabel]="optionLabel" [optionValue]="optionValue" [control]="endControl" [submitted]="submitted"
        (changeEvent)="onEndDropdownChange($event)" />
    </p-inputGroup>
  </div>
</div>
