<label [hidden]="!showLabel || label===''" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-inputGroup id="input-number">
  <ng-container *ngIf="minValue === null; else inputNumber">
    <p-inputNumber [inputId]="controlName" [title]="label" [name]="label" [formControl]="control"
      [placeholder]="customPlaceholder || placeholder" [showButtons]="showButtons" [max]="max || maxValue" [step]="step"
      [useGrouping]="useGrouping" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
      [ngClass]="{'ng-dirty ng-invalid': submitted && control.errors}" [mode]="mode" [maxlength]="maxLength"
      (onInput)="onInputChange($event)" />
  </ng-container>
  <ng-template #inputNumber>
    <p-inputNumber [inputId]="controlName" [title]="label" [name]="label" [formControl]="control"
      [placeholder]="customPlaceholder || placeholder" [showButtons]="showButtons" [min]="min || minValue"
      [max]="max || maxValue" [step]="step" [useGrouping]="useGrouping" [minFractionDigits]="minFractionDigits"
      [maxFractionDigits]="maxFractionDigits" [ngClass]="{'ng-dirty ng-invalid': submitted && control.errors}"
      [mode]="mode" [maxlength]="maxLength" (onInput)="onInputChange($event)" />
  </ng-template>
  <p-inputGroupAddon *ngIf="suffix">{{ suffix }}</p-inputGroupAddon>
</p-inputGroup>
<app-control-messages [hidden]="!showErrorMessage" [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control"></app-control-messages>
