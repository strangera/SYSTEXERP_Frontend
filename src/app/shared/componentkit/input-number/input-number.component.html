<label [hidden]="!showLabel" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-inputGroup id="input-number">
  <p-inputNumber *ngIf="min === null; else inputNumber" [id]="controlName" [formControl]="control"
    [placeholder]="customPlaceholder || placeholder" [showButtons]="showButtons" [max]="max" [step]="step"
    [useGrouping]="useGrouping" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
    [ngClass]="{'ng-dirty ng-invalid': submitted && control.errors}" [mode]="mode"
    [incrementButtonClass]="incrementButtonClass" [decrementButtonClass]="decrementButtonClass"
    (onInputChange)="onInputChange($event)" (onBlur)="onBlur($event)" />
  <ng-template #inputNumber>
    <p-inputNumber [id]="controlName" [formControl]="control" [placeholder]="customPlaceholder || placeholder"
      [showButtons]="showButtons" [min]="min" [max]="max" [step]="step" [useGrouping]="useGrouping"
      [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
      [ngClass]="{'ng-dirty ng-invalid': submitted && control.errors}" [mode]="mode"
      [incrementButtonClass]="incrementButtonClass" [decrementButtonClass]="decrementButtonClass"
      (onInputChange)="onInputChange($event)" (onBlur)="onBlur($event)" />
  </ng-template>
  <p-inputGroupAddon *ngIf="suffix">{{ suffix }}</p-inputGroupAddon>
</p-inputGroup>
<app-control-messages [hidden]="!showErrorMessage" [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control"></app-control-messages>
