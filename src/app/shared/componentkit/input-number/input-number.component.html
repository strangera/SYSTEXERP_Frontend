<label [hidden]="!showLabel || label === ''" [for]="controlName">
  {{ label }}
  <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
  <ng-content select="header"></ng-content>
</label>
<p-inputGroup id="input-number">
  <ng-container *ngIf="fieldState.minValue === null; else inputNumber">
    <p-inputNumber [inputId]="controlName" [title]="label" [name]="label" [formControl]="control" [readonly]="readonly"
      [disabled]="disabled" [placeholder]="customPlaceholder ? customPlaceholder:
        control.disabled || readonly ? '' : fieldState.placeholder
      " [showButtons]="showButtons" [max]="allowUnlimited ? null : (max || fieldState.maxValue)" [step]="step"
      [useGrouping]="useGrouping" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
      [ngClass]="inputNumberClasses" [mode]="mode" [attr.maxlength]="allowUnlimited ? null : fieldState.maxLength"
      (onInput)="onInputChange($event)" (onBlur)="onBlur($event)" [pTooltip]="customPlaceholder || fieldState.placeholder"
      tooltipPosition="bottom" [pKeyFilter]="keyFilter" appEnterToTab />
  </ng-container>
  <ng-template #inputNumber>
    <p-inputNumber [inputId]="controlName" [title]="label" [name]="label" [formControl]="control" [readonly]="readonly"
      [disabled]="disabled" [placeholder]=" customPlaceholder ? customPlaceholder:
        control.disabled || readonly ? '' : fieldState.placeholder
      " [showButtons]="showButtons" [min]="min || fieldState.minValue" [max]="allowUnlimited ? null : (max || fieldState.maxValue)"
      [step]="step" [useGrouping]="useGrouping" [minFractionDigits]="minFractionDigits"
      [maxFractionDigits]="maxFractionDigits" [ngClass]="inputNumberClasses" [mode]="mode"
      [attr.maxlength]="allowUnlimited ? null : fieldState.maxLength" (onInput)="onInputChange($event)" (onBlur)="onBlur($event)"
      [pTooltip]="customPlaceholder || fieldState.placeholder" tooltipPosition="bottom" [pKeyFilter]="keyFilter"
      appEnterToTab />
  </ng-template>
  <p-inputGroupAddon *ngIf="suffix">{{ suffix }}</p-inputGroupAddon>
</p-inputGroup>
@if (showErrorMessage && (submitted || (control.touched && control.invalid)) && fieldState.getErrorMessage(control); as msg) {
  <div class="text-red-600 text-sm">{{ msg }}</div>
}
