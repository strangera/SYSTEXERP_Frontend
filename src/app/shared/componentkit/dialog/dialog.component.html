<div class="grid p-fluid">
  <ng-container *ngFor="let field of fieldsConfig">
    <div class="col pb-0">
      <ng-container *ngIf="field.mainDataField; else elseBlock">
        <label [for]="field.field">{{ field.header }}<span *ngIf="isRequired" class="required">*</span></label>
        <p-autoComplete [formControl]="control" [id]="field.field" [suggestions]="filteredOptions"
          (completeMethod)="filterOptions($event)" [optionLabel]="optionLabel" [optionValue]="optionValue"
          (onFocus)="op.show($event)" (input)="onInputChange($event)" (input)="op.hide()" [showClear]="true"
          [lazy]="true" [suggestions]="suggestions"></p-autoComplete>
        <app-control-messages [onerror]="submitted || (control.touched && control.invalid)"
          [control]="control"></app-control-messages>
      </ng-container>
      <ng-template #elseBlock>
        <label for="{{ field.field }}">{{ field.header }}</label>
        <input type="text" pInputText [disabled]="true" [value]="getFieldValue(field)" [disabled]="true" />
      </ng-template>
    </div>
  </ng-container>
</div>

<p-overlayPanel #op>
  <div class="flex flex-column gap-3">
    <ng-content />
  </div>
</p-overlayPanel>
