<label [for]="controlName">{{ label }}
    <span *ngIf="isRequired" class="required">*</span>
  </label>
<p-inputGroup>
    <input hidden [id]="controlName" type="text" [formControl]="control" [(ngModel)]="selectedValueID" [ngClass]="{'is-invalid': submitted && control.errors}" pInputText />
    <input type="text" [(ngModel)]="selectedValueType" pInputText disabled />
    <input type="text" [(ngModel)]="selectedValueMajor" pInputText disabled />
    <input type="text" [(ngModel)]="selectedValueMinor" pInputText disabled />
    <p-button icon="pi pi-times" severity="secondary" (click)="clearAllInputs()" />
    <p-button icon="pi pi-search" severity="secondary" (click)="showDialog()" />
</p-inputGroup>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>

<p-dialog header="三層式查詢" [(visible)]="visible" [modal]="true">
    <!-- 搜尋內容 -->
    <ng-template pTemplate="caption">
        <div class="flex justify-content-between flex-column sm:flex-row">
            <span class="p-input-icon-left mb-2">
                <i class="pi pi-search"></i>
                <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Search Keyword" class="w-full"/>
            </span>
        </div>
    </ng-template>
    <!-- 類別選擇表格 -->
    <p-table #dt1 (onRowSelect)="onTypeSelect($event)" [value]="filteredCategories" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>類別名稱</th>
                <th>類別代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-category>
            <tr [pSelectableRow]="category">
                <td>{{ category.type }}</td>
                <td>{{ category.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- 系統選擇表格（當選擇類別後顯示） -->
    <p-table #dt2 (onRowSelect)="onSystemSelect($event)" [value]="filteredSystems" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>系統名稱</th>
                <th>系統代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-system>
            <tr [pSelectableRow]="system">
                <td>{{ system.name }}</td>
                <td>{{ system.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- 最後的名稱選擇表格（當選擇系統後顯示） -->
    <p-table #dt3 (onRowSelect)="onRowSelect($event)" [value]="filteredNames" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="header">
            <tr>
                <th>子系統名稱</th>
                <th>子系統代號</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item">
                <td>{{ item.name }}</td>
                <td>{{ item.code }}</td>
            </tr>
        </ng-template>
    </p-table>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-arrow-left" (click)="selectedSystem ? goBackToSystems() : goBackToCategories()" label="上一層" severity="secondary"></p-button>
        <p-button icon="pi pi-times" (click)="visible = false" label="取消" severity="secondary"></p-button>
    </ng-template>
</p-dialog>
