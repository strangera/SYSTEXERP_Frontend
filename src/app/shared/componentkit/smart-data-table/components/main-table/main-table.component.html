<!-- shared/componentkit/smart-data-table/components/main-table/main-table.component.html -->

<p-table
  #dt
  [value]="data"
  [columns]="visibleColumns"
  [(selection)]="selectedItems"
  [dataKey]="config.dataKey || 'id'"
  [rowTrackBy]="trackByFn"
  [paginator]="config.paginator !== false"
  [rows]="rows"
  [(first)]="first"
  (onPage)="onPageChange($event)"
  [totalRecords]="totalRecords"
  [selectionMode]="config.selectionMode"
  (selectionChange)="onSelectionChange($event)"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  [expandedRowKeys]="expandedRows"
  (onRowExpand)="onRowToggle($event)"
  (onRowCollapse)="onRowToggle($event)"
  [loading]="loading"
  [responsive]="config.responsive !== false"
  styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines main-table"
  [ngClass]="{ 'table-readonly': config.readonly }"
>
  <!-- 表格標頭 -->
  <ng-template pTemplate="header">
    <tr>
      <!-- 序號欄 -->
      <th class="sequence-column">序號</th>

      <!-- 選擇欄 -->
      <th *ngIf="showCheckboxColumn" class="checkbox-column">
        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
      </th>

      <!-- 展開欄 -->
      <th *ngIf="showExpandColumn" class="expand-column">展開</th>

      <!-- 資料欄位 -->
      <th
        *ngFor="let col of visibleColumns; trackBy: trackByFn"
        [ngStyle]="getColumnStyle(col)"
        [class]="'column-' + col.field"
      >
        {{ col.header }}
      </th>

      <!-- 操作欄 -->
      <th *ngIf="showActionColumn" [ngStyle]="getActionColumnStyle()">操作</th>
    </tr>
  </ng-template>

  <!-- 表格內容 -->
  <ng-template
    pTemplate="body"
    let-rowData
    let-rowIndex="rowIndex"
    let-expanded="expanded"
  >
    <tr
      [ngClass]="{
        'editing-row': isRowEditing(rowIndex),
        'expanded-row': expanded,
        'readonly-row': config.readonly,
      }"
    >
      <!-- 序號欄 -->
      <td class="sequence-cell">
        {{ first + rowIndex + 1 }}
      </td>

      <!-- 選擇欄 -->
      <td *ngIf="showCheckboxColumn" class="checkbox-cell">
        <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
      </td>

      <!-- 展開欄 -->
      <td *ngIf="showExpandColumn" class="expand-cell">
        <button
          type="button"
          pButton
          pRipple
          [pRowToggler]="rowData"
          [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
          class="p-button-text p-button-rounded expand-button"
          [ngClass]="{ 'expanded-button': expanded }"
        ></button>
      </td>

      <!-- 資料欄位 -->
      <td
        *ngFor="let col of visibleColumns; trackBy: trackByFn"
        [ngStyle]="getColumnStyle(col)"
        [class]="'cell-' + col.field"
        [ngClass]="{
          'editing-cell': isRowEditing(rowIndex) && isColumnEditable(col),
          'readonly-cell': !isColumnEditable(col),
        }"
      >
        <app-table-cell
          [value]="getCellValue(rowData, col)"
          [column]="col"
          [rowData]="rowData"
          [isEditing]="isRowEditing(rowIndex)"
          [readonly]="config.readonly || !isColumnEditable(col)"
          (valueChange)="onCellValueChange($event, rowData, col, rowIndex)"
        ></app-table-cell>
      </td>

      <!-- 操作欄 -->
      <td
        *ngIf="showActionColumn"
        class="action-cell"
        [ngStyle]="getActionColumnStyle()"
      >
        <div class="action-buttons">
          <!-- 🔧 修復編輯按鈕 - 完全複製原版邏輯 -->
          <!-- 編輯按鈕 -->
          <button
            *ngIf="!isRowEditing(rowIndex)"
            pButton
            pRipple
            type="button"
            icon="pi pi-pencil"
            pTooltip="編輯"
            tooltipPosition="top"
            class="action-button edit-button"
            (click)="onRowEditStart(rowData, rowIndex)"
            [disabled]="loading || editingRowIndex !== null"
          ></button>

          <!-- 確認/儲存按鈕 -->
          <button
            *ngIf="isRowEditing(rowIndex)"
            pButton
            pRipple
            type="button"
            icon="pi pi-check"
            pTooltip="確認"
            tooltipPosition="top"
            class="action-button save-button"
            (click)="onRowEditSave(rowData, rowIndex)"
            [disabled]="loading"
          ></button>

          <!-- 取消按鈕 -->
          <button
            *ngIf="isRowEditing(rowIndex)"
            pButton
            pRipple
            type="button"
            icon="pi pi-times"
            pTooltip="取消"
            tooltipPosition="top"
            class="action-button cancel-button"
            (click)="onRowEditCancel(rowData, rowIndex)"
            [disabled]="loading"
          ></button>
        </div>
      </td>
    </tr>
  </ng-template>

  <!-- 行展開內容 -->
  <ng-template pTemplate="rowexpansion" let-rowData let-rowIndex="rowIndex">
    <tr>
      <td [attr.colspan]="totalColumnCount" class="expansion-cell">
        <div class="expansion-content">
          <!-- 這裡會放置 DetailTableComponent -->
          <ng-content select="[slot=detail]"></ng-content>

          <!-- 如果沒有自定義內容，顯示預設訊息 -->
          <div
            *ngIf="!config.expandedContentTemplate"
            class="default-expansion-content"
          >
            <p>展開內容將在此顯示</p>
            <pre>{{ rowData | json }}</pre>
          </div>
        </div>
      </td>
    </tr>
  </ng-template>

  <!-- 空資料訊息 -->
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="totalColumnCount" class="empty-message-cell">
        <div class="empty-message-content">
          <i class="pi pi-info-circle empty-icon"></i>
          <span class="empty-text">{{ emptyMessage }}</span>
        </div>
      </td>
    </tr>
  </ng-template>

  <!-- 載入中訊息 -->
  <ng-template pTemplate="loadingbody">
    <tr>
      <td [attr.colspan]="totalColumnCount" class="loading-cell">
        <div class="loading-content">
          <i class="pi pi-spin pi-spinner loading-icon"></i>
          <span class="loading-text">載入中...</span>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
