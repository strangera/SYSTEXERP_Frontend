<!-- shared/componentkit/smart-data-table/components/detail-table/detail-table.component.html -->

<div class="detail-table-container">
  <!-- 詳細資料工具列 -->
  <div *ngIf="hasToolbarContent" class="detail-table-toolbar">
    <!-- 左側區域 -->
    <div class="detail-toolbar-left">
      <!-- 分頁按鈕組 -->
      <div
        *ngIf="showDetailTabs && detailTabOptions.length > 0"
        class="detail-tab-buttons"
      >
        <div class="tab-button-group">
          <button
            *ngFor="let tab of detailTabOptions; trackBy: trackByDetailFn"
            pButton
            pRipple
            type="button"
            [label]="tab.label"
            [ngClass]="{
              'p-button-primary': currentTabId === tab.id,
              'p-button-outlined p-button-secondary': currentTabId !== tab.id,
            }"
            class="p-button-sm tab-button"
            (click)="onTabChange(tab.id)"
            [disabled]="loading"
          ></button>
        </div>
      </div>

      <!-- 新增詳細資料按鈕 -->
      <button
        *ngIf="showAddButton"
        pButton
        pRipple
        type="button"
        icon="pi pi-plus"
        pTooltip="新增詳細資料"
        tooltipPosition="top"
        severity="success"
        class="p-button-rounded detail-add-button"
        (click)="onAddDetailItem()"
        [disabled]="loading"
      ></button>

      <!-- 批次刪除詳細資料按鈕 -->
      <button
        *ngIf="showBatchDeleteButton"
        pButton
        pRipple
        type="button"
        icon="pi pi-trash"
        [pTooltip]="
          '批次刪除詳細資料' +
          (selectedDetailItems.length > 0
            ? ' (' + selectedDetailItems.length + ')'
            : '')
        "
        tooltipPosition="top"
        severity="danger"
        class="p-button-rounded detail-delete-button"
        [ngClass]="{ 'p-button-outlined': isBatchDeleteDisabled }"
        [disabled]="isBatchDeleteDisabled"
        (click)="onBatchDeleteDetail()"
      ></button>

      <!-- 自定義左側內容 -->
      <ng-content select="[detail-header-left]"></ng-content>
    </div>

    <!-- 右側區域 -->
    <div class="detail-toolbar-right">
      <!-- 自定義右側內容 -->
      <ng-content select="[detail-header-right]"></ng-content>
    </div>
  </div>

  <!-- 詳細資料表格 -->
  <p-table
    #detailTable
    [value]="detailData"
    [columns]="visibleColumns"
    [(selection)]="selectedDetailItems"
    [dataKey]="config.dataKey || 'id'"
    [rowTrackBy]="trackByDetailFn"
    [selectionMode]="config.readonly ? null : 'multiple'"
    (selectionChange)="onDetailSelectionChange($event)"
    (onRowSelect)="onDetailSelect($event)"
    (onRowUnselect)="onDetailUnselect($event)"
    [loading]="loading"
    [responsive]="config.responsive !== false"
    styleClass="p-datatable-sm detail-table"
    [ngClass]="{ 'detail-table-readonly': config.readonly }"
  >
    <!-- 詳細資料表格標頭 -->
    <ng-template pTemplate="header">
      <tr>
        <!-- 序號欄 -->
        <th class="detail-sequence-column">序號</th>

        <!-- 選擇欄 -->
        <th *ngIf="showCheckboxColumn" class="detail-checkbox-column">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>

        <!-- 資料欄位 -->
        <th
          *ngFor="let col of visibleColumns; trackBy: trackByDetailFn"
          [ngStyle]="getColumnStyle(col)"
          [class]="'detail-column-' + col.field"
        >
          {{ col.header }}
        </th>

        <!-- 操作欄 -->
        <th *ngIf="!config.readonly" class="detail-action-column">操作</th>
      </tr>
    </ng-template>

    <!-- 詳細資料表格內容 -->
    <ng-template pTemplate="body" let-detailData let-detailIndex="rowIndex">
      <tr
        [ngClass]="{
          'detail-editing-row': isDetailEditing(detailIndex),
          'detail-readonly-row': config.readonly,
        }"
      >
        <!-- 序號欄 -->
        <td class="detail-sequence-cell">
          {{ detailIndex + 1 }}
        </td>

        <!-- 選擇欄 -->
        <td *ngIf="showCheckboxColumn" class="detail-checkbox-cell">
          <p-tableCheckbox [value]="detailData"></p-tableCheckbox>
        </td>

        <!-- 資料欄位 -->
        <td
          *ngFor="let col of visibleColumns; trackBy: trackByDetailFn"
          [ngStyle]="getColumnStyle(col)"
          [class]="'detail-cell-' + col.field"
          [ngClass]="{
            'detail-editing-cell':
              isDetailEditing(detailIndex) && isColumnEditable(col),
            'detail-readonly-cell': !isColumnEditable(col),
          }"
        >
          <app-table-cell
            [value]="getDetailCellValue(detailData, col)"
            [column]="col"
            [rowData]="detailData"
            [isEditing]="isDetailEditing(detailIndex)"
            [readonly]="config.readonly || !isColumnEditable(col)"
            (valueChange)="
              onDetailCellValueChange($event, detailData, col, detailIndex)
            "
          ></app-table-cell>
        </td>

        <!-- 操作欄 -->
        <td *ngIf="!config.readonly" class="detail-action-cell">
          <div class="detail-action-buttons">
            <!-- 編輯按鈕 -->
            <button
              *ngIf="!isDetailEditing(detailIndex)"
              pButton
              pRipple
              type="button"
              icon="pi pi-pencil"
              pTooltip="編輯詳細資料"
              tooltipPosition="top"
              class="p-button-rounded p-button-text detail-action-button detail-edit-button"
              (click)="onDetailEditStart(detailData, detailIndex)"
              [disabled]="loading"
            ></button>

            <!-- 儲存按鈕 -->
            <button
              *ngIf="isDetailEditing(detailIndex)"
              pButton
              pRipple
              type="button"
              icon="pi pi-check"
              pTooltip="儲存詳細資料"
              tooltipPosition="top"
              class="p-button-rounded p-button-text p-button-success detail-action-button detail-save-button"
              (click)="onDetailEditSave(detailData, detailIndex)"
              [disabled]="loading"
            ></button>

            <!-- 取消按鈕 -->
            <button
              *ngIf="isDetailEditing(detailIndex)"
              pButton
              pRipple
              type="button"
              icon="pi pi-times"
              pTooltip="取消編輯"
              tooltipPosition="top"
              class="p-button-rounded p-button-text p-button-danger detail-action-button detail-cancel-button"
              (click)="onDetailEditCancel(detailData, detailIndex)"
              [disabled]="loading"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- 詳細資料空資料訊息 -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td
          [attr.colspan]="totalDetailColumnCount"
          class="detail-empty-message-cell"
        >
          <div class="detail-empty-message-content">
            <i class="pi pi-info-circle detail-empty-icon"></i>
            <span class="detail-empty-text">{{ detailEmptyMessage }}</span>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- 詳細資料載入中訊息 -->
    <ng-template pTemplate="loadingbody">
      <tr>
        <td [attr.colspan]="totalDetailColumnCount" class="detail-loading-cell">
          <div class="detail-loading-content">
            <i class="pi pi-spin pi-spinner detail-loading-icon"></i>
            <span class="detail-loading-text">載入詳細資料中...</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
