<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <label *ngIf="startLabel" for="input-number-range">{{ startLabel }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <p-inputGroup id="input-number-start">
      <p-inputNumber id="input-number-range" [formControl]="startControl" [placeholder]="placeholder"
        [showButtons]="showButtons" [min]="minBoundary" [max]="maxBoundary" [step]="step" [useGrouping]="useGrouping"
        [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
        [ngClass]="{'ng-dirty ng-invalid': submitted && startControl.errors}" [mode]="mode"
        [incrementButtonClass]="incrementButtonClass" [decrementButtonClass]="decrementButtonClass" />
      <p-inputGroupAddon *ngIf="suffix">{{ suffix }}</p-inputGroupAddon>
    </p-inputGroup>
  </div>
  <div class="flex" [ngClass]="startLabel ?'pt-4':''">
    <span class="align-self-center text-center " [ngClass]="startLabel ?'pt-1':''">~</span>
  </div>
  <div class="col pb-0">
    <label *ngIf="endLabel" for="input-text-range">{{ endLabel }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <p-inputGroup id="input-number-end">
      <p-inputNumber id="input-number-range" [formControl]="endControl" [placeholder]="placeholder2"
        [showButtons]="showButtons" [min]="minBoundary" [max]="maxBoundary" [step]="step" [useGrouping]="useGrouping"
        [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
        [ngClass]="{'ng-dirty ng-invalid': submitted && endControl.errors}" [mode]="mode"
        [incrementButtonClass]="incrementButtonClass" [decrementButtonClass]="decrementButtonClass" />
      <p-inputGroupAddon *ngIf="suffix">{{ suffix }}</p-inputGroupAddon>
    </p-inputGroup>
  </div>
</div>
<app-control-messages [onerror]="submitted || (startControl.touched && startControl.invalid)"
  [control]="startControl"></app-control-messages>
