<div class="datetime-range">
    <label [for]="endControl">{{ label }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <div class="datetime-inputs">
        <div class="input-group">
            <p-inputNumber [formControl]="startControl" [placeholder]="placeholder" [ngClass]="{'is-invalid': submitted && startControl.errors}"></p-inputNumber>
            <app-control-messages [onerror]="submitted" [control]="startControl"></app-control-messages>
        </div>
        ~
        <div class="input-group">
            <p-inputNumber [formControl]="endControl" [placeholder]="placeholder" [ngClass]="{'is-invalid': submitted && endControl.errors}"></p-inputNumber>
            <app-control-messages [onerror]="submitted" [control]="endControl"></app-control-messages>
        </div>
    </div>
</div>
