<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-number-start">
      <app-input-number [label]="startLabel || ''" [controlName]="startControlName" [control]="startControl"
        [submitted]="submitted" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
        [useGrouping]="useGrouping" [mode]="mode" [suffix]="suffix" [step]="step" [showButtons]="showButtons"
        (changeEvent)="onStartInputChange($event)"></app-input-number>
    </p-inputGroup>
  </div>
  <div class="flex"
    [ngClass]="startLabel ? submitted || (startControl.touched && startControl.invalid) ? 'py-4' : 'pt-4' : submitted || (startControl.touched && startControl.invalid) ? 'pb-3' : ''">
    <span class="align-self-center text-center " [ngClass]="startLabel ? 'pt-1' : ''">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-number-end">
      <app-input-number [label]="endLabel || ''" [controlName]="endControlName" [control]="endControl"
        [submitted]="submitted" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
        [useGrouping]="useGrouping" [mode]="mode" [suffix]="suffix" [step]="step" [showButtons]="showButtons"
        (changeEvent)="onEndInputChange($event)"></app-input-number>
    </p-inputGroup>
  </div>
</div>
