<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-number-start">
      <app-input-number class="w-full" [label]="startLabel || ''" [controlName]="startControlName"
        [control]="startControl" [submitted]="submitted" [minFractionDigits]="minFractionDigits"
        [maxFractionDigits]="maxFractionDigits" [useGrouping]="useGrouping" [mode]="mode" [suffix]="suffix"
        [step]="step" [showButtons]="showButtons" (changeEvent)="onStartInputChange($event)"
        (blurEvent)="onStartBlur($event)"></app-input-number>
    </p-inputGroup>
  </div>
  <div class="flex justify-content-center align-items-center"
    [ngStyle]="{ 'margin-top': startLabel ? '27px' : '7px', 'height': '43px' }">
    <span class="text-center">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-number-end">
      <app-input-number class="w-full" [label]="endLabel || ''" [controlName]="endControlName" [control]="endControl"
        [submitted]="submitted" [minFractionDigits]="minFractionDigits" [maxFractionDigits]="maxFractionDigits"
        [useGrouping]="useGrouping" [mode]="mode" [suffix]="suffix" [step]="step" [showButtons]="showButtons"
        (changeEvent)="onEndInputChange($event)" (blurEvent)="onEndBlur($event)"></app-input-number>
    </p-inputGroup>
  </div>
</div>
