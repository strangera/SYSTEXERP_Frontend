<div class="datetime-range">
    <label [for]="endControl">{{ label }}(起訖)
    <span *ngIf="isRequired" class="required">*</span>
  </label>
    <div class="datetime-buttons">
        <div class="datetime-row">
            <p-button label="去年" severity="secondary" (onClick)="onLastYear()" class="datebutton cyan-900" />
            <p-button label="今年" severity="secondary" (onClick)="onThisYear()" class="datebutton cyan-900" />
            <p-button label="上半年" severity="secondary" (onClick)="onFirstHalf()" class="datebutton indigo-900" />
            <p-button label="下半年" severity="secondary" (onClick)="onSecondHalf()" class="datebutton indigo-900" />
            <p-button label="第1季" severity="secondary" (onClick)="onFirstQuarter()" class="datebutton" />

        </div>
        <div class="datetime-row">
            <p-button label="第2季" severity="secondary" (onClick)="onSecondQuarter()" class="datebutton" />
            <p-button label="第3季" severity="secondary" (onClick)="onThirdQuarter()" class="datebutton" />
            <p-button label="第4季" severity="secondary" (onClick)="onFourthQuarter()" class="datebutton" />
            <p-button label="上上個月" severity="secondary" (onClick)="onMonthBeforeLast()" class="datebutton" />
            <p-button label="上個月" severity="secondary" (onClick)="onLastMonth()" class="datebutton" />
        </div>
        <div class="datetime-row">
            <p-button label="本 月" severity="secondary" (onClick)="onThisMonth()" class="datebutton" />
            <p-button label="上 週" severity="secondary" (onClick)="onLastWeek()" class="datebutton" />
            <p-button label="前 天" severity="secondary" (onClick)="onDayBeforeYesterday()" class="datebutton" />
            <p-button label="昨 天" severity="secondary" (onClick)="onYesterday()" class="datebutton" />
            <p-button label="今 天" severity="secondary" (onClick)="onToday()" class="datebutton" />
        </div>
    </div>
    <div class="datetime-inputs">
        <div class="input-group">
            <p-calendar [formControl]="startControl" [placeholder]="placeholder" dateFormat="yy/mm/dd" [ngClass]="{'is-invalid': submitted && startControl.errors}"></p-calendar>
            <app-control-messages [onerror]="submitted" [control]="startControl"></app-control-messages>
        </div>
        ~
        <div class="input-group">
            <p-calendar [formControl]="endControl" [placeholder]="placeholder" dateFormat="yy/mm/dd" [ngClass]="{'is-invalid': submitted && endControl.errors}"></p-calendar>
            <app-control-messages [onerror]="submitted" [control]="endControl"></app-control-messages>
        </div>
    </div>
</div>
