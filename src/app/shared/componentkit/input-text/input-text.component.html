<label [for]="controlName" class="flex gap-1 mb-[2px]">
  {{ label }}
  <span *ngIf="isRequired && label !== ''" class="required">*</span>
  <ng-content select="header"></ng-content>
</label>

<div class="input-group">
  <input *ngIf="!showStar" class="w-full" title="請輸入" [id]="controlName" type="text" [formControl]="control"
    [placeholder]="control.disabled ? '' : placeholder" [min]="minLength" [maxlength]="maxLength" [ngClass]="{
           'ng-invalid ng-dirty': (submitted && control.errors) || (errorForGroup && control.parent?.errors),
         }" pInputText [attr.aria-label]="label || placeholder" title="{{ label || placeholder }}" />

  <input *ngIf="showStar" class="w-full" type="text" pInputText [(ngModel)]="value" [disabled]="true" />

  <span *ngIf="showCopyButton" tabindex="0" pTooltip="複製" tooltipPosition="top" (click)="copyText(control)"
    (keydown.enter)="copyText(control)" class="copy-button pi pi-copy"></span>

  <app-button *ngIf="showButton" [label]="buttonLabel" (click)="onClick()" [loading]="buttonLoading"
    [styleClass]="'p-2'"></app-button>
</div>

<app-control-messages [onerror]="submitted || (control.touched && control.invalid)" [control]="control"
  [errorForGroup]="errorForGroup"></app-control-messages>
