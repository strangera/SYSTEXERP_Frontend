<label [hidden]="!showLabel || label===''" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
  <ng-content select="header"></ng-content>
</label>
<div class="input-group">
  <input *ngIf="!showStar" class="w-full" title="請輸入" [id]="controlName" type="text" [formControl]="control"
    [placeholder]="control.disabled ? '' : customPlaceholder || placeholder" [min]="minLength" [maxlength]="maxLength"
    [ngClass]="{ 'ng-invalid ng-dirty': (submitted && control.errors) || (this.errorForGroup && this.control.parent?.errors)}"
    pInputText [attr.aria-label]="label || placeholder" title="{{ label || placeholder }}"
    (change)="onInputChange($event)" [pTooltip]="control.disabled ? '' : customPlaceholder || placeholder"
    tooltipPosition="bottom" />
  <input *ngIf="showStar" class="w-full" type="text" pInputText [(ngModel)]="value" [disabled]="true" />
  <span *ngIf="showCopyButton" tabindex="0" pTooltip="複製" tooltipPosition="top" (click)="copyText(control)"
    (keydown.enter)="copyText(control)" class="copy-button pi pi-copy"></span>
  <app-button *ngIf="showButton" [label]="buttonLabel" (click)="onClick()" [loading]="buttonLoading"
    [styleClass]="'p-2'"></app-button>
</div>
<app-control-messages [hidden]="!showErrorMessage" [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control" [errorForGroup]="errorForGroup"></app-control-messages>
