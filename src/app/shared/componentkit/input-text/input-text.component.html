<label [hidden]="!showLabel || !label" [for]="controlName">
  {{ label }}
  <span *ngIf="isRequired" class="text-red-500">*</span>
  <ng-content select="header"></ng-content>
</label>

<div class="input-group">
  <ng-container *ngIf="!showStar; else starredInput">
    <input [class]="inputClasses" [id]="controlName" type="text" [formControl]="control" [style.text-align]="textAlign"
      [readonly]="readonly" [placeholder]="
        alwaysShowPlaceholder || !control.disabled
          ? customPlaceholder || placeholder
          : ''
      " [attr.minlength]="minLength ?? null" [attr.maxlength]="
        autoPadZero ? padLength : weightedMax ? null : maxLength
      " [attr.inputmode]="autoPadZero ? 'numeric' : null" [attr.pattern]="autoPadZero ? '[0-9]*' : null" [ngClass]="{
        'ng-invalid ng-dirty':
          (submitted && control.errors) ||
          (errorForGroup && control.parent?.errors),
      }" pInputText [attr.aria-label]="label || placeholder" [title]="label || placeholder"
      (compositionstart)="onCompositionStart()" (compositionend)="onCompositionEnd($event)" (input)="onInput($event)"
      (blur)="onBlur($event)" (keydown.enter)="$event.preventDefault()" [pKeyFilter]="keyFilter" />
  </ng-container>

  <ng-template #starredInput>
    <input class="w-full" type="text" pInputText [(ngModel)]="value" [disabled]="true" />
  </ng-template>

  <span *ngIf="showCopyButton" tabindex="0" pTooltip="複製" tooltipPosition="top" (click)="copyText(control)"
    (keydown.enter)="copyText(control)" class="copy-button pi pi-copy"></span>

  <app-button *ngIf="showButton" [label]="buttonLabel" (click)="onClick()" [loading]="buttonLoading"
    [styleClass]="'p-2'"></app-button>
</div>

<app-control-messages [hidden]="!showErrorMessage" [onerror]="submitted || (control.touched && control.invalid)"
  [control]="control" [errorForGroup]="errorForGroup"></app-control-messages>
<small *ngIf="helpMsg || showErrorMessage" [id]="controlName">
  {{helpMsg}}
</small>
