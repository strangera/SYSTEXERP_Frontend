<!-- ✅ LABEL 單獨一行 -->
<label class="block font-medium mb-0">
  {{ label }}(起迄)
  <span *ngIf="isRequired" class="required">*</span>
</label>

<!-- ✅ 輸入框區塊，一行內橫向排列 -->
<div class="flex items-end gap-2">
  <!-- 開始輸入框 -->
  <div class="field">
    <p-inputGroup>
      <input
        type="text"
        pInputText
        [formControl]="startControl"
        [placeholder]="startLabel || placeholder"
        [ngClass]="{ 'ng-invalid ng-dirty': submitted && startControl.errors }"
        (input)="onStartInputChange($event)"
        (blur)="onStartBlur($event)"
      />
    </p-inputGroup>
  </div>

  <!-- 分隔符號 -->
  <div class="flex items-center" style="min-height: 2.5rem; padding-top: 4px;">~</div>

  <!-- 結束輸入框 -->
  <div class="field">
    <p-inputGroup>
      <input
        type="text"
        pInputText
        [formControl]="endControl"
        [placeholder]="endLabel || placeholder"
        [ngClass]="{
          'ng-invalid ng-dirty':
            (submitted && endControl.errors) ||
            (errorForGroup && startControl.parent?.errors)
        }"
        (input)="onEndInputChange($event)"
        (blur)="onEndBlur($event)"
      />
    </p-inputGroup>
  </div>
</div>
