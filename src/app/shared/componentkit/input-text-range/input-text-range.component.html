<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <label *ngIf="startLabel" for="input-text-range">{{ startLabel }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <p-inputGroup id="input-text-start">
      <input type="text" pInputText id="input-text-range" [formControl]="startControl" [placeholder]="placeholder"
        [ngClass]="{'ng-dirty ng-invalid': submitted && startControl.errors}"
        (onInputChange)="onStartInputChange($event)" (onBlur)="onStartBlur($event)" />
    </p-inputGroup>
    <app-control-messages [onerror]="submitted || (startControl.touched && startControl.invalid)"
      [control]="startControl"></app-control-messages>
  </div>
  <div class="flex" [ngClass]="startLabel ?'pt-4':''">
    <span class="align-self-center text-center " [ngClass]="startLabel ?'pt-1':''">~</span>
  </div>
  <div class="col pb-0">
    <label *ngIf="endLabel" for="input-text-range">{{ endLabel }}
      <span *ngIf="isRequired2" class="required">*</span>
    </label>
    <p-inputGroup id="input-text-end">
      <input type="text" pInputText id="input-text-range" [formControl]="endControl" [placeholder]="placeholder"
        [ngClass]="{'ng-dirty ng-invalid': submitted && endControl.errors|| (this.errorForGroup && this.startControl.parent?.errors)}"
        (onInputChange)="onEndInputChange($event)" (onBlur)="onEndBlur($event)" />
    </p-inputGroup>
    <app-control-messages [onerror]="submitted || (endControl.touched && endControl.invalid)" [control]="endControl"
      [errorForGroup]='errorForGroup'></app-control-messages>
  </div>
</div>
