<label [hidden]="!showLabel || label===''" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
  <ng-content select="header"></ng-content>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-text-start">
      <app-input-text [label]="startLabel || ''" [controlName]="startControlName" [control]="startControl"
        [submitted]="submitted" (inputChange)="onStartInputChange($event)" />
    </p-inputGroup>
  </div>
  <div class="flex"
    [ngClass]="startLabel ? submitted || (startControl.touched && startControl.invalid) ? 'py-4' : 'pt-4' : submitted || (startControl.touched && startControl.invalid) ? 'pb-3' : ''">
    <span class="align-self-center text-center " [ngClass]="startLabel ? 'pt-1' : ''">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-text-end">
      <app-input-text [label]="endLabel || ''" [controlName]="endControlName" [control]="endControl"
        [submitted]="submitted" (inputChange)="onEndInputChange($event)" />
    </p-inputGroup>
  </div>
</div>
