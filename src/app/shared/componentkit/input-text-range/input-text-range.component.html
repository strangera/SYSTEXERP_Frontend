<div class="flex" style="height: 18px;">
  <label class="col p-0 m-0 pr-2" [hidden]="!showLabel" [for]="startControlName">{{ label === '' ? startLabel : label }}
    <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
  </label>
  <div class="col-fixed py-0">
    <span class="text-center"></span>
  </div>
  <label class="col p-0 m-0" [hidden]="!showLabel || label!==''" [for]="endControlName">{{ endLabel }}
    <span *ngIf="fieldState.isRequired" class="text-red-500">*</span>
  </label>
</div>

<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-text-start">
      <app-input-text class="w-full" [label]="startLabel" [showLabel]="false" [controlName]="startControlName"
        [control]="startControl" [submitted]="submitted" (blurEvent)="onStartInputChange($event)"
        [errorForGroup]="errorForGroup" />
    </p-inputGroup>
  </div>
  <div class="flex flex-column justify-content-center align-items-center pt-3" [ngStyle]="{ 'height': '33.56px' }">
    <span class="text-center" [ngStyle]="{ 'line-height': '2.8' }">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-text-end">
      <app-input-text class="w-full" [label]="startLabel" [showLabel]="false" [controlName]="endControlName"
        [control]="endControl" [submitted]="submitted" (blurEvent)="onEndInputChange($event)" />
    </p-inputGroup>
  </div>
</div>
