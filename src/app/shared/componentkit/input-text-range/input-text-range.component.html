<label [hidden]="!showLabel || label===''" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
  <ng-content select="header"></ng-content>
</label>
<div class="grid p-fluid">
  <div class="col pb-0">
    <p-inputGroup id="input-text-start">
      <app-input-text class="w-full" [label]="startLabel || ''" [controlName]="startControlName"
        [control]="startControl" [submitted]="submitted" (inputChange)="onStartInputChange($event)" />
    </p-inputGroup>
  </div>
  <div class="flex justify-content-center align-items-center"
    [ngStyle]="{ 'margin-top': startLabel ? '27px' : '7px', 'height': '43px' }">
    <span class="text-center">~</span>
  </div>
  <div class="col pb-0">
    <p-inputGroup id="input-text-end">
      <app-input-text class="w-full" [label]="endLabel || ''" [controlName]="endControlName" [control]="endControl"
        [submitted]="submitted" (inputChange)="onEndInputChange($event)" />
    </p-inputGroup>
  </div>
</div>
