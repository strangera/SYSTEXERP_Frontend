<div class="datetime-range">
    <label>{{ label }}
    <span *ngIf="selectedYear && selectedMonthRange">選擇的範圍: {{ selectedYear }} {{ selectedMonthRange.label }}</span>
    <span *ngIf="isRequired" class="required">*</span>
  </label>
    <div class="datetime-inputs">
        <div class="input-group">
            <p-calendar [formControl]="control" view="year" dateFormat="yy" (onSelect)="onYearSelect($event)" [ngClass]="{'is-invalid': submitted && control.errors}"></p-calendar>
        </div>
        <div class="input-group">
            <p-dropdown [options]="monthRanges" [(ngModel)]="selectedMonthRange" placeholder="選擇月份範圍" optionLabel="label"></p-dropdown>
        </div>
    </div>
</div>
