<p-divider align="left" type="solid" *ngIf="title" styleClass="pb-2">
  <span class="text-center text-xl font-bold text-primary">
    {{ title }}
  </span>
</p-divider>
<p-table #dt [value]="data" [columns]="columns" [(selection)]="selectedItems" selectionMode="multiple"
  [dataKey]="dataKey" [rowTrackBy]="trackByRow" [resizableColumns]="true" [reorderableColumns]="true"
  (onColReorder)="onColReorder($event)" (onRowReorder)="onRowReorder($event)"
  styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped" (selectionChange)="onSelectionChange($event)"
  [rowSelectable]="rowSelectableWrapper" [loading]="loading && data.length === 0">
  <ng-template pTemplate="caption">
    <div class="grid align-items-center justify-content-between mx-0">
      <div class="caption-left button-group flex gap-2 py-2">
        <p-button *ngIf="!disabled" (click)="deleteRow(selectedItems)" pTooltip="刪除" tooltipPosition="top" pButton
          icon="pi pi-trash" severity="danger" class="p-button-text" [rounded]="true"
          [disabled]="selectedItems?.length <= 0" />
      </div>
      <div class="flex-grow-1 p-2">
        <ng-content select="header"></ng-content>
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngIf="data.length" class="w-1rem text-center"></th>
      <th [attr.colspan]="data.length === 1 && canInsert ? 2 : 1" class="w-1rem text-center">序號
      </th>
      <th *ngIf="!disabled && data.length && !data[0]._isAutoInsertCandidate" class="w-1rem text-center">
        <p-tableHeaderCheckbox [disabled]="disabled" />
      </th>
      <th *ngFor="let col of columns" pReorderableColumn pResizableColumn class="text-center">
        {{ col.header }}
        <span *ngIf="isRequired(col)" class="required">*</span>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns" let-index="rowIndex">
    <tr [attr.data-key]="rowData[dataKey]" [pSelectableRowIndex]="rowIndex"
      [pSelectableRowDisabled]="!isRowSelectable(rowData) || disabled" [pSelectableRow]="rowData"
      [pReorderableRow]="!rowData._isAutoInsertCandidate ? rowIndex : -1" [ngClass]="{
        'invalid-row': rowData._rowValidationError?.isValid === false && !rowData._isAutoInsertCandidate,
        'insert-row': rowData._isAutoInsertCandidate ,
      }">
      <td>
        <span *ngIf="!rowData._isAutoInsertCandidate && data.length > 1" class="pi pi-bars"
          pReorderableRowHandle></span>
        <span *ngIf="rowData._isAutoInsertCandidate && !disabled" class="pi pi-plus" [ngClass]="{
            'text-blue-500': rowData._isAutoInsertCandidate
          }"></span>
      </td>
      <td class="text-center" [attr.colspan]="rowData._isAutoInsertCandidate ? 2 : 1"
        [pTooltip]="rowData._rowValidationError?.errorMessage ? rowData._rowValidationError.errorMessage : ''"
        tooltipPosition="bottom">
        <span [ngClass]="{
            'pi pi-exclamation-circle': rowData._rowValidationError?.isValid === false && !rowData._isAutoInsertCandidate,
            'text-blue-500': rowData._isAutoInsertCandidate
          }">
          {{ rowData._isAutoInsertCandidate ? (disabled ? '' : '新增資料') :
          rowData._rowValidationError?.isValid === false ? '' : rowIndex + 1 }}
        </span>
      </td>
      <td *ngIf="!disabled && !rowData._isAutoInsertCandidate">
        <p-tableCheckbox class="flex justify-content-center pointer-events-none" [pSelectableRow]="rowData"
          [value]="rowData" [disabled]="!isRowSelectable(rowData) || disabled" />
      </td>
      <td *ngFor="let col of columns" class="text-center" (click)="col.type ? $event.stopPropagation() : null"
        (keydown)="$event.stopPropagation()">
        <ng-container [ngSwitch]="col.type">
          <p-iconField iconPosition="right">
            <input *ngSwitchCase="'input'" pInputText class="min-w-max" [placeholder]="'請輸入' + col.header"
              [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }"
              [disabled]="(col.disabled && col.disabled(rowData[col.field], index, rowData)) || disabled"
              (ngModelChange)="onValueChange(rowData,$event, col, index)"
              [style]="{'width': col.width, 'text-align': col.textAlign,'min-width':'-webkit-fill-available'}"
              [variant]="rowData._isAutoInsertCandidate ? 'filled' : 'outlined'"
              (blur)="onValueChange(rowData,rowData[col.field], col, index)"
              [ngClass]="{'ng-invalid ng-dirty': rowData._validationErrors?.[col.field] }" />
            <p-inputNumber *ngSwitchCase="'inputNumber'" class="min-w-max" mode="decimal"
              [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }"
              [placeholder]="'請輸入' + col.header" [min]="col.min" [max]="col.max"
              [disabled]="(col.disabled && col.disabled(rowData[col.field], index, rowData)) || disabled"
              (onInput)="onValueChange(rowData,$event.value, col, index)" [minlength]="col.minLength"
              [maxlength]="col.maxLength" (onFocus)="col.onFocus?.(rowData, rowData[col.field], col, index)"
              (onBlur)="col.onBlur?.(rowData, rowData[col.field], col, index); onValueChange(rowData,rowData[col.field], col, index)"
              [style]="{'width': col.width, 'text-align': col.textAlign,'min-width':'-webkit-fill-available'}"
              [variant]="rowData._isAutoInsertCandidate ? 'filled' : 'outlined'"
              [ngClass]="{'ng-invalid ng-dirty': rowData._validationErrors?.[col.field] }" />
            <p-dropdown *ngSwitchCase="'dropdown'" class="flex min-w-max" appendTo="body"
              [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }"
              [placeholder]="'請輸入' + col.header" [options]="getOptions(rowData, col)" [optionLabel]="col.optionLabel"
              [optionValue]="col.optionValue"
              [style]="{'width': col.width, 'text-align': col.textAlign,'min-width':'-webkit-fill-available'}"
              [disabled]=" (col.disabled && col.disabled(rowData[col.field], index, rowData)) || disabled"
              [editable]="true" (onChange)="onValueChange(rowData,$event.value, col, index)"
              (onHide)="onValueChange(rowData,rowData[col.field], col, index)" [virtualScroll]="true"
              [virtualScrollItemSize]="40" [showClear]="col.showClear || true"
              [variant]="rowData._isAutoInsertCandidate ? 'filled' : 'outlined'"
              [ngClass]="{'ng-invalid ng-dirty': rowData._validationErrors?.[col.field] }">
              <ng-template let-item pTemplate="item" *ngIf="col.templateLabel">
                <div class="flex align-items-center gap-2">
                  <span>{{ item[col.templateLabel] }}</span>
                </div>
              </ng-template>
            </p-dropdown>
            <p-inputIcon *ngIf="rowData._validationErrors?.[col.field]"
              styleClass="pi pi-exclamation-circle text-red-500" [pTooltip]="rowData._validationErrors?.[col.field]"
              tooltipPosition="bottom" />
          </p-iconField>
        </ng-container>
        <span *ngIf="!col.type">
          {{ col.format ? col.format(rowData[col.field], index, rowData) : rowData[col.field]}}
        </span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="columns.length  + 2">
        <div>
          <div class="flex justify-content-center align-items-center min-h-full p-2 font-bold text-xl">
            查無資料
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
<span *ngIf="tableDataEmpty" class="block w-full text-right text-red-500">至少輸入一筆資料</span>
