<label [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-inputGroup>
    <input hidden [id]="controlName" type="text" [formControl]="control" [(ngModel)]="selectedValueID" [ngClass]="{'is-invalid': submitted && control.errors}" pInputText />
    <input type="text" [(ngModel)]="selectedValueMajor" pInputText disabled/>
    <input type="text" [(ngModel)]="selectedValueMinor" pInputText disabled/>
    <p-button icon="pi pi-search" styleClass="custom-color-button" severity="contrast" (click)="showDialog()" />
</p-inputGroup>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>
<!---->
<p-dialog [header]=label [(visible)]="visible" [modal]="true">
    <p-table #dt1 [scrollable]="true" scrollHeight="500px" (onRowSelect)="onRowSelect($event)" [(selection)]="selectedItem" [value]="data" [globalFilterFields]="filterFields" styleClass="p-datatable-gridlines" selectionMode="single">
        <ng-template pTemplate="caption">
            <div class="flex justify-content-between flex-column sm:flex-row">
                <span class="p-input-icon-left mb-2">
                  <i class="pi pi-search"></i>
                  <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Search Keyword" class="w-full"/>
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let col of getVisibleColumns()">
                    {{col.header}}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr [pSelectableRow]="rowData">
                <td *ngFor="let col of getVisibleColumns()">
                    {{rowData[col.field]}}
                </td>
            </tr>
        </ng-template>
    </p-table>
    <!--<ng-template pTemplate="footer">
        <app-button-action label="取消" icon="pi pi-times" (onClick)="visible = false"></app-button-action>
    </ng-template>-->
</p-dialog>
