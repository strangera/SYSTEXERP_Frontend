<!-- autocomplete.component.html -->
<label [for]="controlName">
  {{ label }}
  <span *ngIf="isRequired" class="text-red-500">*</span>
  <!-- <span *ngIf="selectedOption" class="selected-indicator">✓ 已選擇</span> -->
</label>

<p-autoComplete styleClass="bank-autocomplete" [id]="controlName" [(ngModel)]="selectedOption"
  (ngModelChange)="onModelChange($event)" [suggestions]="filteredOptions" (completeMethod)="onSearch($event)"
  optionLabel="label" [placeholder]="control.disabled ? '' : placeholder" [dropdown]="false"
  [forceSelection]="forceSelection" [showClear]="true" [ngClass]="{ 'ng-dirty ng-invalid': hasError }"
  [disabled]="control.disabled" [minLength]="1">
  <ng-template let-option pTemplate="item">
    <div class="autocomplete-item">
      <div class="bank-info">
        <div class="bank-single-line">
          {{ option.label }}
        </div>
      </div>
    </div>
  </ng-template>
</p-autoComplete>

<div *ngIf="hasError" class="error-messages">
  <small class="p-error" *ngIf="control.hasError('required')">
    此欄位為必填
  </small>
  <!-- 可以根據需要加入更多錯誤訊息 -->
</div>
