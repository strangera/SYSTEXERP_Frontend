<label [for]="control">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<p-calendar [formControl]="control" [placeholder]="placeholder" dateFormat="yy/mm/dd" [showTime]="true" hourFormat="24" [ngClass]="{'is-invalid': submitted && control.errors}"></p-calendar>
<app-control-messages [onerror]="submitted" [control]="control"></app-control-messages>
