<ng-container [ngSwitch]="col.type">
  <div *ngSwitchCase="'input'" class="input-wrapper" [attr.data-suffix]="col.suffix">
    <input pInputText class="w-full min-w-max" [placeholder]="'請輸入' + col.header" [(ngModel)]="rowData[col.field]"
      [ngModelOptions]="{ standalone: true }" [disabled]="disabled" (ngModelChange)="onValueChange($event)"
      (blur)="onBlur()" />
  </div>

  <p-inputNumber *ngSwitchCase="'inputNumber'" class="w-full min-w-max" styleClass="w-full" mode="decimal"
    [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }" [prefix]="col.prefix" [suffix]="col.suffix"
    [placeholder]="'請輸入' + col.header" [disabled]="disabled" (ngModelChange)="onValueChange($event)"
    [minFractionDigits]="col.fractionDigits" [maxFractionDigits]="col.fractionDigits" [useGrouping]="col.useGrouping"
    (onBlur)="onBlur()" />

  <p-autoComplete *ngSwitchCase="'autoComplete'" inputStyleClass="w-full" class="w-full min-w-max" styleClass="w-full"
    appendTo="body" [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }"
    [placeholder]="'請輸入' + col.header" [suggestions]="getOptions()" (onSelect)="onValueChange($event)"
    (completeMethod)="onFilterComplete($event)" [optionLabel]="col.optionLabel" [optionValue]="col.optionValue"
    [disabled]="disabled">
    <ng-template let-item pTemplate="item" *ngIf="col.templateLabel">
      <div class="flex align-items-center gap-2">
        <span>{{ item[col.templateLabel] }}</span>
      </div>
    </ng-template>
  </p-autoComplete>

  <p-dropdown *ngSwitchCase="'dropdown'" styleClass="w-full" [showClear]="col.optionShowClear" appendTo="body"
    [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }" [filter]="col.filter"
    [placeholder]="'請輸入' + col.header" [options]="getOptions()" [optionLabel]="col.optionLabel"
    [optionValue]="col.optionValue" [disabled]="disabled" (onChange)="onValueChange($event.value)"
    [virtualScroll]="true" [virtualScrollItemSize]="40">
    <ng-template let-item pTemplate="item" *ngIf="col.templateLabel">
      <div class="flex align-items-center gap-2">
        <span>{{ item[col.templateLabel] }}</span>
      </div>
    </ng-template>
  </p-dropdown>

  <p-calendar *ngSwitchCase="'date'" class="w-full" styleClass="min-w-max" [showIcon]="true"
    [(ngModel)]="rowData[col.field]" [ngModelOptions]="{ standalone: true }" appendTo="body"
    [placeholder]="'請選擇' + col.header" [dateFormat]="col.dateFormat || 'yy-mm-dd'" [disabled]="disabled"
    (ngModelChange)="onValueChange($event)" />

</ng-container>
