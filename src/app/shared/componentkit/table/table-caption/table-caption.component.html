<div class="grid align-items-center justify-content-between mx-0" *ngIf="showCaption && !rowEditing">
  <div class="caption-left button-group flex gap-2 py-2">
    <p-multiSelect *ngIf="showFilter" [options]="columns" [(ngModel)]="selectedColumns" optionLabel="header"
      dropdownIcon="pi pi-cog" pTooltip="過濾欄位" tooltipPosition="top" (onChange)="onFilterChange($event)" />
    <p-button [icon]="IsPrint ? 'pi pi-file' : 'pi pi-times'" [rounded]="true" *ngIf="showReportMode && data.length > 0"
      (click)="toggleVisibility()" [pTooltip]="IsPrint ? '報表模式' : '關閉報表模式'" tooltipPosition="top" [outlined]="!IsPrint"
      [disabled]="!canPerformAction('50')" />
    <div [@toggleButtons]="!IsPrint ? 'visible' : 'hidden'" [ngClass]="IsPrint ? 'hidden' : 'flex'" class="gap-2">
      <p-button pButton tooltipPosition="top" pTooltip="列印PDF" class="p-button-rounded p-button-text p-button-info"
        icon="fa-regular fa-file-pdf" (click)="exportStatus = 'PDF'; exportDialog = true"
        [disabled]="!canPerformAction('60')" />
      <p-button pButton tooltipPosition="top" pTooltip="匯出Excel" class="p-button-rounded p-button-text p-button-info"
        icon="fa-regular fa-file-lines" (click)="exportStatus = 'Excel'; exportDialog = true"
        [disabled]="!canPerformAction('70')" />
    </div>
    <p-button *ngIf="IsPrint && showInsert && !rowEditing" (click)="insert.emit()" pTooltip="新增" tooltipPosition="top"
      pButton icon="pi pi-plus" severity="success" class="p-button-rounded p-button-text" [disabled]="insertDisabled" />
    <!-- || !canPerformAction('20') -->
    <p-button *ngIf="IsPrint && showDelete && !rowEditing" (click)="delete.emit(selectedItems)"
      [pTooltip]="deletepTooltip" tooltipPosition="top" pButton [icon]="deleteIcon" severity="danger"
      class="p-button-text" [rounded]="true" [disabled]="selectedItems?.length <= 0" />
    <!-- || !canPerformAction('40') -->
  </div>
  <div *ngIf="IsPrint" class="flex-grow-1 p-2">
    <ng-content select="header"></ng-content>
  </div>
  <div *ngIf="IsPrint" class="flex gap-2 py-2">
    <div *ngIf="expansionColumns.length > 0 && IsPrint" class="flex align-items-center">
      <p-button [icon]="expression ? 'pi pi-angle-up' : 'pi pi-angle-down'" (onClick)="toggleExpandCollapse()"
        [label]="expression ? '收合' : '展開'" text />
    </div>
    <div *ngIf="showExcel" class="flex gap-2 align-items-center">
      <p-button *ngIf="showExcelExport" label="匯出excel範本" severity="success" [icon]="
              exportExcelLoading ? 'pi pi-spin pi-spinner' : 'pi pi-file-export'" (click)="onExportExcel()" />
      <p-fileUpload *ngIf="showExcelImport" #fileUpload styleClass="p-button-info" mode="basic"
        chooseIcon="pi pi-file-import" accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        severity="info" (onSelect)="onImportExcel($event)" [auto]="true" chooseLabel="Excel匯入" />
    </div>
    <p-dropdown *ngIf="showPage && IsPrint && data.length > 0" [options]="pages" [ngModel]="selectedPage"
      optionValue="value" (onChange)="pageChange.emit($event.value)" appendTo="body" [virtualScroll]="true"
      [virtualScrollItemSize]="40" [filter]="true" />
  </div>
</div>

<app-table-export [visible]="exportDialog" header="列印選項" (visibleChange)="exportDialog = $event"
  (save)="exportStatus === 'PDF' ? exportPDFDownload($event, selectedColumns, apiUrl): exportExcelDownload($event, selectedColumns, apiUrl)"
  [exportStatus]="exportStatus"></app-table-export>
