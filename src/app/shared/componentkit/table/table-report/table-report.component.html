      <th *ngIf="data.length" class="w-1rem"></th>

  <ng-template pTemplate="body" let-rowIndex="rowIndex" let-rowData let-columns="columns" let-expanded="expanded"
    let-editing="editing" let-ri="rowIndex" let-index="rowIndex">
    <tr #htmlTableRowElement [attr.data-key]="rowData[dataKey]" [pSelectableRow]="rowData" style="height: 58px"
      [pSelectableRowDisabled]="!isRowSelectable(rowData)" [pReorderableRow]="index"
      [ngClass]="{ 'p-disabled-row': !isRowSelectable(rowData) }" [pEditableRow]="rowData" [pSelectableRow]="rowData"
      [pSelectableRowIndex]="rowIndex">
      <!-- <td *ngIf="!showSubTotal && !showTotal && data.length"><span class="pi pi-bars" pReorderableRowHandle></span>
      </td> -->
      <td *ngIf="data.length"><span class="pi pi-bars" pReorderableRowHandle></span>
      </td>
      <td class="text-center">{{ rowIndex + 1 }}</td>
      <td *ngIf="IsPrint &&showCheckBox  &&selectionMode === 'multiple'">
        <p-tableCheckbox class="flex justify-content-center pointer-events-none" [pSelectableRow]="rowData"
          [value]="rowData" [disabled]="!isRowSelectable(rowData)" />
      </td>
      <td *ngFor="let col of columns" class="text-center" style="text-overflow: ellipsis"
        (click)="editing ? $event.stopPropagation() : null" (dblclick)="detailRow(rowData)" [ngClass]="col.style"
        [alignFrozen]="col.alignFrozen ? col.alignFrozen : 'right'" pFrozenColumn [frozen]="IsPrint && col.frozen">
        <ng-container *ngIf="col.type === 'image'">
          <p-image [src]="getImage(rowData[col.field])" alt="Image" width="50" [preview]="true" />
        </ng-container>
        <ng-container *ngIf="col.type === 'button'">
          <p-button *ngIf="IsPrint" label="{{ col.buttonLabel }}" severity="info" (click)="onSelectButton(rowData)"
            [disabled]="col.disabled ? col.disabled(rowData) : false"></p-button>
        </ng-container>
        <span *ngIf="!col.type">
          {{ col.format ? col.format(rowData[col.field]) : rowData[col.field]}}
        </span>
      </td>
      <td [hidden]="!IsPrint || !showManage" [ngClass]="{'flex justify-content-center gap-2': IsPrint && showManage}"
        class="no-wrap icon-button" alignFrozen="right" pFrozenColumn [frozen]="IsPrint" [style.text-align]="'center'">
        <p-button [text]="true" [outlined]="true" pTooltip="編輯" tooltipPosition="top" icon="pi pi-pencil"
          (click)="editRow(rowData)" *ngIf="showEdit" [disabled]="editDisabled(rowData)" />
        <p-button pTooltip="查看" tooltipPosition="top" icon="pi pi-eye" (click)="detailRow(rowData)"
          *ngIf="showDetail" />
        <ng-container *ngIf="addButton.length">
          <div [ngStyle]="{ border: '1px solid var(--surface-border)', 'border-left': '0'}"></div>
          <p-button *ngFor="let btn of addButton" pTooltip="{{ btn.label }}" tooltipPosition="top" [icon]="btn.icon"
            (click)="btn.action(rowData, $event)" [disabled]="btn.disabled ? btn.disabled(rowData) : false"
            [loading]="buttonsLoading" />
        </ng-container>
      </td>
    </tr>
  </ng-template>
