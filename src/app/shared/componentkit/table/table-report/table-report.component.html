<p-table [columns]="columns" [value]="data" [scrollable]="true" scrollHeight="400px" [rows]="100" [virtualScroll]="true"
  [virtualScrollItemSize]="46" [lazy]="true" (onLazyLoad)="loadDataLazy($event)">
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngFor="let col of columns" style="width: 20%;">
        {{col.header}}
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowData let-columns="columns">
    <tr style="height:46px">
      <td *ngFor="let col of columns">
        {{rowData[col.field]}}
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="loadingbody" let-columns="columns">
    <tr style="height:46px">
      <td *ngFor="let col of columns; let even = even">
        <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}" />
      </td>
    </tr>
  </ng-template>
</p-table>
