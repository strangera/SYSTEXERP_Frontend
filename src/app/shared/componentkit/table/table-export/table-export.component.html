<p-dialog [(visible)]="visible" position="center" [header]="header" [modal]="true"
  (visibleChange)="visibleChange.emit($event)" contentStyleClass="pt-2" [style]="{ width: '21rem' }">
  <form [formGroup]="form" (ngSubmit)="saveDialog()">
    <div class="grid m-0">
      <div class="card col-12 flex justify-content-between align-items-center">
        <label for="exportType">是否顯示報表標題</label>
        <p-inputSwitch class="flex" formControlName="print_reportTitle" trueValue="Y" falseValue="N" />
      </div>
      <div class="card col-12 flex justify-content-between align-items-center"
        *ngIf="form.controls.print_reportTitle.value === 'Y'">
        <label for="exportType">是否顯示每頁報表標題</label>
        <p-inputSwitch class="flex" formControlName="print_reportTitle_per_page" trueValue="Y" falseValue="N" />
      </div>
      <div class="card col-12 flex justify-content-between align-items-center">
        <label for="exportType">是否需要分頁</label>
        <p-inputSwitch class="flex" formControlName="print_eject" trueValue="Y" falseValue="N" />
      </div>
      <div class="card col-12 flex justify-content-between align-items-center">
        <label for="exportType">是否顯示欄位名稱</label>
        <p-inputSwitch class="flex" formControlName="print_field_title" trueValue="Y" falseValue="N" />
      </div>
      <div *ngIf="exportStatus === 'PDF'" class="card col-12 flex justify-content-between align-items-center">
        <label for="exportType">是否顯示報表頁尾</label>
        <p-inputSwitch class="flex" formControlName="print_reportFooter" trueValue="Y" falseValue="N" />
      </div>
      <div *ngIf="exportStatus === 'PDF' && form.controls.print_reportFooter.value === 'Y'"
        class="card col-12 flex justify-content-between align-items-center">
        <label for="exportType">是否每頁顯示報表頁尾</label>
        <p-inputSwitch class="flex" formControlName="print_reportFooter_per_page" trueValue="Y" falseValue="N" />
      </div>
      <div class="flex justify-content-end gap-2 w-full">
        <p-button label="取消" [outlined]="true" severity="secondary" (click)="visibleChange.emit(false)" />
        <p-button label="確定" type="submit" (onClick)="visible = false" [disabled]="disable" />
      </div>
    </div>
  </form>
</p-dialog>
