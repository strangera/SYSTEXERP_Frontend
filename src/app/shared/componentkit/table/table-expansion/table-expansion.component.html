<div [@expandAnimation]="isExpanded ? 'expanded' : 'collapsed'" class="transition-all duration-300">
  <p-table class="w-full" [value]="localRowData" [columns]="getFilterColumns(expansionColumns)"
    [sortField]="expansionSortField" [sortOrder]="expansionSortOrder" [scrollHeight]="'300px'">

    <!-- 表頭 -->
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th class="w-1rem">序號</th>
        <th *ngFor="let col of getFilterColumns(expansionColumns)" [pSortableColumn]="col.field" class="text-center">
          {{ col.header }} <p-sortIcon [field]="col.field"></p-sortIcon>
        </th>
      </tr>
    </ng-template>

    <!-- 表身 -->
    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
      <tr>
        <td class="text-center">{{ rowIndex + 1 }}</td>
        <td *ngFor="let col of getFilterColumns(expansionColumns)" class="text-center" [ngClass]="col.style">
          <ng-container *ngIf="col.type === 'chips'">
            <div class="flex flex-wrap gap-2">
              <p-chip *ngFor="let item of rowData[col.field]" [label]="item[col.chipLabel || 'label']"></p-chip>
            </div>
          </ng-container>
          <span *ngIf="rowData[col.field] !== undefined && rowData[col.field] !== null && !col.type">
            {{ col.format ? col.format(rowData[col.field]) : rowData[col.field] }}
          </span>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>
