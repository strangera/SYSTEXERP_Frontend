<tr>
  <td class="text-center font-bold">總計</td>
  <td *ngIf="IsPrint && showCheckBox && !rowEditing && selectionMode === 'multiple'"></td>
  <td *ngIf="expansionDataKey && IsPrint"></td>
  <td *ngFor="let col of columns" class="text-center font-bold pr-2">
    <ng-container *ngIf="col.isTotal">
      {{ col.format ? col.format(getTotal(col.field)) : getTotal(col.field)}}
    </ng-container>
  </td>
  <td *ngIf="!alwaysEdit || (alwaysEdit && rowEditing)" [hidden]="!IsPrint || !showManage"></td>
</tr>
