<label [hidden]="!showLabel" [for]="controlName">{{ label }}
  <span *ngIf="isRequired" class="required">*</span>
</label>

<p-dropdown styleClass="w-full" [id]="controlName" [formControl]="control"
  [placeholder]="control.disabled ? '' : placeholder" [options]="options" [optionLabel]="optionLabel"
  [optionValue]="optionValue" [showClear]="true" [ngClass]="{'ng-dirty ng-invalid': submitted && control.errors}"
  [dropdownIcon]="control.disabled ? 'hidden' : 'pi pi-angle-down'" (onChange)="onDropdownChange($event)"
  dataKey="optionValue" [filter]="true" appendTo="body" (onLazyLoad)="onLazyLoad($event)" [virtualScroll]="true"
  [virtualScrollItemSize]="34" [resetFilterOnHide]="true">
  <ng-template let-options pTemplate="item" *ngIf="templateLabel !== ''">
    <div class="flex align-items-center gap-2">
      <div>{{ options[templateLabel] }}</div>
    </div>
  </ng-template>
</p-dropdown>

<app-control-messages [hidden]="!showErrorMessage" [onerror]="submitted" [control]="control"></app-control-messages>
