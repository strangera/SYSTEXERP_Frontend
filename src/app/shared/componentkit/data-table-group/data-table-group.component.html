<!--調整 sortField="BNK_No" dataKey="BNK_No"-->
<p-table [value]="data" [sortMode]="'multiple'" dataKey="id" class="p-datatable-sm">
    <!--caption-->
    <ng-template pTemplate="caption">
        <div class="grid align-items-center">
            <div class="col" style="flex: 1; display: flex; gap: 10px;">
                <p-multiSelect [options]="columns" [(ngModel)]="selectedColumns" optionLabel="header" (onChange)="toggleColumnVisibility($event)" dropdownIcon="pi pi-cog" class="hide-selected-items" pTooltip="過濾欄位" tooltipPosition="top">
                </p-multiSelect>
                <button type="button" (click)="togglePaginator()" class="custom-button" pTooltip="報表" tooltipPosition="top" pButton><i class="pi pi-file icon"></i></button>
                <button type="button" (click)="togglePrint()" class="custom-button" pTooltip="列印" tooltipPosition="top" pButton [disabled]="IsPaginator"><i class="pi pi-print icon"></i></button>
            </div>
            <div *ngIf="IsPaginator">
                <p-dropdown [options]="pages" [(ngModel)]="selectedPage" optionLabel="label" optionValue="value" (onChange)="goToPage($event.value)" class="col">
                </p-dropdown>
            </div>
        </div>
    </ng-template>
    <!--header-->
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 5rem"></th>
            <th *ngFor="let col of getVisibleColumns()" [pSortableColumn]="col.field">
                {{col.header}}
                <ng-container *ngIf="IsPaginator">
                    <p-sortIcon [field]="col.field"></p-sortIcon>
                </ng-container>
            </th>
            <ng-container *ngIf="IsPaginator">
                <th>管理</th>
            </ng-container>
        </tr>
    </ng-template>
    <!--body-->
    <ng-template pTemplate="body" let-rowData let-expanded="expanded">
        <tr>
            <td>
                <p-button type="button" pRipple [pRowToggler]="rowData" [text]="true" [rounded]="true" [plain]="true" [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />
            </td>
            <td *ngFor="let col of getVisibleColumns()">
                {{rowData[col.field]}}
            </td>
            <ng-container *ngIf="IsPaginator">
                <td class="no-wrap">
                    <button pButton pRipple type="button" pTooltip="{{ 'edit' | translate }}" tooltipPosition="top" icon="pi pi-pencil" (click)="onEdit(rowData)" class="icon-button mr-2"></button>
                    <button pButton pRipple type="button" pTooltip="{{ 'display' | translate }}" tooltipPosition="top" icon="pi pi-eye" (click)="onDetail(rowData)" class="icon-button"></button>
                </td>
            </ng-container>
        </tr>
    </ng-template>
    <!--rowexpansion-->
    <!-- 展開行顯示子項目 -->
    <ng-template pTemplate="rowexpansion" let-rowData>
        <tr>
            <!--調整 colspan-->
            <td [attr.colspan]="columns.length">
                <!--調整 rowData.branches & dataKey="id"-->
                <p-table [value]="rowData.children" dataKey="id">
                    <ng-template pTemplate="header">
                        <tr>
                            <th *ngFor="let col of getVisibleSubColumns()" [pSortableColumn]="col.field">
                                {{ col.header }}
                                <ng-container *ngIf="IsPaginator">
                                    <p-sortIcon [field]="col.field"></p-sortIcon>
                                </ng-container>
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowData>
                        <tr>
                            <td *ngFor="let col of getVisibleSubColumns()">
                                {{ rowData[col.field] }}
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </td>
        </tr>
    </ng-template>
</p-table>
