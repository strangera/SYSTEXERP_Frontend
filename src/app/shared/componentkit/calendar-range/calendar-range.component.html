<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<ng-content select="header"></ng-content>
<div class="grid p-fluid">
  <div class="col pb-0">
    <label *ngIf="startLabel" [for]="startControl">{{ startLabel }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <p-calendar [formControl]="startControl" [placeholder]="startControl.disabled ? '' : placeholder"
      [timeOnly]="timeOnly" [showTime]="showTime" hourFormat="24" [dateFormat]="dateFormat" [view]="view"
      [ngClass]="{'ng-invalid ng-dirty': submitted && startControl.errors}" [showIcon]="!startControl.disabled"
      [iconDisplay]="'input'" [minDate]="minDate" [maxDate]=" startMaxDate ? startMaxDate:endControl.value"
      [appendTo]="'body'">
      <ng-template pTemplate="inputicon" let-clickCallBack="clickCallBack">
        <i *ngIf="timeOnly" class="pi pi-clock pointer-events-none"></i>
        <i *ngIf="!timeOnly" class="pi pi-calendar pointer-events-none"></i>
      </ng-template>
    </p-calendar>
    <app-control-messages [onerror]="submitted || (startControl.touched && startControl.invalid)"
      [control]="startControl">
    </app-control-messages>
  </div>
  <div class="flex" [ngClass]="startLabel ? (startControl.touched && startControl.invalid) ? 'py-4' : 'pt-4':''">
    <span class="align-self-center text-center " [ngClass]="startLabel ?'pt-1':''">~</span>
  </div>
  <div class="col pb-0">
    <label *ngIf="endLabel" [for]="endControl">{{ endLabel }}
      <span *ngIf="isRequired" class="required">*</span>
    </label>
    <p-calendar [formControl]="endControl" [placeholder]="endControl.disabled ? '' : placeholder2" [timeOnly]="timeOnly"
      [showTime]="showTime" hourFormat="24" [dateFormat]="dateFormat" [view]="view" [iconDisplay]="'input'"
      [ngClass]="{'ng-invalid ng-dirty': submitted && endControl.errors}" [showIcon]="!endControl.disabled"
      [minDate]="endMinDate ? endMinDate:startControl.value" [maxDate]="maxDate" [appendTo]="'body'">
      <ng-template pTemplate="inputicon" let-clickCallBack="clickCallBack">
        <i *ngIf="timeOnly" class="pi pi-clock pointer-events-none"></i>
        <i *ngIf="!timeOnly" class="pi pi-calendar pointer-events-none"></i>
      </ng-template>
    </p-calendar>
    <app-control-messages [onerror]="submitted || (endControl.touched && endControl.invalid)" [control]="endControl">
    </app-control-messages>
  </div>
</div>
<ng-content select="footer"></ng-content>
