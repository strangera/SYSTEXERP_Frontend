<label *ngIf="label !== ''" for="input-text-range" class="flex gap-1">
  {{ label + '(起迄)' }}
  <span *ngIf="isRequired" class="required">*</span>
</label>
<ng-content select="header"></ng-content>
<div class="grid p-fluid">
  <div class="col pb-0">
    <app-calendar class="w-full" [label]="startLabel || ''" [controlName]="startControlName" [control]="startControl"
      [submitted]="submitted" [calendarType]="calendarOneType" [minDate]="startMinDate"
      [maxDate]="startMaxDate"></app-calendar>
  </div>
  <div class="flex justify-content-center align-items-center"
    [ngStyle]="{ 'margin-top': startLabel ? '27px' : '7px', 'height': '43px' }">
    <span class="text-center">~</span>
  </div>
  <div class="col pb-0">
    <app-calendar class="w-full" [label]="endLabel || ''" [controlName]="endControlName" [control]="endControl"
      [submitted]="submitted" [calendarType]="calendarOneType" [minDate]="endMinDate"
      [maxDate]="endMaxDate"></app-calendar>
  </div>
</div>
<ng-content select="footer"></ng-content>
