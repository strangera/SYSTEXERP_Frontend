<ul class="layout-menu">
  <ng-container *ngFor="let level1 of filteredMenu">
    <li class="layout-root-menuitem">
      <div class="layout-menuitem-root-text">{{level1.label}}</div>
    </li>
    <ul *ngIf="level1.items">
      <ng-container *ngFor="let level2 of level1.items">
        <app-menu-item [item]="level2"></app-menu-item>
      </ng-container>
    </ul>
  </ng-container>
</ul>
