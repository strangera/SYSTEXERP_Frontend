<div #appTopbarDiv class="layout-topbar justify-content-between flex-wrap lg:flex-nowrap">
  <a class="layout-topbar-logo" routerLink="/">
    <img [src]="logo" alt="logo">
    <span class="min-w-max">{{'management-platform-title' | translate}}</span>
  </a>
  <!--手機-->
  <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
    (click)="layoutService.showProfileSidebar()">
    <i class="pi pi-ellipsis-v"></i>
  </button>
  <!--桌機-->
  <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
    <i class="pi pi-align-left"></i>
  </button>
  <div class="topbar-menu flex-grow-1  flex flex-row align-items-center">
    <ng-container *ngFor="let item of topLevelMenuItems">
      <p-button [label]="item.prog_name" [rounded]="true" [text]="true" severity="secondary" class="m-1"
        (click)="onTopMenuItemClick(item)" [styleClass]="activeTopMenuItem === item ? 'active-top-menu-item' : ''">
      </p-button>
    </ng-container>
  </div>

  <div #topbarmenu class="layout-topbar-menu lg:flex lg:flex-column justify-content-center align-items-end"
    [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
    <div
      class="flex flex-row align-items-center font-bold text-primary justify-content-center col-flex gap-2 m-1 text-sm">
      <i class="pi pi-clock text-sm"></i>
      {{ now | date: 'yyyy/MM/dd HH:mm:ss' }}
    </div>
    <div class="flex flex-row align-items-center justify-content-center col-flex">
      <form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm);" class="mx-2">
        <p-iconField iconPosition="right" class="h-full" styleClass="h-full">
          <p-autoComplete formControlName="query_data" [suggestions]="filteredProgs" emptyMessage="查無此快速碼"
            (completeMethod)="filterCountry($event)" optionLabel="label" placeholder="搜尋選單的名稱編號" styleClass="h-2rem"
            inputStyleClass="border-1 border-black-alpha-50 border-round" (keydown.enter)="onSubmit(queryForm)" />
          <p-inputIcon styleClass="pi pi-search" onclick="onSubmit(queryForm);" />
        </p-iconField>
      </form>
      <button type="button" class="p-link layout-topbar-button border-1 w-2rem h-2rem p-2 m-0 justify-content-center"
        pTooltip="我的最愛" (click)="favorite.toggle($event)">
        <i class="pi pi-star"></i>
      </button>
      <p-menu #favorite [model]="favoriteItems" [popup]="true" class="static" styleClass="border-round-xl p-2"
        [style]="{'width': '15rem'}" appendTo="body">
        <ng-template pTemplate="submenuheader" let-item>
          <div
            class="flex flex-row align-items-center justify-content-between font-bold text-lg text-primary hover:text-primary-700 cursor-pointer">
            <span>{{ item.label }}</span>
            <i [ngClass]="item.icon"></i>
          </div>
        </ng-template>
        <ng-template pTemplate="item" let-item>
          <a pRipple class="flex justify-content-between align-items-center p-menuitem-link">
            <span [class]="item.icon"></span>
            <div class="w-full">
              <span class="ml-2">{{ item.label }}</span>
            </div>
          </a>
        </ng-template>
      </p-menu>
      <div class="text-center ml-1 block" [ngStyle]="{'color': 'rgb(146, 60, 60)'}">
        <button type="button" class="layout-topbar-button p-link min-w-max" pTooltip="個人資料"
          (click)="menu.toggle($event)">
          <span class="text-sm text-gray-700 block">{{ data?.user_id }}</span>
          <span class="text-lg font-bold block">{{ data?.user_name }}</span>
          <i class="pi pi-angle-down"></i>
        </button>
        <p-menu #menu [model]="items" [popup]="true" class="static" styleClass="border-round-xl p-2"
          [style]="{'width': '12rem'}" appendTo="body">
          <ng-template pTemplate="submenuheader" let-item>
            <span class="font-bold text-lg text-primary">{{ item.label }}</span>
          </ng-template>
          <ng-template pTemplate="item" let-item>
            <a pRipple class="flex justify-content-between align-items-center p-menuitem-link">
              <span [class]="item.icon"></span>
              <div class="w-full">
                <span class="ml-2">{{ item.label }}</span>
              </div>
            </a>
          </ng-template>
        </p-menu>
      </div>
    </div>
  </div>
</div>
