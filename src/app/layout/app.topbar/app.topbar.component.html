<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <img [src]="logo" alt="logo">
        <span>{{title}}</span>
    </a>
    <!--手機-->
    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
    <i class="pi pi-ellipsis-v"></i>
</button>
    <!--桌機-->
    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
      <i class="pi pi-bars"></i>
  </button>
  <div class="topbar-menu">
    <p-button 
        *ngFor="let item of menuItems" 
        [label]="item.label" 
        [icon]="item.icon" 
        [rounded]="true" 
        [text]="true" 
        severity="secondary" 
        class="m-1"
        (click)="resetMenuList(item.prog_no)">
    </p-button>
</div>

    <div #topbarmenu class="layout-topbar-menu col justify-content-end" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <!---->
        <p-button size="small" icon="pi pi-search" [outlined]="true" severity="secondary" class="m-1" pTooltip="快捷功能" tooltipPosition="top" (click)="showDialog()">
        </p-button>
        <!---->
        <p-button size="small" icon="pi pi-star" [outlined]="true" severity="secondary" class="m-1" pTooltip="我的最愛" tooltipPosition="top" (click)="heart.toggle($event)">
        </p-button>
        <p-overlayPanel #heart [showCloseIcon]="true">
            <ul class="list-none p-0 m-0">
                <li class="mb-2">
                    <div class="flex gap-3 p-3 bg-primary-600">
                        <div class="flex flex-column cursor-pointer"><span class="font-semibold text-white">我的最愛</span></div>
                    </div>
                </li>
                <li class="py-3 px-4 flex gap-2 cursor-pointer">
                    <a><i class="pi pi-home text-lg"></i><span class="font-semibold mx-3">佈告欄</span></a>
                </li>
            </ul>
        </p-overlayPanel>
        <!---->
        <p-button size="small" icon="pi pi-user" [outlined]="true" severity="secondary" class="m-1" pTooltip="個人功能" tooltipPosition="top" (click)="op.toggle($event)">
        </p-button>
        <p-overlayPanel #op [showCloseIcon]="true">
            <ul class="list-none p-0 m-0">
                <li class="mb-2">
                    <div class="flex gap-3 p-3 bg-primary-600">
                        <div class="flex flex-column cursor-pointer"><span class="font-semibold text-white">{{ user }}</span></div>
                    </div>
                </li>
                <!--<li class="py-3 px-4 flex gap-2 cursor-pointer"><a><i class="pi pi-cog pi-star text-lg"></i><span class="font-semibold mx-3">Settings</span></a></li>
  <li class="py-3 px-4 flex gap-2 cursor-pointer"><a><i class="pi pi-file pi-lock text-lg"></i><span class="font-semibold mx-3">Terms of Usage</span></a></li>
  <li class="py-3 px-4 flex gap-2 cursor-pointer"><a><i class="pi pi-compass pi-image text-lg"></i><span class="font-semibold mx-3">Support</span></a></li>-->
                <li class="py-3 px-4 flex gap-2 cursor-pointer"><a><i class="pi pi-power-off pi-image text-lg"></i><span class="font-semibold mx-3" (click)="logout()">Logout</span></a></li>
            </ul>
        </p-overlayPanel>
    </div>
</div>

<!--快速選擇代碼-->
<p-dialog header="快速選擇代碼" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <div class="grid p-fluid">
        <div class="col-12">
            <app-dropdown-item label="功能代碼" controlName="syscode" [options]="syscode" optionLabel="value" optionValue="key">
            </app-dropdown-item>
        </div>
    </div>
    <div class="flex justify-content-end gap-2">
        <p-button label="取消" severity="secondary" (onClick)="visible = false" />
        <p-button label="確認" (onClick)="visible = false" />
    </div>
</p-dialog>
