<div #appTopbarDiv class="layout-topbar justify-content-between flex-wrap lg:flex-nowrap">
  <a class="layout-topbar-logo" routerLink="/account/dashboard" pRipple>
    <img loading="lazy" src="assets/layout/images/logo.webp" alt="logo">
    <span class="min-w-max">{{'management-platform-title' | translate}}</span>
  </a>
  <!--手機-->
  <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
    (click)="layoutService.showProfileSidebar()">
    <i class="pi pi-ellipsis-v"></i>
  </button>
  <!--桌機-->
  <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
    <i class="pi pi-align-left"></i>
  </button>
  <div class="topbar-menu flex-grow-1  flex flex-row align-items-center">
    <ng-container *ngFor="let item of topLevelMenuItems">
      <p-button [label]="item.prog_name" [rounded]="true" [text]="true" severity="secondary" [icon]="item.icon"
        (click)="onTopMenuItemClick(item)" [styleClass]="activeTopMenuItem === item ? 'active-top-menu-item' : ''">
      </p-button>
    </ng-container>
  </div>

  <div #topbarmenu class="layout-topbar-menu lg:flex lg:flex-column justify-content-center align-items-end"
    [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.isProfileSidebarVisible()}">
    <div
      class="flex flex-row align-items-center font-bold text-primary justify-content-center col-flex gap-2 m-1 text-sm">
      <i class="pi pi-clock text-sm"></i>
      {{ now | date: 'yyyy/MM/dd HH:mm:ss' }}
    </div>
    <div class="flex flex-row align-items-center justify-content-center col-flex">
      <form [formGroup]="queryForm" (ngSubmit)="onSubmit(queryForm);" class="mx-2">
        <p-iconField iconPosition="right" class="h-full" styleClass="h-full">
          <p-autoComplete formControlName="query_data" [suggestions]="filteredProgs" emptyMessage="查無此快速碼"
            (completeMethod)="filterProgNo($event)" optionLabel="label" placeholder="搜尋選單的名稱編號" styleClass="h-2rem"
            (keydown.enter)="onSubmit(queryForm)" (onSelect)="onSubmit(queryForm)" />
          <p-inputIcon styleClass="pi pi-search" onclick="onSubmit(queryForm);" />
        </p-iconField>
      </form>
      <button type="button"
        class="favorites p-link layout-topbar-button border-1 w-2rem h-2rem p-2 m-0 justify-content-center align-items-center"
        pTooltip="我的最愛" (click)="initFavorites($event)">
        <i class="pi pi-star-fill text-yellow-400"></i>
      </button>
      <p-overlayPanel #op styleClass="select-none w-30rem p-0">
        <div class="flex flex-column gap-1">
          <div class="flex justify-content-between align-items-center">
            <span class="text-xl font-semibold">我的最愛</span>
            <div *ngIf="Favorites.length">
              <p-button *ngIf="!editingFavorites" icon="pi pi-pencil" (click)="editFavorites()" severity="secondary"
                label="編輯" styleClass="p-button-text p-button-sm" />
              <p-button *ngIf="editingFavorites" icon="pi pi-times" (click)="editFavorites()" severity="secondary"
                label="關閉" styleClass="p-button-text p-button-sm" />
            </div>
          </div>

          <p-table [value]="Favorites" selectionMode="multiple" [(selection)]="selectedFavorites"
            [reorderableColumns]="editingFavorites" (onRowReorder)="onRowReorder()" dataKey="label" [scrollable]="true"
            [scrollHeight]="'25rem'" class="p-datatable-sm">
            <ng-template pTemplate="header">
              <tr>
                <th *ngIf="editingFavorites" class="w-4rem text-center">
                  <p-tableHeaderCheckbox />
                </th>
                <th *ngIf="editingFavorites" class="w-5rem text-center">
                  排序
                </th>
                <th class="text-left">功能名稱</th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
              <tr [pSelectableRow]="item" [pSelectableRowIndex]="rowIndex" [pReorderableRow]="rowIndex">
                <td *ngIf="editingFavorites" class="text-center">
                  <p-tableCheckbox [value]="item" class="pointer-events-none" />
                </td>
                <td *ngIf="editingFavorites" class="text-center">
                  <span class="pi pi-bars" pReorderableRowHandle></span>
                </td>
                <td class="p-2 cursor-pointer" (click)="onFavoriteItemClick(item)">
                  {{ item.label }}
                </td>
              </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="3" class="p-3 text-center">
                  尚未加入任何最愛，<br>請至功能頁加入
                </td>
              </tr>
            </ng-template>
          </p-table>

          <p-button *ngIf="editingFavorites" severity="danger" icon="pi pi-trash" label="刪除所選"
            styleClass="w-full p-button-sm" (click)="deleteSelectedFavorites()"
            [disabled]="!selectedFavorites.length" />
        </div>
      </p-overlayPanel>
      <div class="text-center ml-1 block" [ngStyle]="{'color': 'rgb(146, 60, 60)'}">
        <button type="button" class="layout-topbar-button p-link min-w-max" pTooltip="個人資料"
          (click)="menu.toggle($event)">
          <span class="text-sm block" style="color: var(--text-color-secondary);">{{ data?.user_No }}</span>
          <span class="text-lg font-bold block" style="color: var(--text-color);">{{ data?.user_Name }}</span>
          <i class="pi pi-angle-down" style="color: var(--text-color);"></i>
        </button>
        <p-menu #menu [model]="items" [popup]="true" class="static" styleClass="border-round-xl p-2"
          [style]="{'width': '12rem'}" appendTo="body">
          <ng-template pTemplate="submenuheader" let-item>
            <span class="font-bold text-lg text-primary">{{ item.label }}</span>
          </ng-template>
          <ng-template pTemplate="item" let-item>
            <a pRipple class="flex justify-content-between align-items-center p-menuitem-link">
              <span [class]="item.icon"></span>
              <div class="w-full">
                <span class="ml-2">{{ item.label }}</span>
              </div>
            </a>
          </ng-template>
        </p-menu>
      </div>
    </div>
  </div>
</div>
