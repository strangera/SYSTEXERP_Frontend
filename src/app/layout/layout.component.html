<div class="layout-wrapper" [ngClass]="containerClass()" *ngIf="user">
  <div #appTopbarDiv>
    <app-topbar (topMenuClick)="selectedTopMenuProgNo = $event"></app-topbar>
  </div>
  <div #sidebarContainer class="px-0 pt-0 layout-sidebar w-full sm:w-22rem border-noround sm:border-round-xl">
    <div #scrollContent class="layout-sidebar-scroll-content flex w-full sticky top-0 z-5 pt-3 px-3 pb-2">
      <div class="flex flex-row justify-content-between align-items-center gap-2 w-full lg:flex-row-reverse">
        <button type="button" class="p-link" (click)="onToggleTheme()">
          <i class="pi text-2xl cursor-pointer" [ngClass]="{'pi-sun': !isDarkMode(), 'pi-moon': isDarkMode()}"
            style="color: var(--text-color);"></i>
        </button>
        <button type="button" class="p-link layout-sidebar-close-button lg:hidden"
          (click)="layoutService.onOutsideClick()">
          <i class="pi pi-times text-2xl cursor-pointer" style="color: var(--text-color);"></i>
        </button>
      </div>
    </div>
    <app-menulist [activeTopMenuProgNo]="selectedTopMenuProgNo"></app-menulist>
  </div>
  <div #layoutMainContainer class="layout-main-container mt-0 lg:mt-3">
    <div class="layout-main">
      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="layout-mask" tabindex="0" (click)="layoutService.onOutsideClick()"
    (keydown.enter)="layoutService.onOutsideClick()"></div>
</div>
