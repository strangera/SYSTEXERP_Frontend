<div class="card p-4" *ngIf="initialized">
  <p-panel header="應付帳款明細檢視" class="line-height-3 m-0">
    <form [formGroup]="dataForm">
      <div class="grid p-fluid">
        <div class="col-12 text-xl font-bold border-bottom-1 surface-border mb-3 mt-1">
          應付帳款資料
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="應付ID" [control]="dataForm.controls.ACP_No"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="組織代碼" [options]="Org_IdOptions | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.org_id"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar calendarType="dateMonthOne" label="帳款年月"
            [control]="dataForm.controls.ACP_YYYYMM"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number [useGrouping]="false" label="帳款帳次"
            [control]="dataForm.controls.acp_termno"></app-input-number>
        </div>

        <div class="col-12 text-xl font-bold border-bottom-1 surface-border mb-3 mt-4">
          帳戶資料
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="付款方式" [options]="PayTypeOptions" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.VEN_PayType"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="廠客代號" [options]="VEN_No_Options | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.VEN_No"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="匯款銀行代號" [options]="VEN_BNK_No_ParamOptions | async" optionLabel="label"
            optionValue="value" [control]="dataForm.controls.Full_VEN_BNK_No"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="銀行帳號" [control]="dataForm.controls.VEN_BankAccountNo"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="帳戶名稱" [control]="dataForm.controls.VEN_AccountName"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="統一編號" [control]="dataForm.controls.VEN_Uniform"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="票據禁止背書轉讓" [options]="CTRLYNOptions" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.VEN_CTRLYN"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="票據抬頭" [control]="dataForm.controls.VEN_CheckTitle"></app-input-text>
        </div>

        <div class="col-12 text-xl font-bold border-bottom-1 surface-border mb-3 mt-4">
          帳款資料
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number label="應付金額" [control]="dataForm.controls.ACP_Amt"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number label="沖帳金額" [control]="dataForm.controls.PTA_Amt"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number label="應付帳款餘額" [control]="dataForm.controls.ACP_Balance"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number label="保留款金額" [control]="dataForm.controls.ACP_ReserveAmt"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-number label="退保留款金額" [control]="dataForm.controls.RetReserveAmt"></app-input-number>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar label="預計付款日" [control]="dataForm.controls.ACP_ExpectPayDate"></app-calendar>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-calendar label="立帳日期" [control]="dataForm.controls.ACP_Date"></app-calendar>
        </div>

        <div class="col-12 text-xl font-bold border-bottom-1 surface-border mb-3 mt-4">
          其他
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="會計科目代號" [options]="AccNoOptions | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.AccNo"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="帳款來源單號" [control]="dataForm.controls.ACP_SourceNo"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="摘要" [control]="dataForm.controls.NoteDesc"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="傳票號碼" [control]="dataForm.controls.VouNo"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-input-text label="傳票狀態" [control]="dataForm.controls.Vou_PostFlagName"></app-input-text>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="應付狀態" [control]="dataForm.controls.ACP_Status" [options]="ACP_StatusOptions"
            optionLabel="label" optionValue="value"></app-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-3">
          <app-dropdown label="對象別編號" [options]="SubDetailNoOptions | async" optionLabel="label" optionValue="value"
            [control]="dataForm.controls.SubDetailNo"></app-dropdown>
        </div>
      </div>
    </form>
  </p-panel>
</div>

<div *ngIf="isLoading() && !initialized" class="text-center p-8">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  <div class="mt-2">明細資料加載中...</div>
</div>
