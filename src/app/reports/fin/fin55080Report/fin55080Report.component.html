<div class="card">
  <ng-template #accGroupHeader let-row>
    <span>會計科目：{{ getAccNoLabel(row.AccNo) }}</span>
  </ng-template>
  <app-table-subheader tableKey="FIN55050" dataKey="ID" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showManage]="false" [showDelete]="false" [multiSortMeta]="[]" [totalRecords]="totalRecords" [lazy]="true"
    [loading]="isLoading()" [showSerialNo]="false" [showPaginator]="false" [showReportMode]="false"
    [groupRowsBy]="'AccNo'" [groupRowsByName]="'AccCName'" [showSort]="false" [groupHeaderTemplate]="accGroupHeader">
    <header>
      <div class="flex justify-content-end align-items-center gap-2">
        <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF()"
          [loading]="isPdfExporting()" [disabled]="isLoading() || (data.length || 0) === 0"></p-button>
        <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportXLSX()"
          [loading]="isXlsxExporting()" [disabled]="isLoading() || (data.length || 0) === 0"></p-button>
      </div>
    </header>
  </app-table-subheader>
</div>
