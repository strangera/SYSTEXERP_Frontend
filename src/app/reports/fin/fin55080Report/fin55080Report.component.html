<div class="card">
  <ng-template #accGroupHeader let-row>
    <span class="font-bold text-lg">會計科目：{{ getAccNoLabel(row.AccNo) }}</span>
  </ng-template>

  <app-table-subheader tableKey="FIN55050" dataKey="ID" [data]="data" [columns]="columns" [showCheckBox]="false"
    [showManage]="false" [showDelete]="false" [multiSortMeta]="[]" [totalRecords]="totalRecords" [lazy]="true"
    [loading]="isLoading()" [showSerialNo]="false" [showPaginator]="false" [showReportMode]="false" [showFilter]="false"
    [showPage]="false" [groupRowsBy]="'AccNo'" [groupRowsByName]="'AccCName'" [showSort]="false"
    [groupHeaderTemplate]="accGroupHeader">

    <header>
      <div class="report-title-container mb-4">
        <h2 class="text-center font-bold m-0">{{ brand.companyFullName }}</h2>
        <h3 class="text-center font-bold mt-2">分 類 帳</h3>
      </div>

      <div class="flex justify-content-between align-items-end mb-3">
        <div class="report-info-left flex flex-column gap-1 text-sm font-medium">
          <span>日期：{{ displayDateRange }}</span>
          <span>部門別：{{ displayOrgLabel }}</span>
          <span>會計科目：{{ currentAccNoLabel }}</span>
        </div>

        <div class="flex gap-2">
          <p-button styleClass="p-2" label="匯出 PDF" icon="pi pi-file-pdf" (click)="onExportPDF()"
            [loading]="isPdfExporting()" [disabled]="isLoading() || (data.length || 0) === 0"></p-button>
          <p-button styleClass="p-2" label="匯出 Excel" icon="pi pi-file-excel" (click)="onExportXLSX()"
            [loading]="isXlsxExporting()" [disabled]="isLoading() || (data.length || 0) === 0"></p-button>
        </div>
      </div>
    </header>

  </app-table-subheader>
</div>
