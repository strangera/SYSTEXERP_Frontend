name: Build Angular App (Dual Environment)
on:
  push:
    tags: 
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
    
    # 🔥 更新 environment 檔案中的版本號（使用台灣時間）
    - name: Update version in environment files
      run: |
        echo "=== Updating version number in environment files ==="
        node -e "
        const fs = require('fs');
        
        // 設定台灣時區 (UTC+8)
        const now = new Date();
        const taiwanTime = new Date(now.getTime() + (8 * 60 * 60 * 1000));
        
        const year = taiwanTime.getUTCFullYear();
        const month = String(taiwanTime.getUTCMonth() + 1).padStart(2, '0');
        const day = String(taiwanTime.getUTCDate()).padStart(2, '0');
        const hours = String(taiwanTime.getUTCHours()).padStart(2, '0');
        const minutes = String(taiwanTime.getUTCMinutes()).padStart(2, '0');
        
        // 🔥 從 GitHub tag 中提取今天的發布次數
        let versionNumber = 1; // 預設值
        
        // 檢查是否有 GITHUB_REF (tag 資訊)
        const githubRef = process.env.GITHUB_REF;
        if (githubRef && githubRef.includes('refs/tags/')) {
          const tagName = githubRef.replace('refs/tags/', '');
          console.log('Current tag:', tagName);
          
          // 從 tag 名稱中提取序號 (例如: v1.0.0-20250118.3 -> 3)
          const tagPattern = /v\\d+\\.\\d+\\.\\d+-\\d{8}\\.(\\d+)/;
          const match = tagName.match(tagPattern);
          
          if (match) {
            versionNumber = parseInt(match[1]);
            console.log('Extracted version number from tag:', versionNumber);
          }
        }
        
        const newVersion = \`\${year}/\${month}/\${day}_V\${versionNumber} \${hours}:\${minutes}\`;
        console.log('New version string:', newVersion);
        
        // 更新 environment.prod.ts
        const prodEnvPath = 'src/environments/environment.prod.ts';
        if (fs.existsSync(prodEnvPath)) {
          let prodContent = fs.readFileSync(prodEnvPath, 'utf8');
          const versionRegex = /(version\\s*:\\s*['\\\"])([^'\\\"]*)/;
          prodContent = prodContent.replace(versionRegex, \`\$1\${newVersion}\`);
          fs.writeFileSync(prodEnvPath, prodContent, 'utf8');
          console.log('✅ Updated environment.prod.ts');
        }
        
        // 更新 environment.staging.ts
        const stagingEnvPath = 'src/environments/environment.staging.ts';
        if (fs.existsSync(stagingEnvPath)) {
          let stagingContent = fs.readFileSync(stagingEnvPath, 'utf8');
          const versionRegex = /(version\\s*:\\s*['\\\"])([^'\\\"]*)/;
          stagingContent = stagingContent.replace(versionRegex, \`\$1\${newVersion}\`);
          fs.writeFileSync(stagingEnvPath, stagingContent, 'utf8');
          console.log('✅ Updated environment.staging.ts');
        }
        
        console.log(\`✅ 版本號已更新為: \${newVersion}\`);
        "
      env:
        TZ: Asia/Taipei
    
    - name: Add staging configuration to angular.json
      run: |
        echo "=== Adding staging configuration ==="
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('angular.json', 'utf8'));
        
        // 新增 staging configuration
        config.projects.TSRDERP_Frontend.architect.build.configurations.staging = {
          'fileReplacements': [
            {
              'replace': 'src/environments/environment.ts',
              'with': 'src/environments/environment.staging.ts'
            }
          ],
          'budgets': [
            {
              'type': 'initial',
              'maximumWarning': '2mb',
              'maximumError': '5mb'
            },
            {
              'type': 'anyComponentStyle',
              'maximumWarning': '2mb',
              'maximumError': '5mb'
            }
          ],
          'outputHashing': 'all',
          'aot': true,
          'optimization': true
        };
        
        fs.writeFileSync('angular.json', JSON.stringify(config, null, 2));
        console.log('✅ Staging configuration added');
        "
    
    # 🔥 建置生產環境 + 強制 Service Worker 更新
    - name: Build Production Environment (Force Update)
      run: |
        echo "=== Building Production (無DEV後綴) ==="
        npx ng build --configuration production \
          --base-href /TSRDWEB/ \
          --output-hashing=all
        
        echo "=== 強制更新 index.html（確保 Service Worker 偵測到變更）==="
        
        # 找到 index.html（在 dist 原始目錄）
        INDEX_FILE=$(find dist -name index.html -type f | head -1)
        
        if [ -z "$INDEX_FILE" ]; then
          echo "❌ 找不到 index.html"
          exit 1
        fi
        
        # 產生唯一的建置資訊（台灣時間）
        BUILD_TIME=$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M:%S')
        TAG_NAME=${GITHUB_REF##*/}
        
        # 在 </head> 前插入註解（改變 index.html 內容 → 觸發 SW 更新）
        sed -i "s|</head>|  <!-- Build: $BUILD_TIME | Tag: $TAG_NAME -->\n</head>|" "$INDEX_FILE"
        
        echo "✅ 已注入建置資訊到 index.html"
        echo "   檔案：$INDEX_FILE"
        echo "   時間：$BUILD_TIME"
        echo "   標籤：$TAG_NAME"
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
        TZ: Asia/Taipei
    
    - name: Prepare Production files
      run: |
        if [ -d "dist/tsrderp-frontend" ]; then
          mv dist/tsrderp-frontend dist-production
          echo "✅ Production files ready"
        elif [ -d "dist" ]; then
          mv dist dist-production
          echo "✅ Production files ready (fallback)"
        fi
        
        echo "Production files:"
        find dist-production -type f | head -10
        echo "Total files: $(find dist-production -type f | wc -l)"
    
    # 🔥 建置測試環境 + 強制 Service Worker 更新
    - name: Build Staging Environment (Force Update)
      run: |
        echo "=== Building Staging (有DEV後綴) ==="
        npx ng build --configuration staging \
          --base-href /tsrdwebdev/ \
          --output-hashing=all
        
        echo "=== 強制更新 index.html（確保 Service Worker 偵測到變更）==="
        
        # 找到 index.html
        INDEX_FILE=$(find dist -name index.html -type f | head -1)
        
        if [ -z "$INDEX_FILE" ]; then
          echo "❌ 找不到 index.html"
          exit 1
        fi
        
        # 產生唯一的建置資訊
        BUILD_TIME=$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M:%S')
        TAG_NAME=${GITHUB_REF##*/}
        
        # 注入建置資訊
        sed -i "s|</head>|  <!-- Build: $BUILD_TIME | Tag: $TAG_NAME | STAGING -->\n</head>|" "$INDEX_FILE"
        
        echo "✅ 已注入建置資訊到 index.html (STAGING)"
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
        TZ: Asia/Taipei
    
    - name: Prepare Staging files
      run: |
        if [ -d "dist/tsrderp-frontend" ]; then
          mv dist/tsrderp-frontend dist-staging
          echo "✅ Staging files ready"
        elif [ -d "dist" ]; then
          mv dist dist-staging
          echo "✅ Staging files ready (fallback)"
        fi
        
        echo "Staging files:"
        find dist-staging -type f | head -10
        echo "Total files: $(find dist-staging -type f | wc -l)"
    
    - name: Remove source maps
      run: |
        find dist-production -name "*.map" -delete 2>/dev/null || true
        find dist-staging -name "*.map" -delete 2>/dev/null || true
        echo "Source maps removed"
    
    - name: Get build info
      id: build_info
      run: |
        echo "timestamp=$(TZ=Asia/Taipei date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      env:
        TZ: Asia/Taipei
    
    # 上傳 Production 資料夾（artifact 會自動 zip）
    - name: Upload Production Build
      uses: actions/upload-artifact@v4
      with:
        name: Angular_App_Production_v${{ steps.build_info.outputs.version }}_${{ steps.build_info.outputs.timestamp }}
        path: dist-production/
        retention-days: 1
    
    # 上傳 Staging 資料夾（artifact 會自動 zip）
    - name: Upload Staging Build
      uses: actions/upload-artifact@v4
      with:
        name: Angular_App_Staging_v${{ steps.build_info.outputs.version }}_${{ steps.build_info.outputs.timestamp }}
        path: dist-staging/
        retention-days: 1