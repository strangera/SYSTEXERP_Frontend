name: Build Frontend (Production)
on:
  push:
    branches:
      - prod
      - systex
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        default: 'tsrdweb'
        type: choice
        options:
          - tsrdweb
          - systex

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        ref: ${{ github.event_name == 'push' && github.ref_name || 'dev' }}

    - name: Check for new commits since last build
      id: check
      shell: powershell
      run: |
        $currentSha = git rev-parse HEAD
        $lastSha = "${{ vars.LAST_BUILD_SHA }}"
        $isPush = "${{ github.event_name }}" -eq "push"
        $isManual = "${{ github.event_name }}" -eq "workflow_dispatch"
        if (-not $isPush -and -not $isManual -and $lastSha -eq $currentSha) {
          echo "skip=true" >> $env:GITHUB_OUTPUT
          Write-Host "No new commits since last build, skipping."
        } else {
          echo "skip=false" >> $env:GITHUB_OUTPUT
          echo "sha=$currentSha" >> $env:GITHUB_OUTPUT
          Write-Host "Proceeding. SHA: $currentSha"
        }

    - name: Determine build config
      id: config
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: |
        $branch = "${{ github.ref_name }}"
        $manualTarget = "${{ github.event.inputs.build_target }}"
        if ($branch -eq "systex" -or $manualTarget -eq "systex") {
          $buildScript = "build:systex"
          $releaseBranch = "releases/frontend-systex"
        } elseif ($branch -eq "prod") {
          $buildScript = "build:tsrdweb"
          $releaseBranch = "releases/frontend-prod"
        } else {
          $buildScript = "build:tsrdweb"
          $releaseBranch = "releases/frontend"
        }
        echo "build_script=$buildScript" >> $env:GITHUB_OUTPUT
        echo "release_branch=$releaseBranch" >> $env:GITHUB_OUTPUT
        Write-Host "npm run $buildScript -> $releaseBranch"

    - name: Notify Discord - Build Started
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        $ref = "${{ github.ref_name }}"
        $actor = "${{ github.actor }}"
        $target = "${{ steps.config.outputs.build_script }}"
        $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        $msg = "[Frontend] Build Started | Branch: $ref | Target: $target | Actor: $actor | $runUrl"
        $json = [PSCustomObject]@{ content = $msg } | ConvertTo-Json -Compress
        Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $json

    - name: Generate version
      id: version
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: |
        $date = Get-Date -Format 'yyyyMMdd'
        $version = "${date}.${{ github.run_number }}"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"

    - name: Setup Node.js
      if: steps.check.outputs.skip != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Cache node_modules
      if: steps.check.outputs.skip != 'true'
      uses: actions/cache@v4
      id: cache-node
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.check.outputs.skip != 'true' && steps.cache-node.outputs.cache-hit != 'true'
      run: npm install --legacy-peer-deps

    - name: Build
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: npm run ${{ steps.config.outputs.build_script }}
      env:
        NODE_OPTIONS: "--max_old_space_size=3072"
        TZ: Asia/Taipei

    - name: Prepare files
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: |
        if (Test-Path "dist\tsrderp-frontend") {
          Move-Item "dist\tsrderp-frontend" "dist-out"
        } elseif (Test-Path "dist") {
          Move-Item "dist" "dist-out"
        } else {
          Write-Error "dist folder not found"
          exit 1
        }
        Write-Host "Total files: $((Get-ChildItem -Path 'dist-out' -Recurse -File).Count)"

    - name: Add build-info.json
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: |
        $buildTime = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'Taipei Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
        $sha = "${{ steps.check.outputs.sha }}"
        $version = "${{ steps.version.outputs.version }}"
        $branch = "${{ github.ref_name }}"
        $body = "{""version"":""$version"",""branch"":""$branch"",""buildTime"":""$buildTime"",""commit"":""$sha"",""buildNumber"":${{ github.run_number }}}"
        $body | Out-File -FilePath "dist-out\build-info.json" -Encoding UTF8
        Write-Host "build-info.json created"

    - name: Deploy to release branch
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      run: |
        $remote = "https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git"
        $tempDir = "$env:RUNNER_TEMP\branch-release-fe"
        $distPath = (Resolve-Path "dist-out").Path
        $targetBranch = "${{ steps.config.outputs.release_branch }}"

        Write-Host "Deploying to: $targetBranch"

        if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }

        git clone --branch $targetBranch --depth 1 $remote $tempDir
        if ($LASTEXITCODE -eq 0) {
          Set-Location $tempDir
          git rm -rf . --quiet
        } else {
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          Set-Location $tempDir
          git init
          git remote add origin $remote
          git checkout --orphan $targetBranch
        }

        Copy-Item "$distPath\*" "." -Recurse -Force

        git add -A
        if (git status --porcelain) {
          git commit -m "build: ${{ steps.version.outputs.version }} (${{ steps.check.outputs.sha }})"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin $targetBranch --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }
          Write-Host "Deployed to $targetBranch"
        } else {
          Write-Host "No changes to deploy"
        }

    - name: Save last build SHA
      if: steps.check.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $headers = @{
          Authorization = "Bearer $env:GITHUB_TOKEN"
          Accept = "application/vnd.github+json"
        }
        $body = "{""value"":""${{ steps.check.outputs.sha }}""}"
        Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/variables/LAST_BUILD_SHA" -Method PATCH -Headers $headers -Body $body -ContentType "application/json"
        Write-Host "Saved LAST_BUILD_SHA: ${{ steps.check.outputs.sha }}"

    - name: Build Summary
      if: steps.check.outputs.skip != 'true'
      shell: powershell
      run: |
        Write-Host "Build complete!"
        Write-Host "Version: ${{ steps.version.outputs.version }}"
        Write-Host "Target: ${{ steps.config.outputs.release_branch }}"

    - name: Notify Discord on failure
      if: failure()
      shell: powershell
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        $ref = "${{ github.ref_name }}"
        $sha = "${{ github.sha }}"
        $actor = "${{ github.actor }}"
        $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        $msg = "[Frontend] Build FAILED | Branch: $ref | Commit: $sha | Actor: $actor | $runUrl"
        $json = [PSCustomObject]@{ content = $msg } | ConvertTo-Json -Compress
        Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $json

    - name: Cleanup workspace
      shell: powershell
      if: always()
      run: |
        Remove-Item -Path "$env:GITHUB_WORKSPACE\dist-out" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:GITHUB_WORKSPACE\dist" -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Workspace cleaned"
