name: Build Frontend (Production)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build (Production)
      shell: powershell
      run: npm run build:tsrdweb
      env:
        NODE_OPTIONS: "--max_old_space_size=3072"
        TZ: Asia/Taipei

    - name: Prepare files
      shell: powershell
      run: |
        if (Test-Path "dist\tsrderp-frontend") {
          Move-Item "dist\tsrderp-frontend" "dist-out"
        } elseif (Test-Path "dist") {
          Move-Item "dist" "dist-out"
        } else {
          Write-Error "dist folder not found"
          exit 1
        }
        $count = (Get-ChildItem -Path "dist-out" -Recurse -File).Count
        Write-Host "Total files: $count"

    - name: Resolve version
      id: ver
      shell: powershell
      run: |
        $ver = "${{ github.ref_name }}" -replace '^v', ''
        echo "ver=$ver" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $ver"

    - name: Add build-info.json
      shell: powershell
      run: |
        $buildTime = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'Taipei Standard Time').ToString('yyyy-MM-dd HH:mm:ss')
        $buildInfo = @{
          version   = "${{ steps.ver.outputs.ver }}"
          tag       = "${{ github.ref_name }}"
          buildTime = $buildTime
          commit    = "${{ github.sha }}"
        }
        $buildInfo | ConvertTo-Json -Compress | Out-File -FilePath "dist-out\build-info.json" -Encoding UTF8
        Write-Host "build-info.json created"

    - name: Deploy to releases/production (+ tag)
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      run: |
        $remote = "https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git"
        $tempDir = "$env:RUNNER_TEMP\branch-release-fe"
        $distPath = (Resolve-Path "dist-out").Path

        if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }

        git clone --branch releases/production --depth 1 $remote $tempDir
        if ($LASTEXITCODE -eq 0) {
          Set-Location $tempDir
          git rm -rf . --quiet
        } else {
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          Set-Location $tempDir
          git init
          git remote add origin $remote
          git checkout --orphan releases/production
        }

        Copy-Item "$distPath\*" "." -Recurse -Force

        git add -A
        if (git status --porcelain) {
          git commit -m "build: ${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin releases/production --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }
          Write-Host "Deployed to releases/production"

          $relTag = "rel-fe-${{ steps.ver.outputs.ver }}"
          git tag -f $relTag
          git push origin "refs/tags/$relTag" --force
          Write-Host "Artifact tag: $relTag"
        } else {
          Write-Host "No changes to deploy"
        }

    - name: Cleanup old rel-fe tags (keep 7 days)
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $cutoff = (Get-Date).ToUniversalTime().AddDays(-7).ToString('yyyy-MM-ddTHH:mm:ssZ')
        $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
        $repo = "${{ github.repository }}"
        $page = 1
        do {
          $tags = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/tags?per_page=100&page=$page" -Headers $headers
          foreach ($tag in $tags | Where-Object { $_.name -like 'rel-fe-*' }) {
            $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/commits/$($tag.commit.sha)" -Headers $headers
            if ($commit.author.date -lt $cutoff) {
              Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/refs/tags/$($tag.name)" -Method Delete -Headers $headers
              Write-Host "Deleted tag: $($tag.name)"
            }
          }
          $page++
        } while ($tags.Count -eq 100)

    - name: Build Summary
      shell: powershell
      run: |
        Write-Host "Build complete!"
        Write-Host "Version: ${{ github.ref_name }}"
        Write-Host "Production -> releases/production (tag rel-fe-${{ steps.ver.outputs.ver }})"

    - name: Notify Discord on failure
      if: failure()
      shell: powershell
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        $body = @{
          content = $null
          embeds = @(@{
            title       = "❌ Build 失敗：${{ github.ref_name }}"
            description = "**Commit：** ${{ github.sha }}`n**推送者：** ${{ github.actor }}`n**分支/Tag：** ${{ github.ref_name }}`n`n[查看 Actions 記錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            color       = 15158332
          })
        } | ConvertTo-Json -Depth 5 -Compress
        Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $body

    - name: Cleanup workspace
      shell: powershell
      if: always()
      run: |
        Remove-Item -Path "$env:GITHUB_WORKSPACE\dist-out" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:GITHUB_WORKSPACE\dist" -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Workspace cleaned"