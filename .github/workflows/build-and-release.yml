name: Build and Release Angular App (Dual Environment)
on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        echo "=== Installing dependencies ==="
        npm install --legacy-peer-deps
        echo "=== Install completed ==="
    
    # 建置生產環境
    - name: Build Production Environment
      run: |
        echo "=== Building Production (無DEV後綴) ==="
        ng build --configuration production --base-href /TSRDWEBDEV/
        # 重新命名 dist 資料夾
        if [ -d "dist" ]; then
          mv dist dist-production
          echo "Production build completed"
        fi
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
    
    # 建置測試環境
    - name: Build Staging Environment  
      run: |
        echo "=== Building Staging (有DEV後綴) ==="
        ng build --configuration staging --base-href /tsrdwebdev/
        # 重新命名 dist 資料夾
        if [ -d "dist" ]; then
          mv dist dist-staging
          echo "Staging build completed"
        fi
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
    
    # 檢查建置結果
    - name: Verify builds
      run: |
        echo "=== Checking build results ==="
        for env in production staging; do
          if [ -d "dist-${env}" ]; then
            echo "✅ ${env} build exists"
            echo "Files: $(find dist-${env} -type f | wc -l)"
            echo "Size: $(du -sh dist-${env})"
          else
            echo "❌ ${env} build missing!"
            exit 1
          fi
        done
    
    # 移除 source maps
    - name: Remove source maps
      run: |
        find dist-production -name "*.map" -delete 2>/dev/null || true
        find dist-staging -name "*.map" -delete 2>/dev/null || true
        echo "Source maps removed"
    
    # 打包生產環境
    - name: Package Production
      run: |
        cd dist-production
        zip -r ../Angular_App_Production.zip . -x "*.map"
        cd ..
        echo "✅ Production package created: $(du -sh Angular_App_Production.zip)"
    
    # 打包測試環境
    - name: Package Staging
      run: |
        cd dist-staging  
        zip -r ../Angular_App_Staging.zip . -x "*.map"
        cd ..
        echo "✅ Staging package created: $(du -sh Angular_App_Staging.zip)"
    
    # 取得版本資訊
    - name: Get build info
      id: build_info
      run: |
        echo "timestamp=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
    
    # 建立 Release
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.build_info.outputs.version }}-${{ steps.build_info.outputs.timestamp }}"
        name: "Angular App v${{ steps.build_info.outputs.version }} - ${{ steps.build_info.outputs.timestamp }}"
        body: |
          🚀 **Angular 應用程式雙環境建置**
          
          ## 建置資訊
          - **版本**: v${{ steps.build_info.outputs.version }}
          - **建置時間**: ${{ steps.build_info.outputs.timestamp }}
          - **提交**: ${{ steps.build_info.outputs.short_sha }}
          - **分支**: ${{ github.ref_name }}
          - **建置者**: ${{ github.actor }}
          
          ## 包含檔案
          📦 **Angular_App_Production.zip**
          - 生產環境版本 (無DEV後綴)
          - API: `/TSRD_WEBAPI`
          - Base Href: `/TSRDWEBDEV/`
          
          📦 **Angular_App_Staging.zip** 
          - 測試環境版本 (有DEV後綴)
          - API: `/TSRD_WEBAPIDEV`
          - Base Href: `/tsrdwebdev/`同的 base-href: `/tsrdwebdev/`
        files: |
          ./Angular_App_Production.zip
          ./Angular_App_Staging.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
