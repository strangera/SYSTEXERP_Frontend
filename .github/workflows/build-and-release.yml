name: Build Angular App (Dual Environment)
on:
  push:
    tags: 
      - 'v*'
  # 移除 workflow_dispatch，只保留 tag 觸發

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
    
    # ✨ 修正縮排和正則表達式的版本號更新步驟
    - name: Update version in login component
      run: |
        echo "=== Updating version number ==="
        node -e "
        const fs = require('fs');
        const filePath = 'src/app/pages/base/login/login.component.html';
        
        // 讀取檔案
        let content = fs.readFileSync(filePath, 'utf8');
        
        // 產生新的版本字串
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        // 🔥 從 GitHub tag 中提取今天的發布次數
        let versionNumber = 1; // 預設值
        
        // 檢查是否有 GITHUB_REF (tag 資訊)
        const githubRef = process.env.GITHUB_REF;
        if (githubRef && githubRef.includes('refs/tags/')) {
          const tagName = githubRef.replace('refs/tags/', '');
          console.log('Current tag:', tagName);
          
          // 從 tag 名稱中提取序號 (例如: v1.0.0-20250818.3 -> 3)
          const tagPattern = /v\\d+\\.\\d+\\.\\d+-\\d{8}\\.(\\d+)/;
          const match = tagName.match(tagPattern);
          
          if (match) {
            versionNumber = parseInt(match[1]);
            console.log('Extracted version number from tag:', versionNumber);
          }
        }
        
        const newVersion = \`\${year}/\${month}/\${day}_V\${versionNumber} \${hours}:\${minutes}\`;
        
        // 使用正則表達式替換版本字串
        const versionRegex = /\\d{4}\\/\\d{2}\\/\\d{2}_V\\d+\\s+\\d{2}:\\d{2}/;
        content = content.replace(versionRegex, newVersion);
        
        // 寫回檔案
        fs.writeFileSync(filePath, content, 'utf8');
        
        console.log(\`✅ 版本號已更新為: \${newVersion}\`);
        "
    
    - name: Add staging configuration to angular.json
      run: |
        echo "=== Adding staging configuration ==="
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('angular.json', 'utf8'));
        
        // 新增 staging configuration
        config.projects.TSRDERP_Frontend.architect.build.configurations.staging = {
          'fileReplacements': [
            {
              'replace': 'src/environments/environment.ts',
              'with': 'src/environments/environment.staging.ts'
            }
          ],
          'budgets': [
            {
              'type': 'initial',
              'maximumWarning': '2mb',
              'maximumError': '5mb'
            },
            {
              'type': 'anyComponentStyle',
              'maximumWarning': '2mb',
              'maximumError': '5mb'
            }
          ],
          'outputHashing': 'all',
          'aot': true,
          'optimization': true
        };
        
        fs.writeFileSync('angular.json', JSON.stringify(config, null, 2));
        console.log('✅ Staging configuration added');
        "
    
    # 建置生產環境 (無DEV後綴)
    - name: Build Production Environment
      run: |
        echo "=== Building Production (無DEV後綴) ==="
        npx ng build --configuration production --base-href /TSRDWEB/
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
    
    - name: Prepare Production files
      run: |
        if [ -d "dist/tsrderp-frontend" ]; then
          mv dist/tsrderp-frontend dist-production
          echo "✅ Production files ready"
        elif [ -d "dist" ]; then
          mv dist dist-production
          echo "✅ Production files ready (fallback)"
        fi
        
        echo "Production files:"
        find dist-production -type f | head -10
        echo "Total files: $(find dist-production -type f | wc -l)"
    
    # 建置測試環境 (有DEV後綴)
    - name: Build Staging Environment
      run: |
        echo "=== Building Staging (有DEV後綴) ==="
        npx ng build --configuration staging --base-href /tsrdwebdev/
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
    
    - name: Prepare Staging files
      run: |
        if [ -d "dist/tsrderp-frontend" ]; then
          mv dist/tsrderp-frontend dist-staging
          echo "✅ Staging files ready"
        elif [ -d "dist" ]; then
          mv dist dist-staging
          echo "✅ Staging files ready (fallback)"
        fi
        
        echo "Staging files:"
        find dist-staging -type f | head -10
        echo "Total files: $(find dist-staging -type f | wc -l)"
    
    - name: Remove source maps
      run: |
        find dist-production -name "*.map" -delete 2>/dev/null || true
        find dist-staging -name "*.map" -delete 2>/dev/null || true
        echo "Source maps removed"
    
    - name: Get build info
      id: build_info
      run: |
        echo "timestamp=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    # 上傳 Production 資料夾（artifact 會自動 zip）
    - name: Upload Production Build
      uses: actions/upload-artifact@v4
      with:
        name: Angular_App_Production_v${{ steps.build_info.outputs.version }}_${{ steps.build_info.outputs.timestamp }}
        path: dist-production/
        retention-days: 3
    
    # 上傳 Staging 資料夾（artifact 會自動 zip）
    - name: Upload Staging Build
      uses: actions/upload-artifact@v4
      with:
        name: Angular_App_Staging_v${{ steps.build_info.outputs.version }}_${{ steps.build_info.outputs.timestamp }}
        path: dist-staging/
        retention-days: 3
