name: Build Angular App (Simple & Direct)
on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js (same as local)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies exactly like local
      run: |
        npm install --legacy-peer-deps
        npm list @angular/cli || npm install -g @angular/cli
    
    - name: Debug - Check everything before build
      run: |
        echo "=== Node & npm versions ==="
        node --version
        npm --version
        
        echo "=== Angular CLI version ==="
        npx ng version
        
        echo "=== Project structure ==="
        ls -la
        ls -la src/
        
        echo "=== Environment files ==="
        ls -la src/environments/
        
        echo "=== Angular.json check ==="
        cat angular.json | grep -A 10 -B 5 "production"
    
    - name: Build EXACTLY like your local command
      run: |
        echo "=== Building exactly like local ==="
        npx ng build --configuration production --base-href /tsrdwebdev/
        echo "=== Build command completed ==="
    
    - name: Check what was actually built
      run: |
        echo "=== Checking all possible output locations ==="
        find . -name "dist*" -type d 2>/dev/null || echo "No dist directories found"
        find . -name "browser" -type d 2>/dev/null || echo "No browser directories found"
        find . -type d -name "*tsrderp*" 2>/dev/null || echo "No tsrderp directories found"
        
        echo "=== Current directory contents ==="
        ls -la
        
        echo "=== If dist exists, show contents ==="
        if [ -d "dist" ]; then
          echo "Found dist directory:"
          find dist -type f | head -20
        fi
    
    - name: Create package from whatever we found
      run: |
        echo "=== Creating package from any build output ==="
        
        # Try to find build output in various locations
        if [ -d "dist/tsrderp-frontend" ]; then
          echo "Found dist/tsrderp-frontend"
          cd dist/tsrderp-frontend
          zip -r ../../Angular_App.zip .
          cd ../..
        elif [ -d "dist/browser" ]; then
          echo "Found dist/browser"
          cd dist/browser
          zip -r ../../Angular_App.zip .
          cd ../..
        elif [ -d "dist" ]; then
          echo "Found dist"
          cd dist
          zip -r ../Angular_App.zip .
          cd ..
        else
          echo "No build output found, creating empty zip"
          mkdir temp-empty
          cd temp-empty
          echo "Build failed - no output generated" > BUILD_FAILED.txt
          zip -r ../Angular_App.zip .
          cd ..
        fi
        
        echo "Package created: $(ls -la *.zip)"
    
    - name: Upload build result
      uses: actions/upload-artifact@v4
      with:
        name: Angular_Build_$(date +'%Y-%m-%d_%H-%M-%S')
        path: Angular_App.zip
        retention-days: 30
    
    - name: Show final debug info
      if: always()
      run: |
        echo "=== Final debug information ==="
        echo "Build completed (with or without success)"
        echo "Check the uploaded artifact to see what was generated"
        echo "If BUILD_FAILED.txt is in the zip, the build didn't work"
