name: Build Frontend (Production)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    # 只 build production
    - name: Build (Production)
      run: npm run build:tsrdweb
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"
        TZ: Asia/Taipei

    - name: Prepare files
      run: |
        if [ -d "dist/tsrderp-frontend" ]; then
          mv dist/tsrderp-frontend dist-out
        elif [ -d "dist" ]; then
          mv dist dist-out
        fi
        find dist-out -name "*.map" -delete 2>/dev/null || true
        echo "Total files: $(find dist-out -type f | wc -l)"

    - name: Resolve version
      id: ver
      run: echo "ver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Add build-info.json
      run: |
        printf '{"version":"%s","tag":"%s","buildTime":"%s","commit":"%s"}\n' \
          "${{ steps.ver.outputs.ver }}" \
          "${{ github.ref_name }}" \
          "$(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M:%S')" \
          "${{ github.sha }}" > dist-out/build-info.json

    # 丟進 releases/production，並順手打 rel-fe-<版本> tag（部署端靠這個抓版本）
    - name: Deploy to releases/production (+ tag)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: releases/production
        folder: dist-out
        single-commit: true
        commit-message: "build: ${{ github.ref_name }}"
        tag: rel-fe-${{ steps.ver.outputs.ver }}

    - name: Build Summary
      run: |
        echo "✅ 建置完成！"
        echo "🏷️  版本: ${{ github.ref_name }}"
        echo "📦 Production → releases/production  (tag rel-fe-${{ steps.ver.outputs.ver }})"